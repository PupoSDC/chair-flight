    question: An aircraft is making a visual approach to an aerodrome with a runway
      that is narrower than normal. The runway slopes up from the touchdown area
      until near to the stop end. What illusion(s) could the runway's dimensions
      and slope lead to, when the aircraft is lined up for an approach to this
      aerodrome?
    explanation: ""
    options:
      - id: OCPVL4ZYW
        text: The illusion that the aircraft is too low on the approach with the risk of
          flying at a shallower angle than normal and of landing beyond the
          touchdown area. In addition, the narrow width could cause the pilot to
          misjudge the height above the runway and make a heavy landing.
        correct: false
        why: ""
      - id: OPQC4EAUQ
        text: Initially the illusion that the aircraft is higher on the approach than it
          should be, but because the runway is also sloping up towards the stop
          end, the illusion in the later stages of the approach of the aircraft
          being too low. Overall there is a risk that a steeper approach is made
          followed by a late flare by the pilot.
        correct: false
        why: ""
      - id: OYGOBI85L
        text: The runway slope should NOT influence the pilot's perception, but
          narrowness of the runway could give the illusion of being too low,
          with the risk that the flare is executed later than normal.
        correct: false
        why: ""
      - id: ONWD4DDCV
        text: The illusion that the aircraft is higher on the approach than it should
          be, with the risk of flying a steeper than normal approach and landing
          short of the touchdown area.
        correct: true
        why: ""
