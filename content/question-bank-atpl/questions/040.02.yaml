    question: After checking the flight planning sheets in flight, when the pilot
      looks out again he/she realises that the aircraft is banked 20 degrees to
      the right. The pilot immediately restores level flight, however feels that
      he/she is turning left. What is being described?
    explanation: ""
    options:
      - id: OT9RBLN64
        text: This is a somatogravic illusion, which involves angular accelerations
          lasting for more than 30 seconds, giving the false sensation of being
          in straight and level flight while the aircraft is actually turning.
        correct: false
        why: ""
      - id: OQ6CLDOEQ
        text: This is an illusion caused by a malfunction of the vestibular system that
          usually occurs when visual reference is lost for more than 30 seconds
          and the pilot is NOT trained in reduced visibility.
        correct: false
        why: ""
      - id: OTAYKLFXE
        text: 'This is a vestibular illusion called the "leans", which can occur during
          VFR and IFR flights: it must be counteracted by referring to the
          instruments, since the false sensation of bank may last for quite a
          while.'
        correct: true
        why: ""
      - id: OXPOLBF3N
        text: This is "the leans", a vestibular illusion that does NOT occur during VFR
          flight, because outside visual cues are present, and sight is the most
          important sense to rely on in case of conflicting sensorial
          information.
        correct: false
        why: ""
