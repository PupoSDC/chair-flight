- id: QRNDXRTD
  docId: "022.03"
  relatedQuestions:
    - QKDLKXDN
  externalIds:
    - ATPLQ-227177
  annexes: []
  learningObjectives:
    - 022.03.01.01.05
    - 022.03.02.01.05
  template:
    type: calculation
    question: >-
      Given the deviation table of a direct reading compass:


      To fly: 000 030 060 090 120 150 180 210 240 270 300 330

      Steer: 359 030 061 092 121 150 178 209 242 272 298 331


      The desired true heading is {{th}}°. The variation in the area is
      {{var}}°W. What should be the indication of the direct reading compass (in
      degrees)? Interpolate linearly between the table rows {{h1}}° (steer
      {{s1}}°) and {{h2}}° (steer {{s2}}°) that bracket the magnetic heading.
    variables:
      - id: th
        label: True heading
        unit: °
      - id: var
        label: Westerly variation
        unit: °
      - id: h1
        label: Lower table heading
        unit: °
      - id: s1
        label: Steer for lower heading
        unit: °
      - id: h2
        label: Upper table heading
        unit: °
      - id: s2
        label: Steer for upper heading
        unit: °
    answer:
      formula: s1 + (th + var - h1) * (s2 - s1) / (h2 - h1)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: th + var
      - id: d2
        formula: th - var
      - id: d3
        formula: s1 + (th - h1) * (s2 - s1) / (h2 - h1)
      - id: d4
        formula: 2 * (th + var) - (s1 + (th + var - h1) * (s2 - s1) / (h2 - h1))
    presets:
      - id: p1
        values:
          th: 155
          var: 10
          h1: 150
          s1: 150
          h2: 180
          s2: 178
      - id: p2
        values:
          th: 100
          var: 10
          h1: 90
          s1: 92
          h2: 120
          s2: 121
      - id: p3
        values:
          th: 225
          var: 5
          h1: 210
          s1: 209
          h2: 240
          s2: 242
    explanation: >-
      With westerly variation, magnetic heading = true heading + variation. The
      deviation card then converts the magnetic heading into the compass heading
      to steer; between table rows, interpolate linearly.


      **Solution**


      Magnetic heading = {{f: th + var}} = {{n: th + var}} = {{= th + var}}°


      Compass heading = {{f: s1 + (th + var - h1) * (s2 - s1) / (h2 - h1)}} =
      {{n: s1 + (th + var - h1) * (s2 - s1) / (h2 - h1)}} = **{{answer}}°**


      **Why the other answers are wrong**

      - **{{d1}} °**: gives the magnetic heading and ignores the deviation
      table.

      - **{{d2}} °**: subtracts the westerly variation instead of adding it.

      - **{{d3}} °**: forgets the variation and applies the deviation table to
      the true heading.

      - **{{d4}} °**: applies the deviation with the wrong sign.
