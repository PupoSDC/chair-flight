  template:
    type: calculation
    question: The pilot of an aircraft changes heading to the right, from {{h1}}° to
      {{h2}}°, taking the shortest way, and makes a rate-1 turn (3° per second).
      What is the duration of this manoeuvre, in seconds?
    variables:
      - id: h1
        label: Initial heading
        unit: °
      - id: h2
        label: Final heading
        unit: °
    answer:
      formula: abs(h2 - h1) / 3
      unit: s
      decimals: 0
    distractors:
      - id: d1
        formula: abs(h2 - h1) / 4
      - id: d2
        formula: abs(h2 - h1) / 6
      - id: d3
        formula: abs(h2 - h1) / 2
      - id: d4
        formula: abs(h2 - h1) / 3 + 10
    presets:
      - id: p1
        values:
          h1: 214
          h2: 334
      - id: p2
        values:
          h1: 215
          h2: 335
      - id: p3
        values:
          h1: 100
          h2: 190
    explanation: >-
      A rate-1 turn is a turn at 3° per second, independent of the bank angle
      and TAS needed to achieve it. The duration is the heading change divided
      by the turn rate.


      **Solution**


      Heading change = {{= abs(h2 - h1)}}°


      {{f: abs(h2 - h1) / 3}} = {{n: abs(h2 - h1) / 3}} = **{{answer}} s**


      **Why the other answers are wrong**


      - **{{d1}} s**: assumes a turn rate of 4° per second instead of 3° per
      second.

      - **{{d2}} s**: assumes a turn rate of 6° per second (rate-2 turn).

      - **{{d3}} s**: assumes a turn rate of only 2° per second.

      - **{{d4}} s**: adds an arbitrary 10 s to the correct duration.
