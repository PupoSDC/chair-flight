- id: QHGC8ESUG
  docId: "022.03"
  relatedQuestions:
    - QRBMNPXS
  externalIds:
    - ATPLQ-229337
    - ATPLQ-227232
    - ATPLQ-223377
    - AVEXAM-69533
  annexes: []
  learningObjectives:
    - 022.03.02.01.05
  template:
    type: calculation
    question: >-
      Determine the magnitude of the compass deviation (in degrees; the
      direction E or W follows from the sign of magnetic minus compass heading),
      given:


      - True heading: {{th}}°

      - Magnetic heading: {{mh}}°

      - Compass deviation card: "FOR {{mh}}° STEER {{steer}}°"
    variables:
      - id: th
        label: True heading
        unit: °
      - id: mh
        label: Magnetic heading
        unit: °
      - id: steer
        label: Steer (compass) heading
        unit: °
    answer:
      formula: abs(mh - steer)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * abs(mh - steer)
      - id: d2
        formula: abs(mh - th)
      - id: d3
        formula: abs(th - steer)
      - id: d4
        formula: abs(mh - steer) - abs(mh - th)
    presets:
      - id: p1
        values:
          th: 124
          mh: 120
          steer: 114
      - id: p2
        values:
          th: 114
          mh: 120
          steer: 124
      - id: p3
        values:
          th: 212
          mh: 220
          steer: 214
    explanation: >-
      Deviation is the difference between magnetic heading and compass heading:
      deviation = magnetic - compass (positive = East, negative = West). The
      deviation card tells which compass heading to steer for a given magnetic
      heading. The true heading is not needed.


      **Solution**


      {{f: mh - steer}} = {{n: mh - steer}}, so the deviation is **{{answer}}°**
      (E if positive, W if negative).


      **Why the other answers are wrong**

      - **{{d1}}°**: doubles the deviation.

      - **{{d2}}°**: uses magnetic minus true, which is the variation, not the
      deviation.

      - **{{d3}}°**: uses true heading minus compass heading, which mixes
      variation and deviation.

      - **{{d4}}°**: subtracts the variation from the deviation.
