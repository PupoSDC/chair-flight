- id: QNKYPEGSC
  docId: "022.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-221799
    - AVEXAM-63649
    - ATPLQ-228201
  annexes: []
  learningObjectives:
    - 022.03.01.01.05
    - 022.03.02.01.05
  template:
    type: calculation
    question: An aircraft's compass heading is {{compass}}°. The deviation card
      indicates {{dev}}°W on northerly headings and the variation is {{var}}°W.
      What is the aircraft's true heading?
    variables:
      - id: compass
        label: compass heading
        unit: °
      - id: dev
        label: westerly deviation
        unit: °
      - id: var
        label: westerly variation
        unit: °
    answer:
      formula: compass - dev - var + 360
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: compass + dev + var
      - id: d2
        formula: compass - dev + var
      - id: d3
        formula: compass + dev - var + 360
    presets:
      - id: p1
        values:
          compass: 4
          dev: 1
          var: 5
      - id: p2
        values:
          compass: 2
          dev: 1
          var: 5
      - id: p3
        values:
          compass: 3
          dev: 2
          var: 6
    explanation: >-
      True heading = compass heading + deviation + variation, where west is
      negative and east is positive. Both corrections are westerly here, so both
      are subtracted; the result is brought into the range 0-360° by adding
      360°.


      **Solution**


      {{f: compass - dev - var}} = {{n: compass - dev - var}} -> **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: treats both westerly corrections as easterly and adds them.

      - **{{d2}}°**: subtracts the deviation but adds the variation (wrong sign
      for the variation).

      - **{{d3}}°**: adds the deviation instead of subtracting it (wrong sign
      for the deviation).
- id: QNNNDHVB
  docId: "022.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-227770
    - AVEXAM-63947
    - ATPLQ-227402
  annexes:
    - 022-magnetic-compass-deviation-card-table-with-e-088-steer-and
  learningObjectives:
    - 022.03.02.01.05
  template:
    type: chart-calculation
    question: Refer to figure. The compass heading read from the figure is
      {{compass}}°. What magnetic heading is the aircraft on, if the deviation
      on this heading is {{dev}}°?
    variables:
      - id: compass
        label: compass heading (from figure)
        unit: °
      - id: dev
        label: deviation
        unit: °
    chartInputs:
      - compass
    answer:
      formula: compass + dev
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: compass - dev
      - id: d2
        formula: compass
      - id: d3
        formula: compass + 4
    presets:
      - id: p1
        values:
          compass: 90
          dev: -3
      - id: p2
        values:
          compass: 90
          dev: -2
      - id: p3
        values:
          compass: 120
          dev: 3
    explanation: >-
      A compass is affected by the aircraft's own magnetic fields. The deviation
      is the error caused by them and is added algebraically to the compass
      heading to obtain the magnetic heading (a negative deviation, i.e.
      westerly, lowers the heading).


      **Solution**


      {{f: compass + dev}} = {{n: compass + dev}} = **{{answer}}° (M)**


      **Why the other answers are wrong**


      - **{{d1}}°**: applies the deviation with the wrong sign (subtracts it
      instead of adding it).

      - **{{d2}}°**: ignores the deviation and gives the compass heading.

      - **{{d3}}°**: adds an unrelated deviation of +4° (for a different
      heading) instead of the one given.
