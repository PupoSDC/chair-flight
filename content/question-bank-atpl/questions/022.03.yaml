- id: QBDLXCOL
  docId: "022.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-221298
    - AVEXAM-1113
  annexes: []
  learningObjectives:
    - 022.03.01.01.05
  template:
    type: calculation
    question: |-
      Your position has a magnetic variation of {{variation}}° W.

      - True heading to an object: {{true_hdg}}°

      What is the magnetic heading to that object?
    variables:
      - id: true_hdg
        label: True heading
        unit: °
      - id: variation
        label: Magnetic variation (west)
        unit: °
    answer:
      formula: true_hdg + variation
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: true_hdg - variation
      - id: d2
        formula: true_hdg + 2 * variation
      - id: d3
        formula: true_hdg
    presets:
      - id: p1
        values:
          true_hdg: 95
          variation: 20
      - id: p2
        values:
          true_hdg: 200
          variation: 15
      - id: p3
        values:
          true_hdg: 40
          variation: 10
    explanation: >-
      Magnetic variation is the angle between true north and magnetic north at
      your position. When the variation is west, magnetic north lies west of
      true north, so a magnetic heading is the true heading plus the west
      variation.


      **Solution**


      - Magnetic heading = true heading + west variation

      - {{f: true_hdg + variation}} = {{n: true_hdg + variation}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the variation instead of adding it (sign mistake)

      - **{{d2}}°**: adds the variation twice

      - **{{d3}}°**: forgets the variation and uses the true heading
