- id: QRBMNPXS
  docId: "022.03"
  relatedQuestions:
    - QHGC8ESUG
  externalIds:
    - ATPLQ-227706
    - AVEXAM-17308
  annexes: []
  learningObjectives:
    - 022.03.02.01.05
  template:
    type: calculation
    question: >-
      The wind is calm and you are flying a {{fly}} degree heading.


      Your compass card reads: "FOR {{fly}}° STEER {{steer}}°".


      Calculate the magnitude of the deviation (in degrees; E if magnetic is
      larger than compass heading, otherwise W).
    variables:
      - id: fly
        label: Heading to fly
        unit: °
      - id: steer
        label: Steer (compass) heading
        unit: °
    answer:
      formula: abs(fly - steer)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: "0"
      - id: d2
        formula: abs(fly - steer) * 2
      - id: d3
        formula: abs(fly - steer) + 5
      - id: d4
        formula: abs(fly - steer) * 3
    presets:
      - id: p1
        values:
          fly: 90
          steer: 88
      - id: p2
        values:
          fly: 180
          steer: 183
      - id: p3
        values:
          fly: 270
          steer: 267
    explanation: >-
      The compass card gives the compass heading to steer for a desired magnetic
      heading. Deviation = magnetic heading - compass heading (positive = East,
      negative = West).


      **Solution**


      {{f: fly - steer}} = {{n: fly - steer}}, so the deviation is
      **{{answer}}°**.


      **Why the other answers are wrong**

      - **{{d1}}°**: assumes there is no deviation.

      - **{{d2}}°**: doubles the deviation.

      - **{{d3}}°**: adds an arbitrary 5° to the deviation.

      - **{{d4}}°**: triples the deviation.
