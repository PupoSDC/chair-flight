- id: QKDLKXDN
  docId: "022.03"
  relatedQuestions:
    - QRNDXRTD
  externalIds:
    - ATPLQ-222562
  annexes: []
  learningObjectives:
    - 022.03.01.01.05
    - 022.03.02.01.05
  template:
    type: calculation
    question: >-
      Given the deviation table of a direct reading compass:


      To fly: 000 030 060 090 120 150 180 210 240 270 300 330

      Steer: 359 030 061 092 121 150 178 209 242 272 298 331


      The compass indicates a heading of {{comp}}° and the variation is
      {{var}}°E. The row of the table whose steer value equals the compass
      heading gives the magnetic heading ({{mh}}°, read from the table). What is
      the true heading of the aircraft (in degrees)?
    variables:
      - id: comp
        label: Compass heading
        unit: °
      - id: mh
        label: Magnetic heading from table
        unit: °
      - id: var
        label: Easterly variation
        unit: °
    answer:
      formula: mh + var
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: comp + var
      - id: d2
        formula: mh - var
      - id: d3
        formula: comp - var
      - id: d4
        formula: mh + var + 2 * (comp - mh)
    presets:
      - id: p1
        values:
          comp: 242
          mh: 240
          var: 22
      - id: p2
        values:
          comp: 178
          mh: 180
          var: 10
      - id: p3
        values:
          comp: 61
          mh: 60
          var: 15
    explanation: >-
      The compass heading is converted to magnetic heading with the deviation
      table (the 'To fly' value whose 'Steer' equals the compass reading).
      Easterly variation is then added: true = magnetic + easterly variation.


      **Solution**


      Magnetic heading = {{mh}}°


      {{f: mh + var}} = {{n: mh + var}} = **{{answer}}°**


      **Why the other answers are wrong**

      - **{{d1}} °**: adds the variation to the compass heading, skipping the
      deviation correction.

      - **{{d2}} °**: subtracts the easterly variation instead of adding it.

      - **{{d3}} °**: subtracts the variation from the compass heading.

      - **{{d4}} °**: applies the deviation correction twice.
