- id: Q668C5IPO
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-625018
    - BGS-620114
    - AVEXAM-22720
    - ATPLGS-621302
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      You are flying along an airway which is {{width}} NM wide, so the airway
      boundary is half that width from the centreline.


      The distance to the VOR/DME you are using is {{distance}} NM.


      If you are on the airway boundary, how many dots deviation will the VOR
      needle show if one dot represents {{dot}} degrees?
    variables:
      - id: width
        label: Airway width
        unit: NM
      - id: distance
        label: Distance to the VOR/DME
        unit: NM
      - id: dot
        label: Degrees per dot
        unit: °
    answer:
      formula: width / 2 / distance * 60 / dot
      unit: dots
      decimals: 1
    distractors:
      - id: d1
        formula: width / 2 / distance * 60 * dot
      - id: d2
        formula: width / distance * 60 / dot
      - id: d3
        formula: width / 2 / distance * 60 / (2 * dot)
      - id: d4
        formula: distance / (width / 2) * dot / 60
    presets:
      - id: p1
        values:
          width: 10
          distance: 100
          dot: 2
      - id: p2
        values:
          width: 8
          distance: 150
          dot: 2
      - id: p3
        values:
          width: 12
          distance: 100
          dot: 2
    explanation: >-
      The needle shows the angle between the radial to the station and your
      position. Using the 1:60 rule, at 60 NM one NM off the track is about one
      degree, so the angle off the radial is the offset divided by the distance,
      multiplied by 60. The needle then shows the angle divided by the degrees
      per dot.


      **Solution**


      {{f: width / 2 / distance * 60 / dot}} = {{n: width / 2 / distance * 60 /
      dot}} = **{{answer}} dots**


      **Why the other answers are wrong**


      - **{{d1}} dots**: multiplies by the degrees per dot instead of dividing
      by it.

      - **{{d2}} dots**: uses the full width instead of the distance from the
      centreline.

      - **{{d3}} dots**: divides by twice the degrees per dot, so the reading is
      too small.

      - **{{d4}} dots**: inverts the ratio of distance and offset.
