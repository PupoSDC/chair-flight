  template:
    type: calculation
    question: >-
      You are flying across northern Canada on airway NCA Whiskey, and want to
      cross check the IRS computed position with a bearing from the Churchill
      VOR.


      You are on the {{radial}}° radial.


      The variation at the VOR is {{vor_w}}°W and the variation at the aircraft
      is {{ac_e}}°E.


      What true bearing should be plotted on the chart?
    variables:
      - id: radial
        label: Radial from the VOR
        unit: °M
      - id: vor_w
        label: Variation at the VOR
        unit: °W
      - id: ac_e
        label: Variation at the aircraft
        unit: °E
    answer:
      formula: radial - vor_w
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: radial + vor_w
      - id: d2
        formula: radial + ac_e
      - id: d3
        formula: radial - ac_e
      - id: d4
        formula: radial - vor_w - ac_e
    presets:
      - id: p1
        values:
          radial: 190
          vor_w: 2
          ac_e: 4
      - id: p2
        values:
          radial: 300
          vor_w: 2
          ac_e: 4
      - id: p3
        values:
          radial: 75
          vor_w: 6
          ac_e: 3
    explanation: >-
      A VOR radial is a magnetic bearing from the station. To plot it on a chart
      it must be a true bearing, and the variation at the VOR is used for this.
      An east variation is added to a magnetic bearing and a west variation is
      subtracted. The variation at the aircraft is not used.


      **Solution**


      {{f: radial - vor_w}} = {{n: radial - vor_w}} = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: adds the west variation instead of subtracting it.

      - **{{d2}}°T**: adds the variation at the aircraft instead of using the
      one at the VOR.

      - **{{d3}}°T**: subtracts the east variation at the aircraft.

      - **{{d4}}°T**: subtracts both variations.
