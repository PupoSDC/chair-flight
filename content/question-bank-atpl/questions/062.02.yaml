  template:
    type: calculation
    question: >-
      On which VOR radial is the aircraft? Use the following information.


      - VOR latitude: {{vor_lat}}° (north positive, south negative)

      - VOR longitude: {{vor_lon}}° (east positive, west negative)

      - Aircraft latitude: {{ac_lat}}° (north positive, south negative)

      - Aircraft longitude: {{ac_lon}}° (east positive, west negative)

      - Magnetic variation at the VOR: {{var_vor}}° (east positive, west
      negative)

      - Magnetic variation at the aircraft: {{var_ac}}° (east positive, west
      negative)


      Give the radial in degrees magnetic.
    variables:
      - id: vor_lat
        label: VOR latitude
        unit: °
      - id: vor_lon
        label: VOR longitude
        unit: °
      - id: ac_lat
        label: Aircraft latitude
        unit: °
      - id: ac_lon
        label: Aircraft longitude
        unit: °
      - id: var_vor
        label: Variation at the VOR
        unit: °
      - id: var_ac
        label: Variation at the aircraft
        unit: °
    answer:
      formula: (atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat)
        - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) - var_vor) - 360 *
        floor((atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) *
        sin(ac_lat) - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) -
        var_vor) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat)
          - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) - var_ac) - 360
          * floor((atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) *
          sin(ac_lat) - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) -
          var_ac) / 360)
      - id: d2
        formula: (atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat)
          - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) + var_vor) - 360
          * floor((atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) *
          sin(ac_lat) - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) +
          var_vor) / 360)
      - id: d3
        formula: (atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat)
          - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) + 180 - var_vor)
          - 360 * floor((atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat)
          * sin(ac_lat) - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon)) +
          180 - var_vor) / 360)
      - id: d4
        formula: (atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat)
          - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon))) - 360 *
          floor((atan2(sin(ac_lon - vor_lon) * cos(ac_lat), cos(vor_lat) *
          sin(ac_lat) - sin(vor_lat) * cos(ac_lat) * cos(ac_lon - vor_lon))) /
          360)
    presets:
      - id: p1
        values:
          vor_lat: 58
          vor_lon: -73
          ac_lat: 56
          ac_lon: -73
          var_vor: -32
          var_ac: -28
      - id: p2
        values:
          vor_lat: 36.2
          vor_lon: 98
          ac_lat: 34.25
          ac_lon: 98
          var_vor: 13
          var_ac: -28
      - id: p3
        values:
          vor_lat: 48
          vor_lon: 2
          ac_lat: 51
          ac_lon: 2
          var_vor: 3
          var_ac: 5
    explanation: >-
      A VOR radial is the magnetic direction from the station to the aircraft.
      The first step is the true direction from the VOR to the aircraft, which
      is found from the positions. Radials are referenced to magnetic north at
      the VOR, so the variation at the VOR is then removed to get the magnetic
      radial. The variation at the aircraft is not used.


      **Solution**


      - True direction from the VOR to the aircraft: {{= (atan2(sin(ac_lon -
      vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat) - sin(vor_lat) *
      cos(ac_lat) * cos(ac_lon - vor_lon))) - 360 * floor((atan2(sin(ac_lon -
      vor_lon) * cos(ac_lat), cos(vor_lat) * sin(ac_lat) - sin(vor_lat) *
      cos(ac_lat) * cos(ac_lon - vor_lon))) / 360)}}°

      - Magnetic radial = true direction minus variation at the VOR, between 0°
      and 360° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the variation at the aircraft instead of at the VOR.

      - **{{d2}}°**: applies the variation at the VOR with the wrong sign.

      - **{{d3}}°**: gives the reciprocal radial, which is the track towards the
      VOR.

      - **{{d4}}°**: ignores the variation and gives the true direction.
