- id: QQYXFECG3
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-622528
    - ATPLGS-127356
    - BGS-620971
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      The DME slant range reads {{slant}} NM. The aircraft is {{height}} m above
      the elevation of the DME station.


      What is the horizontal ground distance from the aircraft to the DME
      station, in metres?
    variables:
      - id: slant
        label: DME slant range
        unit: NM
      - id: height
        label: Height above the DME elevation
        unit: m
    answer:
      formula: floor(sqrt((slant * 1852) ^ 2 - height ^ 2))
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: slant * 1852
      - id: d2
        formula: slant * 1852 - height
      - id: d3
        formula: sqrt((slant * 1852) ^ 2 + height ^ 2)
      - id: d4
        formula: slant * 1000
    presets:
      - id: p1
        values:
          slant: 1.5
          height: 1000
      - id: p2
        values:
          slant: 1.2
          height: 800
      - id: p3
        values:
          slant: 2
          height: 1500
    explanation: >-
      The DME measures the slant range, the straight line from the aircraft to
      the station. Together with the height difference it forms a right-angled
      triangle with the slant range as the longest side. The ground distance is
      the other short side, so its square is the square of the slant range minus
      the square of the height. One nautical mile is 1852 m.


      **Solution**


      - Slant range in metres: {{slant}} NM × 1852 = {{= slant * 1852}} m

      - Ground distance: {{f: sqrt((slant * 1852) ^ 2 - height ^ 2)}} = {{n:
      sqrt((slant * 1852) ^ 2 - height ^ 2)}}, rounded down = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: uses the slant range as the ground distance, with no
      height correction.

      - **{{d2}} m**: subtracts the height from the slant range, which does not
      follow the right-angled triangle.

      - **{{d3}} m**: adds the height instead of subtracting it.

      - **{{d4}} m**: converts nautical miles at 1000 m instead of 1852 m.
- id: QR5U8YMMP
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-622616
    - AVEXAM-22243
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      Which VOR radial is the aircraft on? Use the great circle from the VOR to
      the aircraft.


      - Aircraft: latitude {{lat_ac}}°, longitude {{lon_ac}}°, variation
      {{var_ac}}°

      - VOR: latitude {{lat_vor}}°, longitude {{lon_vor}}°, variation
      {{var_vor}}°


      North latitude and east longitude are positive, south and west are
      negative. Variation is east positive and west negative. Give the answer in
      degrees magnetic.
    variables:
      - id: lat_ac
        label: Latitude of the aircraft
        unit: °
      - id: lon_ac
        label: Longitude of the aircraft
        unit: °
      - id: var_ac
        label: Variation at the aircraft
        unit: °
      - id: lat_vor
        label: Latitude of the VOR
        unit: °
      - id: lon_vor
        label: Longitude of the VOR
        unit: °
      - id: var_vor
        label: Variation at the VOR
        unit: °
    answer:
      formula: (atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) * sin(lat_ac)
        - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) - var_vor) - 360 *
        floor((atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) *
        sin(lat_ac) - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) -
        var_vor) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) * sin(lat_ac)
          - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) + var_vor) - 360
          * floor((atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) *
          sin(lat_ac) - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) +
          var_vor) / 360)
      - id: d2
        formula: (270 - var_vor) - 360 * floor((270 - var_vor) / 360)
      - id: d3
        formula: (atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) * sin(lat_ac)
          - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) + 180 - var_vor)
          - 360 * floor((atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor)
          * sin(lat_ac) - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) +
          180 - var_vor) / 360)
      - id: d4
        formula: (270 - var_ac) - 360 * floor((270 - var_ac) / 360)
    presets:
      - id: p1
        values:
          lat_ac: 30
          lon_ac: 5
          var_ac: -10
          lat_vor: 30
          lon_vor: 13
          var_vor: -15
      - id: p2
        values:
          lat_ac: 45
          lon_ac: 20
          var_ac: 5
          lat_vor: 40
          lon_vor: 10
          var_vor: 8
      - id: p3
        values:
          lat_ac: 20
          lon_ac: -30
          var_ac: -4
          lat_vor: 25
          lon_vor: -40
          var_vor: -6
    explanation: >-
      A VOR radial is a magnetic bearing from the VOR. The true bearing of the
      aircraft from the VOR is measured along a great circle, the shortest route
      over the Earth. Because the meridians converge towards the poles, the
      bearing differs from a plain east-west 270° and has to be calculated from
      the latitudes and longitudes. The variation at the VOR then gives the
      magnetic radial. The variation at the aircraft is not needed.


      **Solution**


      - True bearing of the aircraft from the VOR along the great circle: {{=
      (atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) * sin(lat_ac) -
      sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor))) - 360 *
      floor((atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) *
      sin(lat_ac) - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor))) /
      360)}}°

      - Magnetic radial: true bearing − ({{var_vor}})° = {{= (atan2(sin(lon_ac -
      lon_vor) * cos(lat_ac), cos(lat_vor) * sin(lat_ac) - sin(lat_vor) *
      cos(lat_ac) * cos(lon_ac - lon_vor)) - var_vor) - 360 *
      floor((atan2(sin(lon_ac - lon_vor) * cos(lat_ac), cos(lat_vor) *
      sin(lat_ac) - sin(lat_vor) * cos(lat_ac) * cos(lon_ac - lon_vor)) -
      var_vor) / 360)}}°


      The radial is **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the variation at the VOR instead of subtracting it.

      - **{{d2}}°**: uses due west (270°) instead of the great circle bearing.

      - **{{d3}}°**: uses the bearing from the aircraft to the VOR, which is the
      reciprocal.

      - **{{d4}}°**: uses the variation at the aircraft instead of the VOR.
