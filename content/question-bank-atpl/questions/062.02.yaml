  template:
    type: calculation
    question: >-
      On a 3° ILS glide path, every {{gs_change}} kt decrease in groundspeed
      requires a change in rate of descent.


      How large is that change, in ft/min?
    variables:
      - id: gs_change
        label: Groundspeed decrease
        unit: kt
    answer:
      formula: 5 * gs_change
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: 10 * gs_change
      - id: d2
        formula: 3 * gs_change
      - id: d3
        formula: 5 * gs_change / 2
      - id: d4
        formula: gs_change
    presets:
      - id: p1
        values:
          gs_change: 10
      - id: p2
        values:
          gs_change: 20
      - id: p3
        values:
          gs_change: 15
    explanation: >-
      On a 3° glide path the rate of descent is about 5 ft/min for every knot of
      groundspeed. A change in groundspeed therefore changes the rate of descent
      by 5 ft/min for each knot.


      **Solution**


      {{f: 5 * gs_change}} = {{n: 5 * gs_change}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses about 10 ft/min per knot, the figure for a 6°
      glide path.

      - **{{d2}} ft/min**: uses the glide path angle of 3 as the factor.

      - **{{d3}} ft/min**: takes half of the correct change.

      - **{{d4}} ft/min**: uses the change in knots as ft/min, leaving out the
      factor of 5.
