- id: QDJVZCBRH
  docId: "062.02"
  relatedQuestions:
    - QCB0Z8JLF
  externalIds:
    - ATPLQ-626862
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      You are flying in Canada using a VOR to navigate. You are on the
      {{radial}}° radial.


      - Magnetic variation at the VOR: {{var_vor}}° (east positive, west
      negative)

      - Magnetic variation at the aircraft: {{var_ac}}° (east positive, west
      negative)


      What is the true bearing from the VOR to the aircraft?
    variables:
      - id: radial
        label: VOR radial
        unit: °
      - id: var_vor
        label: Variation at the VOR
        unit: °
      - id: var_ac
        label: Variation at the aircraft
        unit: °
    answer:
      formula: (radial + var_vor) - 360 * floor((radial + var_vor) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (radial - var_vor) - 360 * floor((radial - var_vor) / 360)
      - id: d2
        formula: (radial - var_ac) - 360 * floor((radial - var_ac) / 360)
      - id: d3
        formula: (radial + var_ac) - 360 * floor((radial + var_ac) / 360)
      - id: d4
        formula: (radial + var_vor + 180) - 360 * floor((radial + var_vor + 180) / 360)
    presets:
      - id: p1
        values:
          radial: 300
          var_vor: -2
          var_ac: 4
      - id: p2
        values:
          radial: 135
          var_vor: 6
          var_ac: -3
    explanation: >-
      The radial is a magnetic bearing from the VOR. To get the true bearing
      from the VOR, the variation at the VOR is applied, because the radial is
      referenced to magnetic north at the station. East variation is added, west
      variation is subtracted.


      **Solution**


      - True bearing from the VOR = radial + variation at the VOR =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: the variation at the VOR is applied with the wrong sign.

      - **{{d2}}°T**: the variation at the aircraft is applied with the wrong
      sign.

      - **{{d3}}°T**: uses the variation at the aircraft instead of at the VOR.

      - **{{d4}}°T**: takes the track to the VOR (reciprocal) instead of the
      bearing from it.
