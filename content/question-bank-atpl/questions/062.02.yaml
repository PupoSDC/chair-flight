      - id: var_w
        label: Magnetic variation
        unit: °W
    chartInputs:
      - qdr_read
    answer:
      formula: qdr_read - 180
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: qdr_read
      - id: d2
        formula: qdr_read - 180 + var_w
      - id: d3
        formula: qdr_read - 180 - var_w
      - id: d4
        formula: qdr_read - 90
    presets:
      - id: p1
        values:
          qdr_read: 348
          var_w: 7
      - id: p2
        values:
          qdr_read: 250
          var_w: 4
      - id: p3
        values:
          qdr_read: 300
          var_w: 10
    explanation: >-
      The QDM is the magnetic bearing from the aircraft to the NDB. It is the
      reciprocal of the bearing from the NDB to the aircraft (the QDR), so 180°
      is subtracted from the bearing read from the RMI. The RMI bearing is taken
      as magnetic, so the variation is not applied again.


      **Solution**


      {{f: qdr_read - 180}} = {{n: qdr_read - 180}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the bearing from the NDB given instead of the reciprocal.

      - **{{d2}}°**: applies the variation to the reciprocal, which is not
      needed here.

      - **{{d3}}°**: subtracts the variation from the reciprocal, which is not
      needed here.

      - **{{d4}}°**: subtracts 90° from the bearing, a misreading of the RMI.
