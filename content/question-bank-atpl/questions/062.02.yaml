- id: QAGMOFKFI
  docId: "062.02"
  relatedQuestions:
    - Q6I0HBGLM
  externalIds:
    - ATPLQ-621004
    - BGS-621151
    - BGS-621240
    - AVEXAM-44568
    - BGS-621496
    - ATPLGS-628068
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: The aircraft is at a height of {{height}} ft above the DME station and
      {{ground}} NM away from it, measured horizontally. What distance will the
      DME display, in NM?
    variables:
      - id: ground
        label: Horizontal distance
        unit: NM
      - id: height
        label: Height above the DME
        unit: ft
    answer:
      formula: sqrt(ground ^ 2 + (height / 6076) ^ 2)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: ground + height / 6076
      - id: d2
        formula: sqrt(ground ^ 2 - (height / 6076) ^ 2)
      - id: d3
        formula: ground
      - id: d4
        formula: ground ^ 2 + (height / 6076) ^ 2
    presets:
      - id: p1
        values:
          ground: 6
          height: 36000
      - id: p2
        values:
          ground: 5
          height: 18000
      - id: p3
        values:
          ground: 15
          height: 30000
    explanation: >-
      The DME shows the straight-line (slant) distance, which is the longest
      side of a right-angled triangle. The horizontal distance and the height
      above the station are the two shorter sides, so the DME distance is the
      square root of the horizontal distance squared plus the height squared.
      One NM is about 6076 ft.


      **Solution**


      - Height in NM: {{height}} ft ÷ 6076 = {{= height / 6076}} NM.

      - {{f: sqrt(ground ^ 2 + (height / 6076) ^ 2)}} = {{n: sqrt(ground ^ 2 +
      (height / 6076) ^ 2)}}, about **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: adds the height in NM to the horizontal distance, which
      is not how the sides of the triangle combine.

      - **{{d2}} NM**: subtracts the height instead of adding it, which would
      make the DME distance shorter than the horizontal distance.

      - **{{d3}} NM**: uses the horizontal distance and ignores the height.

      - **{{d4}} NM**: forgets the square root.
