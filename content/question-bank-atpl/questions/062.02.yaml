    - "062.02"
  template:
    type: calculation
    question: |-
      An NDB is on a relative bearing of {{rb}}° from an aircraft.

      - Compass heading: {{ch}}°
      - Deviation: {{dev}}° (negative = West)
      - Variation at the aircraft: {{var_ac}}° (negative = West)
      - Variation at the NDB: {{var_st}}° (negative = West)

      Calculate the true bearing of the NDB from the aircraft, in degrees.
    variables:
      - id: rb
        label: Relative bearing of the NDB
        unit: °
      - id: ch
        label: Compass heading
        unit: °
      - id: dev
        label: Deviation
        unit: °
      - id: var_ac
        label: Variation at the aircraft
        unit: °
      - id: var_st
        label: Variation at the NDB
        unit: °
    answer:
      formula: (rb + ch + dev + var_ac) - 360 * floor((rb + ch + dev + var_ac) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (rb + ch + dev - var_ac) - 360 * floor((rb + ch + dev - var_ac) / 360)
      - id: d2
        formula: (rb + ch + dev + var_st) - 360 * floor((rb + ch + dev + var_st) / 360)
      - id: d3
        formula: (rb + ch - dev + var_ac) - 360 * floor((rb + ch - dev + var_ac) / 360)
      - id: d4
        formula: (rb + ch + var_ac) - 360 * floor((rb + ch + var_ac) / 360)
    presets:
      - id: p1
        values:
          rb: 316
          ch: 270
          dev: -2
          var_ac: 30
          var_st: 28
      - id: p2
        values:
          rb: 100
          ch: 200
          dev: -3
          var_ac: 10
          var_st: 5
      - id: p3
        values:
          rb: 40
          ch: 330
          dev: 1
          var_ac: -12
          var_st: -10
    explanation: >-
      The compass does not point to true north. The deviation is applied to the
      compass heading to give the magnetic heading, and the variation at the
      aircraft then gives the true heading. The bearing of the NDB is the true
      heading plus the relative bearing. The variation at the NDB is not used.


      **Solution**


      - Magnetic heading: {{ch}}° + ({{dev}})° = {{= ch + dev}}°

      - True heading: {{= ch + dev}}° + ({{var_ac}})° = {{= ch + dev + var_ac}}°

      - True bearing: {{= ch + dev + var_ac}}° + {{rb}}° = {{= rb + ch + dev +
      var_ac}}°, less 360° if above 360°


      The true bearing is **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the variation at the aircraft instead of adding
      it.

      - **{{d2}}°**: uses the variation at the NDB instead of the aircraft.

      - **{{d3}}°**: reverses the sign of the deviation.

      - **{{d4}}°**: leaves out the deviation.
