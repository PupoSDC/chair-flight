- id: QPCRRPIHM
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-626452
    - ATPLGS-621266
    - AVEXAM-88830
    - BGS-620200
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: chart
    question: >-
      An aircraft at FL300, in ISA conditions and with a ground speed of 300 kt,
      is about to pass overhead a DME station at MSL.


      The DME receiver is capable of determining ground speed.


      One minute before the overhead, DME speed and distance indications are
      respectively:
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: less than 300 kt and 7 NM.
        wrongAnswers:
          - 300 kt and 7 NM.
          - 300 kt and 5 NM.
          - less than 300 kt and 5 NM.
        explanation: >-
          The DME gives the slant distance, the straight line to the station.
          Because the aircraft is high, this is longer than the ground distance.
          One minute before overhead the ground distance is about 5 NM, and the
          height is about 4.9 NM.


          **Solution**


          - Ground distance one minute out: 300 kt ÷ 60 = about 5 NM.

          - Height: 30000 ft ÷ 6076 = about 4.9 NM.

          - Slant distance: square root of (5² + 4.9²), about **7 NM**.

          - DME speed: **less than 300 kt**, because the slant distance changes
          more slowly than the ground speed while the aircraft is not yet
          overhead.


          **Why the other answers are wrong**


          - **300 kt and 7 NM.**: assumes the DME speed equals the ground speed.

          - **300 kt and 5 NM.**: uses the ground distance and ignores the
          height, and assumes the DME speed equals the ground speed.

          - **less than 300 kt and 5 NM.**: ignores the height in the slant
          distance.
