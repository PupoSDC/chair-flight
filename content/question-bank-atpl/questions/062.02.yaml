    - AVEXAM-77591
  annexes: []
  learningObjectives:
    - "062.02"
    - 062.02.04.01.04
  template:
    type: calculation
    question: A DME station is at mean sea level. An aircraft passes vertically
      overhead the station at {{alt}} ft above it. Approximately what distance
      will the DME indicate, in NM?
    variables:
      - id: alt
        label: Height above the DME
        unit: ft
    answer:
      formula: alt / 6076
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: alt / 1000
      - id: d2
        formula: alt / 6076 * 2
      - id: d3
        formula: alt / 6000 + 1
      - id: d4
        formula: alt / 6000 - 1
    presets:
      - id: p1
        values:
          alt: 36000
      - id: p2
        values:
          alt: 12000
      - id: p3
        values:
          alt: 30000
    explanation: >-
      Directly above a DME station the horizontal distance is zero, so the DME
      reads only the height above the station, expressed as a distance. One NM
      is 6076 ft, which is the rule of thumb of about 6000 ft per NM.


      **Solution**


      {{f: alt / 6076}} = {{n: alt / 6076}}, about **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: divides by 1000 instead of about 6000 ft per NM.

      - **{{d2}} NM**: doubles the result, which is a wrong conversion.

      - **{{d3}} NM**: adds 1 NM, but there is no horizontal distance to add
      when the aircraft is overhead.

      - **{{d4}} NM**: subtracts 1 NM, which has no basis in the overhead case.
