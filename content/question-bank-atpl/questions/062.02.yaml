- id: QIBSWWVYK
  docId: "062.02"
  relatedQuestions:
    - QOU4JMJDS
  externalIds:
    - ATPLQ-628259
    - AVEXAM-96312
    - ATPLGS-621207
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      When flying a 3° glide path, an aircraft experiences a reduction in
      groundspeed from {{gs1}} kt at the outer marker to {{gs2}} kt over the
      threshold.


      What approximate decrease in rate of descent does this change in
      groundspeed cause, in ft/min?
    variables:
      - id: gs1
        label: Groundspeed at the outer marker
        unit: kt
      - id: gs2
        label: Groundspeed over the threshold
        unit: kt
    answer:
      formula: (gs1 - gs2) * 5
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (gs1 - gs2) * 10
      - id: d2
        formula: (gs1 - gs2) * 3
      - id: d3
        formula: gs1 - gs2
      - id: d4
        formula: (gs1 + gs2) * 5
    presets:
      - id: p1
        values:
          gs1: 150
          gs2: 120
      - id: p2
        values:
          gs1: 160
          gs2: 100
      - id: p3
        values:
          gs1: 130
          gs2: 115
    explanation: >-
      On a 3° glide path the rate of descent is about 5 ft/min for every knot of
      groundspeed, so a change in groundspeed changes the rate of descent by 5
      ft/min for each knot of change.


      **Solution**


      Change in groundspeed = {{gs1}} kt − {{gs2}} kt = {{= gs1 - gs2}} kt


      {{f: (gs1 - gs2) * 5}} = {{n: (gs1 - gs2) * 5}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses 10 ft/min per knot, the figure for a 6° glide
      path.

      - **{{d2}} ft/min**: uses the glide path angle of 3 as the factor.

      - **{{d3}} ft/min**: gives the change in knots, leaving out the factor.

      - **{{d4}} ft/min**: adds the two groundspeeds instead of taking the
      difference.
