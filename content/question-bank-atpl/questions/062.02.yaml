    - "062.02"
  template:
    type: calculation
    question: Using the 1:60 rule, determine the approximate rate of descent
      required to maintain a {{angle}}° glide path at a groundspeed of {{gs}}
      kts.
    variables:
      - id: gs
        label: Groundspeed
        unit: kt
      - id: angle
        label: Glide path angle
        unit: °
    answer:
      formula: round(gs * angle / 0.6 / 10) * 10
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: round(gs * tan(angle) * 101.27 / 10) * 10
      - id: d2
        formula: round(gs * angle / 10) * 10
      - id: d3
        formula: round(gs / angle * 5 / 10) * 10
      - id: d4
        formula: round(gs * angle * 5 / 10) * 10
    presets:
      - id: p1
        values:
          gs: 120
          angle: 3
      - id: p2
        values:
          gs: 140
          angle: 3.25
      - id: p3
        values:
          gs: 100
          angle: 3.5
    explanation: >-
      The 1:60 rule turns a glide path into a rate of descent. At a groundspeed
      of 60 kt the aircraft covers 1 NM each minute, so a 3° glide path, which
      drops about 300 ft per NM, needs about 300 ft/min. Every knot of
      groundspeed therefore needs about 5 ft/min on a 3° path, and the rate
      grows with the glide angle.


      **Solution**


      Rate of descent = groundspeed × glide angle ÷ 0.6


      {{f: gs * angle / 0.6}} = {{n: gs * angle / 0.6}}, about **{{answer}}
      ft/min** rounded to the nearest 10 ft/min.


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses the exact tangent of the glide angle instead of
      the 1:60 rule that the question asks for.

      - **{{d2}} ft/min**: multiplies groundspeed by the angle only, leaving out
      the scaling of the 1:60 rule.

      - **{{d3}} ft/min**: divides by the glide angle instead of multiplying by
      it.

      - **{{d4}} ft/min**: multiplies by 5 instead of dividing by 0.6, so the
      rate is far too high.
