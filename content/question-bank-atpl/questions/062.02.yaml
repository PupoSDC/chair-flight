    - ATPLGS-100766
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: An aircraft is at a height of {{height}} ft above the DME station. The
      DME reading, uncorrected for altitude, is {{dme}} NM. What is the
      horizontal ground distance to the DME station, in NM?
    variables:
      - id: dme
        label: DME reading (slant range)
        unit: NM
      - id: height
        label: Height above the DME
        unit: ft
    answer:
      formula: sqrt(dme ^ 2 - (height / 6076) ^ 2)
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: dme - height / 6076
      - id: d2
        formula: sqrt(dme ^ 2 + (height / 6076) ^ 2)
      - id: d3
        formula: dme
      - id: d4
        formula: dme ^ 2 - (height / 6076) ^ 2
    presets:
      - id: p1
        values:
          height: 24000
          dme: 8
      - id: p2
        values:
          height: 6000
          dme: 5
      - id: p3
        values:
          height: 12000
          dme: 10
    explanation: >-
      The DME measures the straight-line (slant) distance to the station. When
      the aircraft is above the station, that distance is longer than the ground
      distance. The height, the ground distance and the DME distance form a
      right-angled triangle, so the ground distance is the square root of the
      DME distance squared minus the height squared. One NM is about 6076 ft.


      **Solution**


      - Height in NM: {{height}} ft ÷ 6076 = {{= height / 6076}} NM.

      - {{f: sqrt(dme ^ 2 - (height / 6076) ^ 2)}} = {{n: sqrt(dme ^ 2 - (height
      / 6076) ^ 2)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: subtracts the height from the DME reading, which is not
      how the sides of the triangle combine.

      - **{{d2}} NM**: adds the squared height instead of subtracting it, so the
      ground distance is overstated.

      - **{{d3}} NM**: uses the DME reading as the ground distance without
      correcting for the height.

      - **{{d4}} NM**: squares the values but leaves out the square root.
