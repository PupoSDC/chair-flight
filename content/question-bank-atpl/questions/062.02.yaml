  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: An aircraft has a magnetic heading of {{hdg}}° and is on VOR radial
      {{radial}}°. Which value has to be selected on the OBS to get a TO
      indication with the CDI centred?
    variables:
      - id: hdg
        label: Magnetic heading
        unit: °
      - id: radial
        label: VOR radial (magnetic)
        unit: °
    answer:
      formula: (radial + 180) - 360 * floor((radial + 180) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: radial
      - id: d2
        formula: hdg
      - id: d3
        formula: (hdg + 180) - 360 * floor((hdg + 180) / 360)
      - id: d4
        formula: (radial - hdg) - 360 * floor((radial - hdg) / 360)
    presets:
      - id: p1
        values:
          hdg: 290
          radial: 280
      - id: p2
        values:
          hdg: 60
          radial: 200
      - id: p3
        values:
          hdg: 150
          radial: 45
    explanation: >-
      The radial is the magnetic bearing of the aircraft from the VOR. For a TO
      indication with the needle centred, the OBS has to be set to the course
      towards the VOR, which is the reciprocal of the radial. The magnetic
      heading of the aircraft does not change this setting.


      **Solution**


      {{f: radial + 180}} = {{n: radial + 180}}, less 360° if above 360° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the radial itself, which is the setting for a FROM
      indication.

      - **{{d2}}°**: the magnetic heading, which plays no part here.

      - **{{d3}}°**: the reciprocal of the heading.

      - **{{d4}}°**: subtracts the heading from the radial.
- id: QRD4ZCYAQ
  docId: "062.02"
  relatedQuestions:
    - QXRRKEXPG
  externalIds:
    - ATPLQ-622891
    - BGS-620109
    - AVEXAM-96903
    - ATPLGS-621145
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: |-
      An aircraft is flying on a true track of {{track}}° towards a VOR station.

      - Variation at the VOR: {{var_vor}}° (east positive, west negative)
      - Variation at the aircraft: {{var_ac}}° (east positive, west negative)

      Which VOR radial is the aircraft on, in degrees magnetic?
    variables:
      - id: track
        label: True track towards the VOR
        unit: °
      - id: var_vor
        label: Variation at the VOR
        unit: °
      - id: var_ac
        label: Variation at the aircraft
        unit: °
    answer:
      formula: (track + 180 - var_vor) - 360 * floor((track + 180 - var_vor) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (track - var_vor) - 360 * floor((track - var_vor) / 360)
      - id: d2
        formula: (track + 180 + var_vor) - 360 * floor((track + 180 + var_vor) / 360)
      - id: d3
        formula: (track + 180 - var_ac) - 360 * floor((track + 180 - var_ac) / 360)
      - id: d4
        formula: (track + 180 + var_ac) - 360 * floor((track + 180 + var_ac) / 360)
    presets:
      - id: p1
        values:
          track: 90
          var_vor: 15
          var_ac: 8
      - id: p2
        values:
          track: 300
          var_vor: -6
          var_ac: -2
      - id: p3
        values:
          track: 45
          var_vor: 12
          var_ac: 4
    explanation: >-
      The radial is the magnetic bearing of the aircraft from the VOR. An
      aircraft flying towards the VOR is on the reciprocal of its track as seen
      from the VOR, so the true bearing from the VOR is the track plus 180°. The
      variation at the VOR then gives the magnetic radial. The variation at the
      aircraft is not needed.


      **Solution**


      - True bearing from the VOR: {{track}}° + 180° = {{= track + 180}}°

      - Magnetic radial: {{= track + 180}}° − ({{var_vor}})° = {{= track + 180 -
      var_vor}}°, kept within 360°


      The radial is **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the track itself, forgetting the reciprocal.

      - **{{d2}}°**: adds the variation at the VOR instead of subtracting it.

      - **{{d3}}°**: uses the variation at the aircraft instead of the VOR.

      - **{{d4}}°**: adds the variation at the aircraft to the reciprocal.
