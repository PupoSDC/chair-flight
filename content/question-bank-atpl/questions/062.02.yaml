    - 062.02.01.02.01
  template:
    type: calculation
    question: You are on a magnetic heading of {{hdg}}° and your ADF indicates a
      relative bearing of {{rb}}°. What is the QDM, the magnetic bearing to the
      beacon?
    variables:
      - id: hdg
        label: Magnetic heading
        unit: °
      - id: rb
        label: Relative bearing
        unit: °
    answer:
      formula: (hdg + rb) - 360 * floor((hdg + rb) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: hdg
      - id: d2
        formula: (hdg + rb + 180) - 360 * floor((hdg + rb + 180) / 360)
      - id: d3
        formula: (hdg + 180) - 360 * floor((hdg + 180) / 360)
      - id: d4
        formula: (rb - hdg) - 360 * floor((rb - hdg) / 360)
    presets:
      - id: p1
        values:
          hdg: 55
          rb: 325
      - id: p2
        values:
          hdg: 120
          rb: 270
      - id: p3
        values:
          hdg: 200
          rb: 100
    explanation: >-
      The QDM is the magnetic bearing from the aircraft to the beacon. It is
      found by adding the relative bearing to the magnetic heading.


      **Solution**


      {{f: hdg + rb}} = {{n: hdg + rb}}, less 360° if above 360° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the magnetic heading, which ignores the relative bearing.

      - **{{d2}}°**: the reciprocal of the QDM, which is the QDR.

      - **{{d3}}°**: the reciprocal of the heading.

      - **{{d4}}°**: takes the heading away from the relative bearing, the wrong
      way round.
