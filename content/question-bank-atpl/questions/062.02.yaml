- id: QQCHG3NWU
  docId: "062.02"
  relatedQuestions:
    - QRAWAPQW1
  externalIds:
    - ATPLQ-622280
    - AVEXAM-81356
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      The magnetic variation at the VOR station and at the aircraft is {{var}}°
      (east positive, west negative). An aircraft is on a bearing of {{brg}}°
      (true) from the VOR and its heading is {{hdg}}° (true).


      What OBS setting would centre the CDI needle with the "TO" indication
      showing?
    variables:
      - id: brg
        label: Bearing from the VOR (true)
        unit: °
      - id: var
        label: Variation (east positive)
        unit: °
      - id: hdg
        label: Aircraft heading (true)
        unit: °
    answer:
      formula: (brg - var + 180) - 360 * floor((brg - var + 180) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (brg - var) - 360 * floor((brg - var) / 360)
      - id: d2
        formula: (brg + var + 180) - 360 * floor((brg + var + 180) / 360)
      - id: d3
        formula: (hdg - var + 180) - 360 * floor((hdg - var + 180) / 360)
      - id: d4
        formula: (brg + 180) - 360 * floor((brg + 180) / 360)
    presets:
      - id: p1
        values:
          brg: 36
          var: 8
          hdg: 330
      - id: p2
        values:
          brg: 250
          var: 12
          hdg: 100
      - id: p3
        values:
          brg: 120
          var: 5
          hdg: 200
    explanation: >-
      The aircraft is on a radial from the VOR. The radial is the bearing from
      the VOR converted to magnetic by taking off the variation, with east as
      positive. With the TO indication showing and the needle centred, the OBS
      is set to the reciprocal of the radial, which is the course inbound to the
      VOR. The aircraft heading does not change this setting.


      **Solution**


      - Radial (magnetic): {{brg}}° − ({{var}})° = {{= brg - var}}°

      - Reciprocal for a TO indication: {{= brg - var}}° + 180° = {{= brg - var
      + 180}}°, less 360° if above 360°


      The OBS should be set to **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: the radial itself, which would give a FROM indication.

      - **{{d2}}°**: adds the variation instead of subtracting it.

      - **{{d3}}°**: uses the aircraft heading instead of the bearing from the
      VOR.

      - **{{d4}}°**: forgets the variation.
