- id: QIHNE7S73
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-621233
    - AVEXAM-19062
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      Given the following information, what relative bearing will be shown on
      the RBI in order to maintain an outbound course of {{course}}° (M) from
      overhead the NDB?


      - Wind: {{wd}}° (T) / {{ws}} kt

      - Variation: {{var}}° (east positive)

      - TAS: {{tas}} kt
    variables:
      - id: course
        label: Outbound course (magnetic)
        unit: °
      - id: var
        label: Variation (east positive)
        unit: °
      - id: wd
        label: Wind direction (true)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: 180 - asin(ws * sin(wd - (course + var)) / tas)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: 180 + asin(ws * sin(wd - (course + var)) / tas)
      - id: d2
        formula: 180 - asin(ws * sin(wd - course) / tas)
      - id: d3
        formula: "180"
      - id: d4
        formula: 180 - asin(ws / tas)
    presets:
      - id: p1
        values:
          course: 257
          var: 6
          wd: 230
          ws: 20
          tas: 80
      - id: p2
        values:
          course: 300
          var: 4
          wd: 60
          ws: 25
          tas: 60
    explanation: >-
      The aircraft flies outwards from the NDB, so the beacon is behind it and
      the bearing of the NDB from the aircraft is the track plus 180°. The track
      is the magnetic course with the variation added. A wind correction angle
      is needed to hold this track, and it turns the nose away from the track by
      the same amount, which changes the relative bearing. The relative bearing
      is therefore 180° minus the wind correction angle.


      **Solution**


      - True track: {{course}}° + {{var}}° = {{= course + var}}°


      {{f: 180 - asin(ws * sin(wd - (course + var)) / tas)}} = {{n: 180 -
      asin(ws * sin(wd - (course + var)) / tas)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: applies the wind correction with the wrong sign.

      - **{{d2}}°**: uses the magnetic course instead of the true track in the
      wind triangle.

      - **{{d3}}°**: the reciprocal of the track with no wind correction.

      - **{{d4}}°**: uses the wind speed without the wind direction.
