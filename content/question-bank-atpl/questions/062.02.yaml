- id: QON3DIISE
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-625576
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: |-
      The aircraft is tuned to an NDB and the following is known:

      - Compass heading: {{compass}}°
      - ADF indication (needle head): {{adf}}°
      - Deviation: {{dev}}°
      - Variation: {{var}}° (east positive, west negative)

      What is the true bearing from the NDB to the aircraft?
    variables:
      - id: compass
        label: Compass heading
        unit: °
      - id: adf
        label: ADF reading
        unit: °
      - id: dev
        label: Deviation
        unit: °
      - id: var
        label: Variation
        unit: °
    answer:
      formula: (compass + dev + adf + 180 + var) - 360 * floor((compass + dev + adf +
        180 + var) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (compass + adf + 180) - 360 * floor((compass + adf + 180) / 360)
      - id: d2
        formula: (compass + dev + adf + var) - 360 * floor((compass + dev + adf + var) /
          360)
      - id: d3
        formula: (compass + dev + adf + 180 - var) - 360 * floor((compass + dev + adf +
          180 - var) / 360)
      - id: d4
        formula: (compass - dev + adf + 180 + var) - 360 * floor((compass - dev + adf +
          180 + var) / 360)
    presets:
      - id: p1
        values:
          compass: 241
          adf: 162
          dev: 3
          var: 13
      - id: p2
        values:
          compass: 110
          adf: 300
          dev: -2
          var: -5
      - id: p3
        values:
          compass: 355
          adf: 45
          dev: 1
          var: 8
    explanation: >-
      An ADF needle points at the NDB relative to the nose of the aircraft. To
      place the NDB on a true chart, the compass heading is first corrected to
      magnetic (deviation), the bearing is reversed to get the direction from
      the NDB to the aircraft, and then it is converted to true (variation).
      East variation is added, west variation is subtracted.


      **Solution**


      - Magnetic heading = compass heading + deviation = {{= compass + dev}}°

      - Magnetic bearing of the aircraft from the NDB = magnetic heading + ADF
      reading, between 0° and 360° = {{= (compass + dev + adf) - 360 *
      floor((compass + dev + adf) / 360)}}°

      - Magnetic bearing from the NDB to the aircraft = that bearing + 180°,
      between 0° and 360° = {{= (compass + dev + adf + 180) - 360 *
      floor((compass + dev + adf + 180) / 360)}}°

      - True bearing = magnetic bearing + east variation = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: deviation and variation are both ignored.

      - **{{d2}}°T**: the 180° reciprocal is left out, so the bearing to the NDB
      is given.

      - **{{d3}}°T**: the variation is applied with the wrong sign (west instead
      of east).

      - **{{d4}}°T**: the deviation is applied with the wrong sign.
