    - AVEXAM-47994
    - ATPLGS-621046
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      An aircraft needs a VDF bearing from a station to contact the tower on
      R/T.


      - Range from the station: {{range}} NM

      - Station elevation: {{site}} ft above MSL


      What is the minimum flight level (ISA conditions) the aircraft must fly?
    variables:
      - id: range
        label: Range from the station
        unit: NM
      - id: site
        label: Station elevation
        unit: ft
    answer:
      formula: ceil(((range / 1.23 - sqrt(site)) ^ 2) / 100)
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil((range / 1.23) ^ 2 / 100)
      - id: d2
        formula: ceil(range / 1.23 - sqrt(site))
      - id: d3
        formula: floor(((range / 1.23 - sqrt(site)) ^ 2) / 100)
      - id: d4
        formula: ceil(((range / 1.23 + sqrt(site)) ^ 2) / 100)
    presets:
      - id: p1
        values:
          range: 111
          site: 169
      - id: p2
        values:
          range: 100
          site: 400
      - id: p3
        values:
          range: 140
          site: 900
    explanation: >-
      A VDF bearing can only be received while the aircraft is inside the radio
      horizon of the station. The rule of thumb is: range in NM = 1.23 × (square
      root of the aircraft height in ft + square root of the station height in
      ft). It is turned around here to find the lowest height that still reaches
      the range, and the result is rounded up to the next full flight level.


      **Solution**


      - Range divided by 1.23, minus the square root of the station height: {{=
      range / 1.23 - sqrt(site)}}

      - Aircraft height needed: {{= (range / 1.23 - sqrt(site)) ^ 2}} ft

      - Minimum flight level, rounded up: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: ignores the station height in the rule.

      - **FL{{d2}}**: does not square the result to get the height.

      - **FL{{d3}}**: rounds down, which leaves the aircraft just short of the
      range.

      - **FL{{d4}}**: adds the station height instead of subtracting it.
