- id: QOPAJUAYX
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-622450
    - BGS-621262
    - AVEXAM-63687
  annexes:
    - 062-rmi-display-with-two-needles-compass-card-adf-and-nav
  learningObjectives:
    - "062.02"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. The pilot of a light aircraft is plotting the position
      using a VOR bearing and an NDB bearing, both shown on the RMI in the
      annex. The NDB pointer reads {{rmi_pointer}}° (value read from the RMI).


      - Deviation: {{dev_w}}°W

      - Variation: {{var_e}}°E


      What is the true bearing to plot from the NDB?
    variables:
      - id: rmi_pointer
        label: NDB pointer reading (read from RMI)
        unit: °
      - id: dev_w
        label: Deviation
        unit: °W
      - id: var_e
        label: Variation
        unit: °E
    chartInputs:
      - rmi_pointer
    answer:
      formula: rmi_pointer - dev_w + var_e
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: rmi_pointer
      - id: d2
        formula: rmi_pointer + var_e
      - id: d3
        formula: rmi_pointer + dev_w + var_e
      - id: d4
        formula: rmi_pointer - dev_w - var_e
    presets:
      - id: p1
        values:
          rmi_pointer: 266
          dev_w: 2
          var_e: 6
      - id: p2
        values:
          rmi_pointer: 120
          dev_w: 3
          var_e: 4
      - id: p3
        values:
          rmi_pointer: 340
          dev_w: 1
          var_e: 8
    explanation: >-
      The pointer on the RMI shows the bearing as read against the compass, so
      it must first be corrected for deviation, the error of the aircraft's own
      compass, and then for variation, the difference between magnetic and true
      north at the aircraft.


      **Solution**


      {{f: rmi_pointer - dev_w + var_e}} = {{n: rmi_pointer - dev_w + var_e}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the pointer reading without any correction.

      - **{{d2}}°**: applies the variation but forgets the deviation.

      - **{{d3}}°**: adds the westerly deviation instead of subtracting it.

      - **{{d4}}°**: applies both corrections with the wrong sign.
