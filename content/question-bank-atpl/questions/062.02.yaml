  template:
    type: calculation
    question: >-
      An aeroplane flies over position A, which is due north of a VOR station at
      position B.


      - Variation at B: {{var_vor}}° (east positive, west negative)

      - Variation at A: {{var_ac}}° (east positive, west negative)


      What radial from B is the aeroplane on, in degrees?
    variables:
      - id: var_vor
        label: Variation at the VOR (B)
        unit: °
      - id: var_ac
        label: Variation at the aircraft (A)
        unit: °
    answer:
      formula: (0 - var_vor) - 360 * floor((0 - var_vor) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (var_vor) - 360 * floor((var_vor) / 360)
      - id: d2
        formula: (0 - var_ac) - 360 * floor((0 - var_ac) / 360)
      - id: d3
        formula: (180 - var_vor) - 360 * floor((180 - var_vor) / 360)
      - id: d4
        formula: (var_vor - var_ac) - 360 * floor((var_vor - var_ac) / 360)
    presets:
      - id: p1
        values:
          var_vor: -10
          var_ac: -18
      - id: p2
        values:
          var_vor: 6
          var_ac: 2
      - id: p3
        values:
          var_vor: -4
          var_ac: -9
    explanation: >-
      A VOR radial is a magnetic bearing from the VOR. The aeroplane is due
      north of the VOR, so its true bearing from the VOR is 000°. To get the
      magnetic bearing the variation at the VOR is taken off, with east as
      positive. The variation at the aircraft is not needed.


      **Solution**


      - True bearing from the VOR: 000°

      - Magnetic radial: 000° − ({{var_vor}})° = {{= 0 - var_vor}}°, kept within
      360°


      The radial is **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the variation instead of subtracting it.

      - **{{d2}}°**: uses the variation at the aircraft instead of the VOR.

      - **{{d3}}°**: measures the radial from the south instead of the north.

      - **{{d4}}°**: subtracts the two variations from each other.
