- id: Q1S7XM2QE
  docId: "062.02"
  relatedQuestions:
    - QFKCVF8ZZ
  externalIds:
    - ATPLQ-627975
    - ATPLGS-621051
    - AVEXAM-25811
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: The aircraft is on the QDR of {{qdr}}° in the vicinity of the station,
      with a magnetic heading of {{hdg}}°. What is the relative bearing on the
      ADF indicator, in degrees?
    variables:
      - id: qdr
        label: QDR
        unit: °
      - id: hdg
        label: Magnetic heading
        unit: °
    answer:
      formula: (qdr + 540 - hdg) - 360 * floor((qdr + 540 - hdg) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (qdr - hdg + 360) - 360 * floor((qdr - hdg + 360) / 360)
      - id: d2
        formula: (hdg - qdr) - 360 * floor((hdg - qdr) / 360)
      - id: d3
        formula: (qdr + 180 + hdg) - 360 * floor((qdr + 180 + hdg) / 360)
      - id: d4
        formula: (hdg - qdr - 180) - 360 * floor((hdg - qdr - 180) / 360)
    presets:
      - id: p1
        values:
          qdr: 75
          hdg: 295
      - id: p2
        values:
          qdr: 120
          hdg: 320
      - id: p3
        values:
          qdr: 200
          hdg: 250
    explanation: >-
      The QDR is the magnetic bearing from the station to the aircraft. The
      bearing from the aircraft to the station is 180° more. The relative
      bearing is that bearing minus the magnetic heading, given as an angle
      between 0° and 360° measured clockwise from the nose.


      **Solution**


      - Bearing to the station: {{qdr}}° + 180° = {{= qdr + 180}}°

      - Relative bearing: bearing to the station minus the heading, {{f: qdr +
      540 - hdg}} = {{n: qdr + 540 - hdg}} less full circles of 360°, gives
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the QDR directly, without the 180° that turns it into
      the bearing to the station.

      - **{{d2}}°**: subtracts the other way round, which gives the angle
      counted anticlockwise.

      - **{{d3}}°**: adds the heading instead of subtracting it.

      - **{{d4}}°**: uses the heading minus the reciprocal of the QDR, which is
      the wrong direction.
