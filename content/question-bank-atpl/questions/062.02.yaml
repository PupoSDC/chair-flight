- id: QFKCVF8ZZ
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-623049
    - ATPLGS-629630
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      Given the following information, what is the true bearing from the NDB to
      the aircraft?


      - Compass heading: {{compass}}°

      - ADF relative bearing: {{rb}}°

      - Deviation: {{dev}}°

      - Variation: {{var_w}}°W


      The convergence is negligible.
    variables:
      - id: compass
        label: Compass heading
        unit: °
      - id: rb
        label: ADF relative bearing
        unit: °
      - id: dev
        label: Deviation
        unit: °
      - id: var_w
        label: Variation (west)
        unit: °W
    answer:
      formula: (compass + dev - var_w + rb + 180) - 360 * floor((compass + dev - var_w
        + rb + 180) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (compass + dev + var_w + rb + 180) - 360 * floor((compass + dev + var_w
          + rb + 180) / 360)
      - id: d2
        formula: (compass + dev - var_w + rb) - 360 * floor((compass + dev - var_w + rb)
          / 360)
      - id: d3
        formula: (compass - var_w + rb + 180) - 360 * floor((compass - var_w + rb + 180)
          / 360)
      - id: d4
        formula: (compass + dev - var_w + 180) - 360 * floor((compass + dev - var_w +
          180) / 360)
    presets:
      - id: p1
        values:
          compass: 348
          rb: 317
          dev: -2
          var_w: 22
      - id: p2
        values:
          compass: 120
          rb: 45
          dev: 3
          var_w: 10
      - id: p3
        values:
          compass: 30
          rb: 200
          dev: -1
          var_w: 5
    explanation: >-
      The ADF shows the direction of the beacon relative to the nose of the
      aircraft. The magnetic heading is the compass heading plus the deviation.
      The true heading is the magnetic heading minus a west variation. The
      bearing to the beacon is the true heading plus the relative bearing, and
      the bearing from the beacon to the aircraft is 180° more. Full circles of
      360° are removed to keep the answer between 0° and 360°.


      **Solution**


      - True heading: {{compass}}° + ({{dev}}°) - {{var_w}}° = {{= compass + dev
      - var_w}}°

      - {{f: compass + dev - var_w + rb + 180}} = {{n: compass + dev - var_w +
      rb + 180}}, less full circles of 360°, gives **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: adds the west variation instead of subtracting it.

      - **{{d2}}°T**: leaves out the 180°, which gives the bearing to the beacon
      instead of from it.

      - **{{d3}}°T**: ignores the deviation.

      - **{{d4}}°T**: ignores the ADF relative bearing.
