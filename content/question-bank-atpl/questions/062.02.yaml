  template:
    type: calculation
    question: What approximate rate of descent is required in order to maintain a 3°
      glide path at a groundspeed of {{gs}} kt? Give the answer in ft/min.
    variables:
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: 5 * gs
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: 10 * gs
      - id: d2
        formula: 4 * gs
      - id: d3
        formula: 5 * gs + 100
      - id: d4
        formula: 3 * gs
    presets:
      - id: p1
        values:
          gs: 90
      - id: p2
        values:
          gs: 120
      - id: p3
        values:
          gs: 200
    explanation: >-
      On a 3° glide path the aircraft must descend about 318 ft for every
      nautical mile it flies. At {{gs}} kt it flies {{= gs / 60}} NM each
      minute, so the rate of descent is about 5 ft/min for every knot of
      groundspeed.


      **Solution**


      {{f: 5 * gs}} = {{n: 5 * gs}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses 10 ft/min per knot, the figure for a 6° glide
      path.

      - **{{d2}} ft/min**: uses 4 ft/min per knot, which is not the figure for a
      3° path.

      - **{{d3}} ft/min**: adds 100 ft/min to the correct value.

      - **{{d4}} ft/min**: uses the glide path angle of 3 as the factor.
