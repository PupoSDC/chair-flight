  template:
    type: chart
    question: >-
      Refer to figure.


      After tuning into a VOR/DME, the aircraft flies overhead it and then on a
      constant heading for about 5 minutes.


      The HSI indication after that 5 minutes is shown in the annex.


      What has been the approximate magnetic track of the aircraft?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 042°
        wrongAnswers:
          - 046°
          - 053°
          - 050°
        explanation: >-
          The track is the direction the aircraft has moved over the ground,
          which is not necessarily the heading it was flying because of wind.
          Once the aircraft has flown over the station and then on a constant
          heading, the HSI indication after 5 minutes shows the track.


          The other answers are angles close to the one shown in the annex, but
          they do not match the indication.
- id: QUFIEOSD
  docId: "062.02"
  relatedQuestions:
    - QCVT1U13H
  externalIds:
    - ATPLQ-629888
    - AVEXAM-6490
    - BGS-620954
    - AVEXAM-39308
  annexes:
    - 062-cdi-display-and-four-rmi-options-a-d-with-yellow-02
  learningObjectives:
    - 062.02.03.04.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. An aircraft is flying on a MH of 210°. The magnetic
      variation at the VOR is {{var_vor}}°W and at the aircraft {{var_ac}}°W.


      - Radial read from the CDI at the top of the annex: {{cdi_radial}}° (value
      read from the figure, referenced to magnetic north at the VOR)


      According to the CDI shown in the annex, on which radial is the aircraft?
    variables:
      - id: cdi_radial
        label: Radial read from the CDI (read from figure)
        unit: °
      - id: var_vor
        label: Variation at the VOR
        unit: °W
      - id: var_ac
        label: Variation at the aircraft
        unit: °W
    chartInputs:
      - cdi_radial
    answer:
      formula: cdi_radial - var_ac + var_vor
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: cdi_radial
      - id: d2
        formula: cdi_radial + var_ac - var_vor
      - id: d3
        formula: cdi_radial - var_ac - var_vor
      - id: d4
        formula: cdi_radial + 180 - var_ac + var_vor
    presets:
      - id: p1
        values:
          cdi_radial: 30
          var_vor: 5
          var_ac: 10
      - id: p2
        values:
          cdi_radial: 150
          var_vor: 3
          var_ac: 8
      - id: p3
        values:
          cdi_radial: 300
          var_vor: 2
          var_ac: 7
    explanation: >-
      The radial read from the CDI is referenced to magnetic north at the VOR.
      Because the variation at the aircraft differs from the variation at the
      VOR, the reading must be corrected by the difference between the two
      before the radial can be stated.


      **Solution**


      {{f: cdi_radial - var_ac + var_vor}} = {{n: cdi_radial - var_ac +
      var_vor}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the CDI reading without any variation correction.

      - **{{d2}}°**: applies both variations with the signs reversed.

      - **{{d3}}°**: subtracts both variations instead of their difference.

      - **{{d4}}°**: adds 180°, which gives the reciprocal radial.
