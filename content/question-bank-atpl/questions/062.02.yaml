- id: QETN6RNIJ
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-629113
  annexes:
    - 062-navigation-display-compass-mode-hdg-137-mag-gs-209-tas
  learningObjectives:
    - "062.02"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. The pilot has tuned the ORJ NDB to ADF 1 and wants
      the true bearing from the ORJ NDB to the aircraft.


      - Magnetic bearing from the ORJ NDB to the aircraft, read from the figure:
      {{mag}}°

      - Local variation: {{var}}° (east positive, west negative)


      What is the true bearing from the ORJ NDB to the aircraft?
    variables:
      - id: mag
        label: Magnetic bearing from the NDB (read from the figure)
        unit: °
      - id: var
        label: Local variation
        unit: °
    chartInputs:
      - mag
    answer:
      formula: (mag + var) - 360 * floor((mag + var) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (mag - var) - 360 * floor((mag - var) / 360)
      - id: d2
        formula: (mag + var + 180) - 360 * floor((mag + var + 180) / 360)
      - id: d3
        formula: (mag + 2 * var) - 360 * floor((mag + 2 * var) / 360)
      - id: d4
        formula: (mag - var + 180) - 360 * floor((mag - var + 180) / 360)
    presets:
      - id: p1
        values:
          mag: 213
          var: 10
      - id: p2
        values:
          mag: 120
          var: 5
    explanation: >-
      The bearing read from the figure is magnetic, so the local variation is
      applied to get a true bearing. East variation is added, west variation is
      subtracted.


      **Solution**


      - True bearing = magnetic bearing + east variation: {{n: mag + var}} =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: applies the variation with the wrong sign (west instead of
      east).

      - **{{d2}}°T**: adds the 180° reciprocal, which gives the bearing from the
      aircraft to the NDB.

      - **{{d3}}°T**: applies the variation twice.

      - **{{d4}}°T**: wrong sign on the variation and the reciprocal added.
