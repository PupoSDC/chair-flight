- id: Q6THN8RHJ
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-627131
    - BGS-620125
    - AVEXAM-1024
    - ATPLGS-626042
    - ATPLQ-627945
    - ATPLGS-626038
    - AVEXAM-3663
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      Given the following information:


      - OBS course: {{obs}}°

      - From/To indicator: TO

      - CDI needle deflection: {{dev}}° (positive to the right, negative to the
      left; full scale is 10°)


      On which radial is the aircraft?
    variables:
      - id: obs
        label: OBS course
        unit: °
      - id: dev
        label: CDI deflection
        unit: °
    answer:
      formula: (obs + 180 + dev) - 360 * floor((obs + 180 + dev) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (obs + dev) - 360 * floor((obs + dev) / 360)
      - id: d2
        formula: (obs - dev + 180) - 360 * floor((obs - dev + 180) / 360)
      - id: d3
        formula: (obs + 180) - 360 * floor((obs + 180) / 360)
      - id: d4
        formula: (obs + 180 + 2 * dev) - 360 * floor((obs + 180 + 2 * dev) / 360)
    presets:
      - id: p1
        values:
          obs: 90
          dev: 5
      - id: p2
        values:
          obs: 235
          dev: -5
      - id: p3
        values:
          obs: 300
          dev: 3
    explanation: >-
      With a TO indication the aircraft is on the reciprocal side of the station
      from the OBS course. The radial is therefore the reciprocal of the OBS
      course, moved by the CDI deflection: the deflection is added when the
      needle is to the right and subtracted when it is to the left.


      **Solution**


      - Reciprocal of the OBS course: {{= (obs + 180) - 360 * floor((obs + 180)
      / 360)}}°

      - Add the deflection (right adds, left subtracts): **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the OBS course instead of its reciprocal.

      - **{{d2}}°**: applies the deflection in the wrong direction.

      - **{{d3}}°**: ignores the CDI deflection.

      - **{{d4}}°**: counts the deflection twice.
