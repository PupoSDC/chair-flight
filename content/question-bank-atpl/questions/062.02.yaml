  template:
    type: calculation
    question: |-
      The RMI reads the NDB bearing as {{rmi}}° (magnetic).

      - Variation at the NDB: {{var_ndb}}° (east positive, west negative)
      - Variation at the DR position: {{var_dr}}° (east positive, west negative)
      - Deviation: {{dev}}°
      - Compass heading: {{ch}}°

      What is the true bearing of the NDB from the aircraft, in degrees?
    variables:
      - id: rmi
        label: RMI bearing (magnetic)
        unit: °
      - id: var_ndb
        label: Variation at the NDB
        unit: °
      - id: var_dr
        label: Variation at the DR position
        unit: °
      - id: dev
        label: Deviation
        unit: °
      - id: ch
        label: Compass heading
        unit: °
    answer:
      formula: (rmi + var_ndb) - 360 * floor((rmi + var_ndb) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (rmi + var_dr) - 360 * floor((rmi + var_dr) / 360)
      - id: d2
        formula: (rmi - var_ndb) - 360 * floor((rmi - var_ndb) / 360)
      - id: d3
        formula: (rmi + var_ndb + dev) - 360 * floor((rmi + var_ndb + dev) / 360)
      - id: d4
        formula: (ch + rmi) - 360 * floor((ch + rmi) / 360)
    presets:
      - id: p1
        values:
          rmi: 300
          var_ndb: -24
          var_dr: -22
          dev: -2
          ch: 20
      - id: p2
        values:
          rmi: 150
          var_ndb: 12
          var_dr: 10
          dev: 3
          ch: 45
      - id: p3
        values:
          rmi: 340
          var_ndb: -5
          var_dr: -3
          dev: -4
          ch: 100
    explanation: >-
      The RMI already shows the magnetic bearing of the NDB. To turn it into a
      true bearing the variation at the NDB is applied, with east as positive:
      true = magnetic + variation. The deviation, the compass heading and the
      variation at the DR position are not needed.


      **Solution**


      {{f: rmi + var_ndb}} = {{n: rmi + var_ndb}}, less 360° if above 360° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the variation at the DR position instead of the NDB.

      - **{{d2}}°**: subtracts the variation instead of adding it.

      - **{{d3}}°**: applies the deviation as well, which is not needed for a
      bearing read from the RMI.

      - **{{d4}}°**: adds the compass heading to the bearing.
