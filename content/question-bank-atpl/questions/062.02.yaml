- id: QOWQ8NJBY
  docId: "062.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-627288
    - AVEXAM-17543
    - BGS-620208
    - ATPLGS-626048
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      Given:


      - Aircraft position: 52°09'S 024°E, FL 310, magnetic variation 14°W

      - BIT VOR/DME position: 54°42'S 024°E

      - Magnetic variation at the BIT VOR/DME: {{vor_e}}°E


      In order to read the most accurate ground speed from the DME receiver at
      their present position, which BIT radial must the pilot follow, in
      degrees?
    variables:
      - id: vor_e
        label: Magnetic variation at the VOR
        unit: °E
    answer:
      formula: 360 - vor_e
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: 180 + vor_e
      - id: d2
        formula: vor_e
      - id: d3
        formula: 180 - vor_e
      - id: d4
        formula: 360 + vor_e
    presets:
      - id: p1
        values:
          vor_e: 14
      - id: p2
        values:
          vor_e: 9
      - id: p3
        values:
          vor_e: 20
    explanation: >-
      The DME gives the most accurate ground speed when the aircraft flies along
      a radial, directly away from or towards the station. A radial is a
      magnetic bearing from the VOR. The aircraft is due north of the BIT VOR,
      so the true bearing from the VOR to the aircraft is 360°. To change true
      into magnetic, an east variation is subtracted. The variation at the
      aircraft is not needed.


      **Solution**


      {{f: 360 - vor_e}} = {{n: 360 - vor_e}} = **{{answer}}° magnetic**


      **Why the other answers are wrong**


      - **{{d1}}°**: adds 180°, which gives the reciprocal radial pointing
      towards the VOR.

      - **{{d2}}°**: uses the variation alone as the radial.

      - **{{d3}}°**: the reciprocal radial with the variation subtracted instead
      of added.

      - **{{d4}}°**: adds the variation to a full circle instead of subtracting
      it.
