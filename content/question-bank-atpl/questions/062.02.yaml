- id: QHPDRPWZ
  docId: "062.02"
  relatedQuestions:
    - QXRRKEXPG
  externalIds:
    - ATPLQ-621784
  annexes: []
  learningObjectives:
    - 062.02.03.02.06
  template:
    type: calculation
    question: >-
      You are flying in Canada using a VOR to navigate. You are on the
      {{radial}}° radial. The variation at the VOR is {{var_vor}}° and at the
      aircraft is {{var_ac}}° (east positive, west negative).


      What is the true bearing from the VOR to the aircraft, in degrees?
    variables:
      - id: radial
        label: Radial (magnetic)
        unit: °
      - id: var_vor
        label: Variation at the VOR (east positive)
        unit: °
      - id: var_ac
        label: Variation at the aircraft (east positive)
        unit: °
    answer:
      formula: (radial + var_vor) - 360 * floor((radial + var_vor) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (radial - var_vor) - 360 * floor((radial - var_vor) / 360)
      - id: d2
        formula: (radial - 180 + var_ac) - 360 * floor((radial - 180 + var_ac) / 360)
      - id: d3
        formula: (radial + var_vor + var_ac) - 360 * floor((radial + var_vor + var_ac) /
          360)
      - id: d4
        formula: (radial - 180 + var_vor) - 360 * floor((radial - 180 + var_vor) / 360)
    presets:
      - id: p1
        values:
          radial: 190
          var_vor: -2
          var_ac: 2
      - id: p2
        values:
          radial: 250
          var_vor: 12
          var_ac: -3
      - id: p3
        values:
          radial: 75
          var_vor: -15
          var_ac: 6
    explanation: >-
      A VOR radial is a magnetic bearing from the VOR. To get the true bearing
      the variation at the VOR is applied, with east as positive: true =
      magnetic + variation. The variation at the aircraft does not change the
      bearing.


      **Solution**


      - True bearing = {{radial}}° + ({{var_vor}})° = {{= radial + var_vor}}°,
      kept within 360°


      The true bearing is **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the variation instead of adding it.

      - **{{d2}}°**: uses the reciprocal of the radial and adds the variation at
      the aircraft.

      - **{{d3}}°**: adds the variation at the aircraft as well, which does not
      affect the bearing.

      - **{{d4}}°**: uses the reciprocal of the radial with the variation at the
      VOR.
