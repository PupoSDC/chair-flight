  template:
    type: calculation
    question: >-
      An aircraft tunes in to a VOR or VDF ground station that is sited above
      mean sea level.


      - Aircraft flight level: FL{{fl}}

      - Station elevation: {{site}} ft above MSL


      What is the approximate maximum theoretical range at which the aircraft
      can receive the station's signals? Give the answer in NM.
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: site
        label: Station elevation
        unit: ft
    answer:
      formula: 1.23 * (sqrt(fl * 100) + sqrt(site))
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: sqrt(fl * 100) + sqrt(site)
      - id: d2
        formula: 1.23 * (sqrt(fl) + sqrt(site))
      - id: d3
        formula: 1.23 * (sqrt(fl * 100) + sqrt(site)) * 1.852
      - id: d4
        formula: 1.23 * (sqrt(fl * 100) + sqrt(site)) / 2
    presets:
      - id: p1
        values:
          fl: 130
          site: 1024
      - id: p2
        values:
          fl: 100
          site: 100
      - id: p3
        values:
          fl: 230
          site: 0
      - id: p4
        values:
          fl: 80
          site: 1027
    explanation: >-
      Radio waves travel in straight lines, so the range is limited by the radio
      horizon of both the aircraft and the station. The rule of thumb is: range
      in NM = 1.23 × (square root of the aircraft height in ft + square root of
      the station height in ft).


      **Solution**


      - Aircraft height: FL{{fl}} = {{= fl * 100}} ft

      - {{f: 1.23 * (sqrt(fl * 100) + sqrt(site))}} = {{n: 1.23 * (sqrt(fl *
      100) + sqrt(site))}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: leaves out the constant 1.23.

      - **{{d2}} NM**: uses the flight level number as feet instead of
      multiplying it by 100.

      - **{{d3}} NM**: converts the range to kilometres (× 1.852) when nautical
      miles are asked.

      - **{{d4}} NM**: halves the result, as if only one radio horizon counted.
