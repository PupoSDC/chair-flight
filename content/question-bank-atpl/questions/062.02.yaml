  template:
    type: calculation
    question: The RMI compass rose is stuck on {{heading}}°, and the ADF pointer
      indicates {{pointer}}°. What is the relative bearing to the station, in
      degrees?
    variables:
      - id: heading
        label: Heading (stuck compass rose)
        unit: °
      - id: pointer
        label: ADF pointer reading
        unit: °
    answer:
      formula: (pointer - heading) - 360 * floor((pointer - heading) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: pointer
      - id: d2
        formula: (pointer + heading) - 360 * floor((pointer + heading) / 360)
      - id: d3
        formula: (pointer - 2 * heading) - 360 * floor((pointer - 2 * heading) / 360)
      - id: d4
        formula: (heading + 180) - 360 * floor((heading + 180) / 360)
    presets:
      - id: p1
        values:
          heading: 90
          pointer: 225
      - id: p2
        values:
          heading: 70
          pointer: 310
      - id: p3
        values:
          heading: 200
          pointer: 40
    explanation: >-
      The ADF pointer on an RMI shows the magnetic bearing of the station. The
      relative bearing is measured from the nose of the aircraft, so the heading
      is taken away from the bearing.


      **Solution**


      {{f: pointer - heading}} = {{n: pointer - heading}}, kept within 360° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: reads the pointer directly, which gives the magnetic
      bearing, not the relative bearing.

      - **{{d2}}°**: adds the heading to the pointer reading.

      - **{{d3}}°**: takes the heading away twice.

      - **{{d4}}°**: uses the reciprocal of the heading.
