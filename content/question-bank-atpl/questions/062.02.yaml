  template:
    type: calculation
    question: The time taken for the transmission of an interrogation pulse by a
      Distance Measuring Equipment (DME) to travel to the ground transponder and
      return to the airborne receiver was {{time}} micro-seconds, including time
      delay. What was the slant range from the ground transponder, in NM?
    variables:
      - id: time
        label: Time for the round trip, including delay
        unit: µs
    answer:
      formula: (time - 50) / 12.36
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: time / 12.36
      - id: d2
        formula: (time - 50) / 6.18
      - id: d3
        formula: (time + 50) / 12.36
      - id: d4
        formula: time / 6.18
    presets:
      - id: p1
        values:
          time: 2000
      - id: p2
        values:
          time: 1500
      - id: p3
        values:
          time: 1200
    explanation: >-
      The DME measures the time for a radio pulse to reach the ground
      transponder and come back. The transponder adds a fixed delay of 50
      micro-seconds, which must be removed. The round trip takes about 12.36
      micro-seconds per NM of range.


      **Solution**


      - Time without the delay: {{time}} µs - 50 µs = {{= time - 50}} µs

      - {{f: (time - 50) / 12.36}} = {{n: (time - 50) / 12.36}} = **{{answer}}
      NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: does not remove the 50 micro-second transponder delay.

      - **{{d2}} NM**: uses 6.18 micro-seconds per NM, half the round trip, so
      the range is doubled.

      - **{{d3}} NM**: adds the delay instead of removing it.

      - **{{d4}} NM**: removes no delay and uses 6.18 micro-seconds per NM, so
      the range is doubled.
