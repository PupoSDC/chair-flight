- id: QCB0Z8JLF
  docId: "062.02"
  relatedQuestions:
    - QDJVZCBRH
  externalIds:
    - ATPLQ-621651
    - AVEXAM-95495
  annexes: []
  learningObjectives:
    - "062.02"
  template:
    type: calculation
    question: >-
      An aircraft is on the {{radial}}° radial from a nearby VOR.


      - Magnetic variation at the VOR: {{var_vor}}° (east positive, west
      negative)

      - Magnetic variation at the aircraft: {{var_ac}}° (east positive, west
      negative)


      What true track does the aircraft need to fly to go directly to the VOR?
    variables:
      - id: radial
        label: VOR radial
        unit: °
      - id: var_vor
        label: Variation at the VOR
        unit: °
      - id: var_ac
        label: Variation at the aircraft
        unit: °
    answer:
      formula: (radial + var_vor + 180) - 360 * floor((radial + var_vor + 180) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (radial + var_ac + 180) - 360 * floor((radial + var_ac + 180) / 360)
      - id: d2
        formula: (radial - var_vor + 180) - 360 * floor((radial - var_vor + 180) / 360)
      - id: d3
        formula: (radial + var_vor) - 360 * floor((radial + var_vor) / 360)
      - id: d4
        formula: (radial + var_ac) - 360 * floor((radial + var_ac) / 360)
    presets:
      - id: p1
        values:
          radial: 290
          var_vor: 5
          var_ac: 7
      - id: p2
        values:
          radial: 150
          var_vor: -4
          var_ac: -6
    explanation: >-
      A VOR radial is a magnetic bearing from the station. The track to the VOR
      is the reciprocal of the bearing from the VOR. The radial is referenced to
      magnetic north at the VOR, so the variation at the VOR (not at the
      aircraft) is applied.


      **Solution**


      - True bearing from the VOR = radial + variation at the VOR = {{= radial +
      var_vor}}°

      - True track to the VOR = that bearing + 180°, between 0° and 360° =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: uses the variation at the aircraft instead of at the VOR,
      and adds the reciprocal.

      - **{{d2}}°T**: applies the variation at the VOR with the wrong sign.

      - **{{d3}}°T**: forgets the reciprocal, so gives the true bearing from the
      VOR instead of the track to it.

      - **{{d4}}°T**: forgets the reciprocal and uses the variation at the
      aircraft.
