- id: QGHCNGNL
  docId: "032.01"
  relatedQuestions:
    - QIEFDUMG
  externalIds:
    - ATPLQ-322783
  annexes: []
  learningObjectives:
    - 032.01.04.01.11
  template:
    type: calculation
    question: >-
      Calculate the all-engine climb gradient for a twin-engine aeroplane with
      the following characteristics:


      - Thrust: {{thrust}} lb per engine

      - Weight: {{mass}} kg

      - Lift/drag ratio: {{ld}}


      Use 1 lb of thrust = 4.4 N and g = 10 m/s². Give the answer in %.
    variables:
      - id: thrust
        label: Thrust per engine
        unit: lb
      - id: mass
        label: Weight (mass)
        unit: kg
      - id: ld
        label: Lift/drag ratio
        unit: ""
    answer:
      formula: (2 * thrust * 4.4 / (mass * 10) - 1 / ld) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: (thrust * 4.4 / (mass * 10) - 1 / ld) * 100
      - id: d2
        formula: 2 * thrust * 4.4 / (mass * 10) * 100
      - id: d3
        formula: 100 / ld
      - id: d4
        formula: (2 * thrust * 4.4 / (mass * 10) + 1 / ld) * 100
    presets:
      - id: p1
        values:
          thrust: 33000
          mass: 89350
          ld: 7.81
      - id: p2
        values:
          thrust: 28000
          mass: 72000
          ld: 8.5
      - id: p3
        values:
          thrust: 20000
          mass: 60000
          ld: 9
    explanation: >
      The climb gradient is the excess thrust over drag divided by weight:
      gradient = total thrust / weight - 1/(L/D), because in a steady climb drag
      equals weight divided by the lift/drag ratio. Thrust of both engines is
      converted to newtons and the mass to a weight in newtons.


      **Solution**


      Total thrust = 2 x {{thrust}} lb x 4.4 N/lb = {{= 2 * thrust * 4.4}} N

      Weight = {{mass}} kg x 10 m/s² = {{= mass * 10}} N


      {{f: (2 * thrust * 4.4 / (mass * 10) - 1 / ld) * 100}} = {{n: (2 * thrust
      * 4.4 / (mass * 10) - 1 / ld) * 100}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the thrust of only one engine although all engines
      operate.

      - **{{d2}} %**: forgets to subtract the drag term 1/(L/D).

      - **{{d3}} %**: gives only the drag term 1/(L/D), not the climb gradient.

      - **{{d4}} %**: adds the drag term instead of subtracting it.
