- id: QXSCKWVM
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328094
    - BGS-320577
  annexes: []
  learningObjectives:
    - 032.01.04.01.11
  template:
    type: calculation
    question: >-
      Determine the one-engine-out climb gradient of a four-engined aeroplane,
      given:


      - Aeroplane mass: {{mass}} kg

      - Thrust per engine: {{thrust}} N

      - Drag: {{drag}} N

      - (Assume the acceleration due to gravity is {{g}} m/s**2**)
    variables:
      - id: mass
        label: Mass
        unit: kg
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: g
        label: g
        unit: m/s2
    answer:
      formula: (3 * thrust - drag) / (mass * g) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: (4 * thrust - drag) / (mass * g) * 100
      - id: d2
        formula: drag / (mass * g) * 100
      - id: d3
        formula: thrust / (mass * g) * 100
    presets:
      - id: p1
        values:
          mass: 315000
          thrust: 245000
          drag: 435000
          g: 10
      - id: p2
        values:
          mass: 280000
          thrust: 230000
          drag: 400000
          g: 10
      - id: p3
        values:
          mass: 350000
          thrust: 260000
          drag: 450000
          g: 10
    explanation: >-
      The climb gradient is the excess thrust (thrust minus drag) divided by the
      weight. With one of the four engines failed, only three engines contribute
      thrust.


      **Solution**


      Excess thrust: 3 x {{thrust}} N - {{drag}} N = {{= 3 * thrust - drag}} N


      {{f: (3 * thrust - drag) / (mass * g) * 100}} = {{n: (3 * thrust - drag) /
      (mass * g) * 100}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses all four engines instead of three.

      - **{{d2}} %**: drag divided by weight, which is not a climb gradient.

      - **{{d3}} %**: thrust of a single engine divided by weight; the engine
      count and the drag are ignored.
