    - "032.01"
  template:
    type: calculation
    question: |-
      Calculate the TODA, given the following runway information.

      - TORA: {{tora}} ft
      - Stopway: {{stopway}} ft
      - Clearway: {{clearway}} ft
    variables:
      - id: tora
        label: TORA
        unit: ft
      - id: stopway
        label: Stopway
        unit: ft
      - id: clearway
        label: Clearway
        unit: ft
    answer:
      formula: tora + min(clearway, 0.5 * tora)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: tora
      - id: d2
        formula: tora + stopway
      - id: d3
        formula: tora + stopway + clearway
      - id: d4
        formula: tora + clearway + 0.5 * tora
    presets:
      - id: p1
        values:
          tora: 2380
          stopway: 560
          clearway: 1570
      - id: p2
        values:
          tora: 2000
          stopway: 300
          clearway: 600
      - id: p3
        values:
          tora: 3000
          stopway: 400
          clearway: 2000
    explanation: >-
      TODA is the TORA plus the clearway, but the usable clearway cannot exceed
      half of the TORA. The stopway does not count.


      **Solution**


      {{f: tora + min(clearway, 0.5 * tora)}} = {{n: tora + min(clearway, 0.5 *
      tora)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: TORA only, the clearway is forgotten.

      - **{{d2}} ft**: adds the stopway, which belongs to ASDA, not TODA.

      - **{{d3}} ft**: adds both stopway and full clearway.

      - **{{d4}} ft**: adds the full clearway and also half the TORA.
