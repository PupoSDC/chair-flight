  template:
    type: calculation
    question: London City Airport has a landing approach glide slope of {{ang}}°.
      What flight path gradient does this equate to? Give the answer in %.
    variables:
      - id: ang
        label: Glide slope angle
        unit: °
    answer:
      formula: 100 * tan(ang)
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: ang
      - id: d2
        formula: ang * 1.8
      - id: d3
        formula: tan(ang)
      - id: d4
        formula: 100 * tan(ang) + 1
    presets:
      - id: p1
        values:
          ang: 5.5
      - id: p2
        values:
          ang: 3
      - id: p3
        values:
          ang: 4.5
    explanation: >-
      A gradient in percent is the tangent of the flight path angle multiplied
      by 100 (height gained or lost per 100 units of horizontal distance).


      **Solution**


      {{f: 100 * tan(ang)}} = {{n: 100 * tan(ang)}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the angle in degrees as if it were the gradient in
      percent.

      - **{{d2}} %**: applies a wrong rule-of-thumb factor to the angle.

      - **{{d3}} %**: gives the tangent without multiplying by 100.

      - **{{d4}} %**: adds an unjustified 1 % to the correct gradient.
