  template:
    type: calculation
    question: A turbojet is flying at a constant IAS and pressure altitude. Given
      that a ±1 °C ISA deviation results in a change in fuel flow of ±{{k}} %,
      determine by how many percent the specific fuel consumption (SFC)
      increases if the OAT is ISA +{{dev}} °C rather than ISA.
    variables:
      - id: k
        label: Fuel flow change per °C
        unit: "%"
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: dev * k
      unit: "% increase"
      decimals: 0
    distractors:
      - id: d1
        formula: dev * k * 10
      - id: d2
        formula: dev / k
      - id: d3
        formula: k / dev
      - id: d4
        formula: dev * k * 5
    presets:
      - id: p1
        values:
          k: 0.2
          dev: 10
      - id: p2
        values:
          k: 0.2
          dev: 15
      - id: p3
        values:
          k: 0.2
          dev: 5
    explanation: >-
      At constant IAS and pressure altitude the thrust and the TAS-related
      quantities stay the same, so the fuel flow change per degree of ISA
      deviation translates directly into the same percentage change in SFC.


      **Solution**


      {{f: dev * k}} = {{n: dev * k}} = **{{answer}} % increase**


      **Why the other answers are wrong**


      - **{{d1}} % increase**: a factor 10 slip (20 % instead of 2 %).

      - **{{d2}} % increase**: dividing instead of multiplying.

      - **{{d3}} % increase**: inverting the ratio.

      - **{{d4}} % increase**: a wrong factor applied to the per-degree change.
