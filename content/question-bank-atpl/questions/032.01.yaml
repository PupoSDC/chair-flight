  template:
    type: chart
    question: >-
      An aircraft manufacturer constructs two aircraft.


      Aircraft 1 is a SEP with a 160 hp engine and a MTOM of 1300 kg.


      Aircraft 2 is a twin-engine piston aircraft with two of the same 160 hp
      engines, and a MTOM of 2000 kg.


      In the event of an engine failure on aircraft 2, which of the following
      statements is correct?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: If both aeroplanes are operated at their maximum mass then aircraft 1
          will have a better power to weight ratio than aircraft 2.
        wrongAnswers:
          - If both aeroplanes are operated at a same gross mass of 1250 kg then
            aircraft 2 will have a better power to weight ratio than aircraft 1.
          - If both aeroplanes are operated at a same gross mass of 1250 kg then
            aircraft 1 will have a better power to weight ratio than aircraft 2.
          - If both aeroplanes are operated at their maximum mass then aircraft
            2 will have a better power to weight ratio than aircraft 1.
        explanation: After an engine failure, aircraft 2 has only one 160 hp engine left
          to carry its mass. At the same mass of 1 250 kg both aeroplanes have
          the same power to weight ratio. At maximum mass aircraft 1 has 160 hp
          for 1 300 kg, while aircraft 2 has 160 hp for 2 000 kg, so **aircraft
          1 has the better power to weight ratio**.
