    - ATPLQ-327628
  annexes: []
  learningObjectives:
    - "032.01"
  template:
    type: chart
    question: For take-off an aircraft requires a headwind component of at least 10
      kt and has a cross wind limitation of 35 kt. If the angle between the wind
      direction and the runway is 60°, what are the minimum and maximum
      allowable wind speeds?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 20 kt and 40 kt
        wrongAnswers:
          - 15 kt and 43 kt
          - 12 kt and 38 kt
          - 18 kt and 50 kt
        explanation: >-
          With the wind 60° off the runway, the headwind part is the wind speed
          × cos 60° (half the speed) and the crosswind part is the wind speed ×
          sin 60° (0.87 of the speed).


          - For at least 10 kt of headwind: wind speed ≥ 10 ÷ 0.5 = 20 kt.

          - For at most 35 kt of crosswind: wind speed ≤ 35 ÷ 0.87 = 40 kt.


          The allowable range is **20 kt to 40 kt**.
