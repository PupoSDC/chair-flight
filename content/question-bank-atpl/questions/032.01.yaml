- id: Q9YO4RKE4
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326320
    - BGS-321212
    - ATPLGS-626366
  annexes: []
  learningObjectives:
    - "032.01"
  template:
    type: calculation
    question: >-
      A departure procedure requires a climb gradient of {{grad}}% to an
      obstacle clearance altitude. Given the data below, estimate the minimum
      rate of climb required.


      - TAS: {{tas}} kt

      - Average headwind component: {{hw}} kt
    variables:
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind
        unit: kt
    answer:
      formula: grad / 100 * (tas - hw) * 101
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: grad / 100 * tas * 100
      - id: d2
        formula: grad / 100 * (tas + hw) * 100
      - id: d3
        formula: grad / 100 * (tas - hw) * 60.76
    presets:
      - id: p1
        values:
          grad: 4.6
          tas: 125
          hw: 25
      - id: p2
        values:
          grad: 5
          tas: 120
          hw: 20
      - id: p3
        values:
          grad: 4
          tas: 140
          hw: 30
    explanation: >-
      A required climb gradient must be flown over the ground, so the rate of
      climb depends on the groundspeed, not the TAS. Groundspeed is TAS minus
      the headwind component, and 1 kt is about 101 ft/min.


      **Solution**


      GS = {{= tas - hw}} kt


      {{f: grad / 100 * (tas - hw) * 101}} = {{n: grad / 100 * (tas - hw) *
      101}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses the TAS instead of the groundspeed (headwind
      ignored).

      - **{{d2}} ft/min**: adds the headwind instead of subtracting it.

      - **{{d3}} ft/min**: uses a wrong knots-to-ft/min conversion (60.76
      instead of about 101).
