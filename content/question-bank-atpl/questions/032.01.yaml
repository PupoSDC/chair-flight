  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-323026
    - AVEXAM-46370
  annexes: []
  learningObjectives:
    - 032.01.05.01.05
  template:
    type: calculation
    question: "To follow a {{angle}}° glideslope (ILS) when the TAS is {{tas}} kt
      and the wind component is {{tw}} kt tailwind, the required rate of descent
      is (in ft/min, 1 kt = 101.27 ft/min):"
    variables:
      - id: angle
        label: Glideslope angle
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: (tas + tw) * 101.27 * sin(angle)
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: tas * 101.27 * sin(angle)
      - id: d2
        formula: (tas - tw) * 101.27 * sin(angle)
      - id: d3
        formula: (tas + tw) * 1.0127 * angle
      - id: d4
        formula: (tas + tw) * 100 * sin(angle)
    presets:
      - id: p1
        values:
          angle: 3.25
          tas: 130
          tw: 15
      - id: p2
        values:
          angle: 3
          tas: 120
          tw: 10
      - id: p3
        values:
          angle: 3
          tas: 140
          tw: 20
    explanation: >-
      To stay on the glidepath the aircraft must descend at groundspeed times
      the glidepath gradient. A tailwind increases the groundspeed and therefore
      the rate of descent.


      **Solution**


      {{f: (tas + tw) * 101.27 * sin(angle)}} = {{n: (tas + tw) * 101.27 *
      sin(angle)}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: ignoring the tailwind (using TAS instead of
      groundspeed).

      - **{{d2}} ft/min**: subtracting the tailwind as if it were a headwind.

      - **{{d3}} ft/min**: using the angle in degrees as a gradient in percent.

      - **{{d4}} ft/min**: using 100 ft/min per knot instead of 101.27.
