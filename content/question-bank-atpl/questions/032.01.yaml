- id: QXCHHGBI0
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-324861
    - ATPLGS-625092
    - AVEXAM-80335
  annexes: []
  learningObjectives:
    - "032.01"
  template:
    type: calculation
    question: If the climb gradient in still air is {{grad}} percent, and the height
      achieved is {{height}} ft, what is the distance travelled in the climb in
      still air (in NM, 1 NM = 6076 ft)?
    variables:
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: height
        label: Height gained
        unit: ft
    answer:
      formula: height / (grad / 100) / 6076
      unit: NM
      decimals: 2
    distractors:
      - id: d1
        formula: height / (grad / 100) / 1852
      - id: d2
        formula: height / tan(grad) / 6076
      - id: d3
        formula: height / (grad / 100) / 3281
      - id: d4
        formula: height / (grad / 100) / 5280
    presets:
      - id: p1
        values:
          grad: 3.2
          height: 640
      - id: p2
        values:
          grad: 5
          height: 1200
      - id: p3
        values:
          grad: 2.5
          height: 800
    explanation: >
      Gradient is height gained divided by horizontal distance, so the distance
      equals height divided by gradient. The result in feet is converted to
      nautical miles.


      **Solution**


      Distance = {{= height / (grad / 100)}} ft


      {{f: height / (grad / 100) / 6076}} = {{n: height / (grad / 100) / 6076}}
      = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: divides by 1852 (metres per NM) instead of 6076 ft per
      NM.

      - **{{d2}} NM**: treats the percentage as an angle in degrees.

      - **{{d3}} NM**: converts feet using 3281 (ft per km) instead of 6076.

      - **{{d4}} NM**: uses 5280 ft (statute mile) instead of the nautical mile.
