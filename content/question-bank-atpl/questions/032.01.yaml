- id: QQUUHTTR
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-323597
  annexes: []
  learningObjectives:
    - 032.01.04.01.11
  template:
    type: calculation
    question: >-
      What is the all-engines climb gradient (in %) for a twin-engine aeroplane
      with the following data given? Use 1 kg = 2.2 lb.


      - Number of engines: {{n}}

      - Thrust per engine: {{thrust}} lbs

      - Mass: {{mass}} kg

      - Lift to Drag ratio: {{ld}}:1


      g = 10 m/s²
    variables:
      - id: n
        label: Number of engines
        unit: ""
      - id: thrust
        label: Thrust per engine
        unit: lb
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift to drag ratio
        unit: ""
    answer:
      formula: (n * thrust / (mass * 2.2) - 1 / ld) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: (thrust / (mass * 2.2) - 1 / ld) * 100
      - id: d2
        formula: n * thrust / (mass * 2.2) * 100
      - id: d3
        formula: (n * thrust / (mass * 2.2) + 1 / ld) * 100
      - id: d4
        formula: 1 / ld * 100
    presets:
      - id: p1
        values:
          n: 2
          thrust: 33000
          mass: 89500
          ld: 7.8
      - id: p2
        values:
          n: 2
          thrust: 25000
          mass: 60000
          ld: 8.5
      - id: p3
        values:
          n: 2
          thrust: 20000
          mass: 45000
          ld: 9
    explanation: >-
      In a steady climb the gradient is the thrust-to-weight ratio minus the
      drag-to-weight ratio, and drag over weight equals 1/(L/D). With all
      engines operating the total thrust is the number of engines times the
      thrust per engine; thrust and weight must be in the same unit (here lb).


      **Solution**


      {{f: (n * thrust / (mass * 2.2) - 1 / ld) * 100}} = {{n: (n * thrust /
      (mass * 2.2) - 1 / ld) * 100}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: only the thrust of one engine is used.

      - **{{d2}} %**: the drag term 1/(L/D) is forgotten.

      - **{{d3}} %**: the drag term is added instead of subtracted.

      - **{{d4}} %**: this is only the drag-to-weight ratio 1/(L/D), not the
      gradient.
- id: QR1V8KVZK
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-322382
  annexes: []
  learningObjectives:
    - "032.01"
  template:
    type: calculation
    question: The pilot of an aircraft changes heading to the right, from {{hdg1}}°
      to {{hdg2}}°, and makes a rate-1 turn. What is the duration of this
      manoeuvre, in seconds?
    variables:
      - id: hdg1
        label: Initial heading
        unit: °
      - id: hdg2
        label: Final heading
        unit: °
    answer:
      formula: (hdg2 - hdg1) / 3
      unit: s
      decimals: 0
    distractors:
      - id: d1
        formula: (hdg2 - hdg1) / 4
      - id: d2
        formula: (hdg2 - hdg1) / 6
      - id: d3
        formula: (hdg2 - hdg1) / 2
      - id: d4
        formula: (360 - hdg2 + hdg1) / 3
    presets:
      - id: p1
        values:
          hdg1: 214
          hdg2: 334
      - id: p2
        values:
          hdg1: 40
          hdg2: 190
      - id: p3
        values:
          hdg1: 90
          hdg2: 240
    explanation: >-
      A rate-1 turn is 3° per second, independent of TAS and bank angle, so the
      duration is the heading change divided by 3°/s.


      **Solution**


      Heading change = {{= hdg2 - hdg1}}°


      {{f: (hdg2 - hdg1) / 3}} = {{n: (hdg2 - hdg1) / 3}} = **{{answer}} s**


      **Why the other answers are wrong**


      - **{{d1}} s**: uses 4°/s instead of 3°/s.

      - **{{d2}} s**: uses 6°/s (a rate-2 turn).

      - **{{d3}} s**: uses 2°/s.

      - **{{d4}} s**: uses the heading change of a turn in the opposite
      direction.
