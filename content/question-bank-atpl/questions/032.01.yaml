- id: QDLABVVQ
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328728
    - AVEXAM-57166
  annexes: []
  learningObjectives:
    - 032.01.03.03.01
  template:
    type: calculation
    question: |-
      Determine the specific range (SR) in NM per kg, given:

      - Fuel flow: {{ff}} Imp gal/h
      - Specific gravity: {{sg}}
      - TAS: {{tas}} mph
    variables:
      - id: ff
        label: Fuel flow
        unit: Imp gal/h
      - id: sg
        label: Specific gravity
        unit: ""
      - id: tas
        label: TAS
        unit: mph
    answer:
      formula: tas / 1.15078 / (ff * 4.54609 * sg)
      unit: NM/kg
      decimals: 2
    distractors:
      - id: d1
        formula: tas / (ff * 4.54609 * sg)
      - id: d2
        formula: tas / 1.15078 / (ff * 3.78541 * sg)
      - id: d3
        formula: tas / 1.15078 / (ff * 4.54609)
      - id: d4
        formula: tas / 1.15078 / (ff * sg)
    presets:
      - id: p1
        values:
          ff: 28
          sg: 0.72
          tas: 154
      - id: p2
        values:
          ff: 30
          sg: 0.72
          tas: 180
      - id: p3
        values:
          ff: 25
          sg: 0.79
          tas: 140
    explanation: >-
      Specific range is the distance flown per unit of fuel mass: TAS in knots
      divided by fuel mass flow in kg/h. The speed must be converted from mph to
      kt and the fuel flow from Imperial gallons to kg using the specific
      gravity.


      **Solution**


      Fuel mass flow = {{= ff * 4.54609 * sg}} kg/h, TAS = {{= tas / 1.15078}}
      kt


      {{f: tas / 1.15078 / (ff * 4.54609 * sg)}} = {{n: tas / 1.15078 / (ff *
      4.54609 * sg)}} = **{{answer}} NM/kg**


      **Why the other answers are wrong**


      - **{{d1}} NM/kg**: not converting mph to knots.

      - **{{d2}} NM/kg**: using US gallons (3.785 L) instead of Imperial
      gallons.

      - **{{d3}} NM/kg**: forgetting the specific gravity.

      - **{{d4}} NM/kg**: forgetting the litres per gallon conversion.
