  template:
    type: calculation
    question: |-
      Determine the ASDA for runway 09, given:

      - TORA: {{tora}} m
      - Stopway: {{stopway}} m
      - Clearway: {{clearway}} m
    variables:
      - id: tora
        label: TORA
        unit: m
      - id: stopway
        label: Stopway
        unit: m
      - id: clearway
        label: Clearway
        unit: m
    answer:
      formula: tora + stopway
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: tora
      - id: d2
        formula: tora + clearway
      - id: d3
        formula: tora + stopway + clearway
      - id: d4
        formula: tora - stopway
    presets:
      - id: p1
        values:
          tora: 2300
          stopway: 280
          clearway: 480
      - id: p2
        values:
          tora: 2100
          stopway: 200
          clearway: 480
      - id: p3
        values:
          tora: 2500
          stopway: 300
          clearway: 500
    explanation: >-
      The Accelerate-Stop Distance Available (ASDA) is the take-off run
      available plus the stopway, since an aborted take-off can use the stopway.
      A clearway only extends the take-off distance available (TODA) and does
      not count for ASDA.


      **Solution**


      {{f: tora + stopway}} = {{n: tora + stopway}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: this is only the TORA; the stopway is forgotten.

      - **{{d2}} m**: adds the clearway instead of the stopway (that is part of
      TODA, not ASDA).

      - **{{d3}} m**: adds both stopway and clearway; the clearway is not usable
      for stopping.

      - **{{d4}} m**: subtracts the stopway instead of adding it.
