- id: QIEFDUMG
  docId: "032.01"
  relatedQuestions:
    - QGHCNGNL
  externalIds:
    - ATPLQ-327179
  annexes: []
  learningObjectives:
    - 032.01.04.01.11
  template:
    type: calculation
    question: >-
      Given the following information, what is the all-engine climb gradient of
      a two-engine aeroplane?


      - Thrust per engine: {{thrust}} N

      - Mass: {{mass}} kg

      - Lift/drag ratio: {{ld}}


      Assume g = 10 m/s². Give the answer in %, truncated to one decimal.
    variables:
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift/drag ratio
        unit: ""
    answer:
      formula: floor((2 * thrust / (mass * 10) - 1 / ld) * 1000) / 10
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: (thrust / (mass * 10) - 1 / ld) * 100
      - id: d2
        formula: 2 * thrust / (mass * 10) * 100
      - id: d3
        formula: 100 / ld
      - id: d4
        formula: (2 * thrust / (mass * 10) + 1 / ld) * 100
    presets:
      - id: p1
        values:
          thrust: 118000
          mass: 76000
          ld: 8
      - id: p2
        values:
          thrust: 95000
          mass: 60000
          ld: 9
      - id: p3
        values:
          thrust: 130000
          mass: 85000
          ld: 7.5
    explanation: >
      In a steady climb the gradient equals total thrust divided by weight minus
      the drag-to-weight ratio, which is 1/(L/D). The weight is mass times g.


      **Solution**


      Total thrust = 2 x {{thrust}} N = {{= 2 * thrust}} N

      Weight = {{mass}} kg x 10 m/s² = {{= mass * 10}} N


      {{f: (2 * thrust / (mass * 10) - 1 / ld) * 100}} = {{n: (2 * thrust /
      (mass * 10) - 1 / ld) * 100}} = **{{answer}} %** (truncated)


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the thrust of one engine only.

      - **{{d2}} %**: forgets to subtract the drag term 1/(L/D).

      - **{{d3}} %**: gives only the drag term 1/(L/D).

      - **{{d4}} %**: adds the drag term instead of subtracting it.
