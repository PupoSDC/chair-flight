- id: QG9H27EPX
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326205
  annexes: []
  learningObjectives:
    - "032.01"
  template:
    type: calculation
    question: >-
      Given the following information, calculate the thrust in a straight and
      steady power-on descent with a flight path angle of {{angle}}°.


      - Mass: {{mass}} kg

      - Lift: {{lift}} N

      - Drag: {{drag}} N

      - g: {{g}} m/s²
    variables:
      - id: mass
        label: Mass
        unit: kg
      - id: lift
        label: Lift
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: g
        label: g
        unit: m/s²
      - id: angle
        label: Descent angle
        unit: °
    answer:
      formula: drag - mass * g * sin(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: drag
      - id: d2
        formula: drag + mass * g * sin(angle)
      - id: d3
        formula: drag - mass * g * cos(angle)
      - id: d4
        formula: lift - drag
    presets:
      - id: p1
        values:
          mass: 9450
          lift: 92500
          drag: 93500
          g: 10
          angle: 30
      - id: p2
        values:
          mass: 8000
          lift: 78000
          drag: 70000
          g: 10
          angle: 20
    explanation: >-
      In a steady descent the weight component along the flight path, W
      sin(angle), acts forward, so thrust only has to supply the drag minus this
      component.


      **Solution**


      Weight = {{= mass * g}} N


      {{f: drag - mass * g * sin(angle)}} = {{n: drag - mass * g * sin(angle)}}
      = **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: ignores the weight component along the flight path (level
      flight thrust equals drag).

      - **{{d2}} N**: adds the weight component instead of subtracting it.

      - **{{d3}} N**: uses cos instead of sin of the flight path angle.

      - **{{d4}} N**: subtracts drag from lift, which has nothing to do with
      thrust.
