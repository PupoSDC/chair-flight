      Refer to figure or CAP698 file 4.1.


      A flight has been planned to operate at the maximum field-length limited
      take-off mass (FLLTOM).


      This was based upon the planned runway being 04 and the forecast wind to
      be light and variable.


      During the taxi, an aircraft just ahead was cleared to take-off and the
      reported wind was 270° (M)/20 kt.


      What observations should the flight crew raise given this updated wind?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: The aircraft performance should be re-calculated prior to take-off
          because there is now a tailwind of approximately 13 kt.
        wrongAnswers:
          - The departure can be continued because the planned take-off mass is
            based on a calculation that included the maximum tailwind.
          - The take-off can be commenced because the updated wind means that
            the new headwind has increased the take-off performance and
            therefore increased the maximum FLLTOM.
          - The approximate headwind of 15 kt means the aircraft should return
            to stand because the actual take-off distance has decreased and
            therefore the take-off mass can be increased.
        explanation: >-
          The wind of 270° is 130° away from runway 04 (040°), so the component
          is 20 × cos 130° = 13 kt of **tailwind**.


          The planned mass assumed light and variable wind, so the performance
          must be **re-calculated** before take-off.
