  template:
    type: calculation
    question: >-
      Given the following values, calculate the slope of runway 34 (positive =
      upslope, negative = downslope):


      - Runway 16: ASDA {{asda16}} m, TODA {{toda16}} m, TORA {{tora16}} m,
      threshold elevation {{e16}} ft

      - Runway 34: ASDA {{asda34}} m, TODA {{toda34}} m, TORA {{tora34}} m,
      threshold elevation {{e34}} ft
    variables:
      - id: asda16
        label: ASDA runway 16
        unit: m
      - id: toda16
        label: TODA runway 16
        unit: m
      - id: tora16
        label: TORA runway 16
        unit: m
      - id: e16
        label: Threshold elevation runway 16
        unit: ft
      - id: asda34
        label: ASDA runway 34
        unit: m
      - id: toda34
        label: TODA runway 34
        unit: m
      - id: tora34
        label: TORA runway 34
        unit: m
      - id: e34
        label: Threshold elevation runway 34
        unit: ft
    answer:
      formula: (e16 - e34) * 0.3048 / tora16 * 100
      unit: "%"
      decimals: 2
    distractors:
      - id: d1
        formula: (e16 - e34) * 0.3048 / tora34 * 100
      - id: d2
        formula: (e34 - e16) * 0.3048 / tora16 * 100
      - id: d3
        formula: (e34 - e16) * 0.3048 / tora34 * 100
      - id: d4
        formula: (e16 - e34) / tora16 * 100
    presets:
      - id: p1
        values:
          asda16: 1700
          toda16: 1800
          tora16: 1400
          e16: 146
          asda34: 1600
          toda34: 2000
          tora34: 1500
          e34: 34
      - id: p2
        values:
          asda16: 1900
          toda16: 2000
          tora16: 1600
          e16: 200
          asda34: 1800
          toda34: 2200
          tora34: 1700
          e34: 80
    explanation: >-
      Runway slope is the elevation difference between the two thresholds
      divided by the runway length, in percent. Runway 34 starts at the lower
      end here, so it slopes upward in the direction of take-off. Elevation
      difference must be converted from feet to metres.


      **Solution**


      {{f: (e16 - e34) * 0.3048 / tora16 * 100}} = {{n: (e16 - e34) * 0.3048 /
      tora16 * 100}} = **{{answer}} % upslope**


      **Why the other answers are wrong**


      - **{{d1}} %**: dividing by the TORA of runway 34 instead of the runway
      length.

      - **{{d2}} %**: wrong sign (upslope read as downslope).

      - **{{d3}} %**: wrong sign and wrong runway length.

      - **{{d4}} %**: forgetting to convert feet to metres.
