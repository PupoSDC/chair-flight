    - AVEXAM-52316
    - AVEXAM-75316
  annexes:
    - cap-698-page-52-figure-4.1
  learningObjectives:
    - "032.01"
  template:
    type: calculation
    question: The wind direction is {{wd}}°(M) and the runway direction is
      {{rwy}}°(M). With a maximum allowable tailwind component of {{tw}} kt,
      determine the maximum wind speed for take-off.
    variables:
      - id: wd
        label: Wind direction
        unit: °
      - id: rwy
        label: Runway direction
        unit: °
      - id: tw
        label: Maximum tailwind component
        unit: kt
    answer:
      formula: tw / abs(cos(wd - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tw * abs(cos(wd - rwy))
      - id: d2
        formula: floor(tw / abs(sin(wd - rwy)))
      - id: d3
        formula: tw
    presets:
      - id: p1
        values:
          wd: 180
          rwy: 60
          tw: 10
      - id: p2
        values:
          wd: 250
          rwy: 100
          tw: 10
      - id: p3
        values:
          wd: 210
          rwy: 80
          tw: 10
    explanation: >-
      The tailwind component is the wind speed multiplied by the cosine of the
      angle between the wind direction and the runway heading. To find the
      largest wind speed that keeps the tailwind at its limit, divide the limit
      by the absolute value of that cosine.


      **Solution**


      Angle between wind and runway = {{= wd - rwy}}°


      {{f: tw / abs(cos(wd - rwy))}} = {{n: tw / abs(cos(wd - rwy))}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: multiplies the limit by the cosine instead of dividing,
      which gives the tailwind component of a wind as strong as the limit.

      - **{{d2}} kt**: uses the sine (the crosswind relation) instead of the
      cosine.

      - **{{d3}} kt**: takes the limit itself as the wind speed, ignoring the
      angle.
