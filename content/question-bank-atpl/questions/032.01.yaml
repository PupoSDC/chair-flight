- id: QSFQGWGBJ
  docId: "032.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326647
  annexes: []
  learningObjectives:
    - 032.01.04.01.11
  template:
    type: calculation
    question: >-
      Given the following information, what is the all engine climb gradient for
      a two engine aeroplane?


      - Thrust per engine: {{thrust}} N

      - Mass: {{mass}} kg

      - Lift to drag ratio: {{ld}}:1


      Assume g = 10 m/s².
    variables:
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift to drag ratio
        unit: ""
    answer:
      formula: (2 * thrust / (mass * 10) - 1 / ld) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: 100 / ld
      - id: d2
        formula: (thrust / (mass * 10) - 1 / ld) * 100
      - id: d3
        formula: 2 * thrust / (mass * 10) * 100
    presets:
      - id: p1
        values:
          thrust: 118000
          mass: 67000
          ld: 9
      - id: p2
        values:
          thrust: 105000
          mass: 62000
          ld: 10
      - id: p3
        values:
          thrust: 125000
          mass: 70000
          ld: 8
    explanation: >-
      In a steady climb the gradient is the thrust-to-weight ratio minus the
      drag-to-weight ratio, which equals the total thrust divided by the weight
      minus 1/(L/D). With all engines operating, the thrust of both engines is
      used.


      **Solution**


      {{f: 2 * thrust / (mass * 10) - 1 / ld}} = {{n: 2 * thrust / (mass * 10) -
      1 / ld}}, i.e. **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: this is just 1/(L/D), the drag-to-weight term; the thrust
      is ignored.

      - **{{d2}} %**: uses the thrust of only one engine (that is the wrong
      ratio for an all-engines climb).

      - **{{d3}} %**: the total thrust-to-weight ratio without subtracting the
      drag term 1/(L/D).
