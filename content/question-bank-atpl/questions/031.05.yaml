- id: QAG3RTWZQ
  docId: "031.05"
  relatedQuestions:
    - QBFDXXAW
    - QGTORX3AO
  externalIds:
    - ATPLQ-313405
    - AVEXAM-12135
    - AVEXAM-38607
    - BGS-310791
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: >-
      A twin-engine aeroplane has an actual mass of {{mass}} kg.


      Its CG is located {{cg_cur}} m aft of the datum.


      How much mass must be transferred from a cargo compartment {{arm_from}} m
      aft of the datum to a compartment {{arm_to}} m aft of the datum to
      establish a CG at {{cg_tgt}} m aft of the datum?
    variables:
      - id: mass
        label: Aeroplane mass
        unit: kg
      - id: cg_cur
        label: Current CG position
        unit: m
      - id: cg_tgt
        label: Target CG position
        unit: m
      - id: arm_from
        label: Arm of the compartment losing mass
        unit: m
      - id: arm_to
        label: Arm of the compartment receiving mass
        unit: m
    answer:
      formula: mass * abs(cg_tgt - cg_cur) / abs(arm_to - arm_from)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mass * abs(cg_tgt - cg_cur) / arm_to
      - id: d2
        formula: mass * abs(cg_tgt - cg_cur) / arm_from
      - id: d3
        formula: mass * abs(cg_tgt - cg_cur) / (arm_to + arm_from)
      - id: d4
        formula: mass * abs(cg_tgt - cg_cur)
    presets:
      - id: p1
        values:
          mass: 6063
          cg_cur: 2.7
          cg_tgt: 2.8
          arm_from: 1.2
          arm_to: 4.1
      - id: p2
        values:
          mass: 5200
          cg_cur: 2.5
          cg_tgt: 2.65
          arm_from: 1.2
          arm_to: 4
      - id: p3
        values:
          mass: 7000
          cg_cur: 3
          cg_tgt: 3.1
          arm_from: 0.8
          arm_to: 4.4
    explanation: >-
      Shifting cargo between two compartments changes the total moment by mass x
      (distance between the arms). The CG shift equals that change divided by
      the total mass, so the mass to transfer is total mass x CG shift /
      distance between the compartments.


      **Solution**


      {{f: mass * abs(cg_tgt - cg_cur) / abs(arm_to - arm_from)}} = {{n: mass *
      abs(cg_tgt - cg_cur) / abs(arm_to - arm_from)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the arm of the receiving compartment is used as the
      distance.

      - **{{d2}} kg**: only the arm of the giving compartment is used as the
      distance.

      - **{{d3}} kg**: the arms are added instead of subtracted.

      - **{{d4}} kg**: the distance between the compartments is forgotten.
- id: QAOOCCQB
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317821
    - BGS-310786
    - AVEXAM-51590
    - AVEXAM-31249
    - BGS-310499
    - ATPLQ-316898
    - ATPLGS-129406
    - BGS-310482
    - ATPLQ-314369
    - AVEXAM-99025
    - BGS-310611
  annexes: []
  learningObjectives:
    - 031.05.03.02.02
  template:
    type: calculation
    question: >-
      An aircraft has a mass of {{m0}} kg with the CG at {{cg0}} m aft of the
      datum.


      An additional load of {{madd}} kg is loaded and the new CG is at {{cg1}} m
      aft of the datum.


      At what distance aft of the datum was the additional load placed?
    variables:
      - id: m0
        label: Mass before loading
        unit: kg
      - id: cg0
        label: CG before loading
        unit: m
      - id: madd
        label: Added load
        unit: kg
      - id: cg1
        label: New CG
        unit: m
    answer:
      formula: ((m0 + madd) * cg1 - m0 * cg0) / madd
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: (m0 * cg1 - m0 * cg0) / madd
      - id: d2
        formula: cg1
      - id: d3
        formula: ((m0 + madd) * cg1 - m0 * cg0) / m0
      - id: d4
        formula: (m0 * cg0 - (m0 + madd) * cg1) / madd
    presets:
      - id: p1
        values:
          m0: 6224.25
          cg0: 9.8
          madd: 144.75
          cg1: 9.9
      - id: p2
        values:
          m0: 5430
          cg0: 5.43
          madd: 210
          cg1: 5.56
      - id: p3
        values:
          m0: 7220
          cg0: 4.16
          madd: 170
          cg1: 4.31
    explanation: >-
      The moment of the aircraft after loading equals the moment before plus the
      moment of the added load. Solving for the arm of the added load gives the
      formula below.


      **Solution**


      New mass = {{= m0 + madd}} kg

      {{f: ((m0 + madd) * cg1 - m0 * cg0) / madd}} = {{n: ((m0 + madd) * cg1 -
      m0 * cg0) / madd}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: Forgets the added mass in the new total mass.

      - **{{d2}} m**: Assumes the load is placed at the new CG.

      - **{{d3}} m**: Divides the moment difference by the old mass instead of
      the added load.

      - **{{d4}} m**: Wrong sign: gives the arm forward of the datum.
