- id: QTMKVJA1F
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318106
    - AVEXAM-36188
    - BGS-310610
    - AVEXAM-4133
    - AVEXAM-91318
    - AVEXAM-86143
    - ATPLGS-127354
    - BGS-310284
    - ATPLGS-126654
    - ATPLGS-126734
    - BGS-310281
    - ATPLGS-113626
    - ATPLGS-107120
    - AVEXAM-22844
    - BGS-310737
    - BGS-310283
  annexes:
    - 031-blank-loading-manifest-light-twin
  learningObjectives:
    - 031.05.01.01.01
    - 031.05.02.02.02
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Determine the CG location at take-off in the following
      conditions:


      Basic empty mass: 3 210 lb

      One pilot: 160 lb

      Front seat passenger: 200 lb

      Centre seat passengers: 290 lb (total)

      One passenger rear seat: 110 lb

      Baggage in zone 1: 100 lb

      Baggage in zone 4: 50 lb


      - Zero Fuel Mass: {{zfm}} lb

      - Moment at Zero Fuel Mass: {{zfm_moment}} lb in

      - Block fuel: {{block}} US Gal

      - Trip fuel: {{trip}} US Gal

      - Fuel for start up and taxi: {{taxi}} US Gal

      - Fuel density: {{density}} lb/US Gal


      Fuel arm (value read from the figure): {{fuel_arm}} in
    variables:
      - id: zfm
        label: ZFM
        unit: lb
      - id: zfm_moment
        label: ZFM moment
        unit: lb in
      - id: block
        label: Block fuel
        unit: US Gal
      - id: trip
        label: Trip fuel
        unit: US Gal
      - id: taxi
        label: Taxi fuel
        unit: US Gal
      - id: density
        label: Fuel density
        unit: lb/US Gal
      - id: fuel_arm
        label: Fuel arm
        unit: in
    chartInputs:
      - zfm
      - zfm_moment
      - block
      - trip
      - taxi
      - density
      - fuel_arm
    answer:
      formula: (zfm_moment + (block - taxi) * density * fuel_arm) / (zfm + (block -
        taxi) * density)
      unit: inches aft of datum
      decimals: 2
    distractors:
      - id: d1
        formula: zfm_moment / zfm
      - id: d2
        formula: (zfm_moment + (trip + taxi) * density * fuel_arm) / (zfm + (trip +
          taxi) * density)
      - id: d3
        formula: fuel_arm
      - id: d4
        formula: (zfm_moment + block * density * fuel_arm) / (zfm + block * density)
    presets:
      - id: p1
        values:
          zfm: 4120
          zfm_moment: 377751
          block: 100
          trip: 55
          taxi: 3
          density: 6
          fuel_arm: 93.6
      - id: p2
        values:
          zfm: 4050
          zfm_moment: 369800
          block: 90
          trip: 50
          taxi: 4
          density: 6
          fuel_arm: 93.6
    explanation: >-
      The take-off CG is the total moment divided by the take-off mass. The zero
      fuel mass and its moment are already given, so only the take-off fuel
      (block fuel minus start-up and taxi fuel, converted to mass with the
      density) has to be added, using the fuel arm read from the figure.


      **Solution**


      Take-off fuel = {{block}} - {{taxi}} = {{= block - taxi}} US Gal = {{=
      (block - taxi) * density}} lb


      Take-off mass = {{zfm}} + {{= (block - taxi) * density}} = {{= zfm +
      (block - taxi) * density}} lb


      Take-off moment = {{zfm_moment}} + {{= (block - taxi) * density}} x
      {{fuel_arm}} = {{= zfm_moment + (block - taxi) * density * fuel_arm}} lb
      in


      CG = {{= zfm_moment + (block - taxi) * density * fuel_arm}} / {{= zfm +
      (block - taxi) * density}} = **{{answer}} inches aft of datum**


      **Why the other answers are wrong**


      - **{{d1}} inches**: this is the CG of the zero fuel mass only; the fuel
      was not added.

      - **{{d2}} inches**: trip fuel plus taxi fuel was used instead of block
      fuel minus taxi fuel.

      - **{{d3}} inches**: this is just the fuel arm, not the CG of the whole
      aeroplane.

      - **{{d4}} inches**: the full block fuel was loaded; the fuel burnt during
      start-up and taxi was not subtracted.
