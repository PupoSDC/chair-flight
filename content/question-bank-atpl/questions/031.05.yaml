- id: Q5Q9MOLNL
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318016
    - AVEXAM-9241
    - BGS-310822
    - BGS-310549
    - AVEXAM-88870
    - ATPLGS-126678
    - BGS-310685
    - ATPLGS-126750
    - AVEXAM-18200
    - BGS-310684
    - ATPLGS-126677
    - ATPLQ-316978
  annexes: []
  learningObjectives:
    - 031.05.01.01.01
  template:
    type: calculation
    question: A loaded aircraft has its Centre of Gravity (CG) {{cg}} inches forward
      of the datum, and its mass is {{mass}} lb. If a last minute load of
      {{add}} lb is added {{arm}} inches aft of the datum, what is the new
      position of the CG?
    variables:
      - id: cg
        label: CG forward of datum
        unit: in
      - id: mass
        label: Aircraft mass
        unit: lb
      - id: add
        label: Added load
        unit: lb
      - id: arm
        label: Added load arm aft of datum
        unit: in
    answer:
      formula: abs((arm * add - cg * mass) / (mass + add))
      unit: inches
      decimals: 2
    distractors:
      - id: d1
        formula: cg * mass / (mass + add)
      - id: d2
        formula: abs(arm * add / (mass + add) - cg)
      - id: d3
        formula: abs(-cg + (arm + cg) * add / mass)
      - id: d4
        formula: (cg * mass + arm * add) / (mass + add)
    presets:
      - id: p1
        values:
          cg: 48
          mass: 2966
          add: 128
          arm: 28
      - id: p2
        values:
          cg: 58
          mass: 2906
          add: 182
          arm: 23
      - id: p3
        values:
          cg: 52
          mass: 3050
          add: 140
          arm: 32
    explanation: >-
      The new CG is the total moment divided by the total mass. Taking distances
      aft of the datum as positive, a CG forward of the datum has a negative
      arm, so the initial moment is negative. A negative result means the CG is
      still forward of the datum.


      **Solution**


      Initial moment = -{{cg}} × {{mass}} = {{= -cg * mass}} lb·in

      Added moment = {{arm}} × {{add}} = {{= arm * add}} lb·in

      New mass = {{mass}} + {{add}} = {{= mass + add}} lb


      New CG = {{= (arm * add - cg * mass)}} / {{= mass + add}} = {{= (arm * add
      - cg * mass) / (mass + add)}} in, i.e. **{{answer}} inches forward of the
      datum**


      **Why the other answers are wrong**


      - **{{d1}} inches**: ignores the moment of the added load.

      - **{{d2}} inches**: uses the arm of the added load times the mass ratio
      as the shift and forgets to subtract the original CG position.

      - **{{d3}} inches**: divides the moment change by the original mass
      instead of the new mass.

      - **{{d4}} inches**: adds the two moments with the same sign, ignoring
      that the original CG is forward of the datum.
