  template:
    type: chart
    question: >2-
       Given the following information, calculate the CG position at landing:

      - Flight time: 2 hours

      - Estimated fuel flow: 1050 litres per hour

      - Fuel density: 0.79 kg/l


      The "Freight 2" will be dropped during flight within the scope of a rescue
      action.


      | Station | Mass (kg) | Arm (cm) | Moment (kgcm) |

      | --- | ---: | ---: | ---: |

      | Basic Empty Mass | 12,045 | +30 | +361,350 |

      | Crew | 145 | -160 | -23,200 |

      | Freight 1 | 570 | +200 | +114,000 |

      | Freight 2 | 410 | -40 | -16,400 |

      | Fuel | 6,045 | -8 | -48,360 |


      Calculate the CG position at landing.
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 24 cm aft of datum.
        wrongAnswers:
          - 25 cm in front of datum.
          - 27 cm aft of datum.
          - 22 cm aft of datum.
        explanation: >-
          Dropping a load and burning fuel both change the centre of gravity.
          The CG at landing is found from the loaded moments with the freight
          and the burned fuel taken out, using the arms shown in the figure.


          **Solution**


          - Fuel burned: 2 h × 1050 l/h × 0.79 kg/l = about 1 659 kg

          - With the freight and the burned fuel removed, the CG at landing is
          **24 cm aft of datum**.
- id: QBFDXXAW
  docId: "031.05"
  relatedQuestions:
    - QAG3RTWZQ
    - QGTORX3AO
  externalIds:
