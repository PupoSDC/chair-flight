- id: QQYRJZEH
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312573
    - AVEXAM-65028
  annexes:
    - cap-696-page-20-figure-2.5
  learningObjectives:
    - 031.05.01.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure or CAP 696 Figure 2.5. During dispatch you perform mass
      and balance calculations. Given the following information, what is the
      zero fuel mass CG position, in inches aft of the datum?


      - Basic empty mass: {{bem}} lb

      - Basic empty mass moment: {{bemm}} in·lb

      - Front seat occupant: {{fm}} lb, arm {{fa}} in

      - Aft seat occupant: {{am}} lb, arm {{aa}} in

      - Block fuel: {{fuel}} lb, arm {{fuela}} in


      Disregard start-up and taxi fuel.
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: bemm
        label: BEM moment
        unit: in·lb
      - id: fm
        label: Front seat occupant mass
        unit: lb
      - id: fa
        label: Front seat arm
        unit: in
      - id: am
        label: Aft seat occupant mass
        unit: lb
      - id: aa
        label: Aft seat arm
        unit: in
      - id: fuel
        label: Block fuel
        unit: lb
      - id: fuela
        label: Fuel arm
        unit: in
    chartInputs:
      - bem
      - bemm
      - fm
      - fa
      - am
      - aa
      - fuel
      - fuela
    answer:
      formula: (bemm + fm * fa + am * aa) / (bem + fm + am)
      unit: in
      decimals: 2
    distractors:
      - id: d1
        formula: (bemm + fm * fa + am * aa + fuel * fuela) / (bem + fm + am + fuel)
      - id: d2
        formula: (bemm + fm * fa + am * aa) / (bem + fm + am + fuel)
      - id: d3
        formula: (bemm + fm * fa) / (bem + fm)
      - id: d4
        formula: (fa + aa) / 2
    presets:
      - id: p1
        values:
          bem: 2415
          bemm: 187645.5
          fm: 200
          fa: 79
          am: 90
          aa: 117
          fuel: 600
          fuela: 70
      - id: p2
        values:
          bem: 2380
          bemm: 185000
          fm: 180
          fa: 80
          am: 120
          aa: 118
          fuel: 550
          fuela: 71
    explanation: >-
      The zero fuel mass (ZFM) is the basic empty mass plus the payload, without
      fuel. The ZFM CG is the sum of the moments divided by the ZFM.


      **Solution**


      ZFM = {{= bem + fm + am}} lb; moment = {{= bemm + fm * fa + am * aa}}
      in·lb


      {{f: (bemm + fm * fa + am * aa) / (bem + fm + am)}} = {{n: (bemm + fm * fa
      + am * aa) / (bem + fm + am)}} = **{{answer}} in**


      **Why the other answers are wrong**


      - **{{d1}} in**: includes the fuel, which gives the take-off (ramp) CG
      instead of the ZFM CG.

      - **{{d2}} in**: includes the fuel mass in the divisor but not its moment.

      - **{{d3}} in**: leaves out the aft seat occupant.

      - **{{d4}} in**: takes the plain average of the seat arms.
