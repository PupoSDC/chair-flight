- id: Q0LYLTXFZ
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317306
    - ATPLGS-107174
    - AVEXAM-40705
    - AVEXAM-19299
    - AVEXAM-4812
    - AVEXAM-93919
    - AVEXAM-33094
    - AVEXAM-12793
    - AVEXAM-53174
    - BGS-310307
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: >-
      A turbojet aeroplane has a planned take-off mass of {{tom}} kg. The cargo
      load is distributed as follows:


      - Cargo 1: {{c1}} kg ({{a1}} m from the reference point)

      - Cargo 4: {{c4}} kg ({{a4}} m from the reference point)


      The MAC length is {{mac}} m. After loading, the crew is informed that the
      CG at take-off is at {{cgold}} % MAC, which is beyond the limits. The
      captain redistributes part of the cargo between cargo 1 and cargo 4 to
      obtain a CG at {{cgnew}} % MAC. What is the new mass of cargo 1, in kg?
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: c1
        label: Cargo 1 initial mass
        unit: kg
      - id: a1
        label: Cargo 1 arm
        unit: m
      - id: c4
        label: Cargo 4 initial mass
        unit: kg
      - id: a4
        label: Cargo 4 arm
        unit: m
      - id: mac
        label: MAC length
        unit: m
      - id: cgold
        label: Initial CG
        unit: "% MAC"
      - id: cgnew
        label: Required CG
        unit: "% MAC"
    answer:
      formula: c1 + tom * (cgold - cgnew) / 100 * mac / (a4 - a1)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: c1 - tom * (cgold - cgnew) / 100 * mac / (a4 - a1)
      - id: d2
        formula: c4 + tom * (cgold - cgnew) / 100 * mac / (a4 - a1)
      - id: d3
        formula: c1 + tom * (cgold - cgnew) / 100 * mac / a4
      - id: d4
        formula: c1 + tom * (cgold - cgnew) / 100 * mac / (a4 + a1)
      - id: d5
        formula: c1 + tom * (cgold - cgnew) / 100 / (a4 - a1)
    presets:
      - id: p1
        values:
          tom: 190000
          c1: 3000
          a1: 3.5
          c4: 7000
          a4: 20.98
          mac: 4.6
          cgold: 38
          cgnew: 31
      - id: p2
        values:
          tom: 160000
          c1: 2000
          a1: 3
          c4: 8000
          a4: 21
          mac: 4.5
          cgold: 36
          cgnew: 30
    explanation: >-
      Moving a mass x from cargo 4 to cargo 1 shifts the CG forward by x * (arm4
      - arm1) / TOM. The required shift is the CG change in % MAC times the MAC
      length, so the transferred mass follows from equating both.


      **Solution**


      Required CG shift = ({{cgold}} - {{cgnew}}) % * {{mac}} = {{= (cgold -
      cgnew) / 100 * mac}} m


      Transferred mass = {{tom}} * {{= (cgold - cgnew) / 100 * mac}} / ({{a4}} -
      {{a1}}) = {{= tom * (cgold - cgnew) / 100 * mac / (a4 - a1)}} kg


      New cargo 1 = {{c1}} + transfer = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: moves the mass in the wrong direction (from cargo 1 to
      cargo 4).

      - **{{d2}} kg**: adds the transfer to cargo 4 instead of cargo 1.

      - **{{d3}} kg**: divides by the arm of cargo 4 instead of the distance
      between the two holds.

      - **{{d4}} kg**: divides by the sum of the arms instead of their
      difference.

      - **{{d5}} kg**: forgets to multiply by the MAC length.
- id: Q1FQZUANV
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311764
    - AVEXAM-12135
    - AVEXAM-38607
    - BGS-310791
    - ATPLQ-311593
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: >-
      Determine the mass that must be moved aft by a distance of {{dist}} m, in
      order to establish a CG at {{tgt}} m aft of the datum. Given:


      - Current CG position: {{cur}} m aft of the datum

      - Actual Take-off Mass: {{mass}} kg
    variables:
      - id: dist
        label: Distance moved
        unit: m
      - id: tgt
        label: Target CG
        unit: m
      - id: cur
        label: Current CG
        unit: m
      - id: mass
        label: Take-off mass
        unit: kg
    answer:
      formula: (tgt - cur) * mass / dist
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tgt
      - id: d2
        formula: mass * (tgt - cur)
      - id: d3
        formula: mass / (tgt * cur)
    presets:
      - id: p1
        values:
          dist: 2.9
          tgt: 2.9
          cur: 2.8
          mass: 6603
      - id: p2
        values:
          dist: 2.8
          tgt: 2.8
          cur: 2.7
          mass: 6630
      - id: p3
        values:
          dist: 2.6
          tgt: 2.6
          cur: 2.5
          mass: 5800
    explanation: >-
      Moving a mass over a distance shifts the total moment. The CG shift times
      the total mass must equal the moved mass times the distance it is moved,
      so the moved mass is the required CG shift multiplied by the aircraft mass
      and divided by the distance moved.


      **Solution**


      CG shift = {{tgt}} - {{cur}} = {{= tgt - cur}} m


      {{f: (tgt - cur) * mass / dist}} = {{n: (tgt - cur) * mass / dist}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: divides the distance moved by the target CG position,
      which has no physical meaning.

      - **{{d2}} kg**: multiplies the mass by the CG shift and forgets to divide
      by the distance moved.

      - **{{d3}} kg**: divides the mass by the product of the two CG positions
      instead of using the CG shift and the distance moved.
- id: Q1W5FPN2O
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312824
    - AVEXAM-74476
    - ATPLGS-126690
    - ATPLGS-627151
    - BGS-310480
    - ATPLQ-314691
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      An aircraft has its datum at the nose.


      The front seats are 65 inches aft of datum, the passenger seats are 105
      inches aft and the separate baggage compartment is 145 inches aft.


      The aft CG limit is {{limit}} inches aft.


      The current mass is {{mass}} lb.


      Three passengers are in the rear seats, with the baggage compartment full,
      and the front seat is empty.


      In this situation the CG is {{excess}} inches behind the aft limit.


      Ignoring maximum mass limits, how much extra ballast, in lb, must be
      secured in the front seat (arm {{arm}} inches) to bring the CG to the aft
      limit?
    variables:
      - id: limit
        label: Aft CG limit
        unit: in
      - id: mass
        label: Current mass
        unit: lb
      - id: excess
        label: CG excess behind the aft limit
        unit: in
      - id: arm
        label: Front seat arm
        unit: in
    answer:
      formula: mass * excess / (limit - arm)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mass * excess / (limit + excess - arm)
      - id: d2
        formula: mass * excess / arm
      - id: d3
        formula: mass * excess / limit
      - id: d4
        formula: mass * excess / (limit - excess - arm)
    presets:
      - id: p1
        values:
          limit: 147
          mass: 2750
          excess: 3
          arm: 65
      - id: p2
        values:
          limit: 149
          mass: 2570
          excess: 3
          arm: 65
    explanation: >-
      Adding ballast m at the front seat arm moves the CG forward. The new CG
      must equal the aft limit: (M * (limit + excess) + m * arm) / (M + m) =
      limit, which gives m = M * excess / (limit - arm).


      **Solution**


      {{f: mass * excess / (limit - arm)}} = {{n: mass * excess / (limit -
      arm)}} = {{= mass * excess / (limit - arm)}} lb, rounded: **{{answer}}
      lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: divides by the distance from the front seat to the
      current (out-of-limit) CG instead of to the limit.

      - **{{d2}} lb**: divides by the arm of the seat instead of the lever arm
      to the limit.

      - **{{d3}} lb**: divides by the aft limit instead of the lever arm.

      - **{{d4}} lb**: uses the lever arm to a point forward of the limit.
