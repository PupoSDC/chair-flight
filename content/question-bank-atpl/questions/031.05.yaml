  template:
    type: calculation
    question: The length of the MAC is {{mac}} inches, and the centre of gravity
      limits are {{lim}}% to 38% MAC. If the centre of gravity position is
      {{cg}}% MAC, how many inches is it out of limits?
    variables:
      - id: mac
        label: MAC length
        unit: in
      - id: lim
        label: Forward CG limit
        unit: "% MAC"
      - id: cg
        label: CG position
        unit: "% MAC"
    answer:
      formula: (lim - cg) / 100 * mac
      unit: inches
      decimals: 2
    distractors:
      - id: d1
        formula: lim / 100 * mac
      - id: d2
        formula: cg / 100 * mac
      - id: d3
        formula: (lim + cg) / 100 * mac
    presets:
      - id: p1
        values:
          mac: 114
          lim: 12
          cg: 10
      - id: p2
        values:
          mac: 128
          lim: 15
          cg: 12
      - id: p3
        values:
          mac: 102
          lim: 20
          cg: 16
    explanation: >-
      A CG position given in % MAC is a fraction of the mean aerodynamic chord.
      The distance out of limits is the difference between the limit and the CG
      in % MAC, converted to inches with the MAC length.


      **Solution**


      {{f: (lim - cg) / 100 * mac}} = {{n: (lim - cg) / 100 * mac}} =
      **{{answer}} inches**


      **Why the other answers are wrong**


      - **{{d1}} inches**: converts the whole forward limit percentage instead
      of the difference to the CG.

      - **{{d2}} inches**: converts the whole CG percentage instead of the
      difference to the limit.

      - **{{d3}} inches**: adds the CG and limit percentages instead of
      subtracting them.
