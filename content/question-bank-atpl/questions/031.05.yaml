- id: QZHHJVWF
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311287
    - ATPLGS-107174
    - AVEXAM-76447
    - AVEXAM-40705
    - AVEXAM-4812
    - BGS-310307
    - AVEXAM-92899
    - BGS-310306
  annexes:
    - 031-aeroplane-reference-datum-mac-and-cg-variables
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. An aeroplane has a planned Take-off Mass of {{tom}} kg
      with its Centre of Gravity at {{pct_old}}% MAC. The MAC length read from
      the figure is Y = {{y}} m (value read from the figure). The current cargo
      load is:


      - Front cargo: {{front}} kg

      - Rear cargo: {{rear}} kg


      For performance purposes, the captain decides to move the CG to
      {{pct_new}}% MAC by transferring cargo. The front and rear cargo
      compartments are located at {{arm_front}} m and {{arm_rear}} m from the
      reference point respectively. What is the new front cargo load (in kg)
      after the transfer?
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: pct_old
        label: Initial CG
        unit: "% MAC"
      - id: pct_new
        label: Required CG
        unit: "% MAC"
      - id: y
        label: "Y: MAC length"
        unit: m
      - id: front
        label: Front cargo
        unit: kg
      - id: rear
        label: Rear cargo
        unit: kg
      - id: arm_front
        label: Front hold arm
        unit: m
      - id: arm_rear
        label: Rear hold arm
        unit: m
    chartInputs:
      - y
    answer:
      formula: front - tom * (pct_new - pct_old) / 100 * y / (arm_rear - arm_front)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: front + tom * (pct_new - pct_old) / 100 * y / (arm_rear - arm_front)
      - id: d2
        formula: rear - tom * (pct_new - pct_old) / 100 * y / (arm_rear - arm_front)
      - id: d3
        formula: rear + tom * (pct_new - pct_old) / 100 * y / (arm_rear - arm_front)
      - id: d4
        formula: front - tom * (pct_new - pct_old) / 100 * y / (arm_rear - arm_front) /
          2
    presets:
      - id: p1
        values:
          tom: 200000
          pct_old: 30
          pct_new: 33
          y: 4.6
          front: 6500
          rear: 4000
          arm_front: 15
          arm_rear: 25
      - id: p2
        values:
          tom: 150000
          pct_old: 28
          pct_new: 31
          y: 4.6
          front: 7000
          rear: 3000
          arm_front: 15
          arm_rear: 25
    explanation: >-
      A CG shift is produced by moving mass between holds: mass moved times the
      distance between the holds equals total mass times the CG shift. The CG
      shift in metres is the %MAC change times the MAC length.


      **Solution**


      CG shift = {{= (pct_new - pct_old) / 100 * y}} m


      Mass transferred = {{f: tom * (pct_new - pct_old) / 100 * y / (arm_rear -
      arm_front)}} = {{= tom * (pct_new - pct_old) / 100 * y / (arm_rear -
      arm_front)}} kg


      New front cargo = {{front}} - {{= tom * (pct_new - pct_old) / 100 * y /
      (arm_rear - arm_front)}} = **{{answer}} kg** (rear cargo then becomes {{=
      rear + tom * (pct_new - pct_old) / 100 * y / (arm_rear - arm_front)}} kg)


      **Why the other answers are wrong**


      - **{{d1}} kg**: the cargo is moved in the wrong direction (forward
      instead of aft).

      - **{{d2}} kg**: the rear cargo minus the transferred mass; the wrong
      compartment and direction are used.

      - **{{d3}} kg**: this is the new rear cargo load, not the front cargo
      load.

      - **{{d4}} kg**: only half of the required mass is transferred.
