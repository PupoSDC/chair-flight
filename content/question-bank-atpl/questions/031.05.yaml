      How many pounds have to be loaded in that compartment?
    variables:
      - id: m
        label: Aircraft mass
        unit: lb
      - id: cg
        label: Current CG
        unit: in
      - id: tgt
        label: Target CG (or limit)
        unit: in
      - id: arm
        label: Compartment arm
        unit: in
    answer:
      formula: m * abs(cg - tgt) / abs(arm - tgt)
      unit: lb
      decimals: 2
    distractors:
      - id: d1
        formula: m * abs(cg - tgt) / abs(arm - cg)
      - id: d2
        formula: m * abs(cg - tgt) / arm
      - id: d3
        formula: m * abs(cg - tgt) / (arm + tgt)
      - id: d4
        formula: abs(cg - tgt) * abs(arm - tgt) / m
    presets:
      - id: p1
        values:
          m: 3800
          cg: 95
          tgt: 93
          arm: 22.5
      - id: p2
        values:
          m: 5000
          cg: 80
          tgt: 80.5
          arm: 150
    explanation: >-
      Moment balance: the mass x added at the arm shifts the CG, so (m + x) x
      tgt = m x cg + x x arm. Solving for x gives x = m x (cg - tgt) / (tgt -
      arm) in absolute terms.


      **Solution**


      {{f: m * abs(cg - tgt) / abs(arm - tgt)}} = {{n: m * abs(cg - tgt) /
      abs(arm - tgt)}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: Uses the distance from the compartment to the current CG
      instead of to the target CG.

      - **{{d2}} lb**: Divides by the arm instead of the lever arm relative to
      the target CG.

      - **{{d3}} lb**: Adds the target CG to the arm instead of subtracting.

      - **{{d4}} lb**: Wrong combination of the terms (arm distance times CG
      shift divided by mass).
