    question: >-
      Is it allowed to fly under otherwise identical conditions if a pilot is
      weighing 10 kg more than given?


      _Assume that the datum is located in front of the aircraft._


      | Item | Mass (kg) | Distance aft of the datum (m) |

      | --- | --- | --- |

      | Empty mass | 1 050 | 3.2 |

      | Pilot and copilot or front passengers | 140 | 1.44 |

      | Rear passengers | 220 | 2.29 |

      | Cargo (passenger floor) | - | 2.31 |

      | Cargo (passenger foot rest) | - | 1.70 |

      | Hold | - | 3.04 |

      | Fuel (mean centring) | 276 | 3.12 |


      _Forward limit: 2.80 m aft of datum; aft limit: 3.15 m aft of datum._
    explanation: ""
