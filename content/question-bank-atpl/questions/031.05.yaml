      | Item | Mass (lbs) | Arm aft of datum (in) | Moment + 100 (in.lbs) |

      | --- | ---: | ---: | ---: |

      | Basic Empty Mass |  | 88.6 |  |

      | Pilot and Front Passenger | 120 | 85.6 |  |

      | Passengers (Center) | 390 | 118.2 |  |

      | Passengers (Aft) |  | 158.0 |  |

