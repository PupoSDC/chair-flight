- id: QPJS8QATZ
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317534
    - AVEXAM-74476
    - ATPLGS-126690
    - ATPLGS-627151
    - BGS-310480
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      An aircraft has its datum at the nose.


      The front seats are {{front_arm}} inches aft of datum, the passenger seats
      are {{pass_arm}} inches aft and the separate baggage compartment is 145
      inches aft.


      The aft limit is {{limit}} inches aft.


      The current mass is {{mass}} lb.


      Three passengers are in the rear seats, with the baggage compartment full,
      and they all want to sit together so the front seat is empty.


      However, the pilot is very light and, in this situation, the Centre of
      Gravity (CG) of the aircraft is {{excess}} inches behind the aft limit.


      Ignoring maximum mass limits, how much extra ballast must be secured in
      the front seat to bring the CG to the authorised limit?
    variables:
      - id: front_arm
        label: Front seat arm
        unit: in
      - id: pass_arm
        label: Passenger seat arm
        unit: in
      - id: limit
        label: Aft CG limit
        unit: in
      - id: mass
        label: Current mass
        unit: lb
      - id: excess
        label: CG excess behind limit
        unit: in
    answer:
      formula: mass * excess / (limit - front_arm)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mass * excess / front_arm
      - id: d2
        formula: mass * excess / (limit + excess - front_arm)
      - id: d3
        formula: mass * excess / (limit - pass_arm)
      - id: d4
        formula: mass * excess / (pass_arm - front_arm)
    presets:
      - id: p1
        values:
          front_arm: 65
          pass_arm: 105
          limit: 157
          mass: 2570
          excess: 3
      - id: p2
        values:
          front_arm: 65
          pass_arm: 105
          limit: 147
          mass: 2750
          excess: 3
      - id: p3
        values:
          front_arm: 65
          pass_arm: 105
          limit: 150
          mass: 2400
          excess: 3
    explanation: >-
      Ballast added at the front seat moves the CG forward. Taking moments about
      the datum, the new CG must equal the aft limit: (mass x (limit + excess) +
      ballast x front arm) / (mass + ballast) = limit. Solving for the ballast
      gives the formula below.


      **Solution**


      The CG is currently {{= limit + excess}} in aft of datum.


      {{f: mass * excess / (limit - front_arm)}} = {{n: mass * excess / (limit -
      front_arm)}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: divided by the front seat arm instead of the distance
      from the front seat to the limit.

      - **{{d2}} lb**: used the distance from the front seat to the current CG
      instead of to the limit.

      - **{{d3}} lb**: used the distance from the passenger seats to the limit.

      - **{{d4}} lb**: used the arm difference between passenger and front
      seats.
- id: QPOJAMWI
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315908
    - AVEXAM-78691
    - ATPLGS-107188
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: >-
      An aircraft has a loaded mass of {{mass}} lb.


      The CG is {{cg}} inches aft of the datum.


      A passenger, mass {{pax}} lb, moves aft from row 1 to row 3, a distance of
      {{dist}} inches.


      What will be the new position of the CG, in inches aft of the datum?
    variables:
      - id: mass
        label: Loaded mass
        unit: lb
      - id: cg
        label: Initial CG
        unit: in
      - id: pax
        label: Passenger mass
        unit: lb
      - id: dist
        label: Distance moved aft
        unit: in
    answer:
      formula: cg + pax * dist / mass
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: cg - pax * dist / mass
      - id: d2
        formula: pax * dist / mass
      - id: d3
        formula: cg + 2 * pax * dist / mass
      - id: d4
        formula: cg + pax * dist / 1000
    presets:
      - id: p1
        values:
          mass: 5500
          cg: 22
          pax: 150
          dist: 70
      - id: p2
        values:
          mass: 4200
          cg: 30
          pax: 120
          dist: 60
      - id: p3
        values:
          mass: 6000
          cg: 25
          pax: 200
          dist: 50
    explanation: >-
      Moving a mass within the aircraft does not change the total mass; the CG
      shifts by the mass moved times the distance, divided by the total mass.


      **Solution**


      {{f: cg + pax * dist / mass}} = {{n: cg + pax * dist / mass}} =
      **{{answer}} in**


      **Why the other answers are wrong**


      - **{{d1}} in**: the shift is subtracted (CG moved forward instead of
      aft).

      - **{{d2}} in**: only the shift is given, the original CG is forgotten.

      - **{{d3}} in**: the shift is doubled.

      - **{{d4}} in**: wrong divisor (1000 instead of the aircraft mass).
