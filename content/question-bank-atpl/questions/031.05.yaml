  template:
    type: chart
    question: >-
      An aeroplane should have been loaded so as to give a TOM of 57 600 kg and
      a CG located 646 inches aft of datum (CG limits are from 640 inches to 661
      inches aft of datum).


      However, the ground crew incorrectly loaded 900 kg of baggage into the
      rear cargo hold instead of the front.


      If the distance between the front cargo hold and the rear cargo hold is
      517 inches, is the new CG still within limits?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Yes, it is within limits.
        wrongAnswers:
          - No, it is out of the rear limit.
          - Yes, it has moved forward and is within limits.
          - No, it is out of the forward limit.
        explanation: Moving 900 kg backwards by 517 inches shifts the centre of gravity
          by 900 × 517 ÷ 57 600 = 8.1 inches aft. The new position is 646 + 8.1
          = 654.1 inches, between 640 and 661 inches, so it is **within
          limits**.
- id: QLODIYGX
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314728
    - BGS-310760
    - AVEXAM-86685
  annexes:
    - 031-cargo-holds-diagram-of-a-jet-transport
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: chart
    question: >-
      Refer to figure. For take-off performance purposes, you need to establish
      a CG position at take-off at 798 inches aft of the datum.


      - Current CG position: 780 inches aft of the datum

      - Actual take-off mass: 48 700 lb

      - Box X: 1185 inches aft of the datum, in hold 5

      - Box Z: 180 inches aft of the datum, in hold 1

      - Both boxes have a mass of 880 lb


      Consider the fuel consumption from engine start to take-off negligible.


      Which one of the two boxes must be moved, and into which hold?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Box Z must be moved to hold 5.
        wrongAnswers:
          - Box X must be moved to hold 1.
          - Box Z must be moved to hold 4.
          - Box X must be moved to hold 4.
        explanation: >-
          Moving a box changes the CG by its mass times the distance it moves,
          divided by the total mass. Box Z is 180 in aft of the datum, so moving
          it to hold 5, which lies at 1185 in aft of the datum, adds 880 lb ×
          1005 in = 884 400 lb in, moving the CG by about 18.2 in aft to about
          798 in.


          **Solution**


          - Box Z moved to hold 5: CG about 780 + 18.2 = **798 in aft of the
          datum**, the required position.

          - Box X moved to hold 1 would move the CG forward to about 762 in, the
          wrong direction.


          So **Box Z must be moved to hold 5.**
