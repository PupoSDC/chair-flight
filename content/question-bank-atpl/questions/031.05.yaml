- id: Q4VWAZVE1
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317664
    - ATPLGS-126598
    - ATPLGS-107166
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      An aircraft has three holds situated 10 inches, 100 inches and 250 inches
      aft of the datum, identified as holds A, B and C respectively.


      The total aircraft mass is {{mass}} kg and the CG is {{cg}} inches aft of
      the datum.


      The CG limits are from {{fwdlim}} inches to {{cg}} inches aft of the
      datum.


      How much load must be removed from hold C ({{arm}} inches aft of the
      datum) to ensure that the CG is positioned on the forward limit?
    variables:
      - id: mass
        label: Total aircraft mass
        unit: kg
      - id: cg
        label: Current CG
        unit: in
      - id: fwdlim
        label: Forward CG limit
        unit: in
      - id: arm
        label: Arm of hold C
        unit: in
    answer:
      formula: mass * (cg - fwdlim) / (arm - fwdlim)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mass * (cg - fwdlim) / arm
      - id: d2
        formula: mass * (cg - fwdlim) / (arm - cg)
      - id: d3
        formula: mass * (cg - fwdlim) / (arm + fwdlim)
      - id: d4
        formula: mass * (arm - fwdlim) / (arm - cg)
    presets:
      - id: p1
        values:
          mass: 3500
          cg: 70
          fwdlim: 40
          arm: 250
      - id: p2
        values:
          mass: 4000
          cg: 80
          fwdlim: 60
          arm: 300
      - id: p3
        values:
          mass: 2800
          cg: 55
          fwdlim: 45
          arm: 205
    explanation: >-
      Removing a mass m at arm a from an aircraft of mass M moves the CG to
      (M·CG − m·a)/(M − m). Setting this equal to the forward limit and solving
      for m gives m = M·(CG − limit)/(a − limit).


      **Solution**


      {{f: mass * (cg - fwdlim) / (arm - fwdlim)}} = {{n: mass * (cg - fwdlim) /
      (arm - fwdlim)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the arm is used instead of the lever arm relative to the
      forward limit.

      - **{{d2}} kg**: the arm of the hold is referenced to the current CG
      instead of the target CG.

      - **{{d3}} kg**: the forward limit is added instead of subtracted in the
      denominator.

      - **{{d4}} kg**: numerator and denominator terms are mixed up.
