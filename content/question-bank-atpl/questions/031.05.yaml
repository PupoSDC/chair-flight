- id: QIIOHMQW
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313533
    - AVEXAM-11473
    - AVEXAM-95066
    - BGS-310304
    - BGS-310311
    - ATPLGS-107187
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      The total mass of an aeroplane is {{m}} kg with the CG at {{cg}} m aft of
      the datum.


      The CG limits are between {{fwd}} m and {{aft}} m aft of the datum.


      How much mass must be removed from the rear hold ({{arm}} m aft of the
      datum) to move the CG to the middle of the limits?
    variables:
      - id: m
        label: Total mass
        unit: kg
      - id: cg
        label: Current CG
        unit: m
      - id: fwd
        label: Forward CG limit
        unit: m
      - id: aft
        label: Aft CG limit
        unit: m
      - id: arm
        label: Rear hold arm
        unit: m
    answer:
      formula: m * (cg - (fwd + aft) / 2) / (arm - (fwd + aft) / 2)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: m * (cg - aft) / (arm - aft)
      - id: d2
        formula: m * (cg - fwd) / (arm - fwd)
      - id: d3
        formula: m * (cg - (fwd + aft) / 2) / arm
      - id: d4
        formula: m * (cg - (fwd + aft) / 2) / (arm - cg)
    presets:
      - id: p1
        values:
          m: 112000
          cg: 22.62
          fwd: 18
          aft: 22
          arm: 30
      - id: p2
        values:
          m: 90000
          cg: 23.1
          fwd: 18
          aft: 22
          arm: 28
      - id: p3
        values:
          m: 100000
          cg: 22.5
          fwd: 17
          aft: 21
          arm: 30
    explanation: >-
      The target CG is the mid-point of the limits. Removing mass x at the hold
      arm moves the CG: m x cg - x x arm = (m - x) x target, so x = m x (cg -
      target) / (arm - target).


      **Solution**


      Target CG = {{= (fwd + aft) / 2}} m

      {{f: m * (cg - (fwd + aft) / 2) / (arm - (fwd + aft) / 2)}} = {{n: m * (cg
      - (fwd + aft) / 2) / (arm - (fwd + aft) / 2)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Moves the CG to the aft limit instead of the middle.

      - **{{d2}} kg**: Moves the CG to the forward limit instead of the middle.

      - **{{d3}} kg**: Divides by the hold arm instead of its distance from the
      target CG.

      - **{{d4}} kg**: Uses the distance from the hold to the current CG instead
      of the target.
