- id: QJWKSPMK
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318801
    - BGS-310308
    - BGS-310301
    - AVEXAM-68635
    - AVEXAM-57321
    - ATPLGS-107152
    - AVEXAM-42505
    - BGS-310608
    - ATPLQ-319967
    - AVEXAM-12135
    - AVEXAM-38607
    - BGS-310791
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: An aeroplane has a take-off mass of {{tom}} kg and its centre of
      gravity is located {{cg_cur}} m aft of the datum. Calculate the mass that
      must be moved aft by a distance of {{dist}} m in order to move the CG to
      {{cg_tgt}} m aft of the datum.
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: cg_cur
        label: Current CG position
        unit: m
      - id: cg_tgt
        label: Target CG position
        unit: m
      - id: dist
        label: Distance the mass is moved
        unit: m
    answer:
      formula: tom * abs(cg_tgt - cg_cur) / dist
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom * abs(cg_tgt - cg_cur) / (2 * dist)
      - id: d2
        formula: tom * abs(cg_tgt - cg_cur) / (dist + cg_cur)
      - id: d3
        formula: tom * abs(cg_tgt - cg_cur) * dist
      - id: d4
        formula: tom * abs(cg_tgt - cg_cur) / (dist - abs(cg_tgt - cg_cur))
    presets:
      - id: p1
        values:
          tom: 12500
          cg_cur: 4.2
          cg_tgt: 4.5
          dist: 15
      - id: p2
        values:
          tom: 6030
          cg_cur: 2.8
          cg_tgt: 2.9
          dist: 2.9
      - id: p3
        values:
          tom: 9000
          cg_cur: 3.1
          cg_tgt: 3.4
          dist: 12
    explanation: >-
      Moving a mass over a distance changes the total moment, so the CG moves by
      (mass moved x distance) / total mass. Rearranged, the mass to move equals
      the total mass times the required CG shift divided by the distance over
      which it is moved.


      **Solution**


      {{f: tom * abs(cg_tgt - cg_cur) / dist}} = {{n: tom * abs(cg_tgt - cg_cur)
      / dist}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the CG shift is divided by twice the distance moved.

      - **{{d2}} kg**: the distance moved is wrongly added to the current CG
      position.

      - **{{d3}} kg**: the CG shift is multiplied by the distance instead of
      divided.

      - **{{d4}} kg**: the CG shift is wrongly subtracted from the distance
      moved.
