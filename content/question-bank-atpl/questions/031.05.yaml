- id: QMLSZJVJB
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315446
    - AVEXAM-34836
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      You are operating a light aircraft for humanitarian operations.


      Today, you will transport food parcels of {{parcel}} kg each, stored in
      the cargo bay with a CG of {{arm}} m aft of the datum line.


      Before loading the cargo, the total mass of the aircraft is {{mass}} kg
      and its CG is {{cg}} m aft of the datum line.


      To be within the aft CG limit of {{lim}} m, what is the maximum number of
      food parcels you can load today?
    variables:
      - id: parcel
        label: Parcel mass
        unit: kg
      - id: arm
        label: Cargo bay arm
        unit: m
      - id: mass
        label: Aircraft mass
        unit: kg
      - id: cg
        label: Initial CG
        unit: m
      - id: lim
        label: Aft CG limit
        unit: m
    answer:
      formula: floor(mass * (lim - cg) / (arm - lim) / parcel)
      unit: parcels
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(mass * (lim - cg) / (arm - lim) / parcel)
      - id: d2
        formula: floor(mass * (lim - cg) / (arm - lim) / parcel) - 1
      - id: d3
        formula: floor(mass * (lim - cg) / (arm - lim) / parcel) - 2
    presets:
      - id: p1
        values:
          parcel: 10
          arm: 7.8
          mass: 3645
          cg: 5.62
          lim: 5.7
      - id: p2
        values:
          parcel: 12
          arm: 8.2
          mass: 4120
          cg: 6.1
          lim: 6.2
    explanation: >-
      Loading cargo moves the CG towards the cargo arm. Setting the new CG equal
      to the aft limit, (mass × CG + m × arm) / (mass + m) = limit, gives the
      maximum cargo mass m. The number of parcels must be a whole number, so it
      is rounded down.


      **Solution**


      m = mass × (limit - CG) / (arm - limit) = {{= mass * (lim - cg) / (arm -
      lim)}} kg


      Number of parcels = {{= mass * (lim - cg) / (arm - lim)}} / {{parcel}} =
      {{= mass * (lim - cg) / (arm - lim) / parcel}} → **{{answer}} parcels**


      **Why the other answers are wrong**


      - **{{d1}} parcels**: rounds the result up, which would put the CG beyond
      the aft limit.

      - **{{d2}} parcels**: rounds down and then removes one parcel
      unnecessarily.

      - **{{d3}} parcels**: rounds down and then removes two parcels
      unnecessarily.
- id: QMNVRBLP
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317949
    - BGS-310741
    - ATPLGS-113592
    - ATPLQ-312003
    - AVEXAM-52511
  annexes:
    - load-trim-cg-envelope-chart
  learningObjectives:
    - 031.05.02.04.04
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (index chart). Given the following indexes and masses,
      determine the take-off CG position as % MAC.


      - Dry operating index and mass: {{doi}} and {{dom}} kg

      - Passenger load index and mass: {{pi}} and {{pm}} kg

      - Cargo load index and mass: {{ci}} and {{cm}} kg

      - Take-off fuel index and mass: {{fi}} and {{fm}} kg


      The total index is the sum of the four indices. The CG in % MAC read from
      the chart at the total mass and total index is {{cgchart}}%.
    variables:
      - id: doi
        label: Dry operating index
        unit: ""
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: pi
        label: Passenger index
        unit: ""
      - id: pm
        label: Passenger mass
        unit: kg
      - id: ci
        label: Cargo index
        unit: ""
      - id: cm
        label: Cargo mass
        unit: kg
      - id: fi
        label: Take-off fuel index
        unit: ""
      - id: fm
        label: Take-off fuel mass
        unit: kg
      - id: cgchart
        label: CG read from the chart
        unit: "% MAC"
    chartInputs:
      - cgchart
    answer:
      formula: cgchart
      unit: "% MAC"
      decimals: 1
    distractors:
      - id: d1
        formula: doi + pi + ci + fi
      - id: d2
        formula: cgchart - 4
      - id: d3
        formula: cgchart + 4
      - id: d4
        formula: cgchart * 1.5
    presets:
      - id: p1
        values:
          doi: 50
          dom: 35000
          pi: -1.56
          pm: 11508
          ci: 1.45
          cm: 1248
          fi: 10.94
          fm: 7800
          cgchart: 24
      - id: p2
        values:
          doi: 54
          dom: 39000
          pi: -2.21
          pm: 10715
          ci: 1.95
          cm: 3355
          fi: 11.84
          fm: 8900
          cgchart: 25
    explanation: >-
      The total index is the sum of the dry operating index and the load
      indices. The total mass and the total index are then entered in the index
      chart of the load sheet, from which the CG in % MAC is read.


      **Solution**


      Total index = {{f: doi + pi + ci + fi}} = {{n: doi + pi + ci + fi}} = {{=
      doi + pi + ci + fi}}


      Total mass = {{= dom + pm + cm + fm}} kg


      CG read from the chart at this mass and index: **{{answer}} % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: the total index is mistaken for the CG position.

      - **{{d2}} % MAC**: the chart is misread (point read too far forward).

      - **{{d3}} % MAC**: the chart is misread (point read too far aft).

      - **{{d4}} % MAC**: the chart is misread by a large amount.
- id: QMOQCGAL
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319304
    - BGS-310308
    - AVEXAM-68635
    - AVEXAM-57321
    - AVEXAM-42505
    - AVEXAM-92899
    - ATPLGS-107169
    - ATPLQ-312033
    - AVEXAM-21164
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: >-
      The mean aerodynamic chord (MAC) is {{mac}} m long.


      The moment arm of the forward hold is {{arm_from}} m and that of the aft
      hold is {{arm_to}} m.


      The aircraft mass is {{mass}} kg and its CG is at {{cg_from}} % MAC.


      Which mass has to be transferred from the forward to the aft hold to move
      the CG to {{cg_to}} % MAC?
    variables:
      - id: mass
        label: Aircraft mass
        unit: kg
      - id: mac
        label: MAC length
        unit: m
      - id: cg_from
        label: Current CG
        unit: "% MAC"
      - id: cg_to
        label: Target CG
        unit: "% MAC"
      - id: arm_from
        label: Arm of the forward hold
        unit: m
      - id: arm_to
        label: Arm of the aft hold
        unit: m
    answer:
      formula: mass * (cg_to - cg_from) / 100 * mac / (arm_to - arm_from)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mass * (cg_to - cg_from) / 100 * mac / abs(arm_to + arm_from)
      - id: d2
        formula: mass * (cg_to - cg_from) / 100 * mac / arm_to
      - id: d3
        formula: mass * (cg_to - cg_from) / 100 * (arm_to - arm_from) / mac
      - id: d4
        formula: mass * (cg_to - cg_from) * mac / (arm_to - arm_from)
    presets:
      - id: p1
        values:
          mass: 2200
          mac: 1
          cg_from: 25
          cg_to: 40
          arm_from: -0.5
          arm_to: 2.5
      - id: p2
        values:
          mass: 22000
          mac: 7.5
          cg_from: 25
          cg_to: 40
          arm_from: -4.5
          arm_to: 2.75
      - id: p3
        values:
          mass: 3000
          mac: 2
          cg_from: 20
          cg_to: 30
          arm_from: -1
          arm_to: 3
    explanation: >-
      A CG shift in % MAC is first converted into a length by multiplying by the
      MAC length. The mass to move is then the total mass times that CG shift
      divided by the distance between the two holds.


      **Solution**


      CG shift = ({{cg_to}} - {{cg_from}}) / 100 x {{mac}} m = {{= (cg_to -
      cg_from) / 100 * mac}} m


      {{f: mass * (cg_to - cg_from) / 100 * mac / (arm_to - arm_from)}} = {{n:
      mass * (cg_to - cg_from) / 100 * mac / (arm_to - arm_from)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the arms are added instead of subtracted.

      - **{{d2}} kg**: only the arm of the aft hold is used as the distance.

      - **{{d3}} kg**: the MAC and the hold distance are swapped (inverted
      ratio).

      - **{{d4}} kg**: the CG shift in % MAC is not divided by 100.
