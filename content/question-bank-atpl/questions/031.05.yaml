    - BGS-310283
  annexes:
    - 031-blank-loading-manifest-light-twin
  learningObjectives:
    - 031.05.02.02.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Determine the total moment at landing for a light
      aeroplane in the following conditions:


      - Total moment at take-off: {{tomom}} lb in

      - Trip fuel: {{trip}} US gal

      - Fuel density: {{dens}} lb/US gal

      - Arm of the fuel tanks (read from the figure): {{arm}} in
    variables:
      - id: tomom
        label: Total moment at take-off
        unit: lb in
      - id: trip
        label: Trip fuel
        unit: US gal
      - id: dens
        label: Fuel density
        unit: lb/US gal
      - id: arm
        label: Fuel arm (read from the figure)
        unit: in
    chartInputs:
      - arm
    answer:
      formula: tomom - trip * dens * arm
      unit: lb in
      decimals: 0
    distractors:
      - id: d1
        formula: tomom + trip * dens * arm
      - id: d2
        formula: tomom - trip * arm
      - id: d3
        formula: tomom - trip * dens
      - id: d4
        formula: tomom - 2 * trip * dens * arm
    presets:
      - id: p1
        values:
          tomom: 432226
          trip: 55
          dens: 6
          arm: 93.6
      - id: p2
        values:
          tomom: 410000
          trip: 40
          dens: 6
          arm: 95
      - id: p3
        values:
          tomom: 365000
          trip: 30
          dens: 6
          arm: 90
    explanation: >-
      The landing moment is the take-off moment minus the moment of the fuel
      burned on the trip. The fuel moment is the fuel mass (volume × density)
      times the fuel arm, which is read from the figure.


      **Solution**


      Trip fuel mass = {{= trip * dens}} lb


      {{f: tomom - trip * dens * arm}} = {{n: tomom - trip * dens * arm}} =
      **{{answer}} lb in**


      **Why the other answers are wrong**


      - **{{d1}} lb in**: the fuel moment is added instead of subtracted.

      - **{{d2}} lb in**: the fuel density is forgotten (gallons used as
      pounds).

      - **{{d3}} lb in**: the arm is forgotten.

      - **{{d4}} lb in**: the fuel moment is subtracted twice.
