      Refer to the figure (index table of the load and trim sheet).


      For a flight, the Dry Operating Mass (DOM) is {{dom}} kg and the
      associated Dry Operating Index (DOI) is {{doi}}.


      One crew member is added and some catering is changed, as read on the load
      sheet.


      Using the figure, the net index change of these two changes is {{di}}
      (value read from the figure).


      What is the new DOI?
    variables:
