- id: QGTORX3AO
  docId: "031.05"
  relatedQuestions:
    - QAG3RTWZQ
    - QBFDXXAW
  externalIds:
    - ATPLQ-315453
    - BGS-310779
    - ATPLQ-315820
    - ATPLGS-126711
    - ATPLGS-107162
    - AVEXAM-76317
    - AVEXAM-96815
    - BGS-310300
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: The Take-Off Mass of an aircraft is {{mass}} kg and the CG is at
      station {{cg_cur}}. How much baggage must be moved from the rear cargo bay
      (station {{arm_from}}) to the forward cargo bay (station {{arm_to}}) in
      order to bring the CG to station {{cg_tgt}}?
    variables:
      - id: mass
        label: Take-off mass
        unit: kg
      - id: cg_cur
        label: Current CG station
        unit: in
      - id: cg_tgt
        label: Target CG station
        unit: in
      - id: arm_from
        label: Station of the rear cargo bay
        unit: in
      - id: arm_to
        label: Station of the forward cargo bay
        unit: in
    answer:
      formula: mass * abs(cg_cur - cg_tgt) / abs(arm_from - arm_to)
      unit: kg
      decimals: 1
    distractors:
      - id: d1
        formula: mass * abs(cg_cur - cg_tgt) / arm_from
      - id: d2
        formula: mass * abs(cg_cur - cg_tgt) / (arm_from + arm_to)
      - id: d3
        formula: mass * abs(cg_cur - cg_tgt) / arm_to
      - id: d4
        formula: mass * abs(cg_cur - cg_tgt) / abs(arm_from - cg_cur)
    presets:
      - id: p1
        values:
          mass: 16800
          cg_cur: 260
          cg_tgt: 258
          arm_from: 302
          arm_to: 40
      - id: p2
        values:
          mass: 7500
          cg_cur: 80.5
          cg_tgt: 79.5
          arm_from: 150
          arm_to: 30
      - id: p3
        values:
          mass: 15000
          cg_cur: 215
          cg_tgt: 213.5
          arm_from: 280
          arm_to: 35
    explanation: >-
      Moving mass forward by the distance between two cargo bays shifts the CG
      by (mass moved x distance) / total mass. Solving for the mass gives total
      mass x CG shift / distance between the bays.


      **Solution**


      {{f: mass * abs(cg_cur - cg_tgt) / abs(arm_from - arm_to)}} = {{n: mass *
      abs(cg_cur - cg_tgt) / abs(arm_from - arm_to)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the station of the rear bay is used as the distance.

      - **{{d2}} kg**: the stations are added instead of subtracted.

      - **{{d3}} kg**: only the station of the forward bay is used as the
      distance.

      - **{{d4}} kg**: the distance is measured from the current CG instead of
      from the forward bay.
- id: QHGHI1ENT
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319280
    - ATPLQ-312355
    - AVEXAM-65028
    - AVEXAM-92196
  annexes: []
  learningObjectives:
    - 031.05.02.02.02
  template:
    type: calculation
    question: >-
      Given the following information, determine the CG position (in inches aft
      of the datum) for the take-off mass:


      - Basic Empty Mass: {{bem}} lb, with associated moment: {{bem_moment}}
      in.lb

      - Forward seat passenger: {{m_front}} lb at an arm of {{arm_front}} in

      - Aft seat passenger: {{m_aft}} lb at an arm of {{arm_aft}} in

      - Block fuel: {{block}} lb

      - Taxi fuel: {{taxi}} lb

      - Fuel tank arm: {{fuel_arm}} in
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: bem_moment
        label: BEM moment
        unit: in.lb
      - id: m_front
        label: Forward seat passenger
        unit: lb
      - id: arm_front
        label: Forward seat arm
        unit: in
      - id: m_aft
        label: Aft seat passenger
        unit: lb
      - id: arm_aft
        label: Aft seat arm
        unit: in
      - id: block
        label: Block fuel
        unit: lb
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: fuel_arm
        label: Fuel tank arm
        unit: in
    answer:
      formula: (bem_moment + m_front * arm_front + m_aft * arm_aft + (block - taxi) *
        fuel_arm) / (bem + m_front + m_aft + block - taxi)
      unit: in
      decimals: 2
    distractors:
      - id: d1
        formula: (bem_moment + m_front * arm_front + m_aft * arm_aft + block * fuel_arm)
          / (bem + m_front + m_aft + block)
      - id: d2
        formula: (bem_moment + m_front * arm_front + m_aft * arm_aft + (block + taxi) *
          fuel_arm) / (bem + m_front + m_aft + block + taxi)
      - id: d3
        formula: (bem_moment + m_front * arm_front + m_aft * arm_aft) / (bem + m_front +
          m_aft)
      - id: d4
        formula: (bem_moment + m_front * arm_front + m_aft * arm_aft + (block - taxi) *
          fuel_arm) / (bem + m_front + m_aft + block)
    presets:
      - id: p1
        values:
          bem: 2635
          bem_moment: 204379.5
          m_front: 93
          arm_front: 79
          m_aft: 180
          arm_aft: 119
          block: 830
          taxi: 230
          fuel_arm: 86
      - id: p2
        values:
          bem: 2635
          bem_moment: 204793.5
          m_front: 90
          arm_front: 78
          m_aft: 186
          arm_aft: 117
          block: 850
          taxi: 85
          fuel_arm: 86
    explanation: >-
      The take-off mass excludes the taxi fuel, which is burnt before the
      take-off run. The CG is the sum of all moments divided by the take-off
      mass.


      **Solution**


      Take-off fuel = {{= block - taxi}} lb


      Take-off mass = {{= bem + m_front + m_aft + block - taxi}} lb


      Total moment = {{= bem_moment + m_front * arm_front + m_aft * arm_aft +
      (block - taxi) * fuel_arm}} in.lb


      CG = total moment / take-off mass = **{{answer}} in** aft of the datum


      **Why the other answers are wrong**


      - **{{d1}} in**: the full block fuel is used, although the taxi fuel is
      burnt before take-off.

      - **{{d2}} in**: the taxi fuel is added instead of subtracted.

      - **{{d3}} in**: the fuel is left out completely.

      - **{{d4}} in**: the fuel moment is correct but the taxi fuel is not
      subtracted from the total mass.
