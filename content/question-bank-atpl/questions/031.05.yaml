- id: QBNBRT1JW
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319614
    - AVEXAM-65028
    - BGS-310551
  annexes: []
  learningObjectives:
    - 031.05.02.02.02
  template:
    type: calculation
    question: >-
      During dispatch, you perform the Mass and Balance calculations. Given the
      following information, calculate the Take-Off Mass CG in inches aft of the
      datum.


      - Basic Empty Mass: {{bem}} lb

      - Basic Empty Mass Moment: {{bem_moment}} in.lb

      - Front Seat Occupant's Mass: {{front_mass}} lb

      - Front Seat Occupant's Arm: {{front_arm}} in

      - Aft Seat Occupant's Mass: {{aft_mass}} lb

      - Aft Seat Occupant's Arm: {{aft_arm}} in

      - Block Fuel: {{block}} lb

      - Taxi Fuel: {{taxi}} lb

      - Fuel Arm: {{fuel_arm}} in
    variables:
      - id: bem
        label: BEM
        unit: lb
      - id: bem_moment
        label: BEM moment
        unit: in.lb
      - id: front_mass
        label: Front occupant mass
        unit: lb
      - id: front_arm
        label: Front occupant arm
        unit: in
      - id: aft_mass
        label: Aft occupant mass
        unit: lb
      - id: aft_arm
        label: Aft occupant arm
        unit: in
      - id: block
        label: Block fuel
        unit: lb
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: fuel_arm
        label: Fuel arm
        unit: in
    answer:
      formula: (bem_moment + front_mass * front_arm + aft_mass * aft_arm + (block -
        taxi) * fuel_arm) / (bem + front_mass + aft_mass + block - taxi)
      unit: in
      decimals: 2
    distractors:
      - id: d1
        formula: (bem_moment + front_mass * front_arm + aft_mass * aft_arm + block *
          fuel_arm) / (bem + front_mass + aft_mass + block)
      - id: d2
        formula: (bem_moment + front_mass * front_arm + aft_mass * aft_arm + taxi *
          fuel_arm) / (bem + front_mass + aft_mass + taxi)
      - id: d3
        formula: (bem_moment + front_mass * front_arm + aft_mass * aft_arm + (block +
          taxi) * fuel_arm) / (bem + front_mass + aft_mass + block + taxi)
    presets:
      - id: p1
        values:
          bem: 2635
          bem_moment: 204397.5
          front_mass: 93
          front_arm: 78
          aft_mass: 186
          aft_arm: 119
          block: 850
          taxi: 320
          fuel_arm: 83
      - id: p2
        values:
          bem: 2500
          bem_moment: 195000
          front_mass: 170
          front_arm: 78
          aft_mass: 140
          aft_arm: 119
          block: 800
          taxi: 250
          fuel_arm: 83
      - id: p3
        values:
          bem: 2700
          bem_moment: 210600
          front_mass: 190
          front_arm: 78
          aft_mass: 90
          aft_arm: 119
          block: 700
          taxi: 200
          fuel_arm: 83
    explanation: >-
      The CG is the total moment divided by the total mass. Take-off mass
      excludes the taxi fuel, which is burned before the take-off, so only block
      fuel minus taxi fuel counts.


      **Solution**


      Take-off fuel: {{= block - taxi}} lb


      Total mass = {{= bem + front_mass + aft_mass + block - taxi}} lb


      Total moment = {{= bem_moment + front_mass * front_arm + aft_mass *
      aft_arm + (block - taxi) * fuel_arm}} in.lb


      CG = **{{answer}} in** aft of datum


      **Why the other answers are wrong**


      - **{{d1}} in**: the full block fuel was used, ignoring that the taxi fuel
      is burned before take-off.

      - **{{d2}} in**: only the taxi fuel was used for the fuel load.

      - **{{d3}} in**: the taxi fuel was added to the block fuel instead of
      subtracted.
- id: QBYZT07PO
  docId: "031.05"
  relatedQuestions: []
  externalIds:
