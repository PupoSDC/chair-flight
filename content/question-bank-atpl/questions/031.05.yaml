- id: QWNHWHIM
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312238
    - ATPLGS-107141
    - ATPLGS-627463
    - AVEXAM-17629
    - BGS-310369
    - ATPLGS-113462
    - BGS-310270
    - AVEXAM-17957
    - BGS-310269
  annexes:
    - 031-crew-masses-and-longitudinal-moments-table
  learningObjectives:
    - 031.05.01.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      Without the crew, the mass and the CG position of the aircraft are
      {{mass_base}} kg and {{cg_base}} m.


      The mass of the pilot is {{m_pilot}} kg, the mass of the copilot is
      {{m_copilot}} kg and the mass of the flight engineer is {{m_fe}} kg.


      The arm of the crew seats is read from the figure: {{crew_arm}} m (value
      read from the figure).


      With this crew on board, what will be the CG position (in m)?
    variables:
      - id: mass_base
        label: Mass without crew
        unit: kg
      - id: cg_base
        label: CG without crew
        unit: m
      - id: m_pilot
        label: Pilot mass
        unit: kg
      - id: m_copilot
        label: Copilot mass
        unit: kg
      - id: m_fe
        label: Flight engineer mass
        unit: kg
      - id: crew_arm
        label: Crew arm read from the figure
        unit: m
    chartInputs:
      - crew_arm
    answer:
      formula: (mass_base * cg_base + (m_pilot + m_copilot + m_fe) * crew_arm) /
        (mass_base + m_pilot + m_copilot + m_fe)
      unit: m
      decimals: 3
    distractors:
      - id: d1
        formula: (mass_base * cg_base + (m_pilot + m_copilot + m_fe) * crew_arm) /
          mass_base
      - id: d2
        formula: (mass_base * cg_base - (m_pilot + m_copilot + m_fe) * crew_arm) /
          (mass_base + m_pilot + m_copilot + m_fe)
      - id: d3
        formula: (m_pilot + m_copilot + m_fe) * crew_arm / (mass_base + m_pilot +
          m_copilot + m_fe)
      - id: d4
        formula: abs((mass_base * cg_base + (m_pilot + m_copilot + m_fe) * crew_arm) /
          (mass_base + m_pilot + m_copilot + m_fe) - cg_base)
    presets:
      - id: p1
        values:
          mass_base: 7000
          cg_base: 4.7
          m_pilot: 90
          m_copilot: 75
          m_fe: 90
          crew_arm: 2.29
      - id: p2
        values:
          mass_base: 6800
          cg_base: 4.6
          m_pilot: 80
          m_copilot: 70
          m_fe: 85
          crew_arm: 2.25
    explanation: >-
      The new CG is the total moment (aircraft plus crew) divided by the total
      mass. The crew arm is read from the figure; here it is treated as a single
      value for all three crew members.


      **Solution**


      Crew mass = {{= m_pilot + m_copilot + m_fe}} kg


      {{f: (mass_base * cg_base + (m_pilot + m_copilot + m_fe) * crew_arm) /
      (mass_base + m_pilot + m_copilot + m_fe)}} = {{n: (mass_base * cg_base +
      (m_pilot + m_copilot + m_fe) * crew_arm) / (mass_base + m_pilot +
      m_copilot + m_fe)}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the crew mass is not added to the total mass.

      - **{{d2}} m**: the crew moment is subtracted instead of added.

      - **{{d3}} m**: only the crew moment is divided by the new mass; the
      aircraft moment is forgotten.

      - **{{d4}} m**: this is the CG shift, not the new CG position.
- id: QWRDBQKG
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311050
    - BGS-310457
    - AVEXAM-71046
    - ATPLGS-126622
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      Given the following information, what is the minimum additional load, in
      whole kilograms, that must be loaded into compartment 2 to bring the CG
      into limits for take-off?


      - Aircraft take-off mass: {{mass}} kg

      - Initial CG position: {{cg}} m

      - Forward CG limit: {{fwd}} m

      - Aft CG limit: {{aft}} m

      - Compartment 1 arm: {{arm1}} m

      - Compartment 2 arm: {{arm2}} m
    variables:
      - id: mass
        label: Take-off mass
        unit: kg
      - id: cg
        label: Initial CG
        unit: m
      - id: fwd
        label: Forward CG limit
        unit: m
      - id: aft
        label: Aft CG limit
        unit: m
      - id: arm1
        label: Compartment 1 arm
        unit: m
      - id: arm2
        label: Compartment 2 arm
        unit: m
    answer:
      formula: ceil(mass * (fwd - cg) / (arm2 - fwd))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(mass * (fwd - cg) / (fwd - arm1))
      - id: d2
        formula: ceil(mass * (fwd - cg) / (arm2 - cg))
      - id: d3
        formula: ceil(mass * (aft - cg) / (arm2 - aft))
      - id: d4
        formula: ceil(mass * (fwd - cg) / arm2)
    presets:
      - id: p1
        values:
          mass: 1785
          cg: 2.08
          fwd: 2.14
          aft: 2.41
          arm1: 1.23
          arm2: 4.76
      - id: p2
        values:
          mass: 1650
          cg: 2.05
          fwd: 2.12
          aft: 2.4
          arm1: 1.2
          arm2: 4.7
    explanation: >-
      The CG is ahead of the forward limit, so mass must be added aft of the CG.
      The load m placed at arm {{arm2}} m must shift the CG exactly to the
      forward limit: (M + m) * fwd = M * CG + m * arm2. Solving for m and
      rounding up to a whole kilogram gives the minimum load.


      **Solution**


      {{f: mass * (fwd - cg) / (arm2 - fwd)}} = {{n: mass * (fwd - cg) / (arm2 -
      fwd)}} = {{= mass * (fwd - cg) / (arm2 - fwd)}} kg, rounded up:
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: load computed for compartment 1; as it is forward of the
      CG, it would move the CG the wrong way.

      - **{{d2}} kg**: divides by the distance to the initial CG instead of to
      the target CG.

      - **{{d3}} kg**: targets the aft limit instead of the forward limit.

      - **{{d4}} kg**: divides by the arm only instead of by the arm minus the
      target CG.
