- id: QZKQUSMG
  docId: "031.05"
  relatedQuestions:
    - QFFIGQXS
  externalIds:
    - ATPLQ-318391
    - BGS-310664
    - AVEXAM-51645
    - BGS-310661
    - ATPLGS-114053
    - ATPLGS-126694
  annexes:
    - 031-graphical-loading-chart-01
  learningObjectives:
    - 031.05.01.02.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Using the graph, and given the following parameters, what
      is the loaded Centre of Gravity (CG) of this aircraft (in m)?


      - BEM: {{bem}} kg

      - BEM CG: {{bem_cg}} m

      - Front pax: {{front}} kg

      - Cargo on the floor: {{cargo}} kg

      - Fuel: {{fuel}} kg


      The total moment of front pax, cargo and fuel read from the graph is
      {{load_moment}} kg.m (value read from the figure).
    variables:
      - id: bem
        label: BEM
        unit: kg
      - id: bem_cg
        label: BEM CG
        unit: m
      - id: front
        label: Front pax
        unit: kg
      - id: cargo
        label: Cargo on the floor
        unit: kg
      - id: fuel
        label: Fuel
        unit: kg
      - id: load_moment
        label: Moment of loads read from the graph
        unit: kg.m
    chartInputs:
      - load_moment
    answer:
      formula: (bem * bem_cg + load_moment) / (bem + front + cargo + fuel)
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: bem_cg
      - id: d2
        formula: bem * bem_cg / (bem + front + cargo + fuel)
      - id: d3
        formula: (bem * bem_cg + load_moment) / bem
      - id: d4
        formula: (bem * bem_cg + load_moment) / (bem + front + cargo)
    presets:
      - id: p1
        values:
          bem: 1200
          bem_cg: 3
          front: 200
          cargo: 50
          fuel: 250
          load_moment: 1449
      - id: p2
        values:
          bem: 1250
          bem_cg: 3.02
          front: 180
          cargo: 60
          fuel: 240
          load_moment: 1400
    explanation: >-
      The loaded CG is the total moment divided by the total mass. The moment of
      the loads is read from the graph, and the BEM moment is BEM times BEM CG.


      **Solution**


      Total mass = {{= bem + front + cargo + fuel}} kg


      Total moment = {{= bem * bem_cg + load_moment}} kg.m


      CG = total moment / total mass = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the BEM CG is given as the answer; the loads are ignored.

      - **{{d2}} m**: the load moment is forgotten but the load mass is added.

      - **{{d3}} m**: the load mass is not added to the total mass.

      - **{{d4}} m**: the fuel mass is forgotten in the total mass.
