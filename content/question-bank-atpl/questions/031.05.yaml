  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      The Dry Operating Index (DOI) calculation and basic index correction
      information from an aeroplane load and trim sheet are shown in the annex.


      Calculate the DOI for an aeroplane mass of {{ac_mass}} kg and {{mac_pct}}%
      MAC, corrected for one additional crew member with a mass of {{mass}} kg.


      The uncorrected DOI read from the table is {{table_doi}} and the zone
      index of the crew member’s zone is {{zone_index}} per kg (both values read
      from the figure).
    variables:
      - id: ac_mass
        label: Aeroplane mass
        unit: kg
      - id: mac_pct
        label: CG position
        unit: "% MAC"
      - id: table_doi
        label: Table DOI read from the figure
        unit: ""
      - id: mass
        label: Mass of additional crew member
        unit: kg
      - id: zone_index
        label: Zone index per kg read from the figure
        unit: index/kg
    chartInputs:
      - table_doi
      - zone_index
    answer:
      formula: table_doi + mass * zone_index
      unit: ""
      decimals: 1
    distractors:
      - id: d1
        formula: table_doi
      - id: d2
        formula: table_doi - mass * zone_index
      - id: d3
        formula: table_doi + 2 * mass * zone_index
      - id: d4
        formula: table_doi + 10 * mass * zone_index
    presets:
      - id: p1
        values:
          ac_mass: 112600
          mac_pct: 30.7
          table_doi: 118.9
          mass: 75
          zone_index: 0.0053
      - id: p2
        values:
          ac_mass: 110800
          mac_pct: 31.6
          table_doi: 120
          mass: 85
          zone_index: 0.0047
    explanation: >-
      The DOI of the aeroplane is the table value for its mass and CG position,
      corrected by the index of any crew added: added mass times the zone index
      per kg.


      **Solution**


      Correction = {{= mass * zone_index}}


      {{f: table_doi + mass * zone_index}} = {{n: table_doi + mass *
      zone_index}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: the correction for the additional crew member is not
      applied.

      - **{{d2}} **: the correction is subtracted instead of added.

      - **{{d3}} **: the correction is applied twice.

      - **{{d4}} **: the correction is multiplied by 10 (decimal slip).
