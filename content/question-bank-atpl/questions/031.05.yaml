    explanation: >-
      The total gross mass is the mass already entered on the load sheet plus
      the masses added afterwards.


      **Solution**


      {{f: sheet + pax + bag}} = {{n: sheet + pax + bag}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the baggage is forgotten.

      - **{{d2}} lb**: the passenger is forgotten.

      - **{{d3}} lb**: the added masses are subtracted.

      - **{{d4}} lb**: the mass already on the sheet is left out.
- id: QXEQOOXN
  docId: "031.05"
  relatedQuestions:
    - QXZOOATG
  externalIds:
    - ATPLQ-319421
    - ATPLGS-107159
    - AVEXAM-75238
  annexes: []
  learningObjectives:
    - 031.05.01.01.01
  template:
    type: calculation
    question: The mass of an aircraft is {{mass}} kg and {{added}} kg of freight is
      added to a hold {{dist}} m aft of the present CG position. By how many
      metres does the CG move aft?
    variables:
      - id: mass
        label: Aircraft mass
        unit: kg
      - id: added
        label: Added freight
        unit: kg
      - id: dist
        label: Distance of hold aft of CG
        unit: m
    answer:
      formula: added * dist / (mass + added)
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: added * dist / mass
      - id: d2
        formula: added * dist / (mass - added)
      - id: d3
        formula: dist * mass / (mass + added)
      - id: d4
        formula: -added * dist / (mass + added)
    presets:
      - id: p1
        values:
          mass: 2000
          added: 400
          dist: 2
      - id: p2
        values:
          mass: 1800
          added: 300
          dist: 2.5
    explanation: >-
      Adding a mass at a distance from the CG shifts the CG towards it by the
      added moment divided by the new total mass.


      **Solution**


      {{f: added * dist / (mass + added)}} = {{n: added * dist / (mass +
      added)}} = **{{answer}} m** aft


      **Why the other answers are wrong**


      - **{{d1}} m**: the added mass is not included in the new total mass.

      - **{{d2}} m**: the added mass is subtracted instead of added.

      - **{{d3}} m**: the wrong mass is used in the numerator.

      - **{{d4}} m**: the CG moves in the wrong direction (forward instead of
      aft).
- id: QXY0BIMUS
  docId: "031.05"
  relatedQuestions:
    - QQINKBNP
  externalIds:
    - ATPLQ-314534
    - ATPLGS-126675
    - AVEXAM-68607
  annexes:
    - 031-blank-loadsheet-loadmessage-and-load-trim-sheet-ver-132-pax
  learningObjectives:
    - 031.05.02.03.04
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Given the following information, find the Index at
      TOM after the Last Minute Change (LMC) by using the balance sheet.


      - Actual TOM before LMC: {{tom}} kg

      - Index at actual TOM before LMC: {{idx}}


      LMC data: four passengers disembarked from seat row No. 3, and 500 kg of
      cargo loaded in the Cargo 1 compartment.


      The net index change of the LMC, read from the figure, is {{di}}.
    variables:
      - id: tom
        label: Actual TOM before LMC
        unit: kg
      - id: idx
        label: Index before LMC
        unit: ""
      - id: di
        label: Net index change (read from the figure)
        unit: ""
    chartInputs:
      - di
    answer:
      formula: idx + di
      unit: ""
      decimals: 1
    distractors:
      - id: d1
        formula: idx - di
      - id: d2
        formula: idx
      - id: d3
        formula: idx + 3 * di
      - id: d4
        formula: idx + 2 * di
    presets:
      - id: p1
        values:
          tom: 52000
          idx: 50
          di: -1.5
    explanation: >-
      The index after a last minute change is the index before plus the index
      change of every load moved, as read from the index table of the balance
      sheet.


      **Solution**


      Net index change read from the figure: {{di}}


      {{f: idx + di}} = {{n: idx + di}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the sign of the index change is reversed.

      - **{{d2}}**: the index is not updated for the LMC.

      - **{{d3}}**: the index change is tripled.

      - **{{d4}}**: the index change is doubled.
- id: QXZOOATG
  docId: "031.05"
  relatedQuestions:
    - QXEQOOXN
  externalIds:
    - ATPLQ-311777
    - ATPLGS-107156
    - ATPLGS-126729
    - AVEXAM-83241
    - BGS-310310
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: The mass of an aircraft is {{mass}} kg. If {{added}} kg is added to a
      cargo hold {{dist}} metres from the loaded Centre of Gravity (CG), by how
      many centimetres will the loaded CG move?
    variables:
      - id: mass
        label: Aircraft mass
        unit: kg
      - id: added
        label: Added cargo
        unit: kg
      - id: dist
        label: Distance of hold from CG
        unit: m
    answer:
      formula: added * dist * 100 / (mass + added)
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: added * dist * 100 / mass
      - id: d2
        formula: added * dist * 100 / (mass - added)
      - id: d3
        formula: dist * mass * 100 / (mass + added)
      - id: d4
        formula: -added * dist * 100 / (mass + added)
    presets:
      - id: p1
        values:
          mass: 1950
          added: 450
          dist: 1.75
      - id: p2
        values:
          mass: 2100
          added: 350
          dist: 2.2
    explanation: >-
      Adding a mass at a distance from the CG shifts the CG towards it by the
      added moment divided by the new total mass (including the added mass).


      **Solution**


      {{f: added * dist * 100 / (mass + added)}} = {{n: added * dist * 100 /
      (mass + added)}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: the added mass is not included in the new total mass.

      - **{{d2}} cm**: the added mass is subtracted instead of added.

      - **{{d3}} cm**: the wrong mass is used in the numerator.

      - **{{d4}} cm**: the CG moves in the wrong direction.
- id: QYBMG7TJW
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315163
    - BGS-310757
    - AVEXAM-65843
  annexes: []
  learningObjectives:
    - 031.05.01.01.01
  template:
    type: calculation
    question: The Basic Empty Mass (BEM) of a light aircraft used for aerial
      photography is {{bem}} lb and its Centre of Gravity is located {{cg}}
      inches aft of datum. What will be the new CG of the BEM, if a camera which
      weighs {{cam}} lb is installed {{arm}} in aft of datum?
    variables:
      - id: bem
        label: BEM
        unit: lb
      - id: cg
        label: BEM CG
        unit: in
      - id: cam
        label: Camera mass
        unit: lb
      - id: arm
        label: Camera arm
        unit: in
    answer:
      formula: (bem * cg + cam * arm) / (bem + cam)
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: (bem * cg + cam * arm) / bem
      - id: d2
        formula: (bem * cg - cam * arm) / (bem + cam)
      - id: d3
        formula: (bem * cg - cam * arm) / bem
    presets:
      - id: p1
        values:
          bem: 2415
          cg: 77.7
          cam: 190
          arm: 108
      - id: p2
        values:
          bem: 2380
          cg: 78.4
          cam: 150
          arm: 112
      - id: p3
        values:
          bem: 2500
          cg: 76.9
          cam: 210
          arm: 105
    explanation: >-
      Installing equipment changes both the mass and the total moment. The new
      CG is the new total moment divided by the new total mass.


      **Solution**


      New mass = {{bem}} + {{cam}} = {{= bem + cam}} lb


      New moment = {{bem}} x {{cg}} + {{cam}} x {{arm}} = {{= bem * cg + cam *
      arm}} lb in


      {{f: (bem * cg + cam * arm) / (bem + cam)}} = {{n: (bem * cg + cam * arm)
      / (bem + cam)}} = **{{answer}} in**


      **Why the other answers are wrong**


      - **{{d1}} in**: the moment of the camera was added but its mass was not
      included in the divisor.

      - **{{d2}} in**: the camera moment was subtracted instead of added.

      - **{{d3}} in**: the camera moment was subtracted and its mass was left
      out of the divisor.
- id: QYEVIP9UK
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316350
    - AVEXAM-36188
    - BGS-310610
    - AVEXAM-4133
