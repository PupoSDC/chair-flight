- id: Q3NVF9SPQ
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314016
    - BGS-310510
    - AVEXAM-35248
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      The centre of gravity limits of an aircraft are between 92 and {{lim}} in
      aft of the datum.


      The centre of gravity is {{shift}} in behind the aft limit.


      To move the CG to the aft limit, {{removed}} kg is removed from the aft
      baggage compartment, which is located {{arm}} in behind datum.


      What is the aircraft NEW weight?
    variables:
      - id: lim
        label: Aft CG limit
        unit: in
      - id: shift
        label: CG behind aft limit
        unit: in
      - id: removed
        label: Removed mass
        unit: kg
      - id: arm
        label: Baggage compartment arm
        unit: in
    answer:
      formula: removed * (arm - lim) / shift - removed
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: removed * (arm - lim) / shift
      - id: d2
        formula: removed * (arm - lim) / shift + removed
      - id: d3
        formula: removed * (arm - lim) / shift + 2 * removed
    presets:
      - id: p1
        values:
          lim: 100
          shift: 5
          removed: 950
          arm: 200
      - id: p2
        values:
          lim: 95
          shift: 4
          removed: 800
          arm: 180
      - id: p3
        values:
          lim: 90
          shift: 6
          removed: 600
          arm: 210
    explanation: >-
      Removing a mass from an arm behind the CG moves the CG forward. The CG
      shift equals removed mass × (arm - new CG) / new mass, so the new mass is
      removed mass × (arm - limit) / shift. Equivalently, the original mass is
      that value plus the removed mass, and the new mass is the original mass
      minus the removed mass.


      **Solution**


      New mass = {{f: removed * (arm - lim) / shift - removed}}


      {{n: removed * (arm - lim) / shift - removed}} = **{{answer}} kg**


      New mass = {{= removed * (arm - lim) / shift}} - {{removed}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the mass before removal, not the new weight.

      - **{{d2}} kg**: adds the removed mass instead of subtracting it.

      - **{{d3}} kg**: adds the removed mass twice.
