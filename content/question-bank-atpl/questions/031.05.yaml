- id: QCXAUTVI
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315094
    - AVEXAM-96023
    - BGS-310537
  annexes:
    - cap-696-page-24-figure-3.4
  learningObjectives:
    - 031.05.02.02.02
  template:
    type: chart-calculation
    question: >-
      Using the following data and the loading table in the annex, determine the
      ramp mass centre of gravity position.


      - Crew: 1 pilot

      - Passengers: 2 at the centre seats

      - Fuel loaded: {{fuel}} lb

      - Standard mass per person: {{person}} lb


      The empty aircraft mass, the empty aircraft moment and the loading arms of
      the pilot, the passengers and the fuel are read from the figure.


      What is the ramp mass CG position (in)?
    variables:
      - id: person
        label: Standard mass per person
        unit: lb
      - id: fuel
        label: Fuel loaded
        unit: lb
      - id: empty_mass
        label: Empty aircraft mass (read from the figure)
        unit: lb
      - id: empty_moment
        label: Empty aircraft moment (read from the figure)
        unit: lb in
      - id: arm_crew
        label: Pilot arm (read from the figure)
        unit: in
      - id: arm_pax
        label: Passenger arm (read from the figure)
        unit: in
      - id: arm_fuel
        label: Fuel arm (read from the figure)
        unit: in
    chartInputs:
      - empty_mass
      - empty_moment
      - arm_crew
      - arm_pax
      - arm_fuel
    answer:
      formula: (empty_moment + person * arm_crew + 2 * person * arm_pax + fuel *
        arm_fuel) / (empty_mass + 3 * person + fuel)
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: (empty_moment + person * arm_crew + 2 * person * arm_pax) / (empty_mass
          + 3 * person)
      - id: d2
        formula: (empty_moment + person * arm_crew + 2 * person * arm_pax + fuel *
          arm_fuel) / (empty_mass + 3 * person)
      - id: d3
        formula: (empty_moment + person * arm_crew + 2 * person * arm_pax + fuel *
          arm_pax) / (empty_mass + 3 * person + fuel)
      - id: d4
        formula: (arm_crew + 2 * arm_pax) / 3
    presets:
      - id: p1
        values:
          person: 170
          fuel: 500
          empty_mass: 1500
          empty_moment: 127664
          arm_crew: 85
          arm_pax: 95
          arm_fuel: 110
    explanation: >-
      The centre of gravity of the loaded aircraft is the total moment divided
      by the total mass. Each mass is multiplied by its arm, which is its
      distance from the datum. The empty aircraft values and the arms are read
      from the loading table in the figure.


      **Solution**


      - Total mass = empty mass + three persons + fuel = {{= empty_mass + 3 *
      person + fuel}} lb

      - Total moment = {{= empty_moment + person * arm_crew + 2 * person *
      arm_pax + fuel * arm_fuel}} lb in

      - CG = total moment / total mass = **{{answer}} in**


      **Why the other answers are wrong**


      - **{{d1}} in**: the fuel is left out of both the moment and the mass.

      - **{{d2}} in**: the fuel moment is included but the fuel mass is left out
      of the total mass.

      - **{{d3}} in**: the fuel is given the passenger arm instead of its own
      arm.

      - **{{d4}} in**: the arms are averaged, which ignores the masses.
