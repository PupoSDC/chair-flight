- id: QGKSGCIB
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313673
    - AVEXAM-71531
    - ATPLGS-107166
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: >-
      An aircraft is loaded as follows:


      - Total aircraft mass: {{mass}} kg

      - CG position: {{cg}} in aft of the datum

      - Forward CG limit: {{fwd}} in aft of the datum

      - Hold C position: {{arm}} in aft of the datum


      How much load must be removed from hold C to move the CG onto the forward
      limit? Round the answer to the nearest 10 kg.
    variables:
      - id: mass
        label: Total aircraft mass
        unit: kg
      - id: cg
        label: CG position
        unit: in
      - id: fwd
        label: Forward CG limit
        unit: in
      - id: arm
        label: Hold C position
        unit: in
    answer:
      formula: round(mass * (cg - fwd) / (arm - fwd) / 10) * 10
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: round(mass * (cg - fwd) / (arm - cg) / 10) * 10
      - id: d2
        formula: round(2 * mass * (cg - fwd) / (arm - fwd) / 10) * 10
      - id: d3
        formula: round(mass * (cg - fwd) / arm / 10) * 10
      - id: d4
        formula: round(mass * (arm - cg) / (arm - fwd) / 10) * 10
    presets:
      - id: p1
        values:
          mass: 4900
          cg: 50
          fwd: 35
          arm: 240
      - id: p2
        values:
          mass: 6000
          cg: 60
          fwd: 40
          arm: 300
      - id: p3
        values:
          mass: 3500
          cg: 52
          fwd: 45
          arm: 180
    explanation: >-
      Removing load from hold C, which lies behind the CG, moves the centre of
      gravity forward. The load to remove is the mass that moves the CG exactly
      onto the forward limit. The answer is rounded to the nearest 10 kg.


      **Solution**


      - Load to remove: {{f: mass * (cg - fwd) / (arm - fwd)}}

      - {{n: mass * (cg - fwd) / (arm - fwd)}} = {{= mass * (cg - fwd) / (arm -
      fwd)}} kg, which rounds to **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: divides by the distance from the hold to the CG instead
      of the distance to the forward limit

      - **{{d2}} kg**: doubles the result

      - **{{d3}} kg**: divides by the hold position alone, ignoring the forward
      limit

      - **{{d4}} kg**: puts the distance from the hold to the CG in the
      numerator, mixing up the two lever arms
