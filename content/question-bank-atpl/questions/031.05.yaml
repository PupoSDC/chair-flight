    - AVEXAM-18200
    - BGS-310684
    - ATPLGS-126677
  annexes: []
  learningObjectives:
    - 031.05.02.02.02
  template:
    type: calculation
    question: >-
      A loaded aircraft has its centre of gravity (CG) {{cg}} inches aft of the
      datum, and its mass is {{mass}} lb.


      A last minute load of {{add}} lb is placed on board {{fwd}} inches forward
      of the datum.


      Determine the new position of the CG, in inches aft of the datum.
    variables:
      - id: mass
        label: Aircraft mass
        unit: lb
      - id: cg
        label: CG position
        unit: in
      - id: add
        label: Added mass
        unit: lb
      - id: fwd
        label: Distance of added mass forward of datum
        unit: in
    answer:
      formula: (mass * cg - add * fwd) / (mass + add)
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: (mass * cg + add * fwd) / (mass + add)
      - id: d2
        formula: (mass * cg - add * fwd) / mass
      - id: d3
        formula: (mass * cg - add * fwd) / (mass - add)
      - id: d4
        formula: cg - fwd
    presets:
      - id: p1
        values:
          mass: 4500
          cg: 35
          add: 334
          fwd: 20
      - id: p2
        values:
          mass: 3800
          cg: 42
          add: 250
          fwd: 30
      - id: p3
        values:
          mass: 6000
          cg: 28
          add: 400
          fwd: 15
    explanation: >-
      The new CG is the total moment divided by the new total mass. A mass
      placed forward of the datum has a negative arm, so it reduces the total
      moment.


      **Solution**


      {{f: (mass * cg - add * fwd) / (mass + add)}} = {{n: (mass * cg - add *
      fwd) / (mass + add)}} = **{{answer}} in aft of the datum**


      **Why the other answers are wrong**


      - **{{d1}} in**: the added moment is added instead of subtracted (arm
      treated as aft of the datum).

      - **{{d2}} in**: the added mass is left out of the total mass.

      - **{{d3}} in**: the added mass is subtracted from the total mass.

      - **{{d4}} in**: the arm is subtracted from the CG instead of computing
      moments.
