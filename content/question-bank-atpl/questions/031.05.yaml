- id: QLLNMVZH
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318653
    - BGS-310797
    - AVEXAM-31452
    - AVEXAM-42106
  annexes: []
  learningObjectives:
    - 031.05.03.01.04
  template:
    type: chart
    question: >-
      An aeroplane, with its CG limits from 638 inches to 658 inches aft of the
      datum, should have been loaded so as to give a calculated Take-Off Mass of
      64 200 kg and the CG located at 640 inches aft of the datum, with 750 kg
      loaded into the front cargo hold and 500 kg into the rear cargo hold.


      Unfortunately, the ground staff incorrectly loaded all the cargo into the
      forward cargo hold.


      If the distance between the cargo holds is 517 inches, is the aeroplane's
      CG within limits?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: No, it is out of the forward limit.
        wrongAnswers:
          - Yes, it moves rearwards but is within limits.
          - No, it is out of the rear limit.
          - Yes, it is within limits.
        explanation: The 500 kg meant for the rear hold went forward by 517 inches. The
          centre of gravity moves forward by 500 × 517 ÷ 64 200 = 4.0 inches,
          from 640 to about 636 inches. That is ahead of the 638 inch forward
          limit, so it is **out of the forward limit**.
- id: QLMCZJYF
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316957
    - BGS-310797
    - AVEXAM-31452
    - AVEXAM-42106
