    - AVEXAM-33596
    - AVEXAM-56691
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: A light aircraft has a mass of {{mass}} lb and its CG is located
      {{cg_cur}} in. aft of the datum. Calculate the mass that must be moved
      from the hold located {{arm_from}} in. aft of the datum to the hold
      located {{arm_to}} in. aft of the datum in order to place the CG at
      {{cg_tgt}} in. aft of the datum.
    variables:
      - id: mass
        label: Aircraft mass
        unit: lb
      - id: cg_cur
        label: Current CG position
        unit: in
      - id: cg_tgt
        label: Target CG position
        unit: in
      - id: arm_from
        label: Arm of the hold losing mass
        unit: in
      - id: arm_to
        label: Arm of the hold receiving mass
        unit: in
    answer:
      formula: mass * abs(cg_tgt - cg_cur) / abs(arm_to - arm_from)
      unit: lb
      decimals: 1
    distractors:
      - id: d1
        formula: mass * abs(cg_tgt - cg_cur) / arm_to
      - id: d2
        formula: mass * abs(cg_tgt - cg_cur) / arm_from
      - id: d3
        formula: mass * abs(cg_tgt - cg_cur) / (arm_to + arm_from)
      - id: d4
        formula: mass * abs(cg_tgt - cg_cur) / abs(arm_to - cg_cur)
    presets:
      - id: p1
        values:
          mass: 4400
          cg_cur: 95
          cg_tgt: 93
          arm_from: 178
          arm_to: 22
      - id: p2
        values:
          mass: 3240
          cg_cur: 81
          cg_tgt: 83
          arm_from: 25
          arm_to: 142
      - id: p3
        values:
          mass: 3800
          cg_cur: 100
          cg_tgt: 98.5
          arm_from: 160
          arm_to: 30
    explanation: >-
      The change in CG equals (mass moved x distance between the two arms) /
      total mass. The mass to move is therefore the total mass times the
      required CG shift divided by the distance between the holds.


      **Solution**


      {{f: mass * abs(cg_tgt - cg_cur) / abs(arm_to - arm_from)}} = {{n: mass *
      abs(cg_tgt - cg_cur) / abs(arm_to - arm_from)}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: only the arm of the receiving hold is used as the
      distance.

      - **{{d2}} lb**: only the arm of the giving hold is used as the distance.

      - **{{d3}} lb**: the arms are added instead of subtracted.

      - **{{d4}} lb**: the distance is measured from the current CG instead of
      from the giving hold.
