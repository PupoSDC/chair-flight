- id: QAPOP8GTI
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316364
    - AVEXAM-4663
    - ATPLQ-316738
    - AVEXAM-88163
    - BGS-310493
    - BGS-310503
    - AVEXAM-94434
  annexes: []
  learningObjectives:
    - 031.05.03.01.02
  template:
    type: calculation
    question: >-
      When preparing for the flight, you note that the take-off CG is {{err}} cm
      beyond the CG limit.


      The aircraft take-off mass is {{mass}} kg.


      A {{moved}} kg load is moved within the aircraft to bring the CG within
      limits.


      What is the minimum distance this load must be shifted, in metres?
    variables:
      - id: mass
        label: Aircraft mass
        unit: kg
      - id: err
        label: CG error
        unit: cm
      - id: moved
        label: Moved mass
        unit: kg
    answer:
      formula: mass * err / moved / 100
      unit: m
      decimals: 3
    distractors:
      - id: d1
        formula: mass * err / moved
      - id: d2
        formula: moved * err / mass / 100
      - id: d3
        formula: mass * err / moved / 1000
      - id: d4
        formula: mass * err / (mass + moved) / 100
    presets:
      - id: p1
        values:
          mass: 7132
          err: 8
          moved: 320
      - id: p2
        values:
          mass: 7231
          err: 8
          moved: 302
      - id: p3
        values:
          mass: 6500
          err: 5
          moved: 250
    explanation: >-
      A load shift changes the moment by moved mass times distance. This must
      equal the aircraft mass times the CG error, so the shift distance is mass
      × error / moved mass.


      **Solution**


      {{f: mass * err / moved}} = {{n: mass * err / moved}} cm = **{{answer}}
      m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the result in cm is given as if it were metres (no unit
      conversion).

      - **{{d2}} m**: the ratio of masses is inverted.

      - **{{d3}} m**: the conversion from cm uses 1000 instead of 100.

      - **{{d4}} m**: the moved mass is added to the aircraft mass in the
      denominator.
