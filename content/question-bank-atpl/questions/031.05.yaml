- id: QOWXJGQE
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312675
    - ATPLGS-107153
    - BGS-310375
    - AVEXAM-65533
  annexes: []
  learningObjectives:
    - 031.05.03.01.01
  template:
    type: calculation
    question: >-
      The loaded mass of an aircraft is {{mass}} kg.


      The aft CG limit is {{limit}} inches aft of the datum.


      If the CG as loaded is {{cg}} inches aft of the datum, how many rows
      forward must two passengers move from the rear seat row to bring the CG on
      to the aft limit, if the seat pitch is {{pitch}} inches? (Assume a
      passenger mass of {{pax_mass}} kg each.)
    variables:
      - id: mass
        label: Loaded mass
        unit: kg
      - id: limit
        label: Aft CG limit
        unit: in
      - id: cg
        label: Actual CG
        unit: in
      - id: pitch
        label: Seat pitch
        unit: in
      - id: pax_mass
        label: Passenger mass
        unit: kg
    answer:
      formula: ceil((cg - limit) * mass / (2 * pax_mass * pitch))
      unit: rows
      decimals: 0
    distractors:
      - id: d1
        formula: floor((cg - limit) * mass / (2 * pax_mass * pitch))
      - id: d2
        formula: ceil((cg - limit) * mass / (2 * pax_mass * pitch)) + 1
      - id: d3
        formula: floor((cg - limit) * mass / (2 * pax_mass * pitch)) - 1
    presets:
      - id: p1
        values:
          mass: 12400
          limit: 102
          cg: 104.5
          pitch: 33
          pax_mass: 75
      - id: p2
        values:
          mass: 11800
          limit: 100
          cg: 103
          pitch: 30
          pax_mass: 80
      - id: p3
        values:
          mass: 13000
          limit: 101
          cg: 103.2
          pitch: 32
          pax_mass: 75
    explanation: >-
      Moving mass forward shifts the CG by (moved mass x distance moved) / total
      mass. The CG must move from {{cg}} in to {{limit}} in, so the required
      shift is the difference. The distance each passenger moves is a whole
      number of rows times the seat pitch, so the number of rows is rounded up
      to make sure the CG ends up at or forward of the limit.


      **Solution**


      CG shift = {{= cg - limit}} in


      Required distance = {{= (cg - limit) * mass / (2 * pax_mass)}} in


      Rows = {{= (cg - limit) * mass / (2 * pax_mass * pitch)}}, rounded up =
      **{{answer}} rows**


      **Why the other answers are wrong**


      - **{{d1}} rows**: rounds the result down, which leaves the CG slightly
      aft of the limit.

      - **{{d2}} rows**: rounds up and then adds an extra row.

      - **{{d3}} rows**: rounds down and then subtracts another row.
