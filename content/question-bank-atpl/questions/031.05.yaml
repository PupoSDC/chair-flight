- id: QBFMRNVK
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316858
    - AVEXAM-95740
  annexes:
    - 031-balance-beam-diagram
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      A mass must be added at a point {{arm}} m left of the pivot to balance the
      moments.


      The moment to be balanced, read from the figure, is {{moment}} kg·m.


      Determine the mass to be added, in kg.
    variables:
      - id: moment
        label: Moment to balance (read from the figure)
        unit: kg·m
      - id: arm
        label: Arm of the added mass
        unit: m
    chartInputs:
      - moment
    answer:
      formula: moment / arm
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: moment * arm
      - id: d2
        formula: moment / arm ^ 2
      - id: d3
        formula: moment - arm
      - id: d4
        formula: moment / (2 * arm)
    presets:
      - id: p1
        values:
          moment: 110
          arm: 5
    explanation: >-
      The beam is balanced when the moments about the pivot are equal. The mass
      to add is the moment that has to be balanced divided by its arm.


      **Solution**


      {{f: moment / arm}} = {{n: moment / arm}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: multiplies the moment by the arm instead of dividing.

      - **{{d2}} kg**: divides by the square of the arm.

      - **{{d3}} kg**: subtracts the arm from the moment, which mixes units.

      - **{{d4}} kg**: uses twice the arm.
