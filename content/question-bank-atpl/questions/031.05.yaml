- id: QULXYVOS
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314759
    - AVEXAM-14580
    - BGS-310787
  annexes: []
  learningObjectives:
    - 031.05.01.03.02
  template:
    type: calculation
    question: |-
      Determine the Dry Operating Index (DOI) of the aircraft, given:

      - BEM: {{bem}} kg
      - CG at BEM: {{cg_bem}} inches aft of datum
      - 2 crew members: {{crew}} kg
      - Crew seats: {{crew_arm}} inches aft of datum

      DOI = (mass (kg) x CG (inches) / 5000) - 30
    variables:
      - id: bem
        label: BEM
        unit: kg
      - id: cg_bem
        label: CG at BEM
        unit: in
      - id: crew
        label: Crew mass
        unit: kg
      - id: crew_arm
        label: Crew seat arm
        unit: in
    answer:
      formula: (bem * cg_bem + crew * crew_arm) / 5000 - 30
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: bem * cg_bem / 5000 - 30
      - id: d2
        formula: (bem * cg_bem + crew * crew_arm) / 5000
      - id: d3
        formula: (bem + crew) * cg_bem / 5000 - 30
      - id: d4
        formula: (bem * cg_bem - crew * crew_arm) / 5000 - 30
    presets:
      - id: p1
        values:
          bem: 3208
          cg_bem: 129.7
          crew: 160
          crew_arm: 47.5
      - id: p2
        values:
          bem: 3100
          cg_bem: 128
          crew: 170
          crew_arm: 45
    explanation: >-
      The DOI uses the total moment (BEM moment plus crew moment) of the
      aircraft, divided by 5000 and reduced by a constant of 30. Each item
      contributes mass times its own arm.


      **Solution**


      Total moment = {{= bem * cg_bem + crew * crew_arm}} kg.in


      {{f: (bem * cg_bem + crew * crew_arm) / 5000 - 30}} = {{n: (bem * cg_bem +
      crew * crew_arm) / 5000 - 30}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: the crew is not included.

      - **{{d2}} **: the constant of 30 is not subtracted.

      - **{{d3}} **: the crew mass is placed at the BEM CG instead of at the
      crew seat arm.

      - **{{d4}} **: the crew moment is subtracted instead of added.
