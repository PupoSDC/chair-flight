          cg: 83
          tgt: 84
      - id: p3
        values:
          ballast: 90
          arm: 20
          m: 4500
          cg: 86
          tgt: 87
    explanation: >-
      Removing forward ballast moves the CG aft. With moments: m x cg - x x arm
      = (m - x) x tgt, which gives x = m x (tgt - cg) / (tgt - arm).


      **Solution**


      {{f: m * abs(tgt - cg) / abs(tgt - arm)}} = {{n: m * abs(tgt - cg) /
      abs(tgt - arm)}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: Uses the arm distance to the current CG instead of the
      target CG.

      - **{{d2}} lb**: Divides by the target CG instead of the lever arm.

      - **{{d3}} lb**: Divides by the ballast arm instead of the lever arm
      relative to the target CG.

      - **{{d4}} lb**: Gives the ballast that would remain installed instead of
      the amount to remove.
