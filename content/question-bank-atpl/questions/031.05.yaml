      - id: arm
        label: Observer seat arm read from the figure
        unit: in
    chartInputs:
      - crew_mass
      - arm
    answer:
      formula: crew_mass * arm / 5000
      unit: ""
      decimals: 3
    distractors:
      - id: d1
        formula: arm / 5000
      - id: d2
        formula: crew_mass * arm / 500
      - id: d3
        formula: -crew_mass * arm / 5000
      - id: d4
        formula: crew_mass * arm / 50000
    presets:
      - id: p1
        values:
          crew_mass: 85
          arm: -79
    explanation: >-
      The Dry Operating Index change caused by an added mass is its moment (mass
      times arm) divided by the index constant 5000. The mass and arm are read
      from the figure.


      **Solution**


      {{f: crew_mass * arm / 5000}} = {{n: crew_mass * arm / 5000}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: the crew mass is forgotten.

      - **{{d2}} **: wrong divisor (500 instead of 5000).

      - **{{d3}} **: the sign of the arm is lost.

      - **{{d4}} **: wrong divisor (50 000 instead of 5000).
