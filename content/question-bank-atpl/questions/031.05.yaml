- id: QSHJGMFC
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311503
    - AVEXAM-88163
    - BGS-310493
    - BGS-310503
    - AVEXAM-94434
  annexes: []
  learningObjectives:
    - 031.05.03.01.02
  template:
    type: calculation
    question: >-
      During pre-flight calculations the pilot finds out that the take-off CG
      position is {{shift}} cm aft of the take-off CG aft limit.


      The TOM is {{tom}} kg.


      Determine the minimum distance forwards that they should move a box with a
      mass of {{mass}} kg to change the CG to within the take-off limits:
    variables:
      - id: shift
        label: Required CG shift
        unit: cm
      - id: tom
        label: TOM
        unit: kg
      - id: mass
        label: Box mass
        unit: kg
    answer:
      formula: shift / 100 * tom / mass
      unit: m
      decimals: 3
    distractors:
      - id: d1
        formula: shift * tom / mass
      - id: d2
        formula: shift * (tom - mass) / mass
      - id: d3
        formula: shift * (tom + mass) / mass
    presets:
      - id: p1
        values:
          shift: 8
          tom: 7312
          mass: 362
      - id: p2
        values:
          shift: 6
          tom: 6850
          mass: 290
      - id: p3
        values:
          shift: 10
          tom: 8200
          mass: 410
    explanation: >-
      Moving a mass m over a distance d changes the total moment by m x d, which
      shifts the CG by that amount divided by the (unchanged) take-off mass. To
      bring the CG forward by the required shift, solve for the distance.


      **Solution**


      CG shift = {{shift}} cm = {{= shift / 100}} m


      {{f: shift / 100 * tom / mass}} = {{n: shift / 100 * tom / mass}} =
      **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}}**: the result was left in cm (a factor 100 too large) but
      labelled as metres.

      - **{{d2}}**: the box mass was subtracted from the take-off mass before
      dividing.

      - **{{d3}}**: the box mass was added to the take-off mass before dividing.
