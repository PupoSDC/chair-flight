  template:
    type: chart
    question: >-
      Is it allowed to fly under otherwise identical conditions if the pilot
      weighs 10 kg less than given in the table?


      _Assume that the aft CG limit is located at 2.57 m and the datum is in
      front of the aircraft._


      | | Mass (kg) | Arm (m) | Moment (kg m) |

      | --- | --- | --- | --- |

      | Empty mass | 410 | 2.74 | 1 123.6 |

      | Pilot | 80 | 2.00 | 160 |

      | Fuel | 90 | 2.30 | 207 |
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: No, the new centre of gravity is located slightly aft of the aft limit,
          thus outside the allowable range.
        wrongAnswers:
          - Yes, reducing the mass will have a positive effect.
          - Yes, the new centre of gravity is now located more forward within
            the allowable range.
          - Yes, the new centre of gravity is located slightly forward of the
            aft limit, thus still within the allowable range.
        explanation: >-
          With the given loading the centre of gravity is 1 490.6 ÷ 580 = 2.57
          m, right on the aft limit.


          A lighter pilot removes 10 kg from the front (arm 2.00 m), well ahead
          of the centre of gravity, so the centre of gravity moves **aft** to 1
          470.6 ÷ 570 = 2.58 m. That is slightly behind the 2.57 m limit, so it
          is outside the allowable range.
