- id: QVKZLHZTR
  docId: "031.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315639
    - BGS-310485
    - AVEXAM-38783
    - BGS-310791
  annexes: []
  learningObjectives:
    - 031.05.03.02.01
  template:
    type: calculation
    question: "An aeroplane has a total mass of {{mass}} kg with a CG at {{cg}} m
      aft of the datum line. Determine the amount of additional load to be
      loaded at station {{arm}} m aft of the datum line, to establish a new CG
      of {{newcg}} m aft of the datum line:"
    variables:
      - id: mass
        label: total mass
        unit: kg
      - id: cg
        label: current CG
        unit: m
      - id: newcg
        label: new CG
        unit: m
      - id: arm
        label: load station
        unit: m
    answer:
      formula: mass * (newcg - cg) / (arm - newcg)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mass * (newcg - cg) / (arm - cg)
      - id: d2
        formula: mass * (newcg - cg) / (arm - (newcg - cg))
      - id: d3
        formula: mass * (newcg - cg) / newcg
    presets:
      - id: p1
        values:
          mass: 3927
          cg: 4.28
          newcg: 4.37
          arm: 5.8
      - id: p2
        values:
          mass: 4200
          cg: 4.1
          newcg: 4.2
          arm: 6
      - id: p3
        values:
          mass: 3500
          cg: 4
          newcg: 4.12
          arm: 5.9
    explanation: >-
      Moments about the datum are conserved: the old moment plus the moment of
      the added load equals the new total mass times the new CG. Solving for the
      added mass x gives x = M (new CG - CG) / (arm - new CG).


      **Solution**


      {{f: mass * (newcg - cg) / (arm - newcg)}} = {{n: mass * (newcg - cg) /
      (arm - newcg)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: divides by the distance from the old CG instead of from
      the new CG.

      - **{{d2}} kg**: subtracts the CG shift from the load arm instead of the
      new CG.

      - **{{d3}} kg**: divides by the new CG value instead of by the lever arm
      to the new CG.
