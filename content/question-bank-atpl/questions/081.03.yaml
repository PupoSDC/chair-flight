    - ATPLGS-622607
  annexes: []
  learningObjectives:
    - 081.03.01.02.11
  template:
    type: calculation
    question: |-
      The stall speed of an aeroplane is known at one mass:

      - Stall speed at reference mass: {{vs}} kt
      - Reference mass: {{mass_ref}} kg
      - New mass: {{mass_new}} kg

      What is the stall speed at the new mass?
    variables:
      - id: vs
        label: Stall speed at reference mass
        unit: kt
      - id: mass_ref
        label: Reference mass
        unit: kg
      - id: mass_new
        label: New mass
        unit: kg
    answer:
      formula: vs * sqrt(mass_new / mass_ref)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs * mass_new / mass_ref
      - id: d2
        formula: vs * sqrt(mass_ref / mass_new)
      - id: d3
        formula: vs * (mass_new / mass_ref) ^ 2
      - id: d4
        formula: vs
    presets:
      - id: p1
        values:
          vs: 100
          mass_ref: 1000
          mass_new: 2000
      - id: p2
        values:
          vs: 100
          mass_ref: 5400
          mass_new: 4700
      - id: p3
        values:
          vs: 120
          mass_ref: 1500
          mass_new: 2500
    explanation: >-
      Stall speed grows with the square root of the mass. A heavier aeroplane
      needs a higher speed to generate the lift that balances its weight, so the
      stall speed rises, but not in direct proportion to the mass.


      **Solution**


      {{f: vs * sqrt(mass_new / mass_ref)}} = {{n: vs * sqrt(mass_new /
      mass_ref)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the mass ratio without the square root, which
      overstates the change.

      - **{{d2}} kt**: inverts the mass ratio, so a heavier aeroplane would
      stall at a lower speed.

      - **{{d3}} kt**: squares the mass ratio instead of taking its square root.

      - **{{d4}} kt**: assumes the stall speed does not change with mass.
