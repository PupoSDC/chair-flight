- id: QZWMTMNG
  docId: "081.03"
  relatedQuestions:
    - QQCKRVAJ
  externalIds:
    - ATPLQ-819471
    - AVEXAM-72327
    - ATPLGS-628114
  annexes: []
  learningObjectives:
    - 081.03.02.02.05
  template:
    type: calculation
    question: The maximum angle of bank that can be achieved with a buffet margin of
      {{margin}} g? Give the answer in degrees.
    variables:
      - id: margin
        label: Buffet margin
        unit: g
    answer:
      formula: acos(1 / (1 + margin))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: acos(1 / (1 + margin) ^ 2)
      - id: d2
        formula: asin(1 / (1 + margin))
      - id: d3
        formula: 2 * acos(1 / (1 + margin))
      - id: d4
        formula: 1.5 * acos(1 / (1 + margin))
    presets:
      - id: p1
        values:
          margin: 0.13
      - id: p2
        values:
          margin: 0.3
    explanation: >-
      A bank angle increases the load factor: n = 1 / cos(bank angle). The
      buffet margin is the extra load factor above 1 g that the aircraft can
      take before buffet starts, so the largest load factor is 1 + buffet
      margin. The bank angle follows from that load factor.


      **Solution**


      - Load factor limit = 1 + {{margin}} = {{= 1 + margin}}

      - Bank angle: cos(bank) = 1 / load factor limit

      - {{f: acos(1 / (1 + margin))}} = {{n: acos(1 / (1 + margin))}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: squares the load factor limit before dividing.

      - **{{d2}}°**: uses the arcsine instead of the arccosine.

      - **{{d3}}°**: doubles the correct bank angle.

      - **{{d4}}°**: multiplies the correct bank angle by 1.5.
