- id: QEWZOQRN
  docId: "081.03"
  relatedQuestions:
    - QFOGFEUK
  externalIds:
    - ATPLQ-814725
    - AVEXAM-47490
    - BGS-810350
    - ATPLGS-625868
    - AVEXAM-35817
  annexes: []
  learningObjectives:
    - 081.03.01.02.10
  template:
    type: calculation
    question: >-
      In straight and level flight at the speed below:


      - Speed: {{k}} VS


      What is the maximum bank angle that can be held in a steady co-ordinated
      level turn, at constant speed and altitude, without stalling? Give the
      answer to the nearest 10°.
    variables:
      - id: k
        label: Speed
        unit: VS
    answer:
      formula: round(acos(1 / k ^ 2) / 10) * 10
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: round(acos(1 / k) / 10) * 10
      - id: d2
        formula: round(asin(1 / k ^ 2) / 10) * 10
      - id: d3
        formula: round(atan(k ^ 4 - 1) / 10) * 10
      - id: d4
        formula: "20"
    presets:
      - id: p1
        values:
          k: 1.4
      - id: p2
        values:
          k: 1.5
    explanation: >-
      The stall speed rises with the square root of the load factor. Reaching
      {{k}} VS in a turn therefore means a load factor of {{k}} squared before
      the stall. In a level turn the load factor is one over the cosine of the
      bank angle.


      **Solution**


      Bank angle = arccos(1 / {{k}}²) = {{= acos(1 / k ^ 2)}}°, which is
      **{{answer}}°** to the nearest 10°.


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the speed ratio instead of its square.

      - **{{d2}}°**: uses the sine instead of the cosine.

      - **{{d3}}°**: forgets the square root in the relationship between the
      load factor and the bank angle.

      - **{{d4}}°**: a bank of only 20 degrees is not what the load factor gives
      here.
