  template:
    type: chart
    question: "Refer to annex. A jet transport aeroplane with a mass of {{mass}}
      tons carries out a steady level {{bank}} degree bank turn at FL{{fl}}. The
      buffet free speed range extends approximately from:"
    explanation: ""
    variables:
      - id: mass
        label: Mass
        unit: tons
      - id: bank
        label: Bank angle
        unit: degrees
      - id: fl
        label: Flight level
        unit: ""
    entries:
      - id: e1
        values:
          mass: 100
          bank: 50
          fl: 320
        answer: M = 0.65 to M > 0.84.
        wrongAnswers:
          - M = 0.70 to M > 0.84.
          - M = 0.74 to M = 0.84.
          - M = 0.72 to M > 0.84.
        explanation: >-
          The buffet free speed range is the band of Mach numbers between the
          low-speed buffet boundary and the high-speed buffet boundary. Find the
          mass, bank angle and flight level on the annex, then read both Mach
          limits from the chart.


          **Solution**


          For 100 tons, a 50 degree bank and FL320, the lower limit is M = 0.65
          and the upper limit is above M = 0.84. The answer is **M = 0.65 to M >
          0.84**.


          **Why the other answers are wrong**


          - **M = 0.70 to M > 0.84.**: misreads the lower Mach limit.

          - **M = 0.74 to M = 0.84.**: misreads both Mach limits.

          - **M = 0.72 to M > 0.84.**: misreads the lower Mach limit by a
          different amount.
