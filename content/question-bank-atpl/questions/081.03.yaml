  template:
    type: calculation
    question: >-
      The stall speed in a level, coordinated turn with a bank angle of
      {{bank}}° increases by which factor compared with straight and level
      flight?


      Give the factor to two decimals.
    variables:
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: sqrt(1 / cos(bank))
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: 1 / cos(bank)
      - id: d2
        formula: sqrt(1 / cos(bank / 2))
      - id: d3
        formula: 1 + bank / 200
      - id: d4
        formula: 1 / cos(bank / 2)
    presets:
      - id: p1
        values:
          bank: 60
      - id: p2
        values:
          bank: 45
      - id: p3
        values:
          bank: 70
    explanation: >-
      In a turn with bank angle b the load factor is one divided by the cosine
      of b. The stall speed rises with the square root of the load factor, so
      the stall speed is multiplied by the square root of that load factor.


      **Solution**


      Load factor = 1 / cos({{bank}}°) = {{= 1 / cos(bank)}}


      {{f: sqrt(1 / cos(bank))}} = {{n: sqrt(1 / cos(bank))}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the load factor itself, not its square root.

      - **{{d2}}**: uses half the bank angle.

      - **{{d3}}**: assumes the increase grows in a straight line with the bank
      angle.

      - **{{d4}}**: uses half the bank angle and forgets the square root.
