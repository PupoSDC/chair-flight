  template:
    type: calculation
    question: |-
      An aircraft is flying straight and level at a given speed:

      - Speed: {{speed}} kt
      - CL: {{cl}}
      - CLmax: {{clmax}}

      Determine the maximum achievable load factor at this speed.
    variables:
      - id: speed
        label: Speed
        unit: kt
      - id: cl
        label: Lift coefficient CL
        unit: ""
      - id: clmax
        label: Maximum lift coefficient CLmax
        unit: ""
    answer:
      formula: clmax / cl
      unit: g
      decimals: 2
    distractors:
      - id: d1
        formula: cl / clmax
      - id: d2
        formula: 1 + clmax / cl
      - id: d3
        formula: sqrt(clmax / cl)
      - id: d4
        formula: clmax * cl
    presets:
      - id: p1
        values:
          speed: 100
          cl: 0.35
          clmax: 1.22
      - id: p2
        values:
          speed: 150
          cl: 0.4
          clmax: 1.5
    explanation: >-
      The load factor is the lift divided by the weight. At a given speed the
      lift is proportional to the lift coefficient, so the lift can be increased
      until the CL reaches its maximum. The load factor that can be reached at
      this speed is therefore the ratio of the maximum CL to the current CL.


      **Solution**


      - {{f: clmax / cl}} = {{n: clmax / cl}} = **{{answer}} g**


      **Why the other answers are wrong**


      - **{{d1}} g**: the inverted ratio, which gives a value below 1 g.

      - **{{d2}} g**: adds 1 to the ratio, as if the load factor were 1 g plus
      the lift ratio.

      - **{{d3}} g**: takes the square root of the ratio.

      - **{{d4}} g**: multiplies the two coefficients instead of dividing them.
