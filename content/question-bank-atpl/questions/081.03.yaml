  template:
    type: calculation
    question: >-
      A medium range jet transport aeroplane is flying straight and level when
      an upgust hits:


      - Load factor during the gust: {{n}} g

      - Straight and level stall speed (VS): {{vs}} kt


      What will the stall speed be during the gust encounter?
    variables:
      - id: n
        label: Load factor in the gust
        unit: g
      - id: vs
        label: Straight and level stall speed VS
        unit: kt
    answer:
      formula: vs * sqrt(n)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs * n
      - id: d2
        formula: vs / sqrt(n)
      - id: d3
        formula: vs * n ^ 2
      - id: d4
        formula: vs * (1 + (n - 1) / 2)
    presets:
      - id: p1
        values:
          n: 1.5
          vs: 172
      - id: p2
        values:
          n: 1.3
          vs: 160
    explanation: >-
      The stall speed rises with the square root of the load factor, because the
      aeroplane stalls when the lift it has to produce, which is the load factor
      times the weight, reaches the same maximum lift coefficient. The stall
      speed during the gust is the straight and level stall speed multiplied by
      the square root of the load factor.


      **Solution**


      - {{f: vs * sqrt(n)}} = {{n: vs * sqrt(n)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: multiplies by the load factor instead of its square root.

      - **{{d2}} kt**: divides by the square root, which lowers the stall speed.

      - **{{d3}} kt**: multiplies by the load factor squared.

      - **{{d4}} kt**: uses a straight-line increase in place of the square
      root.
