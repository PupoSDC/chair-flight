  template:
    type: calculation
    question: |-
      An aeroplane has the following data:

      - Stall speed in straight and level flight (load factor 1): {{vs}} kt
      - Load factor in the turn: {{lf}}

      At what speed will the aeroplane stall in the turn?
    variables:
      - id: vs
        label: Stall speed in straight and level flight
        unit: kt
      - id: lf
        label: Load factor
        unit: ""
    answer:
      formula: vs * sqrt(lf)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs * lf
      - id: d2
        formula: vs * lf ^ 2
      - id: d3
        formula: vs / sqrt(lf)
      - id: d4
        formula: vs * (1 + lf) / 2
    presets:
      - id: p1
        values:
          vs: 100
          lf: 2
      - id: p2
        values:
          vs: 60
          lf: 2
      - id: p3
        values:
          vs: 100
          lf: 1.5
    explanation: >-
      Stall speed grows with the square root of the load factor. In a turn the
      wing must carry more than the aeroplane's weight, so the load factor is
      above 1 and the stall occurs at a higher speed than in level flight.


      **Solution**


      {{f: vs * sqrt(lf)}} = {{n: vs * sqrt(lf)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: multiplies by the load factor directly instead of its
      square root.

      - **{{d2}} kt**: squares the load factor, which overstates the increase.

      - **{{d3}} kt**: divides instead of multiplies, so the stall speed would
      fall in a turn.

      - **{{d4}} kt**: uses the average of 1 and the load factor instead of its
      square root.
