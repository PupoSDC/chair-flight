- id: QFNNLFLTS
  docId: "081.03"
  relatedQuestions:
    - QVLRJNQU
  externalIds:
    - ATPLQ-812974
    - AVEXAM-53985
    - BGS-812401
    - AVEXAM-5965
    - BGS-812600
  annexes: []
  learningObjectives:
    - "081.03"
  template:
    type: calculation
    question: >-
      A light aeroplane has an approach speed of 1.3 VS in the landing
      configuration. At the following values:


      - Mass: {{m1}} kg (maximum take-off mass)

      - Approach speed: {{v1}} kt

      - New mass: {{m2}} kg


      What is the approach speed at the new mass (in kt)?
    variables:
      - id: v1
        label: Known approach speed
        unit: kt
      - id: m1
        label: Maximum take-off mass
        unit: kg
      - id: m2
        label: New mass
        unit: kg
    answer:
      formula: v1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: v1 * m2 / m1
      - id: d2
        formula: v1 * m1 / m2
      - id: d3
        formula: v1 * sqrt(m1 / m2)
      - id: d4
        formula: v1 * (m2 / m1) ^ 2
    presets:
      - id: p1
        values:
          v1: 79
          m1: 1990
          m2: 1590
      - id: p2
        values:
          v1: 65
          m1: 1000
          m2: 1200
    explanation: >-
      The speed needed for the same multiple of VS scales with the square root
      of the mass. The known speed is scaled by the square root of the ratio of
      the new mass to the known mass.


      **Solution**


      {{f: v1 * sqrt(m2 / m1)}} = {{n: v1 * sqrt(m2 / m1)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: scales with the mass ratio instead of its square root.

      - **{{d2}} kt**: inverts the mass ratio, so the speed rises when the mass
      falls.

      - **{{d3}} kt**: inverts the square root of the mass ratio.

      - **{{d4}} kt**: uses the square of the mass ratio.
