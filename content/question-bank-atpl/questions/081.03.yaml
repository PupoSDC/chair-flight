- id: QTVNQADG
  docId: "081.03"
  relatedQuestions:
    - QUGXG9G0D
  externalIds:
    - ATPLQ-815070
  annexes: []
  learningObjectives:
    - 081.03.01.02.11
  template:
    type: calculation
    question: |-
      An aircraft has the following data:

      - Take-off mass: {{mass_to}} t
      - Stall speed at take-off: {{vs_to}} kt
      - Fuel burnt before the start of the approach: {{burnt}} t

      What is the stalling speed at the start of the approach?
    variables:
      - id: mass_to
        label: Take-off mass
        unit: t
      - id: vs_to
        label: Stall speed at take-off
        unit: kt
      - id: burnt
        label: Fuel burnt before approach
        unit: t
    answer:
      formula: vs_to * sqrt((mass_to - burnt) / mass_to)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs_to * sqrt(mass_to / (mass_to - burnt))
      - id: d2
        formula: vs_to * (mass_to - burnt) / mass_to
      - id: d3
        formula: vs_to
      - id: d4
        formula: vs_to * mass_to / (mass_to - burnt)
    presets:
      - id: p1
        values:
          mass_to: 305
          vs_to: 140
          burnt: 63
      - id: p2
        values:
          mass_to: 250
          vs_to: 120
          burnt: 40
      - id: p3
        values:
          mass_to: 180
          vs_to: 110
          burnt: 30
    explanation: >-
      Stall speed depends on mass. As fuel is burnt the aeroplane gets lighter
      and its stall speed falls. The stall speed scales with the square root of
      the mass ratio.


      **Solution**


      Mass at the start of the approach: {{= mass_to - burnt}} t


      {{f: vs_to * sqrt((mass_to - burnt) / mass_to)}} = {{n: vs_to *
      sqrt((mass_to - burnt) / mass_to)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: inverts the mass ratio, so the stall speed would rise as
      fuel is burnt.

      - **{{d2}} kt**: scales the stall speed linearly with mass instead of with
      its square root.

      - **{{d3}} kt**: keeps the take-off stall speed and ignores the lower
      mass.

      - **{{d4}} kt**: inverts the mass ratio and uses it linearly, so the stall
      speed would rise.
