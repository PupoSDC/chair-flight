- id: QALCRKWBS
  docId: "081.03"
  relatedQuestions:
    - QKGCIOTST
  externalIds:
    - ATPLQ-811888
    - BGS-812401
    - AVEXAM-54111
    - ATPLGS-117900
    - BGS-810352
  annexes: []
  learningObjectives:
    - "081.03"
  template:
    type: calculation
    question: |-
      An aircraft has the following data:

      - 1 g stall speed: {{vs_ref}} kt
      - Mass for this stall speed: {{mass_ref}} kg
      - New mass: {{mass}} kg
      - Bank angle: {{bank}}°

      What is the stall speed in the turn?
    variables:
      - id: vs_ref
        label: 1 g stall speed
        unit: kt
      - id: mass_ref
        label: Mass for this stall speed
        unit: kg
      - id: mass
        label: New mass
        unit: kg
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: vs_ref * sqrt(mass / mass_ref) / sqrt(cos(bank))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs_ref * sqrt(mass / mass_ref)
      - id: d2
        formula: vs_ref * sqrt(mass_ref / mass) / sqrt(cos(bank))
      - id: d3
        formula: vs_ref * sqrt(mass / mass_ref) / cos(bank)
      - id: d4
        formula: vs_ref * (mass / mass_ref) / sqrt(cos(bank))
    presets:
      - id: p1
        values:
          vs_ref: 73
          mass_ref: 1500
          mass: 1192
          bank: 45
      - id: p2
        values:
          vs_ref: 80
          mass_ref: 2000
          mass: 1800
          bank: 30
      - id: p3
        values:
          vs_ref: 65
          mass_ref: 1200
          mass: 1400
          bank: 60
    explanation: >-
      The stall speed rises with the square root of the mass. In a banked turn
      the load factor increases as well, which raises the stall speed by a
      further factor of one over the square root of the cosine of the bank
      angle.


      **Solution**


      {{f: vs_ref * sqrt(mass / mass_ref) / sqrt(cos(bank))}} = {{n: vs_ref *
      sqrt(mass / mass_ref) / sqrt(cos(bank))}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: ignores the bank angle, so the turn has no effect on the
      stall speed.

      - **{{d2}} kt**: inverts the mass ratio, so a lighter aircraft would stall
      at a higher speed.

      - **{{d3}} kt**: divides by the cosine instead of the square root of the
      cosine.

      - **{{d4}} kt**: scales with the mass instead of the square root of the
      mass.
