  externalIds:
    - ATPLQ-811209
    - AVEXAM-60924
  annexes: []
  learningObjectives:
    - "081.03"
  template:
    type: calculation
    question: >-
      A light aeroplane is in level flight. The lift equals the weight in both
      cases, and the speed changes as follows:


      - Initial speed: {{v1}} VS

      - New speed: {{v2}} VS


      By what percentage will the coefficient of lift decrease?
    variables:
      - id: v1
        label: Initial speed
        unit: VS
      - id: v2
        label: New speed
        unit: VS
    answer:
      formula: 100 * (1 - (v1 / v2) ^ 2)
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: 100 * (1 - v1 / v2)
      - id: d2
        formula: 100 * v1 / v2
      - id: d3
        formula: 100 * (v1 / v2) ^ 2
      - id: d4
        formula: 100 * (1 - v1 / v2) ^ 2
    presets:
      - id: p1
        values:
          v1: 1.4
          v2: 2.4
      - id: p2
        values:
          v1: 1.2
          v2: 2
    explanation: >-
      With the weight unchanged, the lift stays the same. The coefficient of
      lift therefore falls with the square of the speed.


      **Solution**


      {{f: 100 * (1 - (v1 / v2) ^ 2)}} = {{n: 100 * (1 - (v1 / v2) ^ 2)}} =
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses a straight-line ratio of speeds instead of its
      square.

      - **{{d2}} %**: inverts the speed ratio, so it does not give a decrease.

      - **{{d3}} %**: the coefficient of lift that remains, not the decrease.

      - **{{d4}} %**: squares the whole difference instead of the speed ratio.
