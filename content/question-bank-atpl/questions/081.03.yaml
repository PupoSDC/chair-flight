- id: QKGCIOTST
  docId: "081.03"
  relatedQuestions:
    - QALCRKWBS
  externalIds:
    - ATPLQ-816512
    - ATPLGS-626565
    - AVEXAM-90908
  annexes: []
  learningObjectives:
    - "081.03"
  template:
    type: calculation
    question: >-
      An aeroplane has a stall speed of {{vs_ref}} kt at a mass of {{mass_ref}}
      kg. The same aeroplane has the following loading:


      - Basic empty mass: {{bem}} kg

      - Pilot and baggage: {{baggage}} kg

      - Fuel: {{fuel_litres}} litres (specific gravity {{sg}})


      What is the stall speed in a {{bank}}° banked turn?
    variables:
      - id: vs_ref
        label: Stall speed at reference mass
        unit: kt
      - id: mass_ref
        label: Reference mass
        unit: kg
      - id: bem
        label: Basic empty mass
        unit: kg
      - id: baggage
        label: Pilot and baggage
        unit: kg
      - id: fuel_litres
        label: Fuel volume
        unit: litres
      - id: sg
        label: Specific gravity of fuel
        unit: ""
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: vs_ref * sqrt((bem + baggage + fuel_litres * sg) / mass_ref) /
        sqrt(cos(bank))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs_ref * sqrt((bem + baggage + fuel_litres * sg) / mass_ref)
      - id: d2
        formula: vs_ref * sqrt(mass_ref / (bem + baggage + fuel_litres * sg)) /
          sqrt(cos(bank))
      - id: d3
        formula: vs_ref * sqrt((bem + baggage + fuel_litres) / mass_ref) /
          sqrt(cos(bank))
      - id: d4
        formula: vs_ref * sqrt(bem / mass_ref) / sqrt(cos(bank))
    presets:
      - id: p1
        values:
          vs_ref: 73
          mass_ref: 1550
          bem: 1000
          baggage: 102
          fuel_litres: 120
          sg: 0.77
          bank: 45
      - id: p2
        values:
          vs_ref: 70
          mass_ref: 1400
          bem: 1000
          baggage: 90
          fuel_litres: 100
          sg: 0.8
          bank: 20
      - id: p3
        values:
          vs_ref: 85
          mass_ref: 1800
          bem: 1100
          baggage: 85
          fuel_litres: 150
          sg: 0.78
          bank: 60
    explanation: >-
      The loaded mass is the basic empty mass plus the pilot and baggage plus
      the fuel. The mass of the fuel is its volume times its specific gravity,
      because one litre of water weighs one kilogram. The stall speed scales
      with the square root of the mass ratio and rises in a bank by a further
      factor of one over the square root of the cosine of the bank angle.


      **Solution**


      Loaded mass: {{bem}} + {{baggage}} + {{fuel_litres}} × {{sg}} = {{= bem +
      baggage + fuel_litres * sg}} kg


      {{f: vs_ref * sqrt((bem + baggage + fuel_litres * sg) / mass_ref) /
      sqrt(cos(bank))}} = {{n: vs_ref * sqrt((bem + baggage + fuel_litres * sg)
      / mass_ref) / sqrt(cos(bank))}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: ignores the bank angle, so the turn has no effect on the
      stall speed.

      - **{{d2}} kt**: inverts the mass ratio, so a lighter aeroplane would
      stall at a higher speed.

      - **{{d3}} kt**: uses the fuel volume in litres as if it were a mass,
      leaving out the specific gravity.

      - **{{d4}} kt**: leaves out the pilot, baggage and fuel from the loaded
      mass.
