- id: QPXBPVCR
  docId: "081.03"
  relatedQuestions:
    - QDYZNSQN
  externalIds:
    - ATPLQ-817076
    - BGS-812401
    - AVEXAM-54111
    - ATPLGS-117900
    - BGS-810352
    - AVEXAM-90908
    - AVEXAM-24925
  annexes: []
  learningObjectives:
    - 081.03.01.02.11
  template:
    type: calculation
    question: |-
      An aeroplane has a stall speed of {{vs1}} kt at its mass of {{m1}} kg.

      What is the stall speed when the mass is {{m2}} kg?
    variables:
      - id: vs1
        label: Known stall speed
        unit: kt
      - id: m1
        label: Known mass
        unit: kg
      - id: m2
        label: New mass
        unit: kg
    answer:
      formula: vs1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs1
      - id: d2
        formula: vs1 * m2 / m1
      - id: d3
        formula: vs1 * sqrt(m1 / m2)
      - id: d4
        formula: vs1 * (m2 / m1) ^ (1 / 3)
    presets:
      - id: p1
        values:
          vs1: 78
          m1: 6850
          m2: 5000
      - id: p2
        values:
          vs1: 90
          m1: 6000
          m2: 7200
    explanation: >-
      The stall speed depends on the mass: at stall the lift equals the weight,
      so a heavier aeroplane stalls at a higher speed, and the stall speed rises
      with the square root of the mass. The known stall speed is therefore
      scaled by the square root of the ratio between the new mass and the known
      mass.


      **Solution**


      - {{f: vs1 * sqrt(m2 / m1)}} = {{n: vs1 * sqrt(m2 / m1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: ignores the change in mass.

      - **{{d2}} kt**: scales the stall speed directly with the mass, not its
      square root.

      - **{{d3}} kt**: inverts the mass ratio, so the lighter aeroplane shows a
      higher stall speed.

      - **{{d4}} kt**: uses the cube root of the mass ratio.
- id: QQCKRVAJ
  docId: "081.03"
  relatedQuestions:
    - QZWMTMNG
  externalIds:
    - ATPLQ-812832
    - ATPLGS-129348
  annexes: []
  learningObjectives:
    - 081.03.01.02.10
  template:
    type: calculation
    question: Flying at a speed of {{ratio}} VS, what is the maximum bank angle that
      can be flown without stalling? Give the answer in degrees.
    variables:
      - id: ratio
        label: Speed as a multiple of VS
        unit: VS
    answer:
      formula: acos(1 / ratio ^ 2)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: acos(1 / ratio)
      - id: d2
        formula: asin(1 / ratio ^ 2)
      - id: d3
        formula: acos(1 / ratio ^ 3)
      - id: d4
        formula: acos(1 / ratio ^ 2) / 2
    presets:
      - id: p1
        values:
          ratio: 1.3
      - id: p2
        values:
          ratio: 1.2
    explanation: >-
      In a banked turn the load factor is n = 1 / cos(bank angle). The aircraft
      stalls when its speed falls to VS × √n, so at a speed that is a given
      multiple of VS, the largest load factor it can carry without stalling is
      the square of that multiple. The bank angle follows from that load factor.


      **Solution**


      - Load factor = (speed / VS)² = {{= ratio ^ 2}}

      - Bank angle: cos(bank) = 1 / load factor

      - {{f: acos(1 / ratio ^ 2)}} = {{n: acos(1 / ratio ^ 2)}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the speed ratio itself as the load factor, not its
      square.

      - **{{d2}}°**: uses the arcsine instead of the arccosine of 1 / load
      factor.

      - **{{d3}}°**: cubes the speed ratio instead of squaring it.

      - **{{d4}}°**: halves the correct bank angle.
