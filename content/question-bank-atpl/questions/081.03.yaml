- id: QU7AT08PB
  docId: "081.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-816282
  annexes: []
  learningObjectives:
    - "081.03"
  template:
    type: calculation
    question: >-
      A light aeroplane is in steady, straight and level flight at a low
      subsonic speed, with no flaps. On reaching a turning point, the pilot
      keeps the speed constant and uses the following load factor to maintain
      level flight:


      - Load factor: {{n}}


      By what percentage does the coefficient of lift increase?
    variables:
      - id: n
        label: Load factor
        unit: ""
    answer:
      formula: (n - 1) * 100
      unit: "%"
      decimals: 2
    distractors:
      - id: d1
        formula: (n ^ 2 - 1) * 100
      - id: d2
        formula: (sqrt(n) - 1) * 100
      - id: d3
        formula: "0"
      - id: d4
        formula: (1 / n - 1) * 100
    presets:
      - id: p1
        values:
          n: 1.15
      - id: p2
        values:
          n: 1.3
    explanation: >-
      Lift must equal the load factor times the weight. At a constant speed the
      coefficient of lift therefore rises in the same proportion as the load
      factor.


      **Solution**


      {{f: (n - 1) * 100}} = {{n: (n - 1) * 100}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: squares the load factor instead of using it directly.

      - **{{d2}} %**: takes the square root of the load factor.

      - **{{d3}} %**: assumes the lift does not change.

      - **{{d4}} %**: inverts the load factor, so it shows a decrease.
- id: QUGXG9G0D
  docId: "081.03"
  relatedQuestions:
    - QCF1EDOK9
    - QTVNQADG
  externalIds:
    - ATPLQ-813851
    - AVEXAM-29701
  annexes: []
  learningObjectives:
    - "081.03"
  template:
    type: calculation
    question: |-
      An aeroplane has the following data at take-off:

      - Take-off mass (including fuel): {{mass_to}} t
      - Fuel on board at take-off: {{fuel_to}} t
      - Stall speed at take-off: {{vs_to}} kt
      - Fuel remaining on landing: {{fuel_land}} t

      What is the stalling speed on landing?
    variables:
      - id: mass_to
        label: Take-off mass
        unit: t
      - id: fuel_to
        label: Fuel on board at take-off
        unit: t
      - id: vs_to
        label: Stall speed at take-off
        unit: kt
      - id: fuel_land
        label: Fuel remaining on landing
        unit: t
    answer:
      formula: vs_to * sqrt((mass_to - fuel_to + fuel_land) / mass_to)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs_to * sqrt(mass_to / (mass_to - fuel_to + fuel_land))
      - id: d2
        formula: vs_to * (mass_to - fuel_to + fuel_land) / mass_to
      - id: d3
        formula: vs_to
      - id: d4
        formula: vs_to * mass_to / (mass_to - fuel_to + fuel_land)
    presets:
      - id: p1
        values:
          mass_to: 305
          fuel_to: 75
          vs_to: 175
          fuel_land: 8.5
      - id: p2
        values:
          mass_to: 280
          fuel_to: 60
          vs_to: 150
          fuel_land: 10
      - id: p3
        values:
          mass_to: 200
          fuel_to: 40
          vs_to: 120
          fuel_land: 5
    explanation: >-
      The fuel burnt is the fuel on board at take-off minus the fuel remaining
      on landing, so the landing mass is the take-off mass minus the fuel burnt.
      The stall speed scales with the square root of the mass ratio.


      **Solution**


      {{f: vs_to * sqrt((mass_to - fuel_to + fuel_land) / mass_to)}} = {{n:
      vs_to * sqrt((mass_to - fuel_to + fuel_land) / mass_to)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: inverts the mass ratio, so the stall speed would rise as
      fuel is burnt.

      - **{{d2}} kt**: uses the mass ratio linearly instead of its square root.

      - **{{d3}} kt**: keeps the take-off stall speed and ignores the lower
      landing mass.

      - **{{d4}} kt**: inverts the mass ratio and uses it linearly, so the stall
      speed would rise.
