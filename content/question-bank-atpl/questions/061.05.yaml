  template:
    type: chart
    question: "Refer to the figures. The standard time (ST) in Whitsunday,
      Australia, at 21:30 UTC on the 4th of September is:"
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 07:30 ST on the 5th of September.
        wrongAnswers:
          - 5:30 ST on the 5th of September.
          - 11:30 ST on the 4th of September.
          - 06:30 ST on the 5th of September.
        explanation: >-
          Whitsunday is in the Australian Eastern Standard Time zone, which is
          10 hours ahead of UTC. The time zone is read from the figures. Adding
          the offset to 21:30 UTC passes midnight, so the date moves on to the
          5th.


          **Solution**


          - Standard time = UTC + 10 h

          - 21:30 UTC + 10 h = 07:30 on the next day, the 5th of September


          **Why the other answers are wrong**


          - **5:30 ST on the 5th of September**: an offset of 8 hours is used.

          - **11:30 ST on the 4th of September**: the date is not moved on to
          the 5th.

          - **06:30 ST on the 5th of September**: an offset of 9 hours is used.
