- id: QMEOMZBI9
  docId: "061.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615585
    - ATPLGS-625556
    - AVEXAM-80708
    - ATPLQ-611770
    - AVEXAM-37122
    - AVEXAM-79540
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: >-
      Determine the Local Mean Time (LMT) at the following position:


      - Latitude: {{lat}}° N

      - Longitude: {{lon}}° (east positive, west negative)

      - Coordinated Universal Time (UTC): {{utc}} h (decimal hours, so 14.5
      means 14:30)


      What is the LMT? Give the answer as hh:mm.
    variables:
      - id: lat
        label: Latitude
        unit: °
      - id: lon
        label: Longitude
        unit: °
      - id: utc
        label: UTC
        unit: h
    answer:
      formula: (utc * 60 + 4 * lon) - 1440 * floor((utc * 60 + 4 * lon) / 1440)
      unit: minutes
      decimals: 2
      format: hh:mm
    distractors:
      - id: d1
        formula: (utc * 60 - 4 * lon) - 1440 * floor((utc * 60 - 4 * lon) / 1440)
      - id: d2
        formula: utc * 60
      - id: d3
        formula: utc * 60 + lon
      - id: d4
        formula: utc * 60 + 4 * lon - 60
    presets:
      - id: p1
        values:
          lat: 46
          lon: -94.5
          utc: 14
      - id: p2
        values:
          lat: 65.25
          lon: -161.25
          utc: 19
      - id: p3
        values:
          lat: -20
          lon: 120
          utc: 3.5
    explanation: >-
      Local Mean Time moves by 4 minutes for every degree of longitude. East of
      Greenwich the local clock is ahead of UTC, and west of Greenwich it is
      behind. Convert the UTC time into minutes, add the longitude correction,
      and keep the result within one day.


      **Solution**


      - UTC in minutes: {{utc}} h × 60 = {{= utc * 60}} min

      - Longitude correction: {{lon}}° × 4 min = {{= 4 * lon}} min

      - LMT in minutes: {{= utc * 60}} + ({{= 4 * lon}}) = {{= utc * 60 + 4 *
      lon}} min, within one day **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: applies the longitude correction with the wrong sign

      - **{{d2}}**: ignores the longitude completely

      - **{{d3}}**: adds the longitude in degrees as if it were minutes

      - **{{d4}}**: subtracts one hour from the result
