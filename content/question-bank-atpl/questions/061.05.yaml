- id: QA08QNU35
  docId: "061.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615556
    - BGS-610086
    - AVEXAM-72297
    - ATPLGS-625562
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: >-
      The Local Mean Time at longitude {{lon_d}}°{{lon_m}}'E, at 00:00 UTC,
      is...


      Give the time as hh:mm on the same day.
    variables:
      - id: lon_d
        label: Longitude, degrees
        unit: °
      - id: lon_m
        label: Longitude, minutes
        unit: "'"
    answer:
      formula: round((lon_d + lon_m / 60) * 4)
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: 1440 - round((lon_d + lon_m / 60) * 4)
      - id: d2
        formula: round(lon_d * 4)
      - id: d3
        formula: round((lon_d + lon_m / 60) * 4) + 720
      - id: d4
        formula: round((lon_d + lon_m / 60) / 15) * 60
    presets:
      - id: p1
        values:
          lon_d: 85
          lon_m: 20
      - id: p2
        values:
          lon_d: 100
          lon_m: 10
      - id: p3
        values:
          lon_d: 40
          lon_m: 30
    explanation: >-
      Local Mean Time follows the sun at a place. The Earth turns 15° each hour,
      so every degree of longitude is 4 minutes of time. East of Greenwich the
      local time is ahead of UTC, so the time is found by adding the longitude,
      converted to minutes, to 00:00 UTC.


      **Solution**


      Time added to 00:00 UTC = {{= (lon_d + lon_m / 60) * 4}} minutes


      Local Mean Time = 00:00 + {{= (lon_d + lon_m / 60) * 4}} min =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the longitude is treated as west, so the time is behind UTC
      and falls on the previous day.

      - **{{d2}}**: only the whole degrees are used and the minutes of arc are
      ignored.

      - **{{d3}}**: 12 hours are added, as if the place were on the opposite
      side of the world.

      - **{{d4}}**: the longitude is rounded to the nearest hour (15 degrees)
      before converting.
