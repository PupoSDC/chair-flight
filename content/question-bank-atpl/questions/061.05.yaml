- id: QCPOPDPGW
  docId: "061.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613318
    - ATPLGS-625431
    - AVEXAM-86197
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: >-
      Your position is latitude {{lat}}° N, longitude {{lon}}° (east positive,
      west negative). The local mean time (LMT) at this position is
      {{lmt_h}}:{{lmt_m}}.


      What is the Coordinated Universal Time (UTC) at this moment? Give the
      answer as hh:mm.
    variables:
      - id: lat
        label: Latitude
        unit: °
      - id: lon
        label: Longitude
        unit: °
      - id: lmt_h
        label: LMT hour
        unit: h
      - id: lmt_m
        label: LMT minute
        unit: min
    answer:
      formula: (lmt_h * 60 + lmt_m - 4 * lon) - 1440 * floor((lmt_h * 60 + lmt_m - 4 *
        lon) / 1440)
      unit: minutes
      decimals: 2
      format: hh:mm
    distractors:
      - id: d1
        formula: (lmt_h * 60 + lmt_m + 4 * lon) - 1440 * floor((lmt_h * 60 + lmt_m + 4 *
          lon) / 1440)
      - id: d2
        formula: lmt_h * 60 + lmt_m
      - id: d3
        formula: (lmt_h * 60 + lmt_m - 4 * lon) + 60
      - id: d4
        formula: lmt_h * 60 + lmt_m - lon
    presets:
      - id: p1
        values:
          lat: 45.25
          lon: 75.5
          lmt_h: 7
          lmt_m: 40
      - id: p2
        values:
          lat: 52
          lon: -60
          lmt_h: 12
          lmt_m: 30
      - id: p3
        values:
          lat: -33
          lon: -120
          lmt_h: 3
          lmt_m: 20
    explanation: >-
      Local Mean Time moves by 4 minutes for every degree of longitude. East of
      Greenwich the local clock is ahead of UTC, and west of Greenwich it is
      behind. To find UTC, take the longitude correction away from the local
      time, and keep the result within one day.


      **Solution**


      - Local time in minutes after midnight: {{lmt_h}}:{{lmt_m}} = {{= lmt_h *
      60 + lmt_m}} min

      - Longitude correction: {{lon}}° × 4 min = {{= 4 * lon}} min

      - UTC in minutes: {{= lmt_h * 60 + lmt_m}} − ({{= 4 * lon}}) = {{= lmt_h *
      60 + lmt_m - 4 * lon}} min, within one day **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the longitude correction instead of subtracting it

      - **{{d2}}**: ignores the longitude completely

      - **{{d3}}**: adds one hour to the result

      - **{{d4}}**: subtracts the longitude in degrees as if it were minutes
