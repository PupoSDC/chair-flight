- id: Q1HCBPVV7
  docId: "061.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614388
    - ATPLGS-625483
    - AVEXAM-63178
    - ATPLQ-616211
    - AVEXAM-1148
    - ATPLGS-626201
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: A time difference of {{hours}} hours, {{minutes}} minutes and
      {{seconds}} seconds corresponds to a longitude difference of how many
      degrees and minutes?
    variables:
      - id: hours
        label: Hours
        unit: h
      - id: minutes
        label: Minutes
        unit: min
      - id: seconds
        label: Seconds
        unit: s
    answer:
      formula: round((hours * 3600 + minutes * 60 + seconds) / 4)
      unit: minutes
      decimals: 0
      format: h'°'mm'′'
    distractors:
      - id: d1
        formula: round((hours * 3600 + minutes * 60 + seconds) / 3.75)
      - id: d2
        formula: round((hours * 3600 + minutes * 60 + seconds) / 4.5)
      - id: d3
        formula: round((hours * 3600 + minutes * 60 + seconds) / 4 + 60)
      - id: d4
        formula: round((hours * 3600 + minutes * 60 + seconds) / 240)
    presets:
      - id: p1
        values:
          hours: 5
          minutes: 20
          seconds: 20
      - id: p2
        values:
          hours: 9
          minutes: 17
          seconds: 0
      - id: p3
        values:
          hours: 3
          minutes: 10
          seconds: 40
    explanation: >-
      The Earth turns 15° every hour, so each hour of time difference
      corresponds to 15° of longitude. Each minute of time is therefore 15
      minutes of arc, and each second of time is a quarter of a minute of arc.
      The time is turned into seconds and then into minutes of arc, which are
      shown as degrees and minutes.


      **Solution**


      - Time in seconds: {{n: hours * 3600 + minutes * 60 + seconds}} s

      - Longitude difference: {{n: (hours * 3600 + minutes * 60 + seconds) / 4}}
      minutes of arc, which is **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the time has been divided by 3.75 instead of 4, which is the
      wrong rate of turn.

      - **{{d2}}**: the time has been divided by 4.5, which is the wrong rate of
      turn.

      - **{{d3}}**: one degree (60 minutes of arc) has been added to the result.

      - **{{d4}}**: the result in degrees has been read as minutes of arc, so
      the answer is far too small.
