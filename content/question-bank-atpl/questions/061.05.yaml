    explanation: >-
      Evening civil twilight ends when the sun is 6° below the horizon. The
      figure gives this time in UTC, so the time zone difference has to be added
      to get the standard time (ST) of Tasmania.


      **Solution**


      - End of evening civil twilight in UTC, read from the figure:
      {{ect_h}}:{{ect_m}} UTC

      - Add 10 hours for the Tasmania zone (UTC + 10)

      - Standard time: **{{answer}} ST**


      **Why the other answers are wrong**


      - **{{d1}} ST**: the time zone difference is not added, so the UTC time is
      given.

      - **{{d2}} ST**: the zone is taken as UTC + 5 hours.

      - **{{d3}} ST**: the zone is taken as UTC + 11 hours.

      - **{{d4}} ST**: the zone is taken as UTC + 9 hours.
