- id: QFPMEZVV
  docId: 061.05.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-612575
    - BGS-610758
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: >-
      An aircraft departs from an airport and, after a flight, lands at a
      destination airport. Determine the Local Mean Time (LMT) on landing,
      given:


      - Departure time: {{dep_h}}:{{dep_m}} LMT

      - Longitude of departure airport: {{dep_lon}}° (east positive, west
      negative)

      - Flight time: {{flight_h}} hours

      - Longitude of destination airport: {{dest_lon}}° (east positive, west
      negative)


      What is the Local Mean Time on landing?
    variables:
      - id: dep_h
        label: departure hour
        unit: h
      - id: dep_m
        label: departure minutes
        unit: min
      - id: dep_lon
        label: departure longitude
        unit: °
      - id: flight_h
        label: flight time
        unit: h
      - id: dest_lon
        label: destination longitude
        unit: °
    answer:
      formula: ((dep_h * 60 + dep_m + flight_h * 60 + 4 * (dest_lon - dep_lon - 360 *
        floor((dest_lon - dep_lon) / 360))) - 1440 * floor((dep_h * 60 + dep_m +
        flight_h * 60 + 4 * (dest_lon - dep_lon - 360 * floor((dest_lon -
        dep_lon) / 360))) / 1440))
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: dep_h * 60 + dep_m + flight_h * 60
      - id: d2
        formula: ((dep_h * 60 + dep_m + flight_h * 60 - 4 * (dest_lon - dep_lon - 360 *
          floor((dest_lon - dep_lon) / 360))) - 1440 * floor((dep_h * 60 + dep_m
          + flight_h * 60 - 4 * (dest_lon - dep_lon - 360 * floor((dest_lon -
          dep_lon) / 360))) / 1440))
      - id: d3
        formula: ((dep_h * 60 + dep_m + 4 * (dest_lon - dep_lon - 360 * floor((dest_lon
          - dep_lon) / 360))) - 1440 * floor((dep_h * 60 + dep_m + 4 * (dest_lon
          - dep_lon - 360 * floor((dest_lon - dep_lon) / 360))) / 1440))
      - id: d4
        formula: ((dep_h * 60 + dep_m + 2 * flight_h * 60 + 4 * (dest_lon - dep_lon -
          360 * floor((dest_lon - dep_lon) / 360))) - 1440 * floor((dep_h * 60 +
          dep_m + 2 * flight_h * 60 + 4 * (dest_lon - dep_lon - 360 *
          floor((dest_lon - dep_lon) / 360))) / 1440))
    presets:
      - id: p1
        values:
          dep_h: 2
          dep_m: 43
          dep_lon: 160
          flight_h: 3
          dest_lon: -170
      - id: p2
        values:
          dep_h: 9
          dep_m: 20
          dep_lon: -75
          flight_h: 4
          dest_lon: -150
      - id: p3
        values:
          dep_h: 6
          dep_m: 15
          dep_lon: 20
          flight_h: 2
          dest_lon: 65
    explanation: >-
      Local Mean Time depends on longitude. The sun moves 15° per hour, so each
      degree of longitude travelled eastward adds 4 minutes to the clock and
      each degree travelled westward takes 4 minutes away. The longitude change
      is taken as the eastward distance from the departure meridian to the
      destination meridian, and the result is kept within one day.


      **Solution**


      Departure time plus flight time: {{= dep_h * 60 + dep_m + flight_h * 60}}
      minutes after midnight


      Eastward longitude change: {{= dest_lon - dep_lon - 360 * floor((dest_lon
      - dep_lon) / 360)}}° = {{= (dest_lon - dep_lon - 360 * floor((dest_lon -
      dep_lon) / 360)) * 4}} minutes


      Total: {{= dep_h * 60 + dep_m + flight_h * 60 + 4 * (dest_lon - dep_lon -
      360 * floor((dest_lon - dep_lon) / 360))}} minutes, within one day:
      **{{answer}} LMT**


      **Why the other answers are wrong**


      - **{{d1}}**: forgets the change of longitude and uses the departure time
      plus flight time only.

      - **{{d2}}**: subtracts the eastward change instead of adding it, which
      moves the clock the wrong way.

      - **{{d3}}**: leaves out the flight time.

      - **{{d4}}**: counts the flight time twice.
- id: QFWJUIHO
  docId: 061.05.03
  relatedQuestions: []
  externalIds:
    - ATPLQ-615261
    - BGS-610109
    - AVEXAM-7725
  annexes:
    - 061-sunrise-and-sunset-tables-november-19-22-25-28-and
  learningObjectives:
    - 061.05.02.01.01
    - 061.05.03.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Find the UTC of sunrise on 6 December at Winnipeg,
      Canada (49°50'N, 097°30'W). The local time of sunrise and the UTC offset
      of the local time zone are read from the figure.


      Give the answer in hours and minutes.


      What is the UTC of sunrise?
    variables:
      - id: sunrise_min
        label: Local sunrise time (read from the figure, in minutes after midnight)
        unit: min
      - id: utc_offset
        label: UTC offset of the local time zone (read from the figure)
        unit: h
    chartInputs:
      - sunrise_min
      - utc_offset
    answer:
      formula: sunrise_min - utc_offset * 60
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: sunrise_min
      - id: d2
        formula: sunrise_min + utc_offset * 60
      - id: d3
        formula: sunrise_min - utc_offset * 60 - 60
      - id: d4
        formula: sunrise_min - utc_offset * 30
    presets:
      - id: p1
        values:
          sunrise_min: 491
          utc_offset: -6
      - id: p2
        values:
          sunrise_min: 425
          utc_offset: 1
    explanation: >-
      Local time is converted to UTC by subtracting the UTC offset of the time
      zone. The sunrise time and the offset are both read from the figure.


      **Solution**


      - UTC = local time - UTC offset = local time - ({{utc_offset}} h)

      - UTC of sunrise = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the local time is given without any conversion.

      - **{{d2}}**: the offset is added instead of subtracted.

      - **{{d3}}**: an extra hour is subtracted.

      - **{{d4}}**: only half of the offset is applied.
