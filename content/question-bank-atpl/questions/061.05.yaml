- id: QECSW97RC
  docId: "061.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616146
    - ATPLGS-626323
    - BGS-611491
    - ATPLQ-617178
    - BGS-611426
    - AVEXAM-8704
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: >-
      An aircraft flies between two positions. Determine the arc-to-time
      difference between them, given:


      - Longitude of position A: {{lon_a}}° (east positive, west negative)

      - Longitude of position B: {{lon_b}}° (east positive, west negative)


      What is the arc-to-time difference?
    variables:
      - id: lon_a
        label: longitude A
        unit: °
      - id: lon_b
        label: longitude B
        unit: °
    answer:
      formula: round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)) * 4)
      unit: minutes
      decimals: 2
      format: h 'hours' m 'minutes'
    distractors:
      - id: d1
        formula: round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)) * 15)
      - id: d2
        formula: round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)))
      - id: d3
        formula: round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)) / 4)
      - id: d4
        formula: round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)) * 4 + 60)
    presets:
      - id: p1
        values:
          lon_a: 139.83
          lon_b: -149.87
      - id: p2
        values:
          lon_a: -0.46
          lon_b: -73.78
      - id: p3
        values:
          lon_a: 15
          lon_b: -100
    explanation: >-
      The Earth turns through 360° of longitude in 24 hours, so every degree of
      longitude corresponds to 4 minutes of time. The arc-to-time difference
      uses the shorter arc between the two meridians, which is never more than
      180°.


      **Solution**


      Longitude difference: {{= abs(lon_a - lon_b)}}°, shorter arc: {{=
      min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b))}}°


      {{f: round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)) * 4)}} = {{n:
      round(min(abs(lon_a - lon_b), 360 - abs(lon_a - lon_b)) * 4)}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: multiplies the shorter arc by 15, the rate for one hour,
      instead of 4 minutes per degree.

      - **{{d2}}**: uses the degrees directly as minutes, forgetting the factor
      of 4.

      - **{{d3}}**: divides by 4 instead of multiplying, which inverts the
      conversion.

      - **{{d4}}**: adds an extra hour to the correct value.
