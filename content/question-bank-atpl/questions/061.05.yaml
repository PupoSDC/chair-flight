- id: QAF1ARAGE
  docId: "061.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611428
    - ATPLGS-626202
    - AVEXAM-22036
  annexes: []
  learningObjectives:
    - 061.05.01.02.01
  template:
    type: calculation
    question: >-
      Calculate the time difference between the Local Mean Times (LMT) of two
      points:


      - Point A: longitude {{lon_a}}° (east positive, west negative)

      - Point B: longitude {{lon_b}}° (east positive, west negative)


      Give the time difference as hours and minutes.
    variables:
      - id: lon_a
        label: Longitude of A
        unit: °
      - id: lon_b
        label: Longitude of B
        unit: °
    answer:
      formula: abs(lon_a - lon_b) * 4
      unit: minutes
      decimals: 2
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: abs(lon_a - lon_b) * 4 + 3
      - id: d2
        formula: abs(lon_a - lon_b) * 4.2
      - id: d3
        formula: abs(lon_a - lon_b) * 4 - 1
      - id: d4
        formula: abs(lon_a - lon_b)
    presets:
      - id: p1
        values:
          lon_a: -105.3333
          lon_b: -86.5
      - id: p2
        values:
          lon_a: -60
          lon_b: -40
      - id: p3
        values:
          lon_a: -150
          lon_b: -140
    explanation: >-
      The sun moves 15° in one hour, so each degree of longitude is 4 minutes of
      local time. The time difference between two LMTs is four minutes times the
      number of degrees between the two meridians, whichever side of the other
      they are on.


      **Solution**


      - Longitude difference: |{{lon_a}}° − {{lon_b}}°| = {{= abs(lon_a -
      lon_b)}}°

      - Time difference: {{= abs(lon_a - lon_b)}}° × 4 min = {{= abs(lon_a -
      lon_b) * 4}} min = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds 3 minutes to the correct result

      - **{{d2}}**: uses 4.2 minutes per degree instead of 4

      - **{{d3}}**: subtracts one minute from the correct result

      - **{{d4}}**: forgets to convert degrees of longitude into minutes of time
