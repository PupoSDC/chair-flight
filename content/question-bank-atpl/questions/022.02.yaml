      Considering that the probe recovery coefficient is {{r}}, the present
      weather conditions (OAT) compared with the standard atmosphere are ISA + ?
      (in °C; ISA deviation, negative if colder).
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: mach
        label: Mach number
        unit: ""
      - id: tat
        label: Indicated TAT
        unit: °C
      - id: r
        label: Probe recovery coefficient
        unit: ""
    answer:
      formula: (tat + 273.15) / (1 + 0.2 * r * mach ^ 2) - 273.15 - (15 - 2 * fl / 10)
      unit: °C
      decimals: 0
    distractors:
      - id: d1
        formula: (tat + 273.15) / (1 + 0.2 * mach ^ 2) - 273.15 - (15 - 2 * fl / 10)
      - id: d2
        formula: tat - (15 - 2 * fl / 10)
      - id: d3
        formula: (15 - 2 * fl / 10) - ((tat + 273.15) / (1 + 0.2 * r * mach ^ 2) -
          273.15)
      - id: d4
        formula: "0"
    presets:
      - id: p1
        values:
          fl: 300
          mach: 0.36
          tat: -19
          r: 0.84
      - id: p2
        values:
          fl: 350
          mach: 0.78
          tat: -27
          r: 0.84
      - id: p3
        values:
          fl: 330
          mach: 0.8
          tat: -38
          r: 0.84
    explanation: >-
      The probe measures total air temperature, which is higher than the static
      air temperature (OAT) because of ram rise: TAT = SAT x (1 + 0.2 x r x M^2)
      in kelvin. Remove the ram rise, then compare with the ISA temperature at
      the flight level (15°C - 2°C per 1000 ft).


      **Solution**


      SAT = {{f: (tat + 273.15) / (1 + 0.2 * r * mach ^ 2) - 273.15}} = {{= (tat
      + 273.15) / (1 + 0.2 * r * mach ^ 2) - 273.15}}°C


      ISA temperature at FL{{fl}} = {{= (15 - 2 * fl / 10)}}°C


      Deviation = {{= (tat + 273.15) / (1 + 0.2 * r * mach ^ 2) - 273.15}} -
      ({{= (15 - 2 * fl / 10)}}) = **{{answer}}°C**


      **Why the other answers are wrong**

      - **{{d1}} °C**: ignores the probe recovery coefficient (assumes 100 %
      recovery).

      - **{{d2}} °C**: compares the TAT itself with ISA, without removing the
      ram rise.

      - **{{d3}} °C**: reverses the sign of the deviation.

      - **{{d4}} °C**: assumes standard conditions.
