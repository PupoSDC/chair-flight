  template:
    type: calculation
    question: An aircraft has a vertical (or linear) speed of {{v}} ft/min. What is
      the equivalent speed in metres per second (m/s)?
    variables:
      - id: v
        label: Speed
        unit: ft/min
    answer:
      formula: v * 0.3048 / 60
      unit: m/s
      decimals: 1
    distractors:
      - id: d1
        formula: v * 0.3048
      - id: d2
        formula: v * 0.3048 * 60
      - id: d3
        formula: v / 60
      - id: d4
        formula: v * 0.5144
    presets:
      - id: p1
        values:
          v: 800
      - id: p2
        values:
          v: 470
      - id: p3
        values:
          v: 1500
    explanation: >-
      1 ft = 0.3048 m and 1 min = 60 s, so ft/min x 0.3048 / 60 = m/s (about
      0.00508 m/s per ft/min).


      **Solution**


      {{f: v * 0.3048 / 60}} = {{n: v * 0.3048 / 60}} = **{{answer}} m/s**


      **Why the other answers are wrong**

      - **{{d1}} m/s**: converts feet to metres but forgets to convert minutes
      to seconds (this is m/min).

      - **{{d2}} m/s**: multiplies by 60 instead of dividing, so the time
      conversion goes the wrong way.

      - **{{d3}} m/s**: converts only minutes to seconds and leaves the unit in
      feet (ft/s).

      - **{{d4}} m/s**: uses the knots-to-m/s factor (0.5144) instead of the
      feet-per-minute conversion.
