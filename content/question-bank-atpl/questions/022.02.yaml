  template:
    type: calculation
    question: What is the speed of sound (in kt) at sea level in ISA+{{dev}} conditions?
    variables:
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: 38.97 * sqrt(288.15 + dev)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: 38.97 * sqrt(288.15)
      - id: d2
        formula: 38.97 * sqrt(288.15 - dev)
      - id: d3
        formula: 38.97 * sqrt(273.15 + dev)
      - id: d4
        formula: 20.05 * sqrt(288.15 + dev)
    presets:
      - id: p1
        values:
          dev: 20
      - id: p2
        values:
          dev: 10
      - id: p3
        values:
          dev: 30
    explanation: >-
      The speed of sound is a = 38.97 x sqrt(T) kt with T in kelvin. At sea
      level ISA is 15°C (288.15 K); ISA+{{dev}} adds {{dev}} K.


      **Solution**


      {{f: 38.97 * sqrt(288.15 + dev)}} = {{n: 38.97 * sqrt(288.15 + dev)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**

      - **{{d1}} kt**: ignores the ISA deviation.

      - **{{d2}} kt**: subtracts the deviation instead of adding it.

      - **{{d3}} kt**: uses 273.15 K as the base, i.e. 0°C instead of 15°C ISA.

      - **{{d4}} kt**: uses the constant for m/s (20.05) instead of knots.
