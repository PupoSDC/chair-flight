  docId: 022.02.07.01
  relatedQuestions:
    - QEBIEKSB
  externalIds:
    - ATPLQ-226259
    - AVEXAM-81579
    - BGS-220180
    - ATPLGS-106225
  annexes: []
  learningObjectives:
    - 022.02.07.01.01
  template:
    type: calculation
    question: An aeroplane is flying at FL{{fl}} with a TAS of {{tas}} kt in
      standard (ISA) conditions. What is the Mach number?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: tas / (38.97 * sqrt(15 - 1.98 * fl / 10 + 273.15))
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: tas / 661.5
      - id: d2
        formula: tas / (38.97 * sqrt((15 - 1.98 * fl / 10 + 273.15) + 20))
      - id: d3
        formula: tas / (38.97 * sqrt((15 - 1.98 * fl / 10 + 273.15) - 20))
      - id: d4
        formula: 38.97 * sqrt(15 - 1.98 * fl / 10 + 273.15) / tas
    presets:
      - id: p1
        values:
          fl: 300
          tas: 470
      - id: p2
        values:
          fl: 250
          tas: 440
      - id: p3
        values:
          fl: 330
          tas: 460
    explanation: >-
      Mach number = TAS / local speed of sound. The speed of sound depends only
      on the air temperature: a = 38.97 x sqrt(T in K) kt. In ISA the
      temperature at altitude is 15°C - 1.98°C per 1000 ft.


      **Solution**


      T = {{= (15 - 1.98 * fl / 10 + 273.15)}} K, so a = {{= 38.97 * sqrt(15 -
      1.98 * fl / 10 + 273.15)}} kt


      {{f: tas / (38.97 * sqrt(15 - 1.98 * fl / 10 + 273.15))}} = **{{answer}}**


      **Why the other answers are wrong**

      - **{{d1}} **: divides by the sea-level speed of sound (661.5 kt) instead
      of the speed at the flight level.

      - **{{d2}} **: uses a temperature 20 K warmer than ISA.

      - **{{d3}} **: uses a temperature 20 K colder than ISA.

      - **{{d4}} **: inverts the ratio (speed of sound over TAS).
