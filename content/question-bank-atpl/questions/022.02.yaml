    - 022.02.07.01.01
  template:
    type: calculation
    question: If the outside temperature at 35 000 ft is {{oat}}°C, what is the
      local speed of sound (in kt)?
    variables:
      - id: oat
        label: Outside air temperature
        unit: °C
    answer:
      formula: 38.97 * sqrt(oat + 273.15)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: 38.97 * sqrt(abs(oat))
      - id: d2
        formula: 38.97 * sqrt(273.15 - oat)
      - id: d3
        formula: "661.5"
      - id: d4
        formula: 20.05 * sqrt(oat + 273.15)
    presets:
      - id: p1
        values:
          oat: -40
      - id: p2
        values:
          oat: -55
      - id: p3
        values:
          oat: -30
    explanation: >-
      The speed of sound depends only on the absolute temperature: a = 38.97 x
      sqrt(T) kt, with T in kelvin (T = OAT + 273.15).


      **Solution**


      {{f: 38.97 * sqrt(oat + 273.15)}} = {{n: 38.97 * sqrt(oat + 273.15)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**

      - **{{d1}} kt**: uses the temperature in degrees Celsius instead of
      kelvin.

      - **{{d2}} kt**: subtracts the temperature from 273.15 instead of adding
      it.

      - **{{d3}} kt**: uses the sea-level ISA speed of sound regardless of
      temperature.

      - **{{d4}} kt**: uses the constant for m/s (20.05) instead of knots.
