  template:
    type: simple
    question: At the Tenerif’s Accident of 1977 two aircraft collided when one
      aircraft started the take off run while the other was taxiing onto the
      runway (taxiway was occupied). The aircraft taking off reported, “we are
      now at take-off”, and the tower replied “OK…, stand by for take-off. I
      will call you”. Simultaneously, the other aircraft taxiing onto the runway
      reported, “ah…hu..we are still taxiing down the runway”. What is the
      reason these last two transmissions might NOT have reached the take-off
      aircraft?
    explanation: ""
    options:
      - id: ORONZCAH3
        text: A technical reason is NOT to be suspected. Most likely, the crew was
          absorbed by the takeoff and probably failed to notice the calls.
        correct: false
        why: ""
      - id: O8U5EV1D6
        text: If neither of the two messages was received, there must have been a
          failure of the receiver of the aircraft taking off. There is NO other
          possible explanation.
        correct: false
        why: ""
      - id: OED1OK3EH
        text: The message of the Tower must have been received. The transmissions of
          ground stations have a general priority to supersede other
          simultaneous transmissions.
        correct: false
        why: ""
      - id: OE0HFHKKY
        text: As simultaneous transmissions on one frequency are NOT possible, they can
          block each other out. NOTHING or just interference noises might have
          been heard instead.
        correct: true
        why: ""
