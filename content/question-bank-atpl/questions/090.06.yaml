    - ATPLQ-904904
    - AVEXAM-28567
  annexes: []
  learningObjectives:
    - 090.06.01.01.06
  template:
    type: calculation
    question: "If the range of a VHF signal needs to be increased from {{r1}} NM to
      {{r2}} NM, the power of the transmitter needs to be increased by a factor
      of:"
    variables:
      - id: r1
        label: Initial range
        unit: NM
      - id: r2
        label: New range
        unit: NM
    answer:
      formula: (r2 / r1)^2
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: r2 / r1
      - id: d2
        formula: (r2 / r1)^3
      - id: d3
        formula: (r2 / r1)^4
    presets:
      - id: p1
        values:
          r1: 50
          r2: 100
      - id: p2
        values:
          r1: 40
          r2: 120
      - id: p3
        values:
          r1: 30
          r2: 150
    explanation: >-
      The range of a VHF signal grows with the square root of the transmitter
      power. To cover a longer range, the power must therefore rise with the
      square of the range ratio, not with the ratio itself.


      **Solution**


      {{f: (r2 / r1)^2}} = {{n: (r2 / r1)^2}} = **{{answer}} times the original
      power**


      **Why the other answers are wrong**


      - **{{d1}} times**: uses the range ratio itself, which assumes power must
      grow in step with range.

      - **{{d2}} times**: cubes the range ratio instead of squaring it.

      - **{{d3}} times**: raises the range ratio to the fourth power.
