- id: QOYAVLLDE
  docId: "033.04"
  relatedQuestions:
    - QKXUYWUT
  externalIds:
    - ATPLQ-332872
    - ATPLGS-627130
    - AVEXAM-14853
    - BGS-330384
  annexes: []
  learningObjectives:
    - 033.04.03.01.02
  template:
    type: calculation
    question: >-
      Given the following information:


      - CAS: {{cas}} kt

      - Altitude: {{alt}} ft

      - Temperature: ISA {{isa}}°C

      - True course: {{tc}}°

      - Wind (W/V): {{wdir}}°/{{wspeed}} kt

      - Distance from departure to destination: {{dist}} NM

      - Endurance: 3 hours


      What is the distance from the departure point to the Point of Equal Time
      (PET)?
    variables:
      - id: cas
        label: CAS
        unit: kt
      - id: alt
        label: Altitude
        unit: ft
      - id: isa
        label: Temperature deviation from ISA
        unit: °C
      - id: tc
        label: True course
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspeed
        label: Wind speed
        unit: kt
      - id: dist
        label: Distance departure to destination
        unit: NM
    answer:
      formula: dist * ((cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 /
        (288.15 - 0.0019812 * alt + isa))) + (wspeed * cos(wdir - tc))) / (2 *
        (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 / (288.15 -
        0.0019812 * alt + isa))))
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: dist / 2
      - id: d2
        formula: dist * ((cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 /
          (288.15 - 0.0019812 * alt + isa))) - (wspeed * cos(wdir - tc))) / (2 *
          (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 / (288.15 -
          0.0019812 * alt + isa))))
      - id: d3
        formula: dist * (cas + (wspeed * cos(wdir - tc))) / (2 * cas)
      - id: d4
        formula: dist * ((cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 /
          (288.15 - 0.0019812 * alt + isa))) + (wspeed * cos(wdir - tc))) / (2 *
          (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 / (288.15 -
          0.0019812 * alt + isa))) + (wspeed * cos(wdir - tc)))
    presets:
      - id: p1
        values:
          cas: 190
          alt: 9000
          isa: -10
          tc: 350
          wdir: 320
          wspeed: 40
          dist: 350
      - id: p2
        values:
          cas: 160
          alt: 5000
          isa: 5
          tc: 270
          wdir: 300
          wspeed: 30
          dist: 400
    explanation: >-
      The point of equal time is the point from which flying back to the
      departure point takes the same time as flying on to the destination. Its
      distance from departure depends on the true airspeed (the CAS corrected
      for altitude and temperature) and on the wind along the route.


      **Solution**


      - True airspeed: {{= (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 *
      288.15 / (288.15 - 0.0019812 * alt + isa)))}} kt

      - Headwind component: {{= (wspeed * cos(wdir - tc))}} kt

      - Distance to the PET: **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: takes half the distance and ignores the wind.

      - **{{d2}} NM**: uses the headwind with the wrong sign.

      - **{{d3}} NM**: uses the CAS instead of the true airspeed.

      - **{{d4}} NM**: puts the wind in the wrong place in the formula.
