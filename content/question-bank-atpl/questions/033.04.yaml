  template:
    type: calculation
    question: |-
      The point of equal time (PET) is found for the following leg.

      - Distance from departure to destination: {{dist}} NM
      - GS out: {{gsout}} kt
      - GS home: {{gsback}} kt

      What is the time to the PET from the departure point (in minutes)?
    variables:
      - id: dist
        label: Distance departure to destination
        unit: NM
      - id: gsout
        label: GS out
        unit: kt
      - id: gsback
        label: GS home
        unit: kt
    answer:
      formula: dist * gsback / (gsout + gsback) / gsout * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: dist * gsback / (gsout + gsback) / gsback * 60
      - id: d2
        formula: dist * gsback / (gsout + gsback) / gsout
      - id: d3
        formula: dist / gsout * 60
      - id: d4
        formula: dist * gsout / (gsout + gsback) / gsback * 60
    presets:
