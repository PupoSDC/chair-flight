  template:
    type: calculation
    question: >-
      Given the following information, what is the distance of the Point of Safe
      Return (PSR) from the departure point (in NM)?


      - Distance from departure to destination: {{total}} NM

      - Safe endurance: {{endurance_min}} min

      - Ground speed out: {{gs_out}} kt

      - Ground speed home: {{gs_home}} kt
    variables:
      - id: total
        label: Distance departure to destination
        unit: NM
      - id: endurance_min
        label: Safe endurance
        unit: min
      - id: gs_out
        label: Ground speed out
        unit: kt
      - id: gs_home
        label: Ground speed home
        unit: kt
    answer:
      formula: gs_out * endurance_min / 60 * gs_home / (gs_out + gs_home)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: total - gs_out * endurance_min / 60 * gs_home / (gs_out + gs_home)
      - id: d2
        formula: endurance_min / 60 * gs_out
      - id: d3
        formula: total * gs_home / (gs_out + gs_home)
      - id: d4
        formula: gs_out * endurance_min / 60 * gs_home / (gs_out + gs_home) / 2
    presets:
      - id: p1
        values:
          total: 950
          endurance_min: 210
          gs_out: 320
          gs_home: 400
      - id: p2
        values:
          total: 1200
          endurance_min: 180
          gs_out: 300
          gs_home: 450
    explanation: >-
      The PSR is where the time to fly back from it equals the remaining safe
      endurance. The time to the PSR is t = endurance x GS home / (GS out + GS
      home), and the distance from departure is the outbound ground speed
      multiplied by that time.


      **Solution**


      Time to PSR: {{n: endurance_min / 60 * gs_home / (gs_out + gs_home)}} h


      Distance from departure: {{f: gs_out * endurance_min / 60 * gs_home /
      (gs_out + gs_home)}} = {{n: gs_out * endurance_min / 60 * gs_home /
      (gs_out + gs_home)}} = **{{answer}} NM**


      **Why the other answers are wrong**

      - **{{d1}} NM**: gives the distance from the PSR to the destination
      instead of from the departure point.

      - **{{d2}} NM**: ignores the ground-speed ratio and multiplies the
      endurance by the outbound ground speed.

      - **{{d3}} NM**: splits the total distance with the ratio inverted.

      - **{{d4}} NM**: halves the correct distance.
