      - True track: 280°
      - W/V: 100/80
      - TAS: 440 kt

      What is the distance and time of the PET from the departure point?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: "Distance: 450 NM Time: 52 min"
        wrongAnswers:
          - "Distance: 550 NM Time: 75 min"
          - "Distance: 650 NM Time: 108 min"
          - "Distance: 650 NM Time: 75 min"
        explanation: The wind comes from 100° and the track is 280°, so it is a direct
          tailwind of 80 kt. The ground speed out is 440 + 80 = 520 kt and the
          ground speed back is 440 - 80 = 360 kt. The PET distance is 1100 × 360
          / (360 + 520) = 450 NM, and the time out is 450 / 520 hours, which is
          about 52 minutes.
- id: QMVEZHTZ
  docId: "033.04"
