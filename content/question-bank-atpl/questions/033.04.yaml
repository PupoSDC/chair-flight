  template:
    type: chart
    question: >-
      Refer to figure. The planned flight is over a distance of {{distance}} NM.
      Based on the wind charts at altitude, the following wind components are
      found:


      - FL50: {{wind50}} kt

      - FL100: {{wind100}} kt

      - FL180: {{wind180}} kt


      The Operations Manual in appendix details the aircraft performances. Which
      flight level (FL) gives the best range performance?
    explanation: ""
    variables:
      - id: distance
        label: Planned distance
        unit: NM
      - id: wind50
        label: Wind component at FL50
        unit: kt
      - id: wind100
        label: Wind component at FL100
        unit: kt
      - id: wind180
        label: Wind component at FL180
        unit: kt
    entries:
      - id: e1
        values:
          distance: 440
          wind50: -30
          wind100: -50
          wind180: -70
        answer: FL180
        wrongAnswers:
          - FL050
          - FL100
          - Either FL050 or FL100
        explanation: >-
          The best range flight level is the one with the most favourable wind.
          A negative wind component is a tailwind here, so the level with the
          strongest tailwind gives the best range over this distance.


          **Solution**


          - The strongest tailwind is at FL180, at {{wind180}} kt.

          - Over {{distance}} NM it gives the most ground distance, so the
          answer is **FL180**.


          **Why the other answers are wrong**


          - **FL050**: has the smallest tailwind of the three levels.

          - **FL100**: has a smaller tailwind than FL180.

          - **Either FL050 or FL100**: neither of those levels gives the best
          range.
