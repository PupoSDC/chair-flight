  template:
    type: calculation
    question: |-
      The point of equal time (PET) is found for the following leg.

      - Distance from departure to destination: {{dist}} NM
      - GS out: {{gsout}} kt
      - GS home: {{gsback}} kt

      What is the distance of the PET from the departure point (in NM)?
    variables:
      - id: dist
        label: Distance departure to destination
        unit: NM
      - id: gsout
        label: GS out
        unit: kt
      - id: gsback
        label: GS home
        unit: kt
    answer:
      formula: dist * gsback / (gsout + gsback)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: dist * gsout / (gsout + gsback)
      - id: d2
        formula: dist * gsback / gsout
      - id: d3
        formula: dist / 2
      - id: d4
        formula: dist * gsout / gsback
    presets:
      - id: p1
        values:
          dist: 340
          gsout: 150
          gsback: 120
      - id: p2
        values:
          dist: 1000
          gsout: 300
          gsback: 200
      - id: p3
        values:
          dist: 500
          gsout: 180
          gsback: 220
    explanation: >-
      At the PET the time needed to continue to the destination equals the time
      needed to return to the departure point. Setting the two times equal gives
      the distance from the departure point, which uses the home ground speed in
      the numerator.


      **Solution**


      {{f: dist * gsback / (gsout + gsback)}} = {{n: dist * gsback / (gsout +
      gsback)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses the outbound ground speed in the numerator, which
      gives the distance from the destination.

      - **{{d2}} NM**: divides by the outbound ground speed only.

      - **{{d3}} NM**: takes half the distance, which ignores the ground speeds.

      - **{{d4}} NM**: uses the wrong ground speed ratio.
- id: QBUJYVSA
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331594
