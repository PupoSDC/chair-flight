  template:
    type: calculation
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - GS out: {{gsout}} kt
      - GS home: {{gsback}} kt

      What is the distance of the PET from the departure point?
    variables:
      - id: dist
        label: Total distance
        unit: NM
      - id: gsout
        label: Ground speed out
        unit: kt
      - id: gsback
        label: Ground speed home
        unit: kt
    answer:
      formula: dist * gsback / (gsout + gsback)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: dist * gsout / (gsout + gsback)
      - id: d2
        formula: dist / 2
      - id: d3
        formula: dist * gsout / gsback
      - id: d4
        formula: dist * gsback / gsout
    presets:
      - id: p1
        values:
          dist: 435
          gsout: 110
          gsback: 130
      - id: p2
        values:
          dist: 600
          gsout: 420
          gsback: 480
      - id: p3
        values:
          dist: 820
          gsout: 250
          gsback: 290
    explanation: >-
      The Point of Equal Time (PET) is the point from which it takes the same
      time to continue to the destination as to return to the departure point.
      Because the ground speeds differ in the two directions, the PET lies
      closer to the leg with the lower ground speed, so the distance to the PET
      is weighted by the ground speed home.


      **Solution**


      {{f: dist * gsback / (gsout + gsback)}} = {{n: dist * gsback / (gsout +
      gsback)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses the ground speed out in the numerator, which gives
      the distance from the destination instead of from the departure point.

      - **{{d2}} NM**: takes the half-way point, which is only the PET when the
      ground speeds out and home are equal.

      - **{{d3}} NM**: inverts the speed ratio (out over home).

      - **{{d4}} NM**: inverts the speed ratio (home over out) and ignores the
      sum of the speeds in the denominator.
