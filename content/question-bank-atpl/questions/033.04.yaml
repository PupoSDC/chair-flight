  template:
    type: chart-calculation
    question: >-
      Refer to figure (flight log or chart).


      For the leg in question, the leg distance read from the figure is {{dist}}
      NM and the (revised) ground speed, taking into account the changed
      conditions given in the question, is {{gs}} kt.


      What is the expected time for this leg (minutes)?
    variables:
      - id: dist
        label: Leg distance (read from figure)
        unit: NM
      - id: gs
        label: Ground speed (read from figure / revised)
        unit: kt
    chartInputs:
      - dist
      - gs
    answer:
      formula: dist / gs * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (gs + 20) * 60
      - id: d2
        formula: dist / (gs - 20) * 60
      - id: d3
        formula: dist / gs * 30
      - id: d4
        formula: dist / (gs - 10) * 60
      - id: d5
        formula: dist / gs * 100
    presets:
      - id: p1
        values:
          dist: 50
          gs: 120
      - id: p2
        values:
          dist: 60
          gs: 150
      - id: p3
        values:
          dist: 21
          gs: 140
    explanation: >-
      Time on a leg is distance divided by ground speed. The ground speed has to
      be the one valid for the changed conditions (new wind, reduced speed,
      speed restriction).


      **Solution**


      {{f: dist / gs * 60}} = {{n: dist / gs * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: ground speed too high (a speed 20 kt too fast was used).

      - **{{d2}} min**: ground speed too low (a speed 20 kt too slow was used).

      - **{{d3}} min**: the time in hours is converted with 30 instead of 60.

      - **{{d4}} min**: a ground speed 10 kt too low was used.

      - **{{d5}} min**: the time in hours is converted with 100 instead of 60.
