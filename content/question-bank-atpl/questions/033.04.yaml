- id: QRMZVBX8Y
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338572
    - BGS-331463
  annexes:
    - 033-flight-log-legs-a-b-and-b-c-at-fl100
  learningObjectives:
    - "033.04"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. After the pre-flight preparation, the flight plan log
      shown in the annex was completed, taking into account the meteorological
      conditions for the scheduled Estimated Time of Departure at 07:30 UTC. Due
      to the passage of a cold front, a delay of 3 hours is expected.


      Use the following values:


      - Distance from WPT B to WPT C (read from figure): {{leg_distance}} NM

      - Time from WPT B to WPT C (read from figure): {{leg_time}} min


      What is the revised groundspeed between WPT B and WPT C, in knots?
    variables:
      - id: leg_distance
        label: Distance from WPT B to WPT C (read from figure)
        unit: NM
      - id: leg_time
        label: Time from WPT B to WPT C (read from figure)
        unit: min
    chartInputs:
      - leg_distance
      - leg_time
    answer:
      formula: leg_distance * 60 / leg_time
      unit: knots
      decimals: 0
    distractors:
      - id: d1
        formula: leg_distance * leg_time / 60
      - id: d2
        formula: leg_distance / leg_time
      - id: d3
        formula: leg_distance * 60 / (leg_time + 6)
      - id: d4
        formula: leg_distance * 60 / leg_time / 1.852
    presets:
      - id: p1
        values:
          leg_distance: 62
          leg_time: 24
      - id: p2
        values:
          leg_distance: 80
          leg_time: 33
    explanation: >-
      The groundspeed is the distance covered over the ground divided by the
      time taken. The time is in minutes, so the distance is first multiplied by
      60 to put the result in knots.


      **Solution**


      - Groundspeed: {{f: leg_distance * 60 / leg_time}} = {{n: leg_distance *
      60 / leg_time}} = **{{answer}} knots**


      **Why the other answers are wrong**


      - **{{d1}} knots**: multiplies by the time instead of dividing by it,
      which mixes up the two values.

      - **{{d2}} knots**: forgets to convert minutes into hours.

      - **{{d3}} knots**: adds 6 minutes to the time by mistake.

      - **{{d4}} knots**: converts the speed into kilometres per hour, which is
      not needed.
