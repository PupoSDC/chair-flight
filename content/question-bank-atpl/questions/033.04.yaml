  template:
    type: chart
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - Safe endurance: {{se}} hours
      - TAS: {{tas}} kt
      - Ground speed out: {{gso}} kt
      - Ground speed home: {{gsh}} kt

      What is the distance and time of the PSR from the departure point?
    explanation: ""
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: se
        label: Safe endurance
        unit: h
      - id: tas
        label: TAS
        unit: kt
      - id: gso
        label: Ground speed out
        unit: kt
      - id: gsh
        label: Ground speed home
        unit: kt
    entries:
      - id: e1
        values:
          dist: 180
          se: 2
          tas: 120
          gso: 135
          gsh: 105
        answer: "Distance: 118 NM Time: 53 min"
        wrongAnswers:
          - "Distance: 59 NM Time: 30 min"
          - "Distance: 62 NM Time: 28 min"
          - "Distance: 79 NM Time: 45 min"
        explanation: The PSR distance is safe endurance × ground speed out × ground
          speed home / (ground speed out + ground speed home) = 2 × 135 × 105 /
          240 = 118 NM. The time out is 2 × 105 / 240 hours, which is 0.875
          hours or 53 minutes.
      - id: e2
        values:
          dist: 500
          se: 4
          tas: 140
          gso: 150
          gsh: 130
        answer: "Distance: 279 NM Time: 111 min"
        wrongAnswers:
          - "Distance: 232 NM Time: 107 min"
          - "Distance: 221 NM Time: 89 min"
          - "Distance: 139 NM Time: 60 min"
        explanation: The PSR distance is 4 × 150 × 130 / 280 = 279 NM. The time out is 4
          × 130 / 280 hours, which is about 1.86 hours or 111 minutes.
      - id: e3
        values:
          dist: 150
          se: 3.2
          tas: 90
          gso: 100
          gsh: 80
        answer: "Distance: 142 NM Time: 85 min"
        wrongAnswers:
          - "Distance: 67 NM Time: 50 min"
          - "Distance: 71 NM Time: 47 min"
          - "Distance: 8 NM Time: 5 min"
        explanation: The PSR distance is 3.2 × 100 × 80 / 180 = 142 NM. The time out is
          3.2 × 80 / 180 hours, which is about 1.42 hours or 85 minutes.
