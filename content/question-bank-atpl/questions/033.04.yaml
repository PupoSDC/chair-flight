- id: QWSRRPZEX
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334884
    - ATPLGS-123266
    - BGS-330183
    - BGS-330184
    - ATPLGS-123265
    - ATPLQ-331852
  annexes:
    - 033-data-sheet-lrjt-1-flight-planning-ground-distance-air-distance
  learningObjectives:
    - "033.04"
  template:
    type: chart-calculation
    question: >-
      For this question use annex 033-053 rev. 05.11.2004. For a long distance
      flight at FL {{fl}}, "Long Range" regime, divided into four flight legs,
      what is the total air distance?


      - Segment AB: ground distance {{g_ab}} NM, headwind component {{w_ab}} kt,
      air distance ratio (read from the annex) {{r_ab}}

      - Segment BC: ground distance {{g_bc}} NM, headwind component {{w_bc}} kt,
      air distance ratio (read from the annex) {{r_bc}}

      - Segment CD: ground distance {{g_cd}} NM, tailwind component {{w_cd}} kt,
      air distance ratio (read from the annex) {{r_cd}}

      - Segment DE: ground distance {{g_de}} NM, headwind component {{w_de}} kt,
      air distance ratio (read from the annex) {{r_de}}


      What is the total air distance?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: g_ab
        label: Ground distance AB
        unit: NM
      - id: g_bc
        label: Ground distance BC
        unit: NM
      - id: g_cd
        label: Ground distance CD
        unit: NM
      - id: g_de
        label: Ground distance DE
        unit: NM
      - id: w_ab
        label: Wind component AB
        unit: kt
      - id: w_bc
        label: Wind component BC
        unit: kt
      - id: w_cd
        label: Wind component CD
        unit: kt
      - id: w_de
        label: Wind component DE
        unit: kt
      - id: r_ab
        label: Air distance ratio AB
        unit: ""
      - id: r_bc
        label: Air distance ratio BC
        unit: ""
      - id: r_cd
        label: Air distance ratio CD
        unit: ""
      - id: r_de
        label: Air distance ratio DE
        unit: ""
    chartInputs:
      - r_ab
      - r_bc
      - r_cd
      - r_de
    answer:
      formula: g_ab * r_ab + g_bc * r_bc + g_cd * r_cd + g_de * r_de
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: g_ab + g_bc + g_cd + g_de
      - id: d2
        formula: g_ab * r_ab + g_bc * r_bc + g_cd * r_cd
      - id: d3
        formula: (g_ab + g_bc + g_cd + g_de) * r_ab
      - id: d4
        formula: g_ab * r_ab + g_bc * r_bc + g_cd * r_cd + g_de
    presets:
      - id: p1
        values:
          fl: 370
          g_ab: 2000
          g_bc: 1000
          g_cd: 500
          g_de: 1000
          w_ab: 50
          w_bc: 30
          w_cd: 70
          w_de: 20
          r_ab: 1.1
          r_bc: 1.05
          r_cd: 0.9
          r_de: 1.1
      - id: p2
        values:
          fl: 390
          g_ab: 2000
          g_bc: 1000
          g_cd: 500
          g_de: 1000
          w_ab: 50
          w_bc: 30
          w_cd: 100
          w_de: 70
          r_ab: 1.1
          r_bc: 1.05
          r_cd: 0.85
          r_de: 1.225
    explanation: >-
      Each leg is flown through the air over a longer or shorter distance than
      its ground distance, depending on the wind. The annex gives the air
      distance ratio for each leg, so the total air distance is the sum of each
      ground distance multiplied by its ratio.


      **Solution**


      - Segment AB: {{= g_ab * r_ab}} NM

      - Segment BC: {{= g_bc * r_bc}} NM

      - Segment CD: {{= g_cd * r_cd}} NM

      - Segment DE: {{= g_de * r_de}} NM


      Total air distance = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: adds the ground distances and ignores the wind.

      - **{{d2}} NM**: leaves out the last leg.

      - **{{d3}} NM**: uses the ratio of the first leg for every leg.

      - **{{d4}} NM**: forgets to apply the ratio to the last leg.
- id: QXHCIXUJO
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338396
    - ATPLGS-122979
    - AVEXAM-16802
  annexes: []
  learningObjectives:
    - "033.04"
  template:
    type: calculation
    question: >-
      What is the height difference between the obstacle and the obstacle
      clearance altitude described in the following NOTAM?


      E) CRANE WITH OBST LGT 521231N 0000827E HGT {{agl}}FT AGL/{{amsl}}FT AMSL.
      VMC(C)OCA (OCH AAL) FOR ALL INSTRUMENT APPROACHES INCREASED TO {{oca}}FT
      AMSL
    variables:
      - id: agl
        label: Obstacle height AGL
        unit: ft
      - id: amsl
        label: Obstacle height AMSL
        unit: ft
      - id: oca
        label: OCA (AMSL)
        unit: ft
    answer:
      formula: oca - amsl
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: agl
      - id: d2
        formula: amsl
      - id: d3
        formula: oca - agl
    presets:
      - id: p1
        values:
          agl: 259
          amsl: 302
          oca: 600
      - id: p2
        values:
          agl: 340
          amsl: 412
          oca: 800
      - id: p3
        values:
          agl: 210
          amsl: 275
          oca: 500
    explanation: >-
      The OCA is given above mean sea level, so it must be compared with the
      obstacle height above mean sea level (AMSL), not with the height above
      ground level (AGL).


      **Solution**


      {{f: oca - amsl}} = {{n: oca - amsl}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: this is just the obstacle height AGL, not a difference.

      - **{{d2}} ft**: this is just the obstacle height AMSL, not a difference.

      - **{{d3}} ft**: the AMSL OCA was compared with the AGL obstacle height,
      mixing two different references.
