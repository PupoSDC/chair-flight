    - 033.04.02.02.06
  template:
    type: calculation
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - Safe endurance: {{endurance}} h
      - Ground speed out: {{gsout}} kt
      - Ground speed home: {{gsback}} kt

      What is the distance of the PSR from the departure point?
    variables:
      - id: dist
        label: Total distance
        unit: NM
      - id: endurance
        label: Safe endurance
        unit: h
      - id: gsout
        label: Ground speed out
        unit: kt
      - id: gsback
        label: Ground speed home
        unit: kt
    answer:
      formula: endurance * gsout * gsback / (gsout + gsback)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: endurance * gsout * gsback / (2 * (gsout + gsback))
      - id: d2
        formula: dist * gsout / (gsout + gsback)
      - id: d3
        formula: endurance * gsout / 2
      - id: d4
        formula: endurance * (gsout + gsback) / 2
    presets:
      - id: p1
        values:
          dist: 5000
          endurance: 10
          gsout: 500
          gsback: 400
      - id: p2
        values:
          dist: 2000
          endurance: 5
          gsout: 480
          gsback: 520
      - id: p3
        values:
          dist: 900
          endurance: 3
          gsout: 150
          gsback: 130
    explanation: >-
      The Point of Safe Return (PSR) is the farthest point from which the
      aircraft can still return to the departure point within its safe
      endurance. The outbound and return legs together must use the whole
      endurance, so the distance is endurance divided by (1/GS out + 1/GS home).


      **Solution**


      {{f: endurance * gsout * gsback / (gsout + gsback)}} = {{n: endurance *
      gsout * gsback / (gsout + gsback)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: halves the correct distance by treating the endurance as
      if it had to be split in two equal parts.

      - **{{d2}} NM**: applies the PET formula to the total distance instead of
      using the endurance.

      - **{{d3}} NM**: flies half of the endurance at the ground speed out only,
      ignoring the return leg.

      - **{{d4}} NM**: uses the sum of the ground speeds instead of their
      harmonic combination.
