- id: QTHZLJNX
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337080
    - AVEXAM-40028
    - AVEXAM-45276
    - AVEXAM-65938
    - BGS-330440
    - ATPLGS-123002
    - ATPLGS-123001
    - BGS-330439
  annexes: []
  learningObjectives:
    - 033.04.02.02.06
  template:
    type: calculation
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - Safe Endurance: {{se}} h
      - TAS: {{tas}} kt
      - Ground Speed Out: {{gso}} kt
      - Ground Speed Home: {{gsh}} kt

      What is the time of the PSR from the departure point?
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: se
        label: Safe endurance
        unit: h
      - id: tas
        label: TAS
        unit: kt
      - id: gso
        label: Ground speed out
        unit: kt
      - id: gsh
        label: Ground speed home
        unit: kt
    answer:
      formula: 60 * se * gsh / (gso + gsh)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: 60 * se * gso / (gso + gsh)
      - id: d2
        formula: 30 * se
      - id: d3
        formula: 60 * se * gsh / (tas + gsh)
      - id: d4
        formula: 60 * dist / gso
    presets:
      - id: p1
        values:
          dist: 3000
          se: 8
          tas: 520
          gso: 600
          gsh: 440
      - id: p2
        values:
          dist: 2000
          se: 6
          tas: 450
          gso: 500
          gsh: 400
      - id: p3
        values:
          dist: 1500
          se: 5
          tas: 400
          gso: 360
          gsh: 440
    explanation: >-
      The Point of Safe Return (PSR) is the furthest point from which the
      aircraft can return to the departure aerodrome within its safe endurance.
      The time out is T = E × GSh / (GSo + GSh), using ground speeds, not TAS.


      **Solution**


      {{f: 60 * se * gsh / (gso + gsh)}} = {{n: 60 * se * gsh / (gso + gsh)}} =
      **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: swaps the ground speeds out and home.

      - **{{d2}} min**: assumes half of the endurance is flown outbound (ignores
      the wind).

      - **{{d3}} min**: uses the TAS instead of the ground speed out.

      - **{{d4}} min**: is the time to fly the whole route to the destination,
      not to the PSR.
- id: QTL4QVLNK
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334607
    - AVEXAM-71455
    - ATPLGS-123060
    - ATPLGS-123061
    - ATPLGS-123059
