          dist: 1500
          gsout: 300
          gsback: 350
      - id: p3
        values:
          dist: 1000
          gsout: 250
          gsback: 200
    explanation: >-
      The distance to the PET is found first. The time to reach it is that
      distance divided by the outbound ground speed, converted from hours to
      minutes.


      **Solution**


      Distance to PET: {{f: dist * gsback / (gsout + gsback)}} = {{= dist *
      gsback / (gsout + gsback)}} NM


      {{f: dist * gsback / (gsout + gsback) / gsout * 60}} = {{n: dist * gsback
      / (gsout + gsback) / gsout * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: divides by the home ground speed instead of the outbound
      one.

      - **{{d2}} min**: forgets to convert hours to minutes.

      - **{{d3}} min**: uses the full leg distance instead of the distance to
      the PET.

      - **{{d4}} min**: uses the wrong distance to the PET.
- id: QCQFYXOI
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333000
    - AVEXAM-22853
    - BGS-331301
    - BGS-331211
  annexes: []
  learningObjectives:
    - 033.04.03.01.02
  template:
    type: calculation
    question: >-
      An aircraft flies the following leg. Calculate the time at which the point
      of equal time (PET) is reached.


      - Departure time: {{dep_h}}:00

      - Leg distance: {{dist}} NM

      - Leg track: {{track}}°

      - TAS: {{tas}} kt

      - Wind (direction/speed): {{wd}}° / {{ws}} kt


      At what time (hh:mm) is the PET reached?
    variables:
      - id: dep_h
        label: Departure hour
        unit: h
      - id: dist
        label: Leg distance
        unit: NM
      - id: track
        label: Leg track
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: dep_h * 60 + dist * (tas + ws * cos(wd - track)) / (2 * tas) / (tas -
        ws * cos(wd - track)) * 60
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: dep_h * 60 + dist * (tas + ws * cos(wd - track)) / (2 * tas) / (tas +
          ws * cos(wd - track)) * 60
      - id: d2
        formula: dist * (tas + ws * cos(wd - track)) / (2 * tas) / (tas - ws * cos(wd -
          track)) * 60
      - id: d3
        formula: dep_h * 60 + dist / (tas - ws * cos(wd - track)) * 60
      - id: d4
        formula: dep_h * 60 + dist * (tas - ws * cos(wd - track)) / (2 * tas) / (tas +
          ws * cos(wd - track)) * 60
    presets:
      - id: p1
        values:
          dep_h: 12
          dist: 1000
          track: 90
          tas: 200
          wd: 90
          ws: 20
      - id: p2
        values:
          dep_h: 9
          dist: 800
          track: 180
          tas: 250
          wd: 60
          ws: 40
      - id: p3
        values:
          dep_h: 14
          dist: 1500
          track: 270
          tas: 180
          wd: 300
          ws: 30
    explanation: >-
      The PET is reached when the time to go on equals the time to return. The
      distance to the PET is then found from the ground speeds, and the time
      from departure is that distance divided by the outbound ground speed. The
      departure time plus this time gives the clock time.


      **Solution**


      Headwind component: {{= ws * cos(wd - track)}} kt, so GS out = {{= tas -
      ws * cos(wd - track)}} kt and GS home = {{= tas + ws * cos(wd - track)}}
      kt


      Distance to PET: {{= dist * (tas + ws * cos(wd - track)) / (2 * tas)}} NM


      {{f: dep_h * 60 + dist * (tas + ws * cos(wd - track)) / (2 * tas) / (tas -
      ws * cos(wd - track)) * 60}} = {{n: dep_h * 60 + dist * (tas + ws * cos(wd
      - track)) / (2 * tas) / (tas - ws * cos(wd - track)) * 60}} minutes after
      midnight = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the home ground speed to find the time to the PET.

      - **{{d2}}**: forgets to add the departure time.

      - **{{d3}}**: flies the whole leg at the outbound ground speed instead of
      up to the PET.

      - **{{d4}}**: uses the wrong ground speeds in the distance and in the
      time.
