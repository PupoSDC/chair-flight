    - 033.04.02.02.06
    - 033.04.03.02.02
  template:
    type: calculation
    question: >-
      Given the following information, at what time (hh:mm) will the Point of
      Safe Return (PSR) be reached?


      - Departure time: 14:00

      - Safe endurance: {{endurance}} hours

      - TAS: {{tas}} kt

      - Wind: 270°/{{wspeed}} kt

      - Track: 270°
    variables:
      - id: endurance
        label: Safe endurance
        unit: h
      - id: tas
        label: TAS
        unit: kt
      - id: wspeed
        label: Headwind component
        unit: kt
    answer:
      formula: round(840 + 60 * endurance * (tas + wspeed) / (2 * tas))
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: round(840 + 60 * endurance * (tas - wspeed) / (2 * tas))
      - id: d2
        formula: round(840 + 60 * endurance)
      - id: d3
        formula: round(840 + 60 * endurance * (tas + wspeed) / tas)
    presets:
      - id: p1
        values:
          endurance: 3
          tas: 100
          wspeed: 30
      - id: p2
        values:
          endurance: 6
          tas: 200
          wspeed: 20
      - id: p3
        values:
          endurance: 4
          tas: 150
          wspeed: 25
    explanation: >-
      The PSR is the point from which flying back to the departure point at the
      home groundspeed takes the same time as the safe endurance left after
      flying out. The time out to the PSR is the safe endurance multiplied by
      the home groundspeed and divided by the sum of both groundspeeds.


      **Solution**


      - Time out to the PSR: {{= 60 * endurance * (tas + wspeed) / (2 * tas)}}
      min

      - Departure time 14:00 plus this time: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the wind with the wrong sign.

      - **{{d2}}**: ignores the wind completely.

      - **{{d3}}**: uses the TAS in the wrong place in the formula.
