    - ATPLGS-108126
    - ATPLQ-338337
  annexes: []
  learningObjectives:
    - 033.04.03.01.02
  template:
    type: calculation
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - GS Out: {{gso}} kt
      - GS Home: {{gsh}} kt

      What is the time of the PET from the departure point?
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: gso
        label: Ground speed out
        unit: kt
      - id: gsh
        label: Ground speed home
        unit: kt
    answer:
      formula: 60 * dist * gsh / (gso * (gso + gsh))
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: 60 * dist / (gso + gsh)
      - id: d2
        formula: 60 * dist * gso / (gsh * (gso + gsh))
      - id: d3
        formula: 60 * dist / (2 * gso)
    presets:
      - id: p1
        values:
          dist: 2500
          gso: 540
          gsh: 470
      - id: p2
        values:
          dist: 2380
          gso: 420
          gsh: 520
      - id: p3
        values:
          dist: 1800
          gso: 450
          gsh: 380
    explanation: >-
      The Point of Equal Time (PET) is where the time to continue to the
      destination equals the time to return. Its distance from departure is D ×
      GSh / (GSo + GSh), and the time to reach it is that distance divided by
      the ground speed out.


      **Solution**


      Distance to PET: {{= dist * gsh / (gso + gsh)}} NM


      {{f: 60 * dist * gsh / (gso * (gso + gsh))}} = {{n: 60 * dist * gsh / (gso
      * (gso + gsh))}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: divides the distance by the sum of both ground speeds,
      which is not a time to the PET.

      - **{{d2}} min**: swaps the ground speeds out and home.

      - **{{d3}} min**: assumes the PET is at the midpoint of the route (ignores
      the wind effect).
