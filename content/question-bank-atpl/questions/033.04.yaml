        unit: kt
    answer:
      formula: dist * (tas + ws * cos(wd - tt)) / (2 * tas)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: dist * (tas - ws * cos(wd - tt)) / (2 * tas)
      - id: d2
        formula: dist / 2
      - id: d3
        formula: dist * (tas + ws * cos(wd - tt)) / tas
      - id: d4
        formula: dist * (tas + ws) / (2 * tas)
    presets:
      - id: p1
        values:
          dist: 470
          tt: 237
          wd: 300
          ws: 25
          tas: 125
      - id: p2
        values:
          dist: 285
          tt: 348
          wd: 280
          ws: 25
          tas: 128
      - id: p3
        values:
          dist: 600
          tt: 90
          wd: 120
          ws: 30
          tas: 150
    explanation: >-
      The headwind component on the outbound leg reduces the outbound ground
      speed, and the same component increases the ground speed on the return
      leg. The PET lies where the time out equals the time home, which gives the
      distance from departure in terms of the TAS and the headwind component.


      **Solution**


      Headwind component: {{ws}} kt x cos({{wd}}° - {{tt}}°) = {{= ws * cos(wd -
      tt)}} kt


      GS out = {{= tas - ws * cos(wd - tt)}} kt, GS home = {{= tas + ws * cos(wd
      - tt)}} kt


      {{f: dist * (tas + ws * cos(wd - tt)) / (2 * tas)}} = {{n: dist * (tas +
      ws * cos(wd - tt)) / (2 * tas)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: applies the wind with the wrong sign.

      - **{{d2}} NM**: ignores the wind completely.

      - **{{d3}} NM**: does not divide by the sum of the two ground speeds.

      - **{{d4}} NM**: adds the full wind speed instead of its component along
      the track.
