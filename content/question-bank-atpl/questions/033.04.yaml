  template:
    type: chart
    question: >-
      For this question use annex 033-014 rev. 05.11.2004 or Flight Planning
      Manual MRJT 1 Figure 4.2.1. Find the optimum altitude for the twin jet
      aeroplane.


      Given:


      - Cruise mass: {{cruise_mass}} kg

      - Long range cruise or 0.74 MACH


      What is the optimum altitude?
    explanation: ""
    variables:
      - id: cruise_mass
        label: Cruise mass
        unit: kg
    entries:
      - id: e1
        values:
          cruise_mass: 54000
        answer: 34600 ft
        wrongAnswers:
          - 33800 ft
          - 35300 ft
          - maximum operating altitude
        explanation: >-
          The optimum altitude is read from the chart for the cruise mass at
          long range cruise or 0.74 Mach. It is the level where the aeroplane
          uses the least fuel for the distance flown.


          **Solution**


          - Enter the chart at a cruise mass of {{cruise_mass}} kg.

          - The optimum altitude is **34600 ft**.


          **Why the other answers are wrong**


          - **33800 ft**: a level below the optimum for this mass.

          - **35300 ft**: a level above the optimum for this mass.

          - **maximum operating altitude**: the highest level the aeroplane can
          fly, not the optimum level.
- id: QRZYDBLD
  docId: "033.04"
  relatedQuestions:
    - QFWMYBFQ
  externalIds:
    - ATPLQ-338651
    - BGS-330424
    - AVEXAM-47551
    - ATPLGS-108147
  annexes: []
  learningObjectives:
    - 033.04.02.02.06
  template:
    type: calculation
    question: >-
      Given the following information, what is the time to the Point of Safe
      Return (PSR)?


      - Distance A to B: {{dist}} NM

      - Mean groundspeed out: {{gso}} kt

      - Mean groundspeed back: {{gsb}} kt

      - Safe endurance: {{endurance}} hours


      Give the time in hours and minutes.
    variables:
      - id: dist
        label: Distance A to B
        unit: NM
      - id: gso
        label: Groundspeed out
        unit: kt
      - id: gsb
        label: Groundspeed back
        unit: kt
      - id: endurance
        label: Safe endurance
        unit: h
    answer:
      formula: round(60 * endurance * gsb / (gso + gsb))
      unit: minutes
      decimals: 0
      format: h 'hours' m 'minutes'
    distractors:
      - id: d1
        formula: round(60 * endurance * gso / (gso + gsb))
      - id: d2
        formula: round(60 * endurance / 2)
      - id: d3
        formula: round(60 * dist / gso)
      - id: d4
        formula: round(60 * dist / (gso + gsb))
    presets:
      - id: p1
        values:
          dist: 3060
          gso: 440
          gsb: 540
          endurance: 10
      - id: p2
        values:
          dist: 2000
          gso: 400
          gsb: 500
          endurance: 8
    explanation: >-
      The PSR is the point where the time to fly back home at the home
      groundspeed equals the time left of the safe endurance after flying out.
      The time out to the PSR is the safe endurance multiplied by the home
      groundspeed and divided by the sum of both groundspeeds.


      **Solution**


      - Time out to the PSR: {{= 60 * endurance * gsb / (gso + gsb)}} min

      - Rounded to the nearest minute: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the outbound groundspeed instead of the home
      groundspeed.

      - **{{d2}}**: halves the safe endurance and ignores the groundspeeds.

      - **{{d3}}**: uses the full distance at the outbound groundspeed.

      - **{{d4}}**: uses the full distance at the total groundspeed.
