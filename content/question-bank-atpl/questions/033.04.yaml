    - BGS-330406
  annexes: []
  learningObjectives:
    - "033.04"
    - 033.04.03.01.02
  template:
    type: calculation
    question: >-
      A flight is planned over a distance of {{d}} NM. The TAS is {{tas}} kt and
      the wind gives a head wind component of {{hw}} kt on the outbound leg (so
      a tail wind of {{hw}} kt on the return).


      What is the distance from the departure point to the Point of Equal Time
      (PET)? Answer in NM.
    variables:
      - id: d
        label: Total distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Head wind component outbound
        unit: kt
    answer:
      formula: d * (tas + hw) / (2 * tas)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: d * (tas - hw) / (2 * tas)
      - id: d2
        formula: d / 2
      - id: d3
        formula: d * tas / (tas + hw)
      - id: d4
        formula: d * (tas - hw) / (tas + hw)
    presets:
      - id: p1
        values:
          d: 360
          tas: 210
          hw: 30
      - id: p2
        values:
          d: 2800
          tas: 500
          hw: 100
      - id: p3
        values:
          d: 1200
          tas: 450
          hw: 50
    explanation: >-
      The PET is the point from which the flight time to the destination equals
      the flight time back to the departure. Outbound groundspeed is {{= tas -
      hw}} kt (head wind), return groundspeed is {{= tas + hw}} kt (tail wind).
      x = d × G_back / (G_out + G_back), and G_out + G_back = 2 × TAS.


      **Solution**


      G_out = {{= tas - hw}} kt, G_back = {{= tas + hw}} kt


      {{f: d * (tas + hw) / (2 * tas)}} = {{n: d * (tas + hw) / (2 * tas)}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the groundspeeds were swapped, giving a PET that is too
      close to the departure point.

      - **{{d2}} NM**: the mid-point was used; the wind was ignored.

      - **{{d3}} NM**: wrong ratio of TAS to the return groundspeed.

      - **{{d4}} NM**: the groundspeeds were used in the wrong ratio (difference
      of leg speeds over return speed).
