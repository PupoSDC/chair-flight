  template:
    type: chart
    question: With 3.5 hours’ total endurance on board, and a wind velocity of
      270°/20 kt, a pilot has to travel over a distance of 200 NM on a track of
      270°T. If the TAS is 100 kt and the pilot must land with 30 minutes’ worth
      of fuel on board, what is the distance to the Point of Safe Return PSR,
      and how long will it take to get there?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 144 NM and 108 minutes.
        wrongAnswers:
          - 96 NM and 72 minutes.
          - 160 NM and 120 minutes.
          - 107 NM and 80 minutes.
        explanation: The safe endurance is 3.5 hours minus the 30 minutes reserve, which
          is 3 hours. The wind is a 20 kt headwind on the outbound leg, so the
          ground speed out is 80 kt and the ground speed back is 120 kt. The PSR
          distance is 3 × 80 × 120 / (80 + 120) = 144 NM, and the time out is
          144 / 80 hours, which is 108 minutes.
