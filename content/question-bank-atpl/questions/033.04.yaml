  template:
    type: calculation
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - GS out: {{gsout}} kt
      - GS home: {{gsback}} kt

      What is the time of the PET from the departure point?
    variables:
      - id: dist
        label: Total distance
        unit: NM
      - id: gsout
        label: Ground speed out
        unit: kt
      - id: gsback
        label: Ground speed home
        unit: kt
    answer:
      formula: 60 * dist * gsback / ((gsout + gsback) * gsout)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: 60 * dist / (gsout + gsback)
      - id: d2
        formula: 60 * dist * gsout / ((gsout + gsback) * gsback)
      - id: d3
        formula: 60 * dist / (2 * gsout)
      - id: d4
        formula: 60 * dist * gsback / ((gsout + gsback) * gsback)*0.5
    presets:
      - id: p1
        values:
          dist: 1345
          gsout: 480
          gsback: 360
      - id: p2
        values:
          dist: 900
          gsout: 420
          gsback: 360
      - id: p3
        values:
          dist: 620
          gsout: 260
          gsback: 300
    explanation: >-
      The Point of Equal Time (PET) is reached after the distance to the PET
      divided by the ground speed out. The distance to the PET is the total
      distance weighted by the ground speed home over the sum of both ground
      speeds.


      **Solution**


      Distance to PET = {{f: dist * gsback / (gsout + gsback)}} = {{= dist *
      gsback / (gsout + gsback)}} NM


      Time = distance / GS out = {{= dist * gsback / (gsout + gsback)}} /
      {{gsout}} = {{= dist * gsback / ((gsout + gsback) * gsout)}} h =
      **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: divides the total distance by the sum of the ground
      speeds, which ignores the weighting by the ground speed home.

      - **{{d2}} min**: inverts the speed ratio in the distance to the PET and
      divides by the wrong ground speed.

      - **{{d3}} min**: assumes the PET is half-way (equal ground speeds) and
      flies it at the ground speed out.

      - **{{d4}} min**: takes only half of the correct time.
