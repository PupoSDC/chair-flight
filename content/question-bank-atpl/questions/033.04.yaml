- id: QKXUYWUT
  docId: "033.04"
  relatedQuestions:
    - QOYAVLLDE
  externalIds:
    - ATPLQ-331429
    - BGS-330383
    - AVEXAM-98730
    - ATPLGS-108112
    - ATPLGS-627130
  annexes: []
  learningObjectives:
    - 033.04.03.01.02
  template:
    type: calculation
    question: |-
      Given the following information:

      - CAS: {{cas}} kt
      - Altitude: {{alt}} ft
      - Temperature: ISA {{isa}}°C
      - True course: {{tc}}°
      - Wind (W/V): {{wdir}}°/{{wspeed}} kt
      - Distance from departure to destination: {{dist}} NM
      - Endurance: 3 hours
      - Actual time of departure: 11:05 UTC

      At what time (UTC, hh:mm) is the Point of Equal Time (PET) reached?
    variables:
      - id: cas
        label: CAS
        unit: kt
      - id: alt
        label: Altitude
        unit: ft
      - id: isa
        label: Temperature deviation from ISA
        unit: °C
      - id: tc
        label: True course
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspeed
        label: Wind speed
        unit: kt
      - id: dist
        label: Distance departure to destination
        unit: NM
    answer:
      formula: round(665 + 60 * dist * ((cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588
        * 288.15 / (288.15 - 0.0019812 * alt + isa))) + (wspeed * cos(wdir -
        tc))) / (2 * (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 /
        (288.15 - 0.0019812 * alt + isa))) * ((cas / sqrt((1 - 0.0000068756 *
        alt) ^ 5.25588 * 288.15 / (288.15 - 0.0019812 * alt + isa))) - (wspeed *
        cos(wdir - tc)))))
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: round(665 + 60 * dist / ((cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588
          * 288.15 / (288.15 - 0.0019812 * alt + isa))) - (wspeed * cos(wdir -
          tc))))
      - id: d2
        formula: round(665 + 60 * dist / (2 * (cas / sqrt((1 - 0.0000068756 * alt) ^
          5.25588 * 288.15 / (288.15 - 0.0019812 * alt + isa)))))
      - id: d3
        formula: round(665 + 60 * dist * ((cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588
          * 288.15 / (288.15 - 0.0019812 * alt + isa))) - (wspeed * cos(wdir -
          tc))) / (2 * (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 * 288.15 /
          (288.15 - 0.0019812 * alt + isa))) * ((cas / sqrt((1 - 0.0000068756 *
          alt) ^ 5.25588 * 288.15 / (288.15 - 0.0019812 * alt + isa))) + (wspeed
          * cos(wdir - tc)))))
      - id: d4
        formula: round(665 + 60 * dist / (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588
          * 288.15 / (288.15 - 0.0019812 * alt + isa))))
    presets:
      - id: p1
        values:
          cas: 190
          alt: 9000
          isa: -10
          tc: 350
          wdir: 320
          wspeed: 40
          dist: 350
      - id: p2
        values:
          cas: 160
          alt: 5000
          isa: 5
          tc: 270
          wdir: 300
          wspeed: 30
          dist: 400
    explanation: >-
      The PET is reached after the time needed to fly out from the departure
      point at the outbound groundspeed to the distance of the PET. That time is
      added to the departure time.


      **Solution**


      - True airspeed: {{= (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 *
      288.15 / (288.15 - 0.0019812 * alt + isa)))}} kt

      - Headwind component: {{= (wspeed * cos(wdir - tc))}} kt

      - Flight time to the PET: {{= 60 * dist * ((cas / sqrt((1 - 0.0000068756 *
      alt) ^ 5.25588 * 288.15 / (288.15 - 0.0019812 * alt + isa))) + (wspeed *
      cos(wdir - tc))) / (2 * (cas / sqrt((1 - 0.0000068756 * alt) ^ 5.25588 *
      288.15 / (288.15 - 0.0019812 * alt + isa))) * ((cas / sqrt((1 -
      0.0000068756 * alt) ^ 5.25588 * 288.15 / (288.15 - 0.0019812 * alt +
      isa))) - (wspeed * cos(wdir - tc))))}} min

      - Departure time 11:05 plus this time: **{{answer}} UTC**


      **Why the other answers are wrong**


      - **{{d1}} UTC**: uses the full distance at the outbound groundspeed.

      - **{{d2}} UTC**: uses half the distance at the airspeed without wind.

      - **{{d3}} UTC**: swaps the sign of the wind in the distance to the PET.

      - **{{d4}} UTC**: ignores the wind.
