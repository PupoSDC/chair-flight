  template:
    type: calculation
    question: >-
      Given:


      - Distance from departure to destination: {{dist}} NM

      - Safe endurance: {{endurance}} h

      - TAS: {{tas}} kt

      - Ground speed out: {{gso}} kt

      - Ground speed home: {{gsh}} kt


      What is the time of the PSR from the departure point? Give the answer in
      minutes.
    variables:
      - id: dist
        label: Distance to destination
        unit: NM
      - id: endurance
        label: Safe endurance
        unit: h
      - id: tas
        label: TAS
        unit: kt
      - id: gso
        label: Ground speed out
        unit: kt
      - id: gsh
        label: Ground speed home
        unit: kt
    answer:
      formula: endurance * gsh / (gso + gsh) * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: endurance * gso / (gso + gsh) * 60
      - id: d2
        formula: endurance * 60
      - id: d3
        formula: endurance * gsh / (gso + gsh)
      - id: d4
        formula: endurance * gsh / (tas + gsh) * 60
    presets:
      - id: p1
        values:
          dist: 2450
          endurance: 7.5
          tas: 410
          gso: 360
          gsh: 460
      - id: p2
        values:
          dist: 900
          endurance: 5
          tas: 110
          gso: 120
          gsh: 90
    explanation: >-
      The point of safe return (PSR) is the point beyond which the aircraft no
      longer has enough safe endurance to fly back to the departure point. The
      outbound and homebound legs are flown at different ground speeds, so the
      endurance is shared in inverse proportion to them: the time out is the
      endurance multiplied by the home ground speed and divided by the sum of
      both ground speeds.


      **Solution**


      Time out (h) = {{= endurance * gsh / (gso + gsh)}} h


      {{f: endurance * gsh / (gso + gsh) * 60}} = {{n: endurance * gsh / (gso +
      gsh) * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: uses the outbound ground speed in the ratio instead of
      the home ground speed (inverted ratio).

      - **{{d2}} min**: uses the safe endurance alone, ignoring the ground speed
      split.

      - **{{d3}} h**: gives the result in hours instead of converting it to
      minutes.

      - **{{d4}} min**: uses the TAS in place of the outbound ground speed.
