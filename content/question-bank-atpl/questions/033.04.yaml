  template:
    type: calculation
    question: |-
      Given:

      - Distance from departure to destination: {{dist}} NM
      - Safe endurance: {{endurance}} h
      - True track: {{track}}°
      - W/V: {{wdir}}°/{{wspeed}} kt
      - TAS: {{tas}} kt

      What is the distance of the PSR from the departure point?
    variables:
      - id: dist
        label: Total distance
        unit: NM
      - id: endurance
        label: Safe endurance
        unit: h
      - id: track
        label: True track
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspeed
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: endurance * (tas^2 - wspeed^2) / (2 * sqrt(tas^2 - (wspeed * sin(wdir -
        track))^2))
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: endurance * tas / 2
      - id: d2
        formula: endurance * (sqrt(tas^2 - (wspeed * sin(wdir - track))^2) - wspeed *
          cos(wdir - track)) / 2
      - id: d3
        formula: endurance * (sqrt(tas^2 - (wspeed * sin(wdir - track))^2) + wspeed *
          cos(wdir - track)) / 2
      - id: d4
        formula: dist / 2
    presets:
      - id: p1
        values:
          dist: 4630
          endurance: 12.4
          track: 240
          wdir: 60
          wspeed: 80
          tas: 420
      - id: p2
        values:
          dist: 210
          endurance: 2.5
          track: 35
          wdir: 250
          wspeed: 20
          tas: 105
      - id: p3
        values:
          dist: 150
          endurance: 2.4
          track: 250
          wdir: 280
          wspeed: 15
          tas: 120
    explanation: >-
      The Point of Safe Return (PSR) is the farthest point from which the
      aircraft can return to the departure point within its safe endurance. The
      wind gives different ground speeds out and home (including the effect of
      the crosswind component on the ground speed), and the distance is
      endurance divided by (1/GS out + 1/GS home).


      **Solution**


      Ground speed out = {{= (sqrt(tas^2 - (wspeed * sin(wdir - track))^2) -
      wspeed * cos(wdir - track))}} kt


      Ground speed home = {{= (sqrt(tas^2 - (wspeed * sin(wdir - track))^2) +
      wspeed * cos(wdir - track))}} kt


      PSR distance = endurance * GS out * GS home / (GS out + GS home) =
      {{endurance}} * {{= (sqrt(tas^2 - (wspeed * sin(wdir - track))^2) - wspeed
      * cos(wdir - track))}} * {{= (sqrt(tas^2 - (wspeed * sin(wdir - track))^2)
      + wspeed * cos(wdir - track))}} / ({{= (sqrt(tas^2 - (wspeed * sin(wdir -
      track))^2) - wspeed * cos(wdir - track))}} + {{= (sqrt(tas^2 - (wspeed *
      sin(wdir - track))^2) + wspeed * cos(wdir - track))}}) = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: ignores the wind and uses the TAS for both legs.

      - **{{d2}} NM**: uses only the ground speed out, as if the return were
      flown at the same speed.

      - **{{d3}} NM**: uses only the ground speed home, as if the outbound leg
      were flown at the same speed.

      - **{{d4}} NM**: takes half of the total distance, which does not consider
      endurance or wind.
