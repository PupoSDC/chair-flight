- id: QVBLHOKI
  docId: "033.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331408
    - BGS-330388
    - AVEXAM-72141
    - ATPLGS-123043
    - ATPLGS-108136
  annexes: []
  learningObjectives:
    - 033.04.03.01.02
  template:
    type: calculation
    question: >-
      - Given: Distance A to B: {{d}} NM

      - Mean groundspeed "on": {{gon}} kt

      - Mean groundspeed "back": {{gback}} kt


      The distance from A to the point of equal time (PET) between A and B is:
      (answer in NM)
    variables:
      - id: d
        label: Distance A to B
        unit: NM
      - id: gon
        label: Groundspeed on
        unit: kt
      - id: gback
        label: Groundspeed back
        unit: kt
    answer:
      formula: d * gback / (gon + gback)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: d * gon / (gon + gback)
      - id: d2
        formula: d / 2
      - id: d3
        formula: d * gon / gback
      - id: d4
        formula: d * (gback - gon) / gback
    presets:
      - id: p1
        values:
          d: 2050
          gon: 440
          gback: 540
      - id: p2
        values:
          d: 1800
          gon: 420
          gback: 500
      - id: p3
        values:
          d: 2400
          gon: 450
          gback: 550
    explanation: >-
      At the PET the time to continue to B equals the time to return to A. With
      x the distance from A: (d - x) / G_on = x / G_back, which gives x = d ×
      G_back / (G_on + G_back). The slower the outbound groundspeed, the nearer
      the PET lies to B.


      **Solution**


      {{f: d * gback / (gon + gback)}} = {{n: d * gback / (gon + gback)}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the groundspeeds were swapped (G_on in the numerator).

      - **{{d2}} NM**: this is the mid-point, valid only when the groundspeeds
      are equal.

      - **{{d3}} NM**: ratio of the groundspeeds used instead of the share of
      the sum.

      - **{{d4}} NM**: the difference of the groundspeeds was used instead of
      their sum.
