  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Calculate the contingency fuel for a commercial air
      transport flight with a twin-jet aeroplane from departure to destination,
      given:


      - True Air Speed (TAS): {{tas}} kt

      - Head wind component (HWC): {{hw}} kt

      - Fuel consumption en route: {{ff}} kg/h

      - Fuel consumption holding: {{hold}} kg/h


      A suitable alternate is available; in-flight re-planning as appropriate.


      The distance from departure to destination, read from the figure, is {{d}}
      NM. Give the contingency fuel in kg.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Head wind component
        unit: kt
      - id: ff
        label: Fuel consumption en route
        unit: kg/h
      - id: hold
        label: Fuel consumption holding
        unit: kg/h
      - id: d
        label: Distance (read from figure)
        unit: NM
    chartInputs:
      - d
    answer:
      formula: 0.05 * ff * d / (tas - hw)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 0.03 * ff * d / (tas - hw)
      - id: d2
        formula: 0.02 * ff * d / (tas - hw)
      - id: d3
        formula: 0.05 * ff * d / (tas + hw)
      - id: d4
        formula: hold / 4
    presets:
      - id: p1
        values:
          tas: 350
          hw: 50
          ff: 1800
          hold: 900
          d: 1200
      - id: p2
        values:
          tas: 450
          hw: 50
          ff: 2000
          hold: 1200
          d: 1000
    explanation: >-
      The contingency fuel is 5 % of the trip fuel. The trip fuel is the flight
      time (distance read from the figure divided by the ground speed) times the
      en-route fuel consumption.


      **Solution**


      Ground speed = {{tas}} - {{hw}} = {{= tas - hw}} kt


      Trip fuel = {{d}} NM / {{= tas - hw}} kt × {{ff}} kg/h = {{= d / (tas -
      hw) * ff}} kg


      {{f: 0.05 * ff * d / (tas - hw)}} = {{n: 0.05 * ff * d / (tas - hw)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: 3 % of the trip fuel was used instead of 5 %.

      - **{{d2}} kg**: 2 % of the trip fuel was used instead of 5 %.

      - **{{d3}} kg**: the head wind was added to the TAS instead of subtracted.

      - **{{d4}} kg**: 15 minutes of holding fuel was used, which is not the
      quantity asked here.
