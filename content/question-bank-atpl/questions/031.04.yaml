- id: QETEZDFX
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316944
    - BGS-310470
    - AVEXAM-9555
    - ATPLGS-622452
    - BGS-310749
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      Given the following weighing data, calculate the aircraft CG position, as
      the distance aft of the nose wheel (in inches).


      - Mass on nose wheel: {{nose}} kg

      - Mass on left main wheels: {{left}} kg

      - Mass on right main wheels: {{right}} kg

      - Distance between the nose and main wheels: {{dist}} in
    variables:
      - id: nose
        label: Mass on nose wheel
        unit: kg
      - id: left
        label: Mass on left main wheels
        unit: kg
      - id: right
        label: Mass on right main wheels
        unit: kg
      - id: dist
        label: Distance nose wheel to main wheels
        unit: in
    answer:
      formula: (left + right) * dist / (nose + left + right)
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: nose * dist / (nose + left + right)
      - id: d2
        formula: nose * dist / (left + right)
      - id: d3
        formula: left * dist / (nose + left + right)
      - id: d4
        formula: dist - nose * dist / (left + right)
    presets:
      - id: p1
        values:
          nose: 285
          left: 1465
          right: 1395
          dist: 92
      - id: p2
        values:
          nose: 300
          left: 1500
          right: 1450
          dist: 90
      - id: p3
        values:
          nose: 270
          left: 1400
          right: 1350
          dist: 95
    explanation: >-
      Taking moments about the nose wheel, the total mass times the CG distance
      equals the sum of the main wheel masses times the wheelbase. Note that 7
      ft 8 in = 92 in.


      **Solution**


      {{f: (left + right) * dist / (nose + left + right)}} = {{n: (left + right)
      * dist / (nose + left + right)}} = **{{answer}} in** aft of the nose wheel


      **Why the other answers are wrong**


      - **{{d1}} in**: this is the CG distance forward of the main wheels, not
      aft of the nose wheel.

      - **{{d2}} in**: the nose mass is left out of the total mass, and the
      result is the distance forward of the main wheels.

      - **{{d3}} in**: only the left main wheel moment is used.

      - **{{d4}} in**: distance forward of main wheels computed with the wrong
      total, then subtracted from the wheelbase.
