- id: QD6YKWASE
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315891
    - AVEXAM-42801
    - ATPLGS-107075
    - ATPLGS-626990
    - AVEXAM-83216
    - ATPLGS-107070
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
    - 031.05.01.01.01
  template:
    type: calculation
    question: >-
      The mass and balance information gives:


      - Basic empty mass: {{bem}} kg

      - CG at BEM: {{bemcg}} m ({{bempct}} % MAC)

      - MAC: {{mac}} m


      From the flight manual: pilot and front seat occupant: {{crew}} kg each,
      front seats arm {{crewarm}} m; fuel tanks arm {{fuelarm}} m. The fuel
      tanks contain {{fuell}} litres of 100LL with a density of {{dens}} kg/l.
      The rear seats are not occupied. Taxi fuel is negligible.


      What is the position of the centre of gravity at take-off, in % MAC
      (rounded to whole numbers)?
    variables:
      - id: bem
        label: Basic empty mass
        unit: kg
      - id: bemcg
        label: CG at BEM
        unit: m
      - id: bempct
        label: CG at BEM
        unit: "% MAC"
      - id: mac
        label: MAC length
        unit: m
      - id: crew
        label: Mass of each front seat occupant
        unit: kg
      - id: crewarm
        label: Front seat arm
        unit: m
      - id: fuell
        label: Fuel volume
        unit: l
      - id: dens
        label: Fuel density
        unit: kg/l
      - id: fuelarm
        label: Fuel tank arm
        unit: m
    answer:
      formula: ((bem * bemcg + 2 * crew * crewarm + fuell * dens * fuelarm) / (bem + 2
        * crew + fuell * dens) - (bemcg - bempct / 100 * mac)) / mac * 100
      unit: "% MAC"
      decimals: 0
    distractors:
      - id: d1
        formula: ((bem * bemcg + 2 * crew * crewarm + fuell * dens * fuelarm) / (bem + 2
          * crew + fuell * dens)) / mac * 100
      - id: d2
        formula: ((bem * bemcg + 2 * crew * crewarm + fuell * dens * fuelarm) / (bem + 2
          * crew + fuell * dens) - bemcg) / mac * 100
      - id: d3
        formula: ((bem * bemcg + fuell * dens * fuelarm) / (bem + fuell * dens) - (bemcg
          - bempct / 100 * mac)) / mac * 100
      - id: d4
        formula: ((bem * bemcg + 2 * crew * crewarm + fuell / dens * fuelarm) / (bem + 2
          * crew + fuell / dens) - (bemcg - bempct / 100 * mac)) / mac * 100
    presets:
      - id: p1
        values:
          bem: 1095
          bemcg: 1.98
          bempct: 25
          mac: 2
          crew: 80
          crewarm: 2.5
          fuell: 139
          dens: 0.72
          fuelarm: 1.9
      - id: p2
        values:
          bem: 1180
          bemcg: 2.05
          bempct: 27
          mac: 2.1
          crew: 85
          crewarm: 2.45
          fuell: 200
          dens: 0.72
          fuelarm: 1.95
    explanation: >-
      The take-off CG is the total moment divided by the total mass. The leading
      edge of the MAC follows from the CG at BEM and its position in % MAC; the
      CG in % MAC is the distance of the CG behind the leading edge divided by
      the MAC length.


      **Solution**


      Fuel mass = {{fuell}} * {{dens}} = {{= fuell * dens}} kg


      Total mass = {{= bem + 2 * crew + fuell * dens}} kg; total moment = {{=
      bem * bemcg + 2 * crew * crewarm + fuell * dens * fuelarm}} kg·m


      CG = {{= (bem * bemcg + 2 * crew * crewarm + fuell * dens * fuelarm) /
      (bem + 2 * crew + fuell * dens)}} m


      LEMAC = {{bemcg}} - {{bempct}} % * {{mac}} = {{= bemcg - bempct / 100 *
      mac}} m


      %MAC = **{{answer}} % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: measures the CG from the datum instead of from the
      leading edge of the MAC.

      - **{{d2}} % MAC**: measures from the CG at BEM instead of from the
      leading edge of the MAC.

      - **{{d3}} % MAC**: leaves out the pilot and front seat occupant.

      - **{{d4}} % MAC**: divides the fuel volume by the density instead of
      multiplying.
