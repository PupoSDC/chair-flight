- id: QHMRPWVVF
  docId: "031.04"
  relatedQuestions:
    - QJLTV3J7T
  externalIds:
    - ATPLQ-319629
    - ATPLGS-114155
    - BGS-310263
    - BGS-310259
    - AVEXAM-29030
    - AVEXAM-26701
    - ATPLGS-126712
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      An aeroplane with a two wheel nose gear and four main wheels rests on the
      ground with a single nose wheel load of {{nose_load}} kg and a single main
      wheel load of {{main_load}} kg.


      The distance between the nose wheels and the main wheels is {{dist}} m.


      How far is the centre of gravity in front of the main wheels?


      Give the answer in cm.
    variables:
      - id: nose_load
        label: Single nose wheel load
        unit: kg
      - id: main_load
        label: Single main wheel load
        unit: kg
      - id: dist
        label: Distance nose to main wheels
        unit: m
    answer:
      formula: 2 * nose_load * dist * 100 / (2 * nose_load + 4 * main_load)
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: nose_load * dist * 100 / (nose_load + main_load)
      - id: d2
        formula: nose_load * dist * 100 / (2 * nose_load + 4 * main_load)
      - id: d3
        formula: 2 * nose_load * dist * 100 / (4 * main_load)
      - id: d4
        formula: dist * 100 - 2 * nose_load * dist * 100 / (2 * nose_load + 4 *
          main_load)
    presets:
      - id: p1
        values:
          nose_load: 500
          main_load: 6000
          dist: 10
      - id: p2
        values:
          nose_load: 450
          main_load: 5500
          dist: 9
    explanation: >-
      The nose gear carries two wheels and the main gear four, so the total nose
      load and main load must be built from the single wheel loads first.
      Moments about the main wheels then give the CG distance in front of them.


      **Solution**


      Nose load = {{= 2 * nose_load}} kg, main load = {{= 4 * main_load}} kg


      {{f: 2 * nose_load * dist * 100 / (2 * nose_load + 4 * main_load)}} = {{n:
      2 * nose_load * dist * 100 / (2 * nose_load + 4 * main_load)}} =
      **{{answer}} cm** in front of the main wheels


      **Why the other answers are wrong**


      - **{{d1}} cm**: only one nose wheel and one main wheel are counted.

      - **{{d2}} cm**: the nose gear has two wheels, but only one nose wheel
      load is used in the moment.

      - **{{d3}} cm**: the nose gear load is left out of the total mass.

      - **{{d4}} cm**: this is the CG distance behind the nose wheels, not in
      front of the main wheels.
- id: QHN8XQTKO
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319461
    - AVEXAM-47593
    - ATPLGS-107064
    - AVEXAM-38752
    - ATPLGS-107091
    - ATPLGS-126750
    - BGS-310242
  annexes: []
  learningObjectives:
    - 031.04.01.02.03
  template:
    type: calculation
    question: At a given mass the CG position is at {{pct}}% MAC. If the leading
      edge of MAC is at a position {{lemac}} inches aft of the datum and the MAC
      is given as {{mac}} inches, determine the position of the CG in relation
      to the datum.
    variables:
      - id: pct
        label: CG position
        unit: "% MAC"
      - id: lemac
        label: LEMAC
        unit: in
      - id: mac
        label: MAC length
        unit: in
    answer:
      formula: lemac + pct / 100 * mac
      unit: inches aft of the datum
      decimals: 2
    distractors:
      - id: d1
        formula: pct / 100 * mac
      - id: d2
        formula: mac + pct / 100 * lemac
      - id: d3
        formula: lemac - pct / 100 * mac
    presets:
      - id: p1
        values:
          pct: 15
          lemac: 625.6
          mac: 134.5
      - id: p2
        values:
          pct: 25
          lemac: 640.2
          mac: 120.4
      - id: p3
        values:
          pct: 32
          lemac: 610.8
          mac: 142.6
    explanation: >-
      The CG expressed as a percentage of MAC is measured from the leading edge
      of the MAC. Its distance from the datum is the distance of the leading
      edge plus that percentage of the MAC length.


      **Solution**


      {{f: lemac + pct / 100 * mac}} = {{n: lemac + pct / 100 * mac}} =
      **{{answer}} inches aft of the datum**


      **Why the other answers are wrong**


      - **{{d1}} inches**: this is only the distance of the CG behind the
      leading edge of the MAC; LEMAC was not added.

      - **{{d2}} inches**: the roles of LEMAC and MAC length were swapped.

      - **{{d3}} inches**: the distance behind the leading edge was subtracted
      instead of added.
