- id: QKXITQA1K
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317986
    - BGS-310452
    - AVEXAM-59998
  annexes: []
  learningObjectives:
    - 031.04.01.01.03
  template:
    type: calculation
    question: |-
      Determine the balance arm, given:

      - Moment: {{moment}} N.mm
      - Mass: {{mass}} kg

      Assume g = {{g}} m/s².
    variables:
      - id: moment
        label: Moment
        unit: N.mm
      - id: mass
        label: Mass
        unit: kg
      - id: g
        label: g
        unit: m/s²
    answer:
      formula: moment / (mass * g)
      unit: mm
      decimals: 1
    distractors:
      - id: d1
        formula: moment / (mass * g ^ 2)
      - id: d2
        formula: moment / mass
      - id: d3
        formula: moment / mass * g
    presets:
      - id: p1
        values:
          moment: 5000
          mass: 500
          g: 10
      - id: p2
        values:
          moment: 6000
          mass: 200
          g: 10
      - id: p3
        values:
          moment: 8000
          mass: 400
          g: 10
    explanation: >-
      The moment of a mass about the datum is the force it exerts (its weight,
      mass times g) multiplied by the balance arm. The arm is therefore the
      moment divided by the weight.


      **Solution**


      {{f: moment / (mass * g)}} = {{n: moment / (mass * g)}} = **{{answer}}
      mm**


      **Why the other answers are wrong**


      - **{{d1}} mm**: g was applied twice (divided by g squared).

      - **{{d2}} mm**: the moment was divided by the mass only; the force is
      mass times g, not mass.

      - **{{d3}} mm**: g was multiplied instead of divided.
