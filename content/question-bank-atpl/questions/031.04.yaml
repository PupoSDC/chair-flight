- id: QIC7YO7NU
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316283
    - AVEXAM-9353
    - BGS-310539
    - AVEXAM-61059
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: >-
      The CG position of an aeroplane is {{cg}} inches aft of the datum. Given
      the following characteristics of the wing, calculate the CG position as %
      MAC.


      - Leading edge of the wing root: {{rle}} inches aft of the datum

      - Leading edge of the MAC: {{le}} inches aft of the datum

      - Leading edge of the wing tip: {{tle}} inches aft of the datum

      - Length of the wing root chord: {{rc}} inches

      - Length of the MAC: {{mac}} inches

      - Length of the wing tip chord: {{tc}} inches
    variables:
      - id: cg
        label: CG position
        unit: in
      - id: rle
        label: Wing root leading edge
        unit: in
      - id: le
        label: MAC leading edge
        unit: in
      - id: tle
        label: Wing tip leading edge
        unit: in
      - id: rc
        label: Wing root chord
        unit: in
      - id: mac
        label: MAC length
        unit: in
      - id: tc
        label: Wing tip chord
        unit: in
    answer:
      formula: (cg - le) / mac * 100
      unit: "% MAC"
      decimals: 2
    distractors:
      - id: d1
        formula: (cg - rle) / rc * 100
      - id: d2
        formula: (cg - le) / rc * 100
      - id: d3
        formula: (cg - tle) / tc * 100 + 50
      - id: d4
        formula: (cg - rle) / mac * 100
    presets:
      - id: p1
        values:
          cg: 683.4
          rle: 575
          le: 598
          tle: 680
          rc: 183.82
          mac: 164.38
          tc: 60.13
      - id: p2
        values:
          cg: 690
          rle: 580
          le: 603
          tle: 685
          rc: 185
          mac: 165
          tc: 62
    explanation: >-
      Only the MAC leading edge and the MAC length are relevant: the CG in % MAC
      is the CG's distance behind the MAC leading edge divided by the MAC
      length. The wing root and tip data are distractors.


      **Solution**


      {{f: (cg - le) / mac * 100}} = {{n: (cg - le) / mac * 100}} = **{{answer}}
      % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: uses the wing root chord and its leading edge instead
      of the MAC.

      - **{{d2}} % MAC**: uses the MAC leading edge but divides by the wing root
      chord.

      - **{{d3}} % MAC**: uses the wing tip chord and an arbitrary offset.

      - **{{d4}} % MAC**: uses the wing root leading edge with the MAC length.
