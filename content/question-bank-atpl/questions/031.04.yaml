- id: QDON9I2V0
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313714
    - AVEXAM-71356
    - AVEXAM-9555
    - ATPLGS-622452
    - BGS-310749
    - AVEXAM-43294
    - ATPLGS-127365
    - BGS-310748
    - ATPLGS-626180
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      Given the following aircraft weighing data, determine the CG position,
      expressed as the distance forward of the main gear (in cm):


      - Mass on nose gear: {{nose}} kg

      - Mass on right main gear: {{right}} kg

      - Mass on left main gear: {{left}} kg

      - Distance between nose and main gear: {{dist}} cm
    variables:
      - id: nose
        label: Mass on nose gear
        unit: kg
      - id: right
        label: Mass on right main gear
        unit: kg
      - id: left
        label: Mass on left main gear
        unit: kg
      - id: dist
        label: Distance nose gear to main gear
        unit: cm
    answer:
      formula: nose * dist / (nose + right + left)
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: dist - nose * dist / (nose + right + left)
      - id: d2
        formula: nose * dist / (right + left)
      - id: d3
        formula: 2 * nose * dist / (nose + right + left)
      - id: d4
        formula: nose * dist / (nose + right)
    presets:
      - id: p1
        values:
          nose: 435
          right: 2385
          left: 2415
          dist: 583
      - id: p2
        values:
          nose: 400
          right: 2300
          left: 2350
          dist: 560
      - id: p3
        values:
          nose: 520
          right: 2600
          left: 2650
          dist: 610
    explanation: >-
      When an aircraft is weighed, taking moments about the main gear shows that
      the nose gear reaction times the wheelbase equals the total mass times the
      distance of the CG forward of the main gear.


      **Solution**


      {{f: nose * dist / (nose + right + left)}} = {{n: nose * dist / (nose +
      right + left)}} = **{{answer}} cm** forward of the main gear


      **Why the other answers are wrong**


      - **{{d1}} cm**: this is the CG distance aft of the nose gear, not forward
      of the main gear.

      - **{{d2}} cm**: the nose gear mass is left out of the total mass.

      - **{{d3}} cm**: the nose gear moment is counted twice.

      - **{{d4}} cm**: the left main gear mass is forgotten in the total mass.
- id: QDS2PBSMH
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313745
    - AVEXAM-59400
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: |-
      Calculate the position of the centre of gravity of a jet, in % MAC, given:

      - MAC leading edge: {{le}} m aft of datum
      - MAC trailing edge: {{te}} m aft of datum
      - Centre of gravity: {{cg}} m aft of datum
    variables:
      - id: le
        label: MAC leading edge
        unit: m
      - id: te
        label: MAC trailing edge
        unit: m
      - id: cg
        label: CG position
        unit: m
    answer:
      formula: (cg - le) / (te - le) * 100
      unit: "% MAC"
      decimals: 1
    distractors:
      - id: d1
        formula: (cg - le) / te * 100
      - id: d2
        formula: (te - cg) / (te - le) * 100
      - id: d3
        formula: (cg - le) / le * 100
      - id: d4
        formula: (cg - le) / (te - le) * 10
    presets:
      - id: p1
        values:
          le: 13.21
          te: 15.63
          cg: 13.65
      - id: p2
        values:
          le: 13.1
          te: 15.5
          cg: 13.9
      - id: p3
        values:
          le: 13.3
          te: 15.7
          cg: 14.2
    explanation: >-
      The CG in % MAC is the distance of the CG behind the MAC leading edge
      divided by the MAC length (trailing edge minus leading edge).


      **Solution**


      MAC = {{= te - le}} m


      {{f: (cg - le) / (te - le) * 100}} = {{n: (cg - le) / (te - le) * 100}} =
      **{{answer}} % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: divides by the trailing edge position instead of the
      MAC length.

      - **{{d2}} % MAC**: measures from the trailing edge, giving the distance
      forward of it.

      - **{{d3}} % MAC**: divides by the leading edge position instead of the
      MAC length.

      - **{{d4}} % MAC**: omits the factor to convert the ratio into a
      percentage correctly (factor 10 instead of 100).
- id: QE6XRMZGQ
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311615
    - AVEXAM-15283
    - AVEXAM-32955
  annexes: []
  learningObjectives:
    - 031.04.01.07.02
  template:
    type: calculation
    question: >-
      According to the AFM, the centre tank fuel has to be consumed prior to the
      wing tanks fuel. According to the pre-flight fuel planning, the remaining
      fuel upon landing will be {{lf}} kg. Given the following information
      below, calculate your CG position upon landing:


      - Zero Fuel Mass: {{zfm}} kg

      - CG position at TOM: {{cgt}} m

      - Fuel in centre tank at take-off: {{fc}} kg

      - Centre fuel tank station: {{xc}} m

      - Fuel in wing tanks at take-off: {{fw}} kg

      - Wing fuel tank station: {{xw}} m
    variables:
      - id: lf
        label: Landing fuel
        unit: kg
      - id: zfm
        label: ZFM
        unit: kg
      - id: cgt
        label: CG at TOM
        unit: m
      - id: fc
        label: Centre tank fuel
        unit: kg
      - id: xc
        label: Centre tank station
        unit: m
      - id: fw
        label: Wing tanks fuel
        unit: kg
      - id: xw
        label: Wing tank station
        unit: m
    answer:
      formula: ((zfm + fc + fw) * cgt - fc * xc - (fw - lf) * xw) / (zfm + lf)
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: ((zfm + fc + fw) * cgt - fw * xw - (fc - lf) * xc) / (zfm + lf)
      - id: d2
        formula: ((zfm + fc + fw) * cgt - fc * xc - (fw - lf) * xw) / zfm
      - id: d3
        formula: ((zfm + fc + fw) * cgt - fc * xc - fw * xw) / (zfm + lf)
    presets:
      - id: p1
        values:
          lf: 2000
          zfm: 40000
          cgt: 15.45
          fc: 28000
          xc: 15.3
          fw: 26000
          xw: 15.7
      - id: p2
        values:
          lf: 1500
          zfm: 38000
          cgt: 15.5
          fc: 20000
          xc: 15.2
          fw: 22000
          xw: 15.9
    explanation: >-
      The CG is the total moment divided by the total mass. The take-off mass is
      ZFM + fuel; its moment is TOM x CG at TOM. The centre tank is emptied
      first, then the wing tanks are burned down to the landing fuel; subtract
      the moments of the fuel burned and divide by the landing mass (ZFM +
      landing fuel).


      **Solution**


      Take-off mass: {{= zfm + fc + fw}} kg, moment: {{= (zfm + fc + fw) * cgt}}
      kg m

      Centre tank burned: {{fc}} kg, moment {{= fc * xc}} kg m

      Wing tanks burned: {{= fw - lf}} kg, moment {{= (fw - lf) * xw}} kg m

      Landing mass: {{= zfm + lf}} kg


      {{f: ((zfm + fc + fw) * cgt - fc * xc - (fw - lf) * xw) / (zfm + lf)}} =
      **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the wing tank fuel was burned before the centre tank,
      contrary to the AFM.

      - **{{d2}} m**: the landing moment was divided by the ZFM instead of the
      landing mass (landing fuel left out of the mass).

      - **{{d3}} m**: all the fuel was removed from the moment, including the
      landing fuel that stays on board.
