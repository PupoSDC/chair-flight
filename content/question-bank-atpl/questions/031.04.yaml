- id: QSXAKADJ
  docId: "031.04"
  relatedQuestions:
    - QBF9CF9QN
  externalIds:
    - ATPLQ-317969
    - AVEXAM-14868
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: |-
      A tri-wheel aircraft has its datum {{dn}} cm aft of the nose wheel.

      The weight on the nose wheel is {{nw}} lb.

      The main gear is {{ma}} cm aft of the datum.

      The weight on each main gear is {{mw}} lb.

      Calculate the CG position, in cm aft of the datum.
    variables:
      - id: dn
        label: Datum aft of nose wheel
        unit: cm
      - id: nw
        label: Nose wheel weight
        unit: lb
      - id: ma
        label: Main gear arm
        unit: cm
      - id: mw
        label: Weight on each main gear
        unit: lb
    answer:
      formula: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw)
      unit: cm
      decimals: 1
    distractors:
      - id: d1
        formula: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw) + dn
      - id: d2
        formula: ma
      - id: d3
        formula: (nw * dn + 2 * mw * ma) / (nw + 2 * mw)
      - id: d4
        formula: (nw * (0 - dn) + 2 * mw * ma) / (2 * mw)
    presets:
      - id: p1
        values:
          dn: 25
          nw: 125
          ma: 180
          mw: 3000
      - id: p2
        values:
          dn: 30
          nw: 140
          ma: 175
          mw: 3100
    explanation: >-
      The nose wheel lies {{dn}} cm forward of the datum, so its arm is
      negative. The CG is the total moment divided by the total weight (BEM).


      **Solution**


      Total = {{= nw + 2 * mw}} lb; moment = {{= nw * (0 - dn) + 2 * mw * ma}}
      lb·cm


      {{f: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw)}} = {{n: (nw * (0 - dn)
      + 2 * mw * ma) / (nw + 2 * mw)}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: the CG measured from the nose wheel instead of the datum.

      - **{{d2}} cm**: only the main gear arm, ignoring the nose wheel.

      - **{{d3}} cm**: uses a positive nose wheel arm.

      - **{{d4}} cm**: divides the moment by the main gear weights only.
