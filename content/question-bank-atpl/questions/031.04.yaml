- id: QOQQRSHD
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311703
    - AVEXAM-90231
  annexes: []
  learningObjectives:
    - 031.04.01.03.01
  template:
    type: calculation
    question: >-
      Determine the length of the MAC in cm, given:


      - Leading edge at wing root: STA {{rle}}

      - Trailing edge at wing root: STA {{rte}}

      - Leading edge at wing tip: STA {{tle}}

      - Trailing edge at wing tip: STA {{tte}}

      - Leading edge of MAC: STA {{mle}}

      - Trailing edge of MAC: STA {{mte}}


      Note: body stations are distances from the aircraft nose in 10^-1 m (1 STA
      unit = 10 cm).
    variables:
      - id: rle
        label: Root leading edge
        unit: STA
      - id: rte
        label: Root trailing edge
        unit: STA
      - id: tle
        label: Tip leading edge
        unit: STA
      - id: tte
        label: Tip trailing edge
        unit: STA
      - id: mle
        label: MAC leading edge
        unit: STA
      - id: mte
        label: MAC trailing edge
        unit: STA
    answer:
      formula: (mte - mle) * 10
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: (mte - mle) * 100
      - id: d2
        formula: mte - mle
      - id: d3
        formula: (rte - rle) * 10
      - id: d4
        formula: (tte - tle) * 10
      - id: d5
        formula: ((rte - rle) + (tte - tle)) / 2 * 10
    presets:
      - id: p1
        values:
          rle: 235
          rte: 250
          tle: 148
          tte: 212
          mle: 192
          mte: 224
      - id: p2
        values:
          rle: 240
          rte: 258
          tle: 150
          tte: 205
          mle: 190
          mte: 225
    explanation: >-
      The MAC length is the distance between the MAC leading and trailing edge
      stations. Station numbers are in units of 0.1 m, so each unit is 10 cm.


      **Solution**


      {{f: (mte - mle) * 10}} = {{n: (mte - mle) * 10}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: Wrong factor of 100 (treats a station unit as 1 m).

      - **{{d2}} cm**: Leaves the length in station units without converting to
      cm.

      - **{{d3}} cm**: Is the root chord, not the MAC.

      - **{{d4}} cm**: Is the tip chord, not the MAC.

      - **{{d5}} cm**: Is the mean of root and tip chord, which is not the MAC.
- id: QOUJAVBCX
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317175
    - BGS-310801
    - ATPLQ-312140
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      After the weighing procedure of an aircraft with the results given below,
      what is the distance (in metres) of the CG of the BEM forward of the main
      landing gear?


      - Nose landing gear jack point: {{nose}} kg

      - Each main landing gear jack point (two main gears): {{main}} kg

      - Longitudinal distance between the nose landing gear and the main landing
      gears: {{dist}} m
    variables:
      - id: nose
        label: Nose gear reading
        unit: kg
      - id: main
        label: Reading of each main gear
        unit: kg
      - id: dist
        label: Distance nose gear to main gears
        unit: m
    answer:
      formula: nose * dist / (nose + 2 * main)
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: nose * dist / (nose + main)
      - id: d2
        formula: nose * dist / (2 * main)
      - id: d3
        formula: dist - nose * dist / (nose + 2 * main)
      - id: d4
        formula: nose * dist / main
    presets:
      - id: p1
        values:
          nose: 1850
          main: 8140
          dist: 10
      - id: p2
        values:
          nose: 1850
          main: 8140
          dist: 12.2
    explanation: >-
      Taking moments about the main gear, the nose gear reaction times the
      wheelbase equals the total mass times the distance of the CG forward of
      the main gear. The total mass is the nose reading plus both main gear
      readings.


      **Solution**


      {{f: nose * dist / (nose + 2 * main)}} = {{n: nose * dist / (nose + 2 *
      main)}} = **{{answer}} m** forward of the main gear


      **Why the other answers are wrong**


      - **{{d1}} m**: only one main gear is counted in the total mass.

      - **{{d2}} m**: the nose gear mass is left out of the total mass.

      - **{{d3}} m**: this is the CG distance aft of the nose gear, not forward
      of the main gear.

      - **{{d4}} m**: the total mass is replaced by a single main gear reading.
- id: QOV2IOJDU
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314750
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      Calculate the centre of gravity of the basic empty configuration, in cm
      from the datum, from the weighing results:


      - Nose wheel: {{wn}} N, arm {{an}} cm

      - Left main wheel: {{wl}} N, arm {{am}} cm

      - Right main wheel: {{wr}} N, arm {{am}} cm
    variables:
      - id: wn
        label: Nose wheel weight
        unit: N
      - id: an
        label: Nose wheel arm
        unit: cm
      - id: wl
        label: Left main wheel weight
        unit: N
      - id: wr
        label: Right main wheel weight
        unit: N
      - id: am
        label: Main wheel arm
        unit: cm
    answer:
      formula: (wn * an + (wl + wr) * am) / (wn + wl + wr)
      unit: cm
      decimals: 1
    distractors:
      - id: d1
        formula: wn * an + (wl + wr) * am
      - id: d2
        formula: (wn * abs(an) + (wl + wr) * am) / (wn + wl + wr)
      - id: d3
        formula: am
      - id: d4
        formula: (wn * an + (wl + wr) * am) / (wl + wr)
      - id: d5
        formula: (an + 2 * am) / 3
    presets:
      - id: p1
        values:
          wn: 1200
          an: -30
          wl: 4100
          wr: 4200
          am: 210
      - id: p2
        values:
          wn: 1500
          an: -40
          wl: 4800
          wr: 4700
          am: 200
      - id: p3
        values:
          wn: 1100
          an: -25
          wl: 3900
          wr: 3950
          am: 215
    explanation: >-
      The CG is the total moment about the datum divided by the total weight.
      The nose wheel is ahead of the datum, so its arm is negative.


      **Solution**


      Total weight = {{= wn + wl + wr}} N; total moment = {{= wn * an + (wl +
      wr) * am}} N·cm


      {{f: (wn * an + (wl + wr) * am) / (wn + wl + wr)}} = {{n: (wn * an + (wl +
      wr) * am) / (wn + wl + wr)}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: the total moment itself, not divided by the weight.

      - **{{d2}} cm**: treats the nose wheel arm as positive.

      - **{{d3}} cm**: only the main wheel arm, ignoring the nose wheel.

      - **{{d4}} cm**: divides the total moment by the main wheel loads only.

      - **{{d5}} cm**: plain average of the three arms.
