- id: QMLLNSSRN
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314281
    - BGS-310508
  annexes:
    - CAP-696-page-28
  learningObjectives:
    - 031.04.01.03.03
    - 031.05.01.01.01
  template:
    type: chart-calculation
    question: >-
      The CG at take-off is at {{cg}} % MAC and the take-off mass is {{tom}} kg.


      The leading edge of the MAC lies {{le}} inches aft of the datum and the
      MAC length is {{mac}} inches (both read from the MAC figure, CAP 696
      MRJT).


      What is the mass moment in kg-inch?
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: cg
        label: CG position
        unit: "% MAC"
      - id: le
        label: Distance of MAC leading edge from datum (read from figure)
        unit: in
      - id: mac
        label: MAC length (read from figure)
        unit: in
    chartInputs:
      - le
      - mac
    answer:
      formula: tom * (le + cg / 100 * mac)
      unit: kg-inch
      decimals: 0
    distractors:
      - id: d1
        formula: tom * le
      - id: d2
        formula: tom * mac
      - id: d3
        formula: tom * cg / 100 * mac
      - id: d4
        formula: tom * (le - cg / 100 * mac)
    presets:
      - id: p1
        values:
          tom: 60000
          cg: 21
          le: 625.6
          mac: 134.5
    explanation: >-
      The CG arm from the datum equals the distance of the MAC leading edge plus
      the CG position as a fraction of the MAC length. The mass moment is the
      mass multiplied by this arm.


      **Solution**


      CG arm = {{= le + cg / 100 * mac}} in


      {{f: tom * (le + cg / 100 * mac)}} = {{n: tom * (le + cg / 100 * mac)}} =
      **{{answer}} kg-inch**


      **Why the other answers are wrong**


      - **{{d1}} kg-inch**: the CG is taken at the leading edge of the MAC (the
      % MAC is ignored).

      - **{{d2}} kg-inch**: the MAC length is used as the arm.

      - **{{d3}} kg-inch**: the leading edge distance is forgotten.

      - **{{d4}} kg-inch**: the CG offset is subtracted from the leading edge
      instead of added.
- id: QMTI96PWJ
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311100
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: >-
      The mean aerodynamic chord published in the flight manual of an aeroplane
      starts at {{le}} mm and ends at {{te}} mm from the datum line.


      The centre of gravity of a loaded aeroplane is at {{pct}}% MAC.


      Determine the associated distance of the CG position to the datum (in mm).
    variables:
      - id: le
        label: MAC leading edge distance
        unit: mm
      - id: te
        label: MAC trailing edge distance
        unit: mm
      - id: pct
        label: CG position
        unit: "% MAC"
    answer:
      formula: le + pct / 100 * (te - le)
      unit: mm
      decimals: 0
    distractors:
      - id: d1
        formula: pct / 100 * te
      - id: d2
        formula: le + pct / 100 * te
      - id: d3
        formula: te - pct / 100 * (te - le)
      - id: d4
        formula: pct / 100 * (te - le)
      - id: d5
        formula: (le + te) * pct / 100
    presets:
      - id: p1
        values:
          le: 520
          te: 1700
          pct: 30
      - id: p2
        values:
          le: 450
          te: 1650
          pct: 25
    explanation: >-
      The CG position as a percentage of MAC is measured from the leading edge
      of the MAC. The distance to the datum is the leading edge distance plus
      that fraction of the MAC length.


      **Solution**


      MAC length = {{= te - le}} mm


      {{f: le + pct / 100 * (te - le)}} = {{n: le + pct / 100 * (te - le)}} =
      **{{answer}} mm**


      **Why the other answers are wrong**


      - **{{d1}} mm**: the percentage is applied to the trailing edge distance
      instead of the MAC length.

      - **{{d2}} mm**: the percentage is applied to the trailing edge distance
      before adding the leading edge distance.

      - **{{d3}} mm**: the CG distance is measured from the trailing edge
      instead of the leading edge.

      - **{{d4}} mm**: the leading edge distance is not added.

      - **{{d5}} mm**: the percentage is applied to the sum of the leading and
      trailing edge distances.
- id: QNFJQIXF
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318061
    - AVEXAM-58222
    - ATPLQ-315938
    - BGS-310541
    - AVEXAM-73716
  annexes:
    - 031-aeroplane-reference-datum-mac-and-cg-variables
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      The CG of an aeroplane is located at {{pct}} % MAC, which is Z = {{z}} m
      aft of the datum.


      Using the leading-edge position of the MAC given in the annex (X = {{x}} m
      aft of the datum, read from the figure), calculate the length of the MAC.
    variables:
      - id: z
        label: "Z: CG distance from datum"
        unit: m
      - id: pct
        label: CG position
        unit: "% MAC"
      - id: x
        label: "X: MAC leading edge position"
        unit: m
    chartInputs:
      - x
    answer:
      formula: (z - x) / (pct / 100)
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: z / (pct / 100)
      - id: d2
        formula: z - x
      - id: d3
        formula: x / (pct / 100)
      - id: d4
        formula: (z + x) / (pct / 100)
    presets:
      - id: p1
        values:
          z: 15.6
          pct: 23
          x: 14
      - id: p2
        values:
          z: 32.25
          pct: 13
          x: 31.3
    explanation: >-
      The CG distance behind the MAC leading edge is the CG %MAC times the MAC
      length. So the MAC length is (CG arm - leading edge arm) divided by the CG
      expressed as a fraction.


      **Solution**


      {{f: (z - x) / (pct / 100)}} = {{n: (z - x) / (pct / 100)}} = **{{answer}}
      m**


      **Why the other answers are wrong**


      - **{{d1}} m**: Forgets to subtract the leading-edge position.

      - **{{d2}} m**: Gives the distance of the CG from the leading edge, not
      the MAC length.

      - **{{d3}} m**: Uses the leading-edge arm instead of the CG distance from
      it.

      - **{{d4}} m**: Adds the leading-edge arm instead of subtracting it.
