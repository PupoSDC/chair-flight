- id: QJLTV3J7T
  docId: "031.04"
  relatedQuestions:
    - QHMRPWVVF
  externalIds:
    - ATPLQ-317577
    - ATPLGS-114155
    - BGS-310263
    - BGS-310259
    - AVEXAM-29030
    - AVEXAM-26701
    - ATPLGS-126712
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      An aircraft with a two wheel nose gear and four main wheels rests on the
      ground with a single nose wheel load of {{nose_load}} N and a single main
      wheel load of {{main_load}} N.


      The distance between the nose wheels and the main wheels is {{dist}} m.


      How far is the Centre of Gravity in front of the main wheels?


      Give the answer in cm.
    variables:
      - id: nose_load
        label: Single nose wheel load
        unit: N
      - id: main_load
        label: Single main wheel load
        unit: N
      - id: dist
        label: Distance nose to main wheels
        unit: m
    answer:
      formula: 2 * nose_load * dist * 100 / (2 * nose_load + 4 * main_load)
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: nose_load * dist * 100 / (nose_load + main_load)
      - id: d2
        formula: nose_load * dist * 100 / (2 * nose_load + 4 * main_load)
      - id: d3
        formula: 2 * nose_load * dist * 100 / (4 * main_load)
      - id: d4
        formula: dist * 100 - 2 * nose_load * dist * 100 / (2 * nose_load + 4 *
          main_load)
    presets:
      - id: p1
        values:
          nose_load: 7250
          main_load: 60000
          dist: 10
      - id: p2
        values:
          nose_load: 6800
          main_load: 55000
          dist: 9
    explanation: >-
      The weight on the wheels is proportional to the CG position: the CG lies
      closer to the gear that carries more load. Build the total nose and main
      loads from the single wheel loads, then take moments about the main
      wheels.


      **Solution**


      Nose load = {{= 2 * nose_load}} N, main load = {{= 4 * main_load}} N


      {{f: 2 * nose_load * dist * 100 / (2 * nose_load + 4 * main_load)}} = {{n:
      2 * nose_load * dist * 100 / (2 * nose_load + 4 * main_load)}} =
      **{{answer}} cm** in front of the main wheels


      **Why the other answers are wrong**


      - **{{d1}} cm**: only one nose wheel and one main wheel are counted.

      - **{{d2}} cm**: only one nose wheel load is used in the moment.

      - **{{d3}} cm**: the nose gear load is left out of the total weight.

      - **{{d4}} cm**: this is the CG distance behind the nose wheels, not in
      front of the main wheels.
