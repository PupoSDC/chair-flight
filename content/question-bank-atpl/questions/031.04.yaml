- id: QSQSJHMWH
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312376
    - AVEXAM-15283
    - AVEXAM-32955
  annexes: []
  learningObjectives:
    - 031.04.01.07.02
  template:
    type: calculation
    question: >-
      You are departing for a flight with a planned landing fuel of {{lf}} kg.
      According to aircraft limitations, the centre tank fuel must be used prior
      to the wing tank fuel. Given the following information, the location of
      the CG on landing will be how many metres aft of the datum?


      - Maximum Take-Off Mass: {{mtom}} kg

      - Actual Take-Off Mass: {{tom}} kg

      - Take-off CG location: {{cg}} m aft of the datum

      - Fuel in centre tank at take-off: {{c}} kg

      - Fuel in wing tanks at take-off: {{w}} kg

      - Centre fuel tank centroid: {{carm}} m aft of the datum

      - Wing fuel tank centroid: {{warm}} m aft of the datum
    variables:
      - id: lf
        label: Landing fuel
        unit: kg
      - id: mtom
        label: Max take-off mass
        unit: kg
      - id: tom
        label: Take-off mass
        unit: kg
      - id: cg
        label: Take-off CG
        unit: m
      - id: c
        label: Centre tank fuel
        unit: kg
      - id: w
        label: Wing tank fuel
        unit: kg
      - id: carm
        label: Centre tank centroid
        unit: m
      - id: warm
        label: Wing tank centroid
        unit: m
    answer:
      formula: (tom * cg - c * carm - (w - lf) * warm) / (tom - c - (w - lf))
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: (tom * cg - w * warm - (c + w - lf - w) * carm) / (tom - c - w + lf)
      - id: d2
        formula: cg
      - id: d3
        formula: (tom * cg - (c + w - lf) * (carm + warm) / 2) / (tom - (c + w - lf))
      - id: d4
        formula: (tom * cg - c * carm - (w - lf) * warm) / tom
    presets:
      - id: p1
        values:
          lf: 1800
          mtom: 99800
          tom: 59500
          cg: 16.26
          c: 10000
          w: 18000
          carm: 15.38
          warm: 17.79
      - id: p2
        values:
          lf: 2000
          mtom: 99800
          tom: 62000
          cg: 16.4
          c: 9000
          w: 17000
          carm: 15.4
          warm: 17.8
    explanation: >-
      The landing CG follows from the moment balance: take-off moment minus the
      moments of the fuel burned, divided by the landing mass. Centre-tank fuel
      is burned first, so all of it is gone and the rest comes from the wing
      tanks.


      **Solution**


      Fuel burned = {{= c + w - lf}} kg (centre {{c}} kg, wing {{= w - lf}} kg)

      Landing mass = {{= tom - c - (w - lf)}} kg

      Landing moment = {{= tom * cg - c * carm - (w - lf) * warm}} kg·m

      Landing CG = {{= tom * cg - c * carm - (w - lf) * warm}} / {{= tom - c -
      (w - lf)}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: Burns the wing tank fuel first, leaving centre tank fuel
      at landing.

      - **{{d2}} m**: Is the unchanged take-off CG.

      - **{{d3}} m**: Treats the burned fuel as taken from the mean of both tank
      centroids.

      - **{{d4}} m**: Divides the landing moment by the take-off mass instead of
      the landing mass.
