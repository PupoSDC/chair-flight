- id: QBF9CF9QN
  docId: "031.04"
  relatedQuestions:
    - QSXAKADJ
  externalIds:
    - ATPLQ-319589
    - ATPLGS-127324
    - AVEXAM-95631
    - BGS-310471
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      A tri-wheel aircraft has its datum {{dn}} inches aft of the nose wheel and
      {{ma}} inches forward of the main wheels.


      The nose jack shows {{nw}} lb and each main wheel jack shows {{mw}} lb.


      Determine the CG position, in inches measured from the nose wheel.
    variables:
      - id: dn
        label: Datum aft of nose wheel
        unit: in
      - id: ma
        label: Datum forward of main wheels
        unit: in
      - id: nw
        label: Nose jack reading
        unit: lb
      - id: mw
        label: Reading of each main jack
        unit: lb
    answer:
      formula: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw) + dn
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw)
      - id: d2
        formula: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw) - dn
      - id: d3
        formula: ma + dn
      - id: d4
        formula: (nw * dn + 2 * mw * ma) / (nw + 2 * mw) + dn
    presets:
      - id: p1
        values:
          dn: 25
          ma: 180
          nw: 125
          mw: 3400
      - id: p2
        values:
          dn: 30
          ma: 175
          nw: 140
          mw: 3000
    explanation: >-
      First find the CG relative to the datum (nose wheel arm negative), then
      add the distance from the nose wheel to the datum to refer it to the nose
      wheel.


      **Solution**


      Total = {{= nw + 2 * mw}} lb


      CG from datum = {{= (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw)}} in


      {{f: (nw * (0 - dn) + 2 * mw * ma) / (nw + 2 * mw) + dn}} = **{{answer}}
      in** from the nose wheel


      **Why the other answers are wrong**


      - **{{d1}} in**: the CG from the datum, not from the nose wheel.

      - **{{d2}} in**: subtracts the datum offset instead of adding it.

      - **{{d3}} in**: uses only the geometry and ignores the weights.

      - **{{d4}} in**: uses a positive nose wheel arm.
