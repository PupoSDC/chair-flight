- id: QPZEKMTH
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319056
  annexes:
    - 031-aeroplane-reference-datum-mac-and-cg-variables
  learningObjectives:
    - 031.04.01.03.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. On the common datum scale, the forward CG limit is X
      = {{x}} in and the aft CG limit is Z = {{z}} in.


      What is the length of the MAC of this aeroplane?
    variables:
      - id: x
        label: "X: forward CG limit from datum"
        unit: in
      - id: z
        label: "Z: aft CG limit from datum"
        unit: in
    chartInputs:
      - x
      - z
    answer:
      formula: z - x
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: z + x
      - id: d2
        formula: x
      - id: d3
        formula: z
      - id: d4
        formula: (z - x) / 2
    presets:
      - id: p1
        values:
          x: 1174.5
          z: 1453
      - id: p2
        values:
          x: 1220
          z: 1500
    explanation: >-
      The MAC is the distance between the forward and aft limits measured from
      the same datum.


      **Solution**


      {{f: z - x}} = **{{answer}} in**


      **Why the other answers are wrong**


      - **{{d1}} in**: adds the two arms instead of finding their separation.

      - **{{d2}} in**: gives only the forward limit arm.

      - **{{d3}} in**: gives only the aft limit arm.

      - **{{d4}} in**: halves the MAC without justification.
- id: QPZYQRO29
  docId: "031.04"
  relatedQuestions:
    - QDS2PBSMH
  externalIds:
    - ATPLQ-316291
    - ATPLGS-107062
    - AVEXAM-34939
    - AVEXAM-49949
    - ATPLGS-107079
    - BGS-310240
    - ATPLGS-126724
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: >-
      The loaded centre of gravity of an aeroplane is {{cg}} mm aft of the
      datum.


      The mean aerodynamic chord lies between station {{le}} mm aft and {{te}}
      mm aft.


      The CG expressed as % MAC is (round to a whole number):
    variables:
      - id: cg
        label: CG position
        unit: mm
      - id: le
        label: MAC leading edge station
        unit: mm
      - id: te
        label: MAC trailing edge station
        unit: mm
    answer:
      formula: (cg - le) / (te - le) * 100
      unit: "% MAC"
      decimals: 0
    distractors:
      - id: d1
        formula: (cg - le) / te * 100
      - id: d2
        formula: (te - cg) / (te - le) * 100
      - id: d3
        formula: cg / te * 100
      - id: d4
        formula: (cg - le) / le * 100
    presets:
      - id: p1
        values:
          cg: 713
          le: 524
          te: 1706
      - id: p2
        values:
          cg: 820
          le: 600
          te: 1800
      - id: p3
        values:
          cg: 650
          le: 480
          te: 1650
    explanation: >-
      The MAC length is the trailing edge station minus the leading edge
      station. The CG in % MAC is the distance behind the leading edge divided
      by that length.


      **Solution**


      MAC = {{te}} - {{le}} = {{= te - le}} mm


      {{f: (cg - le) / (te - le) * 100}} = {{n: (cg - le) / (te - le) * 100}} =
      **{{answer}} % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: divides by the trailing edge station instead of the
      MAC length.

      - **{{d2}} % MAC**: measures from the trailing edge.

      - **{{d3}} % MAC**: divides the CG station by the trailing edge station.

      - **{{d4}} % MAC**: divides by the leading edge station instead of the MAC
      length.
- id: QQQWGELY
  docId: "031.04"
  relatedQuestions:
    - Q7U8KYYE0
  externalIds:
    - ATPLQ-318048
    - BGS-310241
    - ATPLGS-114209
    - ATPLGS-107089
    - AVEXAM-10537
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: >-
      Calculate the centre of gravity in % MAC (mean aerodynamic chord) with the
      following data:


      - Distance datum - centre of gravity: {{cg}} m

      - Distance datum - leading edge of the MAC: {{le}} m

      - Length of MAC: {{mac}} m
    variables:
      - id: cg
        label: Datum to CG
        unit: m
      - id: le
        label: Datum to MAC leading edge
        unit: m
      - id: mac
        label: MAC length
        unit: m
    answer:
      formula: round((round(cg * 100) - round(le * 100)) / mac * 10) / 10
      unit: "% MAC"
      decimals: 1
    distractors:
      - id: d1
        formula: (cg - le) / cg * 100
      - id: d2
        formula: (le + mac - cg) / mac * 100
      - id: d3
        formula: cg / (le + mac) * 100
      - id: d4
        formula: (cg - le) / (mac - le) * 100
    presets:
      - id: p1
        values:
          cg: 12.53
          le: 9.63
          mac: 8
      - id: p2
        values:
          cg: 13.2
          le: 10.1
          mac: 7.5
    explanation: >-
      The CG in % MAC is the distance of the CG behind the MAC leading edge
      divided by the MAC length.


      **Solution**


      {{f: (cg - le) / mac * 100}} = {{n: (cg - le) / mac * 100}} = **{{answer}}
      % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: divides by the CG distance instead of the MAC length.

      - **{{d2}} % MAC**: measures from the trailing edge of the MAC.

      - **{{d3}} % MAC**: divides the CG by the trailing edge position.

      - **{{d4}} % MAC**: divides by the MAC length minus the leading edge
      position.
