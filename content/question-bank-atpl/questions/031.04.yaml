- id: QIUTGPVB
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314045
    - ATPLGS-625794
    - BGS-310660
    - AVEXAM-33116
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: >-
      An aeroplane has a basic empty mass of {{bem}} kg located at station
      {{bems}}.


      The pilot's mass is {{pm}} kg, located at station {{ps}}.


      The fuel mass is {{fm}} kg, located at station {{fs}}.


      The length of the MAC is {{mac}} inches and 0 % MAC is at station {{le}}.


      What is the centre of gravity location of the loaded aeroplane in % MAC?
    variables:
      - id: bem
        label: Basic empty mass
        unit: kg
      - id: bems
        label: BEM station
        unit: in
      - id: pm
        label: Pilot mass
        unit: kg
      - id: ps
        label: Pilot station
        unit: in
      - id: fm
        label: Fuel mass
        unit: kg
      - id: fs
        label: Fuel station
        unit: in
      - id: mac
        label: MAC length
        unit: in
      - id: le
        label: Station of 0 % MAC
        unit: in
    answer:
      formula: ((bem * bems + pm * ps + fm * fs) / (bem + pm + fm) - le) / mac * 100
      unit: "% MAC"
      decimals: 1
    distractors:
      - id: d1
        formula: (bem * bems + pm * ps + fm * fs) / (bem + pm + fm)
      - id: d2
        formula: ((bem * bems + pm * ps) / (bem + pm) - le) / mac * 100
      - id: d3
        formula: ((bem * bems + pm * ps + fm * fs) / (bem + pm + fm) - bems) / mac * 100
      - id: d4
        formula: ((bem * bems + pm * ps + fm * fs) / (bem + pm + fm) - le) / (bem * bems
          + pm * ps + fm * fs) * 1000
    presets:
      - id: p1
        values:
          bem: 1000
          bems: 92
          pm: 80
          ps: 100
          fm: 120
          fs: 130
          mac: 60
          le: 80
      - id: p2
        values:
          bem: 1200
          bems: 90
          pm: 85
          ps: 102
          fm: 150
          fs: 128
          mac: 62
          le: 78
      - id: p3
        values:
          bem: 980
          bems: 95
          pm: 75
          ps: 98
          fm: 100
          fs: 132
          mac: 58
          le: 82
    explanation: >-
      The loaded CG station is the sum of all moments divided by the total mass.
      Its position in % MAC is the distance behind 0 % MAC divided by the MAC
      length.


      **Solution**


      Total mass = {{= bem + pm + fm}} kg; total moment = {{= bem * bems + pm *
      ps + fm * fs}}


      CG station = {{= (bem * bems + pm * ps + fm * fs) / (bem + pm + fm)}}


      %MAC = **{{answer}} % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: the CG station itself, not converted to % MAC.

      - **{{d2}} % MAC**: leaves out the fuel.

      - **{{d3}} % MAC**: measures from the BEM station instead of from 0 % MAC.

      - **{{d4}} % MAC**: divides by the total moment instead of the MAC length.
