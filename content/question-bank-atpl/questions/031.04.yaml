- id: Q4YXB7SAX
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314329
    - ATPLGS-127323
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      An aircraft with one nose landing gear and two main landing gears is
      weighed on jacks. Determine the CG position of the aircraft, in inches
      from the datum, using the following readouts:


      - Nose landing gear, located at {{na}} inches from datum, reading: {{nw}}
      kg

      - Each main landing gear, located at {{ma}} inches from datum, reading:
      {{mw}} kg
    variables:
      - id: na
        label: Nose gear arm
        unit: in
      - id: nw
        label: Nose gear reading
        unit: kg
      - id: ma
        label: Main gear arm
        unit: in
      - id: mw
        label: Reading of each main gear
        unit: kg
    answer:
      formula: (nw * na + 2 * mw * ma) / (nw + 2 * mw)
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: (nw * na + mw * ma) / (nw + mw)
      - id: d2
        formula: na + ma
      - id: d3
        formula: (na + ma) / 2
      - id: d4
        formula: (nw * na + 2 * mw * ma) / (2 * mw)
    presets:
      - id: p1
        values:
          na: 161
          nw: 6448
          ma: 795
          mw: 13738
      - id: p2
        values:
          na: 150
          nw: 5900
          ma: 780
          mw: 12500
    explanation: >-
      The mass is the sum of all gear readings and the CG is the total moment
      about the datum divided by the total mass.


      **Solution**


      Mass = {{nw}} + 2 * {{mw}} = {{= nw + 2 * mw}} kg


      {{f: (nw * na + 2 * mw * ma) / (nw + 2 * mw)}} = {{n: (nw * na + 2 * mw *
      ma) / (nw + 2 * mw)}} = **{{answer}} in**


      **Why the other answers are wrong**


      - **{{d1}} in**: counts only one main gear.

      - **{{d2}} in**: adds the two arms instead of weighting them by the loads.

      - **{{d3}} in**: takes the plain average of the two arms.

      - **{{d4}} in**: divides the total moment by the main gear loads only.
- id: Q7U8KYYE0
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312624
    - AVEXAM-9353
    - BGS-310539
    - AVEXAM-61059
    - ATPLQ-316536
    - BGS-310725
    - ATPLGS-126620
    - AVEXAM-5485
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: The CG position of an aeroplane is {{cg}} m aft of the datum. The MAC
      leading edge (LEMAC) is {{le}} m aft of the datum and the MAC length is
      {{mac}} m. What is the CG position in % MAC?
    variables:
      - id: cg
        label: CG position
        unit: m
      - id: le
        label: LEMAC
        unit: m
      - id: mac
        label: MAC length
        unit: m
    answer:
      formula: (cg - le) / mac * 100
      unit: "% MAC"
      decimals: 2
    distractors:
      - id: d1
        formula: cg / mac * 100 - le
      - id: d2
        formula: (cg - le) / cg * 100
      - id: d3
        formula: (le + mac - cg) / mac * 100
      - id: d4
        formula: (cg - le) / mac * 10
      - id: d5
        formula: cg / mac
    presets:
      - id: p1
        values:
          cg: 16.13
          le: 14.72
          mac: 3.08
      - id: p2
        values:
          cg: 12.4
          le: 12.12
          mac: 1.34
    explanation: >-
      The CG in % MAC is the distance of the CG behind the MAC leading edge
      divided by the MAC length. Other wing dimensions (root or tip chords) do
      not matter.


      **Solution**


      {{f: (cg - le) / mac * 100}} = {{n: (cg - le) / mac * 100}} = **{{answer}}
      % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: subtracts the leading edge after scaling, so the two
      terms are inconsistent.

      - **{{d2}} % MAC**: divides by the CG position instead of the MAC length.

      - **{{d3}} % MAC**: measures from the trailing edge instead of the leading
      edge.

      - **{{d4}} % MAC**: wrong power of ten in the percentage.

      - **{{d5}} % MAC**: forgets to subtract the leading edge and to convert to
      a percentage.
