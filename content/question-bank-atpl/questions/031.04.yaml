- id: QFB4K2V9C
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317832
    - ATPLGS-127323
    - ATPLQ-311188
    - ATPLGS-127364
    - BGS-310713
    - AVEXAM-70722
  annexes: []
  learningObjectives:
    - 031.04.02.02.01
  template:
    type: calculation
    question: >-
      An aeroplane with one nose landing gear and two main landing gears is
      weighed on jacks. Determine the CG position (in inches aft of the datum)
      using the following readouts:


      - Nose landing gear, located at {{nose_arm}} in from the datum, reading:
      {{nose_mass}} kg

      - Each main landing gear, located at {{main_arm}} in from the datum,
      reading: {{main_mass}} kg
    variables:
      - id: nose_mass
        label: Nose gear reading
        unit: kg
      - id: nose_arm
        label: Nose gear arm
        unit: in
      - id: main_mass
        label: Reading of each main gear
        unit: kg
      - id: main_arm
        label: Main gear arm
        unit: in
    answer:
      formula: (nose_mass * nose_arm + 2 * main_mass * main_arm) / (nose_mass + 2 *
        main_mass)
      unit: in
      decimals: 1
    distractors:
      - id: d1
        formula: (nose_mass * nose_arm + main_mass * main_arm) / (nose_mass + main_mass)
      - id: d2
        formula: (nose_arm + main_arm) / 2
      - id: d3
        formula: (nose_mass * nose_arm + 2 * main_mass * main_arm) / (nose_mass +
          main_mass)
      - id: d4
        formula: (nose_mass * nose_arm + 2 * main_mass * main_arm) / (2 * main_mass)
    presets:
      - id: p1
        values:
          nose_mass: 2300
          nose_arm: 161
          main_mass: 19300
          main_arm: 775
      - id: p2
        values:
          nose_mass: 6488
          nose_arm: 161
          main_mass: 17783
          main_arm: 775
    explanation: >-
      The basic empty mass is the sum of all jack readings, and the CG is the
      total moment divided by this mass. The aircraft has two main gears, each
      carrying the stated reading.


      **Solution**


      BEM = {{= nose_mass + 2 * main_mass}} kg


      {{f: (nose_mass * nose_arm + 2 * main_mass * main_arm) / (nose_mass + 2 *
      main_mass)}} = {{n: (nose_mass * nose_arm + 2 * main_mass * main_arm) /
      (nose_mass + 2 * main_mass)}} = **{{answer}} in** aft of the datum


      **Why the other answers are wrong**


      - **{{d1}} in**: only one main gear is counted.

      - **{{d2}} in**: the arms are averaged without weighting by the gear
      loads.

      - **{{d3}} in**: the total moment is divided by the mass with only one
      main gear.

      - **{{d4}} in**: the nose gear mass is left out of the total mass.
- id: QFHXG3K8D
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312503
    - ATPLGS-126611
    - BGS-310652
    - BGS-310246
    - ATPLGS-129402
    - ATPLGS-127341
    - AVEXAM-54402
    - AVEXAM-26383
  annexes: []
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: calculation
    question: >-
      An aeroplane has a mean aerodynamic chord (MAC) of {{mac}} inches.


      The leading edge of this chord is {{le}} inches aft of the datum.


      Give the location of the centre of gravity of the aeroplane in % MAC if
      the mass of the aeroplane acts through a balance arm located {{cg}} inches
      aft of the datum.
    variables:
      - id: mac
        label: MAC length
        unit: in
      - id: le
        label: MAC leading edge
        unit: in
      - id: cg
        label: CG balance arm
        unit: in
    answer:
      formula: (cg - le) / mac * 100
      unit: "% MAC"
      decimals: 1
    distractors:
      - id: d1
        formula: cg / mac * 100 - le / mac * 10
      - id: d2
        formula: (cg - le) / cg * 100
      - id: d3
        formula: (le + mac - cg) / mac * 100
      - id: d4
        formula: cg / mac * 10
    presets:
      - id: p1
        values:
          mac: 134.5
          le: 526.6
          cg: 560
      - id: p2
        values:
          mac: 140.2
          le: 530
          cg: 570
    explanation: >-
      The CG in % MAC is the distance of the CG behind the MAC leading edge
      divided by the MAC length.


      **Solution**


      {{f: (cg - le) / mac * 100}} = {{n: (cg - le) / mac * 100}} = **{{answer}}
      % MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: a calculation slip: the CG and leading edge ratios are
      scaled inconsistently.

      - **{{d2}} % MAC**: divides by the CG position instead of the MAC length.

      - **{{d3}} % MAC**: measures from the trailing edge instead of the leading
      edge.

      - **{{d4}} % MAC**: divides the CG by the MAC length and scales by 10.
