- id: QHGIGJDN
  docId: "031.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319892
    - AVEXAM-2769
    - BGS-310239
    - ATPLGS-107168
  annexes:
    - 031-aeroplane-reference-datum-mac-and-cg-variables
  learningObjectives:
    - 031.04.01.03.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      A jet aeroplane has a take-off weight of {{w}} N and a centre of gravity
      located {{cg}} m from the zero reference point.


      At the last moment {{aw}} N of freight is added in the forward compartment
      at {{aa}} m from the zero reference point.


      The MAC leading edge (point A) is at X = {{x}} m and the MAC length is Y =
      {{y}} m (both read from the figure).


      What is the final CG location in % MAC, measured from point A?
    variables:
      - id: w
        label: Take-off weight
        unit: N
      - id: cg
        label: Initial CG
        unit: m
      - id: aw
        label: Added freight weight
        unit: N
      - id: aa
        label: Freight arm
        unit: m
      - id: x
        label: "X: MAC leading edge"
        unit: m
      - id: y
        label: "Y: MAC length"
        unit: m
    chartInputs:
      - x
      - y
    answer:
      formula: ((w * cg + aw * aa) / (w + aw) - x) / y * 100
      unit: "% MAC"
      decimals: 1
    distractors:
      - id: d1
        formula: (cg - x) / y * 100
      - id: d2
        formula: ((w * cg - aw * aa) / (w - aw) - x) / y * 100
      - id: d3
        formula: ((w * cg + aw * aa) / w - x) / y * 100
      - id: d4
        formula: ((w * cg + aw * aa) / (w + aw) - x) / ((w * cg + aw * aa) / (w + aw)) *
          100
    presets:
      - id: p1
        values:
          w: 460000
          cg: 15.4
          aw: 12000
          aa: 10
          x: 14
          y: 4.6
    explanation: >-
      Adding freight shifts the CG: the new CG is the total moment divided by
      the new total weight. It is then expressed as a percentage of the MAC from
      the leading edge, using the geometry read from the figure.


      **Solution**


      New CG = {{= (w * cg + aw * aa) / (w + aw)}} m


      {{f: ((w * cg + aw * aa) / (w + aw) - x) / y * 100}} = **{{answer}} %
      MAC**


      **Why the other answers are wrong**


      - **{{d1}} % MAC**: the CG before the freight was added.

      - **{{d2}} % MAC**: subtracts the freight instead of adding it.

      - **{{d3}} % MAC**: divides the moment by the original weight instead of
      the new weight.

      - **{{d4}} % MAC**: divides by the CG position instead of the MAC length.
