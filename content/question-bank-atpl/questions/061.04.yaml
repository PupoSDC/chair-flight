- id: QVOXNGYG
  docId: 061.04.02.04
  relatedQuestions: []
  externalIds:
    - ATPLQ-611566
    - AVEXAM-96071
  annexes: []
  learningObjectives:
    - 061.04.02.04.07
  template:
    type: calculation
    question: >-
      Given the following information for a Conic projection chart in the
      northern hemisphere, calculate the change of longitude.


      - Great circle track from P to Q, at P: {{trk_pq}}°T

      - Great circle track from Q to P, at Q: {{trk_qp}}°T

      - Constant of the cone: {{cone}}


      What is the change of longitude, in degrees?
    variables:
      - id: trk_pq
        label: Track from P to Q
        unit: °T
      - id: trk_qp
        label: Track from Q to P
        unit: °T
      - id: cone
        label: Constant of the cone
        unit: ""
    answer:
      formula: (trk_qp - 180 - trk_pq) / cone
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (trk_qp - trk_pq) / cone
      - id: d2
        formula: trk_qp - 180 - trk_pq
      - id: d3
        formula: (trk_qp - 180 - trk_pq) * cone
      - id: d4
        formula: (trk_qp + 180 - trk_pq) / cone
    presets:
      - id: p1
        values:
          trk_pq: 112
          trk_qp: 316
          cone: 0.8
      - id: p2
        values:
          trk_pq: 80
          trk_qp: 300
          cone: 0.6
      - id: p3
        values:
          trk_pq: 60
          trk_qp: 250
          cone: 0.5
    explanation: >-
      On a conic chart the change of longitude follows from the two great circle
      tracks: the track from Q to P is turned into its reciprocal by subtracting
      180°, the track from P to Q is subtracted from it, and the result is
      divided by the constant of the cone.


      **Solution**


      Reciprocal of the track from Q to P = {{trk_qp}} − 180 = {{= trk_qp -
      180}}°


      Difference to the track from P to Q = {{= trk_qp - 180}} − {{trk_pq}} =
      {{= trk_qp - 180 - trk_pq}}°


      Change of longitude = {{= trk_qp - 180 - trk_pq}} ÷ {{cone}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets the 180° reciprocal correction.

      - **{{d2}}°**: forgets to divide by the constant of the cone.

      - **{{d3}}°**: multiplies by the constant of the cone instead of dividing.

      - **{{d4}}°**: adds 180° instead of subtracting it.
