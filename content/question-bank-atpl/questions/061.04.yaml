- id: QCQHA7XLF
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619765
    - ATPLGS-124472
    - ATPLQ-618793
    - ATPLGS-124469
  annexes: []
  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      What is the approximate scale of a chart with the following quoted scale?
      Express the answer as a ratio 1 : n and give n, rounded to the nearest
      thousand.


      - Quoted scale: 1 inch = {{nm}} NM


      What is n?
    variables:
      - id: nm
        label: Quoted scale (NM per inch)
        unit: NM
    answer:
      formula: round(nm * 1852 * 100 / 2.54 / 1000) * 1000
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: round(nm * 1852 * 100 / 1000) * 1000
      - id: d2
        formula: round(nm * 1852 / 2.54 / 1000) * 1000
      - id: d3
        formula: round(nm * 1852 * 100 / 2.54 / 1000)
      - id: d4
        formula: round(nm * 1852 * 100 * 2.54 / 1000) * 1000
    presets:
      - id: p1
        values:
          nm: 15
      - id: p2
        values:
          nm: 120
      - id: p3
        values:
          nm: 30
    explanation: >-
      A chart scale is the ratio between a distance on the chart and the same
      distance on the ground. The quoted scale says that one inch on the chart
      represents {{nm}} NM on the ground. Both distances are converted to the
      same unit (centimetres), and the answer is rounded to the nearest thousand
      because the scale is approximate.


      **Solution**


      - {{nm}} NM = {{= nm * 1852}} m = {{= nm * 1852 * 100}} cm

      - 1 inch = 2.54 cm, so the ratio is 2.54 : {{= nm * 1852 * 100}} cm, which
      is 1 : {{= nm * 1852 * 100 / 2.54}}

      - Rounded to the nearest thousand: {{f: round(nm * 1852 * 100 / 2.54 /
      1000) * 1000}} = {{n: round(nm * 1852 * 100 / 2.54 / 1000) * 1000}} = **1
      : {{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: the inch was treated as one centimetre, so the ratio is
      2.54 times too large.

      - **1 : {{d2}}**: metres were used where centimetres are needed, so the
      ratio is 100 times too small.

      - **1 : {{d3}}**: the thousands were not restored after rounding, so the
      ratio is 1000 times too small.

      - **1 : {{d4}}**: 2.54 was multiplied instead of divided, which inverts
      the conversion.
