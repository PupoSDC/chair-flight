- id: QEEUDGJJ
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613905
  annexes: []
  learningObjectives:
    - 061.04.02.04.04
  template:
    type: calculation
    question: >-
      Calculate the average true track of the final leg of a VFR flight, given
      the start point and the destination aerodrome:


      - Start point: {{lat1}}° N, {{lon1}}° E

      - Destination: {{lat2}}° N, {{lon2}}° E


      What is the average true track?
    variables:
      - id: lat1
        label: Start latitude
        unit: °
      - id: lon1
        label: Start longitude
        unit: °
      - id: lat2
        label: Destination latitude
        unit: °
      - id: lon2
        label: Destination longitude
        unit: °
    answer:
      formula: (atan2((lon2 - lon1) * cos((lat1 + lat2) / 2), lat2 - lat1) + 360) -
        360 * floor((atan2((lon2 - lon1) * cos((lat1 + lat2) / 2), lat2 - lat1)
        + 360) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: atan2(lon2 - lon1, lat2 - lat1) + 360
      - id: d2
        formula: atan2(lat2 - lat1, lon2 - lon1) + 360
      - id: d3
        formula: atan2((lon1 - lon2) * cos((lat1 + lat2) / 2), lat2 - lat1) + 360
      - id: d4
        formula: atan2((lon2 - lon1) * cos((lat1 + lat2) / 2), lat2 - lat1) + 180
    presets:
      - id: p1
        values:
          lat1: 48.384722
          lon1: 14.255
          lat2: 48.901389
          lon2: 12.5175
      - id: p2
        values:
          lat1: 47.8
          lon1: 13
          lat2: 49.5
          lon2: 11.2
      - id: p3
        values:
          lat1: 50.1
          lon1: 8.6
          lat2: 48.2
          lon2: 10.4
    explanation: >-
      The track is the direction of the line from the start point to the
      destination, measured clockwise from true north. The east-west difference
      is scaled by the cosine of the mean latitude to allow for the meridians
      converging towards the pole. The result is then given as a bearing between
      0° and 360°.


      **Solution**


      Mean latitude = ({{lat1}} + {{lat2}}) / 2 = {{= (lat1 + lat2) / 2}}°


      Corrected longitude difference = {{= (lon2 - lon1) * cos((lat1 + lat2) /
      2)}}°


      Latitude difference = {{= lat2 - lat1}}°


      Track = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: ignores the scaling of the longitude difference by the
      cosine of the latitude.

      - **{{d2}}°T**: swaps the latitude and longitude differences, so the angle
      is measured from east instead of north.

      - **{{d3}}°T**: uses the reciprocal sign for the longitude difference, so
      the track is mirrored.

      - **{{d4}}°T**: gives the reciprocal track (the direction back from the
      destination).
