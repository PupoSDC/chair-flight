          ratio: 2500000
          cm: 3
    explanation: >-
      The chart distance in centimetres is multiplied by the scale denominator
      to give the earth distance in centimetres. Dividing by 100 000 gives
      kilometres, and dividing by 1.852 gives nautical miles.


      **Solution**


      Earth distance in km: {{f: cm * ratio / 100000}} = {{n: cm * ratio /
      100000}} km


      Earth distance: {{f: cm * ratio / 100000 / 1.852}} = {{n: cm * ratio /
      100000 / 1.852}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: gives the distance in km but labels it as NM.

      - **{{d2}} NM**: multiplies by 1.852 instead of dividing.

      - **{{d3}} NM**: moves the decimal point by one place too many.

      - **{{d4}} NM**: uses the statute mile instead of the nautical mile.
