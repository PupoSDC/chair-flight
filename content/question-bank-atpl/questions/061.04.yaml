- id: Q7KL7YJP7
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612926
    - BGS-610195
    - ATPLQ-614291
    - ATPLGS-124354
  annexes: []
  learningObjectives:
    - 061.04.02.03.02
  template:
    type: calculation
    question: >-
      On a Mercator chart, the distance measured along a parallel is:


      - {{lon_min}} minutes of longitude: {{chart_cm}} cm on the chart


      What is the approximate scale of the chart at a latitude of {{lat}}°? Give
      the denominator N of 1 : N.
    variables:
      - id: lon_min
        label: Longitude difference
        unit: "'"
      - id: chart_cm
        label: Distance on the chart
        unit: cm
      - id: lat
        label: Latitude
        unit: °
    answer:
      formula: lon_min * cos(lat) * 185200 / chart_cm
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: lon_min * 185200 / chart_cm
      - id: d2
        formula: lon_min * sin(lat) * 185200 / chart_cm
      - id: d3
        formula: lon_min * cos(lat) * 185200 * chart_cm
      - id: d4
        formula: lon_min * cos(lat) * 1852 / chart_cm
    presets:
      - id: p1
        values:
          lon_min: 300
          chart_cm: 5
          lat: 57
      - id: p2
        values:
          lon_min: 1
          chart_cm: 0.31
          lat: 40
      - id: p3
        values:
          lon_min: 120
          chart_cm: 4
          lat: 25
    explanation: >-
      On a Mercator chart the scale is the chart distance divided by the true
      distance on the Earth. One minute of longitude is 1 NM at the Equator, but
      at a higher latitude the same minute covers only 1 NM multiplied by the
      cosine of the latitude, so the scale is larger there.


      **Solution**


      - True distance at {{lat}}°: {{lon_min}} NM × cos {{lat}}° = {{= lon_min *
      cos(lat)}} NM = {{= lon_min * cos(lat) * 185200}} cm

      - Scale: {{f: lon_min * cos(lat) * 185200 / chart_cm}} = {{n: lon_min *
      cos(lat) * 185200 / chart_cm}} = 1 : **{{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: the distance was not shortened for latitude, so this is
      the Equator scale.

      - **1 : {{d2}}**: the sine of the latitude was used instead of the cosine.

      - **1 : {{d3}}**: the chart distance was multiplied instead of divided.

      - **1 : {{d4}}**: a factor of 100 slipped in (metres used where
      centimetres are needed).
