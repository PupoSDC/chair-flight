- id: QHQRUXGO
  docId: 061.04.02.04
  relatedQuestions:
    - QCKWCWTH
  externalIds:
    - ATPLQ-619598
    - BGS-611268
    - AVEXAM-5001
  annexes: []
  learningObjectives:
    - 061.04.02.04.07
  template:
    type: calculation
    question: >-
      A pilot uses a Lambert conformal conic navigation chart with a constant of
      the cone of {{cone}}. A straight line is drawn from the current position
      to the destination.


      - Current position: latitude {{lat}}° N, longitude {{lon_a}}° (east
      positive, west negative)

      - True track at the current position: {{track_a}}°

      - True track at the destination: {{track_b}}°


      What is the longitude of the destination? Give the answer in degrees west
      (east is negative).
    variables:
      - id: cone
        label: Constant of the cone
        unit: ""
      - id: lat
        label: Latitude of current position
        unit: °
      - id: lon_a
        label: Longitude of current position
        unit: °
      - id: track_a
        label: True track at current position
        unit: °
      - id: track_b
        label: True track at destination
        unit: °
    answer:
      formula: 0 - ((lon_a + (track_b - track_a) / cone) - 360 * floor((lon_a +
        (track_b - track_a) / cone + 180) / 360))
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: lon_a + (track_b - track_a) / cone
      - id: d2
        formula: (track_b - track_a) / cone
      - id: d3
        formula: 0 - (lon_a - (track_b - track_a) / cone)
      - id: d4
        formula: 0 - (lon_a + (track_b - track_a) * cone)
    presets:
      - id: p1
        values:
          cone: 0.83
          lat: 50
          lon_a: 175
          track_a: 73
          track_b: 78
      - id: p2
        values:
          cone: 0.6
          lat: 45
          lon_a: -150
          track_a: 210
          track_b: 200
      - id: p3
        values:
          cone: 0.5
          lat: 30
          lon_a: -20
          track_a: 280
          track_b: 250
    explanation: >-
      On a Lambert chart the track changes along a straight line by the
      convergence between the two meridians, which is the constant of the cone
      times the longitude difference. The new longitude is the longitude of the
      current position plus the change in track divided by the constant of the
      cone. The result is then brought into the range from 180° east to 180°
      west, and given here as a west longitude.


      **Solution**


      - Change in track: {{track_b}}° − {{track_a}}° = {{= track_b - track_a}}°

      - Longitude change = change in track ÷ constant of the cone = {{= (track_b
      - track_a) / cone}}°

      - Longitude before converting: {{lon_a}}° + {{= (track_b - track_a) /
      cone}}° = {{= lon_a + (track_b - track_a) / cone}}°

      - Brought into the range 180° east to 180° west, expressed as west:
      **{{answer}}° W**


      **Why the other answers are wrong**


      - **{{d1}}°**: keeps the unconverted longitude and ignores the west sign

      - **{{d2}}°**: forgets the starting longitude of the current position

      - **{{d3}}°**: applies the change with the wrong sign

      - **{{d4}}°**: multiplies by the constant of the cone instead of dividing
