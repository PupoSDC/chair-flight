- id: QQNEQEJLB
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614084
    - AVEXAM-93831
    - BGS-610212
  annexes: []
  learningObjectives:
    - 061.04.02.03.03
  template:
    type: calculation
    question: >-
      On a direct Mercator projection, a certain length represents a distance on
      the earth that depends on the latitude.


      - At {{lat1}}°N, the length represents {{len}} NM


      What does the same length represent at {{lat2}}°N, approximately (in NM)?
    variables:
      - id: len
        label: Length at the first latitude
        unit: NM
      - id: lat1
        label: First latitude
        unit: °N
      - id: lat2
        label: Second latitude
        unit: °N
    answer:
      formula: len * cos(lat2) / cos(lat1)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: len * cos(lat1) / cos(lat2)
      - id: d2
        formula: len
      - id: d3
        formula: len * cos(lat1) * cos(lat2)
      - id: d4
        formula: len * sin(lat2) / sin(lat1)
    presets:
      - id: p1
        values:
          len: 70
          lat1: 45
          lat2: 30
      - id: p2
        values:
          len: 100
          lat1: 60
          lat2: 40
      - id: p3
        values:
          len: 50
          lat1: 20
          lat2: 50
    explanation: >-
      On a Mercator chart the scale grows with the secant of the latitude, so
      the same chart length covers a ground distance proportional to the cosine
      of the latitude. The ratio of the cosines converts the length from one
      latitude to another.


      **Solution**


      Earth distance per unit chart length is proportional to the cosine of the
      latitude, so the length at the second latitude is {{f: len * cos(lat2) /
      cos(lat1)}} = {{n: len * cos(lat2) / cos(lat1)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: inverts the cosine ratio.

      - **{{d2}} NM**: keeps the length unchanged across latitudes.

      - **{{d3}} NM**: multiplies the cosines instead of dividing.

      - **{{d4}} NM**: uses sines instead of cosines.
