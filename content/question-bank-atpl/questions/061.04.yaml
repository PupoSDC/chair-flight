  template:
    type: calculation
    question: >-
      On a Lambert chart the constant of the cone is {{cone}}. Positions A and B
      are plotted on this chart with the following data:


      - Difference in longitude between A and B: {{dlon}}°


      What is the convergence between the north directions of the meridians of A
      and B on the chart?
    variables:
      - id: cone
        label: Constant of the cone
        unit: ""
      - id: dlon
        label: Difference in longitude
        unit: °
    answer:
      formula: cone * dlon
      unit: °
      decimals: 4
    distractors:
      - id: d1
        formula: dlon
      - id: d2
        formula: cone / dlon
      - id: d3
        formula: dlon / cone
      - id: d4
        formula: cone * dlon * 60
    presets:
      - id: p1
        values:
          cone: 0.86665
          dlon: 5
      - id: p2
        values:
          cone: 0.7
          dlon: 12
    explanation: >-
      On a Lambert chart the meridians converge towards the pole. The
      convergence between two meridians is the constant of the cone multiplied
      by their difference in longitude.


      **Solution**


      {{f: cone * dlon}}


      {{n: cone * dlon}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets to multiply by the constant of the cone

      - **{{d2}}°**: divides by the longitude difference instead of multiplying

      - **{{d3}}°**: inverted ratio, divides the longitude difference by the
      constant of the cone

      - **{{d4}}°**: multiplies by 60, as if the longitude difference were in
      minutes of arc
