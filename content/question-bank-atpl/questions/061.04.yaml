- id: Q6FEEXMLD
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612687
    - ATPLGS-628143
    - BGS-611422
    - BGS-611440
  annexes: []
  learningObjectives:
    - 061.04.02.04.05
  template:
    type: calculation
    question: >-
      Two locations A and B have the same latitude and lie on a meridian and its
      anti-meridian, so they are 180° apart in longitude. On a Lambert conical
      projection map, the angle between these two meridians is {{angle}}°.


      What is the latitude of the parallel of origin of this map?
    variables:
      - id: angle
        label: Angle between the two meridians on the chart
        unit: °
    answer:
      formula: asin(angle / 180)
      unit: °N or S
      decimals: 0
    distractors:
      - id: d1
        formula: acos(angle / 180)
      - id: d2
        formula: atan(angle / 180)
      - id: d3
        formula: asin(angle / 360)
      - id: d4
        formula: 90 - atan(angle / 180)
    presets:
      - id: p1
        values:
          angle: 104
      - id: p2
        values:
          angle: 60
      - id: p3
        values:
          angle: 120
    explanation: >-
      On a Lambert conical projection the meridians converge towards the pole of
      the cone. The angle between two meridians on the map is the difference in
      longitude multiplied by the cone constant, and the cone constant is the
      sine of the parallel of origin. Here the difference in longitude is 180°.


      **Solution**


      - {{f: asin(angle / 180)}} = {{n: asin(angle / 180)}} = **{{answer}}°N or
      S**


      **Why the other answers are wrong**


      - **{{d1}}°N or S**: uses the cosine instead of the sine.

      - **{{d2}}°N or S**: uses the tangent instead of the sine.

      - **{{d3}}°N or S**: uses 360° as the difference in longitude instead of
      180°.

      - **{{d4}}°N or S**: takes the complement of the tangent value instead of
      the sine.
- id: Q6JTMKA9M
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611672
  annexes:
    - jeppesen-enr-scotland-england
  learningObjectives:
    - 061.01.03.01.04
    - 061.04.03.02.03
  template:
    type: calculation
    question: >-
      An aircraft is over the RNAV point SHAPP and observes the CARLISLE NDB on
      a relative bearing of {{rel}}°. Positions are given in decimal degrees
      (north and east positive, south and west negative):


      - Aircraft position: latitude {{lat1}}, longitude {{lon1}}

      - NDB position: latitude {{lat2}}, longitude {{lon2}}

      - Magnetic variation at the NDB: {{var}}° (positive = East, negative =
      West)


      What is the magnetic heading of the aircraft?
    variables:
      - id: lat1
        label: Aircraft latitude
        unit: °
      - id: lon1
        label: Aircraft longitude
        unit: °
      - id: lat2
        label: NDB latitude
        unit: °
      - id: lon2
        label: NDB longitude
        unit: °
      - id: rel
        label: Relative bearing of the NDB
        unit: °
      - id: var
        label: Variation
        unit: °
    answer:
      formula: (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1)
        * cos(lat2) * cos(lon2 - lon1)) - rel - var) - 360 *
        floor((atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) -
        sin(lat1) * cos(lat2) * cos(lon2 - lon1)) - rel - var) / 360)
      unit: °M
      decimals: 0
    distractors:
      - id: d1
        formula: (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1)
          * cos(lat2) * cos(lon2 - lon1)) - rel + var) - 360 *
          floor((atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) -
          sin(lat1) * cos(lat2) * cos(lon2 - lon1)) - rel + var) / 360)
      - id: d2
        formula: (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1)
          * cos(lat2) * cos(lon2 - lon1)) - rel) - 360 * floor((atan2(sin(lon2 -
          lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) * cos(lat2) *
          cos(lon2 - lon1)) - rel) / 360)
      - id: d3
        formula: (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1)
          * cos(lat2) * cos(lon2 - lon1)) + rel - var) - 360 *
          floor((atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) -
          sin(lat1) * cos(lat2) * cos(lon2 - lon1)) + rel - var) / 360)
    presets:
      - id: p1
        values:
          lat1: 54.5
          lon1: -2.627222
          lat2: 54.940278
          lon2: -2.805556
          rel: 282
          var: -2
      - id: p2
        values:
          lat1: 50
          lon1: -4
          lat2: 50.5
          lon2: -3.5
          rel: 120
          var: -3
      - id: p3
        values:
          lat1: 52
          lon1: -1
          lat2: 52.3
          lon2: -1.6
          rel: 300
          var: 4
    explanation: >-
      The bearing of the NDB from the aircraft follows from the two positions.
      The relative bearing is measured from the nose, so the true heading is
      that bearing minus the relative bearing. The magnetic heading is then
      found by applying the variation.


      **Solution**


      - True heading: bearing of the NDB minus {{rel}}°

      - Magnetic heading: true heading minus the variation ({{var}}°), kept
      between 0° and 360°, gives **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}°**: the variation is applied with the wrong sign.

      - **{{d2}}°**: the variation is left out.

      - **{{d3}}°**: the relative bearing is added instead of subtracted.
