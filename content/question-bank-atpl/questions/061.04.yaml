- id: QYFQEPHVI
  docId: "061.04"
  relatedQuestions:
    - QT5WSZCTI
  externalIds:
    - ATPLQ-613379
    - AVEXAM-48817
    - BGS-611700
  annexes: []
  learningObjectives:
    - 061.04.02.03.03
  template:
    type: calculation
    question: >-
      On a Mercator chart at the latitude of {{lat1}}°N, a distance of {{chart}}
      cm on the chart equals {{nm}} NM on the ground.


      What is the same distance on the ground, in km, at a latitude of
      {{lat2}}°N?


      Give the answer in km.
    variables:
      - id: chart
        label: Distance on the chart
        unit: cm
      - id: nm
        label: Ground distance at the first latitude
        unit: NM
      - id: lat1
        label: First latitude
        unit: °N
      - id: lat2
        label: Second latitude
        unit: °N
    answer:
      formula: chart * (nm * 185200 / chart) * cos(lat2) / cos(lat1) / 100000
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: nm * 1.852 * cos(lat1) / cos(lat2)
      - id: d2
        formula: nm * 1.852
      - id: d3
        formula: nm * 1.852 * sin(lat2) / sin(lat1)
      - id: d4
        formula: nm * 1.852 * cos(lat2) * cos(lat1)
    presets:
      - id: p1
        values:
          chart: 8.3
          nm: 40
          lat1: 30
          lat2: 45
      - id: p2
        values:
          chart: 10
          nm: 100
          lat1: 20
          lat2: 60
      - id: p3
        values:
          chart: 5
          nm: 25
          lat1: 40
          lat2: 10
    explanation: >-
      On a Mercator chart the same chart distance covers less ground the further
      it is from the Equator. The ground distance changes with the cosine of the
      latitude, so the new ground distance is the old one multiplied by cos of
      the new latitude, divided by cos of the old latitude. Nautical miles are
      converted to kilometres at 1.852 km per NM.


      **Solution**


      Ground distance at {{lat2}}°N: {{f: nm * 1.852 * cos(lat2) / cos(lat1)}} =
      {{n: nm * 1.852 * cos(lat2) / cos(lat1)}} = **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: inverts the latitude ratio.

      - **{{d2}} km**: converts the ground distance but makes no change for
      latitude.

      - **{{d3}} km**: uses the sine instead of the cosine.

      - **{{d4}} km**: multiplies by both cosines instead of dividing.
