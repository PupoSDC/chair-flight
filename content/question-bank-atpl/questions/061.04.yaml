    variables:
      - id: ratio
        label: Scale denominator
        unit: ""
      - id: cm
        label: Chart distance
        unit: cm
    answer:
      formula: cm * ratio / 100000 / 1.852
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: cm * ratio / 100000
      - id: d2
        formula: cm * ratio / 100000 * 1.852
      - id: d3
        formula: cm * ratio / 1000000
      - id: d4
        formula: cm * ratio / 100000 / 1.609
    presets:
