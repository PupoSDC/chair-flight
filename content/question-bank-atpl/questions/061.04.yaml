- id: QJCCLBQW
  docId: 061.04.02.03
  relatedQuestions:
    - QYLPRCDL
  externalIds:
    - ATPLQ-613656
  annexes: []
  learningObjectives:
    - 061.04.02.03.02
  template:
    type: calculation
    question: >-
      What is the approximate scale at {{lat2}}°N on a direct Mercator chart if
      the scale at {{lat1}}°N is 1 : {{scale1}}?


      Give the denominator N of 1 : N, rounded to the nearest thousand.
    variables:
      - id: lat1
        label: Known latitude
        unit: °N
      - id: scale1
        label: Scale at the known latitude (denominator)
        unit: ""
      - id: lat2
        label: Latitude
        unit: °N
    answer:
      formula: round(scale1 * cos(lat2) / cos(lat1) / 1000) * 1000
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: round(scale1 * cos(lat1) / cos(lat2) / 1000) * 1000
      - id: d2
        formula: scale1
      - id: d3
        formula: round(scale1 * sin(lat2) / sin(lat1) / 1000) * 1000
      - id: d4
        formula: round(scale1 * cos(lat2) * cos(lat1) / 1000) * 1000
    presets:
      - id: p1
        values:
          lat1: 35
          scale1: 200000
          lat2: 22
      - id: p2
        values:
          lat1: 50
          scale1: 1000000
          lat2: 10
      - id: p3
        values:
          lat1: 40
          scale1: 500000
          lat2: 60
    explanation: >-
      On a Mercator chart the scale denominator changes with the cosine of the
      latitude. It is larger nearer the Equator and smaller nearer the poles.
      The new scale is the known scale multiplied by cos of the new latitude,
      divided by cos of the known latitude.


      **Solution**


      Scale at {{lat2}}°N: {{f: scale1 * cos(lat2) / cos(lat1)}} = {{n: scale1 *
      cos(lat2) / cos(lat1)}}, rounded to the nearest thousand = **1 :
      {{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: inverts the latitude ratio.

      - **1 : {{d2}}**: makes no change for latitude.

      - **1 : {{d3}}**: uses the sine instead of the cosine.

      - **1 : {{d4}}**: multiplies by both cosines instead of dividing.
