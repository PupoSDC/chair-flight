- id: QIJFXVVRC
  docId: "061.04"
  relatedQuestions:
    - Q7KL7YJP7
    - QF2LWJRLA
  externalIds:
    - ATPLQ-617967
    - BGS-611481
    - AVEXAM-64294
    - ATPLQ-614399
    - BGS-610205
    - BGS-610206
    - AVEXAM-406
    - ATPLGS-627160
    - AVEXAM-88563
    - ATPLGS-625418
    - ATPLQ-619147
  annexes: []
  learningObjectives:
    - 061.04.02.03.03
  template:
    type: calculation
    question: >-
      On a Direct Mercator chart, a certain chart length has the following
      meaning:


      - Latitude {{lat1}}° (negative values are south): it represents {{dist1}}
      NM on the Earth


      What distance on the Earth does the same chart length represent at
      latitude {{lat2}}°? Give the answer in NM.
    variables:
      - id: lat1
        label: Latitude of the known distance
        unit: °
      - id: dist1
        label: Distance on the Earth
        unit: NM
      - id: lat2
        label: Latitude of the new distance
        unit: °
    answer:
      formula: dist1 * cos(lat2) / cos(lat1)
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: dist1 * cos(lat1) / cos(lat2)
      - id: d2
        formula: dist1 * cos(lat2)
      - id: d3
        formula: dist1 * cos(lat1)
      - id: d4
        formula: dist1 * (cos(lat2) / cos(lat1)) ^ 2
    presets:
      - id: p1
        values:
          lat1: 45
          dist1: 90
          lat2: 30
      - id: p2
        values:
          lat1: -15
          dist1: 120
          lat2: 10
      - id: p3
        values:
          lat1: -30
          dist1: 80
          lat2: 45
    explanation: >-
      A Mercator chart keeps the same chart length for the same change in
      longitude, but the distance on the Earth covered by that length shrinks
      with the cosine of the latitude. A given chart length therefore covers
      more Earth distance at a lower latitude and less at a higher one.


      **Solution**


      - Earth distance = {{dist1}} NM × cos {{lat2}}° / cos {{lat1}}°

      - {{f: dist1 * cos(lat2) / cos(lat1)}} = {{n: dist1 * cos(lat2) /
      cos(lat1)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the ratio is inverted, so the distance is scaled the
      wrong way.

      - **{{d2}} NM**: the latitude ratio is left out and only the cosine of the
      new latitude is applied.

      - **{{d3}} NM**: only the cosine of the known latitude is applied, with no
      ratio.

      - **{{d4}} NM**: the ratio is squared instead of applied once.
