          - 046°(M) and 75 NM
          - 042°(M) and 43 NM
        explanation: >-
          The distance is measured on the chart between the two points, using
          the scale of the chart. The track is the direction from the first
          point to the second, measured on the chart and converted to magnetic
          with the variation shown on the chart.


          **Solution**


          - Measure the distance between MAC DME and CLYDE on chart E(LO)2: **43
