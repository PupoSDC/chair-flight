  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      A distance of {{ground_nm}} NM is represented by a length of {{chart_cm}}
      cm on the chart.


      What is the scale of the chart, written as 1 : N? Give N.
    variables:
      - id: ground_nm
        label: Ground distance
        unit: NM
      - id: chart_cm
        label: Chart distance
        unit: cm
    answer:
      formula: round(ground_nm * 185200 / chart_cm / 10000) * 10000
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: ground_nm * 185200 / chart_cm / 10
      - id: d2
        formula: chart_cm * 185200 / ground_nm / 100
      - id: d3
        formula: ground_nm * 1852 / chart_cm
      - id: d4
        formula: ground_nm * 160934 / chart_cm
    presets:
      - id: p1
        values:
          ground_nm: 76
          chart_cm: 12.7
      - id: p2
        values:
          ground_nm: 60
          chart_cm: 6
      - id: p3
        values:
          ground_nm: 120
          chart_cm: 4
    explanation: >-
      The chart scale is the ratio of a distance on the chart to the same
      distance on the ground. Both must be in the same unit, so the ground
      distance is converted from nautical miles into centimetres (1 NM = 1 852 m
      = 185 200 cm).


      **Solution**


      Ground distance = {{ground_nm}} NM × 185 200 = {{= ground_nm * 185200}} cm


      Scale denominator = {{= ground_nm * 185200}} cm ÷ {{chart_cm}} cm = {{=
      ground_nm * 185200 / chart_cm}}


      Rounded to the nearest 10 000: 1 : **{{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: a factor of ten too small in the calculation.

      - **1 : {{d2}}**: inverts the ratio, dividing the chart distance by the
      ground distance.

      - **1 : {{d3}}**: forgets to convert metres into centimetres.

      - **1 : {{d4}}**: uses the statute mile (1 609 m) instead of the nautical
      mile.
