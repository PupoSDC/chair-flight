    - ATPLGS-110262
  annexes: []
  learningObjectives:
    - 061.04.01.02.01
  template:
    type: calculation
    question: |-
      A Lambert conic projection has its two standard parallels at:

      - First standard parallel: {{sp1}}°N
      - Second standard parallel: {{sp2}}°N

      What is the constant of the cone of this chart?
    variables:
      - id: sp1
        label: First standard parallel
        unit: °
      - id: sp2
        label: Second standard parallel
        unit: °
    answer:
      formula: sin((sp1 + sp2) / 2)
      unit: ""
      decimals: 3
    distractors:
      - id: d1
        formula: (sin(sp1) + sin(sp2)) / 2
      - id: d2
        formula: sin(sp1) * sin(sp2)
      - id: d3
        formula: cos((sp1 + sp2) / 2)
      - id: d4
        formula: sin((sp2 - sp1) / 2)
    presets:
      - id: p1
        values:
          sp1: 50
          sp2: 70
      - id: p2
        values:
          sp1: 20
          sp2: 60
      - id: p3
        values:
          sp1: 35
          sp2: 65
    explanation: >-
      The constant of the cone (n) of a Lambert conformal chart lies between the
      sines of its two standard parallels. For a quick estimate it is taken as
      the sine of the mean of the two standard parallels.


      **Solution**


      {{f: sin((sp1 + sp2) / 2)}}


      {{n: sin((sp1 + sp2) / 2)}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: averages the two sines instead of taking the sine of their
      mean

      - **{{d2}}**: multiplies the two sines instead of taking the sine of their
      mean

      - **{{d3}}**: uses the cosine instead of the sine

      - **{{d4}}**: uses the difference of the parallels instead of their mean
