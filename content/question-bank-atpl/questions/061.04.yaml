- id: QAWGPLTE
  docId: 061.04.02.04
  relatedQuestions:
    - Q3KVSXAEJ
  externalIds:
    - ATPLQ-612250
    - AVEXAM-93479
    - BGS-610194
  annexes: []
  learningObjectives:
    - 061.04.02.04.02
  template:
    type: calculation
    question: >-
      Positions A and B lie on the parallel 30°N. B lies {{dlon}}° of longitude
      east of A. The two points are plotted on a Lambert chart with a cone
      constant of {{n}}, and are connected by a straight line.


      - True track measured at A: {{trk}}°


      What is the true track measured at B?
    variables:
      - id: n
        label: Cone constant
        unit: ""
      - id: trk
        label: True track at A
        unit: °
      - id: dlon
        label: Longitude difference
        unit: °
    answer:
      formula: trk + n * dlon
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: trk - n * dlon
      - id: d2
        formula: trk - dlon
      - id: d3
        formula: trk + dlon
      - id: d4
        formula: trk
    presets:
      - id: p1
        values:
          n: 0.5
          trk: 88.5
          dlon: 6
      - id: p2
        values:
          n: 0.7
          trk: 270
          dlon: 10
    explanation: >-
      A straight line on a Lambert chart keeps a constant direction on the
      chart, while the meridians converge. The true track therefore changes by
      the convergency between the two meridians, which is the cone constant
      times the longitude difference.


      **Solution**


      - Change of track = {{n}} × {{dlon}}° = {{= n * dlon}}°

      - Track at B = {{trk}}° + {{= n * dlon}}° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the change, so the track turns the wrong way.

      - **{{d2}}°**: uses the longitude difference as the change, without the
      cone constant.

      - **{{d3}}°**: adds the longitude difference in full and forgets the cone
      constant.

      - **{{d4}}°**: forgets that the track changes between A and B.
