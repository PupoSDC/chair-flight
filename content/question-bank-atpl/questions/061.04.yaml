- id: QSZTWLOD
  docId: 061.04.02.03
  relatedQuestions: []
  externalIds:
    - ATPLQ-616735
    - BGS-610183
    - ATPLGS-110269
    - AVEXAM-44599
    - ATPLGS-625651
  annexes: []
  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      On a Lambert conformal chart, the distance between meridians {{dlon}}°
      apart along the parallel {{lat}}°N measures {{cm}} cm.


      What is the scale of the chart at that parallel? Give N for the scale 1 :
      N, rounded to the nearest million.
    variables:
      - id: dlon
        label: Longitude difference
        unit: °
      - id: lat
        label: Latitude
        unit: °
      - id: cm
        label: Distance on the chart
        unit: cm
    answer:
      formula: round(dlon * 60 * cos(lat) * 185200 / cm / 1000000) * 1000000
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: dlon * 60 * 185200 / cm
      - id: d2
        formula: dlon * 60 * cos(lat) * 185200 / cm / 2
      - id: d3
        formula: dlon * 60 * cos(lat) * 1852 / cm
      - id: d4
        formula: cos(lat) * 60 * 185200 / cm
    presets:
      - id: p1
        values:
          dlon: 5
          lat: 37
          cm: 9
      - id: p2
        values:
          dlon: 10
          lat: 60
          cm: 4
    explanation: >-
      One degree of latitude is 60 NM. Along a parallel, one degree of longitude
      is 60 × cos(latitude) NM. The scale is the ground distance divided by the
      distance on the chart, with both in the same unit. One NM is 185 200 cm.


      **Solution**


      - Ground distance = {{dlon}}° × 60 NM × cos {{lat}}° = {{= dlon * 60 *
      cos(lat)}} NM

      - Scale = ground distance in cm / {{cm}} cm = {{= dlon * 60 * cos(lat) *
      185200 / cm}}

      - Rounded to the nearest million: **1 : {{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: uses the length of a degree at the equator and ignores
      the latitude.

      - **1 : {{d2}}**: halves the ground distance.

      - **1 : {{d3}}**: converts NM to metres instead of centimetres.

      - **1 : {{d4}}**: uses one degree of longitude instead of the full
      difference.
- id: QT5WSZCTI
  docId: "061.04"
  relatedQuestions:
    - QYFQEPHVI
  externalIds:
    - ATPLQ-617560
    - AVEXAM-5869
    - BGS-611283
  annexes: []
  learningObjectives:
    - 061.04.02.03.03
  template:
    type: calculation
    question: >-
      On a Mercator chart, on the Equator, a distance of {{chart}} cm equals
      {{nm}} NM. At a latitude of {{lat}}°N, {{chart}} cm on the chart equals a
      real distance of:


      Give the real distance in km.
    variables:
      - id: chart
        label: Distance on the chart
        unit: cm
      - id: nm
        label: Distance on the Equator
        unit: NM
      - id: lat
        label: Latitude
        unit: °N
    answer:
      formula: chart * (nm * 185200 / chart) * cos(lat) / 100000
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: nm * 1.852
      - id: d2
        formula: nm * 1.852 / cos(lat)
      - id: d3
        formula: nm * cos(lat)
      - id: d4
        formula: nm * 1.852 * sin(lat)
    presets:
      - id: p1
        values:
          chart: 6.2
          nm: 248
          lat: 42
      - id: p2
        values:
          chart: 5
          nm: 300
          lat: 60
      - id: p3
        values:
          chart: 4
          nm: 200
          lat: 20
    explanation: >-
      On a Mercator chart the scale at the Equator is the ground distance
      divided by the chart distance. At a latitude the scale is smaller by the
      cosine of the latitude, so the same chart distance covers less ground. The
      real distance is the chart distance times that latitude scale.


      **Solution**


      Scale at the Equator: 1 : {{= nm * 185200 / chart}}


      Scale at {{lat}}°N: 1 : {{= nm * 185200 / chart * cos(lat)}}


      Real distance: {{f: chart * (nm * 185200 / chart) * cos(lat) / 100000}} =
      {{n: chart * (nm * 185200 / chart) * cos(lat) / 100000}} = **{{answer}}
      km**


      **Why the other answers are wrong**


      - **{{d1}} km**: uses the Equator distance and ignores the change with
      latitude.

      - **{{d2}} km**: divides by the cosine instead of multiplying.

      - **{{d3}} km**: treats the nautical miles as kilometres.

      - **{{d4}} km**: uses the sine of the latitude instead of the cosine.
