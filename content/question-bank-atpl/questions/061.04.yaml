- id: QXJSDBSZ
  docId: 061.04.02.03
  relatedQuestions: []
  externalIds:
    - ATPLQ-613230
    - BGS-610209
    - ATPLGS-625507
    - AVEXAM-63198
    - BGS-611207
  annexes: []
  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      What is the chart distance between longitudes {{lon_e}}°E and {{lon_w}}°W
      on a direct Mercator chart with a scale of 1 : {{scale}} at the Equator?


      Give the chart distance in mm.
    variables:
      - id: lon_e
        label: East longitude
        unit: °
      - id: lon_w
        label: West longitude
        unit: °
      - id: scale
        label: Chart scale denominator
        unit: ""
    answer:
      formula: (360 - lon_e - lon_w) * 60 * 1852 * 1000 / scale
      unit: mm
      decimals: 0
    distractors:
      - id: d1
        formula: (lon_e - lon_w) * 60 * 1852 * 1000 / scale
      - id: d2
        formula: (360 - lon_e - lon_w) * 1852 * 1000 / scale
      - id: d3
        formula: (360 - lon_e - lon_w) * 60 * 1852 * 100 / scale
      - id: d4
        formula: (360 - lon_e - lon_w) * 60 * 1000 * 1000 / scale
    presets:
      - id: p1
        values:
          lon_e: 179
          lon_w: 175
          scale: 5000000
      - id: p2
        values:
          lon_e: 170
          lon_w: 160
          scale: 5000000
      - id: p3
        values:
          lon_e: 120
          lon_w: 110
          scale: 10000000
    explanation: >-
      On a direct Mercator chart the scale along the Equator is the same as the
      chart scale, so a longitude difference measured along the Equator can be
      converted directly into a chart distance. The angle between the two
      meridians is the difference between 360° and the sum of the two
      longitudes, because they are on opposite sides of the 180° meridian.


      **Solution**


      Longitude difference = 360 − {{lon_e}} − {{lon_w}} = {{= 360 - lon_e -
      lon_w}}°


      Ground distance = {{= 360 - lon_e - lon_w}} × 60 NM = {{= (360 - lon_e -
      lon_w) * 60}} NM


      Chart distance = {{= (360 - lon_e - lon_w) * 60 * 1852 * 1000}} mm ÷
      {{scale}} = **{{answer}} mm**


      **Why the other answers are wrong**


      - **{{d1}} mm**: uses the direct difference of the two longitudes, not the
      angle across the 180° meridian.

      - **{{d2}} mm**: forgets to convert degrees of longitude into nautical
      miles.

      - **{{d3}} mm**: gives the chart distance in cm instead of mm.

      - **{{d4}} mm**: uses 1 000 m for the nautical mile instead of 1 852 m.
