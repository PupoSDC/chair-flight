- id: QCKWCWTH
  docId: 061.04.02.04
  relatedQuestions:
    - QHQRUXGO
  externalIds:
    - ATPLQ-618314
    - ATPLGS-110288
    - BGS-610231
    - ATPLGS-625558
  annexes: []
  learningObjectives:
    - 061.04.02.04.07
  template:
    type: calculation
    question: >-
      A straight line track is drawn on a Lambert conformal conic chart from
      position A to position B.


      - Constant of the cone: {{cone}}

      - Position A: latitude {{lat}}° N, longitude {{lon_a}}° (east positive,
      west negative)

      - True track at A: {{track_a}}°

      - True track at B: {{track_b}}°


      What is the longitude of B? Give the answer in degrees east (west is
      negative).
    variables:
      - id: cone
        label: Constant of the cone
        unit: ""
      - id: lat
        label: Latitude of A
        unit: °
      - id: lon_a
        label: Longitude of A
        unit: °
      - id: track_a
        label: True track at A
        unit: °
      - id: track_b
        label: True track at B
        unit: °
    answer:
      formula: lon_a + (track_b - track_a) / cone
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: lon_a - (track_b - track_a) / cone
      - id: d2
        formula: lon_a + (track_b - track_a) * cone
      - id: d3
        formula: lon_a + (track_b - track_a)
      - id: d4
        formula: (track_b - track_a) / cone
    presets:
      - id: p1
        values:
          cone: 0.8
          lat: 53
          lon_a: -4
          track_a: 80
          track_b: 92
      - id: p2
        values:
          cone: 0.6
          lat: 45
          lon_a: 20
          track_a: 100
          track_b: 110
      - id: p3
        values:
          cone: 0.4
          lat: 60
          lon_a: -30
          track_a: 250
          track_b: 240
    explanation: >-
      On a Lambert chart the track changes along a straight line by the
      convergence between the two meridians, which is the constant of the cone
      times the longitude difference. The longitude difference is therefore the
      change in track divided by the constant of the cone, and it is added to
      the longitude of A.


      **Solution**


      - Change in track: {{track_b}}° − {{track_a}}° = {{= track_b - track_a}}°

      - Longitude difference = change in track ÷ constant of the cone = {{=
      (track_b - track_a) / cone}}°

      - {{f: lon_a + (track_b - track_a) / cone}} = {{n: lon_a + (track_b -
      track_a) / cone}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the longitude difference instead of adding it

      - **{{d2}}°**: multiplies by the constant of the cone instead of dividing

      - **{{d3}}°**: forgets the constant of the cone

      - **{{d4}}°**: forgets the starting longitude of A
