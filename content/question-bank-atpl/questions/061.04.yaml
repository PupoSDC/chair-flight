- id: QV0WFJSV1
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618913
    - ATPLQ-618284
    - ATPLGS-110263
    - ATPLGS-625569
    - BGS-610217
  annexes: []
  learningObjectives:
    - 061.04.02.03.02
  template:
    type: calculation
    question: >-
      A Mercator chart has a scale of 1 : {{eq_scale}} at the Equator.


      What is the scale of the chart at latitude {{lat}}°? Give the denominator
      N of 1 : N.
    variables:
      - id: eq_scale
        label: Scale at the Equator (denominator)
        unit: ""
      - id: lat
        label: Latitude
        unit: °
    answer:
      formula: round(eq_scale * cos(lat) / 1000) * 1000
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: eq_scale / cos(lat)
      - id: d2
        formula: eq_scale * sin(lat)
      - id: d3
        formula: eq_scale * cos(lat) / 10
      - id: d4
        formula: eq_scale * cos(lat) * 10
    presets:
      - id: p1
        values:
          eq_scale: 3704000
          lat: 60
      - id: p2
        values:
          eq_scale: 1822835
          lat: 43
      - id: p3
        values:
          eq_scale: 2000000
          lat: 30
    explanation: >-
      On a Mercator chart the scale increases with latitude as the east-west
      direction is stretched, so the representative fraction at latitude φ is
      the Equator scale multiplied by cos φ. The denominator therefore becomes
      smaller towards the poles. A distance given at the Equator as 1 inch = 25
      NM is converted first into the Equator scale denominator (25 NM = 46 300
      m, 1 inch = 0.0254 m).


      **Solution**


      Scale at {{lat}}° = 1 : {{eq_scale}} × cos {{lat}}° = 1 : {{= eq_scale *
      cos(lat)}}


      Rounded to the nearest 1 000: 1 : **{{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: divides by cos φ, which makes the chart scale smaller at
      latitude instead of larger.

      - **1 : {{d2}}**: uses sin φ instead of cos φ.

      - **1 : {{d3}}**: divides the Equator scale by ten, a decimal slip.

      - **1 : {{d4}}**: multiplies the Equator scale by ten, a decimal slip.
- id: QVITP4EBY
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611564
    - BGS-610776
    - ATPLGS-626169
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
    - 061.04.01.03.02
  template:
    type: calculation
    question: |-
      An aircraft passes point A and point B. Given the following information:

      - Distance between A and B on the chart: {{dmm}} mm
      - Chart scale: 1 cm = 3.2 NM
      - Time from A to B: {{t}} min

      What is the ground speed in kt?
    variables:
      - id: dmm
        label: Distance between A and B on the chart
        unit: mm
      - id: t
        label: Time from A to B
        unit: min
    answer:
      formula: dmm / 10 * 3.2 * 60 / t
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: dmm / 10 * 3.2 / t
      - id: d2
        formula: dmm / 10 * 60 / t
      - id: d3
        formula: dmm / 10 * 3.2 * 60 / t / 1.852
      - id: d4
        formula: dmm / 10 * 3.2 * 60 / t * 1.852
    presets:
      - id: p1
        values:
          dmm: 114
          t: 12
      - id: p2
        values:
          dmm: 96
          t: 15
      - id: p3
        values:
          dmm: 142
          t: 8
    explanation: >-
      Ground speed is the distance flown over the ground divided by the time
      taken. The distance is measured on the chart and converted to nautical
      miles with the chart scale, and the time is converted into hours.


      **Solution**


      - Distance flown: {{n: dmm / 10 * 3.2}} NM, from {{n: dmm / 10}} cm on the
      chart

      - Time: {{n: t / 60}} h

      - Ground speed: {{f: dmm / 10 * 3.2 / (t / 60)}} = {{n: dmm / 10 * 3.2 /
      (t / 60)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: forgets to convert the minutes into hours.

      - **{{d2}} kt**: forgets to apply the chart scale to the distance.

      - **{{d3}} kt**: divides the answer by 1.852, a unit mistake.

      - **{{d4}} kt**: multiplies the answer by 1.852, a unit mistake in the
      other direction.
