- id: QXLEKVRL
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611822
    - AVEXAM-16892
  annexes: []
  learningObjectives:
    - 061.04.02.03.01
  template:
    type: calculation
    question: >-
      An aircraft is coasting in from the North Sea and plans to fly from ST
      ABBS VOR towards ASRUS. Assume the track is a straight line on a Mercator
      chart.


      - ST ABBS VOR: {{ad}}°{{am}}' N, {{ald}}°{{alm}}' W

      - ASRUS: {{bd}}°{{bm}}' N, {{bld}}°{{blm}}' W


      What is the true track from ST ABBS to ASRUS, measured at ST ABBS? Give
      the answer to the nearest degree.
    variables:
      - id: ad
        label: Latitude A degrees
        unit: °
      - id: am
        label: Latitude A minutes
        unit: "'"
      - id: ald
        label: Longitude A degrees
        unit: °
      - id: alm
        label: Longitude A minutes
        unit: "'"
      - id: bd
        label: Latitude B degrees
        unit: °
      - id: bm
        label: Latitude B minutes
        unit: "'"
      - id: bld
        label: Longitude B degrees
        unit: °
      - id: blm
        label: Longitude B minutes
        unit: "'"
    answer:
      formula: round(atan2((ald + alm / 60 - (bld + blm / 60)) * pi / 180, ln(tan(45 +
        (bd + bm / 60) / 2) / tan(45 + (ad + am / 60) / 2))) + 360 * floor(1 -
        atan2((ald + alm / 60 - (bld + blm / 60)) * pi / 180, ln(tan(45 + (bd +
        bm / 60) / 2) / tan(45 + (ad + am / 60) / 2))) / 360))
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: round(360 - (atan2((ald + alm / 60 - (bld + blm / 60)) * pi / 180,
          ln(tan(45 + (bd + bm / 60) / 2) / tan(45 + (ad + am / 60) / 2))) + 360
          * floor(1 - atan2((ald + alm / 60 - (bld + blm / 60)) * pi / 180,
          ln(tan(45 + (bd + bm / 60) / 2) / tan(45 + (ad + am / 60) / 2))) /
          360)))
      - id: d2
        formula: round(atan2((ald + alm / 60 - (bld + blm / 60)) * pi / 180, ln(tan(45 +
          (bd + bm / 60) / 2) / tan(45 + (ad + am / 60) / 2))) + 180)
      - id: d3
        formula: round(atan2(ald + alm / 60 - (bld + blm / 60), (bd + bm / 60) - (ad +
          am / 60)) + 360 * floor(1 - atan2(ald + alm / 60 - (bld + blm / 60),
          (bd + bm / 60) - (ad + am / 60)) / 360))
      - id: d4
        formula: round(atan2((ald + alm / 60 - (bld + blm / 60)) * pi / 180 * cos(ad +
          am / 60), ln(tan(45 + (bd + bm / 60) / 2) / tan(45 + (ad + am / 60) /
          2))) + 360 * floor(1 - atan2((ald + alm / 60 - (bld + blm / 60)) * pi
          / 180 * cos(ad + am / 60), ln(tan(45 + (bd + bm / 60) / 2) / tan(45 +
          (ad + am / 60) / 2))) / 360))
    presets:
      - id: p1
        values:
          ad: 55
          am: 54.5
          ald: 2
          alm: 12.4
          bd: 55
          bm: 3.4
          bld: 3
          blm: 20.8
      - id: p2
        values:
          ad: 52
          am: 10
          ald: 1
          alm: 30
          bd: 51
          bm: 45
          bld: 2
          blm: 15
      - id: p3
        values:
          ad: 54
          am: 20
          ald: 2
          alm: 40
          bd: 56
          bm: 10
          bld: 1
          blm: 5
    explanation: >-
      A rhumb line keeps the same true track all the way from A to B. On a
      Mercator chart it is drawn as a straight line, and its track follows from
      the longitude difference and the latitude difference, where the latitude
      difference is stretched to suit the chart.


      **Solution**


      - Longitude difference: {{= ald + alm / 60 - (bld + blm / 60)}}°

      - Stretched latitude difference: {{= ln(tan(45 + (bd + bm / 60) / 2) /
      tan(45 + (ad + am / 60) / 2))}}

      - Angle from true north: {{= atan2((ald + alm / 60 - (bld + blm / 60)) *
      pi / 180, ln(tan(45 + (bd + bm / 60) / 2) / tan(45 + (ad + am / 60) /
      2)))}}°

      - True track, between 0° and 360°: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: ignores the sign of the angle, so the track lies on the
      wrong side of north

      - **{{d2}}°**: the reciprocal, which is the track from ASRUS back to ST
      ABBS

      - **{{d3}}°**: uses plain differences in latitude and longitude and
      ignores the stretch of the Mercator chart

      - **{{d4}}°**: scales the longitude difference by the cosine of the
      latitude, a distance correction that is not part of the track
