- id: QPPGZNNP4
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615219
  annexes:
    - jeppesen-enr-northern-ireland
  learningObjectives:
    - 061.04.03.02.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure or chart E(LO)2 from the Jeppesen GSPRM 2017. The
      Lambert chart has its standard parallels at 37°N and 65°N.


      An aircraft is flying at N55°00.0', W011°00.0' with a magnetic heading of
      {{mag}}°. The magnetic variation at the aircraft position is read from the
      chart.


      The relative bearing from the aircraft to the Donegal NDB (CFN)
      (N55°02.6', W008°20.4') is {{rel}}°.


      What is the true bearing to be plotted from the NDB to the aircraft
      position?
    variables:
      - id: mag
        label: Magnetic heading
        unit: °M
      - id: rel
        label: Relative bearing from the aircraft to the NDB
        unit: °
      - id: variation
        label: Magnetic variation, west (read from the chart)
        unit: °W
    chartInputs:
      - variation
    answer:
      formula: (mag - variation + rel + 180) - 360 * floor((mag - variation + rel +
        180) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (mag + variation + rel + 180) - 360 * floor((mag + variation + rel +
          180) / 360)
      - id: d2
        formula: (mag - variation + rel) - 360 * floor((mag - variation + rel) / 360)
      - id: d3
        formula: (mag - variation - rel + 180) - 360 * floor((mag - variation - rel +
          180) / 360)
      - id: d4
        formula: mag - variation
    presets:
      - id: p1
        values:
          mag: 136
          rel: 318
          variation: 4
      - id: p2
        values:
          mag: 50
          rel: 120
          variation: 2
    explanation: >-
      The magnetic heading is turned into a true heading by correcting for the
      magnetic variation. With west variation the magnetic reading is larger
      than the true reading, so the variation is subtracted. The true heading
      plus the relative bearing gives the true bearing from the aircraft to the
      NDB. The bearing to be plotted from the NDB to the aircraft is the
      reverse, so 180° is added. Results are given between 0° and 360°.


      **Solution**


      - True heading = magnetic heading - variation = {{= mag - variation}}°T

      - Bearing from the aircraft to the NDB = true heading + relative bearing =
      {{= mag - variation + rel}}°, which is {{= mag - variation + rel - 360 *
      floor((mag - variation + rel) / 360)}}° after removing full circles

      - Bearing from the NDB to the aircraft = reverse bearing =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: the variation is added instead of subtracted.

      - **{{d2}}°T**: the reverse bearing is not worked out, so the bearing from
      the aircraft to the NDB is given.

      - **{{d3}}°T**: the relative bearing is subtracted instead of added.

      - **{{d4}}°T**: the relative bearing is left out.
- id: QPR5PTPKB
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612424
    - ATPLGS-124354
    - ATPLQ-615411
  annexes: []
  learningObjectives:
    - 061.04.02.03.02
  template:
    type: calculation
    question: >-
      On a direct Mercator chart, a distance of {{chart_cm}} cm on the chart at
      {{lat1}}°N equals {{nm}} NM on the ground.


      What is the scale of the chart at {{lat2}}°N? Give the denominator N of 1
      : N.
    variables:
      - id: chart_cm
        label: Distance on the chart
        unit: cm
      - id: nm
        label: Ground distance
        unit: NM
      - id: lat1
        label: Known latitude
        unit: °N
      - id: lat2
        label: Latitude
        unit: °N
    answer:
      formula: nm * 185200 / chart_cm * cos(lat2) / cos(lat1)
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: nm * 185200 / chart_cm * cos(lat1) / cos(lat2)
      - id: d2
        formula: nm * 185200 / chart_cm
      - id: d3
        formula: nm * 1852 / chart_cm * cos(lat2) / cos(lat1)
      - id: d4
        formula: nm * 185200 / chart_cm * cos(lat2 - lat1)
    presets:
      - id: p1
        values:
          chart_cm: 10
          nm: 300
          lat1: 10
          lat2: 30
      - id: p2
        values:
          chart_cm: 0.31
          nm: 1
          lat1: 55
          lat2: 40
      - id: p3
        values:
          chart_cm: 6
          nm: 200
          lat1: 20
          lat2: 60
    explanation: >-
      On a Mercator chart the same ground distance is drawn larger the further
      it is from the Equator. The scale denominator therefore changes with the
      cosine of the latitude: the scale at the new latitude is the scale at the
      known latitude times cos of the new latitude, divided by cos of the known
      latitude.


      **Solution**


      Scale at {{lat1}}°N: 1 : {{= nm * 185200 / chart_cm}} at the Equator
      scale, which is 1 : {{= nm * 185200 / chart_cm / cos(lat1)}} at {{lat1}}°N


      Scale at {{lat2}}°N: {{f: nm * 185200 / chart_cm * cos(lat2) / cos(lat1)}}
      = {{n: nm * 185200 / chart_cm * cos(lat2) / cos(lat1)}} = **1 :
      {{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: inverts the latitude ratio, so the scale moves the wrong
      way.

      - **1 : {{d2}}**: ignores the change with latitude.

      - **1 : {{d3}}**: mixes up metres and centimetres, so the scale is far too
      small.

      - **1 : {{d4}}**: uses the difference in latitude as if it were an angle.
