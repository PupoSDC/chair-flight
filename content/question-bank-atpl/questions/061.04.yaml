  template:
    type: calculation
    question: >-
      A straight line is drawn from A to B on a Lambert conformal conical chart
      with standard parallels at 50°S and 56°S. A is at 53°S, 155°E, and B lies
      {{dlon}}° of longitude east of A, also at 53°S.


      When passing the meridian {{dpt}}° of longitude east of A, what is the
      true track?
    variables:
      - id: dlon
        label: Longitude from A to B (east)
        unit: °
      - id: dpt
        label: Longitude from A to the point (east)
        unit: °
    answer:
      formula: 90 + sin((50 + 56) / 2) * (dlon / 2 - dpt)
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: 90 - sin((50 + 56) / 2) * (dlon / 2 - dpt)
      - id: d2
        formula: "90"
      - id: d3
        formula: "260"
      - id: d4
        formula: 90 + sin((50 + 56) / 2) * (dlon - dpt)
    presets:
      - id: p1
        values:
          dlon: 35
          dpt: 30
      - id: p2
        values:
          dlon: 40
          dpt: 25
    explanation: >-
      On a Lambert chart a straight line keeps a constant grid direction. The
      track is 090° on the meridian halfway between A and B, and it changes by
      the convergency for every degree of longitude you move away from that
      midpoint meridian. Convergency is approximately the cone constant, the
      sine of the mean standard parallel (50 + 56) / 2 = 53°, times the
      longitude.


      **Solution**


      - Midpoint meridian: {{= dlon / 2}}° east of A, and the point is {{= dpt -
      dlon / 2}}° beyond it

      - Change of track = {{= sin((50 + 56) / 2) * (dpt - dlon / 2)}}°

      - True track = 090° − change = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: applies the change with the wrong sign.

      - **{{d2}}°**: ignores the convergency altogether.

      - **260°**: the reciprocal track of the answer.

      - **{{d4}}°**: uses the full longitude from A to B instead of the
      midpoint.
