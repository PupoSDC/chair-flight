  template:
    type: calculation
    question: >-
      For a direct Mercator projection chart, the scale at {{lat1}}°N is 1 :
      {{scale1}}. What is the scale of the same chart at {{lat2}}°N?


      Give the denominator N of 1 : N.
    variables:
      - id: lat1
        label: Known latitude
        unit: °N
      - id: scale1
        label: Scale at the known latitude (denominator)
        unit: ""
      - id: lat2
        label: Latitude
        unit: °N
    answer:
      formula: scale1 * cos(lat2) / cos(lat1)
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: scale1 * cos(lat1) / cos(lat2)
      - id: d2
        formula: scale1
      - id: d3
        formula: scale1 * sin(lat2) / sin(lat1)
      - id: d4
        formula: scale1 * cos(lat2) * cos(lat1)
    presets:
      - id: p1
        values:
          lat1: 23
          scale1: 2761515
          lat2: 56
      - id: p2
        values:
          lat1: 40
          scale1: 1500000
          lat2: 70
      - id: p3
        values:
          lat1: 10
          scale1: 4000000
          lat2: 35
    explanation: >-
      On a Mercator chart the scale denominator changes with the cosine of the
      latitude. It is larger nearer the Equator and smaller nearer the poles.
      The new scale is the known scale multiplied by cos of the new latitude,
      divided by cos of the known latitude.


      **Solution**


      {{f: scale1 * cos(lat2) / cos(lat1)}} = {{n: scale1 * cos(lat2) /
      cos(lat1)}} = **1 : {{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: inverts the latitude ratio.

      - **1 : {{d2}}**: makes no change for latitude.

      - **1 : {{d3}}**: uses the sine instead of the cosine.

      - **1 : {{d4}}**: multiplies by both cosines instead of dividing.
