    answer:
      formula: chart_mm / 25.4 * scale_nm * 1.852
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: chart_mm / 25.4 * scale_nm
      - id: d2
        formula: chart_mm / 25.4 * scale_nm / 1.852
      - id: d3
        formula: chart_mm * scale_nm * 1.852
      - id: d4
        formula: chart_mm / 25.4 * scale_nm * 1.609
    presets:
      - id: p1
        values:
          chart_mm: 200
          scale_nm: 20
      - id: p2
        values:
          chart_mm: 150
          scale_nm: 25
      - id: p3
        values:
          chart_mm: 85
          scale_nm: 40
    explanation: >-
      The distance on the chart is first converted into inches (25.4 mm per
      inch). The quoted scale then gives the distance in nautical miles, which
      is converted into kilometres (1 NM = 1.852 km).


      **Solution**


      - Distance in inches: {{= chart_mm / 25.4}} in

      - Ground distance: {{= chart_mm / 25.4 * scale_nm}} NM


      {{f: chart_mm / 25.4 * scale_nm * 1.852}} = {{n: chart_mm / 25.4 *
      scale_nm * 1.852}} = **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: the value in nautical miles is given, the conversion to
      kilometres is forgotten.

      - **{{d2}} km**: the kilometre conversion is inverted (divided instead of
      multiplied).

      - **{{d3}} km**: the inch conversion is forgotten and the millimetres are
      multiplied by the scale.

      - **{{d4}} km**: statute miles (1.609 km) are used instead of nautical
      miles.
