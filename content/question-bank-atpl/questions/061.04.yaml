- id: QYHQIJ7GB
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612552
    - ATPLGS-124456
    - AVEXAM-92852
  annexes: []
  learningObjectives:
    - 061.01.04.02.01
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      Calculate the ground distance in statute miles on an ATS route between two
      VORs, given:


      - Distance on the en-route chart: {{mm}} mm

      - Quoted chart scale: 1 inch = {{nm_per_inch}} NM


      What is the ground distance in statute miles?
    variables:
      - id: mm
        label: Distance on the chart
        unit: mm
      - id: nm_per_inch
        label: Chart scale (NM per inch)
        unit: NM
    answer:
      formula: mm / 25.4 * nm_per_inch * 1.15078
      unit: sm
      decimals: 0
    distractors:
      - id: d1
        formula: mm / 25.4 * nm_per_inch
      - id: d2
        formula: mm / 25.4 * nm_per_inch / 1.15078
      - id: d3
        formula: mm / 10 * nm_per_inch * 1.15078
      - id: d4
        formula: mm / 25.4 * nm_per_inch * 1.852
    presets:
      - id: p1
        values:
          mm: 137
          nm_per_inch: 15
      - id: p2
        values:
          mm: 95
          nm_per_inch: 20
      - id: p3
        values:
          mm: 210
          nm_per_inch: 10
    explanation: >-
      A chart scale tells you how many nautical miles one inch on the chart
      represents. The distance is measured in millimetres, converted to inches,
      turned into nautical miles with the scale, and finally converted into
      statute miles, since 1 nautical mile is 1.15078 statute miles.


      **Solution**


      Distance on the chart = {{mm}} mm ÷ 25.4 = {{= mm / 25.4}} inch


      Ground distance = {{= mm / 25.4}} inch × {{nm_per_inch}} NM per inch = {{=
      mm / 25.4 * nm_per_inch}} NM


      In statute miles = {{= mm / 25.4 * nm_per_inch}} NM × 1.15078 =
      **{{answer}} sm**


      **Why the other answers are wrong**


      - **{{d1}} sm**: gives nautical miles and does not convert to statute
      miles.

      - **{{d2}} sm**: divides by the conversion factor instead of multiplying.

      - **{{d3}} sm**: treats the chart distance as centimetres and skips the
      inch conversion.

      - **{{d4}} sm**: uses the kilometre factor for nautical miles (1.852)
      instead of the statute mile factor.
- id: QYIKGDGY
  docId: "061.04"
  relatedQuestions:
    - QE0TELXUG
  externalIds:
    - ATPLQ-612258
    - ATPLGS-625505
  annexes: []
  learningObjectives:
    - 061.04.03.02.03
  template:
    type: calculation
    question: >-
      While flying on a magnetic heading of {{mh}}° (M) in the northern
      hemisphere, an aircraft measures the relative bearing of the NDB as
      {{rel}}° R on the RBI (relative bearing indicator). Given the following
      information, determine the bearing to plot from the beacon to the aircraft
      on a Lambert chart:


      - Variation at the aircraft: {{var_ac}}° (east positive, west negative)

      - Variation at the station: {{var_st}}° (east positive, west negative)

      - Chart convergence between the aircraft and the NDB: {{conv}}°


      What is the bearing to plot from the beacon to the aircraft?
    variables:
      - id: mh
        label: magnetic heading
        unit: °
      - id: rel
        label: relative bearing of the NDB
        unit: °
      - id: var_ac
        label: variation at the aircraft
        unit: °
      - id: var_st
        label: variation at the station
        unit: °
      - id: conv
        label: chart convergence
        unit: °
    answer:
      formula: ((mh + var_ac + rel + 180 - conv) - 360 * floor((mh + var_ac + rel +
        180 - conv) / 360))
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: ((mh + var_ac + rel + 180) - 360 * floor((mh + var_ac + rel + 180) /
          360))
      - id: d2
        formula: ((mh + var_st + rel + 180 - conv) - 360 * floor((mh + var_st + rel +
          180 - conv) / 360))
      - id: d3
        formula: ((mh + var_ac + rel + 180 + conv) - 360 * floor((mh + var_ac + rel +
          180 + conv) / 360))
      - id: d4
        formula: ((mh + var_ac + rel - conv) - 360 * floor((mh + var_ac + rel - conv) /
          360))
    presets:
      - id: p1
        values:
          mh: 193
          rel: 63
          var_ac: 6
          var_st: 4
          conv: 8
      - id: p2
        values:
          mh: 120
          rel: 45
          var_ac: -4
          var_st: -2
          conv: 6
      - id: p3
        values:
          mh: 250
          rel: 110
          var_ac: 3
          var_st: 1
          conv: 5
    explanation: >-
      The bearing of the NDB from the aircraft is the true heading plus the
      relative bearing. Its reciprocal is the bearing of the aircraft from the
      beacon, and on a Lambert chart the convergence between the two meridians
      is then removed. Only the variation at the aircraft is needed for the true
      heading, the variation at the station is not used.


      **Solution**


      True heading: {{mh}}° + {{var_ac}}° = {{= mh + var_ac}}°


      Bearing of the NDB from the aircraft: {{= mh + var_ac}}° + {{rel}}° = {{=
      mh + var_ac + rel}}°


      Reciprocal and convergence: {{= mh + var_ac + rel}}° + 180° - {{conv}}° =
      {{= mh + var_ac + rel + 180 - conv}}°, within 0° to 360°: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets the chart convergence.

      - **{{d2}}°**: uses the variation at the station instead of the aircraft.

      - **{{d3}}°**: adds the convergence instead of subtracting it.

      - **{{d4}}°**: forgets the reciprocal, so the bearing of the NDB is given
      instead of the bearing of the aircraft.
