  template:
    type: calculation
    question: |-
      Use the chart scale to find the earth distance between two points.

      - Chart scale: 1:{{ratio}}
      - Chart distance: {{cm}} cm

      What is the earth distance, in metres?
    variables:
      - id: ratio
        label: Scale denominator
        unit: ""
      - id: cm
        label: Chart distance
        unit: cm
    answer:
      formula: cm * ratio / 100
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: cm * ratio / 1000
      - id: d2
        formula: cm * ratio / 100 / 1852
      - id: d3
        formula: cm * ratio / 10000
      - id: d4
        formula: cm * ratio / 100000
    presets:
      - id: p1
        values:
          ratio: 500000
          cm: 7
      - id: p2
        values:
          ratio: 250000
          cm: 5
      - id: p3
        values:
          ratio: 1000000
          cm: 9
    explanation: >-
      The chart distance in centimetres is multiplied by the scale denominator
      to give the earth distance in centimetres. Dividing by 100 gives metres.


      **Solution**


      Earth distance in cm: {{f: cm * ratio}} = {{n: cm * ratio}} cm


      Earth distance: {{f: cm * ratio / 100}} = {{n: cm * ratio / 100}} =
      **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: divides by 1 000 instead of 100.

      - **{{d2}} m**: converts to nautical miles and does not convert back to
      metres.

      - **{{d3}} m**: divides by 10 000 instead of 100.

      - **{{d4}} m**: divides by 100 000, which gives a value in kilometres.
