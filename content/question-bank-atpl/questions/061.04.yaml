        unit: °
      - id: lon_b
        label: Longitude of B
        unit: °
      - id: track
        label: Track of departure
        unit: °
    answer:
      formula: 2 * (track - 270) / (lon_a - lon_b)
      unit: ""
      decimals: 3
    distractors:
      - id: d1
        formula: (track - 270) / (lon_a - lon_b)
      - id: d2
        formula: sin(lat)
      - id: d3
        formula: 1 / (lon_a - lon_b)
      - id: d4
        formula: 2 * (track - 270)
    presets:
      - id: p1
        values:
          lat: 50.0983
          lon_a: 13.6917
          lon_b: 8.6383
          track: 272
      - id: p2
        values:
          lat: 45
          lon_a: 10
          lon_b: 2
          track: 273
      - id: p3
        values:
          lat: 60
          lon_a: 20
          lon_b: 14
          track: 272.5
    explanation: >-
      On a Lambert conformal chart a straight line joining two points of the
      same latitude is symmetric about the middle meridian between them. On that
      middle meridian the line has a track of exactly 270°. At each end the
      track differs from 270° by half the convergence between the meridians, and
      the convergence is the constant of the cone times the longitude
      difference. The constant of the cone is therefore twice the track
      difference divided by the longitude difference.


      **Solution**


      - Track difference from 270°: {{track}}° − 270° = {{= track - 270}}°

      - Longitude difference: {{lon_a}}° − {{lon_b}}° = {{= lon_a - lon_b}}°

      - {{f: 2 * (track - 270) / (lon_a - lon_b)}} = {{n: 2 * (track - 270) /
      (lon_a - lon_b)}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: forgets to double the track difference

      - **{{d2}}**: uses the latitude instead of the track

      - **{{d3}}**: inverts the ratio

      - **{{d4}}**: forgets to divide by the longitude difference
- id: QEMSFHYV
  docId: 061.04.02.04
  relatedQuestions:
    - QDMROCUQ
  externalIds:
    - ATPLQ-617007
    - AVEXAM-26272
    - ATPLGS-628130
  annexes: []
  learningObjectives:
    - 061.04.01.02.01
  template:
    type: calculation
    question: >-
      On a Lambert conformal chart the following distances are measured:


      - Two parallels of latitude 2° apart: {{par}} mm

      - Two meridians 2° of longitude apart, at the parallel of origin: {{mer}}
      NM

      - Difference in longitude: {{dlon}}°


      What is the convergence for this difference in longitude?
    variables:
      - id: par
        label: Distance between parallels 2° apart
        unit: mm
      - id: mer
        label: Distance between meridians 2° apart at the parallel of origin
        unit: NM
      - id: dlon
        label: Difference in longitude
        unit: °
    answer:
      formula: dlon * sqrt(1 - (mer / 120) ^ 2)
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: dlon * (mer / 120)
      - id: d2
        formula: dlon * (1 - (mer / 120) ^ 2)
      - id: d3
        formula: dlon * sqrt(1 - (mer / 120) ^ 2) / 2
      - id: d4
        formula: dlon / sqrt(1 - (mer / 120) ^ 2)
    presets:
      - id: p1
        values:
          par: 112
          mer: 70
          dlon: 15
      - id: p2
        values:
          par: 105
          mer: 80
          dlon: 20
      - id: p3
        values:
          par: 98
          mer: 60
          dlon: 10
    explanation: >-
      On a Lambert chart the scale is correct along the parallel of origin.
      There, two meridians 2° apart are 120 NM times the cosine of that parallel
      apart, so the measured distance between the meridians gives the cosine of
      the parallel of origin. The constant of the cone is the sine of that
      parallel. The distance between the parallels is not needed.


      **Solution**


      {{f: dlon * sqrt(1 - (mer / 120) ^ 2)}}


      {{n: dlon * sqrt(1 - (mer / 120) ^ 2)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the cosine of the parallel of origin as the constant
      of the cone

      - **{{d2}}°**: uses 1 minus the square of the ratio instead of the square
      root

      - **{{d3}}°**: halves the result

      - **{{d4}}°**: divides by the constant of the cone instead of multiplying
