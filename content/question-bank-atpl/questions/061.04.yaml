- id: QBJDMQCOJ
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611938
    - BGS-611595
  annexes: []
  learningObjectives:
    - 061.04.02.04.07
  template:
    type: calculation
    question: >-
      Positions X and Y are plotted on a Lambert chart. The constant of the cone
      is {{cone}}.


      - Initial great-circle track from X to Y: {{trk_xy}}°

      - Initial great-circle track from Y to X: {{trk_yx}}°


      Determine the difference in longitude between X and Y.
    variables:
      - id: cone
        label: Constant of the cone
        unit: ""
      - id: trk_xy
        label: Track from X to Y
        unit: °
      - id: trk_yx
        label: Track from Y to X
        unit: °
    answer:
      formula: (trk_yx - trk_xy - 180) / cone
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: trk_yx - trk_xy - 180
      - id: d2
        formula: (trk_yx - trk_xy - 180) * cone
      - id: d3
        formula: (trk_yx - trk_xy - 180) / (2 * cone)
      - id: d4
        formula: (trk_yx - trk_xy - 180) / 2
    presets:
      - id: p1
        values:
          cone: 0.6
          trk_xy: 43
          trk_yx: 235
      - id: p2
        values:
          cone: 0.4
          trk_xy: 30
          trk_yx: 230
      - id: p3
        values:
          cone: 0.6
          trk_xy: 50
          trk_yx: 240
    explanation: >-
      On a Lambert chart the meridians converge towards the pole. The
      convergency between two meridians is the constant of the cone multiplied
      by their difference in longitude. The back track from Y to X differs from
      the track from X to Y by 180° plus the convergency, so the convergency is
      found first.


      **Solution**


      Convergency = {{trk_yx}}° − {{trk_xy}}° − 180° = {{= trk_yx - trk_xy -
      180}}°


      Difference in longitude = {{= trk_yx - trk_xy - 180}}° ÷ {{cone}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the convergency is given as the answer without dividing by
      the cone.

      - **{{d2}}°**: the cone is multiplied instead of divided.

      - **{{d3}}°**: the result is divided by twice the cone.

      - **{{d4}}°**: the convergency is halved instead of divided by the cone.
