- id: QRZPRKDE
  docId: 061.04.02.04
  relatedQuestions:
    - QQGQOILK
  externalIds:
    - ATPLQ-616986
    - ATPLGS-628143
    - BGS-611422
    - BGS-611440
  annexes: []
  learningObjectives:
    - 061.04.02.04.05
  template:
    type: calculation
    question: >-
      Two locations A and B have the same latitude and lie on a meridian and its
      anti-meridian. On a Lambert conical projection map:


      - Difference in longitude between the two meridians: {{dlon}}°

      - Convergency between the two meridians: {{conv}}°


      What is the parallel of origin of this map?
    variables:
      - id: conv
        label: Chart convergency
        unit: °
      - id: dlon
        label: Difference in longitude
        unit: °
    answer:
      formula: asin(conv / dlon)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan(conv / dlon)
      - id: d2
        formula: acos(conv / dlon)
      - id: d3
        formula: 90 * conv / dlon
      - id: d4
        formula: asin(conv / (2 * dlon))
    presets:
      - id: p1
        values:
          conv: 156
          dlon: 180
      - id: p2
        values:
          conv: 120
          dlon: 180
    explanation: >-
      On a Lambert conical chart, the convergency between two meridians equals
      the constant of the cone multiplied by their difference in longitude. The
      constant of the cone equals the sine of the parallel of origin.


      **Solution**


      - Constant of the cone = {{conv}}° / {{dlon}}° = {{= conv / dlon}}

      - Parallel of origin = arcsin({{= conv / dlon}}) = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the tangent instead of the sine.

      - **{{d2}}°**: uses the cosine instead of the sine.

      - **{{d3}}°**: multiplies the ratio by 90 and forgets the arcsin.

      - **{{d4}}°**: uses half the difference in longitude.
