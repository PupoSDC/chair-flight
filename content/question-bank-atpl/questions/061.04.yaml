- id: QNCTRSJV
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613201
    - BGS-611096
    - AVEXAM-11532
    - ATPLGS-625535
    - ATPLGS-626401
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: >-
      While flying in the northern hemisphere, an aircraft has a VOR RMI reading
      of {{rmi}}° M to ‘BUB’ VOR. Given the following information, what bearing
      should be plotted from the VOR to the aircraft on a Mercator chart?


      - Variation at the aircraft: {{var_ac}}°E

      - Variation at the station: {{var_st}}°E

      - Earth convergence between the aircraft and the VOR: {{conv}}°
    variables:
      - id: rmi
        label: RMI reading (magnetic, to the VOR)
        unit: °M
      - id: var_ac
        label: Variation at the aircraft
        unit: °E
      - id: var_st
        label: Variation at the station
        unit: °E
      - id: conv
        label: Convergence
        unit: °
    answer:
      formula: rmi - 180 + var_st + conv / 2
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: rmi - 180 + var_st
      - id: d2
        formula: rmi - 180 + var_st + conv
      - id: d3
        formula: rmi - 180 + var_ac + conv / 2
      - id: d4
        formula: rmi - 180 + conv / 2
    presets:
      - id: p1
        values:
          rmi: 285
          var_ac: 4
          var_st: 8
          conv: 6
      - id: p2
        values:
          rmi: 230
          var_ac: 12
          var_st: 15
          conv: 4
      - id: p3
        values:
          rmi: 310
          var_ac: 6
          var_st: 3
          conv: 10
    explanation: >-
      The RMI reading is the magnetic bearing from the aircraft to the VOR.
      Reversed, it is the magnetic bearing from the VOR to the aircraft. The VOR
      station variation converts it to a true bearing. On a Mercator chart a
      straight line is a rhumb line, which differs from the true bearing by half
      the convergence.


      **Solution**


      Reciprocal, magnetic bearing from the VOR: {{= rmi - 180}}° M


      True bearing with the station variation: {{= rmi - 180 + var_st}}° T


      Adding half the convergence for the Mercator chart: {{f: rmi - 180 +
      var_st + conv / 2}} = **{{answer}} °T**


      **Why the other answers are wrong**


      - **{{d1}} °T**: forgets the convergence correction.

      - **{{d2}} °T**: applies the full convergence instead of half of it.

      - **{{d3}} °T**: uses the variation at the aircraft instead of at the
      station.

      - **{{d4}} °T**: forgets the variation at the station.
