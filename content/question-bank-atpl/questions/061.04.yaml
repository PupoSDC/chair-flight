- id: QHTVCBDO5
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617828
    - BGS-611696
    - AVEXAM-36088
    - ATPLQ-612513
  annexes: []
  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      An aeronautical chart has a published scale of 1 inch = {{nm_per_inch}}
      NM. An aircraft flies at a groundspeed of {{gs}} kt for {{minutes}}
      minutes.


      What is the chart distance covered by the aircraft, in cm?
    variables:
      - id: nm_per_inch
        label: Chart scale (NM per inch)
        unit: NM
      - id: gs
        label: Groundspeed
        unit: kt
      - id: minutes
        label: Time flown
        unit: min
    answer:
      formula: gs * minutes / 60 / nm_per_inch * 2.54
      unit: cm
      decimals: 1
    distractors:
      - id: d1
        formula: gs * minutes / 60 / nm_per_inch
      - id: d2
        formula: gs * minutes / 60 * nm_per_inch / 2.54
      - id: d3
        formula: gs * minutes / nm_per_inch * 2.54
      - id: d4
        formula: gs * minutes / 60 / nm_per_inch * 2.5
    presets:
      - id: p1
        values:
          nm_per_inch: 20
          gs: 150
          minutes: 50
      - id: p2
        values:
          nm_per_inch: 15
          gs: 150
          minutes: 25
      - id: p3
        values:
          nm_per_inch: 10
          gs: 120
          minutes: 40
    explanation: >-
      The chart distance is the ground distance divided by the chart scale. The
      ground distance is the groundspeed multiplied by the time flown, and the
      scale gives the number of nautical miles per inch on the chart, so the
      result in inches is converted to centimetres (1 inch = 2.54 cm).


      **Solution**


      Ground distance = {{gs}} kt × {{minutes}} min ÷ 60 = {{= gs * minutes /
      60}} NM


      Chart distance = {{= gs * minutes / 60}} NM ÷ {{nm_per_inch}} NM per inch
      = {{= gs * minutes / 60 / nm_per_inch}} inch


      In centimetres: {{= gs * minutes / 60 / nm_per_inch}} × 2.54 =
      **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: gives the distance in inches and does not convert it to
      centimetres.

      - **{{d2}} cm**: inverts the scale, multiplying by the NM per inch instead
