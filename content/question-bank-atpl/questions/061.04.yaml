  annexes: []
  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      Approximately how many nautical miles correspond to {{cm}} cm on a map
      with a scale of 1 : {{scale}}?


      Give the answer in NM.
    variables:
      - id: cm
        label: Distance on the map
        unit: cm
      - id: scale
        label: Scale denominator
        unit: ""
    answer:
      formula: cm * scale / 100000 / 1.852
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: cm * scale / 100000
      - id: d2
        formula: cm * scale / 100000 * 1.852
      - id: d3
        formula: cm * scale / 100000 / 1.609
      - id: d4
        formula: cm * scale / 1000000 / 1.852
    presets:
      - id: p1
        values:
          cm: 12
          scale: 2000000
      - id: p2
        values:
          cm: 8
          scale: 1500000
      - id: p3
        values:
          cm: 15
          scale: 500000
    explanation: >-
      The scale 1 : N means 1 cm on the map is N cm on the ground. The ground
      distance is first turned into kilometres, and then into nautical miles,
      where 1 NM is 1.852 km.


      **Solution**


      {{f: cm * scale / 100000 / 1.852}} = {{n: cm * scale / 100000 / 1.852}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: stops at kilometres and forgets to convert to nautical
      miles.

      - **{{d2}} NM**: multiplies by 1.852 instead of dividing.

      - **{{d3}} NM**: uses statute miles (1.609 km) instead of nautical miles.

      - **{{d4}} NM**: a factor of ten too small in the conversion of
      centimetres to kilometres.
- id: QKAMPJTT
  docId: 061.04.02.03
  relatedQuestions:
    - QKLKQXIX
  externalIds:
    - ATPLQ-619123
    - AVEXAM-9908
  annexes: []
  learningObjectives:
    - 061.04.02.03.02
  template:
    type: calculation
    question: >-
      On a Mercator chart the distance between the meridians 2°E and 3°E is
      {{cm}} cm. The scale of the chart at latitude {{lat}}°N is:


      Give the denominator N of 1 : N.
    variables:
      - id: cm
        label: Distance between the meridians
        unit: cm
      - id: lat
        label: Latitude
        unit: °N
    answer:
      formula: 111120 * 100 / cm * cos(lat)
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: 111120 * 100 / cm
      - id: d2
        formula: 111120 * 100 / cm / cos(lat)
      - id: d3
        formula: 111120 * cos(lat) / cm
      - id: d4
        formula: 111120 * 100 * cos(lat) ^ 2 / cm
    presets:
      - id: p1
        values:
          cm: 6
          lat: 45
      - id: p2
        values:
          cm: 4
          lat: 60
      - id: p3
        values:
          cm: 5
          lat: 30
    explanation: >-
      On a Mercator chart one degree of longitude is 111.12 km along the
      Equator. The chart shows it as the gap between the meridians, which fixes
      the scale at the Equator. The scale at any other latitude is the Equator
      scale multiplied by the cosine of that latitude.


      **Solution**


      Scale at the Equator: 1 : {{= 111120 * 100 / cm}}


      Scale at {{lat}}°N: {{f: 111120 * 100 / cm * cos(lat)}} = {{n: 111120 *
      100 / cm * cos(lat)}} = **1 : {{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: uses the Equator scale and makes no change for latitude.

      - **1 : {{d2}}**: divides by the cosine instead of multiplying.

      - **1 : {{d3}}**: forgets to convert the distance from metres to
      centimetres.

      - **1 : {{d4}}**: uses the cosine squared instead of the cosine.
