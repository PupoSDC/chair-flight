- id: QCAEB64IE
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615652
    - ATPLGS-124344
    - AVEXAM-86160
    - AVEXAM-1137
    - BGS-611615
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
    - 061.04.01.03.02
  template:
    type: calculation
    question: >-
      An aircraft overflies waypoint 1 and then waypoint 2. The distance between
      the two waypoints is measured on the chart.


      - Time from waypoint 1 to waypoint 2: {{time}} min

      - Measured distance on the chart: {{chart_cm}} cm

      - Chart scale: 1 cm represents {{scale}} NM


      What ground speed has been flown between the two waypoints?
    variables:
      - id: time
        label: Time between waypoints
        unit: min
      - id: chart_cm
        label: Measured distance on chart
        unit: cm
      - id: scale
        label: Chart scale
        unit: NM per cm
    answer:
      formula: chart_cm * scale / time * 60
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: chart_cm * scale / time
      - id: d2
        formula: chart_cm / scale * 60 / time
      - id: d3
        formula: chart_cm * scale / time * 60 / 1.852
    presets:
      - id: p1
        values:
          time: 12
          chart_cm: 11.4
          scale: 3.2
      - id: p2
        values:
          time: 15
          chart_cm: 9.5
          scale: 4
      - id: p3
        values:
          time: 8
          chart_cm: 7.2
          scale: 2.5
    explanation: >-
      Ground speed is the distance flown divided by the time taken. The distance
      is measured on the chart and converted to nautical miles with the chart
      scale. The time is in minutes, so the result is multiplied by 60 to give
      knots.


      **Solution**


      - Distance = {{chart_cm}} cm x {{scale}} NM per cm = {{= chart_cm *
      scale}} NM

      - {{f: chart_cm * scale / time * 60}} = {{n: chart_cm * scale / time *
      60}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: does not convert the minutes into hours.

      - **{{d2}} kt**: divides by the chart scale instead of multiplying by it.

      - **{{d3}} kt**: converts the distance into kilometres instead of keeping
      nautical miles.
- id: QCAS5ILYS
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614329
    - BGS-610211
    - AVEXAM-66545
    - ATPLGS-110300
  annexes: []
  learningObjectives:
    - 061.04.02.03.03
  template:
    type: calculation
    question: >-
      On a Mercator chart, the distance between positions A and B, located on
      the same parallel and {{dlon}}° of longitude apart, is {{chart}} cm. The
      scale at the parallel is 1 : {{scale}}.


      What is the latitude of A and B?


      Give the latitude in degrees north.
    variables:
      - id: chart
        label: Distance on the chart
        unit: cm
      - id: scale
        label: Scale denominator at the parallel
        unit: ""
      - id: dlon
        label: Difference in longitude
        unit: °
    answer:
      formula: acos((chart * scale / 100000) / (dlon * 111.12))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: asin((chart * scale / 100000) / (dlon * 111.12))
      - id: d2
        formula: acos(2 * (chart * scale / 100000) / (dlon * 111.12))
      - id: d3
        formula: acos((chart * scale / 100000) / (dlon * 111.12) / 2)
      - id: d4
        formula: 2 * acos((chart * scale / 100000) / (dlon * 111.12))
    presets:
      - id: p1
        values:
          chart: 6
          scale: 9260000
          dlon: 10
      - id: p2
        values:
          chart: 4
          scale: 9260000
          dlon: 20
      - id: p3
        values:
          chart: 8
          scale: 9260000
          dlon: 15
    explanation: >-
      The ground distance is found from the chart distance and the scale. Along
      the Equator, one degree of longitude is 111.12 km, so at the parallel the
      same longitude difference covers that distance times the cosine of the
      latitude. Dividing the two gives the cosine of the latitude, and the
      latitude follows from it.


      **Solution**


      Real distance: {{= chart * scale / 100000}} km


      Distance for {{dlon}}° of longitude at the Equator: {{= dlon * 111.12}} km


      Cosine of the latitude: {{f: (chart * scale / 100000) / (dlon * 111.12)}}
      = {{n: (chart * scale / 100000) / (dlon * 111.12)}}


      Latitude: {{f: acos((chart * scale / 100000) / (dlon * 111.12))}} =
      **{{answer}}° N**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the sine instead of the cosine.

      - **{{d2}}°**: doubles the ratio, which gives a cosine of 1 and so a
      latitude of 0°.

      - **{{d3}}°**: halves the ratio.

      - **{{d4}}°**: doubles the angle.
