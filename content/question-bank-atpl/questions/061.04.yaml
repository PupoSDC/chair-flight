- id: QUNRYHSH
  docId: 061.04.02.04
  relatedQuestions:
    - QGSCAAOF
  externalIds:
    - ATPLQ-618862
    - BGS-610238
    - AVEXAM-14012
    - ATPLGS-625379
  annexes: []
  learningObjectives:
    - 061.04.01.02.01
  template:
    type: calculation
    question: |-
      A Lambert conformal chart has the following data:

      - Difference in longitude between the two meridians: {{dlon}}°
      - Chart convergency between the two meridians: {{conv}}°

      What is the constant of the cone of this chart?
    variables:
      - id: conv
        label: Chart convergency
        unit: °
      - id: dlon
        label: Difference in longitude
        unit: °
    answer:
      formula: conv / dlon
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: conv * dlon
      - id: d2
        formula: dlon / conv
      - id: d3
        formula: sin(conv)
      - id: d4
        formula: (conv / dlon) ^ 2
    presets:
      - id: p1
        values:
          conv: 30
          dlon: 40
      - id: p2
        values:
          conv: 20
          dlon: 50
      - id: p3
        values:
          conv: 10
          dlon: 40
    explanation: >-
      The convergency between two meridians on a Lambert chart equals the
      constant of the cone multiplied by their difference in longitude. The
      constant of the cone is therefore found by dividing the convergency by the
      difference in longitude.


      **Solution**


      {{f: conv / dlon}}


      {{n: conv / dlon}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: multiplies the convergency by the longitude difference
      instead of dividing

      - **{{d2}}**: inverted ratio, divides the longitude difference by the
      convergency

      - **{{d3}}**: takes the sine of the convergency, which has no link to the
      longitude difference

      - **{{d4}}**: squares the ratio, a calculation slip
