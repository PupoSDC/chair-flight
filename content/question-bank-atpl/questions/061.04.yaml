- id: QERM1AZAY
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614006
  annexes: []
  learningObjectives:
    - 061.04.02.04.02
  template:
    type: calculation
    question: >-
      A Lambert conformal conic chart has standard parallels at {{sp1}}° N and
      {{sp2}}° N. An aircraft and an NDB are plotted on it at the same latitude,
      {{lat}}° N.


      - Aircraft longitude: {{lon_ac}}° (east positive, west negative)

      - NDB longitude: {{lon_ndb}}° (east positive, west negative)


      What is the true bearing of the aircraft's position line from the NDB?
    variables:
      - id: sp1
        label: First standard parallel
        unit: °
      - id: sp2
        label: Second standard parallel
        unit: °
      - id: lat
        label: Latitude
        unit: °
      - id: lon_ac
        label: Longitude of aircraft
        unit: °
      - id: lon_ndb
        label: Longitude of NDB
        unit: °
    answer:
      formula: 270 + sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac) / 2
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: 360 - (270 + sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac) / 2)
      - id: d2
        formula: 270 - sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac) / 2
      - id: d3
        formula: 90 + sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac) / 2
      - id: d4
        formula: 270 + sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac)
    presets:
      - id: p1
        values:
          sp1: 40
          sp2: 50
          lat: 55.5
          lon_ac: 12
          lon_ndb: 20
      - id: p2
        values:
          sp1: 30
          sp2: 60
          lat: 60
          lon_ac: 5
          lon_ndb: 25
      - id: p3
        values:
          sp1: 45
          sp2: 65
          lat: 50
          lon_ac: -10
          lon_ndb: 5
    explanation: >-
      On a Lambert chart two points at the same latitude are joined by a
      straight line that is symmetric about the middle meridian between them. On
      that middle meridian the line runs due west or due east, track 270° or
      090°. Away from that meridian the bearing changes by the constant of the
      cone times the distance from it, so the bearing from the NDB differs from
      270° by that amount.


      **Solution**


      - Constant of the cone: {{f: sin((sp1 + sp2) / 2)}} = {{= sin((sp1 + sp2)
      / 2)}}

      - Distance of the NDB from the middle meridian: ({{lon_ndb}}° −
      {{lon_ac}}°) ÷ 2 = {{= (lon_ndb - lon_ac) / 2}}°

      - {{f: 270 + sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac) / 2}} = {{n: 270 +
      sin((sp1 + sp2) / 2) * (lon_ndb - lon_ac) / 2}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: gives the reciprocal bearing, from the aircraft to the NDB

      - **{{d2}}°**: applies the convergence with the wrong sign

      - **{{d3}}°**: the reciprocal of the wrong-sign answer

      - **{{d4}}°**: uses the full longitude difference instead of the distance
      from the middle meridian
