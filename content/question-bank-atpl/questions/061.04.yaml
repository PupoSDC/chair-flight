- id: QPCIQZZEW
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614795
    - AVEXAM-57336
    - ATPLGS-625505
  annexes: []
  learningObjectives:
    - 061.04.03.02.03
  template:
    type: calculation
    question: >-
      You are flying on a magnetic heading of {{mh}}° in the northern
      hemisphere. The relative bearing of an NDB is {{rb}}° right.


      - Variation at the aircraft: {{va}}°E

      - Variation at the NDB: {{vs}}°E

      - Chart convergence between the aircraft and the NDB: {{conv}}°


      What true bearing should be plotted from the beacon to the aircraft on a
      Lambert chart?
    variables:
      - id: mh
        label: magnetic heading
        unit: °
      - id: rb
        label: relative bearing (right)
        unit: °
      - id: va
        label: variation at the aircraft (east)
        unit: °
      - id: vs
        label: variation at the NDB (east)
        unit: °
      - id: conv
        label: chart convergence
        unit: °
    answer:
      formula: mh + va + rb - 180 - conv
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: mh + va + rb - conv
      - id: d2
        formula: mh + va + rb - 180
      - id: d3
        formula: mh - va + rb - 180 - conv
      - id: d4
        formula: mh + va - vs + rb - 180 + conv
    presets:
      - id: p1
        values:
          mh: 185
          rb: 65
          va: 6
          vs: 4
          conv: 8
      - id: p2
        values:
          mh: 240
          rb: 30
          va: 2
          vs: 3
          conv: 5
      - id: p3
        values:
          mh: 300
          rb: 100
          va: 1
          vs: 2
          conv: 3
    explanation: >-
      The true heading is the magnetic heading corrected by the variation at the
      aircraft. Adding the relative bearing gives the true bearing from the
      aircraft to the beacon. Reversing it (180°) gives the bearing from the
      beacon to the aircraft, and the chart convergence is then applied for the
      Lambert chart. The variation at the beacon is not needed.


      **Solution**


      True heading = {{mh}}° + {{va}}° = {{= mh + va}}°


      Bearing of the beacon from the aircraft = {{= mh + va}}° + {{rb}}° = {{=
      mh + va + rb}}°


      Bearing of the aircraft from the beacon = {{= mh + va + rb}}° - 180° = {{=
      mh + va + rb - 180}}°


      Plotted bearing = {{f: mh + va + rb - 180 - conv}} = {{n: mh + va + rb -
      180 - conv}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: does not reverse the bearing, so it is the bearing from the
      aircraft to the beacon, and it applies the convergence.

      - **{{d2}}°**: ignores the chart convergence.

      - **{{d3}}°**: subtracts the variation at the aircraft instead of adding
      it.

      - **{{d4}}°**: uses the variation at the beacon instead of the aircraft,
      and adds the convergence instead of subtracting it.
