- id: Q0TVCWFVT
  docId: "061.04"
  relatedQuestions:
    - QRPDXSJN8
  externalIds:
    - ATPLQ-614474
    - ATPLGS-124344
    - AVEXAM-86160
    - AVEXAM-1137
    - BGS-611615
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      An aircraft flies over Waypoint 1 and is overhead Waypoint 2 {{minutes}}
      minutes later.


      - Measured distance on the chart between the two waypoints: {{chart_cm}}
      cm

      - Chart scale: 1 cm = {{nm_per_cm}} NM on the Earth


      What ground speed has been flown between the two waypoints in kt?
    variables:
      - id: chart_cm
        label: Distance measured on the chart
        unit: cm
      - id: nm_per_cm
        label: Chart scale (NM per cm)
        unit: NM
      - id: minutes
        label: Elapsed time between the waypoints
        unit: min
    answer:
      formula: chart_cm * nm_per_cm / (minutes / 60)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: chart_cm * nm_per_cm * (minutes / 60)
      - id: d2
        formula: chart_cm * nm_per_cm / (minutes / 60) * 1.852
      - id: d3
        formula: chart_cm / nm_per_cm / (minutes / 60)
      - id: d4
        formula: chart_cm * nm_per_cm / (minutes / 60) / 1.852
    presets:
      - id: p1
        values:
          chart_cm: 13.8
          nm_per_cm: 3.1
          minutes: 15
      - id: p2
        values:
          chart_cm: 12.4
          nm_per_cm: 2.5
          minutes: 20
      - id: p3
        values:
          chart_cm: 9.6
          nm_per_cm: 4.2
          minutes: 12
    explanation: >-
      Ground speed is the distance flown over the ground divided by the time
      taken. The distance comes from the chart measurement and the scale, and
      the time is converted from minutes into hours.


      **Solution**


      - Distance flown: {{= chart_cm * nm_per_cm}} NM

      - Time taken: {{minutes}} minutes = {{= minutes / 60}} h


      {{f: chart_cm * nm_per_cm / (minutes / 60)}} = {{n: chart_cm * nm_per_cm /
      (minutes / 60)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the distance is multiplied by the time in hours instead
      of divided.

      - **{{d2}} kt**: the speed is converted into km/h by mistake.

      - **{{d3}} kt**: the scale is inverted (divided by the NM per cm).

      - **{{d4}} kt**: the speed is divided by 1.852 by mistake.
