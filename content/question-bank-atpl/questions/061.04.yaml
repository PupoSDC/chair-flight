- id: QRIU9NDJW
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619842
    - AVEXAM-17925
  annexes:
    - jeppesen-vfr-chart-08-munich
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: >-
      Refer to Jeppesen GSPRM Training Route Manual, VFR Chart ED-4.


      An aircraft is approaching MÜHLDORF airfield (EDMY, N48° 16.8’ E012°
      30.1’) from the east on track 270°. The descent should be planned to
      arrive at {{target_alt}} ft approximately abeam of ALTÖTTING airfield
      (N48° 13.0’ E012° 38.9’). Atmospheric conditions are ISA, and the data
      are:


      - Cruising level: {{cruise_alt}} ft

      - TAS: {{tas}} kt

      - Average wind: {{wdir}}°(T) / {{wspd}} kt

      - Rate of descent: {{rod}} ft/min


      Calculate the distance (NM) from MÜHLDORF to the top of descent (ToD).
    variables:
      - id: cruise_alt
        label: Cruising level
        unit: ft
      - id: target_alt
        label: Target altitude
        unit: ft
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
      - id: rod
        label: Rate of descent
        unit: ft/min
    answer:
      formula: 8.8 * cos(48.28) + (tas - wspd * cos(wdir - 270)) * (cruise_alt -
        target_alt) / rod / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (tas - wspd * cos(wdir - 270)) * (cruise_alt - target_alt) / rod / 60
      - id: d2
        formula: 8.8 * cos(48.28) + tas * (cruise_alt - target_alt) / rod / 60
      - id: d3
        formula: 8.8 * cos(48.28) + (tas + wspd * cos(wdir - 270)) * (cruise_alt -
          target_alt) / rod / 60
      - id: d4
        formula: 8.8 * cos(48.28) + (tas - wspd * cos(wdir - 270)) * cruise_alt / rod /
          60
    presets:
      - id: p1
        values:
          cruise_alt: 12500
          target_alt: 3500
          rod: 500
          tas: 110
          wdir: 300
          wspd: 16
      - id: p2
        values:
          cruise_alt: 9000
          target_alt: 3000
          rod: 600
          tas: 130
          wdir: 200
          wspd: 20
      - id: p3
        values:
          cruise_alt: 6000
          target_alt: 1000
          rod: 500
          tas: 120
          wdir: 160
          wspd: 15
    explanation: >-
      The top of descent (ToD) is the point where the descent has to start to
      reach the target altitude in time. The aircraft first passes the point
      abeam ALTÖTTING, which lies about 5.9 NM east of MÜHLDORF, and then
      descends from there.


      **Solution**


      - Height to lose: {{cruise_alt}} ft - {{target_alt}} ft = {{= cruise_alt -
      target_alt}} ft

      - Descent time: {{= (cruise_alt - target_alt) / rod}} min

      - Headwind: {{= wspd * cos(wdir - 270)}} kt, so the ground speed is {{=
      tas - wspd * cos(wdir - 270)}} kt

      - Distance flown during the descent: {{= (tas - wspd * cos(wdir - 270)) *
      (cruise_alt - target_alt) / rod / 60}} NM

      - Abeam point of ALTÖTTING from MÜHLDORF: {{= 8.8 * cos(48.28)}} NM


      {{f: 8.8 * cos(48.28) + (tas - wspd * cos(wdir - 270)) * (cruise_alt -
      target_alt) / rod / 60}} = {{n: 8.8 * cos(48.28) + (tas - wspd * cos(wdir
      - 270)) * (cruise_alt - target_alt) / rod / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the distance from the abeam point to MÜHLDORF is
      forgotten, so only the descent distance is counted.

      - **{{d2}} NM**: the wind is ignored, so the TAS is used as the ground
      speed.

      - **{{d3}} NM**: the wind is treated as a tailwind instead of a headwind.

      - **{{d4}} NM**: the descent is measured from the cruising level all the
      way down to the ground, not only to the target altitude.
- id: QRPDXSJN8
  docId: "061.04"
