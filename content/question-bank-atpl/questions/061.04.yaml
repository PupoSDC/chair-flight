    question: Refer to chart E(LO)2 from Jeppesen GSPRM 2017. What is the initial
      track direction (M°) and distance (NM) from MACHRIHANISH (MAC) DME
      (55°26’N, 005°39’W) to non-compulsory reporting point CLYDE (55°58’N,
