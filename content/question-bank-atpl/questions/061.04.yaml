- id: QJDHDLMB
  docId: 061.04.02.04
  relatedQuestions: []
  externalIds:
    - ATPLQ-614255
    - AVEXAM-34185
  annexes: []
  learningObjectives:
    - 061.04.02.04.07
  template:
    type: calculation
    question: >-
      A great circle track is drawn on a Lambert conformal chart between
      positions X and Z in the Northern Hemisphere.


      - True track at X: {{track_x}}°

      - True track at Z: {{track_z}}°

      - Constant of the cone: {{cone}}


      What is the longitude difference between positions X and Z? Give the
      answer in decimal degrees.
    variables:
      - id: track_x
        label: Track at X
        unit: °
      - id: track_z
        label: Track at Z
        unit: °
      - id: cone
        label: Constant of the cone
        unit: ""
    answer:
      formula: (track_x - track_z) / cone
      unit: °
      decimals: 3
    distractors:
      - id: d1
        formula: (track_x - track_z) * cone
      - id: d2
        formula: (track_x - track_z) / (2 * cone)
      - id: d3
        formula: track_x - track_z
      - id: d4
        formula: (track_x - track_z) / cone ^ 2
    presets:
      - id: p1
        values:
          track_x: 300
          track_z: 291
          cone: 0.809
      - id: p2
        values:
          track_x: 310
          track_z: 298
          cone: 0.7
      - id: p3
        values:
          track_x: 255
          track_z: 243
          cone: 0.55
    explanation: >-
      On a Lambert conformal chart the meridians converge towards the pole. The
      angle between two meridians is the constant of the cone multiplied by the
      longitude difference between them. A straight line on the chart changes
      its true track by that same convergence, so the longitude difference is
      the change in track divided by the constant of the cone.


      **Solution**


      - Change in track: {{track_x}}° − {{track_z}}° = {{= track_x - track_z}}°

      - Longitude difference = change in track ÷ constant of the cone

      - {{f: (track_x - track_z) / cone}} = {{n: (track_x - track_z) / cone}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: multiplies by the constant of the cone instead of dividing

      - **{{d2}}°**: divides by twice the constant of the cone

      - **{{d3}}°**: gives the change in track itself, without the cone constant

      - **{{d4}}°**: divides by the square of the constant of the cone
