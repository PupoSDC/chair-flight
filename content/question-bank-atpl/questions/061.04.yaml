- id: QG5KJGRQL
  docId: 061.04.02.04
  relatedQuestions: []
  externalIds:
    - ATPLQ-619068
    - BGS-610196
    - AVEXAM-93928
    - ATPLGS-627158
    - ATPLGS-625359
    - BGS-610197
  annexes: []
  learningObjectives:
    - 061.04.02.04.02
  template:
    type: calculation
    question: >-
      A straight line is drawn on a Lambert conformal conic chart between two
      positions at the same latitude. Longitudes are counted eastwards from 0°
      to 360°.


      - Latitude of A and B: {{lat}}° N

      - Position A: longitude {{lon_a}}°

      - Position B: longitude {{lon_b}}°

      - Standard parallels: {{sp1}}° N and {{sp2}}° N


      When the line passes the meridian {{lon_x}}°, what is the true track?
    variables:
      - id: lat
        label: Latitude
        unit: °
      - id: lon_a
        label: Longitude of A
        unit: °
      - id: lon_b
        label: Longitude of B
        unit: °
      - id: lon_x
        label: Crossed meridian
        unit: °
      - id: sp1
        label: First standard parallel
        unit: °
      - id: sp2
        label: Second standard parallel
        unit: °
    answer:
      formula: 270 + sin((sp1 + sp2) / 2) * (lon_x - (lon_a + lon_b) / 2)
      unit: °
      decimals: 3
    distractors:
      - id: d1
        formula: 270 - sin((sp1 + sp2) / 2) * (lon_x - (lon_a + lon_b) / 2)
      - id: d2
        formula: 270 + (lon_x - (lon_a + lon_b) / 2)
      - id: d3
        formula: 270 + cos((sp1 + sp2) / 2) * (lon_x - (lon_a + lon_b) / 2)
      - id: d4
        formula: 270 + sin((sp1 + sp2) / 2) * (lon_x - lon_a)
    presets:
      - id: p1
        values:
          lat: 53
          lon_a: 205
          lon_b: 170
          lon_x: 175
          sp1: 50
          sp2: 56
      - id: p2
        values:
          lat: 50
          lon_a: 200
          lon_b: 180
          lon_x: 185
          sp1: 45
          sp2: 60
      - id: p3
        values:
          lat: 45
          lon_a: 150
          lon_b: 120
          lon_x: 140
          sp1: 30
          sp2: 50
    explanation: >-
      Along a straight line on a Lambert chart joining two points of the same
      latitude, the true track is exactly 270° (due west or due east) where the
      line crosses the middle meridian between the two points. Further away from
      that meridian the track changes by the constant of the cone times the
      distance from it.


      **Solution**


      - Middle meridian: ({{lon_a}}° + {{lon_b}}°) ÷ 2 = {{= (lon_a + lon_b) /
      2}}°

      - Distance of the crossing from the middle meridian: {{lon_x}}° − {{=
      (lon_a + lon_b) / 2}}° = {{= lon_x - (lon_a + lon_b) / 2}}°

      - Constant of the cone: {{f: sin((sp1 + sp2) / 2)}} = {{= sin((sp1 + sp2)
      / 2)}}

      - {{f: 270 + sin((sp1 + sp2) / 2) * (lon_x - (lon_a + lon_b) / 2)}} = {{n:
      270 + sin((sp1 + sp2) / 2) * (lon_x - (lon_a + lon_b) / 2)}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the change instead of adding it

      - **{{d2}}°**: forgets the constant of the cone

      - **{{d3}}°**: uses the cosine instead of the sine

      - **{{d4}}°**: measures the distance from position A instead of from the
      middle meridian
