  learningObjectives:
    - 061.03.01.01.01
  template:
    type: chart
    question: A Great Circle Track crosses the equator at 30°W has an initial track
      of 035°T. Where is its highest or lowest North/South point?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 55°N 060°E
        wrongAnswers:
          - 35°N 150°W
          - 55°S 060°W
          - 35°S 150°E
        explanation: >-
          The great circle reaches its highest latitude when its track is east
          or west. At the equator, cos(latitude) = sin 35° = 0.574, which is 55°
          of latitude.


          The track is heading north-east, so the vertex is **55°N**, and it
          lies 90° of longitude from the equator crossing: 30°W + 90° =
          **060°E**.
- id: Q4UC8LCE1
  docId: "061.04"
  relatedQuestions:
    - QFAKYNYM
    - QOGVCOGD
  externalIds:
    - ATPLQ-615976
    - BGS-611649
    - AVEXAM-50155
  annexes: []
  learningObjectives:
    - 061.04.01.03.02
  template:
    type: calculation
    question: |-
      Use the chart scale to find the earth distance between two points.

      - Chart scale: 1 inch = {{scale}} NM
      - Chart distance: {{cm}} cm

      What is the earth distance, in km?
    variables:
      - id: scale
        label: Chart scale
        unit: NM per inch
      - id: cm
        label: Chart distance
        unit: cm
    answer:
      formula: cm / 2.54 * scale * 1.852
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: cm / 2.54 * scale
      - id: d2
        formula: cm / 2.54 * scale / 1.852
      - id: d3
        formula: cm * scale * 1.852
      - id: d4
        formula: cm / 2.54 * scale * 1.609
    presets:
      - id: p1
        values:
          scale: 20
          cm: 17
      - id: p2
        values:
          scale: 30
          cm: 9
      - id: p3
        values:
          scale: 10
          cm: 12
    explanation: >-
      The chart distance is converted into inches, multiplied by the scale to
      give nautical miles, and then converted into kilometres (1 NM = 1.852 km).


      **Solution**


      Chart distance in inches: {{f: cm / 2.54}} = {{n: cm / 2.54}} in


      Earth distance in NM: {{= cm / 2.54 * scale}} NM


      Earth distance: {{f: cm / 2.54 * scale * 1.852}} = {{n: cm / 2.54 * scale
      * 1.852}} = **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: stops at nautical miles and does not convert to
      kilometres.

      - **{{d2}} km**: divides by 1.852 instead of multiplying.

      - **{{d3}} km**: uses the chart distance in cm as if it were inches.

      - **{{d4}} km**: uses the statute mile instead of the nautical mile.
