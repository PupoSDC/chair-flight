- id: QDWPILNH
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614036
    - AVEXAM-60307
    - BGS-610350
    - ATPLGS-625621
  annexes: []
  learningObjectives:
    - 061.04.03.02.03
  template:
    type: calculation
    question: >-
      An NDB and a DR position are plotted on a Lambert conformal chart with
      standard parallels at {{std1}}°N and {{std2}}°N:


      - NDB position: {{ndb_lat_deg}}°{{ndb_lat_min}}'N,
      {{ndb_lon_deg}}°{{ndb_lon_min}}'E

      - DR position: {{dr_lat_deg}}°{{dr_lat_min}}'N,
      {{dr_lon_deg}}°{{dr_lon_min}}'E

      - Magnetic variation: {{var_w}}°W

      - The NDB on the RMI reads {{rmi}}°


      Calculate the true direction (T) of the bearing to be plotted from the
      NDB, in whole degrees.
    variables:
      - id: std1
        label: First standard parallel
        unit: °
      - id: std2
        label: Second standard parallel
        unit: °
      - id: ndb_lat_deg
        label: NDB latitude (degrees)
        unit: °
      - id: ndb_lat_min
        label: NDB latitude (minutes)
        unit: "'"
      - id: ndb_lon_deg
        label: NDB longitude (degrees)
        unit: °
      - id: ndb_lon_min
        label: NDB longitude (minutes)
        unit: "'"
      - id: dr_lat_deg
        label: DR latitude (degrees)
        unit: °
      - id: dr_lat_min
        label: DR latitude (minutes)
        unit: "'"
      - id: dr_lon_deg
        label: DR longitude (degrees)
        unit: °
      - id: dr_lon_min
        label: DR longitude (minutes)
        unit: "'"
      - id: var_w
        label: Magnetic variation (West)
        unit: °
      - id: rmi
        label: RMI reading (magnetic bearing to the NDB)
        unit: °
    answer:
      formula: rmi + 180 - var_w + sin((std1 + std2) / 2) * (ndb_lon_deg + ndb_lon_min
        / 60 - dr_lon_deg - dr_lon_min / 60)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: rmi + 180 + var_w + sin((std1 + std2) / 2) * (ndb_lon_deg + ndb_lon_min
          / 60 - dr_lon_deg - dr_lon_min / 60)
      - id: d2
        formula: rmi + 180 - var_w - sin((std1 + std2) / 2) * (ndb_lon_deg + ndb_lon_min
          / 60 - dr_lon_deg - dr_lon_min / 60)
      - id: d3
        formula: rmi - var_w
      - id: d4
        formula: rmi + 180 - var_w
    presets:
      - id: p1
        values:
          std1: 40
          std2: 48
          ndb_lat_deg: 55
          ndb_lat_min: 10
          ndb_lon_deg: 12
          ndb_lon_min: 55
          dr_lat_deg: 54
          dr_lat_min: 53
          dr_lon_deg: 9
          dr_lon_min: 58
          var_w: 10
          rmi: 90
      - id: p2
        values:
          std1: 35
          std2: 55
          ndb_lat_deg: 50
          ndb_lat_min: 20
          ndb_lon_deg: 10
          ndb_lon_min: 30
          dr_lat_deg: 48
          dr_lat_min: 40
          dr_lon_deg: 8
          dr_lon_min: 15
          var_w: 5
          rmi: 120
      - id: p3
        values:
          std1: 30
          std2: 60
          ndb_lat_deg: 52
          ndb_lat_min: 5
          ndb_lon_deg: 5
          ndb_lon_min: 40
          dr_lat_deg: 50
          dr_lat_min: 10
          dr_lon_deg: 4
          dr_lon_min: 20
          var_w: 15
          rmi: 45
    explanation: >-
      The NDB bears {{rmi}}° magnetic from the aircraft. To plot the position
      line from the NDB, three steps are needed: reverse the bearing to get the
      bearing from the NDB back to the aircraft, convert magnetic to true (for
      west variation, true = magnetic minus the variation), and then apply the
      convergence of the meridians on the Lambert chart. The convergence is the
      longitude difference multiplied by the sine of the mean standard parallel.


      **Solution**


      - Reciprocal magnetic bearing: {{rmi}}° + 180° = {{= rmi + 180}}°M

      - True bearing: {{= rmi + 180}}° - {{var_w}}° (west variation) = {{= rmi +
      180 - var_w}}°T

      - Convergence: {{f: sin((std1 + std2) / 2) * (ndb_lon_deg + ndb_lon_min /
      60 - dr_lon_deg - dr_lon_min / 60)}} = {{n: sin((std1 + std2) / 2) *
      (ndb_lon_deg + ndb_lon_min / 60 - dr_lon_deg - dr_lon_min / 60)}}°

      - Bearing on the chart: {{= rmi + 180 - var_w}}° + convergence =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°**: the variation was added instead of subtracted.

      - **{{d2}}°**: the convergence correction was applied with the wrong sign.

      - **{{d3}}°**: the bearing from the aircraft was not reversed and no
      convergence correction was made.

      - **{{d4}}°**: the convergence correction was left out.
