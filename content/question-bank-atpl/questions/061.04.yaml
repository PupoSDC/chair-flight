- id: QEZQWUHE
  docId: 061.04.02.04
  relatedQuestions:
    - QZVHIKXTT
  externalIds:
    - ATPLQ-611130
    - AVEXAM-76309
    - ATPLGS-625550
    - ATPLGS-625616
    - ATPLGS-625518
    - ATPLGS-625395
    - AVEXAM-7797
    - ATPLQ-619227
    - AVEXAM-77118
  annexes: []
  learningObjectives:
    - 061.04.02.04.02
  template:
    type: calculation
    question: >-
      A straight line is drawn on a Lambert conformal conic chart with standard
      parallels at {{sp1}}° and {{sp2}}° (negative means south). It runs from
      position A to position B.


      - Position A: latitude {{lat_a}}°, longitude {{lon_a}}°

      - Position B: latitude {{lat_b}}°, longitude {{lon_b}}°

      - True track at A: {{trk}}°


      Longitudes are east positive and west negative. Calculate the true track
      at position B.
    variables:
      - id: sp1
        label: First standard parallel
        unit: °
      - id: sp2
        label: Second standard parallel
        unit: °
      - id: lat_a
        label: Latitude of A
        unit: °
      - id: lat_b
        label: Latitude of B
        unit: °
      - id: lon_a
        label: Longitude of A
        unit: °
      - id: lon_b
        label: Longitude of B
        unit: °
      - id: trk
        label: True track at A
        unit: °
    answer:
      formula: trk + sin((sp1 + sp2) / 2) * (lon_b - lon_a)
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: trk - sin((sp1 + sp2) / 2) * (lon_b - lon_a)
      - id: d2
        formula: trk + (lon_b - lon_a)
      - id: d3
        formula: trk - (lon_b - lon_a)
      - id: d4
        formula: trk + cos((sp1 + sp2) / 2) * (lon_b - lon_a)
    presets:
      - id: p1
        values:
          sp1: 54
          sp2: 59
          lat_a: 55
          lat_b: 58
          lon_a: 165
          lon_b: 154
          trk: 301
      - id: p2
        values:
          sp1: -54
          sp2: -59
          lat_a: -55
          lat_b: -58
          lon_a: 165
          lon_b: 154
          trk: 239
      - id: p3
        values:
          sp1: 50
          sp2: 60
          lat_a: 40
          lat_b: 45
          lon_a: 20
          lon_b: 35
          trk: 120
    explanation: >-
      On a Lambert conformal chart the meridians converge towards the pole. The
      convergence between two meridians is the constant of the cone times the
      longitude difference between them. A straight line on the chart changes
      its true track by this convergence, so the track at B is the track at A
      plus the convergence. The constant of the cone is the sine of the mean
      latitude of the two standard parallels.


      **Solution**


      - Constant of the cone: {{f: sin((sp1 + sp2) / 2)}} = {{= sin((sp1 + sp2)
      / 2)}}

      - Change in longitude from A to B: {{lon_b}}° − {{lon_a}}° = {{= lon_b -
      lon_a}}°

      - Convergence = constant × change in longitude = {{= sin((sp1 + sp2) / 2)
      * (lon_b - lon_a)}}°

      - {{f: trk + sin((sp1 + sp2) / 2) * (lon_b - lon_a)}} = {{n: trk +
      sin((sp1 + sp2) / 2) * (lon_b - lon_a)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: applies the convergence with the wrong sign

      - **{{d2}}°**: adds the longitude difference without the constant of the
      cone

      - **{{d3}}°**: subtracts the longitude difference without the constant of
      the cone

      - **{{d4}}°**: uses the cosine instead of the sine for the constant of the
      cone
- id: QF2LWJRLA
  docId: "061.04"
  relatedQuestions:
    - QV0WFJSV1
  externalIds:
    - ATPLQ-614820
  annexes: []
  learningObjectives:
    - 061.04.02.03.02
  template:
    type: calculation
    question: >-
      On a Mercator chart the scale at the Equator is 1 inch = {{eq_nm}} NM.


      What is the scale of the chart at a latitude of {{lat}}°? Give the
      denominator N of 1 : N.
    variables:
      - id: eq_nm
        label: Distance on the Earth per inch at the Equator
        unit: NM
      - id: lat
        label: Latitude
        unit: °
    answer:
      formula: eq_nm * 1852 * 100 / 2.54 * cos(lat)
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: eq_nm * 1852 * 100 / 2.54 / cos(lat)
      - id: d2
        formula: eq_nm * 1852 * 100 / 2.54 * sin(lat)
      - id: d3
        formula: eq_nm * 1852 * 100 / 2.54 * cos(lat) / 10
      - id: d4
        formula: eq_nm * 1852 * 100 * cos(lat)
    presets:
      - id: p1
        values:
          eq_nm: 28
          lat: 34
      - id: p2
        values:
          eq_nm: 25
          lat: 20
      - id: p3
        values:
          eq_nm: 30
          lat: 60
    explanation: >-
      On a Mercator chart the scale gets larger towards the poles, so the
      denominator of 1 : N gets smaller. The scale at a latitude is the Equator
      scale multiplied by the cosine of that latitude.


      **Solution**


      - Equator scale: 1 inch = {{eq_nm}} NM = {{= eq_nm * 1852 * 100}} cm on
      the ground, so the scale is 1 : {{= eq_nm * 1852 * 100 / 2.54}}

      - Scale at {{lat}}°: {{f: eq_nm * 1852 * 100 / 2.54 * cos(lat)}} = {{n:
      eq_nm * 1852 * 100 / 2.54 * cos(lat)}} = 1 : **{{answer}}**


      **Why the other answers are wrong**


      - **1 : {{d1}}**: the cosine was divided instead of multiplied, which
      makes the scale too small.

      - **1 : {{d2}}**: the sine of the latitude was used instead of the cosine.

      - **1 : {{d3}}**: a factor of ten slipped into the calculation.

      - **1 : {{d4}}**: the inch was not converted to 2.54 cm, so the
      denominator is 2.54 times too large.
