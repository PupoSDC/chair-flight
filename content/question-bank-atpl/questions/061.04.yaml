- id: QUEZA2FUP
  docId: "061.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618028
    - AVEXAM-82702
  annexes:
    - jeppesen-vfr-chart-21-straubing
  learningObjectives:
    - 061.01.04.03.01
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Both aerodromes lie on the same meridian, 012°31'E. Refer to the chart.

      - Departure: {{lat1_deg}}°{{lat1_min}}'N
      - Destination: {{lat2_deg}}°{{lat2_min}}'N
      - Flight time: {{mins}} min

      What is the ground speed?
    variables:
      - id: lat1_deg
        label: Departure latitude, degrees
        unit: °
      - id: lat1_min
        label: Departure latitude, minutes
        unit: "'"
      - id: lat2_deg
        label: Destination latitude, degrees
        unit: °
      - id: lat2_min
        label: Destination latitude, minutes
        unit: "'"
      - id: mins
        label: Flight time
        unit: min
    answer:
      formula: ((lat2_deg * 60 + lat2_min) - (lat1_deg * 60 + lat1_min)) / mins * 60
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: ((lat2_deg * 60 + lat2_min) - (lat1_deg * 60 + lat1_min)) / mins * 30
      - id: d2
        formula: ((lat2_deg * 60 + lat2_min) - (lat1_deg * 60 + lat1_min)) / mins * 60 *
          1.852
      - id: d3
        formula: ((lat2_deg * 60 + lat2_min) - (lat1_deg * 60 + lat1_min)) / mins
      - id: d4
        formula: (lat2_deg - lat1_deg) * 60 / mins * 60
    presets:
      - id: p1
        values:
          lat1_deg: 48
          lat1_min: 54
          lat2_deg: 49
          lat2_min: 12
          mins: 6
      - id: p2
        values:
          lat1_deg: 52
          lat1_min: 20
          lat2_deg: 52
          lat2_min: 50
          mins: 9
      - id: p3
        values:
          lat1_deg: 50
          lat1_min: 5
          lat2_deg: 50
          lat2_min: 35
          mins: 12
    explanation: >-
      Two points on the same meridian are separated by their difference in
      latitude, and one minute of latitude is one nautical mile. The distance is
      divided by the flight time, and the result is converted to an hourly
      speed.


      **Solution**


      - Latitude difference = {{= (lat2_deg * 60 + lat2_min) - (lat1_deg * 60 +
      lat1_min)}} NM

      - {{f: ((lat2_deg * 60 + lat2_min) - (lat1_deg * 60 + lat1_min)) / mins *
      60}} = {{n: ((lat2_deg * 60 + lat2_min) - (lat1_deg * 60 + lat1_min)) /
      mins * 60}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses 30 instead of 60 minutes per hour.

      - **{{d2}} kt**: converts the distance into kilometres instead of nautical
      miles.

      - **{{d3}} kt**: forgets to convert the minutes into hours.

      - **{{d4}} kt**: uses whole degrees of latitude, 60 NM each, and ignores
      the minutes.
