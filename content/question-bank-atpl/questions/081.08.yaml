  template:
    type: calculation
    question: |-
      Determine the approximate lift for an aircraft in a steady climb. Given:

      - Climb angle: {{angle}}°
      - Weight: {{weight}} N
      - Drag: {{drag}} N
      - Thrust: {{thrust}} N

      Give the answer in newtons, rounded to the nearest 100 000 N.
    variables:
      - id: angle
        label: Climb angle
        unit: °
      - id: weight
        label: Weight
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: thrust
        label: Thrust
        unit: N
    answer:
      formula: round(weight * cos(angle) / 100000) * 100000
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: weight
      - id: d2
        formula: thrust
      - id: d3
        formula: round(weight * sin(angle) / 100000) * 100000
      - id: d4
        formula: round((weight - drag) * cos(angle) / 100000) * 100000
    presets:
      - id: p1
        values:
          angle: 9
          weight: 1250000
          drag: 300000
          thrust: 600000
      - id: p2
        values:
          angle: 20
          weight: 900000
          drag: 200000
          thrust: 500000
      - id: p3
        values:
          angle: 12
          weight: 450000
          drag: 150000
          thrust: 250000
    explanation: >-
      In a steady climb, lift is the part of the weight that acts at right
      angles to the flight path, so lift is approximately weight multiplied by
      the cosine of the climb angle. Drag and thrust act along the flight path
      and do not change the lift to a good approximation.


      **Solution**


      {{f: weight * cos(angle)}} = {{n: weight * cos(angle)}} N, which rounds to
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: ignores the climb angle and uses the full weight as the
      lift.

      - **{{d2}} N**: uses the thrust as the lift, confusing the two forces.

      - **{{d3}} N**: uses the sine of the angle instead of the cosine.

      - **{{d4}} N**: subtracts the drag from the weight first, but drag does
      not reduce lift in this way.
