  annexes: []
  learningObjectives:
    - "081.08"
  template:
    type: calculation
    question: >-
      You have an engine failure in a single-engined aircraft and need to glide
      to a safe landing site. Given:


      - Distance to the landing site: {{dist}} km

      - Glide ratio with the engine out: {{ld}} : 1


      What is the minimum height the aircraft must be at for this to be
      possible? Give the answer in metres.
    variables:
      - id: dist
        label: Distance to landing site
        unit: km
      - id: ld
        label: Glide ratio
        unit: ""
    answer:
      formula: dist * 1000 / ld
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 1000
      - id: d2
        formula: dist * 1000 * ld
      - id: d3
        formula: dist * 1000 / ld * 3.28084
      - id: d4
        formula: dist * 1000 / (ld + 1)
    presets:
      - id: p1
        values:
          dist: 5
          ld: 10
      - id: p2
        values:
          dist: 12
          ld: 8
      - id: p3
        values:
          dist: 3
          ld: 12
    explanation: >-
      The glide ratio tells you how far the aircraft travels forward for each
      unit of height it loses. With a glide ratio of {{ld}} : 1, the height
      needed is the distance divided by the glide ratio.


      **Solution**


      The distance in metres is {{= dist * 1000}} m.


      {{f: dist * 1000 / ld}} = {{n: dist * 1000 / ld}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: forgets the glide ratio and uses the distance as the
      height.

      - **{{d2}} m**: multiplies by the glide ratio instead of dividing, which
      would need a much higher starting height.

      - **{{d3}} m**: multiplies by 3.28 (metres to feet), so the figure is in
      feet, not metres.

      - **{{d4}} m**: adds 1 to the glide ratio, a small slip that gives a
      slightly wrong height.
