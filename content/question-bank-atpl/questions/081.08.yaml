  template:
    type: calculation
    question: >-
      Determine the lift in a straight and steady glide with a glide angle of
      {{angle}} degrees. Consider the following values:


      - Mass: {{mass}} kg

      - Drag: {{drag}} N


      Assume that g = 10 m/s².
    variables:
      - id: mass
        label: Mass
        unit: kg
      - id: drag
        label: Drag
        unit: N
      - id: angle
        label: Glide angle
        unit: °
    answer:
      formula: mass * 10 * cos(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: mass * 10 * sin(angle)
      - id: d2
        formula: mass * 10
      - id: d3
        formula: mass * 10 * cos(angle) - drag
      - id: d4
        formula: drag * cos(angle)
    presets:
      - id: p1
        values:
          mass: 10455
          drag: 87500
          angle: 30
      - id: p2
        values:
          mass: 8200
          drag: 60000
          angle: 20
      - id: p3
        values:
          mass: 15000
          drag: 80000
          angle: 40
    explanation: >-
      In a steady glide the lift is the part of the weight that acts at right
      angles to the flight path. The weight is the mass times g, here 10 m/s²,
      and the lift is that weight multiplied by the cosine of the glide angle.
      The drag acts along the flight path and does not change the lift.


      **Solution**


      {{f: mass * 10 * cos(angle)}} = {{n: mass * 10 * cos(angle)}} =
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: uses the sine of the glide angle instead of the cosine.

      - **{{d2}} N**: uses the full weight and forgets the glide angle.

      - **{{d3}} N**: subtracts the drag from the lift, but drag acts along the
      flight path.

      - **{{d4}} N**: uses the drag instead of the weight.
