  template:
    type: calculation
    question: |-
      Calculate the turn radius of an aircraft in a steady level turn, given:

      - TAS: {{tas}} kt
      - Bank angle: {{bank}}°
      - Acceleration of gravity: 10 m/s²

      What is the turn radius?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: (tas * 1852 / 3600)^2 / (10 * tan(bank))
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: tas^2 / (10 * tan(bank))
      - id: d2
        formula: (tas * 1852 / 3600)^2 / (10 * cos(bank))
      - id: d3
        formula: 2 * (tas * 1852 / 3600)^2 / (10 * tan(bank))
      - id: d4
        formula: (tas * 1852 / 3600) / (10 * tan(bank))
    presets:
      - id: p1
        values:
          tas: 220
          bank: 10
      - id: p2
        values:
          tas: 120
          bank: 60
      - id: p3
        values:
          tas: 250
          bank: 30
    explanation: >-
      The turn radius shows how wide a turn is. It grows with the square of the
      speed and gets smaller as the bank angle gets steeper. The formula needs
      the speed in metres per second, so the TAS is converted from knots first.


      **Solution**


      {{f: (tas * 1852 / 3600)^2 / (10 * tan(bank))}} = {{n: (tas * 1852 /
      3600)^2 / (10 * tan(bank))}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: uses the TAS in knots without converting it to metres per
      second.

      - **{{d2}} m**: uses the cosine of the bank angle instead of the tangent.

      - **{{d3}} m**: gives the diameter of the turn instead of the radius.

      - **{{d4}} m**: uses the speed once instead of squaring it.
