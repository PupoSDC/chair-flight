- id: QIZDHL2F1
  docId: "081.08"
  relatedQuestions:
    - QASCBAXB
  externalIds:
    - ATPLQ-817426
    - AVEXAM-55966
    - BGS-812428
  annexes: []
  learningObjectives:
    - "081.08"
  template:
    type: calculation
    question: >-
      An aeroplane loses all engines and glides with no power. Given the
      following data:


      - Altitude: {{h}} ft

      - Lift-to-drag ratio: {{ld}} : 1

      - Average TAS: {{tas}} kt

      - Headwind component: {{hw}} kt


      What is the maximum glide range over the ground in NM? Assume 1 NM = 6080
      ft.
    variables:
      - id: h
        label: Altitude
        unit: ft
      - id: ld
        label: Lift-to-drag ratio
        unit: :1
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
    answer:
      formula: ld * h / 6080 * (tas - hw) / tas
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: ld * h / 6080
      - id: d2
        formula: ld * h / 6080 * (tas + hw) / tas
      - id: d3
        formula: ld * h / 6080 * tas / (tas - hw)
      - id: d4
        formula: ld * h / 6080 * (tas - hw) / (tas + hw)
    presets:
      - id: p1
        values:
          h: 10000
          ld: 15
          tas: 200
          hw: 20
      - id: p2
        values:
          h: 8000
          ld: 12
          tas: 150
          hw: 10
    explanation: >-
      The still-air glide distance is the glide ratio times the height. A
      headwind reduces the speed over the ground, so the distance covered over
      the ground shrinks by the ratio of ground speed to airspeed.


      **Solution**


      - Still-air glide distance: {{f: ld * h / 6080}} = {{n: ld * h / 6080}} =
      {{= ld * h / 6080}} NM

      - Ground speed: {{= tas - hw}} kt

      - Distance over the ground: {{f: ld * h / 6080 * (tas - hw) / tas}} = {{n:
      ld * h / 6080 * (tas - hw) / tas}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: ignores the headwind.

      - **{{d2}} NM**: adds the headwind to the airspeed instead of subtracting
      it.

      - **{{d3}} NM**: inverts the speed ratio.

      - **{{d4}} NM**: divides by the airspeed plus the headwind.
