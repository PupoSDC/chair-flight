  template:
    type: calculation
    question: The pilot of an aircraft changes its heading to the right, from
      {{h1}}° to {{h2}}°, and makes a rate-one turn. What is the duration of
      this manoeuvre in seconds?
    variables:
      - id: h1
        label: Initial heading
        unit: °
      - id: h2
        label: New heading
        unit: °
    answer:
      formula: abs(h2 - h1) / 3
      unit: seconds
      decimals: 0
    distractors:
      - id: d1
        formula: abs(h2 - h1) / 4
      - id: d2
        formula: abs(h2 - h1) / 2
      - id: d3
        formula: abs(h2 - h1) * 3
      - id: d4
        formula: abs(h2 - h1) / 3 + 5
    presets:
      - id: p1
        values:
          h1: 214
          h2: 334
      - id: p2
        values:
          h1: 90
          h2: 150
    explanation: >-
      A rate-one turn changes the heading by 3° every second, so the time taken
      is the heading change divided by 3. The heading change is the difference
      between the new heading and the initial heading.


      **Solution**


      - Heading change = {{= abs(h2 - h1)}}°

      - Time = heading change / 3 = {{f: abs(h2 - h1) / 3}} = {{n: abs(h2 - h1)
      / 3}} = **{{answer}} seconds**


      **Why the other answers are wrong**


      - **{{d1}} seconds**: divides by 4 instead of 3.

      - **{{d2}} seconds**: divides by 2 instead of 3.

      - **{{d3}} seconds**: multiplies by 3 instead of dividing.

      - **{{d4}} seconds**: adds a 5 second delay to the correct time.
