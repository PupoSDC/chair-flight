- id: QGJUTIIQ
  docId: "081.08"
  relatedQuestions: []
  externalIds:
    - ATPLQ-819128
    - BGS-811148
    - ATPLGS-125935
    - AVEXAM-1788
  annexes: []
  learningObjectives:
    - 081.08.01.05.01
  template:
    type: calculation
    question: "If an aeroplane performs a steady co-ordinated horizontal turn at a
      TAS of {{tas}} kt and a turn radius of {{radius}} m, the load factor (n)
      will be approximately:"
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: radius
        label: Turn radius
        unit: m
    answer:
      formula: sqrt(1 + ((tas * 0.5144) ^ 2 / (9.81 * radius)) ^ 2)
      unit: ""
      decimals: 1
    distractors:
      - id: d1
        formula: (tas * 0.5144) ^ 2 / (9.81 * radius)
      - id: d2
        formula: sqrt(1 + (tas * 0.5144) ^ 2 / (9.81 * radius))
      - id: d3
        formula: 1 + (tas * 0.5144) ^ 2 / (9.81 * radius)
    presets:
      - id: p1
        values:
          tas: 200
          radius: 2000
      - id: p2
        values:
          tas: 250
          radius: 3000
      - id: p3
        values:
          tas: 220
          radius: 1000
    explanation: >-
      In a steady co-ordinated turn the bank angle is set by the speed and the
      radius of the turn: the speed squared divided by the product of g and the
      radius gives the tangent of the bank angle. The load factor is the lift
      divided by the weight, which equals the square root of one plus that ratio
      squared.


      **Solution**


      Speed in metres per second: {{= tas * 0.5144}} m/s


      Ratio: {{f: (tas * 0.5144) ^ 2 / (9.81 * radius)}} = {{n: (tas * 0.5144) ^
      2 / (9.81 * radius)}}


      Load factor: {{f: sqrt(1 + ((tas * 0.5144) ^ 2 / (9.81 * radius)) ^ 2)}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: gives the ratio itself, which is the tangent of the bank
      angle, not the load factor.

      - **{{d2}}**: forgets to square the ratio inside the root.

      - **{{d3}}**: adds 1 to the ratio, without squaring it or taking the
      square root.
