- id: QZTORWNO
  docId: "081.08"
  relatedQuestions:
    - QZWUKZTM
  externalIds:
    - ATPLQ-818659
  annexes: []
  learningObjectives:
    - 081.08.01.02.07
  template:
    type: calculation
    question: |-
      Determine the thrust in a steady climb, given:

      - Climb angle: {{angle}}°
      - Lift: {{lift}} N
      - Drag: {{drag}} N
      - Mass: {{mass}} kg

      What is the thrust in N?
    variables:
      - id: angle
        label: Climb angle
        unit: °
      - id: lift
        label: Lift
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: mass
        label: Mass
        unit: kg
    answer:
      formula: drag + lift * tan(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: drag
      - id: d2
        formula: drag + mass * 10 * sin(angle)
      - id: d3
        formula: drag + lift * sin(angle)
      - id: d4
        formula: drag + lift
    presets:
      - id: p1
        values:
          angle: 30
          lift: 127436
          drag: 120500
          mass: 15000
      - id: p2
        values:
          angle: 20
          lift: 210000
          drag: 150000
          mass: 20000
      - id: p3
        values:
          angle: 10
          lift: 180000
          drag: 100000
          mass: 12000
    explanation: >-
      In a steady climb the thrust must overcome the drag and the part of the
      weight that acts back along the flight path. The lift balances the
      weight's component across the flight path, so that weight component equals
      the lift multiplied by the tangent of the climb angle. The mass is not
      needed.


      **Solution**


      {{f: drag + lift * tan(angle)}} = {{n: drag + lift * tan(angle)}} =
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: only the drag, leaving out the weight component.

      - **{{d2}} N**: uses the mass as the weight with g = 10 m/s², instead of
      the lift.

      - **{{d3}} N**: uses the sine of the angle on the lift instead of the
      tangent.

      - **{{d4}} N**: adds the lift to the drag, which has no meaning here.
- id: QZWUKZTM
  docId: "081.08"
  relatedQuestions:
    - QZTORWNO
  externalIds:
    - ATPLQ-812110
  annexes: []
  learningObjectives:
    - 081.08.01.02.07
  template:
    type: calculation
    question: |-
      Determine the thrust in a steady climb, given:

      - Climb angle: {{angle}}°
      - Drag: {{drag}} N
      - Weight: {{weight}} N

      What is the thrust required?
    variables:
      - id: angle
        label: Climb angle
        unit: °
      - id: drag
        label: Drag
        unit: N
      - id: weight
        label: Weight
        unit: N
    answer:
      formula: drag + weight * sin(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: drag
      - id: d2
        formula: weight * sin(angle)
      - id: d3
        formula: drag + weight
      - id: d4
        formula: drag + weight * cos(angle)
    presets:
      - id: p1
        values:
          angle: 9
          drag: 300000
          weight: 5750000
      - id: p2
        values:
          angle: 6
          drag: 250000
          weight: 4000000
      - id: p3
        values:
          angle: 12
          drag: 400000
          weight: 8000000
    explanation: >-
      In a steady climb the thrust must overcome the drag and also the part of
      the weight that acts back along the flight path. That part is the weight
      multiplied by the sine of the climb angle, so the thrust is the drag plus
      the weight times the sine of the angle.


      **Solution**


      {{f: drag + weight * sin(angle)}} = {{n: drag + weight * sin(angle)}} =
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: only the drag, leaving out the weight component.

      - **{{d2}} N**: only the weight component, leaving out the drag.

      - **{{d3}} N**: adds the full weight instead of its component along the
      flight path.

      - **{{d4}} N**: uses the cosine, which gives the component perpendicular
      to the flight path.
