  externalIds:
    - ATPLQ-818508
  annexes: []
  learningObjectives:
    - 081.08.01.04.03
  template:
    type: calculation
    question: >-
      A single-engine aeroplane loses its engine. In still air it glides with
      the following data:


      - Altitude at engine failure: {{h}} ft

      - Lift-to-drag ratio: {{ld}} : 1


      What is the expected gliding distance in NM? Assume 1 NM = 6080 ft.
    variables:
      - id: h
        label: Altitude
        unit: ft
      - id: ld
        label: Lift-to-drag ratio
        unit: :1
    answer:
      formula: ld * h / 6080
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: h / 1000
      - id: d2
        formula: ld * h / 2000
      - id: d3
        formula: ld * h / 6080 + h / 6080
      - id: d4
        formula: ld * h / 6080 * 2
    presets:
      - id: p1
        values:
          h: 10000
          ld: 9
      - id: p2
        values:
          h: 7000
          ld: 12
    explanation: >-
      In still air a glider or a single-engine aeroplane with no power covers
      about its lift-to-drag ratio times its height. Dividing the result by 6080
      ft per NM gives the distance in nautical miles.


      **Solution**


      - Distance in feet: {{= ld * h}} ft

      - Gliding distance: {{f: ld * h / 6080}} = {{n: ld * h / 6080}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: ignores the glide ratio and only divides the height.

      - **{{d2}} NM**: divides by 2000 instead of converting with 6080 ft per
      NM.

      - **{{d3}} NM**: adds an extra term (height divided by 6080) that does not
      belong.

      - **{{d4}} NM**: doubles the result.
