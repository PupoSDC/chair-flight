  template:
    type: calculation
    question: >-
      Approximately how long does it take to fly one complete circle in a
      horizontal, steady, coordinated turn, given:


      - Bank angle: {{bank}}°

      - TAS: {{tas}} kt


      Use 1 kt = 0.5144 m/s and g = 9.81 m/s². Give the time in seconds.
    variables:
      - id: bank
        label: Bank angle
        unit: °
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: round(2 * pi * tas * 0.5144 / (9.81 * tan(bank)) / 5) * 5
      unit: s
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * pi * tas * 0.5144 / (9.81 * sin(bank))
      - id: d2
        formula: 2 * pi * tas * 0.5144 / 9.81
      - id: d3
        formula: pi * tas * 0.5144 / (9.81 * tan(bank))
      - id: d4
        formula: 2 * pi * tas * 0.5144 / (9.81 * tan(bank)) / 60
    presets:
      - id: p1
        values:
          bank: 15
          tas: 530
      - id: p2
        values:
          bank: 45
          tas: 200
      - id: p3
        values:
          bank: 30
          tas: 300
    explanation: >-
      In a coordinated turn the bank angle sets the radius: radius = speed
      squared divided by (g times the tangent of the bank angle). One circle is
      the circumference divided by the speed, so the time is 2 times pi times
      the speed divided by (g times the tangent of the bank angle), with the
      speed in metres per second.


      **Solution**


      Unrounded time = {{f: 2 * pi * tas * 0.5144 / (9.81 * tan(bank))}} = {{n:
      2 * pi * tas * 0.5144 / (9.81 * tan(bank))}} s


      Rounded to the nearest 5 s, as an approximate time is asked: **{{answer}}
      s**


      **Why the other answers are wrong**


      - **{{d1}} s**: uses the sine of the bank angle instead of the tangent.

      - **{{d2}} s**: leaves out the tangent of the bank angle entirely.

      - **{{d3}} s**: describes half a circle instead of a full circle.

      - **{{d4}} s**: gives the time in minutes instead of seconds.
