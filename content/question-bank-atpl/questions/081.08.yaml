- id: QMXDMJMQ
  docId: "081.08"
  relatedQuestions:
    - QC4BMDHZT
  externalIds:
    - ATPLQ-813032
    - ATPLQ-819476
    - BGS-811151
  annexes: []
  learningObjectives:
    - 081.08.01.05.06
  template:
    type: calculation
    question: |-
      Determine the radius of a steady, level, coordinated turn, given:

      - TAS: {{tas}} kt
      - Bank angle: {{bank}}°
      - g: {{g}} m/s²

      Use 1 kt = 0.5144 m/s. Give the radius in metres.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: bank
        label: Bank angle
        unit: °
      - id: g
        label: g
        unit: m/s²
    answer:
      formula: (tas * 0.5144) ^ 2 / (g * tan(bank))
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: (tas * 0.5144) ^ 2 / (g * sin(bank))
      - id: d2
        formula: (tas * 0.5144) ^ 2 / (g * tan(bank / 2))
      - id: d3
        formula: tas * 0.5144 / (g * tan(bank))
      - id: d4
        formula: 2 * (tas * 0.5144) ^ 2 / (g * tan(bank))
    presets:
      - id: p1
        values:
          tas: 300
          bank: 45
          g: 10
      - id: p2
        values:
          tas: 220
          bank: 10
          g: 9.81
      - id: p3
        values:
          tas: 250
          bank: 30
          g: 9.81
    explanation: >-
      In a level coordinated turn the bank angle makes the lift point sideways,
      and the turn radius is the speed squared divided by (g times the tangent
      of the bank angle). The speed must be in metres per second, so the knots
      are converted first.


      **Solution**


      {{f: (tas * 0.5144) ^ 2 / (g * tan(bank))}} = {{n: (tas * 0.5144) ^ 2 / (g
      * tan(bank))}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: uses the sine of the bank angle instead of the tangent.

      - **{{d2}} m**: uses half the bank angle.

      - **{{d3}} m**: does not square the speed.

      - **{{d4}} m**: uses the diameter, which is twice the radius.
