    - ATPLQ-814890
    - ATPLGS-628103
    - AVEXAM-98910
  annexes: []
  learningObjectives:
    - 081.08.01.04.03
  template:
    type: calculation
    question: >-
      Calculate the still-air gliding distance for a single-engined aeroplane.
      Assume 1 NM = 6 080 ft.


      - L/D ratio: {{ld}} : 1

      - Altitude: {{alt}} ft


      Give the answer in NM.
    variables:
      - id: ld
        label: L/D ratio
        unit: ""
      - id: alt
        label: Altitude
        unit: ft
    answer:
      formula: alt * ld / 6080
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: alt / 6080
      - id: d2
        formula: alt * ld / 1852
      - id: d3
        formula: alt / ld / 6080
      - id: d4
        formula: alt * (ld - 1) / 6080
    presets:
      - id: p1
        values:
          ld: 9
          alt: 5000
      - id: p2
        values:
          ld: 12
          alt: 4000
      - id: p3
        values:
          ld: 8
          alt: 10000
    explanation: >-
      The gliding distance depends on how far the aircraft moves forward for
      each unit of height it loses. With an L/D ratio of {{ld}} : 1, the
      still-air distance in feet is the height multiplied by the L/D ratio.
      Dividing by 6 080 ft per NM gives the distance in nautical miles.


      **Solution**


      The distance in feet is {{= alt * ld}} ft.


      {{f: alt * ld / 6080}} = {{n: alt * ld / 6080}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: ignores the L/D ratio and only converts the height into
      nautical miles.

      - **{{d2}} NM**: divides by 1 852 (the length of a nautical mile in
      metres) when the height is in feet.

      - **{{d3}} NM**: divides by the L/D ratio, so the aircraft appears to
      glide a short distance.

      - **{{d4}} NM**: uses one less than the L/D ratio, understating the glide.
