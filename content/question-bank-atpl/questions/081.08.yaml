- id: QPFILLK1W
  docId: "081.08"
  relatedQuestions:
    - QCTAUYFM
  externalIds:
    - ATPLQ-812694
  annexes: []
  learningObjectives:
    - "081.08"
  template:
    type: calculation
    question: >-
      Determine the one-engine-inoperative climb angle, in degrees, of a
      twin-engine aeroplane. Given:


      - Weight: {{weight}} N

      - Drag: {{drag}} N

      - Thrust: {{thrust}} N per engine
    variables:
      - id: weight
        label: Weight
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: thrust
        label: Thrust per engine
        unit: N
    answer:
      formula: asin((thrust - drag) / weight)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: asin((2 * thrust - drag) / weight)
      - id: d2
        formula: 2 * asin((thrust - drag) / weight)
      - id: d3
        formula: atan((thrust + drag) / weight)
      - id: d4
        formula: acos((thrust - drag) / weight)
    presets:
      - id: p1
        values:
          weight: 2720000
          drag: 180000
          thrust: 370000
      - id: p2
        values:
          weight: 2000000
          drag: 100000
          thrust: 350000
    explanation: >-
      In a steady climb the thrust minus the drag is the force that climbs the
      aeroplane. The climb angle is the arcsine of that net force divided by the
      weight. With one engine inoperative, only one engine's thrust is left.


      **Solution**


      - Net force along the flight path = thrust - drag = {{= thrust - drag}} N

      - {{f: asin((thrust - drag) / weight)}} = {{n: asin((thrust - drag) /
      weight)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the thrust of both engines, as if none had failed.

      - **{{d2}}°**: doubles the climb angle.

      - **{{d3}}°**: adds the drag instead of subtracting it, and uses the
      tangent function.

      - **{{d4}}°**: uses the arccosine instead of the arcsine.
- id: QPIGSG8KR
  docId: "081.08"
  relatedQuestions: []
  externalIds:
    - ATPLQ-812714
    - ATPLQ-819095
  annexes: []
  learningObjectives:
    - "081.08"
  template:
    type: calculation
    question: >-
      An aircraft is performing a co-ordinated level turn with the following
      data:


      - Mass: {{mass}} kg

      - Bank angle: {{bank}}°

      - g: {{g}} m/s²


      What is the magnitude of the centripetal force (in N)?
    variables:
      - id: mass
        label: Mass
        unit: kg
      - id: bank
        label: Bank angle
        unit: °
      - id: g
        label: Gravitational acceleration
        unit: m/s²
    answer:
      formula: round(mass * g * tan(bank))
      unit: N
      decimals: 2
    distractors:
      - id: d1
        formula: mass * g / cos(bank)
      - id: d2
        formula: mass * g * sin(bank)
      - id: d3
        formula: mass * g / tan(bank)
      - id: d4
        formula: mass * g * tan(bank) / 10
    presets:
      - id: p1
        values:
          mass: 60000
          bank: 30
          g: 10
      - id: p2
        values:
          mass: 60000
          bank: 60
          g: 9.81
    explanation: >-
      The lift balances the weight over the cosine of the bank angle. Its
      horizontal part is the centripetal force, which equals the weight times
      the tangent of the bank angle.


      **Solution**


      {{f: mass * g * tan(bank)}} = {{n: mass * g * tan(bank)}} = **{{answer}}
      N**


      **Why the other answers are wrong**


      - **{{d1}} N**: uses the total lift instead of its horizontal part.

      - **{{d2}} N**: uses the sine of the bank angle instead of the tangent.

      - **{{d3}} N**: uses the cotangent of the bank angle, which inverts the
      ratio.

      - **{{d4}} N**: divides the force by ten, a slip in the units.
