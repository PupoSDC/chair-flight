  template:
    type: calculation
    question: >-
      An aeroplane is on a steady gliding descent at a glide angle of
      {{angle}}°. Given the following information, determine the drag:


      - Weight: {{weight}} N

      - Lift: {{lift}} N


      Give the answer in N.
    variables:
      - id: angle
        label: Glide angle
        unit: °
      - id: weight
        label: Weight
        unit: N
      - id: lift
        label: Lift
        unit: N
    answer:
      formula: weight * sin(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: weight * cos(angle)
      - id: d2
        formula: weight / sin(angle)
      - id: d3
        formula: weight * tan(angle)
      - id: d4
        formula: lift * sin(angle)
    presets:
      - id: p1
        values:
          angle: 20
          weight: 100500
          lift: 94439
      - id: p2
        values:
          angle: 15
          weight: 80000
          lift: 75000
    explanation: >-
      In a steady glide the drag must balance the part of the weight that pulls
      the aeroplane down the flight path. That part is the weight times the sine
      of the glide angle. The lift balances the weight at right angles to the
      flight path, so it does not enter this calculation.


      **Solution**


      - Drag: {{f: weight * sin(angle)}} = {{n: weight * sin(angle)}} =
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: uses the cosine instead of the sine, which gives the lift.

      - **{{d2}} N**: divides by the sine instead of multiplying by it.

      - **{{d3}} N**: uses the tangent instead of the sine of the angle.

      - **{{d4}} N**: uses the lift instead of the weight.
