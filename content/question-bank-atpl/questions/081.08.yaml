  annexes: []
  learningObjectives:
    - 081.08.01.02.03
  template:
    type: calculation
    question: >-
      For a straight, steady, wings-level climb of a {{engines}}-engine
      aeroplane, determine the one-engine-inoperative climb gradient. Given:


      - Aeroplane mass: {{mass}} kg

      - Lift/drag ratio: {{ld}}

      - Thrust per engine: {{thrust}} N

      - Assumed g: {{g}} m/s²


      Give the gradient as a percentage.
    variables:
      - id: engines
        label: Number of engines
        unit: ""
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift/drag ratio
        unit: ""
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: g
        label: Gravity
        unit: m/s²
    answer:
      formula: 100 * ((engines - 1) * thrust / (mass * g) - 1 / ld)
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: 100 * (engines * thrust / (mass * g) - 1 / ld)
      - id: d2
        formula: 100 * (engines - 1) * thrust / (mass * g)
      - id: d3
        formula: 100 * ((engines - 1) * thrust - mass * g / ld) / mass
      - id: d4
        formula: 100 * (thrust / (mass * g) - 1 / ld)
    presets:
      - id: p1
        values:
          engines: 3
          mass: 50000
          ld: 12
          thrust: 28000
          g: 10
      - id: p2
        values:
          engines: 3
          mass: 40000
          ld: 14
          thrust: 25000
          g: 10
    explanation: >-
      In a steady climb the thrust that is still available has to cover the
      drag, and the rest of the force climbs the aeroplane. With the lift equal
      to the weight, the drag is the weight divided by the lift/drag ratio. The
      gradient is the excess thrust divided by the weight, given as a
      percentage. With one engine inoperative, only the remaining engines
      produce thrust.


      **Solution**


      - Weight = mass × g = {{= mass * g}} N

      - Thrust from the remaining engines = ({{engines}} - 1) × {{thrust}} = {{=
      (engines - 1) * thrust}} N

      - Drag = weight / (lift/drag ratio) = {{= mass * g / ld}} N

      - {{f: 100 * ((engines - 1) * thrust / (mass * g) - 1 / ld)}} = {{n: 100 *
      ((engines - 1) * thrust / (mass * g) - 1 / ld)}} = **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: counts all the engines, including the one that has failed.

      - **{{d2}}%**: ignores the drag.

      - **{{d3}}%**: divides by the mass instead of the weight, so the gravity
      term is lost.

      - **{{d4}}%**: uses the thrust of only one engine.
