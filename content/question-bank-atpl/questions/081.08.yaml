      formula: (tas * 0.5144) ^ 2 / (g * tan(bank)) / 1000
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * (tas * 0.5144) ^ 2 / (g * tan(bank)) / 1000
      - id: d2
        formula: tas * 0.5144 / (g * tan(bank))
      - id: d3
        formula: (tas * 0.5144) ^ 2 / (g * tan(bank))
      - id: d4
        formula: tas ^ 2 / (g * tan(bank)) / 1000
    presets:
      - id: p1
        values:
          tas: 200
          bank: 45
          g: 9.81
      - id: p2
        values:
          tas: 500
          bank: 30
          g: 9.81
      - id: p3
        values:
          tas: 250
          bank: 20
          g: 9.81
    explanation: >-
      In a level coordinated turn the radius is the speed squared divided by (g
      times the tangent of the bank angle). The speed must be in metres per
      second, and the result in metres is divided by 1000 to give kilometres.


      **Solution**


      {{f: (tas * 0.5144) ^ 2 / (g * tan(bank)) / 1000}} = {{n: (tas * 0.5144) ^
      2 / (g * tan(bank)) / 1000}} = **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: uses the diameter, which is twice the radius.

      - **{{d2}} km**: does not square the speed.

      - **{{d3}} km**: gives the radius in metres but labels it as kilometres.

      - **{{d4}} km**: uses knots as if they were metres per second.
