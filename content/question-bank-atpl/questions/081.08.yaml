  learningObjectives:
    - 081.08.01.04.03
  template:
    type: calculation
    question: >-
      You are flying from town A to airport B in a single-engine piston
      aeroplane when you experience an engine failure. Calculate the minimum
      height at A needed to reach airport B in a glide.


      - Elevation of A: {{elev}} m

      - Distance from A to B: {{dist}} km

      - L/D ratio: {{ld}}


      What is the minimum height at A (in m)?
    variables:
      - id: elev
        label: Elevation of A
        unit: m
      - id: dist
        label: Distance from A to B
        unit: km
      - id: ld
        label: L/D ratio
        unit: ""
    answer:
      formula: dist * 1000 / ld
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 1000 / ld + elev
      - id: d2
        formula: dist * 1000 / ld - elev
      - id: d3
        formula: dist * ld
      - id: d4
        formula: (dist * 1000 + elev) / ld
    presets:
      - id: p1
        values:
          elev: 300
          dist: 60
          ld: 30
      - id: p2
        values:
          elev: 500
          dist: 80
          ld: 25
    explanation: >-
      The glide ratio gives the horizontal distance covered for each unit of
      height lost. The height needed is the distance in metres divided by the
      glide ratio.


      **Solution**


      {{f: dist * 1000 / ld}} = {{n: dist * 1000 / ld}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: adds the elevation of A to the glide height.

      - **{{d2}} m**: subtracts the elevation of A from the glide height.

      - **{{d3}} m**: multiplies the distance by the glide ratio instead of
      dividing.

      - **{{d4}} m**: adds the elevation to the distance before dividing.
