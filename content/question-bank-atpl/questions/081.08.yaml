  template:
    type: calculation
    question: "When an aeroplane performs a straight steady climb with a
      {{gradient}}% climb gradient, the load factor is equal to:"
    variables:
      - id: gradient
        label: Climb gradient
        unit: "%"
    answer:
      formula: cos(atan(gradient / 100))
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: 1 / cos(atan(gradient / 100))
      - id: d2
        formula: "1"
      - id: d3
        formula: 1 - gradient / 100
      - id: d4
        formula: sin(atan(gradient / 100))
    presets:
      - id: p1
        values:
          gradient: 20
      - id: p2
        values:
          gradient: 25
      - id: p3
        values:
          gradient: 30
    explanation: >-
      In a steady climb the lift is smaller than the weight, because part of the
      weight acts back along the flight path. The load factor is the lift
      divided by the weight, which equals the cosine of the climb angle. A climb
      gradient is the tangent of that angle, so the angle is the arctangent of
      the gradient.


      **Solution**


      {{f: cos(atan(gradient / 100))}} = {{n: cos(atan(gradient / 100))}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: divides by the cosine instead of multiplying, which gives a
      value above 1.

      - **{{d2}}**: ignores the climb completely, as in level flight.

      - **{{d3}}**: subtracts the gradient from 1, which is not a relationship
      of the climb angle.

      - **{{d4}}**: uses the sine of the climb angle instead of the cosine.
