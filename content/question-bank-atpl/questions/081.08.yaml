      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: asin(thrust / (mass * 10))
      - id: d2
        formula: asin(drag / (mass * 10))
      - id: d3
        formula: atan((thrust - drag) / (mass * 10))
      - id: d4
        formula: asin((thrust - drag) / thrust)
    presets:
      - id: p1
        values:
          thrust: 200000
          mass: 50000
          drag: 50000
      - id: p2
        values:
          thrust: 300000
          mass: 40000
          drag: 50000
    explanation: >-
      In a steady climb the thrust must be greater than drag, and the surplus
      pulls the aeroplane up the flight path against the part of its weight that
      acts along the path. The weight is the mass times g, and that part of the
      weight is the weight times the sine of the climb angle.


      **Solution**


      - Weight: {{= mass * 10}} N

      - Thrust minus drag: {{= thrust - drag}} N

      - Climb angle: {{f: asin((thrust - drag) / (mass * 10))}} = {{n:
      asin((thrust - drag) / (mass * 10))}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: ignores drag, so the full thrust is used.

      - **{{d2}}°**: uses drag alone as the force along the flight path instead
      of thrust minus drag.

      - **{{d3}}°**: uses the tangent instead of the sine of the angle.

      - **{{d4}}°**: divides by thrust instead of weight.
