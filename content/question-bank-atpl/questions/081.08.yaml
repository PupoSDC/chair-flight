  template:
    type: calculation
    question: >-
      An aeroplane is in a straight and steady glide descent at a glide angle of
      {{angle}}°. Given the following information, calculate the drag:


      - Weight: {{weight}} kg

      - Lift: {{lift}} kg


      Give the answer in kg.
    variables:
      - id: angle
        label: Glide angle
        unit: °
      - id: weight
        label: Weight
        unit: kg
      - id: lift
        label: Lift
        unit: kg
    answer:
      formula: weight * sin(angle)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: weight * cos(angle)
      - id: d2
        formula: weight / sin(angle)
      - id: d3
        formula: weight * tan(angle)
      - id: d4
        formula: lift * sin(angle)
    presets:
      - id: p1
        values:
          angle: 30
          weight: 11350
          lift: 10320
      - id: p2
        values:
          angle: 25
          weight: 9000
          lift: 8000
    explanation: >-
      In a steady glide the drag must balance the part of the weight that pulls
      the aeroplane down the flight path. That part is the weight times the sine
      of the glide angle. The lift only balances the weight at right angles to
      the flight path, so it does not enter this calculation.


      **Solution**


      - Drag: {{f: weight * sin(angle)}} = {{n: weight * sin(angle)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the cosine instead of the sine, which gives the
      component of weight across the flight path.

      - **{{d2}} kg**: divides by the sine instead of multiplying by it.

      - **{{d3}} kg**: uses the tangent instead of the sine of the angle.

      - **{{d4}} kg**: uses the lift instead of the weight.
- id: QHWXDEZ9R
  docId: "081.08"
  relatedQuestions:
    - QGJXNOJY
  externalIds:
    - ATPLQ-815871
  annexes: []
  learningObjectives:
    - "081.08"
  template:
    type: calculation
    question: |-
      A light aeroplane glides in still air with the following data:

      - Lift-to-drag ratio: {{ld}} : 1
      - Height: {{h}} m

      What is the maximum gliding distance in metres?
    variables:
      - id: ld
        label: Lift-to-drag ratio
        unit: :1
      - id: h
        label: Height
        unit: m
    answer:
      formula: ld * h
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: h
      - id: d2
        formula: h / ld
      - id: d3
        formula: h * ld * 2
      - id: d4
        formula: h * ld / 1000
    presets:
      - id: p1
        values:
          ld: 25
          h: 1000
      - id: p2
        values:
          ld: 15
          h: 1500
    explanation: >-
      A glide ratio of X : 1 means the aeroplane travels X units forward for
      each unit it loses in height. The still-air glide distance is therefore
      the glide ratio times the height, in the same unit as the height.


      **Solution**


      - Gliding distance: {{f: ld * h}} = {{n: ld * h}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: forgets to multiply by the glide ratio.

      - **{{d2}} m**: inverts the glide ratio.

      - **{{d3}} m**: doubles the result.

      - **{{d4}} m**: divides by 1000, which gives kilometres rather than
      metres.
- id: QHYYHSPP
  docId: "081.08"
  relatedQuestions: []
  externalIds:
    - ATPLQ-818176
    - ATPLGS-125731
    - AVEXAM-69057
    - BGS-811158
  annexes: []
  learningObjectives:
    - 081.08.01.05.01
  template:
    type: calculation
    question: >-
      What is the approximate value of the lift of an aeroplane at a gross
      weight of {{weight}} N, in a horizontal co-ordinated {{bank}}° banked
      turn?


      Give the answer to the nearest 10 000 N.
    variables:
      - id: weight
        label: Gross weight
        unit: N
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: round(weight / cos(bank) / 10000) * 10000
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: round(weight / 10000) * 10000
      - id: d2
        formula: round(weight * cos(bank) / 10000) * 10000
      - id: d3
        formula: round(weight / cos(bank) ^ 2 / 10000) * 10000
    presets:
      - id: p1
        values:
          weight: 50000
          bank: 45
      - id: p2
        values:
          weight: 60000
          bank: 60
      - id: p3
        values:
          weight: 80000
          bank: 30
    explanation: >-
      In a level, co-ordinated turn the wings must make extra lift. The vertical
      part of the lift still has to carry the weight, so the lift is the weight
      divided by the cosine of the bank angle.


      **Solution**


      {{f: weight / cos(bank)}} = {{n: weight / cos(bank)}} N, which rounded to
      the nearest 10 000 N is **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: ignores the bank angle and uses the weight alone, as in
      straight and level flight.

      - **{{d2}} N**: multiplies by the cosine instead of dividing, so the lift
      is far too small.

      - **{{d3}} N**: squares the cosine, which makes the lift far too large.
- id: QHYYQOHT
  docId: "081.08"
  relatedQuestions:
    - QNVKHHXW
  externalIds:
    - ATPLQ-812420
    - AVEXAM-68380
    - ATPLGS-627090
    - BGS-811157
    - AVEXAM-37227
    - ATPLGS-627088
  annexes: []
  learningObjectives:
    - 081.08.01.05.06
  template:
    type: calculation
    question: >-
      Calculate the time needed to fly one complete circle in a steady, level,
      coordinated turn, given:


      - Bank angle: {{bank}}°

      - TAS: {{tas}} kt

      - Acceleration of gravity: 9.81 m/s²


      Give the time in seconds.
    variables:
      - id: bank
        label: Bank angle
        unit: °
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: 2 * pi * (tas * 1852 / 3600) / (9.81 * tan(bank))
      unit: s
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * pi * tas / (9.81 * tan(bank))
      - id: d2
        formula: (tas * 1852 / 3600)^2 / (9.81 * tan(bank))
      - id: d3
        formula: 2 * pi * (tas * 1852 / 3600) / (9.81 * sin(bank))
      - id: d4
        formula: 2 * pi * (tas * 1852 / 3600) / (9.81 * tan(bank)) / 2
    presets:
      - id: p1
        values:
          bank: 45
          tas: 380
      - id: p2
        values:
          bank: 30
          tas: 250
      - id: p3
        values:
          bank: 25
          tas: 300
    explanation: >-
      In a steady level turn the aircraft flies a circle. The time for one
      circle is the length of that circle divided by the speed. A steeper bank
      makes the circle smaller and quicker to fly. The speed is converted from
      knots to metres per second first.


      **Solution**


      {{f: 2 * pi * (tas * 1852 / 3600) / (9.81 * tan(bank))}} = {{n: 2 * pi *
      (tas * 1852 / 3600) / (9.81 * tan(bank))}} = **{{answer}} s**


      **Why the other answers are wrong**


      - **{{d1}} s**: uses the speed in knots without converting it to metres
      per second.

      - **{{d2}} s**: gives the turn radius in metres, not the time.

      - **{{d3}} s**: uses the sine of the bank angle instead of the tangent.

      - **{{d4}} s**: gives the time for half a circle.
