- id: QFMMWEV9X
  docId: "081.08"
  relatedQuestions:
    - QMUB9XVXG
  externalIds:
    - ATPLQ-815792
    - BGS-812732
    - ATPLQ-814618
  annexes: []
  learningObjectives:
    - "081.08"
    - 081.08.01.02.07
  template:
    type: calculation
    question: >-
      Consider an aeroplane in a steady climb. Given the following data,
      calculate the climb angle in degrees:


      - Thrust: {{thrust}} N

      - Drag: {{drag}} N

      - Weight: {{weight}} N
    variables:
      - id: thrust
        label: Thrust
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: weight
        label: Weight
        unit: N
    answer:
      formula: asin((thrust - drag) / weight)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: asin(thrust / weight)
      - id: d2
        formula: asin(drag / weight)
      - id: d3
        formula: acos((thrust - drag) / weight)
      - id: d4
        formula: asin((thrust - drag) / thrust)
    presets:
      - id: p1
        values:
          thrust: 500000
          drag: 115000
          weight: 1700000
      - id: p2
        values:
          thrust: 200000
          drag: 50000
          weight: 700000
      - id: p3
        values:
          thrust: 300000
          drag: 100000
          weight: 1200000
    explanation: >-
      In a steady climb the thrust must be greater than drag, and the surplus
      pulls the aeroplane up the flight path against the part of its weight that
      acts along the path. That part of the weight is the weight times the sine
      of the climb angle, so thrust minus drag equals weight times the sine of
      the climb angle.


      **Solution**


      - Thrust minus drag: {{= thrust - drag}} N

      - Climb angle: {{f: asin((thrust - drag) / weight)}} = {{n: asin((thrust -
      drag) / weight)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: ignores drag, so the full thrust is used.

      - **{{d2}}°**: uses drag alone as the force along the flight path instead
      of thrust minus drag.

      - **{{d3}}°**: uses the cosine instead of the sine of the angle.

      - **{{d4}}°**: divides by thrust instead of weight.
