          radius: 1000
      - id: p2
        values:
          tas: 200
          radius: 1000
    explanation: >-
      In a steady level turn the tangent of the bank angle equals the speed
      squared divided by the product of g and the radius. The TAS is first
      converted from knots to metres per second (1 kt = 0.514444 m/s).


      **Solution**


      The tangent of the bank angle is {{f: (tas * 0.514444) ^ 2 / (radius *
      10)}}, so the bank angle is about **{{answer}}°**


      **Why the other answers are wrong**


