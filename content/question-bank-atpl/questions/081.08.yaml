- id: QKUJOXYUF
  docId: "081.08"
  relatedQuestions: []
  externalIds:
    - ATPLQ-811611
    - BGS-812606
  annexes: []
  learningObjectives:
    - "081.08"
  template:
    type: calculation
    question: >-
      An aeroplane is flying a {{angle}}° approach path in a steady descent with
      the engines at idle. Given the following information, calculate the drag:


      - Weight: {{weight}} N

      - Thrust: {{thrust}} N


      Give the answer in N.
    variables:
      - id: angle
        label: Approach path angle
        unit: °
      - id: weight
        label: Weight
        unit: N
      - id: thrust
        label: Thrust (idle)
        unit: N
    answer:
      formula: thrust + weight * sin(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: weight * sin(angle)
      - id: d2
        formula: thrust - weight * sin(angle)
      - id: d3
        formula: weight * tan(angle)
      - id: d4
        formula: thrust + weight * cos(angle)
    presets:
      - id: p1
        values:
          angle: 3
          weight: 650000
          thrust: 30000
      - id: p2
        values:
          angle: 2
          weight: 800000
          thrust: 40000
    explanation: >-
      In a steady descent the thrust still acts forwards, and the drag must
      balance the thrust plus the part of the weight that pulls the aeroplane
      down the flight path. That part of the weight is the weight times the sine
      of the path angle.


      **Solution**


      - Weight along the flight path: {{f: weight * sin(angle)}} = {{n: weight *
      sin(angle)}}

      - Drag: {{f: thrust + weight * sin(angle)}} = {{n: thrust + weight *
      sin(angle)}} = **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: leaves out the thrust.

      - **{{d2}} N**: subtracts the weight component instead of adding it, which
      gives a negative value.

      - **{{d3}} N**: uses the tangent of the angle instead of the sine.

      - **{{d4}} N**: uses the cosine instead of the sine of the angle, which
      gives a value close to the weight itself.
