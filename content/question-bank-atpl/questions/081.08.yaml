  template:
    type: calculation
    question: >-
      Determine the thrust vector in kg for a straight and steady power-on
      descent, given:


      - Glide angle: {{angle}}°

      - Weight: {{weight}} kg

      - Lift: {{lift}} kg

      - Drag: {{drag}} kg


      Give the answer in kg.
    variables:
      - id: angle
        label: Glide angle
        unit: °
      - id: weight
        label: Weight
        unit: kg
      - id: lift
        label: Lift
        unit: kg
      - id: drag
        label: Drag
        unit: kg
    answer:
      formula: drag - weight * sin(angle)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: drag
      - id: d2
        formula: drag + weight * sin(angle)
      - id: d3
        formula: drag - lift * sin(angle)
      - id: d4
        formula: drag - weight * cos(angle)
    presets:
      - id: p1
        values:
          angle: 30
          weight: 11350
          lift: 10320
          drag: 11010
      - id: p2
        values:
          angle: 20
          weight: 9000
          lift: 8000
          drag: 7500
      - id: p3
        values:
          angle: 40
          weight: 12000
          lift: 9000
          drag: 10000
    explanation: >-
      In a power-on descent the weight pulls the aeroplane down the flight path,
      so the thrust needed is the drag minus the weight component along the
      flight path. Weight, lift and drag are all given in kg, so the result is
      also in kg with no conversion.


      **Solution**


      {{f: drag - weight * sin(angle)}} = {{n: drag - weight * sin(angle)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the drag alone, leaving out the weight component.

      - **{{d2}} kg**: adds the weight component instead of subtracting it.

      - **{{d3}} kg**: uses the lift instead of the weight for the component.

      - **{{d4}} kg**: uses the cosine instead of the sine of the angle.
