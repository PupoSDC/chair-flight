    - "081.08"
  template:
    type: calculation
    question: >-
      A light aircraft has a demonstrated stall speed (VS) in straight and level
      flight of {{vs}} kt.


      If the same aircraft is flown with a {{bank}}° bank angle, by how much
      does VS change?


      Give the change in kt.
    variables:
      - id: vs
        label: Stall speed in straight and level flight
        unit: kt
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: vs * (sqrt(1 / cos(bank)) - 1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs * (1 / cos(bank) - 1)
      - id: d2
        formula: vs / 2
      - id: d3
        formula: vs * sqrt(1 / cos(bank))
      - id: d4
        formula: vs * (sqrt(1 / cos(bank)) - 1) / 2
    presets:
      - id: p1
        values:
          vs: 154
          bank: 60
      - id: p2
        values:
          vs: 120
          bank: 45
      - id: p3
        values:
          vs: 90
          bank: 30
    explanation: >-
      In a turn the load factor is one divided by the cosine of the bank angle,
      and the stall speed rises with the square root of the load factor. The
      change is the new stall speed minus the stall speed in straight and level
      flight.


      **Solution**


      {{f: vs * (sqrt(1 / cos(bank)) - 1)}} = {{n: vs * (sqrt(1 / cos(bank)) -
      1)}} = the stall speed increases by **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the load factor increase instead of the stall speed
      increase.

      - **{{d2}} kt**: assumes the stall speed is halved by the turn.

      - **{{d3}} kt**: gives the new stall speed in the turn, without
      subtracting the original.

      - **{{d4}} kt**: takes half of the correct change.
