  template:
    type: calculation
    question: What is the heading change of an aeroplane after {{t}} seconds in a
      steady, co-ordinated, horizontal rate-one turn? Give the answer in
      degrees.
    variables:
      - id: t
        label: Time in the turn
        unit: s
    answer:
      formula: 3 * t
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: t
      - id: d2
        formula: t / 3
      - id: d3
        formula: t * 6
      - id: d4
        formula: t * 2
    presets:
      - id: p1
        values:
          t: 30
      - id: p2
        values:
          t: 20
    explanation: >-
      A rate-one turn changes the heading by 3° every second. The heading change
      is therefore three times the time in seconds.


      **Solution**


      - Rate one = 3° per second

      - {{f: 3 * t}} = {{n: 3 * t}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the time in seconds as the heading change in degrees.

      - **{{d2}}°**: divides by 3 instead of multiplying.

      - **{{d3}}°**: uses 6° per second, twice the rate-one turn rate.

      - **{{d4}}°**: uses 2° per second instead of the rate-one turn rate.
