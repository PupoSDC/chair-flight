    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: radius
        label: Turn radius
        unit: m
    answer:
      formula: atan((tas * 0.514444) ^ 2 / (radius * 10))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan(tas ^ 2 / (radius * 10))
      - id: d2
        formula: atan(tas * 0.514444 / (radius * 10))
      - id: d3
        formula: atan((tas * 0.514444) ^ 2 / (radius * 10)) / 2
