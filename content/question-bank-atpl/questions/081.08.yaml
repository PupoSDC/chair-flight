  template:
    type: calculation
    question: >-
      Given the following information for a twin-engine aeroplane, the
      all-engines climb gradient in a straight, steady, wings-level climb is:


      - Mass: {{mass}} kg

      - Lift/drag ratio: {{ld}} : 1

      - Thrust per engine: {{thrust}} N

      - Assumed g: 10 m/s²


      What is the all-engines climb gradient (in %)?
    variables:
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift to drag ratio
        unit: ""
    answer:
      formula: (2 * thrust - mass * 10 / ld) / (mass * 10) * 100
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: (thrust - mass * 10 / ld) / (mass * 10) * 100
      - id: d2
        formula: 2 * thrust / (mass * 10) * 100
      - id: d3
        formula: (2 * thrust - mass / ld) / (mass * 10) * 100
      - id: d4
        formula: (2 * thrust - mass * 10 / ld) / (mass * 10 / ld) * 100
    presets:
      - id: p1
        values:
          thrust: 60000
          mass: 50000
          ld: 10
      - id: p2
        values:
          thrust: 60000
          mass: 30000
          ld: 6
    explanation: >-
      The climb gradient is the excess thrust divided by the weight. The thrust
      is that of both engines, and the drag is the weight divided by the
      lift-to-drag ratio.


      **Solution**


      - Weight: {{f: mass * 10}} = {{n: mass * 10}} N

      - Drag: {{f: mass * 10 / ld}} = {{n: mass * 10 / ld}} N

      - Gradient: {{f: (2 * thrust - mass * 10 / ld) / (mass * 10) * 100}} =
      {{n: (2 * thrust - mass * 10 / ld) / (mass * 10) * 100}} = **{{answer}}
      %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the thrust of one engine only.

      - **{{d2}} %**: forgets to subtract the drag.

      - **{{d3}} %**: uses the mass in the drag instead of the weight.

      - **{{d4}} %**: divides by the drag instead of the weight.
- id: QRNQDYVK
  docId: "081.08"
  relatedQuestions:
    - QEGZYCIZ
  externalIds:
    - ATPLQ-819976
    - AVEXAM-82833
    - BGS-811378
    - AVEXAM-67982
    - ATPLGS-627087
    - BGS-811375
  annexes: []
  learningObjectives:
    - 081.08.01.04.03
  template:
    type: calculation
    question: >-
      Given the following information, calculate the lift in a straight and
      steady glide at a glide angle of {{angle}}°.


      - Weight: {{weight}} kg

      - Drag: {{drag}} kg


      Give the answer in kg.
    variables:
      - id: weight
        label: Weight
        unit: kg
      - id: angle
        label: Glide angle
        unit: °
      - id: drag
        label: Drag
        unit: kg
    answer:
      formula: weight * cos(angle)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: weight
      - id: d2
        formula: weight * sin(angle)
      - id: d3
        formula: weight / cos(angle)
      - id: d4
        formula: (weight - drag) * cos(angle)
    presets:
      - id: p1
        values:
          weight: 12380
          angle: 30
          drag: 9550
      - id: p2
        values:
          weight: 8000
          angle: 60
          drag: 1000
      - id: p3
        values:
          weight: 9000
          angle: 25
          drag: 2000
    explanation: >-
      In a steady glide the lift balances the part of the weight that acts at
      right angles to the flight path, so lift is weight multiplied by the
      cosine of the glide angle. Drag acts along the flight path and does not
      reduce the lift.


      **Solution**


      {{f: weight * cos(angle)}} = {{n: weight * cos(angle)}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the full weight and ignores the glide angle.

      - **{{d2}} kg**: uses the sine, which gives the component of weight along
      the flight path.

      - **{{d3}} kg**: divides by the cosine instead of multiplying.

      - **{{d4}} kg**: subtracts drag from the weight before applying the
      cosine, but drag acts along the flight path and is not taken off the lift.
