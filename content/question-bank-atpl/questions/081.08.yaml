- id: QBMYDPSK
  docId: "081.08"
  relatedQuestions: []
  externalIds:
    - ATPLQ-814782
  annexes: []
  learningObjectives:
    - 081.08.01.04.03
  template:
    type: calculation
    question: >-
      You are flying from town A to airport B in a single-engine piston
      aeroplane when the engine fails. Assume a still-air glide with the
      following data:


      - Elevation of airport B: {{elev}} m

      - Distance from A to B: {{dist}} km

      - Lift-to-drag ratio: {{ld}} : 1


      What is the minimum altitude at A, in metres, needed to reach airport B?
    variables:
      - id: elev
        label: Elevation of airport B
        unit: m
      - id: dist
        label: Distance from A to B
        unit: km
      - id: ld
        label: Lift-to-drag ratio
        unit: :1
    answer:
      formula: elev + dist * 1000 / ld
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 1000 / ld
      - id: d2
        formula: elev + dist / ld
      - id: d3
        formula: elev + dist * 1000
      - id: d4
        formula: elev - dist * 1000 / ld
    presets:
      - id: p1
        values:
          elev: 300
          dist: 60
          ld: 30
      - id: p2
        values:
          elev: 500
          dist: 80
          ld: 20
    explanation: >-
      With a glide ratio of X : 1, the aeroplane can cover X metres forward for
      every metre it loses in height. The height needed to glide the distance is
      the distance in metres divided by the glide ratio. This height is added to
      the elevation of the airport to give the altitude needed at A.


      **Solution**


      - Distance in metres: {{= dist * 1000}} m

      - Height needed for the glide: {{n: dist * 1000 / ld}} = {{= dist * 1000 /
      ld}} m

      - Minimum altitude at A: {{f: elev + dist * 1000 / ld}} = {{n: elev + dist
      * 1000 / ld}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: forgets to add the elevation of the airport.

      - **{{d2}} m**: adds the distance in kilometres as if it were metres.

      - **{{d3}} m**: forgets to divide by the glide ratio.

      - **{{d4}} m**: subtracts the glide height instead of adding it.
