    - ATPLQ-819571
    - AVEXAM-4304
  annexes: []
  learningObjectives:
    - 081.08.01.04.03
  template:
    type: calculation
    question: >-
      An aeroplane is in a straight and steady glide descent at a glide angle of
      {{angle}}°. Given the following information, and assuming g = 10 m/s²,
      calculate the drag:


      - Mass: {{mass}} kg

      - Lift: {{lift}} N


      Give the answer in N.
    variables:
      - id: angle
        label: Glide angle
        unit: °
      - id: mass
        label: Mass
        unit: kg
      - id: lift
        label: Lift
        unit: N
    answer:
      formula: mass * 10 * sin(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: lift * sin(angle)
      - id: d2
        formula: mass * 10 * cos(angle)
      - id: d3
        formula: mass * 10 / sin(angle)
      - id: d4
        formula: mass * 10 * tan(angle)
    presets:
      - id: p1
        values:
          angle: 30
          mass: 12380
          lift: 102900
      - id: p2
        values:
          angle: 30
          mass: 10450
          lift: 103405
    explanation: >-
      In a steady glide the drag must balance the part of the weight that pulls
      the aeroplane down the flight path. The weight is the mass times g, and
      that part of the weight is the weight times the sine of the glide angle.


      **Solution**


      - Weight: {{= mass * 10}} N

      - Drag: {{f: mass * 10 * sin(angle)}} = {{n: mass * 10 * sin(angle)}} =
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: uses the lift instead of the weight component.

      - **{{d2}} N**: uses the cosine instead of the sine, which gives the
      component of weight across the flight path.

      - **{{d3}} N**: divides by the sine instead of multiplying by it.

      - **{{d4}} N**: uses the tangent instead of the sine of the angle.
