- id: QMIWNZTN
  docId: "081.08"
  relatedQuestions: []
  externalIds:
    - ATPLQ-815314
  annexes: []
  learningObjectives:
    - 081.08.01.02.03
  template:
    type: calculation
    question: >-
      Consider a two-engine aeroplane in a steady all-engine climb. Given the
      following information, and assuming g = 10 m/s², calculate the climb
      gradient:


      - Thrust per engine: {{thrust}} N

      - Mass: {{mass}} kg

      - Lift-to-drag ratio: {{ld}} : 1


      Give the answer as a percentage.
    variables:
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift-to-drag ratio
        unit: :1
    answer:
      formula: (2 * thrust / (mass * 10) - 1 / ld) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: (thrust / (mass * 10) - 1 / ld) * 100
      - id: d2
        formula: (2 * thrust / (mass * 10) + 1 / ld) * 100
      - id: d3
        formula: 2 * thrust / (mass * 10) * 100
      - id: d4
        formula: 2 * thrust / (mass * 10) - 1 / ld
    presets:
      - id: p1
        values:
          thrust: 118000
          mass: 67000
          ld: 9
      - id: p2
        values:
          thrust: 90000
          mass: 40000
          ld: 12
    explanation: >-
      In a steady climb the total thrust must exceed drag by the part of the
      weight that acts along the flight path. The climb gradient is therefore
      the thrust over weight, minus the drag over weight, where the drag over
      weight is one divided by the lift-to-drag ratio.


      **Solution**


      - Weight: {{= mass * 10}} N

      - Thrust of two engines over weight: {{= 2 * thrust / (mass * 10)}}

      - Drag over weight: {{= 1 / ld}}

      - Climb gradient: {{f: (2 * thrust / (mass * 10) - 1 / ld) * 100}} = {{n:
      (2 * thrust / (mass * 10) - 1 / ld) * 100}} = **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: counts the thrust of only one engine.

      - **{{d2}}%**: adds the drag term instead of subtracting it.

      - **{{d3}}%**: leaves the drag out altogether.

      - **{{d4}}**: gives the ratio without converting it to a percentage, so
      the value is 100 times too small.
