- id: QJIYKZEO
  docId: "081.08"
  relatedQuestions:
    - QVCAAZNL
  externalIds:
    - ATPLQ-816975
  annexes: []
  learningObjectives:
    - 081.08.01.02.07
  template:
    type: calculation
    question: >-
      Determine the thrust in N for a straight and steady power-on descent,
      given:


      - Glide angle: {{angle}}°

      - Mass: {{mass}} kg

      - Lift: {{lift}} N

      - Drag: {{drag}} N

      - g: {{g}} m/s²


      Give the answer in N.
    variables:
      - id: angle
        label: Glide angle
        unit: °
      - id: mass
        label: Mass
        unit: kg
      - id: lift
        label: Lift
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: g
        label: g
        unit: m/s²
    answer:
      formula: drag - mass * g * sin(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: drag
      - id: d2
        formula: drag + mass * g * sin(angle)
      - id: d3
        formula: drag - lift * sin(angle)
      - id: d4
        formula: drag - mass * g * cos(angle)
    presets:
      - id: p1
        values:
          angle: 30
          mass: 9450
          lift: 92500
          drag: 93500
          g: 10
      - id: p2
        values:
          angle: 30
          mass: 8000
          lift: 90000
          drag: 70000
          g: 10
      - id: p3
        values:
          angle: 20
          mass: 6000
          lift: 70000
          drag: 60000
          g: 9.81
    explanation: >-
      In a power-on descent the weight pulls the aeroplane down the flight path,
      so the thrust needed is the drag minus the weight component along the
      flight path. The weight is the mass multiplied by g.


      **Solution**


      Weight = {{mass}} × {{g}} = {{= mass * g}} N


      {{f: drag - mass * g * sin(angle)}} = {{n: drag - mass * g * sin(angle)}}
      = **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: the drag alone, leaving out the weight component.

      - **{{d2}} N**: adds the weight component instead of subtracting it.

      - **{{d3}} N**: uses the lift instead of the weight for the component.

      - **{{d4}} N**: uses the cosine instead of the sine of the angle.
