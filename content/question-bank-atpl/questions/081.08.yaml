  template:
    type: calculation
    question: >-
      In a co-ordinated level turn, by what percentage does the lift increase at
      a bank angle of {{bank}}°, compared with straight and level flight?


      Give the answer as a percentage.
    variables:
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: (1 / cos(bank) - 1) * 100
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: (cos(bank) - 1) * 100
      - id: d2
        formula: 1 / cos(bank) * 100
      - id: d3
        formula: (1 / cos(bank)^2 - 1) * 100
      - id: d4
        formula: (1 / cos(bank) - 1) * 100 + 10
    presets:
      - id: p1
        values:
          bank: 45
      - id: p2
        values:
          bank: 60
      - id: p3
        values:
          bank: 30
    explanation: >-
      In a level turn the vertical part of the lift must still balance the
      weight, so the total lift must be the weight divided by the cosine of the
      bank angle. The increase compared with straight and level flight is that
      ratio minus 1.


      **Solution**


      The lift ratio compared with level flight is 1 / cos({{bank}}°) = {{= 1 /
      cos(bank)}}. Subtracting 1 and multiplying by 100 gives the percentage
      increase:


      {{f: (1 / cos(bank) - 1) * 100}} = {{n: (1 / cos(bank) - 1) * 100}} =
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the cosine instead of its reciprocal, which gives a
      decrease rather than an increase.

      - **{{d2}} %**: gives the total lift ratio as a percentage and forgets to
      subtract the level-flight lift.

      - **{{d3}} %**: squares the cosine, which overstates the lift increase.

      - **{{d4}} %**: adds an extra 10 percentage points with no basis.
