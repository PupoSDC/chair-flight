    - 081.08.01.05.01
  template:
    type: calculation
    question: |-
      An aircraft is performing a co-ordinated level turn. Given:

      - Mass: {{mass}} kg
      - Bank angle: {{bank}}°
      - g = 10 m/s²

      What is the magnitude of the lift force? Give the answer in newtons.
    variables:
      - id: mass
        label: Mass
        unit: kg
      - id: bank
        label: Bank angle
        unit: °
    answer:
      formula: mass * 10 / cos(bank)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: mass * 10 * cos(bank)
      - id: d2
        formula: mass * 10
      - id: d3
        formula: mass * 10 / sin(bank)
      - id: d4
        formula: mass / cos(bank)
    presets:
      - id: p1
        values:
          mass: 60000
          bank: 30
      - id: p2
        values:
          mass: 2000
          bank: 60
      - id: p3
        values:
          mass: 15000
          bank: 40
    explanation: >-
      In a co-ordinated level turn the vertical part of the lift balances the
      weight. The lift is therefore the weight divided by the cosine of the bank
      angle. With g = 10 m/s², the weight in newtons is the mass multiplied by
      10.


      **Solution**


      The weight is {{= mass * 10}} N.


      {{f: mass * 10 / cos(bank)}} = {{n: mass * 10 / cos(bank)}} = **{{answer}}
      N**


      **Why the other answers are wrong**


      - **{{d1}} N**: multiplies by the cosine instead of dividing, which gives
      less than the weight.

      - **{{d2}} N**: equals the weight, ignoring the extra lift needed in a
      bank.

      - **{{d3}} N**: divides by the sine instead of the cosine.

      - **{{d4}} N**: forgets to multiply the mass by g, giving a value ten
      times too small.
