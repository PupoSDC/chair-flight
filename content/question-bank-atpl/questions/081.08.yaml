  template:
    type: calculation
    question: |-
      An aircraft is in a steady descent. Given:

      - Descent angle: {{angle}}°
      - Weight: {{weight}} N

      What is the lift required? Give the answer in newtons.
    variables:
      - id: angle
        label: Descent angle
        unit: °
      - id: weight
        label: Weight
        unit: N
    answer:
      formula: weight * cos(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: weight
      - id: d2
        formula: weight * sin(angle)
      - id: d3
        formula: weight / cos(angle)
      - id: d4
        formula: weight * tan(angle)
    presets:
      - id: p1
        values:
          angle: 60
          weight: 8000
      - id: p2
        values:
          angle: 30
          weight: 104500
      - id: p3
        values:
          angle: 30
          weight: 120000
      - id: p4
        values:
          angle: 30
          weight: 122625
    explanation: >-
      In a steady descent the lift balances the part of the weight that acts at
      right angles to the flight path, so lift is weight multiplied by the
      cosine of the descent angle. Thrust and drag act along the flight path and
      do not change the lift.


      **Solution**


      {{f: weight * cos(angle)}} = {{n: weight * cos(angle)}} = **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: uses the full weight and ignores the descent angle.

      - **{{d2}} N**: uses the sine, which gives the component of weight along
      the flight path.

      - **{{d3}} N**: divides by the cosine instead of multiplying.

