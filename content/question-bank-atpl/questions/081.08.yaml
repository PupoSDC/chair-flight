  template:
    type: chart
    question: >-
      An aeroplane transitions from steady, straight and level flight into a
      horizontal co-ordinated turn with a load factor of 2. The speed remains
      constant.


      Which statement is correct?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: induced drag increases by a factor of 4.
        wrongAnswers:
          - lift increases by a factor of 4.
          - angle of attack increases by a factor of 1/4.
          - total drag increases by a factor of 4.
        explanation: >-
          In a level turn the lift must rise to the load factor times the
          weight, so it doubles here. Induced drag depends on the lift squared,
          so it rises by 2 squared, which is a factor of **4**.


          Lift increases by a factor of 2, not 4. The angle of attack increases,
          but not by a factor of 1/4. Total drag rises by less than induced
          drag, because the drag that does not come from lift stays the same.
