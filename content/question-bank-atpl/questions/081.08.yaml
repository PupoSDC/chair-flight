- id: QVCAAZNL
  docId: "081.08"
  relatedQuestions:
    - QJIYKZEO
    - QLVFCONH
  externalIds:
    - ATPLQ-818184
  annexes: []
  learningObjectives:
    - 081.08.01.02.07
  template:
    type: calculation
    question: >-
      Determine the thrust vector in kg for a straight and steady power-on
      descent, given:


      - Glide angle: {{angle}}°

      - Weight: {{weight}} N

      - Drag: {{drag}} N

      - Lift: {{lift}} N

      - g: {{g}} m/s²


      Give the answer in kg.
    variables:
      - id: angle
        label: Glide angle
        unit: °
      - id: weight
        label: Weight
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: lift
        label: Lift
        unit: N
      - id: g
        label: g
        unit: m/s²
    answer:
      formula: (drag - weight * sin(angle)) / g
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: drag - weight * sin(angle)
      - id: d2
        formula: (drag + weight * sin(angle)) / g
      - id: d3
        formula: (drag - lift * sin(angle)) / g
      - id: d4
        formula: (weight * sin(angle) - drag) / g
    presets:
      - id: p1
        values:
          angle: 30
          weight: 11000
          drag: 8500
          lift: 10500
          g: 9.81
      - id: p2
        values:
          angle: 25
          weight: 9000
          drag: 7000
          lift: 8000
          g: 9.81
      - id: p3
        values:
          angle: 20
          weight: 12000
          drag: 9000
          lift: 10000
          g: 10
    explanation: >-
      In a power-on descent the weight pulls the aeroplane down the flight path
      and helps the motion, so the thrust needed is the drag minus the weight
      component along the flight path. The result is a force in newtons, which
      is divided by g to express it as a mass in kilograms.


      **Solution**


      {{f: (drag - weight * sin(angle)) / g}} = {{n: (drag - weight *
      sin(angle)) / g}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the thrust in newtons, because it was not divided by g.

      - **{{d2}} kg**: adds the weight component instead of subtracting it.

      - **{{d3}} kg**: uses the lift instead of the weight for the component.

      - **{{d4}} kg**: reverses the subtraction, so the sign of the result is
      wrong.
