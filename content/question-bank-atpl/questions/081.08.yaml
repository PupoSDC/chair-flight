    - 081.08.01.02.07
  template:
    type: calculation
    question: >-
      An aeroplane is in a straight and steady power-on descent at an angle of
      {{angle}}°. Given the following information:


      - Weight: {{weight}} N

      - Thrust: {{thrust}} N

      - Drag: {{drag}} N


      Calculate the lift.
    variables:
      - id: weight
        label: Weight
        unit: N
      - id: thrust
        label: Thrust
        unit: N
      - id: drag
        label: Drag
        unit: N
      - id: angle
        label: Descent angle
        unit: °
    answer:
      formula: weight * cos(angle)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: weight
      - id: d2
        formula: weight * sin(angle)
      - id: d3
        formula: weight * cos(angle) - thrust
      - id: d4
        formula: drag * cos(angle)
    presets:
      - id: p1
        values:
          weight: 11350
          thrust: 8450
          drag: 11010
          angle: 30
      - id: p2
        values:
          weight: 12000
          thrust: 7000
          drag: 10500
          angle: 20
      - id: p3
        values:
          weight: 9000
          thrust: 6000
          drag: 8000
          angle: 40
    explanation: >-
      In a steady descent the weight is not fully carried by the lift, because
      part of it acts along the flight path. Thrust and drag also act along the
      flight path, so they do not change the lift. The lift is therefore the
      weight multiplied by the cosine of the descent angle.


      **Solution**


      {{f: weight * cos(angle)}} = {{n: weight * cos(angle)}} = **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: uses the full weight and forgets the descent angle.

      - **{{d2}} N**: uses the sine of the angle, which gives the part of the
      weight along the flight path.

      - **{{d3}} N**: subtracts the thrust from the lift, but thrust acts along
      the flight path and does not reduce the lift.

      - **{{d4}} N**: uses the drag instead of the weight.
