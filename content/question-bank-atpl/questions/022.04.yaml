  template:
    type: calculation
    question: Due to the rotation of the Earth, what is the magnitude of the
      apparent drift of a horizontal free gyroscope at a latitude of {{lat}}°S,
      in degrees per hour?
    variables:
      - id: lat
        label: Latitude
        unit: °
    answer:
      formula: 15 * sin(lat)
      unit: °/h
      decimals: 1
    distractors:
      - id: d1
        formula: 15 * cos(lat)
      - id: d2
        formula: 15 * tan(lat)
      - id: d3
        formula: 15 / sin(lat)
      - id: d4
        formula: 15 * lat / 90
    presets:
      - id: p1
        values:
          lat: 30
      - id: p2
        values:
          lat: 50
      - id: p3
        values:
          lat: 20
    explanation: >-
      A horizontal-axis free gyroscope keeps its direction in space while the
      Earth turns at 15°/h, so it appears to drift by the vertical component of
      the Earth rate: 15° x sin(latitude). In the southern hemisphere the
      apparent drift is to the left.


      **Solution**


      {{f: 15 * sin(lat)}} = {{n: 15 * sin(lat)}} = **{{answer}} °/h**


      **Why the other answers are wrong**

      - **{{d1}} °/h**: uses cosine, the horizontal component of Earth rate
      (this is the transport/tilt term, not the apparent drift).

      - **{{d2}} °/h**: uses tangent instead of sine.

      - **{{d3}} °/h**: divides by sin(latitude) instead of multiplying.

      - **{{d4}} °/h**: scales linearly with latitude instead of using sine.
