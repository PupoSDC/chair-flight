          with the appropriate security and customer handling facilities to
          properly facilitate international air travel.
        correct: false
        why: ""
      - id: OFXXQXGJN
        text: An airport of a defined passenger handling capacity that offers facilities
          to carriers and operators with registered offices outside of the
          contracting state.
        correct: false
        why: ""
      - id: OVZGFIKNE
        text: Any airport, within a contracting state that accepts international air
          traffic, whether equipped with formal customs facilities or not.
        correct: false
        why: ""
      - id: OGYSOOWHD
