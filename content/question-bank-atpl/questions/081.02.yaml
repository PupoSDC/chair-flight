    question: "When the speed over an aerofoil section increases from subsonic to
      supersonic, its aerodynamic centre:"
    explanation: |-
      The standard thin-aerofoil approximation places the aerodynamic centre
      near the quarter-chord in subsonic flow and near the mid-chord in
      supersonic flow. That is an aft shift from about 25% to 50% chord.
    options:
      - id: OXPC0ZCQV
