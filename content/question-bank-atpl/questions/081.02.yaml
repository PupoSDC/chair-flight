  template:
    type: calculation
    question: If the Mach number is {{mach}} and the true airspeed (TAS) is {{tas}}
      kt, what is the speed of sound? Give the answer in kt.
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: tas
        label: True airspeed
        unit: kt
    answer:
      formula: tas / mach
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas * mach
      - id: d2
        formula: tas / mach ^ 2
      - id: d3
        formula: tas / sqrt(mach)
      - id: d4
        formula: tas
    presets:
      - id: p1
        values:
          mach: 0.8
          tas: 480
      - id: p2
        values:
          mach: 0.82
          tas: 500
    explanation: >-
      The Mach number is the ratio of the true airspeed to the speed of sound.
      The speed of sound is therefore the true airspeed divided by the Mach
      number.


      **Solution**


      - Speed of sound = TAS / Mach

      - {{f: tas / mach}} = {{n: tas / mach}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} kt**: multiplies instead of divides.

      - **{{d2}} kt**: divides by the Mach number squared.

      - **{{d3}} kt**: divides by the square root of the Mach number.

      - **{{d4}} kt**: takes the TAS as the speed of sound, ignoring the Mach
      number.
