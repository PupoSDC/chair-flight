- id: QDDGTZEK
  docId: "081.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-812595
    - BGS-811948
  annexes: []
  learningObjectives:
    - 081.02.01.02.01
  template:
    type: calculation
    question: |-
      The following data are known for an aeroplane in flight:

      - CAS: {{cas}} kt
      - TAS: {{tas}} kt
      - OAT: {{oat}} °C

      Calculate the Mach number.
    variables:
      - id: cas
        label: CAS
        unit: kt
      - id: tas
        label: TAS
        unit: kt
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: tas / (38.97 * sqrt(273.15 + oat))
      unit: ""
      decimals: 3
    distractors:
      - id: d1
        formula: cas / (38.97 * sqrt(273.15 + oat))
      - id: d2
        formula: tas / (38.97 * sqrt(273.15 - oat))
      - id: d3
        formula: tas / 661.5
      - id: d4
        formula: tas / (38.97 * (273.15 + oat))
    presets:
      - id: p1
        values:
          cas: 293
          tas: 385
          oat: -48
      - id: p2
        values:
          cas: 330
          tas: 450
          oat: -20
      - id: p3
        values:
          cas: 260
          tas: 300
          oat: 10
    explanation: >-
      The Mach number is the true airspeed divided by the speed of sound at the
      air temperature. The speed of sound depends only on the temperature, in
      kelvin, so the calibrated airspeed is not needed.


      **Solution**


      Speed of sound = 38.97 x sqrt(273.15 + OAT) kt = {{= 38.97 * sqrt(273.15 +
      oat)}} kt


      {{f: tas / (38.97 * sqrt(273.15 + oat))}} = {{n: tas / (38.97 *
      sqrt(273.15 + oat))}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the calibrated airspeed instead of the true airspeed.

      - **{{d2}}**: takes the sign of the temperature the wrong way round.

      - **{{d3}}**: uses the speed of sound at sea level, ignoring the
      temperature.

      - **{{d4}}**: forgets the square root of the temperature.
