  template:
    type: simple
    question: "During the cruise, modern large jet aeroplanes normally fly at speeds
      faster than MCRIT since the increase in speed is more significant than the
      increase in drag. This is achieved:"
    explanation: |-
      MCRIT is reached when the airflow first becomes sonic somewhere on the
      wing. A supercritical aerofoil limits the strength of the shock and
      delays the sharp rise in wave drag, making cruise above MCRIT practical.
    options:
      - id: OAEXPYQ7Z
        text: By flying at lower altitudes where the TAS is higher for a given Mach
          number and therefore experience a delay in the onset of shock waves
          and wave drag.
        correct: false
        why: ""
      - id: OYWX5JEI9
        text: By decreasing the leading-edge radius of the wing.
        correct: false
        why: ""
      - id: OM707FBED
        text: By fitting supercritical wings.
        correct: true
        why: ""
      - id: OGEX04BVZ
        text: By using an advanced wing technology with a greater curvature underneath
          to balance the acceleration over the top and therefore reduce the
          severity of the shock waves.
        correct: false
        why: ""
