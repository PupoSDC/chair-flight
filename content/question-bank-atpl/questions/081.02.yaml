  template:
    type: simple
    question: When descending with a constant TAS, what happens?
    explanation: |-
      Mach number equals TAS divided by the local speed of sound. In a standard
      tropospheric descent, the air gets warmer and the speed of sound rises.
      At constant TAS, Mach number therefore falls.
    options:
      - id: O4DFGBWTX
        text: Mach speed decreases.
        correct: true
        why: ""
      - id: OAXOSYYQQ
        text: IAS increases and then decreases.
        correct: false
        why: ""
      - id: OXQKAGWJ1
        text: IAS decreases.
        correct: false
        why: ""
      - id: ODIAEXSIE
        text: Mach speed decreses then increases.
        correct: false
        why: ""
