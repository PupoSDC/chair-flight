  template:
    type: simple
    question: Reading the technical log of an aircraft before flight, you notice
      that the previous maintenance organisation inspected the landing gear for
      corrosion, and made no further action as no corrosion was found. What type
      of maintenance is this?
    explanation: ""
    options:
      - id: ONOYTNY46
        text: On-condition maintenance, where an aircraft item such as the landing gear
          is removed from service at or before reaching a specified time or
          amount of cycles.
        correct: false
        why: ""
      - id: ON5Y4BDFN
        text: Hard-time maintenance, where an item is completely removed and
          disassembled to allow for a thorough inspection of the item.
        correct: false
        why: ""
      - id: O8E4XJ6AV
        text: Hard-time maintenance, overhauling an aircraft component within the time
          limits of the maintenance programme as determined by the manufacturer.
        correct: false
        why: ""
      - id: OIUYGNGIN
        text: On-condition maintenance, where the determination of continued
          airworthiness can be made without overhaul or tear-down inspection.
        correct: true
        why: ""
