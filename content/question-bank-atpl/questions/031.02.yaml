  template:
    type: calculation
    question: >-
      Given the following information for a Commercial Air Transport operation,
      calculate the maximum possible Extra Fuel to be uplifted.


      - Maximum Zero Fuel Mass (MZFM): {{mzfm}} kg

      - Actual Zero Fuel Mass (AZFM): {{azfm}} kg

      - Regulated Take-Off Mass (RTOM): {{rtom}} kg

      - Maximum Landing Mass (MLM): {{mlm}} kg

      - Fuel Tank Capacity: {{tank}} kg

      - Trip Fuel (TF): {{trip}} kg

      - Minimum Block Fuel (BF): {{min_block}} kg

      - Taxi Fuel: {{taxi}} kg
    variables:
      - id: mzfm
        label: MZFM
        unit: kg
      - id: azfm
        label: AZFM
        unit: kg
      - id: rtom
        label: RTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: tank
        label: Fuel tank capacity
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: min_block
        label: Minimum block fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: min(tank, mlm - azfm + trip + taxi, rtom - azfm + taxi) - min_block
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tank - min_block - taxi
      - id: d2
        formula: tank - min_block + taxi
      - id: d3
        formula: min(rtom - azfm, mlm - azfm + trip) - min_block
      - id: d4
        formula: mlm - azfm - taxi
    presets:
      - id: p1
        values:
          mzfm: 2000
          azfm: 1800
          rtom: 3000
          mlm: 2200
          tank: 550
          trip: 190
          min_block: 350
          taxi: 15
      - id: p2
        values:
          mzfm: 2100
          azfm: 1700
          rtom: 3100
          mlm: 2150
          tank: 600
          trip: 200
          min_block: 380
          taxi: 20
      - id: p3
        values:
          mzfm: 2000
          azfm: 1800
          rtom: 3200
          mlm: 2100
          tank: 650
          trip: 200
          min_block: 330
          taxi: 15
    explanation: >-
      The block fuel is limited by the tank capacity, by the take-off mass limit
      and by the landing mass limit (take-off fuel less trip fuel). The extra
      fuel is the largest block fuel allowed by these limits minus the minimum
      block fuel. The zero fuel mass limit does not restrict the fuel quantity.


      **Solution**


      Tank limit: {{tank}} kg


      Landing mass limit: {{= mlm - azfm + trip + taxi}} kg


      Take-off mass limit: {{= rtom - azfm + taxi}} kg


      Maximum block fuel = {{= min(tank, mlm - azfm + trip + taxi, rtom - azfm +
      taxi)}} kg


      Extra fuel = {{= min(tank, mlm - azfm + trip + taxi, rtom - azfm + taxi)}}
      - {{min_block}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the taxi fuel is deducted again, although the block fuel
      already contains it.

      - **{{d2}} kg**: the taxi fuel is added to the tank limit.

      - **{{d3}} kg**: the taxi fuel is ignored in the mass limits and the tank
      capacity is not checked.

      - **{{d4}} kg**: the trip fuel is ignored and the tank limit is not
      checked.
