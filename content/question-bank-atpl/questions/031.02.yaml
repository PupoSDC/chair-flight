          sg: 0.78
      - id: p3
        values:
          dom: 5010
          tom: 6200
          trip: 655
          tof: 810
          sg: 0.8
    explanation: >-
      The take-off mass is made up of the dry operating mass, the take-off fuel
      and the traffic load, so the traffic load is what remains after
      subtracting the dry operating mass and the fuel mass. Fuel volumes in
      litres must first be converted to mass with the specific gravity.


      **Solution**


      Take-off fuel mass = {{tof}} l x {{sg}} kg/l = {{= tof * sg}} kg


      {{f: tom - dom - tof * sg}} = {{n: tom - dom - tof * sg}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the trip fuel instead of the take-off fuel
      (take-off fuel includes the reserves).

      - **{{d2}} kg**: uses the fuel volume in litres as if it were kg (trip
      fuel, no density conversion).

      - **{{d3}} kg**: uses the fuel volume in litres as if it were kg (take-off
      fuel, no density conversion).

      - **{{d4}} kg**: forgets to subtract the fuel; this is only take-off mass
      minus dry operating mass.
