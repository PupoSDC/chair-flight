      - Maximum Zero-Fuel Mass: {{mzfm}} kg
      - Maximum Landing Mass: {{mlm}} kg
      - Trip fuel: {{trip}} kg
      - Fuel quantity at brakes release: {{block}} kg

      The maximum traffic load is:
    variables:
