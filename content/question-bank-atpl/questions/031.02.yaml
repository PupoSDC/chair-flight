  template:
    type: calculation
    question: >-
      The flight preparation of a turbojet aeroplane provides the following
      data:


      - Take-off runway limitation: {{ptom}} kg

      - Landing runway limitation: {{plm}} kg

      - Planned Trip Fuel: {{trip}} kg

      - Take-off Fuel: {{tof}} kg


      Knowing that:


      - Maximum Take-off Mass (MTOM): {{mtom}} kg

      - Maximum Landing Mass (MLM): {{mlm}} kg

      - Maximum Zero Fuel Mass (MZFM): {{mzfm}} kg

      - Dry Operating Mass (DOM): {{dom}} kg


      The maximum Traffic Load that the captain may decide to load on board is:
    variables:
      - id: ptom
        label: take-off runway limitation
        unit: kg
      - id: plm
        label: landing runway limitation
        unit: kg
      - id: trip
        label: trip fuel
        unit: kg
      - id: tof
        label: take-off fuel
        unit: kg
      - id: mtom
        label: MTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: dom
        label: DOM
        unit: kg
    answer:
      formula: min(mzfm - dom, min(mtom, ptom) - tof - dom, min(mlm, plm) + trip - tof
        - dom)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(mtom, ptom) - tof - dom
      - id: d2
        formula: min(mlm, plm) + trip - tof - dom
      - id: d3
        formula: plm + trip - tof - dom
    presets:
      - id: p1
        values:
          ptom: 185000
          plm: 180000
          trip: 11500
          tof: 20000
          mtom: 212000
          mlm: 174000
          mzfm: 164000
          dom: 110000
      - id: p2
        values:
          ptom: 190000
          plm: 182000
          trip: 12500
          tof: 22000
          mtom: 220000
          mlm: 178000
          mzfm: 167000
          dom: 112000
    explanation: >-
      Each of the three limits (zero fuel, take-off, landing) restricts the
      traffic load. For every limit use the lower of the structural and runway
      values, subtract DOM and the fuel on board for that limit (landing mass
      allows the trip fuel to be added back at take-off). The smallest result is
      the maximum traffic load.


      **Solution**


      Zero fuel limit: {{= mzfm - dom}} kg

      Take-off limit: {{= min(mtom, ptom) - tof - dom}} kg

      Landing limit: {{= min(mlm, plm) + trip - tof - dom}} kg


      Maximum traffic load = lowest = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the take-off limit, ignoring the lower zero fuel
      limit.

      - **{{d2}} kg**: only the landing limit, ignoring the lower zero fuel
      limit.

      - **{{d3}} kg**: uses the landing runway limitation without checking it
      against the structural MLM.
