  template:
    type: calculation
    question: >-
      A flight has been made from London to Valencia carrying minimum fuel and
      maximum traffic load. On the return flight the fuel tanks are filled to
      capacity with {{fuel_l}} litres at a density of {{dens}} kg/l. Structural
      limits:


      - Maximum Ramp Mass {{mrm}} kg

      - Maximum Take-off Mass {{mtom}} kg

      - Maximum Landing Mass {{mlm}} kg

      - Maximum Zero Fuel Mass {{mzfm}} kg

      - Performance limited Take-off Mass at Valencia {{tom_perf}} kg

      - Dry Operating Mass {{dom}} kg

      - Trip fuel (Valencia to London) {{trip}} kg

      - Taxi fuel {{taxi}} kg


      Landing mass at London is not performance limited. What is the maximum
      traffic load that can be carried from Valencia?
    variables:
      - id: fuel_l
        label: Fuel volume
        unit: l
      - id: dens
        label: Fuel density
        unit: kg/l
      - id: mrm
        label: Maximum ramp mass
        unit: kg
      - id: mtom
        label: Maximum take-off mass
        unit: kg
      - id: mlm
        label: Maximum landing mass
        unit: kg
      - id: mzfm
        label: Maximum zero fuel mass
        unit: kg
      - id: tom_perf
        label: Performance limited take-off mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: min(mzfm - dom, min(mtom, tom_perf) - dom - (fuel_l * dens - taxi), mlm
        - dom - (fuel_l * dens - taxi - trip), mrm - dom - fuel_l * dens)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(mtom, tom_perf) - dom - (fuel_l * dens - taxi)
      - id: d2
        formula: mzfm - dom
      - id: d3
        formula: mlm - dom - (fuel_l * dens - trip)
      - id: d4
        formula: mrm - dom - fuel_l * dens
    presets:
      - id: p1
        values:
          fuel_l: 20100
          dens: 0.79
          mrm: 69900
          mtom: 69300
          mlm: 58900
          mzfm: 52740
          tom_perf: 67330
          dom: 34930
          trip: 5990
          taxi: 250
      - id: p2
        values:
          fuel_l: 18000
          dens: 0.8
          mrm: 69900
          mtom: 69300
          mlm: 58900
          mzfm: 52740
          tom_perf: 66500
          dom: 34930
          trip: 5990
          taxi: 250
    explanation: >-
      The fuel volume is converted into mass with the density; the take-off fuel
      is the block fuel minus taxi fuel. The traffic load is then limited by the
      lowest of the zero fuel, take-off (structural or performance), landing and
      ramp limits.


      **Solution**


      Block fuel = {{= fuel_l * dens}} kg


      - Zero fuel mass: {{= mzfm - dom}} kg

      - Take-off mass: {{= min(mtom, tom_perf) - dom - (fuel_l * dens - taxi)}}
      kg

      - Landing mass: {{= mlm - dom - (fuel_l * dens - taxi - trip)}} kg

      - Ramp mass: {{= mrm - dom - fuel_l * dens}} kg


      The smallest value limits the traffic load: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the take-off mass limit is applied.

      - **{{d2}} kg**: only the zero fuel mass limit is applied.

      - **{{d3}} kg**: the taxi fuel is not deducted when computing the take-off
      fuel for the landing limit.

      - **{{d4}} kg**: only the ramp mass limit is applied.
- id: Q4BTNLNVV
  docId: "031.02"
