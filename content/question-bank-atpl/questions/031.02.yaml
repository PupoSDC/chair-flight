  template:
    type: calculation
    question: >-
      A revenue flight is planned for a transport aeroplane. Take-off mass is
      not airfield limited.


      Data:


      - Dry Operating Mass {{dom}} kg

      - Performance limited landing mass {{mlm}} kg

      - Taxi fuel {{taxi}} kg

      - Trip fuel {{trip}} kg

      - Contingency and final reserve fuel {{cont}} kg

      - Alternate fuel {{alt}} kg

      - Passengers on board {{pax}}

      - Standard mass per passenger {{pax_mass}} kg

      - Baggage per passenger {{bag}} kg


      Traffic load is the maximum possible. Determine the maximum cargo load
      that may be carried without exceeding the limiting landing mass.
    variables:
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: mlm
        label: Performance limited landing mass
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: cont
        label: Contingency and final reserve fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: pax
        label: Number of passengers
        unit: "-"
      - id: pax_mass
        label: Standard mass per passenger
        unit: kg
      - id: bag
        label: Baggage per passenger
        unit: kg
    answer:
      formula: mlm - dom - (cont + alt) - pax * (pax_mass + bag)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mlm - dom - pax * (pax_mass + bag)
      - id: d2
        formula: mlm - dom - (cont + alt) - pax * pax_mass
      - id: d3
        formula: mlm - dom - (taxi + cont + alt) - pax * (pax_mass + bag)
      - id: d4
        formula: mlm - dom - cont - pax * (pax_mass + bag)
    presets:
      - id: p1
        values:
          dom: 34930
          mlm: 55000
          taxi: 350
          trip: 9730
          cont: 1200
          alt: 1600
          pax: 130
          pax_mass: 84
          bag: 14
      - id: p2
        values:
          dom: 35000
          mlm: 56000
          taxi: 300
          trip: 9000
          cont: 1300
          alt: 1700
          pax: 120
          pax_mass: 84
          bag: 15
      - id: p3
        values:
          dom: 34500
          mlm: 54500
          taxi: 400
          trip: 8800
          cont: 1100
          alt: 1500
          pax: 110
          pax_mass: 84
          bag: 13
    explanation: >-
      The landing mass is the dry operating mass plus the traffic load plus the
      fuel remaining at landing (contingency/final reserve and alternate fuel);
      taxi and trip fuel are burnt before landing. The cargo is what remains of
      the allowed landing mass after deducting the passengers, their baggage,
      the DOM and the landing fuel.


      **Solution**


      Landing fuel = {{cont}} + {{alt}} = {{= cont + alt}} kg


      Passengers and baggage = {{= pax * (pax_mass + bag)}} kg


      {{f: mlm - dom - (cont + alt) - pax * (pax_mass + bag)}} = {{n: mlm - dom
      - (cont + alt) - pax * (pax_mass + bag)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the fuel on board at landing is forgotten.

      - **{{d2}} kg**: the passengers baggage is not deducted.

      - **{{d3}} kg**: taxi fuel is wrongly deducted although it is burnt before
      landing.

      - **{{d4}} kg**: the alternate fuel is forgotten in the landing fuel.
