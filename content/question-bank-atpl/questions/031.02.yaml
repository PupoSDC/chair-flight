  template:
    type: calculation
    question: >-
      Determine the Take-off Mass for the following single engine aeroplane.
      Given:


      - Basic Empty Mass: {{bem}} lb

      - Pilot + front seat passenger: {{crew}} lb

      - Cargo mass: {{cargo}} lb

      - Ramp fuel = block fuel: {{block}} gal

      - Trip fuel: {{trip}} gal

      - Fuel density: {{dens}} lb/gal

      - Taxi fuel: {{taxi}} lb
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: crew
        label: Pilot and passenger
        unit: lb
      - id: cargo
        label: Cargo mass
        unit: lb
      - id: block
        label: Block fuel
        unit: gal
      - id: trip
        label: Trip fuel
        unit: gal
      - id: dens
        label: Fuel density
        unit: lb/gal
      - id: taxi
        label: Taxi fuel
        unit: lb
    answer:
      formula: bem + crew + cargo + block * dens - taxi
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: bem + crew + cargo + block * dens
      - id: d2
        formula: bem + crew + cargo + trip * dens - taxi
      - id: d3
        formula: bem + crew + cargo + block * dens + taxi
      - id: d4
        formula: bem + crew + cargo
    presets:
      - id: p1
        values:
          bem: 1799
          crew: 300
          cargo: 350
          block: 60
          trip: 35
          dens: 6
          taxi: 10
      - id: p2
        values:
          bem: 1500
          crew: 250
          cargo: 200
          block: 50
          trip: 30
          dens: 6
          taxi: 8
      - id: p3
        values:
          bem: 2100
          crew: 350
          cargo: 400
          block: 70
          trip: 40
          dens: 6
          taxi: 12
    explanation: >-
      Take-off mass is the basic empty mass plus payload plus the fuel on board
      at brake release. The fuel on board is the block (ramp) fuel minus the
      taxi fuel; the trip fuel is burned later and does not reduce the take-off
      mass.


      **Solution**


      Block fuel = {{= block * dens}} lb


      {{f: bem + crew + cargo + block * dens - taxi}} = {{n: bem + crew + cargo
      + block * dens - taxi}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: taxi fuel is not subtracted.

      - **{{d2}} lb**: trip fuel is used instead of the block fuel.

      - **{{d3}} lb**: taxi fuel is added instead of subtracted.

      - **{{d4}} lb**: the fuel is forgotten.
