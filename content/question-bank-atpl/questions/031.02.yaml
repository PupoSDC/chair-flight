  template:
    type: calculation
    question: >-
      A revenue flight is to be made by a jet transport with the following
      structural limits:


      - Maximum Ramp Mass {{mrm}} kg

      - Maximum Take-off Mass {{mtom}} kg

      - Maximum Landing Mass {{mlm}} kg

      - Maximum Zero Fuel Mass {{mzfm}} kg

      - Dry Operating Mass {{dom}} kg


      Fuel:


      - Trip {{trip}} kg

      - Taxi {{taxi}} kg

      - Contingency and Final Reserve {{cont}} kg

      - Alternate {{alt}} kg


      Take-off and landing mass are not performance limited. What is the maximum
      traffic load that can be carried?
    variables:
      - id: mrm
        label: Maximum ramp mass
        unit: kg
      - id: mtom
        label: Maximum take-off mass
        unit: kg
      - id: mlm
        label: Maximum landing mass
        unit: kg
      - id: mzfm
        label: Maximum zero fuel mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: cont
        label: Contingency and final reserve fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
    answer:
      formula: min(mzfm - dom, mlm - dom - (cont + alt), mtom - dom - (trip + cont +
        alt), mrm - dom - (taxi + trip + cont + alt))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mrm - dom - (taxi + trip + cont + alt)
      - id: d2
        formula: mlm - dom - (cont + alt)
      - id: d3
        formula: mtom - dom - (trip + cont + alt)
      - id: d4
        formula: mtom - dom - (taxi + trip + cont + alt)
    presets:
      - id: p1
        values:
          mrm: 69900
          mtom: 69300
          mlm: 58900
          mzfm: 52740
          dom: 34930
          trip: 11500
          taxi: 250
          cont: 1450
          alt: 1350
      - id: p2
        values:
          mrm: 70200
          mtom: 69600
          mlm: 59000
          mzfm: 53000
          dom: 35000
          trip: 10800
          taxi: 300
          cont: 1400
          alt: 1300
    explanation: >-
      The traffic load is limited by the most restrictive of the structural
      limits: zero fuel mass, landing mass, take-off mass and ramp mass. Each
      limit is converted into a traffic load by deducting DOM and the fuel on
      board at that point; the smallest result applies.


      **Solution**


      - Zero fuel mass: {{= mzfm - dom}} kg

      - Landing mass: {{= mlm - dom - (cont + alt)}} kg

      - Take-off mass: {{= mtom - dom - (trip + cont + alt)}} kg

      - Ramp mass: {{= mrm - dom - (taxi + trip + cont + alt)}} kg


      The smallest value limits the traffic load: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the ramp mass limit is applied.

      - **{{d2}} kg**: only the landing mass limit is applied.

      - **{{d3}} kg**: only the take-off mass limit is applied.

      - **{{d4}} kg**: only the take-off mass limit is applied and the taxi fuel
      is deducted although it is burnt before take-off.
