  template:
    type: calculation
    question: |-
      The following data applies to an aeroplane which is about to take off:

      - Certified maximum take-off mass: {{mtom}} kg
      - Performance limited take-off mass: {{ptom}} kg
      - Dry Operating Mass: {{dom}} kg
      - Crew and crew hand baggage mass: {{crew_mass}} kg
      - Crew baggage in hold: {{crew_baggage}} kg
      - Take-off fuel: {{fuel}} kg

      From this data calculate the maximum traffic load.
    variables:
      - id: mtom
        label: Certified MTOM
        unit: kg
      - id: ptom
        label: Performance-limited TOM
        unit: kg
      - id: dom
        label: DOM
        unit: kg
      - id: crew_mass
        label: Crew and hand baggage
        unit: kg
      - id: crew_baggage
        label: Crew baggage in hold
        unit: kg
      - id: fuel
        label: Take-off fuel
        unit: kg
    answer:
      formula: min(mtom, ptom) - dom - fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(mtom, ptom) - dom
      - id: d2
        formula: min(mtom, ptom) - dom - fuel - crew_mass - crew_baggage
      - id: d3
        formula: min(mtom, ptom) - dom - crew_mass - crew_baggage
    presets:
      - id: p1
        values:
          mtom: 141500
          ptom: 137300
          dom: 58400
          crew_mass: 640
          crew_baggage: 110
          fuel: 60700
      - id: p2
        values:
          mtom: 79000
          ptom: 77500
          dom: 42000
          crew_mass: 300
          crew_baggage: 60
          fuel: 22000
      - id: p3
        values:
          mtom: 62500
          ptom: 60000
          dom: 33000
          crew_mass: 280
          crew_baggage: 50
          fuel: 14000
    explanation: >-
      The maximum take-off mass is the lower of the certified and the
      performance-limited values. The dry operating mass already includes the
      crew and their baggage, so the traffic load is the take-off mass minus the
      DOM and the take-off fuel.


      **Solution**


      Limiting take-off mass = {{= min(mtom, ptom)}} kg


      {{f: min(mtom, ptom) - dom - fuel}} = {{n: min(mtom, ptom) - dom - fuel}}
      = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Forgets to subtract the take-off fuel.

      - **{{d2}} kg**: Subtracts the crew masses a second time, although they
      are already included in the DOM.

      - **{{d3}} kg**: Forgets the fuel and subtracts the crew masses, which are
      already in the DOM.
- id: QPJFLOJA
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315232
    - AVEXAM-14383
    - AVEXAM-84806
    - ATPLGS-126745
    - AVEXAM-40022
    - AVEXAM-976
