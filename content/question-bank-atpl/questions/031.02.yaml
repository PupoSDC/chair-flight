      The following data applies to a planned flight.


      - Dry Operating Mass: {{dom}} kg

      - Performance limited Take-Off Mass: {{ptom}} kg

      - Performance limited Landing Mass: {{plm}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg


      Fuel required at ramp:


      - Taxi fuel: {{taxi}} kg

      - Trip fuel: {{trip}} kg

      - Contingency fuel: {{cont}} kg

      - Alternate fuel: {{alt}} kg

      - Final reserve fuel: {{res}} kg

      - Traffic load: {{traffic}} kg


      Fuel costs at the departure airfield are such that it is decided to load
      the maximum fuel quantity possible. The total fuel (ramp fuel) which may
      be safely loaded prior to departure is:
    variables:
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: ptom
        label: Performance limited TOM
        unit: kg
      - id: plm
        label: Performance limited LM
        unit: kg
