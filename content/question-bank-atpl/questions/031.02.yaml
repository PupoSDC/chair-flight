  template:
    type: calculation
    question: >-
      Determine the maximum traffic load that can be carried, given:


      - Maximum structural take-off mass {{mtom}} kg

      - Dry operating mass {{dom}} kg (including crew and operational equipment
      of {{crew}} kg)

      - Take-off fuel {{fuel}} kg
    variables:
      - id: mtom
        label: Maximum structural take-off mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: crew
        label: Crew and operational equipment
        unit: kg
      - id: fuel
        label: Take-off fuel
        unit: kg
    answer:
      formula: mtom - dom - fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mtom - dom - crew - fuel
      - id: d2
        formula: mtom - dom
      - id: d3
        formula: mtom - dom - crew
      - id: d4
        formula: mtom - dom + crew - fuel
    presets:
      - id: p1
        values:
          mtom: 5200
          dom: 2840
          crew: 360
          fuel: 950
      - id: p2
        values:
          mtom: 5600
          dom: 3000
          crew: 400
          fuel: 1000
      - id: p3
        values:
          mtom: 4800
          dom: 2600
          crew: 300
          fuel: 900
    explanation: >-
      Traffic load = take-off mass - dry operating mass - take-off fuel. The dry
      operating mass already includes the crew and operational equipment, so
      these must not be deducted again.


      **Solution**


      {{f: mtom - dom - fuel}} = {{n: mtom - dom - fuel}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the crew and equipment is deducted twice, as it is
      already part of the dry operating mass.

      - **{{d2}} kg**: the take-off fuel is forgotten.

      - **{{d3}} kg**: the fuel is not deducted and the crew is deducted twice.

      - **{{d4}} kg**: the crew mass is wrongly added.
