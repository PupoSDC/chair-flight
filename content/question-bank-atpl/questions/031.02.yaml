  template:
    type: calculation
    question: |-
      Given the following information, what is the Underload/Overload?

      - Maximum Structural Take-Off Mass: {{mtom_struct}} kg
      - Performance Limited Take-Off Mass: {{mtom_perf}} kg
      - Performance Limited Landing Mass: {{plm}} kg
      - Operating Mass: {{om}} kg
      - Take-Off Fuel: {{tof}} kg
      - Trip Fuel: {{trip}} kg
      - Mass of the crew and their baggage: {{crew}} kg
      - Traffic Load: {{tl}} kg
    variables:
      - id: mtom_struct
        label: Maximum Structural TOM
        unit: kg
      - id: mtom_perf
        label: Performance Limited TOM
        unit: kg
      - id: plm
        label: Performance Limited Landing Mass
        unit: kg
      - id: om
        label: Operating Mass
        unit: kg
      - id: tof
        label: Take-Off Fuel
        unit: kg
      - id: trip
        label: Trip Fuel
        unit: kg
      - id: crew
        label: Crew and baggage mass
        unit: kg
      - id: tl
        label: Traffic Load
        unit: kg
    answer:
      formula: min(mtom_struct, mtom_perf) - om - tl
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: om + crew + tl - mtom_struct
      - id: d2
        formula: om + tof + tl - trip - mtom_perf
      - id: d3
        formula: plm - om + trip - tl
    presets:
      - id: p1
        values:
          mtom_struct: 6400
          mtom_perf: 6400
          plm: 5430
          om: 4480
          tof: 1440
          trip: 1090
          crew: 235
          tl: 1870
      - id: p2
        values:
          mtom_struct: 6400
          mtom_perf: 6100
          plm: 5300
          om: 4350
          tof: 1380
          trip: 1050
          crew: 230
          tl: 1650
    explanation: >-
      The take-off mass is limited by the lower of the structural and the
      performance limit. The Operating Mass already contains the crew, their
      baggage and the fuel, so the underload is the limiting take-off mass minus
      the operating mass minus the traffic load. The landing limit is not
      restrictive here because the landing mass limit plus trip fuel exceeds the
      take-off limit.


      **Solution**


      {{f: min(mtom_struct, mtom_perf) - om - tl}} = {{n: min(mtom_struct,
      mtom_perf) - om - tl}} = **{{answer}} kg** Underload


      **Why the other answers are wrong**


      - **{{d1}} kg**: an overload obtained by adding the crew mass again to the
      operating mass, double counting the crew.

      - **{{d2}} kg**: an overload obtained by mixing the fuel terms into the
      sum (adding take-off fuel and subtracting trip fuel).

      - **{{d3}} kg**: the margin to the landing limit instead (landing mass
      limit plus trip fuel, minus operating mass and traffic load), which is not
      the limiting condition.
