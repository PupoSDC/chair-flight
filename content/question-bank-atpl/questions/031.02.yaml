- id: QQRTPQJP
  docId: "031.02"
  relatedQuestions:
    - QMWECXBB
  externalIds:
    - ATPLQ-314126
    - BGS-310563
    - AVEXAM-2786
  annexes:
    - 031-standard-mass-values
  learningObjectives:
    - 031.02.03.03.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure or CAP 696 file. An aeroplane fitted with 106
      passenger seats operates a holiday charter flight within the European
      region. The passengers and baggage on board are:


      - Males: {{male_count}}

      - Females: {{female_count}}

      - Children: {{child_count}}

      - Infants: 5 (they take the same seat as their parents)

      - Checked baggage: {{bag_count}} pieces


      The operator uses standard masses for the passengers (all adults) and for
      the checked baggage. There are no cargo items in the holds. The standard
      masses of a male, a female, a child and one piece of checked baggage are
      read from the figure or CAP 696.


      What is the traffic load of this flight (kg)?
    variables:
      - id: male_count
        label: Males
        unit: ""
      - id: female_count
        label: Females
        unit: ""
      - id: child_count
        label: Children
        unit: ""
      - id: bag_count
        label: Pieces of checked baggage
        unit: ""
      - id: male_mass
        label: Standard mass of a male (read from the figure)
        unit: kg
      - id: female_mass
        label: Standard mass of a female (read from the figure)
        unit: kg
      - id: child_mass
        label: Standard mass of a child (read from the figure)
        unit: kg
      - id: bag_mass
        label: Standard mass of one piece of checked baggage (read from the figure)
        unit: kg
    chartInputs:
      - male_mass
      - female_mass
      - child_mass
      - bag_mass
    answer:
      formula: male_count * male_mass + female_count * female_mass + child_count *
        child_mass + bag_count * bag_mass
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: male_count * male_mass + female_count * female_mass + child_count *
          child_mass + bag_count * bag_mass + 5 * child_mass
      - id: d2
        formula: male_count * male_mass + female_count * female_mass + child_count *
          child_mass
      - id: d3
        formula: male_count * male_mass + female_count * female_mass + child_count *
          child_mass + (male_count + female_count + child_count) * bag_mass
      - id: d4
        formula: male_count * male_mass + female_count * female_mass - child_count *
          child_mass + bag_count * bag_mass
    presets:
      - id: p1
        values:
          male_count: 46
          female_count: 38
          child_count: 12
          bag_count: 62
          male_mass: 84
          female_mass: 68
          child_mass: 40
          bag_mass: 11
    explanation: >-
      Traffic load is the mass of the passengers and their checked baggage.
      Infants share the seat of a parent, so they are not counted as separate
      passengers. Standard masses are used, so each group is multiplied by its
      standard mass.


      **Solution**


      - Males: {{= male_count * male_mass}} kg

      - Females: {{= female_count * female_mass}} kg

      - Children: {{= child_count * child_mass}} kg

      - Checked baggage: {{= bag_count * bag_mass}} kg

      - Traffic load = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the five infants are counted at child mass, although they
      share a parent's seat.

      - **{{d2}} kg**: the checked baggage is left out.

      - **{{d3}} kg**: the baggage count is applied to all passengers instead of
      to the pieces of baggage.

      - **{{d4}} kg**: the children are subtracted instead of added.
