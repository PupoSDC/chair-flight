      {{f: vol * 3.78541}} = {{n: vol * 3.78541}} = **{{answer}} litres**


      **Why the other answers are wrong**


      - **{{d1}} litres**: divided by 3.78541 instead of multiplied.

      - **{{d2}} litres**: divided by 4.54609 (Imperial gallon), i.e. wrong
      factor and wrong direction.

      - **{{d3}} litres**: the Imperial gallon factor (4.54609) was used instead
      of the US gallon factor.
