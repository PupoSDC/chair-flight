  template:
    type: calculation
    question: |-
      Determine the ramp mass in the following conditions:

      - Basic empty mass (BEM): {{bem}} lb
      - Arm for BEM: {{bemarm}} in
      - One pilot: {{pilot}} lb
      - Front seat passenger: {{front}} lb
      - Centre seat passengers: {{centre}} lb
      - One passenger rear seat: {{rear}} lb
      - Baggage in zone 1: {{bag1}} lb
      - Baggage in zone 4: {{bag4}} lb
      - Block fuel: {{block}} US Gal
      - Trip fuel: {{trip}} US Gal
      - Fuel for start up and taxi: {{taxi}} US Gal
      - Fuel density: {{dens}} lb/US Gal
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: bemarm
        label: BEM arm
        unit: in
      - id: pilot
        label: Pilot
        unit: lb
      - id: front
        label: Front seat passenger
        unit: lb
      - id: centre
        label: Centre seat passengers
        unit: lb
      - id: rear
        label: Rear seat passenger
        unit: lb
      - id: bag1
        label: Baggage zone 1
        unit: lb
      - id: bag4
        label: Baggage zone 4
        unit: lb
      - id: block
        label: Block fuel
        unit: US Gal
      - id: trip
        label: Trip fuel
        unit: US Gal
      - id: taxi
        label: Start-up and taxi fuel
        unit: US Gal
      - id: dens
        label: Fuel density
        unit: lb/US Gal
    answer:
      formula: bem + pilot + front + centre + rear + bag1 + bag4 + block * dens
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: bem + pilot + front + centre + rear + bag1 + bag4
      - id: d2
        formula: bem + pilot + front + centre + rear + bag1 + bag4 + (block - trip) *
          dens
      - id: d3
        formula: bem + pilot + front + centre + rear + bag1 + bag4 + (block - trip -
          taxi) * dens
      - id: d4
        formula: bem + pilot + front + centre + rear + bag1 + bag4 + (trip + taxi) *
          dens
    presets:
      - id: p1
        values:
          bem: 3210
          bemarm: 88.5
          pilot: 160
          front: 200
          centre: 290
          rear: 110
          bag1: 100
          bag4: 50
          block: 100
          trip: 55
          taxi: 3
          dens: 6
      - id: p2
        values:
          bem: 2980
          bemarm: 90.2
          pilot: 170
          front: 180
          centre: 310
          rear: 120
          bag1: 90
          bag4: 40
          block: 90
          trip: 50
          taxi: 4
          dens: 6
      - id: p3
        values:
          bem: 3340
          bemarm: 87
          pilot: 180
          front: 190
          centre: 280
          rear: 100
          bag1: 80
          bag4: 60
          block: 110
          trip: 60
          taxi: 3
          dens: 6
    explanation: >-
      The ramp mass is the mass of the aircraft at the start of taxi, before any
      fuel is burned: basic empty mass plus all payload plus the full block fuel
      (not only the fuel for the trip). Fuel volume is converted to mass with
      the fuel density. The arm of the BEM is not needed for a mass calculation.


      **Solution**


      Payload = {{= pilot + front + centre + rear + bag1 + bag4}} lb

      Block fuel = {{block}} × {{dens}} = {{= block * dens}} lb


      {{bem}} + {{= pilot + front + centre + rear + bag1 + bag4}} + {{= block *
      dens}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: forgets the fuel completely (zero fuel mass).

      - **{{d2}} lb**: adds only the fuel remaining after the trip (block minus
      trip).

      - **{{d3}} lb**: adds only the fuel remaining after trip and taxi.

      - **{{d4}} lb**: adds only the fuel that is burned (trip and taxi) instead
      of the block fuel.
