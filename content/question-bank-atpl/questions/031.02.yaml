  template:
    type: chart
    question: "Refer to figure or CAP696 Figure 4.9. For a cargo compartment with an
      area between balance arms (BA) of {{ba_from}} in and {{ba_to}} in,
      determine the (1) maximum running load, (2) maximum distribution load
      intensity and (3) the maximum load:"
    explanation: ""
    variables:
      - id: ba_from
        label: BA start
        unit: in
      - id: ba_to
        label: BA end
        unit: in
    entries:
      - id: e1
        values:
          ba_from: 286
          ba_to: 343
        answer: (1) 8.47 kg/in, (2) 68 kg/ft2, (3) 483 kg
        wrongAnswers:
          - (1) 13.15 kg/in, (2) 68 kg/ft2, (3) 762 kg
          - (1) 7.18 kg/in, (2) 68 kg/ft2, (3) 414 kg
          - (1) 13.12 kg/in, (2) 68 kg/ft2, (3) 2 059 kg
        explanation: >-
          The figure gives the maximum running load and the maximum distribution
          load intensity for the area between the balance arms. The maximum load
          is the running load multiplied by the length of the area.


          **Solution**


          - Length of the area: {{ba_to}} in minus {{ba_from}} in = 57 in

          - Running load (1): read from the figure, **8.47 kg/in**

          - Distribution load intensity (2): read from the figure, **68 kg/ft²**

          - Maximum load (3): 8.47 kg/in × 57 in = **483 kg**
      - id: e2
        values:
          ba_from: 940
          ba_to: 997
        answer: (1) 7.26 kg/in, (2) 68 kg/ft2, (3) 414 kg
        wrongAnswers:
          - (1) 8.47 kg/in, (2) 68 kg/ft2, (3) 483 kg
          - (1) 14.65 kg/in, (2) 68 kg/ft2, (3) 3062 kg
          - (1) 68 kg/in, (2) 7.18 kg/ft2, (3) 711 kg
        explanation: >-
          The figure gives the maximum running load and the maximum distribution
          load intensity for the area between the balance arms. The maximum load
          is the running load multiplied by the length of the area.


          **Solution**


          - Length of the area: {{ba_to}} in minus {{ba_from}} in = 57 in

          - Running load (1): read from the figure, **7.26 kg/in**

          - Distribution load intensity (2): read from the figure, **68 kg/ft²**

          - Maximum load (3): 7.26 kg/in × 57 in = **414 kg**
