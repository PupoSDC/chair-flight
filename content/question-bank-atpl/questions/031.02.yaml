    explanation: >-
      The traffic load is limited by three structural limits: the zero fuel mass
      (MZFM - DOM), the take-off mass (MTOM - DOM - fuel at brakes release) and
      the landing mass (MLM - DOM - fuel remaining at landing). The smallest of
      the three applies.


      **Solution**


      Zero fuel limit = {{= mzfm - dom}} kg

      Take-off limit = {{= mtom - dom - block}} kg

      Landing limit = {{= mlm - dom - (block - trip)}} kg


      The lowest is the maximum traffic load: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Applies only the zero fuel mass limit.

      - **{{d2}} kg**: Applies only the take-off mass limit.

      - **{{d3}} kg**: Subtracts the trip fuel from the zero fuel mass limit,
      which does not contain fuel.
- id: QMWECXBB
  docId: "031.02"
  relatedQuestions:
    - QHYHXL7UU
  externalIds:
    - ATPLQ-314572
    - AVEXAM-48331
    - BGS-310492
    - AVEXAM-55005
  annexes:
    - 031-standard-mass-values
  learningObjectives:
    - 031.02.03.03.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. You are about to depart on a domestic commercial
      flight with an aircraft that has a capacity of 2 flight crew members and
      10 passengers. Calculate the traffic load using the standard passenger and
      baggage masses from the annex. The flight crew is not part of the traffic
      load.


      - Flight crew: {{crew_count}}, standard mass {{crew_mass}} kg each

      - Male passengers: {{male_count}}

      - Female passengers: {{female_count}}

      - Checked baggage: 6 pieces, total mass {{baggage_mass}} kg

      - Hand baggage: 3 pieces


      The standard masses of a male passenger, a female passenger and the hand
      baggage are read from the annex.


      What is the traffic load (kg)?
    variables:
      - id: male_count
        label: Male passengers
        unit: ""
      - id: female_count
        label: Female passengers
        unit: ""
      - id: crew_count
        label: Flight crew
        unit: ""
      - id: crew_mass
        label: Standard mass of a flight crew member
        unit: kg
      - id: baggage_mass
        label: Checked baggage mass
        unit: kg
      - id: male_mass
        label: Standard mass of a male passenger (read from the annex)
        unit: kg
      - id: female_mass
        label: Standard mass of a female passenger (read from the annex)
        unit: kg
      - id: hand_mass
        label: Standard mass of the hand baggage, 3 pieces (read from the annex)
        unit: kg
    chartInputs:
      - male_mass
      - female_mass
      - hand_mass
    answer:
      formula: male_count * male_mass + female_count * female_mass + baggage_mass +
        hand_mass
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: male_count * male_mass + female_count * female_mass + baggage_mass +
          hand_mass + crew_count * crew_mass
      - id: d2
        formula: male_count * male_mass + female_count * female_mass + baggage_mass
      - id: d3
        formula: (male_count + female_count) * male_mass + baggage_mass + hand_mass
      - id: d4
        formula: male_count * male_mass + female_count * female_mass - baggage_mass +
          hand_mass
    presets:
      - id: p1
        values:
          male_count: 2
          female_count: 3
          crew_count: 2
          crew_mass: 85
          baggage_mass: 63
          male_mass: 88
          female_mass: 70
          hand_mass: 20
    explanation: >-
      Traffic load is the mass of the passengers and their baggage. The flight
      crew is not included, so their mass is not added. Each passenger mass
      comes from the annex and is multiplied by the number of passengers of that
      type. The baggage is then added.


      **Solution**


      - Male passengers: {{male_count}} x {{male_mass}} kg = {{= male_count *
      male_mass}} kg

      - Female passengers: {{female_count}} x {{female_mass}} kg = {{=
      female_count * female_mass}} kg

      - Checked baggage and hand baggage: {{= baggage_mass + hand_mass}} kg

      - Traffic load = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the flight crew is added, although the crew are not part
      of the traffic load.

      - **{{d2}} kg**: the hand baggage is left out.

      - **{{d3}} kg**: every passenger is given the male standard mass.

      - **{{d4}} kg**: the checked baggage is subtracted instead of added.
- id: QNGDRAVM
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-312969
    - AVEXAM-36188
    - BGS-310610
    - AVEXAM-91318
    - ATPLGS-126654
    - ATPLGS-126734
    - BGS-310281
    - ATPLGS-113626
    - ATPLGS-107120
    - BGS-310737
    - BGS-310283
  annexes: []
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: calculation
    question: |-
      Determine the Landing Mass, given:

      - Basic Empty Mass: {{bem}} lb
      - Pilot and front passenger: {{crew}} lb
      - Passengers (centre seats): {{pax}} lb
      - Baggage zone 1: {{bag1}} lb
      - Baggage zone 4: {{bag4}} lb
      - Fuel loading: {{fuel}} US gal
      - Fuel allowance for start, taxi and run up: {{taxi}} US gal
      - Estimated fuel burn-off: {{burn}} US gal
      - Fuel density: {{dens}} lb/US gal
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: crew
        label: Pilot and front passenger
        unit: lb
      - id: pax
        label: Passengers
        unit: lb
      - id: bag1
        label: Baggage zone 1
        unit: lb
      - id: bag4
        label: Baggage zone 4
        unit: lb
      - id: fuel
        label: Fuel loaded
        unit: US gal
      - id: taxi
        label: Start/taxi/run-up fuel
        unit: US gal
      - id: burn
        label: Fuel burn-off
        unit: US gal
      - id: dens
        label: Fuel density
        unit: lb/US gal
    answer:
      formula: bem + crew + pax + bag1 + bag4 + (fuel - taxi - burn) * dens
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: bem + crew + pax + bag1 + bag4 + (fuel - burn + taxi) * dens
      - id: d2
        formula: bem + crew + pax + bag1 + bag4 + (fuel - taxi) * dens
      - id: d3
        formula: bem + crew + pax + bag1 + bag4 + fuel * dens
      - id: d4
        formula: bem + crew + pax + bag1 + bag4
    presets:
      - id: p1
        values:
          bem: 3210
          crew: 380
          pax: 330
          bag1: 100
          bag4: 100
          fuel: 85
          taxi: 4
          burn: 60
          dens: 6
      - id: p2
        values:
          bem: 3150
          crew: 350
          pax: 300
          bag1: 80
          bag4: 60
          fuel: 90
          taxi: 3
          burn: 65
          dens: 6
      - id: p3
        values:
          bem: 3300
          crew: 400
          pax: 340
          bag1: 90
          bag4: 50
          fuel: 80
          taxi: 5
          burn: 55
          dens: 6
    explanation: >-
      Landing mass is the zero-fuel mass (empty mass plus payload) plus the fuel
      remaining at landing. The fuel remaining is the fuel loaded minus the
      start/taxi/run-up allowance and the trip burn-off.


      **Solution**


      Zero-fuel mass = {{= bem + crew + pax + bag1 + bag4}} lb

      Fuel at landing = {{= fuel - taxi - burn}} US gal = {{= (fuel - taxi -
      burn) * dens}} lb

      Landing mass = {{= bem + crew + pax + bag1 + bag4}} + {{= (fuel - taxi -
      burn) * dens}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: Adds the taxi fuel instead of subtracting it.

      - **{{d2}} lb**: Subtracts only the taxi fuel and forgets the burn-off
      (this is the take-off mass).

      - **{{d3}} lb**: Uses the whole fuel load (ramp mass), subtracting
      nothing.

      - **{{d4}} lb**: Forgets the fuel altogether (zero-fuel mass).
