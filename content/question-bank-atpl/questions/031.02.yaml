- id: QFJHPFWR
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318873
    - AVEXAM-57342
    - BGS-310645
    - ATPLGS-113455
    - BGS-310124
  annexes:
    - cap-696-page-35-figure-4.12
  learningObjectives:
    - 031.02.03.02.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 696 file 4.12). A medium range twin jet transport
      is scheduled to operate from a departure airfield where conditions limit
      the take-off mass to {{tomlim}} kg. The destination airfield has a
      performance limited landing mass of {{mlm}} kg. The dry operating mass is
      {{dom}} kg (assume the zero fuel mass limit is not restrictive). Loading
      data:


      - Taxi fuel: {{taxi}} kg

      - Trip fuel: {{trip}} kg

      - Contingency and final reserve fuel: {{res}} kg

      - Alternate fuel: {{alt}} kg

      - Traffic load: {{tl}} kg


      Changes in trip fuel caused by changes in total mass may be disregarded.
      What is the maximum traffic load, in kg, that can be carried without
      exceeding any limit?
    variables:
      - id: tomlim
        label: Take-off mass limit
        unit: kg
      - id: mlm
        label: Landing mass limit
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: res
        label: Contingency and final reserve fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: tl
        label: Planned traffic load
        unit: kg
    chartInputs:
      - tomlim
      - mlm
    answer:
      formula: min(tl, tomlim - dom - (trip + res + alt), mlm - dom - (res + alt))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tl
      - id: d2
        formula: tomlim - dom - (trip + res + alt + taxi)
      - id: d3
        formula: mlm - dom - (taxi + trip + res + alt)
      - id: d4
        formula: mlm - dom - (res + alt + taxi)
      - id: d5
        formula: tl + 200
    presets:
      - id: p1
        values:
          tomlim: 65050
          mlm: 54500
          dom: 34900
          taxi: 350
          trip: 9250
          res: 1100
          alt: 1000
          tl: 18600
    explanation: >-
      The traffic load may not exceed what the take-off mass limit and the
      landing mass limit allow. At take-off the fuel on board is trip + reserves
      + alternate (taxi fuel is burnt before the take-off run); at landing only
      reserves + alternate remain. The smallest of the planned load and the two
      limit-derived loads governs.


      **Solution**


      Take-off limit: {{tomlim}} - {{dom}} - {{= trip + res + alt}} = {{= tomlim
      - dom - (trip + res + alt)}} kg


      Landing limit: {{mlm}} - {{dom}} - {{= res + alt}} = {{= mlm - dom - (res
      + alt)}} kg


      Planned load: {{tl}} kg


      Maximum traffic load = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the planned load, ignoring the landing mass limit.

      - **{{d2}} kg**: subtracts the taxi fuel from the take-off mass, although
      it is burnt before take-off.

      - **{{d3}} kg**: subtracts the whole fuel load (including trip fuel) from
      the landing mass limit.

      - **{{d4}} kg**: also subtracts the taxi fuel from the landing mass limit.

      - **{{d5}} kg**: adds extra load to the planned figure although a limit is
      already exceeded.
- id: QFKZMM2DB
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315622
  annexes: []
  learningObjectives:
    - 031.02.01.02.04
  template:
    type: calculation
    question: For mass and balance purposes {{mass}} lb of Jet A-1 fuel needs to be
      drained before take-off. What is the volume of the drained fuel, in US
      gallons, if its specific gravity is {{sg}}? (1 kg = 2.2046 lb, 1 US gal =
      3.785 l)
    variables:
      - id: mass
        label: Mass of fuel
        unit: lb
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: mass / 2.2046 / sg / 3.785
      unit: US gal
      decimals: 0
    distractors:
      - id: d1
        formula: mass / 2.2046 / sg
      - id: d2
        formula: mass / 2.2046 / sg / 4.546
      - id: d3
        formula: mass / sg / 3.785
      - id: d4
        formula: mass / 2.2046 * sg / 3.785
    presets:
      - id: p1
        values:
          mass: 650
          sg: 0.8
      - id: p2
        values:
          mass: 800
          sg: 0.8
      - id: p3
        values:
          mass: 500
          sg: 0.79
    explanation: >-
      Volume is mass divided by density. Convert lb to kg, divide by the SG to
      get litres, then convert litres to US gallons.


      **Solution**


      {{f: mass / 2.2046 / sg / 3.785}} = {{n: mass / 2.2046 / sg / 3.785}} =
      **{{answer}} US gal**


      **Why the other answers are wrong**


      - **{{d1}} US gal**: This is the volume in litres; the conversion to US
      gallons was forgotten.

      - **{{d2}} US gal**: Converts to Imperial gallons (4.546 l) instead of US
      gallons.

      - **{{d3}} US gal**: Forgets to convert lb to kg.

      - **{{d4}} US gal**: Multiplies by the SG instead of dividing.
