- id: QCJWQFSK
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316054
    - AVEXAM-70439
  annexes: []
  learningObjectives:
    - 031.02.03.02.01
  template:
    type: calculation
    question: >-
      The total mass limit of a light twin is equal to {{maxm}} lb.


      The pilot weighs {{pilot}} lb and the combined mass of the passengers and
      their baggage is {{pax}} lb.


      Assuming a Dry Operating Mass of {{dom}} lb (including the pilot), how
      much fuel can be loaded?


      Give the answer in kg (1 lb = 0.4536 kg).
    variables:
      - id: maxm
        label: Total mass limit
        unit: lb
      - id: pilot
        label: Pilot mass
        unit: lb
      - id: pax
        label: Passengers and baggage
        unit: lb
      - id: dom
        label: Dry operating mass
        unit: lb
    answer:
      formula: (maxm - dom - pax) * 0.45359
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: maxm - dom - pax
      - id: d2
        formula: (maxm - dom - pax) * 0.45359 * 0.45359
      - id: d3
        formula: (maxm - dom - pilot - pax) * 0.45359
      - id: d4
        formula: (maxm - dom - pax) / 0.45359
    presets:
      - id: p1
        values:
          maxm: 3200
          pilot: 200
          pax: 650
          dom: 1742
      - id: p2
        values:
          maxm: 3300
          pilot: 180
          pax: 600
          dom: 1700
      - id: p3
        values:
          maxm: 3600
          pilot: 190
          pax: 800
          dom: 1900
    explanation: >-
      The dry operating mass already includes the crew, so the fuel that can be
      loaded is the mass limit minus the dry operating mass minus the passenger
      and baggage load. The result is in lb and must be converted to kg.


      **Solution**


      Fuel = {{= maxm - dom - pax}} lb


      {{f: (maxm - dom - pax) * 0.45359}} = {{n: (maxm - dom - pax) * 0.45359}}
      = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the result in lb is given without conversion.

      - **{{d2}} kg**: the conversion factor is applied twice.

      - **{{d3}} kg**: the pilot is subtracted a second time although already
      included in the DOM.

      - **{{d4}} kg**: the conversion is inverted (divided instead of
      multiplied).
- id: QCOLOPTR
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316913
    - AVEXAM-46122
    - BGS-310785
  annexes: []
  learningObjectives:
    - 031.02.01.02.04
  template:
    type: calculation
    question: The aircraft's fuel gauge is calibrated into litres and the required
      fuel that must be loaded is {{mass}} lb for the next flight. If the fuel
      truck supplies fuel in litres, how many litres are required, with a
      specific gravity of {{sg}} according to the operations manual?
    variables:
      - id: mass
        label: Required fuel mass
        unit: lb
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: mass / 2.20462 / sg
      unit: litres
      decimals: 0
    distractors:
      - id: d1
        formula: mass / sg
      - id: d2
        formula: mass / 2.20462 * sg
      - id: d3
        formula: mass * sg
    presets:
      - id: p1
        values:
          mass: 1250
          sg: 0.79
      - id: p2
        values:
          mass: 2400
          sg: 0.8
      - id: p3
        values:
          mass: 800
          sg: 0.78
    explanation: >-
      Volume = mass / density. The mass is given in lb, so first convert it to
      kg (divide by 2.20462), then divide by the density in kg/l (specific
      gravity x 1 kg/l) to obtain litres.


      **Solution**


      {{f: mass / 2.20462 / sg}} = {{n: mass / 2.20462 / sg}} = **{{answer}}
      litres**


      **Why the other answers are wrong**


      - **{{d1}} litres**: the mass was divided by the specific gravity without
      converting lb to kg.

      - **{{d2}} litres**: mass in kg multiplied by the specific gravity instead
      of divided.

      - **{{d3}} litres**: mass in lb multiplied by the specific gravity; no
      unit conversion and the density applied the wrong way.
- id: QDIHKPWR
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319697
    - AVEXAM-40022
  annexes: []
  learningObjectives:
    - 031.02.03.02.02
  template:
    type: calculation
    question: >-
      Just before closing the doors of the aircraft, you are asked if it is
      possible to accept a group of passengers re-booked from another flight.
      Knowing that your departure is take-off limited, determine the underload
      so that you can decide how many passengers to accept:


      - Allowed take-off mass: {{allowed}} kg

      - Operating mass: {{om}} kg

      - Dry operating mass: {{dom}} kg

      - Actual traffic load: {{tl}} kg

      - Take-off fuel: {{tof}} kg


      Disregard changes in fuel due to increase in the total mass.
    variables:
      - id: allowed
        label: Allowed take-off mass
        unit: kg
      - id: om
        label: Operating mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: tl
        label: Actual traffic load
        unit: kg
      - id: tof
        label: Take-off fuel
        unit: kg
    answer:
      formula: allowed - dom - tl - tof
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: allowed - om
      - id: d2
        formula: allowed - dom - tl
      - id: d3
        formula: allowed - om - tl - tof
    presets:
      - id: p1
        values:
          allowed: 24220
          om: 14792
          dom: 8693
          tl: 2563
          tof: 6099
      - id: p2
        values:
          allowed: 23500
          om: 14100
          dom: 8400
          tl: 2800
          tof: 5600
    explanation: >-
      The actual take-off mass is the dry operating mass plus the traffic load
      plus the take-off fuel. The underload is the allowed take-off mass minus
      that actual take-off mass. The (wet) operating mass is not used because
      the take-off fuel is counted separately.


      **Solution**


      {{f: allowed - dom - tl - tof}} = {{n: allowed - dom - tl - tof}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses only the allowed mass minus the operating mass,
      ignoring the traffic load and the take-off fuel.

      - **{{d2}} kg**: forgets to subtract the take-off fuel.

      - **{{d3}} kg**: uses the operating mass (which already contains fuel and
      other items) in place of the dry operating mass while still subtracting
      the fuel.
- id: QDINZFZCO
  docId: "031.02"
