    question: During the pre-flight preparation, the pilot calculates an amount of
      {{vol}} US gallons for refuelling, which equals..
    variables:
      - id: vol
        label: Volume
        unit: US gal
    answer:
      formula: vol * 3.78541
      unit: litres
      decimals: 0
    distractors:
      - id: d1
