        label: Trip fuel
        unit: kg
      - id: min_block
        label: Minimum block fuel
        unit: kg
    answer:
      formula: min(tank, rtom - azfm, mlm + trip + taxi - azfm) - min_block
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(tank, rtom - azfm, mlm + trip + taxi - azfm) - min_block - taxi
      - id: d2
        formula: min(tank, rtom - azfm, mlm + trip + taxi - azfm) - min_block + taxi
      - id: d3
        formula: min(rtom - azfm, mlm - azfm) - min_block
    presets:
      - id: p1
        values:
          max_zfm: 62731
          azfm: 55031
          rtom: 76000
          mlm: 66360
          tank: 16000
          taxi: 240
          trip: 7931
          min_block: 11249
      - id: p2
        values:
          max_zfm: 60000
          azfm: 52000
          rtom: 74000
          mlm: 64000
          tank: 18000
          taxi: 200
          trip: 7500
          min_block: 10500
      - id: p3
        values:
          max_zfm: 58000
          azfm: 50000
          rtom: 72000
          mlm: 62000
          tank: 15000
          taxi: 250
          trip: 6800
          min_block: 10000
    explanation: >-
      The maximum block fuel is limited by the tank capacity, by the take-off
      mass limit (RTOM minus the actual zero fuel mass) and by the landing mass
      limit (MLM plus trip and taxi fuel minus the actual ZFM). The extra fuel
      is the most restrictive of these limits minus the minimum block fuel.


      **Solution**


      Take-off limit = {{= rtom - azfm}} kg

      Landing limit = {{= mlm + trip + taxi - azfm}} kg

      Tank capacity = {{tank}} kg


      {{f: min(tank, rtom - azfm, mlm + trip + taxi - azfm) - min_block}} = {{n:
      min(tank, rtom - azfm, mlm + trip + taxi - azfm) - min_block}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Also subtracts the taxi fuel, which is already part of
      the minimum block fuel.

      - **{{d2}} kg**: Adds the taxi fuel instead of leaving it out.

      - **{{d3}} kg**: Ignores the tank capacity and the taxi/trip allowance in
      the landing limit (uses MLM minus ZFM).
