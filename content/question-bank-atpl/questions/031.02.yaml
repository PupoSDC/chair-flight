  template:
    type: calculation
    question: |-
      Given:

      - Fuel volume: {{vol}} US gallons
      - Fuel density: {{sg}} kg/l

      The fuel mass is:
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: sg
        label: Fuel density
        unit: kg/l
    answer:
      formula: vol * 3.78541 * sg
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: vol * 3.78541
      - id: d2
        formula: vol * 3.78541 * sg / 0.8327
      - id: d3
        formula: vol * 3.78541 / sg
      - id: d4
        formula: vol * 3.78541 / sg / 0.8327
    presets:
      - id: p1
        values:
          vol: 3800
          sg: 0.79
      - id: p2
        values:
          vol: 400
          sg: 0.79
      - id: p3
        values:
          vol: 1500
          sg: 0.8
    explanation: >-
      Fuel mass is volume times density. The volume is given in US gallons, so
      it must first be converted to litres (1 US gal = 3.78541 l) before
      multiplying by the density in kg/l.


      **Solution**


      {{f: vol * 3.78541 * sg}} = {{n: vol * 3.78541 * sg}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: volume converted to litres but the density was not
      applied.

      - **{{d2}} kg**: correct mass wrongly converted with the US to Imperial
      gallon factor (0.8327).

      - **{{d3}} kg**: volume in litres divided by the density instead of
      multiplied.

      - **{{d4}} kg**: divided by the density and then wrongly converted with
      the Imperial gallon factor.
- id: QH3G6OEDM
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313038
    - AVEXAM-82794
  annexes: []
  learningObjectives:
    - 031.02.03.02.01
  template:
    type: calculation
    question: |-
      What is the allowed traffic load, in kg?

      - MTOM: {{mtom}} kg
      - Performance limited TOM: {{ptom}} kg
      - Performance limited LM: {{plm}} kg
      - DOM: {{dom}} kg
      - Block fuel: {{block}} kg
      - Trip fuel: {{trip}} kg
      - Taxi fuel: {{taxi}} kg
    variables:
      - id: mtom
        label: MTOM
        unit: kg
      - id: ptom
        label: Performance limited TOM
        unit: kg
      - id: plm
        label: Performance limited LM
        unit: kg
      - id: dom
        label: DOM
        unit: kg
      - id: block
        label: Block fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: min(min(mtom, ptom) - dom - (block - taxi), plm - dom - (block - taxi -
        trip))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(mtom, ptom) - dom - (block - taxi)
      - id: d2
        formula: plm - dom - block
      - id: d3
        formula: plm - dom - (block - taxi)
      - id: d4
        formula: plm - dom - trip
      - id: d5
        formula: plm - dom
    presets:
      - id: p1
        values:
          mtom: 6100
          ptom: 6000
          plm: 5250
          dom: 3450
          block: 950
          trip: 530
          taxi: 20
      - id: p2
        values:
          mtom: 6400
          ptom: 6300
          plm: 5500
          dom: 3600
          block: 1000
          trip: 560
          taxi: 25
    explanation: >-
      The traffic load is limited by the take-off mass (the lower of MTOM and
      the performance limit) and by the landing mass. For each limit the traffic
      load is the limit minus DOM minus the fuel on board at that moment
      (take-off fuel = block minus taxi; landing fuel = take-off fuel minus
      trip). The smaller result is the allowed traffic load.


      **Solution**


      Take-off limit: {{= min(mtom, ptom)}} - {{dom}} - {{= block - taxi}} = {{=
      min(mtom, ptom) - dom - (block - taxi)}} kg


      Landing limit: {{plm}} - {{dom}} - {{= block - taxi - trip}} = {{= plm -
      dom - (block - taxi - trip)}} kg


      Allowed traffic load = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the take-off limit only; the landing limit is more
      restrictive.

      - **{{d2}} kg**: subtracts the whole block fuel from the landing-mass
      limit.

      - **{{d3}} kg**: subtracts the take-off fuel from the landing-mass limit,
      ignoring that the trip fuel is burnt.

      - **{{d4}} kg**: subtracts only the trip fuel from the landing-mass limit.

      - **{{d5}} kg**: ignores the fuel on board altogether.
