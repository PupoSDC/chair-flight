  template:
    type: calculation
    question: >-
      Given the following information, what will be the expected Landing Mass at
      the destination?


      - Maximum structural Take-Off Mass: {{mtom}} kg

      - Maximum structural Landing Mass: {{mlm}} kg

      - Zero Fuel Mass: {{zfm}} kg

      - Taxi Fuel: {{taxi}} kg

      - Contingency Fuel: {{cont}} kg

      - Alternate Fuel: {{alt}} kg

      - Final Reserve Fuel: {{res}} kg

      - Trip Fuel: {{trip}} kg


      (Changes in trip fuel due to mass changes may be ignored for this
      question, performance limitations are not restricted.)
    variables:
      - id: mtom
        label: Max structural TOM
        unit: kg
      - id: mlm
        label: Max structural LM
        unit: kg
      - id: zfm
        label: ZFM
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: cont
        label: Contingency fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: res
        label: Final reserve fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
    answer:
      formula: zfm + cont + alt + res
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: zfm + taxi + cont + alt + res + trip
      - id: d2
        formula: zfm + cont + alt + res + trip
      - id: d3
        formula: zfm + cont + alt + trip
    presets:
      - id: p1
        values:
          mtom: 7400
          mlm: 7400
          zfm: 5990
          taxi: 15
          cont: 110
          alt: 275
          res: 250
          trip: 760
      - id: p2
        values:
          mtom: 5700
          mlm: 5700
          zfm: 4400
          taxi: 12
          cont: 80
          alt: 200
          res: 220
          trip: 600
    explanation: >-
      The landing mass at destination is the zero fuel mass plus the fuel still
      on board on arrival. When the flight is flown as planned, that is the
      contingency, alternate and final reserve fuel; taxi fuel and trip fuel
      have already been used. The structural limits are not needed for the
      calculation.


      **Solution**


      {{f: zfm + cont + alt + res}} = {{n: zfm + cont + alt + res}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is the take-off mass (all fuel on board, including
      taxi and trip fuel).

      - **{{d2}} kg**: the taxi fuel was subtracted but the trip fuel was left
      on board.

      - **{{d3}} kg**: the final reserve fuel was left out and the trip fuel
      counted as remaining.
