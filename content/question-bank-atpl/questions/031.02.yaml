          om: 3169
          fuel: 680
          crew: 183
          tl: 1104
    explanation: >-
      The load is the margin between the allowed take-off mass and the actual
      take-off mass. The Operating Mass already includes the crew, their baggage
      and the fuel, so only the traffic load has to be added to it; a positive
      result is an Underload, a negative one an Overload.


      **Solution**


      {{f: allowed - om - tl}} = {{n: allowed - om - tl}} = **{{answer}} kg**
      Underload


      **Why the other answers are wrong**


      - **{{d1}} kg**: an overload obtained by adding the fuel on top of the
      operating mass and traffic load, double counting the fuel and reversing
      the sign.

      - **{{d2}} kg**: an overload obtained by adding the crew mass on top of
      the operating mass, double counting the crew, and reversing the sign.

      - **{{d3}} kg**: an underload that ignores the traffic load and subtracts
      the fuel instead.
- id: QOGLZKRH
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314565
    - AVEXAM-18893
    - BGS-310145
    - ATPLGS-106973
    - ATPLGS-107018
