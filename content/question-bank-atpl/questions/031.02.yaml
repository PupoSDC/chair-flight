- id: QAVG6Z9JT
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-315487
    - AVEXAM-48331
  annexes: []
  learningObjectives:
    - 031.02.03.03.02
  template:
    type: calculation
    question: >-
      For the upcoming commercial flight from Gatwick to Rome, the aircraft has
      a crew of {{crew_m}} male and {{crew_f}} female members. To calculate the
      Traffic Load as part of the pre-flight calculations, we have the following
      information:


      - Flight crew: {{crew_m}} male & {{crew_f}} female

      - Male passengers: {{nm}}

      - Female passengers: {{nf}}

      - Children: {{nc}}

      - Baggage: {{nb}} items

      - Standard mass for baggage: {{bag}} kg

      - Standard mass for male: {{mm}} kg

      - Standard mass for female: {{mf}} kg

      - Standard mass for children: {{mc}} kg

      - Standard mass for a flight crew member: {{mcrew}} kg

      - Non-revenue load: {{nonrev}} kg


      Please use this information to calculate the Traffic Load:
    variables:
      - id: crew_m
        label: Male flight crew
        unit: persons
      - id: crew_f
        label: Female flight crew
        unit: persons
      - id: nm
        label: Male passengers
        unit: persons
      - id: nf
        label: Female passengers
        unit: persons
      - id: nc
        label: Children
        unit: persons
      - id: nb
        label: Baggage items
        unit: items
      - id: bag
        label: Standard baggage mass
        unit: kg
      - id: mm
        label: Standard male mass
        unit: kg
      - id: mf
        label: Standard female mass
        unit: kg
      - id: mc
        label: Standard child mass
        unit: kg
      - id: mcrew
        label: Standard crew member mass
        unit: kg
      - id: nonrev
        label: Non-revenue load
        unit: kg
    answer:
      formula: nm * mm + nf * mf + nc * mc + nb * bag + nonrev
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: nm * mm + nf * mf + nc * mc + nb * bag + nonrev + (crew_m + crew_f) *
          mcrew
      - id: d2
        formula: nm * mm + nf * mf + nc * mc + nb * bag + nonrev + crew_f * mf
      - id: d3
        formula: nm * mm + nf * mf + nc * mc + nb * bag + nonrev + (crew_m + crew_f) *
          mcrew + crew_f * mf
      - id: d4
        formula: nm * mm + nf * mf + nc * mc + nb * bag
    presets:
      - id: p1
        values:
          crew_m: 4
          crew_f: 3
          nm: 70
          nf: 35
          nc: 10
          nb: 62
          bag: 13
          mm: 88
          mf: 70
          mc: 35
          mcrew: 85
          nonrev: 500
      - id: p2
        values:
          crew_m: 3
          crew_f: 4
          nm: 60
          nf: 45
          nc: 8
          nb: 70
          bag: 13
          mm: 88
          mf: 70
          mc: 35
          mcrew: 85
          nonrev: 300
      - id: p3
        values:
          crew_m: 5
          crew_f: 2
          nm: 55
          nf: 50
          nc: 12
          nb: 75
          bag: 13
          mm: 88
          mf: 70
          mc: 35
          mcrew: 85
          nonrev: 400
    explanation: >-
      The traffic load is the mass of everything that is carried as load:
      passengers, their baggage, cargo and non-revenue load. Passengers and
      baggage are counted with standard masses. The flight crew is part of the
      dry operating mass, so it is not included.


      **Solution**


      Male passengers: {{= nm * mm}} kg

      Female passengers: {{= nf * mf}} kg

      Children: {{= nc * mc}} kg

      Baggage: {{= nb * bag}} kg

      Non-revenue load: {{= nonrev}} kg


      Traffic load = {{= nm * mm}} + {{= nf * mf}} + {{= nc * mc}} + {{= nb *
      bag}} + {{= nonrev}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the whole flight crew, which belongs to the dry
      operating mass.

      - **{{d2}} kg**: adds the female crew members at the standard female mass.

      - **{{d3}} kg**: adds both the crew at the crew standard mass and the
      female crew again at the standard female mass.

      - **{{d4}} kg**: leaves out the non-revenue load.
- id: QAWDJVHV7
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316641
  annexes: []
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: calculation
    question: |-
      Determine the Traffic Load on-board, given:

      - Basic Empty Mass: {{bem}} lb
      - Dry Operating Mass: {{dom}} lb
      - Zero Fuel Mass: {{zfm}} lb
      - Ramp Mass: {{ramp}} lb
    variables:
      - id: bem
        label: Basic Empty Mass
        unit: lb
      - id: dom
        label: Dry Operating Mass
        unit: lb
      - id: zfm
        label: Zero Fuel Mass
        unit: lb
      - id: ramp
        label: Ramp Mass
        unit: lb
    answer:
      formula: zfm - dom
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: ramp - zfm
      - id: d2
        formula: zfm - bem
      - id: d3
        formula: dom - bem
    presets:
      - id: p1
        values:
          bem: 11758
          dom: 12470
          zfm: 12912
          ramp: 16512
      - id: p2
        values:
          bem: 11200
          dom: 11900
          zfm: 12400
          ramp: 15600
      - id: p3
        values:
          bem: 10850
          dom: 11600
          zfm: 12150
          ramp: 15300
    explanation: >-
      The Zero Fuel Mass is the Dry Operating Mass plus the traffic load
      (payload), so the traffic load is the difference between the two.


      **Solution**


      {{f: zfm - dom}} = {{n: zfm - dom}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: this is the fuel on board (ramp mass minus zero fuel
      mass), not the traffic load.

      - **{{d2}} lb**: this subtracts the Basic Empty Mass instead of the Dry
      Operating Mass, so it includes the operating items (crew, catering, etc.).

      - **{{d3}} lb**: this is only the difference between Dry Operating Mass
      and Basic Empty Mass (the operating items), not the traffic load.
