  template:
    type: calculation
    question: >-
      Given:


      - Dry Operating Mass: {{dom}} kg

      - Performance limited take-off mass: {{ptom}} kg

      - Performance limited landing mass: {{plm}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg

      - Trip fuel: {{trip}} kg

      - Contingency plus final reserve fuel: {{res}} kg

      - Alternate fuel: {{alt}} kg


      Using this data, as appropriate, calculate the maximum traffic load that
      can be carried.
    variables:
      - id: dom
        label: DOM
        unit: kg
      - id: ptom
        label: performance limited TOM
        unit: kg
      - id: plm
        label: performance limited LM
        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: trip
        label: trip fuel
        unit: kg
      - id: res
        label: contingency + final reserve fuel
        unit: kg
      - id: alt
        label: alternate fuel
        unit: kg
    answer:
      formula: min(mzfm - dom, ptom - dom - trip - res - alt, plm - dom - res - alt)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ptom - dom - trip - res - alt
      - id: d2
        formula: plm - dom - res - alt
      - id: d3
        formula: plm - dom
    presets:
      - id: p1
        values:
          dom: 60520
          ptom: 92750
          plm: 72250
          mzfm: 67530
          trip: 12500
          res: 2300
          alt: 1700
      - id: p2
        values:
          dom: 41000
          ptom: 70000
          plm: 54000
          mzfm: 47500
          trip: 7000
          res: 1800
          alt: 1200
      - id: p3
        values:
          dom: 35200
          ptom: 58000
          plm: 48500
          mzfm: 41000
          trip: 5200
          res: 1500
          alt: 900
    explanation: >-
      The traffic load is limited by three conditions: zero fuel mass (MZFM),
      take-off mass and landing mass. For each one the traffic load is the limit
      minus DOM minus the fuel that counts against it; the smallest result is
      the maximum traffic load. Take-off fuel = trip + contingency/final reserve
      + alternate; at landing the trip fuel has been burnt.


      **Solution**


      Zero fuel limit: {{= mzfm - dom}} kg

      Take-off limit: {{= ptom - dom - trip - res - alt}} kg

      Landing limit: {{= plm - dom - res - alt}} kg


      Maximum traffic load = lowest = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the take-off limit, which is not the most restrictive.

      - **{{d2}} kg**: the landing limit, which is not the most restrictive.

      - **{{d3}} kg**: landing limit without deducting the reserve and alternate
      fuel still on board at landing.
