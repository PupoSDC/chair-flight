  template:
    type: calculation
    question: >-
      Determine the allowed mass for take-off for a medium range jet transport
      aeroplane (MRJT). Given:


      - Maximum Zero Fuel Mass (MZFM): {{mzfm}} kg

      - Maximum Take-off Mass (MTOM): {{mtom}} kg

      - Maximum Landing Mass (MLM): {{mlm}} kg

      - Performance limited Take-off Mass (TOM): {{ptom}} kg

      - Performance limited Landing Mass (LM): {{plm}} kg

      - Trip Fuel: {{trip}} kg

      - Block Fuel: {{block}} kg
    variables:
      - id: mzfm
        label: MZFM
        unit: kg
      - id: mtom
        label: MTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: ptom
        label: performance limited TOM
        unit: kg
      - id: plm
        label: performance limited LM
        unit: kg
      - id: trip
        label: trip fuel
        unit: kg
      - id: block
        label: block fuel
        unit: kg
    answer:
      formula: min(mtom, ptom, mlm + trip, mzfm + block)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mtom
      - id: d2
        formula: mlm + trip
      - id: d3
        formula: mzfm + block
      - id: d4
        formula: plm
    presets:
      - id: p1
        values:
          mzfm: 61688
          mtom: 66990
          mlm: 65317
          ptom: 64900
          plm: 67300
          trip: 3800
          block: 6000
      - id: p2
        values:
          mzfm: 64000
          mtom: 73500
          mlm: 68000
          ptom: 70800
          plm: 72500
          trip: 3500
          block: 7800
    explanation: >-
      The allowed take-off mass is the lowest of the structural MTOM, the
      performance limited TOM, the landing limit expressed at take-off (MLM +
      trip fuel) and the zero fuel limit expressed at take-off (MZFM + block
      fuel).


      **Solution**


      MTOM = {{mtom}} kg; performance TOM = {{ptom}} kg

      MLM + trip fuel = {{= mlm + trip}} kg

      MZFM + block fuel = {{= mzfm + block}} kg


      Allowed TOM = lowest = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the structural MTOM, ignoring the lower limits.

      - **{{d2}} kg**: the landing limit MLM + trip fuel, which is not the
      lowest limit.

      - **{{d3}} kg**: the zero fuel limit MZFM + block fuel, which is not the
      lowest limit.

      - **{{d4}} kg**: the performance limited landing mass, which is not a
      take-off limit and is not corrected for trip fuel.
- id: QHEOAMAF
  docId: "031.02"
  relatedQuestions:
    - QUYOMDTE
  externalIds:
    - ATPLQ-313229
    - BGS-310128
    - AVEXAM-92360
    - ATPLGS-107017
  annexes: []
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: calculation
    question: >-
      The following data is extracted from an aeroplane loading manifest:


      - Take-off Mass (performance limited): {{tom}} kg

      - Expected Landing Mass at destination: {{exp_lm}} kg

      - Maximum Certificated Landing Mass: {{mlm}} kg

      - Take-off fuel on board: {{tof}} kg


      During the flight a diversion is made to an en-route alternate. Fuel
      remaining at landing is {{fl}} kg. What is the actual Landing Mass?
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: exp_lm
        label: Expected landing mass
        unit: kg
      - id: mlm
        label: Max certificated landing mass
        unit: kg
      - id: tof
        label: Take-off fuel
        unit: kg
      - id: fl
        label: Fuel remaining at landing
        unit: kg
    answer:
      formula: tom - (tof - fl)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - fl
      - id: d2
        formula: exp_lm
      - id: d3
        formula: tom - tof
      - id: d4
        formula: mlm
    presets:
      - id: p1
        values:
          tom: 93500
          exp_lm: 81700
          mlm: 86300
          tof: 16500
          fl: 10300
      - id: p2
        values:
          tom: 70000
          exp_lm: 62000
          mlm: 66000
          tof: 12000
          fl: 7500
      - id: p3
        values:
          tom: 78000
          exp_lm: 69500
          mlm: 72000
          tof: 14000
          fl: 9000
    explanation: >-
      Landing mass is the take-off mass minus the fuel actually burned (take-off
      fuel minus fuel remaining). The planned landing mass does not apply after
      a diversion.


      **Solution**


      Fuel burned = {{= tof - fl}} kg

      {{f: tom - (tof - fl)}} = {{n: tom - (tof - fl)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Subtracts the remaining fuel instead of the fuel burned.

      - **{{d2}} kg**: Is the planned landing mass, which ignores the diversion.

      - **{{d3}} kg**: Subtracts the whole take-off fuel (assumes empty tanks).

      - **{{d4}} kg**: Is just the maximum certificated landing mass.
- id: QHYHXL7UU
  docId: "031.02"
  relatedQuestions:
    - QMWECXBB
  externalIds:
    - ATPLQ-317770
    - AVEXAM-4004
    - BGS-310606
  annexes:
    - 031-standard-mass-values
  learningObjectives:
    - 031.02.03.03.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure or CAP 696 file, standard masses table. A twin-engined
      turboprop fitted with 82 passenger seats is planned for a scheduled
      domestic commercial air transport flight. The following people and baggage
      are on board:


      - Sport team: {{team_count}} sportsmen, average estimated mass
      {{team_mass}} kg per person

      - Standard passengers (all adults): {{male_count}} males and
      {{female_count}} females

      - Passenger baggage: {{bag_count}} pieces


      The operator uses regulatory masses for the standard passengers and
      checked baggage. The standard masses of a male passenger, a female
      passenger and one piece of checked baggage are read from the table.


      What is the actual traffic load of this flight (kg)?
    variables:
      - id: team_count
        label: Sport team members
        unit: ""
      - id: team_mass
        label: Average estimated mass of a sport team member
        unit: kg
      - id: male_count
        label: Male standard passengers
        unit: ""
      - id: female_count
        label: Female standard passengers
        unit: ""
      - id: bag_count
        label: Pieces of passenger baggage
        unit: ""
      - id: male_mass
        label: Standard mass of a male passenger (read from the table)
        unit: kg
      - id: female_mass
        label: Standard mass of a female passenger (read from the table)
        unit: kg
      - id: bag_mass
        label: Regulatory mass of one piece of checked baggage (read from the table)
        unit: kg
    chartInputs:
      - male_mass
      - female_mass
      - bag_mass
    answer:
      formula: team_count * team_mass + male_count * male_mass + female_count *
        female_mass + bag_count * bag_mass
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: team_count * team_mass + male_count * male_mass + female_count *
          female_mass
      - id: d2
        formula: (team_count + male_count) * male_mass + female_count * female_mass +
          bag_count * bag_mass
      - id: d3
        formula: team_count * team_mass + male_count * male_mass + female_count *
          female_mass + (male_count + female_count) * bag_mass
      - id: d4
        formula: team_count * team_mass + (male_count + female_count) * male_mass +
          bag_count * bag_mass
    presets:
      - id: p1
        values:
          team_count: 32
          team_mass: 105
          male_count: 22
          female_count: 16
          bag_count: 64
          male_mass: 92
          female_mass: 73
          bag_mass: 11
    explanation: >-
      Traffic load is the mass of all passengers and their baggage. The sport
      team is counted at its estimated mass. The standard passengers and the
      checked baggage are counted at the regulatory masses from the table.


      **Solution**


      - Sport team: {{team_count}} x {{team_mass}} kg = {{= team_count *
      team_mass}} kg

      - Male standard passengers: {{= male_count * male_mass}} kg

      - Female standard passengers: {{= female_count * female_mass}} kg

      - Passenger baggage: {{= bag_count * bag_mass}} kg

      - Traffic load = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the passenger baggage is left out.

      - **{{d2}} kg**: the sport team is counted at the male standard mass
      instead of its estimated mass.

      - **{{d3}} kg**: the baggage count is applied to every passenger instead
      of to the pieces of baggage.

      - **{{d4}} kg**: all standard passengers are counted at the male standard
      mass.
