    - 031.02.01.02.03
  template:
    type: calculation
    question: >-
      Given the following data for a flight, what is the usable take-off fuel
      mass loaded on board?


      - Actual Take-Off Mass: {{tom}} kg

      - Dry Operating Mass: {{dom}} kg

      - Crew and its baggage mass: {{crew}} kg

      - Passengers and their baggage mass: {{pax}} kg

      - Cargo mass: {{cargo}} kg
    variables:
      - id: tom
        label: Actual take-off mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: crew
        label: Crew and baggage mass
        unit: kg
      - id: pax
        label: Passengers and baggage mass
        unit: kg
      - id: cargo
        label: Cargo mass
        unit: kg
    answer:
      formula: tom - dom - pax - cargo
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - dom - crew - pax - cargo
      - id: d2
        formula: tom - dom - pax
      - id: d3
        formula: tom - dom - cargo
    presets:
      - id: p1
        values:
          tom: 62800
          dom: 34200
          crew: 500
          pax: 13300
          cargo: 5700
      - id: p2
        values:
          tom: 58400
          dom: 32100
          crew: 450
          pax: 11800
          cargo: 4300
      - id: p3
        values:
          tom: 64500
          dom: 35400
          crew: 520
          pax: 12600
          cargo: 6100
    explanation: >-
      Take-off mass is the sum of the dry operating mass, the traffic load and
      the take-off fuel. The dry operating mass already includes the crew and
      their baggage, so only passengers and cargo are traffic load.


      **Solution**


      Traffic load = {{= pax}} + {{= cargo}} = {{= pax + cargo}} kg


      {{f: tom - dom - pax - cargo}} = {{n: tom - dom - pax - cargo}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the crew mass a second time although it is
      already part of the dry operating mass.

      - **{{d2}} kg**: forgets the cargo mass.

      - **{{d3}} kg**: forgets the passengers and their baggage.
