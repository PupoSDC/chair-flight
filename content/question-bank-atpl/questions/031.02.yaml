- id: QVTYVS0CO
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311993
    - AVEXAM-87654
  annexes:
    - 031-blank-loadsheet-loadmessage-and-load-trim-sheet-ver-132-pax
    - 031-standard-mass-values
  learningObjectives:
    - 031.02.03.03.02
    - 031.05.02.03.04
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Complete the Last Minute Change (LMC) section of the
      load sheet and find the LMC TOTAL value. The LMC data:


      - Two male and two female passengers embarked at seat row 7

      - Four pieces of baggage loaded in cargo compartment 5

      - A {{off}}-kg cargo box off-loaded from compartment 4

      - A {{mail}}-kg mail box loaded in compartment 4


      Use male/female standard masses ({{male}} kg and {{female}} kg per
      passenger) and the standard mass per baggage piece ({{bag}} kg), all read
      from the load sheet table, for a domestic scheduled flight.
    variables:
      - id: male
        label: Standard mass male (from the table)
        unit: kg
      - id: female
        label: Standard mass female (from the table)
        unit: kg
      - id: bag
        label: Standard mass per baggage piece (from the table)
        unit: kg
      - id: off
        label: Cargo off-loaded
        unit: kg
      - id: mail
        label: Mail loaded
        unit: kg
    chartInputs:
      - male
      - female
      - bag
    answer:
      formula: 2 * male + 2 * female + 4 * bag - off + mail
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * male + 2 * female - off + mail
      - id: d2
        formula: 2 * male + 2 * female + 4 * bag + off + mail
      - id: d3
        formula: 2 * male + 2 * female + 4 * bag - off - mail
      - id: d4
        formula: 2 * male + 2 * female + 4 * bag + off - mail
    presets:
      - id: p1
        values:
          male: 88
          female: 70
          bag: 11
          off: 100
          mail: 50
    explanation: >-
      The LMC total is the sum of all masses loaded after the load sheet was
      completed minus all masses off-loaded.


      **Solution**


      Passengers = {{= 2 * male + 2 * female}} kg; baggage = {{= 4 * bag}} kg

      {{f: 2 * male + 2 * female + 4 * bag - off + mail}} = {{n: 2 * male + 2 *
      female + 4 * bag - off + mail}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Forgets the baggage.

      - **{{d2}} kg**: Adds the off-loaded box instead of subtracting it.

      - **{{d3}} kg**: Subtracts the mail box instead of adding it.

      - **{{d4}} kg**: Adds the off-loaded box and subtracts the mail box (signs
      reversed).
