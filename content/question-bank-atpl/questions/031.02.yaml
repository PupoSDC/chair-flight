        values:
          vol: 120
          dens: 0.79
    explanation: >-
      Mass is volume times density. Loading charts need the fuel mass, not the
      volume.


      **Solution**


      {{f: vol * dens}} = {{n: vol * dens}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the volume in litres is used as the mass.

      - **{{d2}} kg**: the volume is divided by the density instead of
      multiplied.

      - **{{d3}} kg**: the density is replaced by its complement.

      - **{{d4}} kg**: the result is multiplied by 10 (confusion with daN).
