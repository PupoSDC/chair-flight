    - AVEXAM-39325
    - BGS-310149
    - AVEXAM-27729
    - AVEXAM-49831
  annexes: []
  learningObjectives:
    - 031.02.03.02.01
  template:
    type: calculation
    question: >-
      During dispatch calculations, you want to calculate the maximum possible
      Traffic Load and carry as a minimum {{block}} kg of Block Fuel. Given the
      following information, what is the Allowed Traffic Load for your flight?


      - Maximum Take-off Mass: {{mtom}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg

      - Dry Operating Mass: {{dom}} kg

      - Actual Traffic Load: {{actual}} kg

      - Taxi Fuel: {{taxi}} kg


      Assume NO restrictions on the Landing Mass.
    variables:
      - id: block
        label: block fuel
        unit: kg
      - id: mtom
        label: MTOM
        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: dom
        label: DOM
        unit: kg
      - id: actual
        label: actual traffic load
        unit: kg
      - id: taxi
        label: taxi fuel
        unit: kg
    answer:
      formula: min(mzfm - dom, mtom - dom - block + taxi)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(mzfm - dom, mtom - dom - block + taxi) - actual
      - id: d2
        formula: mtom - dom - block + taxi - actual
      - id: d3
        formula: mtom - dom - block + taxi
    presets:
      - id: p1
        values:
          block: 13800
          mtom: 71204
          mzfm: 56490
          dom: 40195
          actual: 14585
          taxi: 215
      - id: p2
        values:
          block: 9000
          mtom: 62000
          mzfm: 50000
          dom: 35000
          actual: 11000
          taxi: 200
      - id: p3
        values:
          block: 12000
          mtom: 79000
          mzfm: 61500
          dom: 43000
          actual: 15500
          taxi: 250
    explanation: >-
      The allowed traffic load is limited by the zero fuel mass (MZFM - DOM) and
      by the take-off mass (MTOM - DOM - take-off fuel), where the take-off fuel
      is the block fuel minus the taxi fuel. The lower of the two is the allowed
      traffic load.


      **Solution**


      Zero fuel limit: {{= mzfm - dom}} kg

      Take-off limit: {{= mtom - dom - block + taxi}} kg


      Allowed traffic load = lowest = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the additional load that could still be added (allowed
      minus actual traffic load), not the allowed traffic load.

      - **{{d2}} kg**: the additional load based on the take-off limit, which is
      neither the allowed load nor the most restrictive limit.

      - **{{d3}} kg**: only the take-off limit, ignoring the lower zero fuel
      limit.
