  template:
    type: calculation
    question: >-
      According to the Flight Manual, the Maximum Structural Mass of your
      aircraft is {{struct}} lb (for take-off or landing), which can be
      increased by {{taxi}} lb when taxiing.


      It is a hot day and the performance charts restrict the Maximum All Up
      Mass (MAUM) to {{maum}} lb.


      What is the value of the Regulated Landing Mass (RLM)?
    variables:
      - id: struct
        label: Maximum structural mass
        unit: lb
      - id: taxi
        label: Taxi mass increase
        unit: lb
      - id: maum
        label: Performance limited MAUM
        unit: lb
    answer:
      formula: min(struct, maum)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: struct + taxi
      - id: d2
        formula: maum + taxi
      - id: d3
        formula: struct
    presets:
      - id: p1
        values:
          struct: 3200
          taxi: 50
          maum: 3100
      - id: p2
        values:
          struct: 5300
          taxi: 50
          maum: 5100
      - id: p3
        values:
          struct: 4800
          taxi: 40
          maum: 4650
    explanation: >-
      The regulated landing mass is the lowest of the structural landing limit
      and the performance limit. The additional mass allowed for taxiing only
      applies on the ground before take-off and is not part of the landing
      limit.


      **Solution**


      {{f: min(struct, maum)}} = min({{struct}}, {{maum}}) = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: adds the taxi allowance to the structural limit.

      - **{{d2}} lb**: adds the taxi allowance to the performance limit.

      - **{{d3}} lb**: uses the structural limit only and ignores the lower
      performance limit.
