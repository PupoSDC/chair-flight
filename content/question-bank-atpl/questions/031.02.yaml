    - BGS-310636
  annexes: []
  learningObjectives:
    - 031.02.03.01.01
  template:
    type: calculation
    question: >-
      According to the Flight Manual, the Maximum Structural Mass of your
      aircraft is {{struct}} lb, which may be increased by {{taxi}} lb for
      taxiing.


      It is a hot day and the performance charts restrict the Maximum All Up
      Mass (MAUM) to {{maum}} lb.


      The Regulated Take-Off Mass (RTOM) is:
    variables:
      - id: struct
        label: Maximum structural mass
        unit: lb
      - id: taxi
        label: Taxi mass increase
        unit: lb
      - id: maum
        label: Performance limited MAUM
        unit: lb
    answer:
      formula: min(struct, maum)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: struct + taxi
      - id: d2
        formula: maum + taxi
      - id: d3
        formula: struct
    presets:
      - id: p1
        values:
          struct: 3420
          taxi: 30
          maum: 3280
      - id: p2
        values:
          struct: 2900
          taxi: 25
          maum: 2780
      - id: p3
        values:
          struct: 4100
          taxi: 40
          maum: 3950
    explanation: >-
      The regulated take-off mass is the lowest of the structural limit and the
      performance limit. The extra mass allowed for taxiing is burned off before
      take-off and is not part of the take-off limit.


      **Solution**


      {{f: min(struct, maum)}} = min({{struct}}, {{maum}}) = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: adds the taxi allowance to the structural limit.

      - **{{d2}} lb**: adds the taxi allowance to the performance limit.

      - **{{d3}} lb**: uses the structural limit only and ignores the lower
      performance limit.
