  template:
    type: calculation
    question: |-
      Determine the traffic load (TL) of a twin-engine piston aircraft, given:

      - Operating Mass: {{om}} kg
      - Take-off Mass: {{tom}} kg
      - Trip Fuel: {{tripfuel}} l
      - Take-Off Fuel: {{tofuel}} l
      - Specific gravity: {{sg}} kg/l
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: om
        label: Operating mass
        unit: kg
      - id: tripfuel
        label: Trip fuel
        unit: l
      - id: tofuel
        label: Take-off fuel
        unit: l
      - id: sg
        label: Specific gravity
        unit: kg/l
    answer:
      formula: tom - om
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - om - tofuel * sg
      - id: d2
        formula: tom - om + tofuel * sg
      - id: d3
        formula: tom - tripfuel * sg - om
      - id: d4
        formula: tom - om - tripfuel
      - id: d5
        formula: tom - om - tofuel
    presets:
      - id: p1
        values:
          tom: 6040
          om: 5130
          tripfuel: 600
          tofuel: 770
          sg: 0.78202
      - id: p2
        values:
          tom: 8200
          om: 6900
          tripfuel: 700
          tofuel: 900
          sg: 0.79
      - id: p3
        values:
          tom: 3800
          om: 2900
          tripfuel: 180
          tofuel: 250
          sg: 0.8
    explanation: >-
      The operating mass already includes the take-off fuel (it is the dry
      operating mass plus fuel), so the traffic load is simply what is left of
      the take-off mass after subtracting the operating mass. The fuel
      quantities are not needed.


      **Solution**


      {{f: tom - om}} = {{n: tom - om}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the take-off fuel is subtracted a second time, although
      it is already part of the operating mass.

      - **{{d2}} kg**: the take-off fuel is added instead of being left out.

      - **{{d3}} kg**: the trip fuel (converted with the specific gravity) is
      subtracted again.

      - **{{d4}} kg**: the trip fuel in litres is subtracted as if it were
      kilograms.

      - **{{d5}} kg**: the take-off fuel in litres is subtracted as if it were
      kilograms.
