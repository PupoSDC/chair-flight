  template:
    type: calculation
    question: >-
      Given: The take-off mass of an aircraft is {{tom}} kg.


      Total fuel on board is {{fuel}} kg including {{reserve}} kg reserve fuel
      and {{unusable}} kg of unusable fuel.


      The traffic load is {{tl}} kg.


      What is the Zero Fuel Mass?
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: fuel
        label: Total fuel
        unit: kg
      - id: reserve
        label: Reserve fuel
        unit: kg
      - id: unusable
        label: Unusable fuel
        unit: kg
      - id: tl
        label: Traffic load
        unit: kg
    answer:
      formula: tom - (fuel - unusable)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - fuel
      - id: d2
        formula: tom - (fuel - unusable) - tl
      - id: d3
        formula: tom - fuel - reserve
    presets:
      - id: p1
        values:
          tom: 8470
          fuel: 1600
          reserve: 450
          unusable: 29
          tl: 770
      - id: p2
        values:
          tom: 7900
          fuel: 1500
          reserve: 420
          unusable: 25
          tl: 700
      - id: p3
        values:
          tom: 9200
          fuel: 1850
          reserve: 500
          unusable: 32
          tl: 900
    explanation: >-
      The Zero Fuel Mass is the take-off mass minus all usable fuel. The
      unusable fuel is part of the Basic Empty Mass, so it is not subtracted.
      The reserve fuel is usable fuel and remains part of the fuel to be
      removed; the traffic load is part of the ZFM.


      **Solution**


      {{f: tom - (fuel - unusable)}} = {{n: tom - (fuel - unusable)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the total fuel including the unusable fuel,
      which is part of the empty mass.

      - **{{d2}} kg**: also subtracts the traffic load, which is part of the
      ZFM.

      - **{{d3}} kg**: subtracts the reserve fuel a second time (it is already
      included in the total fuel).
- id: QWZWIDAK
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-314917
    - BGS-310796
    - AVEXAM-31579
  annexes: []
  learningObjectives:
    - 031.02.03.02.02
  template:
    type: calculation
    question: >-
      Given the following data, what is the additional traffic load that the
      crew could accept for take-off?


      - Dry Operating Mass: {{dom}} lb

      - Traffic Load: {{traffic}} lb

      - Fuel loaded: {{fuel}} lb

      - Trip Fuel: {{trip}} lb

      - Taxi Fuel: {{taxi}} lb

      - MTOM: {{mtom}} lb
    variables:
      - id: dom
        label: DOM
        unit: lb
      - id: traffic
        label: traffic load
        unit: lb
      - id: fuel
        label: fuel loaded
        unit: lb
      - id: trip
        label: trip fuel
        unit: lb
      - id: taxi
        label: taxi fuel
        unit: lb
      - id: mtom
        label: MTOM
        unit: lb
    answer:
      formula: mtom - (dom + traffic + fuel - taxi)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mtom - (dom + traffic + fuel)
      - id: d2
        formula: mtom - dom - fuel
      - id: d3
        formula: mtom - dom - fuel + taxi
    presets:
      - id: p1
        values:
          dom: 12445
          traffic: 241
          fuel: 5000
          trip: 3000
          taxi: 100
          mtom: 18386
      - id: p2
        values:
          dom: 11800
          traffic: 300
          fuel: 4800
          trip: 2900
          taxi: 120
          mtom: 17500
    explanation: >-
      The take-off mass is the dry operating mass plus traffic load plus the
      fuel on board at take-off, which is the fuel loaded minus the taxi fuel
      burnt before brake release. The additional load that can be accepted is
      the margin to the MTOM.


      **Solution**


      Take-off mass = {{n: dom + traffic + fuel - taxi}} = {{= dom + traffic +
      fuel - taxi}} lb


      {{f: mtom - (dom + traffic + fuel - taxi)}} = {{n: mtom - (dom + traffic +
      fuel - taxi)}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: forgets that the taxi fuel is burnt before take-off.

      - **{{d2}} lb**: leaves out the traffic load already on board and the taxi
      fuel.

      - **{{d3}} lb**: leaves out the traffic load already on board and adds the
      taxi fuel instead of subtracting it from the fuel.
