  template:
    type: calculation
    question: >-
      The dispatcher informs you that the Actual Traffic Load for your flight is
      {{tl}} kg. Given the following conditions, what is the maximum block fuel
      you can carry without exceeding the allowed take-off mass?


      - Dry Operating Mass: {{dom}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg

      - Allowed Take-Off Mass: {{atom}} kg

      - Taxi Fuel: {{taxi}} kg


      Assume no restrictions on the Landing Mass.
    variables:
      - id: tl
        label: Traffic load
        unit: kg
      - id: dom
        label: DOM
        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: atom
        label: Allowed TOM
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: atom - dom - tl + taxi
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: atom - mzfm
      - id: d2
        formula: atom - mzfm + taxi
      - id: d3
        formula: atom - dom - tl
      - id: d4
        formula: mzfm - dom - tl + taxi
    presets:
      - id: p1
        values:
          tl: 1459
          dom: 4737
          mzfm: 6428
          atom: 8100
          taxi: 35
      - id: p2
        values:
          tl: 1320
          dom: 4510
          mzfm: 6200
          atom: 7900
          taxi: 40
      - id: p3
        values:
          tl: 1600
          dom: 4900
          mzfm: 6700
          atom: 8350
          taxi: 30
    explanation: >-
      The maximum block fuel is limited by the allowed take-off mass (TOM). The
      fuel that fits is the allowed TOM minus the dry operating mass and the
      traffic load; the taxi fuel is burned before take-off, so it can be added
      on top. Here the zero fuel mass ({{= dom + tl}} kg) is below the MZFM of
      {{mzfm}} kg, so the MZFM is not limiting.


      **Solution**


      {{f: atom - dom - tl + taxi}} = {{n: atom - dom - tl + taxi}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the MZFM from the TOM, which is not the actual
      zero fuel mass of this flight.

      - **{{d2}} kg**: same error as above, plus the taxi fuel.

      - **{{d3}} kg**: forgets to add back the taxi fuel burned before take-off.

      - **{{d4}} kg**: uses the MZFM as the limit instead of the allowed
      take-off mass.
