- id: QIYLTRWF
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313906
    - ATPLGS-126692
    - AVEXAM-53296
    - ATPLGS-113883
  annexes: []
  learningObjectives:
    - 031.02.01.02.04
    - 031.02.03.02.01
  template:
    type: calculation
    question: >-
      Given the following information, what is the maximum amount of Extra Fuel
      that can be uploaded for this Commercial Air Transport flight?


      - MTOM: {{mtom}} lb

      - MLM: {{mlm}} lb

      - ZFM: {{zfm}} lb

      - Planned T/O Fuel: {{planned}} US gal

      - Trip Fuel: {{trip}} US gal

      - Fuel tank capacity: {{tank}} US gal

      - Specific gravity: {{sg}}
    variables:
      - id: mtom
        label: MTOM
        unit: lb
      - id: mlm
        label: MLM
        unit: lb
      - id: zfm
        label: ZFM
        unit: lb
      - id: planned
        label: Planned T/O fuel
        unit: US gal
      - id: trip
        label: Trip fuel
        unit: US gal
      - id: tank
        label: Tank capacity
        unit: US gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: floor(min((mtom - zfm) / (sg * 8.3454), (mlm - zfm) / (sg * 8.3454) +
        trip, tank) - planned)
      unit: US gal
      decimals: 0
    distractors:
      - id: d1
        formula: tank - planned
      - id: d2
        formula: floor((mlm - zfm) / (sg * 8.3454) + trip - planned)
      - id: d3
        formula: tank - trip
    presets:
      - id: p1
        values:
          mtom: 2150
          mlm: 2030
          zfm: 1803
          planned: 35
          trip: 27
          tank: 68
          sg: 0.72
      - id: p2
        values:
          mtom: 2400
          mlm: 2250
          zfm: 1950
          planned: 38
          trip: 30
          tank: 75
          sg: 0.72
    explanation: >-
      The fuel on board is limited by three things: the maximum take-off mass,
      the maximum landing mass (landing fuel = take-off fuel - trip fuel) and
      the tank capacity. The smallest of the three limits the total fuel, and
      the extra fuel is that limit minus the planned take-off fuel. Fuel
      density: {{sg}} x 8.3454 = {{= sg * 8.3454}} lb/US gal.


      **Solution**


      Limit by MTOM: ({{mtom}} - {{zfm}}) / {{= sg * 8.3454}} = {{= (mtom - zfm)
      / (sg * 8.3454)}} US gal

      Limit by MLM: ({{mlm}} - {{zfm}}) / {{= sg * 8.3454}} + {{trip}} = {{=
      (mlm - zfm) / (sg * 8.3454) + trip}} US gal

      Limit by tanks: {{tank}} US gal


      The smallest is the MTOM limit, so extra fuel = {{= min((mtom - zfm) / (sg
      * 8.3454), (mlm - zfm) / (sg * 8.3454) + trip, tank)}} - {{planned}} =
      **{{answer}} US gal** (rounded down).


      **Why the other answers are wrong**


      - **{{d1}} US gal**: only the tank capacity was considered ({{f: tank -
      planned}}).

      - **{{d2}} US gal**: only the landing mass limit was applied.

      - **{{d3}} US gal**: tank capacity minus trip fuel instead of minus
      planned take-off fuel.
