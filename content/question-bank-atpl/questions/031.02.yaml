      fuel of {{vol}} US gallons. Considering a fuel density of {{dens}} lb per
      US gallon, this equals..
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: dens
        label: Fuel density
        unit: lb/US gal
    answer:
      formula: vol * dens / 2.20462
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: vol * dens
      - id: d2
        formula: vol / 2.20462
      - id: d3
