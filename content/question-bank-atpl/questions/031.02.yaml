  annexes: []
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: calculation
    question: |-
      Given:

      - Basic Empty Mass: {{bem}} lb
      - Pilot + Front seat passenger: {{crew}} lb
      - Cargo Mass: {{cargo}} lb
      - Ramp Fuel = Block Fuel: {{ramp}} gal
      - Trip Fuel: {{trip}} gal
      - Fuel density: {{dens}} lb/gal

      Determine the Zero Fuel Mass.
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: crew
        label: Pilot + front seat passenger
        unit: lb
      - id: cargo
        label: Cargo mass
        unit: lb
      - id: ramp
        label: Ramp (block) fuel
        unit: gal
      - id: trip
        label: Trip fuel
        unit: gal
      - id: dens
        label: Fuel density
        unit: lb/gal
    answer:
      formula: bem + crew + cargo
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: bem + crew + cargo + trip * dens
      - id: d2
        formula: bem + crew + cargo + ramp * dens
      - id: d3
        formula: bem + crew
      - id: d4
        formula: bem + crew + cargo + (ramp - trip) * dens
    presets:
      - id: p1
        values:
          bem: 1799
          crew: 300
          cargo: 350
          ramp: 60
          trip: 35
          dens: 6
      - id: p2
        values:
          bem: 1650
          crew: 320
          cargo: 280
          ramp: 50
          trip: 30
          dens: 6
      - id: p3
        values:
          bem: 1520
          crew: 290
          cargo: 400
          ramp: 70
          trip: 40
          dens: 6
    explanation: >-
      The zero fuel mass is the basic empty mass plus all payload (occupants and
      cargo), without any fuel. The fuel quantities are therefore not needed.


      **Solution**


      {{f: bem + crew + cargo}} = {{n: bem + crew + cargo}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the trip fuel is added, but fuel is not part of the zero
      fuel mass.

      - **{{d2}} lb**: the whole block fuel is added, which gives the ramp mass,
      not the ZFM.

      - **{{d3}} lb**: the cargo is forgotten.

      - **{{d4}} lb**: the fuel remaining after the trip is added; this is still
      fuel and is excluded from the ZFM.
