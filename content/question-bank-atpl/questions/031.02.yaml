  annexes: []
  learningObjectives:
    - 031.02.03.01.01
  template:
    type: calculation
    question: >-
      Based on actual conditions, an aeroplane has the following performance
      take-off mass limitations:


      | **FLAPS** | **0º** | **10º** | **15º** |

      | ---------- | ------- | ------- | ------- |

      | **RUNWAY** | {{r0}} kg | {{r10}} kg | {{r15}} kg |

      | **CLIMB** | {{c0}} kg | {{c10}} kg | {{c15}} kg |


      Structural limits: take-off/landing/zero fuel: {{struct}} kg


      The Maximum Take-off Mass is:
    variables:
      - id: r0
        label: Runway limit, flaps 0
        unit: kg
      - id: r10
        label: Runway limit, flaps 10
        unit: kg
      - id: r15
        label: Runway limit, flaps 15
        unit: kg
      - id: c0
        label: Climb limit, flaps 0
        unit: kg
      - id: c10
        label: Climb limit, flaps 10
        unit: kg
      - id: c15
        label: Climb limit, flaps 15
        unit: kg
      - id: struct
        label: Structural limit
        unit: kg
    answer:
      formula: min(struct, max(max(min(r0, c0), min(r10, c10)), min(r15, c15)))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: r0
      - id: d2
        formula: c15
      - id: d3
        formula: c0
      - id: d4
        formula: max(r0, max(r10, r15))
    presets:
      - id: p1
        values:
          r0: 4100
          r10: 4400
          r15: 4600
          c0: 4700
          c10: 4500
          c15: 4200
          struct: 4300
      - id: p2
        values:
          r0: 4300
          r10: 4600
          r15: 4800
          c0: 4900
          c10: 4700
          c15: 4400
          struct: 4500
      - id: p3
        values:
          r0: 3900
          r10: 4200
          r15: 4400
          c0: 4500
          c10: 4300
          c15: 4000
          struct: 4600
    explanation: >-
      For each flap setting the performance limit is the lower of the runway and
      climb limits. The best flap setting gives the highest of these values, and
      the take-off mass can never exceed the structural limit.


      **Solution**


      Flaps 0: min({{r0}}, {{c0}}) = {{= min(r0, c0)}} kg

      Flaps 10: min({{r10}}, {{c10}}) = {{= min(r10, c10)}} kg

      Flaps 15: min({{r15}}, {{c15}}) = {{= min(r15, c15)}} kg


      Best flap setting: {{= max(max(min(r0, c0), min(r10, c10)), min(r15,
      c15))}} kg


      MTOM = min({{struct}}, {{= max(max(min(r0, c0), min(r10, c10)), min(r15,
      c15))}}) = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the runway limit of flaps 0 is used.

      - **{{d2}} kg**: only the climb limit of flaps 15 is used.

      - **{{d3}} kg**: only the climb limit of flaps 0 is used, ignoring the
      runway limit and the structural limit.

      - **{{d4}} kg**: takes the highest runway limit and ignores the climb
      limit and the structural limit.
- id: QZYWKANM
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-311286
    - AVEXAM-65483
    - BGS-310506
  annexes: []
  learningObjectives:
    - 031.02.01.02.04
  template:
    type: calculation
    question: An aircraft is refuelled with {{vol}} litres of fuel. The specific
      gravity of the fuel is {{sg}}. By how many pounds does the weight of the
      aircraft increase?
    variables:
      - id: vol
        label: Fuel volume
        unit: l
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * sg * 2.2046
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: vol * sg
      - id: d2
        formula: vol / sg * 2.2046
      - id: d3
        formula: vol * sg / 2.2046
      - id: d4
        formula: vol * 2.2046
    presets:
      - id: p1
        values:
          vol: 173
          sg: 0.72
      - id: p2
        values:
          vol: 250
          sg: 0.8
      - id: p3
        values:
          vol: 400
          sg: 0.78
    explanation: >-
      The mass in kg is volume in litres times SG; multiply by 2.2046 to get
      pounds.


      **Solution**


      {{f: vol * sg * 2.2046}} = {{n: vol * sg * 2.2046}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: Gives the mass in kg and forgets the conversion to lb.

      - **{{d2}} lb**: Divides by the SG instead of multiplying.

      - **{{d3}} lb**: Divides by 2.2046 instead of multiplying (inverted
      conversion).

      - **{{d4}} lb**: Ignores the SG.
