        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: mtom
        label: Maximum take-off mass
        unit: kg
      - id: mlm
        label: Maximum landing mass
        unit: kg
      - id: mzfm
        label: Maximum zero fuel mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
    answer:
      formula: min(mzfm - dom, mtom - dom - (block - taxi), mlm - dom - (block - taxi
        - trip))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mtom - dom - (block - taxi)
      - id: d2
        formula: mlm - dom - (block - taxi - trip)
      - id: d3
        formula: mzfm - dom + taxi
      - id: d4
        formula: mzfm - dom - taxi
      - id: d5
        formula: mlm - dom - trip
    presets:
      - id: p1
        values:
          block: 40000
          taxi: 800
          trip: 29000
          mtom: 170000
          mlm: 148500
          mzfm: 112500
          dom: 80400
      - id: p2
        values:
          block: 12000
          taxi: 400
          trip: 8000
          mtom: 78000
          mlm: 66000
          mzfm: 60000
          dom: 40000
    explanation: >-
      The traffic load is limited by the zero fuel mass, take-off mass and
      landing mass limits. The take-off fuel is the block fuel minus taxi fuel,
      and the landing fuel is the take-off fuel minus trip fuel. The smallest
      resulting traffic load applies.


      **Solution**


      - Zero fuel mass: {{= mzfm - dom}} kg

      - Take-off mass: {{= mtom - dom - (block - taxi)}} kg

      - Landing mass: {{= mlm - dom - (block - taxi - trip)}} kg


      The smallest value limits the traffic load: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the take-off mass limit is applied.

      - **{{d2}} kg**: only the landing mass limit is applied.

      - **{{d3}} kg**: the taxi fuel is wrongly added to the zero-fuel limit.

      - **{{d4}} kg**: the taxi fuel is wrongly deducted from the zero-fuel
      limit.

      - **{{d5}} kg**: the landing fuel is replaced by the trip fuel.
- id: QMNO4VMDP
  docId: "031.02"
  relatedQuestions:
