  template:
    type: calculation
    question: "{{usg}} US gallons is equivalent to how many Imperial gallons?"
    variables:
      - id: usg
        label: Volume
        unit: US gal
    answer:
      formula: usg * 0.8327
      unit: Imp gal
      decimals: 0
    distractors:
      - id: d1
        formula: usg / 0.8327
      - id: d2
        formula: usg * 0.78
      - id: d3
        formula: usg * 0.8327 / 10
      - id: d4
        formula: usg * 3.785
    presets:
      - id: p1
        values:
          usg: 5600
      - id: p2
        values:
          usg: 3000
      - id: p3
        values:
          usg: 8000
    explanation: >-
      One Imperial gallon (4.546 l) is larger than one US gallon (3.785 l), so a
      volume in US gallons is a smaller number of Imperial gallons: 1 US gal =
      0.8327 Imp gal.


      **Solution**


      {{f: usg * 0.8327}} = {{n: usg * 0.8327}} = **{{answer}} Imp gal**


      **Why the other answers are wrong**


      - **{{d1}} Imp gal**: Inverted ratio: divides by 0.8327 instead of
      multiplying.

      - **{{d2}} Imp gal**: Uses an incorrect conversion factor of 0.78.

      - **{{d3}} Imp gal**: Decimal-place slip (factor ten too small).

      - **{{d4}} Imp gal**: Converts to litres instead of Imperial gallons.
