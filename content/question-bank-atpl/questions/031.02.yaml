    - AVEXAM-88784
    - AVEXAM-69097
    - AVEXAM-8164
    - AVEXAM-42655
    - BGS-310548
    - AVEXAM-49831
  annexes: []
  learningObjectives:
    - 031.02.03.02.02
  template:
    type: calculation
    question: >-
      Before departure for a flight, the load controller presents to you cargo
      documents for boxes containing spare parts. These boxes have a total mass
      of {{boxes}} kg. If you accept all the boxes, given the following
      information, what will be the Underload/Overload? Give the underload in kg
      as a positive number (an overload would be negative).


      - Allowed Take-Off Mass: {{atom}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg

      - Operating Mass: {{om}} kg

      - Actual Zero Fuel Mass: {{zfm}} kg

      - Actual Traffic Load (without the boxes): {{tl}} kg

      - Take-off fuel: {{tofuel}} kg


      Disregard changes in fuel due to the increase in Total Mass. Consider no
      restrictions on structural limits and Allowed Landing Mass.
    variables:
      - id: boxes
        label: Mass of boxes
        unit: kg
      - id: atom
        label: Allowed take-off mass
        unit: kg
      - id: mzfm
        label: Maximum zero fuel mass
        unit: kg
      - id: om
        label: Operating mass
        unit: kg
      - id: zfm
        label: Actual zero fuel mass
        unit: kg
      - id: tl
        label: Actual traffic load
        unit: kg
      - id: tofuel
        label: Take-off fuel
        unit: kg
    answer:
      formula: atom - (zfm + boxes + tofuel)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mzfm - zfm - boxes
      - id: d2
        formula: -(atom - (zfm + boxes + tofuel))
      - id: d3
        formula: atom - (zfm + tofuel)
      - id: d4
        formula: atom - (om + boxes)
      - id: d5
        formula: -(mzfm - zfm - boxes)
    presets:
      - id: p1
        values:
          boxes: 4500
          atom: 76720
          mzfm: 62731
          om: 58799
          zfm: 55063
          tl: 12563
          tofuel: 16299
      - id: p2
        values:
          boxes: 3000
          atom: 70000
          mzfm: 55000
          om: 52800
          zfm: 50000
          tl: 11200
          tofuel: 14000
      - id: p3
        values:
          boxes: 4000
          atom: 82000
          mzfm: 66000
          om: 63500
          zfm: 60000
          tl: 13500
          tofuel: 17000
    explanation: >-
      The loaded aircraft must not exceed the allowed take-off mass. With the
      boxes added, the new zero fuel mass plus the take-off fuel gives the
      actual take-off mass; the difference to the allowed take-off mass is the
      underload (positive) or overload (negative). The MZFM is not the limiting
      value here, because the new ZFM stays below it.


      **Solution**


      New ZFM = {{= zfm + boxes}} kg (below the MZFM of {{mzfm}} kg)


      {{f: atom - (zfm + boxes + tofuel)}} = {{n: atom - (zfm + boxes +
      tofuel)}} = **{{answer}} kg** underload


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is the margin to the MZFM, not to the allowed
      take-off mass.

      - **{{d2}} kg**: correct magnitude of the answer but the sign is reversed
      (underload read as overload).

      - **{{d3}} kg**: the mass of the boxes is not included in the take-off
      mass.

      - **{{d4}} kg**: the operating mass already includes fuel and the actual
      traffic load without boxes is ignored, so the figure is far too large.

      - **{{d5}} kg**: the MZFM margin with the sign reversed.
- id: QPPDRVVR
  docId: "031.02"
