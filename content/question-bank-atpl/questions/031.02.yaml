  template:
    type: calculation
    question: "Determine the maximum fuel that can be on board at the start of
      take-off (maximum permissible take-off fuel tankage), given: take-off mass
      limit {{tom}} kg, dry operating mass {{dom}} kg, traffic load {{tl}} kg
      and trip fuel {{trip}} kg. Landing is not limiting."
    variables:
      - id: tom
        label: Limiting take-off mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: tl
        label: Traffic load
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
    answer:
      formula: tom - dom - tl
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - dom - tl - trip
      - id: d2
        formula: tom - dom
      - id: d3
        formula: tom - dom - tl + trip
      - id: d4
        formula: tom - tl - trip
    presets:
      - id: p1
        values:
          tom: 60400
          dom: 34930
          tl: 11000
          trip: 8600
      - id: p2
        values:
          tom: 61900
          dom: 36200
          tl: 13980
          trip: 6800
      - id: p3
        values:
          tom: 58000
          dom: 33000
          tl: 12000
          trip: 7000
    explanation: >-
      Take-off mass = DOM + traffic load + take-off fuel. When take-off mass is
      the limit, the maximum fuel is whatever remains of the limiting take-off
      mass after the DOM and traffic load are deducted. The trip fuel only needs
      to fit within this amount.


      **Solution**


      {{f: tom - dom - tl}} = {{n: tom - dom - tl}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the trip fuel is deducted again although it is part of
      the fuel load.

      - **{{d2}} kg**: the traffic load is forgotten.

      - **{{d3}} kg**: the trip fuel is added.

      - **{{d4}} kg**: the dry operating mass is forgotten.
