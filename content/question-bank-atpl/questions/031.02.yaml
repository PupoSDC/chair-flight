  annexes: []
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: calculation
    question: |-
      Given the following information, calculate the traffic load:

      - Operating mass: {{om}} kg
      - Zero Fuel Mass: {{zfm}} kg
      - MZFM: {{mzfm}} kg
      - Take-off fuel: {{tofuel}} kg
      - Block fuel: {{blockfuel}} kg
    variables:
      - id: om
        label: Operating mass
        unit: kg
      - id: zfm
        label: Zero fuel mass
        unit: kg
      - id: mzfm
        label: Maximum zero fuel mass
        unit: kg
      - id: tofuel
        label: Take-off fuel
        unit: kg
      - id: blockfuel
        label: Block fuel
        unit: kg
    answer:
      formula: zfm - (om - tofuel)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: zfm - om + blockfuel
      - id: d2
        formula: mzfm - om + tofuel
      - id: d3
        formula: mzfm - om + blockfuel
      - id: d4
        formula: om - zfm
    presets:
      - id: p1
        values:
          om: 5720
          zfm: 5160
          mzfm: 5978
          tofuel: 1735
          blockfuel: 1770
      - id: p2
        values:
          om: 6200
          zfm: 5600
          mzfm: 6400
          tofuel: 1500
          blockfuel: 1560
      - id: p3
        values:
          om: 4300
          zfm: 3900
          mzfm: 4500
          tofuel: 1100
          blockfuel: 1140
    explanation: >-
      The operating mass includes the take-off fuel, so the dry operating mass
      is the operating mass minus the take-off fuel. The traffic load is the
      zero fuel mass minus that dry operating mass.


      **Solution**


      Dry operating mass = {{f: om - tofuel}} = {{n: om - tofuel}} = {{= om -
      tofuel}} kg


      {{f: zfm - (om - tofuel)}} = {{n: zfm - (om - tofuel)}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: block fuel (instead of take-off fuel) is used to correct
      the operating mass, and the correction is applied in the wrong place.

      - **{{d2}} kg**: the MZFM is used instead of the actual ZFM.

      - **{{d3}} kg**: the MZFM is used instead of the actual ZFM and block fuel
      instead of take-off fuel.

      - **{{d4}} kg**: the subtraction is reversed (operating mass minus ZFM).
- id: QOTUSYVB
  docId: "031.02"
