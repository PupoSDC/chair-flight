  template:
    type: calculation
    question: >-
      Given the following fuel masses, calculated by the pilot of a light
      aircraft with the following mass limitations, according to the Limitation
      section of the Aircraft Flight Manual, what is the maximum traffic load
      for this flight?


      - Block Fuel: {{block}} kg

      - Trip Fuel: {{trip}} kg

      - Taxi Fuel: {{taxi}} kg

      - Maximum Structural Take-Off Mass: {{mtom}} kg

      - Performance-Limited Take-Off Mass: {{ptom}} kg

      - Performance-Limited Landing Mass: {{pllm}} kg

      - Today's flight Dry Operating Mass: {{dom}} kg
    variables:
      - id: block
        label: Block fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: mtom
        label: Maximum structural TOM
        unit: kg
      - id: ptom
        label: Performance-limited TOM
        unit: kg
      - id: pllm
        label: Performance-limited LM
        unit: kg
      - id: dom
        label: DOM
        unit: kg
    answer:
      formula: min(mtom, ptom, pllm + trip) + taxi - dom - block
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mtom + taxi - dom - block
      - id: d2
        formula: min(mtom, ptom) + taxi - dom - block
      - id: d3
        formula: pllm + taxi - dom - block
    presets:
      - id: p1
        values:
          block: 890
          trip: 480
          taxi: 25
          mtom: 5800
          ptom: 5650
          pllm: 4700
          dom: 2970
      - id: p2
        values:
          block: 1000
          trip: 550
          taxi: 30
          mtom: 6200
          ptom: 6000
          pllm: 5100
          dom: 3200
      - id: p3
        values:
          block: 700
          trip: 380
          taxi: 20
          mtom: 4500
          ptom: 4400
          pllm: 3800
          dom: 2300
    explanation: >-
      The take-off mass is limited by the lowest of the structural MTOM, the
      performance-limited take-off mass and the landing limit
      (performance-limited landing mass plus trip fuel). The traffic load is
      this take-off mass minus the DOM and the fuel on board at take-off (block
      fuel minus taxi fuel).


      **Solution**


      Limiting take-off mass = {{= min(mtom, ptom, pllm + trip)}} kg


      {{f: min(mtom, ptom, pllm + trip) + taxi - dom - block}} = {{n: min(mtom,
      ptom, pllm + trip) + taxi - dom - block}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Uses only the structural MTOM and ignores the performance
      and landing limits.

      - **{{d2}} kg**: Ignores the landing limit (uses the lower of the take-off
      limits only).

      - **{{d3}} kg**: Uses the landing mass without adding the trip fuel.
