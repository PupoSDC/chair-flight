  template:
    type: calculation
    question: >-
      A flight crew of a turbojet aeroplane prepares a Commercial Air Transport
      flight using the following information. Determine the allowed take-off
      mass for this flight:


      - Maximum Take-Off Mass: {{mtom}} kg

      - Maximum Landing Mass: {{mlm}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg


      Take-off mass is NOT performance limited


      - Performance-Limited Landing Mass at destination: {{pllm}} kg

      - Block Fuel: {{block}} kg

      - Taxi Fuel: {{taxi}} kg

      - Trip Fuel: {{trip}} kg

      - Reserve Fuel (contingency, alternate and final): {{reserve}} kg
    variables:
      - id: mtom
        label: MTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: pllm
        label: Performance-limited LM
        unit: kg
      - id: block
        label: Block fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: reserve
        label: Reserve fuel
        unit: kg
    answer:
      formula: min(mtom, min(mlm, pllm) + trip, mzfm + block - taxi)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mzfm + block
      - id: d2
        formula: mtom
      - id: d3
        formula: mzfm + trip + reserve
    presets:
      - id: p1
        values:
          mtom: 62800
          mlm: 54900
          mzfm: 50300
          pllm: 53950
          block: 9720
          taxi: 120
          trip: 6160
          reserve: 2660
      - id: p2
        values:
          mtom: 70000
          mlm: 60000
          mzfm: 54000
          pllm: 58500
          block: 10500
          taxi: 150
          trip: 6500
          reserve: 3000
      - id: p3
        values:
          mtom: 80000
          mlm: 66000
          mzfm: 60000
          pllm: 64000
          block: 12000
          taxi: 200
          trip: 8000
          reserve: 3000
    explanation: >-
      The take-off mass is limited by the structural MTOM, by the landing mass
      limit (the lower of MLM and the performance-limited landing mass, plus
      trip fuel) and by the zero fuel mass limit (MZFM plus the fuel on board at
      take-off, i.e. block fuel minus taxi fuel).


      **Solution**


      MTOM limit = {{mtom}} kg

      Landing limit = {{= min(mlm, pllm) + trip}} kg

      Zero fuel mass limit = {{= mzfm + block - taxi}} kg


      The lowest is the allowed take-off mass: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Adds the whole block fuel to the MZFM without deducting
      the taxi fuel.

      - **{{d2}} kg**: Uses only the structural MTOM and ignores the other
      limits.

      - **{{d3}} kg**: Adds only trip and reserve fuel to the MZFM, ignoring the
      extra fuel in the block.
