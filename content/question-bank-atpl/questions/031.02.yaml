    question: |-
      Determine the maximum permissible traffic load, given:

      - Take-Off Mass: {{tom}} kg
      - Take-off fuel: {{takeoff_fuel}} kg
      - Reserve fuel: {{reserve_fuel}} kg
      - Basic Empty Mass: {{bem}} kg
      - Total mass of crew and special operating equipment: {{crew}} kg
    variables:
      - id: tom
        label: Take-off mass
        unit: kg
      - id: takeoff_fuel
        label: Take-off fuel
        unit: kg
      - id: reserve_fuel
        label: Reserve fuel
        unit: kg
      - id: bem
        label: Basic empty mass
        unit: kg
      - id: crew
        label: Crew and special equipment
        unit: kg
    answer:
      formula: tom - bem - crew - takeoff_fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - bem - takeoff_fuel
      - id: d2
        formula: tom - bem - reserve_fuel
      - id: d3
        formula: reserve_fuel
    presets:
      - id: p1
        values:
          tom: 8600
          takeoff_fuel: 1840
          reserve_fuel: 920
          bem: 4940
          crew: 440
      - id: p2
        values:
          tom: 9200
          takeoff_fuel: 2000
          reserve_fuel: 1000
          bem: 5200
          crew: 460
      - id: p3
        values:
          tom: 7800
          takeoff_fuel: 1500
          reserve_fuel: 800
          bem: 4400
          crew: 380
    explanation: >-
      Take-off mass is made up of the operating mass (basic empty mass plus crew
      and special equipment), the take-off fuel and the traffic load. The
      traffic load is what remains after subtracting the other two.


      **Solution**


      {{f: tom - bem - crew - takeoff_fuel}} = {{n: tom - bem - crew -
      takeoff_fuel}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Forgets the crew and special operating equipment.

      - **{{d2}} kg**: Subtracts the reserve fuel instead of the take-off fuel
      and forgets the crew.

      - **{{d3}} kg**: Takes the reserve fuel as the traffic load.
