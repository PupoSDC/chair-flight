    - BGS-310140
  annexes: []
  learningObjectives:
    - 031.02.03.02.02
  template:
    type: calculation
    question: |-
      Given the following information, what is the Underload/Overload?

      - Allowed Take-off Mass: {{allowed}} kg
      - Operating Mass: {{om}} kg
      - Total Fuel Mass: {{fuel}} kg
      - Mass of the crew and their baggage: {{crew}} kg
      - Traffic Load: {{traffic}} kg
    variables:
      - id: allowed
        label: Allowed take-off mass
        unit: kg
      - id: om
        label: Operating mass
        unit: kg
      - id: fuel
        label: Total fuel mass
        unit: kg
      - id: crew
        label: Crew and baggage mass
        unit: kg
      - id: traffic
        label: Traffic load
        unit: kg
    answer:
      formula: om + traffic - allowed
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: om + traffic + fuel - allowed
      - id: d2
        formula: om + traffic + crew - allowed
      - id: d3
        formula: allowed - om - fuel
    presets:
      - id: p1
        values:
          allowed: 4300
          om: 3296
          fuel: 650
          crew: 187
          traffic: 1014
      - id: p2
        values:
          allowed: 5200
          om: 4020
          fuel: 780
          crew: 175
          traffic: 1195
      - id: p3
        values:
          allowed: 3800
          om: 2890
          fuel: 520
          crew: 160
          traffic: 932
    explanation: >-
      The operating mass already includes the crew, their baggage and the fuel,
      so the take-off mass is the operating mass plus the traffic load. A
      positive difference to the allowed take-off mass is an overload, a
      negative one an underload.


      **Solution**


      TOM = {{om}} + {{traffic}} = {{= om + traffic}} kg


      {{f: om + traffic - allowed}} = {{n: om + traffic - allowed}} =
      **{{answer}} kg** (overload)


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the fuel again although it is already in the
      operating mass.

      - **{{d2}} kg**: adds the crew mass again although it is already in the
      operating mass.

      - **{{d3}} kg**: forgets the traffic load, which would give an underload
      of this size.
