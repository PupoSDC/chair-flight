  annexes: []
  learningObjectives:
    - 031.02.01.02.04
  template:
    type: calculation
    question: Determine the weight, in lbs, of {{usg}} US gallons of fuel (SG
      {{sg}}). (1 US gallon of water weighs 8.3326 lb.)
    variables:
      - id: usg
        label: Fuel volume
        unit: US gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: usg * sg * 8.3326
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: usg * sg * 3.785
      - id: d2
        formula: usg / sg * 8.3326
      - id: d3
        formula: usg * sg * 8.3326 / 2.2046
      - id: d4
        formula: usg * 8.3326
    presets:
      - id: p1
        values:
          usg: 867
          sg: 0.78
      - id: p2
        values:
          usg: 500
          sg: 0.79
      - id: p3
        values:
          usg: 1200
          sg: 0.8
    explanation: >-
      Weight of fuel in lb equals the volume in US gallons times the SG times
      the weight of one US gallon of water (about 8.33 lb).


      **Solution**


      {{f: usg * sg * 8.3326}} = {{n: usg * sg * 8.3326}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: Converts to litres (kg) only and forgets the conversion
      to lb.

      - **{{d2}} lb**: Divides by the SG instead of multiplying.

      - **{{d3}} lb**: Converts the result in lb back by dividing by 2.2046.

      - **{{d4}} lb**: Ignores the SG (treats the fuel as water).
