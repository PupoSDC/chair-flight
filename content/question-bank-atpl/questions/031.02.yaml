      - id: d3
        formula: struct
    presets:
      - id: p1
        values:
          struct: 3720
          taxi: 20
          perf: 3640
      - id: p2
        values:
          struct: 3650
          taxi: 30
          perf: 3540
      - id: p3
        values:
          struct: 3200
          taxi: 25
          perf: 3100
      - id: p4
        values:
          struct: 4100
          taxi: 25
          perf: 3980
    explanation: >-
      The regulated take-off mass is the lowest of the structural and
      performance limits. The taxi allowance only applies to the structural
      limit, because the fuel burnt during taxiing is gone before the take-off
      roll; it does not raise a performance limit.


      **Solution**


      Structural limit at take-off: {{= struct}} + {{= taxi}} = {{= struct +
      taxi}} lb


      {{f: min(struct + taxi, perf)}} = {{n: min(struct + taxi, perf)}} =
      **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: structural limit plus taxi allowance, ignoring the lower
      performance limit.

      - **{{d2}} lb**: adds the taxi allowance to the performance-limited mass.

      - **{{d3}} lb**: the maximum structural mass alone, ignoring the
      performance limit.
