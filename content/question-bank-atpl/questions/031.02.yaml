          bem: 28400
          catering: 250
          crew: 320
          fuel: 2800
          unusable: 100
          payload: 7500
    explanation: >-
      The Dry Operating Mass is the basic empty mass plus the operational items
      (crew, catering, safety and rescue material, fly away kit). Traffic load
      and usable fuel are not included, and unusable fuel is already part of the
      basic empty mass.


      **Solution**


      {{f: bem + catering + crew}} = {{n: bem + catering + crew}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the payload was added instead of the crew.

      - **{{d2}} kg**: the crew mass was forgotten.

      - **{{d3}} kg**: the unusable fuel was added, but it is already included
      in the basic empty mass.

      - **{{d4}} kg**: the take-off fuel was added, but fuel is not part of the
      dry operating mass.
