      Given:

      - Basic Empty Mass = {{bem}} kg
      - Dry Operating Mass = {{dom}} kg
      - Zero Fuel Mass = {{zfm}} kg
      - Take-off Mass = {{tom}} kg

      What is the traffic load?
    variables:
      - id: bem
        label: Basic Empty Mass
        unit: kg
      - id: dom
        label: Dry Operating Mass
        unit: kg
      - id: zfm
        label: Zero Fuel Mass
        unit: kg
      - id: tom
        label: Take-off Mass
        unit: kg
