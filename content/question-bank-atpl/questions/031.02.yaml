    type: chart-calculation
    question: >-
      Refer to the figure.


      A twin-jet aeroplane is fuelled in the outer and inner wing tanks only
      (the centre tank stays empty).


      The total capacity of these tanks, read from the figure, is {{vol}} l.


      The fuel density is {{dens}} kg/l.


      What is the maximum mass of fuel that can be loaded?
    variables:
      - id: vol
        label: Outer + inner tank volume (read from the figure)
        unit: l
      - id: dens
        label: Fuel density
        unit: kg/l
    chartInputs:
      - vol
    answer:
      formula: vol * dens
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: vol / dens
      - id: d2
        formula: vol * dens / 2
      - id: d3
        formula: vol * 0.785
      - id: d4
        formula: vol * (1 - dens)
    presets:
      - id: p1
        values:
          vol: 15610
          dens: 0.8
      - id: p2
        values:
          vol: 15607.5
          dens: 0.8
      - id: p3
        values:
          vol: 16000
          dens: 0.78
    explanation: >-
      The usable volume is read from the figure and multiplied by the fuel
      density to get the mass.


      **Solution**


      {{f: vol * dens}} = {{n: vol * dens}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Divides by the density instead of multiplying.

      - **{{d2}} kg**: Takes only half of the volume (one wing).

      - **{{d3}} kg**: Uses a wrong, hard-coded density of 0.785.

      - **{{d4}} kg**: Uses (1 - density) as the conversion.
