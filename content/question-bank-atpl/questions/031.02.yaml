  template:
    type: calculation
    question: |-
      Given:

      - Basic Empty Mass: {{bem}} lb
      - Pilot + Passenger: {{crew}} lb
      - Cargo: {{cargo}} lb
      - Ramp Fuel (Block Fuel): {{block}} Gal
      - Trip Fuel: {{trip}} Gal
      - Taxi Fuel: {{taxi}} Gal
      - Final Reserve Fuel: {{res}} Gal
      - Fuel density: {{dens}} lb/Gal

      What is the expected landing mass?
    variables:
      - id: bem
        label: Basic empty mass
        unit: lb
      - id: crew
        label: Pilot + passenger
        unit: lb
      - id: cargo
        label: Cargo
        unit: lb
      - id: block
        label: Block fuel
        unit: gal
      - id: trip
        label: Trip fuel
        unit: gal
      - id: taxi
        label: Taxi fuel
        unit: gal
      - id: res
        label: Final reserve fuel
        unit: gal
      - id: dens
        label: Fuel density
        unit: lb/gal
    answer:
      formula: bem + crew + cargo + (block - taxi - trip) * dens
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: bem + crew + cargo + (block - trip) * dens
      - id: d2
        formula: bem + crew + cargo + block - taxi - trip
      - id: d3
        formula: bem + crew + cargo + res * dens
    presets:
      - id: p1
        values:
          bem: 1799
          crew: 300
          cargo: 350
          block: 60
          trip: 35
          taxi: 1.7
          res: 18
          dens: 6
      - id: p2
        values:
          bem: 1850
          crew: 340
          cargo: 280
          block: 55
          trip: 30
          taxi: 2
          res: 15
          dens: 6
    explanation: >-
      Landing mass = zero fuel mass + fuel remaining at landing. Zero fuel mass
      is the basic empty mass plus the payload. The fuel remaining at landing is
      the block fuel minus the taxi fuel and the trip fuel, converted to lb with
      the fuel density.


      **Solution**


      Zero fuel mass: {{= bem + crew + cargo}} lb

      Fuel at landing: ({{block}} - {{taxi}} - {{trip}}) x {{dens}} = {{= (block
      - taxi - trip) * dens}} lb


      Landing mass = {{= bem + crew + cargo}} + {{= (block - taxi - trip) *
      dens}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the taxi fuel was not subtracted from the block fuel.

      - **{{d2}} lb**: the fuel remaining was left in gallons and not converted
      to lb.

      - **{{d3}} lb**: only the final reserve fuel was taken as fuel at landing.
