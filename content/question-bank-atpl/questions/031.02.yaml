        values:
          zfm: 4770
          trip: 1040
          block: 1960
          taxi: 20
      - id: p2
        values:
          zfm: 4920
          trip: 880
          block: 1330
          taxi: 25
      - id: p3
        values:
          zfm: 5300
          trip: 1100
          block: 1700
          taxi: 30
    explanation: >-
      The take-off mass is the zero fuel mass plus the fuel on board at
      take-off. That fuel is the block fuel minus the fuel burned during
      start-up and taxi.


      **Solution**


      {{f: zfm + block - taxi}} = {{n: zfm + block - taxi}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: taxi fuel is not subtracted (this is the ramp mass).

      - **{{d2}} kg**: taxi fuel is added instead of subtracted.

      - **{{d3}} kg**: only the trip fuel is added (this is not the fuel on
      board at take-off).

      - **{{d4}} kg**: the trip fuel is subtracted from the block fuel instead
      of the taxi fuel.
- id: Q7KJY9MIJ
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-313891
    - AVEXAM-19626
  annexes:
    - 031-standard-mass-values
  learningObjectives:
    - 031.02.03.03.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure or CAP 696.


      An airbus commercial holiday charter flight is operated by {{crew}} crew
      members.


      The passengers on board are {{adults}} adults, {{children}} children and
      {{infants}} infants who take the same seat as their parents.


      The operator uses standard masses for passengers (all adults) and checked
      baggage.


      Standard masses read from the figure: adult {{adm}} kg, child {{chm}} kg
      (infants and baggage are included).


      There is {{freight}} kg of freight.


      What is the traffic load?
    variables:
      - id: crew
        label: Crew members
        unit: ""
      - id: adults
        label: Adults
        unit: ""
      - id: children
        label: Children
        unit: ""
      - id: infants
        label: Infants
        unit: ""
      - id: adm
        label: Standard adult mass (read from the figure)
        unit: kg
      - id: chm
        label: Standard child mass (read from the figure)
        unit: kg
      - id: freight
        label: Freight
        unit: kg
    chartInputs:
      - adm
      - chm
    answer:
      formula: adults * adm + children * chm + freight
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: adults * adm + children * chm + freight + infants * chm
      - id: d2
        formula: adults * adm + children * chm + freight + crew * adm
      - id: d3
        formula: (adults + children + infants) * adm + freight
      - id: d4
        formula: adults * adm + children * chm
    presets:
      - id: p1
        values:
          crew: 7
          adults: 142
          children: 15
          infants: 5
          adm: 76
          chm: 35
          freight: 1050
      - id: p2
        values:
          crew: 6
          adults: 120
          children: 10
          infants: 3
          adm: 76
          chm: 35
          freight: 800
    explanation: >-
      The traffic load is the mass of the passengers, baggage and freight. For
      passengers it is the number in each category times the standard mass from
      the table; crew are not part of the traffic load and infants are covered
      by the standard masses.


      **Solution**


      {{f: adults * adm + children * chm + freight}} = {{n: adults * adm +
      children * chm + freight}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: infants are counted with the child mass.

      - **{{d2}} kg**: crew members are included in the traffic load.

      - **{{d3}} kg**: all passengers are counted at the adult mass.

      - **{{d4}} kg**: the freight is forgotten.
- id: Q9ZRDKHXN
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317865
    - AVEXAM-28770
  annexes: []
  learningObjectives:
