    - BGS-310633
    - AVEXAM-28753
    - AVEXAM-48023
    - BGS-310806
    - AVEXAM-36692
    - BGS-310149
    - BGS-310144
    - AVEXAM-27729
    - AVEXAM-49831
  annexes: []
  learningObjectives:
    - 031.02.03.02.01
  template:
    type: calculation
    question: >-
      During pre-flight mass and balance calculations, {{tank}} kg of fuel has
      been decided for tankering purposes. Just before refuelling starts, the
      load controller reports a Last Minute Change (LMC) of +{{lmc}} kg.
      Calculate the maximum Block Fuel that can be carried, given:


      - Dry Operating Mass: {{dom}} kg

      - Traffic Load before LMC: {{tl}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg

      - Allowed Take-off Mass: {{atom}} kg

      - Minimum Required Block Fuel: {{minfuel}} kg

      - Taxi Fuel: {{taxi}} kg


      (Assume no restrictions on the Landing Mass.)
    variables:
      - id: tank
        label: Tankering fuel
        unit: kg
      - id: lmc
        label: LMC
        unit: kg
      - id: dom
        label: DOM
        unit: kg
      - id: tl
        label: Traffic load before LMC
        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: atom
        label: Allowed TOM
        unit: kg
      - id: minfuel
        label: Minimum block fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: atom - dom - tl - lmc + taxi
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: atom - dom - tl - lmc
      - id: d2
        formula: tank - lmc
      - id: d3
        formula: tank - lmc - taxi
      - id: d4
        formula: atom - dom - tl + taxi
    presets:
      - id: p1
        values:
          tank: 1850
          lmc: 285
          dom: 4135
          tl: 1200
          mzfm: 6805
          atom: 7205
          minfuel: 1430
          taxi: 33
      - id: p2
        values:
          tank: 2100
          lmc: 180
          dom: 4320
          tl: 1350
          mzfm: 6900
          atom: 7480
          minfuel: 1500
          taxi: 40
      - id: p3
        values:
          tank: 1700
          lmc: 320
          dom: 3980
          tl: 1150
          mzfm: 6600
          atom: 6950
          minfuel: 1380
          taxi: 30
    explanation: >-
      The maximum block fuel is limited by the allowed take-off mass (TOM). Fuel
      can only fill the mass left after the dry operating mass and the final
      traffic load (including the last minute change); the taxi fuel burned
      before take-off is not part of the take-off mass, so it is added back. The
      zero fuel mass is checked against the MZFM ({{= dom + tl + lmc}} kg is
      below {{mzfm}} kg), so it does not restrict the result.


      **Solution**


      Zero fuel mass = {{= dom}} + {{= tl + lmc}} = {{= dom + tl + lmc}} kg


      {{f: atom - dom - tl - lmc + taxi}} = {{n: atom - dom - tl - lmc + taxi}}
      = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: forgets to add back the taxi fuel, which is burned before
      take-off.

      - **{{d2}} kg**: starts from the planned tankering fuel and only subtracts
      the LMC, ignoring the take-off mass limit.

      - **{{d3}} kg**: same as above, and additionally subtracts the taxi fuel.

      - **{{d4}} kg**: ignores the +{{lmc}} kg LMC in the traffic load.
