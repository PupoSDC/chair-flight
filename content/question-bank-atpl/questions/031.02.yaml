  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      A turboprop aeroplane having 36 passenger seats operates a domestic
      Commercial Air Transport flight carrying a rugby team of {{n}} sportsmen.


      Each of these players has one checked baggage and the average mass of
      these people is {{avg}} kg.


      The standard mass of one checked baggage read from the figure is {{bag}}
      kg.


      Determine the mass of the Traffic Load for this flight.
    variables:
      - id: n
        label: Number of sportsmen
        unit: persons
      - id: avg
        label: Average mass per person
        unit: kg
      - id: bag
        label: Standard mass per checked baggage (from figure)
        unit: kg
    chartInputs:
      - bag
    answer:
      formula: n * (avg + bag)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: n * avg
      - id: d2
        formula: n * (avg + 13)
      - id: d3
        formula: n * (88 + bag)
    presets:
      - id: p1
        values:
          n: 28
          avg: 115
          bag: 11
      - id: p2
        values:
          n: 24
          avg: 110
          bag: 11
    explanation: >-
      The traffic load of a team flight is the mass of the passengers (here the
      actual average mass of the sportsmen) plus the standard mass of their
      checked baggage taken from the standard masses table.


      **Solution**


      {{f: n * (avg + bag)}} = {{n: n * (avg + bag)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the checked baggage.

      - **{{d2}} kg**: uses 13 kg per bag (intercontinental value) instead of
      the domestic value.

      - **{{d3}} kg**: uses the standard adult male mass of 88 kg instead of the
      team's average mass.
