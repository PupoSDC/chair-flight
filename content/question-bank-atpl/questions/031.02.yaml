- id: QNSE91VXP
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316146
    - AVEXAM-9009
    - BGS-310544
  annexes: []
  learningObjectives:
    - 031.02.01.02.04
  template:
    type: calculation
    question: Following the acceptance of the Load Sheet and the Operational Flight
      Plan, the Commander decides to refuel the aircraft with {{vol}} US gallons
      at a specific gravity of {{sg}}. The fuel mass loaded on board is...
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * 3.78541 * sg * 2.20462
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: vol * 3.78541 * 2.20462 / sg
      - id: d2
        formula: vol * sg / 3.78541 * 2.20462
      - id: d3
        formula: vol * 3.78541 * sg / 2.20462
    presets:
      - id: p1
        values:
          vol: 1618
          sg: 0.8
      - id: p2
        values:
          vol: 650
          sg: 0.79
      - id: p3
        values:
          vol: 1200
          sg: 0.78
    explanation: >-
      Fuel mass = volume x specific gravity x density of water. With the volume
      in US gallons and the result wanted in lb, convert gallons to litres (x
      3.78541), multiply by the specific gravity to get kg, then convert kg to
      lb (x 2.20462).


      **Solution**


      {{f: vol * 3.78541 * sg * 2.20462}} = {{n: vol * 3.78541 * sg * 2.20462}}
      = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: volume divided by the specific gravity instead of
      multiplied.

      - **{{d2}} lb**: gallons divided by 3.78541 instead of multiplied.

      - **{{d3}} lb**: the result in kg was divided by 2.20462 instead of
      multiplied (kg to lb conversion inverted).
- id: QNYRALSX
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-316535
    - AVEXAM-43441
  annexes: []
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: calculation
    question: >-
      Given the following information, calculate the actual Zero Fuel Mass of
      the aircraft.


      - Performance-Limited Take-Off Mass: {{ptom}} lb

      - Basic Empty Mass: {{bem}} lb

      - Take-off fuel: {{tof}} lb

      - Unusable fuel: {{unusable}} lb

      - Pilot's mass: {{pilot}} lb

      - Passengers' mass: {{pax}} lb
    variables:
      - id: ptom
        label: Performance-Limited TOM
        unit: lb
      - id: bem
        label: Basic Empty Mass
        unit: lb
      - id: tof
        label: Take-off fuel
        unit: lb
      - id: unusable
        label: Unusable fuel
        unit: lb
      - id: pilot
        label: Pilot's mass
        unit: lb
      - id: pax
        label: Passengers' mass
        unit: lb
    answer:
      formula: bem + pilot + pax
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: ptom - tof + unusable
      - id: d2
        formula: bem + pilot + pax - unusable
      - id: d3
        formula: ptom - tof
      - id: d4
        formula: bem + pilot + pax + unusable
    presets:
      - id: p1
        values:
          ptom: 1860
          bem: 1130
          tof: 312
          unusable: 4
          pilot: 180
          pax: 205
      - id: p2
        values:
          ptom: 1900
          bem: 1150
          tof: 320
          unusable: 5
          pilot: 170
          pax: 190
      - id: p3
        values:
          ptom: 2050
          bem: 1240
          tof: 350
          unusable: 6
          pilot: 175
          pax: 240
    explanation: >-
      The actual Zero Fuel Mass is the Basic Empty Mass (which already includes
      the unusable fuel) plus the actual payload: pilot and passengers. The
      performance-limited take-off mass is a limit, not the actual mass, so it
      must not be used.


      **Solution**


      {{f: bem + pilot + pax}} = {{n: bem + pilot + pax}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: starts from the limiting take-off mass and subtracts only
      the usable part of the fuel; this gives the limit, not the actual ZFM.

      - **{{d2}} lb**: subtracts the unusable fuel again, although it is already
      in the Basic Empty Mass.

      - **{{d3}} lb**: starts from the limiting take-off mass minus the take-off
      fuel, which is the maximum ZFM allowed by the limit, not the actual one.

      - **{{d4}} lb**: adds the unusable fuel again, although it is already in
      the Basic Empty Mass.
