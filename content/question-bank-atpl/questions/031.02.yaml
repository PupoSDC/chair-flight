        unit: kg
      - id: mzfm
        label: MZFM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: block
        label: Fuel at brakes release
        unit: kg
    answer:
      formula: min(mzfm - dom, mtom - dom - block, mlm - dom - (block - trip))
      unit: kg
      decimals: 0
    distractors:
