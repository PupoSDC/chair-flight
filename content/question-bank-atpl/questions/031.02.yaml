  template:
    type: calculation
    question: "An aeroplane is performance limited to a landing mass of {{lm}} kg.
      The Dry Operating Mass is {{dom}} kg. The Zero Fuel Mass is {{zfm}} kg. If
      the take-off mass is {{tom}} kg, the Traffic Load is:"
    variables:
      - id: lm
        label: Performance-limited landing mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: zfm
        label: Zero fuel mass
        unit: kg
      - id: tom
        label: Take-off mass
        unit: kg
    answer:
      formula: zfm - dom
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - zfm
      - id: d2
        formula: tom - dom
      - id: d3
        formula: lm - dom
      - id: d4
        formula: lm - zfm
    presets:
      - id: p1
        values:
          lm: 54230
          dom: 35000
          zfm: 52080
          tom: 64280
      - id: p2
        values:
          lm: 50100
          dom: 33200
          zfm: 48500
          tom: 61000
      - id: p3
        values:
          lm: 62000
          dom: 41200
          zfm: 60500
          tom: 72000
    explanation: >-
      The zero fuel mass is the dry operating mass plus the traffic load
      (payload). The traffic load is therefore the difference between ZFM and
      DOM; take-off and landing masses are not needed.


      **Solution**


      {{f: zfm - dom}} = {{n: zfm - dom}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: take-off mass minus ZFM is the take-off fuel, not the
      traffic load.

      - **{{d2}} kg**: take-off mass minus DOM is traffic load plus fuel.

      - **{{d3}} kg**: the landing mass limit is not a loaded mass; using it in
      place of the ZFM gives a wrong value.

      - **{{d4}} kg**: the difference between the landing mass limit and the ZFM
      has no meaning for the traffic load.
