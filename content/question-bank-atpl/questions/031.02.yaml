  template:
    type: calculation
    question: >-
      You are conducting a flight with a light jet aircraft with a Maximum
      Structural Take-off Mass of {{mtom}} kg.


      On this exceptionally cold and dry winter day, your Performance-Limited
      Take-off Mass is equal to {{pltom}} kg and your taxi fuel is equal to
      {{taxi}} kg.


      The Regulated Take-off Mass is...
    variables:
      - id: mtom
        label: Maximum structural take-off mass
        unit: kg
      - id: pltom
        label: Performance-limited take-off mass
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: min(mtom, pltom)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: max(mtom, pltom)
      - id: d2
        formula: pltom + taxi
      - id: d3
        formula: min(mtom, pltom) - taxi
      - id: d4
        formula: (mtom + pltom) / 2
    presets:
      - id: p1
        values:
          mtom: 8450
          pltom: 8200
          taxi: 80
      - id: p2
        values:
          mtom: 9200
          pltom: 9500
          taxi: 90
      - id: p3
        values:
          mtom: 7500
          pltom: 7100
          taxi: 60
    explanation: >-
      The Regulated Take-off Mass is the lower of the structural limit and the
      performance-limited take-off mass. Taxi fuel is burned before the start of
      the take-off roll, so it is not added or subtracted here.


      **Solution**


      {{f: min(mtom, pltom)}} = {{n: min(mtom, pltom)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the higher limit is taken instead of the lower.

      - **{{d2}} kg**: taxi fuel is added to the performance limit.

      - **{{d3}} kg**: taxi fuel is subtracted from the correct limit.

      - **{{d4}} kg**: the two limits are averaged.
