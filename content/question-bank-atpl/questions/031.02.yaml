  template:
    type: calculation
    question: >-
      The flight manual states that the Maximum Structural Landing Mass of your
      aircraft is {{struct}} kg.


      For a flight terminating in a hot desert area, the density altitude for
      the day concerned restricts the landing mass to {{perf}} kg.


      If the contingency fuel of {{cont}} kg has NOT been used, what is the
      regulated landing mass?
    variables:
      - id: struct
        label: Maximum structural landing mass
        unit: kg
      - id: perf
        label: Performance limited landing mass
        unit: kg
      - id: cont
        label: Unused contingency fuel
        unit: kg
    answer:
      formula: min(struct, perf)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: struct - cont
      - id: d2
        formula: struct
      - id: d3
        formula: perf + cont
      - id: d4
        formula: struct + cont
    presets:
      - id: p1
        values:
          struct: 4700
          perf: 4300
          cont: 30
      - id: p2
        values:
          struct: 5300
          perf: 4900
          cont: 30
      - id: p3
        values:
          struct: 6400
          perf: 5900
          cont: 40
    explanation: >-
      The regulated landing mass is the lowest of the structural landing limit
      and the performance landing limit. Whether the contingency fuel was burned
      only changes the actual landing mass; it does not change the limits.


      **Solution**


      {{f: min(struct, perf)}} = min({{struct}}, {{perf}}) = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the contingency fuel from the structural limit.

      - **{{d2}} kg**: uses the structural limit only and ignores the lower
      performance limit.

      - **{{d3}} kg**: adds the contingency fuel to the performance limit.

      - **{{d4}} kg**: adds the contingency fuel to the structural limit.
