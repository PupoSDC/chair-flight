          dom: 36200
          ptom: 70500
          plm: 58000
          mzfm: 55000
          taxi: 350
          trip: 9200
          cont: 460
          alt: 1000
          res: 950
          traffic: 17100
      - id: p3
        values:
          dom: 33500
          ptom: 62000
          plm: 52500
          mzfm: 50000
          taxi: 300
          trip: 7800
          cont: 400
          alt: 900
          res: 850
          traffic: 15200
    explanation: >-
      The ramp fuel is limited by both the take-off mass and the landing mass.
      The take-off limit allows (limiting TOM - DOM - traffic load) of fuel
      after taxi, and the landing limit allows (limiting LM - DOM - traffic
      load) of fuel at landing, to which the trip fuel and taxi fuel burned
      before landing must be added. The lower of the two values is the maximum
      ramp fuel. The zero fuel mass limit is not limiting here, since the actual
      zero fuel mass is below it.


      **Solution**


      Zero fuel mass = {{dom}} + {{traffic}} = {{= dom + traffic}} kg


      Take-off limit: {{ptom}} - {{= dom + traffic}} + {{taxi}} = {{= ptom - dom
      - traffic + taxi}} kg

      Landing limit: {{plm}} - {{= dom + traffic}} + {{trip}} + {{taxi}} = {{=
      plm - dom - traffic + trip + taxi}} kg


      Ramp fuel = min of both = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: respects only the take-off mass limit and ignores the
      landing mass limit.

      - **{{d2}} kg**: take-off limit reduced by the margin to the maximum zero
      fuel mass, which is not a restriction here, and without taxi fuel.

      - **{{d3}} kg**: correct limit but reduced again by the zero fuel mass
      margin and by the taxi fuel.
