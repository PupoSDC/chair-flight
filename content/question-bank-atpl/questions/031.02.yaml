  annexes: []
  learningObjectives:
    - 031.02.01.02.04
  template:
    type: calculation
    question: You have just finished planning a flight and you require {{mass}} lb
      of fuel. The fuel tanker supplies fuel in US gallon with the specific
      gravity of {{sg}}. How many US gallons do you require?
    variables:
      - id: mass
        label: Required fuel mass
        unit: lb
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: mass / 2.20462 / sg / 3.78541
      unit: US gal
      decimals: 0
    distractors:
      - id: d1
        formula: mass / 2.20462 / 3.78541
      - id: d2
        formula: mass / (sg * 3.78541)
      - id: d3
        formula: mass * sg / (3.78541 * 2.20462)
    presets:
      - id: p1
        values:
          mass: 3643
          sg: 0.84
      - id: p2
        values:
          mass: 2800
          sg: 0.8
      - id: p3
        values:
          mass: 5200
          sg: 0.79
    explanation: >-
      Convert the required mass to kg (divide by 2.20462), divide by the fuel
      density to get litres, then divide by 3.78541 l per US gallon.


      **Solution**


      {{f: mass / 2.20462 / sg / 3.78541}} = {{n: mass / 2.20462 / sg /
      3.78541}} = **{{answer}} US gal**


      **Why the other answers are wrong**


      - **{{d1}} US gal**: the specific gravity was not applied.

      - **{{d2}} US gal**: the mass was not converted from lb to kg.

      - **{{d3}} US gal**: the mass was multiplied by the specific gravity
      instead of divided.
