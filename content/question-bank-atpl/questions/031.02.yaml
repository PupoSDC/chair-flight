    - ATPLGS-106958
    - ATPLGS-106907
  annexes: []
  learningObjectives:
    - 031.02.03.02.01
  template:
    type: calculation
    question: >-
      The crew of a transport jet aeroplane prepares a flight using the
      following data:


      - Dry Operating Mass: {{dom}} kg

      - Maximum Zero Fuel Mass: {{mzfm}} kg

      - Performance limited Take-off Mass: {{ptom}} kg

      - Performance limited Landing Mass: {{plm}} kg

      - Take-off fuel: {{tofuel}} kg

      - Trip fuel: {{trip}} kg


      What is the Traffic Load (TL) available for this flight?
    variables:
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: mzfm
        label: Maximum zero fuel mass
        unit: kg
      - id: ptom
        label: Performance limited take-off mass
        unit: kg
      - id: plm
        label: Performance limited landing mass
        unit: kg
      - id: tofuel
        label: Take-off fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
    answer:
      formula: min(mzfm - dom, ptom - dom - tofuel, plm + trip - dom - tofuel)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mzfm - dom
      - id: d2
        formula: plm + trip - dom - tofuel
      - id: d3
        formula: ptom - dom
      - id: d4
        formula: ptom - dom - trip
    presets:
      - id: p1
        values:
          dom: 35058
          mzfm: 52790
          ptom: 61875
          plm: 53871
          tofuel: 13358
          trip: 8900
      - id: p2
        values:
          dom: 34000
          mzfm: 51000
          ptom: 60000
          plm: 52500
          tofuel: 12000
          trip: 8000
      - id: p3
        values:
          dom: 33000
          mzfm: 48000
          ptom: 57000
          plm: 51000
          tofuel: 11000
          trip: 7000
    explanation: >-
      The available traffic load is limited by three masses: maximum zero fuel
      mass, take-off mass and landing mass. For each limit, subtract the dry
      operating mass (and the fuel on board for the take-off and landing
      limits); the smallest result is the available traffic load. The landing
      limit translates to a take-off limit of landing mass plus trip fuel.


      **Solution**


      ZFM limit: {{= mzfm - dom}} kg


      Take-off limit: {{= ptom - dom - tofuel}} kg


      Landing limit: {{= plm + trip - dom - tofuel}} kg


      {{f: min(mzfm - dom, ptom - dom - tofuel, plm + trip - dom - tofuel)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the zero fuel mass limit is considered.

      - **{{d2}} kg**: only the landing limit is considered.

      - **{{d3}} kg**: the take-off fuel is not subtracted.

      - **{{d4}} kg**: trip fuel is subtracted instead of take-off fuel.
- id: QOK6RN40C
  docId: "031.02"
  relatedQuestions: []
