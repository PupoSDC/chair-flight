          vol: 40
          dens: 6
      - id: p3
        values:
          vol: 75
          dens: 6.5
    explanation: >-
      The fuel mass in lb is the volume times the density in lb per US gallon.
      To express it in kg, divide by 2.20462 lb/kg.


      **Solution**


      {{f: vol * dens / 2.20462}} = {{n: vol * dens / 2.20462}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is the mass in lb; no conversion to kg was made.

      - **{{d2}} kg**: the density was ignored and the volume simply converted
      lb to kg.

      - **{{d3}} kg**: lb converted to kg in the wrong direction (multiplied by
      2.20462).
