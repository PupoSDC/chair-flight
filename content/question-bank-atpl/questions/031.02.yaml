  template:
    type: calculation
    question: >-
      A turbojet aeroplane flight is operated as planned. Determine the Landing
      Mass (LM) in kg, given:


      - Maximum Certificated Landing Mass: {{mlm}} kg

      - Performance Limited Landing Mass: {{plm}} kg

      - Dry Operating Mass: {{dom}} kg

      - Block Fuel: {{block}} kg

      - Taxi Fuel: {{taxi}} kg

      - Trip Fuel: {{trip}} kg

      - Estimated Traffic Load: {{load}} kg


      Changes in trip fuel due to mass changes may be ignored.
    variables:
      - id: mlm
        label: Max certificated landing mass
        unit: kg
      - id: plm
        label: Performance limited landing mass
        unit: kg
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: block
        label: Block fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: load
        label: Traffic load
        unit: kg
    answer:
      formula: dom + load + block - taxi - trip
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dom + load
      - id: d2
        formula: dom + load + trip
      - id: d3
        formula: dom + load + block - trip
      - id: d4
        formula: plm
    presets:
      - id: p1
        values:
          mlm: 53900
          plm: 51950
          dom: 35500
          block: 9720
          taxi: 120
          trip: 5080
          load: 11800
      - id: p2
        values:
          mlm: 54000
          plm: 52500
          dom: 36000
          block: 9000
          taxi: 150
          trip: 4800
          load: 12000
      - id: p3
        values:
          mlm: 55000
          plm: 53500
          dom: 34800
          block: 10200
          taxi: 130
          trip: 5300
          load: 12500
    explanation: >-
      Landing mass is the zero-fuel mass (DOM + traffic load) plus the fuel
      remaining at landing, i.e. block fuel minus taxi fuel minus trip fuel.


      **Solution**


      Zero-fuel mass = {{= dom + load}} kg

      {{f: dom + load + block - taxi - trip}} = {{n: dom + load + block - taxi -
      trip}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Zero-fuel mass only; no remaining fuel is added.

      - **{{d2}} kg**: Adds the trip fuel instead of the remaining fuel.

      - **{{d3}} kg**: Forgets to subtract the taxi fuel.

      - **{{d4}} kg**: Is the performance-limited landing mass, not the actual
      landing mass.
