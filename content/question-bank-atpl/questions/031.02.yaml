  template:
    type: calculation
    question: The maximum quantity of fuel that can be loaded into an aircraft's
      tanks is {{vol}} l. If the fuel density (specific gravity) is {{sg}}, what
      is the mass of fuel (in kg) which may be loaded?
    variables:
      - id: vol
        label: Fuel volume
        unit: l
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * sg
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: vol / sg
      - id: d2
        formula: vol * (1 - sg)
      - id: d3
        formula: vol * sg * 1.1
      - id: d4
        formula: vol * 0.8
    presets:
      - id: p1
        values:
          vol: 2200
          sg: 0.79
      - id: p2
        values:
          vol: 1800
          sg: 0.81
      - id: p3
        values:
          vol: 2500
          sg: 0.78
    explanation: >-
      Fuel mass is the volume multiplied by the density. With a specific gravity
      (relative to water at 1 kg/l) the density in kg/l is numerically equal to
      the SG.


      **Solution**


      {{f: vol * sg}} = {{n: vol * sg}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Dividing the volume by the SG instead of multiplying.

      - **{{d2}} kg**: Using (1 - SG) as the density.

      - **{{d3}} kg**: Adding a spurious 10 % to the correct mass.

      - **{{d4}} kg**: Using a hard-coded density of 0.8 instead of the given
      SG.
- id: QMCUGCQG
