      for a fuel load of {{vol}} litres, given a fuel density of {{dens}} kg/l.
    variables:
      - id: vol
        label: Fuel volume
        unit: l
      - id: dens
        label: Fuel density
        unit: kg/l
    answer:
      formula: vol * dens
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: vol
      - id: d2
        formula: vol / dens
      - id: d3
        formula: vol * (1 - dens)
      - id: d4
        formula: vol * dens * 10
