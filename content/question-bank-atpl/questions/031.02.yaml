- id: QZKMZNFD
  docId: "031.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318597
    - BGS-310540
    - AVEXAM-72044
  annexes:
    - 031-fuel-requirements-athens-to-paris-and-dispatch-load
  learningObjectives:
    - 031.02.01.02.03
  template:
    type: chart-calculation
    question: >-
      You are about to depart on a commercial flight from Athens to Paris and
      then back to Athens.


      For tankering purposes you do not want to refuel in Paris, so you will
      land there with {{ret_fuel}} kg, which is the block fuel for the return
      sector.


      The sum of taxi fuel and trip fuel for the first flight, read from the
      figure, is {{fig_fuel}} kg.


      What is the minimum block fuel for the first flight from Athens?
    variables:
      - id: ret_fuel
        label: Fuel on landing in Paris (return block fuel)
        unit: kg
      - id: fig_fuel
        label: Taxi plus trip fuel (read from figure)
        unit: kg
    chartInputs:
      - fig_fuel
    answer:
      formula: ret_fuel + fig_fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ret_fuel - fig_fuel
      - id: d2
        formula: fig_fuel
      - id: d3
        formula: 2 * ret_fuel
      - id: d4
        formula: ret_fuel + 1.2 * fig_fuel
    presets:
      - id: p1
        values:
          ret_fuel: 8300
          fig_fuel: 7234
    explanation: >-
      The block fuel for a sector is the fuel needed to taxi and fly the trip
      plus the fuel that must remain on landing. Here the fuel remaining in
      Paris is the return block fuel.


      **Solution**


      {{f: ret_fuel + fig_fuel}} = {{n: ret_fuel + fig_fuel}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the fuel burnt is subtracted instead of added.

      - **{{d2}} kg**: the fuel required on landing is forgotten.

      - **{{d3}} kg**: the return fuel is counted twice and the trip fuel
      ignored.

      - **{{d4}} kg**: an unjustified extra margin is added to the fuel burnt.
- id: QZSNVNCNL
  docId: "031.02"
  relatedQuestions: []
  externalIds:
