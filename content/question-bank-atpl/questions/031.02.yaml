  template:
    type: calculation
    question: |-
      Given:

      - Zero Fuel Mass: {{zfm}} kg
      - Trip Fuel: {{trip}} kg
      - Block Fuel: {{block}} kg
      - Taxi Fuel: {{taxi}} kg

      The actual Take-Off Mass is equal to:
    variables:
      - id: zfm
        label: Zero fuel mass
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: block
        label: Block fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
    answer:
      formula: zfm + block - taxi
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: zfm + block
      - id: d2
        formula: zfm + block + taxi
      - id: d3
        formula: zfm + trip
      - id: d4
        formula: zfm + block - trip
    presets:
