- id: Q3PSXJ3FZ
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-506199
    - AVEXAM-76056
    - ATPLGS-108871
  annexes: []
  learningObjectives:
    - 050.01.02.04.01
  template:
    type: calculation
    question: The 0°C isotherm is forecast to be at FL{{fl0}}. At what flight level
      would you expect a temperature of {{t}}°C?
    variables:
      - id: fl0
        label: Isotherm level
        unit: FL
      - id: t
        label: Temperature
        unit: °C
    answer:
      formula: fl0 - t * 5
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: fl0 + t * 5
      - id: d2
        formula: fl0 - t * 10
      - id: d3
        formula: fl0 - t * 3
      - id: d4
        formula: fl0 - t * 2
    presets:
      - id: p1
        values:
          fl0: 50
          t: -6
      - id: p2
        values:
          fl0: 80
          t: -10
      - id: p3
        values:
          fl0: 60
          t: -8
    explanation: >-
      In the ISA troposphere the temperature falls by about 2°C per 1000 ft,
      i.e. 1°C per 500 ft, which is 5 flight levels. Colder temperatures are
      found higher up, warmer ones lower down.


      **Solution**


      {{f: fl0 - t * 5}} = {{n: fl0 - t * 5}} = **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: the sign is wrong; the colder air was placed below the
      isotherm.

      - **FL{{d2}}**: a lapse rate of 1°C per 1000 ft was used.

      - **FL{{d3}}**: a lapse rate of about 3.3°C per 1000 ft was used.

      - **FL{{d4}}**: a lapse rate of 5°C per 1000 ft was used.
- id: Q4PY4T9QF
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501837
    - ATPLQ-508554
    - BGS-500162
    - AVEXAM-53755
    - ATPLGS-108927
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: |-
      The pilot changes the altimeter subscale setting.

      - Indicated altitude before the change: {{ind}} ft
      - Subscale setting before the change: {{set_old}} hPa
      - Subscale setting after the change: {{set_new}} hPa

      What will the altimeter now indicate? (Assume {{k}} ft per hPa.)
    variables:
      - id: ind
        label: Indicated altitude before the change
        unit: ft
      - id: set_old
        label: Subscale setting before the change
        unit: hPa
      - id: set_new
        label: Subscale setting after the change
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ind + k * (set_new - set_old)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ind
      - id: d2
        formula: ind - k * (set_new - set_old)
      - id: d3
        formula: ind + (set_new - set_old)
      - id: d4
        formula: ind + 27 * (set_new - set_old)
    presets:
      - id: p1
        values:
          ind: 1500
          set_old: 1010
          set_new: 992
          k: 30
      - id: p2
        values:
          ind: 3600
          set_old: 1013
          set_new: 991
          k: 30
      - id: p3
        values:
          ind: 2000
          set_old: 1020
          set_new: 1005
          k: 30
    explanation: >-
      A change of the subscale setting moves the altimeter reading by about 30
      ft for every hPa of change. A lower setting gives a lower reading, and a
      higher setting gives a higher reading.


      **Solution**


      Change of setting: {{= set_new - set_old}} hPa


      {{f: ind + k * (set_new - set_old)}} = {{n: ind + k * (set_new -
      set_old)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the change of setting is ignored.

      - **{{d2}} ft**: the correction has the wrong sign, so the reading moves
      the wrong way.

      - **{{d3}} ft**: the rate of 30 ft per hPa is forgotten.

      - **{{d4}} ft**: a rate of 27 ft per hPa is used instead of 30.
