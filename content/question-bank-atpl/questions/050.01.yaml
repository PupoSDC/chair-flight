- id: QWMCWJMM
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501310
    - AVEXAM-15718
    - BGS-502065
    - AVEXAM-88602
    - ATPLGS-627914
  annexes: []
  learningObjectives:
    - 050.01.03.02.03
  template:
    type: calculation
    question: >-
      In the ISA, at what altitude is the pressure {{ratio}}% of the sea-level
      pressure?


      Give the altitude in feet, rounded to the nearest 1000 ft.
    variables:
      - id: ratio
        label: Pressure as a percentage of sea-level pressure
        unit: "%"
    answer:
      formula: round(44330 * (1 - (ratio / 100) ^ 0.1903) * 3.28084 / 1000) * 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round(44330 * (1 - (ratio / 100) ^ 0.1903) / 1000) * 1000
      - id: d2
        formula: round(44330 * (1 - ratio / 100) ^ 0.1903 * 3.28084 / 1000) * 1000
      - id: d3
        formula: 44330 * (1 - (ratio / 100) ^ 0.1903) * 3.28084
      - id: d4
        formula: round(44330 * (1 - (ratio / 100) ^ 0.1903) / 3.28084 / 1000) * 1000
    presets:
      - id: p1
        values:
          ratio: 50
      - id: p2
        values:
          ratio: 70
      - id: p3
        values:
          ratio: 30
    explanation: >-
      The standard atmosphere links pressure and altitude through a fixed
      formula. The height in metres is 44330 × (1 − (p / p0)^0.1903), where p0
      is the sea-level pressure. Multiplying by 3.28084 gives feet.


      **Solution**


      {{f: 44330 * (1 - (ratio / 100) ^ 0.1903) * 3.28084}} = {{n: 44330 * (1 -
      (ratio / 100) ^ 0.1903) * 3.28084}} ft


      Rounded to the nearest 1000 ft: **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the result is in metres, not feet.

      - **{{d2}} ft**: the bracket is placed wrongly, so (1 - ratio) is raised
      to the power.

      - **{{d3}} ft**: the result is not rounded to the nearest 1000 ft.

      - **{{d4}} ft**: the metres-to-feet conversion is inverted (divided
      instead of multiplied).
