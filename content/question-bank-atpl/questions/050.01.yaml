- id: QMPBUUAY
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-506708
    - BGS-502153
    - AVEXAM-23566
    - AVEXAM-42343
    - BGS-502449
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      The altimeter is set to the QFE of the airport, so it shows the height
      above the airport. The altimeter has no instrument errors.


      - Outside air temperature: ISA {{dev}} °C

      - Pressure altitude: {{pa}} ft

      - Indicated height above the airport: {{h}} ft


      What is the approximate true height of the aircraft above the airport?
    variables:
      - id: dev
        label: ISA deviation
        unit: °C
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: h
        label: Indicated height above the airport
        unit: ft
    answer:
      formula: h + dev * 4 * h / 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: h - dev * 4 * h / 1000
      - id: d2
        formula: h
      - id: d3
        formula: pa
      - id: d4
        formula: h * (1 + dev / 100)
    presets:
      - id: p1
        values:
          dev: 12
          pa: 2300
          h: 2000
      - id: p2
        values:
          dev: -5
          pa: 3200
          h: 3000
      - id: p3
        values:
          dev: 15
          pa: 1800
          h: 1500
    explanation: >-
      Air warmer than ISA expands, so the true height above the airport is
      greater than the indicated height. The correction is 4 ft per 1 000 ft for
      each °C of ISA deviation, applied to the indicated height above the
      airport. The pressure altitude is not needed when the altimeter is set to
      QFE.


      **Solution**


      - Temperature correction: {{f: dev * 4 * h / 1000}} = {{= dev * 4 * h /
      1000}} ft

      - True height: {{f: h + dev * 4 * h / 1000}} = {{n: h + dev * 4 * h /
      1000}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: applies the correction with the wrong sign

      - **{{d2}} ft**: forgets the temperature correction

      - **{{d3}} ft**: uses the pressure altitude instead of the height above
      the airport

      - **{{d4}} ft**: uses 1 % per °C instead of 0.4 % per °C
- id: QMV36VOU1
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-505578
    - ATPLQ-507017
  annexes:
    - 050-met-wind-temp-fl050-2017-03-17-0600z-03
    - 050-wafc-london-wind-temp-eur-fl110-2023-07-16-1200z
    - 050-wafc-london-wind-temp-eur-fl180-2023-07-16-1200z
  learningObjectives:
    - 050.01.02.02.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. The temperature read from the figure at FL{{fl}} is
      {{temp}} °C.


      Determine the ISA deviation at FL{{fl}}.
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: temp
        label: Temperature read from figure
        unit: °C
    chartInputs:
      - temp
    answer:
      formula: temp - (15 - 0.2 * fl)
      unit: °C
      decimals: 0
    distractors:
      - id: d1
        formula: -(temp - (15 - 0.2 * fl))
      - id: d2
        formula: temp - 15
      - id: d3
        formula: temp - (15 - 0.1 * fl)
      - id: d4
        formula: temp - (15 - 0.3 * fl)
    presets:
      - id: p1
        values:
          fl: 150
          temp: -1
      - id: p2
        values:
          fl: 50
          temp: 7
    explanation: >-
      The ISA deviation is the difference between the actual temperature and the
      ISA temperature at the same level. Below the tropopause the ISA
      temperature is 15 °C at sea level minus 2 °C per 1 000 ft, so at FL{{fl}}
      it is {{= 15 - 0.2 * fl}} °C. The actual temperature is the value read
      from the figure.


      **Solution**


      ISA temperature at FL{{fl}}: 15 - 2 × {{= fl / 10}} = {{= 15 - 0.2 * fl}}
      °C


      {{f: temp - (15 - 0.2 * fl)}} = {{n: temp - (15 - 0.2 * fl)}} =
      **{{answer}} °C**


      **Why the other answers are wrong**


      - **{{d1}} °C**: sign reversed (ISA temperature minus actual temperature).

      - **{{d2}} °C**: compared with the sea-level ISA temperature of 15 °C
