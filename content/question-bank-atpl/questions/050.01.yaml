    - ATPLQ-501082
    - ATPLQ-508078
  annexes: []
  learningObjectives:
    - 050.01.06.03.02
  template:
    type: calculation
    question: >-
      During a climb the pilot changes the altimeter subscale from QNH to
      standard (1013 hPa) at the transition altitude. Given:


      - Transition altitude: {{ta}} ft

      - QNH: {{qnh}} hPa


      (Assume {{k}} ft per hPa.)


      What is the approximate altimeter reading immediately after the subscale
      is changed?
    variables:
      - id: ta
        label: Transition altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ta + (1013 - qnh) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ta + (qnh - 1013) * k
      - id: d2
        formula: ta
      - id: d3
        formula: ta + (1013 - qnh)
      - id: d4
        formula: (1013 - qnh) * k
    presets:
      - id: p1
        values:
          ta: 3000
          qnh: 980
          k: 30
      - id: p2
        values:
          ta: 11000
          qnh: 1041
          k: 30
      - id: p3
        values:
          ta: 18000
          qnh: 1035
          k: 30
    explanation: >-
      At the transition altitude the altimeter shows the transition altitude on
      the local QNH. Changing to standard pressure moves the reading by the
      gradient for every hPa of difference. A QNH below 1013 hPa makes the
      reading go up, and a QNH above 1013 hPa makes it go down.


      **Solution**


      Difference from standard: {{= 1013 - qnh}} hPa


      {{f: ta + (1013 - qnh) * k}} = {{n: ta + (1013 - qnh) * k}} = **{{answer}}
      ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the correction has the wrong sign.

      - **{{d2}} ft**: the pressure change is ignored.

      - **{{d3}} ft**: the difference in hPa is not converted to feet.

      - **{{d4}} ft**: the transition altitude is left out.
