- id: QHRGLURD
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-506311
    - ATPLGS-628025
    - AVEXAM-84881
    - AVEXAM-66343
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      An aircraft is flying at {{ind}} ft indicated altitude with the altimeter
      set to {{qnh}} hPa. This QNH is given by an airfield at {{elev}} ft
      elevation, and the air mass over that airfield is on average ISA
      {{isa_dev}} °C (negative = colder than ISA).


      Calculate the true altitude of the aircraft over the field, rounded to the
      nearest 10 ft.
    variables:
      - id: ind
        label: Indicated altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: elev
        label: Field elevation
        unit: ft
      - id: isa_dev
        label: ISA deviation
        unit: °C
    answer:
      formula: round((elev + (ind - elev) * (1 + 0.004 * isa_dev)) / 10) * 10
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ind
      - id: d2
        formula: elev + (ind - elev) * (1 - 0.004 * isa_dev)
      - id: d3
        formula: ind * (1 + 0.004 * isa_dev)
      - id: d4
        formula: elev + (ind - elev) * (1 + 0.04 * isa_dev)
    presets:
      - id: p1
        values:
          ind: 2600
          qnh: 1000
          elev: 600
          isa_dev: -8
      - id: p2
        values:
          ind: 3000
          qnh: 1015
          elev: 500
          isa_dev: 10
      - id: p3
        values:
          ind: 1800
          qnh: 1012
          elev: 300
          isa_dev: -15
    explanation: >-
      The indicated altitude is measured from mean sea level. Only the height
      above the field is corrected for temperature, by about 0.4 % of that
      height per degree of ISA deviation. The field elevation is then added
      back, and the result is rounded to the nearest 10 ft as the question asks.


      **Solution**


      Height above the field: {{ind}} - {{elev}} = {{= ind - elev}} ft


      Corrected height: {{= (ind - elev) * (1 + 0.004 * isa_dev)}} ft


      True altitude: {{f: round((elev + (ind - elev) * (1 + 0.004 * isa_dev)) /
      10) * 10}} = {{n: round((elev + (ind - elev) * (1 + 0.004 * isa_dev)) /
      10) * 10}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the indicated altitude is taken as the true altitude,
      with no correction.

      - **{{d2}} ft**: the temperature correction has the wrong sign.

      - **{{d3}} ft**: the correction is applied to the whole indicated
      altitude, without taking the field elevation into account.

      - **{{d4}} ft**: 0.04 % per degree is used instead of 0.4 %, a decimal
      point slip.
