  template:
    type: calculation
    question: >-
      An aircraft lands on an airfield with an elevation of {{elev}} ft.


      The correct QNH is {{qnh}} hPa, but the altimeter subscale is still set to
      {{setting}} hPa.


      Barometric lapse rate: {{lapse}} ft/hPa.


      What will the altimeter indicate on the ground after landing (ft)?
    variables:
      - id: elev
        label: Airfield elevation
        unit: ft
      - id: qnh
        label: Correct QNH
        unit: hPa
      - id: setting
        label: Altimeter subscale setting
        unit: hPa
      - id: lapse
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: elev + (setting - qnh) * lapse
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: elev + (qnh - setting) * lapse
      - id: d2
        formula: elev
      - id: d3
        formula: (setting - qnh) * lapse
      - id: d4
        formula: (elev + setting - qnh) * lapse
      - id: d5
        formula: elev + (setting - qnh)
    presets:
      - id: p1
        values:
          elev: 540
          qnh: 978
          setting: 1003
          lapse: 30
      - id: p2
        values:
          elev: 520
          qnh: 1003
          setting: 1013
          lapse: 30
      - id: p3
        values:
          elev: 270
          qnh: 988
          setting: 978
          lapse: 30
      - id: p4
        values:
          elev: 270
          qnh: 998
          setting: 978
          lapse: 30
      - id: p5
        values:
          elev: 318
          qnh: 1018
          setting: 1020
          lapse: 30
    explanation: >-
      When the altimeter subscale is set to a value other than the local QNH,
      the altimeter indicates a height that is off by the pressure difference
      multiplied by the lapse rate. A subscale setting above the QNH makes the
      altimeter read high, and a setting below the QNH makes it read low.


      **Solution**


      Subscale correction: ({{setting}} − {{qnh}}) hPa × {{lapse}} ft/hPa = {{=
      (setting - qnh) * lapse}} ft


      Indicated altitude on the ground: {{f: elev + (setting - qnh) * lapse}} =
      {{n: elev + (setting - qnh) * lapse}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: sign of the subscale correction reversed.

      - **{{d2}} ft**: subscale correction ignored; only the elevation is shown.

      - **{{d3}} ft**: airfield elevation forgotten; only the subscale
      correction is shown.

      - **{{d4}} ft**: bracket error; the elevation is added before the
      subtraction and the sum is multiplied by the lapse rate.

      - **{{d5}} ft**: lapse rate forgotten; the pressure difference in hPa is
      added directly.
