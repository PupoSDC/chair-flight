- id: Q5DGKIAA0
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-506327
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: Whilst flying at an altitude of {{alt}} ft, the temperature gradually
      decreases by {{drop}}°C. What is the expected change to the aircraft's
      true altitude?
    variables:
      - id: alt
        label: Altitude
        unit: ft
      - id: drop
        label: Temperature decrease
        unit: °C
    answer:
      formula: -4 * alt / 1000 * drop
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: 4 * alt / 1000 * drop
      - id: d2
        formula: -4 * alt / 100 * drop
      - id: d3
        formula: -3 * alt / 1000 * drop
      - id: d4
        formula: -2 * alt / 1000 * drop
    presets:
      - id: p1
        values:
          alt: 2000
          drop: 10
      - id: p2
        values:
          alt: 5000
          drop: 15
      - id: p3
        values:
          alt: 3000
          drop: 5
    explanation: >-
      An altimeter assumes ISA temperatures. When the air is colder than
      assumed, the pressure levels are compressed and the true altitude is lower
      than indicated, by about 4 ft per 1000 ft per °C. A temperature decrease
      therefore reduces the true altitude.


      **Solution**


      {{f: -4 * alt / 1000 * drop}} = {{n: -4 * alt / 1000 * drop}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the sign is wrong; colder air lowers the true altitude.

      - **{{d2}} ft**: the correction was scaled per 100 ft instead of per 1000
      ft.

      - **{{d3}} ft**: a correction of 3 ft per 1000 ft per °C was used instead
      of 4.

      - **{{d4}} ft**: a correction of 2 ft per 1000 ft per °C was used instead
      of 4.
