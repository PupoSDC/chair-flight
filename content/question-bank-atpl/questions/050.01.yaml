    - ATPLQ-509755
  annexes: []
  learningObjectives:
    - 050.01.06.03.02
  template:
    type: calculation
    question: >-
      During a climb the pilot changes the altimeter subscale from QNH to
      standard (1013 hPa) at the transition altitude. Given:


      - Transition altitude: {{ta}} ft

      - QNH: {{qnh}} hPa

      - (Assume {{k}} ft per hPa.)


      What is the approximate altimeter reading immediately after the subscale
      is changed?
    variables:
      - id: ta
        label: Transition altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ta + (1013 - qnh) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ta + (qnh - 1013) * k
      - id: d2
        formula: ta
      - id: d3
        formula: ta + (1013 - qnh)
      - id: d4
        formula: (1013 - qnh) * k
    presets:
      - id: p1
        values:
          ta: 18000
          qnh: 1035
          k: 30
      - id: p2
        values:
          ta: 11000
          qnh: 1041
          k: 30
      - id: p3
        values:
          ta: 6000
          qnh: 1028
          k: 30
      - id: p4
        values:
          ta: 3000
          qnh: 980
          k: 30
      - id: p5
        values:
          ta: 11000
          qnh: 1024
          k: 30
    explanation: >-
      At the transition altitude the aircraft is at an altitude based on QNH.
      Switching to 1013 hPa changes the reading by the pressure difference times
      the gradient. If QNH is above 1013, the 1013 hPa surface lies below the
      QNH surface, so the reading decreases; if QNH is below 1013, it increases.


      **Solution**


      Change = (1013 - {{qnh}}) hPa x {{k}} ft/hPa = {{= (1013 - qnh) * k}} ft


      {{f: ta + (1013 - qnh) * k}} = {{n: ta + (1013 - qnh) * k}} = **{{answer}}
      ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the correction has the wrong sign.

      - **{{d2}} ft**: no correction was applied; the reading would be
      unchanged.

      - **{{d3}} ft**: the pressure difference in hPa was added without
      converting it to feet.

      - **{{d4}} ft**: only the correction was used, the transition altitude was
      left out.
