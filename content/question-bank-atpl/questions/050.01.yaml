- id: QWALZCWB
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501963
  annexes: []
  learningObjectives:
    - 050.01.06.03.04
  template:
    type: calculation
    question: >-
      The average temperature of the air mass between FL{{fl_low}} and
      FL{{fl_high}} is ISA {{dev}} °C (negative = colder than ISA).


      What is the vertical distance between FL{{fl_low}} and FL{{fl_high}}? Give
      the answer in feet.
    variables:
      - id: fl_low
        label: Lower flight level
        unit: FL
      - id: fl_high
        label: Upper flight level
        unit: FL
      - id: dev
        label: Mean ISA deviation
        unit: °C
    answer:
      formula: (fl_high - fl_low) * 100 * (1 + dev / 250)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (fl_high - fl_low) * 100 * (1 - dev / 250)
      - id: d2
        formula: (fl_high - fl_low) * 100
      - id: d3
        formula: (fl_high - fl_low) * 100 + 4 * dev
      - id: d4
        formula: (fl_high - fl_low) * 100 * (1 + dev / 100)
    presets:
      - id: p1
        values:
          fl_low: 120
          fl_high: 230
          dev: 15
      - id: p2
        values:
          fl_low: 90
          fl_high: 150
          dev: -10
      - id: p3
        values:
          fl_low: 50
          fl_high: 100
          dev: 20
    explanation: >-
      Flight levels are pressure altitudes, so the true distance between two of
      them depends on the mean air temperature. A layer warmer than ISA is
      thicker and a colder layer is thinner: the thickness changes by about 4 ft
      per 1 000 ft for every degree of deviation.


      **Solution**


      Pressure altitude difference: {{= (fl_high - fl_low) * 100}} ft


      Vertical distance: {{f: (fl_high - fl_low) * 100 * (1 + dev / 250)}} =
      {{n: (fl_high - fl_low) * 100 * (1 + dev / 250)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the sign of the temperature correction is reversed.

      - **{{d2}} ft**: the temperature correction is forgotten.

      - **{{d3}} ft**: 4 ft per degree is added as a flat amount instead of a
      percentage of the layer thickness.

      - **{{d4}} ft**: the correction uses 1 % per degree instead of 0.4 %.
