- id: QSFLIBZR
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-503924
    - AVEXAM-35795
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      An aircraft is flying at an altitude of {{alt}} ft when it enters an air
      mass which is {{cold}} °C colder than ISA.


      How will the true altitude change? Give the change in feet, negative for a
      decrease.
    variables:
      - id: alt
        label: Indicated altitude
        unit: ft
      - id: cold
        label: Colder than ISA
        unit: °C
    answer:
      formula: -cold * 4 * alt / 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: cold * 4 * alt / 1000
      - id: d2
        formula: -cold * alt / 100
      - id: d3
        formula: cold * alt / 100
      - id: d4
        formula: -cold * 4 * alt / 500
    presets:
      - id: p1
        values:
          alt: 2000
          cold: 10
      - id: p2
        values:
          alt: 5000
          cold: 5
      - id: p3
        values:
          alt: 3000
          cold: 15
    explanation: >-
      Cold air is denser, so at the same pressure the aircraft is lower than its
      indicated altitude. The rule of thumb is an error of 4 ft for every 1 000
      ft of altitude and every °C of ISA deviation.


      **Solution**


      - Change: {{f: -cold * 4 * alt / 1000}} = {{n: -cold * 4 * alt / 1000}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the right size, but the wrong direction, since colder air
      lowers the true altitude

      - **{{d2}} ft**: uses 1 ft per 100 ft instead of 4 ft per 1 000 ft, with
      the right direction

      - **{{d3}} ft**: uses 1 ft per 100 ft and the wrong direction

      - **{{d4}} ft**: uses 8 ft per 1 000 ft instead of 4 ft per 1 000 ft
