- id: QBSNQ0VA1
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-502343
    - BGS-502614
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      An aerodrome at sea level next to mountainous terrain has a minimum
      Decision Altitude of {{alt}} ft.


      The aerodrome OAT is {{oat}} °C.


      Below -5 °C the altitude must be temperature corrected.


      Using a correction of 0.4 % per degree Celsius of deviation from ISA (ISA
      sea-level temperature 15 °C), calculate the lowest altimeter indication at
      DA (ft).
    variables:
      - id: alt
        label: Decision altitude (minimum)
        unit: ft
      - id: oat
        label: Aerodrome OAT
        unit: °C
    answer:
      formula: alt * (1 + 0.004 * (15 - oat))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt * (1 + 0.004 * (oat - 15))
      - id: d2
        formula: alt
      - id: d3
        formula: alt / (1 + 0.004 * (15 - oat))
      - id: d4
        formula: alt * (1 + 0.004 * oat)
    presets:
      - id: p1
        values:
          alt: 3500
          oat: -10
      - id: p2
        values:
          alt: 4000
          oat: -20
      - id: p3
        values:
          alt: 3200
          oat: -15
    explanation: >-
      In cold air the true altitude is lower than the indicated altitude, so the
      indicated altitude at DA must be increased to make sure the minimum true
      altitude is respected. The correction is 0.4 % per degree of deviation
      from ISA.


      **Solution**


      Deviation from ISA (ISA sea level 15 °C): {{= 15 - oat}} °C


      Correction factor: 1 + 0.004 × {{= 15 - oat}} = {{= 1 + 0.004 * (15 -
      oat)}}


      {{f: alt * (1 + 0.004 * (15 - oat))}} = {{n: alt * (1 + 0.004 * (15 -
      oat))}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: sign of the deviation reversed, which reduces the
      altitude instead of increasing it.

      - **{{d2}} ft**: no temperature correction applied.

      - **{{d3}} ft**: correction factor inverted (divided instead of
      multiplied).

      - **{{d4}} ft**: OAT used directly instead of the deviation from ISA.
