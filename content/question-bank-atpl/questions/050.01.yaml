- id: QIOMLCNA
  docId: "050.01"
  relatedQuestions:
    - QJJFPAQL
  externalIds:
    - ATPLQ-509996
    - AVEXAM-63470
    - ATPLQ-504435
    - AVEXAM-96657
    - AVEXAM-15889
    - ATPLGS-627931
    - ATPLGS-627921
    - AVEXAM-15318
    - ATPLQ-502711
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      An aircraft has to fly over a mountainous area. The highest obstacle has
      an elevation of {{obs}} ft and a terrain clearance of at least {{clr}} ft
      is required. The average temperature deviation from ISA is {{dev}} °C
      (negative = colder than ISA). The QNH of {{qnh}} hPa is given by a station
      at an elevation of {{hs}} ft. Assume 1 hPa = {{k}} ft.


      What is the lowest usable flight level?
    variables:
      - id: obs
        label: Obstacle elevation
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: dev
        label: ISA deviation
        unit: °C
      - id: qnh
        label: QNH
        unit: hPa
      - id: hs
        label: QNH station elevation
        unit: ft
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ceil((hs + (obs + clr - hs) * (1 - dev / 250) + (1013 - qnh) * k) /
        500) * 5
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil((hs + (obs + clr - hs) * (1 + dev / 250) + (1013 - qnh) * k) /
          500) * 5
      - id: d2
        formula: ceil((obs + clr + (1013 - qnh) * k) / 500) * 5
      - id: d3
        formula: ceil((hs + (obs - hs) * (1 - dev / 250) + (1013 - qnh) * k) / 500) * 5
      - id: d4
        formula: ceil((hs + (obs + clr - hs) * (1 - dev / 250) + (1013 - qnh) * k + clr)
          / 500) * 5
    presets:
      - id: p1
        values:
          obs: 12500
          clr: 2000
          dev: -25
          qnh: 980
          hs: 0
          k: 30
      - id: p2
        values:
          obs: 10290
          clr: 2000
          dev: -20
          qnh: 1013
          hs: 5100
          k: 30
      - id: p3
        values:
          obs: 6254
          clr: 2000
          dev: 24
          qnh: 991
          hs: 3100
          k: 30
      - id: p4
        values:
          obs: 8000
          clr: 2000
          dev: -12
          qnh: 1003
          hs: 1500
          k: 30
    explanation: >-
      The lowest usable flight level is found by working backwards from the
      required true altitude (obstacle elevation plus clearance).


      1. Temperature: in air colder than ISA the altimeter over-reads, so the
      height above the QNH station is increased by about 1/250 per °C below ISA
      (decreased when warmer).

      2. Pressure: a QNH below 1013 hPa means the 1013 hPa level is higher, so
      (1013 - QNH) × ft per hPa is added to obtain the pressure altitude.

      3. The result is rounded up to the next flight level that is a multiple of
      5.


      **Solution**


      Required true altitude: {{= obs + clr}} ft


      Temperature-corrected altitude: {{= hs + (obs + clr - hs) * (1 - dev /
      250)}} ft


      Pressure altitude: {{= hs + (obs + clr - hs) * (1 - dev / 250)}} + {{=
      (1013 - qnh) * k}} = {{= hs + (obs + clr - hs) * (1 - dev / 250) + (1013 -
      qnh) * k}} ft


      Rounded up to the next multiple of 5: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: temperature correction applied with the wrong sign.

      - **FL{{d2}}**: no temperature correction.

      - **FL{{d3}}**: clearance forgotten, only the obstacle elevation was
      cleared.

      - **FL{{d4}}**: the clearance was counted twice.
