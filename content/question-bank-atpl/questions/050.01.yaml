    - BGS-502456
  annexes: []
  learningObjectives:
    - 050.01.06.03.03
  template:
    type: calculation
    question: >-
      During the pre-flight checks both altimeters are set to the local QNH. The
      standby altimeter has just been in maintenance for calibration.


      - Local QNH: {{qnh}} hPa

      - Airfield elevation: {{elev}} ft AMSL

      - Standby altimeter indication: {{ind}} ft

      - Barometric lapse rate: {{k}} ft per hPa


      What subscale setting (hPa) must be set on the standby altimeter so that
      it indicates the airfield elevation?
    variables:
      - id: qnh
        label: QNH
        unit: hPa
      - id: elev
        label: Airfield elevation
        unit: ft
      - id: ind
        label: Standby indication
        unit: ft
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: qnh + (elev - ind) / k
      unit: hPa
      decimals: 0
    distractors:
      - id: d1
        formula: qnh - (elev - ind) / k
      - id: d2
        formula: qnh + (elev - ind) * k
      - id: d3
        formula: qnh + elev - ind
      - id: d4
        formula: 1013 + (elev - ind) / k
    presets:
      - id: p1
        values:
          qnh: 1018
          elev: 252
          ind: 162
          k: 30
      - id: p2
        values:
          qnh: 1009
          elev: 800
          ind: 700
          k: 30
      - id: p3
        values:
          qnh: 1020
          elev: 400
          ind: 300
          k: 30
    explanation: >-
      Raising the subscale setting makes an altimeter indicate a higher
      altitude, with each hPa worth {{k}} ft. To make the standby altimeter read
      the airfield elevation, its setting must be raised by the missing altitude
      divided by the lapse rate.


      **Solution**


      Missing altitude: {{elev}} - {{ind}} = {{= elev - ind}} ft


      Setting: {{f: qnh + (elev - ind) / k}} = {{n: qnh + (elev - ind) / k}} =
      **{{answer}} hPa**


      **Why the other answers are wrong**


      - **{{d1}} hPa**: the correction has the wrong sign, so the setting is
      lowered instead of raised.

      - **{{d2}} hPa**: the missing altitude is multiplied by the lapse rate
      instead of divided by it.

      - **{{d3}} hPa**: the altitude difference in feet is added to the QNH
      without converting it to hPa.

      - **{{d4}} hPa**: the standard setting of 1013 hPa is used instead of the
      local QNH.
