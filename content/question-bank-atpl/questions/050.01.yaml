    - AVEXAM-60946
  annexes: []
  learningObjectives:
    - 050.01.06.03.03
  template:
    type: calculation
    question: >-
      An aircraft is on the ground at an aerodrome with an elevation of {{elev}}
      ft. The correct QNH is {{qnh}} hPa, but the altimeter subscale is set to
      {{set}} hPa. (Assume {{k}} ft per hPa.)


      What does the altimeter read?
    variables:
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: qnh
        label: Correct QNH
        unit: hPa
      - id: set
        label: Subscale setting
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: elev + (set - qnh) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: elev
      - id: d2
        formula: elev - (set - qnh) * k
      - id: d3
        formula: elev + (set - qnh)
      - id: d4
        formula: elev + (set - qnh) * 27
    presets:
      - id: p1
        values:
          elev: 1450
          qnh: 1035
          set: 1013
          k: 30
      - id: p2
        values:
          elev: 540
          qnh: 993
          set: 1013
          k: 30
      - id: p3
        values:
          elev: 323
          qnh: 1023
          set: 1013
          k: 30
    explanation: >-
      When the altimeter is still set to a pressure other than the QNH, it reads
      the aerodrome elevation plus or minus the pressure error multiplied by the
      pressure gradient. A setting above the QNH makes the altimeter read high,
      and a setting below the QNH makes it read low.


      **Solution**


      Setting error: {{= set - qnh}} hPa


      {{f: elev + (set - qnh) * k}} = {{n: elev + (set - qnh) * k}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the pressure error is ignored.

      - **{{d2}} ft**: the correction has the wrong sign.

      - **{{d3}} ft**: the gradient of ft per hPa is forgotten.

      - **{{d4}} ft**: a gradient of 27 ft per hPa is used instead of 30.
- id: QFMYZEWW
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-504593
    - AVEXAM-56536
