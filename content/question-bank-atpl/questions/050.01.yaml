- id: QRWKRMWE
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-505990
    - BGS-501917
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      The approach chart requires a temperature correction when the surface
      temperature is below 0 °C.


      - Required true altitude: {{true_alt}} ft above MSL

      - Surface temperature: {{temp}} °C


      Which indicated altitude should be read on the altimeter, with the QNH
      correctly set? Assume an ISA surface temperature of 15 °C.
    variables:
      - id: true_alt
        label: Required true altitude
        unit: ft
      - id: temp
        label: Surface temperature
        unit: °C
    answer:
      formula: true_alt * (1 - 0.004 * (temp - 15))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: true_alt
      - id: d2
        formula: true_alt * (1 + 0.004 * (temp - 15))
      - id: d3
        formula: true_alt * (1 - 0.004 * temp)
      - id: d4
        formula: true_alt * (1 - 0.04 * (temp - 15))
    presets:
      - id: p1
        values:
          true_alt: 6000
          temp: -5
      - id: p2
        values:
          true_alt: 4000
          temp: -15
      - id: p3
        values:
          true_alt: 8000
          temp: -30
    explanation: >-
      In cold air the pressure levels are closer to the ground than in the ISA,
      so an altimeter reads higher than the true altitude. The indication must
      therefore be increased by 0.4 % for every degree of ISA deviation. The ISA
      deviation is the surface temperature minus 15 °C.


      **Solution**


      ISA deviation: {{= temp - 15}} °C


      {{f: true_alt * (1 - 0.004 * (temp - 15))}} = {{n: true_alt * (1 - 0.004 *
      (temp - 15))}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the temperature correction is not applied.

      - **{{d2}} ft**: the correction has the wrong sign.

      - **{{d3}} ft**: the surface temperature is used instead of the ISA
      deviation.

      - **{{d4}} ft**: decimal error, 0.04 instead of 0.004.
