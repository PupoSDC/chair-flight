- id: QLEKFTPR
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-503063
    - AVEXAM-60419
    - ATPLGS-627917
  annexes: []
  learningObjectives:
    - 050.01.04.01.02
  template:
    type: calculation
    question: In the ISA atmosphere, the air density is {{ratio}} % of the density
      at mean sea level. At what altitude (ft) does this occur? Give the answer
      rounded to the nearest 1000 ft.
    variables:
      - id: ratio
        label: Density ratio
        unit: "%"
    answer:
      formula: round(288.15 / 0.0065 * (1 - (ratio / 100) ^ (1 / 4.2559)) * 3.28084 /
        1000) * 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round(288.15 / 0.0065 * (1 - (ratio / 100) ^ (1 / 4.2559)) / 1000) *
          1000
      - id: d2
        formula: round(288.15 / 0.0065 * (1 - (ratio / 100) ^ (1 / 5.2559)) * 3.28084 /
          1000) * 1000
      - id: d3
        formula: "35000"
      - id: d4
        formula: "40000"
    presets:
      - id: p1
        values:
          ratio: 50
      - id: p2
        values:
          ratio: 70
      - id: p3
        values:
          ratio: 30
    explanation: >-
      In the ISA, the density ratio σ = ρ/ρ0 decreases with altitude as σ = (1 −
      0.0065·h / 288.15)^4.2559, with h in metres. Solving for h gives h =
      (288.15 / 0.0065) · (1 − σ^(1/4.2559)).


      **Solution**


      Density ratio σ = {{= ratio / 100}}


      Height in metres: {{n: 288.15 / 0.0065 * (1 - (ratio / 100) ^ (1 /
      4.2559))}} m


      Height in feet: {{= 288.15 / 0.0065 * (1 - (ratio / 100) ^ (1 / 4.2559)) *
      3.28084}} ft, rounded to the nearest 1000 ft: **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the height in metres is used as feet (no conversion).

      - **{{d2}} ft**: the pressure exponent (5.2559) is used instead of the
      density exponent (4.2559), which gives the altitude for a pressure ratio.

      - **{{d3}} ft**: a typical flight level guessed, not derived from the ISA
      relation.

      - **{{d4}} ft**: a typical flight level guessed, not derived from the ISA
      relation.
