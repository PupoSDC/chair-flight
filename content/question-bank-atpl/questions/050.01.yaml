- id: QTESQIOOO
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-507816
    - AVEXAM-6375
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: >-
      The pilot of an aircraft descends from cruising level to an initial
      platform altitude of {{alt}} ft and is given the QNH of {{qnh}} hPa. The
      pilot forgets to set this QNH and remains on the standard setting of 1013
      hPa.


      Assume ISA temperature conditions and 30 ft per hPa.


      What is the true altitude of the aircraft when flying at the platform
      altitude (ft)?
    variables:
      - id: alt
        label: Indicated platform altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: alt + (qnh - 1013) * 30
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt
      - id: d2
        formula: alt - (qnh - 1013) * 30
      - id: d3
        formula: alt + (qnh - 1013) * 3
      - id: d4
        formula: alt * qnh / 1013
    presets:
      - id: p1
        values:
          alt: 5000
          qnh: 1006
      - id: p2
        values:
          alt: 4000
          qnh: 1020
      - id: p3
        values:
          alt: 6000
          qnh: 998
    explanation: >-
      With the standard setting selected the altimeter reads pressure altitude.
      When the QNH is lower than 1013 hPa the true altitude is lower than
      indicated, and when it is higher the true altitude is higher.


      **Solution**


      QNH difference from standard: {{qnh}} - 1013 = {{= qnh - 1013}} hPa


      True altitude: {{f: alt + (qnh - 1013) * 30}} = {{n: alt + (qnh - 1013) *
      30}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the indicated altitude is taken as the true altitude,
      with no QNH correction.

      - **{{d2}} ft**: the correction has the wrong sign.

      - **{{d3}} ft**: 3 ft per hPa is used instead of 30 ft per hPa.

      - **{{d4}} ft**: a pressure ratio is used instead of a height correction.
