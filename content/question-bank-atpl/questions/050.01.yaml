- id: Q9H8GV7GF
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-504691
    - BGS-502524
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: An aircraft is flying over a mountain range with a maximum elevation
      of {{elev}} ft AMSL. What is the minimum altitude required to maintain
      terrain clearance of {{clr}} ft, assuming that the correct QNH is set on
      the altimeter and the outside air temperature is ISA {{dev}} °C (negative
      = colder than ISA)?
    variables:
      - id: elev
        label: Maximum elevation
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: round((elev + clr) * (1 - dev / 250) / 10) * 10
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round((elev + clr) * (1 + dev / 250) / 10) * 10
      - id: d2
        formula: elev + clr
      - id: d3
        formula: round((elev * (1 - dev / 250) + clr) / 10) * 10
      - id: d4
        formula: round(elev * (1 - dev / 250) / 10) * 10
    presets:
      - id: p1
        values:
          elev: 4920
          clr: 1000
          dev: -10
      - id: p2
        values:
          elev: 6500
          clr: 1000
          dev: -15
      - id: p3
        values:
          elev: 3200
          clr: 1000
          dev: -20
    explanation: >-
      In air colder than ISA the altimeter over-reads: the true altitude is
      lower than the indicated one. To keep the required clearance the indicated
      altitude must be raised by about 4 ft per 1 000 ft for each °C below ISA
      (1/250 per °C).


      **Solution**


      Required true altitude: {{= elev + clr}} ft


      {{= elev + clr}} × (1 - ({{dev}}) / 250) = {{= (elev + clr) * (1 - dev /
      250)}} ft ≈ **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: correction applied with the wrong sign (reduced instead
      of increased).

      - **{{d2}} ft**: no temperature correction, only terrain elevation plus
      clearance.

      - **{{d3}} ft**: only the terrain elevation was corrected, the clearance
      was added uncorrected.

      - **{{d4}} ft**: clearance forgotten, only the corrected terrain
      elevation.
