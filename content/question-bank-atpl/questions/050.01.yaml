- id: QILZPRNZ
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-509212
    - BGS-500164
    - AVEXAM-9318
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: >-
      An aircraft has an altimeter reading of {{alt}} ft with the altimeter set
      to {{setting}} hPa.


      The QFE is {{qfe}} hPa and the QNH is {{qnh}} hPa.


      Barometric lapse rate: {{lapse}} ft/hPa.


      What is the true height of the aircraft above the aerodrome (ft)?
    variables:
      - id: alt
        label: Altimeter reading
        unit: ft
      - id: setting
        label: Altimeter setting
        unit: hPa
      - id: qfe
        label: QFE
        unit: hPa
      - id: qnh
        label: QNH
        unit: hPa
      - id: lapse
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: alt - lapse * (setting - qfe)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt + lapse * (setting - qfe)
      - id: d2
        formula: alt - lapse * (setting - qnh)
      - id: d3
        formula: alt
      - id: d4
        formula: alt - lapse * (1013.25 - qfe)
    presets:
      - id: p1
        values:
          alt: 5000
          setting: 1013
          qfe: 958
          qnh: 983
          lapse: 30
      - id: p2
        values:
          alt: 4000
          setting: 1013
          qfe: 990
          qnh: 1005
          lapse: 30
      - id: p3
        values:
          alt: 6500
          setting: 1013
          qfe: 940
          qnh: 975
          lapse: 30
    explanation: >-
      The height above the aerodrome is the altimeter reading corrected for the
      difference between the altimeter setting and the QFE (the aerodrome
      pressure), multiplied by the lapse rate.


      **Solution**


      Pressure difference: {{setting}} − {{qfe}} = {{= setting - qfe}} hPa


      Height above aerodrome: {{f: alt - lapse * (setting - qfe)}} = {{n: alt -
      lapse * (setting - qfe)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: sign of the pressure correction reversed.

      - **{{d2}} ft**: QNH used instead of QFE.

      - **{{d3}} ft**: pressure correction forgotten; the altimeter reading is
      used directly.

      - **{{d4}} ft**: standard pressure 1013.25 hPa used instead of the
      altimeter setting.
- id: QIMUUXBM
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-502290
    - AVEXAM-33933
    - ATPLGS-108980
    - BGS-500134
    - AVEXAM-96580
    - AVEXAM-11514
    - AVEXAM-42686
    - AVEXAM-53133
    - BGS-500152
    - AVEXAM-80692
    - BGS-500123
    - ATPLGS-108979
    - BGS-500135
    - AVEXAM-68325
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: If the QNH at Locarno ({{elev_m}} metres above sea level) is {{qnh}}
      hPa, what is the approximate QFE? Assume {{k}} ft/hPa.
    variables:
      - id: qnh
        label: QNH
        unit: hPa
      - id: elev_m
        label: Aerodrome elevation
        unit: m
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: round((qnh - elev_m * 3.281 / k) / 5) * 5
      unit: hPa
      decimals: 0
    distractors:
      - id: d1
        formula: qnh
      - id: d2
        formula: round((qnh + elev_m * 3.281 / k) / 5) * 5
      - id: d3
        formula: round((qnh - elev_m / k) / 5) * 5
      - id: d4
        formula: round((1013 - elev_m * 3.281 / k) / 5) * 5
    presets:
      - id: p1
        values:
          qnh: 1025
          elev_m: 200
          k: 30
      - id: p2
        values:
          qnh: 1010
          elev_m: 350
          k: 30
      - id: p3
        values:
          qnh: 1018
          elev_m: 120
          k: 30
    explanation: >-
      QFE is the pressure at aerodrome level, QNH is the same pressure reduced
      to sea level. The QFE is lower than the QNH by the elevation (in feet)
      divided by the pressure gradient in ft per hPa.


      **Solution**


      Elevation: {{elev_m}} m × 3.281 = {{= elev_m * 3.281}} ft


      Difference: {{= elev_m * 3.281}} / {{k}} = {{= elev_m * 3.281 / k}} hPa


      QFE = {{qnh}} - {{= elev_m * 3.281 / k}} = {{= qnh - elev_m * 3.281 / k}}
      hPa ≈ **{{answer}} hPa**


      **Why the other answers are wrong**


      - **{{d1}} hPa**: the QNH itself, no elevation correction.

      - **{{d2}} hPa**: elevation correction added instead of subtracted.

      - **{{d3}} hPa**: the elevation in metres was used as if it were feet.

      - **{{d4}} hPa**: the standard 1013 hPa was used instead of the QNH.
