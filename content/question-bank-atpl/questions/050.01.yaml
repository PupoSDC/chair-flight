- id: QTYGBOBA
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501401
    - AVEXAM-69766
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      An aircraft is cruising at FL{{fl}}.


      A nearby meteorological station situated at an elevation of {{hs}} ft
      gives a QNH of {{qnh}} hPa, and the aircraft measures an OAT of {{oat}}
      °C.


      Calculate the aircraft's clearance from the highest obstacle on its route,
      which is a mountain of {{obs}} ft elevation. (Assume 1 hPa = {{k}} ft)
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: hs
        label: Station elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: oat
        label: OAT
        unit: °C
      - id: obs
        label: Mountain elevation
        unit: ft
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: round(((fl * 100 + (qnh - 1013) * k) * (1 + (oat - (15 - 0.2 * fl)) /
        250) - obs) / 100) * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round(((fl * 100 + (qnh - 1013) * k) - obs) / 100) * 100
      - id: d2
        formula: round(((fl * 100 - (qnh - 1013) * k) * (1 + (oat - (15 - 0.2 * fl)) /
          250) - obs) / 100) * 100
      - id: d3
        formula: round(((fl * 100 + (qnh - 1013) * k) * (1 - (oat - (15 - 0.2 * fl)) /
          250) - obs) / 100) * 100
      - id: d4
        formula: round((fl * 100 * (1 + (oat - (15 - 0.2 * fl)) / 250) - obs) / 100) *
          100
    presets:
      - id: p1
        values:
          fl: 100
          hs: 1500
          qnh: 990
          oat: 0
          obs: 5000
          k: 30
      - id: p2
        values:
          fl: 80
          hs: 800
          qnh: 1003
          oat: 10
          obs: 6000
          k: 30
      - id: p3
        values:
          fl: 120
          hs: 900
          qnh: 1000
          oat: -20
          obs: 7000
          k: 30
    explanation: >-
      At a flight level the altimeter is set to 1013 hPa. First convert the
      flight level to an altitude above mean sea level using the QNH (a QNH
      below 1013 hPa means a lower true altitude), then correct for temperature:
      in air warmer than ISA the true altitude is higher than indicated (about
      1/250 per °C). The clearance is the corrected altitude minus the obstacle
      elevation (rounded to 100 ft).


      **Solution**


      ISA temperature at FL{{fl}}: {{= 15 - 0.2 * fl}} °C, so the ISA deviation
      is {{= oat - (15 - 0.2 * fl)}} °C


      Altitude on QNH: {{= fl * 100}} - {{= (1013 - qnh) * k}} = {{= fl * 100 +
      (qnh - 1013) * k}} ft


      True altitude: {{= fl * 100 + (qnh - 1013) * k}} × (1 + {{= oat - (15 -
      0.2 * fl)}} / 250) = {{= (fl * 100 + (qnh - 1013) * k) * (1 + (oat - (15 -
      0.2 * fl)) / 250)}} ft


      Clearance: {{= (fl * 100 + (qnh - 1013) * k) * (1 + (oat - (15 - 0.2 *
      fl)) / 250)}} - {{obs}} ≈ **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: temperature correction forgotten.

      - **{{d2}} ft**: QNH correction applied with the wrong sign.

      - **{{d3}} ft**: temperature correction applied with the wrong sign.

      - **{{d4}} ft**: QNH correction forgotten.
- id: QTYXEHRP
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-504069
    - ATPLGS-108934
    - AVEXAM-47434
    - BGS-500170
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
    - 050.01.06.03.08
  template:
    type: calculation
    question: >-
      You plan to fly over a mountain range at a true altitude of {{alt}} ft
      AMSL.


      - Average temperature: {{cold}} °C colder than ISA

      - Sea level pressure (QNH): {{qnh}} hPa

      - Altimeter setting: {{set}} hPa

      - Barometric lapse rate: {{k}} ft/hPa


      What approximate indication should the altimeter read?
    variables:
      - id: alt
        label: True altitude
        unit: ft
      - id: cold
        label: Colder than ISA
        unit: °C
      - id: qnh
        label: QNH
        unit: hPa
      - id: set
        label: Altimeter setting
        unit: hPa
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: alt + (set - qnh) * k + cold * 4 * alt / 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt + (set - qnh) * k
      - id: d2
        formula: alt - (set - qnh) * k + cold * 4 * alt / 1000
      - id: d3
        formula: alt - cold * 4 * alt / 1000
      - id: d4
        formula: alt - (set - qnh) * k - cold * 4 * alt / 1000
    presets:
      - id: p1
        values:
          alt: 15000
          cold: 15
          qnh: 1003
          set: 1013.2
          k: 30
      - id: p2
        values:
          alt: 10000
          cold: 10
          qnh: 1010
          set: 1013
          k: 30
      - id: p3
        values:
          alt: 8000
          cold: 20
          qnh: 995
          set: 1013
          k: 30
    explanation: >-
      The altimeter reads too high when the sea level pressure is lower than the
      setting, because the true altitude is then below the altitude the
      altimeter shows. Cold air also makes the true altitude lower than
      indicated. Both errors add up, so the altimeter reads higher than the true
      altitude.


      **Solution**


      - Pressure error: {{f: (set - qnh) * k}} = {{= (set - qnh) * k}} ft

      - Temperature error: {{f: cold * 4 * alt / 1000}} = {{= cold * 4 * alt /
      1000}} ft

      - Indication: {{f: alt + (set - qnh) * k + cold * 4 * alt / 1000}} = {{n:
      alt + (set - qnh) * k + cold * 4 * alt / 1000}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: forgets the temperature error

      - **{{d2}} ft**: applies the pressure error with the wrong sign

      - **{{d3}} ft**: applies the temperature error with the wrong sign

      - **{{d4}} ft**: applies both errors with the wrong sign
