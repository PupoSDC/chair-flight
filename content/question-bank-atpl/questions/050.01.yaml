- id: QG68BQ2KR
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-502470
    - BGS-500031
    - ATPLGS-625910
    - BGS-500032
    - BGS-500029
    - AVEXAM-43471
  annexes: []
  learningObjectives:
    - 050.01.02.04.01
  template:
    type: calculation
    question: >-
      The temperature at FL{{fl_high}} is {{t_high}} °C.


      What will the temperature be at FL{{fl_low}} if the ICAO standard lapse
      rate is applied?
    variables:
      - id: fl_high
        label: Upper flight level
        unit: FL
      - id: fl_low
        label: Lower flight level
        unit: FL
      - id: t_high
        label: Temperature at upper level
        unit: °C
    answer:
      formula: t_high + 0.2 * (fl_high - fl_low)
      unit: °C
      decimals: 0
    distractors:
      - id: d1
        formula: t_high
      - id: d2
        formula: t_high - 0.2 * (fl_high - fl_low)
      - id: d3
        formula: t_high + 0.1 * (fl_high - fl_low)
      - id: d4
        formula: -t_high + 0.2 * (fl_high - fl_low)
    presets:
      - id: p1
        values:
          fl_high: 160
          fl_low: 90
          t_high: -22
      - id: p2
        values:
          fl_high: 120
          fl_low: 60
          t_high: -10
      - id: p3
        values:
          fl_high: 100
          fl_low: 50
          t_high: -5
    explanation: >-
      The ICAO standard lapse rate is 2 °C per 1 000 ft, which is 0.2 °C per
      flight level. Going down the air becomes warmer, so the temperature rises
      when descending from FL{{fl_high}} to FL{{fl_low}}.


      **Solution**


      Flight levels between the two levels: {{= fl_high - fl_low}}


      Temperature at FL{{fl_low}}: {{f: t_high + 0.2 * (fl_high - fl_low)}} =
      {{n: t_high + 0.2 * (fl_high - fl_low)}} = **{{answer}} °C**


      **Why the other answers are wrong**


      - **{{d1}} °C**: the upper temperature is copied without any lapse rate
      correction.

      - **{{d2}} °C**: the temperature is treated as falling when descending,
      which is the wrong direction.

      - **{{d3}} °C**: half the lapse rate is used (1 °C per 1 000 ft).

      - **{{d4}} °C**: the sign of the given temperature is reversed.
