    - AVEXAM-90089
    - AVEXAM-3794
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: chart
    question: >-
      You are supposed to fly above a mountain which has a peak of 8600 feet on
      a westbound VFR flight.


      The ISA deviation in the area is - 9 degrees Celsius and the local QNH is
      0995 hPa.


      What is the lowest usable flight level for this segment of the flight?
      _Note that you are expected to clear terrain by 2000 ft.


      Assume 1 hPa = 27 ft._
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: FL125
        wrongAnswers:
          - FL115
          - FL120
          - FL100
        explanation: >-
          The required altitude is 8 600 + 2 000 = 10 600 ft.


          - Cold air (ISA −9 °C): 9 × 4 × 10.6 = 380 ft more, giving about 10
          980 ft indicated.

          - QNH of 995 hPa is 18 hPa below standard, which adds 18 × 27 = 486 ft
          in pressure altitude: about 11 470 ft.


          For a westbound VFR flight the levels are even thousands plus 500 ft,
          so the lowest usable level above FL115 is **FL125**.
