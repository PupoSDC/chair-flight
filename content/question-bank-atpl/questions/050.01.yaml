- id: QFCJYWBK
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-506231
    - ATPLQ-507725
    - AVEXAM-36067
    - ATPLQ-502313
    - AVEXAM-94465
    - BGS-500165
    - ATPLQ-501743
    - ATPLQ-502166
  annexes: []
  learningObjectives:
    - 050.01.06.03.04
  template:
    type: calculation
    question: >-
      The average temperature of the air mass between FL{{fl_low}} and
      FL{{fl_high}} is ISA {{dev}} °C (negative = colder than ISA).


      What is the vertical distance between FL{{fl_low}} and FL{{fl_high}}?
    variables:
      - id: fl_low
        label: Lower flight level
        unit: FL
      - id: fl_high
        label: Upper flight level
        unit: FL
      - id: dev
        label: Mean ISA deviation
        unit: °C
    answer:
      formula: (fl_high - fl_low) * 100 * (1 + dev / 250)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (fl_high - fl_low) * 100 * (1 - dev / 250)
      - id: d2
        formula: (fl_high - fl_low) * 100
      - id: d3
        formula: (fl_high - fl_low) * 100 + 4 * dev
      - id: d4
        formula: (fl_high - fl_low) * 100 * (1 + dev / 100)
    presets:
      - id: p1
        values:
          fl_low: 60
          fl_high: 120
          dev: 10
      - id: p2
        values:
          fl_low: 50
          fl_high: 140
          dev: -15
      - id: p3
        values:
          fl_low: 40
          fl_high: 70
          dev: -10
      - id: p4
        values:
          fl_low: 70
          fl_high: 190
          dev: 5
      - id: p5
        values:
          fl_low: 110
          fl_high: 230
          dev: 15
    explanation: >-
      Flight levels are pressure altitudes, so the true distance between two of
      them depends on the mean air temperature. A layer that is warmer than ISA
      is thicker, a colder layer is thinner: the thickness changes by about 4 ft
      per 1 000 ft for every °C of deviation, i.e. by 1/250 per °C.


      **Solution**


      ISA distance: {{= (fl_high - fl_low) * 100}} ft


      {{f: (fl_high - fl_low) * 100 * (1 + dev / 250)}} = {{n: (fl_high -
      fl_low) * 100 * (1 + dev / 250)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: temperature correction applied with the wrong sign.

      - **{{d2}} ft**: no temperature correction, the ISA distance between the
      levels.

      - **{{d3}} ft**: the 4 ft/°C correction was applied once instead of per 1
      000 ft of layer.

      - **{{d4}} ft**: deviation divided by 100 instead of 250.
