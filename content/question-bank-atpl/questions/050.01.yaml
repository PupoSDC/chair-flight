- id: QEAXXASF
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-503209
    - AVEXAM-60980
    - ATPLQ-506238
    - AVEXAM-19
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: >-
      An aircraft is flying at FL{{fl}}. The flight crew forgot to change to the
      standard pressure setting and the local QNH of {{qnh}} hPa remains set on
      the altimeter. (Assume {{k}} ft per hPa.)


      By how many feet is the aircraft lower than another aircraft correctly
      flying FL{{fl}} with 1013 hPa set?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: (qnh - 1013) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (qnh - 1013) * 27
      - id: d2
        formula: qnh - 1013
      - id: d3
        formula: (qnh - 1013) * k / 3.28084
      - id: d4
        formula: (qnh - 1000) * k
    presets:
      - id: p1
        values:
          fl: 50
          qnh: 1030
          k: 30
      - id: p2
        values:
          fl: 60
          qnh: 1025
          k: 30
    explanation: >-
      The altimeter indicates the height above the pressure level that is set.
      With a QNH above 1013 hPa set instead of 1013, the reference level is
      placed lower in the atmosphere, so the aircraft that is indicating the
      same level is actually flying lower than the aircraft on the standard
      setting. The error is the pressure difference times the gradient.


      **Solution**


      {{f: (qnh - 1013) * k}} = {{n: (qnh - 1013) * k}} = **{{answer}} ft**
      lower


      **Why the other answers are wrong**


      - **{{d1}} ft**: a gradient of 27 ft/hPa was used instead of the given
      value.

      - **{{d2}} ft**: the pressure difference in hPa was not converted to feet.

      - **{{d3}} ft**: the result was wrongly divided by 3.28 as if converting
      feet to metres.

      - **{{d4}} ft**: the difference was taken from 1000 hPa instead of 1013
      hPa.
- id: QEBR35TI4
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-508160
    - BGS-502482
    - ATPLQ-507137
  annexes: []
  learningObjectives:
    - 050.01.06.03.02
  template:
    type: calculation
    question: >-
      During an arrival the pilot changes the altimeter subscale from standard
      (1013 hPa) to QNH while passing the transition level. Given:


      - Transition level: FL{{tl}}

      - Transition altitude: {{ta}} ft

      - QNH: {{qnh}} hPa

      - (Assume {{k}} ft per hPa.)


      What altitude does the altimeter read immediately after the subscale is
      changed?
    variables:
      - id: tl
        label: Transition level
        unit: FL
      - id: ta
        label: Transition altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: tl * 100 + (qnh - 1013) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: tl * 100 + (1013 - qnh) * k
      - id: d2
        formula: ta + (qnh - 1013) * k
      - id: d3
        formula: ta + (1013 - qnh) * k
      - id: d4
        formula: tl * 100
    presets:
      - id: p1
        values:
          tl: 45
          ta: 5000
          qnh: 1043
          k: 30
      - id: p2
        values:
          tl: 190
          ta: 18000
          qnh: 989
          k: 30
    explanation: >-
      At the transition level the aircraft is at a flight level, i.e. its
      altitude is referenced to 1013 hPa. After setting QNH the reading becomes
      the altitude above the QNH surface: if QNH is higher than 1013, the
      aircraft is higher above the QNH surface, so the reading increases; if QNH
      is lower, it decreases. The transition altitude is not used.


      **Solution**


      Flight level height = {{= tl * 100}} ft


      Change = ({{qnh}} - 1013) hPa x {{k}} ft/hPa = {{= (qnh - 1013) * k}} ft


      {{f: tl * 100 + (qnh - 1013) * k}} = {{n: tl * 100 + (qnh - 1013) * k}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the correction has the wrong sign.

      - **{{d2}} ft**: the correction was applied to the transition altitude
      instead of the transition level.

      - **{{d3}} ft**: wrong reference (transition altitude) and wrong sign.

      - **{{d4}} ft**: no pressure correction applied.
- id: QEDODWHS
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-503255
    - BGS-500159
    - AVEXAM-27115
    - ATPLGS-108971
  annexes: []
  learningObjectives:
    - 050.01.03.02.02
  template:
    type: calculation
    question: "An airfield has a QFE of {{qfe}} hPa and a QNH of {{qnh}} hPa.
      Barometric lapse rate: {{lapse}} ft/hPa. Determine the approximate
      elevation of the airfield in metres (rounded to the nearest 10 m)."
    variables:
      - id: qnh
        label: QNH
        unit: hPa
      - id: qfe
        label: QFE
        unit: hPa
      - id: lapse
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: round((qnh - qfe) * lapse * 0.3048 / 10) * 10
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: (qnh - qfe) * lapse
      - id: d2
        formula: round((qfe - qnh) * lapse * 0.3048 / 10) * 10
      - id: d3
        formula: round((qnh - qfe) * 27 * 0.3048 / 10) * 10
      - id: d4
        formula: round((qnh - qfe) * lapse / 0.3048 / 10) * 10
    presets:
      - id: p1
        values:
          qnh: 1000
          qfe: 980
          lapse: 30
      - id: p2
        values:
          qnh: 1013
          qfe: 1003
          lapse: 30
      - id: p3
        values:
          qnh: 1020
          qfe: 990
          lapse: 30
    explanation: >-
      The difference between QNH and QFE is the pressure difference between mean
      sea level and the airfield. Multiplied by the barometric lapse rate, it
      gives the airfield elevation.


      **Solution**


      Pressure difference: {{= qnh - qfe}} hPa


      Elevation in feet: {{f: (qnh - qfe) * lapse}} = {{n: (qnh - qfe) * lapse}}
      ft


      Converted to metres (× 0.3048) and rounded to the nearest 10 m:
      **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the result in feet is used as metres (no unit conversion).

      - **{{d2}} m**: sign reversed (QFE minus QNH), giving a negative
      elevation.

      - **{{d3}} m**: a lapse rate of 27 ft/hPa is used instead of the given
      value.

      - **{{d4}} m**: wrong conversion; divided by 0.3048 instead of multiplied.
- id: QEEEDEBJ
  docId: "050.01"
  relatedQuestions:
    - QIRFBYLD
  externalIds:
    - ATPLQ-503945
    - BGS-501839
    - AVEXAM-35748
    - ATPLQ-504017
    - AVEXAM-50272
    - AVEXAM-3745
    - AVEXAM-53755
    - BGS-500122
    - ATPLGS-108957
  annexes: []
  learningObjectives:
    - 050.01.06.03.03
  template:
    type: calculation
    question: >-
      After landing at an aerodrome, the altimeter subscale has not been
      corrected to the local QNH.


      - Aerodrome elevation: {{elev}} ft

      - Correct QNH: {{qnh}} hPa

      - Altimeter subscale setting: {{set}} hPa

      - Barometric lapse rate: {{k}} ft/hPa


      What does the altimeter read on the ground?
    variables:
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: qnh
        label: Correct QNH
        unit: hPa
      - id: set
        label: Subscale setting
        unit: hPa
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: elev + (set - qnh) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: elev + (qnh - set) * k
      - id: d2
        formula: elev
      - id: d3
        formula: (set - qnh) * k
      - id: d4
        formula: elev + (set - qnh)
    presets:
      - id: p1
        values:
          elev: 290
          qnh: 1023
          set: 1013.2
          k: 30
      - id: p2
        values:
          elev: 224
          qnh: 1030
          set: 1013
          k: 30
      - id: p3
        values:
          elev: 540
          qnh: 998
          set: 1013
          k: 30
    explanation: >-
      When the subscale is not set to the local QNH, the altimeter reads a
      height above the pressure level of the wrong setting. Each hPa of
      difference shifts the reading by {{k}} ft, so the altimeter can read above
      or below the aerodrome elevation.


      **Solution**


      - Subscale error: {{f: (set - qnh) * k}} = {{= (set - qnh) * k}} ft

      - Reading: {{f: elev + (set - qnh) * k}} = {{n: elev + (set - qnh) * k}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the subscale error has the wrong sign

      - **{{d2}} ft**: forgets the subscale error and shows only the elevation

      - **{{d3}} ft**: shows only the subscale error and ignores the elevation

      - **{{d4}} ft**: uses the hPa difference as feet without converting it
