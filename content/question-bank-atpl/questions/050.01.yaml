- id: QPFUFLPD
  docId: "050.01"
  relatedQuestions:
    - QR3UGMS3H
  externalIds:
    - ATPLQ-501286
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      An aircraft is flying over a mountain range at an indicated altitude of
      {{alt}} ft with the altimeter set to 1013 hPa.


      - Temperature at this level: {{oat}} °C

      - ISA temperature at this level: {{isa}} °C

      - Elevation of the reference station (QNH 1013 hPa): {{hs}} ft

      - Highest peak on the route: {{peak}} ft


      What is the aircraft's clearance above the peak?
    variables:
      - id: alt
        label: Indicated altitude
        unit: ft
      - id: oat
        label: Temperature
        unit: °C
      - id: isa
        label: ISA temperature
        unit: °C
      - id: hs
        label: Station elevation
        unit: ft
      - id: peak
        label: Peak elevation
        unit: ft
    answer:
      formula: alt + (oat - isa) * 4 * (alt - hs) / 1000 - peak
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt - peak
      - id: d2
        formula: alt + (oat - isa) * 4 * (alt - hs) / 1000
      - id: d3
        formula: alt - (oat - isa) * 4 * (alt - hs) / 1000 - peak
      - id: d4
        formula: alt + (oat - isa) * 4 * alt / 1000 - peak
    presets:
      - id: p1
        values:
          alt: 39000
          oat: -48
          isa: -56.5
          hs: 5000
          peak: 29029
      - id: p2
        values:
          alt: 30000
          oat: -40
          isa: -44.4
          hs: 2000
          peak: 25000
      - id: p3
        values:
          alt: 25000
          oat: -40
          isa: -34.5
          hs: 1000
          peak: 20000
    explanation: >-
      Air warmer than ISA makes the true altitude higher than the altimeter
      shows, and colder air makes it lower. The correction is 4 ft per 1 000 ft
      of height above the reference station for each °C of ISA deviation. The
      peak elevation is then subtracted to get the clearance.


      **Solution**


      - ISA deviation: {{f: oat - isa}} = {{= oat - isa}} °C

      - True altitude: {{f: alt + (oat - isa) * 4 * (alt - hs) / 1000}} = {{n:
      alt + (oat - isa) * 4 * (alt - hs) / 1000}} = {{= alt + (oat - isa) * 4 *
      (alt - hs) / 1000}} ft

      - Clearance: {{f: alt + (oat - isa) * 4 * (alt - hs) / 1000 - peak}} =
      {{n: alt + (oat - isa) * 4 * (alt - hs) / 1000 - peak}} = **{{answer}}
      ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: subtracts the peak from the indicated altitude and
      ignores the temperature correction

      - **{{d2}} ft**: forgets to subtract the peak elevation

      - **{{d3}} ft**: applies the temperature correction with the wrong sign

      - **{{d4}} ft**: uses the altitude above mean sea level instead of the
      height above the station
