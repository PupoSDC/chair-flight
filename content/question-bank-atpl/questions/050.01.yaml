- id: QTGJBYPG
  docId: "050.01"
  relatedQuestions:
    - QGQGGRSW
  externalIds:
    - ATPLQ-505872
    - AVEXAM-84170
    - AVEXAM-15286
    - BGS-502121
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      What is the approximate true altitude of an aircraft with the following
      data?


      - Indicated altitude: {{alt}} ft (correct QNH set in the subscale)

      - OAT: {{oat}} °C


      Give the answer in feet.
    variables:
      - id: alt
        label: Indicated altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: alt * (1 + 0.004 * (oat - (15 - 0.002 * alt)))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt
      - id: d2
        formula: alt * (1 + 0.004 * oat)
      - id: d3
        formula: alt * (1 - 0.004 * (oat - (15 - 0.002 * alt)))
      - id: d4
        formula: alt * (1 + 0.04 * (oat - (15 - 0.002 * alt)))
    presets:
      - id: p1
        values:
          alt: 8000
          oat: 12
      - id: p2
        values:
          alt: 5000
          oat: 10
      - id: p3
        values:
          alt: 12000
          oat: -12
    explanation: >-
      The ISA temperature falls by 2 °C per 1 000 ft from 15 °C at sea level.
      The difference between the OAT and the ISA temperature at the indicated
      altitude is the ISA deviation, and it changes the true altitude by about
      0.4 % of the indicated altitude per degree.


      **Solution**


      ISA temperature at {{alt}} ft: 15 - 2 x {{alt}} / 1 000 = {{= 15 - 0.002 *
      alt}} °C


      ISA deviation: {{oat}} - ({{= 15 - 0.002 * alt}}) = {{= oat - (15 - 0.002
      * alt)}} °C


      True altitude: {{f: alt * (1 + 0.004 * (oat - (15 - 0.002 * alt)))}} =
      {{n: alt * (1 + 0.004 * (oat - (15 - 0.002 * alt)))}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the indicated altitude is taken as the true altitude,
      with no correction.

      - **{{d2}} ft**: the OAT is used as the deviation instead of the
      difference to the ISA temperature.

      - **{{d3}} ft**: the correction has the wrong sign.

      - **{{d4}} ft**: 0.04 % per degree is used instead of 0.4 %, a decimal
      point slip.
