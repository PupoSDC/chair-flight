    - AVEXAM-43366
    - BGS-502390
  annexes: []
  learningObjectives:
    - 050.01.06.03.02
  template:
    type: calculation
    question: >-
      During an arrival the pilot changes the altimeter subscale from standard
      (1013 hPa) to QNH while passing the transition level. Given:


      - Transition level: FL{{tl}}

      - Transition altitude: {{ta}} ft

      - QNH: {{qnh}} hPa


      (Assume {{k}} ft per hPa.)


      What altitude does the altimeter read immediately after the subscale is
      changed?
    variables:
      - id: tl
        label: Transition level
        unit: FL
      - id: ta
        label: Transition altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: tl * 100 + (qnh - 1013) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: tl * 100 + (1013 - qnh) * k
      - id: d2
        formula: ta + (qnh - 1013) * k
      - id: d3
        formula: ta + (1013 - qnh) * k
      - id: d4
        formula: tl * 100
    presets:
      - id: p1
        values:
          tl: 55
          ta: 6000
          qnh: 1042
          k: 30
      - id: p2
        values:
          tl: 100
          ta: 18000
          qnh: 1020
          k: 30
      - id: p3
        values:
          tl: 40
          ta: 6000
          qnh: 1008
          k: 30
    explanation: >-
      The transition level is a flight level, so the altimeter reads it on
      standard pressure. Once the subscale is set to QNH, the reading changes by
      the gradient for every hPa between QNH and 1013 hPa. The transition
      altitude is not used.


      **Solution**


      Flight level height: {{= tl * 100}} ft


      {{f: tl * 100 + (qnh - 1013) * k}} = {{n: tl * 100 + (qnh - 1013) * k}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the correction has the wrong sign.

      - **{{d2}} ft**: the correction is applied to the transition altitude
      instead of the transition level.

      - **{{d3}} ft**: wrong reference (transition altitude) and wrong sign.

      - **{{d4}} ft**: no pressure correction is applied.
