- id: QJJFPAQL
  docId: "050.01"
  relatedQuestions:
    - QIOMLCNA
  externalIds:
    - ATPLQ-507724
    - BGS-502345
    - AVEXAM-42037
    - ATPLQ-504257
    - AVEXAM-96657
    - AVEXAM-15889
    - ATPLGS-627931
    - ATPLGS-627921
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      An aircraft must clear the highest obstacle, which has an elevation of
      {{obs}} ft, by at least {{clr}} ft. The nearest aerodrome, at an elevation
      of {{hs}} ft, reports a QNH of {{qnh}} hPa and a temperature of {{temp}}
      °C. Assume 1 hPa = {{k}} ft.


      Calculate the lowest safe flight level.
    variables:
      - id: obs
        label: Obstacle elevation
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: hs
        label: Aerodrome elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: temp
        label: Aerodrome temperature
        unit: °C
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ceil((hs + (obs + clr - hs) * (1 - (temp - 15 + 0.002 * hs) / 250) +
        (1013 - qnh) * k) / 500) * 5
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(((obs + clr) - (1013 - qnh) * k) / 500) * 5
      - id: d2
        formula: ceil((obs + clr) / 500) * 5
      - id: d3
        formula: ceil((obs + (1013 - qnh) * k) / 500) * 5
      - id: d4
        formula: ceil((hs + (obs + clr - hs) * (1 - (temp - 15 + 0.002 * hs) / 250) +
          (1013 - qnh) * k + clr) / 500) * 5
    presets:
      - id: p1
        values:
          obs: 4430
          clr: 2000
          hs: 2420
          qnh: 994
          temp: 9
          k: 30
      - id: p2
        values:
          obs: 3860
          clr: 2000
          hs: 36
          qnh: 972
          temp: -2
          k: 30
      - id: p3
        values:
          obs: 5200
          clr: 2000
          hs: 800
          qnh: 1003
          temp: 8
          k: 30
    explanation: >-
      The lowest usable flight level is found by working backwards from the
      required true altitude (obstacle elevation plus clearance).


      1. Temperature: the ISA temperature at the aerodrome is 15 - 0.002 ×
      elevation. The height above the aerodrome is corrected by about 1/250 per
      °C of deviation (increased when colder than ISA, decreased when warmer).

      2. Pressure: a QNH below 1013 hPa means the 1013 hPa level is higher, so
      (1013 - QNH) × ft per hPa is added to obtain the pressure altitude.

      3. The result is rounded up to the next flight level that is a multiple of
      5.


      **Solution**


      Required true altitude: {{= obs + clr}} ft


      ISA deviation at the aerodrome: {{= (temp - 15 + 0.002 * hs)}} °C


      Temperature-corrected altitude: {{= hs + (obs + clr - hs) * (1 - (temp -
      15 + 0.002 * hs) / 250)}} ft


      Pressure altitude: {{= hs + (obs + clr - hs) * (1 - (temp - 15 + 0.002 *
      hs) / 250) + (1013 - qnh) * k}} ft


      Rounded up to the next multiple of 5: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: pressure correction applied with the wrong sign.

      - **FL{{d2}}**: neither QNH nor temperature correction applied.

      - **FL{{d3}}**: clearance forgotten.

      - **FL{{d4}}**: the clearance was counted twice.
- id: QJSVUAAX
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-502232
    - AVEXAM-56536
    - AVEXAM-99278
    - AVEXAM-14870
