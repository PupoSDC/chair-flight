  template:
    type: chart
    question: >-
      An aircraft flies at flight level 40.


      Elevation of the aerodrome: 990 ft; QNH 976 hPa.The tower clears the pilot
      to fly at 3000 ft QNH.


      Which of the following statements is correct? _(Barometric lapse rate: 27
      ft/hPa)_
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Only a small change of altitude is necessary.
        wrongAnswers:
          - The aircraft has to climb about 1000 ft.
          - The aircraft has to descend about 2000 ft.
          - The aircraft has to descend about 1000 ft.
        explanation: >-
          FL40 is 4 000 ft on the standard setting. A QNH of 976 hPa is 37 hPa
          below standard, so the altitude on QNH is 4 000 − 37 × 27 = 3 001 ft.


          The aircraft is already at about 3 000 ft QNH, so **only a small
          change** of altitude is needed.
- id: QZTEAZLS
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-507641
    - AVEXAM-85133
    - BGS-500120
    - ATPLGS-108910
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      On a route segment from A to B the highest obstacle has an elevation of
      {{elev}} ft. For an instrument flight the minimum obstacle clearance is
      {{clr}} ft. The altimeter subscale is set to the local QNH of 1013 hPa and
      the temperature on the ground is {{temp}} °C. Assume a standard
      temperature lapse rate.


      What is the approximate minimum acceptable altimeter indication during the
      flight on this route segment?
    variables:
      - id: elev
        label: Obstacle elevation
        unit: ft
      - id: clr
        label: Minimum obstacle clearance
        unit: ft
      - id: temp
        label: Ground temperature
        unit: °C
    answer:
      formula: round((elev + clr) * (1 - (temp - 15) / 250) / 100) * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round((elev + clr) * (1 + (temp - 15) / 250) / 100) * 100
      - id: d2
        formula: round((elev + clr) / 100) * 100
      - id: d3
        formula: clr
      - id: d4
        formula: round((elev + clr) * (1 - (temp - 15) / 100) / 100) * 100
    presets:
      - id: p1
        values:
          elev: 200
          clr: 1000
          temp: -5
      - id: p2
        values:
          elev: 450
          clr: 1000
          temp: -10
      - id: p3
        values:
          elev: 800
          clr: 1000
          temp: -15
    explanation: >-
      With QNH set the altimeter indicates altitude above mean sea level, but in
      air colder than ISA it over-reads, so the true altitude is lower than
      indicated. The minimum indication must therefore be increased by about
      1/250 (0.4 %) per °C below the ISA temperature (15 °C at sea level).


      **Solution**


      ISA deviation: {{= temp - 15}} °C


      Required true altitude: {{= elev + clr}} ft


      {{= elev + clr}} × (1 - ({{= temp - 15}}) / 250) = {{= (elev + clr) * (1 -
      (temp - 15) / 250)}} ft ≈ **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: temperature correction applied with the wrong sign.

      - **{{d2}} ft**: no temperature correction, obstacle elevation plus
      clearance only.

      - **{{d3}} ft**: only the clearance was considered, the obstacle elevation
      was forgotten.

      - **{{d4}} ft**: deviation divided by 100 instead of 250, over-correcting.
