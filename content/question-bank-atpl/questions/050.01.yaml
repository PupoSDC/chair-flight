- id: QR3UGMS3H
  docId: "050.01"
  relatedQuestions:
    - QPFUFLPD
  externalIds:
    - ATPLQ-507970
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      You are flying at an indicated altitude of {{alt}} ft with the altimeter
      set to 1013 hPa and must start a drift down procedure.


      - Highest obstacle elevation: {{obs}} ft

      - QNH 1013 hPa measured at a station at {{hs}} ft

      - ISA deviation: {{dev}} °C


      What is the vertical separation between the aircraft and the highest
      obstacle?
    variables:
      - id: alt
        label: Indicated altitude
        unit: ft
      - id: obs
        label: Highest obstacle
        unit: ft
      - id: hs
        label: Station elevation
        unit: ft
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: alt + dev * 4 * (alt - hs) / 1000 - obs
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt - obs
      - id: d2
        formula: alt - dev * 4 * (alt - hs) / 1000 - obs
      - id: d3
        formula: alt + dev * 4 * alt / 1000 - obs
      - id: d4
        formula: alt + dev * 4 * (alt - hs) / 1000
    presets:
      - id: p1
        values:
          alt: 39000
          obs: 29092
          hs: 5000
          dev: -15
      - id: p2
        values:
          alt: 35000
          obs: 30000
          hs: 3000
          dev: -10
      - id: p3
        values:
          alt: 39000
          obs: 25000
          hs: 2000
          dev: -20
    explanation: >-
      A cold air mass makes the true altitude lower than the indicated altitude.
      The correction is 4 ft per 1 000 ft of height above the station for each
      °C of ISA deviation. The obstacle elevation is then subtracted to get the
      vertical separation.


      **Solution**


      - Temperature correction: {{f: dev * 4 * (alt - hs) / 1000}} = {{= dev * 4
      * (alt - hs) / 1000}} ft

      - True altitude: {{f: alt + dev * 4 * (alt - hs) / 1000}} = {{= alt + dev
      * 4 * (alt - hs) / 1000}} ft

      - Separation: {{f: alt + dev * 4 * (alt - hs) / 1000 - obs}} = {{n: alt +
      dev * 4 * (alt - hs) / 1000 - obs}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the temperature correction

      - **{{d2}} ft**: applies the temperature correction with the wrong sign

      - **{{d3}} ft**: uses the altitude above sea level instead of the height
      above the station

      - **{{d4}} ft**: forgets to subtract the obstacle elevation
