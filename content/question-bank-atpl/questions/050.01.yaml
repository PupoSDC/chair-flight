- id: Q0REOBXGF
  docId: "050.01"
  relatedQuestions:
    - QGQGGRSW
  externalIds:
    - ATPLQ-507994
    - ATPLQ-501822
    - BGS-502153
    - AVEXAM-23566
    - AVEXAM-42343
    - AVEXAM-50623
    - BGS-502449
    - ATPLQ-501426
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      Determine the true height above the aerodrome, given:


      - Indicated height above the aerodrome (QFE set on the altimeter): {{ind}}
      ft

      - Temperature: ISA {{isa_dev}} °C (negative = colder than ISA)


      What is the true height above the aerodrome (ft)?
    variables:
      - id: ind
        label: Indicated height
        unit: ft
      - id: isa_dev
        label: ISA deviation
        unit: °C
    answer:
      formula: ind * (1 + 0.004 * isa_dev)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ind * (1 - 0.004 * isa_dev)
      - id: d2
        formula: ind * (1 + 0.0004 * isa_dev)
      - id: d3
        formula: ind / (1 + 0.004 * isa_dev)
      - id: d4
        formula: ind
    presets:
      - id: p1
        values:
          ind: 2000
          isa_dev: 18
      - id: p2
        values:
          ind: 2000
          isa_dev: -12
      - id: p3
        values:
          ind: 3300
          isa_dev: -15
    explanation: >-
      With the QFE set, the altimeter reads height above the aerodrome. This
      height is corrected for temperature in the same way as an altitude: about
      0.4 % of the indicated height per degree of ISA deviation, positive when
      warmer than ISA.


      **Solution**


      Correction factor: 1 + 0.004 x ({{isa_dev}}) = {{= 1 + 0.004 * isa_dev}}


      True height: {{f: ind * (1 + 0.004 * isa_dev)}} = {{n: ind * (1 + 0.004 *
      isa_dev)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the sign of the correction is reversed.

      - **{{d2}} ft**: 0.0004 is used instead of 0.004, a decimal point slip.

      - **{{d3}} ft**: the indicated height is divided by the correction factor
      instead of multiplied.

      - **{{d4}} ft**: no temperature correction is applied.
