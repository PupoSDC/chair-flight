- id: QTDQU9XVR
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501129
    - ATPLQ-508842
  annexes: []
  learningObjectives:
    - 050.01.02.02.03
  template:
    type: calculation
    question: What is the ISA deviation at FL{{fl}} where the OAT was {{oat}} °C?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: oat - max(15 - 0.2 * fl, -56.5)
      unit: °C
      decimals: 1
    distractors:
      - id: d1
        formula: -(oat - max(15 - 0.2 * fl, -56.5))
      - id: d2
        formula: oat - (15 - 0.2 * fl)
      - id: d3
        formula: -(oat - (15 - 0.2 * fl))
      - id: d4
        formula: oat - 15
    presets:
      - id: p1
        values:
          fl: 370
          oat: -45
      - id: p2
        values:
          fl: 390
          oat: -56
      - id: p3
        values:
          fl: 360
          oat: -50
    explanation: >-
      The ISA deviation is the OAT minus the ISA temperature at that level. The
      ISA temperature falls by 2 °C per 1 000 ft from 15 °C at sea level up to
      the tropopause at 36 090 ft (about FL360), and stays constant at -56.5 °C
      above it.


      **Solution**


      ISA temperature at FL{{fl}}: {{= max(15 - 0.2 * fl, -56.5)}} °C


      {{f: oat - max(15 - 0.2 * fl, -56.5)}} = {{n: oat - max(15 - 0.2 * fl,
      -56.5)}} = **{{answer}} °C**


      **Why the other answers are wrong**


      - **{{d1}} °C**: sign reversed (ISA temperature minus OAT).

      - **{{d2}} °C**: continued the 2 °C per 1 000 ft lapse rate above the
      tropopause instead of using the constant -56.5 °C.

      - **{{d3}} °C**: both errors combined: lapse rate continued above the
      tropopause and sign reversed.

      - **{{d4}} °C**: compared the OAT with the sea-level ISA temperature of 15
      °C.
