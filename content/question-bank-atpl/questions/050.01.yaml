  learningObjectives:
    - 050.01.06.03.03
  template:
    type: calculation
    question: >-
      An aircraft is on an airport with a QFE of {{qfe}} hPa, and the altimeter
      is set to QNH {{set}} hPa.


      - Barometric lapse rate: {{k}} ft/hPa


      What is the altimeter reading on the ground?
    variables:
      - id: qfe
        label: QFE
        unit: hPa
      - id: set
        label: QNH set on the altimeter
        unit: hPa
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: (set - qfe) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (qfe - set) * k
      - id: d2
        formula: "0"
      - id: d3
        formula: set - qfe
      - id: d4
        formula: qfe - set
    presets:
      - id: p1
        values:
          qfe: 1015
          set: 1010
          k: 30
      - id: p2
        values:
          qfe: 1012
          set: 1018
          k: 30
      - id: p3
        values:
          qfe: 1020
          set: 1013
          k: 30
    explanation: >-
      The QFE is the pressure at the airport, while the QNH is the pressure
      reduced to sea level. When the QNH is lower than the QFE, the airport lies
      below mean sea level, and the altimeter set to QNH shows that negative
      elevation.


      **Solution**


      - Elevation: {{f: (set - qfe) * k}} = {{n: (set - qfe) * k}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the right size, but the sign is reversed

      - **{{d2}} ft**: only true when the QFE and the QNH are equal

      - **{{d3}} ft**: forgets to convert the hPa difference into feet

      - **{{d4}} ft**: reverses the sign and forgets the conversion into feet
