- id: QJWPDFLP
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-507776
    - AVEXAM-33933
    - ATPLGS-108980
    - BGS-500134
    - AVEXAM-96580
    - AVEXAM-11514
    - AVEXAM-42686
    - ATPLGS-108946
    - AVEXAM-53133
    - BGS-500152
    - AVEXAM-80692
    - BGS-500123
    - ATPLGS-108979
    - BGS-500135
    - AVEXAM-68325
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: If the QFE at Locarno ({{elev_m}} metres above sea level) is {{qfe}}
      hPa, what is the approximate QNH? Assume {{k}} ft/hPa.
    variables:
      - id: qfe
        label: QFE
        unit: hPa
      - id: elev_m
        label: Aerodrome elevation
        unit: m
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: round((qfe + elev_m * 3.281 / k) / 5) * 5
      unit: hPa
      decimals: 0
    distractors:
      - id: d1
        formula: qfe
      - id: d2
        formula: round((qfe - elev_m * 3.281 / k) / 5) * 5
      - id: d3
        formula: round((qfe + elev_m / k) / 5) * 5
      - id: d4
        formula: round((1013 + elev_m * 3.281 / k) / 5) * 5
    presets:
      - id: p1
        values:
          qfe: 1000
          elev_m: 200
          k: 30
      - id: p2
        values:
          qfe: 985
          elev_m: 350
          k: 30
      - id: p3
        values:
          qfe: 1007
          elev_m: 120
          k: 30
    explanation: >-
      QNH is the aerodrome pressure reduced to sea level, so it is higher than
      the QFE by the aerodrome elevation (in feet) divided by the pressure
      gradient in ft per hPa.


      **Solution**


      Elevation: {{elev_m}} m × 3.281 = {{= elev_m * 3.281}} ft


      Difference: {{= elev_m * 3.281}} / {{k}} = {{= elev_m * 3.281 / k}} hPa


      QNH = {{qfe}} + {{= elev_m * 3.281 / k}} = {{= qfe + elev_m * 3.281 / k}}
      hPa ≈ **{{answer}} hPa**


      **Why the other answers are wrong**


      - **{{d1}} hPa**: the QFE itself, no elevation correction.

      - **{{d2}} hPa**: elevation correction subtracted instead of added.

      - **{{d3}} hPa**: the elevation in metres was used as if it were feet.

      - **{{d4}} hPa**: the standard 1013 hPa was used instead of the QFE.
- id: QJYABNPC
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501881
    - AVEXAM-66775
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: chart
    question: |-
      Calculate the local QNH, given:

      - During descent, Transition Level given by ATC is at FL55
      - True altitude is 6 000 ft
      - Temperature is on average ISA +10ºC

      _(Assume: 30 ft / hPa)_
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 1 021 hPa
        wrongAnswers:
          - 1 029 hPa
          - It is not possible to calculate the local QNH.
          - 1 013 hPa
        explanation: >-
          FL55 is 5 500 ft on the standard setting. Warm air (ISA +10 °C) adds
          about 4 ft per °C per 1 000 ft, which is 10 × 4 × 5.5 = 220 ft.


          The true altitude of 6 000 ft is then 6 000 − 5 500 − 220 = 280 ft
          above the QNH effect, which is about 9 hPa above standard.


          The local QNH is about **1 021 hPa**.
