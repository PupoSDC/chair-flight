          k: 30
      - id: p2
        values:
          fl: 60
          qnh: 1005
          k: 30
      - id: p3
        values:
          fl: 60
          qnh: 1020
          k: 30
    explanation: >-
      The altimeter reads an altitude relative to its setting. When the setting
      is lower than standard, the aircraft reads lower than it really is for the
      same true altitude, so it is higher than the other traffic by the gradient
      for every hPa below 1013 hPa.


      **Solution**


      Setting difference: {{= 1013 - qnh}} hPa


      {{f: (1013 - qnh) * k}} = {{n: (1013 - qnh) * k}} = **{{answer}} ft**


      A positive value means the aircraft is higher, a negative value means it
      is lower.


      **Why the other answers are wrong**


      - **{{d1}} ft**: the sign is reversed, so the aircraft is shown as lower.

      - **{{d2}} ft**: a gradient of 27 ft per hPa is used instead of 30.

      - **{{d3}} ft**: the gradient in ft per hPa is forgotten.

      - **{{d4}} ft**: no difference is assumed.
- id: QGQGGRSW
  docId: "050.01"
  relatedQuestions:
    - Q0REOBXGF
  externalIds:
    - ATPLQ-508469
    - AVEXAM-43339
    - ATPLQ-508687
    - ATPLQ-507892
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: |-
      Determine the true altitude of the aircraft, given:

      - Indicated altitude: {{ind}} ft
      - Temperature: ISA {{isa_dev}} °C (negative = colder than ISA)

      What is the true altitude (ft)?
    variables:
      - id: ind
        label: Indicated altitude
        unit: ft
      - id: isa_dev
        label: ISA deviation
        unit: °C
    answer:
      formula: ind * (1 + 0.004 * isa_dev)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ind * (1 - 0.004 * isa_dev)
      - id: d2
        formula: ind * (1 + 0.0004 * isa_dev)
      - id: d3
        formula: ind / (1 + 0.004 * isa_dev)
      - id: d4
        formula: ind
    presets:
      - id: p1
        values:
          ind: 4500
          isa_dev: 23
      - id: p2
        values:
          ind: 4000
          isa_dev: -15
      - id: p3
        values:
          ind: 2500
          isa_dev: 21
    explanation: >-
      Indicated altitude is only an approximation of true altitude when the air
      is not in ISA conditions. Air warmer than ISA makes the true altitude
      higher than indicated, and colder air makes it lower. The correction is
      about 0.4 % of the indicated altitude per degree of ISA deviation.


      **Solution**


      Correction factor: 1 + 0.004 x ({{isa_dev}}) = {{= 1 + 0.004 * isa_dev}}


      True altitude: {{f: ind * (1 + 0.004 * isa_dev)}} = {{n: ind * (1 + 0.004
      * isa_dev)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the sign of the correction is reversed.

      - **{{d2}} ft**: 0.0004 is used instead of 0.004, a decimal point slip.

      - **{{d3}} ft**: the indicated altitude is divided by the correction
      factor instead of multiplied.

      - **{{d4}} ft**: no temperature correction is applied.
