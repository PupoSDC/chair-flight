- id: QUDCBRWL
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-502161
    - AVEXAM-83148
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: "An aircraft is in level flight at FL{{fl}} over a mountain range,
      which extends up to {{obs_m}} metres AMSL. Determine the approximate
      terrain clearance, if the regional QNH is {{qnh}} hPa. (Barometric lapse
      rate: {{k}} ft/hPa)"
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: obs_m
        label: Mountain elevation
        unit: m
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: round((fl * 100 - (1013 - qnh) * k - obs_m * 3.281) / 100) * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round((fl * 100 + (1013 - qnh) * k - obs_m * 3.281) / 100) * 100
      - id: d2
        formula: round((fl * 100 - obs_m * 3.281) / 100) * 100
      - id: d3
        formula: round((fl * 100 - (1013 - qnh) * k - obs_m) / 100) * 100
      - id: d4
        formula: round((fl * 100 - (1013 - qnh) * k - obs_m / 3.281) / 100) * 100
    presets:
      - id: p1
        values:
          fl: 100
          obs_m: 2400
          qnh: 998
          k: 30
      - id: p2
        values:
          fl: 90
          obs_m: 1800
          qnh: 1003
          k: 30
      - id: p3
        values:
          fl: 110
          obs_m: 2900
          qnh: 1008
          k: 30
    explanation: >-
      At a flight level the altimeter reads pressure altitude (1013 hPa). With a
      QNH lower than 1013 hPa the true altitude is lower than the flight level:
      subtract (1013 - QNH) × ft per hPa. The clearance is the true altitude
      minus the terrain elevation, converted from metres to feet (1 m = 3.281
      ft).


      **Solution**


      True altitude: {{= fl * 100}} - {{= (1013 - qnh) * k}} = {{= fl * 100 -
      (1013 - qnh) * k}} ft


      Terrain elevation: {{obs_m}} m × 3.281 = {{= obs_m * 3.281}} ft


      Clearance: {{= fl * 100 - (1013 - qnh) * k}} - {{= obs_m * 3.281}} ≈
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: QNH correction applied with the wrong sign.

      - **{{d2}} ft**: QNH correction forgotten (flight level taken as true
      altitude).

      - **{{d3}} ft**: terrain elevation in metres subtracted as if it were
      feet.

      - **{{d4}} ft**: metres converted to feet by dividing instead of
      multiplying by 3.281.
