- id: QWZBOVVU
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-505206
    - AVEXAM-28680
  annexes: []
  learningObjectives:
    - 050.01.06.01.02
    - 050.01.06.03.02
  template:
    type: calculation
    question: >-
      Over Caen Airport in France the transition altitude is {{ta}} ft and the
      transition level is FL{{tl}}. The QNH on the airfield is {{qnh}} hPa.


      What is the vertical extent of the transition layer (ft)? Assume 1 hPa =
      40 ft and use the standard setting of 1013 hPa.
    variables:
      - id: ta
        label: Transition altitude
        unit: ft
      - id: tl
        label: Transition level
        unit: FL
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: tl * 100 - ta + (qnh - 1013) * 40
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: tl * 100 - ta
      - id: d2
        formula: tl * 100 - ta - (qnh - 1013) * 40
      - id: d3
        formula: tl * 100 - ta + (qnh - 1013) * 30
      - id: d4
        formula: tl * 100 - ta + (qnh - 1013.25) * 40
    presets:
      - id: p1
        values:
          ta: 13000
          tl: 150
          qnh: 1003
      - id: p2
        values:
          ta: 5000
          tl: 70
          qnh: 1020
      - id: p3
        values:
          ta: 3000
          tl: 60
          qnh: 1008
    explanation: >-
      The transition altitude is an altitude, set with the QNH. The transition
      level is a flight level, set with the standard setting. To find the
      thickness of the layer, the transition level is converted to an altitude
      using the QNH and the difference to the transition altitude is taken.


      **Solution**


      Transition level as altitude: {{f: tl * 100 + (qnh - 1013) * 40}} = {{n:
      tl * 100 + (qnh - 1013) * 40}} = {{= tl * 100 + (qnh - 1013) * 40}} ft


      Transition layer: {{= tl * 100 + (qnh - 1013) * 40}} - {{ta}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the QNH correction is forgotten.

      - **{{d2}} ft**: the sign of the QNH correction is reversed.

      - **{{d3}} ft**: 30 ft per hPa is used instead of 40 ft per hPa.

      - **{{d4}} ft**: 1013.25 hPa is used as the standard setting instead of
      1013 hPa.
