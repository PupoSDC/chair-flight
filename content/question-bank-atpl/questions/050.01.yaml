- id: QPSBEMNL
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-508726
  annexes: []
  learningObjectives:
    - 050.01.06.03.04
  template:
    type: calculation
    question: "The temperature at FL{{fl_low}} is {{t_low}} °C and at FL{{fl_high}}
      it is {{t_high}} °C. The height difference is:"
    variables:
      - id: fl_low
        label: Lower flight level
        unit: FL
      - id: fl_high
        label: Upper flight level
        unit: FL
      - id: t_low
        label: Temperature at lower level
        unit: °C
      - id: t_high
        label: Temperature at upper level
        unit: °C
    answer:
      formula: (fl_high - fl_low) * 100 * (1 + ((t_low + t_high) / 2 - (15 - 0.1 *
        (fl_low + fl_high))) / 250)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (fl_high - fl_low) * 100
      - id: d2
        formula: (fl_high - fl_low) * 100 * (1 - ((t_low + t_high) / 2 - (15 - 0.1 *
          (fl_low + fl_high))) / 250)
      - id: d3
        formula: (fl_high - fl_low) * 100 * (1 + ((t_low + t_high) / 2 - (15 - 0.1 *
          (fl_low + fl_high))) / 100)
      - id: d4
        formula: (fl_high - fl_low) * 100 * (1 + ((t_low + t_high) / 2) / 250)
    presets:
      - id: p1
        values:
          fl_low: 50
          fl_high: 70
          t_low: 0
          t_high: -4
      - id: p2
        values:
          fl_low: 80
          fl_high: 100
          t_low: -6
          t_high: -12
      - id: p3
        values:
          fl_low: 100
          fl_high: 120
          t_low: -15
          t_high: -18
    explanation: >-
      The distance between two pressure levels depends on the mean temperature
      of the layer: a colder layer is thinner, a warmer layer thicker. Compare
      the mean layer temperature with the ISA temperature at the middle of the
      layer, and correct the ISA thickness by about 1/250 (0.4 %) per °C of
      deviation.


      **Solution**


      ISA thickness: {{= (fl_high - fl_low) * 100}} ft


      Mean temperature: {{= (t_low + t_high) / 2}} °C; ISA at mid-layer: {{= 15
      - 0.1 * (fl_low + fl_high)}} °C; ISA deviation: **{{= (t_low + t_high) / 2
      - (15 - 0.1 * (fl_low + fl_high))}} °C**


      {{= (fl_high - fl_low) * 100}} × (1 + {{= (t_low + t_high) / 2 - (15 - 0.1
      * (fl_low + fl_high))}} / 250) = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: no temperature correction, the ISA thickness of the
      layer.

      - **{{d2}} ft**: temperature correction applied with the wrong sign (a
      cold layer made thicker).

      - **{{d3}} ft**: deviation divided by 100 instead of 250.

      - **{{d4}} ft**: the mean temperature itself was used as if it were the
      ISA deviation.
