          qnh_b: 983
          lapse: 30
      - id: p2
        values:
          ind: 5000
          setting: 1013
          elev_b: 500
          qnh_b: 1005
          lapse: 30
    explanation: >-
      An altimeter reads higher than the true altitude when its setting is above
      the local QNH, and lower when it is below. The indicated altitude is
      therefore first corrected for the difference between the setting and the
      QNH at B, and then the surface elevation at B is subtracted.


      **Solution**


      True altitude above mean sea level: {{= ind - lapse * (setting - qnh_b)}}
      ft


      Height above the surface: {{f: ind - lapse * (setting - qnh_b) - elev_b}}
      = {{n: ind - lapse * (setting - qnh_b) - elev_b}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the setting error is ignored.

      - **{{d2}} ft**: the setting correction has the wrong sign.

      - **{{d3}} ft**: the surface elevation is not subtracted.

      - **{{d4}} ft**: the surface elevation is added instead of subtracted.
