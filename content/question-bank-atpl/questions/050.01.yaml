- id: QEYQRDRQ
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-502220
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: An aeroplane flies at a pressure altitude of {{pa}} ft and its
      altimeter indicates {{ind}} ft (no instrument error). The temperature is
      ISA {{isa_dev}} °C. Calculate the true altitude (ft).
    variables:
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: ind
        label: Indicated altitude
        unit: ft
      - id: isa_dev
        label: Temperature deviation from ISA
        unit: °C
    answer:
      formula: ind * (1 + 0.004 * isa_dev)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ind * (1 - 0.004 * isa_dev)
      - id: d2
        formula: pa * (1 + 0.004 * isa_dev)
      - id: d3
        formula: ind * (1 + 0.0004 * isa_dev)
      - id: d4
        formula: ind
    presets:
      - id: p1
        values:
          pa: 10000
          ind: 9500
          isa_dev: -10
      - id: p2
        values:
          pa: 8000
          ind: 6000
          isa_dev: 15
      - id: p3
        values:
          pa: 14000
          ind: 12000
          isa_dev: -25
    explanation: >-
      The indicated altitude is corrected for the temperature deviation from ISA
      by about 0.4 % of the indicated altitude per degree. In air colder than
      ISA (negative deviation) the true altitude is lower than the indicated
      altitude.


      **Solution**


      Correction factor: 1 + 0.004 × ({{isa_dev}}) = {{= 1 + 0.004 * isa_dev}}


      True altitude: {{f: ind * (1 + 0.004 * isa_dev)}} = {{n: ind * (1 + 0.004
      * isa_dev)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: sign of the correction reversed.

      - **{{d2}} ft**: pressure altitude used instead of the indicated altitude.

      - **{{d3}} ft**: correction factor 0.0004 instead of 0.004 (decimal slip).

      - **{{d4}} ft**: no temperature correction applied.
