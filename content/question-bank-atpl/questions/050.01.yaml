- id: QQNMQRCD
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-509691
  annexes: []
  learningObjectives:
    - 050.01.06.03.02
  template:
    type: calculation
    question: >-
      An aircraft is cleared to descend to {{alt}} ft. During the descent the
      pilot forgets to reset the altimeter from standard (1013 hPa) to the local
      QNH of {{qnh}} hPa at the transition level. The aircraft levels off at
      {{alt}} ft indicated. (Barometric lapse rate: {{k}} ft/hPa.)


      By how many feet is the aircraft above other traffic correctly flying
      {{alt}} ft on QNH?
    variables:
      - id: alt
        label: Cleared altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: (qnh - 1013) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: qnh - 1013
      - id: d2
        formula: (qnh - 1000) * k
      - id: d3
        formula: (qnh - 1013) * k * 3.28084
      - id: d4
        formula: (qnh - 1013) * k * 2
    presets:
      - id: p1
        values:
          alt: 4000
          qnh: 1030
          k: 30
      - id: p2
        values:
          alt: 5000
          qnh: 1025
          k: 30
      - id: p3
        values:
          alt: 3000
          qnh: 1038
          k: 30
    explanation: >-
      With 1013 hPa set while QNH is higher, the altimeter reads lower than it
      would on QNH at the same real height. To show the cleared altitude the
      aircraft therefore sits higher than traffic that flies the same altitude
      on the correct QNH. The difference is the pressure difference times the
      gradient.


      **Solution**


      {{f: (qnh - 1013) * k}} = {{n: (qnh - 1013) * k}} = **{{answer}} ft**
      above


      **Why the other answers are wrong**


      - **{{d1}} ft**: the pressure difference in hPa was not converted to feet.

      - **{{d2}} ft**: the difference was taken from 1000 hPa instead of 1013
      hPa.

      - **{{d3}} ft**: an unnecessary feet conversion factor was applied.

      - **{{d4}} ft**: the difference was doubled.
