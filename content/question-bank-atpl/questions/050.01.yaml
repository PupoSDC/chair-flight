  template:
    type: calculation
    question: >-
      After landing at an aerodrome the altimeter subscale has not been
      corrected to the local QNH.


      - QNH: {{qnh}} hPa

      - Altimeter subscale setting: {{set}} hPa

      - Altimeter reading on the ground: {{indicated}} ft

      - Barometric lapse rate: {{k}} ft/hPa


      What is the elevation of the aerodrome above mean sea level?
    variables:
      - id: qnh
        label: Correct QNH
        unit: hPa
      - id: set
        label: Subscale setting
        unit: hPa
      - id: indicated
        label: Altimeter reading
        unit: ft
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: indicated - (set - qnh) * k
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: indicated
      - id: d2
        formula: indicated + (set - qnh) * k
      - id: d3
        formula: (set - qnh) * k
      - id: d4
        formula: indicated - (set - qnh)
    presets:
      - id: p1
        values:
          qnh: 993
          set: 1013.2
          indicated: 1200
          k: 30
      - id: p2
        values:
          qnh: 1005
          set: 1013
          indicated: 2500
          k: 30
      - id: p3
        values:
          qnh: 1010
          set: 1013
          indicated: 800
          k: 30
    explanation: >-
      When the altimeter subscale is set to a pressure other than the QNH, the
      altimeter reads a height above the level of that setting. Each hPa of
      difference moves the reading by {{k}} ft, so the subscale error has to be
      removed from the reading to find the elevation.


      **Solution**


      - Subscale error: {{f: set - qnh}} = {{= set - qnh}} hPa

      - Elevation: {{f: indicated - (set - qnh) * k}} = {{n: indicated - (set -
      qnh) * k}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: uses the altimeter reading without correcting for the
      subscale error

      - **{{d2}} ft**: adds the subscale error instead of removing it

      - **{{d3}} ft**: gives only the subscale error and ignores the reading

      - **{{d4}} ft**: subtracts the hPa difference without converting it to
      feet
- id: QOWNLWHJ
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501766
    - AVEXAM-72376
    - BGS-502077
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      Determine the lowest flight level which is safe to fly, providing at least
      {{clr}} ft clearance.


      - Maximum ground elevation: {{elev}} ft

      - Height of obstacle above maximum ground elevation: {{obs_h}} ft

      - Meteorological information from a station close to sea level: QNH
      {{qnh}} hPa, temperature {{temp}} °C


      Assume 1 hPa = {{k}} ft.
    variables:
      - id: elev
        label: Maximum ground elevation
        unit: ft
      - id: obs_h
        label: Obstacle height above ground
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: temp
        label: Station temperature
        unit: °C
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ceil(((elev + obs_h + clr) * (1 - (temp - 15) / 250) + (1013 - qnh) *
        k) / 500) * 5
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(((elev + obs_h + clr) * (1 + (temp - 15) / 250) + (1013 - qnh) *
          k) / 500) * 5
      - id: d2
        formula: ceil(((elev + obs_h + clr) * (1 - (temp - 15) / 250) - (1013 - qnh) *
          k) / 500) * 5
      - id: d3
        formula: ceil(((elev + obs_h) * (1 - (temp - 15) / 250) + (1013 - qnh) * k) /
          500) * 5
      - id: d4
        formula: ceil(((elev + clr) * (1 - (temp - 15) / 250) + (1013 - qnh) * k) / 500)
          * 5
    presets:
      - id: p1
        values:
          elev: 2852
          obs_h: 385
          clr: 1000
          qnh: 1038
          temp: 36
          k: 30
      - id: p2
        values:
          elev: 3500
          obs_h: 300
          clr: 1000
          qnh: 1030
          temp: 30
          k: 30
      - id: p3
        values:
          elev: 4000
          obs_h: 450
          clr: 1000
          qnh: 1028
          temp: 25
          k: 30
    explanation: >-
      The top of the obstacle is the maximum ground elevation plus the obstacle
      height, and adding the required clearance gives the minimum true altitude.
      In warm air the altimeter reads low, so less indicated altitude is needed
      (about 1/250 per degree of ISA deviation). A QNH above 1013 hPa means the
      1013 hPa level is lower, so that correction is negative. The result is
      rounded up to the next flight level that is a multiple of 5.


      **Solution**


      Corrected altitude: {{= (elev + obs_h + clr) * (1 - (temp - 15) / 250) +
      (1013 - qnh) * k}} ft


      Divided by 500 ft and rounded up, then multiplied by 5: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: the temperature correction has the wrong sign.

      - **FL{{d2}}**: the pressure correction has the wrong sign.

      - **FL{{d3}}**: the clearance is forgotten.

      - **FL{{d4}}**: the obstacle height above the ground is forgotten.
