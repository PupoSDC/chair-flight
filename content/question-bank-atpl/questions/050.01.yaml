- id: QPOWEHIF
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-509243
    - ATPLGS-127941
    - AVEXAM-37161
  annexes: []
  learningObjectives:
    - 050.01.06.03.06
  template:
    type: calculation
    question: >-
      You are flying over the sea at a pressure altitude of {{alt}} ft
      (altimeter set to 1013 hPa) and measure an outside air temperature of
      {{oat}} °C.


      - ISA temperature at this level: {{isa}} °C

      - Sea level pressure (QNH): {{qnh}} hPa

      - Barometric lapse rate: {{k}} ft/hPa


      What is your approximate true altitude AMSL?
    variables:
      - id: alt
        label: Pressure altitude
        unit: ft
      - id: oat
        label: Outside air temperature
        unit: °C
      - id: isa
        label: ISA temperature
        unit: °C
      - id: qnh
        label: QNH
        unit: hPa
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: alt + (qnh - 1013) * k + (oat - isa) * 4 * alt / 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt + (qnh - 1013) * k
      - id: d2
        formula: alt - (qnh - 1013) * k + (oat - isa) * 4 * alt / 1000
      - id: d3
        formula: alt + (qnh - 1013) * k - (oat - isa) * 4 * alt / 1000
      - id: d4
        formula: alt - (qnh - 1013) * k - (oat - isa) * 4 * alt / 1000
    presets:
      - id: p1
        values:
          alt: 25000
          oat: -50
          isa: -34.5
          qnh: 1023
          k: 30
      - id: p2
        values:
          alt: 30000
          oat: -55
          isa: -44.4
          qnh: 1005
          k: 30
      - id: p3
        values:
          alt: 20000
          oat: -30
          isa: -24.6
          qnh: 1018
          k: 30
    explanation: >-
      A sea level pressure above the standard 1013 hPa means the altimeter, set
      to 1013 hPa, reads too low. Air colder than ISA means the true altitude is
      lower than the indicated altitude. Both corrections are applied to the
      pressure altitude.


      **Solution**


      - Pressure correction: {{f: (qnh - 1013) * k}} = {{= (qnh - 1013) * k}} ft

      - Temperature correction: {{f: (oat - isa) * 4 * alt / 1000}} = {{= (oat -
      isa) * 4 * alt / 1000}} ft

      - True altitude: {{f: alt + (qnh - 1013) * k + (oat - isa) * 4 * alt /
      1000}} = {{n: alt + (qnh - 1013) * k + (oat - isa) * 4 * alt / 1000}} =
      **{{answer}} ft AMSL**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the temperature correction

      - **{{d2}} ft**: applies the pressure correction with the wrong sign

      - **{{d3}} ft**: applies the temperature correction with the wrong sign

      - **{{d4}} ft**: applies both corrections with the wrong sign
