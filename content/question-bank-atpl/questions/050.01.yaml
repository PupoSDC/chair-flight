- id: QMGL3AYMC
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-506798
    - BGS-500129
    - BGS-500138
    - AVEXAM-39168
    - ATPLGS-108886
    - ATPLQ-505826
    - AVEXAM-64349
  annexes: []
  learningObjectives:
    - 050.01.06.03.04
  template:
    type: calculation
    question: >-
      You intend to fly across a mountain range. The chart recommends a minimum
      altitude of {{alt}} ft above mean sea level. The air mass is on average
      {{dt}}°C warmer than ISA. The altimeter is set to {{qnh}} hPa (QNH of a
      nearby airport at nearly sea level).


      What will the altimeter read when you are at the recommended minimum
      altitude?
    variables:
      - id: alt
        label: Minimum altitude
        unit: ft
      - id: dt
        label: ISA deviation
        unit: °C
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: alt - 4 * dt * alt / 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: alt + 4 * dt * alt / 1000
      - id: d2
        formula: alt - (qnh - 1013) * 30
      - id: d3
        formula: alt + (qnh - 1013) * 30
      - id: d4
        formula: alt
    presets:
      - id: p1
        values:
          alt: 12000
          dt: 10
          qnh: 1023
      - id: p2
        values:
          alt: 15000
          dt: 15
          qnh: 1023
      - id: p3
        values:
          alt: 10000
          dt: 20
          qnh: 1008
    explanation: >-
      In air warmer than ISA the pressure levels are stretched, so the true
      altitude is higher than the indicated altitude by about 4 ft per 1000 ft
      per °C of deviation. To be at a given true altitude, the altimeter must
      therefore read less. The QNH is set for a nearly sea-level airport, so no
      pressure correction is needed.


      **Solution**


      Correction = 4 ft x {{dt}} x {{= alt / 1000}} = {{= 4 * dt * alt / 1000}}
      ft


      {{f: alt - 4 * dt * alt / 1000}} = {{n: alt - 4 * dt * alt / 1000}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the temperature correction was added instead of
      subtracted (that is the correction for cold air).

      - **{{d2}} ft**: a QNH correction was applied although the QNH is already
      set and the airport is at sea level.

      - **{{d3}} ft**: a QNH correction was applied with the wrong sign.

      - **{{d4}} ft**: no temperature correction was applied.
