- id: QESUHENA
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-509997
    - AVEXAM-83749
    - ATPLGS-108887
    - AVEXAM-25383
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: "An aircraft flying at FL{{fl}} (OAT {{oat}} °C) obtains a reading of
      {{radio}} ft on its radio altimeter (ground elevation {{elev}} ft). What
      is the value of the QNH, to the nearest hPa, at that point? (Barometric
      lapse rate: {{k}} ft/hPa)"
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: oat
        label: OAT
        unit: °C
      - id: radio
        label: Radio altimeter reading
        unit: ft
      - id: elev
        label: Ground elevation
        unit: ft
      - id: k
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: 1013 + (radio + elev - fl * 100) / k
      unit: hPa
      decimals: 0
    distractors:
      - id: d1
        formula: 1013 - (radio + elev - fl * 100) / k
      - id: d2
        formula: "1013"
      - id: d3
        formula: 1013 + (elev - fl * 100) / k
      - id: d4
        formula: 1013 + (radio - fl * 100) / k
    presets:
      - id: p1
        values:
          fl: 45
          oat: 6
          radio: 1860
          elev: 3090
          k: 30
      - id: p2
        values:
          fl: 60
          oat: 3
          radio: 2500
          elev: 3800
          k: 30
      - id: p3
        values:
          fl: 80
          oat: -1
          radio: 1200
          elev: 7000
          k: 30
    explanation: >-
      The radio altimeter gives the height above the ground, so the true
      altitude is the radio altimeter reading plus the ground elevation. The OAT
      equals the ISA temperature at this level, so no temperature correction is
      needed. The flight level is the pressure altitude (1013 hPa). If the true
      altitude is higher than the pressure altitude the QNH is higher than 1013
      hPa, by the difference divided by the gradient.


      **Solution**


      True altitude: {{radio}} + {{elev}} = {{= radio + elev}} ft


      Pressure altitude: FL{{fl}} = {{= fl * 100}} ft


      {{f: 1013 + (radio + elev - fl * 100) / k}} = {{n: 1013 + (radio + elev -
      fl * 100) / k}} = **{{answer}} hPa**


      **Why the other answers are wrong**


      - **{{d1}} hPa**: the difference between true and pressure altitude was
      subtracted instead of added.

      - **{{d2}} hPa**: standard pressure, no correction.

      - **{{d3}} hPa**: the ground elevation alone was taken as the true
      altitude (radio altimeter reading forgotten).

      - **{{d4}} hPa**: the radio altimeter reading alone was taken as the true
      altitude (ground elevation forgotten).
