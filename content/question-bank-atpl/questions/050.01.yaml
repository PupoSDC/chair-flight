  template:
    type: calculation
    question: >-
      An aircraft maintains a constant indicated altitude of {{ind}} ft from
      point A to point B. The altimeter subscale setting remains unchanged at
      {{setting}} hPa. At point B the surface elevation is {{elev_b}} ft AMSL
      and the local QNH is {{qnh_b}} hPa. Barometric lapse rate: {{lapse}}
      ft/hPa.


