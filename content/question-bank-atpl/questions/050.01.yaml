- id: QKMVYKNZ
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-504258
    - AVEXAM-77129
    - BGS-500166
    - AVEXAM-50272
    - ATPLGS-108959
    - BGS-500132
    - AVEXAM-63046
    - ATPLGS-625943
    - AVEXAM-66032
    - ATPLGS-624965
    - BGS-500167
    - BGS-500163
    - ATPLQ-505011
    - ATPLQ-502754
  annexes: []
  learningObjectives:
    - 050.01.06.03.01
  template:
    type: calculation
    question: >-
      An aircraft maintains a constant indicated altitude of {{ind}} ft from
      point A to point B.


      The altimeter subscale setting remains unchanged at {{setting}} hPa.


      At point B the surface elevation is {{elev_b}} ft AMSL and the local QNH
      is {{qnh_b}} hPa.


      Barometric lapse rate: {{lapse}} ft/hPa.


      What is the height of the aircraft above the surface at point B (ft)?
    variables:
      - id: ind
        label: Indicated altitude
        unit: ft
      - id: setting
        label: Altimeter subscale setting
        unit: hPa
      - id: qnh_b
        label: QNH at point B
        unit: hPa
      - id: elev_b
        label: Surface elevation at B
        unit: ft AMSL
      - id: lapse
        label: Barometric lapse rate
        unit: ft/hPa
    answer:
      formula: ind + (qnh_b - setting) * lapse - elev_b
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ind - elev_b
      - id: d2
        formula: ind - (qnh_b - setting) * lapse - elev_b
      - id: d3
        formula: ind + (qnh_b - setting) * lapse
      - id: d4
        formula: ind + (qnh_b - setting) * lapse + elev_b
    presets:
      - id: p1
        values:
          ind: 4500
          setting: 986
          qnh_b: 1011
          elev_b: 690
          lapse: 30
      - id: p2
        values:
          ind: 6500
          setting: 1012
          qnh_b: 977
          elev_b: 930
          lapse: 30
      - id: p3
        values:
          ind: 5500
          setting: 968
          qnh_b: 1016
          elev_b: 650
          lapse: 30
    explanation: >-
      At point B the altimeter still uses the unchanged subscale setting, so the
      indicated altitude differs from the QNH-based altitude by the pressure
      difference (QNH at B minus setting) times the lapse rate. The height above
      the surface is the corrected altitude minus the surface elevation.


      **Solution**


      Subscale correction: ({{qnh_b}} − {{setting}}) hPa × {{lapse}} ft/hPa =
      {{= (qnh_b - setting) * lapse}} ft


      Height above surface: {{f: ind + (qnh_b - setting) * lapse - elev_b}} =
      {{n: ind + (qnh_b - setting) * lapse - elev_b}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: subscale correction forgotten.

      - **{{d2}} ft**: sign of the subscale correction reversed.

      - **{{d3}} ft**: surface elevation not subtracted.

      - **{{d4}} ft**: surface elevation added instead of subtracted.
- id: QKOA11IN6
  docId: "050.01"
  relatedQuestions: []
  externalIds:
