- id: QRSHRUAZ
  docId: "050.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-501970
  annexes: []
  learningObjectives:
    - 050.01.06.03.07
  template:
    type: calculation
    question: >-
      In a mountainous area a minimum safe altitude (MSA) of {{msa}} ft is
      given. The QNH from an airport in the vicinity, elevation 0 ft, is {{qnh}}
      hPa, and the temperature at FL100 is {{temp}} °C.


      Determine the lowest usable flight level (give the number, e.g. 100 for
      FL100). The ISA temperature at FL100 is -5 °C. (Assume {{k}} ft per hPa,
      and a temperature correction of 4 ft per °C of ISA deviation per 1000 ft
      of height.)
    variables:
      - id: msa
        label: Minimum safe altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: temp
        label: Temperature at FL100
        unit: °C
      - id: k
        label: Pressure gradient
        unit: ft/hPa
    answer:
      formula: ceil((msa + (1013 - qnh) * k + 0.004 * (-5 - temp) * msa) / 1000) * 10
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(msa / 1000) * 10
      - id: d2
        formula: ceil((msa + (1013 - qnh) * k) / 1000) * 10
      - id: d3
        formula: ceil((msa + (1013 - qnh) * k + 0.004 * (-5 - temp) * msa + 1000) /
          1000) * 10
      - id: d4
        formula: ceil(msa * 1.5 / 1000) * 10
    presets:
      - id: p1
        values:
          msa: 8000
          qnh: 990
          temp: -24
          k: 30
      - id: p2
        values:
          msa: 8500
          qnh: 985
          temp: -28
          k: 30
    explanation: >-
      The flight level must give the required altitude on the local QNH and in
      the cold air. A QNH below 1013 hPa raises the altitude needed, and cold
      air lowers the real altitude of a pressure level, so a margin is added.
      The result is rounded up to the next 1000 ft and written as a flight
      level.


      **Solution**


      QNH correction: {{= (1013 - qnh) * k}} ft


      Temperature correction: {{= 0.004 * (-5 - temp) * msa}} ft


      Required altitude: {{= msa + (1013 - qnh) * k + 0.004 * (-5 - temp) *
      msa}} ft, rounded up to the next 1000 ft: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: only the MSA is used, without the QNH and temperature
      corrections.

      - **FL{{d2}}**: the temperature correction is forgotten.

      - **FL{{d3}}**: an extra 1000 ft margin is added.

      - **FL{{d4}}**: the MSA is multiplied by 1.5 instead of applying the
      corrections.
