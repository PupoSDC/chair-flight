  template:
    type: definition
    question: What is ICAO Annex {term} about?
    explanation: >
      The table below contains all annexes + a mnemonic to remember them. Not 

      all mnemonics make a lot of sense, but they are all so particular it
      should

      help you not mix up the annexes.


      | No. | Content                                           |
      Mnemonic                                             |

      | --- | ------------------------------------------------- |
      ----------------------------------------------------- |

      | 1   | Personnel Licensing                               | Getting your
      License is priority number 1             |

      | 2   | Rules of the Air                                  | 2 Rules of the
      Air: VFR, IFR                          |

      | 3   | Meteorological Services                           | 3º
      SALR                                               |

      | 4   | Aeronautical Charts                               | 4 Cardinal
      points (North, South, East, West)          |

      | 5   | Units of Measurement                              | 5 ft long
      stick                                       |

      | 6   | Operation of Aircraft                             | DC6 a very
      hard aircraft to operate                   |

      | 7   | Aircraft Nationality and Registration Marks       | League of the
      7 nations                               |

      | 8   | Airworthiness of Aircraft                         | 8 Looks like a
      propeller                              |

      | 9   | Facilitation                                      | Nein Nein Nein
      - (German) Facilitation                |

      | 10  | Aeronautical Telecommunications                   | Call 100 for
      operator (a British thing apparently)    |

      | 11  | Air Traffic Services                              |
      ???                                                   |

      | 12  | Search and Rescue                                 | The one before
      Friday 13                              |

      | 13  | Aircraft Accident and Incident Investigation      | Friday 13: Bad
      news - Aircraft Accidents              |

      | 14  | Aerodromes                                        | 14 Aerodromes
      around London                           |

      | 15  | Aeronautical Information Services                 | 15 looks like
      IS - (Aeronautica) Information Services |

      | 16  | Environmental Protection                          | You need to be
      over 16 to drink                       |

      | 17  | Security                                          | 17 ft fence
      around airports                           |

      | 18  | The Safe Transportation of Dangerous Goods by Air | You need to be
      over 18 to buy alcohol                 |

      | 19  | Safety Management                                 |
      ???                                                   |
