        text: The forecasts of en-route turbulence issued by the Meteorological Watch
          Office for the FIR are NOT considered reliable because they depend on
          pilots making accurate and timely in-flight reports of turbulence, and
          in practice these reports are subjective and often NOT relevant to
          other aircraft.
        correct: false
        why: ""
      - id: OET3FRTAJ
        text: The most recent forecasts of en-route turbulence on significant weather
          charts are considered to be both reliable and accurate because they
          are modified automatically by pilot in-flight reports relayed via data
          link to the relevant Meteorological Watch Office for the applicable
          FIR.
        correct: false
        why: ""
      - id: OXBRIPSYF
        text: The accurate forecasting of the severity, extent, and levels affected by
          turbulence is based on modelling; because forecast documentation also
          covers a fixed time period it is often NOT reliable, so pilot reports
          of turbulence are of great value.
        correct: true
        why: ""
      - id: O98060A2E
