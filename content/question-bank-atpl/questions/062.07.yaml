          the aircraft's position; the position determined by radio navigation
          will be a measure of the error of the FMS position.
        correct: false
        why: ""
      - id: OCD00IGDQ
        text: Aircraft with a single FMS will compare the FM position with the IRS
          position and will use the difference, if any, to calculate a bias that
          is applied to the FMS position to improve its accuracy.
        correct: false
        why: ""
