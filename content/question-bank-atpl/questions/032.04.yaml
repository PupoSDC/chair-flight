  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Determine the maximum mass that gives the statutory
      clearance over an obstacle following an engine failure in stabilised
      flight (mass read from the figure: {{massread}} kg). Given:


      OAT: ISA +{{isa}}°C

      Engine anti-ice ON

      Obstacle pressure altitude: {{pa}} ft
    variables:
      - id: isa
        label: ISA deviation
        unit: °C
      - id: pa
        label: Obstacle pressure altitude
        unit: ft
      - id: massread
        label: Mass read from the graph
        unit: kg
    chartInputs:
      - massread
    answer:
      formula: massread
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: massread - 1550
      - id: d2
        formula: massread + 2000
      - id: d3
        formula: massread + 400
      - id: d4
        formula: massread - 3750
    presets:
      - id: p1
        values:
          isa: 10
          pa: 17000
          massread: 49250
    explanation: >-
      The net level-off chart gives the maximum mass for which the
      one-engine-inoperative net flight path clears the obstacle altitude at the
      given ISA deviation and anti-ice setting.


      **Solution**


      Enter the chart at {{pa}} ft and ISA +{{isa}}°C, anti-ice ON: **{{answer}}
      kg**.


      **Why the other answers are wrong**


      - **{{d1}} kg**: a mass read from the wrong temperature curve.

      - **{{d2}} kg**: a reading that neglects the anti-ice correction.

      - **{{d3}} kg**: a small misread of the altitude line.

      - **{{d4}} kg**: a mass read at too high an altitude.
