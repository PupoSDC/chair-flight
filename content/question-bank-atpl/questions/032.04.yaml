  learningObjectives:
    - "032.04"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. A pilot considers a rejected take-off on a flooded
      runway. Choose the lowest possible flap setting (in degrees) that avoids
      dynamic hydroplaning (the value read from the figure is {{flapread}}),
      given:


      - Take-off mass: {{mass}} kg

      - Tyre pressure: {{tp}} psi
    variables:
      - id: mass
        label: Take-off mass
        unit: kg
      - id: tp
        label: Tyre pressure
        unit: psi
      - id: flapread
        label: Flap setting read from the graph
        unit: °
    chartInputs:
      - flapread
    answer:
      formula: flapread
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: flapread + 5
      - id: d2
        formula: flapread + 15
      - id: d3
        formula: flapread - 5
      - id: d4
        formula: flapread + 10
    presets:
      - id: p1
        values:
          mass: 70000
          tp: 200
          flapread: 10
    explanation: >-
      The dynamic hydroplaning speed depends on tyre pressure, and the take-off
      speed rises as flaps are reduced. The chart shows the flap setting for
      which the speed stays below hydroplaning.


      **Solution**


      Reading the chart at {{mass}} kg and {{tp}} psi gives flaps
      **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}} °**: the next flap setting, higher than necessary.

      - **{{d2}} °**: a much too high flap setting.

      - **{{d3}} °**: a lower setting, with a hydroplaning speed below the
      rejected take-off speed.

      - **{{d4}} °**: a flap setting two steps too high.
