  template:
    type: calculation
    question: >-
      A four jet-engine aeroplane (mass = {{mass}} kg) is established on climb
      with all engines operating. The lift-to-drag ratio is {{ld}}. Each engine
      has a thrust of {{thrust}} N. (given: g = {{g}} m/s²)


      The gradient of climb is (%):
    variables:
      - id: mass
        label: Mass
        unit: kg
      - id: ld
        label: Lift-to-drag ratio
        unit: ""
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: g
        label: g
        unit: m/s²
    answer:
      formula: 100 * (4 * thrust - mass * g / ld) / (mass * g)
      unit: "%"
      decimals: 2
    distractors:
      - id: d1
        formula: 10 * (4 * thrust - mass * g / ld) / (mass * g)
      - id: d2
        formula: 100 * (3 * thrust - mass * g / ld) / (mass * g)
      - id: d3
        formula: 100 * (4 * thrust / (mass * g) + 1 / ld)
    presets:
      - id: p1
        values:
          mass: 150000
          ld: 14
          thrust: 75000
          g: 10
      - id: p2
        values:
          mass: 120000
          ld: 12
          thrust: 60000
          g: 10
      - id: p3
        values:
          mass: 200000
          ld: 16
          thrust: 90000
          g: 10
    explanation: >-
      In a steady climb the gradient is approximately (Thrust - Drag) / Weight,
      with Drag = Weight / (L/D) and Thrust the sum of all engines.


      **Solution**


      Weight = {{= mass * g}} N, Drag = {{= mass * g / ld}} N


      {{f: 100 * (4 * thrust - mass * g / ld) / (mass * g)}} = {{n: 100 * (4 *
      thrust - mass * g / ld) / (mass * g)}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: converts the ratio to percent with a factor of 10 instead
      of 100.

      - **{{d2}} %**: uses only three engines.

      - **{{d3}} %**: adds the drag term instead of subtracting it.
