    - AVEXAM-15564
  annexes: []
  learningObjectives:
    - 032.04.01.08.04
  template:
    type: calculation
    question: >-
      Choose the maximum take-off mass (MTOM) for the following limiting masses
      established for take-off planning:


      - Field length limit: {{fl}} kg

      - Climb limit: {{cl}} kg

      - Tyre limit: {{ty}} kg

      - Obstacle limit: {{ob}} kg

      - CG limit: {{cg}} kg
    variables:
      - id: fl
        label: Field length limit
        unit: kg
      - id: cl
        label: Climb limit
        unit: kg
      - id: ty
        label: Tyre limit
        unit: kg
      - id: ob
        label: Obstacle limit
        unit: kg
      - id: cg
        label: CG limit
        unit: kg
    answer:
      formula: min(fl, cl, ty, ob, cg)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: max(fl, cl, ty, ob, cg)
      - id: d2
        formula: cg
      - id: d3
        formula: min(fl, ty, ob, cg)
      - id: d4
        formula: (fl + cl) / 2
    presets:
      - id: p1
        values:
          fl: 170000
          cl: 150000
          ty: 190000
          ob: 192000
          cg: 185000
      - id: p2
        values:
          fl: 62000
          cl: 59500
          ty: 66000
          ob: 64000
          cg: 63000
      - id: p3
        values:
          fl: 72000
          cl: 70000
          ty: 77000
          ob: 75500
          cg: 74000
    explanation: >-
      The maximum take-off mass is limited by the most restrictive of all the
      individual limiting masses, so it is their minimum.


      **Solution**


      {{f: min(fl, cl, ty, ob, cg)}} = {{n: min(fl, cl, ty, ob, cg)}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the highest limit instead of the lowest.

      - **{{d2}} kg**: only the CG limit considered.

      - **{{d3}} kg**: the climb limit forgotten.

      - **{{d4}} kg**: the average of the field length and climb limits, which
      is not a limit at all.
