- id: QKRNDCPQI
  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-321270
    - AVEXAM-23133
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: "With a true airspeed of {{tas}} kt and a vertical speed of {{roc}}
      ft/min (no wind), the climb gradient is about (answer in %, 1 NM = 6076
      ft):"
    variables:
      - id: tas
        label: True airspeed
        unit: kt
      - id: roc
        label: Vertical speed
        unit: ft/min
    answer:
      formula: roc / (tas * 6076 / 60) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: atan(roc / (tas * 6076 / 60))
      - id: d2
        formula: roc / (tas * 1852 / 60) * 100
      - id: d3
        formula: roc / (tas * 6076) * 100
      - id: d4
        formula: roc / (tas * 5280 / 60) * 100
    presets:
      - id: p1
        values:
          tas: 194
          roc: 1000
      - id: p2
        values:
          tas: 150
          roc: 700
      - id: p3
        values:
          tas: 250
          roc: 1500
    explanation: >
      The climb gradient is the vertical distance gained divided by the
      horizontal distance flown. Both speeds must be in the same unit, so the
      TAS in knots is converted to ft/min (1 kt = 6076/60 ft/min).


      **Solution**


      Horizontal speed = {{tas}} kt = {{= tas * 6076 / 60}} ft/min


      {{f: roc / (tas * 6076 / 60) * 100}} = {{n: roc / (tas * 6076 / 60) *
      100}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}}**: expresses the gradient as an angle in degrees rather than a
      percentage.

      - **{{d2}} %**: uses 1852 ft per NM (metres) in the unit conversion.

      - **{{d3}} %**: forgets to divide by 60 when converting knots to ft/min.

      - **{{d4}} %**: uses 5280 ft (statute mile) instead of the nautical mile.
