- id: QDHQKMSMM
  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329002
    - ATPLGS-107565
    - AVEXAM-52956
    - AVEXAM-40424
    - BGS-320054
    - ATPLGS-107547
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: >-
      On a segment of the take-off flight path an obstacle requires a minimum
      climb gradient of {{g_req}} % in order to provide an adequate margin of
      safe clearance.


      At a mass of {{m_ref}} kg the climb gradient is {{g_ref}} %.


      For the same power and assuming that the sine of the angle of climb varies
      inversely with mass, at what maximum mass will the aeroplane be able to
      achieve the minimum gradient?


      Give the mass in kg.
    variables:
      - id: g_req
        label: Required gradient
        unit: "%"
      - id: m_ref
        label: Reference mass
        unit: kg
      - id: g_ref
        label: Gradient at reference mass
        unit: "%"
    answer:
      formula: m_ref * sin(atan(g_ref / 100)) / sin(atan(g_req / 100))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: m_ref * g_req / g_ref
      - id: d2
        formula: m_ref + (g_ref - g_req) * 1000
      - id: d3
        formula: m_ref * (g_req / g_ref) ^ 2
      - id: d4
        formula: m_ref * (g_ref + g_req) / g_req
      - id: d5
        formula: m_ref * g_ref / g_req + 5000
    presets:
      - id: p1
        values:
          g_req: 2.6
          m_ref: 110000
          g_ref: 2.8
      - id: p2
        values:
          g_req: 3.2
          m_ref: 60000
          g_ref: 3.6
      - id: p3
        values:
          g_req: 2.4
          m_ref: 75000
          g_ref: 2.9
    explanation: >-
      For the same power, the sine of the climb angle is inversely proportional
      to mass: mass x sin(angle) is constant. The gradient is tan(angle), so the
      angle is found with atan and then its sine is used.


      **Solution**


      Maximum mass = {{f: m_ref * sin(atan(g_ref / 100)) / sin(atan(g_req /
      100))}} = {{n: m_ref * sin(atan(g_ref / 100)) / sin(atan(g_req / 100))}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: inverted ratio (a lower mass would give a higher
      gradient, not a lower one).

      - **{{d2}} kg**: adds the gradient difference linearly instead of using
      the inverse proportionality.

      - **{{d3}} kg**: squares the inverted ratio.

      - **{{d4}} kg**: uses the sum of the gradients in the ratio.

      - **{{d5}} kg**: adds a fixed margin on top of the simple ratio.
