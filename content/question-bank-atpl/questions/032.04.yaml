        explanation: >-
          The air distance in the descent is read from the descent chart in CAP
          697 file 4.5.4A, using the cruise altitude and the estimated landing
          mass, with idle power.


          **Solution**


          - Enter the chart at {{alt}} ft and an estimated landing mass of
          {{mass}} kg, with idle power.

          - The chart gives 94 NM.


          **Why the other answers are wrong**


          - **101 NM** and **99 NM**: values read from a higher altitude or a
          higher mass, which give a longer descent.

          - **88 NM**: a value read from a lower altitude or mass, which gives a
          shorter descent.
