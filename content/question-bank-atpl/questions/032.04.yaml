  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-325321
    - AVEXAM-85372
    - AVEXAM-55972
    - BGS-320761
    - ATPLQ-324528
    - ATPLGS-107564
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: >-
      To determine the Runway Length Limited Take-Off Mass (RLTOM) for an
      unbalanced field, what is the TODA to be used, given:


      - TORA: {{tora}} m

      - Stopway: {{stopway}} m

      - Clearway: {{clearway}} m
    variables:
      - id: tora
        label: TORA
        unit: m
      - id: stopway
        label: Stopway
        unit: m
      - id: clearway
        label: Clearway
        unit: m
    answer:
      formula: tora + min(clearway, 0.5 * tora)
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: tora + stopway
      - id: d2
        formula: tora + stopway + clearway
      - id: d3
        formula: tora + 0.5 * tora
      - id: d4
        formula: tora + clearway / 2
    presets:
      - id: p1
        values:
          tora: 2380
          stopway: 1470
          clearway: 560
      - id: p2
        values:
          tora: 3380
          stopway: 1250
          clearway: 780
      - id: p3
        values:
          tora: 2600
          stopway: 300
          clearway: 400
    explanation: >-
      The take-off distance available (TODA) is the TORA plus the clearway,
      where the clearway counted cannot exceed half of the TORA. The stopway
      does not count for TODA.


      **Solution**


      {{f: tora + min(clearway, 0.5 * tora)}} = {{n: tora + min(clearway, 0.5 *
      tora)}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: this is the ASDA (TORA + stopway), not the TODA.

      - **{{d2}} m**: stopway and clearway were both added.

      - **{{d3}} m**: the clearway limit (half of TORA) was added instead of the
      actual clearway.

      - **{{d4}} m**: only half of the clearway was added.
