  template:
    type: chart
    question: >-
      Refer to the figure. Determine the initial maximum continuous thrust in
      case of an engine failure, given:


      - Cruise: FL350

      - Gross mass: {{mass}} kg

      - Mach number: {{mach}}

      - OAT: {{oat}} °C


      What is the initial maximum continuous thrust?
    explanation: ""
    variables:
      - id: mass
        label: Gross mass
        unit: kg
      - id: mach
        label: Mach number
        unit: ""
      - id: oat
        label: OAT
        unit: °C
    entries:
      - id: e1
        values:
          mass: 55000
          mach: 0.74
          oat: -45
        answer: 98.4% N1
        wrongAnswers:
          - 97.5% N1
          - 95.1% N1
          - 94.5% N1
        explanation: >-
          Maximum continuous thrust is read from the N1 chart for the cruise
          altitude, gross mass, Mach number and temperature. After an engine
          failure, the initial value is the setting the chart gives for these
          conditions.


          **Solution**


          At FL350, a gross mass of {{mass}} kg, Mach {{mach}} and an OAT of
          {{oat}} °C, the chart gives an initial maximum continuous thrust of
          **98.4% N1**.


          **Why the other answers are wrong**


          - **97.5% N1**: a misread of the chart by one grid step.

          - **95.1% N1**: reads the line for a higher temperature.

          - **94.5% N1**: reads the line for a higher gross mass.
