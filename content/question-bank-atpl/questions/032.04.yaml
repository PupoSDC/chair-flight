  template:
    type: chart
    question: >-
      Refer to the figure or CAP 698 file 4.22. During a flight with all engines
      operating, given:


      - Flight level: FL{{fl}}

      - Mach number: {{mach}}

      - Gross mass: {{mass}} kg

      - ISA conditions


      One engine suddenly becomes inoperative. What is the level off altitude?
    explanation: ""
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: mach
        label: Mach number
        unit: ""
      - id: mass
        label: Gross mass
        unit: kg
    entries:
      - id: e1
        values:
          fl: 350
          mach: 0.74
          mass: 55000
        answer: 21900 ft.
        wrongAnswers:
          - 19800 ft.
          - 24800 ft.
          - 20900 ft.
        explanation: >-
          After an engine failure, the aircraft levels off at a lower altitude
          than before. The level off altitude is read from the chart in CAP 698
          file 4.22, using the flight level, the Mach number and the gross mass.


          **Solution**


          - Enter the chart at FL{{fl}}, Mach {{mach}} and a gross mass of
          {{mass}} kg, in ISA.

          - The chart gives a level off altitude of 21900 ft.


          **Why the other answers are wrong**


          - **19800 ft.**: a level off altitude read from a higher gross mass
          line.

          - **24800 ft.**: a level off altitude read from a lower gross mass
          line, which is too high.

          - **20900 ft.**: a value read from a neighbouring line of the chart.
