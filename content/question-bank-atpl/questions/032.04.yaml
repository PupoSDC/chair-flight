  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-321760
    - BGS-320262
    - ATPLGS-625105
    - AVEXAM-81285
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: >-
      Given that the characteristics of a three engined turbojet aeroplane are
      as follows:


      - Thrust = {{thrust}} N per engine

      - g = {{g}} m/s²

      - Drag = {{drag}} N

      - Minimum steady gradient of climb (2nd segment) = {{grad}}%


      sin(angle of climb) = (Thrust - Drag) / Weight


      The Maximum Take-Off Mass under the 2nd segment conditions is (kg):
    variables:
      - id: thrust
        label: Thrust per engine
        unit: N
      - id: g
        label: g
        unit: m/s²
      - id: drag
        label: Drag
        unit: N
      - id: grad
        label: Required gradient
        unit: "%"
    answer:
      formula: (2 * thrust - drag) / (grad / 100) / g
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (3 * thrust - drag) / (grad / 100) / g
      - id: d2
        formula: (2 * thrust - drag) * grad
      - id: d3
        formula: (3 * thrust - drag) * grad
    presets:
      - id: p1
        values:
          thrust: 50000
          g: 10
          drag: 72569
          grad: 2.7
      - id: p2
        values:
          thrust: 60000
          g: 10
          drag: 80000
          grad: 2.7
      - id: p3
        values:
          thrust: 45000
          g: 10
          drag: 60000
          grad: 2.4
    explanation: >-
      The second-segment climb gradient requirement applies with one engine
      inoperative, so only the thrust of the remaining engines is used. With
      sin(angle) = (Thrust - Drag) / Weight, the maximum weight is (Thrust -
      Drag) divided by the gradient, and the mass is the weight divided by g.


      **Solution**


      Thrust (two engines) = {{= 2 * thrust}} N


      {{f: (2 * thrust - drag) / (grad / 100) / g}} = {{n: (2 * thrust - drag) /
      (grad / 100) / g}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the thrust of all three engines instead of two.

      - **{{d2}} kg**: multiplies the excess thrust by the gradient instead of
      dividing, and does not divide by g.

      - **{{d3}} kg**: uses all three engines and multiplies by the gradient
      instead of dividing.
