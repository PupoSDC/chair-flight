- id: Q1XILISDF
  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-324047
    - ATPLGS-625096
    - AVEXAM-7821
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: >-
      The determination of the maximum mass on brake release of an aeroplane
      certified under CS-25, with 5, 15 and 25 degrees flap angles on take-off,
      leads to the following values with zero wind:


      | Flap angle | 5 degrees | 15 degrees | 25 degrees |

      | --- | --- | --- | --- |

      | Runway limitation | {{r5}} kg | {{r15}} kg | {{r25}} kg |

      | 2nd segment climb limitation | {{s5}} kg | {{s15}} kg | {{s25}} kg |


      Wind correction: headwind +120 kg/kt, tailwind -{{corr}} kg/kt (applies to
      the runway limitation).


      Given a tailwind component of {{tw}} kt, what is the maximum mass on brake
      release (choosing the best flap angle)? Give the mass in kg.
    variables:
      - id: r5
        label: Runway limit, flap 5
        unit: kg
      - id: r15
        label: Runway limit, flap 15
        unit: kg
      - id: r25
        label: Runway limit, flap 25
        unit: kg
      - id: s5
        label: 2nd segment limit, flap 5
        unit: kg
      - id: s15
        label: 2nd segment limit, flap 15
        unit: kg
      - id: s25
        label: 2nd segment limit, flap 25
        unit: kg
      - id: corr
        label: Tailwind correction
        unit: kg/kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: max(min(r5 - tw * corr, s5), min(r15 - tw * corr, s15), min(r25 - tw *
        corr, s25))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: max(min(r5, s5), min(r15, s15), min(r25, s25))
      - id: d2
        formula: max(s5, s15, s25)
      - id: d3
        formula: max(r5, r15, r25) - tw * corr
      - id: d4
        formula: max(min(r5 - tw * corr, s5 - tw * corr), min(r15 - tw * corr, s15 - tw
          * corr), min(r25 - tw * corr, s25 - tw * corr))
    presets:
      - id: p1
        values:
          r5: 66000
          r15: 69500
          r25: 71500
          s5: 72200
          s15: 69000
          s25: 61800
          corr: 360
          tw: 5
      - id: p2
        values:
          r5: 66000
          r15: 69500
          r25: 71500
          s5: 72200
          s15: 69000
          s25: 61800
          corr: 360
          tw: 3
      - id: p3
        values:
          r5: 62000
          r15: 65500
          r25: 67500
          s5: 68200
          s15: 65000
          s25: 57800
          corr: 360
          tw: 2
    explanation: >-
      For each flap setting the maximum mass on brake release is the lower of
      the runway limitation and the 2nd segment climb limitation. The tailwind
      correction reduces the runway-limited mass only. The best flap angle is
      the one with the highest resulting mass.


      **Solution**


      Runway limit corrected for wind: flap 5 = {{= r5 - tw * corr}} kg, flap 15
      = {{= r15 - tw * corr}} kg, flap 25 = {{= r25 - tw * corr}} kg


      Maximum mass per flap (lower of the two limits): flap 5 = {{= min(r5 - tw
      * corr, s5)}} kg, flap 15 = {{= min(r15 - tw * corr, s15)}} kg, flap 25 =
      {{= min(r25 - tw * corr, s25)}} kg


      Best value: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: ignores the tailwind correction.

      - **{{d2}} kg**: takes only the 2nd segment limitation and ignores the
      runway limit.

      - **{{d3}} kg**: applies the wind correction to the best runway limit but
      ignores the 2nd segment limit.

      - **{{d4}} kg**: also applies the wind correction to the 2nd segment climb
      limitation.
- id: Q24VGWWAW
  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-322918
    - BGS-320575
    - AVEXAM-68065
    - ATPLGS-627198
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: >-
      A two-engine turbojet has to initiate a turn in the second segment of the
      take-off flight path.


      During the turn there is an obstacle that requires a net climb gradient of
      {{net_obst}}% in order to clear the obstacle.


      The bank angle during the turn is 15° and the flight manual gives a
      decrement for the turn of {{turn_dec}}%.


      Taking into account both the regulation and obstacle clearance, what is
      the minimum gross gradient required before commencing the turn?
    variables:
      - id: net_obst
        label: net gradient required for obstacle
        unit: "%"
      - id: turn_dec
        label: turn decrement
        unit: "%"
    answer:
      formula: max(2.4, net_obst + 0.8) + turn_dec
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: net_obst + 0.8
      - id: d2
        formula: 2.4 + 0.8 + turn_dec
      - id: d3
        formula: 2.4 + turn_dec
      - id: d4
        formula: net_obst + turn_dec
    presets:
      - id: p1
        values:
          net_obst: 2
          turn_dec: 0.5
      - id: p2
        values:
          net_obst: 2.5
          turn_dec: 0.3
      - id: p3
        values:
          net_obst: 2.3
          turn_dec: 0.6
    explanation: >-
      For a two-engine aeroplane the regulatory gross gradient in the second
      segment is 2.4%, and the net gradient is the gross gradient reduced by
      0.8%. The gross gradient needed is therefore the larger of the regulatory
      value (2.4%) and the obstacle requirement (net gradient + 0.8%), and the
      decrement for the turn is added on top.


      **Solution**


      Obstacle: {{= net_obst + 0.8}}% gross is needed, regulation: 2.4% gross,
      so the larger value applies.


      {{f: max(2.4, net_obst + 0.8) + turn_dec}} = {{n: max(2.4, net_obst + 0.8)
      + turn_dec}} = **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: obstacle gradient converted to gross but the turn decrement
      is forgotten.

      - **{{d2}}%**: adds the regulatory 2.4% and the 0.8% net/gross difference
      together, double counting.

      - **{{d3}}%**: uses only the regulatory gradient plus the turn decrement
      and ignores the obstacle requirement.

      - **{{d4}}%**: adds the turn decrement to the net obstacle gradient
      without converting net to gross.
