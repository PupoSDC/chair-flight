    question: >-
      Refer to the figure and the annex. A twin-engine aeroplane is flying at
      {{mach}} Mach at FL{{fl}} in ISA conditions, with N1 at {{n1}} %. Using
      the data in the annex, find the TAS and the specific range at a mass of
      {{mass}} kg and {{mac}} % MAC.


      What are the TAS and the specific range?
