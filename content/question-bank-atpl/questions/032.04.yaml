- id: QS3PGSHWB
  docId: "032.04"
  relatedQuestions: []
  externalIds:
    - ATPLQ-321349
    - ATPLGS-123114
    - BGS-320348
    - AVEXAM-57250
  annexes: []
  learningObjectives:
    - "032.04"
  template:
    type: calculation
    question: >-
      At the destination aerodrome the landing distance available is {{lda}} m.


      The appropriate weather forecast indicates that the runway at the
      estimated time of arrival will be wet.


      For a commercial flight the mass of a turbojet aeroplane at landing must
      be such that the aeroplane can be landed within what distance?
    variables:
      - id: lda
        label: LDA
        unit: m
    answer:
      formula: lda * 0.6 / 1.15
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: lda / 1.15
      - id: d2
        formula: lda * 0.6
      - id: d3
        formula: lda * 0.6 * 1.15
    presets:
      - id: p1
        values:
          lda: 3000
      - id: p2
        values:
          lda: 2600
      - id: p3
        values:
          lda: 3400
    explanation: >-
      For a turbojet aeroplane on a commercial flight the landing distance
      required on a dry runway may not exceed 60% of the landing distance
      available. If the runway is forecast wet, the distance is increased by a
      further 15%, so the usable distance is LDA x 0.6 divided by 1.15.


      **Solution**


      {{f: lda * 0.6 / 1.15}} = {{n: lda * 0.6 / 1.15}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: applies only the wet factor and forgets the 60% dry limit.

      - **{{d2}} m**: applies only the 60% limit and forgets the wet runway
      factor.

      - **{{d3}} m**: multiplies by the wet factor instead of dividing by it.
