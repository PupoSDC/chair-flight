  template:
    type: one-two
    question: You are flying a twin-engined aircraft with an AC electrical system
      fed by two engine driven generators when one generator has a complete
      failure. Which of the following statements is correct in reference to the
      subsequent power distribution.
    explanation: ""
    firstCorrectStatements:
      - In an AC electrical system with a split-bus design, the load from the
        failed generator is automatically taken over by the remaining generator
        through the automatic AC bus-transfer function.
    firstIncorrectStatements:
      - In an AC electrical system with a split-bus design, the load from the
        failed generator is manually taken over by the remaining generator
        through the manual AC bus-transfer function.
    secondCorrectStatements:
      - In an AC electrical system with a parallel bus design, the load from the
        failed generator is not directly taken over by the aircraft's battery
        providing DC electrical power to the bus.
    secondIncorrectStatements:
      - In an AC electrical system with a parallel bus design, the load from the
        failed generator is directly taken over by the aircraft's battery
        providing DC electrical power to the bus.
