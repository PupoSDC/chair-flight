  template:
    type: calculation
    question: "In order to produce an alternating voltage of {{f}} Hz, the number of
      pairs of poles required in an AC generator running at {{rpm}} rpm is:"
    variables:
      - id: f
        label: Frequency
        unit: Hz
      - id: rpm
        label: Generator speed
        unit: rpm
    answer:
      formula: 60 * f / rpm
      unit: pole pairs
      decimals: 0
    distractors:
      - id: d1
        formula: 120 * f / rpm
      - id: d2
        formula: 60 * rpm / f
      - id: d3
        formula: 30 * f / rpm
      - id: d4
        formula: 240 * f / rpm
    presets:
      - id: p1
        values:
          f: 400
          rpm: 6000
      - id: p2
        values:
          f: 400
          rpm: 4000
      - id: p3
        values:
          f: 400
          rpm: 12000
    explanation: >-
      One electrical cycle is produced for each pair of poles passing a stator
      winding. Frequency = pole pairs x rpm / 60, so pole pairs = 60 x frequency
      / rpm.


      **Solution**


      {{f: 60 * f / rpm}} = {{n: 60 * f / rpm}} = **{{answer}} pole pairs**


      **Why the other answers are wrong**

      - **{{d1}} pole pairs**: uses 120 instead of 60, which gives the number of
      poles rather than pole pairs.

      - **{{d2}} pole pairs**: inverts the relationship (rpm over frequency).

      - **{{d3}} pole pairs**: uses 30 instead of 60.

      - **{{d4}} pole pairs**: uses 240 instead of 60.
