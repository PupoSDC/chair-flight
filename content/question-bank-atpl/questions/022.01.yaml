      {{f: bar * 15}} = {{n: bar * 15}} = **{{answer}} psi**


      **Why the other answers are wrong**


      - **{{d1}} psi**: multiplies by 1.5, one power of ten too little.

      - **{{d2}} psi**: multiplies by 0.15, two powers of ten too little.

      - **{{d3}} psi**: multiplies by 0.015, three powers of ten too little.
