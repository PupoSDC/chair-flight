  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      The fuel tank capacity read from the figure is {{capacity}} l.


      The tank is currently {{current}} % full.


      The pilot requests that the aircraft be refuelled to obtain {{target}} %
      full tank.


      What is the amount of fuel that must be uplifted to obtain that value?
    variables:
      - id: capacity
        label: tank capacity (from figure)
        unit: l
      - id: current
        label: current fuel level
        unit: "%"
      - id: target
        label: target fuel level
        unit: "%"
    chartInputs:
      - capacity
    answer:
      formula: (target - current) / 100 * capacity
      unit: l
      decimals: 0
    distractors:
      - id: d1
        formula: current / 100 * capacity
      - id: d2
        formula: target / 100 * capacity
      - id: d3
        formula: capacity
    presets:
      - id: p1
        values:
          capacity: 544
          current: 50
          target: 70
      - id: p2
        values:
          capacity: 400
          current: 30
          target: 80
    explanation: >-
      The fuel to uplift is the difference between the target and the current
      fuel fraction, multiplied by the tank capacity.


      **Solution**


      {{f: (target - current) / 100 * capacity}} = {{n: (target - current) / 100
      * capacity}} = **{{answer}} l**


      **Why the other answers are wrong**


      - **{{d1}} l**: the fuel already in the tank, not what has to be added.

      - **{{d2}} l**: the total fuel in the tank at the target level, forgetting
      to subtract what is already there.

      - **{{d3}} l**: the full tank capacity.
