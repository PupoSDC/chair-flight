  template:
    type: calculation
    question: "A pressure of {{bar}} bar is equivalent to (in Pascal):"
    variables:
      - id: bar
        label: pressure
        unit: bar
    answer:
      formula: bar * 100000
      unit: Pa
      decimals: 0
    distractors:
      - id: d1
        formula: bar * 100
      - id: d2
        formula: bar * 10
      - id: d3
        formula: bar * 1000
    presets:
      - id: p1
        values:
          bar: 1
      - id: p2
        values:
          bar: 2
      - id: p3
        values:
          bar: 5
    explanation: >-
      By definition 1 bar = 100 000 Pa (1000 hPa), so the value in bar is
      multiplied by 100 000.


      **Solution**


      {{f: bar * 100000}} = {{n: bar * 100000}} = **{{answer}} Pa**


      **Why the other answers are wrong**


      - **{{d1}} Pa**: uses a factor of 100, confusing bar with hPa/mbar steps.

      - **{{d2}} Pa**: uses a factor of 10.

      - **{{d3}} Pa**: uses a factor of 1000 (that is kPa per bar x 10, not Pa).
