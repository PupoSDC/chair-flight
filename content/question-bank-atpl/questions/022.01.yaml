  template:
    type: calculation
    question: "A pressure of {{psi}} psi is equivalent to approximately (in bar):"
    variables:
      - id: psi
        label: pressure
        unit: psi
    answer:
      formula: psi / 15
      unit: bar
      decimals: 0
    distractors:
      - id: d1
        formula: psi / 150
      - id: d2
        formula: psi / 1500
      - id: d3
        formula: psi / 1.5
    presets:
      - id: p1
        values:
          psi: 6000
      - id: p2
        values:
          psi: 3000
      - id: p3
        values:
          psi: 4500
    explanation: >-
      1 bar is about 14.5 psi, so for a quick approximation divide the value in
      psi by about 15 to get bar.


      **Solution**


      {{f: psi / 15}} = {{n: psi / 15}} = **{{answer}} bar**


      **Why the other answers are wrong**


      - **{{d1}} bar**: divides by 150, one power of ten too much.

      - **{{d2}} bar**: divides by 1500, two powers of ten too much.

      - **{{d3}} bar**: divides by 1.5, one power of ten too little.
