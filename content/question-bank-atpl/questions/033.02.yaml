- id: QFK00CZNX
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338946
    - AVEXAM-11846
    - AVEXAM-24103
    - BGS-330230
  annexes:
    - 033-data-sheet-lrjt-1-flight-planning-from-brake-release-to
    - 033-jar-fcl-flight-planning-quick-determination-of-flight-plan
  learningObjectives:
    - "033.02"
  template:
    type: chart-calculation
    question: >-
      Refer to the attached figures, including annex 033-038 rev. 05.11.2004.
      Assuming the following data, what is the time needed to carry out the
      flight?


      - Ground distance to be covered: {{distance}} NM

      - Cruise flight level: FL330, Mach 0.82

      - True airspeed: {{tas}} kt

      - Head wind component: {{headwind}} kt

      - Planned destination landing mass: 160 000 kg

      - Temperature: ISA

      - CG: 37 %

      - Total anti-ice: ON

      - Pack flow: HI

      - Time correction for mass, anti-ice and pack flow (read from the annex):
      {{time_correction}} min


      What is the flight time, in hours and minutes?
    variables:
      - id: distance
        label: Ground distance
        unit: NM
      - id: tas
        label: True airspeed
        unit: kt
      - id: headwind
        label: Head wind component
        unit: kt
      - id: time_correction
        label: Time correction (read from annex)
        unit: min
    chartInputs:
      - time_correction
    answer:
      formula: round(distance / (tas - headwind) * 60 + time_correction)
      unit: minutes
      decimals: 0
      format: h 'hours' mm 'minutes'
    distractors:
      - id: d1
        formula: round(distance / (tas + headwind) * 60 + time_correction)
      - id: d2
        formula: round(distance / tas * 60 + time_correction)
      - id: d3
        formula: round(distance / (tas - headwind) * 60)
      - id: d4
        formula: round(distance / (tas - headwind) * 60 - time_correction)
    presets:
      - id: p1
        values:
          distance: 2000
          tas: 470
          headwind: 30
          time_correction: 10
    explanation: >-
      The flight time is the distance divided by the groundspeed. With a
      headwind, the groundspeed is the true airspeed minus the headwind. The
      annex then adds time for the planned landing mass, the anti-ice and the
      pack settings.


      **Solution**


      - Groundspeed: {{f: tas - headwind}} = {{n: tas - headwind}} kt

      - Time for the distance: {{f: distance / (tas - headwind) * 60}} = {{=
      distance / (tas - headwind) * 60}} minutes

      - Add the annex correction: {{n: distance / (tas - headwind) * 60 +
      time_correction}} minutes = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the headwind to the airspeed instead of subtracting it.

      - **{{d2}}**: ignores the wind and uses the true airspeed as groundspeed.

      - **{{d3}}**: leaves out the annex time correction.

      - **{{d4}}**: subtracts the correction instead of adding it.
