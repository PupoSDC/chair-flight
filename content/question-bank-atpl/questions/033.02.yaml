  template:
    type: chart
    question: >-
      Refer to charts. An aircraft travels an air distance of {{air_dist}} NM at
      M.82.


      What is the approximate ground distance in NM, and the wind component that
      gives it?
    explanation: ""
    variables:
      - id: air_dist
        label: Air distance
        unit: NM
    entries:
      - id: e1
        values:
          air_dist: 1100
        answer: In a headwind of 50 kt, 1 000 NM.
        wrongAnswers:
          - In a headwind of 20 kt, 2 000 NM.
          - In a tailwind of 20 kt, 500 NM.
          - In a tailwind of 70 kt, 1 000 NM.
        explanation: >-
          At M.82 the chart links the air distance to the ground distance
          through the wind. A headwind makes the ground distance shorter than
          the air distance, and a tailwind makes it longer.


          **Solution**


          - Enter the chart at an air distance of {{air_dist}} NM at M.82.

          - In a headwind of 50 kt the ground distance is about 1 000 NM.


          **Why the other answers are wrong**


          - **In a headwind of 20 kt, 2 000 NM.**: a headwind makes the ground
          distance shorter, so 2 000 NM is far too long.

          - **In a tailwind of 20 kt, 500 NM.**: a tailwind makes the ground
          distance longer, not shorter.

          - **In a tailwind of 70 kt, 1 000 NM.**: a tailwind makes the ground
          distance longer, so 1 000 NM is too short.
