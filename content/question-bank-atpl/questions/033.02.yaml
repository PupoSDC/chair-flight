- id: QRELZWOR
  docId: "033.02"
  relatedQuestions:
    - QNC6L67E0
  externalIds:
    - ATPLQ-337553
    - BGS-330178
  annexes:
    - CAP-697-page-51
  learningObjectives:
    - 033.02.01.07.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (Flight Planning Manual MRJT 1, Figure 4.5.1).
      Planning an IFR flight from Paris to London for a twin jet aeroplane.
      Given: estimated take-off mass 52 000 kg, airport elevation 387 ft, FL
      280, ISA deviation -10° C, W/V {{wd}}°/{{ws}} kt, average true course
      {{tc}}°.


      Values read from the chart: still air distance to the top of climb {{nam}}
      NAM, climb time {{time}} min.


      Find the ground distance to the top of climb (NM).
    variables:
      - id: nam
        label: Still air climb distance (read from chart)
        unit: NAM
      - id: time
        label: Climb time (read from chart)
        unit: min
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: tc
        label: True course
        unit: °
    chartInputs:
      - nam
      - time
    answer:
      formula: nam - ws * cos(wd - tc) * time / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: nam
      - id: d2
        formula: nam + ws * cos(wd - tc) * time / 60
      - id: d3
        formula: nam - ws * time / 60
      - id: d4
        formula: nam + ws * time / 60
    presets:
      - id: p1
        values:
          nam: 54
          time: 12
          wd: 280
          ws: 40
          tc: 340
      - id: p2
        values:
          nam: 62
          time: 14
          wd: 250
          ws: 30
          tc: 290
      - id: p3
        values:
          nam: 58
          time: 13
          wd: 230
          ws: 50
          tc: 200
    explanation: >-
      The chart gives the still air distance for the climb. The head wind
      component (wind speed times the cosine of the angle between wind direction
      and course) shortens the ground distance over the climb time.


      **Solution**


      Head wind component = {{= ws * cos(wd - tc)}} kt


      {{f: nam - ws * cos(wd - tc) * time / 60}} = {{n: nam - ws * cos(wd - tc)
      * time / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: The still air distance, with no wind correction.

      - **{{d2}} NM**: The head wind was treated as a tail wind.

      - **{{d3}} NM**: The full wind speed was used instead of the head wind
      component.

      - **{{d4}} NM**: The full wind speed was used as a tail wind.
