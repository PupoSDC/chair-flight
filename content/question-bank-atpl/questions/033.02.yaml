- id: QABTTKD6L
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335661
    - AVEXAM-42964
    - ATPLGS-127673
    - BGS-330089
    - BGS-330761
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      You must fly IFR on an airway oriented {{track}}° magnetic with a minimum
      sector altitude (MSA) of {{msa}} ft.


      - QNH: {{qnh}} hPa

      - Temperature: ISA {{isa}}°C


      What is the minimum flight level you must fly at?
    variables:
      - id: msa
        label: MSA
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: isa
        label: Temperature deviation from ISA
        unit: °C
      - id: track
        label: Magnetic track
        unit: °
    answer:
      formula: ((1000 - 1000 * floor(track / 180)) + 2000 * ceil((msa / (1 + 0.004 *
        isa) - (qnh - 1013.25) * 30 - (1000 - 1000 * floor(track / 180))) /
        2000)) / 100
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: 2000 * ceil(msa / 2000) / 100
      - id: d2
        formula: round((msa - (qnh - 1013.25) * 30) / 100)
      - id: d3
        formula: msa / (1 + 0.004 * isa) / 100
    presets:
      - id: p1
        values:
          msa: 7800
          qnh: 1025
          isa: 10
          track: 135
      - id: p2
        values:
          msa: 6000
          qnh: 1005
          isa: 5
          track: 250
      - id: p3
        values:
          msa: 4500
          qnh: 1018
          isa: 0
          track: 90
    explanation: >-
      A minimum sector altitude is a height above sea level. The height is
      corrected for the temperature (4 ft per degree per 1000 ft) and for the
      QNH (30 ft per hPa), and then the lowest IFR flight level for the track
      that clears the result is chosen. For tracks of 000° to 179° magnetic the
      levels are odd thousands of feet, and for 180° to 359° they are even
      thousands.


      **Solution**


      - Height corrected for temperature: {{= msa / (1 + 0.004 * isa)}} ft

      - Height corrected for QNH: {{= msa / (1 + 0.004 * isa) - (qnh - 1013.25)
      * 30}} ft

      - Lowest IFR level for the track at or above that height: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: rounds the MSA up to the next even thousand without any
      corrections.

      - **FL{{d2}}**: applies the QNH correction only and does not pick a valid
      level for the track.

      - **FL{{d3}}**: applies the temperature correction only and does not pick
      a valid level for the track.
