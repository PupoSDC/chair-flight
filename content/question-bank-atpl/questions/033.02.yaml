  template:
    type: chart-calculation
    question: >-
      A flight with a medium range jet transport is planned from Glasgow to
      Valencia.


      Part of the route runs from SITET (50°06'N 000°00'E/W) to L'AIGLE VOR
      (48°47'N 000°32'E).


      Using the chart, the distance of this portion is {{dist}} NM on a true
      track of {{tc}}°.


      The TAS is {{tas}} kt and the wind is {{wd}}°/{{ws}} kt.


      Calculate the flight time for this portion (in minutes).
    variables:
      - id: dist
        label: Distance (from chart)
        unit: NM
      - id: tc
        label: Track (from chart)
        unit: deg
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: deg
      - id: ws
        label: Wind speed
        unit: kt
    chartInputs:
      - dist
      - tc
    answer:
      formula: round(dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd -
        tc)) * 60)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: round(dist / (tas - ws) * 60)
      - id: d2
        formula: round(dist / (tas + ws) * 60)
      - id: d3
        formula: round(dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd -
          tc)) * 60) + 4
      - id: d4
        formula: round(dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd -
          tc)) * 60) - 4
    presets:
      - id: p1
        values:
          dist: 81.7
          tc: 165.7
          tas: 382
          wd: 110
          ws: 30
      - id: p2
        values:
          dist: 120
          tc: 230
          tas: 420
          wd: 300
          ws: 40
      - id: p3
        values:
          dist: 95
          tc: 45
          tas: 360
          wd: 150
          ws: 25
    explanation: >-
      The distance and track follow from the chart coordinates. The wind
      triangle gives the ground speed, and the flight time is the distance
      divided by the ground speed.


      **Solution**


      Ground speed = {{= (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd
      - tc))}} kt


      {{f: dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd - tc))
      * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the full wind speed was applied as headwind.

      - **{{d2}} min**: the full wind speed was applied as tailwind.

      - **{{d3}} min**: 4 minutes were added by a misreading of the distance.

      - **{{d4}} min**: 4 minutes were lost by a misreading of the distance.
