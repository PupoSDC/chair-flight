  template:
    type: chart
    question: >-
      Refer to figure or CAP697 file 4.5.1 (-6º to -15º). Planning an IFR flight
      from Paris Charles de Gaulle to London Heathrow for the twin jet
      aeroplane. Given:


      - Estimated take-off mass (TOM): {{tom}} kg

      - Airport elevation: {{elev}} ft

      - Flight level: FL{{fl}}

      - Wind: 280°/40 kt

      - ISA deviation: {{isa_dev}} °C

