        explanation: >-
          The time to the top of climb is read from the performance table for
          the take-off mass, the airport elevation, the flight level, the
          temperature deviation and the wind.


          **Solution**


          - Enter the table at a take-off mass of {{tom}} kg, an airport
          elevation of {{elev}} ft, FL{{fl}} and an ISA deviation of {{isa_dev}}
