- id: QEDFWIQUV
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336447
    - BGS-331031
    - AVEXAM-58339
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      The crew of an aircraft flying at FL{{fl_ref}} in IMC in mountainous
      terrain wishes to descend to FL{{fl}}. Given the following, what is the
      true altitude at FL{{fl}} that the crew needs to use to confirm terrain
      clearance?


      - OAT at FL{{fl_ref}}: {{oat}} °C

      - QNH: {{qnh}} hPa (report from a nearby airport close to sea level)


      Pressure correction: 1 hPa = 30 ft
    variables:
      - id: fl_ref
        label: current flight level
        unit: ""
      - id: oat
        label: OAT at current level
        unit: °C
      - id: fl
        label: new flight level
        unit: ""
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: (fl * 100 + (qnh - 1013) * 30) * (1 + 0.004 * (oat - 15 + 0.2 * fl_ref))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: fl * 100 + (qnh - 1013) * 30
      - id: d2
        formula: (fl * 100 + (qnh - 1013) * 30) * (1 - 0.004 * (oat - 15 + 0.2 *
          fl_ref))
      - id: d3
        formula: (fl * 100 + (qnh - 1013) * 30) * (1 + 0.004 * oat)
      - id: d4
        formula: (fl * 100 + (1013 - qnh) * 30) * (1 + 0.004 * (oat - 15 + 0.2 *
          fl_ref))
    presets:
      - id: p1
        values:
          fl_ref: 100
          oat: -20
          fl: 70
          qnh: 975
      - id: p2
        values:
          fl_ref: 120
          oat: -30
          fl: 90
          qnh: 990
      - id: p3
        values:
          fl_ref: 80
          oat: -5
          fl: 50
          qnh: 1000
    explanation: >-
      The true altitude is the pressure altitude corrected for the QNH (30 ft
      per hPa below/above 1013 hPa) and for temperature (about 4 ft per 1000 ft
      per °C of ISA deviation). The ISA deviation follows from the OAT given at
      the current level, where ISA is 15 - 2 * FL/10 °C.


      **Solution**


      ISA deviation = {{= (oat - 15 + 0.2 * fl_ref)}} °C


      Altitude corrected for QNH = {{= fl * 100 + (qnh - 1013) * 30}} ft


      {{= fl * 100 + (qnh - 1013) * 30}} * (1 + 0.004 * {{= (oat - 15 + 0.2 *
      fl_ref)}}) = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the temperature correction was omitted.

      - **{{d2}} ft**: the temperature correction has the wrong sign.

      - **{{d3}} ft**: the OAT itself was used as the ISA deviation instead of
      OAT minus ISA temperature.

      - **{{d4}} ft**: the QNH correction was applied with the wrong sign.
