- id: QAZPOQXA
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334620
    - ATPLGS-627114
    - AVEXAM-61227
  annexes:
    - jeppesen-enr-scotland-north
  learningObjectives:
    - 033.02.01.07.06
  template:
    type: calculation
    question: >-
      You are flying with a magnetic heading of {{heading}}° and a TAS of
      {{tas}} kt.


      The magnetic wind is {{wind_dir}}°/{{wind_speed}} kt.


      Calculate the wind correction angle (WCA) in degrees, and state whether
      the correction is to the left (L) or to the right (R).
    variables:
      - id: heading
        label: Magnetic heading
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wind_dir
        label: Magnetic wind direction
        unit: °
      - id: wind_speed
        label: Wind speed
        unit: kt
    answer:
      formula: asin(wind_speed * sin(wind_dir - heading) / tas)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: -asin(wind_speed * sin(wind_dir - heading) / tas)
      - id: d2
        formula: asin(wind_speed * sin(wind_dir - heading) / (tas - wind_speed))
      - id: d3
        formula: asin(wind_speed * sin(wind_dir) / tas)
      - id: d4
        formula: asin(wind_speed * cos(wind_dir - heading) / tas)
    presets:
      - id: p1
        values:
          heading: 197
          tas: 200
          wind_dir: 347
          wind_speed: 45
      - id: p2
        values:
          heading: 270
          tas: 250
          wind_dir: 320
          wind_speed: 30
      - id: p3
        values:
          heading: 200
          tas: 180
          wind_dir: 310
          wind_speed: 30
    explanation: >-
      The wind correction angle is the angle the aircraft must be turned into
      the wind so that its track matches the intended course. It follows from
      the wind triangle: the crosswind component of the wind equals TAS ×
      sin(WCA).


      **Solution**


      Wind angle relative to heading: {{= wind_dir - heading}}°


      Crosswind component: {{= wind_speed * sin(wind_dir - heading)}} kt


      {{f: asin(wind_speed * sin(wind_dir - heading) / tas)}} = {{n:
      asin(wind_speed * sin(wind_dir - heading) / tas)}} = **{{answer}}°**


      A relative wind between 0° and 180° comes from the right, so the
      correction is to the right (R).


      **Why the other answers are wrong**


      - **{{d1}}°**: sign reversed, so the correction direction is taken as left
      instead of right.

      - **{{d2}}°**: TAS reduced by the wind speed in the denominator, which is
      not part of the wind triangle.

      - **{{d3}}°**: the wind direction is used directly instead of the wind
      angle relative to the heading.

      - **{{d4}}°**: cosine used instead of sine for the crosswind component.
