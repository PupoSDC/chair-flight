    - 033.01.01.02.05
    - "033.02"
  template:
    type: calculation
    question: >-
      Determine the lowest usable IFR flight level that gives the required
      obstacle clearance over high terrain.


      - Highest terrain elevation: {{terrain}} ft

      - Required obstacle clearance: {{clearance}} ft

      - QNH: {{qnh}} hPa

      - Temperature: ISA {{dev}} °C


      Use 30 ft per hPa and a height correction of 4 % per 10 °C deviation from
      ISA. Round up to the next 1 000 ft and give the answer as a flight level.
    variables:
      - id: terrain
        label: Terrain elevation
        unit: ft
      - id: clearance
        label: Obstacle clearance
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: ceil((terrain * (1 - 0.004 * dev) + clearance + (1013 - qnh) * 30) /
        1000) * 10
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil((terrain * (1 - 0.004 * dev) + (1013 - qnh) * 30) / 1000) * 10
      - id: d2
        formula: ceil((terrain * (1 - 0.004 * dev) + 2 * clearance + (1013 - qnh) * 30)
          / 1000) * 10
      - id: d3
        formula: ceil((terrain * (1 - 0.004 * dev) + clearance + (1013 - qnh) * 30) /
          1000) * 10 + 10
      - id: d4
        formula: floor((terrain * (1 - 0.004 * dev) + clearance + (1013 - qnh) * 30) /
          1000) * 10
    presets:
      - id: p1
        values:
          terrain: 7220
          clearance: 2000
          qnh: 990
          dev: -10
      - id: p2
        values:
          terrain: 6240
          clearance: 2000
          qnh: 1000
          dev: -12
      - id: p3
        values:
          terrain: 5880
          clearance: 2000
          qnh: 1003
          dev: -18
    explanation: >-
      The lowest usable flight level must clear the terrain by the required
      obstacle clearance. The QNH and the temperature both change the height. A
      QNH below 1013 hPa means the aircraft is higher than its flight level
      indicates, so 30 ft per hPa is added. In cold air the true height is lower
      than the pressure altitude, so the terrain height is increased by 4 % per
      10 °C below ISA.


      **Solution**


      Terrain corrected for temperature: {{f: terrain * (1 - 0.004 * dev)}} =
      {{= terrain * (1 - 0.004 * dev)}} ft


      QNH correction: {{f: (1013 - qnh) * 30}} = {{= (1013 - qnh) * 30}} ft


      Required height: {{= terrain * (1 - 0.004 * dev) + clearance + (1013 -
      qnh) * 30}} ft, rounded up to the next 1 000 ft gives **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: leaves out the obstacle clearance.

      - **FL{{d2}}**: adds the obstacle clearance twice.

      - **FL{{d3}}**: adds one more 1 000 ft of margin than required.

      - **FL{{d4}}**: rounds down instead of up to the next 1 000 ft.
