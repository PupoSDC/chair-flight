- id: QK8RNHVC8
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333072
    - ATPLGS-629528
    - ATPLGS-629409
    - BGS-331314
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: What is the vertical distance flown (ft, rounded to the nearest 100
      ft) for a climb from a departure aerodrome with elevation {{elev}} ft and
      QNH {{qnh}} hPa until a cruise altitude at FL{{fl}}? (Assume 30 ft per 1
      hPa)
    variables:
      - id: fl
        label: Cruise flight level
        unit: FL
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: round((fl * 100 + (qnh - 1013) * 30 - elev) / 100) * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: fl * 100
      - id: d2
        formula: round((fl * 100 + (qnh - 1013) * 30) / 100) * 100
      - id: d3
        formula: round((fl * 100 + (qnh - 1013) * 30 + elev) / 100) * 100
      - id: d4
        formula: round((fl * 100 - (qnh - 1013) * 30 - elev) / 100) * 100
    presets:
      - id: p1
        values:
          fl: 250
          elev: 3500
          qnh: 1030
      - id: p2
        values:
          fl: 330
          elev: 1200
          qnh: 1005
      - id: p3
        values:
          fl: 190
          elev: 2000
          qnh: 1022
    explanation: >-
      A flight level is referenced to 1013 hPa. To express the cruise level as
      an altitude on QNH, add 30 ft per hPa that QNH is above 1013. The climb
      distance is then this altitude minus the aerodrome elevation.


      **Solution**


      Altitude of the cruise level: {{= fl * 100 + (qnh - 1013) * 30}} ft


      {{f: round((fl * 100 + (qnh - 1013) * 30 - elev) / 100) * 100}} = {{n:
      round((fl * 100 + (qnh - 1013) * 30 - elev) / 100) * 100}} = **{{answer}}
      ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: The flight level was used directly as the vertical
      distance.

      - **{{d2}} ft**: The aerodrome elevation was not subtracted.

      - **{{d3}} ft**: The aerodrome elevation was added instead of subtracted.

      - **{{d4}} ft**: The QNH correction was applied with the wrong sign.
