- id: QCLJKRPTS
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331677
    - AVEXAM-73680
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: You are flying at {{alt1}} ft on track {{trk}}°(T) and you want to be
      at {{alt2}} ft {{dist}} NM before you reach the waypoint. If the TAS is
      {{tas}} kt, the average wind is {{wdir}}°(T)/{{wspd}} kt and the rate of
      descent is {{rod}} ft/min, how far is the ToD from the waypoint?
    variables:
      - id: alt1
        label: Cruise altitude
        unit: ft
      - id: alt2
        label: Target altitude
        unit: ft
      - id: dist
        label: Distance before waypoint
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
      - id: trk
        label: Track
        unit: °
      - id: rod
        label: ROD
        unit: ft/min
    answer:
      formula: (alt1 - alt2) / rod * (tas * cos(asin(wspd * sin(wdir - trk) / tas)) -
        wspd * cos(wdir - trk)) / 60 + dist
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (alt1 - alt2) / rod * (tas * cos(asin(wspd * sin(wdir - trk) / tas)) -
          wspd * cos(wdir - trk)) / 60
      - id: d2
        formula: (alt1 - alt2) / rod * (tas * cos(asin(wspd * sin(wdir - trk) / tas)) -
          wspd * cos(wdir - trk)) / 60 - dist
      - id: d3
        formula: 2 * ((alt1 - alt2) / rod * (tas * cos(asin(wspd * sin(wdir - trk) /
          tas)) - wspd * cos(wdir - trk)) / 60)
    presets:
      - id: p1
        values:
          alt1: 7000
          alt2: 2000
          dist: 10
          tas: 168
          wdir: 40
          wspd: 20
          trk: 270
          rod: 1000
      - id: p2
        values:
          alt1: 9000
          alt2: 3000
          dist: 8
          tas: 200
          wdir: 100
          wspd: 30
          trk: 270
          rod: 1500
      - id: p3
        values:
          alt1: 12000
          alt2: 4000
          dist: 12
          tas: 150
          wdir: 320
          wspd: 25
          trk: 90
          rod: 800
    explanation: >-
      The top of descent is the point where the descent must start so that the
      aircraft reaches the target altitude {{dist}} NM before the waypoint. Its
      distance from the waypoint is the distance covered during the descent plus
      the distance still to be flown at the target altitude. The descent
      distance needs the ground speed, which comes from the wind triangle.


      **Solution**


      Wind angle relative to track: {{= wdir - trk}}°

      Drift correction: asin({{wspd}} × sin({{= wdir - trk}}°) / {{tas}}) = {{=
      asin(wspd * sin(wdir - trk) / tas)}}°

      Ground speed = {{= tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)}} kt

      Descent time = ({{alt1}} - {{alt2}}) / {{rod}} = {{= (alt1 - alt2) / rod}}
      min

      Descent distance = {{= (alt1 - alt2) / rod}} min × {{= tas * cos(asin(wspd
      * sin(wdir - trk) / tas)) - wspd * cos(wdir - trk)}} kt / 60 = {{= (alt1 -
      alt2) / rod * (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)) / 60}} NM

      ToD distance = {{= (alt1 - alt2) / rod * (tas * cos(asin(wspd * sin(wdir -
      trk) / tas)) - wspd * cos(wdir - trk)) / 60}} + {{dist}} = **{{answer}}
      NM**


      **Why the other answers are wrong**

      - **{{d1}} NM**: only the descent distance; the {{dist}} NM before the
      waypoint is forgotten.

      - **{{d2}} NM**: the {{dist}} NM is subtracted instead of added.

      - **{{d3}} NM**: the descent distance is counted twice and the {{dist}} NM
      is forgotten.
- id: QCMGCFYH
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332049
    - AVEXAM-95207
    - AVEXAM-22347
  annexes:
    - jeppesen-ad-leal-13-2
  learningObjectives:
    - 033.02.01.05.01
  template:
    type: chart-calculation
    question: >-
      Refer to ALICANTE charts 13-2 and 10-2J (Jeppesen GSPRM 2017). An aircraft
      is flying on airway A-34 to Alicante / Spain (LEAL) and arrives at MAGAL
      for an approach on runway 10.


      What is the distance from the IAF to the runway threshold? (Value read
      from the charts: {{dist}} NM)
    variables:
      - id: dist
        label: Distance IAF to threshold (read from the charts)
        unit: NM
    chartInputs:
      - dist
    answer:
      formula: dist
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: dist * 1.1
      - id: d2
        formula: dist * 0.9
      - id: d3
        formula: dist * 1.8
      - id: d4
        formula: dist * 0.5
    presets:
      - id: p1
        values:
          dist: 25.5
    explanation: >-
      The distance from the IAF to the threshold is the sum of the leg distances
      of the published approach procedure, read from the approach chart (the
      figure). The charts have to be read for the leg lengths of the segments
      from the IAF to the runway threshold.


      **Solution**


      Distance IAF to threshold (sum of the leg distances on the chart) =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: leg distances over-read, or a leg of another procedure
      included.

      - **{{d2}} NM**: a leg of the approach left out.

      - **{{d3}} NM**: the distance of a different route (for example the
      en-route distance) used.

      - **{{d4}} NM**: only part of the approach (not from the IAF) read.
