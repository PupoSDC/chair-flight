  learningObjectives:
    - "033.02"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure or CAP 697 file 2.1 (graph "time, fuel, distance to
      climb"). Given: FL75, OAT +5° C, average head wind component during the
      climb {{hw}} kt, take-off from MSL with an initial mass of 3 650 lb.


      Values read from the graph: still air distance {{nam}} NAM, climb time
      {{time}} min.


      Determine the ground distance (NM).
    variables:
      - id: nam
        label: Still air distance (read from graph)
        unit: NAM
      - id: time
        label: Climb time (read from graph)
        unit: min
      - id: hw
        label: Head wind component
        unit: kt
    chartInputs:
      - nam
      - time
    answer:
      formula: nam - hw * time / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: nam
      - id: d2
        formula: nam + hw * time / 60
      - id: d3
        formula: nam - hw * time / 30
      - id: d4
        formula: nam - hw * time / 100
    presets:
      - id: p1
        values:
          nam: 18
          time: 9
          hw: 20
      - id: p2
        values:
          nam: 22
          time: 11
          hw: 25
      - id: p3
        values:
          nam: 30
          time: 15
          hw: 30
    explanation: >-
      The still air distance from the graph is the distance flown relative to
      the air. A head wind reduces the distance covered over the ground by the
      wind component multiplied by the climb time.


      **Solution**


      Wind effect: {{= hw * time / 60}} NM


      {{f: nam - hw * time / 60}} = {{n: nam - hw * time / 60}} = **{{answer}}
      NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: This is the still air distance; the head wind was
      ignored.

      - **{{d2}} NM**: The wind effect was added instead of subtracted (tail
      wind logic).

      - **{{d3}} NM**: The climb time was divided by 30 instead of 60, doubling
      the wind effect.

      - **{{d4}} NM**: The wind effect was computed with 100 instead of 60
      minutes per hour.
