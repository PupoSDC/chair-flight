    - "033.02"
  template:
    type: calculation
    question: >-
      Given the following information, determine the flight time for a leg from
      A to B (in minutes, rounded to the nearest minute):


      - Distance: {{dist}} NM

      - Wind (true): {{wd}}°/{{ws}} kt

      - Magnetic course: {{mc}}°

      - Variation: {{vr}}° E

      - TAS: {{tas}} kt
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: wd
        label: Wind direction (true)
        unit: deg
      - id: ws
        label: Wind speed
        unit: kt
      - id: mc
        label: Magnetic course
        unit: deg
      - id: vr
        label: Variation (E)
        unit: deg
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: round(dist / (tas * cos(asin(ws * sin(wd - (mc + vr)) / tas)) - ws *
        cos(wd - (mc + vr))) * 60)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: round(dist / (tas * cos(asin(ws * sin(wd - (mc)) / tas)) - ws * cos(wd
          - (mc))) * 60)
      - id: d2
        formula: round(dist / (tas * cos(asin(ws * sin(wd - (mc - vr)) / tas)) - ws *
          cos(wd - (mc - vr))) * 60)
      - id: d3
        formula: round(dist / tas * 60)
      - id: d4
        formula: round(dist / (tas + ws) * 60)
    presets:
      - id: p1
        values:
          dist: 300
          wd: 340
          ws: 40
          mc: 300
          vr: 20
          tas: 440
      - id: p2
        values:
          dist: 360
          wd: 220
          ws: 35
          mc: 100
          vr: 10
          tas: 400
      - id: p3
        values:
          dist: 480
          wd: 60
          ws: 45
          mc: 350
          vr: 10
          tas: 300
    explanation: >-
      The true track is the magnetic course plus easterly variation. The wind
      triangle gives the drift correction and the ground speed; the flight time
      is the distance divided by the ground speed.


      **Solution**


      True track = {{= mc + vr}}°


      Ground speed = {{= (tas * cos(asin(ws * sin(wd - (mc + vr)) / tas)) - ws *
      cos(wd - (mc + vr)))}} kt


      Time = {{f: dist / (tas * cos(asin(ws * sin(wd - (mc + vr)) / tas)) - ws *
      cos(wd - (mc + vr))) * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the variation was ignored (magnetic course used as true
      track).

      - **{{d2}} min**: the variation was applied with the wrong sign.

      - **{{d3}} min**: the wind was ignored.

      - **{{d4}} min**: the full wind speed was added to the TAS.
