- id: QJWGYL2BF
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334588
    - AVEXAM-38798
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      When planning to fly through a mountainous area, the minimum safe altitude
      (MSA) is {{msa}} ft.


      The QNH from an airport in the vicinity, elevation 0 ft, is {{qnh}} hPa
      and the temperature at FL100 is {{temp}} °C.


      Determine the lowest usable flight level (give the number, e.g. 100 for
      FL100).


      Assume 1 hPa = 30 ft and a temperature correction of 4 ft per °C of ISA
      deviation per 1000 ft of height; ISA temperature at FL100 is -5 °C.
    variables:
      - id: msa
        label: MSA
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: temp
        label: Temperature at FL100
        unit: °C
    answer:
      formula: ceil((msa + (1013 - qnh) * 30 + 0.004 * (-5 - temp) * msa) / 1000) * 10
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(msa / 1000) * 10
      - id: d2
        formula: ceil((msa + (1013 - qnh) * 30) / 1000) * 10
      - id: d3
        formula: ceil((msa + (1013 - qnh) * 30 + 0.004 * (-5 - temp) * msa + 1000) /
          1000) * 10
      - id: d4
        formula: ceil(msa * 1.5 / 1000) * 10
    presets:
      - id: p1
        values:
          msa: 8000
          qnh: 990
          temp: -25
      - id: p2
        values:
          msa: 8500
          qnh: 985
          temp: -28
    explanation: >-
      A QNH below 1013 hPa lowers the flight levels relative to altitude, so the
      flight level must be higher than the MSA. Cold air (below ISA) also lowers
      the real altitude of a pressure level, which needs an additional margin.
      The result is rounded up to the next flight level.


      **Solution**


      QNH correction = {{f: (1013 - qnh) * 30}} = {{= (1013 - qnh) * 30}} ft


      Temperature correction = 0.004 x {{= -5 - temp}} x {{msa}} = {{= 0.004 *
      (-5 - temp) * msa}} ft


      Required pressure altitude = {{= msa + (1013 - qnh) * 30 + 0.004 * (-5 -
      temp) * msa}} ft, rounded up: **FL{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: only the MSA is used, without QNH and temperature
      corrections.

      - **{{d2}} **: the cold-temperature correction is forgotten.

      - **{{d3}} **: an extra 1000 ft margin is added on top of both
      corrections.

      - **{{d4}} **: the MSA is multiplied by 1.5 instead of applying the
      corrections.
