    question: >-
      Refer to the figure, a partially completed navigation plan from an
      aerodrome with elevation {{elev}} ft. The rate of climb is {{roc}} ft/min
      and the ground speed during the climb, read from the figure, is {{gs}} kt.


      At what distance from the aerodrome will you reach FL {{fl}}? Answer in
      NM.
    variables:
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: fl
        label: Target flight level
        unit: ""
      - id: gs
        label: Ground speed in climb (read from figure)
        unit: kt
    chartInputs:
      - gs
    answer:
      formula: (fl * 100 - elev) / roc * gs / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 - elev) / roc
      - id: d2
        formula: (fl * 100 - elev) / roc * gs
      - id: d3
        formula: (fl * 100 - elev) / roc * gs / 60 * 1.15
      - id: d4
        formula: (fl * 100 - elev) / roc * 60 / gs
    presets:
      - id: p1
        values:
          elev: 17
          roc: 1000
          fl: 130
          gs: 83
      - id: p2
        values:
          elev: 17
          roc: 800
          fl: 110
          gs: 95
      - id: p3
        values:
          elev: 100
          roc: 1200
          fl: 90
          gs: 100
    explanation: >-
      The climb distance is the climb time times the ground speed. The climb
      time is the height to climb (target level minus aerodrome elevation)
      divided by the rate of climb. The ground speed is taken from the figure.


      **Solution**


      Height to climb = {{= fl * 100}} ft - {{elev}} ft = {{= fl * 100 - elev}}
      ft


      Time = {{= fl * 100 - elev}} ft / {{roc}} ft/min = {{= (fl * 100 - elev) /
      roc}} min


      {{f: (fl * 100 - elev) / roc * gs / 60}} = {{n: (fl * 100 - elev) / roc *
      gs / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: this is the climb time in minutes, not a distance.

      - **{{d2}} NM**: the ground speed was not divided by 60.

      - **{{d3}} NM**: the distance was converted with the 1.15 statute mile
      factor.

      - **{{d4}} NM**: time and ground speed were combined as a ratio instead of
      a product.
