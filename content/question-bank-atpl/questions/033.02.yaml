  template:
    type: chart-calculation
    question: >-
      Refer to the Jeppesen chart E(LO)2. A flight cruises at FL {{fl1}} inbound
      TRENT VOR/DME (TNT). A descent must be planned to pass waypoint ELVOS at
      FL {{fl2}}. The distance from TRENT to ELVOS, read from the chart, is
      {{d}} NM.


      Calculate the Top of Descent (ToD) distance from TRENT for a ground speed
      of {{gs}} kt and a rate of descent of {{rod}} ft/min. Answer in NM.
    variables:
      - id: fl1
        label: Cruise flight level
        unit: ""
      - id: fl2
        label: Flight level at ELVOS
        unit: ""
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
      - id: d
        label: Distance TRENT to ELVOS (read from chart)
        unit: NM
    chartInputs:
      - d
    answer:
      formula: (fl1 - fl2) * 100 / rod * gs / 60 + d
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl1 - fl2) * 100 / rod * gs / 60
      - id: d2
        formula: (fl1 - fl2) * 100 / rod * gs / 60 - d
      - id: d3
        formula: (fl1 - fl2) * 100 / rod * gs + d
      - id: d4
        formula: (fl1 - fl2) * 100 / rod + d
    presets:
      - id: p1
        values:
          fl1: 380
          fl2: 200
          rod: 1500
          gs: 200
          d: 25
      - id: p2
        values:
          fl1: 360
          fl2: 200
          rod: 2000
          gs: 420
          d: 25
      - id: p3
        values:
          fl1: 350
          fl2: 150
          rod: 1500
          gs: 240
          d: 25
    explanation: >-
      The descent from cruise level to the flight level required at the waypoint
      takes a time equal to the height to lose divided by the rate of descent.
      In that time the aeroplane covers (time × ground speed). The waypoint lies
      {{d}} NM from TRENT (value read from the chart), so this distance is added
      to find the ToD relative to TRENT.


      **Solution**


      Height to lose = ({{fl1}} - {{fl2}}) × 100 = {{= (fl1 - fl2) * 100}} ft


      Time = {{= (fl1 - fl2) * 100}} ft / {{rod}} ft/min = {{= (fl1 - fl2) * 100
      / rod}} min


      Descent distance = {{= (fl1 - fl2) * 100 / rod * gs / 60}} NM


      {{f: (fl1 - fl2) * 100 / rod * gs / 60 + d}} = {{n: (fl1 - fl2) * 100 /
      rod * gs / 60 + d}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: only the descent distance, the distance between TRENT and
      ELVOS was not added.

      - **{{d2}} NM**: the TRENT to ELVOS distance was subtracted instead of
      added.

      - **{{d3}} NM**: the ground speed was not divided by 60 (NM/h used as
      NM/min).

      - **{{d4}} NM**: the descent time in minutes was added to the chart
      distance instead of the descent distance.
