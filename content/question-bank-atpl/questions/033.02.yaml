- id: QRZZADRR
  docId: "033.02"
  relatedQuestions:
    - QGUOLTXU
  externalIds:
    - ATPLQ-333280
    - ATPLGS-628487
  annexes:
    - jeppesen-enr-england-north
  learningObjectives:
    - 033.02.01.07.03
  template:
    type: chart-calculation
    question: >-
      Refer to GSPRM Jeppesen Chart E(LO)2. A flight is planned along route
      T420, course 330°, FL{{fl_from}}, inbound TRENT VOR/DME. A descent should
      be initiated to pass waypoint ELVOS at FL{{fl_to}}. Calculate the Top of
      Descent (TOD) distance relating to TRENT, given the following information:


      - Rate of descent: {{rod}} ft/min

      - Groundspeed: {{gs}} kt

      - Wind component: {{wind}} kt tailwind

      - Distance from TRENT to ELVOS (value read from the chart): {{dist_fig}}
      NM


      Give the distance in NM.
    variables:
      - id: fl_from
        label: Cruise level
        unit: FL
      - id: fl_to
        label: Level to pass ELVOS
        unit: FL
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Groundspeed
        unit: kt
      - id: wind
        label: Tailwind component
        unit: kt
      - id: dist_fig
        label: Distance TRENT to ELVOS (read from the graph)
        unit: NM
    chartInputs:
      - dist_fig
    answer:
      formula: (fl_from - fl_to) * 100 / rod * gs / 60 + dist_fig
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl_from - fl_to) * 100 / rod * gs / 60
      - id: d2
        formula: (fl_from - fl_to) * 100 / rod * (gs - wind) / 60 + dist_fig
      - id: d3
        formula: (fl_from - fl_to) * 100 / rod * (gs + wind) / 60 + dist_fig
      - id: d4
        formula: (fl_from - fl_to) * 100 / rod * gs / 60 * 1.852 + dist_fig
    presets:
      - id: p1
        values:
          fl_from: 360
          fl_to: 200
          rod: 2300
          gs: 345
          wind: 35
          dist_fig: 25
      - id: p2
        values:
          fl_from: 330
          fl_to: 130
          rod: 2000
          gs: 300
          wind: 20
          dist_fig: 30
    explanation: >-
      The TOD lies before the point ELVOS, where the aeroplane must be at FL200.
      The distance from the TOD to ELVOS is the altitude to lose divided by the
      rate of descent (in minutes), multiplied by the ground speed and divided
      by 60 to convert to hours. The distance from TRENT to ELVOS, read from the
      chart, is then added.


      **Solution**


      Descent distance: {{n: (fl_from - fl_to) * 100 / rod * gs / 60}} NM


      TOD distance from TRENT: {{f: (fl_from - fl_to) * 100 / rod * gs / 60 +
      dist_fig}} = {{n: (fl_from - fl_to) * 100 / rod * gs / 60 + dist_fig}} =
      **{{answer}} NM**


      **Why the other answers are wrong**

      - **{{d1}} NM**: forgets the distance from TRENT to ELVOS.

      - **{{d2}} NM**: subtracts the wind as if it were a headwind.

      - **{{d3}} NM**: adds the tailwind to the given ground speed, counting it
      twice.

      - **{{d4}} NM**: multiplies by 1.852 as if converting NM to km (unit
      mistake).
