  template:
    type: calculation
    question: >-
      An aircraft is cruising at FL{{fl}}.


      The OAT is ISA {{dev}} °C (ISA deviation), the QNH given by a station with
      an elevation of {{elev}} ft is {{qnh}} hPa.


      Assume 1 hPa = 30 ft and a temperature correction of 4 ft per 1000 ft of
      height above the station per °C of ISA deviation.


      Calculate the true altitude of the aircraft.
    variables:
      - id: fl
        label: flight level
        unit: ""
      - id: dev
        label: ISA deviation
        unit: °C
      - id: elev
        label: station elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: (fl * 100 + (qnh - 1013) * 30) + 4 * dev * ((fl * 100 + (qnh - 1013) *
        30) - elev) / 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 + (qnh - 1013) * 30)
      - id: d2
        formula: (fl * 100 + (qnh - 1013) * 30) - 4 * dev * ((fl * 100 + (qnh - 1013) *
          30) - elev) / 1000
      - id: d3
        formula: (fl * 100 + (qnh - 1013) * 30) + 4 * dev * (fl * 100 + (qnh - 1013) *
          30) / 1000
      - id: d4
        formula: fl * 100 - (qnh - 1013) * 30 + 4 * dev * (fl * 100 - (qnh - 1013) * 30
          - elev) / 1000
    presets:
      - id: p1
        values:
          fl: 60
          dev: -15
          elev: 2430
          qnh: 995
      - id: p2
        values:
          fl: 200
          dev: 10
          elev: 1000
          qnh: 1010
      - id: p3
        values:
          fl: 90
          dev: -10
          elev: 2480
          qnh: 1002
      - id: p4
        values:
          fl: 50
          dev: -15
          elev: 1500
          qnh: 1004
      - id: p5
        values:
          fl: 80
          dev: -20
          elev: 2500
          qnh: 1040
      - id: p6
        values:
          fl: 80
          dev: -18
          elev: 300
          qnh: 1020
    explanation: >-
      The altimeter reads pressure altitude at FL; the true altitude is found by
      first correcting for the difference between the actual QNH and 1013 hPa
      (30 ft per hPa), then correcting for temperature: in air colder than ISA
      the true altitude is lower than indicated, in warmer air it is higher (4
      ft per 1000 ft of height above the station per °C).


      **Solution**


      Altitude corrected for QNH = {{= fl * 100}} + ({{qnh}} - 1013) * 30 = {{=
      (fl * 100 + (qnh - 1013) * 30)}} ft


      Height above the station = {{= (fl * 100 + (qnh - 1013) * 30) - elev}} ft


      Temperature correction = 4 * {{dev}} * {{= (fl * 100 + (qnh - 1013) * 30)
      - elev}} / 1000 = {{= 4 * dev * ((fl * 100 + (qnh - 1013) * 30) - elev) /
      1000}} ft


      True altitude = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the temperature correction was omitted.

      - **{{d2}} ft**: the temperature correction was applied with the wrong
      sign.

      - **{{d3}} ft**: the temperature correction was applied to the whole
      altitude instead of the height above the station.

      - **{{d4}} ft**: the QNH correction was applied with the wrong sign (QNH
      above 1013 hPa raises the true altitude).
