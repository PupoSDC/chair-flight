- id: Q5RAOTQSP
  docId: "033.02"
  relatedQuestions:
    - Q1WNMCRHD
  externalIds:
    - ATPLQ-331046
    - AVEXAM-9688
    - ATPLGS-629262
    - ATPLGS-625295
    - AVEXAM-19867
    - BGS-331210
    - BGS-331090
    - ATPLQ-332284
    - AVEXAM-62049
  annexes: []
  learningObjectives:
    - "033.02"
    - "033.06"
  template:
    type: calculation
    question: >-
      Given the following information, what is the ground speed (kt) of the
      aircraft?


      - TAS: {{tas}} kt

      - Heading: {{hdg}}°

      - Wind: {{wd}}°/{{ws}} kt
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hdg
        label: Heading
        unit: °
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - ws * cos(wd - hdg)
      - id: d2
        formula: tas + ws * cos(wd - hdg)
      - id: d3
        formula: tas - ws
      - id: d4
        formula: sqrt(tas^2 + ws^2)
    presets:
      - id: p1
        values:
          tas: 250
          hdg: 90
          wd: 30
          ws: 50
      - id: p2
        values:
          tas: 300
          hdg: 90
          wd: 330
          ws: 46
      - id: p3
        values:
          tas: 180
          hdg: 270
          wd: 320
          ws: 35
    explanation: >-
      With the heading known, the ground speed is the vector sum of the TAS
      (along the heading) and the wind. Resolve the wind into a component along
      the heading and a component across it, then combine them with Pythagoras.


      **Solution**


      Along heading: {{= tas - ws * cos(wd - hdg)}} kt; across heading: {{= ws *
      sin(wd - hdg)}} kt


      {{f: sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)}} = {{n:
      sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: Only the head wind component was subtracted; the cross
      wind was neglected.

      - **{{d2}} kt**: The head wind component was added instead of subtracted.

      - **{{d3}} kt**: The full wind speed was subtracted from TAS.

      - **{{d4}} kt**: The wind was treated as a perpendicular component to TAS.
