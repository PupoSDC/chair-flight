      0.78, SAT = -60° C, HWC= 5 kt FL 290: M = 0.80, SAT = -55° C, HWC = 15 kt
      FL 270: M = 0.76, SAT = -43° C, HWC = 0 The Flight Level allowing the
      highest Ground Speed is.."
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: FL270.
        wrongAnswers:
          - FL290.
          - FL370.
          - FL330.
        explanation: >-
          The TAS is Mach × local speed of sound (38.95 × √(temperature in
          kelvin)), and the ground speed is TAS minus the headwind:


          - FL370: 455 − 15 = 440 kt.

          - FL330: 444 − 5 = 439 kt.

          - FL290: 460 − 15 = 445 kt.

          - FL270: 449 − 0 = 449 kt.


          **FL270** gives the highest ground speed.
