- id: QPIIQYCJ
  docId: "033.02"
  relatedQuestions:
    - QZOIYREP
  externalIds:
    - ATPLQ-332618
    - AVEXAM-71090
    - BGS-330182
  annexes:
    - CAP-697-page-76
  learningObjectives:
    - 033.02.01.07.05
  template:
    type: calculation
    question: |-
      Planning an IFR flight for a twin jet aeroplane. Given:

      - Flight level: FL{{fl}}
      - ISA deviation: {{isa_dev}} °C
      - Cruise procedure: Mach 0.{{mach_h}}

      Determine the TAS in knots.
    variables:
      - id: mach_h
        label: Mach number (x 100)
        unit: ""
      - id: fl
        label: Flight level
        unit: FL
      - id: isa_dev
        label: ISA deviation
        unit: °C
    answer:
      formula: mach_h / 100 * 38.97 * sqrt(288.15 - 0.198 * fl + isa_dev)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach_h / 100 * 38.97 * sqrt(288.15 - 0.198 * fl)
      - id: d2
        formula: mach_h / 100 * 38.97 * sqrt(288.15 + isa_dev)
      - id: d3
        formula: mach_h / 100 * 38.97 * sqrt(288.15 - 0.198 * fl - isa_dev)
      - id: d4
        formula: 38.97 * sqrt(288.15 - 0.198 * fl + isa_dev)
    presets:
      - id: p1
        values:
          mach_h: 74
          fl: 280
          isa_dev: -10
      - id: p2
        values:
          mach_h: 78
          fl: 350
          isa_dev: -10
      - id: p3
        values:
          mach_h: 80
          fl: 240
          isa_dev: 5
    explanation: >-
      The ISA temperature falls by 1.98 °C per 1000 ft below the tropopause, so
      at flight level FL the ISA temperature is 15 - 0.198 x FL °C. Adding the
      ISA deviation and converting to kelvin gives the static temperature 288.15
      - 0.198 x FL + ISA deviation (K). The TAS is the Mach number multiplied by
      the speed of sound at that temperature.


      **Solution**


      {{f: mach_h / 100 * 38.97 * sqrt(288.15 - 0.198 * fl + isa_dev)}} = {{n:
      mach_h / 100 * 38.97 * sqrt(288.15 - 0.198 * fl + isa_dev)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**

      - **{{d1}} kt**: ignores the ISA deviation, so the standard temperature
      for the flight level is used.

      - **{{d2}} kt**: uses the sea-level temperature and ignores the altitude.

      - **{{d3}} kt**: reverses the sign of the ISA deviation.

      - **{{d4}} kt**: gives the speed of sound and forgets to multiply by the
      Mach number.
