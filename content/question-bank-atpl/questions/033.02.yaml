- id: QOFO84J5B
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339876
    - AVEXAM-16022
    - BGS-331167
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      Given the following information, what is the ground distance covered
      during the descent from FL{{fl}} to {{alt}} ft?


      - Rate of descent: {{rod}} ft/min

      - TAS: {{tas}} kt

      - Tailwind: {{tw}} kt

      - QNH: {{qnh}} hPa


      Assume 1 hPa = 30 ft.
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: alt
        label: Target altitude
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind
        unit: kt
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: (fl * 100 - (alt + (1013 - qnh) * 30)) / rod * (tas + tw) / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 - alt) / rod * (tas + tw) / 60
      - id: d2
        formula: (fl * 100 - (alt - (1013 - qnh) * 30)) / rod * (tas + tw) / 60
      - id: d3
        formula: (fl * 100 - (alt + (1013 - qnh) * 30)) / rod * (tas - tw) / 60
      - id: d4
        formula: (fl * 100 - (alt + (1013 - qnh) * 30)) / rod * tas / 60
    presets:
      - id: p1
        values:
          fl: 320
          alt: 5000
          rod: 1200
          tas: 420
          tw: 45
          qnh: 995
      - id: p2
        values:
          fl: 290
          alt: 4000
          rod: 1000
          tas: 400
          tw: 30
          qnh: 1003
      - id: p3
        values:
          fl: 350
          alt: 3000
          rod: 1500
          tas: 450
          tw: 50
          qnh: 1008
    explanation: >-
      The altitude to lose is measured on the standard setting: FL{{fl}} is a
      pressure altitude, while the target {{alt}} ft is an altitude above the
      QNH datum, so it must be converted to pressure altitude by adding (1013 -
      QNH) x 30 ft. The time to descend is the height to lose divided by the
      rate of descent, and the ground distance is that time multiplied by the
      ground speed (TAS plus tailwind).


      **Solution**


      Pressure altitude of target = {{alt}} + (1013 - {{qnh}}) x 30 = {{= alt +
      (1013 - qnh) * 30}} ft

      Height to lose = {{= fl * 100}} - {{= alt + (1013 - qnh) * 30}} = {{= fl *
      100 - (alt + (1013 - qnh) * 30)}} ft

      Ground speed = {{tas}} + {{tw}} = {{= tas + tw}} kt

      {{f: (fl * 100 - (alt + (1013 - qnh) * 30)) / rod * (tas + tw) / 60}} =
      {{n: (fl * 100 - (alt + (1013 - qnh) * 30)) / rod * (tas + tw) / 60}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: ignores the QNH correction and uses {{alt}} ft directly.

      - **{{d2}} NM**: applies the QNH correction with the wrong sign (subtracts
      instead of adds).

      - **{{d3}} NM**: subtracts the tailwind from the TAS, as if it were a
      headwind.

      - **{{d4}} NM**: uses the TAS as ground speed and ignores the tailwind.
