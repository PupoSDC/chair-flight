  template:
    type: calculation
    question: >-
      An IFR aircraft on a track between 180° and 359° (magnetic) has to clear
      an obstacle of {{obst}} ft with a minimum obstacle clearance of {{clr}}
      ft.


      The QNH received from a nearby airport at sea level is {{qnh}} hPa and the
      temperature is ISA -{{cold}} °C.


      What is the lowest flight level (number, e.g. 140 for FL140) at which the
      aircraft may fly?


      Assume 1 hPa = 30 ft and a temperature correction of 4 ft per °C of ISA
      deviation per 1000 ft of height.
    variables:
      - id: obst
        label: Obstacle elevation
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: cold
        label: Temperature below ISA
        unit: °C
    answer:
      formula: ceil((obst + clr + (1013 - qnh) * 30 + 0.004 * cold * (obst + clr)) /
        2000) * 20
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: 10 * (2 * ceil(((obst + clr + (1013 - qnh) * 30 + 0.004 * cold * (obst
          + clr)) / 1000 - 1) / 2) + 1)
      - id: d2
        formula: ceil((obst + clr + (1013 - qnh) * 30 + 0.004 * cold * (obst + clr)) /
          100)
      - id: d3
        formula: ceil((obst + clr + (1013 - qnh) * 30) / 2000) * 20
      - id: d4
        formula: ceil((obst + clr + (1013 - qnh) * 30 + 0.004 * cold * (obst + clr)) /
          2000) * 20 + 20
      - id: d5
        formula: ceil((obst + clr + (1013 - qnh) * 30 + 0.004 * cold * (obst + clr)) /
          500) * 5
    presets:
      - id: p1
        values:
          obst: 10600
          clr: 1500
          qnh: 1035
          cold: 15
      - id: p2
        values:
          obst: 6600
          clr: 1500
          qnh: 1030
          cold: 15
      - id: p3
        values:
          obst: 11800
          clr: 2000
          qnh: 1013
          cold: 7
    explanation: >-
      The minimum altitude is obstacle elevation plus clearance. A QNH above
      1013 hPa lowers the required flight level, and a temperature below ISA
      calls for an additional margin because pressure levels lie lower. On a
      westerly magnetic track (180-359°) IFR flight levels are even thousands
      (FL80, 100, 120, 140...), so the result is rounded up to the next one.


      **Solution**


      Minimum altitude = {{= obst + clr}} ft


      QNH correction = {{= (1013 - qnh) * 30}} ft, temperature correction = {{=
      0.004 * cold * (obst + clr)}} ft


      Required pressure altitude = {{= obst + clr + (1013 - qnh) * 30 + 0.004 *
      cold * (obst + clr)}} ft, next even level: **FL{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: the odd-thousand levels of the easterly semicircle were
      used.

      - **{{d2}} **: no semicircular rounding was applied (next flight level
      only).

      - **{{d3}} **: the temperature correction was forgotten.

      - **{{d4}} **: one level too high (rounded up twice).

      - **{{d5}} **: rounded to the next 500 ft only, ignoring the even-thousand
      rule.
