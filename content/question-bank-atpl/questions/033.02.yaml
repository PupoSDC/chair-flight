- id: QZGQLZJIV
  docId: "033.02"
  relatedQuestions:
    - QJWMBPSTO
  externalIds:
    - ATPLQ-339800
    - BGS-330093
    - ATPLGS-625242
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: "Given the following information, calculate the minimum flight level
      (number, e.g. 100 for FL100) for an IFR flight that is planned outside
      airways: Course: 235° M, MSA: {{msa}} ft, QNH: {{qnh}} hPa, Temperature:
      ISA. Assume 1 hPa = 30 ft."
    variables:
      - id: msa
        label: MSA
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: ceil((msa + (1013 - qnh) * 30) / 2000) * 20
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: 10 * (2 * ceil(((msa + (1013 - qnh) * 30) / 1000 - 1) / 2) + 1)
      - id: d2
        formula: ceil((msa + (1013 - qnh) * 30) / 500) * 5
      - id: d3
        formula: floor((msa + (1013 - qnh) * 30) / 2000) * 20
      - id: d4
        formula: ceil((msa + (1013 - qnh) * 30) / 100)
    presets:
      - id: p1
        values:
          msa: 7800
          qnh: 995
      - id: p2
        values:
          msa: 6900
          qnh: 1000
    explanation: >-
      The lowest usable flight level is the MSA corrected for a QNH below 1013
      hPa (30 ft per hPa). On a magnetic course of 180-359° IFR levels are even
      thousands, so the result is rounded up to the next even level.


      **Solution**


      Required pressure altitude = {{f: msa}} + {{= (1013 - qnh) * 30}} = {{=
      msa + (1013 - qnh) * 30}} ft


      Next even flight level: **FL{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: odd levels (easterly semicircle) were used.

      - **{{d2}} **: rounded up to the next half level only, ignoring the
      semicircular rule.

      - **{{d3}} **: rounded down instead of up (would infringe the MSA).

      - **{{d4}} **: no semicircular rounding applied.
