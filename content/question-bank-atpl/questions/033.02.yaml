- id: QWR04CCGZ
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339303
    - AVEXAM-59324
    - AVEXAM-61227
    - ATPLQ-331841
    - ATPLGS-626630
  annexes:
    - jeppesen-enr-scotland-north
  learningObjectives:
    - "033.02"
  template:
    type: chart-calculation
    question: >-
      An aircraft is flying along airway Y906 and approaches RIMOL (N57°33'
      W004°03'). Refer to Jeppesen GSPRM Training Route Manual chart "E LO 1".
      The pilot wants to continue south on airway N560 inbound Glasgow VOR
      (GOW).


      The magnetic track of N560 read from the chart is {{trk}}°. Magnetic wind:
      {{wd}}°/{{ws}} kt. TAS: {{tas}} kt.


      What is the wind correction angle (positive = right, negative = left)?
    variables:
      - id: trk
        label: Track (read from the figure)
        unit: °
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    chartInputs:
      - trk
    answer:
      formula: asin(ws * sin(wd - trk) / tas)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: -asin(ws * sin(wd - trk) / tas)
      - id: d2
        formula: asin(ws / tas)
      - id: d3
        formula: asin(ws * cos(wd - trk) / tas)
      - id: d4
        formula: 2 * asin(ws * sin(wd - trk) / tas)
    presets:
      - id: p1
        values:
          trk: 190
          wd: 345
          ws: 50
          tas: 200
      - id: p2
        values:
          trk: 191
          wd: 338
          ws: 45
          tas: 200
      - id: p3
        values:
          trk: 190
          wd: 320
          ws: 40
          tas: 210
    explanation: >-
      The wind correction angle is the angle by which the heading must be offset
      from the track so that the wind drift is cancelled. It follows from the
      wind triangle: the wind component across the track divided by the TAS
      gives the sine of the WCA. A positive result means the wind comes from the
      right, so the correction is to the right.


      **Solution**


      Wind angle relative to track: {{= wd - trk}}°


      {{f: asin(ws * sin(wd - trk) / tas)}} = {{n: asin(ws * sin(wd - trk) /
      tas)}} = **{{answer}}°** (positive = right)


      **Why the other answers are wrong**


      - **{{d1}}°**: correct size but wrong side; the wind comes from the right
      of the track, so the correction is to the right.

      - **{{d2}}°**: uses the full wind speed, as if the wind were exactly
      perpendicular to the track.

      - **{{d3}}°**: uses the cosine (the headwind/tailwind component) instead
      of the sine (the crosswind component).

      - **{{d4}}°**: doubles the correct angle.
