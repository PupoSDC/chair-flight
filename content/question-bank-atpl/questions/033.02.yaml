  template:
    type: chart
    question: "Given the following data: MSA 8 230 ft QNH 995 hPa (measured at an
      airfield nearby at MSL) Temperature ISA -18°C Track 123°M Assume 30 ft /
      hPa Calculate the minimum cruising flight level for a flight under under
      IFR."
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: FL 110
        wrongAnswers:
          - FL 90
          - FL 100
          - FL 120
        explanation: >-
          Minimum altitude 8 230 ft, plus the pressure correction of (1 013 −
          995) × 30 = 540 ft, plus the cold-temperature correction of about 4 ft
          per °C per 1 000 ft (18 × 4 × 8.2 ≈ 590 ft). That is about 9 360 ft.


          For a magnetic track of 123° the IFR levels are odd thousands, so the
          lowest suitable level is **FL110**.
