        unit: kt
      - id: d
        label: Distance ALT VOR to VILNA (read from the chart)
        unit: NM
    chartInputs:
      - d
    answer:
      formula: (fl * 100 - restr - (1013 - qnh) * 30) / roc * gs / 60 - d
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 - restr - (1013 - qnh) * 30) / roc * gs - d
      - id: d2
        formula: (fl * 100 - restr) / roc * gs / 60 - d
      - id: d3
        formula: (fl * 100 - restr + (1013 - qnh) * 30) / roc * gs / 60 - d
      - id: d4
        formula: ((fl * 100 - restr - (1013 - qnh) * 30) / roc * gs / 60) - d + 6
    presets:
      - id: p1
        values:
          fl: 110
          restr: 4000
          qnh: 1040
          roc: 800
          gs: 130
          d: 20.15
    explanation: >-
      The aircraft levels at the restriction altitude (QNH altitude) and then
      climbs to a flight level (pressure altitude). The height to climb must
      therefore be corrected for the difference between QNH and 1013 hPa (about
      30 ft per hPa). Climb distance = climb time x ground speed, which is then
      compared with the position of VILNA read from the chart.


      **Solution**


      Height to climb: {{= fl * 100 - restr - (1013 - qnh) * 30}} ft


      Climb distance: {{f: (fl * 100 - restr - (1013 - qnh) * 30) / roc * gs /
      60}} = {{n: (fl * 100 - restr - (1013 - qnh) * 30) / roc * gs / 60}} = {{=
      (fl * 100 - restr - (1013 - qnh) * 30) / roc * gs / 60}} NM


      ToC relative to VILNA: {{= (fl * 100 - restr - (1013 - qnh) * 30) / roc *
      gs / 60}} - {{d}} = **{{answer}} NM** (positive = after VILNA)


      **Why the other answers are wrong**


      - **{{d1}} NM**: the minutes were not converted to hours (division by 60
      forgotten).

      - **{{d2}} NM**: QNH correction ignored.

      - **{{d3}} NM**: QNH correction applied with the wrong sign.

      - **{{d4}} NM**: arithmetic slip, 6 NM added to the correct result.
