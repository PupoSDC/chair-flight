- id: QXXZAEUQV
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336492
    - ATPLGS-626296
    - AVEXAM-17602
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      An aeroplane is maintaining Mach 0.{{mach1_h}} at FL360, where the OAT is
      {{oat1}} °C. The crew are instructed by ATC to climb to and maintain
      FL380, where the OAT is {{oat2}} °C, and to maintain Mach 0.{{mach2_h}}.


      By how much will the TAS change? Give the change in knots (rounded to the
      nearest kt) and state whether it is an increase or a decrease.
    variables:
      - id: mach1_h
        label: Mach number at FL360 (x 100)
        unit: ""
      - id: oat1
        label: OAT at FL360
        unit: °C
      - id: mach2_h
        label: Mach number at FL380 (x 100)
        unit: ""
      - id: oat2
        label: OAT at FL380
        unit: °C
    answer:
      formula: mach2_h / 100 * 38.97 * sqrt(273.15 + oat2) - mach1_h / 100 * 38.97 *
        sqrt(273.15 + oat1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach1_h / 100 * 38.97 * sqrt(273.15 + oat1) - mach2_h / 100 * 38.97 *
          sqrt(273.15 + oat2)
      - id: d2
        formula: (mach2_h - mach1_h) / 100 * 38.97 * sqrt(273.15 + oat2)
      - id: d3
        formula: mach2_h / 100 * 38.97 * sqrt(273.15 + oat2)
      - id: d4
        formula: (mach2_h / 100 * 38.97 * sqrt(273.15 + oat2) - mach1_h / 100 * 38.97 *
          sqrt(273.15 + oat1)) * 1.852
    presets:
      - id: p1
        values:
          mach1_h: 77
          oat1: -55
          mach2_h: 79
          oat2: -52
      - id: p2
        values:
          mach1_h: 80
          oat1: -48
          mach2_h: 82
          oat2: -50
      - id: p3
        values:
          mach1_h: 76
          oat1: -58
          mach2_h: 78
          oat2: -55
    explanation: >-
      The TAS is the Mach number multiplied by the speed of sound, and the speed
      of sound depends only on the air temperature (in kelvin). A climb changes
      both the Mach number and the temperature, so the change in TAS is the
      difference between the two TAS values.


      **Solution**


      TAS at FL360 = {{n: mach1_h / 100 * 38.97 * sqrt(273.15 + oat1)}} kt


      TAS at FL380 = {{n: mach2_h / 100 * 38.97 * sqrt(273.15 + oat2)}} kt


      Change = {{f: mach2_h / 100 * 38.97 * sqrt(273.15 + oat2) - mach1_h / 100
      * 38.97 * sqrt(273.15 + oat1)}} = {{n: mach2_h / 100 * 38.97 * sqrt(273.15
      + oat2) - mach1_h / 100 * 38.97 * sqrt(273.15 + oat1)}} = **{{answer}} kt
      increase**


      **Why the other answers are wrong**

      - **{{d1}} kt**: reverses the subtraction, so an increase appears as a
      decrease (sign error).

      - **{{d2}} kt**: takes only the Mach number change into account and
      ignores the temperature change.

      - **{{d3}} kt**: gives the TAS at FL380 instead of the change.

      - **{{d4}} kt**: converts the change to km/h by multiplying by 1.852 (unit
      mistake).
