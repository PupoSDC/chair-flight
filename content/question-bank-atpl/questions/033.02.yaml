- id: QWUFGBOGN
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338948
    - ATPLGS-622499
    - AVEXAM-20320
  annexes:
    - jeppesen-ad-leal-10-3c-01
  learningObjectives:
    - "033.02"
  template:
    type: chart-calculation
    question: >-
      Refer to ALICANTE - Chart 10-3 from Jeppesen GSPRM 2017. After departure
      from ALICANTE, you just reach VILNA at FL{{fs}} as required. Your cruising
      level is FL{{fc}}. With an average rate of climb of {{roc}} ft/min and a
      ground speed of {{gs}} kt, where do you reach the cruising level? The
      distance from VILNA to ASTRO, read from the chart, is {{d}} NM.


      Give the position relative to ASTRO in NM (positive = after ASTRO,
      negative = before ASTRO).
    variables:
      - id: fs
        label: Flight level at VILNA
        unit: FL
      - id: fc
        label: Cruising level
        unit: FL
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
      - id: d
        label: Distance VILNA to ASTRO (read from the chart)
        unit: NM
    chartInputs:
      - d
    answer:
      formula: gs * (fc - fs) * 100 / roc / 60 - d
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: d - gs * (fc - fs) * 100 / roc / 60
      - id: d2
        formula: gs * (fc - fs) * 100 / roc / 60
      - id: d3
        formula: gs * (fc - fs) * 100 / roc - d
      - id: d4
        formula: gs * (fc - fs) / roc / 60 - d
    presets:
      - id: p1
        values:
          fs: 80
          fc: 200
          roc: 1200
          gs: 250
          d: 35.67
    explanation: >-
      The climb distance is the time to climb (height to climb divided by the
      rate of climb) multiplied by the ground speed. This distance is measured
      from the point where the climb starts (VILNA) and is then compared with
      the position of ASTRO read from the chart.


      **Solution**


      Climb distance: {{f: gs * (fc - fs) * 100 / roc / 60}} = {{n: gs * (fc -
      fs) * 100 / roc / 60}} = {{= gs * (fc - fs) * 100 / roc / 60}} NM


      Position relative to ASTRO: {{= gs * (fc - fs) * 100 / roc / 60}} - {{d}}
      = **{{answer}} NM** (positive = after ASTRO)


      **Why the other answers are wrong**


      - **{{d1}} NM**: sign reversed (distance to ASTRO minus climb distance).

      - **{{d2}} NM**: climb distance only, the distance to ASTRO is ignored.

      - **{{d3}} NM**: the minutes were not converted to hours (division by 60
      forgotten).

      - **{{d4}} NM**: the flight levels were not multiplied by 100 to give
      feet.
