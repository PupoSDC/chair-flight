  template:
    type: chart-calculation
    question: >-
      Refer to ALICANTE - Chart 10-3 from Jeppesen GSPRM 2017. Departing on SID
      ASTRO 4A, you are cleared to FL{{fl}}, with a restriction to maintain
      {{restr}} ft until passing ALT VOR. The QNH is {{qnh}} hPa, the aircraft
      climbs with an average ROC of {{roc}} ft/min, and the ground speed is
      {{gs}} kt. The distance from ALT VOR to VILNA, read from the chart, is
      {{d}} NM.


