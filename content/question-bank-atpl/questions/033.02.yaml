- id: Q4KDW9DYR
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334492
    - BGS-331151
    - AVEXAM-57457
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      How much is the clearance passing the highest obstacle in the following
      scenario?


      An aircraft is flying at FL{{fl}} in mountainous terrain on the northern
      side of the Alps and the charted minimum grid-area altitude is {{mga}} ft.


      The outside air temperature at FL{{fl}} is {{oat}}°C.


      The QNH is {{qnh}} hPa, given by a meteorological station with an
      elevation of {{elev}} ft.


      Assume 1 hPa = 30 ft. (The minimum grid-area altitude includes a 2 000 ft
      obstacle clearance in mountainous terrain.)
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: mga
        label: Minimum grid-area altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: qnh
        label: QNH
        unit: hPa
      - id: elev
        label: Station elevation
        unit: ft
    answer:
      formula: ((fl * 100 - (1013.25 - qnh) * 30) + 0.004 * (oat - (15 - 2 * fl / 10))
        * ((fl * 100 - (1013.25 - qnh) * 30) - elev)) - (mga - 2000)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: fl * 100 + 0.004 * (oat - (15 - 2 * fl / 10)) * (fl * 100 - elev) -
          (mga - 2000)
      - id: d2
        formula: (fl * 100 - (1013.25 - qnh) * 30) - (mga - 2000)
      - id: d3
        formula: ((fl * 100 - (1013.25 - qnh) * 30) + 0.004 * (oat - (15 - 2 * fl / 10))
          * ((fl * 100 - (1013.25 - qnh) * 30) - elev)) - mga
      - id: d4
        formula: ((fl * 100 - (1013.25 - qnh) * 30) + (1013.25 - qnh) * 60 + 0.004 *
          (oat - (15 - 2 * fl / 10)) * ((fl * 100 - (1013.25 - qnh) * 30) -
          elev)) - (mga - 2000)
      - id: d5
        formula: ((fl * 100 - (1013.25 - qnh) * 30) - 0.004 * (oat - (15 - 2 * fl / 10))
          * ((fl * 100 - (1013.25 - qnh) * 30) - elev)) - (mga - 2000)
    presets:
      - id: p1
        values:
          fl: 170
          mga: 16200
          oat: -29
          qnh: 1000.25
          elev: 13500
      - id: p2
        values:
          fl: 120
          mga: 12500
          oat: -12
          qnh: 1005
          elev: 8000
      - id: p3
        values:
          fl: 190
          mga: 17800
          oat: -35
          qnh: 995.25
          elev: 9000
    explanation: >-
      The altimeter at a flight level reads against 1013.25 hPa, so with a lower
      QNH the true altitude is lower; every hPa below standard is 30 ft. In cold
      air the true altitude is further reduced by 4 ft per 1 000 ft (above the
      station elevation) per °C below ISA. The highest obstacle is the minimum
      grid-area altitude minus the 2 000 ft clearance included in it.


      **Solution**


      Altitude with QNH = {{= fl * 100}} - ({{= 1013.25 - qnh}} * 30) = {{= fl *
      100 - (1013.25 - qnh) * 30}} ft

      ISA deviation = {{oat}} - ({{= 15 - 2 * fl / 10}}) = {{= oat - (15 - 2 *
      fl / 10)}} °C

      Temperature correction = 0.004 * {{= oat - (15 - 2 * fl / 10)}} * ({{= fl
      * 100 - (1013.25 - qnh) * 30}} - {{elev}}) = {{= 0.004 * (oat - (15 - 2 *
      fl / 10)) * (fl * 100 - (1013.25 - qnh) * 30 - elev)}} ft

      True altitude = {{= fl * 100 - (1013.25 - qnh) * 30 + 0.004 * (oat - (15 -
      2 * fl / 10)) * (fl * 100 - (1013.25 - qnh) * 30 - elev)}} ft

      Highest obstacle = {{= mga - 2000}} ft


      Clearance = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the QNH correction.

      - **{{d2}} ft**: ignores the temperature correction.

      - **{{d3}} ft**: forgets the 2 000 ft clearance already contained in the
      minimum grid-area altitude.

      - **{{d4}} ft**: applies the QNH correction with the wrong sign.

      - **{{d5}} ft**: applies the temperature correction with the wrong sign.
