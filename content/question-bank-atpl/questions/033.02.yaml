- id: Q6KUO5XKQ
  docId: "033.02"
  relatedQuestions:
    - QAHCIKEM
  externalIds:
    - ATPLQ-334727
    - BGS-330196
    - AVEXAM-16994
    - BGS-330219
  annexes:
    - CAP-697-page-51
  learningObjectives:
    - "033.02"
  template:
    type: chart-calculation
    question: >-
      (For this question use annex 033-012 rev. 05.11.2004 or Flight Planning
      Manual MRJT 1 Figure 4.5.1.) Given:


      - Brake release mass: 57 500 kg

      - Temperature: ISA -10 °C

      - Head wind component: {{headwind}} kt

      - Initial FL280, enroute climb 280/.74

      - Still air distance for the climb (read from the figure): {{nam}} NAM

      - Time for the climb (read from the figure): {{climb_time}} min


      What is the ground distance for the enroute climb, in NM?
    variables:
      - id: nam
        label: Still air distance (read from figure)
        unit: NAM
      - id: climb_time
        label: Climb time (read from figure)
        unit: min
      - id: headwind
        label: Head wind component
        unit: kt
    chartInputs:
      - nam
      - climb_time
    answer:
      formula: nam - headwind * climb_time / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: nam
      - id: d2
        formula: nam + headwind * climb_time / 60
      - id: d3
        formula: nam - headwind
      - id: d4
        formula: nam - 2 * headwind * climb_time / 60
    presets:
      - id: p1
        values:
          nam: 62
          climb_time: 11
          headwind: 16
    explanation: >-
      During the climb the aircraft moves through the air, but over the ground
      the headwind slows its progress. The distance lost is the headwind
      multiplied by the time spent climbing, and it is taken off the still air
      distance.


      **Solution**


      - Distance lost to the headwind: {{f: headwind * climb_time / 60}} = {{=
      headwind * climb_time / 60}} NM

      - Ground distance: {{f: nam - headwind * climb_time / 60}} = {{n: nam -
      headwind * climb_time / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: forgets the headwind and gives the still air distance.

      - **{{d2}} NM**: adds the headwind distance instead of taking it off.

      - **{{d3}} NM**: subtracts the headwind speed in knots without multiplying
      by the climb time.

      - **{{d4}} NM**: uses double the climb time.
- id: Q7SU8HW78
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334872
    - BGS-331391
    - ATPLQ-339780
    - ATPLQ-334059
    - AVEXAM-11912
