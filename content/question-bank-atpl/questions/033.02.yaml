- id: QZOIYREP
  docId: "033.02"
  relatedQuestions:
    - Q4VQQMPWG
  externalIds:
    - ATPLQ-336519
    - BGS-331388
    - AVEXAM-84853
    - AVEXAM-99834
    - ATPLGS-626620
    - AVEXAM-30993
  annexes: []
  learningObjectives:
    - 033.02.01.07.05
  template:
    type: calculation
    question: >-
      Determine the true airspeed (TAS) of the aeroplane at FL390, given the
      following data. Give the TAS in knots, rounded to the nearest 10 kt.


      Flight level: FL390


      - ISA deviation: ISA {{isa_dev}} °C

      - Mach number: M 0.{{mach_h}}
    variables:
      - id: mach_h
        label: Mach number (x 100)
        unit: ""
      - id: isa_dev
        label: ISA deviation
        unit: °C
    answer:
      formula: round(mach_h / 100 * 38.97 * sqrt(216.65 + isa_dev) / 10) * 10
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: round(mach_h / 100 * 38.97 * sqrt(288.15 + isa_dev) / 10) * 10
      - id: d2
        formula: round(mach_h / 100 * 38.97 * sqrt(216.65 - isa_dev) / 10) * 10
      - id: d3
        formula: round(38.97 * sqrt(216.65 + isa_dev) / 10) * 10
      - id: d4
        formula: round(mach_h / 100 * 38.97 * sqrt(216.65 + isa_dev) * 1.852 / 10) * 10
    presets:
      - id: p1
        values:
          mach_h: 82
          isa_dev: -10
      - id: p2
        values:
          mach_h: 78
          isa_dev: 5
      - id: p3
        values:
          mach_h: 80
          isa_dev: -15
    explanation: >-
      Above the tropopause (about FL360 in ISA) the static temperature is
      constant at -56.5 °C (216.65 K). An ISA deviation shifts the temperature
      by the same amount. The TAS is the Mach number multiplied by the speed of
      sound at that temperature, rounded to the nearest 10 kt as the question
      requires.


      **Solution**


      {{f: mach_h / 100 * 38.97 * sqrt(216.65 + isa_dev)}} = {{n: mach_h / 100 *
      38.97 * sqrt(216.65 + isa_dev)}} kt, which rounded to the nearest 10 kt
      gives **{{answer}} kt**


      **Why the other answers are wrong**

      - **{{d1}} kt**: uses the sea-level temperature (288.15 K) instead of the
      temperature at FL390.

      - **{{d2}} kt**: reverses the sign of the ISA deviation.

      - **{{d3}} kt**: forgets the Mach number and gives the speed of sound
      alone.

      - **{{d4}} kt**: multiplies by 1.852 as if converting to km/h (unit
      mistake).
