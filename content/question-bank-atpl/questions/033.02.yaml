  template:
    type: chart
    question: >-
      The minimum safe altitude is 8500 ft.


      The meteorological data gives an outside air temperature of -20°C at FL
      85\.


      The QNH, given by the reference meteorological station at an elevation of
      4000 ft, is 1003 hPa.


      What is the minimum pressure altitude which should be flown?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 9150 ft.
        wrongAnswers:
          - 8850 ft.
          - 9350 ft.
          - 8550 ft.
        explanation: >-
          Start from the safe altitude of 8 500 ft and add two corrections:


          - Cold air (ISA −18 °C): about 4 ft per °C per 1 000 ft over the 4 500
          ft above the station, which is 18 × 4 × 4.5 = 324 ft.

          - QNH of 1 003 hPa is 10 hPa below standard, adding 10 × 30 = 300 ft.


          The pressure altitude is about 8 500 + 324 + 300 = **9 150 ft**.
