- id: QWJJOEKYC
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333201
    - ATPLGS-629281
    - BGS-331104
    - AVEXAM-14984
    - BGS-331232
    - AVEXAM-4110
    - AVEXAM-46683
    - BGS-331191
    - ATPLGS-629370
    - BGS-331368
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: An aircraft is flying at FL{{fl}} above an airfield with an elevation
      of {{elev}} ft. If the airfield QNH is {{qnh}} hPa, and the temperature is
      {{isa_below}}°C below ISA, what is the true altitude above the aerodrome
      datum (ft, rounded to the nearest 10 ft)? (Assume 30 ft per hPa and a
      temperature correction of 4 ft per 1 000 ft per °C.)
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: isa_below
        label: Temperature below ISA
        unit: °C
    answer:
      formula: round((fl * 100 + (qnh - 1013) * 30 - elev) * (1 - 0.004 * isa_below) /
        10) * 10
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round((fl * 100 + (qnh - 1013) * 30 - elev) / 10) * 10
      - id: d2
        formula: round((fl * 100 + (qnh - 1013) * 30 - elev) * (1 + 0.004 * isa_below) /
          10) * 10
      - id: d3
        formula: round((fl * 100 + (qnh - 1013) * 30) * (1 - 0.004 * isa_below) / 10) *
          10
      - id: d4
        formula: round((fl * 100 - (qnh - 1013) * 30 - elev) * (1 - 0.004 * isa_below) /
          10) * 10
    presets:
      - id: p1
        values:
          fl: 35
          elev: 1416
          qnh: 1025
          isa_below: 12
      - id: p2
        values:
          fl: 55
          elev: 820
          qnh: 1008
          isa_below: 8
      - id: p3
        values:
          fl: 45
          elev: 2100
          qnh: 1020
          isa_below: 15
    explanation: >-
      With the QNH set, the altimeter reads altitude above mean sea level; the
      QNH difference from 1013 hPa shifts the level by 30 ft per hPa.
      Subtracting the aerodrome elevation gives the height above the aerodrome,
      and cold air makes the true height lower than indicated (4 ft per 1 000 ft
      per °C below ISA).


      **Solution**


      Height above aerodrome before temperature correction: {{= fl * 100 + (qnh
      - 1013) * 30 - elev}} ft


      {{f: round((fl * 100 + (qnh - 1013) * 30 - elev) * (1 - 0.004 * isa_below)
      / 10) * 10}} = {{n: round((fl * 100 + (qnh - 1013) * 30 - elev) * (1 -
      0.004 * isa_below) / 10) * 10}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: The temperature correction was omitted.

      - **{{d2}} ft**: The temperature correction was applied with the wrong
      sign (cold air does not raise the true height).

      - **{{d3}} ft**: The aerodrome elevation was not subtracted (true altitude
      rather than height above the aerodrome).

      - **{{d4}} ft**: The QNH correction was applied with the wrong sign.
