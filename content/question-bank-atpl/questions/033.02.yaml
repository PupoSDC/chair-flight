    - ATPLGS-110448
    - BGS-331368
    - BGS-331314
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      Determine the vertical distance between the departure aerodrome and the
      aircraft at the cruise level (the true height above the ground), given:


      - Aerodrome elevation: {{elev}} ft

      - Cruise level: FL{{fl}}

      - QNH at departure aerodrome: {{qnh}} hPa


      _Assume 30 ft per 1 hPa._ Round to the nearest 100 ft.
    variables:
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: fl
        label: Cruise flight level
        unit: ""
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: round((fl * 100 + (qnh - 1013) * 30 - elev) / 100) * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round((fl * 100 + (qnh - 1013) * 30) / 100) * 100
      - id: d2
        formula: round((fl * 100 - (qnh - 1013) * 30 - elev) / 100) * 100
      - id: d3
        formula: round((fl * 100 + (qnh - 1013) * 30 + elev) / 100) * 100
    presets:
      - id: p1
        values:
          elev: 3500
          fl: 250
          qnh: 1030
      - id: p2
        values:
          elev: 2000
          fl: 200
          qnh: 1025
    explanation: >-
      A flight level is referenced to 1013 hPa. When the QNH is higher than 1013
      hPa the true altitude is higher than the flight level by the pressure
      difference times 30 ft/hPa. The height above the aerodrome is then the
      true altitude minus the aerodrome elevation.


      **Solution**


      True altitude = {{= fl * 100}} ft + ({{qnh}} - 1013) hPa x 30 ft/hPa = {{=
      fl * 100 + (qnh - 1013) * 30}} ft


      Height above the aerodrome = {{= fl * 100 + (qnh - 1013) * 30}} ft -
      {{elev}} ft = {{= fl * 100 + (qnh - 1013) * 30 - elev}} ft, i.e.
      **{{answer}} ft** to the nearest 100 ft.


      **Why the other answers are wrong**


      - **{{d1}} ft**: the aerodrome elevation was not subtracted, so this is
      the true altitude, not the height above the aerodrome.

      - **{{d2}} ft**: the QNH correction was applied with the wrong sign (QNH
      above 1013 hPa lowers the altitude instead of raising it).

      - **{{d3}} ft**: the aerodrome elevation was added instead of subtracted.
