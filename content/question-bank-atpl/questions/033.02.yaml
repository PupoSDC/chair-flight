  template:
    type: calculation
    question: >-
      An aircraft on a magnetic track of 130° has to overfly an obstacle of
      {{obst}} ft with a clearance of {{clr}} ft.


      The QNH is {{qnh}} hPa and OAT is ISA + 10 °C.


      What is the minimum flight level (number, e.g. 290 for FL290) at which the
      aircraft may fly in RVSM airspace?


      Assume 1 hPa = 30 ft.
    variables:
      - id: obst
        label: Obstacle elevation
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: 10 * (2 * ceil(((obst + clr + (1013 - qnh) * 30) / 1000 - 1) / 2) + 1)
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ceil((obst + clr + (1013 - qnh) * 30) / 2000) * 20
      - id: d2
        formula: ceil((obst + clr + (1013 - qnh) * 30) / 100)
      - id: d3
        formula: 10 * (2 * ceil(((obst + clr + (1013 - qnh) * 30) / 1000 - 1) / 2) + 1)
          + 20
      - id: d4
        formula: ceil((obst + clr + (1013 - qnh) * 30) / 2000) * 20 + 20
    presets:
      - id: p1
        values:
          obst: 26500
          clr: 2000
          qnh: 1003
      - id: p2
        values:
          obst: 24300
          clr: 2000
          qnh: 1020
    explanation: >-
      The minimum altitude is obstacle plus clearance, corrected for QNH (30 ft
      per hPa below 1013 hPa). Warm air (above ISA) makes the real altitude
      higher than indicated, so no temperature margin is required. On an
      easterly magnetic track (000-179°) IFR levels in RVSM airspace are odd
      thousands (FL290, 310, ...), so the result is rounded up to the next one.


      **Solution**


      Required pressure altitude = {{f: obst + clr}} + {{= (1013 - qnh) * 30}} =
      {{= obst + clr + (1013 - qnh) * 30}} ft


      Next odd flight level: **FL{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: even levels (westerly semicircle) were used.

      - **{{d2}} **: no semicircular rounding was applied.

      - **{{d3}} **: rounded up one odd level too high.

      - **{{d4}} **: even level one step too high.
