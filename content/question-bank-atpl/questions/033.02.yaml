- id: QEOIZCKPO
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334990
    - BGS-331386
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: chart
    question: >-
      You are flying an ILS approach with a course of 245º(M) and an approach
      speed of 115 kt.


      The tower gives a wind of 280º/18 kt.


      In order to maintain the approach track, the nose of the aircraft has to
      be corrected (1)\_\_\_\_\_ with a corresponding groundspeed of
      (2)\_\_\_\_\_.
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: (1) 5° to the right; (2) 100 kt
        wrongAnswers:
          - (1) 5° to the left; (2) 133 kt
          - (1) 6° to the left; (2) 108 kt
          - (1) 6° to the right; (2) 129 kt
        explanation: >-
          The wind of 280° is 35° off the approach course of 245°, from the
          right. That gives a crosswind of 18 × sin 35° = 10.3 kt and a headwind
          of 18 × cos 35° = 14.7 kt.


          The correction angle is the angle whose sine is 10.3 ÷ 115, about 5°
          into the wind, so the nose points **5° to the right**. The groundspeed
          is about 115 − 15 = **100 kt**.
- id: QEQRCUYA
  docId: "033.02"
