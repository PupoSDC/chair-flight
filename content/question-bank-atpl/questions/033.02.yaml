  template:
    type: chart-calculation
    question: >-
      Refer to figure / chart.


      Determine the magnetic track for a direct flight from position 1 (latitude
      {{lat1}}° N, longitude {{lon1}}° E) to position 2 (latitude {{lat2}}° N,
      longitude {{lon2}}° E).


      Coordinates are in decimal degrees (west longitude negative).


      The magnetic variation read from the chart is {{var_e}}° (east positive,
      west negative).


      Give the magnetic track in degrees.
    variables:
      - id: lat1
        label: Latitude of position 1
        unit: °
      - id: lon1
        label: Longitude of position 1
        unit: °
      - id: lat2
        label: Latitude of position 2
        unit: °
      - id: lon2
        label: Longitude of position 2
        unit: °
      - id: var_e
        label: Magnetic variation (east positive, read from chart)
        unit: °
    chartInputs:
      - var_e
    answer:
      formula: atan2(-((lon2 - lon1) * cos((lat1 + lat2) / 2)), -(lat2 - lat1)) + 180
        - var_e
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan2(-((lon2 - lon1) * cos((lat1 + lat2) / 2)), -(lat2 - lat1)) + 180
      - id: d2
        formula: atan2(-((lon2 - lon1) * cos((lat1 + lat2) / 2)), -(lat2 - lat1)) + 180
          + var_e
      - id: d3
        formula: atan2((lon2 - lon1) * cos((lat1 + lat2) / 2), lat2 - lat1) + 180 -
          var_e
      - id: d4
        formula: atan2(-(lon2 - lon1), -(lat2 - lat1)) + 180 - var_e
    presets:
      - id: p1
        values:
          lat1: 48.9
          lon1: 12.5183
          lat2: 48.8233
          lon2: 13.3667
          var_e: 3
      - id: p2
        values:
          lat1: 48.5
          lon1: 9.6333
          lat2: 48.05
          lon2: 9.3667
          var_e: 1.5
      - id: p3
        values:
          lat1: 48.4167
          lon1: 9.8
          lat2: 48.2667
          lon2: 9.0667
          var_e: 4
      - id: p4
        values:
          lat1: 58.95
          lon1: -2.9
          lat2: 58.45
          lon2: -3.1
          var_e: -3
    explanation: >-
      The true track is found from the difference in latitude (north-south) and
      the difference in longitude multiplied by the cosine of the mean latitude
      (east-west, in nautical-mile equivalent). The magnetic track is the true
      track minus easterly variation (or plus westerly variation).


      **Solution**


      North-south difference = {{= lat2 - lat1}}°, east-west difference = {{=
      (lon2 - lon1) * cos((lat1 + lat2) / 2)}}°


      True track = {{= atan2(-((lon2 - lon1) * cos((lat1 + lat2) / 2)), -(lat2 -
      lat1)) + 180}}°


      Magnetic track = {{= atan2(-((lon2 - lon1) * cos((lat1 + lat2) / 2)),
      -(lat2 - lat1)) + 180}} - ({{var_e}}) = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}} °**: the variation is not applied (true track).

      - **{{d2}} °**: the variation is applied with the wrong sign.

      - **{{d3}} °**: the reciprocal track (direction from position 2 to
      position 1) is used.

      - **{{d4}} °**: the convergence of meridians is ignored (longitude
      difference not multiplied by cos of latitude).
