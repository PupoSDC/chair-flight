  template:
    type: chart
    question: "What is the minimum pressure altitude to pass a mountain ridge with
      2000 ft clearance with the following data? Mountain ridge elevation: 13500
      ft Outside Air temperature: ISA -15°C QNH given by a meteorological
      station at elevation 8000 ft: 1030 hPa Assume 1 hPa = 30 ft"
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 15 440 ft
        wrongAnswers:
          - 15 920 ft
          - 15 950 ft
          - 14 540 ft
        explanation: >-
          The ridge plus clearance is 13 500 + 2 000 = 15 500 ft.


          - Cold air (ISA −15 °C): 15 × 4 × 7.5 (1 000 ft units above the
          station) = 450 ft more, giving 15 950 ft indicated.

          - QNH of 1 030 hPa is 17 hPa above standard, which removes 17 × 30 =
          510 ft when converting to pressure altitude.


          The pressure altitude is 15 950 − 510 = **15 440 ft**.
