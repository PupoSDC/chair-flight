- id: QAFOWLCHV
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338545
    - AVEXAM-64411
    - BGS-331225
    - ATPLGS-629274
    - ATPLQ-333193
    - ATPLQ-338712
    - BGS-331432
  annexes:
    - jeppesen-enr-england-isle-of-man
    - jeppesen-enr-england-north
    - jeppesen-vfr-chart-03-enns-valley
  learningObjectives:
    - 033.01.01.02.02
    - "033.02"
  template:
    type: chart-calculation
    question: >-
      Refer to the Jeppesen GSPRM chart for the area. Find the distance between
      two points given by their coordinates:


      - Point 1: latitude N {{la1d}}° {{la1m}}', longitude {{lo1d}}° {{lo1m}}'

      - Point 2: latitude N {{la2d}}° {{la2m}}', longitude {{lo2d}}° {{lo2m}}'


      (Longitude is positive East and negative West, applied to both degrees and
      minutes.)


      Give the distance in NM.
    variables:
      - id: la1d
        label: Point 1 latitude degrees
        unit: °
      - id: la1m
        label: Point 1 latitude minutes
        unit: "'"
      - id: lo1d
        label: Point 1 longitude degrees
        unit: °
      - id: lo1m
        label: Point 1 longitude minutes
        unit: "'"
      - id: la2d
        label: Point 2 latitude degrees
        unit: °
      - id: la2m
        label: Point 2 latitude minutes
        unit: "'"
      - id: lo2d
        label: Point 2 longitude degrees
        unit: °
      - id: lo2m
        label: Point 2 longitude minutes
        unit: "'"
    chartInputs:
      - la1d
      - la1m
      - lo1d
      - lo1m
      - la2d
      - la2m
      - lo2d
      - lo2m
    answer:
      formula: 60 * acos(sin((la1d + la1m / 60)) * sin((la2d + la2m / 60)) + cos((la1d
        + la1m / 60)) * cos((la2d + la2m / 60)) * cos((lo2d + lo2m / 60) - (lo1d
        + lo1m / 60)))
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: 60 * sqrt(((la2d + la2m / 60) - (la1d + la1m / 60)) ^ 2 + ((lo2d + lo2m
          / 60) - (lo1d + lo1m / 60)) ^ 2)
      - id: d2
        formula: 60 * (abs((la2d + la2m / 60) - (la1d + la1m / 60)) + abs((lo2d + lo2m /
          60) - (lo1d + lo1m / 60)) * cos((la1d + la1m / 60)))
      - id: d3
        formula: 1.15078 * 60 * acos(sin((la1d + la1m / 60)) * sin((la2d + la2m / 60)) +
          cos((la1d + la1m / 60)) * cos((la2d + la2m / 60)) * cos((lo2d + lo2m /
          60) - (lo1d + lo1m / 60)))
      - id: d4
        formula: 1.852 * 60 * acos(sin((la1d + la1m / 60)) * sin((la2d + la2m / 60)) +
          cos((la1d + la1m / 60)) * cos((la2d + la2m / 60)) * cos((lo2d + lo2m /
          60) - (lo1d + lo1m / 60)))
    presets:
      - id: p1
        values:
          la1d: 53
          la1m: 36
          lo1d: -1
          lo1m: -5
          la2d: 53
          la2m: 45
          lo2d: -2
          lo2m: -6
      - id: p2
        values:
          la1d: 53
          la1m: 3
          lo1d: -1
          lo1m: -40
          la2d: 53
          la2m: 11
          lo2d: 0
          lo2m: -2
      - id: p3
        values:
          la1d: 47
          la1m: 54
          lo1d: 13
          lo1m: 56
          la2d: 47
          la2m: 30
          lo2d: 14
          lo2m: 30
    explanation: >-
      The distance between two points is the great-circle distance. The central
      angle between them in degrees, multiplied by 60, gives the distance in NM
      (1 arc minute = 1 NM). Over short distances this is nearly the same as the
      plane approximation using the mean latitude to compress the difference of
      longitude.


      **Solution**


      Latitudes and longitudes are first converted to decimal degrees (degrees +
      minutes / 60).


      {{f: 60 * acos(sin((la1d + la1m / 60)) * sin((la2d + la2m / 60)) +
      cos((la1d + la1m / 60)) * cos((la2d + la2m / 60)) * cos((lo2d + lo2m / 60)
      - (lo1d + lo1m / 60)))}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the convergence of the meridians was ignored (difference
      of longitude not multiplied by the cosine of the latitude).

      - **{{d2}} NM**: the north-south and east-west components were added
      instead of combined as the hypotenuse.

      - **{{d3}} NM**: the result was converted to statute miles.

      - **{{d4}} NM**: the result was converted to km.
