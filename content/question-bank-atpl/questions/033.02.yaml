- id: QLW4JIKIZ
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334424
    - AVEXAM-20369
    - ATPLGS-625333
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      For an IFR flight to Charleroi CRL the planned alternate is Liege LGG.
      Given the following information, what is the total time for the direct
      overhead flight from the destination to the alternate?


      - Track from CRL to LGG: {{trk}}°T

      - Distance from CRL to LGG: {{dist}} NM

      - Wind: {{wdir}}°T/{{wspd}} kt

      - TAS: {{tas}} kt
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: trk
        label: True track
        unit: °
      - id: wdir
        label: Wind direction (from)
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd * cos(wdir
        - trk)) * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tas * 60
      - id: d2
        formula: dist / (wspd * cos(wdir - trk)) * 60
      - id: d3
        formula: 2 * dist / tas * 60
      - id: d4
        formula: dist / (tas * cos(wdir - trk)) * 60
    presets:
      - id: p1
        values:
          dist: 39
          trk: 75
          wdir: 110
          wspd: 20
          tas: 280
      - id: p2
        values:
          dist: 52
          trk: 120
          wdir: 200
          wspd: 30
          tas: 250
      - id: p3
        values:
          dist: 64
          trk: 310
          wdir: 270
          wspd: 40
          tas: 300
    explanation: >-
      The flight time is the distance divided by the ground speed. The ground
      speed follows from the wind triangle: the wind correction angle is applied
      to the TAS and the wind component along the track is subtracted.


      **Solution**


      Wind correction angle: {{= asin(wspd * sin(wdir - trk) / tas)}}°


      Ground speed: {{= tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)}} kt


      {{f: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)) * 60}} = {{n: dist / (tas * cos(asin(wspd * sin(wdir -
      trk) / tas)) - wspd * cos(wdir - trk)) * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: ignores the wind and uses the TAS as ground speed.

      - **{{d2}} min**: uses the wind component along the track as ground speed.

      - **{{d3}} min**: doubles the distance.

      - **{{d4}} min**: multiplies the TAS by the cosine of the wind angle
      instead of subtracting the wind component.
