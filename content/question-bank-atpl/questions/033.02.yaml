  template:
    type: calculation
    question: The highest obstacle located within 8 km of a specific IFR route is
      {{obs}} ft. What is the minimum altitude providing the required obstacle
      clearance?
    variables:
      - id: obs
        label: Highest obstacle elevation
        unit: ft
    answer:
      formula: obs + 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ceil((obs + 1000) / 100) * 100
      - id: d2
        formula: obs + 2000
      - id: d3
        formula: ceil((obs + 2000) / 100) * 100
    presets:
      - id: p1
        values:
          obs: 1220
      - id: p2
        values:
          obs: 1650
      - id: p3
        values:
          obs: 960
    explanation: >-
      For IFR routes in non-mountainous terrain, the minimum altitude must
      provide at least 1000 ft of obstacle clearance above the highest obstacle
      within 8 km of the route.


      **Solution**


      {{f: obs + 1000}} = {{n: obs + 1000}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: rounds the result up to the next 100 ft, but the minimum
      altitude is simply obstacle plus 1000 ft.

      - **{{d2}} ft**: adds 2000 ft, the clearance required in mountainous
      terrain.

      - **{{d3}} ft**: adds 2000 ft and rounds up to the next 100 ft.
