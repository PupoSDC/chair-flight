- id: QWDMWWGL5
  docId: "033.02"
  relatedQuestions:
    - QQVW8RZYH
  externalIds:
    - ATPLQ-337947
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: |-
      Given the following information, calculate the ground speed:

      - True track = {{trk}}°
      - TAS = {{tas}} kt
      - W/V = {{wd}}°(T) / {{ws}} kt
    variables:
      - id: trk
        label: True track
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction (from)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: tas * cos(asin(ws * sin(wd - trk) / tas)) - ws * cos(wd - trk)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - ws
      - id: d2
        formula: tas - ws * cos(wd - trk)
      - id: d3
        formula: tas * cos(asin(ws * sin(wd - trk) / tas)) + ws * cos(wd - trk)
      - id: d4
        formula: tas
      - id: d5
        formula: tas * cos(asin(ws * sin(wd - trk) / tas))
    presets:
      - id: p1
        values:
          trk: 20
          tas: 180
          wd: 60
          ws: 30
      - id: p2
        values:
          trk: 90
          tas: 140
          wd: 130
          ws: 20
      - id: p3
        values:
          trk: 200
          tas: 150
          wd: 250
          ws: 35
    explanation: >-
      With the track known, the wind correction angle (WCA) follows from the
      sine rule: sin(WCA) = wind speed x sin(wind angle) / TAS. The ground speed
      is then the TAS component along the track minus the headwind component of
      the wind.


      **Solution**


      WCA = {{= asin(ws * sin(wd - trk) / tas)}}°


      {{f: tas * cos(asin(ws * sin(wd - trk) / tas)) - ws * cos(wd - trk)}} =
      {{n: tas * cos(asin(ws * sin(wd - trk) / tas)) - ws * cos(wd - trk)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: full wind speed subtracted from the TAS.

      - **{{d2}} kt**: the WCA is ignored; TAS minus the headwind component.

      - **{{d3}} kt**: the headwind component added instead of subtracted.

      - **{{d4}} kt**: the TAS taken as ground speed.

      - **{{d5}} kt**: the headwind component forgotten, only the WCA cosine
      applied.
