- id: QDWQLM9YQ
  docId: "033.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333936
    - ATPLGS-629302
    - AVEXAM-81806
    - AVEXAM-10933
    - AVEXAM-26587
    - ATPLGS-629358
    - AVEXAM-68487
    - BGS-331207
    - AVEXAM-8351
    - ATPLGS-629395
    - AVEXAM-70758
    - BGS-330995
  annexes: []
  learningObjectives:
    - "033.02"
  template:
    type: calculation
    question: >-
      Given the following information for a Commercial Air Transport flight:


      - Missed Approach at destination: {{ma}} min

      - Climb to cruise level: {{climb}} min

      - Cruise distance: {{dist}} NM

      - Cruise TAS: {{tas}} kt

      - Tailwind component: {{tw}} kt

      - Anticipated hold at alternate: {{hold}} min

      - Descent to alternate: {{desc}} min

      - Approach to alternate: {{appr}} min


      What is the time (in minutes) needed from the destination to the alternate
      aerodrome?
    variables:
      - id: ma
        label: Missed approach time
        unit: min
      - id: climb
        label: Climb time
        unit: min
      - id: dist
        label: Cruise distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
      - id: hold
        label: Hold time
        unit: min
      - id: desc
        label: Descent time
        unit: min
      - id: appr
        label: Approach time
        unit: min
    answer:
      formula: ma + climb + dist / (tas + tw) * 60 + hold + desc + appr
      unit: minutes
      decimals: 0
    distractors:
      - id: d1
        formula: ma + climb + dist / (tas + tw) * 60 + desc + appr
      - id: d2
        formula: ma + climb + dist / (tas - tw) * 60 + hold + desc + appr
      - id: d3
        formula: ma + climb + dist / (tas - tw) * 60 + desc + appr
    presets:
      - id: p1
        values:
          ma: 6
          climb: 7
          dist: 85
          tas: 165
          tw: 10
          hold: 10
          desc: 6
          appr: 7
      - id: p2
        values:
          ma: 5
          climb: 8
          dist: 120
          tas: 180
          tw: 20
          hold: 15
          desc: 7
          appr: 6
      - id: p3
        values:
          ma: 4
          climb: 6
          dist: 60
          tas: 150
          tw: 15
          hold: 8
          desc: 5
          appr: 9
    explanation: >-
      The time from the destination to the alternate is the sum of every phase
      flown after the decision to divert: missed approach, climb, cruise,
      descent, approach and the anticipated hold at the alternate. Cruise time
      uses the ground speed, i.e. TAS plus the tailwind component.


      **Solution**


      Cruise time = {{dist}} / ({{tas}} + {{tw}}) × 60 = {{= dist / (tas + tw) *
      60}} min

      Total = {{ma}} + {{climb}} + {{= dist / (tas + tw) * 60}} + {{hold}} +
      {{desc}} + {{appr}} = **{{answer}} minutes**


      **Why the other answers are wrong**

      - **{{d1}} minutes**: the anticipated hold at the alternate is left out.

      - **{{d2}} minutes**: the tailwind is subtracted from the TAS (treated as
      headwind).

      - **{{d3}} minutes**: tailwind treated as headwind and the hold is left
      out.
