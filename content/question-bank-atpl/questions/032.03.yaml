  template:
    type: chart
    question: >-
      Refer to the figure (CAP 698 Figure 3.1). Given the following information,
      what is the take-off ground roll required?


      - Airfield pressure altitude: {{pa}} ft

      - Airfield temperature: +{{temp}} °C

      - Headwind component: {{headwind}} kt

      - Take-off mass: {{mass}} lb


      What is the take-off ground roll required?
    explanation: ""
    variables:
      - id: pa
        label: Airfield pressure altitude
        unit: ft
      - id: temp
        label: Airfield temperature
        unit: °C
      - id: headwind
        label: Headwind component
        unit: kt
      - id: mass
        label: Take-off mass
        unit: lb
    entries:
      - id: e1
        values:
          pa: 2000
          temp: 11
          headwind: 10
          mass: 4350
        answer: 1350 ft
        wrongAnswers:
          - 1650 ft
          - 1200 ft
          - 1500 ft
        explanation: >-
          The take-off ground roll is the distance from brake release until the
          aircraft lifts off. It is read from the chart by entering with the
          pressure altitude and temperature, then applying the headwind and the
          take-off mass.


          **Solution**


          At {{pa}} ft, +{{temp}} °C, a {{headwind}} kt headwind and a take-off
          mass of {{mass}} lb, the chart gives a ground roll of **1350 ft**.


          **Why the other answers are wrong**


          - **1650 ft**: the total distance to 50 ft, not the ground roll.

          - **1200 ft**: applies the headwind correction twice.

          - **1500 ft**: reads the line for a higher take-off mass.
- id: QUJOIWWZ
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328479
    - BGS-320955
    - AVEXAM-28983
    - AVEXAM-93647
    - BGS-321135
    - ATPLQ-323517
  annexes:
    - CAP-698-page-29
  learningObjectives:
    - 032.03.03.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure or CAP 698, figure 3.2. For a multi-engined piston
      aeroplane, the following values are read from the figure:


      - Accelerate-stop distance before wind correction: {{asd_base}} ft

      - Wind correction factor: {{wind_factor}}


      What is the accelerate-stop distance (ASD) in feet?
    variables:
      - id: asd_base
        label: ASD before wind correction (read from figure)
        unit: ft
      - id: wind_factor
        label: Wind correction factor (read from figure)
        unit: ""
    chartInputs:
      - asd_base
      - wind_factor
    answer:
      formula: asd_base * wind_factor
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: asd_base
      - id: d2
        formula: asd_base / wind_factor
      - id: d3
        formula: asd_base * (2 - wind_factor)
      - id: d4
        formula: asd_base * wind_factor * 1.1
    presets:
      - id: p1
        values:
          asd_base: 4000
          wind_factor: 1.15
      - id: p2
        values:
          asd_base: 4800
          wind_factor: 0.875
      - id: p3
        values:
          asd_base: 3600
          wind_factor: 1.1
    explanation: >-
      The accelerate-stop chart gives the distance for still air. Wind changes
      this distance: a headwind shortens it and a tailwind lengthens it, so the
      wind correction factor from the figure is applied to the distance read
      from the chart.


      **Solution**


      {{f: asd_base * wind_factor}} = {{n: asd_base * wind_factor}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the wind correction completely.

      - **{{d2}} ft**: divides by the correction factor instead of multiplying,
      which reverses the effect of the wind.

      - **{{d3}} ft**: applies the wrong sign to the correction, so the wind
      effect is reversed.

      - **{{d4}} ft**: adds an extra 10% on top of the correct wind correction.
