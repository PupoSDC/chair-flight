- id: QLVVBSL2Z
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326258
    - AVEXAM-16617
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: An aircraft is flying with a TAS of {{tas}} kt and has a climb
      gradient of {{grad}}%. What flight path climb gradient can be achieved if
      the headwind is increased by {{hw}} kt?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: grad
        label: initial climb gradient
        unit: "%"
      - id: hw
        label: headwind increase
        unit: kt
    answer:
      formula: grad * tas / (tas - hw)
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: grad * tas / (tas + hw)
      - id: d2
        formula: grad * (tas + hw) / tas
      - id: d3
        formula: grad
    presets:
      - id: p1
        values:
          tas: 119
          grad: 6.1
          hw: 20
      - id: p2
        values:
          tas: 110
          grad: 5.5
          hw: 15
      - id: p3
        values:
          tas: 130
          grad: 7.2
          hw: 25
    explanation: >-
      The climb gradient over the ground is the rate of climb divided by the
      ground speed. The rate of climb does not change with wind, but a larger
      headwind lowers the ground speed, so the gradient increases in proportion
      TAS / (TAS - headwind increase).


      **Solution**


      {{f: grad * tas / (tas - hw)}} = {{n: grad * tas / (tas - hw)}} =
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: the extra headwind is added to the ground speed, as if it
      were a tailwind.

      - **{{d2}} %**: the ratio is applied the wrong way round (ground speed in
      the numerator, TAS in the denominator inverted).

      - **{{d3}} %**: assumes the gradient does not change with the wind.
