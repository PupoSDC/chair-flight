        values:
          oat: 15
          pa: 6000
          headwind: 10
          ldd: 2075
        answer: 3950 lb, 77 kt
        wrongAnswers:
          - 3500 lb, 73 kt
          - 4450 lb, 81 kt
          - 3200 lb, 70 kt
        explanation: >-
          The field-length limited landing mass is the heaviest mass that can
          stop within the defactored landing distance. Enter the chart with the
          temperature, pressure altitude, headwind and defactored distance. The
          50 ft barrier speed is read from the same mass line.


          **Solution**


          For a defactored landing distance of {{ldd}} ft at +{{oat}} °C, {{pa}}
          ft and a {{headwind}} kt headwind, the chart gives a landing mass of
          **3950 lb** and a 50 ft barrier speed of **77 kt**.


          **Why the other answers are wrong**


          - **3500 lb, 73 kt**: reads a lower mass line, which gives a lower
          speed.

          - **4450 lb, 81 kt**: reads a higher mass line, which needs a longer
          distance than available.

          - **3200 lb, 70 kt**: applies the headwind correction twice.
