- id: QRIHKQHF2
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326652
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      Calculate the de-factored field length that should be used for input into
      the performance graphs for an SEP aircraft from the data below.


      TORA: {{tora}} ft

      Surface and condition: wet grass

      Slope: {{slope}}% upslope

      (There is no stopway or clearway)
    variables:
      - id: tora
        label: TORA
        unit: ft
      - id: slope
        label: Upslope
        unit: "%"
    answer:
      formula: tora / (1.25 * 1.3 * (1 + 0.05 * slope))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: tora / (1.2 * 1.3 * (1 + 0.05 * slope))
      - id: d2
        formula: tora / (1.2 * (1 + 0.05 * slope))
      - id: d3
        formula: tora / (1.08 * (1 + 0.05 * slope))
      - id: d4
        formula: tora / (1.25 * 1.3)
    presets:
      - id: p1
        values:
          tora: 4500
          slope: 1
      - id: p2
        values:
          tora: 3200
          slope: 2
      - id: p3
        values:
          tora: 2800
          slope: 1.5
    explanation: >-
      The available take-off distance is divided by the regulatory factor 1.25,
      the wet grass factor 1.3 and the upslope correction (5% per 1% of
      upslope). With no stopway or clearway the TORA is the only distance to
      consider.


      **Solution**


      Slope factor = 1 + 0.05 x {{slope}} = {{= 1 + 0.05 * slope}}


      {{f: tora / (1.25 * 1.3 * (1 + 0.05 * slope))}} = {{n: tora / (1.25 * 1.3
      * (1 + 0.05 * slope))}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: uses a factor 1.2 instead of 1.25.

      - **{{d2}} ft**: uses 1.2 and omits the wet grass factor.

      - **{{d3}} ft**: uses a factor 1.08 and omits the wet grass factor.

      - **{{d4}} ft**: forgets the upslope correction.
