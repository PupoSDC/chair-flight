- id: QMZPPKDLM
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-327777
    - ATPLQ-327879
    - AVEXAM-60369
    - AVEXAM-72707
    - AVEXAM-19728
    - BGS-320977
    - BGS-321001
    - BGS-321167
    - BGS-321191
    - BGS-321113
  annexes: []
  learningObjectives:
    - "032.03"
    - 032.03.03.04.05
  template:
    type: calculation
    question: >-
      Determine the maximum de-factored landing distance (the distance to use in
      the landing performance graph) for a Performance Class B aeroplane
      operated for Commercial Air Transport, given:


      Landing distance available: {{lda}} ft

      Runway surface: paved

      Runway condition: wet (factor 1.15)

      Runway slope: {{slope}}% downslope


      The landing distance must be increased by 5% for each 1% downslope.
    variables:
      - id: lda
        label: LDA
        unit: ft
      - id: slope
        label: Downslope
        unit: "%"
    answer:
      formula: lda / (1.43 * 1.15 * (1 + 0.05 * slope))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: lda / (1.15 * 1.05)
      - id: d2
        formula: lda / (1.43 * 1.15 * 1.05)
      - id: d3
        formula: lda / (1.15 * (1 + 0.05 * slope))
      - id: d4
        formula: lda / 1.43
      - id: d5
        formula: lda / (1.43 * 1.15 * 1.25)
    presets:
      - id: p1
        values:
          lda: 3150
          slope: 1.4
      - id: p2
        values:
          lda: 4300
          slope: 0.5
      - id: p3
        values:
          lda: 3800
          slope: 2
    explanation: >-
      For Class B aeroplanes the landing distance required may not exceed LDA
      divided by the product of the applicable factors: 1.43 (regulatory
      factor), 1.15 for a wet runway and the downslope correction of 5% per 1%
      of slope. The result is the distance used to enter the landing graph.


      **Solution**


      Slope factor = 1 + 0.05 x {{slope}} = {{= 1 + 0.05 * slope}}


      {{f: lda / (1.43 * 1.15 * (1 + 0.05 * slope))}} = {{n: lda / (1.43 * 1.15
      * (1 + 0.05 * slope))}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: omits the 1.43 factor and applies the slope correction as
      a flat 5%.

      - **{{d2}} ft**: applies the slope correction as a flat 5% instead of 5%
      per 1% of slope.

      - **{{d3}} ft**: omits the 1.43 regulatory factor.

      - **{{d4}} ft**: only applies the 1.43 factor and forgets the wet runway
      and slope corrections.

      - **{{d5}} ft**: replaces the slope correction with an arbitrary 25%
      increase.
