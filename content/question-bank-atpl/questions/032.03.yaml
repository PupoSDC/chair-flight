      Refer to the figure (CAP 698 Figure 3.10). Given the following
      information, calculate the field-length limited landing mass and the 50 ft
      barrier speed for a Performance Class B aeroplane.


      - OAT: +{{oat}} °C

      - Aerodrome pressure altitude: {{pa}} ft

      - Headwind component: {{headwind}} kt

      - Defactored landing distance: {{ldd}} ft

      - Technique: short field landing


      What are the landing mass and the 50 ft barrier speed?
    explanation: ""
    variables:
      - id: oat
        label: OAT
        unit: °C
      - id: pa
        label: Aerodrome pressure altitude
        unit: ft
      - id: headwind
        label: Headwind component
        unit: kt
      - id: ldd
        label: Defactored landing distance
        unit: ft
    entries:
