  template:
    type: chart-calculation
    question: >-
      Refer to figure (CAP 698 Figure 2.2). Using the take-off performance chart
      for a single engine aeroplane, calculate the gross take-off distance.


      Aircraft mass: 3 350 lb

      Pressure altitude: 3 500 ft

      Headwind component: 15 kt

      OAT: 26°C

      Runway: dry grass

      Correction factor: {{cf}}


      Take-off distance read from the graph (before correction): {{td}} ft
    variables:
      - id: td
        label: Take-off distance read from the graph
        unit: ft
      - id: cf
        label: Correction factor
        unit: ""
    chartInputs:
      - td
    answer:
      formula: td * cf
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: td
      - id: d2
        formula: td / cf
      - id: d3
        formula: td * cf * cf
      - id: d4
        formula: td * (2 - cf)
    presets:
      - id: p1
        values:
          td: 1900
          cf: 1.2
      - id: p2
        values:
          td: 1600
          cf: 1.25
    explanation: >-
      The graph gives the take-off distance on a hard dry runway. For a grass
      surface the value must be multiplied by the correction factor.


      **Solution**


      {{f: td * cf}} = {{n: td * cf}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: omits the correction factor.

      - **{{d2}} ft**: divides by the correction factor instead of multiplying.

      - **{{d3}} ft**: applies the correction factor twice.

      - **{{d4}} ft**: applies a reduction instead of an increase.
