  template:
    type: chart-calculation
    question: >-
      Refer to CAP 698 figure 2.2. Calculate the ground roll distance required
      for a normal take-off of a Commercial Air Transport single-engined piston
      aeroplane.


      Aerodrome pressure altitude: 2 000 ft

      OAT: +20°C

      Take-off mass: 3 200 lb

      Wind component: 15 kt headwind

      Runway surface: 5 cm grass, dry

      Aerodrome field lengths unbalanced

      Correction factor for the runway condition: {{cf}}


      Ground roll read from the graph (before correction): {{gr}} ft
    variables:
      - id: gr
        label: Ground roll read from the graph
        unit: ft
      - id: cf
        label: Correction factor
        unit: ""
    chartInputs:
      - gr
    answer:
      formula: gr * cf
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: gr
      - id: d2
        formula: gr / cf
      - id: d3
        formula: gr * cf * cf
      - id: d4
        formula: gr * (2 - cf)
    presets:
      - id: p1
        values:
          gr: 750
          cf: 1.2
      - id: p2
        values:
          gr: 600
          cf: 1.25
    explanation: >-
      The graph gives the ground roll on a hard dry runway. For a grass surface
      the value must be multiplied by the correction factor.


      **Solution**


      {{f: gr * cf}} = {{n: gr * cf}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: omits the correction factor.

      - **{{d2}} ft**: divides by the correction factor instead of multiplying.

      - **{{d3}} ft**: applies the correction factor twice.

      - **{{d4}} ft**: applies a reduction instead of an increase.
