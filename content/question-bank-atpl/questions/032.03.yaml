          the chart gives a take-off distance to 50 ft of **1 900 ft**, a
          rotation speed of **68 kt** and a 50 ft speed of **78 kt**.


          **Why the other answers are wrong**


          - **TOD 2 200 ft, rotation 70 kt, 50 ft 80 kt**: ignores the headwind
          correction and reads a higher temperature line.

          - **TOD 1 850 ft, rotation 70 kt, 50 ft 80 kt**: mixes the distance
          from one row with the speeds from another.

          - **TOD 1 650 ft, rotation 68 kt, 50 ft 78 kt**: applies the headwind
          correction twice, which shortens the distance.
