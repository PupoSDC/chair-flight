    - ATPLQ-323271
  annexes: []
  learningObjectives:
    - 032.03.03.01.08
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Calculate the de-factored distance for TODA that
      could be used to enter the take-off performance graph for a multi-engine
      piston aeroplane used for Commercial Air Transport, given:


      - Take-off distance available: {{toda}} ft

      - The regulatory factor read from the figure for the stated runway slope,
      surface and field lengths: {{factor}}


      Give the answer in ft.
    variables:
      - id: toda
        label: Take-off distance available
        unit: ft
      - id: factor
        label: Factor read from the figure
        unit: ""
    chartInputs:
      - factor
    answer:
      formula: toda / factor
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: toda * factor
      - id: d2
        formula: toda * (2 - factor)
      - id: d3
        formula: toda / (factor * factor)
      - id: d4
        formula: toda / (factor + 1)
    presets:
      - id: p1
        values:
          toda: 2300
          factor: 1.15
      - id: p2
        values:
          toda: 4230
          factor: 1.2075
      - id: p3
        values:
          toda: 3100
          factor: 1.3
    explanation: >
      The distance available is first de-factored: the available distance is
      divided by the combined regulatory factor for the conditions (slope,
      surface, field length type), giving the distance with which the take-off
      graph is entered. The factor is read from the figure.


      **Solution**


      {{f: toda / factor}} = {{n: toda / factor}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: multiplies by the factor instead of dividing.

      - **{{d2}} ft**: applies the factor as a linear reduction instead of
      dividing.

      - **{{d3}} ft**: applies the factor twice.

      - **{{d4}} ft**: divides by the factor plus one instead of the factor
      itself.
