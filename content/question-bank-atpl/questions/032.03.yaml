      must be used in order to calculate the Landing Distance Required (LDR) on
      Runway 23 at Glasgow Airport (EGPF)?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 2356 m
        wrongAnswers:
          - 2454 m
          - 3090 m
          - 2661 m
        explanation: >-
          The declared distances for each runway are listed on the aerodrome
          chart. For a landing calculation, use the declared distance shown for
          landing on the runway in use.


          **Solution**


          - Find the Runway 23 entry on the aerodrome chart and read the
          declared distance shown for landing.

          - The value is 2356 m.


          **Why the other answers are wrong**


