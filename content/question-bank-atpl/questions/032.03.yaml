- id: QU35DYQDS
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326764
    - ATPLGS-107649
    - AVEXAM-66355
    - BGS-320162
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      The climb gradient of an aircraft after take-off is {{base}}% in standard
      atmosphere, no wind, at 0 ft pressure altitude. Use the following
      corrections:


      - ± {{ce}}% per 1 000 ft field elevation

      - ± {{ct}}% per °C from standard temperature

      - -{{wing}}% with wing anti-ice

      - -{{eng}}% with engine anti-ice


      What is the climb gradient after take-off from an airport at {{elev}} ft
      elevation, {{temp}}°C, QNH 1013.25 hPa, with wing and engine anti-ice
      operating? (ISA: 15°C at sea level, -2°C per 1 000 ft)
    variables:
      - id: base
        label: base gradient
        unit: "%"
      - id: elev
        label: elevation
        unit: ft
      - id: temp
        label: OAT
        unit: °C
      - id: ce
        label: elevation correction per 1 000 ft
        unit: "%"
      - id: ct
        label: temperature correction per °C
        unit: "%"
      - id: wing
        label: wing anti-ice correction
        unit: "%"
      - id: eng
        label: engine anti-ice correction
        unit: "%"
    answer:
      formula: base - ce * elev / 1000 - ct * (temp - (15 - 2 * elev / 1000)) - wing -
        eng
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: base - ce * elev / 1000 - ct * (temp - (15 - 2 * elev / 1000)) - eng
      - id: d2
        formula: base - ce * elev / 1000 - wing - eng
      - id: d3
        formula: base + ce * elev / 1000 - wing - eng
    presets:
      - id: p1
        values:
          base: 6
          elev: 1000
          temp: 17
          ce: 0.2
          ct: 0.1
          wing: 1
          eng: 0.5
      - id: p2
        values:
          base: 5
          elev: 2000
          temp: 22
          ce: 0.2
          ct: 0.1
          wing: 1
          eng: 0.5
      - id: p3
        values:
          base: 7
          elev: 500
          temp: 10
          ce: 0.2
          ct: 0.1
          wing: 1
          eng: 0.5
    explanation: >-
      The gradient is corrected downwards for field elevation, for temperatures
      above ISA and for each anti-ice system in use. The temperature correction
      applies to the deviation from the ISA temperature at the field elevation.


      **Solution**


      ISA temperature at {{elev}} ft = {{n: 15 - 2 * elev / 1000}} = {{= 15 - 2
      * elev / 1000}} °C, so the deviation is {{= temp - (15 - 2 * elev /
      1000)}} °C.


      {{f: base - ce * elev / 1000 - ct * (temp - (15 - 2 * elev / 1000)) - wing
      - eng}} = {{n: base - ce * elev / 1000 - ct * (temp - (15 - 2 * elev /
      1000)) - wing - eng}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: applies only the engine anti-ice correction and forgets
      the wing anti-ice correction.

      - **{{d2}} %**: forgets the temperature correction.

      - **{{d3}} %**: adds the elevation correction instead of subtracting it
      and forgets the temperature correction.
