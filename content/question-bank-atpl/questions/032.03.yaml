- id: QK3TPQNNS
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-325954
    - AVEXAM-82955
    - ATPLGS-629309
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      At an aerodrome, the minimum climb gradient for obstacle clearance is
      {{grad}} %. What is the minimum rate of climb (in ft/min, rounded to the
      nearest 10) the pilot has to maintain during the climb?


      - TAS: {{tas}} kt

      - Tailwind: {{tw}} kt


      (1 NM = 6076 ft)
    variables:
      - id: grad
        label: Minimum climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: round(grad / 100 * (tas + tw) * 6076 / 60 / 10) * 10
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: grad / 100 * (tas - tw) * 6076 / 60
      - id: d2
        formula: grad / 100 * tas * 6076 / 60
      - id: d3
        formula: grad / 100 * (tas + tw) * 60
      - id: d4
        formula: grad / 100 * (tas + tw) * 1852 / 60
    presets:
      - id: p1
        values:
          grad: 6.3
          tas: 135
          tw: 8
      - id: p2
        values:
          grad: 5
          tas: 120
          tw: 10
      - id: p3
        values:
          grad: 4.5
          tas: 150
          tw: 5
    explanation: >
      A climb gradient is the ratio of height gained to horizontal distance
      covered over the ground, so the required rate of climb equals gradient
      times ground speed. With a tailwind the ground speed is higher than the
      TAS, so a higher rate of climb is needed.


      **Solution**


      Ground speed = {{tas}} + {{tw}} = {{= tas + tw}} kt = {{= (tas + tw) *
      6076 / 60}} ft/min


      {{f: grad / 100 * (tas + tw) * 6076 / 60}} = {{n: grad / 100 * (tas + tw)
      * 6076 / 60}} ft/min, i.e. about **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: subtracts the tailwind (treats it as a headwind).

      - **{{d2}} ft/min**: ignores the wind and uses the TAS as ground speed.

      - **{{d3}} ft/min**: uses 60 instead of 6076/60 to convert knots to
      ft/min.

      - **{{d4}} ft/min**: uses 1852 (metres per NM) instead of 6076 ft per NM.
