- id: Q8M6RJLJ2
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328116
    - AVEXAM-94172
    - BGS-321202
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: From the screen height of {{sh}} ft, a single-engined piston aeroplane
      performs a straight-out climb in VMC with an air climb gradient of
      {{grad}}%, a TAS of {{tas}} kt and a headwind component of {{hw}} kt. What
      will be the expected height clearance above a group of trees that are
      {{obst}} m tall and located {{dist}} m from reference zero on the extended
      runway centre line? (1 ft = 0.3048 m)
    variables:
      - id: sh
        label: screen height
        unit: ft
      - id: grad
        label: climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: headwind
        unit: kt
      - id: obst
        label: obstacle height
        unit: m
      - id: dist
        label: distance
        unit: m
    answer:
      formula: sh * 0.3048 + grad / 100 * dist * tas / (tas - hw) - obst
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: sh * 0.3048 + grad / 100 * dist - obst
      - id: d2
        formula: grad / 100 * dist * tas / (tas - hw) - obst
      - id: d3
        formula: sh + grad / 100 * dist * tas / (tas - hw) - obst
    presets:
      - id: p1
        values:
          sh: 50
          grad: 9
          tas: 60
          hw: 10
          obst: 8
          dist: 250
      - id: p2
        values:
          sh: 50
          grad: 8
          tas: 70
          hw: 10
          obst: 10
          dist: 300
      - id: p3
        values:
          sh: 50
          grad: 7
          tas: 80
          hw: 15
          obst: 12
          dist: 400
    explanation: >-
      The climb gradient is flown through the air, so a headwind steepens the
      flight path over the ground: the gradient over the ground is the air
      gradient multiplied by TAS / ground speed. The height at the obstacle is
      the screen height plus the climb gained over the horizontal distance; the
      clearance is that height minus the obstacle height.


      **Solution**


      Ground speed = {{n: tas - hw}} = {{= tas - hw}} kt


      Gradient over the ground = {{n: grad * tas / (tas - hw)}} = {{= grad * tas
      / (tas - hw)}} %


      Height gained = {{n: grad / 100 * dist * tas / (tas - hw)}} = {{= grad /
      100 * dist * tas / (tas - hw)}} m


      Clearance = {{n: sh * 0.3048 + grad / 100 * dist * tas / (tas - hw) -
      obst}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: ignores the wind effect and uses the air gradient directly
      over the ground.

      - **{{d2}} m**: forgets the screen height ({{sh}} ft) that the climb
      starts from.

      - **{{d3}} m**: adds the screen height in feet to a result in metres
      without converting.
- id: QAA8MKRH8
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-327893
    - BGS-320777
    - AVEXAM-98974
    - BGS-320974
  annexes:
    - CAP-698-page-52
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      Using the information provided below, calculate the maximum crosswind
      component that can be expected on departure.


      - Runway heading: {{hdg}}°(M)

      - Wind: {{wdir}}°(M) / {{wspd}} gusting {{gust}} kt
    variables:
      - id: hdg
        label: Runway heading
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Mean wind speed
        unit: kt
      - id: gust
        label: Gust speed
        unit: kt
    answer:
      formula: abs(gust * sin(wdir - hdg))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: abs(wspd * sin(wdir - hdg))
      - id: d2
        formula: abs(gust * cos(wdir - hdg))
      - id: d3
        formula: abs(wspd * cos(wdir - hdg))
    presets:
      - id: p1
        values:
          hdg: 190
          wdir: 270
          wspd: 24
          gust: 35
      - id: p2
        values:
          hdg: 90
          wdir: 130
          wspd: 22
          gust: 32
      - id: p3
        values:
          hdg: 110
          wdir: 160
          wspd: 28
          gust: 38
    explanation: >-
      The crosswind component is the part of the wind speed that blows
      perpendicular to the runway: wind speed times the sine of the angle
      between wind direction and runway heading. The maximum value expected is
      found with the gust speed.


      **Solution**


      Angle between wind and runway = {{wdir}}° - {{hdg}}° = {{= wdir - hdg}}°


      {{f: gust * sin(wdir - hdg)}} = {{n: gust * sin(wdir - hdg)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the mean wind speed instead of the gust speed.

      - **{{d2}} kt**: uses the cosine, which gives the headwind component with
      the gust speed.

      - **{{d3}} kt**: uses the cosine (headwind component) with the mean wind
      speed.
