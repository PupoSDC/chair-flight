      - id: d2
        formula: roc * 0.6
      - id: d3
        formula: roc + 320
      - id: d4
        formula: roc - 320
    presets:
      - id: p1
        values:
          oat: 10
          pa: 2000
          mass: 3750
          roc: 1770
      - id: p2
        values:
          oat: -20
          pa: 14000
          mass: 4000
          roc: 1300
    explanation: >-
      The rate of climb of the twin-engine aeroplane with both engines operating
      is read from the climb performance graph by entering with pressure
      altitude, OAT and gross mass, following the full-rich mixture line.


      **Solution**


      Entering the figure with the given conditions gives two engine rate of
      climb = **{{answer}} ft/min**.


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: reading the wrong line or an overstated value on the
      graph (+25 %).

      - **{{d2}} ft/min**: reading a value that is too low (about 40 % less).

      - **{{d3}} ft/min**: reading the graph at a neighbouring
      altitude/temperature (about 320 ft/min too high).

      - **{{d4}} ft/min**: reading the graph at a neighbouring
      altitude/temperature (about 320 ft/min too low).
- id: QNFHRRQXP
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-323126
    - BGS-321194
    - AVEXAM-98405
    - BGS-321042
  annexes:
    - CAP-698-page-37
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 698 Figure 3.6). Calculate the all-engines
      obstacle clearance of a multi-engine aeroplane from the end of take-off
      (reference zero).


      - Ground speed: {{gs}} kt

      - Obstacle height: {{oh}} ft AGL

      - Obstacle distance: {{dist}} ft from reference zero

      - Rate of climb read from the chart: {{roc}} ft/min (1 NM = 6 080 ft)
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: oh
        label: Obstacle height
        unit: ft
      - id: dist
        label: Obstacle distance
        unit: ft
      - id: roc
        label: Rate of climb read from the graph
        unit: ft/min
    chartInputs:
      - roc
    answer:
      formula: dist * 60 / (gs * 6080) * roc - oh
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 60 / (gs * 6080) * roc
      - id: d2
        formula: dist * 60 / (gs * 6080) * roc + oh
      - id: d3
        formula: dist * 60 / (gs * 6080) * roc / 1.3 - oh
      - id: d4
        formula: dist / gs * roc / 60 - oh
    presets:
      - id: p1
        values:
          gs: 121
          oh: 2000
          dist: 15200
          roc: 1865
    explanation: >-
      Time to the obstacle = distance / ground speed. Height gained = time x
      rate of climb. The clearance is the gained height minus the obstacle
      height.


      **Solution**


      Time = {{= dist * 60 / (gs * 6080)}} min


      {{f: dist * 60 / (gs * 6080) * roc - oh}} = {{n: dist * 60 / (gs * 6080) *
      roc - oh}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the obstacle height not subtracted.

      - **{{d2}} ft**: the obstacle height added instead of subtracted.

      - **{{d3}} ft**: an unnecessary gross-to-net factor applied for
      all-engines.

      - **{{d4}} ft**: distance in feet treated as nautical miles in the time
      calculation.
- id: QNNWBEQU
  docId: "032.03"
  relatedQuestions:
    - QBWREFYJ
  externalIds:
    - ATPLQ-324961
    - AVEXAM-4414
    - ATPLGS-107673
  annexes: []
  learningObjectives:
    - 032.03.03.02.01
  template:
    type: calculation
    question: "Given a climb gradient of {{grad}} % and a groundspeed of {{gs}} kt,
      the rate of climb that will be achieved is (to the nearest 10 ft/min):"
    variables:
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: round(grad * gs * 1.0127 / 10) * 10
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: round(grad * gs * 1.0127 / 10) * 10 + 40
      - id: d2
        formula: round(grad * gs / 10) * 10 - 30
      - id: d3
        formula: round(grad * gs * 1.0127 * 1.5 / 10) * 10
      - id: d4
        formula: round(grad * gs * 0.6076 / 10) * 10
    presets:
      - id: p1
        values:
          grad: 3.3
          gs: 100
      - id: p2
        values:
          grad: 5
          gs: 120
      - id: p3
        values:
          grad: 2.5
          gs: 90
    explanation: >-
      Rate of climb equals climb gradient (as a fraction) times groundspeed.
      With the speed in kt, multiply by 101.27 to obtain ft/min.


      **Solution**


      {{f: grad / 100 * gs * 101.27}} = {{n: grad / 100 * gs * 101.27}} = {{=
      grad / 100 * gs * 101.27}} ft/min, rounded to **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: a calculation slip adding a margin.

      - **{{d2}} ft/min**: using 1 kt = 100 ft/min with an arithmetic slip.

      - **{{d3}} ft/min**: applying an unjustified 50 % factor.

      - **{{d4}} ft/min**: converting knots to ft/min with 0.6076 (a NM/ft
      mix-up) instead of 101.27.
