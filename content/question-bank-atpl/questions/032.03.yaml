- id: QVBGXLH35
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328670
    - ATPLGS-627538
    - AVEXAM-9642
    - BGS-320772
  annexes:
    - CAP-698-page-37
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 698 file 3.6). Given the following information,
      determine the obstacle clearance in the departure area.


      - Obstacle distance: {{dist}} NM from the threshold

      - Obstacle height: {{oh}} ft above the threshold

      - Ground speed: {{gs}} kt

      - Gross-to-net correction: {{gn}}

      - Rate of climb read from the chart (gross): {{roc}} ft/min


      Height gain = distance / GS x ROC x 60 (distance in NM, GS in kt)
    variables:
      - id: dist
        label: Obstacle distance
        unit: NM
      - id: oh
        label: Obstacle height
        unit: ft
      - id: gs
        label: Ground speed
        unit: kt
      - id: gn
        label: Gross-to-net factor
        unit: ""
      - id: roc
        label: Gross rate of climb read from the graph
        unit: ft/min
    chartInputs:
      - roc
    answer:
      formula: dist / gs * roc * 60 / gn - oh
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: dist / gs * roc * 60 - oh
      - id: d2
        formula: dist / gs * roc * 60 * gn - oh
      - id: d3
        formula: dist / gs * roc * 60 / gn
      - id: d4
        formula: dist / gs * roc * 60 / gn + oh
    presets:
      - id: p1
        values:
          dist: 0.5
          oh: 72
          gs: 110
          gn: 1.3
          roc: 1173
    explanation: >-
      The net height gained over the distance to the obstacle is the gross
      height divided by the gross-to-net factor; the clearance is that net
      height minus the obstacle height.


      **Solution**


      Time to the obstacle = {{= dist / gs * 60}} min


      {{f: dist / gs * roc * 60 / gn - oh}} = {{n: dist / gs * roc * 60 / gn -
      oh}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the gross height used, without the gross-to-net
      correction.

      - **{{d2}} ft**: the correction factor multiplied instead of divided.

      - **{{d3}} ft**: the obstacle height not subtracted.

      - **{{d4}} ft**: the obstacle height added instead of subtracted.
