- id: QKULPBFJ
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329112
    - AVEXAM-86429
  annexes:
    - CAP-698-page-37
  learningObjectives:
    - 032.03.03.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. For a mass of 4 200 lb, pressure altitude 4 000 ft, OAT
      +30°C, 20 kt headwind, all engines operating, the figure gives a height
      gain of {{gain_per_nm}} ft per NM (read from the figure).


      - Distance flown: {{dist}} NM


      What is the aircraft height gain after this distance, in feet?
    variables:
      - id: gain_per_nm
        label: Height gain per NM (read from figure)
        unit: ft/NM
      - id: dist
        label: Distance flown
        unit: NM
    chartInputs:
      - gain_per_nm
    answer:
      formula: gain_per_nm * dist
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: gain_per_nm
      - id: d2
        formula: gain_per_nm / dist
      - id: d3
        formula: gain_per_nm * dist * 1.852
      - id: d4
        formula: (gain_per_nm - 100) * dist
    presets:
      - id: p1
        values:
          gain_per_nm: 1320
          dist: 2.5
      - id: p2
        values:
          gain_per_nm: 900
          dist: 2.2
      - id: p3
        values:
          gain_per_nm: 1500
          dist: 1.8
    explanation: >-
      The climb chart gives the height gained for each nautical mile flown under
      the given conditions. The height gain for a longer distance is simply that
      rate multiplied by the distance flown.


      **Solution**


      {{f: gain_per_nm * dist}} = {{n: gain_per_nm * dist}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: gives the height gain for one nautical mile only and
      forgets the distance flown.

      - **{{d2}} ft**: divides by the distance instead of multiplying, which
      makes the result far too small.

      - **{{d3}} ft**: multiplies by 1.852, a conversion between nautical miles
      and kilometres that does not apply here.

      - **{{d4}} ft**: reads the chart 100 ft per NM too high, which is a
      misreading of the figure.
- id: QLCQUINHU
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329800
    - BGS-321038
    - AVEXAM-93756
    - BGS-321237
    - BGS-321057
    - BGS-321190
  annexes:
    - CAP-698-page-39
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the rate of climb figure (CAP 698 figure 3.7). Determine the time
      required by a multi-engined piston aeroplane to climb {{height}} ft.
      Assume the rate of climb is constant throughout the climb and equal to the
      rate of climb to 6000 ft pressure altitude. Two engines operate at maximum
      continuous power and the gear is retracted.


      - OAT: {{oat}} °C

      - Pressure altitude: {{pa}} ft

      - Take-off mass: {{mass}} lb


      Rate of climb to 6000 ft read from the figure: {{roc}} ft/min


      What is the time to climb?
    variables:
      - id: oat
        label: OAT
        unit: °C
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: mass
        label: Take-off mass
        unit: lb
      - id: height
        label: Height to climb
        unit: ft
      - id: roc
        label: Rate of climb to 6000 ft read from the figure
        unit: ft/min
    chartInputs:
      - roc
    answer:
      formula: height / roc * 60
      unit: seconds
      decimals: 0
      format: m 'minute' ss 'seconds'
    distractors:
      - id: d1
        formula: height / (roc * 0.8) * 60
      - id: d2
        formula: height / (roc + 300) * 60
      - id: d3
        formula: height / (roc - 300) * 60
    presets:
      - id: p1
        values:
          oat: 17
          pa: 6000
          mass: 4000
          height: 2400
          roc: 1550
      - id: p2
        values:
          oat: 10
          pa: 4000
          mass: 3600
          height: 2400
          roc: 1400
    explanation: >-
      The time to climb is the height to climb divided by the rate of climb. The
      rate of climb is the one read from the figure at 6000 ft, and it is
      assumed constant over the whole climb. The result is converted from
      minutes into seconds.


      **Solution**


      {{f: height / roc * 60}} = {{n: height / roc * 60}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses a rate of climb 20 % lower than the figure, so the
      climb takes too long.

      - **{{d2}}**: uses a rate of climb 300 ft/min higher than the figure, so
      the climb is too short.

      - **{{d3}}**: uses a rate of climb 300 ft/min lower than the figure, which
      is a misread of the scale.
