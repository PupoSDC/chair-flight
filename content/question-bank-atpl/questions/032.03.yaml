  template:
    type: chart
    question: >-
      Refer to CAP 698 figure 3.1 and determine the ground roll and take-off
      distance for a multi-engine piston aeroplane, given:


      - Outside air temperature: {{oat}} ºC

      - Pressure altitude: {{pa}} ft

      - Take-off mass: {{mass}} lb

      - Wind: {{wind}} kt tailwind


      What are the ground roll and take-off distance read from the chart?
    explanation: ""
    variables:
      - id: oat
        label: Outside air temperature
        unit: ºC
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: mass
        label: Take-off mass
        unit: lb
      - id: wind
        label: Tailwind
        unit: kt
    entries:
      - id: e1
        values:
          oat: 22
          pa: 4000
          mass: 4250
          wind: 5
        answer: "Ground roll: 2 100 ft; take off distance: 2 500 ft"
        wrongAnswers:
          - "Ground roll: 2 400 ft; take off distance: 2 500 ft"
          - "Ground roll: 1 350 ft; take off distance: 1 650 ft"
          - "Ground roll: 1 700 ft; take off distance: 2 050 ft"
        explanation: >-
          The take-off chart in CAP 698 figure 3.1 gives both distances directly
          for a multi-engine piston aeroplane. You enter the chart with the
          temperature, pressure altitude and take-off mass, then apply the wind
          correction for the tailwind. No calculation is needed, only careful
          reading of the chart.


          **Solution**


          For 22 ºC, 4 000 ft pressure altitude, 4 250 lb and a 5 kt tailwind,
          the chart gives a ground roll of 2 100 ft and a take-off distance of 2
          500 ft.


          **Why the other answers are wrong**


          - **Ground roll: 2 400 ft; take off distance: 2 500 ft**: the take-off
          distance is right, but the ground roll is misread from the chart.

          - **Ground roll: 1 350 ft; take off distance: 1 650 ft**: both values
          are misread from a different line of the chart.

          - **Ground roll: 1 700 ft; take off distance: 2 050 ft**: both values
          are misread from a different line of the chart.
- id: QG2TABCRQ
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-324972
    - AVEXAM-36779
    - BGS-320875
  annexes:
    - CAP-698-page-52
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      A single-engined Class B aeroplane takes off from runway 02/20. Refer to
      figure or CAP file 4.1. Runway 02 has a heading of {{rwy_hdg}}°. The wind
      direction during take-off is {{wind_dir}}°. The wind component limits are:


      - Crosswind component limit: {{cw_limit}} kt

      - Headwind component limit: {{hw_limit}} kt

      - Tailwind component limit: {{tw_limit}} kt


      What is the maximum allowed wind velocity (kt) on the most favourable
      runway?
    variables:
      - id: wind_dir
        label: Wind direction
        unit: °
      - id: rwy_hdg
        label: Runway heading
        unit: °
      - id: cw_limit
        label: Crosswind component limit
        unit: kt
      - id: hw_limit
        label: Headwind component limit
        unit: kt
      - id: tw_limit
        label: Tailwind component limit
        unit: kt
    answer:
      formula: cw_limit / abs(sin(wind_dir - rwy_hdg))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tw_limit / abs(sin(wind_dir - rwy_hdg))
      - id: d2
        formula: cw_limit / abs(cos(wind_dir - rwy_hdg))
      - id: d3
        formula: hw_limit / abs(cos(wind_dir - rwy_hdg))
      - id: d4
        formula: cw_limit * abs(sin(wind_dir - rwy_hdg))
    presets:
      - id: p1
        values:
          wind_dir: 330
          rwy_hdg: 20
          cw_limit: 13
          hw_limit: 30
          tw_limit: 10
      - id: p2
        values:
          wind_dir: 250
          rwy_hdg: 270
          cw_limit: 15
          hw_limit: 25
          tw_limit: 10
    explanation: >-
      The crosswind is the part of the wind that blows across the runway. It is
      found from the angle between the wind and the runway heading, using the
      sine. The maximum wind is therefore the crosswind limit divided by that
      crosswind factor.


      **Solution**


      - Crosswind factor for each knot of wind: {{= abs(sin(wind_dir -
      rwy_hdg))}}

      - Maximum wind = {{cw_limit}} kt / {{= abs(sin(wind_dir - rwy_hdg))}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the tailwind limit is used instead of the crosswind
      limit.

      - **{{d2}} kt**: the cosine is used instead of the sine, which gives the
      headwind-based result.

      - **{{d3}} kt**: the headwind limit is used in place of the crosswind
      limit.

      - **{{d4}} kt**: the crosswind limit is multiplied by the sine instead of
      divided.
