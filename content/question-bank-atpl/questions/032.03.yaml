- id: QOCFIKZX
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-323905
    - BGS-321006
  annexes:
    - CAP-698-page-52
  learningObjectives:
    - 032.03.03.01.06
  template:
    type: chart
    question: >-
      Refer to figure or CAP file 4.1.


      During an approach and landing on Rwy 07, the controller informs the pilot
      that the weather has changed significantly according to the last report
      and the wind is now 220°(M)/25 kt.


      Considering that the Rwy 07/25 is fully operational and available, which
      of the following options provides the greatest performance safety margin?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: There is a tailwind of approximately 22 kt on Rwy 07; the pilot should
          request landing on runway 25 instead.
        wrongAnswers:
          - Rwy 07 only has a tailwind of 7 kt and a normal approach and landing
            on Rwy 07 should continue.
          - The 22 kt headwind on Rwy 07 means the pilot should continue the
            approach and land on Rwy 07.
          - There is a headwind of 12 kt on Rwy 25 and a request to land on it
            should be considered.
        explanation: >-
          The wind of 220° is 150° away from runway 07 (070°), so the component
          is 25 × cos 150° = 22 kt of **tailwind**.


          Runway 25 (250°) is only 30° away from the wind, giving 25 × cos 30° =
          22 kt of headwind. The pilot should request runway 25.
