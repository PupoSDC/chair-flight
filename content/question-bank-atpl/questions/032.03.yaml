- id: QYOPUGFE
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329526
    - AVEXAM-34725
  annexes:
    - CAP-698-page-39
  learningObjectives:
    - 032.03.03.01.04
  template:
    type: chart-calculation
    question: >-
      Refer to the time-to-climb figure. Determine the time to climb {{height}}
      ft, given:


      - OAT: {{oat}} °C

      - Pressure altitude: {{pa}} ft

      - Gross mass: {{mass}} lb

      - Mixture: full rich, two engines operating


      Rate of climb read from the figure: {{roc}} ft/min


      What is the time to climb?
    variables:
      - id: oat
        label: OAT
        unit: °C
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: mass
        label: Gross mass
        unit: lb
      - id: height
        label: Height to climb
        unit: ft
      - id: roc
        label: Rate of climb read from the figure
        unit: ft/min
    chartInputs:
      - roc
    answer:
      formula: height / roc * 60
      unit: seconds
      decimals: 0
      format: m 'minute' ss 'seconds'
    distractors:
      - id: d1
        formula: height / (roc * 0.8) * 60
      - id: d2
        formula: height / (roc + 300) * 60
      - id: d3
        formula: height / roc * 45
    presets:
      - id: p1
        values:
          oat: -18
          pa: 8000
          mass: 4000
          height: 2000
          roc: 1500
      - id: p2
        values:
          oat: 10
          pa: 4000
          mass: 3600
          height: 2000
          roc: 1100
    explanation: >-
      The time to climb is the height to climb divided by the rate of climb. The
      rate of climb is read from the figure for the given temperature, pressure
      altitude and mass, and the result is converted from minutes into seconds.


      **Solution**


      {{f: height / roc * 60}} = {{n: height / roc * 60}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses a rate of climb 20 % lower than the figure, so the
      climb takes too long.

      - **{{d2}}**: uses a rate of climb 300 ft/min higher than the figure, so
      the climb is too short.

      - **{{d3}}**: converts minutes into seconds with the wrong factor (45
      instead of 60).
