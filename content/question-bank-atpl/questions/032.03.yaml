  template:
    type: chart
    question: >-
      Refer to the figure (annex 032-005 or CAP 698 Figure 2.4). Given the
      following information, determine the minimum or maximum wind component for
      the SEP aircraft to land.


      - Mass: {{mass}} lb

      - Pressure altitude: {{pa}} ft

      - Temperature: {{temp}} °C

      - Runway LDA: {{lda}} ft

      - Runway slope: +{{slope}} % upslope


      What is the wind limit?
    explanation: ""
    variables:
      - id: mass
        label: Mass
        unit: lb
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: temp
        label: Temperature
        unit: °C
      - id: lda
        label: Runway LDA
        unit: ft
      - id: slope
        label: Runway slope
        unit: "%"
    entries:
      - id: e1
        values:
          mass: 3400
          pa: 2000
          temp: 32
          lda: 1750
          slope: 2
        answer: Minimum 22 kt headwind.
        wrongAnswers:
          - Maximum 7 kt tailwind.
          - Maximum 5 kt tailwind.
          - Maximum 2 kt tailwind.
        explanation: >-
          The landing distance needed depends on the wind. With a short runway
          and an upslope, the aircraft needs a headwind to stop within the
          landing distance available, so the limit is a minimum headwind rather
          than a maximum tailwind.


          **Solution**


          For {{mass}} lb at {{pa}} ft and {{temp}} °C on a runway with {{lda}}
          ft of LDA and a {{slope}} % upslope, the chart gives a **minimum 22 kt
          headwind**.


          **Why the other answers are wrong**


          - **Maximum 7 kt tailwind**: a tailwind lengthens the landing
          distance, so it cannot be the requirement here.

          - **Maximum 5 kt tailwind**: confuses the direction of the wind limit.

          - **Maximum 2 kt tailwind**: the same mistake with a smaller tailwind
          value.
