- id: QCMJFXDU
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329875
    - BGS-320452
  annexes:
    - CAP-698-page-27
  learningObjectives:
    - 032.03.03.01.07
  template:
    type: calculation
    question: >-
      Refer to CAP 698 Fig 3.3. Given the following data, what distance must you
      enter the graph with to determine the FLLTOM?


      PA: 2000 ft

      OAT: +30°C

      Wind: 5 kt TW

      Climb speed: 100 kt

      RW: 09


      - TORA: {{tora}} ft

      - ASDA: {{asda}} ft

      - TODA: {{toda}} ft


      The entry distance is the most limiting of TORA, ASDA / 1.3 and TODA /
      1.15.
    variables:
      - id: tora
        label: TORA
        unit: ft
      - id: asda
        label: ASDA
        unit: ft
      - id: toda
        label: TODA
        unit: ft
    answer:
      formula: min(tora, asda / 1.3, toda / 1.15)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: toda / 1.15
      - id: d2
        formula: tora
      - id: d3
        formula: asda
      - id: d4
        formula: asda / 1.15
    presets:
      - id: p1
        values:
          tora: 2400
          asda: 2500
          toda: 2600
      - id: p2
        values:
          tora: 3000
          asda: 3200
          toda: 3300
      - id: p3
        values:
          tora: 2800
          asda: 2900
          toda: 3100
    explanation: >-
      The graph is entered with the take-off distance that is most limiting
      after applying the regulatory factors: the TORA as is, the ASDA divided by
      1.3 and the TODA divided by 1.15. The smallest of the three values is
      used.


      **Solution**


      TORA = {{tora}} ft


      ASDA / 1.3 = {{= asda / 1.3}} ft


      TODA / 1.15 = {{= toda / 1.15}} ft


      {{f: min(tora, asda / 1.3, toda / 1.15)}} = {{n: min(tora, asda / 1.3,
      toda / 1.15)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: uses only the TODA with its factor and ignores the more
      limiting ASDA.

      - **{{d2}} ft**: uses the raw TORA without checking the factored
      distances.

      - **{{d3}} ft**: uses the raw ASDA without the regulatory factor.

      - **{{d4}} ft**: divides the ASDA by the TODA factor (1.15) instead of
      1.3.
- id: QCTGLWRLS
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329839
    - BGS-321222
  annexes:
    - CAP-698-page-19
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 698 figure 2.2).


      Calculate the take-off distance required for a performance class B single
      engine piston aircraft in Commercial Air Transport, given: pressure
      altitude {{pa}} ft, OAT {{oat}} °C, take-off mass {{mass}} lb, wind {{hw}}
      kt headwind, runway surface 5 cm grass, dry (correction factor {{corr}}),
      unbalanced field lengths, regulatory factor (CAT) {{reg}}.


      The chart distance (before the factors) read from the figure is
      {{chart_dist}} ft.
    variables:
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: mass
        label: Take-off mass
        unit: lb
      - id: hw
        label: Headwind
        unit: kt
      - id: corr
        label: Surface correction factor
        unit: ""
      - id: reg
        label: Regulatory factor
        unit: ""
      - id: chart_dist
        label: Distance read from the chart
        unit: ft
    chartInputs:
      - chart_dist
    answer:
      formula: chart_dist * corr * reg
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: chart_dist
      - id: d2
        formula: chart_dist * corr
      - id: d3
        formula: chart_dist * reg
      - id: d4
        formula: chart_dist * (corr + reg)
    presets:
      - id: p1
        values:
          pa: 1000
          oat: 25
          mass: 3600
          hw: 10
          corr: 1.2
          reg: 1.15
          chart_dist: 1956.5
    explanation: >-
      The required distance is the chart distance multiplied by the surface
      correction factor and by the regulatory factor for commercial air
      transport.


      **Solution**


      {{f: chart_dist * corr * reg}} = {{n: chart_dist * corr * reg}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: using the chart value without any factor.

      - **{{d2}} ft**: forgetting the regulatory factor.

      - **{{d3}} ft**: forgetting the surface correction factor.

      - **{{d4}} ft**: adding the factors instead of multiplying them.
