      - id: pa
        label: Pressure altitude
        unit: ft
      - id: mass
        label: Aeroplane mass
        unit: lb
      - id: headwind
        label: Headwind component
        unit: kt
    entries:
      - id: e1
        values:
          oat: 25
          pa: 4000
          mass: 3000
          headwind: 10
        answer: "TOD: 1 900 ft, Rotation speed: 68kt, 50ft speed: 78kt"
        wrongAnswers:
          - "TOD: 2 200 ft, Rotation speed: 70kt, 50ft speed: 80kt"
          - "TOD: 1 850 ft, Rotation speed: 70kt, 50ft speed: 80kt"
          - "TOD: 1 650 ft, Rotation speed: 68kt, 50ft speed: 78kt"
        explanation: >-
          The take-off distance to 50 ft and the speeds are read from the single
          engine take-off chart. Enter with the temperature, pressure altitude
          and mass, then apply the headwind correction to the distance.


          **Solution**


