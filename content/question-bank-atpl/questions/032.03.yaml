- id: QSUEWJHCU
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-325713
    - ATPLGS-113512
    - AVEXAM-24852
    - AVEXAM-54793
    - BGS-321173
    - ATPLGS-122635
    - ATPLGS-107625
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. A twin-engine piston aeroplane flies a straight
      departure with all engines operating. The height gained at the obstacle
      read from the chart is {{gain}} ft. What is the vertical clearance over
      the obstacle?


      - Airport elevation: {{ae}} ft

      - Obstacle elevation: {{oe}} ft
    variables:
      - id: gain
        label: Height gain read from the graph
        unit: ft
      - id: ae
        label: Airport elevation
        unit: ft
      - id: oe
        label: Obstacle elevation
        unit: ft
    chartInputs:
      - gain
    answer:
      formula: gain - (oe - ae)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: gain + (oe - ae)
      - id: d2
        formula: gain - oe
      - id: d3
        formula: gain - ae
      - id: d4
        formula: gain - 2 * (oe - ae)
    presets:
      - id: p1
        values:
          gain: 312
          ae: 500
          oe: 644
    explanation: >-
      The obstacle height above the departure aerodrome is obstacle elevation
      minus aerodrome elevation. The clearance is the height gained read from
      the chart minus that obstacle height.


      **Solution**


      Obstacle height = {{= oe - ae}} ft


      {{f: gain - (oe - ae)}} = {{n: gain - (oe - ae)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the obstacle height above the airport added instead of
      subtracted.

      - **{{d2}} ft**: the obstacle elevation used instead of its height above
      the airport.

      - **{{d3}} ft**: the airport elevation subtracted instead of the obstacle
      height.

      - **{{d4}} ft**: the relative obstacle height counted twice.
- id: QSZIMXEJT
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-322770
    - AVEXAM-36221
    - AVEXAM-30549
  annexes:
    - 032-twin-turboprop-mep-take-off-performance-table-pressure-altitude-0
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. The MSTOM of a multi-engine piston aeroplane is {{mstom}}
      lb. Find the maximum regulated take-off mass with 10° flaps under the
      following conditions (dry, level runway, zero wind):


      - ASDA {{asda}} ft

      - TORA {{tora}} ft

      - TODA {{toda}} ft

      - Pressure altitude {{pa}} ft

      - OAT {{oat}} °C


      (The field-length limited mass is read from the figure.)
    variables:
      - id: mstom
        label: MSTOM
        unit: lb
      - id: asda
        label: ASDA
        unit: ft
      - id: tora
        label: TORA
        unit: ft
      - id: toda
        label: TODA
        unit: ft
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: rtom_chart
        label: Field-length limited mass read from the figure
        unit: lb
    chartInputs:
      - rtom_chart
    answer:
      formula: min(rtom_chart, mstom)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mstom
      - id: d2
        formula: rtom_chart + 500
      - id: d3
        formula: rtom_chart + 1000
      - id: d4
        formula: rtom_chart + 2000
    presets:
      - id: p1
        values:
          mstom: 12000
          asda: 5980
          tora: 4730
          toda: 5320
          pa: 1000
          oat: 10
          rtom_chart: 10500
    explanation: >-
      The regulated take-off mass is the lowest of the structural limit (MSTOM)
      and the mass allowed by the field length (ASDA, TORA, TODA) at the given
      pressure altitude and temperature, read from the figure.


      **Solution**


      The field-length limited mass read from the figure is {{rtom_chart}} lb,
      which is below the MSTOM of {{mstom}} lb.


      {{f: min(rtom_chart, mstom)}} = {{n: min(rtom_chart, mstom)}} =
      **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the MSTOM is a structural limit only; the field length
      limits the mass further.

      - **{{d2}} lb**: a misread of the graph (one step too high).

      - **{{d3}} lb**: a misread of the graph (neighbouring line).

      - **{{d4}} lb**: a grossly overstated reading of the graph.
