  template:
    type: calculation
    question: Following a take-off limited by the 50 ft (15 m) screen height, a
      light twin climbs on a {{grad}}% over-the-ground gradient. What is the
      obstacle clearance margin above a {{oh}} m obstacle (relative to the
      runway), situated {{dist}} m from the 50 ft point? (give the answer in
      metres)
    variables:
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: oh
        label: Obstacle height
        unit: m
      - id: dist
        label: Distance from the 50 ft point
        unit: m
    answer:
      formula: 15 + grad / 100 * dist - oh
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: grad / 100 * dist - oh
      - id: d2
        formula: 15 + grad / 100 * dist + oh
      - id: d3
        formula: oh - 15 - grad / 100 * dist
      - id: d4
        formula: 50 + grad / 100 * dist - oh
    presets:
      - id: p1
        values:
          grad: 5
          oh: 160
          dist: 5000
      - id: p2
        values:
          grad: 10
          oh: 215
          dist: 3000
    explanation: >-
      The aeroplane starts at the 50 ft (15 m) screen height and gains height at
      the climb gradient over the ground distance. The clearance is the height
      at the obstacle minus the obstacle height.


      **Solution**


      Height gain = {{= grad / 100 * dist}} m


      {{f: 15 + grad / 100 * dist - oh}} = {{n: 15 + grad / 100 * dist - oh}} =
      **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the 15 m screen height forgotten.

      - **{{d2}} m**: the obstacle height added instead of subtracted.

      - **{{d3}} m**: the sign reversed (obstacle minus climb).

      - **{{d4}} m**: the screen height of 50 ft used as 50 m.
