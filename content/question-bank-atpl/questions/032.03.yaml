- id: QPOPQNQ1W
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328441
    - BGS-320750
    - ATPLGS-113545
    - AVEXAM-96994
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      A Class B light twin aeroplane is to take off on a Commercial Air
      Transport flight from an airfield with data as given below. What is the
      de-factored take-off distance that should be used to determine the maximum
      take-off mass from the gross take-off performance graph produced for a
      level, paved and dry runway?


      - TORA: {{tora}} ft

      - Clearway: {{clearway}} ft

      - Stopway: {{stopway}} ft

      - Upslope: {{slope}}% (5% extra distance required for every 1% of upslope)


      Runway surface: paved and dry
    variables:
      - id: tora
        label: TORA
        unit: ft
      - id: clearway
        label: Clearway
        unit: ft
      - id: stopway
        label: Stopway
        unit: ft
      - id: slope
        label: Upslope
        unit: "%"
    answer:
      formula: min(tora, (tora + stopway) / 1.3, (tora + clearway) / 1.15) / (1 + 0.05
        * slope)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (tora + clearway) / (1.15 * 1.15 * (1 + 0.05 * slope))
      - id: d2
        formula: min(tora, (tora + stopway) / 1.3, (tora + clearway) / 1.15) / (1.15 *
          (1 + 0.05 * slope))
      - id: d3
        formula: tora / (1.25 * (1 + 0.05 * slope))
    presets:
      - id: p1
        values:
          tora: 1270
          clearway: 385
          stopway: 215
          slope: 1.3
      - id: p2
        values:
          tora: 1500
          clearway: 300
          stopway: 200
          slope: 1
      - id: p3
        values:
          tora: 1400
          clearway: 250
          stopway: 150
          slope: 2
    explanation: >-
      The distance used to enter the take-off graph is the most limiting of the
      available distances, each reduced by its factor: TORA, ASDA/1.3 and
      TODA/1.15 (ASDA = TORA + stopway, TODA = TORA + clearway). The upslope
      correction (5% per 1%) is then applied.


      **Solution**


      ASDA / 1.3 = {{= (tora + stopway) / 1.3}} ft, TODA / 1.15 = {{= (tora +
      clearway) / 1.15}} ft, TORA = {{tora}} ft


      {{f: min(tora, (tora + stopway) / 1.3, (tora + clearway) / 1.15) / (1 +
      0.05 * slope)}} = {{n: min(tora, (tora + stopway) / 1.3, (tora + clearway)
      / 1.15) / (1 + 0.05 * slope)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: uses the TODA and applies the 1.15 factor twice.

      - **{{d2}} ft**: applies an additional 1.15 factor to the correct limiting
      distance.

      - **{{d3}} ft**: uses only the TORA with a 1.25 factor and ignores the
      stopway and clearway.
