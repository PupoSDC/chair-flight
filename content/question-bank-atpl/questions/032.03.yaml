- id: QIYVWTFNZ
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-324336
    - AVEXAM-55288
    - AVEXAM-76690
    - AVEXAM-47079
  annexes:
    - 032-airfield-diagram-for-obstacle-clearance-02
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. You are taking off with a single-engine aeroplane
      from runway 27 in VMC, straight out. The distance to the water tank on the
      extended centreline is {{gd}} ft and the tank is {{oh}} ft high (both
      values read from the figure). What is the expected obstacle clearance over
      the water tank?


      - Climb gradient: {{grad}}%

      - TAS: {{tas}} kt

      - Wind component: {{tw}} kt tailwind


      Height difference = ((GD x TAS) / GS) x gradient / 100
    variables:
      - id: gd
        label: Ground distance read from the graph
        unit: ft
      - id: oh
        label: Obstacle height read from the graph
        unit: ft
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind
        unit: kt
    chartInputs:
      - gd
      - oh
    answer:
      formula: gd * tas / (tas + tw) * grad / 100 - oh
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: gd * tas / (tas + tw) * grad / 100 - oh - 50
      - id: d2
        formula: gd * tas / (tas + tw) * grad / 100 + oh
      - id: d3
        formula: gd * tas / (tas - tw) * grad / 100 - oh
      - id: d4
        formula: gd * tas / (tas + tw) * grad / 100
    presets:
      - id: p1
        values:
          gd: 4768
          oh: 100
          grad: 8
          tas: 111
          tw: 5
    explanation: >-
      With a tailwind GS = TAS + tailwind. The height gained over the ground
      distance is GD x TAS/GS x gradient, and the clearance is this height minus
      the obstacle height.


      **Solution**


      GS = {{= tas + tw}} kt


      {{f: gd * tas / (tas + tw) * grad / 100 - oh}} = {{n: gd * tas / (tas +
      tw) * grad / 100 - oh}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: an extra 50 ft subtracted.

      - **{{d2}} ft**: the obstacle height added instead of subtracted.

      - **{{d3}} ft**: the tailwind subtracted when computing ground speed.

      - **{{d4}} ft**: the obstacle height not subtracted.
