        unit: kt
    answer:
      formula: round(grad * gs * 1.0127 / 100) * 100
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: round(grad * gs * 1.0127 / 100) * 100 + 200
      - id: d2
        formula: round(grad * 230 * 1.0127 / 100) * 100
      - id: d3
        formula: round(grad * gs * 0.6076 / 100) * 100
      - id: d4
        formula: round(grad * gs * 1.0127 / 100) * 100 + 400
    presets:
      - id: p1
        values:
          grad: 6.1
          gs: 130
      - id: p2
        values:
          grad: 5
          gs: 120
      - id: p3
        values:
          grad: 7
          gs: 140
    explanation: >-
      The rate of climb needed to follow a gradient is the gradient multiplied
      by the groundspeed. With the gradient in % and the speed in kt, one knot
      is about 101.27 ft/min.


      **Solution**


      {{f: grad / 100 * gs * 101.27}} = {{n: grad / 100 * gs * 101.27}} = {{=
      grad / 100 * gs * 101.27}} ft/min, rounded to **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: adding an unjustified margin to the required rate of
      climb.

      - **{{d2}} ft/min**: using the 230 kt clean speed instead of the speed to
      1800 ft.

      - **{{d3}} ft/min**: converting knots to ft/min with 0.6076 (a NM/ft
      mix-up) instead of 101.27.

      - **{{d4}} ft/min**: adding a large unjustified margin to the required
      rate of climb.
- id: QBXVIAOW
  docId: "032.03"
  relatedQuestions: []
  externalIds:
