    - AVEXAM-23055
  annexes:
    - CAP-698-page-45
  learningObjectives:
    - "032.03"
    - 032.03.03.04.05
  template:
    type: chart-calculation
    question: >-
      Refer to figure or CAP 698, figure 3.9 or 3.10. For a Performance Class B
      aeroplane, the following values are read from the figure:


      - Landing distance before wind and slope corrections: {{ldr_base}} ft

      - Wind and slope correction factor: {{correction}}


      What is the Landing Distance Required in feet?
    variables:
      - id: ldr_base
        label: Landing distance before corrections (read from figure)
        unit: ft
      - id: correction
        label: Wind and slope correction factor (read from figure)
        unit: ""
    chartInputs:
      - ldr_base
      - correction
    answer:
      formula: ldr_base * correction
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ldr_base
      - id: d2
        formula: ldr_base / correction
      - id: d3
        formula: ldr_base * (2 - correction)
      - id: d4
        formula: ldr_base * correction * 1.1
    presets:
      - id: p1
        values:
          ldr_base: 2720
          correction: 1.25
      - id: p2
        values:
          ldr_base: 2800
          correction: 1.125
      - id: p3
        values:
          ldr_base: 3200
          correction: 0.95
    explanation: >-
      The landing chart gives the distance for the basic conditions. The wind
      and runway slope change this distance, and the correction factor from the
      figure is applied to the distance read from the chart to give the Landing
      Distance Required.


      **Solution**


      {{f: ldr_base * correction}} = {{n: ldr_base * correction}} = **{{answer}}
      ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the wind and slope correction completely.

      - **{{d2}} ft**: divides by the correction factor instead of multiplying,
      which reverses its effect.

      - **{{d3}} ft**: applies the wrong sign to the correction.

      - **{{d4}} ft**: adds an extra 10% on top of the correct correction.
