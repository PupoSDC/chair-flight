- id: QJH4FO3SC
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-325031
    - AVEXAM-72707
    - AVEXAM-19728
    - ATPLGS-113545
    - BGS-320977
    - BGS-321001
    - BGS-321167
    - BGS-321191
    - BGS-321113
    - ATPLQ-325770
  annexes: []
  learningObjectives:
    - 032.03.03.04.05
  template:
    type: calculation
    question: >-
      Given the following information, determine the maximum de-factored landing
      distance for a multi-engine Performance Class B aeroplane operated for
      Commercial Air Transport.


      Landing distance available: {{lda}} ft

      Runway surface: grass less than 20 cm long, NOT very short (factor 1.15)

      Runway condition: wet (factor 1.15)

      Runway slope: 1.5% upslope


      The landing distance should be increased by 5% for each 1% downslope.
    variables:
      - id: lda
        label: LDA
        unit: ft
    answer:
      formula: lda / (1.43 * 1.15 * 1.15)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: lda / (1.15 * 1.15)
      - id: d2
        formula: lda / (1.43 * 1.15 * 1.15 * 1.075)
      - id: d3
        formula: lda / (1.43 * 1.15 * 1.15 * 1.25)
      - id: d4
        formula: lda / (1.43 * 1.15 * 1.15 * 1.025)
      - id: d5
        formula: lda / (1.43 * 1.15 * 1.15 * 1.5)
    presets:
      - id: p1
        values:
          lda: 4970
      - id: p2
        values:
          lda: 4850
      - id: p3
        values:
          lda: 5300
    explanation: >-
      The de-factored landing distance is the landing distance available divided
      by all applicable factors: 1.43 (Class B regulatory factor), 1.15 for
      short grass and 1.15 for a wet runway. The slope correction only applies
      to a downslope; an upslope needs no correction.


      **Solution**


      {{f: lda / (1.43 * 1.15 * 1.15)}} = {{n: lda / (1.43 * 1.15 * 1.15)}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: omits the 1.43 regulatory factor.

      - **{{d2}} ft**: treats the upslope as a downslope and adds 7.5% (1.5 x
      5%).

      - **{{d3}} ft**: adds an unjustified extra 25% margin.

      - **{{d4}} ft**: adds an unjustified extra 2.5% correction for the
      upslope.

      - **{{d5}} ft**: adds an unjustified extra 50% margin.
