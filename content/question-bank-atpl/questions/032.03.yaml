- id: QZDP2O4Z4
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326961
    - BGS-320118
    - AVEXAM-73495
    - AVEXAM-41686
    - AVEXAM-51920
    - ATPLGS-107664
    - ATPLGS-107661
    - BGS-320601
    - ATPLGS-625081
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      The take-off distance of an aircraft is {{base}} m in a standard
      atmosphere, no wind at 0 ft pressure altitude. Use the following
      corrections:


      - ± 20 m per 1 000 ft field elevation

      - -5 m per kt of headwind

      - +10 m per kt of tailwind

      - ± 15 m per % of runway slope

      - ± 5 m per °C deviation from standard temperature


      What is the take-off distance from an airport with elevation {{elev}} ft,
      temperature {{oat}} °C, QNH 1013.25 hPa, {{slope}} % up-slope and {{tw}}
      kt tailwind?
    variables:
      - id: base
        label: Base distance
        unit: m
      - id: elev
        label: Elevation
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: slope
        label: Up-slope
        unit: "%"
      - id: tw
        label: Tailwind
        unit: kt
    answer:
      formula: base + 20 * elev / 1000 + 5 * (oat - (15 - 2 * elev / 1000)) + 15 *
        slope + 10 * tw
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: base + 20 * elev / 1000 + 5 * (oat - (15 - 2 * elev / 1000)) + 15 *
          slope - 10 * tw
      - id: d2
        formula: base + 15 * slope + 10 * tw
      - id: d3
        formula: base + 10 * tw - 15 * slope
    presets:
      - id: p1
        values:
          base: 600
          elev: 1000
          oat: 17
          slope: 1
          tw: 10
      - id: p2
        values:
          base: 700
          elev: 2000
          oat: 20
          slope: 2
          tw: 8
      - id: p3
        values:
          base: 550
          elev: 500
          oat: 10
          slope: 1
          tw: 6
    explanation: >-
      Each correction is applied to the base distance: elevation adds distance,
      a tailwind adds distance, an up-slope adds distance, and a temperature
      above ISA adds distance. ISA temperature at the given elevation (pressure
      altitude equals elevation at QNH 1013.25 hPa) is 15 °C minus 2 °C per 1
      000 ft.


      **Solution**


      ISA temperature = {{= 15 - 2 * elev / 1000}} °C, deviation = {{= oat - (15
      - 2 * elev / 1000)}} °C


      Elevation: {{= 20 * elev / 1000}} m; temperature: {{= 5 * (oat - (15 - 2 *
      elev / 1000))}} m; slope: {{= 15 * slope}} m; tailwind: {{= 10 * tw}} m


      {{= base}} + {{= 20 * elev / 1000}} + {{= 5 * (oat - (15 - 2 * elev /
      1000))}} + {{= 15 * slope}} + {{= 10 * tw}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the tailwind correction was subtracted as if it were a
      headwind.

      - **{{d2}} m**: elevation and temperature corrections were forgotten.

      - **{{d3}} m**: the up-slope correction was subtracted instead of added,
      and elevation and temperature were forgotten.
