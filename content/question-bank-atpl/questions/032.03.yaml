- id: QWU2ITN1Z
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-327551
    - AVEXAM-80881
    - AVEXAM-83780
  annexes: []
  learningObjectives:
    - "032.03"
  template:
    type: calculation
    question: >-
      Determine the obstacle clearance for a performance class B multi-engine
      piston aircraft, given:


      - TAS: {{tas}} kt

      - Tailwind: {{tw}} kt

      - Climb gradient: {{grad}}%

      - Obstacle height: {{oh}} ft

      - Distance from the runway end: {{dist}} NM (1 NM = 6 080 ft)


      Height gain = distance x TAS / GS x gradient / 100, starting from the 50
      ft screen height.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind
        unit: kt
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: oh
        label: Obstacle height
        unit: ft
      - id: dist
        label: Distance from runway end
        unit: NM
    answer:
      formula: dist * 6080 * tas / (tas + tw) * grad / 100 + 50 - oh
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 6080 * tas / (tas + tw) * grad / 100 - oh
      - id: d2
        formula: dist * 6080 * tas / (tas - tw) * grad / 100 + 50 - oh
      - id: d3
        formula: dist * 6080 * tas / (tas + tw) * grad / 100 + 50
      - id: d4
        formula: dist * 6080 * grad / 100 + 50 - oh
    presets:
      - id: p1
        values:
          tas: 133
          tw: 10
          grad: 5
          oh: 400
          dist: 1.5
      - id: p2
        values:
          tas: 120
          tw: 15
          grad: 4
          oh: 300
          dist: 2
      - id: p3
        values:
          tas: 100
          tw: 5
          grad: 6
          oh: 500
          dist: 2
    explanation: >-
      With a tailwind the ground speed exceeds the TAS, so the gradient over the
      ground is the same but the distance is covered faster; the height at the
      obstacle is the screen height plus distance times TAS/GS times the
      gradient.


      **Solution**


      GS = {{= tas + tw}} kt


      {{f: dist * 6080 * tas / (tas + tw) * grad / 100 + 50 - oh}} = {{n: dist *
      6080 * tas / (tas + tw) * grad / 100 + 50 - oh}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the 50 ft screen height forgotten.

      - **{{d2}} ft**: the tailwind subtracted when computing ground speed.

      - **{{d3}} ft**: the obstacle height not subtracted.

      - **{{d4}} ft**: the TAS/GS correction for the wind not applied.
- id: QWUASB3IS
  docId: "032.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-321541
    - AVEXAM-72707
    - AVEXAM-19728
    - ATPLGS-113545
    - AVEXAM-310
    - BGS-321001
    - BGS-321191
    - BGS-321113
  annexes: []
  learningObjectives:
    - 032.03.03.04.05
  template:
    type: calculation
    question: >-
      Given the following information, determine the minimum landing distance
      that must be available for a multi-engined Performance Class B aeroplane
      operated for Commercial Air Transport.


      Defactored landing distance: {{ldd}} ft

      Runway surface: paved asphalt


      - Runway condition: wet (factor {{wet}})

      - Runway slope: {{slope}} % downslope


      The landing distance should be increased by 5 % for each 1 % downslope.


      (Dry-runway safety factor 1.43.)
    variables:
      - id: ldd
        label: Defactored landing distance
        unit: ft
      - id: wet
        label: Wet runway factor
        unit: ""
      - id: slope
        label: Downslope
        unit: "%"
    answer:
      formula: ldd * 1.43 * wet * (1 + 0.05 * slope)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: ldd * wet * (1 + 0.05 * slope)
      - id: d2
        formula: ldd * 1.43 * wet
      - id: d3
        formula: ldd * 1.43 * (1 + 0.05 * slope)
      - id: d4
        formula: ldd * 1.43 * wet * (1 - 0.05 * slope)
    presets:
      - id: p1
        values:
          ldd: 3240
          wet: 1.15
          slope: 1
      - id: p2
        values:
          ldd: 2800
          wet: 1.15
          slope: 2
      - id: p3
        values:
          ldd: 3500
          wet: 1.15
          slope: 0.5
    explanation: >-
      The required landing distance is the defactored distance multiplied by the
      safety factor of 1.43, the wet runway factor and the downslope correction
      of 5 % per 1 % downslope.


      **Solution**


      {{f: ldd * 1.43 * wet * (1 + 0.05 * slope)}} = {{n: ldd * 1.43 * wet * (1
      + 0.05 * slope)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: omitting the 1.43 safety factor.

      - **{{d2}} ft**: omitting the slope correction.

      - **{{d3}} ft**: omitting the wet runway factor.

      - **{{d4}} ft**: applying the slope correction with the wrong sign (as an
      upslope).
