- id: Q7T8VCJFM
  docId: "032.03"
  relatedQuestions:
    - QFLMMMFQ
  externalIds:
    - ATPLQ-329520
    - BGS-321156
    - AVEXAM-76690
    - AVEXAM-62897
    - ATPLQ-328713
    - AVEXAM-55288
    - AVEXAM-47079
    - ATPLQ-326660
  annexes:
    - 032-airfield-diagram-for-obstacle-clearance-01
    - 032-airfield-diagram-for-obstacle-clearance-02
  learningObjectives:
    - "032.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. You are taking off with a single-engined aeroplane at
      a field-length-limited take-off mass, in VMC, for a straight-out
      departure. Given the following information, what is the expected obstacle
      clearance over the obstacle on the extended centre line?


      - Climb gradient: {{gradient}} %

      - TAS: {{tas}} kt

      - Wind component: {{headwind}} kt (positive = headwind, negative =
      tailwind)


      1 NM = 6080 ft


      The ground distance to the obstacle ({{gd}} NM) and the obstacle height
      ({{obst}} ft) are the values read from the figure.


      Height gain = ((GD x TAS) / GS) x gradient / 100. Give the obstacle
      clearance in ft.
    variables:
      - id: gradient
        label: Climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: headwind
        label: Headwind component (negative = tailwind)
        unit: kt
      - id: gd
        label: Ground distance to obstacle (read from the figure)
        unit: NM
      - id: obst
        label: Obstacle height (read from the figure)
        unit: ft
    chartInputs:
      - gd
      - obst
    answer:
      formula: gd * 6080 * gradient / 100 * tas / (tas - headwind) - obst
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: gd * 6080 * gradient / 100 - obst
      - id: d2
        formula: gd * 6080 * gradient / 100 * tas / (tas + headwind) - obst
      - id: d3
        formula: gd * 6080 * gradient / 100 * tas / (tas - headwind)
      - id: d4
        formula: gd * 6080 * gradient / 100 * (tas - headwind) / tas - obst
      - id: d5
        formula: gd * 6080 * gradient / 100 * tas / (tas - headwind) + obst
    presets:
      - id: p1
        values:
          gradient: 8
          tas: 111
          headwind: -4
          gd: 2.3
          obst: 810
      - id: p2
        values:
          gradient: 5
          tas: 133
          headwind: -10
          gd: 2.1
          obst: 520
      - id: p3
        values:
          gradient: 9
          tas: 124
          headwind: 10
          gd: 2
          obst: 750
    explanation: >-
      The obstacle clearance is the height the aeroplane has gained at the
      obstacle minus the obstacle height. The climb gradient is flown relative
      to the air, while the distance to the obstacle is measured over the
      ground, so the gained height is corrected by TAS/GS.


      **Solution**


      GS = TAS - headwind = {{= tas - headwind}} kt


      Height gain = {{f: gd * 6080 * gradient / 100 * tas / (tas - headwind)}} =
      {{n: gd * 6080 * gradient / 100 * tas / (tas - headwind)}} = {{= gd * 6080
      * gradient / 100 * tas / (tas - headwind)}} ft


      Clearance = {{= gd * 6080 * gradient / 100 * tas / (tas - headwind)}} ft -
      {{obst}} ft = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the wind (uses TAS = GS).

      - **{{d2}} ft**: applies the wind component with the wrong sign when
      computing GS.

      - **{{d3}} ft**: this is the height gain; the obstacle height was not
      subtracted.

      - **{{d4}} ft**: uses GS/TAS instead of TAS/GS.

      - **{{d5}} ft**: adds the obstacle height instead of subtracting it.
