    explanation: >-
      The take-off distance chart shows the wind component needed so that the
      take-off distance required fits the available distance; a positive result
      is a headwind that is required at minimum.


      **Solution**


      Following the chart through mass, pressure altitude, temperature and the
      available distance gives **{{answer}} kt** headwind.


      **Why the other answers are wrong**


      - **{{d1}} kt**: a reading that is too low (the zero-wind line misread).

      - **{{d2}} kt**: a reading from the wrong distance line.

      - **{{d3}} kt**: the wrong sign: a tailwind instead of a headwind.

      - **{{d4}} kt**: a small misread of the distance axis.
