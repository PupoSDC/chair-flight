  template:
    type: calculation
    question: An aircraft which experiences an increase of headwind of {{hw}} kt
      while making its way towards the centre of a microburst may expect, when
      crossing the microburst, to face a windshear of how many kt?
    variables:
      - id: hw
        label: Increase of headwind
        unit: kt
    answer:
      formula: 2 * hw
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: hw
      - id: d2
        formula: hw / 2
      - id: d3
        formula: hw * 3
      - id: d4
        formula: hw + 10
    presets:
      - id: p1
        values:
          hw: 20
      - id: p2
        values:
          hw: 15
      - id: p3
        values:
          hw: 25
    explanation: >-
      A microburst is a strong downdraught that spreads out at the ground. An
      aircraft flying into it first gets more headwind, so it gains airspeed.
      Once it crosses the centre, the same air becomes a tailwind of the same
      size, so the total change in wind the aircraft meets is twice the headwind
      increase.


      **Solution**


      {{f: 2 * hw}} = {{n: 2 * hw}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: counts only the headwind, forgetting the tailwind after
      the centre.

      - **{{d2}} kt**: halves the headwind increase instead of doubling it.

      - **{{d3}} kt**: triples the headwind increase.

      - **{{d4}} kt**: adds a fixed 10 kt to the headwind increase.
