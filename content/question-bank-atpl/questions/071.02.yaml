  template:
    type: calculation
    question: For an aeroplane with a tyre pressure of {{tyre}} bar, at what speed
      (in kt) is there a risk of dynamic hydroplaning?
    variables:
      - id: tyre
        label: Tyre pressure
        unit: bar
    answer:
      formula: 9 * sqrt(tyre * 14.5038)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: 9 * sqrt(tyre)
      - id: d2
        formula: 8 * sqrt(tyre * 14.5038)
      - id: d3
        formula: 9 * sqrt(tyre * 14.5038) / 1.852
      - id: d4
        formula: 9 * sqrt(tyre * 14.5038) - 10
    presets:
      - id: p1
        values:
          tyre: 10
      - id: p2
        values:
          tyre: 12
      - id: p3
        values:
          tyre: 10.8
    explanation: >-
      Dynamic hydroplaning happens when the tyres ride on a film of water
      instead of the runway. The speed at which the risk starts depends on the
      tyre pressure: the higher the pressure, the higher that speed. The
      pressure is first converted from bar to psi.


      **Solution**


      Tyre pressure in psi: {{tyre}} bar × 14.5038 = {{= tyre * 14.5038}} psi


      {{f: 9 * sqrt(tyre * 14.5038)}} = {{n: 9 * sqrt(tyre * 14.5038)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the pressure in bar directly, without converting it
      to psi.

      - **{{d2}} kt**: uses 8 instead of 9 as the constant.

      - **{{d3}} kt**: divides by 1.852, which gives km/h instead of knots.

      - **{{d4}} kt**: subtracts a fixed 10 kt from the correct speed.
