    question: >-
      Refer to the figure. An aircraft experiences an engine failure, given:


      - Engine failure altitude: {{alt}} ft

      - All-up weight at the point of failure: {{weight}} lb


      Find the time taken (I), the fuel used (II) and the distance travelled
      (III) to stabilising height.
    explanation: ""
    variables:
      - id: alt
        label: Engine failure altitude
        unit: ft
      - id: weight
        label: All-up weight at failure
        unit: lb
    entries:
      - id: e1
        values:
          alt: 36000
          weight: 34000
        answer: (I) 29 minutes; (II) 675 lb; (III) 128 NM
        wrongAnswers:
          - (I) 33 minutes; (II) 790 lb; (III) 146 NM
          - (I) 30 minutes; (II) 700 lb; (III) 134 NM
          - (I) 28 minutes; (II) 650 lb; (III) 122 NM
        explanation: >-
          After an engine failure, the aircraft descends to a stabilising
          height. The time, fuel and distance are read from the engine failure
          chart, using the failure altitude and the all-up weight.


          **Solution**


          - Enter the chart at {{alt}} ft with an all-up weight of {{weight}}
          lb.

          - The chart gives 29 minutes, 675 lb of fuel and 128 NM.


          **Why the other answers are wrong**


          - **(I) 33 minutes; (II) 790 lb; (III) 146 NM**: all three values are
          read too high, as from a higher weight.

          - **(I) 30 minutes; (II) 700 lb; (III) 134 NM**: values read from a
          neighbouring line of the chart.

