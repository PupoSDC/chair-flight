  template:
    type: chart-calculation
    question: >-
      Refer to figure or CAP 698 file 4.20. Given the following information for
      a medium range jet transport aeroplane, determine the regulated take-off
      mass for the new runway:


      OAT: +15 °C

      Airfield pressure altitude: 0 ft

      Nil wind

      Flap setting: 5°

      TORA: 7000 ft


      The normal take-off mass limits relevant for this flight are: maximum
      structural limit 62 800 kg, field length limit 60 500 kg, climb limit 64
      000 kg, tyre speed limit greater than 84 000 kg.


      Due to a wind direction change, ATC changes the runway in use, which will
      have the same conditions described previously, except for: wind 10 kt
      headwind, obstacle height 360 ft, obstacle distance from the brake release
      point 21 000 ft.


      (The value is read from the table.)
    variables:
      - id: rtom
        label: Regulated take-off mass read from the table
        unit: kg
    chartInputs:
      - rtom
    answer:
      formula: rtom
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: rtom + 1600
      - id: d2
        formula: rtom + 5100
      - id: d3
        formula: rtom - 900
      - id: d4
        formula: rtom + 3900
    presets:
      - id: p1
        values:
          rtom: 58900
    explanation: >-
      The regulated take-off mass (RTOM) is read from the RTOW table for the
      given runway, wind component and temperature; corrections for QNH, air
      conditioning/anti-ice, runway condition and line-up are then applied
      exactly as indicated in the table notes (most conservative values when not
      interpolating).


      **Solution**


      Entering the figure with the given conditions gives regulated take-off
      mass = **{{answer}} kg**.


      **Why the other answers are wrong**


      - **{{d1}} kg**: a neighbouring cell of the table (wrong wind or
      temperature column) or a wrongly applied correction.

      - **{{d2}} kg**: a neighbouring cell of the table (wrong wind or
      temperature column) or a wrongly applied correction.

      - **{{d3}} kg**: a neighbouring cell of the table or a wrongly applied
      correction.

      - **{{d4}} kg**: a neighbouring cell of the table or a wrongly applied
      correction.
