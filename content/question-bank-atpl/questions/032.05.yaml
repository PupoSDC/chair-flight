  template:
    type: chart
    question: >-
      Refer to the figure or CAP 698 file 4.4.


      An MRJT aeroplane is scheduled to depart from an island airport and the
      crew is calculating the take-off performance with the following data:
      Runway 03: TORA 7000 ft, slope 1% UP, 5 kt headwind component.


      Runway 21: TORA 7000 ft, slope 1 % DOWN, 5 kt tailwind component.


      Airport pressure altitude: 10 ft.


      Temperature: +21º C.


      To maintain terrain clearance, taking off from runway 03 requires the use
      of flap 5, whereas runway 21 departs over the ocean, so flap 15 may be
      used.


      The planned take-off mass with desired fuel is currently 59 100 kg.


      After calculating the runway 03 take-off performance, the crew finds that
      the Field-Length-Limited Take-Off Mass (FLLTOM) is under the planned
      take-off mass at 58 500 kg.


      Which of the following options is best from both an airmanship and
      commercial standpoint?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: A departure from runway 21 is preferred as this allows for the FLLTOM to
          be increased by approximately 1000 kg.
        wrongAnswers:
          - Runway 03 should be chosen because a take-off into a headwind gives
            greater safety margins and 600 kg of fuel should be offloaded.
          - A departure from runway 21 is preferred, with a down-slope and
            tailwind, as this will increase safety margins in the event of
            stopping.
          - Runway 03 should be chosen as the headwind gives a better climb
            performance and 600 kg of baggage should be offloaded.
        explanation: >-
          Runway 03 (flap 5, headwind, up-slope) has a FLLTOM of 58 500 kg,
          which is 600 kg below the planned 59 100 kg.


          Runway 21 allows flap 15, and the down-slope outweighs the tailwind on
          the CAP 698 take-off chart, so the FLLTOM rises by about 1 000 kg and
          the full planned mass can be flown: **runway 21**.
