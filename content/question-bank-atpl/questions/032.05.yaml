- id: QAVOQKBW
  docId: "032.05"
  relatedQuestions:
    - QBFFGBKH
  externalIds:
    - ATPLQ-323006
    - BGS-320456
    - ATPLQ-324764
    - AVEXAM-63736
    - AVEXAM-55441
  annexes:
    - cap-698-page-61-figure-4.6
  learningObjectives:
    - "032.05"
    - 032.05.01.01.04
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 698 file 4.6).


      Find the flaps 5 tyre speed limited take-off mass for an aircraft fitted
      with 210 mph tyres, PMC OFF, given: pressure altitude {{pa}} ft, OAT
      {{oat}} °C, tailwind {{tw}} kt.


      Use the value read from the chart.
    variables:
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: tw
        label: Tailwind
        unit: kt
      - id: mass_chart
        label: Tyre speed limited mass read from the chart
        unit: kg
    chartInputs:
      - mass_chart
    answer:
      formula: mass_chart
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mass_chart * 1.15
      - id: d2
        formula: mass_chart * 1.25
      - id: d3
        formula: mass_chart * 0.85
      - id: d4
        formula: mass_chart * 1.1
    presets:
      - id: p1
        values:
          pa: 6000
          oat: 10
          tw: 10
          mass_chart: 58830
      - id: p2
        values:
          pa: 7000
          oat: 25
          tw: 3
          mass_chart: 56850
    explanation: >-
      The tyre speed limited take-off mass is read from the tyre speed chart:
      enter with OAT and pressure altitude, apply the wind component and read
      the mass for the given tyre rating and flap setting.


      **Solution**


      The value read from the chart is {{mass_chart}} kg, so the answer is
      **{{answer}} kg**.


      **Why the other answers are wrong**


      - **{{d1}} kg**: reading the chart for a higher tyre speed rating or
      without the wind correction.

      - **{{d2}} kg**: using the wrong tyre speed curve.

      - **{{d3}} kg**: applying the wind correction in the wrong direction.

      - **{{d4}} kg**: a misread of the temperature line.
