  learningObjectives:
    - "032.05"
  template:
    type: chart
    question: >-
      Refer to the figure. A pilot is considering the possibility of having to
      land on a flooded runway and is evaluating the aircraft configuration and
      the selection of the landing speeds. Given the following information,
      choose the lowest possible flap setting that would avoid dynamic
      hydroplaning on landing.


      - Landing mass: {{mass}} kg

      - Tyre pressure: {{tyre}} psi


      Which flap setting should be selected?
    explanation: ""
    variables:
      - id: mass
        label: Landing mass
        unit: kg
      - id: tyre
        label: Tyre pressure
        unit: psi
    entries:
      - id: e1
        values:
          mass: 45000
          tyre: 200
        answer: Flaps 30
        wrongAnswers:
          - Flaps 40
          - Flaps 15
          - Flaps 25
        explanation: >-
          Dynamic hydroplaning happens when the landing speed is above the speed
          at which the tyres lose contact with a flooded runway. The
          hydroplaning chart gives that speed limit for each flap setting, so
          the lowest flap setting whose limit is not exceeded is the one to
          choose.


          **Solution**


          At a landing mass of {{mass}} kg and a tyre pressure of {{tyre}} psi,
          the lowest flap setting that avoids dynamic hydroplaning is **Flaps
          30**.


          **Why the other answers are wrong**


          - **Flaps 40**: avoids hydroplaning but is not the lowest setting that
          does.

          - **Flaps 15**: the landing speed is above the hydroplaning limit for
          this setting.

          - **Flaps 25**: the landing speed is above the hydroplaning limit for
          this setting, so it is not a safe choice.
