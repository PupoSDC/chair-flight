  template:
    type: chart
    question: >-
      Refer to the figure (CAP 698 Figure 4.28). What is the minimum field
      length required for the worst wind situation when landing a twin jet
      aeroplane with the anti-skid inoperative?


      - Elevation: {{elev}} ft

      - QNH: {{qnh}} hPa

      - Landing mass: {{mass}} kg

      - Flaps: as required for minimum landing distance

      - Runway condition: dry

      - Maximum allowable tailwind: {{tailwind}} kt

      - Maximum allowable headwind: {{headwind}} kt


      What is the minimum field length?
    explanation: ""
    variables:
      - id: elev
        label: Elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: mass
        label: Landing mass
        unit: kg
      - id: tailwind
        label: Maximum allowable tailwind
        unit: kt
      - id: headwind
        label: Maximum allowable headwind
        unit: kt
    entries:
      - id: e1
        values:
          elev: 2000
          qnh: 1013
          mass: 50000
          tailwind: 15
          headwind: 50
        answer: 3100 m.
        wrongAnswers:
          - 2600 m.
          - 2900 m.
          - 2700 m.
        explanation: >-
          The worst wind situation is the one that gives the longest field
          length. A tailwind lengthens the landing distance, so the chart is
          used at the maximum allowable tailwind.


          **Solution**


          For an elevation of {{elev}} ft, QNH {{qnh}} hPa, a landing mass of
          {{mass}} kg and a {{tailwind}} kt tailwind, the chart gives a minimum
          field length of **3100 m**.


          **Why the other answers are wrong**


          - **2600 m**: uses the maximum headwind, which shortens the distance.

          - **2900 m**: a misread of the chart by one grid step.

          - **2700 m**: ignores the QNH correction.
