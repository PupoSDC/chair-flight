- id: QBITQNAB
  docId: "032.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-325438
    - AVEXAM-67366
    - BGS-320826
  annexes:
    - cap-698-page-63-figure-4.7
  learningObjectives:
    - 032.05.01.01.07
  template:
    type: chart
    question: >-
      Refer to the figure (CAP 698 Figure 4.7). Given the following conditions,
      at what mass is the maximum take-off mass (MTOM) limited by VMBE?


      - Airfield elevation: {{elev}} ft

      - Slope: {{slope}} % upslope

      - QNH: {{qnh}} hPa

      - OAT: {{oat}} °C

      - V1: {{v1}} kt

      - Headwind: {{headwind}} kt
    explanation: ""
    variables:
      - id: elev
        label: Airfield elevation
        unit: ft
      - id: slope
        label: Slope
        unit: "%"
      - id: qnh
        label: QNH
        unit: hPa
      - id: oat
        label: OAT
        unit: °C
      - id: v1
        label: V1
        unit: kt
      - id: headwind
        label: Headwind
        unit: kt
    entries:
      - id: e1
        values:
          elev: 111
          slope: 0.5
          qnh: 1013
          oat: 41
          v1: 149
          headwind: 10
        answer: In excess of 68 000 kg.
        wrongAnswers:
          - VMBE can NOT be lower than V1 thus a take-off can NOT be commenced
            in these conditions.
          - The same as the maximum structural take-off mass of 62 800 kg.
          - It cannot be determined.
        explanation: >-
          VMBE is the maximum brake energy speed. The chart shows the mass at
          which the brake energy limit starts to restrict the take-off mass for
          the given runway and weather conditions.


          **Solution**


          With an elevation of {{elev}} ft, a {{slope}} % upslope, QNH {{qnh}}
          hPa, OAT {{oat}} °C, V1 {{v1}} kt and a {{headwind}} kt headwind, the
          chart gives a VMBE limit only above **68 000 kg**.


          **Why the other answers are wrong**


          - **VMBE can NOT be lower than V1**: VMBE is not compared with V1 this
          way, so the take-off is not blocked by it.

          - **The same as the maximum structural take-off mass of 62 800 kg**:
          confuses the VMBE limit with the structural limit.

          - **It cannot be determined**: the chart gives a result for these
          conditions, so the value can be determined.
