  template:
    type: chart
    question: >-
      Refer to the figure or CAP 698 Figure 4.31. Due to a predictive wind shear
      warning, a take-off at Madrid airport is rejected. Using the data below,
      when can another take-off be attempted?


      - Take-off mass: {{mass}} kg

      - Aerodrome elevation: {{elev}} ft

      - OAT: +{{oat}} °C

      - Wind: calm

      - Speed at rejection: {{speed}} kt


      Which statement is correct?
    explanation: ""
    variables:
      - id: mass
        label: Take-off mass
        unit: kg
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: speed
        label: Speed at rejection
        unit: kt
    entries:
      - id: e1
        values:
          mass: 61300
          elev: 2000
          oat: 34
          speed: 80
        answer: Cooling is recommended and it will require approximately 45 minutes to
          achieve this.
        wrongAnswers:
          - Cooling is recommended and it requires approximately 30 minutes when
            giving credit for reverse.
          - The fuse plugs may melt and the take-off must be delayed by
            approximately 40 minutes.
          - Cooling is recommended and it requires approximately 40 minutes when
            giving credit for reverse.
        explanation: >-
          After a rejected take-off, the brakes must cool before another
          take-off. The cooling time is read from the brake cooling chart, using
          the take-off mass, the elevation, the temperature and the speed at
          rejection. Credit for reverse thrust is not taken here.


          **Solution**


          - Enter the chart with {{mass}} kg, {{elev}} ft, +{{oat}} °C and a
          speed at rejection of {{speed}} kt, with no wind.

          - The chart shows that cooling is recommended and takes about 45
          minutes.


          **Why the other answers are wrong**


          - **Cooling is recommended and it requires approximately 30 minutes
          when giving credit for reverse.**: uses the reverse credit, which is
          not part of this case, and gives a shorter time.

          - **The fuse plugs may melt and the take-off must be delayed by
          approximately 40 minutes.**: the fuse plug warning is a different
          consequence, not the cooling time.

          - **Cooling is recommended and it requires approximately 40 minutes
          when giving credit for reverse.**: a time read with reverse credit,
          which gives a different value.
