  docId: "032.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-329412
    - AVEXAM-46386
  annexes:
    - cap-698-page-98-figure-4.31
  learningObjectives:
    - "032.05"
  template:
    type: chart
    question: >-
      Refer to figure or CAP 698 figure 4.31. The flight crew of an MRJT plan to
      touch down with the braking configuration Autobrake 2 and normal reverse
      #2 detent. On touchdown the thrust reverser fail light illuminates, the
      Commander cancels reverse thrust and selects Autobrake 3 instead. From the
      runway the aeroplane taxis 1.5 miles to the assigned terminal gate. Given
      the following performance data, how much energy has been absorbed per
      brake, and what is the minimum brake cooling time after this landing?


      - Estimated landing mass: 100 000 lb

      - VREF: 123 kt

      - Corrections to VREF: (VREF - 3 kt)

      - Corrections to VREF for wind component: minus 50% of a headwind or plus
      150% for a tailwind

      - Headwind component: 4 kt

      - Pressure altitude: 5 000 ft

      - OAT: -10°C


      Add one million foot-pounds for each taxi mile to obtain total brake
      energy.
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Approximately 15.5 million foot-pounds of energy has been absorbed per
          brake, with an advised cooling time of at least of 52 minutes.
        wrongAnswers:
          - Approximately 9.5 million foot-pounds of energy has been absorbed
            per brake, with an advised cooling time of 16 minutes.
          - Approximately 14.5 million foot-pounds of energy has been absorbed
            per brake, with an advised cooling time of 44 minutes.
          - Approximately 18.5 million foot-pounds of energy has been absorbed
            per brake, with an advised cooling time of 62 minutes.
        explanation: >-
          The brake energy is read from the brake chart for the landing mass,
          corrected speed and braking configuration, then the energy of the taxi
          distance is added. The cooling time follows from the total energy per
          brake.


          The correct result is about **15.5 million foot-pounds per brake**
          with a cooling time of **at least 52 minutes**.


          **Why the other answers are wrong**


          - **9.5 million foot-pounds, 16 minutes**: the energy is read too low
          and the cooling time is too short.

