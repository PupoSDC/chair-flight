    question: >-
      Refer to the figure (CAP 698 Figure 4.28). For a commercially operated
      turbo jet powered aeroplane in Performance Class A, determine the field
      length, given:


      - Estimated landing mass: {{mass}} kg

      - Aerodrome pressure altitude: {{pa}} ft

      - Flap setting: 30°

      - Runway: dry, no slope

      - Headwind component: {{headwind}} kt

      - Anti-skid: inoperative

      - Spoilers: automatic

      - Air conditioning: auto


      What is the field length?
    explanation: ""
    variables:
      - id: mass
