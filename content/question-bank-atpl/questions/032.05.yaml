          wdir: 50
          wspd: 16
          oat: 12
          qnh: 1008
          tom: 71480
        answer: 59° with V1 / VR / V2 = 138 / 138 / 144
        wrongAnswers:
          - 61° with V1 / VR / V2 = 137 / 137 / 142
          - 59° with V1 / VR / V2 = 138 / 138 / 143
          - 57° with V1 / VR / V2 = 139 / 139 / 144
        explanation: >-
          The FLEX temperature and V speeds are read from the RTOW table for
          runway 05L from intersection VB. The table is used without
          interpolation, so the row that is the most conservative for the wind,
          temperature and runway condition is chosen.


          **Solution**


          With a wind of {{wdir}}° / {{wspd}} kt, an OAT of +{{oat}} °C and a
          take-off mass of {{tom}} kg on a dry runway, the table gives a FLEX
