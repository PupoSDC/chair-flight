  learningObjectives:
    - "032.05"
    - 032.05.02.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 698 file 4.23, one-engine-inoperative net
      level-off chart) for the Medium Range Jet Transport. Determine the maximum
      net mass that allows a safe net level-off at the highest relevant obstacle
      or MSA, given:


      - Minimum off-route pressure altitude / MSA: {{alt}} ft

      - Temperature: ISA +{{isa}}°C


      A/C: AUTO (HIGH)

      Anti-ice: all OFF


      The maximum net mass read from the chart is {{massread}} kg (value read
      from the figure); state it as the answer.
    variables:
      - id: alt
        label: Obstacle altitude / MSA
        unit: ft
      - id: isa
        label: ISA deviation
        unit: °C
      - id: massread
        label: Mass read from the graph
        unit: kg
    chartInputs:
      - massread
    answer:
      formula: massread
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: massread + 1800
      - id: d2
        formula: massread + 4300
      - id: d3
        formula: massread + 6800
      - id: d4
        formula: massread - 2000
    presets:
      - id: p1
        values:
          alt: 16000
          isa: 15
          massread: 52300
      - id: p2
        values:
          alt: 12100
          isa: 14
          massread: 58400
      - id: p3
        values:
          alt: 16000
          isa: 10
          massread: 54100
      - id: p4
        values:
          alt: 12000
          isa: 15
          massread: 58250
    explanation: >-
      The net level-off chart gives, for a given ISA deviation and level-off
      altitude, the maximum mass at which the one-engine-inoperative net flight
      path clears the obstacle. Enter the chart with the altitude, go to the ISA
      deviation (anti-ice off, A/C auto high) and read the mass.


      **Solution**


      Enter the chart at {{alt}} ft and ISA +{{isa}}°C: **{{answer}} kg**.


      **Why the other answers are wrong**


      - **{{d1}} kg**: a mass from the wrong (colder) temperature curve of the
      chart.

      - **{{d2}} kg**: a misread of the altitude line, which gives too high a
      mass.

      - **{{d3}} kg**: a misread by a large margin of the net level-off line.

      - **{{d4}} kg**: a mass read from the wrong (warmer) temperature curve.
