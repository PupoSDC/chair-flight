- id: QJ1LCWYDX
  docId: "032.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-322418
    - AVEXAM-51233
  annexes: []
  learningObjectives:
    - "032.05"
  template:
    type: calculation
    question: |-
      Given:

      - BRP: {{brp}} ft AMSL
      - Runway slope: {{slope}}% downhill
      - TODR: {{todr}} m
      - Obstacle elevation: {{obs}} ft

      Calculate the obstacle height above reference zero for the MRJT:
    variables:
      - id: brp
        label: BRP elevation
        unit: ft
      - id: slope
        label: Runway slope
        unit: "%"
      - id: todr
        label: TODR
        unit: m
      - id: obs
        label: Obstacle elevation
        unit: ft
    answer:
      formula: (obs - brp) + todr * 3.28084 * slope / 100
      unit: ft
      decimals: 1
    distractors:
      - id: d1
        formula: (obs - brp) - todr * 3.28084 * slope / 100
      - id: d2
        formula: obs - brp
      - id: d3
        formula: obs - todr
    presets:
      - id: p1
        values:
          brp: 3420
          slope: 1.3
          todr: 2760
          obs: 3785
      - id: p2
        values:
          brp: 2150
          slope: 1.8
          todr: 2400
          obs: 2560
      - id: p3
        values:
          brp: 1800
          slope: 0.9
          todr: 3100
          obs: 2300
    explanation: >-
      Reference zero is the end of the take-off distance required, which on a
      downhill runway lies lower than the brake release point (BRP). The
      obstacle height above reference zero is therefore the obstacle elevation
      above the BRP plus the height lost along the TODR.


      **Solution**


      Height lost along the TODR: {{= todr * 3.28084}} ft x {{slope}}% = {{=
      todr * 3.28084 * slope / 100}} ft


      {{f: (obs - brp) + todr * 3.28084 * slope / 100}} = {{n: (obs - brp) +
      todr * 3.28084 * slope / 100}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: subtracts the slope correction instead of adding it (this
      would be correct for an uphill runway).

      - **{{d2}} ft**: only the elevation difference; the downhill slope over
      the TODR is ignored.

      - **{{d3}} ft**: subtracts the TODR in metres from the obstacle elevation,
      which is meaningless.
