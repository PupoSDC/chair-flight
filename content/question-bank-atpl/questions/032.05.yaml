  template:
    type: chart
    question: >-
      Refer to the figure. Given the following information, which landing flap
      configuration should be used to be within the landing limits?


      - Estimated landing mass: {{mass}} kg

      - Structural-limited landing mass: {{structural}} kg


      Which flap configuration should be used?
    explanation: ""
    variables:
      - id: mass
        label: Estimated landing mass
        unit: kg
      - id: structural
        label: Structural-limited landing mass
        unit: kg
    entries:
      - id: e1
        values:
          mass: 54500
          structural: 66300
        answer: Flap 30
        wrongAnswers:
          - Unable to land with the provided configurations
          - Flap 15
          - Flap 40
        explanation: >-
          Each flap setting has a landing mass limit that is read from the
          landing limits figure. The landing mass must be within the limit of
          the chosen flap setting and below the structural limit, so the setting
          to use is the one whose limit covers the estimated landing mass.


          **Solution**


          An estimated landing mass of {{mass}} kg is within the limit for Flap
          30, and the structural limit of {{structural}} kg is not exceeded, so
          the configuration to use is **Flap 30**.


          **Why the other answers are wrong**


          - **Unable to land with the provided configurations**: Flap 30 is
          within the limits, so landing is possible.

          - **Flap 15**: its landing mass limit is below the estimated landing
          mass.

          - **Flap 40**: not the configuration the figure gives for this landing
          mass.
