  template:
    type: chart
    question: >-
      Refer to the figure or CAP 698 file 4.25. Given the following information
      and assuming a drift down after engine failure:


      - Drift down from pressure altitude: {{alt_from}} ft

      - Drift down to pressure altitude: {{alt_to}} ft

      - Gross mass at engine failure: {{mass}} kg

      - ISA conditions

      - No wind


      What are the time travelled and the fuel burned during the drift down?
    explanation: ""
    variables:
      - id: alt_from
        label: Drift down from pressure altitude
        unit: ft
      - id: alt_to
        label: Drift down to pressure altitude
        unit: ft
      - id: mass
        label: Gross mass at engine failure
        unit: kg
    entries:
      - id: e1
        values:
          alt_from: 33000
          alt_to: 20000
          mass: 55000
        answer: 23 min, 750 kg.
        wrongAnswers:
          - 2 min, 50 kg.
          - 130 min, 750 kg.
          - 23 min, 70 kg.
        explanation: >-
          The drift down time and fuel are read from the drift down chart in CAP
          698 file 4.25. The chart uses the start and end pressure altitudes and
          the gross mass at engine failure.


          **Solution**


          - Enter the chart from {{alt_from}} ft down to {{alt_to}} ft at a
          gross mass of {{mass}} kg, in ISA with no wind.

          - The chart gives 23 min and 750 kg.


          **Why the other answers are wrong**


          - **2 min, 50 kg.**: far too short a time and fuel, a misread of the
          time scale.

          - **130 min, 750 kg.**: the fuel is right but the time is far too
          long, a misread of the time scale.

          - **23 min, 70 kg.**: the time is right but the fuel is read on the
          wrong scale.
- id: QFGVKVKVS
  docId: "032.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-322377
    - BGS-321221
  annexes:
    - cap-698-page-98-figure-4.31
  learningObjectives:
    - "032.05"
  template:
    type: chart
    question: >-
      Refer to figure or to CAP 698 figure 4.31.


      An MRJT (Medium Range Jet Transport) aircraft is performing circuits as
      part of pilot training.


      So far, 17.6 Million foot-pounds of energy have been absorbed by the
      brakes, and the pilots now want to make a final landing without any
      reverse thrust, which shall add a further 10 Million foot-pounds of
      energy.


      Which of the following is the best procedure to follow?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Fly around with the gear down for 6 minutes, then land. Park the
          aircraft for at least 60 minutes.
        wrongAnswers:
          - Land, then cool the brakes for no more than 80 minutes before the
            next take-off.
          - Fly around with the gear up for 30 minutes, then land.
          - Land as soon as required, there is no brake cooling requirement.
        explanation: >-
          The brakes would hold 17.6 + 10 = 27.6 million ft-lb after the
          landing. On Figure 4.31 this is above the limit for landing straight
          away, so the brakes must be cooled first.


          The chart gives a procedure of flying with the **gear down for 6
          minutes** before landing, then parking for at least 60 minutes.
- id: QFOPE6AZS
