- id: QRIDLEKA
  docId: "032.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-321376
    - AVEXAM-46649
  annexes: []
  learningObjectives:
    - 032.05.03.01.03
  template:
    type: calculation
    question: >-
      During the pre-flight planning procedure, the pilot of a Commercial Air
      Transport flight has calculated various performance-limited landing
      masses. Given the following limit masses, determine the maximum
      performance limited landing mass which complies with the operational
      requirements.


      - Approach climb limit mass: {{acl}} lb

      - Landing climb limit mass: {{lcl}} lb

      - Field length limit mass: {{fll}} lb

      - Structural limit landing mass: {{slm}} lb
    variables:
      - id: acl
        label: Approach climb limit mass
        unit: lb
      - id: lcl
        label: Landing climb limit mass
        unit: lb
      - id: fll
        label: Field length limit mass
        unit: lb
      - id: slm
        label: Structural limit landing mass
        unit: lb
    answer:
      formula: min(acl, lcl, fll, slm)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: slm
      - id: d2
        formula: fll
      - id: d3
        formula: lcl
    presets:
      - id: p1
        values:
          acl: 32250
          lcl: 38300
          fll: 34500
          slm: 39300
      - id: p2
        values:
          acl: 35200
          lcl: 36800
          fll: 37900
          slm: 39300
      - id: p3
        values:
          acl: 34900
          lcl: 40100
          fll: 36600
          slm: 41000
    explanation: >-
      The landing mass must satisfy every limitation at the same time:
      structural, approach climb, landing climb and field length. The maximum
      permitted landing mass is therefore the smallest of all the limit masses.


      **Solution**


      {{f: min(acl, lcl, fll, slm)}} = {{n: min(acl, lcl, fll, slm)}} =
      **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the structural limit only, which ignores the more
      restrictive performance limits.

      - **{{d2}} lb**: the field length limit only, which is not the smallest
      limit.

      - **{{d3}} lb**: the landing climb limit only, which is not the smallest
      limit.
