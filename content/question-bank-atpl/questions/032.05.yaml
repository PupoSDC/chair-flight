  template:
    type: chart
    question: >-
      Refer to the figure or CAP 698 file 4.23. The pilot of a jet-engine
      aircraft must determine which of the following en-route alternate airports
      are the most appropriate diversion airports in case of an engine failure
      during the cruise phase. Given the information below:


      - Temperature: ISA +10 °C or below

      - Anti-ice: engine anti-ice on

      - Aircraft cruise mass: {{mass}} kg

      - Required airport clearance, airport 1: {{c1}} ft

      - Required airport clearance, airport 2: {{c2}} ft

      - Required airport clearance, airport 3: {{c3}} ft

      - Required airport clearance, airport 4: {{c4}} ft


      Which airports are the most appropriate diversion airports?
    explanation: ""
    variables:
      - id: mass
        label: Aircraft cruise mass
        unit: kg
      - id: c1
        label: Required clearance, airport 1
        unit: ft
      - id: c2
        label: Required clearance, airport 2
        unit: ft
      - id: c3
        label: Required clearance, airport 3
        unit: ft
      - id: c4
        label: Required clearance, airport 4
        unit: ft
    entries:
      - id: e1
        values:
          mass: 43000
          c1: 21000
          c2: 23000
          c3: 24500
          c4: 19500
        answer: 1 and 4
        wrongAnswers:
          - 3 and 4
          - 2 and 3
          - 1 and 2
        explanation: >-
          The engine-out ceiling chart in CAP 698 file 4.23 gives the altitude
          the aircraft can reach with one engine out, for the given mass and
          conditions. An airport is only suitable if its required clearance is
          at or below that ceiling.


          **Solution**


          - Read the ceiling for a cruise mass of {{mass}} kg with engine
          anti-ice on in these conditions.

          - Airports 1 ({{c1}} ft) and 4 ({{c4}} ft) are within the ceiling;
          airports 2 ({{c2}} ft) and 3 ({{c3}} ft) are not.


          **Why the other answers are wrong**


          - **3 and 4**: airport 3 needs a clearance above the ceiling.

          - **2 and 3**: airports 2 and 3 both need clearances above the
          ceiling.

          - **1 and 2**: airport 2 needs a clearance above the ceiling.
