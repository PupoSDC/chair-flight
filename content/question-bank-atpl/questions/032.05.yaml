        answer: (I) 34 minutes; (II) 795 lb; (III) 155 NM
        wrongAnswers:
          - (I) 36 minutes; (II) 887 lb; (III) 167 NM
          - (I) 36 minutes; (II) 167 lb; (III) 887 NM
          - (I) 34 minutes; (II) 155 lb; (III) 795 NM
        explanation: >-
          After an engine failure, the aircraft descends to a stabilising
          height. The time, fuel and distance are read from the engine failure
          chart, using the failure altitude and the all-up weight.


          **Solution**


          - Enter the chart at {{alt}} ft with an all-up weight of {{weight}}
          lb.

          - The chart gives 34 minutes, 795 lb of fuel and 155 NM.


          **Why the other answers are wrong**


          - **(I) 36 minutes; (II) 887 lb; (III) 167 NM**: all three values are
          read too high, from a higher altitude or weight.

          - **(I) 36 minutes; (II) 167 lb; (III) 887 NM**: the fuel and distance
          are swapped and the time is too long.

          - **(I) 34 minutes; (II) 155 lb; (III) 795 NM**: the fuel and distance
          are swapped, so the time is right but the other two are wrong.
