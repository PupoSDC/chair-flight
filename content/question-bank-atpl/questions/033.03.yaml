          vol: 2500
          dens: 0.8
      - id: p3
        values:
          vol: 5200
          dens: 0.78
    explanation: >-
      Fuel mass is volume in litres multiplied by density. One US gallon is
      3.78541 litres, so the volume must first be converted.


      **Solution**


      {{f: vol * 3.78541 * dens}} = {{n: vol * 3.78541 * dens}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: divides by the density instead of multiplying.

      - **{{d2}} kg**: converts to litres only, which is a volume, not a mass.

      - **{{d3}} kg**: uses the imperial gallon (4.54609 l) instead of the US
      gallon.
