      - id: t_a2
        label: Time to alternate of destination 2
        unit: min
      - id: ff
        label: Fuel consumption
        unit: kg/h
      - id: frf
        label: Final reserve fuel
        unit: kg
    answer:
      formula: ff / 60 * (t_dp + max(1.05 * t_d1 + t_a1, 1.05 * t_d2 + t_a2)) + frf
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff / 60 * (t_dp + max(t_d1 + t_a1, t_d2 + t_a2)) + frf
      - id: d2
        formula: ff / 60 * (t_dp + max(1.05 * t_d1 + t_a1, 1.05 * t_d2 + t_a2))
      - id: d3
        formula: ff / 60 * (t_dp + 1.05 * t_d2 + t_a2) + frf
      - id: d4
        formula: ff / 60 * (t_dp + 1.05 * t_d1) + frf
    presets:
      - id: p1
        values:
          t_dp: 317
          t_d1: 62
          t_a1: 21
          t_d2: 37
          t_a2: 18
          ff: 2969
          frf: 1320
      - id: p2
        values:
          t_dp: 280
          t_d1: 75
          t_a1: 25
          t_d2: 50
          t_a2: 20
          ff: 2850
          frf: 1250
      - id: p3
        values:
          t_dp: 340
          t_d1: 55
          t_a1: 30
          t_d2: 45
          t_a2: 15
          ff: 3100
          frf: 1400
    explanation: >-
      The fuel to the decision point is burned in full. From the decision point,
      the destination needs 5 % contingency on its trip plus the alternate fuel.
      The destination with the larger requirement decides the fuel, and the
      final reserve is added on top.


      **Solution**


      Fuel to decision point: {{= ff / 60 * t_dp}} kg


      Requirement per destination: destination 1 = {{= ff / 60 * (1.05 * t_d1 +
      t_a1)}} kg, destination 2 = {{= ff / 60 * (1.05 * t_d2 + t_a2)}} kg


      {{f: ff / 60 * (t_dp + max(1.05 * t_d1 + t_a1, 1.05 * t_d2 + t_a2)) +
      frf}} = {{n: ff / 60 * (t_dp + max(1.05 * t_d1 + t_a1, 1.05 * t_d2 +
      t_a2)) + frf}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the 5 % contingency fuel.

      - **{{d2}} kg**: forgets the final reserve fuel.

      - **{{d3}} kg**: uses the shorter destination only, which needs less fuel.

      - **{{d4}} kg**: leaves out the alternate fuel.
- id: QXFJ4T6WF
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336975
    - ATPLGS-629418
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      An aircraft is flying a route from position A to B, a distance of {{dist}}
      nautical ground miles (NGM). Given the following information:


      - True Airspeed (TAS): {{tas}} kt

      - Forecast wind: {{wd}}°/{{ws}} kt

      - Course: {{crs}}°(M)

      - Variation: {{var}}°W


      What is the distance covered in nautical air miles (NAM)? (Use the
      headwind/tailwind component of the wind on the true course for the ground
      speed.)
    variables:
      - id: dist
        label: Ground distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: crs
        label: Magnetic course
        unit: °
      - id: var
        label: Westerly variation
        unit: °
    answer:
      formula: dist * tas / (tas - ws * cos(wd - (crs - var)))
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: dist
      - id: d2
        formula: dist * tas / (tas - ws * cos(wd - crs))
      - id: d3
        formula: dist * tas / (tas - ws * cos(wd - (crs + var)))
    presets:
      - id: p1
        values:
          dist: 57
          tas: 145
          wd: 240
          ws: 30
          crs: 205
          var: 15
      - id: p2
        values:
          dist: 80
          tas: 160
          wd: 270
          ws: 40
          crs: 250
          var: 10
      - id: p3
        values:
          dist: 120
          tas: 180
          wd: 200
          ws: 35
          crs: 170
          var: 12
    explanation: >-
      Air distance (NAM) is the distance flown through the air mass, ground
      distance (NGM) is the distance over the ground. They are related by NAM =
      NGM x TAS / GS. The wind is given as a true direction, so the magnetic
      course is first converted to a true course (westerly variation is
      subtracted); the head/tailwind component then gives the ground speed.


      **Solution**


      True course = {{crs}} - {{var}} = {{= crs - var}}°

      Wind angle = {{wd}} - {{= crs - var}} = {{= wd - (crs - var)}}°, headwind
      component = {{ws}} x cos({{= wd - (crs - var)}}°) = {{= ws * cos(wd - (crs
      - var))}} kt

      GS = {{tas}} - {{= ws * cos(wd - (crs - var))}} = {{= tas - ws * cos(wd -
      (crs - var))}} kt

      {{f: dist * tas / (tas - ws * cos(wd - (crs - var)))}} = {{n: dist * tas /
      (tas - ws * cos(wd - (crs - var)))}} = **{{answer}} NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: ignores the wind and takes air distance equal to ground
      distance.

      - **{{d2}} NAM**: uses the magnetic course directly against the true wind
      direction, without applying the variation.

      - **{{d3}} NAM**: applies the variation with the wrong sign (adds westerly
      variation).
