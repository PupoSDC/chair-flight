    - AVEXAM-98846
  annexes: []
  learningObjectives:
    - 033.03.03.04.02
  template:
    type: calculation
    question: |-
      Determine the fuel mass, given:

      - Volume of the fuel: {{vol}} US GAL
      - Specific gravity: {{sg}}
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * sg * 8.34
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: vol * sg * 2.2046
      - id: d2
        formula: vol * sg * 3.785
      - id: d3
        formula: vol * 8.34
    presets:
      - id: p1
        values:
          vol: 590
          sg: 0.75
      - id: p2
        values:
          vol: 320
          sg: 0.78
      - id: p3
        values:
          vol: 1200
          sg: 0.8
    explanation: >-
      Fuel mass is volume times density. One US gallon of water weighs about
      8.34 lb, so the density of fuel in lb per US gallon is its specific
      gravity multiplied by 8.34.


      **Solution**


      {{f: vol * sg * 8.34}} = {{n: vol * sg * 8.34}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: converts with the lb/kg factor 2.2046 instead of the
      water density per US gallon (the volume is not in litres or kg).

      - **{{d2}} lb**: this is the mass in kg (US gallon to litre factor 3.785
      used), not in lb.

      - **{{d3}} lb**: the specific gravity is ignored, so the fuel is treated
      as water.
