- id: QYMETUQO
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338123
    - AVEXAM-5688
  annexes:
    - 033-mrjt-alternate-planning-long-range-cruise-graph
  learningObjectives:
    - 033.03.01.01.08
  template:
    type: chart-calculation
    question: >-
      Refer to annex ECQB-033-230-v2016-05 or CAP 697 figure 4.3.6. An IFR
      Commercial Air Transport flight of 8 hours has two destination alternates,
      ALTN1 and ALTN2. At the destination, the weather is forecast to be above
      the planning minima within ETA +/- 1 hour, two runways are available and
      usable, the ceiling will be 1500 ft and the ground visibility 4 km.


      - Distance to ALTN1: 200 NM, wind 50 kt headwind

      - Distance to ALTN2: 275 NM, wind 25 kt tailwind

      - Landing mass at the alternates: 55.0 t


      The fuel required to each alternate, read from the annex, is:


      - Fuel to ALTN1: {{altn_fuel_1}} kg

      - Fuel to ALTN2: {{altn_fuel_2}} kg


      What is the minimum required alternate fuel?
    variables:
      - id: altn_fuel_1
        label: Fuel to ALTN1 (read from annex)
        unit: kg
      - id: altn_fuel_2
        label: Fuel to ALTN2 (read from annex)
        unit: kg
    chartInputs:
      - altn_fuel_1
      - altn_fuel_2
    answer:
      formula: min(altn_fuel_1, altn_fuel_2)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: max(altn_fuel_1, altn_fuel_2)
      - id: d2
        formula: altn_fuel_1 + altn_fuel_2
      - id: d3
        formula: altn_fuel_2 - 150
      - id: d4
        formula: (altn_fuel_1 + altn_fuel_2) / 2
    presets:
      - id: p1
        values:
          altn_fuel_1: 2350
          altn_fuel_2: 1900
    explanation: >-
      With two destination alternates nominated, the minimum alternate fuel is
      the smaller of the two fuel figures read from the annex. Each figure
      depends on the distance to that alternate, the wind and the landing mass.


      **Solution**


      {{f: min(altn_fuel_1, altn_fuel_2)}} = {{n: min(altn_fuel_1,
      altn_fuel_2)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: takes the larger alternate figure, which carries more
      fuel than the minimum.

      - **{{d2}} kg**: adds both alternate figures together, which is not
      required.

      - **{{d3}} kg**: subtracts an invented 150 kg from the ALTN2 figure, which
      is not part of the calculation.

      - **{{d4}} kg**: averages the two alternate figures instead of taking the
      minimum.
- id: QYPFMJARI
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334079
    - ATPLGS-629441
    - BGS-331293
    - AVEXAM-41816
    - ATPLGS-629366
    - AVEXAM-11135
    - ATPLGS-123190
    - AVEXAM-56877
    - ATPLGS-113473
    - AVEXAM-32193
    - BGS-330907
    - ATPLQ-334549
    - BGS-330906
  annexes: []
  learningObjectives:
    - 033.03.03.01.02
  template:
    type: calculation
    question: >-
      A flight is planned using the Reduced Contingency Fuel (RCF) procedure to
      increase the traffic load. A decision point (DP) is selected along the
      route and an aerodrome R is the optional refuelling destination. An
      En-Route Alternate aerodrome (ERA) for the optional refuel station is NOT
      available. Alternate fuel and Extra Fuel are NOT taken into account.


      Calculate the minimum fuel required from the departure aerodrome to the
      destination, given:


      - Taxi fuel: {{taxi}} kg

      - Final Reserve Fuel: {{frf}} kg

      - Trip fuel to the destination via DP: {{trip}} kg

      - Trip fuel to R via DP: {{trip_r}} kg

      - Trip fuel from DP to the destination: {{trip_dp}} kg
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: frf
        label: Final reserve fuel
        unit: kg
      - id: trip
        label: Trip fuel to destination via DP
        unit: kg
      - id: trip_r
        label: Trip fuel to R via DP
        unit: kg
      - id: trip_dp
        label: Trip fuel DP to destination
        unit: kg
    answer:
      formula: taxi + trip + 0.05 * trip_dp + frf
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip * 1.05 + frf
      - id: d2
        formula: taxi + trip_r * 1.05 + frf
      - id: d3
        formula: taxi + trip + frf
      - id: d4
        formula: taxi + trip + 0.05 * trip_r + frf
    presets:
      - id: p1
        values:
          taxi: 180
          frf: 1300
          trip: 8500
          trip_r: 7800
          trip_dp: 3500
      - id: p2
        values:
          taxi: 160
          frf: 1200
          trip: 7800
          trip_r: 7250
          trip_dp: 3050
      - id: p3
        values:
          taxi: 200
          frf: 1400
          trip: 9200
          trip_r: 8300
          trip_dp: 4100
    explanation: >-
      With the Reduced Contingency Fuel procedure the contingency fuel is 5% of
      the trip fuel from the decision point to the final destination only, not
      of the whole trip. The minimum fuel is then taxi fuel + trip fuel + this
      reduced contingency + final reserve fuel (alternate and extra fuel are
      zero here).


      **Solution**


      Contingency = 5% of {{trip_dp}} = {{= 0.05 * trip_dp}} kg


      {{f: taxi + trip + 0.05 * trip_dp + frf}} = {{n: taxi + trip + 0.05 *
      trip_dp + frf}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: applies 5% contingency to the whole trip fuel instead of
      only the DP to destination portion.

      - **{{d2}} kg**: uses the trip fuel to the optional refuelling destination
      R, with 5% contingency on all of it.

      - **{{d3}} kg**: omits the contingency fuel.

      - **{{d4}} kg**: applies the 5% to the trip fuel to R instead of the DP to
      destination trip fuel.
- id: QYWNIORZ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335402
    - BGS-331458
    - ATPLGS-629331
  annexes: []
  learningObjectives:
    - 033.03.01.01.07
  template:
    type: calculation
    question: >-
      An aircraft is flying a route from position A to B, a distance of {{ngm}}
      Nautical Ground Miles (NGM). Given:


      - True Airspeed (TAS): {{tas}} kt

      - Forecast wind: {{wdir}}°/{{wspd}} kt

      - Course: {{crs}}° (M)

      - Variation: {{varw}}° W


      What is the distance covered in Nautical Air Miles (NAM)? (Round the
      ground speed to the nearest knot first.)
    variables:
      - id: ngm
        label: Ground distance
        unit: NGM
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
      - id: crs
        label: Magnetic course
        unit: °
      - id: varw
        label: Westerly variation
        unit: °
    answer:
      formula: ngm * tas / round(tas * cos(asin(wspd * sin(wdir - crs + varw) / tas))
        - wspd * cos(wdir - crs + varw))
      unit: NAM
      decimals: 1
    distractors:
      - id: d1
        formula: ngm * tas / (tas - wspd * cos(wdir - crs + varw))
      - id: d2
        formula: ngm * tas / (tas + wspd * cos(wdir - crs + varw))
      - id: d3
        formula: ngm * tas / round(tas * cos(asin(wspd * sin(wdir - crs) / tas)) - wspd
          * cos(wdir - crs))
      - id: d4
        formula: ngm
      - id: d5
        formula: ngm * round(tas * cos(asin(wspd * sin(wdir - crs + varw) / tas)) - wspd
          * cos(wdir - crs + varw)) / tas
    presets:
      - id: p1
        values:
          ngm: 57
          tas: 125
          wdir: 240
          wspd: 30
          crs: 205
          varw: 15
      - id: p2
        values:
          ngm: 80
          tas: 140
          wdir: 300
          wspd: 25
          crs: 250
          varw: 10
      - id: p3
        values:
          ngm: 120
          tas: 180
          wdir: 120
          wspd: 40
          crs: 250
          varw: 10
    explanation: >-
      Air distance (NAM) is the distance flown through the air mass. It relates
      to the ground distance by the ratio of TAS to ground speed, so first the
      ground speed must be found from the wind triangle (true course = magnetic
      course - westerly variation, wind given in degrees true).


      **Solution**


      True course = {{= crs - varw}}°; wind angle = {{= wdir - crs + varw}}°

      Wind correction angle = {{= asin(wspd * sin(wdir - crs + varw) / tas)}}°

      Ground speed = {{= tas * cos(asin(wspd * sin(wdir - crs + varw) / tas)) -
      wspd * cos(wdir - crs + varw)}} kt, rounded to {{= round(tas *
      cos(asin(wspd * sin(wdir - crs + varw) / tas)) - wspd * cos(wdir - crs +
      varw))}} kt


      Air distance = NGM * TAS / GS = {{ngm}} * {{tas}} / {{= round(tas *
      cos(asin(wspd * sin(wdir - crs + varw) / tas)) - wspd * cos(wdir - crs +
      varw))}} = **{{answer}} NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: uses only the headwind component as the ground speed
      correction and ignores the wind correction angle.

      - **{{d2}} NAM**: adds the wind component instead of subtracting it.

      - **{{d3}} NAM**: forgets to apply the magnetic variation to the course.

      - **{{d4}} NAM**: gives the ground distance, ignoring the wind.

      - **{{d5}} NAM**: inverts the ratio (GS / TAS).
- id: QYWWWS5SP
  docId: "033.03"
  relatedQuestions:
    - QGSILUKY
  externalIds:
    - ATPLQ-339247
    - AVEXAM-85939
    - AVEXAM-88118
    - BGS-330822
    - AVEXAM-93455
  annexes:
    - 033-long-range-cruise-table-two-engine-jet-aeroplane
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. You are cruising at FL380 with a twin-engined jet
      aeroplane. ATC instructs you to reduce speed to Mach .754. Given:


      Distance to Top-of-Descent: {{dist}} NM

      Aircraft mass: 50 000 kg (constant)

      TAT: -42 °C

      Average wind component: {{tw}} kt tailwind


      The TAS ({{tas}} kt) and total fuel flow ({{ff}} kg/h) at this Mach number
      are read from the figure. What fuel will you use for the remainder of the
      cruise?
    variables:
      - id: dist
        label: Distance to top of descent
        unit: NM
      - id: tw
        label: Tailwind component
        unit: kt
      - id: tas
        label: TAS read from the figure
        unit: kt
      - id: ff
        label: Fuel flow read from the figure
        unit: kg/h
    chartInputs:
      - tas
      - ff
    answer:
      formula: dist / (tas + tw) * ff
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (tas - tw) * ff
      - id: d2
        formula: dist / tas * ff
      - id: d3
        formula: dist / (tas + tw) * ff * 1.06
      - id: d4
        formula: dist / (tas + tw + 10) * ff
    presets:
      - id: p1
        values:
          dist: 220
          tw: 45
          tas: 440
          ff: 1845
      - id: p2
        values:
          dist: 180
          tw: 30
          tas: 440
          ff: 1850
    explanation: >-
      Ground speed is TAS plus the tailwind component. The time to the top of
      descent is distance divided by ground speed, and the fuel is that time
      multiplied by the fuel flow from the chart.


      **Solution**


      Ground speed: {{= tas + tw}} kt


      {{f: dist / (tas + tw) * ff}} = {{n: dist / (tas + tw) * ff}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: tailwind subtracted instead of added.

      - **{{d2}} kg**: wind ignored (ground speed = TAS).

      - **{{d3}} kg**: fuel flow read about 6 % too high.

      - **{{d4}} kg**: ground speed taken 10 kt too high.
