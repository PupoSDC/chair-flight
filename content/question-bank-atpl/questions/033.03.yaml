    - AVEXAM-67645
    - ATPLGS-113886
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Assuming an average fuel flow of {{fuel_flow}} kg/h,
      complete the fuel log and determine the block fuel required by a jet
      aircraft to perform the Commercial Air Transport flight.


      - Trip time (read from figure): {{flight_hours}} h

      - Other fuel items in the fuel log (read from figure): {{other_fuel}} kg


      What is the block fuel required, in kg?
    variables:
      - id: fuel_flow
        label: Average fuel flow
        unit: kg/h
      - id: flight_hours
        label: Trip time (read from figure)
        unit: h
      - id: other_fuel
        label: Other fuel items (read from figure)
        unit: kg
    chartInputs:
      - flight_hours
      - other_fuel
    answer:
      formula: flight_hours * fuel_flow + other_fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: flight_hours * fuel_flow
      - id: d2
        formula: other_fuel
      - id: d3
        formula: (flight_hours + 1) * fuel_flow + other_fuel
      - id: d4
        formula: flight_hours * fuel_flow - other_fuel
    presets:
      - id: p1
        values:
          fuel_flow: 2790
          flight_hours: 1.5
          other_fuel: 835
      - id: p2
        values:
          fuel_flow: 2600
          flight_hours: 2
          other_fuel: 900
    explanation: >-
      The block fuel is the total fuel loaded before engine start. It is the
      trip fuel plus the other fuel items listed in the fuel log. The trip fuel
      is the average fuel flow multiplied by the trip time.


      **Solution**


      - Trip fuel: {{n: flight_hours * fuel_flow}} = {{= flight_hours *
      fuel_flow}} kg

      - Block fuel: {{f: flight_hours * fuel_flow + other_fuel}} = {{n:
      flight_hours * fuel_flow + other_fuel}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the other fuel items in the log.

      - **{{d2}} kg**: keeps only the other fuel items and forgets the trip
      fuel.

      - **{{d3}} kg**: adds an extra hour of flying to the trip time.

      - **{{d4}} kg**: subtracts the other fuel items instead of adding them.
- id: QRJ5EMFQI
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338634
    - ATPLGS-629487
    - BGS-331328
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Determine the remaining endurance of the aircraft in hours (ignoring any
      reserve fuel), given: an aircraft is on a taxi flight, and the fuel gauge
      is showing {{pct}}% of fuel left in the tank.


      - Total fuel capacity: {{cap}} l

      - Fuel consumption: {{cons}} l/h
    variables:
      - id: pct
        label: Fuel left
        unit: "%"
      - id: cap
        label: Total fuel capacity
        unit: l
      - id: cons
        label: Fuel consumption
        unit: l/h
    answer:
      formula: pct / 100 * cap / cons
      unit: h
      decimals: 2
    distractors:
      - id: d1
        formula: cap / cons
      - id: d2
        formula: (100 - pct) / 100 * cap / cons
      - id: d3
        formula: pct * cap / cons / 10
      - id: d4
        formula: pct / 100 * cons / cap
    presets:
      - id: p1
        values:
          pct: 41
          cap: 514
          cons: 190
      - id: p2
        values:
          pct: 35
          cap: 400
          cons: 150
      - id: p3
        values:
          pct: 60
          cap: 300
          cons: 90
    explanation: >-
      The remaining endurance is the fuel left in the tank divided by the fuel
      consumption. The fuel left is the gauge fraction of the total capacity.


      **Solution**


      Fuel left = {{pct}}% of {{cap}} l = {{= pct / 100 * cap}} l


      {{f: pct / 100 * cap / cons}} = {{n: pct / 100 * cap / cons}} =
      **{{answer}} h**


      **Why the other answers are wrong**


      - **{{d1}} h**: uses the full tank instead of the fuel left.

      - **{{d2}} h**: uses the fraction of fuel already used (100% minus the
      gauge reading) instead of the fuel left.

      - **{{d3}} h**: misplaces the decimal point when converting the percentage
      (factor of 10).

      - **{{d4}} h**: inverts the ratio of consumption to capacity.
