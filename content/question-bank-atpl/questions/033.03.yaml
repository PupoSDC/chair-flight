  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      You are planning to fly from A to B applying the decision point procedure;
      your trip time is computed to be 5 h.


      Assume you move the decision point from C to D.


      The figure shows that the trip time used for the required fuel is reduced
      by {{dt}} min.


      With a fuel burn of {{ff}} kg/h, by how much does the required fuel
      decrease?
    variables:
      - id: ff
        label: Fuel burn
        unit: kg/h
      - id: dt
        label: Reduction in trip time (from figure)
        unit: min
    chartInputs:
      - dt
    answer:
      formula: ff * dt / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * dt / 30
      - id: d2
        formula: ff * dt / 120
      - id: d3
        formula: ff * dt / 100
      - id: d4
        formula: ff * dt
    presets:
      - id: p1
        values:
          ff: 2000
          dt: 1.5
      - id: p2
        values:
          ff: 2400
          dt: 2
      - id: p3
        values:
          ff: 1800
          dt: 2.5
    explanation: >-
      The change in required fuel equals the fuel flow multiplied by the change
      in trip time used for the calculation (converted to hours).


      **Solution**


      {{f: ff * dt / 60}} = {{n: ff * dt / 60}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the time was divided by 30 instead of 60.

      - **{{d2}} kg**: the time was divided by 120 instead of 60.

      - **{{d3}} kg**: the minutes were divided by 100 instead of 60.

      - **{{d4}} kg**: the minutes were not converted to hours.
