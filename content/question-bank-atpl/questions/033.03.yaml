    - ATPLQ-333255
  annexes:
    - 033-piston-engine-power-setting-table
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      A flight has to be made with a multi-engine piston aeroplane MEP 1 (use
      the Flight Planning Manual MEP 1 fuel flow figure).


      For the fuel calculation take {{taxi}} US gallons for taxi and an
      additional {{extra}} minutes at cruise condition to account for climb and
      descent.


      The calculated time from overhead to overhead is {{h}} h {{m}} min.


      The reserve fuel is 30% of the trip fuel.


      The fuel flow read from the figure for the given power setting, altitude
      and temperature is {{ff}} US gal/h.


      Find the minimum block fuel.
    variables:
      - id: taxi
        label: Taxi fuel
        unit: US gal
      - id: extra
        label: Climb/descent allowance
        unit: min
      - id: h
        label: Flight time hours
        unit: h
      - id: m
        label: Flight time minutes
        unit: min
      - id: ff
        label: Fuel flow read from the figure
        unit: US gal/h
    chartInputs:
      - ff
    answer:
      formula: taxi + 1.3 * ff * (h + (m + extra) / 60)
      unit: US gal
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + ff * (h + (m + extra) / 60)
      - id: d2
        formula: taxi + 1.3 * ff * (h + m / 60)
      - id: d3
        formula: 1.3 * ff * (h + (m + extra) / 60)
      - id: d4
        formula: taxi + 1.03 * ff * (h + (m + extra) / 60)
      - id: d5
        formula: 1.3 * (taxi + ff * (h + (m + extra) / 60))
    presets:
      - id: p1
        values:
          taxi: 5
          extra: 13
          h: 2
          m: 37
          ff: 23.3
      - id: p2
        values:
          taxi: 5
          extra: 13
          h: 1
          m: 47
          ff: 16.2
      - id: p3
        values:
          taxi: 5
          extra: 13
          h: 3
          m: 10
          ff: 20
    explanation: >-
      Block fuel = taxi fuel + trip fuel + reserve fuel. The trip fuel is the
      fuel flow (read from the figure) multiplied by the flight time plus the
      climb/descent allowance; the reserve is 30 % of the trip fuel.


      **Solution**


      Trip time = {{h}} h {{m}} min + {{extra}} min = {{= h + (m + extra) / 60}}
      h

      Trip fuel = {{ff}} * {{= h + (m + extra) / 60}} = {{= ff * (h + (m +
      extra) / 60)}} US gal

      Reserve fuel = 30 % = {{= 0.3 * ff * (h + (m + extra) / 60)}} US gal


      {{f: taxi + 1.3 * ff * (h + (m + extra) / 60)}} = {{n: taxi + 1.3 * ff *
      (h + (m + extra) / 60)}} = **{{answer}} US gal**


      **Why the other answers are wrong**


      - **{{d1}} US gal**: forgets the 30 % reserve.

      - **{{d2}} US gal**: forgets the climb and descent allowance.

      - **{{d3}} US gal**: forgets the taxi fuel.

      - **{{d4}} US gal**: uses 3 % instead of 30 % for the reserve.

      - **{{d5}} US gal**: also applies the 30 % reserve to the taxi fuel.
- id: QJRPK3P9N
  docId: "033.03"
  relatedQuestions:
    - QE9IBOZG8
  externalIds:
    - ATPLQ-338105
    - ATPLGS-107907
    - ATPLGS-107935
    - BGS-330231
    - AVEXAM-57673
    - ATPLGS-107895
    - ATPLGS-107897
  annexes:
    - 033-data-sheet-lrjt-1-flight-planning-from-brake-release-to
    - 033-jar-fcl-flight-planning-quick-determination-of-flight-plan
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (annex 033-036 and 033-038). Assuming the following
      data:


      Ground distance to be covered: {{distance}} NM

      Cruise flight level FL 310, ISA +15°C, CG 37%, total anti-ice ON, pack
      flow HI, planned destination landing mass 140 000 kg.


      - True airspeed: {{tas}} kt (Mach 0.82)

      - Head wind component: {{headwind}} kt


      The fuel flow read from the figure for these conditions is {{flow}} kg/h.
      Calculate the fuel consumption for the flight in kg.
    variables:
      - id: distance
        label: Ground distance
        unit: NM
      - id: tas
        label: True airspeed
        unit: kt
      - id: headwind
        label: Headwind component
        unit: kt
      - id: flow
        label: Fuel flow (read from the figure)
        unit: kg/h
    chartInputs:
      - flow
    answer:
      formula: flow * distance / (tas - headwind)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: flow * distance / (tas + headwind)
      - id: d2
        formula: flow * distance / tas
      - id: d3
        formula: flow * distance / (tas - headwind) * 0.9
      - id: d4
        formula: flow * distance / (tas - headwind) + distance
    presets:
      - id: p1
        values:
          distance: 1500
          tas: 470
          headwind: 40
          flow: 6736.67
    explanation: >-
      With a headwind the groundspeed is the TAS minus the headwind component.
      The trip time is the distance divided by the groundspeed, and the fuel
      consumption is the fuel flow read from the figure multiplied by the trip
      time.


      **Solution**


      Groundspeed = {{= tas - headwind}} kt


      {{f: flow * distance / (tas - headwind)}} = {{n: flow * distance / (tas -
      headwind)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the headwind instead of subtracting it.

      - **{{d2}} kg**: ignores the wind completely.

      - **{{d3}} kg**: applies an arbitrary 10 % reduction to the correct
      result.

      - **{{d4}} kg**: adds the ground distance to the result instead of using
      it only in the trip time.
