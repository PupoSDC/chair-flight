        label: Fuel flow at economic cruise (read from figure)
        unit: US gal/h
      - id: range_per_gal
        label: Range per US gallon (read from figure)
        unit: NM/US gal
    chartInputs:
      - fuel_flow
      - range_per_gal
    answer:
      formula: (usable - fuel_flow * 0.75) * range_per_gal
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: usable * range_per_gal
      - id: d2
        formula: (usable - fuel_flow) * range_per_gal
      - id: d3
        formula: (usable - fuel_flow * 0.45) * range_per_gal
      - id: d4
        formula: (usable - fuel_flow * 0.75) * range_per_gal / 1.852
    presets:
      - id: p1
        values:
          usable: 123
          fuel_flow: 8
          range_per_gal: 6.43
      - id: p2
        values:
          usable: 100
          fuel_flow: 10
          range_per_gal: 5.9
    explanation: >-
      An aeroplane cannot use all of its fuel for range: the pilot keeps reserve
      fuel for 45 minutes. First take the reserve fuel out of the usable fuel,
      then multiply the remaining fuel by the range per gallon read from the
      figure at this power and altitude.


      **Solution**


      - Reserve fuel: {{n: fuel_flow * 0.75}} = {{= fuel_flow * 0.75}} US
      gallons

      - Fuel for the trip: {{n: usable - fuel_flow * 0.75}} = {{= usable -
      fuel_flow * 0.75}} US gallons

      - Range: {{f: (usable - fuel_flow * 0.75) * range_per_gal}} = {{n: (usable
      - fuel_flow * 0.75) * range_per_gal}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses all the usable fuel and ignores the reserve.

      - **{{d2}} NM**: subtracts one hour of fuel flow instead of 45 minutes.

      - **{{d3}} NM**: reads 45 minutes as 0.45 hours instead of 0.75 hours.

      - **{{d4}} NM**: divides by 1.852 although no unit conversion is needed.
