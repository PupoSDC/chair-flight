          sg: 0.79
    explanation: >-
      Fuel mass is volume times density. One Imperial gallon of water weighs 10
      lb, so fuel weighs its specific gravity times 10 lb per Imperial gallon.


      **Solution**


      {{f: vol * sg * 10}} = {{n: vol * sg * 10}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the specific gravity is ignored (fuel treated as water).

      - **{{d2}} lb**: uses the US gallon water weight of 8.34 lb instead of 10
      lb per Imperial gallon.

      - **{{d3}} lb**: divides by the specific gravity instead of multiplying.
