    - AVEXAM-56877
    - AVEXAM-21612
    - ATPLGS-113473
    - BGS-330906
    - BGS-330907
    - BGS-331023
  annexes: []
  learningObjectives:
    - 033.03.03.01.02
  template:
    type: calculation
    question: >-
      A twin-engined turbojet is being operated for a Commercial Air Transport
      flight. The Reduced Contingency Fuel (RCF) procedure is being applied.
      Given the following information, find the minimum required Contingency
      Fuel.


      Route: from DEP to original destination A via decision point DP with
      optional refuel destination B.


      - Trip Fuel DEP-A via DP: {{trip_a}} kg

      - Trip Fuel DEP-B via DP: {{trip_b}} kg

      - Fuel DP-A: {{dp_a}} kg
    variables:
      - id: trip_a
        label: Trip fuel DEP-A via DP
        unit: kg
      - id: trip_b
        label: Trip fuel DEP-B via DP
        unit: kg
      - id: dp_a
        label: Fuel DP-A
        unit: kg
    answer:
      formula: 0.05 * dp_a
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 0.05 * trip_a
      - id: d2
        formula: 0.05 * trip_b
      - id: d3
        formula: 0.05 * (trip_a - dp_a)
    presets:
      - id: p1
        values:
          trip_a: 5000
          trip_b: 4000
          dp_a: 2000
      - id: p2
        values:
          trip_a: 8000
          trip_b: 6000
          dp_a: 3000
      - id: p3
        values:
          trip_a: 9000
          trip_b: 7000
          dp_a: 4000
    explanation: >-
      With the Reduced Contingency Fuel procedure the contingency fuel is 5% of
      the trip fuel from the decision point (DP) to the original destination
      only.


      **Solution**


      {{f: 0.05 * dp_a}} = {{n: 0.05 * dp_a}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: takes 5% of the whole trip fuel to A.

      - **{{d2}} kg**: takes 5% of the trip fuel to the optional refuel
      destination B.

      - **{{d3}} kg**: takes 5% of the fuel from departure to the DP instead of
      from the DP to A.
