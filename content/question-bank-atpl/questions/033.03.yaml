  template:
    type: chart-calculation
    question: >-
      Refer to the charts (annexes 033-056, 033-049 and 033-050). Knowing that:
      mass at brake release {{mass}} kg, selected cruise speed 0.82 Mach, flight
      leg distance 3 000 NM, cruise level optimum, air conditioning standard,
      anti-icing OFF, temperature ISA, CG 37%. Zero wind.


      The trip fuel read from the charts is {{trip}} kg. What is the planned
      landing mass at destination (kg)?
    variables:
      - id: mass
        label: Mass at brake release
        unit: kg
      - id: trip
        label: Trip fuel (read from charts)
        unit: kg
    chartInputs:
      - trip
    answer:
      formula: mass - trip
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mass + trip
      - id: d2
        formula: trip
      - id: d3
        formula: mass - 2 * trip
      - id: d4
        formula: mass - trip * 0.9
    presets:
      - id: p1
        values:
          mass: 210000
          trip: 37700
      - id: p2
        values:
          mass: 190000
          trip: 33500
      - id: p3
        values:
          mass: 230000
          trip: 41200
    explanation: >-
      The landing mass is the mass at brake release minus the fuel burned during
      the trip (taken from the charts).


      **Solution**


      {{f: mass - trip}} = {{n: mass - trip}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: The trip fuel was added instead of subtracted.

      - **{{d2}} kg**: This is the trip fuel itself, not the landing mass.

      - **{{d3}} kg**: The trip fuel was subtracted twice.

      - **{{d4}} kg**: The trip fuel was read about 10% too low from the charts.
- id: QSBOAYSK
  docId: "033.03"
