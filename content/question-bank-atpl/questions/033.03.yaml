  template:
    type: calculation
    question: You refuel with {{vol}} US gallons. What is the mass in lb with a
      specific gravity of {{sg}}? (1 US gal = 3.785 l, 1 kg = 2.2046 lb)
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * 3.785 * sg * 2.2046
      unit: lb
      decimals: 1
    distractors:
      - id: d1
        formula: vol * 3.785 * sg
      - id: d2
        formula: vol * 4.546 * sg * 2.2046
      - id: d3
        formula: vol * sg
      - id: d4
        formula: vol * sg * 2.2046
      - id: d5
        formula: vol * 3.785 * 2.2046
    presets:
      - id: p1
        values:
          vol: 150
          sg: 0.75
      - id: p2
        values:
          vol: 200
          sg: 0.8
      - id: p3
        values:
          vol: 120
          sg: 0.78
    explanation: >-
      Convert the volume to litres, multiply by the specific gravity (kg per
      litre) to get kilograms, then convert kilograms to pounds.


      **Solution**


      {{f: vol * 3.785 * sg * 2.2046}} = {{n: vol * 3.785 * sg * 2.2046}} =
      **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: this is the mass in kg; the conversion to lb is missing.

      - **{{d2}} lb**: IMP gallons (4.546 l) are used instead of US gallons.

      - **{{d3}} lb**: gallons are multiplied by specific gravity only.

      - **{{d4}} lb**: the litre conversion is missing.

      - **{{d5}} lb**: the specific gravity is forgotten.
- id: QSCOKZMR
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333039
    - ATPLGS-123257
    - ATPLGS-622527
    - ATPLGS-622528
    - ATPLGS-622529
    - AVEXAM-79143
    - BGS-330323
    - BGS-330324
    - BGS-331048
    - BGS-331478
  annexes:
    - 033-fuel-price-ratio-graph
  learningObjectives:
    - 033.03.02.03.08
  template:
    type: calculation
    question: >-
      You are planning a trip from London Heathrow to St John's, Newfoundland
      and return. Fuel at St John's is much more expensive, so you want to
      tanker fuel. What is the maximum extra fuel the aircraft can carry? Assume
      a departure/destination fuel price ratio of 0.915.


      - MTOM: {{mtom}} kg

      - MLM: {{mlm}} kg

      - Planned TOM: {{tom}} kg

      - Fuel tank capacity: {{tank}} kg

      - Planned take-off fuel: {{tof}} kg

      - Planned trip fuel: {{trip}} kg
    variables:
      - id: mtom
        label: MTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: tom
        label: Planned TOM
        unit: kg
      - id: tank
        label: Tank capacity
        unit: kg
      - id: tof
        label: Planned take-off fuel
        unit: kg
      - id: trip
        label: Planned trip fuel
        unit: kg
    answer:
      formula: min(mtom - tom, mlm - (tom - trip), tank - tof)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mtom - tom
      - id: d2
        formula: tank - tof
      - id: d3
        formula: mlm - tom + trip + tof
      - id: d4
        formula: mtom - tom + tank - tof
    presets:
      - id: p1
        values:
          mtom: 205000
          mlm: 175000
          tom: 185000
          tank: 40000
          tof: 30000
          trip: 18000
      - id: p2
        values:
          mtom: 200000
          mlm: 170000
          tom: 180000
          tank: 35000
          tof: 25000
          trip: 14000
    explanation: >-
      Extra fuel is limited by three things: the maximum take-off mass, the
      maximum landing mass (extra fuel is not burned on the way, so it adds to
      the landing mass) and the tank capacity. The smallest margin governs.


      **Solution**


      MTOM limit: {{= mtom - tom}} kg


      Landing mass = {{= tom - trip}} kg, so MLM limit: {{= mlm - (tom - trip)}}
      kg


      Tank limit: {{= tank - tof}} kg


      {{f: min(mtom - tom, mlm - (tom - trip), tank - tof)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the MTOM margin is considered.

      - **{{d2}} kg**: only the tank capacity margin is considered.

      - **{{d3}} kg**: the planned landing mass is calculated with the wrong
      sign and fuel terms.

      - **{{d4}} kg**: the margins are added instead of taking the smallest.
