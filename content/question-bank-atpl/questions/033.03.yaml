- id: QIFJJKNJ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338741
    - AVEXAM-24655
    - BGS-330826
    - ATPLGS-113520
  annexes: []
  learningObjectives:
    - 033.03.02.01.01
  template:
    type: calculation
    question: >-
      Given the following data for the pre-flight calculations, determine the
      minimum taxi fuel (kg) required for a Commercial Air Transport flight with
      a Performance Class A aeroplane. Assume the Basic Fuel Scheme WITHOUT
      variations applies.


      - Fuel for engine start: {{start_fuel}} kg

      - Taxi time at departure aerodrome: {{taxi_dep}} min

      - Taxi time at destination aerodrome: {{taxi_dest}} min

      - Taxi fuel consumption: {{taxi_cons}} kg/min

      - APU time at departure aerodrome: {{apu_dep}} min

      - APU time at destination aerodrome: {{apu_dest}} min

      - APU fuel consumption: {{apu_cons}} kg/h

      - Minimum taxi fuel by company regulation: {{min_taxi}} kg
    variables:
      - id: start_fuel
        label: Engine start fuel
        unit: kg
      - id: taxi_dep
        label: Taxi time at departure
        unit: min
      - id: taxi_dest
        label: Taxi time at destination
        unit: min
      - id: taxi_cons
        label: Taxi fuel consumption
        unit: kg/min
      - id: apu_dep
        label: APU time at departure
        unit: min
      - id: apu_dest
        label: APU time at destination
        unit: min
      - id: apu_cons
        label: APU fuel consumption
        unit: kg/h
      - id: min_taxi
        label: Company minimum taxi fuel
        unit: kg
    answer:
      formula: max(start_fuel + taxi_dep * taxi_cons + apu_dep * apu_cons / 60,
        min_taxi)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: start_fuel + (taxi_dep + taxi_dest) * taxi_cons + apu_dep * apu_cons /
          60
      - id: d2
        formula: taxi_dep * taxi_cons + apu_dep * apu_cons / 60
      - id: d3
        formula: min_taxi
      - id: d4
        formula: start_fuel + taxi_dep * taxi_cons + apu_dep * apu_cons
    presets:
      - id: p1
        values:
          start_fuel: 150
          taxi_dep: 10
          taxi_dest: 12
          taxi_cons: 60
          apu_dep: 20
          apu_dest: 15
          apu_cons: 840
          min_taxi: 900
      - id: p2
        values:
          start_fuel: 120
          taxi_dep: 8
          taxi_dest: 10
          taxi_cons: 50
          apu_dep: 15
          apu_dest: 12
          apu_cons: 900
          min_taxi: 700
    explanation: >-
      Under the Basic Fuel Scheme, taxi fuel is the fuel for engine start, plus
      the fuel burned while taxiing at the departure aerodrome, plus the fuel
      burned by the APU at the departure aerodrome. Taxi and APU times at the
      destination are not included. The result may not be lower than the company
      minimum.


      **Solution**


      Calculated taxi fuel: {{f: start_fuel + taxi_dep * taxi_cons + apu_dep *
      apu_cons / 60}} = {{n: start_fuel + taxi_dep * taxi_cons + apu_dep *
      apu_cons / 60}} kg


      Company minimum: {{min_taxi}} kg. The larger value applies: **{{answer}}
      kg**


      **Why the other answers are wrong**

      - **{{d1}} kg**: includes the taxi time at the destination, which is not
      part of the taxi fuel.

      - **{{d2}} kg**: forgets the engine start fuel.

      - **{{d3}} kg**: uses only the company minimum and ignores the calculated
      value.

      - **{{d4}} kg**: uses the APU fuel flow per hour as if it were per minute
      (unit mistake).
