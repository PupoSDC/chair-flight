  template:
    type: calculation
    question: You refuel with {{vol}} IMP gallons. What is the mass in kg with a
      specific gravity of {{sg}}? (1 IMP gal = 4.546 l)
    variables:
      - id: vol
        label: Fuel volume
        unit: IMP gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * 4.546 * sg
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: vol
      - id: d2
        formula: vol * sg
      - id: d3
        formula: vol * 3.785 * sg
      - id: d4
        formula: vol * 4.546
      - id: d5
        formula: vol * 4.546 * sg * 2.2046
    presets:
      - id: p1
        values:
          vol: 220
          sg: 0.82
      - id: p2
        values:
          vol: 300
          sg: 0.78
      - id: p3
        values:
          vol: 150
          sg: 0.8
    explanation: >-
      Convert the volume to litres and multiply by the specific gravity (kg per
      litre).


      **Solution**


      {{f: vol * 4.546 * sg}} = {{n: vol * 4.546 * sg}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the volume figure is taken as the mass.

      - **{{d2}} kg**: the gallons are multiplied by the specific gravity
      without converting to litres.

      - **{{d3}} kg**: US gallons (3.785 l) are used instead of IMP gallons.

      - **{{d4}} kg**: the specific gravity is forgotten (mass of water).

      - **{{d5}} kg**: the result is converted to lb although kg are asked.
