        label: Average fuel flow
        unit: kg/h
      - id: hold
        label: Holding fuel flow
        unit: kg/h
    answer:
      formula: ff * tt / 60 + max(0.03 * ff * tt / 60, hold * 5 / 60) + ff * ta / 60 +
        0.5 * hold
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * tt / 60 * 1.05 + ff * ta / 60 + 0.5 * hold
      - id: d2
        formula: ff * tt / 60 + max(0.03 * ff * tt / 60, hold * 5 / 60) + 0.5 * hold
      - id: d3
        formula: ff * tt / 60 + max(0.03 * ff * tt / 60, hold * 5 / 60) + hold * ta / 60
          + 0.5 * hold
      - id: d4
        formula: ff * tt / 60 + max(0.03 * ff * tt / 60, hold * 5 / 60) + ff * ta / 60 +
          0.75 * hold
      - id: d5
        formula: ff * tt / 60 + max(0.03 * ff * tt / 60, hold * 5 / 60) + ff * ta / 60 +
          0.5 * ff
    presets:
      - id: p1
        values:
          tt: 237
          ta: 20
          ff: 2856
          hold: 2600
      - id: p2
        values:
          tt: 185
          ta: 25
          ff: 2700
          hold: 2500
      - id: p3
        values:
          tt: 90
          ta: 15
          ff: 2900
          hold: 2700
    explanation: >-
      Take-off fuel = trip fuel + contingency fuel + alternate fuel + final
      reserve. With a nominated en-route alternate the contingency fuel is 3 %
      of the trip fuel, but not less than 5 minutes at holding fuel flow. The
      final reserve is 30 minutes at holding fuel flow for a jet.


      **Solution**


      Trip fuel = {{ff}} * {{tt}} / 60 = {{= ff * tt / 60}} kg

      Contingency = max(3 % = {{= 0.03 * ff * tt / 60}} kg; 5 min = {{= hold * 5
      / 60}} kg) = {{= max(0.03 * ff * tt / 60, hold * 5 / 60)}} kg

      Alternate fuel = {{= ff * ta / 60}} kg

      Final reserve = {{= 0.5 * hold}} kg


      Total = {{= ff * tt / 60 + max(0.03 * ff * tt / 60, hold * 5 / 60) + ff *
      ta / 60 + 0.5 * hold}} kg = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the 5 % contingency instead of the 3 % applicable
      with an en-route alternate.

      - **{{d2}} kg**: omits the alternate fuel.

      - **{{d3}} kg**: calculates the alternate fuel with the holding fuel flow
      instead of the average fuel flow.

      - **{{d4}} kg**: uses a 45 minute final reserve, which is the
      piston-engine value.

      - **{{d5}} kg**: calculates the final reserve with the average fuel flow
      instead of the holding fuel flow.
- id: QSFYCMGKZ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335629
    - BGS-330986
    - ATPLGS-625235
    - BGS-330972
    - AVEXAM-69043
    - ATPLGS-625232
    - AVEXAM-24553
    - BGS-331454
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Given the following information, calculate the change in planned Trip Fuel
      when applying the updated meteorological conditions. Round up the
      calculation to the next full kilogram.


      - Trip distance: {{dist}} NAM

      - Planned TAS: {{tas}} kt

      - Change TAS: {{dtas}} kt for every 1° C change in OAT

      - Planned average trip fuel consumption: {{cons}} kg/NAM

      - Change of Trip Fuel required: {{pct}}% increase for every 10° C increase
      in OAT

      - Revised OAT: {{doat}}° C above planned OAT


      The trip fuel will increase by how many kg?
    variables:
      - id: dist
        label: Trip distance
        unit: NAM
      - id: tas
        label: Planned TAS
        unit: kt
      - id: dtas
        label: TAS change per °C
        unit: kt
      - id: cons
        label: Planned fuel consumption
        unit: kg/NAM
      - id: pct
        label: Fuel increase per 10° C
        unit: "%"
      - id: doat
        label: OAT increase
        unit: ° C
    answer:
      formula: ceil(dist * cons * pct / 100 * doat / 10)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(dist * cons * pct / 100 * doat)
      - id: d2
        formula: ceil(dist * cons * (1 - tas / (tas + dtas * doat)))
      - id: d3
        formula: ceil(dist * cons * (1 - tas / (tas + dtas * doat) * (1 + pct / 100 *
          doat / 10)))
    presets:
      - id: p1
        values:
          dist: 150
          tas: 150
          dtas: 1
          cons: 3
          pct: 0.5
          doat: 10
      - id: p2
        values:
          dist: 200
          tas: 160
          dtas: 1
          cons: 4
          pct: 0.5
          doat: 10
      - id: p3
        values:
          dist: 300
          tas: 200
          dtas: 1
          cons: 5
          pct: 0.5
          doat: 20
    explanation: >-
      The planned trip fuel is the distance in NAM times the fuel consumption
      per NAM. A change in TAS only changes the flight time for a given air
      distance; the fuel per NAM stays the same, so the only change comes from
      the stated percentage increase with OAT.


      **Solution**


      Planned trip fuel = {{dist}} × {{cons}} = {{= dist * cons}} kg

      Increase = {{= dist * cons}} × {{pct}}% × ({{doat}} / 10) = {{= dist *
      cons * pct / 100 * doat / 10}} kg, rounded up to the next full kilogram.


      {{f: ceil(dist * cons * pct / 100 * doat / 10)}} = **{{answer}} kg
      increase**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the percentage is applied once per degree instead of once
      per 10° C (an increase ten times too large).

      - **{{d2}} kg**: only the TAS effect is considered, as a decrease of fuel
      in proportion to the higher TAS; the fuel per NAM does not change with
      TAS.

      - **{{d3}} kg**: the TAS effect and the percentage increase are combined;
      the TAS effect should not be applied.
