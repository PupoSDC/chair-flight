- id: QMSVAJLV
  docId: "033.03"
  relatedQuestions:
    - QNBTJBJKD
  externalIds:
    - ATPLQ-333976
    - ATPLGS-626261
    - AVEXAM-29489
    - AVEXAM-89284
    - ATPLGS-626262
    - BGS-331466
    - ATPLGS-113517
  annexes: []
  learningObjectives:
    - 033.03.02.01.01
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the required fuel for take-off
      for an IFR flight with a turbine engine jet aircraft? Assume the Basic
      Fuel Scheme WITHOUT variations applies.


      - Taxi fuel (with APU usage included): {{taxi}} lb

      - Climb fuel: {{climb}} lb

      - Cruise distance: {{cruise_dist}} NAM

      - Cruise fuel consumption: {{cruise_rate}} lb/NAM

      - Descent fuel: {{descent}} lb

      - Approach and landing fuel: {{approach}} lb

      - Alternate fuel: {{alt}} lb

      - Contingency fuel: {{cont}} % of trip fuel

      - Final reserve fuel: {{reserve_rate}} lb/h (30 minutes)

      - Fuel for missed approach at alternate: {{missed}} lb


      Extra fuel: 0 lb

      Discretionary fuel: 0 lb


      Give the answer in lb.
    variables:
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: climb
        label: Climb fuel
        unit: lb
      - id: cruise_dist
        label: Cruise distance
        unit: NAM
      - id: cruise_rate
        label: Cruise fuel consumption
        unit: lb/NAM
      - id: descent
        label: Descent fuel
        unit: lb
      - id: approach
        label: Approach and landing fuel
        unit: lb
      - id: alt
        label: Alternate fuel
        unit: lb
      - id: cont
        label: Contingency
        unit: "%"
      - id: reserve_rate
        label: Final reserve fuel rate
        unit: lb/h
      - id: missed
        label: Missed approach fuel at alternate
        unit: lb
    answer:
      formula: (climb + cruise_dist * cruise_rate + descent + approach) * (1 + cont /
        100) + alt + reserve_rate * 0.5
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: climb + cruise_dist * cruise_rate + descent + approach
      - id: d2
        formula: (climb + cruise_dist * cruise_rate + descent + approach) * (1 + cont /
          100) + alt
      - id: d3
        formula: (climb + cruise_dist * cruise_rate + descent + approach) * (1 + cont /
          100) + alt + reserve_rate
      - id: d4
        formula: (climb + cruise_dist * cruise_rate + descent + approach) * (1 + cont /
          100) + alt + reserve_rate * 0.5 + missed
    presets:
      - id: p1
        values:
          taxi: 50
          climb: 300
          cruise_dist: 847
          cruise_rate: 6
          descent: 200
          approach: 250
          alt: 650
          cont: 5
          reserve_rate: 2150
          missed: 450
      - id: p2
        values:
          taxi: 60
          climb: 250
          cruise_dist: 610
          cruise_rate: 5.5
          descent: 180
          approach: 200
          alt: 500
          cont: 5
          reserve_rate: 2000
          missed: 400
    explanation: >-
      The take-off fuel under the Basic Fuel Scheme is the trip fuel (climb,
      cruise, descent, approach and landing; taxi fuel is not part of the trip
      fuel) plus the contingency fuel (5 % of trip fuel) plus the alternate fuel
      plus the final reserve fuel, which is 30 minutes at the final reserve
      rate. The fuel for a missed approach at the alternate is not part of the
      basic scheme total.


      **Solution**


      Trip fuel = {{= climb + cruise_dist * cruise_rate + descent + approach}}
      lb


      Contingency = {{= (climb + cruise_dist * cruise_rate + descent + approach)
      * cont / 100}} lb


      Final reserve (30 min) = {{= reserve_rate * 0.5}} lb


      {{f: (climb + cruise_dist * cruise_rate + descent + approach) * (1 + cont
      / 100) + alt + reserve_rate * 0.5}} = {{n: (climb + cruise_dist *
      cruise_rate + descent + approach) * (1 + cont / 100) + alt + reserve_rate
      * 0.5}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: trip fuel only.

      - **{{d2}} lb**: forgets the final reserve.

      - **{{d3}} lb**: uses the reserve rate for one hour instead of 30 minutes.

      - **{{d4}} lb**: adds the missed approach fuel at the alternate, which is
      not part of the basic scheme.
- id: QMTPTZUW
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337739
    - BGS-331001
    - BGS-330839
    - AVEXAM-8528
    - BGS-331145
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Given the following information, what Taxi Fuel is
      required for a Commercial Air Transport flight?


      Planned taxi time: {{taxi}} minutes at both departure and destination
      aerodromes


      Taxi fuel flow read from the figure: {{tf}} kg/h
    variables:
      - id: taxi
        label: Taxi time per aerodrome
        unit: min
      - id: tf
        label: Taxi fuel flow
        unit: kg/h
    chartInputs:
      - taxi
      - tf
    answer:
      formula: 2 * taxi * tf / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi * tf / 60
      - id: d2
        formula: 4 * taxi * tf / 60
      - id: d3
        formula: 3 * taxi * tf / 60
    presets:
      - id: p1
        values:
          taxi: 15
          tf: 330
      - id: p2
        values:
          taxi: 10
          tf: 330
      - id: p3
        values:
          taxi: 20
          tf: 330
    explanation: >-
      Taxi Fuel includes the fuel for taxiing at the departure aerodrome and the
      planned taxi at the destination aerodrome. It is the total taxi time
      multiplied by the taxi fuel flow from the figure.


      **Solution**


      {{f: 2 * taxi * tf / 60}} = {{n: 2 * taxi * tf / 60}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: counts only one aerodrome (taxi time only once).

      - **{{d2}} kg**: counts the taxi time four times, i.e. doubles the two
      aerodromes again.

      - **{{d3}} kg**: counts the taxi time three times.
- id: QMXQBXDT
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331124
    - BGS-331153
    - ATPLGS-626617
  annexes:
    - CAP-697-page-37
  learningObjectives:
    - 033.03.01.01.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 697 Figure 4.3.1a). You are planning a flight
      with a Medium Range Jet Transport (MRJT) aeroplane. Given the following
      data and the simplified planning charts, determine the trip time in hours.


      Trip distance: {{distance}} NM

      Cruise pressure altitude: 30000 ft

      Estimated landing weight: 55000 kg

      Average trip wind: 25 kt headwind

      Temperature deviation: ISA +5°C

      Cruise mode: Long Range Cruise


      The ground speed read from the chart for these conditions is
      {{groundspeed}} kt.
    variables:
      - id: distance
        label: Trip distance
        unit: NM
      - id: groundspeed
        label: Ground speed (read from the chart)
        unit: kt
    chartInputs:
      - groundspeed
    answer:
      formula: distance / groundspeed
      unit: h
      decimals: 2
    distractors:
      - id: d1
        formula: distance / (groundspeed - 25)
      - id: d2
        formula: distance / (groundspeed + 25)
      - id: d3
        formula: distance * 0.8 / groundspeed
      - id: d4
        formula: distance / groundspeed * 60
    presets:
      - id: p1
        values:
          distance: 425
          groundspeed: 340
    explanation: >-
      The trip time is the trip distance divided by the ground speed. The ground
      speed for these conditions, including the headwind, is read from the
      chart.


      **Solution**


      {{f: distance / groundspeed}} = {{n: distance / groundspeed}} =
      **{{answer}} h**


      **Why the other answers are wrong**


      - **{{d1}} h**: subtracts the headwind from the chart ground speed a
      second time.

      - **{{d2}} h**: adds the headwind to the chart ground speed instead of
      using it as read.

      - **{{d3}} h**: applies an arbitrary 20 % reduction to the distance.

      - **{{d4}} h**: gives the trip time in minutes instead of hours, a unit
      error.
