  template:
    type: chart-calculation
    question: >-
      A Medium-Range Jet Aircraft is planned to perform a Commercial Air
      Transport flight to an isolated destination aerodrome. The nominated
      destination alternate must follow the isolated aerodrome procedure
      requirements. Using the annex, calculate the required Additional Fuel
      (ADDFU) for this flight, given:


      - Average trip fuel flow: {{ff}} kg/h

      - Holding fuel flow: {{hold}} kg/h

      - Holding time required, read from the annex figure: {{ht}} h
    variables:
      - id: ff
        label: Average trip fuel flow
        unit: kg/h
      - id: hold
        label: Holding fuel flow
        unit: kg/h
      - id: ht
        label: Holding time read from the figure
        unit: h
    chartInputs:
      - ht
    answer:
      formula: hold * ht
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * ht
      - id: d2
        formula: ff * ht * 4
      - id: d3
        formula: hold * 2 * ht * 2
      - id: d4
        formula: hold * (ht + 0.5)
    presets:
      - id: p1
        values:
          ff: 2849
          hold: 2400
          ht: 0.5
    explanation: >-
      The additional fuel is the holding fuel flow multiplied by the holding
      time that the annex requires for the situation. The holding time is read
      from the figure; the calculation uses the holding fuel flow, not the trip
      fuel flow.


      **Solution**


      {{f: hold * ht}} = {{n: hold * ht}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the average trip fuel flow instead of the holding
      fuel flow.

      - **{{d2}} kg**: uses the trip fuel flow and four times the holding time.

      - **{{d3}} kg**: doubles the holding fuel flow and the holding time.

      - **{{d4}} kg**: adds an additional 30 minutes to the holding time.
