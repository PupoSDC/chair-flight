- id: QNBIBEFA
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334682
    - BGS-331248
    - AVEXAM-59240
  annexes: []
  learningObjectives:
    - 033.03.01.01.04
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the required fuel for a VFR
      Commercial Air Transport flight with reciprocating engines? Assume the
      Basic Fuel Scheme WITHOUT variations applies. No alternate selected and
      good weather expected. Extra fuel: 0 kg. Discretionary fuel: 0 kg.


      - Fuel flow: {{ff}} kg/h

      - Trip time: {{trip_time}} min


      Give the answer in kg.
    variables:
      - id: ff
        label: Fuel flow
        unit: kg/h
      - id: trip_time
        label: Trip time
        unit: min
    answer:
      formula: ff * trip_time / 60 * 1.05 + ff
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * trip_time / 60
      - id: d2
        formula: ff * trip_time / 60 * 1.05
      - id: d3
        formula: ff * trip_time / 60 * 1.05 + ff * 0.75
      - id: d4
        formula: ff * trip_time / 60 + ff
    presets:
      - id: p1
        values:
          ff: 120
          trip_time: 279
      - id: p2
        values:
          ff: 95
          trip_time: 190
    explanation: >-
      Under the Basic Fuel Scheme for a VFR commercial air transport flight with
      reciprocating engines, the required fuel is the trip fuel, plus a
      contingency of 5 % of the trip fuel, plus the final reserve, which is the
      fuel for 60 minutes at the fuel flow. With no alternate, the alternate
      fuel is zero.


      **Solution**


      Trip fuel = {{n: ff * trip_time / 60}} kg


      Contingency (5 %) = {{= ff * trip_time / 60 * 0.05}} kg


      Final reserve (60 min) = {{n: ff}} kg


      {{f: ff * trip_time / 60 * 1.05 + ff}} = {{n: ff * trip_time / 60 * 1.05 +
      ff}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: trip fuel only, without contingency and final reserve.

      - **{{d2}} kg**: trip fuel with contingency but without the final reserve.

      - **{{d3}} kg**: uses a 45 minute final reserve instead of 60 minutes.

      - **{{d4}} kg**: forgets the contingency fuel.
