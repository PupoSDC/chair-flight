- id: QA3XEGEM3
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337231
    - BGS-331281
    - AVEXAM-91704
    - ATPLGS-629413
    - ATPLQ-337697
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      An aircraft planning to fly a total distance of {{total}} NM covers
      {{cov}} NM in {{el}} min, and its actual fuel remaining is {{fn}} l. Given
      the following information and assuming that the actual fuel consumption
      remains at the same rate, what will be the actual fuel remaining at
      destination?


      - Average TAS: {{tas}} kt

      - Average wind component: {{hw}} kt headwind

      - Trip fuel (fuel at start): {{trip}} l

      - Planned average fuel flow: {{pff}} l/h
    variables:
      - id: total
        label: Total distance
        unit: NM
      - id: cov
        label: Distance covered
        unit: NM
      - id: el
        label: Elapsed time
        unit: min
      - id: fn
        label: Actual fuel remaining
        unit: l
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind
        unit: kt
      - id: trip
        label: Trip fuel (fuel at start)
        unit: l
      - id: pff
        label: Planned fuel flow
        unit: l/h
    answer:
      formula: fn - round((trip - fn) / (el / 60)) * round((total - cov) / (tas - hw)
        * 100) / 100
      unit: l
      decimals: 0
    distractors:
      - id: d1
        formula: fn - pff * (total - cov) / tas
      - id: d2
        formula: fn - round((trip - fn) / (el / 60)) * (total - cov) / tas
      - id: d3
        formula: fn - round((trip - fn) / (el / 60)) * (total - cov) / (tas + hw)
      - id: d4
        formula: fn - trip * (total - cov) / total
    presets:
      - id: p1
        values:
          total: 460
          cov: 178
          el: 69
          fn: 1019
          tas: 145
          hw: 25
          trip: 1350
          pff: 360
      - id: p2
        values:
          total: 450
          cov: 160
          el: 80
          fn: 890
          tas: 145
          hw: 25
          trip: 1350
          pff: 360
    explanation: >-
      The actual fuel flow is the fuel used so far (initial fuel minus fuel
      remaining) divided by the elapsed time. The remaining time is the
      remaining distance divided by the ground speed (TAS minus headwind). Fuel
      remaining at destination is the current fuel minus actual fuel flow times
      remaining time (fuel flow rounded to whole litres per hour and time to
      0.01 h).


      **Solution**


      Actual fuel flow: {{= round((trip - fn) / (el / 60))}} l/h


      Remaining time: {{= round((total - cov) / (tas - hw) * 100) / 100}} h


      {{f: fn - round((trip - fn) / (el / 60)) * round((total - cov) / (tas -
      hw) * 100) / 100}} = **{{answer}} l**


      **Why the other answers are wrong**


      - **{{d1}} l**: planned fuel flow used (and wind ignored) instead of the
      actual rate.

      - **{{d2}} l**: wind ignored in the ground speed.

      - **{{d3}} l**: headwind added to TAS instead of subtracted.

      - **{{d4}} l**: planned proportion of trip fuel used instead of actual
      consumption.
