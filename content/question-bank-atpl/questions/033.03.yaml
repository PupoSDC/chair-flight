- id: QFOKVNWT
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338099
  annexes: []
  learningObjectives:
    - 033.03.03.04.02
  template:
    type: calculation
    question: You refuel with {{vol}} IMP gallons. What is the mass in lb with a
      specific gravity of {{sg}}? (1 IMP gal = 4.546 l, 1 kg = 2.2046 lb)
    variables:
      - id: vol
        label: Fuel volume
        unit: IMP gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * 4.546 * sg * 2.2046
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: vol * 4.546 * sg
      - id: d2
        formula: vol * sg * 2.2046
      - id: d3
        formula: vol * 3.785 * sg * 2.2046
      - id: d4
        formula: vol * sg
      - id: d5
        formula: vol * 4.546 * 2.2046
    presets:
      - id: p1
        values:
          vol: 670
          sg: 0.82
      - id: p2
        values:
          vol: 500
          sg: 0.8
      - id: p3
        values:
          vol: 800
          sg: 0.79
    explanation: >-
      Convert the volume to litres, multiply by the specific gravity (kg per
      litre) to get kilograms, then convert kilograms to pounds.


      **Solution**


      {{f: vol * 4.546 * sg * 2.2046}} = {{n: vol * 4.546 * sg * 2.2046}} =
      **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: this is the mass in kg; the conversion to lb is missing.

      - **{{d2}} lb**: the volume in IMP gallons is used as if it were litres.

      - **{{d3}} lb**: US gallons (3.785 l) are used instead of IMP gallons.

      - **{{d4}} lb**: gallons are multiplied by specific gravity only, no unit
      conversions.

      - **{{d5}} lb**: the specific gravity is forgotten.
