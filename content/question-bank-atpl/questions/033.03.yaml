  template:
    type: calculation
    question: >-
      Given the following data for the pre-flight calculations, determine the
      minimum fuel required to be on board a helicopter for an IFR Commercial
      Air Transport flight. Assume the Basic Fuel Scheme WITHOUT variations
      applies.


      - Trip Fuel: {{trip}} kg

      - Fuel to Alternate: {{alt}} kg

      - Taxi Fuel: {{taxi}} kg

      - Fuel flow at 1500 ft above alternate aerodrome: {{ff}} kg/h


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: trip
        label: Trip fuel
        unit: kg
      - id: alt
        label: Fuel to alternate
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: ff
        label: Fuel flow at 1500 ft above alternate
        unit: kg/h
    answer:
      formula: taxi + trip * 1.1 + alt + ff * 0.5
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip * 1.05 + alt + ff * 0.5
      - id: d2
        formula: taxi + trip + alt
      - id: d3
        formula: taxi + trip + alt + ff
    presets:
      - id: p1
        values:
          trip: 3560
          alt: 918
          taxi: 140
          ff: 2031
      - id: p2
        values:
          trip: 2800
          alt: 700
          taxi: 120
          ff: 1800
      - id: p3
        values:
          trip: 4100
          alt: 1100
          taxi: 160
          ff: 2200
    explanation: >-
      Under the Basic Fuel Scheme the fuel to be on board is the sum of taxi
      fuel, trip fuel, contingency fuel, alternate fuel and final reserve fuel.
      For a helicopter on an IFR flight the contingency fuel is 10% of the trip
      fuel and the final reserve fuel is 30 minutes at holding speed 1500 ft
      above the alternate aerodrome.


      **Solution**


      Contingency fuel = {{= trip * 0.1}} kg

      Final reserve fuel = {{= ff * 0.5}} kg


      {{f: taxi + trip * 1.1 + alt + ff * 0.5}} = {{n: taxi + trip * 1.1 + alt +
      ff * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: contingency taken as 5% of the trip fuel (the aeroplane
      value) instead of 10% for a helicopter.

      - **{{d2}} kg**: only taxi, trip and alternate fuel; contingency and final
      reserve are forgotten.

      - **{{d3}} kg**: contingency fuel is forgotten and a full hour (instead of
      30 minutes) of final reserve is added.
- id: QDPYFXLZ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337437
    - ATPLGS-113959
    - AVEXAM-42337
    - ATPLGS-625670
