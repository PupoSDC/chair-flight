  template:
    type: chart-calculation
    question: >-
      Refer to the figure (CAP 697 Figure 4.5.3.2, pressure altitude 37000 ft).
      Given the following information, determine the trip fuel required for a
      Commercial Air Transport flight.


      Ramp mass: 52500 kg


      - Taxi fuel: {{taxi}} kg

      - Take-off and climb fuel: {{takeoff}} kg


      Cruise distance: 378 NAM

      Average wind component in cruise: +20 kt

      OAT: ISA


      - Descent fuel: {{descent}} kg

      - Approach and landing fuel: {{approach}} kg


      Contingency fuel: 5% of trip fuel

      Alternate fuel: 250 kg

      Holding fuel consumption: 2400 kg per hour


      The cruise fuel read from the figure for 378 NAM and +20 kt wind is
      {{cruise_fuel}} kg.
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: takeoff
        label: Take-off and climb fuel
        unit: kg
      - id: cruise_fuel
        label: Cruise fuel (read from the figure)
        unit: kg
      - id: descent
        label: Descent fuel
        unit: kg
      - id: approach
        label: Approach and landing fuel
        unit: kg
    chartInputs:
      - cruise_fuel
    answer:
      formula: takeoff + cruise_fuel + descent + approach
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: takeoff + cruise_fuel + descent
      - id: d2
        formula: takeoff + cruise_fuel + descent + approach + taxi
      - id: d3
        formula: takeoff + cruise_fuel + descent + approach + 0.05 * cruise_fuel
      - id: d4
        formula: takeoff + descent + approach
    presets:
      - id: p1
        values:
          taxi: 150
          takeoff: 1650
          cruise_fuel: 1900
          descent: 275
          approach: 80
    explanation: >-
      The trip fuel is the sum of the take-off and climb fuel, the cruise fuel
      read from the figure, the descent fuel and the approach and landing fuel.
      Taxi fuel, contingency fuel and alternate fuel are not part of the trip
      fuel.


      **Solution**


      {{f: takeoff + cruise_fuel + descent + approach}} = {{n: takeoff +
      cruise_fuel + descent + approach}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: forgets the approach and landing fuel.

      - **{{d2}} kg**: adds the taxi fuel, which is not part of the trip fuel.

      - **{{d3}} kg**: adds contingency fuel, calculated on the cruise fuel
      only, to the trip fuel.

      - **{{d4}} kg**: forgets the cruise fuel read from the figure.
