- id: QJDDEWUQ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332715
    - ATPLGS-625252
    - BGS-330865
  annexes: []
  learningObjectives:
    - 033.03.02.03.06
  template:
    type: calculation
    question: Ignoring reserves, how much fuel is needed over a distance of {{dist}}
      NM if the aircraft's fuel consumption is {{ff}} l/h? The TAS is {{tas}} kt
      and the headwind component is {{hw}} kt.
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: ff
        label: Fuel consumption
        unit: l/h
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
    answer:
      formula: dist / (tas - hw) * ff
      unit: l
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tas * ff
      - id: d2
        formula: dist / (tas + hw) * ff
      - id: d3
        formula: dist * ff / (tas - 2 * hw)
      - id: d4
        formula: dist / (tas - hw)
    presets:
      - id: p1
        values:
          dist: 360
          ff: 300
          tas: 210
          hw: 30
      - id: p2
        values:
          dist: 280
          ff: 180
          tas: 150
          hw: 20
      - id: p3
        values:
          dist: 450
          ff: 250
          tas: 240
          hw: 40
    explanation: >-
      Fuel required equals the flight time multiplied by the fuel flow. The
      flight time uses the ground speed, i.e. TAS minus the headwind component.


      **Solution**


      Ground speed = {{= tas - hw}} kt, time = {{= dist / (tas - hw)}} h


      {{f: dist / (tas - hw) * ff}} = {{n: dist / (tas - hw) * ff}} =
      **{{answer}} l**


      **Why the other answers are wrong**


      - **{{d1}} l**: the wind was ignored (TAS used instead of ground speed).

      - **{{d2}} l**: the headwind was added to the TAS.

      - **{{d3}} l**: the headwind was subtracted twice.

      - **{{d4}} l**: only the flight time in hours was given, not multiplied by
      the fuel flow.
- id: QJQZJIBN
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337112
    - ATPLGS-107932
    - ATPLGS-107893
    - AVEXAM-21124
    - BGS-330201
    - AVEXAM-36623
