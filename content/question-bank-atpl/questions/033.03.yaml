    - 033-jar-fcl-flight-planning-quick-determination-of-flight-plan
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (annex 033-036 and 033-038). Assuming the following
      data:


      - Ground distance to be covered: {{distance}} NM

      - True airspeed: {{tas}} kt (Mach 0.82)

      - Tailwind component: {{tailwind}} kt


      Cruise flight level FL 350, ISA, CG 37%, total anti-ice OFF, air
      conditioning normal, planned destination landing mass 150 000 kg.


      The fuel flow read from the figure for these conditions is {{flow}} kg/h.
      Calculate the fuel consumption for the flight in kg.
    variables:
      - id: distance
        label: Ground distance
        unit: NM
      - id: tas
        label: True airspeed
        unit: kt
      - id: tailwind
        label: Tailwind component
        unit: kt
      - id: flow
        label: Fuel flow (read from the figure)
        unit: kg/h
    chartInputs:
      - flow
    answer:
      formula: flow * distance / (tas + tailwind)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: flow * distance / (tas - tailwind)
      - id: d2
        formula: flow * distance / tas
      - id: d3
        formula: flow * distance / (tas + tailwind) * 0.9
      - id: d4
        formula: flow * distance / (tas + 2 * tailwind)
    presets:
      - id: p1
        values:
          distance: 2500
          tas: 470
          tailwind: 40
          flow: 5671.2
    explanation: >-
      The trip time is the ground distance divided by the groundspeed, and the
      groundspeed is the true airspeed plus the tailwind. The fuel consumption
      is the fuel flow read from the figure multiplied by the trip time.


      **Solution**


      Groundspeed = {{= tas + tailwind}} kt


      Trip time = {{= distance / (tas + tailwind)}} h


      {{f: flow * distance / (tas + tailwind)}} = {{n: flow * distance / (tas +
      tailwind)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the tailwind from the airspeed instead of
      adding it.

      - **{{d2}} kg**: ignores the wind completely.

      - **{{d3}} kg**: applies an arbitrary 10 % reduction to the correct
      result.

      - **{{d4}} kg**: counts the tailwind twice in the groundspeed.
