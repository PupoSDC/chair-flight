      The take-off fuel is the trip fuel plus the contingency fuel (5 % of the
      trip fuel), plus the destination alternate fuel, plus the final reserve,
      which is 30 minutes of holding fuel consumption.


      **Solution**


      Contingency = 5 % of {{trip}} kg = {{= trip * 0.05}} kg


      Final reserve (30 min holding) = {{= hold_rate * 0.5}} kg


      {{f: trip * 1.05 + alt + hold_rate * 0.5}} = {{n: trip * 1.05 + alt +
      hold_rate * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: forgets the final reserve.

      - **{{d2}} kg**: forgets the contingency fuel.

      - **{{d3}} kg**: uses 45 minutes of holding fuel instead of 30 minutes.

      - **{{d4}} kg**: forgets the destination alternate fuel.
