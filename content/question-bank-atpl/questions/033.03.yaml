- id: QXRGWLEP
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335542
    - BGS-331387
    - ATPLGS-113873
    - AVEXAM-42196
    - ATPLGS-113874
    - AVEXAM-57985
    - BGS-331429
    - ATPLGS-113876
    - AVEXAM-54346
    - BGS-331160
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Given the following information about a Commercial Air
      Transport flight, what is the required Taxi Fuel?


      - Expected taxi time: {{taxi}} min

      - APU: ON for {{apu}} min

      - Company policy: for flight planning purposes, Taxi Fuel shall be
      calculated as at least {{minfuel}} kg


      - Taxi fuel flow read from the figure: {{tf}} kg/h

      - APU fuel flow read from the figure: {{af}} kg/h
    variables:
      - id: taxi
        label: Taxi time
        unit: min
      - id: apu
        label: APU time
        unit: min
      - id: minfuel
        label: Company minimum taxi fuel
        unit: kg
      - id: tf
        label: Taxi fuel flow
        unit: kg/h
      - id: af
        label: APU fuel flow
        unit: kg/h
    chartInputs:
      - taxi
      - apu
      - minfuel
      - tf
      - af
    answer:
      formula: max((taxi * tf + apu * af) / 60, minfuel)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: minfuel
      - id: d2
        formula: apu * af / 60
      - id: d3
        formula: minfuel + taxi * tf / 60
      - id: d4
        formula: (taxi * tf + apu * af) / 60 + minfuel
    presets:
      - id: p1
        values:
          taxi: 10
          apu: 10
          minfuel: 60
          tf: 360
          af: 90
      - id: p2
        values:
          taxi: 12
          apu: 10
          minfuel: 60
          tf: 360
          af: 90
      - id: p3
        values:
          taxi: 14
          apu: 6
          minfuel: 70
          tf: 360
          af: 90
    explanation: >-
      The required Taxi Fuel is the planned taxi and APU consumption, but
      company policy sets a minimum. The larger of the two values is used.


      **Solution**


      Calculated: {{f: (taxi * tf + apu * af) / 60}} = {{n: (taxi * tf + apu *
      af) / 60}} kg


      Required: {{f: max((taxi * tf + apu * af) / 60, minfuel)}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the company minimum although the calculated value is
      larger.

      - **{{d2}} kg**: only includes the APU fuel.

      - **{{d3}} kg**: adds the company minimum to the taxi fuel instead of
      comparing.

      - **{{d4}} kg**: adds the company minimum on top of the calculated fuel.
