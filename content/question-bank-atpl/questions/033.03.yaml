    - ATPLGS-625669
    - ATPLGS-114065
    - BGS-330880
    - BGS-330879
    - ATPLGS-625291
    - BGS-330878
  annexes: []
  learningObjectives:
    - 033.03.02.04.02
  template:
    type: calculation
    question: >-
      Given the following planning data, calculate the maximum possible extra
      fuel in kg, including any fuel penalty, that can be uplifted:


      - Maximum Ramp Mass: {{mrm}} kg

      - Maximum Take Off Mass: {{mtom}} kg

      - Maximum Landing Mass: {{mlm}} kg


      Maximum Zero Fuel Mass: 62,720 kg


      - Dry Operating Mass: {{dom}} kg

      - Traffic Load: {{tl}} kg

      - Planned Take Off Fuel: {{tof}} kg

      - Trip Fuel: {{trip}} kg

      - Taxi Fuel: {{taxi}} kg

      - Fuel Penalty: {{pen}} kg/1000 kg of extra fuel

      - Max Fuel Tank Capacity: {{tank}} kg
    variables:
      - id: mrm
        label: Max ramp mass
        unit: kg
      - id: mtom
        label: MTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: dom
        label: DOM
        unit: kg
      - id: tl
        label: Traffic load
        unit: kg
      - id: tof
        label: Planned take-off fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: pen
        label: Fuel penalty
        unit: kg per 1000 kg
      - id: tank
        label: Tank capacity
        unit: kg
    answer:
      formula: min(mrm - (dom + tl + tof + taxi), mtom - (dom + tl + tof), (mlm - (dom
        + tl + tof - trip)) / (1 - pen / 1000), tank - tof - taxi)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mrm - (dom + tl + tof + taxi)
      - id: d2
        formula: mlm - (dom + tl + tof - trip)
      - id: d3
        formula: (mlm - (dom + tl + tof - trip)) / (1 - pen / 1000)
      - id: d4
        formula: tank - tof
      - id: d5
        formula: mtom - (dom + tl + tof)
    presets:
      - id: p1
        values:
          mrm: 77500
          mtom: 77000
          mlm: 66360
          dom: 42845
          tl: 17460
          tof: 10365
          trip: 7890
          taxi: 195
          pen: 135
          tank: 14000
      - id: p2
        values:
          mrm: 77500
          mtom: 77000
          mlm: 66360
          dom: 42845
          tl: 17460
          tof: 10365
          trip: 7890
          taxi: 195
          pen: 135
          tank: 13800
      - id: p3
        values:
          mrm: 77500
          mtom: 77000
          mlm: 66360
          dom: 42845
          tl: 17460
          tof: 10365
          trip: 7890
          taxi: 195
          pen: 135
          tank: 14200
    explanation: >-
      The extra fuel is limited by the smallest headroom to each limit: ramp
      mass, take-off mass, landing mass (where the fuel penalty means only part
      of the extra fuel is burnt, so the headroom is divided by one minus the
      penalty fraction) and the tank capacity (after taxi fuel). The planned
      take-off fuel excludes taxi fuel here.


      **Solution**


      Ramp mass headroom = {{= mrm - (dom + tl + tof + taxi)}} kg

      Take-off mass headroom = {{= mtom - (dom + tl + tof)}} kg

      Landing mass headroom with penalty = {{= (mlm - (dom + tl + tof - trip)) /
      (1 - pen / 1000)}} kg

      Tank headroom = {{f: tank - tof - taxi}} = {{n: tank - tof - taxi}} kg


      The smallest value limits the extra fuel: **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the ramp mass limit is considered.

      - **{{d2}} kg**: landing mass headroom without applying the fuel penalty.

      - **{{d3}} kg**: landing mass headroom with the penalty, but this limit is
      not the most restrictive one.

      - **{{d4}} kg**: tank headroom without subtracting the taxi fuel.

      - **{{d5}} kg**: only the take-off mass limit is considered.
