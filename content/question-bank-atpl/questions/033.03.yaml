- id: QGHEPDNL
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337238
    - BGS-330525
    - ATPLGS-126776
  annexes: []
  learningObjectives:
    - 033.03.02.01.01
  template:
    type: calculation
    question: >-
      The fuel burn of an aircraft turbine engine is measured as a volume flow.


      - Fuel burn: {{vol}} l/h at a fuel density of {{rho_old}} kg/l

      - New fuel density: {{rho_new}} kg/l


      Assume the same mass of fuel is burned per hour. What is the fuel burn in
      l/h at the new density?
    variables:
      - id: vol
        label: Fuel burn
        unit: l/h
      - id: rho_old
        label: Original fuel density
        unit: kg/l
      - id: rho_new
        label: New fuel density
        unit: kg/l
    answer:
      formula: round(vol * rho_old / rho_new)
      unit: l/h
      decimals: 2
    distractors:
      - id: d1
        formula: round(vol * rho_new / rho_old)
      - id: d2
        formula: vol
      - id: d3
        formula: round(vol * (rho_old / rho_new) ^ 2)
      - id: d4
        formula: round(vol * (rho_old - rho_new) / rho_new)
    presets:
      - id: p1
        values:
          vol: 220
          rho_old: 0.8
          rho_new: 0.75
      - id: p2
        values:
          vol: 300
          rho_old: 0.78
          rho_new: 0.82
      - id: p3
        values:
          vol: 150
          rho_old: 0.85
          rho_new: 0.8
    explanation: >-
      The engine burns the same mass of fuel per hour. Volume is mass divided by
      density, so a denser fuel gives a smaller volume per hour and a less dense
      fuel gives a larger volume. The new volume flow is the old volume flow
      multiplied by the old density divided by the new density.


      **Solution**


      {{f: vol * rho_old / rho_new}} = {{n: vol * rho_old / rho_new}} =
      **{{answer}} l/h**


      **Why the other answers are wrong**


      - **{{d1}} l/h**: inverts the density ratio.

      - **{{d2}} l/h**: assumes the volume flow does not change with the
      density.

      - **{{d3}} l/h**: squares the density ratio.

      - **{{d4}} l/h**: subtracts the densities and uses the wrong base.
- id: QGJNLLYC
  docId: "033.03"
  relatedQuestions:
    - QXBHWFPC
  externalIds:
    - ATPLQ-339312
    - BGS-331285
    - AVEXAM-87791
    - AVEXAM-81756
  annexes: []
  learningObjectives:
    - 033.03.03.01.02
  template:
    type: calculation
    question: >-
      A commercial air transport flight is planned with the reduced contingency
      fuel procedure. No destination alternate is required and no extra fuel is
      carried.


      - Taxi fuel: {{taxi}} kg

      - Trip fuel to the decision point: {{trip_dp}} kg

      - Trip fuel from the decision point to the destination: {{trip_dest}} kg

      - Final reserve fuel: {{frf}} kg


      What is the minimum fuel required?
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip_dp
        label: Trip fuel to decision point
        unit: kg
      - id: trip_dest
        label: Trip fuel decision point to destination
        unit: kg
      - id: frf
        label: Final reserve fuel
        unit: kg
    answer:
      formula: taxi + trip_dp + 1.05 * trip_dest + frf
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip_dp + trip_dest + frf
      - id: d2
        formula: taxi + trip_dp + 1.05 * (trip_dest + frf)
      - id: d3
        formula: trip_dp + 1.05 * trip_dest + frf
      - id: d4
        formula: taxi + trip_dp + 1.10 * trip_dest + frf
    presets:
      - id: p1
        values:
          taxi: 230
          trip_dp: 8355
          trip_dest: 2120
          frf: 1200
      - id: p2
        values:
          taxi: 250
          trip_dp: 7600
          trip_dest: 1900
          frf: 1100
      - id: p3
        values:
          taxi: 210
          trip_dp: 9100
          trip_dest: 2600
          frf: 1300
    explanation: >-
      With the reduced contingency fuel procedure, the contingency fuel is only
      5 % of the trip fuel from the decision point to the destination. Taxi fuel
      and final reserve fuel are added in full.


      **Solution**


      {{f: taxi + trip_dp + 1.05 * trip_dest + frf}} = {{n: taxi + trip_dp +
      1.05 * trip_dest + frf}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the 5 % contingency fuel.

      - **{{d2}} kg**: applies the contingency to the final reserve instead of
      the trip.

      - **{{d3}} kg**: forgets the taxi fuel.

      - **{{d4}} kg**: uses a 10 % contingency instead of 5 %.
- id: QGLPK8CHO
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338416
    - ATPLGS-123136
    - AVEXAM-29606
    - ATPLGS-114035
    - BGS-331318
  annexes:
    - 033-mrjt-mach-0-74-cruise-table-pressure-altitude-35000-ft
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure for pressure altitude 35 000 ft. By how many NAM does
      the air range available from 1 000 kg of fuel decrease if the OAT
      increases from -55° C to -45° C? (Give a positive number.)


      Aircraft mass at start of cruise leg: 50 000 kg

      Cruise level: FL350

      Cruise speed: Mach 0.74


      - Specific air range read from the figure at -55° C: {{sar1}} NAM/kg

      - Specific air range read from the figure at -45° C: {{sar2}} NAM/kg

      - Fuel: {{fuel}} kg
    variables:
      - id: sar1
        label: Specific air range at -55° C (from figure)
        unit: NAM/kg
      - id: sar2
        label: Specific air range at -45° C (from figure)
        unit: NAM/kg
      - id: fuel
        label: Fuel
        unit: kg
    chartInputs:
      - sar1
      - sar2
    answer:
      formula: fuel * (sar1 - sar2)
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: fuel * sar1
      - id: d2
        formula: fuel * sar2
      - id: d3
        formula: 10 * fuel * (sar1 - sar2)
      - id: d4
        formula: fuel * (sar1 + sar2)
    presets:
      - id: p1
        values:
          sar1: 0.165
          sar2: 0.164
          fuel: 1000
    explanation: >-
      The air range from a given amount of fuel is the fuel mass multiplied by
      the specific air range (NAM per kg), which is read from the figure for
      each temperature. The change is the difference between the two ranges.


      **Solution**


      Range at -55° C = {{= fuel * sar1}} NAM; range at -45° C = {{= fuel *
      sar2}} NAM


      {{f: fuel * (sar1 - sar2)}} = {{n: fuel * (sar1 - sar2)}} = **{{answer}}
      NAM reduction**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: gives the range at -55° C, not the change.

      - **{{d2}} NAM**: gives the range at -45° C, not the change.

      - **{{d3}} NAM**: the difference is multiplied by 10 (decimal slip).

      - **{{d4}} NAM**: adds the two specific air ranges instead of subtracting
      them.
- id: QGLWIYTX
  docId: "033.03"
  relatedQuestions: []
