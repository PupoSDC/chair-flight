    - AVEXAM-53293
  annexes: []
  learningObjectives:
    - 033.03.02.04.03
  template:
    type: calculation
    question: >-
      What is the maximum extra fuel that may be uplifted?


      - MZFM: {{mzfm}} kg

      - MTOM: {{mtom}} kg

      - MLM: {{mlm}} kg

      - Planned ZFM: {{zfm}} kg

      - TOF: {{tof}} kg

      - Trip fuel: {{trip}} kg

      - Fuel penalty: take-off {{pen_to}} per 1000 kg, landing {{pen_ld}} per
      1000 kg
    variables:
      - id: mzfm
        label: MZFM
        unit: kg
      - id: mtom
        label: MTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: zfm
        label: Planned ZFM
        unit: kg
      - id: tof
        label: Take-off fuel (TOF)
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: pen_to
        label: Fuel penalty take-off (per 1000 kg)
        unit: kg
      - id: pen_ld
        label: Fuel penalty landing (per 1000 kg)
        unit: kg
    answer:
      formula: min(mtom - zfm - tof, (mlm - (zfm + tof - trip)) / (1 - pen_ld / 1000))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (mlm - (zfm + tof - trip)) / (1 - pen_ld / 1000)
      - id: d2
        formula: mtom - zfm - trip
      - id: d3
        formula: mzfm - zfm
      - id: d4
        formula: (mtom - zfm - tof) * (1 - pen_to / 1000)
      - id: d5
        formula: (mtom - zfm - tof) / (1 - pen_to / 1000)
    presets:
      - id: p1
        values:
          mzfm: 170000
          mtom: 223000
          mlm: 182000
          zfm: 165767
          tof: 51616
          trip: 45854
          pen_to: 282.7
          pen_ld: 394
      - id: p2
        values:
          mzfm: 150000
          mtom: 200000
          mlm: 165000
          zfm: 140000
          tof: 40000
          trip: 35000
          pen_to: 250
          pen_ld: 350
    explanation: >-
      Extra fuel is limited by the maximum take-off mass and by the maximum
      landing mass. For landing, the extra fuel arriving at destination is
      reduced by the fuel penalty (part of it is burnt to carry itself). The
      smaller limit applies.


      **Solution**


      Take-off limit: {{f: mtom - zfm - tof}} = {{= mtom - zfm - tof}} kg


      Landing limit: {{f: (mlm - (zfm + tof - trip)) / (1 - pen_ld / 1000)}} =
      {{= (mlm - (zfm + tof - trip)) / (1 - pen_ld / 1000)}} kg


      Maximum extra fuel = smaller value = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the landing limit is considered.

      - **{{d2}} kg**: the take-off fuel is replaced by trip fuel in the
      take-off limit.

      - **{{d3}} kg**: the MZFM headroom is used, which does not limit fuel.

      - **{{d4}} kg**: the take-off headroom is multiplied by (1 - penalty), the
      penalty applied in the wrong direction.

      - **{{d5}} kg**: the take-off headroom is divided by (1 - penalty), a
      penalty applied where none belongs.
