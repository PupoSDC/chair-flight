  template:
    type: chart-calculation
    question: >-
      Refer to figure. Given the following information about a Commercial Air
      Transport IFR flight, what is the required taxi fuel?


      Expected taxi time: 6 min

      APU: ON for 7 min

      Taxi fuel for these times, read from the figure (before the company
      minimum): {{taxi_fig}} kg (value read from the graph)

      Company policy: for flight planning purposes, taxi fuel shall be
      calculated as at least {{min_taxi}} kg


      Give the required taxi fuel in kg.
    variables:
      - id: taxi_fig
        label: Taxi fuel read from the graph
        unit: kg
      - id: min_taxi
        label: Company minimum taxi fuel
        unit: kg
    chartInputs:
      - taxi_fig
    answer:
      formula: max(taxi_fig, min_taxi)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi_fig + min_taxi
      - id: d2
        formula: taxi_fig * 1.1
      - id: d3
        formula: min_taxi - taxi_fig
      - id: d4
        formula: min_taxi * 1.5
    presets:
      - id: p1
        values:
          taxi_fig: 48
          min_taxi: 60
      - id: p2
        values:
          taxi_fig: 85
          min_taxi: 60
    explanation: >-
      The taxi fuel is the fuel burned during the taxi time plus the APU time,
      taken from the fuel-flow figure for the stated times. Company policy sets
      a minimum, so the larger of the two values is the required taxi fuel.


      **Solution**


      Taxi fuel from the figure: {{taxi_fig}} kg


      Company minimum: {{min_taxi}} kg


      The larger value applies: **{{answer}} kg**


      **Why the other answers are wrong**

      - **{{d1}} kg**: adds the company minimum to the calculated fuel instead
      of taking the larger value.

      - **{{d2}} kg**: applies a 10% margin to the figure value, which is not
      required.

      - **{{d3}} kg**: subtracts the calculated fuel from the minimum.

      - **{{d4}} kg**: uses 150% of the company minimum.
