- id: QALF1J7IH
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332813
    - AVEXAM-76879
    - BGS-331285
    - BGS-330899
    - AVEXAM-2792
    - AVEXAM-34083
    - BGS-331404
    - BGS-330959
    - BGS-330898
    - ATPLGS-626631
    - BGS-330897
  annexes: []
  learningObjectives:
    - 033.03.01.01.04
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the total fuel required for the
      Commercial Air Transport flight in a Medium Range Jet Transport MRJT
      aeroplane, with no destination alternate, given the following information?
      Assume the Basic Fuel Scheme WITHOUT variations applies.


      Estimated taxi time: {{taxit}} minutes at both departure and destination
      aerodromes

      APU fuel flow: 115 kg/h

      Taxi fuel flow: {{taxiff}} kg/min

      Planned APU usage at the parking position: Zero


      - Total trip distance: {{dist}} NM

      - Average fuel flow: {{ff}} kg/h

      - TAS: {{tas}} kt

      - Average wind component: +{{wc}} kt

      - Contingency Fuel: {{pct}}% of the Trip Fuel

      - Holding fuel flow: {{hff}} kg/h


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: taxit
        label: Taxi time
        unit: min
      - id: taxiff
        label: Taxi fuel flow
        unit: kg/min
      - id: dist
        label: Trip distance
        unit: NM
      - id: ff
        label: Average fuel flow
        unit: kg/h
      - id: tas
        label: TAS
        unit: kt
      - id: wc
        label: Tailwind component
        unit: kt
      - id: pct
        label: Contingency
        unit: "%"
      - id: hff
        label: Holding fuel flow
        unit: kg/h
    answer:
      formula: taxit * taxiff + dist / (tas + wc) * ff * (1 + pct / 100) + 0.75 * hff
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (tas + wc) * ff * (1 + pct / 100) + 0.75 * hff
      - id: d2
        formula: 2 * taxit * taxiff + dist / (tas + wc) * ff * (1 + pct / 100) + 0.75 *
          hff
      - id: d3
        formula: taxit * taxiff + dist / (tas + wc) * ff * (1 + pct / 100) + 0.5 * hff
    presets:
      - id: p1
        values:
          taxit: 20
          taxiff: 11
          dist: 1131
          ff: 2638
          tas: 424
          wc: 17
          pct: 3
          hff: 2400
      - id: p2
        values:
          taxit: 15
          taxiff: 10
          dist: 800
          ff: 2600
          tas: 430
          wc: 20
          pct: 3
          hff: 2300
      - id: p3
        values:
          taxit: 25
          taxiff: 12
          dist: 1500
          ff: 2700
          tas: 440
          wc: 30
          pct: 3
          hff: 2500
    explanation: >-
      Basic Fuel Scheme: total fuel = taxi fuel (departure only) + trip fuel +
      contingency fuel + final reserve fuel. With no destination alternate, fuel
      for 15 minutes of holding is added to the 30 minutes final reserve for a
      turbine aeroplane, i.e. 45 minutes at holding fuel flow in total. The wind
      component changes the ground speed used for the trip time.


      **Solution**


      Taxi fuel = {{taxit}} min × {{taxiff}} kg/min = {{= taxit * taxiff}} kg

      Trip time = {{dist}} / ({{tas}} + {{wc}}) = {{= dist / (tas + wc)}} h

      Trip fuel = {{= dist / (tas + wc)}} h × {{ff}} kg/h = {{= dist / (tas +
      wc) * ff}} kg

      Contingency = {{pct}}% × trip fuel = {{= dist / (tas + wc) * ff * pct /
      100}} kg

      Final reserve + no-alternate fuel = 0.75 h × {{hff}} kg/h = {{= 0.75 *
      hff}} kg

      Total = {{= taxit * taxiff}} + {{= dist / (tas + wc) * ff}} + {{= dist /
      (tas + wc) * ff * pct / 100}} + {{= 0.75 * hff}} = **{{answer}} kg**


      **Why the other answers are wrong**

      - **{{d1}} kg**: taxi fuel is forgotten.

      - **{{d2}} kg**: taxi fuel is counted for both departure and destination;
      the destination taxi is not part of the required fuel.

      - **{{d3}} kg**: the extra 15 minutes of holding fuel for the no-alternate
      case is forgotten (only 30 minutes).
