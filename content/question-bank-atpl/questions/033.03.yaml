  externalIds:
    - ATPLQ-333938
    - AVEXAM-81526
  annexes: []
  learningObjectives:
    - 033.03.01.01.01
  template:
    type: calculation
    question: |-
      Determine the fuel mass in lb, given:

      - Volume of the fuel: {{vol}} US GAL
      - Specific gravity: {{sg}}
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: vol * sg * 8.343
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: vol * 8.343
      - id: d2
        formula: vol * sg * 3.785
      - id: d3
        formula: vol * sg * 10
      - id: d4
        formula: vol / sg * 8.343
    presets:
      - id: p1
        values:
          vol: 590
          sg: 0.72
      - id: p2
        values:
          vol: 420
          sg: 0.78
      - id: p3
        values:
          vol: 800
          sg: 0.8
    explanation: >-
      Fuel mass is volume times density. The density of fuel is its specific
      gravity multiplied by the density of water, which is about 8.343 lb per US
      gallon.


      **Solution**


      {{f: vol * sg * 8.343}} = {{n: vol * sg * 8.343}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: specific gravity ignored (fuel treated as water).

      - **{{d2}} lb**: this is the mass in kg (3.785 l per US gal), not lb.

      - **{{d3}} lb**: wrong conversion factor (10 lb per gallon).

      - **{{d4}} lb**: volume divided by the specific gravity instead of
      multiplied.
- id: QZJVJJWI
  docId: "033.03"
  relatedQuestions:
    - QTKLPRZL
  externalIds:
    - ATPLQ-337816
    - AVEXAM-55924
  annexes: []
  learningObjectives:
    - 033.03.02.04.03
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Due to a hydraulic failure, the landing gear of a
      transport category aircraft stays extended after take-off. Based on the
      flight planning data given below, calculate the time penalty in percentage
      for the flight, based on (standard) endurance.


      - Usable fuel: {{fuel}} metric tons

      - Fuel consumption: {{ff}} kg/h

      - Fuel consumption increase with gear extended, read from the figure:
      {{pen}} %
    variables:
      - id: fuel
        label: Usable fuel
        unit: t
      - id: ff
        label: Fuel consumption
        unit: kg/h
      - id: pen
        label: Fuel consumption increase
        unit: "%"
    chartInputs:
      - fuel
      - ff
      - pen
    answer:
      formula: 100 * (1 - 1 / (1 + pen / 100))
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: 100 / (1 + pen / 100)
      - id: d2
        formula: pen
      - id: d3
        formula: 100 * (1 - 1 / (pen / 100))
    presets:
      - id: p1
        values:
          fuel: 6
          ff: 2400
          pen: 185
      - id: p2
        values:
          fuel: 8
          ff: 3000
          pen: 120
      - id: p3
        values:
          fuel: 7
          ff: 2500
          pen: 60
    explanation: >-
      With a higher fuel consumption the endurance shrinks. The time penalty in
      percent is (standard endurance - penalised endurance) divided by the
      standard endurance, which depends only on the consumption increase.


      **Solution**


      Standard endurance: {{= fuel * 1000 / ff}} h


      Penalised endurance: {{= fuel * 1000 / ff / (1 + pen / 100)}} h


      {{f: 100 * (1 - 1 / (1 + pen / 100))}} = {{n: 100 * (1 - 1 / (1 + pen /
      100))}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: is the remaining endurance in percent of the standard one,
      not the loss.

      - **{{d2}} %**: takes the fuel consumption increase itself as time
      penalty.

      - **{{d3}} %**: treats the consumption increase as a factor instead of 1
      plus the increase.
- id: QZKXCLOS
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332637
    - BGS-330249
    - BGS-330265
  annexes:
    - 033-mrjt-stepped-climb-cruise-graph
  learningObjectives:
    - 033.03.02.02.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure (Flight Planning Manual MRJT 1 Figure 4.3.5). The
      following apply:


      Temperature: ISA +15°C

      Brake release mass: 62000 kg

      Trip time: {{trip_min}} min


      The average fuel flow read from the figure for these conditions is
      {{flow}} kg/h. Calculate the trip fuel in kg.
    variables:
      - id: flow
        label: Average fuel flow (read from the graph)
        unit: kg/h
      - id: trip_min
        label: Trip time
        unit: min
    chartInputs:
      - flow
    answer:
      formula: flow * trip_min / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: flow * trip_min / 60 - 300
      - id: d2
        formula: flow * trip_min / 60 - 500
      - id: d3
        formula: flow * trip_min / 60 + 300
      - id: d4
        formula: flow * trip_min
    presets:
      - id: p1
        values:
          flow: 2531.25
          trip_min: 320
    explanation: >-
      Trip fuel is the average fuel flow multiplied by the flight time. The
      flight time must be in hours, so the trip time in minutes is divided by
      60. The fuel flow is read from the figure for the given temperature and
      mass.


      **Solution**


      {{f: flow * trip_min / 60}} = {{n: flow * trip_min / 60}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: a misread of the graph value (about 300 kg too low).

      - **{{d2}} kg**: a misread of the graph value (about 500 kg too low).

      - **{{d3}} kg**: a misread of the graph value (about 300 kg too high).

      - **{{d4}} kg**: uses the trip time in minutes without dividing by 60, so
      the result is far too large.
- id: QZNNDZBR
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334756
    - AVEXAM-90101
    - ATPLGS-626104
    - AVEXAM-95918
    - ATPLGS-622533
    - AVEXAM-56563
    - AVEXAM-8090
    - AVEXAM-31383
    - BGS-331233
    - AVEXAM-12251
    - AVEXAM-2449
    - ATPLGS-126689
  annexes: []
  learningObjectives:
    - 033.03.02.04.02
  template:
    type: calculation
    question: >-
      Given the following information for a Commercial Air Transport operation,
      calculate the maximum possible extra fuel, including any fuel penalty,
      that can be uplifted.


      - MTOM: {{mtom}} lb

      - MLM: {{mlm}} lb

      - MZFM: {{mzfm}} lb

      - DOM: {{dom}} lb

      - Traffic Load: {{tl}} lb

      - Trip Fuel: {{trip}} lb

      - Planned T/O Fuel: {{tof}} lb

      - Taxi Fuel: {{taxi}} lb

      - Fuel penalty for carrying extra fuel: {{pen}} lb per 1000 lb of extra
      fuel

      - Fuel tank capacity: {{tank}} lb
    variables:
      - id: mtom
        label: MTOM
        unit: lb
      - id: mlm
        label: MLM
        unit: lb
      - id: mzfm
        label: MZFM
        unit: lb
      - id: dom
        label: DOM
        unit: lb
      - id: tl
        label: Traffic load
        unit: lb
      - id: trip
        label: Trip fuel
        unit: lb
      - id: tof
        label: Planned take-off fuel
        unit: lb
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: pen
        label: Fuel penalty
        unit: lb per 1000 lb
      - id: tank
        label: Tank capacity
        unit: lb
    answer:
      formula: min(mtom - (dom + tl + tof), (mlm - (dom + tl + tof - trip)) / (1 - pen
        / 1000), tank - tof - taxi)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mzfm - (dom + tl)
      - id: d2
        formula: mtom - (dom + tl + tof) + taxi
      - id: d3
        formula: (mlm - (dom + tl + tof - trip)) * (1 + pen / 1000)
      - id: d4
        formula: tank - tof
    presets:
      - id: p1
        values:
          mtom: 875000
          mlm: 652000
          mzfm: 555100
          dom: 394100
          tl: 109350
          trip: 289750
          tof: 315315
          taxi: 1600
          pen: 470
          tank: 377750
      - id: p2
        values:
          mtom: 875000
          mlm: 652000
          mzfm: 555100
          dom: 394100
          tl: 109350
          trip: 289750
          tof: 315315
          taxi: 1600
          pen: 470
          tank: 372000
      - id: p3
        values:
          mtom: 875000
          mlm: 652000
          mzfm: 555100
          dom: 394100
          tl: 106000
          trip: 289750
          tof: 315315
          taxi: 1600
          pen: 470
          tank: 377750
    explanation: >-
      Extra fuel is limited by the headroom to MTOM, to MLM (divided by one
      minus the penalty fraction, since part of the extra fuel is burnt) and to
      the tank capacity after taxi fuel. The zero fuel mass limit does not
      restrict fuel. The smallest value applies.


      **Solution**


      Take-off mass headroom = {{f: mtom - (dom + tl + tof)}} = {{n: mtom - (dom
      + tl + tof)}} lb

      Landing mass headroom with penalty = {{= (mlm - (dom + tl + tof - trip)) /
      (1 - pen / 1000)}} lb

      Tank headroom = {{= tank - tof - taxi}} lb


      The smallest value limits the extra fuel: **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: this is the MZFM margin, which does not limit the fuel
      load.

      - **{{d2}} lb**: take-off mass headroom with the taxi fuel wrongly added
      back.

      - **{{d3}} lb**: the penalty is applied the wrong way (multiplied instead
      of divided by one minus the fraction) to the landing headroom.

      - **{{d4}} lb**: tank headroom without subtracting taxi fuel.
