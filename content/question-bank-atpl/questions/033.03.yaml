  template:
    type: calculation
    question: >-
      A twin-engined turbojet is being operated for a Commercial Air Transport
      flight. The Reduced Contingency Fuel (RCF) procedure is being applied.
      Given the following information, find the sum of the minimum required Trip
      Fuel and Contingency Fuel.


      Route: from DEP to original destination A via decision point DP, with
      optional refuel destination B.


      - Trip Fuel DEP-A via DP: {{trip_a}} kg

      - Trip Fuel DEP-B via DP: {{trip_b}} kg

      - Fuel DP-A: {{dp_a}} kg


      A alternate: not planned

      B alternate: not planned

      Fuel ERA: not planned

      Additional Fuel: not required

      Extra Fuel: not required
    variables:
      - id: trip_a
        label: Trip fuel DEP-A via DP
        unit: kg
      - id: trip_b
        label: Trip fuel DEP-B via DP
        unit: kg
      - id: dp_a
        label: Fuel DP-A
        unit: kg
    answer:
      formula: trip_a + 0.05 * dp_a
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: trip_b * 1.05
      - id: d2
        formula: trip_a * 1.05
      - id: d3
        formula: trip_a + 0.05 * trip_b
    presets:
      - id: p1
        values:
          trip_a: 6000
          trip_b: 4000
          dp_a: 3000
      - id: p2
        values:
          trip_a: 8000
          trip_b: 5500
          dp_a: 3600
      - id: p3
        values:
          trip_a: 5200
          trip_b: 3900
          dp_a: 2400
    explanation: >-
      Under the Reduced Contingency Fuel procedure the trip fuel is that of the
      original destination via the DP, and the contingency is only 5% of the
      fuel from the DP to that destination.


      **Solution**


      Contingency = 5% of {{dp_a}} = {{= 0.05 * dp_a}} kg


      {{f: trip_a + 0.05 * dp_a}} = {{n: trip_a + 0.05 * dp_a}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the trip fuel to the optional refuel destination B
      with 5% contingency.

      - **{{d2}} kg**: applies 5% contingency to the whole trip fuel instead of
      only the DP to A portion.

      - **{{d3}} kg**: applies the 5% to the trip fuel to B instead of the DP to
      A fuel.
