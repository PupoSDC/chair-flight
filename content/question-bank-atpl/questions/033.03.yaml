  template:
    type: chart-calculation
    question: >-
      Refer to the climb chart in the figure. Given:


      Brake release mass: 58 000 kg

      Temperature: ISA +15 °C


      The chart reading at FL300 is {{fa}} kg and at the aerodrome elevation of
      4000 ft is {{fb}} kg. The fuel required to climb from the aerodrome to
      FL300 is:
    variables:
      - id: fa
        label: Chart fuel to climb to FL300
        unit: kg
      - id: fb
        label: Chart fuel to climb to 4000 ft
        unit: kg
    chartInputs:
      - fa
      - fb
    answer:
      formula: fa - fb
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fa
      - id: d2
        formula: fb
      - id: d3
        formula: fa + fb
      - id: d4
        formula: (fa - fb) * 1.1
    presets:
      - id: p1
        values:
          fa: 1500
          fb: 250
      - id: p2
        values:
          fa: 1600
          fb: 300
    explanation: >-
      The climb chart gives cumulative fuel from sea level. The fuel needed from
      the aerodrome is the chart value at the top of climb minus the value at
      the aerodrome elevation.


      **Solution**


      {{f: fa - fb}} = {{n: fa - fb}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the airfield elevation correction was not subtracted.

      - **{{d2}} kg**: only the airfield value.

      - **{{d3}} kg**: the two chart values were added.

      - **{{d4}} kg**: the correct difference inflated by 10 %.
