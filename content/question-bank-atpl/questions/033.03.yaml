      **Why the other answers are wrong**


      - **{{d1}} litres**: uses the imperial gallon (4.546 l) instead of the US
      gallon.

      - **{{d2}} litres**: divides by 3.785 instead of multiplying (this is the
      conversion from litres to US gallons).

      - **{{d3}} litres**: uses the imperial gallon and divides instead of
      multiplying.
