- id: QRWWPMHG
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339867
    - AVEXAM-8802
    - BGS-331441
    - ATPLGS-628482
    - BGS-331294
  annexes: []
  learningObjectives:
    - 033.03.01.01.03
  template:
    type: calculation
    question: |-
      Determine the maximum attainable range, given the following information:

      - Average fuel flow: {{ff}} lb/h
      - Available fuel: {{fuel}} lb
      - TAS: {{tas}} kt
      - Wind component: {{tw}} kt tailwind

      Do not consider final reserve, contingency or alternate fuel.
    variables:
      - id: ff
        label: Fuel flow
        unit: lb/h
      - id: fuel
        label: Available fuel
        unit: lb
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: (tas + tw) * round(fuel / ff * 60) / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: tas * round(fuel / ff * 60) / 60
      - id: d2
        formula: (tas + tw) * (floor(fuel / ff) + round((fuel / ff - floor(fuel / ff)) *
          100) / 60)
      - id: d3
        formula: (tas - tw) * (floor(fuel / ff) + round((fuel / ff - floor(fuel / ff)) *
          100) / 60)
      - id: d4
        formula: (tas - tw) * round(fuel / ff * 60) / 60
    presets:
      - id: p1
        values:
          ff: 80
          fuel: 270
          tas: 89
          tw: 10
      - id: p2
        values:
          ff: 70
          fuel: 250
          tas: 95
          tw: 15
      - id: p3
        values:
          ff: 60
          fuel: 215
          tas: 85
          tw: 20
    explanation: >-
      The maximum flight time (endurance) is the available fuel divided by the
      fuel flow. The range is the distance covered in that time at the ground
      speed, which for a tailwind is TAS plus the wind component.


      **Solution**


      Endurance: {{f: fuel / ff}} = {{n: fuel / ff}} h = {{= fuel / ff * 60}}
      min


      Ground speed: {{f: tas + tw}} = {{n: tas + tw}} kt


      Range: {{f: (tas + tw) * round(fuel / ff * 60) / 60}} = {{n: (tas + tw) *
      round(fuel / ff * 60) / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses TAS only and ignores the tailwind.

      - **{{d2}} NM**: converts the decimal part of the endurance directly into
      minutes (for example 2.41 h read as 2 h 41 min) and so overestimates the
      time.

      - **{{d3}} NM**: subtracts the wind instead of adding it and also misreads
      the decimal hours as minutes.

      - **{{d4}} NM**: subtracts the tailwind as if it were a headwind.
