- id: QGFUEQZF
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339765
    - AVEXAM-59427
    - BGS-330764
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      The maximum fuel capacity of an aircraft is {{maxfuel}} lb, and the pilot
      has to order fuel to fill up en route to the final destination.


      The pilot estimates landing at the fuelling point with {{fob}} lb on
      board.


      How many {{drum}} Imperial gallon fuel drums must be ordered if the fuel
      supplier states a specific gravity of {{sg}}?
    variables:
      - id: maxfuel
        label: Max fuel capacity
        unit: lb
      - id: fob
        label: Fuel on board at landing
        unit: lb
      - id: drum
        label: Drum volume
        unit: Imp gal
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: ceil((maxfuel - fob) / (drum * sg * 10))
      unit: drums
      decimals: 0
    distractors:
      - id: d1
        formula: drum * 4.546 * sg
      - id: d2
        formula: floor((maxfuel - fob) / (drum * sg * 4.546))
      - id: d3
        formula: ceil((maxfuel - fob) / (drum * sg * 8.345))
      - id: d4
        formula: ceil((maxfuel - fob) / (drum * sg * 4.546))
    presets:
      - id: p1
        values:
          maxfuel: 1200
          fob: 350
          drum: 40
          sg: 0.78
      - id: p2
        values:
          maxfuel: 1500
          fob: 400
          drum: 40
          sg: 0.8
      - id: p3
        values:
          maxfuel: 1000
          fob: 200
          drum: 40
          sg: 0.78
    explanation: >-
      The fuel to uplift is the difference between the maximum capacity and the
      fuel already on board. One Imperial gallon of water weighs 10 lb, so a
      drum of fuel weighs drum volume × 10 lb × specific gravity. The number of
      drums is rounded up, because a part-drum cannot be ordered.


      **Solution**


      Fuel to uplift: {{f: maxfuel - fob}} = {{n: maxfuel - fob}} lb


      Weight of one drum: {{f: drum * sg * 10}} = {{n: drum * sg * 10}} lb


      Drums: {{f: ceil((maxfuel - fob) / (drum * sg * 10))}} = {{n:
      ceil((maxfuel - fob) / (drum * sg * 10))}} = **{{answer}} drums**


      **Why the other answers are wrong**


      - **{{d1}} drums**: this is the weight of one drum in kg (litres ×
      specific gravity), not the number of drums.

      - **{{d2}} drums**: mixes the lb quantity with a drum weight in kg and
      rounds down instead of up.

      - **{{d3}} drums**: uses the weight of one US gallon of water (8.345 lb)
      instead of the Imperial gallon (10 lb).

      - **{{d4}} drums**: mixes the lb quantity with a drum weight in kg.
