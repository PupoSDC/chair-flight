- id: QNYQZWHN
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337690
    - BGS-330329
    - BGS-330327
    - AVEXAM-51734
    - ATPLGS-626629
    - AVEXAM-35411
    - AVEXAM-92879
    - BGS-330328
    - AVEXAM-93264
    - AVEXAM-83070
    - BGS-330326
    - AVEXAM-70980
    - ATPLGS-123241
    - BGS-330330
    - BGS-330331
    - AVEXAM-74192
    - AVEXAM-45740
  annexes: []
  learningObjectives:
    - 033.03.02.03.08
  template:
    type: chart-calculation
    question: >-
      (Use the annex.) The flight crew of a turbojet aeroplane prepares a flight
      of 3 500 NM at FL 310, TAS 450 kt, headwind component 55 kt, planned
      take-off mass (without extra fuel) 180 000 kg.


      Fuel price at destination: {{price_dest}} $/l.


      The commander may carry {{extra}} kg more fuel than that which is
      necessary.


      According to the annex, carrying this extra fuel causes an additional
      consumption of {{burn}} kg during the flight.


      For this fuel transport operation to be cost effective, the maximum fuel
      price at departure must be ($/l, 2 decimals):
    variables:
      - id: price_dest
        label: Fuel price at destination
        unit: $/l
      - id: extra
        label: Extra fuel carried
        unit: kg
      - id: burn
        label: Additional consumption caused by the extra fuel (read from annex)
        unit: kg
    chartInputs:
      - burn
    answer:
      formula: price_dest * (extra - burn) / extra
      unit: $/l
      decimals: 2
    distractors:
      - id: d1
        formula: price_dest
      - id: d2
        formula: price_dest * (extra + burn) / extra
      - id: d3
        formula: price_dest * (extra + burn / 2) / extra
      - id: d4
        formula: price_dest * (extra - burn / 2) / extra
      - id: d5
        formula: price_dest * burn / extra
    presets:
      - id: p1
        values:
          price_dest: 0.27
          extra: 8000
          burn: 900
    explanation: >-
      Carrying extra fuel is only cost effective if its purchase cost at
      departure is lower than the value of the part of it that is still on board
      at destination. Part of the extra fuel is burnt to carry itself, so only
      (extra - burn) / extra of it arrives.


      **Solution**


      Fraction arriving = {{= (extra - burn) / extra}}


      Maximum price = {{f: price_dest * (extra - burn) / extra}} = {{n:
      price_dest * (extra - burn) / extra}} = **{{answer}} $/l**


      **Why the other answers are wrong**


      - **{{d1}} $/l**: the burn-off penalty is ignored (price at destination).

      - **{{d2}} $/l**: the extra burn is added instead of subtracted.

      - **{{d3}} $/l**: only half of the extra burn is added.

      - **{{d4}} $/l**: only half of the extra burn is deducted.

      - **{{d5}} $/l**: price is multiplied by the burnt fraction instead of the
      remaining fraction.
