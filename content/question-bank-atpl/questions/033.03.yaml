    - 033.03.03.01.02
  template:
    type: calculation
    question: >-
      Given the following information, what is the contingency fuel required for
      a twin-engined jet? For an IFR flight from the departure aerodrome A to
      the destination aerodrome B, the decision point procedure has to be
      applied, considering a Decision Point DP and an optional refuel
      destination C.


      - Distance from A to B: {{dab}} NM

      - Distance from A to C: {{dac}} NM

      - Distance from A to DP: {{ddp}} NM

      - TAS: {{tas}} kt

      - Fuel flow: {{ff}} kg/h

      - Headwind component: {{hw}} kt


      Give the contingency fuel in kg.
    variables:
      - id: dab
        label: Distance A to B
        unit: NM
      - id: dac
        label: Distance A to C
        unit: NM
      - id: ddp
        label: Distance A to DP
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: ff
        label: Fuel flow
        unit: kg/h
      - id: hw
        label: Headwind component
        unit: kt
    answer:
      formula: 0.05 * ff * (dab - ddp) / (tas - hw)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 0.05 * ff * dab / (tas - hw)
      - id: d2
        formula: 0.05 * ff * (dab - ddp) / tas
      - id: d3
        formula: 0.05 * ff * (dab - ddp) / (tas + hw)
      - id: d4
        formula: 0.05 * ff * (dac - ddp) / (tas - hw)
    presets:
      - id: p1
        values:
          dab: 1500
          dac: 800
          ddp: 710
          tas: 390
          ff: 2500
          hw: 35
      - id: p2
        values:
          dab: 1200
          dac: 700
          ddp: 600
          tas: 420
          ff: 2400
          hw: 20
      - id: p3
        values:
          dab: 1800
          dac: 900
          ddp: 850
          tas: 450
          ff: 2600
          hw: 50
    explanation: >-
      With the decision point procedure the contingency fuel is 5 % of the trip
      fuel from the decision point to the destination B (the longer of the two
      legs from DP). Trip fuel is flight time times fuel flow; the time uses the
      ground speed (TAS minus head wind).


      **Solution**


      Distance DP to B = {{dab}} - {{ddp}} = {{= dab - ddp}} NM


      Ground speed = {{tas}} - {{hw}} = {{= tas - hw}} kt


      {{f: 0.05 * ff * (dab - ddp) / (tas - hw)}} = {{n: 0.05 * ff * (dab - ddp)
      / (tas - hw)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the whole distance A to B was used instead of DP to B.

      - **{{d2}} kg**: the head wind was ignored (TAS used as ground speed).

      - **{{d3}} kg**: the wind was added instead of subtracted.

      - **{{d4}} kg**: the distance from DP to the alternate destination C
      direction was used instead of DP to B.
