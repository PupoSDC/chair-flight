- id: QTJSGBZG
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335480
    - BGS-331285
    - ATPLGS-627356
    - BGS-330909
    - AVEXAM-94481
  annexes:
    - 033-route-diagram-for-decision-point-fuel-planning
  learningObjectives:
    - 033.03.03.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to figure. A twin-jet aeroplane is operated for a Commercial Air
      Transport flight. The Reduced Contingency Fuel (RCF) procedure is applied,
      with contingency fuel of 5% of the trip fuel. Given the following
      information, find the sum of the required trip fuel and contingency fuel.


      - Distance DEP to DEST via DP (read from figure): {{dist}} NM

      - True airspeed: {{tas}} kt

      - Wind DEP-DP-DEST: {{tailwind}} kt tailwind

      - Fuel consumption: {{fuel_flow}} kg/h

      - Alternate fuel for DEST: {{alt_dest}} kg

      - Alternate fuel for alternate A: {{alt_a}} kg


      What is the sum of the required trip fuel and contingency fuel, in kg?
    variables:
      - id: dist
        label: Distance DEP to DEST via DP (read from figure)
        unit: NM
      - id: tas
        label: True airspeed
        unit: kt
      - id: tailwind
        label: Tailwind component
        unit: kt
      - id: fuel_flow
        label: Fuel consumption
        unit: kg/h
      - id: alt_dest
        label: Alternate fuel for DEST
        unit: kg
      - id: alt_a
        label: Alternate fuel for alternate A
        unit: kg
    chartInputs:
      - dist
    answer:
      formula: fuel_flow * dist / (tas + tailwind) * 1.05
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fuel_flow * dist / (tas + tailwind)
      - id: d2
        formula: fuel_flow * dist / (tas - tailwind) * 1.05
      - id: d3
        formula: fuel_flow * dist / (tas + tailwind) * 1.05 + alt_dest
      - id: d4
        formula: fuel_flow * dist / tas * 1.05
    presets:
      - id: p1
        values:
          dist: 974.9
          tas: 400
          tailwind: 50
          fuel_flow: 1500
          alt_dest: 1000
          alt_a: 900
      - id: p2
        values:
          dist: 800
          tas: 420
          tailwind: 30
          fuel_flow: 1400
          alt_dest: 1100
          alt_a: 950
    explanation: >-
      Trip fuel is the fuel burnt on the route. It follows from the distance,
      the groundspeed (true airspeed plus tailwind) and the fuel consumption.
      The reduced contingency fuel procedure adds 5% of the trip fuel as
      contingency. Alternate fuel is not part of this sum, so it is not added.


      **Solution**


      - Trip time: {{= dist / (tas + tailwind)}} h

      - Trip fuel: {{= fuel_flow * dist / (tas + tailwind)}} kg

      - Trip fuel plus 5% contingency: {{f: fuel_flow * dist / (tas + tailwind)
      * 1.05}} = {{n: fuel_flow * dist / (tas + tailwind) * 1.05}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the contingency fuel.

      - **{{d2}} kg**: subtracts the tailwind instead of adding it.

      - **{{d3}} kg**: adds the alternate fuel for the destination, which is not
      part of this sum.

      - **{{d4}} kg**: ignores the tailwind completely.
- id: QTKLPRZL
  docId: "033.03"
  relatedQuestions:
    - QZJVJJWI
  externalIds:
    - ATPLQ-334091
  annexes:
    - 033-fuel-penalty-factors-ecam-alert-table
  learningObjectives:
    - 033.03.02.04.03
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Due to a hydraulic failure, the landing gear of a
      transport category aircraft stays extended after take-off. Based on the
      flight planning data given below, calculate the time penalty for the
      flight, based on (standard) endurance.


      - Usable fuel: {{fuel}} metric tons

      - Fuel consumption: {{ff}} kg/h

      - Fuel consumption increase with gear extended, read from the figure:
      {{pen}} %
    variables:
      - id: fuel
        label: Usable fuel
        unit: t
      - id: ff
        label: Fuel consumption
        unit: kg/h
      - id: pen
        label: Fuel consumption increase
        unit: "%"
    chartInputs:
      - fuel
      - ff
      - pen
    answer:
      formula: fuel * 1000 / ff * (1 - 1 / (1 + pen / 100))
      unit: h
      decimals: 1
    distractors:
      - id: d1
        formula: fuel * 1000 / ff
      - id: d2
        formula: fuel * 1000 / ff / (1 + pen / 100)
      - id: d3
        formula: fuel * 1000 / ff * pen / 100
    presets:
      - id: p1
        values:
          fuel: 6
          ff: 2400
          pen: 185
      - id: p2
        values:
          fuel: 8
          ff: 3000
          pen: 185
      - id: p3
        values:
          fuel: 7
          ff: 2500
          pen: 185
    explanation: >-
      A failure such as an extended landing gear increases the fuel consumption
      by a given factor. The endurance becomes shorter by the same factor, and
      the time penalty is the difference between the standard and the penalised
      endurance.


      **Solution**


      Standard endurance: {{= fuel * 1000 / ff}} h


      Penalised endurance: {{= fuel * 1000 / ff / (1 + pen / 100)}} h


      {{f: fuel * 1000 / ff * (1 - 1 / (1 + pen / 100))}} = {{n: fuel * 1000 /
      ff * (1 - 1 / (1 + pen / 100))}} = **{{answer}} h**


      **Why the other answers are wrong**


      - **{{d1}} h**: is the standard endurance, not the penalty.

      - **{{d2}} h**: is the penalised endurance, not the time lost.

      - **{{d3}} h**: applies the percentage to the standard endurance directly
      instead of to the fuel consumption.
