- id: QDQPWKUC
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334718
    - AVEXAM-16271
    - ATPLGS-107860
    - BGS-330192
    - BGS-330562
    - ATPLGS-123080
  annexes: []
  learningObjectives:
    - 033.03.02.03.06
  template:
    type: calculation
    question: >-
      During a VFR flight at a navigational checkpoint the remaining usable fuel
      in the tanks is {{fuel}} US gal.


      The reserve fuel is {{res}} US gal.


      According to the flight plan the remaining flight time is {{t}} min.


      Calculate the highest acceptable rate of consumption for the rest of the
      trip.
    variables:
      - id: fuel
        label: Remaining usable fuel
        unit: US gal
      - id: res
        label: Reserve fuel
        unit: US gal
      - id: t
        label: Remaining flight time
        unit: min
    answer:
      formula: (fuel - res) / (t / 60)
      unit: US gal/h
      decimals: 1
    distractors:
      - id: d1
        formula: fuel / (t / 60)
      - id: d2
        formula: (fuel - res) / (1 + (t - 60) / 100)
      - id: d3
        formula: (fuel + res) / (t / 60)
      - id: d4
        formula: res / (t / 60)
    presets:
      - id: p1
        values:
          fuel: 60
          res: 12
          t: 95
      - id: p2
        values:
          fuel: 55
          res: 10
          t: 80
      - id: p3
        values:
          fuel: 48
          res: 8
          t: 150
    explanation: >-
      Only the fuel above the reserve can be burned, so the maximum consumption
      rate is the usable fuel above the reserve divided by the remaining time in
      hours.


      **Solution**


      {{f: (fuel - res) / (t / 60)}} = {{n: (fuel - res) / (t / 60)}} =
      **{{answer}} US gal/h**


      **Why the other answers are wrong**


      - **{{d1}} US gal/h**: the reserve was not deducted.

      - **{{d2}} US gal/h**: the minutes were treated as decimal hours (1 h 35
      min = 1.35 h).

      - **{{d3}} US gal/h**: the reserve was added instead of subtracted.

      - **{{d4}} US gal/h**: only the reserve fuel was divided by the time.
- id: QE9IBOZG8
  docId: "033.03"
  relatedQuestions:
