    - AVEXAM-8351
    - ATPLQ-337405
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Given the following information for a Commercial Air Transport flight,
      what is the time (in minutes) needed from the destination to the alternate
      aerodrome? Assume an operation with a Performance Class A aeroplane
      applying the Basic Fuel Scheme or with a helicopter (the basic fuel
      planning provisions are the same).


      - Missed approach at the destination: {{missed}} min

      - Climb to cruise level: {{climb}} min

      - Cruise distance: {{dist}} NM

      - Cruise TAS: {{tas}} kt

      - Wind component: {{wind}} kt (positive = tailwind, negative = headwind)

      - Anticipated hold at the alternate: {{hold}} min

      - Descent to the alternate: {{descent}} min

      - Approach to the alternate: {{approach}} min
    variables:
      - id: missed
        label: Missed approach
        unit: min
      - id: climb
        label: Climb
        unit: min
      - id: dist
        label: Cruise distance
        unit: NM
      - id: tas
        label: Cruise TAS
        unit: kt
      - id: wind
        label: Tailwind component
        unit: kt
      - id: hold
        label: Holding at alternate
        unit: min
      - id: descent
        label: Descent
        unit: min
      - id: approach
        label: Approach
        unit: min
    answer:
      formula: missed + climb + dist / (tas + wind) * 60 + hold + descent + approach
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: missed + climb + dist / tas * 60 + hold + descent + approach
      - id: d2
        formula: missed + climb + dist / (tas - wind) * 60 + hold + descent + approach
      - id: d3
        formula: missed + climb + dist / (tas + wind) * 60 + descent + approach
      - id: d4
        formula: missed + climb + dist / (tas + wind) + hold + descent + approach
    presets:
      - id: p1
        values:
          missed: 6
          climb: 8
          dist: 75
          tas: 145
          wind: -10
          hold: 12
          descent: 7
          approach: 6
      - id: p2
        values:
          missed: 6
          climb: 7
          dist: 130
          tas: 145
          wind: 10
          hold: 11
          descent: 7
          approach: 8
      - id: p3
        values:
          missed: 5
          climb: 5
          dist: 65
          tas: 145
          wind: 18
          hold: 20
          descent: 4
          approach: 5
      - id: p4
        values:
          missed: 6
          climb: 8
          dist: 55
          tas: 165
          wind: -10
          hold: 10
          descent: 6
          approach: 6
    explanation: >-
      The time from the destination to the alternate is the sum of the manoeuvre
      times at both aerodromes and the time flown on the cruise leg. The cruise
      time is the distance divided by the ground speed, and the ground speed is
      the TAS plus any tailwind (minus any headwind).


      **Solution**


      Cruise time: {{f: dist / (tas + wind) * 60}} = {{n: dist / (tas + wind) *
      60}} min


      Total: {{f: missed + climb + dist / (tas + wind) * 60 + hold + descent +
      approach}} = {{n: missed + climb + dist / (tas + wind) * 60 + hold +
      descent + approach}} = **{{answer}} min**


      **Why the other answers are wrong**

      - **{{d1}} min**: ignores the wind component.

      - **{{d2}} min**: reverses the sign of the wind component.

      - **{{d3}} min**: leaves out the holding time at the alternate.

      - **{{d4}} min**: adds the cruise time in hours instead of converting it
      to minutes.
