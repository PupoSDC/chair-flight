- id: QMIYEVIQ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334250
    - AVEXAM-65391
    - AVEXAM-97517
    - AVEXAM-25342
  annexes: []
  learningObjectives:
    - 033.03.02.01.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Before departure, the APU is run for {{apu_min}}
      minutes. The taxi time is expected to be {{taxi_min}} minutes. The APU
      uses an additional {{start}} kg of fuel to start. From the figure: APU
      fuel flow {{apu_ff}} kg/h, taxi fuel flow {{taxi_ff}} kg/h.


      Calculate the fuel consumption on the ground (kg).
    variables:
      - id: apu_min
        label: APU running time
        unit: min
      - id: taxi_min
        label: Taxi time
        unit: min
      - id: start
        label: APU start fuel
        unit: kg
      - id: apu_ff
        label: APU fuel flow (read from figure)
        unit: kg/h
      - id: taxi_ff
        label: Taxi fuel flow (read from figure)
        unit: kg/h
    chartInputs:
      - apu_ff
      - taxi_ff
    answer:
      formula: apu_ff * apu_min / 60 + taxi_ff * taxi_min / 60 + start
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: apu_ff * apu_min / 60 + taxi_ff * taxi_min / 60
      - id: d2
        formula: taxi_ff * taxi_min / 60 + start
      - id: d3
        formula: taxi_ff * (apu_min + taxi_min) / 60 + apu_ff * apu_min / 60 + start
      - id: d4
        formula: apu_ff * (apu_min + taxi_min) / 60 + taxi_ff * taxi_min / 60 + start
    presets:
      - id: p1
        values:
          apu_min: 15
          taxi_min: 10
          start: 5
          apu_ff: 100
          taxi_ff: 684
      - id: p2
        values:
          apu_min: 20
          taxi_min: 12
          start: 5
          apu_ff: 110
          taxi_ff: 650
      - id: p3
        values:
          apu_min: 10
          taxi_min: 15
          start: 8
          apu_ff: 120
          taxi_ff: 700
    explanation: >-
      Ground fuel is the sum of the fuel burned by the APU during its running
      time, the fuel burned by the engines while taxiing, and the extra APU
      start fuel. Each flow in kg/h is multiplied by the time in hours.


      **Solution**


      APU: {{= apu_ff * apu_min / 60}} kg; taxi: {{= taxi_ff * taxi_min / 60}}
      kg; start: {{start}} kg


      {{f: apu_ff * apu_min / 60 + taxi_ff * taxi_min / 60 + start}} = {{n:
      apu_ff * apu_min / 60 + taxi_ff * taxi_min / 60 + start}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: The APU start fuel was forgotten.

      - **{{d2}} kg**: The APU fuel was forgotten.

      - **{{d3}} kg**: The taxi fuel flow was applied for the APU time plus taxi
      time.

      - **{{d4}} kg**: The APU was assumed to run during the taxi time as well.
- id: QMKSXBWP
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334050
    - AVEXAM-95847
    - BGS-339900
    - ATPLGS-107888
    - BGS-330276
    - AVEXAM-98649
  annexes:
    - CAP-697-page-20
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      A flight has to be made with the single-engine sample aeroplane (use the
      Flight Planning Manual SEP 1 fuel flow table).


      For the fuel calculation allow {{taxi}} lb fuel for start-up and taxi,
      {{climbt}} minutes and {{climbf}} lb of additional fuel to allow for the
      climb, and 10 minutes with no fuel correction for the descent.


      The planned flight time overhead to overhead is {{h}} h {{m}} min.


      Reserve fuel is 30% of the trip fuel.


      The cruise fuel flow read from the table for the given power setting,
      flight level and temperature is {{ff}} lb/h.


      The minimum block fuel is:
    variables:
      - id: taxi
        label: Start-up and taxi fuel
        unit: lb
      - id: climbt
        label: Climb time
        unit: min
      - id: climbf
        label: Climb additional fuel
        unit: lb
      - id: h
        label: Flight time hours
        unit: h
      - id: m
        label: Flight time minutes
        unit: min
      - id: ff
        label: Fuel flow read from the table
        unit: lb/h
    chartInputs:
      - ff
    answer:
      formula: taxi + 1.3 * (climbf + ff * (h * 60 + m - climbt) / 60)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + climbf + ff * (h * 60 + m - climbt) / 60
      - id: d2
        formula: taxi + 1.3 * (climbf + ff * (h * 60 + m) / 60)
      - id: d3
        formula: 1.3 * (climbf + ff * (h * 60 + m - climbt) / 60)
      - id: d4
        formula: taxi + climbf + 1.3 * ff * (h * 60 + m - climbt) / 60
    presets:
      - id: p1
        values:
          taxi: 10
          climbt: 3
          climbf: 10
          h: 3
          m: 12
          ff: 73.7
      - id: p2
        values:
          taxi: 10
          climbt: 3
          climbf: 10
          h: 2
          m: 30
          ff: 76.1
    explanation: >-
      Block fuel = start-up/taxi fuel + trip fuel + reserve. The trip fuel is
      the climb fuel plus the cruise fuel flow (read from the table) times the
      remaining flight time after the climb; the reserve is 30 % of the trip
      fuel.


      **Solution**


      Cruise time = {{h}} h {{m}} min - {{climbt}} min = {{= h * 60 + m -
      climbt}} min

      Trip fuel = {{climbf}} + {{ff}} * {{= h * 60 + m - climbt}} / 60 = {{=
      climbf + ff * (h * 60 + m - climbt) / 60}} lb


      {{f: taxi + 1.3 * (climbf + ff * (h * 60 + m - climbt) / 60)}} = {{n: taxi
      + 1.3 * (climbf + ff * (h * 60 + m - climbt) / 60)}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: forgets the 30 % reserve.

      - **{{d2}} lb**: does not subtract the climb time from the cruise time.

      - **{{d3}} lb**: forgets the start-up and taxi fuel.

      - **{{d4}} lb**: applies the 30 % reserve only to the cruise fuel, not to
      the climb fuel.
