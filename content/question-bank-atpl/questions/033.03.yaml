- id: QIDJNWDT
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333511
    - ATPLGS-113521
    - BGS-330751
    - ATPLGS-629292
    - BGS-331403
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes what is the total fuel required for a
      Commercial Air Transport flight with a multi-engined piston aircraft under
      IFR? Assume the Basic Fuel Scheme WITHOUT variations applies.


      - Trip Fuel: {{trip}} litres

      - Destination Alternate Fuel: {{altf}} litres

      - Taxi Fuel: {{taxi}} litres

      - Fuel flow: {{ff}} litres per hour


      Extra Fuel: 0 litres

      Discretionary Fuel: 0 litres
    variables:
      - id: trip
        label: Trip fuel
        unit: litres
      - id: altf
        label: Alternate fuel
        unit: litres
      - id: taxi
        label: Taxi fuel
        unit: litres
      - id: ff
        label: Fuel flow
        unit: litres/h
    answer:
      formula: taxi + trip + 0.05 * trip + altf + 0.75 * ff
      unit: litres
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip + altf + 0.75 * ff
      - id: d2
        formula: taxi + trip + 0.1 * trip + altf + 0.75 * ff
      - id: d3
        formula: taxi + trip + 0.05 * trip + altf + 0.5 * ff
    presets:
      - id: p1
        values:
          trip: 83
          altf: 18
          taxi: 5
          ff: 35
      - id: p2
        values:
          trip: 120
          altf: 25
          taxi: 6
          ff: 40
      - id: p3
        values:
          trip: 60
          altf: 12
          taxi: 4
          ff: 30
    explanation: >-
      Under the Basic Fuel Scheme the total fuel is taxi fuel + trip fuel +
      contingency fuel + alternate fuel + final reserve fuel (+ extra and
      discretionary fuel, here zero). Contingency is 5% of trip fuel. For a
      piston-engine aeroplane the final reserve is 45 minutes at normal cruise
      consumption.


      **Solution**


      Contingency = 0.05 × {{trip}} = {{= 0.05 * trip}} litres

      Final reserve = 0.75 h × {{ff}} litres/h = {{= 0.75 * ff}} litres

      {{f: taxi + trip + 0.05 * trip + altf + 0.75 * ff}} = {{n: taxi + trip +
      0.05 * trip + altf + 0.75 * ff}} = **{{answer}} litres**


      **Why the other answers are wrong**

      - **{{d1}} litres**: contingency fuel is forgotten.

      - **{{d2}} litres**: contingency fuel is counted twice (10% instead of
      5%).

      - **{{d3}} litres**: final reserve of 30 minutes (turbine rule) used
      instead of 45 minutes for a piston aeroplane.
