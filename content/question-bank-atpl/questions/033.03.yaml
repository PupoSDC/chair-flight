  template:
    type: calculation
    question: >-
      Calculate the minimum usable fuel required for a commercial air transport
      flight. Assume the Basic Fuel Scheme without variations applies.


      - Taxi time: {{taxi_min}} min, taxi fuel flow: {{taxi_ff}} kg/min

      - APU time: {{apu_min}} min, APU fuel flow: {{apu_ff}} kg/h

      - Trip fuel plus contingency fuel: {{trip_cont}} kg

      - Destination alternate fuel: {{alt}} kg

      - Final reserve fuel: {{frf}} kg

      - Extra fuel: {{extra}} kg

      - Discretionary fuel: {{disc}} kg


      What is the minimum usable fuel?
    variables:
      - id: taxi_min
        label: Taxi time
        unit: min
      - id: taxi_ff
        label: Taxi fuel flow
        unit: kg/min
      - id: apu_min
        label: APU time
        unit: min
      - id: apu_ff
        label: APU fuel flow
        unit: kg/h
      - id: trip_cont
        label: Trip and contingency fuel
        unit: kg
      - id: alt
        label: Destination alternate fuel
        unit: kg
      - id: frf
        label: Final reserve fuel
        unit: kg
      - id: extra
        label: Extra fuel
        unit: kg
      - id: disc
        label: Discretionary fuel
        unit: kg
    answer:
      formula: taxi_min * taxi_ff + apu_min * apu_ff / 60 + trip_cont + alt + frf +
        extra + disc
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi_min * taxi_ff + trip_cont + alt + frf + extra + disc
      - id: d2
        formula: apu_min * apu_ff / 60 + trip_cont + alt + frf + extra + disc
      - id: d3
        formula: taxi_min * taxi_ff + apu_min * apu_ff + trip_cont + alt + frf + extra +
          disc
      - id: d4
        formula: taxi_min * taxi_ff + apu_min * apu_ff / 60 + trip_cont + alt + extra +
          disc
    presets:
      - id: p1
        values:
          taxi_min: 13
          taxi_ff: 11
          apu_min: 38
          apu_ff: 115
          trip_cont: 5420
          alt: 1400
          frf: 1250
          extra: 0
          disc: 0
      - id: p2
        values:
          taxi_min: 15
          taxi_ff: 12
          apu_min: 25
          apu_ff: 120
          trip_cont: 6100
          alt: 1200
          frf: 1300
          extra: 300
          disc: 200
      - id: p3
        values:
          taxi_min: 10
          taxi_ff: 10
          apu_min: 45
          apu_ff: 110
          trip_cont: 4800
          alt: 1100
          frf: 1150
          extra: 0
          disc: 100
    explanation: >-
      The usable fuel is the fuel that can be used by the engines. It is the
      taxi fuel plus the APU fuel burned before take-off, plus the trip,
      contingency, alternate, final reserve, extra and discretionary fuel. The
      APU flow is given per hour, so it is divided by 60 to get the fuel per
      minute.


      **Solution**


      Taxi fuel: {{taxi_min}} min x {{taxi_ff}} kg/min = {{= taxi_min *
      taxi_ff}} kg


      APU fuel: {{apu_min}} min x {{apu_ff}} kg/h / 60 = {{= apu_min * apu_ff /
      60}} kg


      {{f: taxi_min * taxi_ff + apu_min * apu_ff / 60 + trip_cont + alt + frf +
      extra + disc}} = {{n: taxi_min * taxi_ff + apu_min * apu_ff / 60 +
      trip_cont + alt + frf + extra + disc}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the APU fuel.

      - **{{d2}} kg**: forgets the taxi fuel.

      - **{{d3}} kg**: uses the APU fuel flow per hour with the time in minutes,
      a unit mistake.

      - **{{d4}} kg**: forgets the final reserve fuel.
- id: QWNFKWQE
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332383
    - ATPLGS-625275
    - BGS-331280
    - BGS-331022
    - BGS-330910
    - AVEXAM-2131
