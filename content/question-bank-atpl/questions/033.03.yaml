- id: QHVEEO4RJ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332909
    - BGS-330864
    - ATPLGS-126813
    - AVEXAM-88876
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: During the pre-flight preparation, the pilot calculates a take-off
      fuel of {{usg}} US gallons. Considering a fuel density of {{dens}} lb per
      US gallon, this equals how many kilograms?
    variables:
      - id: usg
        label: Fuel volume
        unit: US gal
      - id: dens
        label: Fuel density
        unit: lb/US gal
    answer:
      formula: usg * dens / 2.2046
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: usg / 2.2046
      - id: d2
        formula: usg * dens * 2.2046
      - id: d3
        formula: usg * dens
    presets:
      - id: p1
        values:
          usg: 53
          dens: 6
      - id: p2
        values:
          usg: 85
          dens: 6.7
      - id: p3
        values:
          usg: 120
          dens: 6
    explanation: >-
      Multiplying the volume by the density in lb per US gallon gives the mass
      in pounds. Dividing by 2.2046 converts pounds to kilograms.


      **Solution**


      {{f: usg * dens / 2.2046}} = {{n: usg * dens / 2.2046}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the density is ignored; the volume is converted as if it
      were a mass in lb.

      - **{{d2}} kg**: multiplies by 2.2046 instead of dividing, converting kg
      to lb the wrong way.

      - **{{d3}} kg**: this is the mass in lb; the conversion to kg is missing.
