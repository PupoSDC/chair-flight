  template:
    type: calculation
    question: >-
      For pre-flight planning purposes what is the block fuel required? Assume
      the Basic Fuel Scheme WITHOUT variations applies.


      - Taxi fuel: {{taxi}} kg

      - Trip fuel: {{trip}} kg

      - Contingency fuel: {{cont}}% of the Trip fuel

      - Final reserve fuel: {{fr}} kg

      - Alternate fuel: {{alt}} kg

      - Discretionary fuel: {{disc}} kg

      - Extra fuel: {{extra}} kg
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: cont
        label: Contingency percentage
        unit: "%"
      - id: fr
        label: Final reserve fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: disc
        label: Discretionary fuel
        unit: kg
      - id: extra
        label: Extra fuel
        unit: kg
    answer:
      formula: taxi + trip * (1 + cont / 100) + fr + alt + disc + extra
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip * (1 + cont / 100) + fr + alt + extra
      - id: d2
        formula: trip * (1 + cont / 100) + fr + alt + disc + extra
      - id: d3
        formula: taxi + trip + fr + alt + disc + extra
    presets:
      - id: p1
        values:
          taxi: 350
          trip: 85000
          cont: 5
          fr: 3000
          alt: 5500
          disc: 1500
          extra: 0
      - id: p2
        values:
          taxi: 400
          trip: 62000
          cont: 5
          fr: 2800
          alt: 4200
          disc: 1000
          extra: 0
      - id: p3
        values:
          taxi: 300
          trip: 48000
          cont: 5
          fr: 2400
          alt: 3800
          disc: 800
          extra: 0
    explanation: >-
      Block fuel is the total fuel loaded for the flight: taxi fuel, trip fuel,
      contingency fuel, alternate fuel, final reserve fuel, plus any
      discretionary and extra fuel.


      **Solution**


      Contingency fuel = {{= trip * cont / 100}} kg


      {{f: taxi + trip * (1 + cont / 100) + fr + alt + disc + extra}} = {{n:
      taxi + trip * (1 + cont / 100) + fr + alt + disc + extra}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the discretionary fuel is left out.

      - **{{d2}} kg**: the taxi fuel is left out.

      - **{{d3}} kg**: the contingency fuel is left out.
- id: QYJGEUOXY
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335816
    - AVEXAM-76879
    - ATPLGS-113519
    - AVEXAM-19380
    - BGS-331285
    - ATPLGS-629366
    - BGS-330899
    - AVEXAM-2792
    - AVEXAM-86055
    - ATPLGS-113520
    - AVEXAM-34083
    - AVEXAM-20527
    - BGS-331404
    - AVEXAM-10833
    - BGS-331353
    - ATPLGS-123147
    - BGS-330959
    - BGS-330898
    - ATPLGS-626631
    - BGS-330897
  annexes: []
  learningObjectives:
    - 033.03.01.01.04
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the total fuel required for the
      Commercial Air Transport flight in a Medium Range Jet Transport MRJT
      aeroplane, given the following information? Assume the Basic Fuel Scheme
      WITHOUT variations applies.


      Estimated taxi time: {{tdep}} minutes at the departure aerodrome and
      {{tdest}} minutes at the destination aerodrome

      APU fuel flow: 115 kg/h

      Taxi fuel flow: {{taxiff}} kg/min

      Planned APU usage at the parking position: Zero


      - Total trip distance: {{dist}} NM

      - Average fuel flow: {{ff}} kg/h

      - TAS: {{tas}} kt

      - Head wind component: {{hw}} kt

      - Contingency Fuel: {{cont}}% of the Trip Fuel

      - Alternate Fuel: {{alt}} kg

      - Holding fuel flow: {{holdff}} kg/h


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: tdep
        label: Departure taxi time
        unit: min
      - id: tdest
        label: Destination taxi time
        unit: min
      - id: taxiff
        label: Taxi fuel flow
        unit: kg/min
      - id: dist
        label: Trip distance
        unit: NM
      - id: ff
        label: Average fuel flow
        unit: kg/h
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Head wind component
        unit: kt
      - id: cont
        label: Contingency percentage
        unit: "%"
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: holdff
        label: Holding fuel flow
        unit: kg/h
    answer:
      formula: tdep * taxiff + dist / (tas - hw) * ff * (1 + cont / 100) + alt +
        holdff * 0.5
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (tas - hw) * ff * (1 + cont / 100) + alt + holdff * 0.5
      - id: d2
        formula: tdep * taxiff + dist / (tas - hw) * ff * (1 + cont / 100) + alt
      - id: d3
        formula: (tdep + tdest) * taxiff + dist / (tas - hw) * ff * (1 + cont / 100) +
          alt + holdff * 0.5
    presets:
      - id: p1
        values:
          tdep: 10
          tdest: 5
          taxiff: 11
          dist: 748
          ff: 2618
          tas: 421
          hw: 24
          cont: 5
          alt: 550
          holdff: 2250
      - id: p2
        values:
          tdep: 12
          tdest: 6
          taxiff: 10
          dist: 620
          ff: 2500
          tas: 430
          hw: 30
          cont: 5
          alt: 600
          holdff: 2300
      - id: p3
        values:
          tdep: 8
          tdest: 4
          taxiff: 12
          dist: 900
          ff: 2700
          tas: 440
          hw: 20
          cont: 5
          alt: 700
          holdff: 2400
    explanation: >-
      The total (block) fuel under the Basic Fuel Scheme is taxi fuel + trip
      fuel + contingency fuel + alternate fuel + final reserve fuel. Taxi fuel
      covers the departure taxi only (the APU is not used here), the trip fuel
      is based on the ground speed, and the final reserve for a jet is 30
      minutes at holding fuel flow.


      **Solution**


      Taxi fuel = {{tdep}} min × {{taxiff}} kg/min = {{= tdep * taxiff}} kg

      Ground speed = {{tas}} - {{hw}} = {{= tas - hw}} kt

      Trip fuel = {{dist}} / {{= tas - hw}} × {{ff}} = {{= dist / (tas - hw) *
      ff}} kg

      Contingency fuel = {{cont}}% of trip fuel = {{= dist / (tas - hw) * ff *
      cont / 100}} kg

      Final reserve fuel = 30 min × {{holdff}} kg/h = {{= holdff * 0.5}} kg


      {{f: tdep * taxiff + dist / (tas - hw) * ff * (1 + cont / 100) + alt +
      holdff * 0.5}} = {{n: tdep * taxiff + dist / (tas - hw) * ff * (1 + cont /
      100) + alt + holdff * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the departure taxi fuel is forgotten.

      - **{{d2}} kg**: the final reserve fuel (30 minutes of holding) is
      forgotten.

      - **{{d3}} kg**: the taxi time at the destination is also added, although
      only departure taxi fuel is part of the required fuel.
