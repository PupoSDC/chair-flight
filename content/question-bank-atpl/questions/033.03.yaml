- id: QWGJELMU
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331222
    - ATPLGS-106948
    - ATPLGS-106995
    - ATPLGS-107019
    - AVEXAM-28827
    - AVEXAM-44602
    - BGS-330301
    - AVEXAM-62392
    - AVEXAM-79645
    - BGS-331478
  annexes: []
  learningObjectives:
    - 033.03.02.03.06
  template:
    type: calculation
    question: |-
      Given:

      - Dry Operating Mass = {{dom}} kg
      - Traffic Load = {{tl}} kg
      - Trip Fuel = {{trip}} kg
      - Final Reserve Fuel = {{fin}} kg
      - Alternate Fuel = {{alt}} kg
      - Contingency Fuel = {{cont}} % of Trip Fuel

      What is the estimated landing mass at destination?
    variables:
      - id: dom
        label: Dry Operating Mass
        unit: kg
      - id: tl
        label: Traffic Load
        unit: kg
      - id: trip
        label: Trip Fuel
        unit: kg
      - id: fin
        label: Final Reserve Fuel
        unit: kg
      - id: alt
        label: Alternate Fuel
        unit: kg
      - id: cont
        label: Contingency percentage
        unit: "%"
    answer:
      formula: dom + tl + alt + fin + trip * cont / 100
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dom + tl + alt + fin
      - id: d2
        formula: dom + tl + trip + alt + fin + trip * cont / 100
      - id: d3
        formula: dom + tl + trip + alt + fin
      - id: d4
        formula: dom + tl + trip + fin + trip * cont / 100
    presets:
      - id: p1
        values:
          dom: 33510
          tl: 7600
          trip: 2040
          fin: 983
          alt: 1100
          cont: 5
      - id: p2
        values:
          dom: 34000
          tl: 8200
          trip: 2400
          fin: 900
          alt: 1200
          cont: 5
      - id: p3
        values:
          dom: 32800
          tl: 6900
          trip: 1800
          fin: 850
          alt: 1000
          cont: 5
    explanation: >-
      The estimated landing mass at destination is the take-off mass minus the
      trip fuel. Equivalently, it is the dry operating mass plus the traffic
      load plus the fuel that is still on board on landing: contingency,
      alternate and final reserve fuel.


      **Solution**


      Contingency fuel: {{= trip * cont / 100}} kg


      {{f: dom + tl + alt + fin + trip * cont / 100}} = {{n: dom + tl + alt +
      fin + trip * cont / 100}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: contingency fuel forgotten.

      - **{{d2}} kg**: this is the estimated take-off mass, not the landing
      mass.

      - **{{d3}} kg**: take-off mass without contingency fuel.

      - **{{d4}} kg**: alternate fuel left out and trip fuel left in.
