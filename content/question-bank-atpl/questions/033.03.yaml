        values:
          trip: 2300
          alt: 950
          taxi: 180
          res: 480
          five: 80
      - id: p2
        values:
          trip: 3100
          alt: 1200
          taxi: 150
          res: 600
          five: 95
      - id: p3
        values:
          trip: 1900
          alt: 800
          taxi: 100
          res: 400
          five: 70
    explanation: >-
      Under the Basic Fuel Scheme the contingency fuel is 5% of the planned trip
      fuel. Only the trip fuel is needed; the other values are not part of the
      contingency calculation.


      **Solution**


      {{f: trip * 0.05}} = {{n: trip * 0.05}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: 10% of the trip fuel instead of 5%.

      - **{{d2}} lb**: 3% of the trip fuel, a percentage that only applies when
      an en-route alternate is available (and with a minimum of 5 minutes of
      holding).

      - **{{d3}} lb**: the fuel for 5 minutes at 1500 ft is the minimum
      alternative to the percentage, but is not applicable here because it is
      lower than 5% of the trip fuel.
