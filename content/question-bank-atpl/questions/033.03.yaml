        values:
          ff: 2580
      - id: p2
        values:
          ff: 1850
      - id: p3
        values:
          ff: 2200
    explanation: >-
      Final reserve fuel for turbine-engined aeroplanes is the fuel for 30
      minutes of holding at 1500 ft above aerodrome elevation in ISA conditions,
      at the estimated mass on arrival. The holding fuel flow is read from the
      figure.


      **Solution**


      {{f: ff * 0.5}} = {{n: ff * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is the fuel for 60 minutes, not 30.

      - **{{d2}} kg**: this is the fuel for 45 minutes.

      - **{{d3}} kg**: this is the fuel for only 15 minutes.

      - **{{d4}} kg**: this is the fuel for only 20 minutes.
