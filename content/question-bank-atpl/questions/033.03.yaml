- id: Q2ECRCQPO
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332404
    - BGS-331285
    - ATPLGS-627356
    - BGS-331248
    - BGS-331353
    - AVEXAM-30646
  annexes:
    - 033-short-trip-simplified-fuel-and-time-planning-graph
  learningObjectives:
    - 033.03.03.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to figure. For pre-flight planning, calculate the total fuel
      required for a Commercial Air Transport flight with a Performance Class A
      aeroplane. Assume the Basic Fuel Scheme WITHOUT variations applies, with
      contingency fuel of 5 % of the trip fuel and a final reserve of 30 minutes
      of holding fuel. The weather at the destination is forecast to be below
      the applicable minima, but two alternates with suitable weather have been
      chosen. The flight's payload means that minimum block fuel will be taken.


      - Taxi fuel: {{taxi}} kg

      - Trip fuel (read from the figure for 250 NGM, 50 kt headwind and an
      expected landing mass of 65 000 kg): {{trip_fuel}} kg

      - Holding fuel flow: {{holding_flow}} kg/h

      - Destination alternate 1 fuel: {{alt_fuel_1}} kg

      - Destination alternate 2 fuel: {{alt_fuel_2}} kg

      - Additional, extra and discretionary fuel: 0 kg


      What is the total fuel required?
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip_fuel
        label: Trip fuel (read from figure)
        unit: kg
      - id: holding_flow
        label: Holding fuel flow
        unit: kg/h
      - id: alt_fuel_1
        label: Alternate 1 fuel
        unit: kg
      - id: alt_fuel_2
        label: Alternate 2 fuel
        unit: kg
    chartInputs:
      - trip_fuel
    answer:
      formula: taxi + 1.05 * trip_fuel + min(alt_fuel_1, alt_fuel_2) + 0.5 *
        holding_flow
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip_fuel + min(alt_fuel_1, alt_fuel_2) + 0.5 * holding_flow
      - id: d2
        formula: taxi + 1.05 * trip_fuel + max(alt_fuel_1, alt_fuel_2) + 0.5 *
          holding_flow
      - id: d3
        formula: taxi + 1.05 * trip_fuel + min(alt_fuel_1, alt_fuel_2)
      - id: d4
        formula: taxi + 1.05 * trip_fuel + min(alt_fuel_1, alt_fuel_2) + holding_flow
    presets:
      - id: p1
        values:
          taxi: 230
          trip_fuel: 2995.2
          holding_flow: 2400
          alt_fuel_1: 1230
          alt_fuel_2: 1950
    explanation: >-
      The total is built up block by block: taxi fuel, trip fuel, contingency
      fuel, alternate fuel and final reserve. With two alternates, the smaller
      of the two alternate fuel figures is carried.


      **Solution**


      - Contingency fuel: 5 % of {{trip_fuel}} kg

      - Total: {{f: taxi + 1.05 * trip_fuel + min(alt_fuel_1, alt_fuel_2) + 0.5
      * holding_flow}} = {{n: taxi + 1.05 * trip_fuel + min(alt_fuel_1,
      alt_fuel_2) + 0.5 * holding_flow}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the contingency fuel.

      - **{{d2}} kg**: carries the larger alternate fuel instead of the smaller
      one.

      - **{{d3}} kg**: leaves out the final reserve.

      - **{{d4}} kg**: carries a full hour of holding fuel as final reserve
      instead of 30 minutes.
