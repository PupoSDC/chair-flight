    question: >-
      A pilot is planning a VFR flight with an alternate aerodrome. Given the
      following information, what is the required flight time to the alternate?


      - Cruise distance: {{dist}} NM

      - Climb to cruise altitude: {{climb}} minutes

      - Descent: {{desc}} minutes

      - Cruise TAS: {{tas}} kt

      - Wind: {{wdir}}°(T)/{{ws}} kt

      - Track: {{track}}°(T)
    variables:
      - id: dist
        label: Cruise distance
        unit: NM
      - id: climb
        label: Climb time
        unit: min
      - id: desc
        label: Descent time
        unit: min
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction (from)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: track
        label: Track
        unit: °
    answer:
      formula: climb + desc + dist / (tas - ws * cos(wdir - track)) * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: climb + desc + dist / (tas + ws * cos(wdir - track)) * 60
      - id: d2
        formula: 2 * climb + desc + dist / (tas - ws * cos(wdir - track)) * 60
      - id: d3
        formula: dist
    presets:
      - id: p1
        values:
          dist: 24
          climb: 3
          desc: 4
          tas: 150
          wdir: 50
          ws: 20
          track: 90
      - id: p2
        values:
          dist: 40
          climb: 3
          desc: 5
          tas: 120
          wdir: 330
          ws: 20
          track: 30
      - id: p3
        values:
          dist: 60
          climb: 5
          desc: 6
          tas: 140
          wdir: 80
          ws: 30
          track: 90
    explanation: >-
      The cruise ground speed is the TAS corrected for the wind component along
      the track. The wind comes from {{wdir}}° and the track is {{track}}°, so
      the headwind component is wind speed times the cosine of the angle between
      them. Total time is climb, cruise and descent.


      **Solution**


      Headwind component = {{f: ws * cos(wdir - track)}} = {{n: ws * cos(wdir -
      track)}} = {{= ws * cos(wdir - track)}} kt


      Ground speed = {{tas}} - {{= ws * cos(wdir - track)}} = {{= tas - ws *
      cos(wdir - track)}} kt


      Cruise time = {{dist}} / {{= tas - ws * cos(wdir - track)}} x 60 = {{=
      dist / (tas - ws * cos(wdir - track)) * 60}} min


      {{f: climb + desc + dist / (tas - ws * cos(wdir - track)) * 60}} = {{n:
      climb + desc + dist / (tas - ws * cos(wdir - track)) * 60}} = **{{answer}}
      min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the wind component was added to the TAS, treating the
      headwind as a tailwind.

      - **{{d2}} min**: the climb time was counted twice.

      - **{{d3}} min**: the distance in NM was read directly as a time in
      minutes.
- id: QODEKMEOC
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332041
    - AVEXAM-45273
    - BGS-331336
    - ATPLGS-629485
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Given the following information, calculate the actual fuel at the
      destination for a Commercial Air Transport flight (Performance Class A).
      Assume the actual fuel consumption is maintained at the same rate.


      - Total distance A to B: {{dtot}} NM

      - Fuel remaining after {{t}} min: {{frem}} US gal

      - Distance travelled after {{t}} min: {{dfl}} NM

      - Average TAS: {{tas}} kt

      - Wind component: {{hw}} kt headwind

      - Trip fuel (fuel at start): {{trip}} US gal

      - Planned average fuel flow: {{ffp}} US gal/h
    variables:
      - id: dtot
        label: Total distance
        unit: NM
      - id: t
        label: Elapsed time
        unit: min
      - id: frem
        label: Fuel remaining
        unit: US gal
      - id: dfl
        label: Distance travelled
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind
        unit: kt
      - id: trip
        label: Trip fuel
        unit: US gal
      - id: ffp
        label: Planned fuel flow
        unit: US gal/h
    answer:
      formula: frem - round((trip - frem) / (t / 60)) * (dtot - dfl) / (tas - hw)
      unit: US gal
      decimals: 0
    distractors:
      - id: d1
        formula: frem - ffp * (dtot - dfl) / (tas - hw)
      - id: d2
        formula: trip - frem
      - id: d3
        formula: frem - round((trip - frem) / (t / 60)) * (dtot - dfl) / tas
      - id: d4
        formula: frem - round((trip - frem) / (t / 60)) * (dtot - dfl) / (tas + hw)
    presets:
      - id: p1
        values:
          dtot: 320
          t: 75
          frem: 859
          dfl: 119
          tas: 115
          hw: 20
          trip: 1280
          ffp: 380
      - id: p2
        values:
          dtot: 300
          t: 60
          frem: 800
          dfl: 100
          tas: 120
          hw: 15
          trip: 1000
          ffp: 220
      - id: p3
        values:
          dtot: 280
          t: 50
          frem: 600
          dfl: 90
          tas: 110
          hw: 10
          trip: 800
          ffp: 250
    explanation: >-
      The actual fuel flow is the fuel used so far divided by the elapsed time.
      The remaining flight time uses the ground speed (TAS minus headwind). Fuel
      at destination is the present fuel minus the burn for the remaining
      distance at the actual flow.


      **Solution**


      Actual fuel flow = ({{trip}} - {{frem}}) / ({{t}} / 60) = {{= round((trip
      - frem) / (t / 60))}} US gal/h


      Remaining time = {{= dtot - dfl}} NM / {{= tas - hw}} kt = {{= (dtot -
      dfl) / (tas - hw)}} h


      Fuel at destination = **{{answer}} US gal**


      **Why the other answers are wrong**


      - **{{d1}} US gal**: the planned fuel flow was used instead of the actual
      one.

      - **{{d2}} US gal**: this is only the fuel used so far.

      - **{{d3}} US gal**: the wind was ignored in the remaining time.

      - **{{d4}} US gal**: the headwind was added to the TAS.
- id: QODRLAAU
  docId: "033.03"
  relatedQuestions:
    - QNFZSROC
  externalIds:
    - ATPLQ-333837
    - AVEXAM-76879
    - ATPLGS-113519
    - ATPLGS-113728
    - BGS-331285
    - AVEXAM-86055
    - BGS-331248
    - AVEXAM-57795
    - ATPLGS-113965
    - AVEXAM-71973
    - AVEXAM-30646
    - ATPLGS-113886
    - ATPLGS-628477
    - BGS-330959
    - AVEXAM-34986
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      Given the following data for the pre-flight calculations, determine the
      trip fuel required for a Commercial Air Transport flight. Assume the Basic
      Fuel Scheme WITHOUT variations applies.


      - Trip distance: {{distance}} NM

      - TAS: {{tas}} kt

      - Headwind component: {{headwind}} kt

      - Average fuel flow: {{flow}} kg/h


      Extra fuel: 0 kg

      Discretionary fuel: 0 kg
    variables:
      - id: distance
        label: Trip distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: headwind
        label: Headwind component
        unit: kt
      - id: flow
        label: Average fuel flow
        unit: kg/h
    answer:
      formula: flow * distance / (tas - headwind)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: flow * distance / tas
      - id: d2
        formula: flow * distance / (tas + headwind)
      - id: d3
        formula: flow * distance / (tas - 2 * headwind)
      - id: d4
        formula: flow * distance / ((tas - headwind) * 60)
    presets:
      - id: p1
        values:
          distance: 122
          tas: 145
          headwind: 15
          flow: 4500
      - id: p2
        values:
          distance: 200
          tas: 300
          headwind: 40
          flow: 6000
    explanation: >-
      With a headwind the groundspeed is the TAS minus the headwind component.
      The trip time is the distance divided by the groundspeed, and the trip
      fuel is the average fuel flow multiplied by the trip time.


      **Solution**


      Groundspeed = {{= tas - headwind}} kt


      {{f: flow * distance / (tas - headwind)}} = {{n: flow * distance / (tas -
      headwind)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: ignores the headwind and uses the TAS as groundspeed.

      - **{{d2}} kg**: adds the headwind instead of subtracting it.

      - **{{d3}} kg**: subtracts the headwind twice.

      - **{{d4}} kg**: uses minutes instead of hours for the trip time, which is
      a unit error.
