    - AVEXAM-23915
    - BGS-331197
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: simple
    question: A pilot of a Commercial Air Transport operations company is planning
      to conduct an IFR flight from Departure aerodrome A, where a VOR approach
      can be only conducted with visibility below the landing minima, to a
      Destination aerodrome B above the planning minima but in IMC. Which
      considerations must be taken into account by the pilot during the
      pre-flight planning procedure, so as to determine the minimum fuel
      required, regarding that the above forecast conditions at both aerodromes
      are expected to remain the same?
    explanation: ""
    options:
      - id: OYAR0KIYV
        text: The pilot must select two destination alternate aerodromes and carry
          sufficient Alternate Fuel to reach both aerodromes following an
          approach at the destination.
        correct: false
        why: ""
      - id: OAKW0VMTG
        text: NO destination alternate aerodrome is required as the weather at the
          destination aerodrome is forecast to remain above the planning minima,
          avoiding the need for Alternate Fuel.
        correct: false
        why: ""
      - id: OAX4BBZQY
        text: The pilot must select a destination alternate aerodrome that is within 1
          hour's flight time from the destination aerodrome, and carry
          sufficient Alternate Fuel to reach that following an approach at the
          destination.
        correct: false
        why: ""
      - id: OZNYFZROM
        text: The pilot must select a take-off alternate aerodrome, which could be the
          destination aerodrome if operational minima permit, avoiding the need
          for Additional Fuel.
        correct: true
        why: ""
- id: Q1N3FEDGM
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339444
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      At the last minute, some passengers were unable to board the aircraft,
      resulting in a weight reduction of {{weight_red}} kg.


      The operational flight plan shows that a weight reduction of {{ref_red}}
      kg reduces the aircraft's trip fuel by {{ref_fuel}} kg.


      Using interpolation, by how much (in kg, size of the change only) does the
      trip fuel requirement change?
    variables:
      - id: weight_red
        label: Weight reduction
        unit: kg
      - id: ref_red
        label: Reference weight reduction
        unit: kg
      - id: ref_fuel
        label: Reference trip fuel change
        unit: kg
    answer:
      formula: weight_red / ref_red * ref_fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ref_fuel
      - id: d2
        formula: ref_fuel * ref_red / weight_red
      - id: d3
        formula: weight_red / ref_red * ref_fuel + ref_fuel
      - id: d4
        formula: "0"
    presets:
      - id: p1
        values:
          weight_red: 1500
          ref_red: 1000
          ref_fuel: 205
      - id: p2
        values:
          weight_red: 2000
          ref_red: 1000
          ref_fuel: 150
    explanation: >-
      Linear interpolation scales the fuel change in proportion to the weight
      change. The reference change is 205 kg of trip fuel for a 1000 kg weight
      reduction, so the change for 1500 kg is 1.5 times that value.


      **Solution**


      {{f: weight_red / ref_red * ref_fuel}} = {{n: weight_red / ref_red *
      ref_fuel}} = **{{answer}} kg**


      The trip fuel is reduced by {{answer}} kg.


      **Why the other answers are wrong**


      - **{{d1}} kg**: takes the reference change without scaling it to the
      actual weight reduction.

      - **{{d2}} kg**: inverts the ratio of the weight reduction.

      - **{{d3}} kg**: adds the reference change on top of the scaled change,
      counting it twice.

      - **{{d4}} kg**: assumes no change in trip fuel at all.
