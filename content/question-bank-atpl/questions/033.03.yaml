    - AVEXAM-62392
  annexes: []
  learningObjectives:
    - 033.03.02.03.08
  template:
    type: calculation
    question: >-
      Given the following information, what is the minimum block fuel required
      for the Commercial Air Transport flight with a Performance Class A
      aeroplane using the Basic Fuel Scheme WITH variations for Reduced
      Contingency Fuel?


      - Taxi Fuel: {{taxi}} kg

      - Trip Fuel A to DP: {{trip_dp}} kg

      - Trip Fuel DP to Destination: {{trip_dest}} kg

      - Trip Fuel DP to optional refuelling destination: {{trip_ref}} kg

      - Destination Alternate Fuel (for both possible destinations): {{alt}} kg

      - Final Reserve Fuel: {{frf}} kg


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip_dp
        label: Trip fuel A to DP
        unit: kg
      - id: trip_dest
        label: Trip fuel DP to destination
        unit: kg
      - id: trip_ref
        label: Trip fuel DP to refuelling destination
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: frf
        label: Final reserve fuel
        unit: kg
    answer:
      formula: taxi + trip_dp + trip_dest * 1.05 + alt + frf
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip_dp + trip_dest + alt + frf
      - id: d2
        formula: taxi + trip_dp + trip_dest * 1.05 + alt
      - id: d3
        formula: taxi + trip_dp + trip_ref * 1.05 + alt + frf
      - id: d4
        formula: taxi + trip_dp + trip_dest * 1.05 + frf
    presets:
      - id: p1
        values:
          taxi: 300
          trip_dp: 12000
          trip_dest: 9000
          trip_ref: 3000
          alt: 2000
          frf: 1350
      - id: p2
        values:
          taxi: 250
          trip_dp: 10000
          trip_dest: 7000
          trip_ref: 2500
          alt: 1800
          frf: 1200
      - id: p3
        values:
          taxi: 350
          trip_dp: 15000
          trip_dest: 11000
          trip_ref: 3800
          alt: 2400
          frf: 1500
    explanation: >-
      With the Reduced Contingency Fuel procedure the contingency fuel is 5% of
      the trip fuel from the decision point (DP) to the destination only. The
      block fuel is taxi + trip to the DP + trip from the DP to the destination
      + reduced contingency + alternate + final reserve.


      **Solution**


      Contingency = 5% of {{trip_dest}} = {{= 0.05 * trip_dest}} kg


      {{f: taxi + trip_dp + trip_dest * 1.05 + alt + frf}} = {{n: taxi + trip_dp
      + trip_dest * 1.05 + alt + frf}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: omits the contingency fuel.

      - **{{d2}} kg**: omits the final reserve fuel.

      - **{{d3}} kg**: uses the trip fuel to the optional refuelling destination
      instead of the original destination.

      - **{{d4}} kg**: omits the alternate fuel.
- id: QZTDHBFP
  docId: "033.03"
  relatedQuestions:
    - QNGKSPWG
  externalIds:
    - ATPLQ-333142
    - ATPLGS-123147
    - ATPLGS-626409
    - AVEXAM-10842
    - AVEXAM-17704
    - AVEXAM-18293
    - AVEXAM-20983
    - AVEXAM-41243
    - AVEXAM-4248
    - AVEXAM-43746
    - AVEXAM-45268
    - AVEXAM-61713
    - BGS-331200
    - BGS-331248
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes what is the required take-off fuel for an
      IFR Commercial Air Transport flight with a turbine engine jet aircraft?
      Assume the Basic Fuel Scheme WITHOUT variations applies.


      - Taxi fuel (including APU usage): {{taxi}} kg

      - Fuel for the climb to cruise level: {{climb}} kg

      - Cruise distance to destination: {{dist}} NAM

      - Cruise fuel consumption: {{cons}} kg/NAM

      - Fuel for descent to the destination: {{desc}} kg

      - Fuel for approach & landing at destination: {{appr}} kg

      - Contingency fuel: {{cont}}% of trip

      - Fuel for alternate: {{alt}} kg

      - Holding fuel flow at destination & alternate: {{holdff}} kg/h

      - Missed approach fuel at alternate: {{missed}} kg


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: taxi
        label: Taxi fuel (including APU usage)
        unit: kg
      - id: climb
        label: Fuel for the climb to cruise level
        unit: kg
      - id: dist
        label: Cruise distance to destination
        unit: NAM
      - id: cons
        label: Cruise fuel consumption
        unit: kg/NAM
      - id: desc
        label: Fuel for descent to the destination
        unit: kg
      - id: appr
        label: Fuel for approach & landing at destination
        unit: kg
      - id: cont
        label: Contingency percentage
        unit: "%"
      - id: alt
        label: Fuel for alternate
        unit: kg
      - id: holdff
        label: Holding fuel flow
        unit: kg/h
      - id: missed
        label: Missed approach fuel at alternate
        unit: kg
    answer:
      formula: (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt + holdff *
        0.5
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt +
          holdff * 0.5
      - id: d2
        formula: (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt + holdff *
          0.5 + missed
      - id: d3
        formula: (climb + dist * cons + desc + appr) + alt + holdff * 0.5
    presets:
      - id: p1
        values:
          taxi: 150
          climb: 1600
          dist: 570
          cons: 6
          desc: 270
          appr: 450
          cont: 5
          alt: 2150
          holdff: 2200
          missed: 270
      - id: p2
        values:
          taxi: 200
          climb: 1500
          dist: 480
          cons: 5.5
          desc: 250
          appr: 400
          cont: 5
          alt: 1900
          holdff: 2100
          missed: 250
      - id: p3
        values:
          taxi: 120
          climb: 1800
          dist: 700
          cons: 6.5
          desc: 300
          appr: 500
          cont: 5
          alt: 2400
          holdff: 2300
          missed: 320
    explanation: >-
      Fuel is planned under the Basic Fuel Scheme: trip fuel (climb, cruise,
      descent, approach and landing), contingency fuel, alternate fuel and final
      reserve fuel (the taxi fuel is not part of the take-off fuel).


      **Solution**


      Trip fuel = {{climb}} + {{dist}} × {{cons}} + {{desc}} + {{appr}} = {{=
      (climb + dist * cons + desc + appr)}} kg

      Contingency fuel = {{cont}}% of trip fuel = {{= (climb + dist * cons +
      desc + appr) * cont / 100}} kg

      Final reserve fuel = 30 min × {{holdff}} kg/h = {{= holdff * 0.5}} kg


      {{f: (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt + holdff
      * 0.5}} = {{n: (climb + dist * cons + desc + appr) * (1 + cont / 100) +
      alt + holdff * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the taxi fuel is added, which gives the block fuel
      instead of the take-off fuel.

      - **{{d2}} kg**: the missed approach fuel at the alternate is added on
      top; it is already part of the alternate fuel.

      - **{{d3}} kg**: the contingency fuel is forgotten.
- id: QZVUYLIBT
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339797
    - AVEXAM-36313
    - BGS-331202
    - ATPLGS-629359
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Due to significant weather conditions in the vicinity of the destination
      aerodrome, the pilot of a Commercial Air Transport flight has to plan for
      two destination alternate aerodromes. Given the following information,
      what is the Alternate Fuel required?


      - Average cruise fuel flow: {{ff}} kg/min

      - Fuel for missed approach: {{missed}} kg

      - Flight time from missed approach altitude to destination alternate 1:
      {{t1}} min

      - Flight time from missed approach altitude to destination alternate 2:
      {{t2}} min
    variables:
      - id: ff
        label: Cruise fuel flow
        unit: kg/min
      - id: missed
        label: Missed approach fuel
        unit: kg
      - id: t1
        label: Flight time to alternate 1
        unit: min
      - id: t2
        label: Flight time to alternate 2
        unit: min
    answer:
      formula: ff * max(t1, t2) + missed
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * min(t1, t2) + missed
      - id: d2
        formula: ff * max(t1, t2) + missed + ff * 30
      - id: d3
        formula: ff * min(t1, t2) + missed + ff * 30
    presets:
      - id: p1
        values:
          ff: 46
          missed: 400
          t1: 54
          t2: 44
      - id: p2
        values:
          ff: 40
          missed: 350
          t1: 38
          t2: 47
      - id: p3
        values:
          ff: 52
          missed: 450
          t1: 60
          t2: 41
    explanation: >-
      With two destination alternates, the alternate fuel must be sufficient to
      reach the one that needs more fuel, i.e. the one with the longer flight
      time. It consists of the missed approach fuel plus the cruise fuel to that
      alternate.


      **Solution**


      Longer flight time = {{= max(t1, t2)}} min


      {{f: ff * max(t1, t2) + missed}} = {{n: ff * max(t1, t2) + missed}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses the nearer alternate (shorter flight time) instead
      of the more demanding one.

      - **{{d2}} kg**: correct alternate, but wrongly adds 30 minutes of fuel
      flow (final reserve is a separate item).

      - **{{d3}} kg**: uses the nearer alternate and also adds 30 minutes of
      fuel flow.
