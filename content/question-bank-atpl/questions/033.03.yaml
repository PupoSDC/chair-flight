- id: QNIKFIZW
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339761
    - BGS-330213
    - ATPLGS-107844
    - AVEXAM-6758
  annexes: []
  learningObjectives:
    - 033.03.03.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Finish the endurance and fuel calculation and determine
      the ATC endurance for a twin jet aeroplane, with the help of the table
      provided.


      - Trip fuel (read from the figure): {{trip_fuel}} kg

      - Fuel on board (read from the figure): {{fuel_on_board}} kg

      - Contingency fuel: 5 % of the trip fuel

      - Fuel flow for extra fuel: {{extra_flow}} kg/h


      What is the ATC endurance?
    variables:
      - id: trip_fuel
        label: Trip fuel (read from figure)
        unit: kg
      - id: fuel_on_board
        label: Fuel on board (read from figure)
        unit: kg
      - id: extra_flow
        label: Fuel flow for extra fuel
        unit: kg/h
    chartInputs:
      - trip_fuel
      - fuel_on_board
    answer:
      formula: round((fuel_on_board - 1.05 * trip_fuel) / extra_flow * 60)
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: round((fuel_on_board - trip_fuel) / extra_flow * 60)
      - id: d2
        formula: round((fuel_on_board - 0.95 * trip_fuel) / extra_flow * 60)
      - id: d3
        formula: round((fuel_on_board - 1.05 * trip_fuel) / 2500 * 60)
      - id: d4
        formula: round((fuel_on_board - 1.05 * trip_fuel) / extra_flow * 60) + 5
    presets:
      - id: p1
        values:
          trip_fuel: 20000
          fuel_on_board: 30880
          extra_flow: 2400
    explanation: >-
      The ATC endurance is the fuel left over after the trip and the contingency
      fuel, divided by the fuel flow for the extra fuel. The contingency fuel is
      5 % of the trip fuel and is added to the trip fuel before it is taken off
      the fuel on board.


      **Solution**


      {{f: (fuel_on_board - 1.05 * trip_fuel) / extra_flow * 60}} = {{n:
      (fuel_on_board - 1.05 * trip_fuel) / extra_flow * 60}} minutes =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: leaves out the contingency fuel, so too much fuel is left
      for the extra endurance.

      - **{{d2}}**: takes the contingency off the trip fuel instead of adding
      it, so too much fuel is left.

      - **{{d3}}**: divides by 2 500 kg/h instead of the given fuel flow of 2
      400 kg/h.

      - **{{d4}}**: uses the correct fuel but adds 5 minutes to the result.
