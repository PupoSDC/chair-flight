- id: QUA988NGC
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333353
    - AVEXAM-76115
    - ATPLQ-334598
    - AVEXAM-24184
    - AVEXAM-2352
    - AVEXAM-64950
  annexes:
    - CAP-697-page-83
    - 033-mrjt-long-range-cruise-table-pressure-altitude-28000-ft
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. During the cruise, the head wind component increases
      from {{hw1}} kt to {{hw2}} kt. Values read from the graph: still air
      distance per 1 000 kg of fuel {{nam}} NAM, TAS {{tas}} kt.


      What is the approximate reduction in ground distance covered per 1 000 kg
      of fuel burnt (in NM)?
    variables:
      - id: nam
        label: Still air distance per 1 000 kg (read from graph)
        unit: NAM
      - id: tas
        label: True airspeed (read from graph)
        unit: kt
      - id: hw1
        label: Initial head wind
        unit: kt
      - id: hw2
        label: Final head wind
        unit: kt
    chartInputs:
      - nam
      - tas
    answer:
      formula: nam * (hw2 - hw1) / tas
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: hw2 - hw1
      - id: d2
        formula: nam * hw2 / tas
      - id: d3
        formula: tas * (hw2 - hw1) / nam
      - id: d4
        formula: nam * hw1 / tas
    presets:
      - id: p1
        values:
          nam: 125
          tas: 416
          hw1: 25
          hw2: 35
      - id: p2
        values:
          nam: 165
          tas: 440
          hw1: 25
          hw2: 35
      - id: p3
        values:
          nam: 150
          tas: 430
          hw1: 20
          hw2: 35
    explanation: >-
      Ground distance per unit of fuel equals the still air distance per unit of
      fuel multiplied by GS/TAS. When the head wind increases, GS falls and the
      ground distance per 1 000 kg falls in proportion to the change in wind.


      **Solution**


      Ground distance per 1 000 kg = NAM x (TAS - HW) / TAS, so the change is:


      {{f: nam * (hw2 - hw1) / tas}} = {{n: nam * (hw2 - hw1) / tas}} =
      **{{answer}} NM** (reduction)


      **Why the other answers are wrong**


      - **{{d1}} NM**: This is just the wind change in kt; the effect on
      distance per fuel is not a 1:1 conversion.

      - **{{d2}} NM**: The full final head wind was used instead of the change
      in head wind.

      - **{{d3}} NM**: The ratio was inverted (TAS divided by NAM).

      - **{{d4}} NM**: The initial head wind was used instead of the change.
