      - id: taxi
        label: Taxi time per aerodrome
        unit: min
      - id: tf
        label: Taxi fuel flow
        unit: kg/h
      - id: af
        label: APU fuel flow
        unit: kg/h
    chartInputs:
      - apu
      - taxi
      - tf
      - af
    answer:
      formula: (2 * taxi * tf + apu * af) / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (taxi * tf + apu * af) / 60
      - id: d2
        formula: 2 * taxi * tf / 60
      - id: d3
        formula: 2 * (taxi * tf + apu * af) / 60
      - id: d4
        formula: (2 * taxi * tf + apu * tf) / 60
    presets:
      - id: p1
        values:
          apu: 15
          taxi: 20
          tf: 330
          af: 114
      - id: p2
        values:
          apu: 35
          taxi: 15
          tf: 330
          af: 114
      - id: p3
        values:
          apu: 25
          taxi: 20
          tf: 330
          af: 114
    explanation: >-
      Taxi Fuel for flight planning covers the fuel burnt while taxiing out and
      the planned taxi at the destination, plus the fuel used by the APU at the
      parking position. Each is the time multiplied by the corresponding fuel
      flow, which is read from the figure.


      **Solution**


      Taxi time in total: 2 × {{taxi}} min = {{= 2 * taxi}} min


      {{f: (2 * taxi * tf + apu * af) / 60}} = {{n: (2 * taxi * tf + apu * af) /
      60}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: counts the taxi time only once (departure only) instead
      of departure and destination.

      - **{{d2}} kg**: forgets the APU fuel.

      - **{{d3}} kg**: also doubles the APU fuel, although the APU is only used
      at the departure parking position.

      - **{{d4}} kg**: burns the APU time at the taxi fuel flow instead of the
      APU fuel flow.
