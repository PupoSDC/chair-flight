  template:
    type: calculation
    question: >-
      Given the following data for the pre-flight calculations, determine the
      Contingency Fuel for a Commercial Air Transport flight with a Performance
      Class A aeroplane. Assume the Basic Fuel Scheme WITHOUT variations
      applies.


      - Trip Fuel: {{trip}} lb

      - Alternate Fuel: {{alt}} lb

      - Taxi Fuel: {{taxi}} lb

      - Reserve Fuel: {{res}} lb


      En-route alternate: NOT applicable

      Fuel to fly 5 minutes at 1500 ft above destination: {{five}} lb

      Extra Fuel: 0 lb

      Discretionary Fuel: 0 lb
    variables:
      - id: trip
        label: Trip fuel
        unit: lb
      - id: alt
        label: Alternate fuel
        unit: lb
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: res
        label: Reserve fuel
        unit: lb
      - id: five
        label: Fuel for 5 minutes at 1500 ft above destination
        unit: lb
    answer:
      formula: trip * 0.05
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: trip * 0.10
      - id: d2
        formula: trip * 0.03
      - id: d3
        formula: five
    presets:
