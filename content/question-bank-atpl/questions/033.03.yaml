      - time_so_far
      - time_tod
    answer:
      formula: tom - fuel_used / time_so_far * time_tod - descent_fuel
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: tom - fuel_used / time_so_far * time_tod
      - id: d2
        formula: tom - fuel_used - descent_fuel
      - id: d3
        formula: tom - fuel_used * time_so_far / time_tod - descent_fuel
      - id: d4
        formula: tom - descent_fuel
    presets:
      - id: p1
        values:
          tom: 2800
          fuel_used: 38
          time_so_far: 30
          time_tod: 60
          descent_fuel: 28
      - id: p2
        values:
          tom: 3100
          fuel_used: 48
          time_so_far: 36
          time_tod: 54
          descent_fuel: 30
    explanation: >-
      The average fuel flow so far is the fuel used divided by the elapsed time.
      Multiplying by the time to the Top of Descent gives the fuel still to be
      burned in the cruise; the descent fuel is subtracted as well.


      **Solution**


      Average fuel flow: {{= fuel_used / time_so_far}} kg/min; cruise fuel still
      to burn: {{= fuel_used / time_so_far * time_tod}} kg


      {{f: tom - fuel_used / time_so_far * time_tod - descent_fuel}} = {{n: tom
      - fuel_used / time_so_far * time_tod - descent_fuel}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: The descent fuel was forgotten.

      - **{{d2}} kg**: The fuel used so far was subtracted instead of the
      projected fuel to the Top of Descent.

      - **{{d3}} kg**: The ratio of times was inverted.

      - **{{d4}} kg**: Only the descent fuel was subtracted.
- id: QKMOQCZY
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337542
    - BGS-330567
    - BGS-330225
    - AVEXAM-3318
    - AVEXAM-33195
    - BGS-331423
    - BGS-331471
    - AVEXAM-91403
    - ATPLGS-107351
  annexes: []
  learningObjectives:
    - 033.03.01.01.03
  template:
    type: chart-calculation
    question: >-
      Refer to the figure or CAP file 2.4. Given: aeroplane mass at start-up 3
      663 lb, aviation gasoline load (density {{density}} lb/gal) {{fuel_gal}}
      US gal, take-off altitude sea level, head wind component {{hw}} kt,
      cruising altitude 8 000 ft, power setting full throttle 2 300 RPM 20° lean
      of peak EGT. Values read from the table: fuel flow {{ff}} lb/h, TAS
      {{tas}} kt.


      Calculate the ground range (NM).
    variables:
      - id: fuel_gal
        label: Fuel load
        unit: US gal
      - id: density
        label: Fuel density
        unit: lb/gal
      - id: ff
        label: Fuel flow (read from table)
        unit: lb/h
      - id: tas
        label: TAS (read from table)
        unit: kt
      - id: hw
        label: Head wind component
        unit: kt
    chartInputs:
      - ff
      - tas
    answer:
      formula: fuel_gal * density / ff * (tas - hw)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: fuel_gal * density / ff * tas
      - id: d2
        formula: fuel_gal * density / ff * (tas + hw)
      - id: d3
        formula: fuel_gal / ff * (tas - hw)
      - id: d4
        formula: fuel_gal * density / ff * (tas - 2 * hw)
    presets:
      - id: p1
        values:
          fuel_gal: 74
          density: 6
          ff: 66
          tas: 132
          hw: 30
      - id: p2
        values:
          fuel_gal: 60
          density: 6
          ff: 58
          tas: 128
          hw: 20
      - id: p3
        values:
          fuel_gal: 80
          density: 6
          ff: 70
          tas: 140
          hw: 25
    explanation: >-
      Ground range is the endurance (fuel mass divided by fuel flow) multiplied
      by the ground speed, which is TAS minus the head wind component.


      **Solution**


      Fuel mass: {{= fuel_gal * density}} lb; endurance: {{= fuel_gal * density
      / ff}} h; ground speed: {{= tas - hw}} kt


      {{f: fuel_gal * density / ff * (tas - hw)}} = {{n: fuel_gal * density / ff
      * (tas - hw)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: The head wind was ignored (TAS used as ground speed).

      - **{{d2}} NM**: The head wind was added instead of subtracted.

      - **{{d3}} NM**: The fuel volume in gallons was used as if it were pounds;
      the density was not applied.

      - **{{d4}} NM**: The head wind was subtracted twice.
- id: QKNFNEVN
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337248
    - ATPLGS-113879
    - ATPLGS-625275
    - BGS-330910
    - AVEXAM-58332
    - ATPLGS-113775
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      Given the following information, find the minimum required Additional Fuel
      for a Commercial Air Transport flight with a twin-jet aeroplane to an
      isolated aerodrome.


      - Fuel consumption en-route: {{ffc}} kg/h

      - Fuel consumption in holding: {{ffh}} kg/h


      No en-route alternate exists.
    variables:
      - id: ffc
        label: En-route fuel flow
        unit: kg/h
      - id: ffh
        label: Holding fuel flow
        unit: kg/h
    answer:
      formula: ffc * 2
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ffh * 2
      - id: d2
        formula: ffh * 0.5
      - id: d3
        formula: ffh * 0.25
    presets:
      - id: p1
        values:
          ffc: 2100
          ffh: 1200
      - id: p2
        values:
          ffc: 2400
          ffh: 1300
      - id: p3
        values:
          ffc: 1800
          ffh: 1000
    explanation: >-
      For a destination that is an isolated aerodrome, the fuel scheme requires
      additional fuel to fly for 2 hours at normal cruise consumption (including
      final reserve), so the en-route fuel flow applies, not the holding flow.


      **Solution**


      {{f: ffc * 2}} = {{n: ffc * 2}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: 2 hours were applied to the holding fuel flow instead of
      the en-route fuel flow.

      - **{{d2}} kg**: 30 minutes at the holding fuel flow, which is the final
      reserve duration, not the isolated aerodrome requirement.

      - **{{d3}} kg**: 15 minutes at the holding fuel flow, a time that has no
      role in this requirement.
- id: QKSFCDKE8
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335806
    - ATPLGS-626260
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      You have just finished planning a flight and you require {{mass}} lb of
      fuel.


      The fuel tanker supplies fuel in US gallons with a specific gravity of
      {{sg}}.


      How many US gallons do you require? (1 US gallon of water weighs 8.345
      lb.)
    variables:
      - id: mass
        label: Fuel mass
        unit: lb
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: mass / (sg * 8.345)
      unit: US gallons
      decimals: 0
    distractors:
      - id: d1
        formula: mass * sg / 8.345
      - id: d2
        formula: mass / 8.345
      - id: d3
        formula: mass / sg / 3.785
    presets:
      - id: p1
        values:
          mass: 3643
          sg: 0.84
      - id: p2
        values:
          mass: 5120
          sg: 0.8
      - id: p3
        values:
          mass: 2850
          sg: 0.78
    explanation: >-
      Volume is mass divided by density. The fuel density equals its specific
      gravity times the density of water, 8.345 lb per US gallon.


      **Solution**


      {{f: mass / (sg * 8.345)}} = {{n: mass / (sg * 8.345)}} = **{{answer}} US
      gallons**


      **Why the other answers are wrong**


      - **{{d1}} US gallons**: the specific gravity is multiplied instead of
      divided.

      - **{{d2}} US gallons**: the specific gravity is ignored.

      - **{{d3}} US gallons**: the mass is divided by 3.785 (litres per US
      gallon) instead of the water density, which does not give gallons.
- id: QLJVTHKT
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337457
    - AVEXAM-90101
    - AVEXAM-75606
    - AVEXAM-99497
    - AVEXAM-95918
    - ATPLGS-622533
    - AVEXAM-56563
    - AVEXAM-8090
    - AVEXAM-31383
    - AVEXAM-46843
    - BGS-331233
    - BGS-331340
    - AVEXAM-12251
    - AVEXAM-2449
    - ATPLGS-126689
    - BGS-331466
  annexes: []
  learningObjectives:
    - 033.03.02.04.03
  template:
    type: calculation
    question: >-
      A Commercial Air Transport operation is to be pre-positioned to a remote
      operating location in mountainous terrain. The commander wishes to take as
      much extra fuel as possible. Given the following information, determine
      the maximum amount of extra fuel (including the fuel penalty) that the
      commander can upload:


      - MTOM: {{mtom}} lb

      - MLM: {{mlm}} lb

      - ZFEM: {{zfm}} lb

      - Planned T/O fuel: {{tof}} lb

      - Trip fuel: {{trip}} lb

      - Fuel tank capacity: {{tank}} lb

      - Fuel burn correction per 100 lb of extra fuel based upon: TOM +{{burn}}
      lb and LM +10 lb
    variables:
      - id: mtom
        label: MTOM
        unit: lb
      - id: mlm
        label: MLM
        unit: lb
      - id: zfm
        label: ZFEM
        unit: lb
      - id: tof
        label: Planned take-off fuel
        unit: lb
      - id: trip
        label: Trip fuel
        unit: lb
      - id: tank
        label: Tank capacity
        unit: lb
      - id: burn
        label: Burn-off per 100 lb extra fuel
        unit: lb
    answer:
      formula: floor(min(mtom - (zfm + tof), tank - tof, (mlm - (zfm + tof - trip)) /
        (1 - burn / 100)))
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mlm - (zfm + tof - trip)
      - id: d2
        formula: "0"
      - id: d3
        formula: tank - tof
      - id: d4
        formula: mtom - (zfm + tof)
    presets:
      - id: p1
        values:
          mtom: 6250
          mlm: 4500
          zfm: 3825
          tof: 705
          trip: 375
          tank: 1100
          burn: 9.1
      - id: p2
        values:
          mtom: 6250
          mlm: 4450
          zfm: 3825
          tof: 705
          trip: 375
          tank: 1100
          burn: 9.1
      - id: p3
        values:
          mtom: 6250
          mlm: 4480
          zfm: 3825
          tof: 705
          trip: 375
          tank: 1100
          burn: 9.1
    explanation: >-
      Extra fuel is limited by the headroom to the maximum take-off mass, to the
      maximum landing mass and to the tank capacity. For the landing limit, part
      of each 100 lb of extra fuel is burnt, so the landing headroom is divided
      by one minus the burn fraction. The most restrictive limit applies.


      **Solution**


      Take-off mass headroom = {{= mtom - (zfm + tof)}} lb

      Tank headroom = {{= tank - tof}} lb

      Landing mass headroom = {{= mlm - (zfm + tof - trip)}} lb, which allows
      {{= (mlm - (zfm + tof - trip)) / (1 - burn / 100)}} lb of extra fuel once
      the burn-off is accounted for


      The smallest value limits the extra fuel: **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: landing mass headroom without the burn-off correction.

      - **{{d2}} lb**: assumes no extra fuel can be carried.

      - **{{d3}} lb**: tank headroom only; the landing mass is more restrictive.

      - **{{d4}} lb**: take-off mass headroom only; the landing mass is more
      restrictive.
- id: QLKRJIIKQ
  docId: "033.03"
  relatedQuestions:
    - QUA988NGC
  externalIds:
    - ATPLQ-335473
    - AVEXAM-24184
    - AVEXAM-76115
    - AVEXAM-2352
    - AVEXAM-64950
  annexes:
    - 033-mrjt-long-range-cruise-table-pressure-altitude-28000-ft
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. An aircraft is flying in long range cruise under ISA
      conditions. Values read from the graph: still air distance per 1 000 kg of
      fuel {{nam}} NAM, TAS {{tas}} kt. The tail wind experienced during the
      flight decreases from {{tw1}} kt to {{tw2}} kt.


      By how many NM does the ground distance covered per 1 000 kg of fuel burnt
      decrease?
    variables:
      - id: nam
        label: Still air distance per 1 000 kg (read from graph)
        unit: NAM
      - id: tas
        label: True airspeed (read from graph)
        unit: kt
      - id: tw1
        label: Initial tail wind
        unit: kt
      - id: tw2
        label: Final tail wind
        unit: kt
    chartInputs:
      - nam
      - tas
    answer:
      formula: nam * (tw1 - tw2) / tas
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: tw1 - tw2
      - id: d2
        formula: nam * tw1 / tas
      - id: d3
        formula: tas * (tw1 - tw2) / nam
      - id: d4
        formula: nam * tw2 / tas
    presets:
      - id: p1
        values:
          nam: 205
          tas: 440
          tw1: 25
          tw2: 10
      - id: p2
        values:
          nam: 190
          tas: 430
          tw1: 30
          tw2: 10
      - id: p3
        values:
          nam: 180
          tas: 420
          tw1: 35
          tw2: 15
    explanation: >-
      Ground distance per 1 000 kg of fuel is the still air distance per 1 000
      kg multiplied by GS/TAS. A smaller tail wind lowers GS, so the ground
      distance per unit of fuel decreases.


      **Solution**


      {{f: nam * (tw1 - tw2) / tas}} = {{n: nam * (tw1 - tw2) / tas}} =
      **{{answer}} NM** (decrease)


      **Why the other answers are wrong**


      - **{{d1}} NM**: This is only the change in wind speed in kt, not a
      distance.

      - **{{d2}} NM**: The initial tail wind was used instead of the change.

      - **{{d3}} NM**: The ratio was inverted (TAS divided by NAM).

      - **{{d4}} NM**: The final tail wind was used instead of the change.
- id: QM2JVXU1C
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336404
    - AVEXAM-4939
    - BGS-330229
    - ATPLGS-123262
  annexes:
    - 033-data-sheet-lrjt-1-flight-planning-fuel-tanking-integrated-cruise
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      (Use the annex.) A turbojet aeroplane, weighing {{m0}} kg, initiates its
      cruise at the optimum level at M 0.84 (ISA, CG = 37%, Total Anti Ice ON).


      A head wind of 30 kt is experienced and, after a distance of {{dist}} NM,
      severe icing is encountered and this requires an immediate descent.


      The fuel burn per nautical mile of ground distance read from the annex is
      {{burn}} kg/NM.


      The aeroplane mass at start of descent is (kg):
    variables:
      - id: m0
        label: Initial mass
        unit: kg
      - id: dist
        label: Distance flown
        unit: NM
      - id: burn
        label: Fuel burn per NM (read from annex)
        unit: kg/NM
    chartInputs:
      - burn
    answer:
      formula: m0 - dist * burn
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: m0
      - id: d2
        formula: m0 + dist * burn
      - id: d3
        formula: m0 - dist * burn * 0.9
      - id: d4
        formula: m0 - dist * burn * 1.1
      - id: d5
        formula: m0 - dist * burn / 2
    presets:
      - id: p1
        values:
          m0: 200000
          dist: 500
          burn: 15
    explanation: >-
      The mass at the start of the descent is the initial mass minus the fuel
      burnt during the cruise. The fuel burnt equals the distance flown times
      the fuel burn per nautical mile (taking head wind and Mach number into
      account in the annex).


      **Solution**


      Fuel burnt = {{f: dist * burn}} = {{n: dist * burn}} = {{= dist * burn}}
      kg


      Mass = {{f: m0 - dist * burn}} = {{n: m0 - dist * burn}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: no fuel burn is subtracted.

      - **{{d2}} kg**: the fuel burn is added instead of subtracted.

      - **{{d3}} kg**: the fuel burn is underestimated by 10% (value misread
      from the annex).

      - **{{d4}} kg**: the fuel burn is overestimated by 10% (value misread from
      the annex).

      - **{{d5}} kg**: only half of the fuel burn is subtracted.
