    - AVEXAM-48794
    - AVEXAM-32925
  annexes: []
  learningObjectives:
    - 033.03.03.02.02
  template:
    type: calculation
    question: >-
      An aeroplane with reciprocating engines plans to depart for an isolated
      destination aerodrome (Commercial Air Transport). Calculate the minimum
      amount of fuel required (to the nearest 10 kg) overhead the isolated
      aerodrome.


      - Flight time: {{ft}} h

      - Top of climb to top of descent time: {{cr}} h

      - Fuel to remain overhead: {{base}} minutes plus {{pct}}% of the flying
      time planned at cruising level

      - Normal cruise fuel consumption: {{ff}} kg/h
    variables:
      - id: ft
        label: Flight time
        unit: h
      - id: cr
        label: Time at cruising level
        unit: h
      - id: base
        label: Basic holding time
        unit: min
      - id: pct
        label: Percentage of cruise time
        unit: "%"
      - id: ff
        label: Cruise fuel consumption
        unit: kg/h
    answer:
      formula: round(ff * (base / 60 + pct / 100 * cr) / 10) * 10
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: round(ff * (base / 60 + pct / 100 * ft) / 10) * 10
      - id: d2
        formula: round(ff * base / 60 / 10) * 10
      - id: d3
        formula: round(ff * (base / 60 + pct / 100) / 10) * 10
      - id: d4
        formula: round(ff * (1 + pct / 100 * cr) / 10) * 10
    presets:
      - id: p1
        values:
          ft: 2.5
          cr: 2
          base: 45
          pct: 15
          ff: 720
      - id: p2
        values:
          ft: 3.5
          cr: 3
          base: 45
          pct: 15
          ff: 600
      - id: p3
        values:
          ft: 2
          cr: 1.5
          base: 45
          pct: 15
          ff: 500
    explanation: >-
      For an isolated aerodrome (piston engines) the fuel required overhead is a
      fixed holding time plus a percentage of the flying time at cruising level,
      burned at the normal cruise fuel flow.


      **Solution**


      Time = {{base}} min + {{pct}}% of {{cr}} h = {{= base / 60 + pct / 100 *
      cr}} h


      Fuel = {{= ff}} kg/h x {{= base / 60 + pct / 100 * cr}} h = {{= ff * (base
      / 60 + pct / 100 * cr)}} kg, to the nearest 10 kg = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the percentage was applied to the whole flight time
      instead of the time at cruising level.

      - **{{d2}} kg**: only the 45 minutes were considered.

      - **{{d3}} kg**: the percentage was applied to 1 hour instead of the
      cruise time.

      - **{{d4}} kg**: 1 hour was used instead of 45 minutes.
