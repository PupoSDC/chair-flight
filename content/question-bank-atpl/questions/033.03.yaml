- id: QAGEWKTD6
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332763
    - AVEXAM-284
    - BGS-339589
    - ATPLGS-113783
    - ATPLGS-123183
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Use the following information to determine the increase in fuel required
      for a cruise leg of a Medium-Range Jet Transport (MRJT) flight.


      - Cruise leg distance: {{dist}} NM

      - Planned cruise TAS: {{tas}} kt

      - Forecast wind component: {{w1}} kt (positive = tailwind)

      - Planned cruise fuel consumption: {{k}} kg/NAM

      - Revised forecast wind component: {{w2}} kt
    variables:
      - id: dist
        label: Leg distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: w1
        label: Forecast wind component
        unit: kt
      - id: w2
        label: Revised wind component
        unit: kt
      - id: k
        label: Fuel per NAM
        unit: kg/NAM
    answer:
      formula: k * (dist * tas / (tas + w2) - dist * tas / (tas + w1))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: k * (dist - dist)
      - id: d2
        formula: w1 - w2
      - id: d3
        formula: k * (w1 - w2)
    presets:
      - id: p1
        values:
          dist: 135
          tas: 450
          w1: 25
          w2: -25
          k: 5
      - id: p2
        values:
          dist: 180
          tas: 440
          w1: 30
          w2: -30
          k: 6
      - id: p3
        values:
          dist: 240
          tas: 460
          w1: 20
          w2: -40
          k: 4
    explanation: >-
      Fuel per nautical air mile (NAM) is constant for a given TAS and mass. The
      air distance flown is the ground distance multiplied by TAS / ground
      speed, so a change of wind changes the air distance and therefore the
      fuel.


      **Solution**


      Planned air distance: {{= dist * tas / (tas + w1)}} NAM


      Revised air distance: {{= dist * tas / (tas + w2)}} NAM


      {{f: k * (dist * tas / (tas + w2) - dist * tas / (tas + w1))}} = {{n: k *
      (dist * tas / (tas + w2) - dist * tas / (tas + w1))}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: assumes that the wind does not change the air distance,
      so no extra fuel is needed.

      - **{{d2}} kg**: uses the total change of the wind component directly as
      fuel in kg.

      - **{{d3}} kg**: multiplies the total wind change by the fuel per NAM,
      which is not the change in air distance.
