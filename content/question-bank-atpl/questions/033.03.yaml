- id: QOIRDCUN
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335667
    - BGS-331192
    - ATPLGS-627127
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      Given the following information, calculate the total fuel for engine start
      and taxi (in kg).


      - Start fuel: {{start_fuel}} litres

      - Taxi fuel flow: {{taxi_flow}} litres per hour

      - Taxi time: {{taxi_time}} minutes

      - Fuel density: {{density}} kilograms per litre
    variables:
      - id: start_fuel
        label: Start fuel
        unit: l
      - id: taxi_flow
        label: Taxi fuel flow
        unit: l/h
      - id: taxi_time
        label: Taxi time
        unit: min
      - id: density
        label: Fuel density
        unit: kg/l
    answer:
      formula: (start_fuel + taxi_flow * taxi_time / 60) * density
      unit: kg
      decimals: 1
    distractors:
      - id: d1
        formula: start_fuel + taxi_flow * taxi_time / 60
      - id: d2
        formula: taxi_flow * taxi_time / 60 * density
      - id: d3
        formula: (start_fuel + taxi_flow * taxi_time) * density
      - id: d4
        formula: (start_fuel + taxi_flow * taxi_time / 60) / density
    presets:
      - id: p1
        values:
          start_fuel: 20
          taxi_flow: 150
          taxi_time: 10
          density: 0.82
      - id: p2
        values:
          start_fuel: 30
          taxi_flow: 200
          taxi_time: 15
          density: 0.8
    explanation: >-
      The fuel needed for engine start and taxi is the start fuel plus the taxi
      fuel burnt. The taxi fuel volume is the flow rate multiplied by the time
      (converted from minutes to hours). The total volume is then converted to
      mass with the fuel density.


      **Solution**


      Taxi fuel volume = {{= taxi_flow * taxi_time / 60}} l


      Total volume = {{= start_fuel + taxi_flow * taxi_time / 60}} l


      {{f: (start_fuel + taxi_flow * taxi_time / 60) * density}} = {{n:
      (start_fuel + taxi_flow * taxi_time / 60) * density}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the litres of start and taxi fuel and forgets the
      density conversion, so a volume is given as a mass.

      - **{{d2}} kg**: uses only the taxi fuel and forgets the start fuel.

      - **{{d3}} kg**: does not convert the taxi time from minutes to hours.

      - **{{d4}} kg**: divides by the density instead of multiplying.
