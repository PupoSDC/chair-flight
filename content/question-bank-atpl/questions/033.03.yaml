    question: >-
      Consider the European regulations on air operations for Commercial Air
      Transport. Determine the Final Reserve Fuel for a turbine-engined
      aeroplane (30 minutes holding at 1500 ft above aerodrome elevation).


      The holding fuel flow read from the figure for the given mass and
      conditions is {{ff}} kg/h.
    variables:
      - id: ff
