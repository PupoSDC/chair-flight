      - id: p3
        values:
          taxi: 12
          tf: 360
    explanation: >-
      With the APU off, Taxi Fuel is just the expected taxi time multiplied by
      the taxi fuel flow from the figure.


      **Solution**


      {{f: taxi * tf / 60}} = {{n: taxi * tf / 60}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: doubles the taxi time (counts a second taxi phase).

      - **{{d2}} kg**: converts minutes to hours with 100 instead of 60.

