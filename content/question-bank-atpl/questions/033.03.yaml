- id: QUVSOCSX
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335322
    - ATPLGS-628481
    - BGS-331144
  annexes: []
  learningObjectives:
    - 033.03.03.04.02
  template:
    type: calculation
    question: >-
      Given the following information, what is the fuel volume in Imperial
      gallons? (1 Imperial gallon of water weighs 10 lb.)


      - Fuel mass: {{mass}} lb

      - Specific gravity: {{sg}}
    variables:
      - id: mass
        label: Fuel mass
        unit: lb
      - id: sg
        label: Specific gravity
        unit: ""
    answer:
      formula: mass / (sg * 10)
      unit: Imperial gallons
      decimals: 0
    distractors:
      - id: d1
        formula: mass / (sg * 8.345)
      - id: d2
        formula: mass * sg / 10
      - id: d3
        formula: mass / 10
    presets:
      - id: p1
        values:
          mass: 865
          sg: 0.81
      - id: p2
        values:
          mass: 1240
          sg: 0.79
      - id: p3
        values:
          mass: 1520
          sg: 0.8
    explanation: >-
      Volume is mass divided by density. The density of fuel is its specific
      gravity times the density of water, which is 10 lb per Imperial gallon.


      **Solution**


      {{f: mass / (sg * 10)}} = {{n: mass / (sg * 10)}} = **{{answer}} Imperial
      gallons**


      **Why the other answers are wrong**


      - **{{d1}} Imperial gallons**: the water density of a US gallon (8.345 lb)
      is used, giving US gallons.

      - **{{d2}} Imperial gallons**: the specific gravity is multiplied instead
      of divided.

      - **{{d3}} Imperial gallons**: the specific gravity is ignored.
- id: QUY1DWXGH
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336758
  annexes:
    - 033-flight-plan-navigation-log-legend-and-worked-example
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Assuming no significant change in fuel consumption, what
      is the planned remaining fuel at waypoint 40N 050W?


      - Fuel remaining at the previous waypoint in the flight log (read from
      figure): {{fuel_at_ref}} tonnes

      - Fuel burnt from that waypoint to 40N 050W (read from figure):
      {{fuel_used}} tonnes


      What is the planned remaining fuel at 40N 050W, in tonnes?
    variables:
      - id: fuel_at_ref
        label: Fuel remaining at the previous waypoint (read from figure)
        unit: tonnes
      - id: fuel_used
        label: Fuel burnt to 40N 050W (read from figure)
        unit: tonnes
    chartInputs:
      - fuel_at_ref
      - fuel_used
    answer:
      formula: fuel_at_ref - fuel_used
      unit: tonnes
      decimals: 1
    distractors:
      - id: d1
        formula: fuel_at_ref
      - id: d2
        formula: fuel_at_ref + fuel_used
      - id: d3
        formula: fuel_at_ref - 2 * fuel_used
      - id: d4
        formula: fuel_used
    presets:
      - id: p1
        values:
          fuel_at_ref: 33.4
          fuel_used: 3.7
      - id: p2
        values:
          fuel_at_ref: 28.6
          fuel_used: 4.2
    explanation: >-
      The fuel remaining at a waypoint is the fuel at the earlier point minus
      the fuel burnt since then. With no change in consumption, the burn is the
      one given in the flight log for the leg.


      **Solution**


      - Remaining fuel: {{f: fuel_at_ref - fuel_used}} = {{n: fuel_at_ref -
      fuel_used}} = **{{answer}} tonnes**


      **Why the other answers are wrong**


      - **{{d1}} tonnes**: forgets to subtract the fuel burnt.

      - **{{d2}} tonnes**: adds the fuel burnt instead of subtracting it.

      - **{{d3}} tonnes**: subtracts the fuel burnt twice.

      - **{{d4}} tonnes**: gives only the fuel burnt, not the fuel left.
