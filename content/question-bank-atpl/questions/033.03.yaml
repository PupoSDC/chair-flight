- id: QGOLVCSM
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335735
    - BGS-331285
    - AVEXAM-97345
    - AVEXAM-89801
    - ATPLGS-629411
    - ATPLGS-629278
    - BGS-331176
    - AVEXAM-63494
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the minimum take-off fuel
      required for a Commercial Air Transport flight in a jet aeroplane? A
      suitable airport has been nominated as the en-route alternate aerodrome.
      Assume the Basic Fuel Scheme without variations applies.


      - Air distance: {{air}} NM

      - Estimated TAS: {{tas}} kt

      - Estimated flight time to the alternate: {{alt_min}} minutes

      - Average fuel flow: {{ff}} kg/h

      - Final reserve: {{reserve}} kg

      - Extra fuel: 0 kg

      - Discretionary fuel: 0 kg


      What is the minimum take-off fuel?
    variables:
      - id: air
        label: Air distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: alt_min
        label: Flight time to alternate
        unit: min
      - id: ff
        label: Fuel flow
        unit: kg/h
      - id: reserve
        label: Final reserve
        unit: kg
    answer:
      formula: (air / tas * ff) * 1.03 + alt_min / 60 * ff + reserve
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (air / tas * ff) + alt_min / 60 * ff + reserve
      - id: d2
        formula: (air / tas * ff) * 1.05 + alt_min / 60 * ff + reserve
      - id: d3
        formula: (air / tas * ff) * 1.03 + reserve
      - id: d4
        formula: (air / tas * ff) * 1.03 + alt_min / 60 * ff
    presets:
      - id: p1
        values:
          air: 2725
          tas: 431
          alt_min: 34
          ff: 3048
          reserve: 1351
      - id: p2
        values:
          air: 2000
          tas: 400
          alt_min: 30
          ff: 2800
          reserve: 1200
    explanation: >-
      The minimum take-off fuel under the basic fuel scheme is the trip fuel,
      the contingency fuel, the fuel to the alternate and the final reserve,
      plus any extra and discretionary fuel (both zero here). With an en-route
      alternate the contingency fuel is 3 % of the trip fuel.


      **Solution**


      - Trip fuel: {{= air / tas * ff}} kg

      - Contingency fuel (3 % of trip fuel): {{= air / tas * ff * 0.03}} kg

      - Fuel to the alternate: {{= alt_min / 60 * ff}} kg

      - Final reserve: {{= reserve}} kg


      Minimum take-off fuel = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the contingency fuel.

      - **{{d2}} kg**: uses a 5 % contingency instead of 3 %.

      - **{{d3}} kg**: forgets the fuel to the alternate.

      - **{{d4}} kg**: forgets the final reserve.
- id: QGSILUKY
  docId: "033.03"
  relatedQuestions:
    - QYWWWS5SP
  externalIds:
    - ATPLQ-333537
    - AVEXAM-85939
    - AVEXAM-88118
  annexes:
    - 033-long-range-cruise-table-two-engine-jet-aeroplane
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. A twin-engine jet aeroplane cruises at FL370. Given:


      Mass: 52 500 kg (constant)

      TAT: -42 ºC

      Distance to Top-of-Descent: {{dist}} NM

      Nil wind


      The TAS ({{tas}} kt) and the total fuel flow ({{ff}} kg/h) for these
      conditions are read from the figure. What is the fuel required for the
      remainder of the cruise?
    variables:
      - id: dist
        label: Distance to top of descent
        unit: NM
      - id: tas
        label: TAS read from the figure
        unit: kt
      - id: ff
        label: Fuel flow read from the figure
        unit: kg/h
    chartInputs:
      - tas
      - ff
    answer:
      formula: dist / tas * ff
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tas * ff * 1.02
      - id: d2
        formula: dist / (tas - 20) * ff
      - id: d3
        formula: dist / (tas + 20) * ff
      - id: d4
        formula: (dist + 10) / tas * ff
    presets:
      - id: p1
        values:
          dist: 164
          tas: 450
          ff: 1998
      - id: p2
        values:
          dist: 120
          tas: 445
          ff: 2010
    explanation: >-
      In nil wind the ground speed equals the TAS, so the time to the top of
      descent is distance divided by TAS. The fuel is that time multiplied by
      the fuel flow taken from the cruise chart.


      **Solution**


      {{f: dist / tas * ff}} = {{n: dist / tas * ff}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: fuel flow increased by 2 %, a chart misreading.

      - **{{d2}} kg**: TAS read too low, which lengthens the time.

      - **{{d3}} kg**: TAS read too high, which shortens the time.

      - **{{d4}} kg**: distance taken too large by 10 NM.
