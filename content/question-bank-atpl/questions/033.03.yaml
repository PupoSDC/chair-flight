- id: QNFZSROC
  docId: "033.03"
  relatedQuestions:
    - QODRLAAU
  externalIds:
    - ATPLQ-333992
    - AVEXAM-67360
    - AVEXAM-39734
    - ATPLGS-628082
    - AVEXAM-45541
    - AVEXAM-5299
    - AVEXAM-76252
  annexes: []
  learningObjectives:
    - 033.03.02.03.08
  template:
    type: calculation
    question: >-
      An IFR flight from departure A to destination B applies the decision point
      procedure (DPP), with decision point DP and en-route alternate C.
      Determine the trip fuel required.


      - Distance A to B: {{dist_ab}} NM

      - Distance A to C: {{dist_ac}} NM

      - Distance A to DP: {{dist_dp}} NM

      - TAS: {{tas}} kt

      - Tailwind component (TWC): {{tailwind}} kt

      - Fuel flow: {{flow}} kg/h
    variables:
      - id: dist_ab
        label: Distance A to B
        unit: NM
      - id: dist_ac
        label: Distance A to C
        unit: NM
      - id: dist_dp
        label: Distance A to DP
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: tailwind
        label: Tailwind component
        unit: kt
      - id: flow
        label: Fuel flow
        unit: kg/h
    answer:
      formula: flow * dist_ab / (tas + tailwind)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: flow * dist_ab / (tas - tailwind)
      - id: d2
        formula: flow * dist_dp / (tas + tailwind)
      - id: d3
        formula: flow * dist_ac / (tas + tailwind)
      - id: d4
        formula: flow * dist_ab / tas
    presets:
      - id: p1
        values:
          dist_ab: 2300
          dist_ac: 1300
          dist_dp: 1150
          tas: 470
          tailwind: 32
          flow: 2600
      - id: p2
        values:
          dist_ab: 3000
          dist_ac: 1500
          dist_dp: 1400
          tas: 450
          tailwind: 20
          flow: 2800
    explanation: >-
      The trip fuel is the fuel flow multiplied by the time needed to fly the
      trip distance A to B. The groundspeed is the TAS plus the tailwind
      component. The decision point and alternate distances are not part of the
      trip fuel for this calculation.


      **Solution**


      Groundspeed = {{= tas + tailwind}} kt


      {{f: flow * dist_ab / (tas + tailwind)}} = {{n: flow * dist_ab / (tas +
      tailwind)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: subtracts the tailwind from the TAS instead of adding it.

      - **{{d2}} kg**: uses the distance to the decision point instead of the
      distance to B.

      - **{{d3}} kg**: uses the distance to the alternate instead of the
      distance to B.

      - **{{d4}} kg**: ignores the tailwind component.
- id: QNGKSPWG
  docId: "033.03"
  relatedQuestions:
    - QZTDHBFP
  externalIds:
    - ATPLQ-335116
    - ATPLGS-123147
    - ATPLGS-626409
    - AVEXAM-10842
    - AVEXAM-17704
    - AVEXAM-18293
    - AVEXAM-20983
    - AVEXAM-30646
    - AVEXAM-41243
    - AVEXAM-4248
    - AVEXAM-43746
    - AVEXAM-45268
    - BGS-331248
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes what is the required block fuel for an
      IFR flight with a turbine engine jet aircraft? Assume the Basic Fuel
      Scheme WITHOUT variations applies.


      - Taxi fuel (including APU usage): {{taxi}} kg

      - Fuel for the climb to cruise level: {{climb}} kg

      - Cruise distance to destination: {{dist}} NAM

      - Cruise fuel consumption: {{cons}} kg/NAM

      - Fuel for descent to the destination: {{desc}} kg

      - Fuel for approach & landing at destination: {{appr}} kg

      - Contingency fuel: {{cont}}% of trip

      - Fuel for alternate: {{alt}} kg

      - Holding fuel flow at destination & alternate: {{holdff}} kg/h

      - Missed approach fuel at alternate: {{missed}} kg


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: taxi
        label: Taxi fuel (including APU usage)
        unit: kg
      - id: climb
        label: Fuel for the climb to cruise level
        unit: kg
      - id: dist
        label: Cruise distance to destination
        unit: NAM
      - id: cons
        label: Cruise fuel consumption
        unit: kg/NAM
      - id: desc
        label: Fuel for descent to the destination
        unit: kg
      - id: appr
        label: Fuel for approach & landing at destination
        unit: kg
      - id: cont
        label: Contingency percentage
        unit: "%"
      - id: alt
        label: Fuel for alternate
        unit: kg
      - id: holdff
        label: Holding fuel flow
        unit: kg/h
      - id: missed
        label: Missed approach fuel at alternate
        unit: kg
    answer:
      formula: taxi + (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt +
        holdff * 0.5
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt + holdff *
          0.5
      - id: d2
        formula: taxi + (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt +
          holdff * 0.5 + missed
      - id: d3
        formula: (climb + dist * cons + desc + appr) + alt + holdff * 0.5
    presets:
      - id: p1
        values:
          taxi: 150
          climb: 1600
          dist: 570
          cons: 6
          desc: 270
          appr: 450
          cont: 5
          alt: 2150
          holdff: 2200
          missed: 270
      - id: p2
        values:
          taxi: 200
          climb: 1500
          dist: 480
          cons: 5.5
          desc: 250
          appr: 400
          cont: 5
          alt: 1900
          holdff: 2100
          missed: 250
      - id: p3
        values:
          taxi: 120
          climb: 1800
          dist: 700
          cons: 6.5
          desc: 300
          appr: 500
          cont: 5
          alt: 2400
          holdff: 2300
          missed: 320
    explanation: >-
      Fuel is planned under the Basic Fuel Scheme: trip fuel (climb, cruise,
      descent, approach and landing), contingency fuel, alternate fuel and final
      reserve fuel and the taxi fuel.


      **Solution**


      Trip fuel = {{climb}} + {{dist}} × {{cons}} + {{desc}} + {{appr}} = {{=
      (climb + dist * cons + desc + appr)}} kg

      Contingency fuel = {{cont}}% of trip fuel = {{= (climb + dist * cons +
      desc + appr) * cont / 100}} kg

      Final reserve fuel = 30 min × {{holdff}} kg/h = {{= holdff * 0.5}} kg


      {{f: taxi + (climb + dist * cons + desc + appr) * (1 + cont / 100) + alt +
      holdff * 0.5}} = {{n: taxi + (climb + dist * cons + desc + appr) * (1 +
      cont / 100) + alt + holdff * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the taxi fuel is forgotten (this is the take-off fuel).

      - **{{d2}} kg**: the missed approach fuel at the alternate is added on
      top; it is already part of the alternate fuel.

      - **{{d3}} kg**: taxi fuel and contingency fuel are both forgotten.
- id: QNHLIOOR
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331707
    - ATPLGS-629256
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      Given the following data: cruise TAS {{tas}} kt, fuel flow in cruise
      {{ff}} US gal/h, cruise distance {{dist}} NM.


      Once the climb is completed, there is {{hw}} kt of headwind.


      What is the cruise fuel?
    variables:
      - id: tas
        label: Cruise TAS
        unit: kt
      - id: ff
        label: Fuel flow
        unit: US gal/h
      - id: dist
        label: Cruise distance
        unit: NM
      - id: hw
        label: Headwind
        unit: kt
    answer:
      formula: ff * (dist / (tas - hw))
      unit: US gal
      decimals: 0
    distractors:
      - id: d1
        formula: ff * dist / tas
      - id: d2
        formula: ff * dist / (tas + hw)
      - id: d3
        formula: ff * dist / (tas - 2 * hw)
      - id: d4
        formula: ff * (tas - hw) / dist
    presets:
      - id: p1
        values:
          tas: 120
          ff: 22
          dist: 150
          hw: 20
      - id: p2
        values:
          tas: 110
          ff: 18
          dist: 220
          hw: 15
      - id: p3
        values:
          tas: 130
          ff: 24
          dist: 180
          hw: 25
    explanation: >-
      Cruise fuel is the fuel flow multiplied by the cruise time, and the cruise
      time is the distance divided by the ground speed (TAS minus headwind).


      **Solution**


      {{f: ff * (dist / (tas - hw))}} = {{n: ff * (dist / (tas - hw))}} =
      **{{answer}} US gal**


      **Why the other answers are wrong**


      - **{{d1}} US gal**: the wind was ignored.

      - **{{d2}} US gal**: the headwind was added to the TAS.

      - **{{d3}} US gal**: the headwind was subtracted twice.

      - **{{d4}} US gal**: the ground speed was divided by the distance
      (inverted ratio).
