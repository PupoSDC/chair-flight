- id: QBKBMPMM
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337587
    - AVEXAM-87056
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      The fuel flow in the cruise was exactly as the crew expected when planning
      the flight.


      The Flight Log shows {{fp}} kg remaining at the previous waypoint and a
      planned fuel flow of {{ff}} kg/h; {{el}} min later the fuel check is made
      overhead TORDU at 19:42.


      What is the expected fuel remaining at TORDU?


      All Flight Log fuels are in kg.
    variables:
      - id: fp
        label: Fuel remaining at the previous waypoint (from log)
        unit: kg
      - id: ff
        label: Planned fuel flow (from log)
        unit: kg/h
      - id: el
        label: Time since the previous waypoint
        unit: min
    chartInputs:
      - fp
      - ff
    answer:
      formula: fp - ff * el / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fp - ff * el / 100
      - id: d2
        formula: fp + ff * el / 60
      - id: d3
        formula: fp - ff * (el + 5) / 60
      - id: d4
        formula: fp - ff * (el - 5) / 60
    presets:
      - id: p1
        values:
          fp: 383
          ff: 240
          el: 30
      - id: p2
        values:
          fp: 450
          ff: 300
          el: 24
    explanation: >-
      The expected fuel remaining is the fuel at the last known point minus the
      fuel burned since then (fuel flow multiplied by elapsed time).


      **Solution**


      {{f: fp - ff * el / 60}} = {{n: fp - ff * el / 60}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: minutes converted to hours by dividing by 100.

      - **{{d2}} kg**: fuel burned added instead of subtracted.

      - **{{d3}} kg**: elapsed time taken 5 min too long.

      - **{{d4}} kg**: elapsed time taken 5 min too short.
