  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the minimum fuel required at the
      destination airport for a flight from Munich to London Heathrow, given the
      following information? Assume the Basic Fuel Scheme WITHOUT variations
      applies.


      - Trip fuel: {{trip}} kg

      - Contingency fuel: {{cont}} kg

      - Alternate fuel: {{alt}} kg

      - Final reserve fuel: {{final}} kg


      Extra fuel: 0 kg

      Discretionary fuel: 0 kg
    variables:
      - id: trip
        label: Trip fuel
        unit: kg
      - id: cont
        label: Contingency fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: final
        label: Final reserve fuel
        unit: kg
    answer:
      formula: alt + final
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: cont + alt + final
      - id: d2
        formula: final
      - id: d3
        formula: cont + final
      - id: d4
        formula: trip + alt + final
    presets:
      - id: p1
        values:
          trip: 3800
          cont: 230
          alt: 1200
          final: 1300
      - id: p2
        values:
          trip: 4200
          cont: 210
          alt: 900
          final: 1100
      - id: p3
        values:
          trip: 2900
          cont: 150
          alt: 1500
          final: 1250
    explanation: >-
      The fuel required on arrival at the destination is the fuel needed to fly
      on to the alternate plus the final reserve. Trip fuel is burnt before
      arrival, and contingency fuel is also part of the planned burn to the
      destination, so neither is counted.


      **Solution**


      {{f: alt + final}} = {{n: alt + final}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the contingency fuel, which is carried for the trip
      and is not part of the fuel required at the destination.

      - **{{d2}} kg**: only the final reserve fuel, forgetting the alternate
      fuel.

      - **{{d3}} kg**: uses contingency plus final reserve and forgets the
      alternate fuel.

      - **{{d4}} kg**: includes the trip fuel, which has already been burnt on
      arrival.
