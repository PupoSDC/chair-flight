- id: QC4LKWVQ5
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334011
    - AVEXAM-95251
    - AVEXAM-6564
  annexes:
    - 033-0-74-mach-cruise-trip-graph
    - CAP-697-page-85
  learningObjectives:
    - "033.03"
  template:
    type: chart
    question: >-
      Refer to figure or CAP 697 Figure 4.3.2c and CAP 697 Figure 4.5.3.2 for
      pressure altitude {{pa}} ft. Which change to forecast conditions will
      produce the greatest increase in trip fuel required for the following
      Medium Range Jet Transport (MRJT) flight?


      - Cruise level: FL370

      - Cruise speed: Mach 0.74

      - Trip distance: {{distance}} NM


      Which change produces the greatest increase in trip fuel?
    explanation: ""
    variables:
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: distance
        label: Trip distance
        unit: NM
    entries:
      - id: e1
        values:
          pa: 37000
          distance: 2000
        answer: headwind component from 0 kt to 50 kt.
        wrongAnswers:
          - headwind component from 0 kt to 30 kt plus a change in OAT from ISA
            to ISA -10° C.
          - headwind component from 0 kt to 30 kt plus a change in OAT from ISA
            to ISA + 5°C.
          - OAT from ISA to ISA + 20° C.
        explanation: >-
          The change in trip fuel is found by reading the wind and temperature
          charts at the same pressure altitude and comparing the changes. A
          headwind rising to 50 kt increases the trip fuel more than the other
          changes shown.


          **Solution**


          - Read the increase in trip fuel for {{distance}} NM at Mach 0.74 when
          the headwind rises from 0 kt to 50 kt, and compare it with the other
          changes at {{pa}} ft.

          - The largest increase is **headwind component from 0 kt to 50 kt.**


          **Why the other answers are wrong**


          - **headwind component from 0 kt to 30 kt plus a change in OAT from
          ISA to ISA -10° C.**: a smaller headwind, and the temperature change
          adds less than the 50 kt headwind.

          - **headwind component from 0 kt to 30 kt plus a change in OAT from
          ISA to ISA + 5°C.**: a smaller headwind, with only a small temperature
          effect.

          - **OAT from ISA to ISA + 20° C.**: a temperature change alone gives a
          smaller increase than the 50 kt headwind.
