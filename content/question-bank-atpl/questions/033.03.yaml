  template:
    type: calculation
    question: |-
      Given:

      - Fuel volume: {{vol}} US gallons
      - Fuel density: {{dens}} kg/l

      The fuel mass is:
    variables:
      - id: vol
        label: Fuel volume
        unit: US gal
      - id: dens
        label: Fuel density
        unit: kg/l
    answer:
      formula: vol * 3.78541 * dens
      unit: kg
      decimals: 0
    distractors:
      - id: d1
