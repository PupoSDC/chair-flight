  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: |-
      Given:

      - Dry Operating Mass: {{dom}} kg
      - Zero Fuel Mass: {{zfm}} kg
      - Trip Fuel: {{trip}} kg
      - Take-Off Fuel: {{tof}} kg

      The traffic load is:
    variables:
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: zfm
        label: Zero fuel mass
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: tof
        label: Take-off fuel
        unit: kg
    answer:
      formula: zfm - dom
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: zfm - dom + trip
      - id: d2
        formula: tof + trip
      - id: d3
        formula: zfm - tof
      - id: d4
        formula: dom - zfm
    presets:
      - id: p1
        values:
          dom: 4920
          zfm: 5740
          trip: 670
          tof: 1050
      - id: p2
        values:
          dom: 4500
          zfm: 5300
          trip: 500
          tof: 900
    explanation: >-
      The traffic load (payload) is the mass of passengers, cargo and mail. It
      is the zero fuel mass minus the dry operating mass, because the zero fuel
      mass includes the payload but no fuel and the dry operating mass is the
      aircraft ready for service without payload or fuel.


      **Solution**


      {{f: zfm - dom}} = {{n: zfm - dom}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the trip fuel, but fuel is not part of the zero fuel
      mass.

      - **{{d2}} kg**: adds take-off fuel and trip fuel, which are not part of
      the traffic load.

      - **{{d3}} kg**: subtracts take-off fuel from the zero fuel mass, mixing
      fuel with the payload calculation.

      - **{{d4}} kg**: inverts the subtraction, giving a sign error.
