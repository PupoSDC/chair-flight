- id: Q4CKZXP1B
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337624
    - ATPLGS-629335
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: |-
      Your fuel flow and fuel quantity are:

      - Fuel flow: {{flow}} US gallons per hour
      - Fuel quantity: {{fuel}} imperial gallons

      What is your endurance? Give the answer in hours and minutes.
    variables:
      - id: flow
        label: Fuel flow
        unit: US gal/h
      - id: fuel
        label: Fuel quantity
        unit: imp gal
    answer:
      formula: round(fuel * 1.20095 / flow * 60)
      unit: minutes
      decimals: 0
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: round(fuel / flow * 60)
      - id: d2
        formula: round(fuel * 0.8327 / flow * 60)
      - id: d3
        formula: round((fuel * 1.20095 - 5) / flow * 60)
    presets:
      - id: p1
        values:
          flow: 17
          fuel: 45
      - id: p2
        values:
          flow: 15
          fuel: 30
    explanation: >-
      The fuel quantity is given in imperial gallons, but the fuel flow is in US
      gallons. One imperial gallon is 1.20095 US gallons, so the fuel quantity
      is converted first. The endurance is then the converted quantity divided
      by the fuel flow, and converted from hours to minutes.


      **Solution**


      {{f: fuel * 1.20095 / flow * 60}} = {{n: fuel * 1.20095 / flow * 60}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} min**: uses the imperial gallons as if they were US gallons, so
      the conversion is missing.

      - **{{d2}} min**: converts in the wrong direction, multiplying by 0.8327
      instead of 1.20095.

      - **{{d3}} min**: subtracts 5 US gallons from the fuel, which is not part
      of the calculation.
- id: Q5PRQBXHG
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331454
    - AVEXAM-5346
  annexes:
    - 033-long-range-cruise-table-two-engine-jet-aeroplane
  learningObjectives:
    - "033.03"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      You are cruising at FL380 with a twin-engined jet aeroplane.


      Due to turbulence you descend to FL360.


      Determine the fuel consumed at FL360 until the top of descent.


      The distance travelled at FL360 is {{dist}} NM (TAT -17 degrees C, mass 65
      000 kg).


      From the figure, the total fuel flow is {{ff}} kg/h and the ground speed
      is {{gs}} kt.
    variables:
      - id: dist
        label: Distance at FL360
        unit: NM
      - id: ff
        label: Fuel flow (from figure)
        unit: kg/h
      - id: gs
        label: Ground speed (from figure)
        unit: kt
    chartInputs:
      - ff
      - gs
    answer:
      formula: ff * dist / gs
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * dist / (gs - 20)
      - id: d2
        formula: ff * dist / (gs + 20)
      - id: d3
        formula: ff * dist / (gs * 0.9)
      - id: d4
        formula: ff * dist / gs - 100
    presets:
      - id: p1
        values:
          dist: 295
          ff: 2300
          gs: 440
      - id: p2
        values:
          dist: 280
          ff: 2100
          gs: 450
      - id: p3
        values:
          dist: 310
          ff: 2400
          gs: 430
    explanation: >-
      Fuel consumed is the fuel flow multiplied by the time, and the time is the
      distance divided by the ground speed. Fuel flow and ground speed are read
      from the figure.


      **Solution**


      {{f: ff * dist / gs}} = {{n: ff * dist / gs}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the ground speed was misread 20 kt too low.

      - **{{d2}} kg**: the ground speed was misread 20 kt too high.

      - **{{d3}} kg**: the ground speed was misread about 10% too low.

      - **{{d4}} kg**: 100 kg was subtracted by a misread of the fuel flow.
- id: Q6JQAVLZX
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333313
    - ATPLGS-629486
    - AVEXAM-17944
    - AVEXAM-58959
    - ATPLGS-629440
  annexes: []
  learningObjectives:
    - "033.03"
  template:
    type: calculation
    question: >-
      Given the following information, the pilot decides to fly with a TAS of
      {{tas2}} kt because of a stronger headwind than forecast. What will be the
      difference in fuel consumption between the planned and the actual
      conditions?


      - Distance A-B: {{dist}} NM

      - Planned TAS: {{tas1}} kt

      - Planned headwind component: {{hw1}} kt

      - Actual headwind component: {{hw2}} kt

      - Fuel flow at TAS {{tas1}} kt: {{ff1}} kg/h

      - Fuel flow at TAS {{tas2}} kt: {{ff2}} kg/h
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: tas1
        label: Planned TAS
        unit: kt
      - id: hw1
        label: Planned headwind
        unit: kt
      - id: tas2
        label: Actual TAS
        unit: kt
      - id: hw2
        label: Actual headwind
        unit: kt
      - id: ff1
        label: Planned fuel flow
        unit: kg/h
      - id: ff2
        label: Actual fuel flow
        unit: kg/h
    answer:
      formula: ff2 * dist / (tas2 - hw2) - ff1 * dist / (tas1 - hw1)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff1 * dist / (tas1 - hw1)
      - id: d2
        formula: ff2 - ff1
      - id: d3
        formula: ff2 * dist / (tas2 - hw2) - ff1 * dist / tas1
      - id: d4
        formula: ff2 * dist / (tas2 - hw2)
    presets:
      - id: p1
        values:
          dist: 240
          tas1: 130
          hw1: 10
          tas2: 140
          hw2: 25
          ff1: 36
          ff2: 42
      - id: p2
        values:
          dist: 300
          tas1: 150
          hw1: 10
          tas2: 160
          hw2: 30
          ff1: 48
          ff2: 55
      - id: p3
        values:
          dist: 180
          tas1: 120
          hw1: 5
          tas2: 130
          hw2: 20
          ff1: 30
          ff2: 37
    explanation: >-
      Fuel for a leg is the fuel flow multiplied by the flight time, and the
      flight time is the distance divided by the ground speed (TAS minus
      headwind). Compute the fuel for the planned and the actual conditions and
      subtract.


      **Solution**


      Planned: {{n: ff1 * dist / (tas1 - hw1)}} = {{= ff1 * dist / (tas1 -
      hw1)}} kg


      Actual: {{n: ff2 * dist / (tas2 - hw2)}} = {{= ff2 * dist / (tas2 - hw2)}}
      kg


      Difference = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is only the planned fuel, not the difference.

      - **{{d2}} kg**: this is just the difference in fuel flow, ignoring the
      flight time.

      - **{{d3}} kg**: the planned fuel is computed with TAS instead of ground
      speed (wind ignored).

      - **{{d4}} kg**: this is the actual fuel consumption, not the difference.
