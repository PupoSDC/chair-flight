  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, determine the required trip fuel for a
      turbine-engine jet aircraft. Assume the Basic Fuel Scheme WITHOUT
      variations applies.


      - Taxi fuel: {{taxi}} kg

      - APU consumption: {{apu}} kg

      - Take-off and climb fuel: {{takeoff}} kg

      - Cruise fuel flow: {{flow}} kg/h

      - Cruise time: {{cruise_min}} min

      - Descent and landing fuel: {{descent}} kg


      Contingency fuel: 5% or 5 min

      Alternate fuel: 2200 kg

      Final reserve fuel: 1100 kg

      Extra fuel: 0 kg

      Discretionary fuel: 0 kg


      Give the trip fuel in kg.
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: apu
        label: APU consumption
        unit: kg
      - id: takeoff
        label: Take-off and climb fuel
        unit: kg
      - id: flow
        label: Cruise fuel flow
        unit: kg/h
      - id: cruise_min
        label: Cruise time
        unit: min
      - id: descent
        label: Descent and landing fuel
        unit: kg
    answer:
      formula: takeoff + flow * cruise_min / 60 + descent
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: takeoff + flow * cruise_min / 60 + descent + taxi
      - id: d2
        formula: takeoff + flow * cruise_min / 60 + descent + apu
      - id: d3
        formula: takeoff + flow * cruise_min / 60
      - id: d4
        formula: takeoff + flow * cruise_min + descent
    presets:
      - id: p1
        values:
          taxi: 240
          apu: 100
          takeoff: 1550
          flow: 2820
          cruise_min: 165
          descent: 280
      - id: p2
        values:
          taxi: 200
          apu: 80
          takeoff: 1200
          flow: 2600
          cruise_min: 120
          descent: 250
    explanation: >-
      The trip fuel is the take-off and climb fuel, plus the cruise fuel flow
      multiplied by the cruise time (converted to hours), plus the descent and
      landing fuel. Taxi fuel, APU fuel, contingency, alternate and final
      reserve are not part of the trip fuel.


      **Solution**


      Cruise fuel = {{= flow * cruise_min / 60}} kg


      {{f: takeoff + flow * cruise_min / 60 + descent}} = {{n: takeoff + flow *
      cruise_min / 60 + descent}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the taxi fuel, which is not part of the trip fuel.

      - **{{d2}} kg**: adds the APU consumption, which is not part of the trip
      fuel.

      - **{{d3}} kg**: forgets the descent and landing fuel.

      - **{{d4}} kg**: uses the cruise time in minutes instead of hours.
