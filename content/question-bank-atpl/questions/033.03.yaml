    - ATPLGS-123086
  annexes: []
  learningObjectives:
    - 033.03.01.01.03
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the minimum Ramp Fuel load for
      the Commercial Air Transport flight with a Jet aeroplane, given the
      following information? Assume the Basic Fuel Scheme WITHOUT variations
      applies.


      - Standard taxi fuel: {{taxi}} kg

      - Average cruise consumption: {{cruise_ff}} kg/h

      - Holding fuel consumption at 1 500 ft above alternate airfield elevation:
      {{hold_ff}} kg/h

      - Flight time from departure to destination: {{trip_time}} hours

      - Fuel for diversion to alternate: {{alt}} kg


      Extra Fuel: 0 kg

      Discretionary Fuel: 0 kg
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: cruise_ff
        label: Cruise fuel flow
        unit: kg/h
      - id: hold_ff
        label: Holding fuel flow
        unit: kg/h
      - id: trip_time
        label: Flight time
        unit: h
      - id: alt
        label: Alternate fuel
        unit: kg
    answer:
      formula: taxi + cruise_ff * trip_time * 1.05 + alt + hold_ff * 0.5
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + cruise_ff * trip_time + alt + hold_ff * 0.5
      - id: d2
        formula: cruise_ff * trip_time * 1.05 + alt + hold_ff * 0.5
      - id: d3
        formula: taxi + cruise_ff * trip_time * 1.05 + alt + hold_ff * 0.75
      - id: d4
        formula: taxi + cruise_ff * trip_time * 1.05 + alt
    presets:
      - id: p1
        values:
          taxi: 600
          cruise_ff: 10000
          hold_ff: 8000
          trip_time: 6
          alt: 10200
      - id: p2
        values:
          taxi: 500
          cruise_ff: 2600
          hold_ff: 2200
          trip_time: 3
          alt: 3100
      - id: p3
        values:
          taxi: 350
          cruise_ff: 5400
          hold_ff: 4600
          trip_time: 4.5
          alt: 5200
    explanation: >-
      Under the Basic Fuel Scheme the ramp fuel is taxi fuel plus trip fuel,
      contingency fuel (5% of the trip fuel), alternate fuel and final reserve
      fuel (30 minutes of holding at 1 500 ft for a jet), plus any extra or
      discretionary fuel (zero here).


      **Solution**


      Trip fuel = {{cruise_ff}} * {{trip_time}} = {{= cruise_ff * trip_time}} kg


      Contingency = 5% of trip = {{= 0.05 * cruise_ff * trip_time}} kg


      Final reserve = {{hold_ff}} * 0.5 = {{= hold_ff * 0.5}} kg


      Ramp fuel = {{taxi}} + {{= cruise_ff * trip_time}} + {{= 0.05 * cruise_ff
      * trip_time}} + {{alt}} + {{= hold_ff * 0.5}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: forgets the 5% contingency fuel.

      - **{{d2}} kg**: forgets the taxi fuel.

      - **{{d3}} kg**: uses 45 minutes instead of 30 minutes of holding for the
      final reserve.

      - **{{d4}} kg**: forgets the final reserve fuel.
- id: QPQHKFLYV
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337827
    - ATPLGS-629358
    - AVEXAM-68487
    - BGS-331207
