    - 033.03.02.03.08
  template:
    type: calculation
    question: >-
      Given the following information for a Commercial Air Transport operation,
      calculate the maximum possible Extra Fuel to be uplifted, if the Commander
      wants to climb directly to the optimum altitude of 37 000 ft.


      - Maximum Take-off Mass (MTOM) to climb at FL370: {{mtom}} kg

      - Regulated Take-Off Mass (RTOM): {{rtom}} kg

      - Maximum Landing Mass (MLM): {{mlm}} kg

      - Actual Zero Fuel Mass (AZFM): {{azfm}} kg

      - Taxi Fuel: {{taxi}} kg

      - Trip Fuel: {{trip}} kg

      - Minimum Block Fuel: {{mb}} kg
    variables:
      - id: mtom
        label: MTOM to climb at FL370
        unit: kg
      - id: rtom
        label: RTOM
        unit: kg
      - id: mlm
        label: MLM
        unit: kg
      - id: azfm
        label: AZFM
        unit: kg
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: trip
        label: Trip fuel
        unit: kg
      - id: mb
        label: Minimum block fuel
        unit: kg
    answer:
      formula: min(mtom, rtom, mlm + trip) - azfm + taxi - mb
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: mb
      - id: d2
        formula: min(mtom, rtom, mlm + trip) - azfm + taxi
      - id: d3
        formula: mlm + trip - azfm + taxi - mb
    presets:
      - id: p1
        values:
          mtom: 68000
          rtom: 76000
          mlm: 66360
          azfm: 59031
          taxi: 240
          trip: 4761
          mb: 8000
      - id: p2
        values:
          mtom: 72000
          rtom: 78000
          mlm: 67000
          azfm: 60500
          taxi: 250
          trip: 5100
          mb: 8500
    explanation: >-
      The maximum block fuel is limited by the lowest of the take-off mass
      limits: the MTOM, the regulated take-off mass, and the landing-mass limit
      expressed at take-off (MLM + trip fuel). Fuel loaded is the limiting mass
      minus the zero fuel mass, plus the taxi fuel burned before take-off. The
      extra fuel is what remains above the minimum block fuel.


      **Solution**


      Limiting take-off mass = {{= min(mtom, rtom, mlm + trip)}} kg


      Maximum block fuel = {{= min(mtom, rtom, mlm + trip)}} - {{azfm}} +
      {{taxi}} = {{= min(mtom, rtom, mlm + trip) - azfm + taxi}} kg


      Extra fuel = {{f: min(mtom, rtom, mlm + trip) - azfm + taxi - mb}} = {{n:
      min(mtom, rtom, mlm + trip) - azfm + taxi - mb}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is just the minimum block fuel, not the extra fuel
      above it.

      - **{{d2}} kg**: this is the maximum block fuel; the minimum block fuel
      was not subtracted.

      - **{{d3}} kg**: the landing-mass limit (MLM + trip fuel) was used, but it
      is not the most limiting mass here; the MTOM is lower.
