          ff: 3100
          hold: 2800
    explanation: >-
      Block fuel = taxi fuel + trip fuel + contingency fuel + alternate fuel +
      final reserve. With a nominated en-route alternate, the contingency fuel
      is 3 % of the trip fuel but at least 5 minutes at holding fuel flow; the
      final reserve is 30 minutes at holding fuel flow. The taxi fuel at the
      destination is not part of the departure block fuel.


      **Solution**


      Contingency = max(3 % = {{= 0.03 * trip}} kg; 5 min = {{= hold * 5 / 60}}
      kg) = {{= max(0.03 * trip, hold * 5 / 60)}} kg

      Final reserve = 0.5 h * {{hold}} kg/h = {{= 0.5 * hold}} kg


      {{f: taxi + trip + max(0.03 * trip, hold * 5 / 60) + alt + 0.5 * hold}} =
      {{n: taxi + trip + max(0.03 * trip, hold * 5 / 60) + alt + 0.5 * hold}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: uses a 5 % contingency and ignores the 5 minute minimum.

      - **{{d2}} kg**: adds the destination taxi fuel, which is not carried in
      the departure block fuel.

      - **{{d3}} kg**: computes the final reserve with the average fuel flow
      instead of the holding fuel flow.

      - **{{d4}} kg**: uses 3 % of the trip fuel without applying the 5 minute
      minimum.

      - **{{d5}} kg**: omits the alternate fuel.
