- id: QSDXQJOI
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332275
    - AVEXAM-66119
    - BGS-330819
    - AVEXAM-20976
  annexes: []
  learningObjectives:
    - 033.03.02.05.01
  template:
    type: calculation
    question: >-
      For pre-flight planning purposes, what is the block fuel required for a
      {{t}} hours cruise time with a class B multi-engined piston aircraft? The
      departure aerodrome will be used as the alternate, in nil wind conditions.
      Assume the Basic Fuel Scheme WITHOUT variations applies.


      - Taxi fuel: {{taxi}} L

      - Normal fuel consumption: {{ff}} L/h

      - Holding fuel consumption: {{hold}} L/h

      - Climb fuel: {{climb}} L

      - Go-around / MAP fuel: {{map}} L

      - Approach and landing fuel: {{appr}} L


      Extra fuel: 0 L

      Discretionary fuel: 0 L
    variables:
      - id: t
        label: Cruise time
        unit: h
      - id: taxi
        label: Taxi fuel
        unit: L
      - id: ff
        label: Normal fuel flow
        unit: L/h
      - id: hold
        label: Holding fuel flow
        unit: L/h
      - id: climb
        label: Climb fuel
        unit: L
      - id: map
        label: Go-around fuel
        unit: L
      - id: appr
        label: Approach and landing fuel
        unit: L
    answer:
      formula: taxi + 1.05 * (climb + ff * t + appr) + (map + ff * t + appr) + 0.75 *
        hold
      unit: L
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + 1.05 * (climb + ff * t + appr) + (map + ff * t + appr)
      - id: d2
        formula: taxi + (climb + ff * t + appr) + (map + ff * t + appr) + 0.75 * hold
      - id: d3
        formula: 1.05 * (climb + ff * t + appr) + (map + ff * t + appr) + 0.75 * hold
      - id: d4
        formula: taxi + 1.05 * (climb + ff * t + appr) + (map + climb + ff * t + appr) +
          0.75 * hold
      - id: d5
        formula: taxi + 1.05 * (climb + ff * t + appr) + (map + ff * t + appr) + 0.5 *
          hold
    presets:
      - id: p1
        values:
          t: 2.4
          taxi: 10
          ff: 95
          hold: 76
          climb: 40
          map: 40
          appr: 20
      - id: p2
        values:
          t: 3
          taxi: 8
          ff: 80
          hold: 65
          climb: 35
          map: 35
          appr: 15
      - id: p3
        values:
          t: 1.5
          taxi: 12
          ff: 110
          hold: 90
          climb: 45
          map: 45
          appr: 25
    explanation: >-
      Under the Basic Fuel Scheme, block fuel = taxi + trip fuel + contingency
      (5 % of trip fuel) + alternate fuel + final reserve (45 minutes at holding
      consumption for piston aeroplanes). The trip fuel includes climb, cruise,
      and approach and landing. With the departure aerodrome as alternate, the
      alternate fuel consists of the go-around, a cruise of the same duration,
      and approach and landing.


      **Solution**


      Trip fuel = {{= climb + ff * t + appr}} L

      Contingency = 5 % = {{= 0.05 * (climb + ff * t + appr)}} L

      Alternate fuel = {{= map + ff * t + appr}} L

      Final reserve = 0.75 h * {{hold}} L/h = {{= 0.75 * hold}} L


      {{f: taxi + 1.05 * (climb + ff * t + appr) + (map + ff * t + appr) + 0.75
      * hold}} = {{n: taxi + 1.05 * (climb + ff * t + appr) + (map + ff * t +
      appr) + 0.75 * hold}} = **{{answer}} L**


      **Why the other answers are wrong**


      - **{{d1}} L**: forgets the final reserve.

      - **{{d2}} L**: forgets the 5 % contingency fuel.

      - **{{d3}} L**: forgets the taxi fuel.

      - **{{d4}} L**: adds a second climb to the alternate fuel.

      - **{{d5}} L**: uses a 30 minute final reserve instead of 45 minutes.
