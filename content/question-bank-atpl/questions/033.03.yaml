  template:
    type: chart-calculation
    question: >-
      Using the figure(s), determine the planned flight time for the following
      flight (zero wind, ISA).


      Air distance: {{dist}} NM


      The average air speed for the whole flight (take-off to landing, including
      climb and descent) read from the figure(s) is {{spd}} kt.


      Give the flight time in minutes.
    variables:
      - id: dist
        label: Air distance
        unit: NM
      - id: spd
        label: Average speed (from figure)
        unit: kt
    chartInputs:
      - spd
    answer:
      formula: round(dist / spd * 60)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: round(dist / spd * 60 * 1.18)
      - id: d2
        formula: round(dist / spd * 60 - 15)
      - id: d3
        formula: round(dist / spd * 60 + 30)
      - id: d4
        formula: round(dist / (spd + 40) * 60)
    presets:
      - id: p1
        values:
          dist: 2000
          spd: 394.7
      - id: p2
        values:
          dist: 1500
          spd: 430.6
      - id: p3
        values:
          dist: 1200
          spd: 420
    explanation: >-
      With zero wind the flight time equals the air distance divided by the
      average speed. The average speed (or time) for the given mass, level, Mach
      number and centre of gravity is taken from the figure(s).


      **Solution**


      {{f: dist / spd * 60}} = {{n: dist / spd * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the speed was misread, giving too long a time.

      - **{{d2}} min**: the time was misread (too short).

      - **{{d3}} min**: a fixed 30 minutes was added for climb and descent
      twice.

      - **{{d4}} min**: the speed was misread, giving too short a time.
