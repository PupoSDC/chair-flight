  template:
    type: calculation
    question: >-
      Determine the minimum planning fuel required for departure. Assume the
      Basic Fuel Scheme without variations applies and a destination alternate
      is required.


      - Taxi fuel: {{taxi}} lb

      - Trip fuel: {{trip}} lb

      - Contingency fuel: {{cont}} lb

      - Destination alternate fuel: {{alt}} lb

      - Final reserve fuel: {{frf}} lb

      - Extra fuel: {{extra}} lb

      - Tankering fuel: {{tank}} lb


      What is the minimum planning fuel for departure?
    variables:
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: trip
        label: Trip fuel
        unit: lb
      - id: cont
        label: Contingency fuel
        unit: lb
      - id: alt
        label: Destination alternate fuel
        unit: lb
      - id: frf
        label: Final reserve fuel
        unit: lb
      - id: extra
        label: Extra fuel
        unit: lb
      - id: tank
        label: Tankering fuel
        unit: lb
    answer:
      formula: taxi + trip + cont + alt + frf + extra + tank
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: taxi + trip + cont + alt + frf + extra
      - id: d2
        formula: trip + cont + alt + frf + extra + tank
      - id: d3
        formula: taxi + trip + cont + frf + extra + tank
      - id: d4
        formula: taxi + trip + cont + alt + frf + extra - tank
    presets:
      - id: p1
        values:
          taxi: 100
          trip: 2862
          cont: 143
          alt: 494
          frf: 430
          extra: 0
          tank: 971
      - id: p2
        values:
          taxi: 120
          trip: 3100
          cont: 150
          alt: 400
          frf: 450
          extra: 200
          tank: 500
      - id: p3
        values:
          taxi: 80
          trip: 2500
          cont: 120
          alt: 350
          frf: 400
          extra: 0
          tank: 300
    explanation: >-
      The minimum planning fuel for departure is the sum of all fuel items that
      must be on board at departure, including the tankering fuel carried for
      the next leg.


      **Solution**


      {{f: taxi + trip + cont + alt + frf + extra + tank}} = {{n: taxi + trip +
      cont + alt + frf + extra + tank}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: leaves out the tankering fuel.

      - **{{d2}} lb**: forgets the taxi fuel.

      - **{{d3}} lb**: forgets the destination alternate fuel.

      - **{{d4}} lb**: subtracts the tankering fuel instead of adding it.
