  template:
    type: chart-calculation
    question: >-
      Refer to figure. Given the following information about a Commercial Air
      Transport IFR flight, what is the required Taxi Fuel?


      Expected taxi time: {{taxi}} min

      APU: OFF


      Taxi fuel flow read from the figure: {{tf}} kg/h
    variables:
      - id: taxi
        label: Taxi time
        unit: min
      - id: tf
        label: Taxi fuel flow
        unit: kg/h
    chartInputs:
      - taxi
      - tf
    answer:
      formula: taxi * tf / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * taxi * tf / 60
      - id: d2
        formula: taxi * tf / 100
      - id: d3
        formula: taxi * tf / 50
    presets:
      - id: p1
