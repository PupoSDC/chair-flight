- id: QFVSZNNZ
  docId: "033.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331264
    - ATPLGS-626104
    - AVEXAM-75606
    - AVEXAM-99497
    - AVEXAM-95918
    - AVEXAM-56563
    - AVEXAM-8090
    - BGS-331233
    - ATPLGS-126689
  annexes: []
  learningObjectives:
    - 033.03.02.04.02
  template:
    type: calculation
    question: >-
      Calculate the maximum possible extra fuel, based on the flight and
      aircraft data given below.


      - MTOM: {{mtom}} lb

      - MLM: {{mlm}} lb

      - MZFM: {{mzfm}} lb

      - Planned ZFM: {{zfm}} lb

      - Trip fuel: {{trip}} lb

      - Take-off fuel: {{tof}} lb

      - Fuel penalty: {{pen}} lb/1 000 lb
    variables:
      - id: mtom
        label: MTOM
        unit: lb
      - id: mlm
        label: MLM
        unit: lb
      - id: mzfm
        label: MZFM
        unit: lb
      - id: zfm
        label: Planned ZFM
        unit: lb
      - id: trip
        label: Trip fuel
        unit: lb
      - id: tof
        label: Take-off fuel
        unit: lb
      - id: pen
        label: Fuel penalty (lb per 1000 lb)
        unit: lb
    answer:
      formula: min(mtom - zfm - tof, (mlm - (zfm + tof - trip)) * (1 + pen / 1000))
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: mlm - (zfm + tof - trip)
      - id: d2
        formula: mtom - zfm - tof
      - id: d3
        formula: (mlm - (zfm + tof - trip)) / (1 - pen / 1000)
      - id: d4
        formula: (mlm - (zfm + tof - trip)) * (1 - pen / 1000)
      - id: d5
        formula: (mtom - zfm - tof) * (1 + pen / 1000)
      - id: d6
        formula: mzfm - zfm
    presets:
      - id: p1
        values:
          mtom: 476100
          mlm: 387350
          mzfm: 362700
          zfm: 323450
          trip: 72460
          tof: 124830
          pen: 630
      - id: p2
        values:
          mtom: 400000
          mlm: 300000
          mzfm: 280000
          zfm: 250000
          trip: 50000
          tof: 90000
          pen: 500
    explanation: >-
      The extra fuel is limited by the take-off mass headroom and by the landing
      mass headroom (adjusted with the fuel penalty). The smaller of the two
      limits is the maximum extra fuel.


      **Solution**


      Take-off headroom: {{f: mtom - zfm - tof}} = {{= mtom - zfm - tof}} lb


      Landing headroom: {{= mlm - (zfm + tof - trip)}} lb, adjusted with the
      penalty: {{f: (mlm - (zfm + tof - trip)) * (1 + pen / 1000)}} = {{= (mlm -
      (zfm + tof - trip)) * (1 + pen / 1000)}} lb


      Maximum extra fuel = smaller value = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the landing headroom without the penalty adjustment.

      - **{{d2}} lb**: only the take-off headroom is used.

      - **{{d3}} lb**: the penalty is applied as a divisor (1 - penalty).

      - **{{d4}} lb**: the penalty is applied as a reduction factor.

      - **{{d5}} lb**: the penalty is applied to the take-off headroom instead
      of the landing headroom.

      - **{{d6}} lb**: MZFM headroom is used, which does not limit fuel.
