    question: >-
      For pre-flight planning purposes, what is the minimum take-off fuel
      required for the commercial air transport flight with Performance Class A
      aeroplanes, given the following information? Assume the Basic Fuel Scheme
      WITHOUT variations applies.


      Fuel necessary for a jet aeroplane to fly IFR from the departure aerodrome
      to the destination aerodrome (trip fuel): {{trip}} kg


      - Fuel consumption in holding mode: {{hold_rate}} kg/h

      - Destination alternate fuel: {{alt}} kg


      Contingency should be 5 % of trip fuel

      Extra fuel: 0 kg

      Discretionary fuel: 0 kg


      Give the answer in kg.
    variables:
      - id: trip
        label: Trip fuel
        unit: kg
      - id: hold_rate
        label: Holding fuel consumption
        unit: kg/h
      - id: alt
        label: Destination alternate fuel
        unit: kg
    answer:
      formula: trip * 1.05 + alt + hold_rate * 0.5
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: trip * 1.05 + alt
