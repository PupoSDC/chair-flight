- id: QREQNAOT
  docId: "081.06"
  relatedQuestions:
    - QQPATRQT
  externalIds:
    - ATPLQ-814977
    - AVEXAM-51316
  annexes: []
  learningObjectives:
    - 081.06.03.01.01
  template:
    type: calculation
    question: >-
      An aerobatic aircraft has the following data:


      - VS0 (landing configuration): {{vs0}} kt

      - VS1 (clean): {{vs1}} kt


      The limit load factor of the aerobatic category is +6 g. What is the VA
      for this aircraft?
    variables:
      - id: vs0
        label: VS0 (landing configuration)
        unit: kt
      - id: vs1
        label: VS1 (clean)
        unit: kt
    answer:
      formula: vs1 * sqrt(6)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs0 * sqrt(6)
      - id: d2
        formula: vs1
      - id: d3
        formula: vs1 * 6
      - id: d4
        formula: vs1 * sqrt(7)
    presets:
      - id: p1
        values:
          vs0: 110
          vs1: 123
      - id: p2
        values:
          vs0: 90
          vs1: 100
    explanation: >-
      VA is the manoeuvring speed of the clean aircraft, so it is based on the
      clean stall speed VS1, not on the landing configuration. The stall speed
      grows with the square root of the load factor, and the aerobatic category
      limit load factor is +6 g.


      **Solution**


      - VA = VS1 × √6

      - {{f: vs1 * sqrt(6)}} = {{n: vs1 * sqrt(6)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the landing configuration stall speed VS0 instead of
      the clean VS1.

      - **{{d2}} kt**: uses the stall speed without applying the load factor.

      - **{{d3}} kt**: multiplies by the load factor instead of its square root.

      - **{{d4}} kt**: adds 1 to the load factor before taking the square root.
