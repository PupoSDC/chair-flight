  template:
    type: calculation
    question: >-
      You are flying a crop duster in the utility category, with a VS0 of
      {{vs0}} kt and a VS1 of {{vs1}} kt.


      What is the VA speed?
    variables:
      - id: vs0
        label: VS0
        unit: kt
      - id: vs1
        label: VS1
        unit: kt
    answer:
      formula: round(vs1 * sqrt(4.4))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: round(vs0 * sqrt(4.4))
      - id: d2
        formula: round(vs1 * sqrt(6))
      - id: d3
        formula: round(vs1 * sqrt(3.8))
      - id: d4
        formula: round(vs1 * 4.4)
    presets:
      - id: p1
        values:
          vs0: 45
          vs1: 58
      - id: p2
        values:
          vs0: 50
          vs1: 62
      - id: p3
        values:
          vs0: 40
          vs1: 55
    explanation: >-
      The manoeuvring speed is the flaps-up stall speed (VS1) multiplied by the
      square root of the limit load factor of the category. A utility aeroplane
      has a limit load factor of 4.4 G. VS0 is the landing configuration stall
      speed and is not used here.


      **Solution**


      {{f: vs1 * sqrt(4.4)}} = {{n: vs1 * sqrt(4.4)}}, rounded to the nearest
      knot, gives **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses VS0 instead of VS1.

      - **{{d2}} kt**: uses the aerobatic limit load factor of 6 G.

      - **{{d3}} kt**: uses the normal category limit load factor of 3.8 G.

      - **{{d4}} kt**: forgets the square root.
