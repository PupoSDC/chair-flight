    - 081.06.03.02.01
  template:
    type: calculation
    question: >-
      The lift coefficient (CL) of an aeroplane in steady horizontal flight is
      {{cl}}.


      An increase in angle of attack of 1 degree will increase CL by {{slope}}.


      A vertical up gust instantly changes the angle of attack by {{dalpha}}
      degrees.


      The load factor will be:
    variables:
      - id: cl
        label: CL in steady flight
        unit: ""
      - id: slope
        label: CL increase per degree
        unit: ""
      - id: dalpha
        label: Gust change of angle of attack
        unit: °
    answer:
      formula: 1 + slope * dalpha / cl
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: 1 + slope * dalpha
      - id: d2
        formula: slope * dalpha / cl
      - id: d3
        formula: cl + slope * dalpha
      - id: d4
        formula: 1 + slope / cl
    presets:
      - id: p1
        values:
          cl: 0.4
          slope: 0.09
          dalpha: 5
      - id: p2
        values:
          cl: 0.42
          slope: 0.1
          dalpha: 3
      - id: p3
        values:
          cl: 0.35
          slope: 0.079
          dalpha: 2
    explanation: >-
      In steady flight the lift equals the weight. The gust changes the angle of
      attack, which changes the lift coefficient in proportion. The load factor
      is the new lift divided by the lift in steady flight, so the extra lift is
      added to the 1 g of steady flight.


      **Solution**


      New CL = {{cl}} + {{slope}} x {{dalpha}} = {{= cl + slope * dalpha}}


      {{f: 1 + slope * dalpha / cl}} = {{n: 1 + slope * dalpha / cl}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the extra lift to 1 g but forgets to divide by the
      original CL.

      - **{{d2}}**: gives only the extra load factor and forgets the 1 g of
      steady flight.

      - **{{d3}}**: gives the new lift coefficient, which is not a load factor.

      - **{{d4}}**: uses a change of 1 degree instead of the gust angle.
