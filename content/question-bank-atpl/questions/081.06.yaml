  template:
    type: calculation
    question: >-
      An aeroplane maintains straight and level flight at a speed of {{v1}} VS.
      A vertical gust causes a load factor of {{n1}}.


      Determine the load factor caused by the same gust at a speed of {{v2}} VS.
    variables:
      - id: v1
        label: Speed before the gust
        unit: VS
      - id: n1
        label: Load factor from the gust
        unit: ""
      - id: v2
        label: Speed for the new gust
        unit: VS
    answer:
      formula: 1 + (n1 - 1) * v2 / v1
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: n1
      - id: d2
        formula: 1 + (n1 - 1) * v1 / v2
      - id: d3
        formula: n1 * v2 / v1
      - id: d4
        formula: n1 * (v2 / v1) ^ 2
    presets:
      - id: p1
        values:
          v1: 1.8
          n1: 1.9
          v2: 2
      - id: p2
        values:
          v1: 1.5
          n1: 1.7
          v2: 2
      - id: p3
        values:
          v1: 2
          n1: 2.4
          v2: 1.6
    explanation: >-
      A gust adds lift on top of the lift of straight and level flight. The
      extra lift grows with speed, so the same gust gives a bigger load factor
      increase at a higher speed. The extra part of the load factor, n - 1, is
      therefore multiplied by the speed ratio.


      **Solution**


      The load factor increase from the gust at the first speed is {{= n1 - 1}}.


      {{f: 1 + (n1 - 1) * v2 / v1}} = {{n: 1 + (n1 - 1) * v2 / v1}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: keeps the load factor of the gust at the lower speed,
      ignoring the speed change.

      - **{{d2}}**: inverts the speed ratio.

      - **{{d3}}**: scales the whole load factor, including the 1 g part.

      - **{{d4}}**: squares the speed ratio, which the gust relationship does
      not use.
