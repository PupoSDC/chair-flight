- id: QIDRACBE
  docId: "081.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-818886
    - BGS-812700
    - AVEXAM-22821
    - ATPLQ-819180
  annexes: []
  learningObjectives:
    - 081.06.03.01.01
  template:
    type: calculation
    question: >-
      The design manoeuvring speed (VA) of an aircraft is known at one mass.
      Given:


      - Original mass: {{m1}} t

      - VA at the original mass: {{va1}} kt

      - New mass: {{m2}} t


      What is the VA at the new mass?
    variables:
      - id: m1
        label: Original mass
        unit: t
      - id: va1
        label: VA at the original mass
        unit: kt
      - id: m2
        label: New mass
        unit: t
    answer:
      formula: va1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: va1 * m2 / m1
      - id: d2
        formula: va1 * sqrt(m1 / m2)
      - id: d3
        formula: va1 * (m2 / m1)^2
      - id: d4
        formula: va1
    presets:
      - id: p1
        values:
          m1: 5.4
          va1: 100
          m2: 4.7
      - id: p2
        values:
          m1: 5.7
          va1: 181
          m2: 4.1
      - id: p3
        values:
          m1: 6
          va1: 250
          m2: 5
    explanation: >-
      VA depends on the stall speed of the aircraft, and the stall speed rises
      with the square root of the mass. A lighter aircraft therefore has a lower
      VA, and the change is the square root of the mass ratio, not the ratio
      itself.


      **Solution**


      {{f: va1 * sqrt(m2 / m1)}} = {{n: va1 * sqrt(m2 / m1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: assumes VA changes in direct proportion to the mass.

      - **{{d2}} kt**: inverts the mass ratio, so a lighter aircraft would get a
      higher VA.

      - **{{d3}} kt**: uses the square of the mass ratio instead of its square
      root.

      - **{{d4}} kt**: keeps the original VA and ignores the change in mass.
