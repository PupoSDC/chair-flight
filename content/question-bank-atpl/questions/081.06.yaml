- id: QVLRJNQU
  docId: "081.06"
  relatedQuestions:
    - QFNNLFLTS
    - QRCTCUYZU
  externalIds:
    - ATPLQ-817994
    - AVEXAM-77723
  annexes: []
  learningObjectives:
    - 081.06.03.01.01
  template:
    type: calculation
    question: |-
      A Cessna Skyhawk has a known VA at a known mass:

      - Known VA: {{va1}} kt
      - Known mass: {{m1}} lb
      - New mass: {{m2}} lb

      What is its VA at the new mass (in kt)?
    variables:
      - id: va1
        label: Known VA
        unit: kt
      - id: m1
        label: Known mass
        unit: lb
      - id: m2
        label: New mass
        unit: lb
    answer:
      formula: va1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: va1 * m2 / m1
      - id: d2
        formula: va1 * m1 / m2
      - id: d3
        formula: va1 * sqrt(m1 / m2)
      - id: d4
        formula: va1 * (m2 / m1) ^ 2
    presets:
      - id: p1
        values:
          va1: 123
          m1: 2300
          m2: 1900
      - id: p2
        values:
          va1: 110
          m1: 2000
          m2: 2400
    explanation: >-
      VA is proportional to the square root of the mass. The known VA is scaled
      by the square root of the ratio of the new mass to the known mass.


      **Solution**


      {{f: va1 * sqrt(m2 / m1)}} = {{n: va1 * sqrt(m2 / m1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: scales with the mass ratio instead of its square root.

      - **{{d2}} kt**: inverts the mass ratio, so the speed rises when the mass
      falls.

      - **{{d3}} kt**: inverts the square root of the mass ratio.

      - **{{d4}} kt**: uses the square of the mass ratio.
