- id: QCYPGOIO
  docId: "081.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-812385
    - ATPLGS-628127
    - AVEXAM-31483
    - AVEXAM-26479
  annexes: []
  learningObjectives:
    - 081.06.03.01.01
  template:
    type: calculation
    question: |-
      A crop duster utility aircraft has the following speeds:

      - VSO (landing configuration): {{vso}} kt
      - VS1 (clean): {{vs1}} kt
      - Limit load factor (utility category): 4.4

      What is the VA for this aircraft?
    variables:
      - id: vso
        label: VSO
        unit: kt
      - id: vs1
        label: VS1
        unit: kt
    answer:
      formula: vs1 * sqrt(4.4)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vso * sqrt(4.4)
      - id: d2
        formula: vs1 * 4.4
      - id: d3
        formula: vs1 * sqrt(2.5)
      - id: d4
        formula: vs1 * sqrt(3.8)
    presets:
      - id: p1
        values:
          vso: 55
          vs1: 70
      - id: p2
        values:
          vso: 60
          vs1: 75
      - id: p3
        values:
          vso: 50
          vs1: 65
    explanation: >-
      VA is the design manoeuvring speed: the highest speed at which the pilot
      can make a full, abrupt control input without overstressing the aircraft.
      It is found from the clean stall speed VS1 and the limit load factor,
      which for a utility category aircraft is 4.4 g.


      **Solution**


      {{f: vs1 * sqrt(4.4)}} = {{n: vs1 * sqrt(4.4)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the landing stall speed VSO instead of the clean
      stall speed VS1.

      - **{{d2}} kt**: leaves out the square root of the load factor.

      - **{{d3}} kt**: uses a load factor of 2.5 g instead of 4.4 g.

      - **{{d4}} kt**: uses the normal category load factor of 3.8 g instead of
      4.4 g.
