- id: QDYZNSQN
  docId: "081.06"
  relatedQuestions:
    - QPXBPVCR
  externalIds:
    - ATPLQ-817384
    - ATPLGS-626387
  annexes: []
  learningObjectives:
    - 081.06.03.01.01
  template:
    type: calculation
    question: |-
      The manoeuvring speed (VA) of a Cessna Skyhawk is known at one mass:

      - Mass: {{m1}} lb
      - VA: {{va1}} kt

      What is the VA at a mass of {{m2}} lb?
    variables:
      - id: m1
        label: Known mass
        unit: lb
      - id: va1
        label: Known VA
        unit: kt
      - id: m2
        label: New mass
        unit: lb
    answer:
      formula: va1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: va1
      - id: d2
        formula: va1 * m2 / m1
      - id: d3
        formula: va1 * sqrt(m1 / m2)
      - id: d4
        formula: va1 * (m2 / m1) ^ 2
    presets:
      - id: p1
        values:
          m1: 2550
          va1: 102
          m2: 1900
      - id: p2
        values:
          m1: 2400
          va1: 100
          m2: 2000
    explanation: >-
      VA depends on the aircraft mass: a heavier aeroplane stalls at a higher
      speed, and VA follows the same rule. VA rises with the square root of the
      mass, so the known VA is scaled by the square root of the ratio between
      the new mass and the known mass.


      **Solution**


      - Mass ratio = {{m2}} lb / {{m1}} lb = {{= m2 / m1}}

      - {{f: va1 * sqrt(m2 / m1)}} = {{n: va1 * sqrt(m2 / m1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: keeps the original VA and ignores the change in mass.

      - **{{d2}} kt**: scales the VA directly with the mass instead of its
      square root.

      - **{{d3}} kt**: inverts the mass ratio, so the lighter aeroplane shows a
      higher VA.

      - **{{d4}} kt**: squares the mass ratio instead of taking its square root.
