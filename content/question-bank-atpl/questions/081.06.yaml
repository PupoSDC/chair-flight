  annexes: []
  learningObjectives:
    - "081.06"
  template:
    type: calculation
    question: >-
      An aeroplane in straight and level flight is subjected to a sudden
      disturbance in speed. The angle of attack stays constant at first.


      - Initial speed: {{v}} kt

      - Load factor reached: {{n}}


      By how many knots has the speed changed? Give a positive number for an
      increase and a negative number for a decrease.
    variables:
      - id: v
        label: Initial speed
        unit: kt
      - id: n
        label: Load factor
        unit: ""
    answer:
      formula: v * (sqrt(n) - 1)
      unit: kt
      decimals: 2
    distractors:
      - id: d1
        formula: v * (n - 1)
      - id: d2
        formula: v * (1 - sqrt(n))
      - id: d3
        formula: v * (1 / sqrt(n) - 1)
      - id: d4
        formula: v * (n ^ 2 - 1)
    presets:
      - id: p1
        values:
          v: 300
          n: 1.69
      - id: p2
        values:
          v: 250
          n: 1.44
    explanation: >-
      At a constant angle of attack the lift is proportional to the speed
      squared. The load factor is therefore the square of the speed ratio, and
      the speed ratio is the square root of the load factor.


      **Solution**


      {{f: v * (sqrt(n) - 1)}} = {{n: v * (sqrt(n) - 1)}} = **{{answer}} kt**
      (an increase)


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the load factor minus one as the speed change.

      - **{{d2}} kt**: reverses the sign, which describes a decrease.

      - **{{d3}} kt**: inverts the speed ratio, so it gives a decrease.

      - **{{d4}} kt**: squares the load factor instead of taking its square
      root.
- id: Q8ONMUTVL
  docId: "081.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-818750
    - AVEXAM-4684
    - BGS-810937
  annexes: []
  learningObjectives:
    - "081.06"
  template:
    type: calculation
    question: |-
      An aeroplane's mass decreases by the amount below.

      - Mass decrease: {{pct}} %

      By what percentage does its VA (EAS) reduce?
    variables:
      - id: pct
        label: Mass decrease
        unit: "%"
    answer:
      formula: 100 * (1 - sqrt(1 - pct / 100))
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: pct
      - id: d2
        formula: pct / 4
      - id: d3
        formula: 100 * (1 - (1 - pct / 100) ^ 2)
      - id: d4
        formula: 100 * (1 / sqrt(1 - pct / 100) - 1)
    presets:
      - id: p1
        values:
          pct: 19
      - id: p2
        values:
          pct: 36
    explanation: >-
      VA (EAS) is proportional to the square root of the mass. A {{pct}} % mass
      decrease leaves {{= 100 - pct}} % of the mass, and the square root of that
      fraction gives the new VA.


      **Solution**


      {{f: 100 * (1 - sqrt(1 - pct / 100))}} = {{n: 100 * (1 - sqrt(1 - pct /
      100))}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: applies the mass change directly to VA, forgetting the
      square root.

      - **{{d2}} %**: takes a quarter of the mass change, which has no basis in
      the relationship.

      - **{{d3}} %**: makes VA proportional to the square of the mass.

      - **{{d4}} %**: inverts the mass ratio, so it shows the wrong size of
      change.
- id: Q9SZRSPQP
  docId: "081.06"
  relatedQuestions:
    - QTHHVLXW
  externalIds:
    - ATPLQ-811758
  annexes: []
  learningObjectives:
    - "081.06"
  template:
    type: calculation
    question: |-
      An aeroplane's mass decreases by {{pct}}%.

      How does the stalling speed (VS) change? Give the approximate change in %.
    variables:
      - id: pct
        label: Mass decrease
        unit: "%"
    answer:
      formula: pct / 2
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: pct
      - id: d2
        formula: pct * 2
      - id: d3
        formula: pct / 4
      - id: d4
        formula: pct * 0.8
    presets:
      - id: p1
        values:
          pct: 20
      - id: p2
        values:
          pct: 30
      - id: p3
        values:
          pct: 12
    explanation: >-
      Stall speed depends on the square root of the mass. For a moderate change
      in mass, the stall speed changes by about half as much, in percent, as the
      mass does. A 20 % reduction in mass therefore lowers the stall speed by
      about 10 %.


      **Solution**


      {{f: pct / 2}} = {{n: pct / 2}} = the stall speed decreases by about
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: assumes the stall speed changes by the full mass change.

      - **{{d2}} %**: doubles the mass change instead of halving it.

      - **{{d3}} %**: divides the mass change by four, which is too small.

      - **{{d4}} %**: uses the mass ratio directly and ignores the square root.
