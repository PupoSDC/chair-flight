- id: QBFRZK6XE
  docId: "081.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-815217
  annexes: []
  learningObjectives:
    - "081.06"
  template:
    type: calculation
    question: >-
      The VA speed of a light aircraft is {{va}} kt. Determine the aircraft's
      limit load factor, given the following information from the airspeed
      indicator:


      - Green arc: {{vs1}} kt - 165 kt

      - White arc: {{vs0}} kt - 85 kt

      - VNE: 185 kt


      What is the limit load factor?
    variables:
      - id: va
        label: VA
        unit: kt
      - id: vs1
        label: VS1
        unit: kt
      - id: vs0
        label: VS0
        unit: kt
    answer:
      formula: ceil((va / vs1) ^ 2 * 100) / 100
      unit: G
      decimals: 2
    distractors:
      - id: d1
        formula: ceil((va / vs0) ^ 2 * 100) / 100
      - id: d2
        formula: ceil(va / vs1 * 100) / 100
      - id: d3
        formula: ceil(sqrt(va / vs1) * 100) / 100
      - id: d4
        formula: "2.5"
    presets:
      - id: p1
        values:
          va: 147
          vs1: 73
          vs0: 55
      - id: p2
        values:
          va: 130
          vs1: 66
          vs0: 52
      - id: p3
        values:
          va: 155
          vs1: 78
          vs0: 60
    explanation: >-
      VA is the speed at which the aeroplane can reach its limit load factor.
      VS1 is the stall speed at maximum mass, shown as the lower end of the
      green arc. The stall speed rises with the square root of the load factor,
      so the limit load factor is the square of the ratio VA / VS1, rounded up
      to two decimals.


      **Solution**


      {{f: (va / vs1) ^ 2}} = **{{answer}} G**


      **Why the other answers are wrong**


      - **{{d1}} G**: uses VS0, the lower end of the white arc, instead of VS1.

      - **{{d2}} G**: forgets to square the speed ratio.

      - **{{d3}} G**: takes the square root of the ratio instead of the square.

      - **{{d4}} G**: uses the normal category limit of 2.5 G, which does not
      apply to this aeroplane.
