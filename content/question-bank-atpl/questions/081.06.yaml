- id: QWFNHND4J
  docId: "081.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-815992
    - ATPLGS-125564
    - ATPLGS-627077
  annexes: []
  learningObjectives:
    - "081.06"
  template:
    type: calculation
    question: |-
      An aircraft is in steady, straight and level flight. Given:

      - Initial coefficient of lift (CL): {{cl}}
      - Increase in angle of attack from a vertical gust: {{aoa}}°
      - Change in CL for each 1° change in angle of attack: {{dcl}}

      Calculate the final load factor.
    variables:
      - id: cl
        label: Initial CL
        unit: ""
      - id: aoa
        label: Angle of attack increase
        unit: °
      - id: dcl
        label: CL change per degree
        unit: ""
    answer:
      formula: (cl + aoa * dcl) / cl
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl / (cl + aoa * dcl)
      - id: d2
        formula: cl + aoa * dcl
      - id: d3
        formula: (cl - aoa * dcl) / cl
      - id: d4
        formula: (cl + aoa) / cl
    presets:
      - id: p1
        values:
          cl: 0.47
          aoa: 3
          dcl: 0.1
      - id: p2
        values:
          cl: 0.5
          aoa: 2
          dcl: 0.1
      - id: p3
        values:
          cl: 0.4
          aoa: 4
          dcl: 0.1
    explanation: >-
      A gust changes the angle of attack and therefore the lift. In steady level
      flight the lift equals the weight, so the load factor is the new lift
      coefficient divided by the original one.


      **Solution**


      The gust adds {{= aoa * dcl}} to the coefficient of lift, so the new CL is
      {{= cl + aoa * dcl}}.


      {{f: (cl + aoa * dcl) / cl}} = {{n: (cl + aoa * dcl) / cl}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: inverts the ratio, so the load factor is given the wrong way
      round.

      - **{{d2}}**: gives the new lift coefficient instead of the load factor.

      - **{{d3}}**: subtracts the change in CL, which has the wrong sign for an
      increase in angle of attack.

      - **{{d4}}**: adds the angle in degrees straight to the lift coefficient
      instead of the change in CL.
