  template:
    type: calculation
    question: An aeroplane flying at {{v0}} kt in straight and level flight is
      subjected to a disturbance that suddenly increases its speed by {{dv}} kt.
      Assuming the angle of attack remains constant, what is the load factor
      immediately after the disturbance?
    variables:
      - id: v0
        label: Initial speed
        unit: kt
      - id: dv
        label: Speed increase
        unit: kt
    answer:
      formula: ((v0 + dv) / v0) ^ 2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: "1"
      - id: d2
        formula: (v0 + dv) / v0
      - id: d3
        formula: sqrt((v0 + dv) / v0)
      - id: d4
        formula: ((v0 - dv) / v0) ^ 2
    presets:
      - id: p1
        values:
          v0: 200
          dv: 60
      - id: p2
        values:
          v0: 200
          dv: 100
      - id: p3
        values:
          v0: 200
          dv: 80
      - id: p4
        values:
          v0: 200
          dv: 20
      - id: p5
        values:
          v0: 100
          dv: 20
    explanation: >-
      With the angle of attack unchanged, the lift coefficient stays the same,
      so the lift depends only on the speed. Lift goes with the square of the
      speed, so the load factor is the square of the speed ratio.


      **Solution**


      {{f: ((v0 + dv) / v0) ^ 2}} = {{n: ((v0 + dv) / v0) ^ 2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: assumes the load factor stays at 1, forgetting that the lift
      rises with speed.

      - **{{d2}}**: uses the speed ratio instead of its square.

      - **{{d3}}**: uses the square root of the speed ratio instead of the
      square.

      - **{{d4}}**: uses a speed decrease instead of the increase.
