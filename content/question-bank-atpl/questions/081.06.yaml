- id: QQPATRQT
  docId: "081.06"
  relatedQuestions:
    - QREQNAOT
  externalIds:
    - ATPLQ-812292
    - AVEXAM-61532
    - BGS-811350
  annexes: []
  learningObjectives:
    - 081.06.03.01.01
  template:
    type: calculation
    question: |-
      An aircraft has the following data:

      - 1 g stalling speed: {{vs1}} kt
      - Limit load factor: {{n}} g

      What is the manoeuvring speed VA?
    variables:
      - id: vs1
        label: 1 g stalling speed
        unit: kt
      - id: n
        label: Limit load factor
        unit: g
    answer:
      formula: vs1 * sqrt(n)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: vs1 / sqrt(n)
      - id: d2
        formula: vs1 * n
      - id: d3
        formula: vs1 * 1.5
      - id: d4
        formula: vs1 * n ^ 2
    presets:
      - id: p1
        values:
          vs1: 70
          n: 2.5
      - id: p2
        values:
          vs1: 60
          n: 4
    explanation: >-
      The manoeuvring speed VA is the highest speed at which full control
      deflection can be made without overstressing the aircraft. It is linked to
      the stall speed: the stall speed rises with the square root of the load
      factor, so VA is the 1 g stalling speed multiplied by the square root of
      the limit load factor.


      **Solution**


      - VA = 1 g stalling speed × √(limit load factor)

      - {{f: vs1 * sqrt(n)}} = {{n: vs1 * sqrt(n)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: divides the stalling speed by the square root of the load
      factor, which lowers the speed instead of raising it.

      - **{{d2}} kt**: multiplies the stalling speed by the load factor instead
      of its square root.

      - **{{d3}} kt**: uses a fixed 1.5 g instead of the given load factor.

      - **{{d4}} kt**: squares the load factor instead of taking its square
      root.
