- id: Q041LCFFU
  docId: "081.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-815826
  annexes: []
  learningObjectives:
    - "081.06"
  template:
    type: calculation
    question: >-
      The manoeuvring speed (VA) of a light aeroplane is {{va1}} kt at a mass of
      {{m1}} lb.


      What is the VA at a mass of {{m2}} lb?
    variables:
      - id: va1
        label: VA at reference mass
        unit: kt
      - id: m1
        label: Reference mass
        unit: lb
      - id: m2
        label: New mass
        unit: lb
    answer:
      formula: va1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: va1 * m2 / m1
      - id: d2
        formula: va1 * sqrt(m1 / m2)
      - id: d3
        formula: va1 * m1 / m2
      - id: d4
        formula: va1
    presets:
      - id: p1
        values:
          va1: 102
          m1: 1550
          m2: 2500
      - id: p2
        values:
          va1: 95
          m1: 1800
          m2: 2600
      - id: p3
        values:
          va1: 110
          m1: 1400
          m2: 2000
    explanation: >-
      The manoeuvring speed rises with the square root of the mass, because the
      stall speed does and VA is a fixed multiple of it. A heavier aeroplane
      therefore has a higher VA.


      **Solution**


      {{f: va1 * sqrt(m2 / m1)}} = {{n: va1 * sqrt(m2 / m1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: scales VA directly with the mass, which overstates the
      change.

      - **{{d2}} kt**: uses the square root the wrong way round, so VA falls as
      the mass rises.

      - **{{d3}} kt**: scales VA inversely with the mass.

      - **{{d4}} kt**: keeps VA unchanged, which ignores the change of mass.
