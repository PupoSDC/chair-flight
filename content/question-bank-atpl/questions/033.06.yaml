  learningObjectives:
    - "033.06"
  template:
    type: chart
    question: Refer to figure. The sector time from WPT C to DEST in line 4 of the
      Navigation Plan is (1) \_\_\_\_\_, and the accumulated time to the ALTN in
      line 5 is (2) \_\_\_\_\_.
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: (1) 11 minutes; (2) 1 hour and 25 minutes
        wrongAnswers:
          - (1) 8 minutes; (2) 1 hour and 15 minutes
