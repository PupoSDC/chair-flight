  template:
    type: calculation
    question: >-
      Given the following information, and taking into account that the fuel was
      initially calculated with no wind, determine the updated trip fuel for the
      flight (in kg).


      - Trip fuel (no wind): {{trip0}} kg

      - Flight time (no wind): {{t0}} hours

      - Distance: {{dist}} NM

      - Headwind: {{hw}} kt
    variables:
      - id: trip0
        label: Trip fuel (no wind)
        unit: kg
      - id: t0
        label: Flight time (no wind)
        unit: h
      - id: dist
        label: Distance
        unit: NM
      - id: hw
        label: Headwind
        unit: kt
    answer:
      formula: trip0 * dist / (dist - hw * t0)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: trip0
      - id: d2
        formula: trip0 * dist / (dist + hw * t0)
      - id: d3
        formula: trip0 * (dist - hw * t0) / dist
      - id: d4
        formula: trip0 * (1 + hw / dist)
    presets:
      - id: p1
        values:
          trip0: 2000
          t0: 2
          dist: 240
          hw: 20
      - id: p2
        values:
          trip0: 1800
          t0: 2
          dist: 300
          hw: 30
    explanation: >-
      With no wind the groundspeed is the distance divided by the flight time.
      With a headwind the groundspeed is reduced by the headwind, so the flight
      time increases by the ratio distance / (distance minus headwind times the
      time without wind). The trip fuel scales with the flight time, so the
      updated trip fuel is the original trip fuel multiplied by that ratio.


      **Solution**


      Groundspeed without wind = {{= dist / t0}} kt


      {{f: trip0 * dist / (dist - hw * t0)}} = {{n: trip0 * dist / (dist - hw *
      t0)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: keeps the original trip fuel and does not update it for
      the headwind.

      - **{{d2}} kg**: adds the headwind instead of subtracting it.

      - **{{d3}} kg**: uses the ratio of the wrong way round, so the trip fuel
      is reduced.

      - **{{d4}} kg**: adds the headwind as a percentage of the distance, which
      is not a valid time correction.
