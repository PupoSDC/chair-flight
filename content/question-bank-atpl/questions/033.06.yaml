- id: Q7I7EPHGU
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331009
    - AVEXAM-56437
    - BGS-331322
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: |-
      Determine the total endurance of the flight, in minutes, given:

      - Remaining fuel: {{fuel}} kg
      - Average fuel flow: {{ff}} kg/h
      - Final Reserve Fuel: {{frf}} kg
      - Specific Fuel Consumption: {{sfc}} kg/NGM
      - Average Ground Speed: {{gs}} kt
    variables:
      - id: fuel
        label: Remaining fuel
        unit: kg
      - id: ff
        label: Average fuel flow
        unit: kg/h
      - id: frf
        label: Final Reserve Fuel
        unit: kg
      - id: sfc
        label: Specific fuel consumption
        unit: kg/NGM
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: fuel / ff * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: (fuel - frf) / ff * 60
      - id: d2
        formula: fuel / (sfc * gs) * 60
      - id: d3
        formula: (fuel - frf) / (sfc * gs) * 60
    presets:
      - id: p1
        values:
          fuel: 2400
          ff: 800
          frf: 400
          sfc: 3.4
          gs: 350
      - id: p2
        values:
          fuel: 3000
          ff: 900
          frf: 450
          sfc: 3.2
          gs: 380
      - id: p3
        values:
          fuel: 2000
          ff: 700
          frf: 350
          sfc: 3.6
          gs: 330
    explanation: >-
      Total endurance is the time the aircraft can stay airborne with all the
      remaining fuel, so it is the remaining fuel divided by the average fuel
      flow. The final reserve is part of the total endurance, and the specific
      fuel consumption (fuel per nautical ground mile) is not needed.


      **Solution**


      {{f: fuel / ff * 60}} = {{n: fuel / ff * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: subtracts the final reserve fuel, which gives the
      endurance available before the reserve is used, not the total endurance.

      - **{{d2}} min**: uses the fuel flow derived from SFC × ground speed ({{=
      sfc * gs}} kg/h) instead of the given average fuel flow.

      - **{{d3}} min**: combines both errors: subtracts the final reserve and
      uses SFC × ground speed as fuel flow.
