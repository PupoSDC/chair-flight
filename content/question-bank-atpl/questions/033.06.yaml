      kg/h. {{t}} minutes into the flight the centre tank pump fails.


      From the point of the failure, how long can the aircraft fly? Give the
      answer in hours and minutes.
    variables:
      - id: centre
        label: Centre tank fuel
        unit: kg
      - id: left
        label: Left wing tank fuel
        unit: kg
      - id: right
        label: Right wing tank fuel
        unit: kg
      - id: pump
        label: Pump transfer rate
        unit: kg/h
      - id: flow
        label: Fuel flow
        unit: kg/h
      - id: t
        label: Time before pump failure
        unit: min
    answer:
      formula: round((left + right + (pump - flow) * t / 60) / flow * 60)
      unit: minutes
      decimals: 0
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: round((left + right - flow * t / 60) / flow * 60)
      - id: d2
        formula: round((centre + left + right - flow * t / 60) / flow * 60)
      - id: d3
        formula: round((left + right + (flow - pump) * t / 60) / flow * 60)
      - id: d4
        formula: round((left + right) / flow * 60)
    presets:
      - id: p1
        values:
          centre: 650
          left: 250
          right: 250
          pump: 150
          flow: 170
          t: 35
      - id: p2
        values:
          centre: 800
          left: 300
          right: 220
          pump: 120
          flow: 160
          t: 40
    explanation: >-
      The engines burn fuel from the wing tanks, and the pump keeps moving fuel
      from the centre tank into the wings. Until the pump fails, the wings gain
      what the pump transfers and lose what the engines burn. After the failure,
      the fuel left in the wing tanks is all that can be used, so the endurance
      is that fuel divided by the fuel flow.


      **Solution**


      Fuel in the wings at the failure = {{left}} + {{right}} + ({{pump}} -
      {{flow}}) x {{t}} / 60 = {{= left + right + (pump - flow) * t / 60}} kg


      Endurance = {{= left + right + (pump - flow) * t / 60}} / {{flow}} x 60 =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} min**: forgets the fuel transferred by the pump during the
      first {{t}} minutes.

      - **{{d2}} min**: counts the fuel in the centre tank, which cannot be used
      after the pump fails.

      - **{{d3}} min**: reverses the pump and fuel flow, so the wings are
      assumed to gain fuel faster than the engines burn it.

      - **{{d4}} min**: ignores the pump completely and uses the wing fuel at
      take-off.
