    - BGS-330997
    - AVEXAM-53413
    - ATPLGS-625253
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: chart
    question: "Given the following information for a Commercial Air Transport
      flight, what action should be taken by the Commander? Take-Off Fuel: 3300
      lb Trip Fuel: 1800 lb Alternate 1 Fuel: 800 lb Alternate 2 Fuel: 500 lb
      Final Reserve Fuel: 600 lb Total Distance to Destination: 800 NM Remaining
      Fuel after 400 NM: 2300 lb"
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Continue the flight; in case of diversion proceed to Alternate 2
        wrongAnswers:
          - the remaining fuel at Alternate 1 will be more than the Final
            Reserve Fuel.
          - Declare an emergency as the remaining fuel is less than the Final
            Reserve Fuel at Alternate 1.
          - Continue the flight; the remaining fuel at Alternate 1 will be more
            than the Final Reserve Fuel.
        explanation: >-
          400 NM used 3 300 − 2 300 = 1 000 lb, so the other 400 NM will use 1
          000 lb and the aircraft lands with 1 300 lb.


          At Alternate 1 the fuel left would be 1 300 − 800 = 500 lb, below the
          600 lb final reserve. At Alternate 2 it would be 1 300 − 500 = 800 lb,
          above the final reserve.


          Continue, and **divert to Alternate 2** if needed.
- id: QPAFPMPH
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335109
    - AVEXAM-28827
    - AVEXAM-37857
    - ATPLGS-629362
    - AVEXAM-57903
    - AVEXAM-66218
    - AVEXAM-54317
    - AVEXAM-87808
    - AVEXAM-80607
    - ATPLGS-114050
    - ATPLGS-628483
    - AVEXAM-53293
  annexes: []
  learningObjectives:
    - 033.06.02.01.03
  template:
    type: calculation
    question: |-
      Given the following information:

      - DOM: {{dom}} kg
      - Traffic load: {{load}} kg
      - Remaining usable fuel: {{fuel}} kg
      - Remaining trip fuel to destination: {{trip}} kg
      - Alternate fuel: {{alt}} kg
      - Final reserve fuel: {{res}} kg

      Calculate the revised estimated landing mass at the destination aerodrome.
    variables:
      - id: dom
        label: DOM
        unit: kg
      - id: load
        label: Traffic load
        unit: kg
      - id: fuel
        label: Remaining usable fuel
        unit: kg
      - id: trip
        label: Remaining trip fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
      - id: res
        label: Final reserve fuel
        unit: kg
    answer:
      formula: dom + load + fuel - trip
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dom + load + trip
      - id: d2
        formula: dom + load + fuel - trip - res
      - id: d3
        formula: dom + load + fuel - trip + alt + res
    presets:
      - id: p1
        values:
          dom: 4565
          load: 2590
          fuel: 990
          trip: 410
          alt: 235
          res: 275
      - id: p2
        values:
          dom: 5100
          load: 2300
          fuel: 1200
          trip: 520
          alt: 250
          res: 300
      - id: p3
        values:
          dom: 4800
          load: 2750
          fuel: 1100
          trip: 450
          alt: 220
          res: 260
    explanation: >-
      The landing mass is the dry operating mass plus the traffic load plus the
      fuel still on board at landing. That fuel is the remaining usable fuel
      minus the remaining trip fuel to the destination; alternate and final
      reserve fuel are part of what remains and are not burned on the way to the
      destination.


      **Solution**


      Fuel at landing = {{= fuel - trip}} kg


      {{f: dom + load + fuel - trip}} = {{n: dom + load + fuel - trip}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the trip fuel was added instead of subtracted.

      - **{{d2}} kg**: the final reserve fuel was subtracted as well, although
      it stays in the tanks at landing.

      - **{{d3}} kg**: alternate and final reserve fuel were added on top of the
      remaining usable fuel, although they are already included in it.
- id: QPRTUWEL9
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331221
    - AVEXAM-32995
    - BGS-331158
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Calculate your expected fuel state at the destination after flying a leg
      with the following data:


      - Distance: {{dist}} NM

      - Usable fuel at the start: {{fuel}} kg

      - TAS: {{tas}} kt

      - Wind component: {{wc}} kt (negative = headwind)

      - Fuel flow: {{ff}} kg/h
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: fuel
        label: Fuel at start
        unit: kg
      - id: tas
        label: TAS
        unit: kt
      - id: wc
        label: Wind component
        unit: kt
      - id: ff
        label: Fuel flow
        unit: kg/h
    answer:
      formula: fuel - ff * dist / (tas + wc)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * dist / (tas + wc)
      - id: d2
        formula: fuel - ff * dist / (tas - wc)
      - id: d3
        formula: fuel - ff * dist / tas
    presets:
      - id: p1
        values:
          dist: 189
          fuel: 560
          tas: 155
          wc: -20
          ff: 195
      - id: p2
        values:
          dist: 210
          fuel: 700
          tas: 160
          wc: -25
          ff: 210
      - id: p3
        values:
          dist: 150
          fuel: 450
          tas: 140
          wc: -15
          ff: 180
    explanation: >-
      Fuel remaining is the fuel on board minus the fuel burned on the leg. The
      burn is fuel flow times time, and time is distance divided by ground speed
      (TAS plus wind component, a negative component being a headwind).


      **Solution**


      Ground speed = {{= tas + wc}} kt


      {{f: fuel - ff * dist / (tas + wc)}} = {{n: fuel - ff * dist / (tas +
      wc)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is the fuel burned, not the fuel remaining.

      - **{{d2}} kg**: applies the wind with the wrong sign (tailwind instead of
      headwind).

      - **{{d3}} kg**: ignores the wind and uses TAS as ground speed.
