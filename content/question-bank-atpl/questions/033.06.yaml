  template:
    type: simple
    question: >-
      An aeroplane is performing a commercial air transport flight. Regular fuel
      checks performed approximately every 30 min as required by the operator.
      The flight follows the planned route and then flies at the Mach number as
      planned. The fuel measurements are accurate within +/- 20 kg and the fuel
      flow indicators show a constant 1340 kg/h per engine throughout.


      | Position | ETO | ATO | Required fuel | Actual fuel |

      | --- | --- | --- | --- | --- |

      | PBD01 | 0518 | 0516 | 9,925 kg | 10,170 kg |

      | PBD02 | 0548 | 0546 | 8,590 kg | 8,850 kg |

      | PBD03 | 0630 | 0628 | 6,721 kg | 6,930 kg |

      | PBD04 | 0702 | 0700 | 5,297 kg | 5,410 kg |

      | PBD05 | 0738 | 0736 | 3,695 kg | 3,700 kg |

      | PBD05 + 10 min | — | 0746 | 3,225 kg | 3,080 kg |


      What is the reason for the creation of the position of PBD05 + 10 min?
    explanation: ""
    options:
      - id: OYKQOF318
        text: The aeroplane has less fuel than required but the fuel flow is verified as
          correct enabling a reasonable conclusion that any discrepancy is due
          to the wind being different to planned.
        correct: false
        why: ""
      - id: OOT6PJX8Z
        text: The fuel flow appears to be gradually increasing and one way of verifying
          this is to create a waypoint based on time and use the last known fuel
          depletion rate to assess any trends.
        correct: true
        why: ""
      - id: ORCD5G3LX
        text: The fuel flow is confirmed to be different from the plan and therefore the
          fuel flow indicators are showing incorrect and the thrust can be
          reduced to match the planned fuel flow.
        correct: false
