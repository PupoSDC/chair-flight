          - (1) 8 minutes; (2) 46 minutes
        explanation: >-
          The sector time and the accumulated time are both read from the
          navigation plan, line by line. The accumulated time adds the sector
          times from the start, so both values must be read from the right
          lines.


          **Solution**


          - Read the sector time from WPT C to DEST in line 4: **11 minutes**.

          - Read the accumulated time to the ALTN in line 5: **1 hour and 25
          minutes**.


