    question: An aircraft at FL120, IAS 200 kt, OAT -5°C and wind component +30 kt,
      is required to reduce speed in order to cross a reporting point 5 MIN
      later than planned. Assuming flight conditions do not change, when 100 NM
      from the reporting point IAS should be reduced to..
