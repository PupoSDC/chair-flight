  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      Planning data are shown in the Flight Log excerpt (Fuel Planning Section).


      After a balked landing at the destination airport you divert to the
      alternate with the gear extended.


      The mass at the balked landing, read from the flight log, is {{m_dest}}
      kg.


      The re-calculated flight time to the alternate due to the reduced speed is
      {{t_min}} min and the fuel flow will be {{ff}} kg/h.


      Final Reserve Fuel remains unchanged.


      What will be the estimated landing mass at the alternate airport (kg)?
    variables:
      - id: m_dest
        label: Mass at balked landing (read from flight log)
        unit: kg
      - id: t_min
        label: Flight time to alternate
        unit: min
      - id: ff
        label: Fuel flow
        unit: kg/h
    chartInputs:
      - m_dest
    answer:
      formula: m_dest - ff * t_min / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: m_dest
      - id: d2
        formula: m_dest + ff * t_min / 60
      - id: d3
        formula: m_dest - ff * t_min
      - id: d4
        formula: m_dest - ff
      - id: d5
        formula: m_dest - ff * t_min / 30
    presets:
      - id: p1
        values:
          m_dest: 6549
          t_min: 70
          ff: 600
      - id: p2
        values:
          m_dest: 7200
          t_min: 55
          ff: 520
      - id: p3
        values:
          m_dest: 6100
          t_min: 80
          ff: 640
    explanation: >-
      The landing mass at the alternate equals the mass at the balked landing
      minus the fuel burnt on the diversion. The fuel burnt is fuel flow times
      flight time, and the flight time must be converted to hours.


      **Solution**


      Fuel burnt = {{f: ff * t_min / 60}} = {{n: ff * t_min / 60}} = {{= ff *
      t_min / 60}} kg


      Landing mass = {{f: m_dest - ff * t_min / 60}} = {{n: m_dest - ff * t_min
      / 60}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: no diversion fuel is subtracted.

      - **{{d2}} kg**: the diversion fuel is added instead of subtracted.

      - **{{d3}} kg**: the flight time in minutes is multiplied by the hourly
      fuel flow without converting to hours.

      - **{{d4}} kg**: only one hour of fuel flow is subtracted instead of the
      actual flight time.

      - **{{d5}} kg**: the time is divided by 30 instead of 60 (wrong
      minute-to-hour conversion).
- id: QRM74AOJS
  docId: "033.06"
  relatedQuestions:
    - QO0JMEY71
  externalIds:
    - ATPLQ-334754
    - AVEXAM-18874
    - AVEXAM-89785
  annexes:
    - jeppesen-enr-scotland-north
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to the Jeppesen route chart. An aircraft is flying along airway Y904
      from NANEV to WICK VOR/DME. The distance NANEV to WICK read from the chart
      is {{dist}} NM. Given:


      - Fuel over NANEV: {{fob}} kg

      - TAS: {{tas}} kt

      - Wind component: +{{tw}} kt (tailwind)

      - Fuel flow: {{ff}} kg/h


      The remaining fuel when arriving at WICK VOR/DME is:
    variables:
      - id: dist
        label: Distance read from the chart
        unit: NM
      - id: fob
        label: Fuel over NANEV
        unit: kg
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
      - id: ff
        label: Fuel flow
        unit: kg/h
    chartInputs:
      - dist
    answer:
      formula: fob - ff * dist / (tas + tw)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fob - ff * dist / tas
      - id: d2
        formula: fob - ff * dist / (tas - tw)
      - id: d3
        formula: fob - ff * dist / 60
      - id: d4
        formula: fob - ff * (dist + 10) / (tas - tw)
    presets:
      - id: p1
        values:
          dist: 56.7
          fob: 650
          tas: 200
          tw: 17
          ff: 180
    explanation: >-
      A positive wind component is a tailwind, so ground speed is TAS plus the
      component. Flight time is distance over ground speed and fuel burned is
      fuel flow times flight time. The distance is measured on the chart.


      **Solution**


      Ground speed: {{= tas + tw}} kt


      {{f: fob - ff * dist / (tas + tw)}} = {{n: fob - ff * dist / (tas + tw)}}
      = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: wind ignored.

      - **{{d2}} kg**: tailwind subtracted instead of added.

      - **{{d3}} kg**: distance divided by 60.

      - **{{d4}} kg**: distance too large by 10 NM and wind sign wrong.
- id: QRZIZI5GB
  docId: "033.06"
  relatedQuestions:
    - Q1WNMCRHD
  externalIds:
    - ATPLQ-331765
    - ATPLGS-629422
    - ATPLGS-629262
    - AVEXAM-73594
    - AVEXAM-5268
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: |-
      Given the following information, calculate the ground speed (kt):

      - TAS: {{tas}} kt
      - Reported wind: {{wd}}°/{{ws}} kt
      - Course: {{mc}}° (M)
      - Variation: {{var_w}}° (W)
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: mc
        label: Magnetic course
        unit: °
      - id: var_w
        label: West variation
        unit: °
      - id: wd
        label: Wind direction (true)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: tas * cos(asin(ws * sin(wd - (mc + var_w)) / tas)) - ws * cos(wd - (mc
        + var_w))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas + ws
      - id: d2
        formula: tas * cos(asin(ws * sin(wd - (mc - var_w)) / tas)) - ws * cos(wd - (mc
          - var_w))
      - id: d3
        formula: tas - ws * sin(wd - (mc + var_w))
      - id: d4
        formula: tas - ws - var_w
    presets:
      - id: p1
        values:
          tas: 150
          mc: 200
          var_w: 10
          wd: 204
          ws: 30
      - id: p2
        values:
          tas: 120
          mc: 90
          var_w: 5
          wd: 135
          ws: 25
      - id: p3
        values:
          tas: 200
          mc: 300
          var_w: 8
          wd: 250
          ws: 40
    explanation: >-
      The reported wind is a true direction, so the magnetic course must first
      be converted to a true course (west variation is added: magnetic + west =
      true). Then the wind triangle gives the ground speed.


      **Solution**


      True course = {{mc}}° + {{var_w}}° = {{= mc + var_w}}°; WCA = {{= asin(ws
      * sin(wd - (mc + var_w)) / tas)}}°


      {{f: tas * cos(asin(ws * sin(wd - (mc + var_w)) / tas)) - ws * cos(wd -
      (mc + var_w))}} = {{n: tas * cos(asin(ws * sin(wd - (mc + var_w)) / tas))
      - ws * cos(wd - (mc + var_w))}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: TAS and wind speed were added as if there were a pure
      tail wind.

      - **{{d2}} kt**: The variation was subtracted instead of added.

      - **{{d3}} kt**: The cross wind component was used instead of the head
      wind component.

      - **{{d4}} kt**: The variation was subtracted from the ground speed.
- id: QS6NSBJZ2
  docId: "033.06"
