- id: QMPHDZPKJ
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332184
    - AVEXAM-68463
    - AVEXAM-84288
  annexes:
    - 033-fuel-penalty-factors-ecam-alert-table
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Due to a drive failure, the slats of a transport
      category aircraft do not retract properly after take-off. Based on the
      flight planning data below, calculate the fuel penalty in kg for a planned
      flight time of {{time}} min.


      - Usable fuel: {{usable}} kg

      - Fuel consumption: {{ff}} kg/h

      - Final reserve fuel: {{res}} kg


      The fuel penalty factor read from the figure is {{pct}} % of the normal
      fuel consumption.
    variables:
      - id: time
        label: Planned flight time
        unit: min
      - id: usable
        label: Usable fuel
        unit: kg
      - id: ff
        label: Fuel consumption
        unit: kg/h
      - id: res
        label: Final reserve fuel
        unit: kg
      - id: pct
        label: Penalty read from the figure
        unit: "%"
    chartInputs:
      - pct
    answer:
      formula: ff * time / 60 * pct / 100
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: ff * time / 60
      - id: d2
        formula: ff * time / 60 * (100 - pct) / 100
      - id: d3
        formula: ff * pct / 100
      - id: d4
        formula: ff * time / 100 * pct / 100
    presets:
      - id: p1
        values:
          time: 105
          usable: 8540
          ff: 2600
          res: 1100
          pct: 60
      - id: p2
        values:
          time: 90
          usable: 7800
          ff: 2400
          res: 1000
          pct: 40
    explanation: >-
      The fuel penalty is the extra fuel burned because of the failure: the
      normal fuel for the flight time multiplied by the penalty percentage from
      the chart. Usable fuel and final reserve are not needed.


      **Solution**


      Normal trip fuel: {{= ff * time / 60}} kg


      {{f: ff * time / 60 * pct / 100}} = {{n: ff * time / 60 * pct / 100}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: this is the whole trip fuel, the penalty percentage was
      not applied.

      - **{{d2}} kg**: the complement of the percentage was used.

      - **{{d3}} kg**: the flight time was left out (one hour only).

      - **{{d4}} kg**: flight time entered as a decimal of minutes (1.05 h
      written as 105/100).
- id: QMSO1CEUM
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339675
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: During a flight it was found that the wind was {{extra}} kt stronger
      than forecast. If the distance from destination to the alternate is
      {{dist}} NM and the forecast wind was {{fw}} kt headwind, with a TAS of
      {{tas}} kt and assuming that conditions remain the same, what is the new
      estimated time from destination to the alternate?
    variables:
      - id: extra
        label: Additional headwind
        unit: kt
      - id: dist
        label: Distance
        unit: NM
      - id: fw
        label: Forecast headwind
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: dist / (tas - fw - extra) * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (tas - fw) * 60
      - id: d2
        formula: dist / (tas - fw + extra) * 60
      - id: d3
        formula: dist / (tas + fw + extra) * 60
    presets:
      - id: p1
        values:
          extra: 20
          dist: 57
          fw: 20
          tas: 150
      - id: p2
        values:
          extra: 25
          dist: 84
          fw: 15
          tas: 180
      - id: p3
        values:
          extra: 15
          dist: 45
          fw: 10
          tas: 140
    explanation: >-
      A stronger wind than forecast on a headwind leg adds to the headwind, so
      the ground speed falls by the extra amount. The time is distance over the
      new ground speed.


      **Solution**


      New ground speed: {{= tas - fw - extra}} kt


      {{f: dist / (tas - fw - extra) * 60}} = {{n: dist / (tas - fw - extra) *
      60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: uses the forecast headwind only and ignores the extra
      wind.

      - **{{d2}} min**: treats the extra wind as a tailwind.

      - **{{d3}} min**: treats both winds as tailwind.
- id: QMYURLQRF
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333793
    - AVEXAM-68370
    - ATPLGS-108297
    - BGS-330070
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: The still air distance in the climb is {{sad}} Nautical Air Miles
      (NAM) and the time is {{time}} minutes. What ground distance would be
      covered in a {{hw}} kt head wind?
    variables:
      - id: sad
        label: Still air distance
        unit: NAM
      - id: time
        label: Climb time
        unit: min
      - id: hw
        label: Headwind
        unit: kt
    answer:
      formula: sad - hw * time / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: sad + hw * time / 60
      - id: d2
        formula: sad - hw
      - id: d3
        formula: sad
      - id: d4
        formula: sad - hw * time / 100
    presets:
      - id: p1
        values:
          sad: 189
          time: 30
          hw: 30
      - id: p2
        values:
          sad: 150
          time: 25
          hw: 40
    explanation: >-
      A headwind reduces the ground distance covered in a given time by the wind
      speed times that time. Ground distance = still air distance minus the wind
      distance.


      **Solution**


      {{f: sad - hw * time / 60}} = {{n: sad - hw * time / 60}} = **{{answer}}
      NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: wind distance added, as for a tailwind.

      - **{{d2}} NM**: wind subtracted for one hour instead of for the climb
      time.

      - **{{d3}} NM**: wind ignored.

      - **{{d4}} NM**: minutes converted to hours by dividing by 100.
- id: QNHASMVF
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333217
    - AVEXAM-59144
    - ATPLGS-122988
  annexes: []
  learningObjectives:
    - 033.06.01.01.03
  template:
    type: calculation
    question: >-
      Given the following information, what is the actual groundspeed for the
      leg?


      - Leg distance: {{dist}} NM

      - Estimated leg time: {{est_time}} min

      - Actual leg time: {{act_time}} min
    variables:
      - id: dist
        label: Leg distance
        unit: NM
      - id: est_time
        label: Estimated leg time
        unit: min
      - id: act_time
        label: Actual leg time
        unit: min
    answer:
      formula: dist * 60 / act_time
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 60 / est_time
      - id: d2
        formula: dist * 60 / (2 * est_time - act_time)
      - id: d3
        formula: (dist * 60 / est_time + dist * 60 / act_time) / 2
      - id: d4
        formula: dist * 60 / (est_time + act_time)
    presets:
      - id: p1
        values:
          dist: 123
          est_time: 39
          act_time: 41
      - id: p2
        values:
          dist: 87
          est_time: 28
          act_time: 30
      - id: p3
        values:
          dist: 210
          est_time: 66
          act_time: 69
    explanation: >-
      Ground speed is the distance covered divided by the time actually taken.
      The estimated time only gives the planned ground speed.


      **Solution**


      {{f: dist * 60 / act_time}} = {{n: dist * 60 / act_time}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: This is the planned ground speed, from the estimated
      time.

      - **{{d2}} kt**: The time difference was mirrored around the estimate.

      - **{{d3}} kt**: The average of planned and actual ground speed.

      - **{{d4}} kt**: The estimated and actual times were added.
