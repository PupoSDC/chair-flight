- id: Q8YYDKODT
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331027
    - AVEXAM-2135
    - ATPLGS-625279
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: You are flying a constant compass heading of {{ch}}°. Variation is
      {{var_e}}°E, deviation is {{dev_w}}°W and your INS shows a drift of
      {{drift}}° right. What is the true track?
    variables:
      - id: ch
        label: compass heading
        unit: °
      - id: var_e
        label: easterly variation
        unit: °
      - id: dev_w
        label: westerly deviation
        unit: °
      - id: drift
        label: drift to the right
        unit: °
    answer:
      formula: ch - dev_w + var_e + drift
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: ch + dev_w + var_e + drift
      - id: d2
        formula: ch - dev_w + var_e - drift
      - id: d3
        formula: ch - dev_w - var_e + drift
      - id: d4
        formula: ch - dev_w - var_e - drift
    presets:
      - id: p1
        values:
          ch: 252
          var_e: 22
          dev_w: 3
          drift: 9
      - id: p2
        values:
          ch: 130
          var_e: 8
          dev_w: 2
          drift: 5
      - id: p3
        values:
          ch: 310
          var_e: 12
          dev_w: 4
          drift: 7
    explanation: >-
      Compass heading is converted to magnetic heading with the deviation, then
      to true heading with the variation; the drift then gives the track.
      Easterly variation and right drift are added, westerly deviation is
      subtracted.


      **Solution**


      Magnetic heading = {{ch}} - {{dev_w}} = {{= ch - dev_w}}°


      True heading = {{= ch - dev_w}} + {{var_e}} = {{= ch - dev_w + var_e}}°


      True track = {{= ch - dev_w + var_e}} + {{drift}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the westerly deviation was added instead of subtracted.

      - **{{d2}}°**: the right drift was subtracted instead of added.

      - **{{d3}}°**: the easterly variation was subtracted instead of added.

      - **{{d4}}°**: variation and drift were both applied with the wrong sign.
