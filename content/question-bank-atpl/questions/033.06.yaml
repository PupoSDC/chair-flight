        text: The fuel flow appears to be gradually reducing and in order to verify a
          revised fuel flow of 2850 kg/h the new waypoint enables this and a
          revised landing fuel may be calculated.
        correct: false
        why: ""
- id: QHWRVW8HV
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339911
    - ATPLGS-625890
    - ATPLGS-627163
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A helicopter diverts from the destination aerodrome to the alternate
      aerodrome and on arrival is instructed to hold by the ATC.


      The speed is reduced to V minimum power (Vmp) and the fuel flow equals
      {{ff}} kg/h.


      The helicopter must be on the ground at the alternate aerodrome with
      {{res}} minutes of Final Reserve Fuel remaining (based on the fuel flow at
      Vmp).


      Assuming that the remaining usable fuel is {{fuel}} kg, what is the
      remaining safe endurance/flight time in minutes?
    variables:
      - id: ff
        label: Fuel flow at Vmp
        unit: kg/h
      - id: res
        label: Final reserve time
        unit: min
      - id: fuel
        label: Remaining usable fuel
        unit: kg
    answer:
      formula: (fuel - ff * res / 60) / ff * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: fuel / ff * 60
      - id: d2
        formula: (fuel - res) / ff * 60
      - id: d3
        formula: (fuel - ff) / ff * 60
      - id: d4
        formula: fuel / ff * 60 + res
    presets:
      - id: p1
        values:
          ff: 1290
          res: 30
          fuel: 1640
      - id: p2
        values:
          ff: 900
          res: 30
          fuel: 1200
      - id: p3
        values:
          ff: 1500
          res: 45
          fuel: 2100
    explanation: >-
      The safe endurance is the time that can be flown on the fuel that remains
      after the final reserve has been set aside. The final reserve is the fuel
      flow multiplied by the reserve time.


      **Solution**


      Final reserve fuel: {{= ff * res / 60}} kg


      {{f: (fuel - ff * res / 60) / ff * 60}} = {{n: (fuel - ff * res / 60) / ff
      * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the final reserve is not deducted, this is the total
      endurance.

      - **{{d2}} min**: the reserve minutes are subtracted from the fuel
      quantity (a time subtracted from kg).

      - **{{d3}} min**: one hour of fuel flow deducted as reserve instead of the
      required reserve time.

      - **{{d4}} min**: the reserve time added instead of deducted.
- id: QHX3QH1Z3
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335631
    - AVEXAM-80617
    - ATPLGS-627143
  annexes:
    - jeppesen-ad-eham-10-2c
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      You are cleared to hold at RIVER via the PESER 2A arrival (AMSTERDAM,
      Chart 10-2A). When passing PESER, a fuel check reveals {{fob}} kg of fuel
      on board. You decide to divert at {{divert}} kg of fuel remaining. How
      long can you hold before you need to divert?


      Average TAS 260 kt, fuel flow {{ff}} kg/h, wind 310° / 20 kt. The fuel
      needed to fly from PESER to the holding fix, read from the figure, is
      {{fix}} kg.
    variables:
      - id: fob
        label: Fuel on board at PESER
        unit: kg
      - id: divert
        label: Diversion fuel
        unit: kg
      - id: ff
        label: Holding fuel flow
        unit: kg/h
      - id: fix
        label: Fuel from PESER to RIVER (read from figure)
        unit: kg
    chartInputs:
      - fix
    answer:
      formula: (fob - divert - fix) / ff * 60
      unit: minutes
      decimals: 0
    distractors:
      - id: d1
        formula: (fob - divert) / ff * 60
      - id: d2
        formula: (fob - divert - 2 * fix) / ff * 60
      - id: d3
        formula: (fob - divert + fix) / ff * 60
    presets:
      - id: p1
        values:
          fob: 5000
          divert: 3600
          ff: 2400
          fix: 240
    explanation: >-
      The fuel available for holding is the fuel on board minus the fuel that
      must remain when diverting, minus the fuel burned flying from the present
      position to the holding fix. Dividing by the holding fuel flow gives the
      holding time.


      **Solution**


      Fuel available for holding = {{= fob - divert - fix}} kg


      {{f: (fob - divert - fix) / ff * 60}} = {{n: (fob - divert - fix) / ff *
      60}} = **{{answer}} minutes**


      **Why the other answers are wrong**


      - **{{d1}} minutes**: the fuel used to fly from PESER to the holding fix
      was ignored.

      - **{{d2}} minutes**: the fuel to the fix was subtracted twice.

      - **{{d3}} minutes**: the fuel to the fix was added instead of subtracted.
- id: QIKQPHIEU
