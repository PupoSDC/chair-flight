      Refer to the figure (Flight Log excerpt with planned and actual data).


      Fuel remaining at waypoint GAMMA is {{fs}} kg, the fuel flow is {{ff}}
      kg/h and the leg time from GAMMA to DELTA is {{time}} min (all read from
      the Flight Log).


      Provided that flight conditions on the leg GAMMA to DELTA remain unchanged
      and fuel consumption remains unchanged, what fuel remaining should be
      expected at waypoint DELTA?
    variables:
      - id: fs
        label: Fuel remaining at GAMMA (from log)
        unit: kg
      - id: ff
        label: Fuel flow (from log)
        unit: kg/h
      - id: time
        label: Leg time GAMMA to DELTA (from log)
        unit: min
    chartInputs:
      - fs
      - ff
      - time
    answer:
      formula: fs - ff * time / 60
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fs - ff * time / 100
      - id: d2
        formula: fs + ff * time / 60
      - id: d3
        formula: fs - ff * (time + 10) / 60
      - id: d4
        formula: fs - ff * (time - 10) / 60
    presets:
      - id: p1
        values:
          fs: 5440
          ff: 1000
          time: 30
      - id: p2
        values:
          fs: 5150
          ff: 900
          time: 40
    explanation: >-
      Fuel at the next waypoint equals the fuel at the previous waypoint minus
      fuel flow multiplied by leg time.


      **Solution**


      {{f: fs - ff * time / 60}} = {{n: fs - ff * time / 60}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: minutes converted to hours by dividing by 100.

      - **{{d2}} kg**: fuel burned added instead of subtracted.

      - **{{d3}} kg**: leg time taken 10 min too long.

      - **{{d4}} kg**: leg time taken 10 min too short.
