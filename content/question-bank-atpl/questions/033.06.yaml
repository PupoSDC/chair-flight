    - AVEXAM-90610
    - ATPLGS-108271
  annexes:
    - 033-excerpt-from-flight-log-01
  learningObjectives:
    - 033.06.01.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure.


      Planned and actual data are shown in the Flight Log excerpt.


      Fuel remaining at BETA is {{fb}} kg, the fuel flow is {{ff}} kg/h and the
      leg BETA to GAMMA is {{dist}} NM long (all read from the log).


      The actual ground speed on this leg will be {{gs}} kt.


      If all other flight parameters remain unchanged, what actual fuel
      remaining should be expected at waypoint GAMMA?
    variables:
      - id: fb
        label: Fuel remaining at BETA (from log)
        unit: kg
      - id: ff
        label: Fuel flow (from log)
        unit: kg/h
      - id: dist
        label: Leg distance BETA to GAMMA (from log)
        unit: NM
      - id: gs
        label: Actual ground speed
        unit: kt
    chartInputs:
      - fb
      - ff
      - dist
    answer:
      formula: fb - ff * dist / gs
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fb - ff * dist / (gs + 10)
      - id: d2
        formula: fb - ff * dist / (gs - 10)
      - id: d3
        formula: fb - ff * dist / 60
      - id: d4
        formula: fb + ff * dist / gs
    presets:
      - id: p1
        values:
          fb: 2550
          ff: 1100
          dist: 55
          gs: 110
      - id: p2
        values:
          fb: 3200
          ff: 900
          dist: 80
          gs: 120
    explanation: >-
      The leg time is distance divided by actual ground speed. The fuel burned
      is the fuel flow times that time, and it is subtracted from the fuel at
      the start of the leg.


      **Solution**


      Leg time: {{= dist / gs * 60}} min


      {{f: fb - ff * dist / gs}} = {{n: fb - ff * dist / gs}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: ground speed taken 10 kt too high.

      - **{{d2}} kg**: ground speed taken 10 kt too low.

      - **{{d3}} kg**: distance divided by 60 (treated as a speed of 60 kt).

      - **{{d4}} kg**: fuel burned added instead of subtracted.
