    - ATPLGS-625323
    - ATPLGS-629533
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: |-
      For a planned flight the calculated fuel is as follows:

      - Trip fuel: sufficient for a planned flight time of {{plan}} min
      - Reserve fuel: {{res}} % of the planned trip fuel
      - Start up and Taxi fuel: {{taxi}} kg
      - Block fuel: {{block}} kg

      How much fuel should remain after a flight time of {{el}} min?
    variables:
      - id: plan
        label: Planned trip time
        unit: min
      - id: res
        label: Reserve fuel percentage
        unit: "%"
      - id: taxi
        label: Start up and taxi fuel
        unit: kg
      - id: block
        label: Block fuel
        unit: kg
      - id: el
        label: Elapsed flight time
        unit: min
    answer:
      formula: round(block - taxi - (block - taxi) / (1 + res / 100) * el / plan)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: block - (block - taxi) / (1 + res / 100) * el / plan
      - id: d2
        formula: block - taxi - (block - taxi) * el / plan
      - id: d3
        formula: block - taxi - (block - taxi) / (1 + res / 100) * (plan - el) / plan
      - id: d4
        formula: (block - taxi) / (1 + res / 100) * (1 - el / plan)
    presets:
      - id: p1
        values:
          plan: 325
          res: 30
          taxi: 12
          block: 945
          el: 240
      - id: p2
        values:
          plan: 260
          res: 30
          taxi: 15
          block: 650
          el: 180
    explanation: >-
      Block fuel minus taxi fuel is the fuel available for trip plus reserve.
      With the reserve being a percentage of the trip fuel, trip fuel =
      available / (1 + reserve %). Fuel burned is assumed proportional to flight
      time, and the remaining fuel is what is left of the available fuel.


      **Solution**


      Trip fuel: {{= (block - taxi) / (1 + res / 100)}} kg


      Fuel burned: {{= (block - taxi) / (1 + res / 100) * el / plan}} kg


      {{f: block - taxi - (block - taxi) / (1 + res / 100) * el / plan}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: taxi fuel was not subtracted.

      - **{{d2}} kg**: the reserve was not separated, the whole available fuel
      was scaled by time.

      - **{{d3}} kg**: fuel for the remaining time was subtracted instead of the
      elapsed time.

      - **{{d4}} kg**: this is the trip fuel still to be burned, reserve not
      included.
