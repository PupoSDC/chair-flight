        label: DOM
        unit: lb
      - id: load
        label: Traffic load
        unit: lb
      - id: fuel
        label: Remaining usable fuel
        unit: lb
      - id: trip
        label: Remaining trip fuel
        unit: lb
      - id: alt
        label: Alternate fuel
        unit: lb
      - id: res
