- id: QFGPOMYN
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333367
    - ATPLGS-626212
    - AVEXAM-58413
    - AVEXAM-46739
    - AVEXAM-71069
    - ATPLGS-626210
  annexes: []
  learningObjectives:
    - 033.06.01.02.06
  template:
    type: calculation
    question: >-
      A ground distance of {{dist}} NM shall be covered with a planned TAS of
      {{tas}} kt; the fuel consumption is {{fpn}} kg/NM.


      The original fuel planning was made considering the forecast wind
      component of -{{w}} kt.


      Before departure, the forecast is revised to a wind component of +{{w}}
      kt.


      How much fuel is required in addition to the original calculation?
    variables:
      - id: dist
        label: Ground distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: fpn
        label: Fuel per NM
        unit: kg/NM
      - id: w
        label: Wind component
        unit: kt
    answer:
      formula: "0"
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * w * fpn
      - id: d2
        formula: 2 * w
      - id: d3
        formula: fpn * (dist * tas / (tas - w) - dist * tas / (tas + w))
    presets:
      - id: p1
        values:
          dist: 135
          tas: 450
          fpn: 5
          w: 25
      - id: p2
        values:
          dist: 180
          tas: 420
          fpn: 6
          w: 30
      - id: p3
        values:
          dist: 200
          tas: 480
          fpn: 4
          w: 40
    explanation: >-
      The fuel consumption is given per ground nautical mile, so the wind is
      already accounted for in that figure. The fuel needed for a given ground
      distance therefore does not depend on the forecast wind component, and no
      additional fuel is required.


      **Solution**


      Original fuel = {{dist}} NM × {{fpn}} kg/NM = {{= dist * fpn}} kg

      Revised fuel = {{dist}} NM × {{fpn}} kg/NM = {{= dist * fpn}} kg

      Difference = **{{answer}} kg**


      **Why the other answers are wrong**

      - **{{d1}} kg**: the total wind change ({{= 2 * w}} kt) is multiplied by
      the fuel per NM, as if each knot cost one NM of fuel.

      - **{{d2}} kg**: the wind change in knots is read directly as kilograms.

      - **{{d3}} kg**: the air distance difference ({{= dist * tas / (tas - w) -
      dist * tas / (tas + w)}} NM) is converted to fuel, although the
      consumption is already per ground NM.
- id: QFQYBJPB
  docId: "033.06"
  relatedQuestions:
    - QAFDSBRI
  externalIds:
    - ATPLQ-337109
    - AVEXAM-87365
  annexes:
    - 033-navigation-log-ok-thy-dep-to-dest-with-alternate-altn
  learningObjectives:
    - 033.06.02.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      With regard to the given OFP, the flight from the destination to the
      alternate aerodrome is {{dist}} NM long with a ground speed of {{gs}} kt.


      The wind direction remains constant and the headwind component increases
      by {{wchg}} kt.


      By how many minutes will the flight time increase?
    variables:
      - id: dist
        label: Distance to alternate (OFP)
        unit: NM
      - id: gs
        label: Ground speed in OFP
        unit: kt
      - id: wchg
        label: Increase of headwind component
        unit: kt
    chartInputs:
      - dist
      - gs
    answer:
      formula: dist / (gs - wchg) * 60 - dist / gs * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (gs - wchg) * 60
      - id: d2
        formula: dist / gs * 60
      - id: d3
        formula: dist / (gs + wchg) * 60 - dist / gs * 60
      - id: d4
        formula: 2 * (dist / (gs - wchg) * 60 - dist / gs * 60)
      - id: d5
        formula: gs - wchg
    presets:
      - id: p1
        values:
          dist: 20
          gs: 60
          wchg: 10
      - id: p2
        values:
          dist: 24
          gs: 70
          wchg: 10
      - id: p3
        values:
          dist: 30
          gs: 80
          wchg: 15
    explanation: >-
      A stronger headwind reduces the ground speed by the same amount. The
      change in flight time is the new time minus the old time on the same
      distance.


      **Solution**


      Old time = {{f: dist / gs * 60}} = {{= dist / gs * 60}} min


      New ground speed = {{= gs - wchg}} kt, new time = {{= dist / (gs - wchg) *
      60}} min


      Increase = {{= dist / (gs - wchg) * 60}} - {{= dist / gs * 60}} =
      **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: this is the new total flight time, not the increase.

      - **{{d2}} min**: this is the original flight time, without the wind
      change.

      - **{{d3}} min**: the wind change is applied as a tailwind increase (sign
      error), giving a negative change.

      - **{{d4}} min**: the increase is doubled.

      - **{{d5}} kt**: this is the new ground speed, not a time.
