- id: QSRCPRB2G
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339112
    - ATPLGS-626216
    - AVEXAM-21956
    - BGS-330818
    - AVEXAM-66491
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A twin-engine piston aeroplane has two wing tanks with a capacity of
      {{wing}} litres each and a centre tank. A fuel pump ensures that the wing
      tanks are fed from the centre tank at a rate that they are always full.
      Fuel consumption is {{ff}} litres/h per engine. You depart with {{total}}
      litres of fuel on board. {{tf}} minutes into the flight, the fuel pump
      feeding the wing tanks from the centre tank fails (the centre tank still
      holds fuel at that moment).


      What is your endurance in hours?
    variables:
      - id: wing
        label: Capacity of each wing tank
        unit: l
      - id: ff
        label: Fuel consumption per engine
        unit: l/h
      - id: total
        label: Fuel on board at departure
        unit: l
      - id: tf
        label: Time of pump failure
        unit: min
    answer:
      formula: 2 * wing / (2 * ff)
      unit: h
      decimals: 2
    distractors:
      - id: d1
        formula: total / (2 * ff)
      - id: d2
        formula: (total - 2 * ff * tf / 60) / (2 * ff)
      - id: d3
        formula: wing / (2 * ff)
      - id: d4
        formula: (2 * wing - 2 * ff * tf / 60) / (2 * ff)
    presets:
      - id: p1
        values:
          wing: 250
          ff: 125
          total: 700
          tf: 35
      - id: p2
        values:
          wing: 200
          ff: 80
          total: 560
          tf: 30
      - id: p3
        values:
          wing: 300
          ff: 100
          total: 800
          tf: 40
    explanation: >-
      As long as the pump works, the wing tanks stay full. When it fails, only
      the fuel in the two wing tanks is available to the engines (the centre
      tank cannot feed them), and it is consumed by both engines.


      **Solution**


      Fuel available to the engines: 2 x {{wing}} l = {{= 2 * wing}} l


      {{f: 2 * wing / (2 * ff)}} = {{n: 2 * wing / (2 * ff)}} = **{{answer}} h**


      **Why the other answers are wrong**


      - **{{d1}} h**: the centre tank fuel counted as usable.

      - **{{d2}} h**: the fuel burned before the failure deducted from the
      total, but the wing tanks were still full.

      - **{{d3}} h**: only one wing tank counted.

      - **{{d4}} h**: the fuel burned before the failure deducted although the
      pump refilled the wing tanks.
