- id: QLJWXHGH
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339453
    - AVEXAM-28827
    - AVEXAM-37857
    - ATPLGS-629362
    - AVEXAM-57903
    - AVEXAM-66218
    - AVEXAM-54317
    - AVEXAM-87808
    - AVEXAM-80607
    - ATPLGS-628483
  annexes: []
  learningObjectives:
    - 033.06.02.01.03
  template:
    type: calculation
    question: >-
      Provided that the flight is performed as planned, determine the in-flight
      revised landing mass at the destination (kg), given:


      - Dry Operating Mass (DOM): {{dom}} kg

      - Traffic Load: {{tl}} kg

      - Remaining Usable Fuel: {{rem_fuel}} kg

      - Remaining Trip Fuel: {{rem_trip}} kg

      - Final reserve fuel: {{fr}} kg

      - Alternate fuel: {{alt}} kg
    variables:
      - id: dom
        label: Dry operating mass
        unit: kg
      - id: tl
        label: Traffic load
        unit: kg
      - id: rem_fuel
        label: Remaining usable fuel
        unit: kg
      - id: rem_trip
        label: Remaining trip fuel
        unit: kg
      - id: fr
        label: Final reserve fuel
        unit: kg
      - id: alt
        label: Alternate fuel
        unit: kg
    answer:
      formula: dom + tl + rem_fuel - rem_trip
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: dom + tl + rem_fuel
      - id: d2
        formula: dom + tl + rem_fuel - rem_trip - fr
      - id: d3
        formula: dom + tl + rem_fuel - rem_trip - alt
      - id: d4
        formula: dom + tl - rem_trip
    presets:
      - id: p1
        values:
          dom: 30510
          tl: 8000
          rem_fuel: 3788
          rem_trip: 1725
          fr: 883
          alt: 1075
      - id: p2
        values:
          dom: 28400
          tl: 6500
          rem_fuel: 4200
          rem_trip: 2100
          fr: 800
          alt: 1000
      - id: p3
        values:
          dom: 35200
          tl: 9500
          rem_fuel: 5100
          rem_trip: 2600
          fr: 950
          alt: 1200
    explanation: >-
      The current aircraft mass is DOM + traffic load + remaining usable fuel.
      If the flight goes as planned only the remaining trip fuel is burned, so
      reserves stay on board at landing.


      **Solution**


      {{f: dom + tl + rem_fuel - rem_trip}} = {{n: dom + tl + rem_fuel -
      rem_trip}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: The remaining trip fuel was not subtracted (this is the
      current mass).

      - **{{d2}} kg**: The final reserve fuel was subtracted as well, although
      it is still on board at landing.

      - **{{d3}} kg**: The alternate fuel was subtracted as well, although it is
      still on board at landing.

      - **{{d4}} kg**: The remaining usable fuel was left out of the mass.
