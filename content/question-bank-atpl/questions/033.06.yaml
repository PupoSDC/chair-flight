- id: QIWSBFDU2
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334522
    - ATPLGS-626217
    - BGS-331200
    - ATPLGS-123118
    - AVEXAM-83624
    - AVEXAM-98522
    - BGS-331011
    - BGS-331008
    - BGS-330952
    - AVEXAM-99638
    - ATPLGS-108195
    - ATPLGS-123054
    - BGS-330899
    - ATPLGS-622338
    - AVEXAM-80420
    - ATPLGS-123074
    - ATPLGS-123052
    - AVEXAM-72695
    - AVEXAM-76733
    - AVEXAM-6367
    - AVEXAM-70688
    - BGS-331080
    - AVEXAM-23934
    - AVEXAM-55397
    - BGS-330914
    - AVEXAM-61713
    - ATPLGS-114107
    - ATPLGS-626241
    - ATPLGS-123053
    - AVEXAM-43871
    - ATPLGS-625323
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      For a planned flight the calculated fuel is as listed below. How much fuel
      should be aboard to cover the rest of the flight, if the remaining flight
      time to destination is {{t_rem}} minutes?


      - Trip Fuel: sufficient for a planned flight time of {{t_trip}} minutes

      - Operator's specified Reserve Fuel: {{res_pct}}% of the planned Trip Fuel

      - Start up and Taxi Fuel: {{taxi}} kg

      - Block Fuel: {{block}} kg
    variables:
      - id: block
        label: Block fuel
        unit: kg
      - id: taxi
        label: Start-up and taxi fuel
        unit: kg
      - id: res_pct
        label: Reserve percentage
        unit: "%"
      - id: t_trip
        label: Planned trip time
        unit: min
      - id: t_rem
        label: Remaining flight time
        unit: min
    answer:
      formula: (block - taxi) / (1 + res_pct / 100) * (t_rem / t_trip + res_pct / 100)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (block - taxi) / (1 + res_pct / 100) * t_rem / t_trip
      - id: d2
        formula: (block - taxi) / (1 + res_pct / 100) * t_rem / t_trip * (1 + res_pct /
          100)
      - id: d3
        formula: (block - taxi) / (1 + res_pct / 100) * (t_rem / t_trip + res_pct / 100)
          + taxi
    presets:
      - id: p1
        values:
          block: 890
          taxi: 35
          res_pct: 30
          t_trip: 285
          t_rem: 105
      - id: p2
        values:
          block: 1250
          taxi: 40
          res_pct: 30
          t_trip: 330
          t_rem: 130
      - id: p3
        values:
          block: 620
          taxi: 25
          res_pct: 20
          t_trip: 240
          t_rem: 90
    explanation: >-
      Block fuel is the sum of start-up and taxi fuel, trip fuel and reserve
      fuel. Fuel required for the rest of the flight is the part of the trip
      fuel still to be burnt (proportional to the remaining time) plus the full
      reserve, which must still be on board. Start-up and taxi fuel has already
      been used.


      **Solution**


      Trip fuel: {{f: (block - taxi) / (1 + res_pct / 100)}} = {{n: (block -
      taxi) / (1 + res_pct / 100)}} = {{= (block - taxi) / (1 + res_pct / 100)}}
      kg


      Reserve fuel: {{res_pct}}% of trip fuel = {{= (block - taxi) / (1 +
      res_pct / 100) * res_pct / 100}} kg


      Trip fuel still to burn: {{= (block - taxi) / (1 + res_pct / 100)}} kg *
      {{t_rem}} / {{t_trip}} = {{= (block - taxi) / (1 + res_pct / 100) * t_rem
      / t_trip}} kg


      Fuel required = {{= (block - taxi) / (1 + res_pct / 100) * t_rem /
      t_trip}} + {{= (block - taxi) / (1 + res_pct / 100) * res_pct / 100}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: only the remaining trip fuel; the reserve fuel is
      forgotten.

      - **{{d2}} kg**: the reserve is taken as {{res_pct}}% of the remaining
      trip fuel instead of the full planned trip fuel.

      - **{{d3}} kg**: the start-up and taxi fuel is added again although it has
      already been used.
- id: QJJWGCPR
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339034
    - ATPLGS-123184
    - BGS-339592
    - ATPLGS-626209
    - AVEXAM-73673
  annexes: []
  learningObjectives:
    - 033.06.01.01.03
  template:
    type: calculation
    question: >-
      The planned flight time between two waypoints is {{tplan}} minutes, and
      the distance is {{dist}} NM. During the actual flight, the flight time
      between these waypoints is found to be {{tact}} minutes.


      How much lower is the actual groundspeed compared to the one that has been
      used for planning? Answer in kt.
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: tplan
        label: Planned flight time
        unit: min
      - id: tact
        label: Actual flight time
        unit: min
    answer:
      formula: dist / tplan * 60 - dist / tact * 60
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tplan * 60
      - id: d2
        formula: dist / tact * 60
      - id: d3
        formula: dist / tact * 60 - dist / tplan * 60
      - id: d4
        formula: (tact - tplan) * dist / tplan
      - id: d5
        formula: dist / (tact - tplan) * 60
    presets:
      - id: p1
        values:
          dist: 30
          tplan: 25
          tact: 32
      - id: p2
        values:
          dist: 60
          tplan: 30
          tact: 40
      - id: p3
        values:
          dist: 45
          tplan: 20
          tact: 26
    explanation: >-
      Groundspeed is distance divided by time. Compute the planned and the
      actual groundspeed and subtract them. Times in minutes are converted to
      hours by multiplying the result by 60.


      **Solution**


      Planned GS = {{dist}} NM / {{tplan}} min × 60 = {{= dist / tplan * 60}} kt


      Actual GS = {{dist}} NM / {{tact}} min × 60 = {{= dist / tact * 60}} kt


      {{f: dist / tplan * 60 - dist / tact * 60}} = {{n: dist / tplan * 60 -
      dist / tact * 60}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: this is the planned groundspeed, not the difference.

      - **{{d2}} kt**: this is the actual groundspeed, not the difference.

      - **{{d3}} kt**: the difference was taken with the wrong sign (actual
      minus planned).

      - **{{d4}} kt**: the time difference was multiplied by the planned
      distance per minute, which is not a speed difference.

      - **{{d5}} kt**: the distance was divided by the time difference only.
- id: QKEKPMVID
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334866
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      An aircraft flying from A to B (total distance {{dist}} NM) has a planned
      flight time of {{planned}} minutes.


      After {{elapsed}} minutes of flight, the aircraft overflies waypoint C
      located {{dist_c}} NM away from A.


      What Ground Speed should be flown as from C in order to reach point B at
      the planned arrival time?
    variables:
      - id: dist
        label: Total distance A to B
        unit: NM
      - id: planned
        label: Planned flight time
        unit: min
      - id: elapsed
        label: Time elapsed at C
        unit: min
      - id: dist_c
        label: Distance A to C
        unit: NM
    answer:
      formula: (dist - dist_c) / ((planned - elapsed) / 60)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: dist / planned * 60
      - id: d2
        formula: dist_c / elapsed * 60
      - id: d3
        formula: dist_c / (planned - elapsed) * 60
      - id: d4
        formula: (dist - dist_c) / (planned / 60)
    presets:
      - id: p1
        values:
          dist: 110
          planned: 40
          elapsed: 25
          dist_c: 65
      - id: p2
        values:
          dist: 95
          planned: 45
          elapsed: 25
          dist_c: 50
      - id: p3
        values:
          dist: 140
          planned: 50
          elapsed: 30
          dist_c: 80
    explanation: >-
      The required ground speed is the remaining distance divided by the
      remaining time until the planned arrival time.


      **Solution**


      Remaining distance = {{dist}} - {{dist_c}} = {{= dist - dist_c}} NM


      Remaining time = {{planned}} - {{elapsed}} = {{= planned - elapsed}} min


      {{= dist - dist_c}} / ({{= planned - elapsed}} / 60) = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: is the average ground speed needed for the whole flight,
      ignoring the progress already made.

      - **{{d2}} kt**: is the ground speed already flown from A to C.

      - **{{d3}} kt**: divides the distance already flown by the remaining time.

      - **{{d4}} kt**: divides the remaining distance by the total planned time
      instead of the remaining time.
- id: QKNNTLZA
  docId: "033.06"
  relatedQuestions:
    - QHTXJ76LC
  externalIds:
    - ATPLQ-335501
    - AVEXAM-64012
    - AVEXAM-73300
  annexes: []
  learningObjectives:
    - 033.06.01.01.05
  template:
    type: calculation
    question: >-
      An aircraft is in cruising flight at FL {{fl}} with a ground speed of
      {{gs}} kt. The pilot intends to descend at {{rod}} ft/min to arrive
      overhead the VOR at {{alt}} ft (QNH {{qnh}} hPa). The TAS remains constant
      in the descent, the wind is negligible and the temperature is standard.


      At which distance from the VOR should the pilot commence the descent? (Use
      1 hPa = 30 ft and standard pressure 1013 hPa; answer in NM.)
    variables:
      - id: fl
        label: Cruise flight level
        unit: ""
      - id: qnh
        label: QNH
        unit: hPa
      - id: alt
        label: Altitude to reach
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: (fl * 100 + (qnh - 1013) * 30 - alt) / rod * gs / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 - alt) / rod * gs / 60
      - id: d2
        formula: (fl * 100 - (qnh - 1013) * 30 - alt) / rod * gs / 60
      - id: d3
        formula: (fl * 100 + (qnh - 1013) * 30) / rod * gs / 60
      - id: d4
        formula: (fl * 100 + (qnh - 1013) * 30 - alt) / rod
    presets:
      - id: p1
        values:
          fl: 95
          qnh: 1030
          alt: 2000
          rod: 500
          gs: 155
      - id: p2
        values:
          fl: 75
          qnh: 1025
          alt: 2500
          rod: 500
          gs: 130
      - id: p3
        values:
          fl: 120
          qnh: 1005
          alt: 3000
          rod: 600
          gs: 160
    explanation: >-
      The descent distance is the time needed to lose the height multiplied by
      the ground speed. The height to lose is measured from the true altitude at
      cruise level: a flight level is flown on the standard setting (1013 hPa),
      so with QNH {{qnh}} hPa the aeroplane is {{= (qnh - 1013) * 30}} ft ({{=
      qnh - 1013}} hPa × 30 ft/hPa) higher above the QNH datum than the flight
      level suggests.


      **Solution**


      Height to lose = {{= fl * 100}} ft + {{= (qnh - 1013) * 30}} ft - {{alt}}
      ft = {{= fl * 100 + (qnh - 1013) * 30 - alt}} ft


      Time = {{= (fl * 100 + (qnh - 1013) * 30 - alt)}} ft / {{rod}} ft/min =
      {{= (fl * 100 + (qnh - 1013) * 30 - alt) / rod}} min


      {{f: (fl * 100 + (qnh - 1013) * 30 - alt) / rod * gs / 60}} = {{n: (fl *
      100 + (qnh - 1013) * 30 - alt) / rod * gs / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the QNH correction was ignored and the descent was
      planned from the flight level as if it were altitude.

      - **{{d2}} NM**: the QNH correction was subtracted instead of added.

      - **{{d3}} NM**: the target altitude was not subtracted, so too much
      height was assumed.

      - **{{d4}} NM**: this is the descent time in minutes, not multiplied by
      the ground speed.
