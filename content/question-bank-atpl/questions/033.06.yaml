    - 033.03.01.01.03
    - "033.06"
  template:
    type: calculation
    question: |-
      For the following information, calculate the maximum attainable range:

      - Average fuel flow: {{ff}} USG/h
      - Available fuel: {{fuel}} USG
      - TAS: {{tas}} kt
      - Wind component: {{wc}} kt (positive = tailwind, negative = headwind)
    variables:
      - id: ff
        label: Fuel flow
        unit: USG/h
      - id: fuel
        label: Available fuel
        unit: USG
      - id: tas
        label: TAS
        unit: kt
      - id: wc
        label: Wind component (tailwind positive, headwind negative)
        unit: kt
    answer:
      formula: fuel / ff * (tas + wc)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: fuel / ff * (tas - wc)
      - id: d2
        formula: fuel / ff * tas
      - id: d3
        formula: fuel / ff * (tas + 2 * wc)
      - id: d4
        formula: fuel / ff * (tas + wc) * 60
    presets:
      - id: p1
        values:
          ff: 9.2
          fuel: 42
          tas: 145
          wc: -20
      - id: p2
        values:
          ff: 9.6
          fuel: 50
          tas: 100
          wc: 15
      - id: p3
        values:
          ff: 12
          fuel: 60
          tas: 120
          wc: -10
    explanation: >-
      The endurance is the available fuel divided by the fuel flow. The maximum
      range is the endurance multiplied by the ground speed, i.e. the TAS
      corrected for the wind component (plus for a tailwind, minus for a
      headwind).


      **Solution**


      Endurance: {{= fuel / ff}} h


      {{f: fuel / ff * (tas + wc)}} = {{n: fuel / ff * (tas + wc)}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: wind component applied with the wrong sign.

      - **{{d2}} NM**: wind ignored, TAS used as ground speed.

      - **{{d3}} NM**: wind component applied twice.

      - **{{d4}} NM**: endurance converted to minutes before multiplying by the
      speed in kt.
