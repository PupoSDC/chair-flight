- id: QQVW8RZYH
  docId: "033.06"
  relatedQuestions:
    - QWDMWWGL5
  externalIds:
    - ATPLQ-337707
    - BGS-331092
    - ATPLGS-629381
    - AVEXAM-28053
    - ATPLQ-335178
    - AVEXAM-39742
  annexes: []
  learningObjectives:
    - "033.01"
    - "033.06"
  template:
    type: calculation
    question: >-
      You are flying a heading of {{hdg}}° with a TAS of {{tas}} kt. The wind is
      from {{wd}}° at {{ws}} kt.


      What will be your ground speed?
    variables:
      - id: hdg
        label: Heading
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction (from)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - ws
      - id: d2
        formula: tas + ws
      - id: d3
        formula: tas - ws * cos(wd - hdg)
      - id: d4
        formula: tas + ws * cos(wd - hdg)
      - id: d5
        formula: sqrt(tas^2 - (ws * sin(wd - hdg))^2)
    presets:
      - id: p1
        values:
          hdg: 120
          tas: 110
          wd: 260
          ws: 30
      - id: p2
        values:
          hdg: 20
          tas: 180
          wd: 60
          ws: 30
      - id: p3
        values:
          hdg: 270
          tas: 120
          wd: 330
          ws: 25
    explanation: >-
      With the heading known, the ground speed is the vector sum of the air
      vector (heading, TAS) and the wind vector. Split the wind into a component
      along the heading (head/tailwind) and a component across it (crosswind),
      then combine them with Pythagoras.


      **Solution**


      Along-heading speed: {{= tas - ws * cos(wd - hdg)}} kt


      Cross component: {{= ws * sin(wd - hdg)}} kt


      {{f: sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)}} = {{n:
      sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: full wind speed subtracted as if it were a direct
      headwind.

      - **{{d2}} kt**: full wind speed added as if it were a direct tailwind.

      - **{{d3}} kt**: only the along-heading wind component applied, the
      crosswind effect is ignored.

      - **{{d4}} kt**: the wind component along the heading added with the wrong
      sign.

      - **{{d5}} kt**: the crosswind removed from the TAS but the wind component
      along the heading ignored.
