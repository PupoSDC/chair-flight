- id: QBZQLGHGU
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337589
    - AVEXAM-76125
    - ATPLGS-629426
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      An aircraft flies a distance of {{dist}} NM at a ground speed of {{gs}}
      kt.


      After {{t}} minutes of flight, {{left}} kg of fuel is left in the tanks.


      The planned fuel flow is {{ff}} kg/h.


      By how many kg/h is the actual fuel flow lower than planned? (Give the
      difference as a positive number.)
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: gs
        label: Ground speed
        unit: kt
      - id: t
        label: Elapsed time
        unit: min
      - id: left
        label: Fuel remaining
        unit: kg
      - id: ff
        label: Planned fuel flow
        unit: kg/h
    answer:
      formula: ff - (ff * dist / gs - left) / (t / 60)
      unit: kg/h
      decimals: 0
    distractors:
      - id: d1
        formula: (ff * dist / gs - left) / (t / 60)
      - id: d2
        formula: abs(ff - left / (t / 60))
      - id: d3
        formula: ff * dist / gs / (t / 60) - ff
      - id: d4
        formula: ff * dist / gs - left
    presets:
      - id: p1
        values:
          dist: 220
          gs: 140
          t: 40
          left: 46
          ff: 45
      - id: p2
        values:
          dist: 240
          gs: 120
          t: 90
          left: 55
          ff: 50
    explanation: >-
      The planned trip fuel is the planned fuel flow times the planned flight
      time (distance / ground speed). The fuel used so far is the planned trip
      fuel minus the fuel remaining; dividing by the elapsed time gives the
      actual fuel flow.


      **Solution**


      Planned trip fuel = {{= ff * dist / gs}} kg

      Fuel used = {{= ff * dist / gs - left}} kg in {{t}} min

      Actual fuel flow = {{= (ff * dist / gs - left) / (t / 60)}} kg/h


      Difference = {{f: ff - (ff * dist / gs - left) / (t / 60)}} = {{n: ff -
      (ff * dist / gs - left) / (t / 60)}} = **{{answer}} kg/h less than
      planned**


      **Why the other answers are wrong**


      - **{{d1}} kg/h**: this is the actual fuel flow itself, not the difference
      from the plan.

      - **{{d2}} kg/h**: treats the remaining fuel as if it were the fuel used.

      - **{{d3}} kg/h**: uses the whole planned trip fuel as fuel used and gets
      the opposite relation to the plan.

      - **{{d4}} kg/h**: gives the fuel used, forgetting to divide by the
      elapsed time.
- id: QCMCSZRR
  docId: "033.06"
