- id: QT9KINP7O
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331756
    - ATPLGS-626215
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Based on the operational flight plan excerpt below, calculate the
      estimated remaining fuel overhead waypoint B, assuming ground speed and
      actual fuel flow stay the same as on the leg before:


      - Departure: fuel {{f0}} kg

      - Waypoint A: distance {{d1}} NM, {{t1}} min after departure, planned fuel
      {{fp}} kg, actual fuel {{fa}} kg

      - Waypoint B: distance {{d2}} NM from A
    variables:
      - id: f0
        label: Fuel at departure
        unit: kg
      - id: d1
        label: Distance departure-A
        unit: NM
      - id: t1
        label: Time departure-A
        unit: min
      - id: fp
        label: Planned fuel at A
        unit: kg
      - id: fa
        label: Actual fuel at A
        unit: kg
      - id: d2
        label: Distance A-B
        unit: NM
    answer:
      formula: fa - (f0 - fa) / t1 * (t1 * d2 / d1)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fp - (f0 - fa) / t1 * (t1 * d2 / d1)
      - id: d2
        formula: fa - (f0 - fa)
      - id: d3
        formula: f0 - (f0 - fa) / t1 * (t1 * d2 / d1)
      - id: d4
        formula: fa - (f0 - fp) / t1 * (t1 * d2 / d1)
    presets:
      - id: p1
        values:
          f0: 2800
          d1: 200
          t1: 40
          fp: 2400
          fa: 2290
          d2: 150
      - id: p2
        values:
          f0: 3200
          d1: 225
          t1: 45
          fp: 2800
          fa: 2650
          d2: 180
      - id: p3
        values:
          f0: 2500
          d1: 150
          t1: 30
          fp: 2150
          fa: 2100
          d2: 90
    explanation: >-
      The time on the next leg follows from the ground speed of the previous
      leg; the fuel burn uses the actual fuel flow (actual fuel used divided by
      time), starting from the actual fuel at the last waypoint.


      **Solution**


      Leg time A-B = {{= t1 * d2 / d1}} min


      Actual fuel flow = {{= f0 - fa}} kg / {{t1}} min = {{= (f0 - fa) / t1 *
      60}} kg/h


      {{f: fa - (f0 - fa) / t1 * (t1 * d2 / d1)}} = {{n: fa - (f0 - fa) / t1 *
      (t1 * d2 / d1)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: starts from the planned fuel at A instead of the actual
      fuel.

      - **{{d2}} kg**: subtracts the burn of the whole first leg instead of the
      second leg.

      - **{{d3}} kg**: starts from the departure fuel instead of the fuel
      actually remaining at A.

      - **{{d4}} kg**: uses the planned fuel flow instead of the actual one.
- id: QTDGVIHH
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338788
    - ATPLGS-629303
    - BGS-330993
  annexes: []
  learningObjectives:
    - 033.06.01.01.04
  template:
    type: calculation
    question: >-
      A helicopter has missed a waypoint by {{xtk}} NM across track.


      - True airspeed: {{tas}} kt

      - Time since the last waypoint was correctly overflown: {{t}} min


      Using the 1-in-60 rule, by how many degrees has the helicopter been off
      track since the last waypoint?
    variables:
      - id: xtk
        label: Cross-track error
        unit: NM
      - id: tas
        label: True airspeed
        unit: kt
      - id: t
        label: Time since last waypoint
        unit: min
    answer:
      formula: 60 * xtk / (tas * t / 60)
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: 60 * xtk / tas
      - id: d2
        formula: 57.3 * xtk / (tas * t / 60)
      - id: d3
        formula: 60 * xtk / (tas * t)
      - id: d4
        formula: 90 * xtk / (tas * t / 60)
    presets:
      - id: p1
        values:
          xtk: 1.2
          tas: 120
          t: 22.5
      - id: p2
        values:
          xtk: 0.8
          tas: 140
          t: 15
      - id: p3
        values:
          xtk: 2
          tas: 100
          t: 30
    explanation: >-
      The 1-in-60 rule states that one nautical mile off track after 60 NM flown
      corresponds to an angle of one degree. The distance flown is the true
      airspeed multiplied by the time. The off-track angle is therefore 60 times
      the cross-track error divided by the distance flown.


      **Solution**


      Distance flown: {{tas}} kt x {{t}} min / 60 = {{= tas * t / 60}} NM


      {{f: 60 * xtk / (tas * t / 60)}} = {{n: 60 * xtk / (tas * t / 60)}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets to divide the cross-track error by the distance
      flown.

      - **{{d2}}°**: uses radians to degrees conversion (57.3) instead of the
      1-in-60 rule.

      - **{{d3}}°**: uses the time in minutes as if it were hours.

      - **{{d4}}°**: uses the wrong constant (90 instead of 60).
- id: QTVV2GKNK
