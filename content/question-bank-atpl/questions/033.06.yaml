- id: Q019BGWOO
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334277
    - ATPLGS-129386
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A flight log records ETO, ATO, planned fuel and actual fuel at each
      waypoint.


      At the last waypoint the actual fuel was {{lf}} l (ETO 10:10, ATO 10:08).


      The next waypoint has an ETO of 10:32, which is {{gap}} min after the last
      ETO.


      If the fuel flow is {{ff}} l/h, find the fuel remaining in litres at that
      waypoint.
    variables:
      - id: lf
        label: Last actual fuel
        unit: l
      - id: ff
        label: Fuel flow
        unit: l/h
      - id: gap
        label: Time from last ETO to next ETO
        unit: min
    answer:
      formula: lf - ff * gap / 60
      unit: l
      decimals: 0
    distractors:
      - id: d1
        formula: lf - ff * (gap + 2) / 60
      - id: d2
        formula: lf - ff * gap / 100
      - id: d3
        formula: lf + ff * gap / 60
      - id: d4
        formula: lf - ff * (gap + 8) / 60
    presets:
      - id: p1
        values:
          lf: 130
          ff: 52
          gap: 22
      - id: p2
        values:
          lf: 120
          ff: 48
          gap: 18
    explanation: >-
      Fuel at the next waypoint is the last actual fuel minus the fuel burned
      over the planned interval to the next ETO (fuel flow times time).


      **Solution**


      {{f: lf - ff * gap / 60}} = {{n: lf - ff * gap / 60}} = **{{answer}} l**


      **Why the other answers are wrong**


      - **{{d1}} l**: the interval was taken 2 min too long (ETO to ATO mix-up).

      - **{{d2}} l**: minutes converted by dividing by 100.

      - **{{d3}} l**: fuel burned added instead of subtracted.

      - **{{d4}} l**: the interval was taken 8 min too long.
