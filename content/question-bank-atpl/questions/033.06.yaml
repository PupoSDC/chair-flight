  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Planning data as shown in the Flight Log excerpt
      (Fuel Planning Section). After a balked landing at the destination
      airport, you have to divert to the alternate airport with the gear
      extended. The aircraft mass at the balked landing, read from the figure,
      is {{m0}} kg. The re-calculated flight time to the alternate due to the
      reduced speed is {{t_h}} h {{t_min}} min and the fuel flow will be {{ff}}
      kg/h. Final Reserve Fuel remains unchanged.


      What will be the estimated landing mass at the alternate airport (kg)?
    variables:
      - id: m0
        label: Mass at balked landing (read from figure)
        unit: kg
      - id: t_h
        label: Flight time, hours
        unit: h
      - id: t_min
        label: Flight time, minutes
        unit: min
      - id: ff
        label: Fuel flow
        unit: kg/h
    chartInputs:
      - m0
    answer:
      formula: m0 - ff * (t_h + t_min / 60)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: m0
      - id: d2
        formula: m0 + ff * (t_h + t_min / 60)
      - id: d3
        formula: m0 - ff * (t_h + t_min / 100)
      - id: d4
        formula: m0 - ff * t_h
    presets:
      - id: p1
        values:
          m0: 7037
          t_h: 1
          t_min: 10
          ff: 900
      - id: p2
        values:
          m0: 7430
          t_h: 1
          t_min: 50
          ff: 840
      - id: p3
        values:
          m0: 7260
          t_h: 2
          t_min: 20
          ff: 780
      - id: p4
        values:
          m0: 6834
          t_h: 1
          t_min: 20
          ff: 720
    explanation: >-
      The mass at the alternate is the mass at the balked landing minus the fuel
      burned during the diversion, which is the fuel flow times the flight time
      in hours.


      **Solution**


      Fuel burned: {{= ff * (t_h + t_min / 60)}} kg


      {{f: m0 - ff * (t_h + t_min / 60)}} = {{n: m0 - ff * (t_h + t_min / 60)}}
      = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: The diversion fuel was not subtracted.

      - **{{d2}} kg**: The diversion fuel was added instead of subtracted.

      - **{{d3}} kg**: The minutes were converted to hours by dividing by 100
      instead of 60.

      - **{{d4}} kg**: The minutes of the flight time were ignored.
- id: QA6KP6JYQ
  docId: "033.06"
  relatedQuestions:
    - QR8HOLJDP
  externalIds:
    - ATPLQ-332171
