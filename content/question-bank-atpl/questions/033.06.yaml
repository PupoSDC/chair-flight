- id: QVLKWPGCD
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334335
    - AVEXAM-95847
    - ATPLGS-123106
    - BGS-330522
    - AVEXAM-85549
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      The Block fuel for an IFR flight with a single engine aircraft was
      {{block}} lb.


      - Alternate fuel = {{alt}} lb

      - Final reserve fuel = {{frf}} lb

      - Taxi fuel = {{taxi}} lb


      After a flight time of {{elapsed}} minutes the remaining fuel is
      {{remaining}} lb. Considering a constant fuel flow, the remaining flight
      time to fly to the destination, landing with the required reserve fuel is
      (in minutes):
    variables:
      - id: block
        label: Block fuel
        unit: lb
      - id: alt
        label: Alternate fuel
        unit: lb
      - id: frf
        label: Final reserve fuel
        unit: lb
      - id: taxi
        label: Taxi fuel
        unit: lb
      - id: elapsed
        label: Flight time elapsed
        unit: min
      - id: remaining
        label: Remaining fuel
        unit: lb
    answer:
      formula: (remaining - alt - frf) * elapsed / (block - taxi - remaining)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: remaining * elapsed / (block - taxi - remaining)
      - id: d2
        formula: (remaining - alt) * elapsed / (block - taxi - remaining)
      - id: d3
        formula: (remaining - frf) * elapsed / (block - taxi - remaining)
      - id: d4
        formula: (remaining - alt - frf) * elapsed / (block - remaining)
    presets:
      - id: p1
        values:
          block: 200
          alt: 40
          frf: 50
          taxi: 10
          elapsed: 36
          remaining: 110
      - id: p2
        values:
          block: 300
          alt: 50
          frf: 60
          taxi: 15
          elapsed: 45
          remaining: 160
      - id: p3
        values:
          block: 120
          alt: 15
          frf: 20
          taxi: 8
          elapsed: 30
          remaining: 62
    explanation: >-
      Fuel flow is constant, so fuel burned in flight is proportional to time.
      The fuel used in flight is block fuel minus taxi fuel minus remaining
      fuel; the fuel still usable to the destination is the remaining fuel minus
      alternate and final reserve.


      **Solution**


      Fuel used in flight = {{block}} - {{taxi}} - {{remaining}} = {{= block -
      taxi - remaining}} lb in {{elapsed}} min


      Usable fuel left = {{remaining}} - {{alt}} - {{frf}} = {{= remaining - alt
      - frf}} lb


      Time = {{= remaining - alt - frf}} * {{elapsed}} / {{= block - taxi -
      remaining}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: does not subtract the alternate and final reserve fuel
      from the remaining fuel.

      - **{{d2}} min**: does not subtract the final reserve fuel.

      - **{{d3}} min**: does not subtract the alternate fuel.

      - **{{d4}} min**: includes the taxi fuel in the fuel burned in flight,
      which gives a too low fuel flow... actually a too high burn and therefore
      a too short time.
- id: QVNSQE6HB
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339565
    - ATPLGS-108300
    - BGS-330556
    - AVEXAM-64794
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      After flying for {{time_out}} min at {{tas}} kt TAS with a {{tailwind}} kt
      tail wind component, you have to return to the airfield of departure.


      Assuming a turn rate of {{turn_rate}}°/s, after how many minutes will you
      arrive overhead the airfield?


      Give the answer in minutes.
    variables:
      - id: time_out
        label: Time out
        unit: min
      - id: tas
        label: TAS
        unit: kt
      - id: tailwind
        label: Tail wind component
        unit: kt
      - id: turn_rate
        label: Turn rate
        unit: °/s
    answer:
      formula: time_out * (tas + tailwind) / (tas - tailwind) + 180 / turn_rate / 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: time_out * (tas + tailwind) / (tas - tailwind)
      - id: d2
        formula: time_out + 180 / turn_rate / 60
      - id: d3
        formula: time_out * (tas - tailwind) / (tas + tailwind)
      - id: d4
        formula: time_out * (tas + tailwind) / (tas - tailwind) + 180 / turn_rate
    presets:
      - id: p1
        values:
          time_out: 16
          tas: 100
          tailwind: 20
          turn_rate: 3
      - id: p2
        values:
          time_out: 20
          tas: 150
          tailwind: 30
          turn_rate: 3
    explanation: >-
      With a tail wind, the outbound ground speed is the TAS plus the tail wind,
      so the distance flown out is larger. The return trip is flown against the
      wind at a ground speed of TAS minus the tail wind. The 180 degree turn at
      the turning point takes 180 divided by the turn rate in seconds, which is
      converted to minutes.


      **Solution**


      Distance out = {{= time_out / 60 * (tas + tailwind)}} NM


      Return ground speed = {{= tas - tailwind}} kt


      Return time = {{= time_out * (tas + tailwind) / (tas - tailwind)}} min


      Turn time = 180 / {{turn_rate}} = {{= 180 / turn_rate}} s = {{= 180 /
      turn_rate / 60}} min


      {{f: time_out * (tas + tailwind) / (tas - tailwind) + 180 / turn_rate /
      60}} = {{n: time_out * (tas + tailwind) / (tas - tailwind) + 180 /
      turn_rate / 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: forgets the 180 degree turn.

      - **{{d2}} min**: ignores the wind and uses the time out as the return
      time.

      - **{{d3}} min**: inverts the ground speed ratio.

      - **{{d4}} min**: adds the turn time in seconds without converting it to
      minutes.
- id: QWSFPGI8V
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334208
    - ATPLGS-626293
    - BGS-331096
    - AVEXAM-37629
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A flight has been diverted off the planned route due to bad weather. ATC
      clears the flight to re-join the planned route at TUSKA. The pilot wishes
      to decide early whether there is enough fuel to safely complete the
      flight, so the fuel is checked {{t}} minutes before the ETO TUSKA. Given
      the following data, what is the minimum fuel required at the time of the
      check to complete the planned flight?


      - Minimum fuel at TUSKA to complete the flight: {{fmin}} litres

      - Average fuel flow: {{ff}} kg/h

      - Fuel density: {{rho}} kg/lt
    variables:
      - id: t
        label: Time from check to ETO
        unit: min
      - id: fmin
        label: Minimum fuel at TUSKA
        unit: litres
      - id: ff
        label: Fuel flow
        unit: kg/h
      - id: rho
        label: Fuel density
        unit: kg/lt
    answer:
      formula: (fmin * rho + ff * t / 60) / rho
      unit: litres
      decimals: 0
    distractors:
      - id: d1
        formula: fmin + ff * t / 60
      - id: d2
        formula: (fmin * rho - ff * t / 60) / rho
      - id: d3
        formula: fmin + ff * t / 60 * rho
    presets:
      - id: p1
        values:
          t: 37
          fmin: 144
          ff: 45
          rho: 0.72
      - id: p2
        values:
          t: 50
          fmin: 160
          ff: 40
          rho: 0.8
      - id: p3
        values:
          t: 25
          fmin: 120
          ff: 50
          rho: 0.78
    explanation: >-
      The fuel needed at the check point is the minimum fuel at the re-join
      point plus the fuel burned in between. Fuel flow is in kg/h while the
      quantities are in litres, so the mass must be converted with the density.


      **Solution**


      Minimum fuel at TUSKA = {{fmin}} x {{rho}} = {{= fmin * rho}} kg


      Fuel burned until TUSKA = {{ff}} x {{t}} / 60 = {{= ff * t / 60}} kg


      Total = {{= fmin * rho + ff * t / 60}} kg, which is {{= fmin * rho + ff *
      t / 60}} / {{rho}} = **{{answer}} litres**


      **Why the other answers are wrong**


      - **{{d1}} litres**: the burned fuel in kg was added directly to litres
      without converting with the density.

      - **{{d2}} litres**: the fuel to be burned was subtracted instead of
      added.

      - **{{d3}} litres**: the burned fuel was converted from kg to litres in
      the wrong direction (multiplied by the density).
- id: QXDZWAVC
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332432
    - ATPLGS-122990
    - AVEXAM-31325
    - ATPLGS-628080
  annexes: []
  learningObjectives:
    - 033.06.01.01.06
  template:
    type: calculation
    question: |-
      Assuming conditions stay the same, determine the ETA at DELTA, given:

      - BETA to GAMMA distance: {{d1}} NM
      - Actual time en route BETA to GAMMA: {{t1}} min
      - Actual time of arrival at GAMMA: 12:{{tg}} UTC
      - GAMMA to DELTA distance: {{d2}} NM

      Give the ETA as minutes past 12:00 UTC (i.e. 12:XX UTC, answer = XX).
    variables:
      - id: d1
        label: BETA-GAMMA distance
        unit: NM
      - id: t1
        label: Actual time BETA-GAMMA
        unit: min
      - id: tg
        label: ATA at GAMMA (minutes past 12:00)
        unit: min
      - id: d2
        label: GAMMA-DELTA distance
        unit: NM
    answer:
      formula: tg + d2 / (d1 / t1)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: tg + d1 / d2 * t1
      - id: d2
        formula: tg + d2
      - id: d3
        formula: tg + t1
      - id: d4
        formula: tg + d2 / (d1 / t1) + 10
    presets:
      - id: p1
        values:
          d1: 60
          t1: 30
          tg: 40
          d2: 34
      - id: p2
        values:
          d1: 90
          t1: 36
          tg: 20
          d2: 50
      - id: p3
        values:
          d1: 72
          t1: 24
          tg: 15
          d2: 60
    explanation: >-
      The actual ground speed on the previous leg is used to predict the time on
      the next leg, assuming conditions stay the same. The ETA is the time of
      arrival at the previous point plus the next leg distance divided by that
      ground speed.


      **Solution**


      Ground speed = {{= d1}} NM / {{= t1}} min = {{= d1 / t1 * 60}} kt


      Time GAMMA to DELTA: {{f: d2 / (d1 / t1)}} = {{n: d2 / (d1 / t1)}} = {{=
      d2 / (d1 / t1)}} min


      ETA = 12:{{tg}} + {{= d2 / (d1 / t1)}} min = 12:**{{answer}}** UTC
      (minutes past 12:00 shown)


      **Why the other answers are wrong**


      - **{{d1}} min past 12**: the leg distances are inverted (ratio used
      upside down).

      - **{{d2}} min past 12**: the leg distance in NM was added directly as
      minutes.

      - **{{d3}} min past 12**: the time of the previous leg was simply repeated
      for the next leg.

      - **{{d4}} min past 12**: a 10 minute error was added to the correct
      result.
- id: QXIM3XZ0R
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336806
    - ATPLGS-123124
    - ATPLGS-123123
    - AVEXAM-48457
    - BGS-331152
    - ATPLQ-334264
    - AVEXAM-30674
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: |-
      Refer to the table.

      Given the following information, what will be the Estimated Time of
      Overflight (ETO) and estimated remaining fuel at waypoint C?

      | Waypoint | Distance (NM) | ETO | ATO | Estimated fuel (lb) | Actual fuel (lb) |
      | --- | --- | --- | --- | --- | --- |
      | Departure | | | {{= floor(tdep / 60) * 100 + tdep - floor(tdep / 60) * 60}} | | {{f0}} |
      | B | {{dab}} | {{= floor(tb / 60) * 100 + tb - floor(tb / 60) * 60}} | {{= floor(tb / 60) * 100 + tb - floor(tb / 60) * 60}} | {{fe}} | {{fa}} |
      | C | {{dbc}} | ? | | ? | |
    variables:
      - id: tdep
        label: Departure ATO
        unit: min
      - id: tb
        label: ETO and ATO at B
        unit: min
      - id: dab
        label: Distance Departure to B
        unit: NM
      - id: dbc
        label: Distance B to C
        unit: NM
      - id: f0
        label: Actual fuel at departure
        unit: lb
      - id: fe
        label: Estimated fuel at B
        unit: lb
      - id: fa
        label: Actual fuel at B
        unit: lb
    answer:
      formula: tb + dbc * (tb - tdep) / dab
      unit: min
      decimals: 0
      format: hh:mm
      optionText: ETO {first}, and estimated remaining fuel {second}.
      second:
        formula: fa - dbc * (f0 - fa) / dab
        unit: lb
        decimals: 0
    distractors:
      - id: d1
        formula: tb + dbc * (tb - tdep) / dab
        second: fe - dbc * (f0 - fe) / dab
      - id: d2
        formula: tb + (tb - tdep)
      - id: d3
        formula: tb + (tb - tdep)
        second: fe - dbc * (f0 - fe) / dab
      - id: d4
        formula: tb + dbc * (tb - tdep) / dab + 5
        second: fa - (f0 - fa)
    presets:
      - id: p1
        values:
          tdep: 870
          tb: 910
          dab: 200
          dbc: 150
          f0: 3000
          fe: 2400
          fa: 2300
      - id: p2
        values:
          tdep: 600
          tb: 640
          dab: 160
          dbc: 120
          f0: 2800
          fe: 2300
          fa: 2200
    explanation: |-
      The time and fuel rates of the leg already flown are extended to the
      next leg, using the actual figures.

      **Solution**

      Time rate = {{= tb - tdep}} min / {{dab}} NM, applied to
      {{dbc}} NM, added to the time at B.

      Fuel burn rate = ({{f0}} - {{fa}}) lb / {{dab}} NM, applied to
      {{dbc}} NM, subtracted from the actual fuel at B.

      ETO at C = **{{answer}}**

      **Why the other answers are wrong**

      - Fuel burn taken from the estimated column instead of the actual one.

      - Time of the whole previous leg repeated for the next leg.

      - A combination of both errors.

      - A 5 minute error on the time and the whole previous leg's fuel burn
      repeated.
