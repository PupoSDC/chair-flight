- id: Q8PVLQJFS
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332185
    - AVEXAM-12199
    - BGS-331010
    - ATPLGS-625267
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      On a cross country flight from A to B, an aircraft has been consistently
      {{angle}}° off course since leaving A.


      The distance between A and B is {{dist}} NM.


      After {{dist}} NM, how far will the aircraft have deviated from the
      planned course, if this error remains uncorrected? (Answer in NM, using
      the 1-in-60 rule.)
    variables:
      - id: angle
        label: Off-course angle
        unit: °
      - id: dist
        label: Distance flown
        unit: NM
    answer:
      formula: angle * dist / 60
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: dist * sin(angle)
      - id: d2
        formula: dist / (angle * 30)
      - id: d3
        formula: angle * dist / 100
      - id: d4
        formula: angle * dist / 45
      - id: d5
        formula: dist / angle
    presets:
      - id: p1
        values:
          angle: 2
          dist: 90
      - id: p2
        values:
          angle: 3
          dist: 120
      - id: p3
        values:
          angle: 1.5
          dist: 80
    explanation: >-
      According to the 1-in-60 rule, an error of 1° produces a lateral deviation
      of 1 NM for every 60 NM flown. The deviation is therefore the error angle
      times the distance divided by 60.


      **Solution**


      {{f: angle * dist / 60}} = {{n: angle * dist / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: exact trigonometric value dist x sin(angle); it is not
      the figure given by the 1-in-60 rule.

      - **{{d2}} NM**: inverted ratio with a wrong constant.

      - **{{d3}} NM**: the distance is divided by 100 instead of 60.

      - **{{d4}} NM**: the distance is divided by 45 instead of 60.

      - **{{d5}} NM**: the distance is divided by the angle instead of
      multiplied.
