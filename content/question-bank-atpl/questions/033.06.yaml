    - ATPLGS-625323
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      For a planned flight the calculated fuel is as listed below. How much fuel
      should be aboard to cover the rest of the flight, if the remaining flight
      time to destination is {{remaining}} min?


      - Trip fuel: sufficient for a planned flight time of {{planned}} min

      - Operator's specified reserve fuel: {{reserve}} % of the planned trip
      fuel

      - Start-up and taxi fuel: {{taxi}} kg

      - Block fuel: {{block}} kg


      Give the answer in kg.
    variables:
      - id: block
        label: Block fuel
        unit: kg
      - id: taxi
        label: Start-up and taxi fuel
        unit: kg
      - id: reserve
        label: Reserve fuel
        unit: "%"
      - id: planned
        label: Planned flight time
        unit: min
      - id: remaining
        label: Remaining flight time
        unit: min
    answer:
      formula: (block - taxi) / (1 + reserve / 100) * (remaining / planned + reserve /
        100)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: (block - taxi) / (1 + reserve / 100) * remaining / planned
      - id: d2
        formula: (block - taxi) * (remaining / planned + reserve / 100)
      - id: d3
        formula: block * (remaining / planned + reserve / 100)
      - id: d4
        formula: (block - taxi) / (1 - reserve / 100) * (remaining / planned + reserve /
          100)
    presets:
      - id: p1
        values:
          block: 735
          taxi: 35
          reserve: 30
          planned: 285
          remaining: 85
      - id: p2
        values:
          block: 1200
          taxi: 40
          reserve: 25
          planned: 300
          remaining: 120
    explanation: >-
      Block fuel = taxi fuel + planned trip fuel + reserve, and the reserve is a
      percentage of the planned trip fuel. The planned trip fuel is therefore
      (block - taxi) / (1 + reserve). The fuel for the rest of the flight is the
      planned trip fuel scaled by the ratio of remaining to planned time, plus
      the reserve.


      **Solution**


      Planned trip fuel = (block - taxi) / (1 + reserve) = {{= (block - taxi) /
      (1 + reserve / 100)}} kg


      Trip fuel for the rest of the flight = {{= (block - taxi) / (1 + reserve /
      100) * remaining / planned}} kg


      Reserve = {{= (block - taxi) / (1 + reserve / 100) * reserve / 100}} kg


      {{f: (block - taxi) / (1 + reserve / 100) * (remaining / planned + reserve
      / 100)}} = {{n: (block - taxi) / (1 + reserve / 100) * (remaining /
      planned + reserve / 100)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the rest-of-flight trip fuel only, forgetting the
      reserve.

      - **{{d2}} kg**: does not divide by (1 + reserve), so the block fuel is
      treated as if the reserve were not part of it.

      - **{{d3}} kg**: forgets to subtract the taxi fuel from the block fuel.

      - **{{d4}} kg**: uses (1 - reserve) instead of (1 + reserve) in the trip
      fuel.
- id: QQG24QWIL
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334463
    - AVEXAM-879
  annexes:
    - jeppesen-ad-eham-10-2b-02
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to AMSTERDAM - Chart 10-2B from Jeppesen GSPRM 2017.


      You are flying from the waypoint MOLIX to SUGOL (distance read from the
      chart: {{dist}} NM) with {{tas}} kt TAS, a headwind component of {{hw}} kt
      (from the 180°/25 kt wind) and a fuel flow of {{ff}} kg/h.


      Your actual fuel over MOLIX is {{fob}} kg.


      ATC asks you to hold over SUGOL for {{hold}} minutes.


      What is your fuel remaining after the holding?
    variables:
      - id: dist
        label: Leg distance from chart
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
      - id: ff
        label: Fuel flow
        unit: kg/h
      - id: fob
        label: Fuel over MOLIX
        unit: kg
      - id: hold
        label: Holding time
        unit: min
    chartInputs:
      - dist
    answer:
      formula: fob - ff * (dist / (tas - hw) + hold / 60)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fob - ff * dist / (tas - hw)
      - id: d2
        formula: fob - ff * hold / 60
      - id: d3
        formula: fob - ff * (dist / (tas + hw) + hold / 60)
      - id: d4
        formula: fob - ff * dist / (tas - hw) + ff * hold / 60
    presets:
      - id: p1
        values:
          dist: 35.6
          tas: 330
          hw: 25
          ff: 1800
          fob: 3000
          hold: 20
    explanation: >-
      Total fuel burned is the fuel flow times the en-route time (distance over
      ground speed) plus the holding time. The result is subtracted from the
      fuel over MOLIX.


      **Solution**


      En-route time: {{= dist / (tas - hw) * 60}} min


      {{f: fob - ff * (dist / (tas - hw) + hold / 60)}} = {{n: fob - ff * (dist
      / (tas - hw) + hold / 60)}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the holding fuel was forgotten.

      - **{{d2}} kg**: only the holding fuel was considered.

      - **{{d3}} kg**: headwind added to TAS instead of subtracted.

      - **{{d4}} kg**: holding fuel added instead of subtracted.
- id: QQMQFHJJB
  docId: "033.06"
  relatedQuestions:
    - QODEKMEOC
  externalIds:
    - ATPLQ-332393
    - AVEXAM-95825
    - AVEXAM-91303
    - AVEXAM-6851
    - ATPLGS-629295
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A pilot plans to fly from airport A to airport B, {{dtot}} NM away. After
      flying for {{t}} min covering {{dfl}} NM, the fuel remaining is {{frem}}
      lb plus reserves. Assuming conditions remain unchanged, what will be the
      remaining fuel at airport B (in lb, plus reserves)?


      - Average TAS: {{tas}} kt

      - Headwind component: {{hw}} kt

      - Trip fuel: {{trip}} lb

      - Planned average fuel flow: {{ffp}} lb/h
    variables:
      - id: dtot
        label: Total distance
        unit: NM
      - id: t
        label: Elapsed time
        unit: min
      - id: dfl
        label: Distance flown
        unit: NM
      - id: frem
        label: Fuel remaining
        unit: lb
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind
        unit: kt
      - id: trip
        label: Trip fuel
        unit: lb
      - id: ffp
        label: Planned fuel flow
        unit: lb/h
    answer:
      formula: frem - round((trip - frem) / (t / 60)) * (dtot - dfl) / (tas - hw)
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: frem - ffp * (dtot - dfl) / (tas - hw)
      - id: d2
        formula: trip - frem
      - id: d3
        formula: frem - round((trip - frem) / (t / 60)) * (dtot - dfl) / tas
      - id: d4
        formula: frem - round((trip - frem) / (t / 60)) * (dtot - dfl) / (tas + hw)
    presets:
      - id: p1
        values:
          dtot: 460
          t: 84
          dfl: 197
          frem: 765
          tas: 160
          hw: 20
          trip: 1051
          ffp: 320
      - id: p2
        values:
          dtot: 380
          t: 60
          dfl: 150
          frem: 700
          tas: 150
          hw: 20
          trip: 1000
          ffp: 280
      - id: p3
        values:
          dtot: 300
          t: 50
          dfl: 100
          frem: 900
          tas: 130
          hw: 10
          trip: 1220
          ffp: 450
    explanation: >-
      The actual fuel flow is the fuel used so far (trip fuel minus fuel
      remaining) divided by the elapsed time. The remaining time uses the ground
      speed (TAS minus headwind). Fuel at destination is the present fuel minus
      the burn for the remaining distance.


      **Solution**


      Actual fuel flow = ({{trip}} - {{frem}}) / ({{t}} / 60) = {{= round((trip
      - frem) / (t / 60))}} lb/h


      Remaining time = {{= dtot - dfl}} NM / {{= tas - hw}} kt = {{= (dtot -
      dfl) / (tas - hw)}} h


      Fuel at B = **{{answer}} lb** plus reserves


      **Why the other answers are wrong**


      - **{{d1}} lb**: the planned fuel flow was used instead of the actual one.

      - **{{d2}} lb**: this is only the fuel used so far.

      - **{{d3}} lb**: the wind was ignored in the remaining time.

      - **{{d4}} lb**: the headwind was added to the TAS.
