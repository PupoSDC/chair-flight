- id: QO0JMEY71
  docId: "033.06"
  relatedQuestions:
    - QRM74AOJS
  externalIds:
    - ATPLQ-335650
    - AVEXAM-40584
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Calculate the remaining fuel overhead NADIR for the multi-engine aircraft,
      given:


      - Fuel on board at TROUT: {{fob}} kg

      - Distance from TROUT to NADIR: {{dist}} NM

      - True airspeed (TAS): {{tas}} kt

      - Headwind (expected): {{hw}} kt

      - Fuel flow: {{ff}} kg/hr
    variables:
      - id: fob
        label: Fuel on board at TROUT
        unit: kg
      - id: dist
        label: Distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind
        unit: kt
      - id: ff
        label: Fuel flow
        unit: kg/h
    answer:
      formula: fob - ff * dist / (tas - hw)
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fob - ff * dist / tas
      - id: d2
        formula: fob - ff * dist / (tas + hw)
      - id: d3
        formula: fob - ff * dist / 60
      - id: d4
        formula: fob - ff * dist / (tas - hw) * 1.1
    presets:
      - id: p1
        values:
          fob: 1320
          dist: 49
          tas: 142
          hw: 10
          ff: 440
      - id: p2
        values:
          fob: 1500
          dist: 60
          tas: 150
          hw: 15
          ff: 420
    explanation: >-
      Ground speed is TAS minus the headwind. Flight time is distance divided by
      ground speed, and fuel burned is fuel flow times flight time.


      **Solution**


      Ground speed: {{= tas - hw}} kt


      {{f: fob - ff * dist / (tas - hw)}} = {{n: fob - ff * dist / (tas - hw)}}
      = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: wind ignored (ground speed = TAS).

      - **{{d2}} kg**: headwind added to TAS instead of subtracted.

      - **{{d3}} kg**: distance divided by 60 (treated as a speed of 60 kt).

      - **{{d4}} kg**: fuel burned increased by 10 %.
