- id: QSAFGVNJN
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-337479
    - AVEXAM-28022
  annexes:
    - 033-fuel-tank-layout-diagram-large-twin-aisle-aircraft
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. During the very early stages of flight, the trim tank
      pump becomes inoperative and there is no possibility to override it
      manually, so the trim tank fuel cannot be used. Given the following data,
      what is the fuel available for the remainder of the flight?


      - Trim tank: full ({{trim}} kg, from the figure)

      - Outer tanks: full (total {{outer}} kg, from the figure)

      - Inner tanks: {{inner}} kg each
    variables:
      - id: inner
        label: Fuel in each inner tank
        unit: kg
      - id: outer
        label: Outer tanks full (from figure)
        unit: kg
      - id: trim
        label: Trim tank full (from figure)
        unit: kg
    chartInputs:
      - outer
      - trim
    answer:
      formula: 2 * inner + outer
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * inner + trim
      - id: d2
        formula: 2 * inner
      - id: d3
        formula: 2 * inner + outer + trim
      - id: d4
        formula: inner + outer
    presets:
      - id: p1
        values:
          inner: 15000
          outer: 5730
          trim: 4891
      - id: p2
        values:
          inner: 12000
          outer: 5200
          trim: 4500
    explanation: >-
      Fuel that cannot be fed to the engines is not available. With the trim
      tank pump failed, the trim fuel is trapped; the usable fuel is the inner
      tanks plus the outer tanks (which transfer to the inner tanks).


      **Solution**


      {{f: 2 * inner + outer}} = {{n: 2 * inner + outer}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the trapped trim tank fuel is counted instead of the
      outer tanks.

      - **{{d2}} kg**: the outer tank fuel is ignored.

      - **{{d3}} kg**: the trapped trim tank fuel is counted as well.

      - **{{d4}} kg**: only one inner tank is counted.
