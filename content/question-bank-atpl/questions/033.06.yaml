  externalIds:
    - ATPLQ-334030
    - BGS-330561
    - AVEXAM-89492
    - ATPLGS-108286
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      An aircraft flies at a TAS of {{tas}} kt from A to B and back to A.


      Distance AB is {{dist}} NM.


      Going from A to B it experiences a headwind component of {{hw}} kt.


      The wind remains constant.


      The duration of the whole flight is expressed in hours and minutes; give
      the minutes part (0 to 59) after the full hours.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: dist
        label: Distance AB
        unit: NM
      - id: hw
        label: Headwind component A-B
        unit: kt
    answer:
      formula: round((dist / (tas - hw) * 60 + dist / (tas + hw) * 60)) - 60 *
        floor(round((dist / (tas - hw) * 60 + dist / (tas + hw) * 60)) / 60)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: round((2 * dist / tas * 60)) - 60 * floor(round((2 * dist / tas * 60))
          / 60)
      - id: d2
        formula: round((2 * dist / (tas - hw) * 60)) - 60 * floor(round((2 * dist / (tas
          - hw) * 60)) / 60)
      - id: d3
        formula: round((2 * dist / (tas + hw) * 60)) - 60 * floor(round((2 * dist / (tas
          + hw) * 60)) / 60)
      - id: d4
        formula: round((dist / (tas - hw) * 60)) - 60 * floor(round((dist / (tas - hw) *
          60)) / 60)
    presets:
      - id: p1
        values:
          tas: 380
          dist: 480
          hw: 60
      - id: p2
        values:
          tas: 420
          dist: 600
          hw: 50
      - id: p3
        values:
          tas: 250
          dist: 300
          hw: 40
    explanation: >-
      On the outbound leg the wind is a headwind (ground speed = TAS - wind); on
      the return leg it is a tailwind (ground speed = TAS + wind). The total
      time is the sum of the two leg times.


      **Solution**


      Out: {{= dist / (tas - hw) * 60}} min, back: {{= dist / (tas + hw) * 60}}
      min


      Total = {{= round((dist / (tas - hw) * 60 + dist / (tas + hw) * 60))}} min
      = {{= floor(round((dist / (tas - hw) * 60 + dist / (tas + hw) * 60)) /
      60)}} h **{{answer}} min**


      **Why the other answers are wrong** (minutes part of the flight time)


      - **{{d1}} min**: the wind was ignored.

      - **{{d2}} min**: the headwind was applied on both legs.

      - **{{d3}} min**: the tailwind was applied on both legs.

      - **{{d4}} min**: only the outbound leg was counted.
- id: QU6ZDJPSO
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336000
    - BGS-331154
  annexes:
    - 031-usable-fuel-diagram-and-table
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. During a flight, a fault message appears stating that the
      valves allowing fuel to be transferred from the left outer wing tank to
      the left inner wing tank are stuck in the closed position. These valves
      can NOT be opened manually.


      Given the following information, determine the fuel available for the
      remainder of the flight:


      - Left and right inner tanks: {{inner}} kg each

      - Left and right outer tanks: full, {{outer}} kg each (read from the
      figure)

      - Centre tank: empty


      All other technical aspects of the fuel system operate normally. Do NOT
      consider fuel imbalance restrictions for this scenario.


      What is the fuel available for the remainder of the flight?
    variables:
      - id: inner
        label: Inner tank fuel
        unit: kg
      - id: outer
        label: Outer tank capacity (read from figure)
        unit: kg
    chartInputs:
      - outer
    answer:
      formula: 2 * inner + outer
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: 2 * inner
      - id: d2
        formula: inner + outer
      - id: d3
        formula: 2 * (inner + outer)
      - id: d4
        formula: 2 * inner - outer
    presets:
      - id: p1
        values:
          inner: 3000
          outer: 691
      - id: p2
        values:
          inner: 2500
          outer: 820
    explanation: >-
      Fuel can only be used if it can reach the engines. The left outer tank is
      cut off from the left inner tank, so its fuel is trapped and cannot be
      used. The usable fuel is the left inner tank, the right inner tank and the
      right outer tank. The centre tank is empty.


      **Solution**


      - Usable fuel: {{f: 2 * inner + outer}} = {{n: 2 * inner + outer}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: leaves out the right outer tank, which is usable.

      - **{{d2}} kg**: counts only one inner tank.

      - **{{d3}} kg**: counts the trapped left outer tank as usable.

      - **{{d4}} kg**: subtracts the outer tank instead of adding it.
- id: QUCP4JTHO
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339820
    - ATPLGS-629462
    - AVEXAM-81540
    - AVEXAM-60039
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Calculate the estimated total fuel used from Beta to Delta. The fuel
      remaining at each waypoint was:


      - Alpha: {{fa}} gallons (reference time)

      - Beta: {{fb}} gallons, {{tab}} min after Alpha

      - Charlie: {{fc}} gallons, {{tbc}} min after Beta

      - Delta: ? gallons, {{tcd}} min after Charlie
    variables:
      - id: fa
        label: Fuel at Alpha
        unit: gallons
      - id: fb
        label: Fuel at Beta
        unit: gallons
      - id: fc
        label: Fuel at Charlie
        unit: gallons
      - id: tab
        label: Time Alpha to Beta
        unit: min
      - id: tbc
        label: Time Beta to Charlie
        unit: min
      - id: tcd
        label: Time Charlie to Delta
        unit: min
    answer:
      formula: (fb - fc) / tbc * (tbc + tcd)
      unit: gallons
      decimals: 0
    distractors:
      - id: d1
        formula: round((fb - fc) / tbc * 1000) / 1000 * tcd
      - id: d2
        formula: (fa - fb) + (fb - fc) / tbc * tcd
      - id: d3
        formula: (fa - fc) / (tab + tbc) * (tab + tbc + tcd)
      - id: d4
        formula: fa - fc
    presets:
      - id: p1
        values:
          fa: 52.4
          fb: 48.7
          fc: 46.3
          tab: 10
          tbc: 18
          tcd: 50
      - id: p2
        values:
          fa: 60.2
          fb: 55.1
          fc: 51.3
          tab: 12
          tbc: 20
          tcd: 45
      - id: p3
        values:
          fa: 41.5
          fb: 38.9
          fc: 36
          tab: 8
          tbc: 15
          tcd: 40
    explanation: >-
      The fuel flow is assumed constant and is derived from the last interval
      for which both fuel quantities and times are known. The fuel used over the
      elapsed time from Beta to Delta is then the fuel flow multiplied by that
      time.


      **Solution**


      Fuel flow Beta to Charlie: {{f: (fb - fc) / tbc}} = {{n: (fb - fc) / tbc}}
      = {{= (fb - fc) / tbc}} gallons/min


      Time Beta to Delta: {{tbc}} + {{tcd}} = {{= tbc + tcd}} min


      {{f: (fb - fc) / tbc * (tbc + tcd)}} = {{n: (fb - fc) / tbc * (tbc +
      tcd)}} = **{{answer}} gallons**


      **Why the other answers are wrong**


      - **{{d1}} gallons**: only the fuel used from Charlie to Delta; the
      interval Beta to Charlie is left out.

      - **{{d2}} gallons**: the fuel actually burnt between Alpha and Beta is
      added to the Charlie-Delta estimate, mixing different intervals.

      - **{{d3}} gallons**: the fuel flow is taken over the interval Alpha to
      Charlie and applied to the whole time Alpha to Delta, which is the fuel
      used from Alpha, not from Beta.

      - **{{d4}} gallons**: the actual fuel used from Alpha to Charlie, not the
      estimate to Delta.
