        unit: lb
    answer:
      formula: dom + load + fuel - trip
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: dom + load + trip
      - id: d2
        formula: dom + load + fuel - trip - res
      - id: d3
        formula: dom + load + fuel - trip + alt + res
    presets:
      - id: p1
        values:
          dom: 9825
          load: 2950
          fuel: 1950
          trip: 900
          alt: 475
          res: 400
      - id: p2
        values:
          dom: 9950
          load: 3450
          fuel: 2500
          trip: 1200
          alt: 525
          res: 415
      - id: p3
        values:
          dom: 9900
          load: 3160
          fuel: 2100
          trip: 800
          alt: 485
          res: 420
    explanation: >-
      The landing mass is the mass the aeroplane has when it arrives: the dry
      operating mass plus the traffic load plus the fuel that is still on board
      at landing. The fuel still on board at landing is the remaining usable
      fuel minus the remaining trip fuel to the destination. Alternate and final
      reserve fuel are part of the remaining usable fuel and are not burned on
      the way to the destination, so they are not subtracted.


      **Solution**


      Fuel at landing = {{= fuel - trip}} lb


      {{f: dom + load + fuel - trip}} = {{n: dom + load + fuel - trip}} =
      **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: the trip fuel was added instead of subtracted, so the
      fuel burned is counted as fuel on board.

      - **{{d2}} lb**: the final reserve fuel was subtracted as well, although
      it stays in the tanks at landing.

      - **{{d3}} lb**: alternate and final reserve fuel were added on top of the
      remaining usable fuel, although they are already included in it.
