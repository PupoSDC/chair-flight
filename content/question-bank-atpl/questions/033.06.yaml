- id: Q2AZ6SUKA
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336199
    - ATPLGS-629462
    - AVEXAM-81540
    - AVEXAM-60039
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Calculate the estimated total fuel used from Alpha to Delta. The fuel
      remaining at each waypoint was:


      - Alpha: {{fa}} gallons (reference time)

      - Beta: {{fb}} gallons, {{tab}} min after Alpha

      - Charlie: {{fc}} gallons, {{tbc}} min after Beta

      - Delta: ? gallons, {{tcd}} min after Charlie
    variables:
      - id: fa
        label: Fuel at Alpha
        unit: gallons
      - id: fb
        label: Fuel at Beta
        unit: gallons
      - id: fc
        label: Fuel at Charlie
        unit: gallons
      - id: tab
        label: Time Alpha to Beta
        unit: min
      - id: tbc
        label: Time Beta to Charlie
        unit: min
      - id: tcd
        label: Time Charlie to Delta
        unit: min
    answer:
      formula: (fa - fc) / (tab + tbc) * (tab + tbc + tcd)
      unit: gallons
      decimals: 0
    distractors:
      - id: d1
        formula: (fa - fb) + (fb - fc) / tbc * tcd
      - id: d2
        formula: fa - (fa - fc) / (tab + tbc) * (tab + tbc + tcd)
      - id: d3
        formula: fa - fc
    presets:
      - id: p1
        values:
          fa: 52.4
          fb: 48.7
          fc: 46.3
          tab: 10
          tbc: 18
          tcd: 50
      - id: p2
        values:
          fa: 60.2
          fb: 55.1
          fc: 51.3
          tab: 12
          tbc: 20
          tcd: 45
      - id: p3
        values:
          fa: 41.5
          fb: 38.9
          fc: 36
          tab: 8
          tbc: 15
          tcd: 40
    explanation: >-
      Assuming an unchanged fuel flow, the fuel flow measured over the known
      interval (Alpha to Charlie) is extrapolated over the whole elapsed time
      from Alpha to Delta.


      **Solution**


      Fuel flow Alpha to Charlie: {{f: (fa - fc) / (tab + tbc)}} = {{n: (fa -
      fc) / (tab + tbc)}} = {{= (fa - fc) / (tab + tbc)}} gallons/min


      Time Alpha to Delta: {{tab}} + {{tbc}} + {{tcd}} = {{= tab + tbc + tcd}}
      min


      {{f: (fa - fc) / (tab + tbc) * (tab + tbc + tcd)}} = {{n: (fa - fc) / (tab
      + tbc) * (tab + tbc + tcd)}} = **{{answer}} gallons**


      **Why the other answers are wrong**


      - **{{d1}} gallons**: the measured fuel Alpha to Beta is added to an
      estimate for Charlie to Delta only, with the flow of the Beta-Charlie leg.

      - **{{d2}} gallons**: this is the fuel remaining at Delta, not the fuel
      used.

      - **{{d3}} gallons**: the fuel actually used from Alpha to Charlie; the
      leg to Delta is not included.
- id: Q2V9WUE0C
  docId: "033.06"
  relatedQuestions:
    - QYVWHA4HF
  externalIds:
    - ATPLQ-334982
    - AVEXAM-25387
    - BGS-330830
    - ATPLGS-129421
    - AVEXAM-18562
    - ATPLGS-627354
    - BGS-330831
    - BGS-330832
    - ATPLGS-129276
    - ATPLGS-129424
    - ATPLGS-129422
  annexes:
    - 033-fuel-tank-layout-diagram-large-twin-aisle-aircraft
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. An aeroplane uses its fuel by these rules: each engine
      always feeds from the inner tank on its side. The aft trim tank transfers
      all its content to the inner tanks when these hold less than 4 000 kg. The
      outer tanks transfer all their content to the inner tanks when the inner
      tanks hold less than 3 500 kg. The trim tank and outer tanks are full at
      the start.


      During the flight, the trim tank transfer pump fails when the total fuel
      on board is {{total_fuel}} kg. The fuel still in the trim tank at that
      moment (read from the figure) is {{trim_fuel}} kg. The fuel consumption is
      {{consumption}} kg/min.


      What is the remaining endurance?
    variables:
      - id: total_fuel
        label: Total fuel on board when the pump fails
        unit: kg
      - id: trim_fuel
        label: Fuel in trim tank (read from figure)
        unit: kg
      - id: consumption
        label: Fuel consumption
        unit: kg/min
    chartInputs:
      - trim_fuel
    answer:
      formula: round((total_fuel - trim_fuel) / consumption)
      unit: minutes
      decimals: 0
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: round(total_fuel / consumption)
      - id: d2
        formula: round((total_fuel - trim_fuel) / (consumption * 0.9))
      - id: d3
        formula: round((total_fuel - 2 * trim_fuel) / consumption)
      - id: d4
        formula: round((total_fuel + trim_fuel) / consumption)
    presets:
      - id: p1
        values:
          total_fuel: 18590
          trim_fuel: 4910
          consumption: 95
    explanation: >-
      Fuel in the trim tank cannot be transferred once its pump has failed, so
      it is not usable. The remaining endurance is the usable fuel divided by
      the fuel consumption, converted into hours and minutes.


      **Solution**


      - Usable fuel: {{f: total_fuel - trim_fuel}} = {{n: total_fuel -
      trim_fuel}} kg

      - Endurance: {{f: (total_fuel - trim_fuel) / consumption}} = {{n:
      (total_fuel - trim_fuel) / consumption}} minutes = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: counts the fuel in the trim tank as usable.

      - **{{d2}}**: divides by a consumption 10 % lower than the given value.

      - **{{d3}}**: removes the trim tank fuel twice.

      - **{{d4}}**: adds the trim tank fuel instead of removing it.
- id: Q4FRL1U3O
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335110
    - BGS-330198
    - AVEXAM-84886
    - ATPLGS-625310
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: chart
    question: >-
      The fuel plan gives a total trip fuel of 65 US gallons.


      At the half way point, fuel consumption is 40 US gallons.


      Given the following information, and assuming that fuel consumption does
      not change, which statement is correct?


      Alternate fuel, including final reserve fuel: 17 US gallons Contingency
      fuel: 5% of trip fuel Usable fuel at departure: 93 US gallons
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: The remaining fuel is not sufficient to reach the destination with
          reserves intact.
        wrongAnswers:
          - At departure the reserve fuel was 28 US gallons.
          - At the destination there will still be 30 US gallons in the tanks.
          - At the destination the required reserves remain intact.
        explanation: >-
          Half way used 40 gal, so the whole trip needs 2 × 40 = 80 gal rather
          than the planned 65 gal.


          Arriving with 93 − 80 = 13 gal. The reserves must cover the alternate
          and final reserve (17 gal) plus 5 % contingency of 65 gal (3.25 gal),
          which is 20.25 gal. 13 gal is less than that, so the remaining fuel is
          **not sufficient** to reach the destination with the reserves intact.
- id: Q4VQQMPWG
  docId: "033.06"
  relatedQuestions:
    - QZOIYREP
  externalIds:
    - ATPLQ-336318
    - AVEXAM-29786
    - BGS-330589
    - BGS-330171
    - ATPLQ-331779
    - BGS-331388
    - AVEXAM-84853
    - ATPLGS-626620
    - AVEXAM-30993
  annexes: []
  learningObjectives:
    - 033.02.01.07.05
    - "033.06"
  template:
    type: calculation
    question: |-
      Determine the true airspeed (TAS) in knots, given the following data:

      - Mach number: M 0.{{mach_h}}
      - OAT: {{oat}} °C
    variables:
      - id: mach_h
        label: Mach number (x 100)
        unit: ""
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: mach_h / 100 * 38.97 * sqrt(273.15 + oat)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach_h / 100 * 38.97 * sqrt(273.15 - oat)
      - id: d2
        formula: 38.97 * sqrt(273.15 + oat)
      - id: d3
        formula: mach_h / 100 * 38.97 * sqrt(273.15 + oat) * 1.852
      - id: d4
        formula: mach_h / 100 * 38.97 * (273.15 + oat)
    presets:
      - id: p1
        values:
          mach_h: 74
          oat: -47
      - id: p2
        values:
          mach_h: 82
          oat: -40
      - id: p3
        values:
          mach_h: 78
          oat: -55
    explanation: >-
      The true airspeed is the Mach number multiplied by the local speed of
      sound. The speed of sound depends only on the air temperature, expressed
      in kelvin, so the wind and the flight level do not enter the calculation.


      **Solution**


      {{f: mach_h / 100 * 38.97 * sqrt(273.15 + oat)}} = {{n: mach_h / 100 *
      38.97 * sqrt(273.15 + oat)}} = **{{answer}} kt**


      **Why the other answers are wrong**

      - **{{d1}} kt**: uses the negative of the temperature in the
      speed-of-sound formula (sign error).

      - **{{d2}} kt**: gives the speed of sound alone and forgets to multiply by
      the Mach number.

      - **{{d3}} kt**: multiplies by 1.852 as if converting to km/h (unit
      mistake).

      - **{{d4}} kt**: omits the square root in the speed-of-sound formula.
