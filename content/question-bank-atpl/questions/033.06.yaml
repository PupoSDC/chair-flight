- id: QXPRQRGKI
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335690
    - ATPLGS-123082
    - ATPLGS-108269
    - ATPLGS-123083
    - AVEXAM-80551
    - AVEXAM-13567
    - BGS-330566
    - BGS-330067
    - BGS-330006
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A flight planning chart for an aeroplane states that the time to reach the
      cruising level at a given gross mass is {{t}} minutes and the distance
      travelled is {{d0}} NM (no wind).


      What will be the distance travelled with an average head wind component of
      {{hw}} kt? Answer in NM.
    variables:
      - id: d0
        label: Still air distance
        unit: NM
      - id: t
        label: Climb time
        unit: min
      - id: hw
        label: Head wind component
        unit: kt
    answer:
      formula: (d0 / t * 60 - hw) * t / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (d0 / t * 60 + hw) * t / 60
      - id: d2
        formula: d0 - hw
      - id: d3
        formula: d0 / t * 60 - hw
      - id: d4
        formula: d0 - hw * t / 100
      - id: d5
        formula: d0 + hw
    presets:
      - id: p1
        values:
          d0: 66
          t: 22
          hw: 35
      - id: p2
        values:
          d0: 85
          t: 20
          hw: 30
      - id: p3
        values:
          d0: 120
          t: 30
          hw: 40
    explanation: >-
      The chart distance is a still-air distance, so it corresponds to the
      average TAS. A head wind reduces the groundspeed, and the distance covered
      over ground in the same climb time is lower.


      **Solution**


      Average still-air speed = {{d0}} NM / {{t}} min × 60 = {{= d0 / t * 60}}
      kt


      Ground speed = {{= d0 / t * 60}} kt - {{hw}} kt = {{= d0 / t * 60 - hw}}
      kt


      {{f: (d0 / t * 60 - hw) * t / 60}} = {{n: (d0 / t * 60 - hw) * t / 60}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the wind was added (tail wind) instead of subtracted.

      - **{{d2}} NM**: the head wind speed in kt was subtracted directly from
      the distance in NM.

      - **{{d3}} NM**: this is the groundspeed in kt, not a distance.

      - **{{d4}} NM**: wind effect scaled with a wrong factor.

      - **{{d5}} NM**: the wind speed was added directly to the distance.
- id: QYKEQC3NO
  docId: "033.06"
  relatedQuestions:
    - QUXPAUJ0X
  externalIds:
    - ATPLQ-339503
    - BGS-331303
    - AVEXAM-49487
    - ATPLGS-629439
    - ATPLGS-629419
    - ATPLQ-333494
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      A pilot plans a flight from aerodrome A to aerodrome B.


      The distance A to B is {{dist}} NM on a true track of {{tc}}°.


      The planned TAS is {{tas}} kt and the forecast wind is {{wd}}°/{{ws}} kt.


      What is the planned flight time from A to B, in whole minutes (rounded
      down)?
    variables:
      - id: dist
        label: Distance A-B
        unit: NM
      - id: tc
        label: True track
        unit: deg
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: deg
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: floor(dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd -
        tc)) * 60)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: floor(dist / tas * 60)
      - id: d2
        formula: floor(dist / (tas - ws) * 60)
      - id: d3
        formula: floor(dist / (tas + ws) * 60)
      - id: d4
        formula: floor(dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) + ws * cos(wd -
          tc)) * 60)
    presets:
      - id: p1
        values:
          dist: 120
          tc: 90
          tas: 100
          wd: 300
          ws: 20
      - id: p2
        values:
          dist: 120
          tc: 90
          tas: 120
          wd: 330
          ws: 25
      - id: p3
        values:
          dist: 150
          tc: 180
          tas: 140
          wd: 240
          ws: 30
    explanation: >-
      The wind triangle gives the drift angle and the ground speed on the given
      track. The flight time is the distance divided by the ground speed.


      **Solution**


      Ground speed = {{= (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd
      - tc))}} kt


      {{f: dist / (tas * cos(asin(ws * sin(wd - tc) / tas)) - ws * cos(wd - tc))
      * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the wind was ignored.

      - **{{d2}} min**: the whole wind speed was treated as headwind.

      - **{{d3}} min**: the whole wind speed was treated as tailwind.

      - **{{d4}} min**: the wind component was applied with the wrong sign (wind
      direction reversed).
- id: QYVDUZPO
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331520
  annexes:
    - 033-flight-log-excerpt-01
  learningObjectives:
    - 033.06.01.01.04
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. If the actual time overhead waypoint 5 was {{t0}}
      UTC, determine the ETA at waypoint 7 (answer as hhmm UTC).


      The planned time from waypoint 5 to waypoint 7 read from the figure is
      {{leg}} min.
    variables:
      - id: t0
        label: Actual time overhead waypoint 5
        unit: hhmm UTC
      - id: leg
        label: Planned time waypoint 5 to 7 (from figure)
        unit: min
    chartInputs:
      - leg
    answer:
      formula: t0 + leg
      unit: UTC (hhmm)
      decimals: 0
    distractors:
      - id: d1
        formula: t0 + leg - 2
      - id: d2
        formula: t0 + leg - 6
      - id: d3
        formula: t0 + leg - 3
      - id: d4
        formula: t0 + leg + 3
    presets:
      - id: p1
        values:
          t0: 1240
          leg: 15
      - id: p2
        values:
          t0: 1015
          leg: 22
      - id: p3
        values:
          t0: 1405
          leg: 28
    explanation: >-
      With a time overhead a known waypoint, later ETAs are found by adding the
      planned leg times (read from the flight plan figure) to the actual time at
      that waypoint.


      **Solution**


      {{f: t0 + leg}} = {{n: t0 + leg}} = **{{answer}} UTC**


      **Why the other answers are wrong**


      - **{{d1}} UTC**: the leg time was misread (too short) in the figure.

      - **{{d2}} UTC**: legs were misread, giving a time that is too early.

      - **{{d3}} UTC**: a leg was misread as a shorter time.

      - **{{d4}} UTC**: the leg time was misread as too long.
- id: QYVWHA4HF
  docId: "033.06"
  relatedQuestions:
    - Q2V9WUE0C
  externalIds:
    - ATPLQ-337790
    - AVEXAM-25387
    - BGS-330830
    - ATPLGS-129421
    - AVEXAM-18562
    - ATPLGS-627354
    - ATPLGS-129276
    - ATPLGS-129424
    - ATPLGS-129277
    - ATPLGS-129422
  annexes:
    - 033-fuel-tank-layout-diagram-large-twin-aisle-aircraft
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. The engines always feed from their own inner tank (left
      engine from the left inner tank, right engine from the right inner tank).
      During flight, when the total fuel quantity reaches 12 730 kg, the left
      hand transfer valve between the left outer and inner tanks fails to open.


      - Fuel in the right inner tank at that moment (read from the figure):
      {{right_inner_fuel}} kg

      - Fuel flow of each engine: {{flow_per_engine}} kg/h


      What is the remaining endurance for the right engine?
    variables:
      - id: right_inner_fuel
        label: Fuel in right inner tank (read from figure)
        unit: kg
      - id: flow_per_engine
        label: Fuel flow of each engine
        unit: kg/h
    chartInputs:
      - right_inner_fuel
    answer:
      formula: round(right_inner_fuel / flow_per_engine * 60)
      unit: minutes
      decimals: 0
      format: h'H' mm
    distractors:
      - id: d1
        formula: round(2 * right_inner_fuel / flow_per_engine * 60)
      - id: d2
        formula: round(right_inner_fuel / (2 * flow_per_engine) * 60)
      - id: d3
        formula: round(right_inner_fuel / flow_per_engine * 60) + 10
      - id: d4
        formula: round(right_inner_fuel / flow_per_engine * 60) + 30
    presets:
      - id: p1
        values:
          right_inner_fuel: 6323
          flow_per_engine: 5420
    explanation: >-
      The right engine only uses fuel from the right inner tank, so its
      endurance is the fuel in that tank divided by the engine's fuel flow. The
      fuel flow is given in kilograms per hour, so the result is converted into
      minutes.


      **Solution**


      {{f: right_inner_fuel / flow_per_engine * 60}} = {{n: right_inner_fuel /
      flow_per_engine * 60}} minutes = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: doubles the fuel in the right inner tank, as if both inner
      tanks fed the right engine.

      - **{{d2}}**: halves the fuel flow, which doubles the result wrongly.

      - **{{d3}}**: adds 10 minutes to the correct result.

      - **{{d4}}**: adds 30 minutes to the correct result.
- id: QZFXHYLJ
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335347
    - BGS-330986
    - ATPLGS-625235
    - BGS-330972
    - AVEXAM-69043
    - ATPLGS-625232
    - AVEXAM-24553
    - BGS-331454
  annexes: []
  learningObjectives:
    - 033.06.01.02.06
  template:
    type: calculation
    question: >-
      Calculate the change in planned Trip Fuel with updated forecast
      meteorological conditions. By how many kg is the Trip Fuel reduced? (Give
      a positive number.)


      - Trip distance: {{dist}} NGM

      - Planned average trip TAS: {{tas}} kt

      - Planned average Trip Fuel consumption: {{fpn}} kg/NAM

      - Change in OAT: {{dt}}° C higher

      - Change in wind component: increase from +{{w1}} kt to +{{w2}} kt


      Effect on TAS: 2 kt increase for every 5° C increase in OAT

      Effect on Trip Fuel: 0.5% increase for every 10° C increase in OAT
    variables:
      - id: dist
        label: Trip distance
        unit: NGM
      - id: tas
        label: Planned TAS
        unit: kt
      - id: fpn
        label: Fuel per NAM
        unit: kg/NAM
      - id: dt
        label: OAT increase
        unit: °C
      - id: w1
        label: Planned wind component
        unit: kt
      - id: w2
        label: Updated wind component
        unit: kt
    answer:
      formula: dist * tas / (tas + w1) * fpn - dist * (tas + 2 * dt / 5) / (tas + 2 *
        dt / 5 + w2) * fpn * (1 + 0.005 * dt / 10)
      unit: kg
      decimals: 1
    distractors:
      - id: d1
        formula: dist * tas / (tas + w1) * fpn - dist * (tas + 2 * dt / 5) / (tas + 2 *
          dt / 5 + w2) * fpn
      - id: d2
        formula: dist * tas / (tas + w1) * fpn - dist * tas / (tas + w2) * fpn * (1 +
          0.005 * dt / 10)
      - id: d3
        formula: dist * tas / (tas + w1) * fpn - dist * tas / (tas + w2) * fpn
      - id: d4
        formula: dist * tas / (tas + w1) * fpn - dist * (tas + 4 * dt / 5) / (tas + 4 *
          dt / 5 + w2) * fpn * (1 + 0.005 * dt / 10)
    presets:
      - id: p1
        values:
          dist: 150
          tas: 120
          fpn: 3
          dt: 10
          w1: 5
          w2: 10
      - id: p2
        values:
          dist: 200
          tas: 140
          fpn: 4
          dt: 20
          w1: 10
          w2: 20
      - id: p3
        values:
          dist: 300
          tas: 250
          fpn: 6
          dt: 10
          w1: -10
          w2: 10
    explanation: >-
      Trip fuel = air distance (NAM) * fuel per NAM, where air distance = ground
      distance * TAS / ground speed and ground speed = TAS + wind component. The
      warmer OAT raises the TAS and the fuel consumption per NAM, and the larger
      tailwind raises the ground speed.


      **Solution**


      Planned: air distance = {{= dist * tas / (tas + w1)}} NAM, trip fuel = {{=
      dist * tas / (tas + w1) * fpn}} kg

      Updated: TAS = {{= tas + 2 * dt / 5}} kt, ground speed = {{= tas + 2 * dt
      / 5 + w2}} kt, air distance = {{= dist * (tas + 2 * dt / 5) / (tas + 2 *
      dt / 5 + w2)}} NAM

      Fuel per NAM = {{= fpn * (1 + 0.005 * dt / 10)}} kg/NAM, trip fuel = {{=
      dist * (tas + 2 * dt / 5) / (tas + 2 * dt / 5 + w2) * fpn * (1 + 0.005 *
      dt / 10)}} kg


      Change = **{{answer}} kg less**


      **Why the other answers are wrong**


      - **{{d1}} kg**: ignores the increase in fuel consumption per NAM due to
      OAT.

      - **{{d2}} kg**: ignores the TAS increase due to OAT.

      - **{{d3}} kg**: considers only the wind change and ignores both OAT
      effects.

      - **{{d4}} kg**: applies the TAS increase twice.
- id: QZHRHLNIC
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338769
    - BGS-331135
    - BGS-331208
    - AVEXAM-34903
  annexes:
    - 033-fuel-penalty-factors-text-and-table
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. An aeroplane experiences a hydraulic system failure
      during the flight. Following the emergency procedure in the AFM, the
      pilots first check the slats. The two spoiler panels on each wing are in
      an unknown state of extension.


      - Fuel on board: {{fuel}} kg

      - Average fuel flow calculated by the FMS: {{fuel_flow}} kg/h

      - Final reserve fuel: {{reserve}} kg

      - Fuel flow correction factor for this condition (read from figure):
      {{fuel_factor}}


      What is the endurance of the aeroplane? Give the answer in hours and
      minutes.
    variables:
      - id: fuel
        label: Fuel on board
        unit: kg
      - id: fuel_flow
        label: Average fuel flow calculated by the FMS
        unit: kg/h
      - id: reserve
        label: Final reserve fuel
        unit: kg
      - id: fuel_factor
        label: Fuel flow correction factor (read from figure)
        unit: ""
    chartInputs:
      - fuel_factor
    answer:
      formula: (fuel - reserve) / (fuel_flow * fuel_factor) * 60
      unit: minutes
      decimals: 0
      format: h 'hour' mm 'minutes'
    distractors:
      - id: d1
        formula: (fuel - reserve) / fuel_flow * 60
      - id: d2
        formula: fuel / (fuel_flow * fuel_factor) * 60
      - id: d3
        formula: fuel / fuel_flow * 60
      - id: d4
        formula: (fuel - reserve) * fuel_factor / fuel_flow * 60
    presets:
      - id: p1
        values:
          fuel: 4180
          fuel_flow: 2320
          reserve: 1100
          fuel_factor: 0.885
      - id: p2
        values:
          fuel: 3500
          fuel_flow: 2100
          reserve: 900
          fuel_factor: 0.9
    explanation: >-
      The endurance is the time the fuel on board lasts once the final reserve
      is set aside. Only the fuel above the final reserve can be burnt. With the
      spoiler positions unknown, the fuel flow calculated by the FMS is
      corrected with the factor read from the figure before the time is worked
      out.


      **Solution**


      - Fuel available for flight: {{n: fuel - reserve}} = {{= fuel - reserve}}
      kg

      - Corrected fuel flow: {{n: fuel_flow * fuel_factor}} = {{= fuel_flow *
      fuel_factor}} kg/h

      - Endurance: {{f: (fuel - reserve) / (fuel_flow * fuel_factor) * 60}} =
      {{n: (fuel - reserve) / (fuel_flow * fuel_factor) * 60}} minutes =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the FMS fuel flow without the correction from the
      figure.

      - **{{d2}}**: does not set aside the final reserve fuel.

      - **{{d3}}**: forgets both the final reserve fuel and the correction.

      - **{{d4}}**: applies the correction the wrong way round (multiplies
      instead of dividing).
- id: QZODFCQCR
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338649
    - BGS-331083
    - AVEXAM-33607
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: |-
      Determine the maximum attainable range, given the following information:

      - Average fuel flow: {{ff}} litres/h
      - Available fuel: {{fuel}} litres
      - TAS: {{tas}} kt
      - Wind component: {{tw}} kt tailwind

      Do not consider final reserve, contingency or alternate fuel.
    variables:
      - id: ff
        label: Fuel flow
        unit: litres/h
      - id: fuel
        label: Available fuel
        unit: litres
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: (tas + tw) * fuel / ff
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: tas * fuel / ff
      - id: d2
        formula: (tas + tw) * (floor(fuel / ff) + round((fuel / ff - floor(fuel / ff)) *
          100) / 60)
      - id: d3
        formula: (tas - tw) * (floor(fuel / ff) + round((fuel / ff - floor(fuel / ff)) *
          100) / 60)
      - id: d4
        formula: (tas - tw) * fuel / ff
    presets:
      - id: p1
        values:
          ff: 42
          fuel: 53
          tas: 95
          tw: 25
      - id: p2
        values:
          ff: 38
          fuel: 60
          tas: 100
          tw: 20
      - id: p3
        values:
          ff: 45
          fuel: 70
          tas: 110
          tw: 15
    explanation: >-
      The maximum flight time (endurance) is the available fuel divided by the
      fuel flow. The range is the distance covered in that time at the ground
      speed, which for a tailwind is TAS plus the wind component.


      **Solution**


      Endurance: {{f: fuel / ff}} = {{n: fuel / ff}} h = {{= fuel / ff * 60}}
      min


      Ground speed: {{f: tas + tw}} = {{n: tas + tw}} kt


      Range: {{f: (tas + tw) * fuel / ff}} = {{n: (tas + tw) * fuel / ff}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses TAS only and ignores the tailwind.

      - **{{d2}} NM**: converts the decimal part of the endurance directly into
      minutes (for example 2.41 h read as 2 h 41 min) and so overestimates the
      time.

      - **{{d3}} NM**: subtracts the wind instead of adding it and also misreads
      the decimal hours as minutes.

      - **{{d4}} NM**: subtracts the tailwind as if it were a headwind.
- id: QZWXTPZTO
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336531
    - AVEXAM-96503
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: |-
      An aircraft has to fly a distance of {{dist}} NM.

      The planned time to cover this distance is {{planned}} minutes.

      Actually, it covers the distance in {{time}} minutes.

      How fast did the aircraft fly?

      Give the answer in kt.
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: planned
        label: Planned time
        unit: min
      - id: time
        label: Actual time
        unit: min
    answer:
      formula: dist / (time / 60)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: dist / (planned / 60)
      - id: d2
        formula: dist / time
      - id: d3
        formula: dist * time / 60
      - id: d4
        formula: dist * 60 / (time + planned)
    presets:
      - id: p1
        values:
          dist: 123
          planned: 93
          time: 41
      - id: p2
        values:
          dist: 200
          planned: 80
          time: 50
    explanation: >-
      Speed is distance divided by time. The time must be converted from minutes
      to hours, which is done by dividing it by 60.


      **Solution**


      {{f: dist / (time / 60)}} = {{n: dist / (time / 60)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the planned time instead of the actual time.

      - **{{d2}} kt**: does not convert the minutes to hours, giving NM per
      minute.

      - **{{d3}} kt**: multiplies by the time instead of dividing by it (and
      converts to hours incorrectly).

      - **{{d4}} kt**: uses the sum of the planned and actual times.
