- id: Q1RS0SVKI
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336688
    - AVEXAM-35762
    - ATPLGS-629376
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Due to a passenger's serious illness while en-route, the aircraft must
      divert to the nearest suitable airfield.


      The FMC calculates a flight time of {{time}} minutes to the nearest
      diversion airfield and shows a gross mass of {{gross}} kg.


      The fuel on board is {{fob}} kg and the FMC gives a fuel on landing of
      {{fol}} kg.


      How much is the landing mass (kg)?
    variables:
      - id: time
        label: Flight time to diversion
        unit: min
      - id: gross
        label: Gross mass
        unit: kg
      - id: fob
        label: Fuel on board
        unit: kg
      - id: fol
        label: FMC fuel on landing
        unit: kg
    answer:
      formula: gross - fob + fol
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: gross - fob
      - id: d2
        formula: gross - fol
      - id: d3
        formula: gross + fob - fol
      - id: d4
        formula: gross - fob - fol
    presets:
      - id: p1
        values:
          time: 26
          gross: 78200
          fob: 9200
          fol: 8700
      - id: p2
        values:
          time: 35
          gross: 64500
          fob: 7800
          fol: 7000
      - id: p3
        values:
          time: 18
          gross: 71200
          fob: 8400
          fol: 7650
    explanation: >-
      The fuel burned until landing is the fuel on board minus the predicted
      fuel on landing. The landing mass is the current gross mass minus that
      fuel burn.


      **Solution**


      Fuel burned: {{= fob - fol}} kg


      {{f: gross - fob + fol}} = {{n: gross - fob + fol}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: The whole fuel on board was subtracted, as if all of it
      were burned.

      - **{{d2}} kg**: The fuel on landing was subtracted instead of the fuel
      burned.

      - **{{d3}} kg**: The fuel burn was added instead of subtracted.

      - **{{d4}} kg**: Both the fuel on board and the fuel on landing were
      subtracted.
- id: Q1S4VUNXR
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338033
    - AVEXAM-45571
  annexes:
    - jeppesen-enr-scotland-north
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to Jeppesen GSPRM Training Route Manual - Chart "E LO 1". An
      aircraft is flying from ABERDEEN (ADN, N57°19', W0002°16') to SUMBURGH
      (N59°53', W001°18'). Given the following data, the estimated remaining
      fuel when passing waypoint GAVEL is:


      - Distance from ABERDEEN to GAVEL (read from the chart): {{dist}} NM

      - Ground speed: {{gs}} kt

      - Fuel flow: {{ff}} kg/h

      - Estimated remaining fuel when passing ABERDEEN: {{fuel0}} kg
    variables:
      - id: dist
        label: Distance ABERDEEN to GAVEL (from chart)
        unit: NM
      - id: gs
        label: Ground speed
        unit: kt
      - id: ff
        label: Fuel flow
        unit: kg/h
      - id: fuel0
        label: Remaining fuel at ABERDEEN
        unit: kg
    chartInputs:
      - dist
    answer:
      formula: fuel0 - ff * dist / gs
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: fuel0 + ff * dist / gs
      - id: d2
        formula: fuel0 - ff * gs / dist
      - id: d3
        formula: fuel0 - dist
      - id: d4
        formula: fuel0 - ff * dist / (2 * gs)
    presets:
      - id: p1
        values:
          dist: 131
          gs: 162
          ff: 420
          fuel0: 1295
    explanation: >-
      Fuel used between two points is the fuel flow multiplied by the time,
      which is distance divided by ground speed. The remaining fuel is the
      starting fuel minus this burn. The distance has to be measured on the
      chart.


      **Solution**


      Time = {{dist}} / {{gs}} = {{= dist / gs}} h


      {{f: fuel0 - ff * dist / gs}} = {{n: fuel0 - ff * dist / gs}} =
      **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: adds the fuel burned instead of subtracting it.

      - **{{d2}} kg**: inverts distance and ground speed when computing the
      time.

      - **{{d3}} kg**: subtracts the distance in NM directly from the fuel in
      kg.

      - **{{d4}} kg**: uses half of the correct time.
- id: Q1WNMCRHD
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335267
    - BGS-331346
    - ATPLGS-625314
    - ATPLGS-625271
    - ATPLQ-332547
    - ATPLGS-626266
    - AVEXAM-44791
    - ATPLQ-335533
    - AVEXAM-16508
    - ATPLGS-107830
    - ATPLQ-337642
    - ATPLGS-629422
    - ATPLGS-629262
    - AVEXAM-98800
  annexes: []
  learningObjectives:
    - "033.01"
    - "033.06"
  template:
    type: calculation
    question: >-
      Given the following information, calculate the ground speed (kt) for one
      leg of a cross country flight, taking the wind correction angle into
      account.


      - TAS: {{tas}} kt

      - True track (true course): {{tt}}°

      - W/V: {{wd}}°/{{ws}} kt
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: tt
        label: True track
        unit: °
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: tas * cos(asin(ws * sin(wd - tt) / tas)) - ws * cos(wd - tt)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas + ws * cos(wd - tt)
      - id: d2
        formula: tas - ws
      - id: d3
        formula: tas * cos(asin(ws * sin(wd - tt) / tas))
      - id: d4
        formula: tas - ws * sin(wd - tt)
    presets:
      - id: p1
        values:
          tas: 90
          tt: 13
          wd: 30
          ws: 31
      - id: p2
        values:
          tas: 420
          tt: 17
          wd: 340
          ws: 30
      - id: p3
        values:
          tas: 110
          tt: 235
          wd: 350
          ws: 23
      - id: p4
        values:
          tas: 135
          tt: 270
          wd: 340
          ws: 20
    explanation: >-
      The wind triangle gives the ground speed along the track. The wind
      correction angle is WCA = asin(WS x sin(angle between wind and track) /
      TAS), and the ground speed is TAS x cos(WCA) minus the head wind
      component.


      **Solution**


      Angle between wind and track: {{= wd - tt}}°; WCA = {{= asin(ws * sin(wd -
      tt) / tas)}}°; head wind component = {{= ws * cos(wd - tt)}} kt


      {{f: tas * cos(asin(ws * sin(wd - tt) / tas)) - ws * cos(wd - tt)}} = {{n:
      tas * cos(asin(ws * sin(wd - tt) / tas)) - ws * cos(wd - tt)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: The head wind component was added instead of subtracted.

      - **{{d2}} kt**: The full wind speed was subtracted, ignoring the wind
      direction.

      - **{{d3}} kt**: The head wind component was ignored; only the drift
      effect on TAS was applied.

      - **{{d4}} kt**: The cross wind component (sine) was used instead of the
      head wind component (cosine).
