- id: QFCPKCTMF
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333021
    - ATPLGS-622518
    - ATPLGS-626105
    - AVEXAM-12612
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      Due to a drive failure, the slats of a transport category aircraft do not
      retract properly after take-off. Based on the flight planning data given
      below, calculate the time penalty in per cent for the flight, based on
      endurance. Give the answer as a whole per cent, rounded down.


      - Usable fuel: {{usable}} kg

      - Fuel consumption: {{cons}} kg/h

      - Final reserve fuel: {{reserve}} kg

      - Fuel penalty for the flap/slat failure: {{pen}} %
    variables:
      - id: usable
        label: Usable fuel
        unit: kg
      - id: cons
        label: Fuel consumption
        unit: kg/h
      - id: reserve
        label: Final reserve fuel
        unit: kg
      - id: pen
        label: Fuel penalty
        unit: "%"
    answer:
      formula: floor((1 - 1 / (1 + pen / 100)) * 100)
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: pen
      - id: d2
        formula: floor(100 / (1 + pen / 100))
      - id: d3
        formula: floor(pen / 100 * (usable - reserve) / usable * 100)
      - id: d4
        formula: floor((1 - 1 / (1 + 1.8)) * 100)
    presets:
      - id: p1
        values:
          usable: 8540
          cons: 2600
          reserve: 1100
          pen: 60
      - id: p2
        values:
          usable: 9000
          cons: 2800
          reserve: 1200
          pen: 50
    explanation: >-
      A fuel penalty of p % means the aeroplane burns (1 + p/100) times as much
      fuel per hour, so the endurance is divided by that factor. The time
      penalty is the loss of endurance as a percentage of the original
      endurance. The usable fuel and the reserve cancel out of this ratio.


      **Solution**


      Endurance without penalty: {{n: (usable - reserve) / cons}} h


      Endurance with penalty: {{n: (usable - reserve) / (cons * (1 + pen /
      100))}} h


      Time penalty: {{f: (1 - 1 / (1 + pen / 100)) * 100}} = {{n: (1 - 1 / (1 +
      pen / 100)) * 100}} %, which rounded down is **{{answer}} %**


      **Why the other answers are wrong**

      - **{{d1}} %**: quotes the fuel penalty itself as the time penalty.

      - **{{d2}} %**: inverts the ratio of the fuel flows.

      - **{{d3}} %**: multiplies the penalty by the share of usable fuel that is
      not reserve.

      - **{{d4}} %**: uses the 180% gear-retraction penalty instead of the
      flap/slat penalty.
- id: QFDHBHSEG
  docId: "033.06"
  relatedQuestions:
    - QRZZADRR
  externalIds:
    - ATPLQ-336651
    - ATPLGS-629355
    - BGS-331203
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      An aircraft is cruising at {{alt_from}} ft and has to descend from a Top
      of Descent (TOD) at {{alt_from}} ft to {{alt_to}} ft, where the approach
      at the destination aerodrome will commence. The maximum rate of descent is
      {{rod}} ft/min and the average ground speed during the descent is {{gs}}
      kt.


      What should be the minimum horizontal distance between the Top of Descent
      and the destination aerodrome (in NM), so as to be at {{alt_to}} ft
      {{dist}} NM from the destination aerodrome?
    variables:
      - id: alt_from
        label: Cruise altitude (TOD)
        unit: ft
      - id: alt_to
        label: Altitude to be reached
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed during descent
        unit: kt
      - id: dist
        label: Distance at the lower altitude to the aerodrome
        unit: NM
    answer:
      formula: (alt_from - alt_to) / rod * gs / 60 + dist
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (alt_from - alt_to) / rod * gs / 60
      - id: d2
        formula: (alt_from - alt_to) / rod * gs
      - id: d3
        formula: alt_from / rod * gs / 60 + dist
      - id: d4
        formula: 2 * (alt_from - alt_to) / rod * gs / 60 + dist
    presets:
      - id: p1
        values:
          alt_from: 7000
          alt_to: 2000
          rod: 1000
          gs: 180
          dist: 10
      - id: p2
        values:
          alt_from: 9000
          alt_to: 3000
          rod: 1500
          gs: 240
          dist: 15
    explanation: >-
      The distance flown during the descent is the altitude to lose divided by
      the rate of descent (the time in minutes), multiplied by the ground speed
      and divided by 60 to convert minutes to hours. The distance from the point
      at the lower altitude to the aerodrome is then added to obtain the TOD
      distance.


      **Solution**


      Time to descend: {{n: (alt_from - alt_to) / rod}} min


      Descent distance: {{n: (alt_from - alt_to) / rod * gs / 60}} NM


      TOD distance: {{f: (alt_from - alt_to) / rod * gs / 60 + dist}} = {{n:
      (alt_from - alt_to) / rod * gs / 60 + dist}} = **{{answer}} NM**


      **Why the other answers are wrong**

      - **{{d1}} NM**: forgets the distance from the lower-altitude point to the
      aerodrome.

      - **{{d2}} NM**: forgets to convert minutes to hours (divide by 60).

      - **{{d3}} NM**: uses the full cruise altitude instead of the altitude to
      lose.

      - **{{d4}} NM**: counts the descent distance twice.
