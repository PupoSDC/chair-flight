  template:
    type: calculation
    question: >-
      A flight planning chart for an aircraft states that the time to reach the
      cruising level at a given gross mass is {{time}} minutes and the distance
      travelled is {{dist0}} NM (zero-wind).


      What will be the distance travelled with an average tailwind component of
      {{tw}} kt?
    variables:
      - id: time
        label: Time to climb
        unit: min
      - id: dist0
        label: Zero-wind distance
        unit: NM
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: dist0 + tw * time / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: dist0 - tw * time / 60
      - id: d2
        formula: dist0 + tw
      - id: d3
        formula: dist0
      - id: d4
        formula: dist0 + tw * time
      - id: d5
        formula: dist0 + tw / (time / 60)
    presets:
      - id: p1
        values:
          time: 36
          dist0: 157
          tw: 60
      - id: p2
        values:
          time: 30
          dist0: 130
          tw: 40
      - id: p3
        values:
          time: 42
          dist0: 210
          tw: 50
    explanation: >-
      The chart distance is the still-air distance. A tailwind adds a distance
      equal to the wind component multiplied by the time spent climbing.


      **Solution**


      {{f: dist0 + tw * time / 60}} = {{n: dist0 + tw * time / 60}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: wind effect subtracted (headwind instead of tailwind).

      - **{{d2}} NM**: wind speed added directly, without multiplying by the
      time in hours.

      - **{{d3}} NM**: wind ignored.

      - **{{d4}} NM**: time in minutes not converted to hours.

      - **{{d5}} NM**: wind component divided by the time instead of multiplied.
