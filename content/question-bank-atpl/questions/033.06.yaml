          new level, then add them to get the revised ETA at WPT C. The other
          times come from using the planned level or from a wrong calculation.
- id: QIPPEDFSQ
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331100
  annexes:
    - 033-excerpt-from-flight-log-04
  learningObjectives:
    - "033.06"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Given: planned and actual data as shown in the Flight Log
      excerpt. Provided that flight conditions and fuel consumption remain
      unchanged, and the reserve fuel is {{res}} kg, what is the safe endurance
      left at GAMMA, in minutes?


      (Fuel remaining at GAMMA, read from the flight log: {{fuel}} kg. Fuel
      flow, read from the flight log: {{ff}} kg/h.)
    variables:
      - id: fuel
        label: Fuel remaining at GAMMA (read from the figure)
        unit: kg
      - id: ff
        label: Fuel flow (read from the figure)
        unit: kg/h
      - id: res
        label: Reserve fuel
        unit: kg
    chartInputs:
      - fuel
      - ff
    answer:
      formula: (fuel - res) / ff * 60
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: fuel / ff * 60
      - id: d2
        formula: (fuel + res) / ff * 60
      - id: d3
        formula: res / ff * 60
      - id: d4
        formula: (fuel - res) / ff
    presets:
      - id: p1
        values:
          fuel: 690
          ff: 200
          res: 350
    explanation: >-
      The safe endurance is the time that can be flown on the usable fuel, i.e.
      the fuel remaining minus the reserve, at the (unchanged) fuel flow. The
      fuel remaining and the fuel flow are read from the flight log.


      **Solution**


      {{f: (fuel - res) / ff * 60}} = {{n: (fuel - res) / ff * 60}} =
      **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the reserve is not deducted.

      - **{{d2}} min**: the reserve is added instead of deducted.

      - **{{d3}} min**: only the reserve fuel converted to time.

      - **{{d4}} min**: the result is in hours, not converted to minutes.
