        formula: fs - ff * time / 100
      - id: d2
        formula: fs + ff * time / 60
      - id: d3
        formula: fs - ff * (time + 10) / 60
      - id: d4
        formula: fs - ff * (time - 10) / 60
      - id: d5
        formula: fs - ff * time / 60 * 1.1
    presets:
      - id: p1
        values:
          fs: 2290
          ff: 600
          time: 57
      - id: p2
        values:
          fs: 2059
          ff: 900
          time: 45
      - id: p3
        values:
          fs: 2700
          ff: 1200
          time: 40
      - id: p4
        values:
          fs: 6822
          ff: 1200
          time: 35
      - id: p5
        values:
          fs: 2700
          ff: 1200
          time: 70
    explanation: >-
      The fuel remaining at the end of the direct leg is the fuel remaining at
      its start minus the fuel burned during the leg, which is fuel flow
      multiplied by flight time.


      **Solution**


      Fuel burned: {{f: ff * time / 60}} = {{n: ff * time / 60}} kg


      {{f: fs - ff * time / 60}} = {{n: fs - ff * time / 60}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: minutes converted to hours by dividing by 100 instead of
      60.

      - **{{d2}} kg**: fuel burned was added instead of subtracted.

      - **{{d3}} kg**: leg time taken 10 min too long.

      - **{{d4}} kg**: leg time taken 10 min too short.

      - **{{d5}} kg**: fuel flow increased by 10 %.
- id: QG25MJMT8
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331558
    - ATPLGS-629421
    - BGS-331283
  annexes: []
  learningObjectives:
    - "033.06"
  template:
    type: calculation
    question: >-
      An aircraft is approaching the destination aerodrome following a track of
      {{trk}}°(M). Given:


      - Forecast wind: {{wd}}°/{{ws}} kt (magnetic)

      - Average approach TAS: {{tas}} kt

      - Variation in the vicinity of the aerodrome: {{var}}° W


      What magnetic heading must the pilot steer?
    variables:
      - id: trk
        label: Magnetic track
        unit: °
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
      - id: var
        label: Variation
        unit: °
    answer:
      formula: trk + asin(ws * sin(wd - trk) / tas)
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: trk - asin(ws * sin(wd - trk) / tas)
      - id: d2
        formula: trk
      - id: d3
        formula: trk + var
      - id: d4
        formula: trk - var
    presets:
      - id: p1
        values:
          trk: 58
          wd: 20
          ws: 20
          tas: 130
          var: 4
      - id: p2
        values:
          trk: 120
          wd: 200
          ws: 30
          tas: 140
          var: 3
      - id: p3
        values:
          trk: 270
          wd: 330
          ws: 25
          tas: 120
          var: 5
    explanation: >-
      Heading is track plus the wind correction angle. The WCA comes from the
      wind triangle: sin(WCA) = wind speed x sin(wind angle relative to track) /
      TAS. Track and wind are both magnetic here, so the variation is not
      needed.


      **Solution**


      WCA = {{f: asin(ws * sin(wd - trk) / tas)}} = {{= asin(ws * sin(wd - trk)
      / tas)}}°


      Heading = {{f: trk + asin(ws * sin(wd - trk) / tas)}} = {{n: trk + asin(ws
      * sin(wd - trk) / tas)}} = **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°(M)**: the WCA was applied with the wrong sign (the wind pushes
      the aircraft the other way).

      - **{{d2}}°(M)**: the track was flown as heading, with no drift
      correction.

      - **{{d3}}°(M)**: the variation was added although everything is already
      magnetic.

      - **{{d4}}°(M)**: the variation was subtracted although everything is
      already magnetic.
- id: QGBVIXQV
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331092
    - BGS-331316
  annexes: []
  learningObjectives:
    - 033.06.01.01.06
  template:
    type: calculation
    question: >-
      At 14:58 ATC instructs you to fly directly to OAL VOR/DME and reduce speed
      to M {{mach}}, for traffic separation purposes. Given the following
      information:


      - Direct distance to OAL: {{dist}} NM

      - Flight-planned route distance to OAL: {{route_dist}} NM

      - Magnetic track to OAL from present position: {{track}}°

      - Variation: 2°E

      - Actual wind: {{wdir}}°/{{wspeed}} kt

      - OAT: {{oat}}°C


      What is the revised ETA at OAL (hh:mm)?
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: dist
        label: Direct distance to OAL
        unit: NM
      - id: route_dist
        label: Flight-planned route distance
        unit: NM
      - id: track
        label: Magnetic track
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspeed
        label: Wind speed
        unit: kt
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: round(898 + 60 * dist / ((mach * sqrt(1.4 * 287.05 * (273.15 + oat)) *
        1.94384) - (wspeed * cos(wdir - (track + 2)))))
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: round(898 + 60 * dist / (mach * sqrt(1.4 * 287.05 * (273.15 + oat)) *
          1.94384))
      - id: d2
        formula: round(898 + 60 * dist / ((mach * sqrt(1.4 * 287.05 * (273.15 + oat)) *
          1.94384) + (wspeed * cos(wdir - (track + 2)))))
      - id: d3
        formula: round(898 + 60 * route_dist / ((mach * sqrt(1.4 * 287.05 * (273.15 +
          oat)) * 1.94384) - (wspeed * cos(wdir - (track + 2)))))
    presets:
      - id: p1
        values:
          mach: 0.76
          dist: 90
          route_dist: 120
          track: 53
          wdir: 45
          wspeed: 65
          oat: -35
      - id: p2
        values:
          mach: 0.78
          dist: 150
          route_dist: 200
          track: 120
          wdir: 300
          wspeed: 40
          oat: -45
    explanation: >-
      The new groundspeed follows from the true airspeed at the reduced Mach
      number and the wind component along the new direct track. The time to the
      destination is the distance divided by that groundspeed, added to the time
      of the instruction (14:58).


      **Solution**


      - True airspeed: {{= (mach * sqrt(1.4 * 287.05 * (273.15 + oat)) *
      1.94384)}} kt

      - Headwind component on the direct track (magnetic track plus 2° east
      variation): {{= (wspeed * cos(wdir - (track + 2)))}} kt

      - Time to OAL: {{= 60 * dist / ((mach * sqrt(1.4 * 287.05 * (273.15 +
      oat)) * 1.94384) - (wspeed * cos(wdir - (track + 2))))}} min

      - Revised ETA: 14:58 plus this time, **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: ignores the wind.

      - **{{d2}}**: uses the wind with the wrong sign.

      - **{{d3}}**: uses the flight-planned route distance instead of the direct
      distance.
- id: QGOMZYRT
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339828
    - AVEXAM-19009
    - BGS-331112
  annexes:
    - 033-completed-flight-log-d-kein-lowz-to-ednl-15-7
  learningObjectives:
    - 033.06.01.01.06
  template:
    type: chart
    question: >-
      Refer to figure. A pilot flying a VFR route is forced by weather to
      descend at Chiemsee Island from the planned cruising altitude of
      FL{{fl_start}} to FL{{fl_end}}. The OAT at FL{{fl_end}} is +{{oat}} °C,
      the cruising CAS at that level is {{cas}} kt, and the wind is as forecast.


      If the pilot flies the correct heading to account for the wind, what is
      the new ETA at Seeshaupt, to the nearest minute?
    explanation: ""
    variables:
      - id: fl_start
        label: Planned cruising level
        unit: FL
      - id: fl_end
        label: New cruising level
        unit: FL
      - id: oat
        label: OAT at new level
        unit: °C
      - id: cas
        label: Cruising CAS
        unit: kt
    entries:
      - id: e1
        values:
          fl_start: 85
          fl_end: 45
          oat: 9
          cas: 130
        answer: 08:59
        wrongAnswers:
          - 09:01
          - 08:55
          - 09:04
        explanation: >-
          The new ETA comes from the figure. The lower level changes the true
          airspeed and the wind, so the heading and groundspeed must be
          corrected for the wind before the remaining time to Seeshaupt is added
          to the time over Chiemsee.


          **Solution**


          - Read the wind-corrected groundspeed and the remaining distance to
          Seeshaupt from the figure for FL{{fl_end}}.

          - Add the flying time to the time over Chiemsee.

          - The new ETA is **08:59**.


          **Why the other answers are wrong**


          - **09:01**: a small error in the groundspeed or the time over
          Chiemsee.

          - **08:55**: a groundspeed that is too high for the new level.

          - **09:04**: a small error in the wind correction, giving a longer
          flying time.
- id: QHCYGLTU
  docId: "033.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338956
    - ATPLGS-626633
  annexes: []
  learningObjectives:
    - 033.06.01.01.03
  template:
    type: calculation
    question: >-
      Given the following information, what time deviation will be encountered
      on the leg? Give the delay in minutes (a negative value means an advance).


      - Reference leg time on the flight plan: {{ref}} minutes

      - Leg track: {{trk}}°

      - Leg distance: {{dist}} NM

      - TAS: {{tas}} kt

      - Wind: {{wdir}}°/{{wspd}} kt
    variables:
      - id: ref
        label: Reference leg time
        unit: min
      - id: trk
        label: Leg track
        unit: °
      - id: dist
        label: Leg distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction (from)
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
    answer:
      formula: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd * cos(wdir
        - trk)) * 60 - ref
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tas * 60 - ref
      - id: d2
        formula: dist / (tas + wspd * cos(wdir - trk)) * 60 - ref
      - id: d3
        formula: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd * cos(wdir
          - trk)) * 60
      - id: d4
        formula: ref - dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
          cos(wdir - trk)) * 60
    presets:
      - id: p1
        values:
          ref: 17
          trk: 90
          dist: 100
          tas: 345
          wdir: 65
          wspd: 50
      - id: p2
        values:
          ref: 30
          trk: 180
          dist: 150
          tas: 300
          wdir: 230
          wspd: 60
      - id: p3
        values:
          ref: 25
          trk: 270
          dist: 160
          tas: 400
          wdir: 330
          wspd: 70
    explanation: >-
      The actual leg time is distance over ground speed. The deviation is the
      actual time minus the reference time on the flight plan; a positive result
      is a delay.


      **Solution**


      Ground speed: {{= tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)}} kt


      Actual time: {{= dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) -
      wspd * cos(wdir - trk)) * 60}} min


      {{f: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)) * 60 - ref}} = {{n: dist / (tas * cos(asin(wspd *
      sin(wdir - trk) / tas)) - wspd * cos(wdir - trk)) * 60 - ref}} =
      **{{answer}} min** (delay)


      **Why the other answers are wrong**


      - **{{d1}} min**: ignores the wind when computing the actual time.

      - **{{d2}} min**: adds the wind component with the wrong sign (tailwind
      instead of headwind).

      - **{{d3}} min**: gives the total leg time without subtracting the
      reference time.

      - **{{d4}} min**: subtracts in the wrong order, so the sign is inverted.
