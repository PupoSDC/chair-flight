  template:
    type: chart
    question: (For this question use annex 050-042). Assuming a normal vertical
      temperature gradient, at what flight level will the freezing level above
      Madrid be found?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: FL 120
        wrongAnswers:
          - FL 180
          - FL 60
          - FL 240
        explanation: >-
          The freezing level is the height at which the air temperature is 0 °C.
          With a normal vertical temperature gradient, the annex gives the
          freezing level above Madrid, which is expressed as a flight level.


          **Solution**


          - Read the freezing level above Madrid from annex 050-042.

          - With a normal vertical temperature gradient, it is found at **FL
          120**.


          **Why the other answers are wrong**


          - **FL 180**: a level higher than the freezing level read from the
          annex.

          - **FL 60**: a level lower than the freezing level read from the
          annex.

          - **FL 240**: far above the freezing level, so it is not the answer.
