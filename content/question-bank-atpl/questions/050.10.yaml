  template:
    type: chart
    question: Refer to the figure. What is the geostrophic wind at (45°N 030°W),
      approximately?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 210°/ 45kt
        wrongAnswers:
          - 090° / 30 kt
          - 030° / 25 kt
          - 315°/ 15kt
        explanation: >-
          The geostrophic wind is read from the isobars at the given position.
          It blows parallel to the isobars, with low pressure on its left in the
          Northern Hemisphere, and its speed depends on how closely the isobars
          are spaced.


          **Solution**


          - Read the isobars at (45°N 030°W) on the figure.

          - The geostrophic wind is **210° at 45 kt**.


          **Why the other answers are wrong**


          - **090° / 30 kt**: the direction and speed do not match the isobars
          at this position.

          - **030° / 25 kt**: the direction or speed is read wrongly from the
          isobars.

          - **315°/ 15kt**: the direction and speed do not match the isobars at
          this position.
