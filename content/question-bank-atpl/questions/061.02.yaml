- id: QBNSPO3HN
  docId: "061.02"
  relatedQuestions:
    - QMLIAPS09
  externalIds:
    - ATPLQ-611465
    - ATPLGS-110475
    - AVEXAM-71118
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      A ground feature appears {{rel}}° to the left of the centre line of an
      airborne weather radar.


      - Aircraft magnetic heading: {{hdg}}°

      - Magnetic variation: {{var}}° (positive = East, negative = West)


      What is the true bearing of the aircraft from the feature?
    variables:
      - id: hdg
        label: Magnetic heading
        unit: °M
      - id: var
        label: Variation
        unit: °
      - id: rel
        label: Relative bearing of the feature (left)
        unit: °
    answer:
      formula: (hdg + var - rel + 180) - 360 * floor((hdg + var - rel + 180) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (hdg + var - rel) - 360 * floor((hdg + var - rel) / 360)
      - id: d2
        formula: (hdg - var - rel + 180) - 360 * floor((hdg - var - rel + 180) / 360)
      - id: d3
        formula: (hdg + var + rel + 180) - 360 * floor((hdg + var + rel + 180) / 360)
    presets:
      - id: p1
        values:
          hdg: 355
          var: 15
          rel: 30
      - id: p2
        values:
          hdg: 270
          var: -5
          rel: 45
      - id: p3
        values:
          hdg: 90
          var: 10
          rel: 10
    explanation: >-
      The true heading is found by correcting the magnetic heading for
      variation. The feature is to the left of the nose, so its bearing from the
      aircraft is the true heading minus the relative bearing. The bearing of
      the aircraft from the feature is the reciprocal, 180 degrees different,
      kept between 0 and 360 degrees.


      **Solution**


      True heading: {{hdg}}° + {{var}}° = {{= hdg + var}}°


      Bearing of the feature: {{= hdg + var}}° − {{rel}}° = {{= hdg + var -
      rel}}°


      Bearing of the aircraft from the feature: add 180° and keep the result
      between 0° and 360°, giving **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}°**: gives the bearing of the feature from the aircraft, not the
      reciprocal.

      - **{{d2}}°**: the variation is applied with the wrong sign.

      - **{{d3}}°**: the relative bearing is added instead of subtracted.
- id: QCJUQ3SOY
  docId: "061.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613722
    - AVEXAM-89097
    - ATPLGS-625409
  annexes: []
  learningObjectives:
    - 061.02.02.01.08
  template:
    type: calculation
    question: >-
      The same NDB is observed twice from a steady track:


      - First observation: {{a1}}° left of the nose

      - Second observation: {{a2}}° left of the nose, {{t_min}} minutes later

      - Wind: calm

      - Groundspeed: {{gs}} kt


      What is the minimum distance between the aircraft and the NDB station, in
      NM?
    variables:
      - id: a1
        label: First relative bearing (left)
        unit: °
      - id: a2
        label: Second relative bearing (left)
        unit: °
      - id: t_min
        label: Time between observations
        unit: min
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: gs * t_min / 60 * sin(a1) * sin(a2) / sin(a2 - a1)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: gs * t_min / 60 * sin(a1)
      - id: d2
        formula: gs / 60
      - id: d3
        formula: gs * t_min / 60 * sin(a2 - a1) * 2
      - id: d4
        formula: gs * t_min / 30
    presets:
      - id: p1
        values:
          a1: 45
          a2: 90
          t_min: 3
          gs: 180
      - id: p2
        values:
          a1: 30
          a2: 75
          t_min: 4
          gs: 210
      - id: p3
        values:
          a1: 40
          a2: 80
          t_min: 4
          gs: 150
    explanation: >-
      The aircraft flies a steady track, so the bearing to the NDB changes as it
      passes. The distance flown between the two observations is the groundspeed
      multiplied by the time. The two positions of the aircraft and the NDB form
      a triangle, which is solved with the sine rule. The minimum distance is
      the shortest distance from the NDB to the track.


      **Solution**


      - Distance flown between the observations: {{gs}} kt × {{t_min}} min ÷ 60
      = {{= gs * t_min / 60}} NM

      - Minimum distance: {{f: gs * t_min / 60 * sin(a1) * sin(a2) / sin(a2 -
      a1)}} = {{n: gs * t_min / 60 * sin(a1) * sin(a2) / sin(a2 - a1)}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the sine rule was not applied; only the first sine was
      multiplied by the distance flown.

      - **{{d2}} NM**: only one minute of flying was used.

      - **{{d3}} NM**: the sine of the difference between the bearings was used
      with a stray factor of two.

      - **{{d4}} NM**: the time was converted with 30 instead of 60, which
      doubles the distance flown.
