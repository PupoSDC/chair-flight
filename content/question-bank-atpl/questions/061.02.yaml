- id: QCXLXNR8O
  docId: "061.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614202
  annexes: []
  learningObjectives:
    - 061.01.03.02.04
    - 061.01.03.02.06
  template:
    type: calculation
    question: |-
      The aircraft has the following data.

      - Ground speed: {{gs}} kt
      - Time flown since the last fix: {{t}} min
      - Position: {{xtk}} NM left of track

      Calculate the track error angle, in degrees left, using the 1-in-60 rule.
    variables:
      - id: gs
        label: ground speed
        unit: kt
      - id: t
        label: time flown
        unit: min
      - id: xtk
        label: cross-track distance (left)
        unit: NM
    answer:
      formula: 60 * xtk / (gs * t / 60)
      unit: ° left
      decimals: 1
    distractors:
      - id: d1
        formula: 60 * xtk / gs
      - id: d2
        formula: atan(xtk / (gs * t / 60))
      - id: d3
        formula: 90 * xtk / (gs * t / 60)
    presets:
      - id: p1
        values:
          gs: 180
          t: 12
          xtk: 1.5
      - id: p2
        values:
          gs: 240
          t: 15
          xtk: 2
      - id: p3
        values:
          gs: 150
          t: 20
          xtk: 3
    explanation: >-
      The 1-in-60 rule says that one nautical mile off track after 60 NM flown
      corresponds to an angle of one degree. The distance flown is the ground
      speed multiplied by the time in hours.


      **Solution**


      Distance flown = {{gs}} kt × {{t}} min = {{= gs * t / 60}} NM


      Track error = {{f: 60 * xtk / (gs * t / 60)}} = {{n: 60 * xtk / (gs * t /
      60)}} = **{{answer}}° left**


      **Why the other answers are wrong**


      - **{{d1}}° left**: forgets the time flown and uses the ground speed only.

      - **{{d2}}° left**: the exact arctangent of the offset over the distance;
      the 1-in-60 rule is the method asked for.

      - **{{d3}}° left**: uses 90 instead of 60 in the rule, so the angle is too
      large.
