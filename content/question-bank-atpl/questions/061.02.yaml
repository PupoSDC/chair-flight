- id: QMLIAPS09
  docId: "061.02"
  relatedQuestions:
    - QBNSPO3HN
  externalIds:
    - ATPLQ-619344
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      An island is observed {{rel}}° to the right of the aircraft's longitudinal
      axis.


      - Aircraft magnetic heading: {{hdg}}°

      - Magnetic variation: {{var}}° (positive = East, negative = West)


      What is the true bearing from the aircraft to the island?
    variables:
      - id: hdg
        label: Magnetic heading
        unit: °M
      - id: var
        label: Variation
        unit: °
      - id: rel
        label: Relative bearing of the island (right)
        unit: °
    answer:
      formula: (hdg + var + rel) - 360 * floor((hdg + var + rel) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (hdg + var - rel) - 360 * floor((hdg + var - rel) / 360)
      - id: d2
        formula: (hdg - var + rel) - 360 * floor((hdg - var + rel) / 360)
      - id: d3
        formula: (hdg - var - rel) - 360 * floor((hdg - var - rel) / 360)
    presets:
      - id: p1
        values:
          hdg: 290
          var: 10
          rel: 30
      - id: p2
        values:
          hdg: 45
          var: -3
          rel: 60
      - id: p3
        values:
          hdg: 200
          var: 5
          rel: 90
    explanation: >-
      Variation turns the magnetic heading into the true heading. The relative
      bearing is then added to the true heading to give the true bearing of the
      island from the aircraft.


      **Solution**


      True heading: {{hdg}}° + {{var}}° = {{= hdg + var}}°


      True bearing of the island: {{= hdg + var}}° + {{rel}}° = {{= hdg + var +
      rel}}°, kept between 0° and 360°, giving **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}°**: the relative bearing is subtracted instead of added.

      - **{{d2}}°**: the variation is applied with the wrong sign.

      - **{{d3}}°**: both the variation and the relative bearing are applied
      with the wrong sign.
