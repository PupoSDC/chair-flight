- id: Q5SVIV0IB
  docId: "061.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613264
    - AVEXAM-89097
    - ATPLGS-625409
  annexes: []
  learningObjectives:
    - 061.02.02.01.08
  template:
    type: calculation
    question: >-
      An NDB station is observed on a relative bearing of 45° left of the
      aircraft's nose. Some time later the same NDB station is observed on a
      relative bearing of 90° left of the aircraft's nose. Given the following
      information:


      - Time between the two observations: {{t}} min

      - Wind: calm

      - Ground speed: {{gs}} kt


      What is the minimum distance between the aircraft and the NDB station?
    variables:
      - id: t
        label: Time between the observations
        unit: min
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: gs * t / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: gs * t / 60 * 1.5
      - id: d2
        formula: gs * t / 60 * 2
      - id: d3
        formula: gs * t / 60 / 2
      - id: d4
        formula: gs * t
    presets:
      - id: p1
        values:
          t: 3
          gs: 120
      - id: p2
        values:
          t: 4
          gs: 150
      - id: p3
        values:
          t: 6
          gs: 90
    explanation: >-
      When the beacon moves from 45° to 90° left of the nose, the aircraft's
      track and the lines to the beacon form a right-angled triangle with two
      equal sides. The distance flown between the two observations is then the
      shortest distance from the NDB to the flight path.


      **Solution**


      - {{f: gs * t / 60}} = {{n: gs * t / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: multiplies the distance flown by 1.5, which does not
      match the triangle.

      - **{{d2}} NM**: doubles the distance flown.

      - **{{d3}} NM**: halves the distance flown.

      - **{{d4}} NM**: forgets to convert the minutes into hours, so the
      distance is 60 times too large.
- id: Q6CQOR36I
  docId: "061.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618148
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      An island is observed {{rel_left}}° to the left of the aircraft's
      longitudinal axis.


      - Aircraft heading: {{heading}}°M

      - Magnetic variation: {{variation}}°W


      What is the true bearing of the aircraft from the island?
    variables:
      - id: heading
        label: Aircraft heading (magnetic)
        unit: °M
      - id: rel_left
        label: Angle of the island to the left of the nose
        unit: °
      - id: variation
        label: Magnetic variation (west)
        unit: °W
    answer:
      formula: heading - rel_left - variation + 180
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: heading - rel_left + variation + 180
      - id: d2
        formula: heading - rel_left - variation
      - id: d3
        formula: heading + rel_left - variation + 180
      - id: d4
        formula: heading - rel_left + variation
    presets:
      - id: p1
        values:
          heading: 120
          rel_left: 15
          variation: 17
      - id: p2
        values:
          heading: 190
          rel_left: 30
          variation: 12
      - id: p3
        values:
          heading: 60
          rel_left: 20
          variation: 8
    explanation: >-
      A bearing is measured from the aircraft's nose, so the angle to the left
      is taken away from the heading to give the bearing of the island from the
      aircraft. Converting to a true bearing takes away the west variation. The
      bearing of the aircraft from the island is the reverse of that, so 180° is
      added.


      **Solution**


      - Bearing of the island from the aircraft, magnetic: {{heading}} -
      {{rel_left}} = {{= heading - rel_left}}°M

      - True bearing of the island from the aircraft: {{= heading - rel_left -
      variation}}°T

      - Reverse it: {{f: heading - rel_left - variation + 180}} = {{n: heading -
      rel_left - variation + 180}} = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: adds the west variation instead of taking it away.

      - **{{d2}}°T**: forgets to reverse the bearing, which gives the bearing of
      the island from the aircraft.

      - **{{d3}}°T**: adds the angle to the left to the heading instead of
      taking it away.

      - **{{d4}}°T**: applies the variation the wrong way and forgets to reverse
      the bearing.
