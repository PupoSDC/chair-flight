- id: QKKISRLY5
  docId: "061.02"
  relatedQuestions:
    - QL3QEE6YK
  externalIds:
    - ATPLQ-615104
    - AVEXAM-88975
    - ATPLGS-124488
    - AVEXAM-23155
    - ATPLGS-127764
  annexes: []
  learningObjectives:
    - 061.02.02.01.08
  template:
    type: calculation
    question: >-
      An aircraft flies from SALCO to BERRY HEAD and takes two relative bearings
      from locator PY.


      - Magnetic track: {{mt}}°

      - TAS: {{tas}} kt

      - Wind: {{wd}}° (T) / {{ws}} kt

      - Variation: {{vw}}° W

      - Deviation: +{{dev}}°

      - First relative bearing of PY: {{rb1}}°

      - Time between the bearings: {{t}} min

      - Second relative bearing of PY: {{rb2}}°


      Calculate the distance of the aircraft from locator PY at the second
      bearing.
    variables:
      - id: mt
        label: Magnetic track
        unit: °
      - id: vw
        label: Variation (west)
        unit: °
      - id: dev
        label: Deviation (east)
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: rb1
        label: First relative bearing
        unit: °
      - id: rb2
        label: Second relative bearing
        unit: °
      - id: t
        label: Time between bearings
        unit: min
    answer:
      formula: (tas * cos(asin(ws * sin(wd - (mt - vw)) / tas)) - ws * cos(wd - (mt -
        vw))) * t / 60 * sin(rb1 + asin(ws * sin(wd - (mt - vw)) / tas)) /
        sin(rb2 - rb1)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (tas * cos(asin(ws * sin(wd - (mt - vw)) / tas)) + ws * cos(wd - (mt -
          vw))) * t / 60 * sin(rb1 + asin(ws * sin(wd - (mt - vw)) / tas)) /
          sin(rb2 - rb1)
      - id: d2
        formula: (tas * cos(asin(ws * sin(wd - (mt - vw)) / tas)) - ws * cos(wd - (mt -
          vw))) * t * sin(rb1 + asin(ws * sin(wd - (mt - vw)) / tas)) / sin(rb2
          - rb1)
      - id: d3
        formula: (tas * cos(asin(ws * sin(wd - (mt - vw)) / tas)) - ws * cos(wd - (mt -
          vw))) * t / 60 * sin(rb1 + asin(ws * sin(wd - (mt - vw)) / tas)) *
          sin(rb2 - rb1)
      - id: d4
        formula: (tas * cos(asin(ws * sin(wd - (mt - vw)) / tas)) - ws * cos(wd - (mt -
          vw))) * t / 60 * sin(rb1) / sin(rb2 - rb1)
    presets:
      - id: p1
        values:
          mt: 7
          vw: 5
          dev: 2
          tas: 445
          wd: 50
          ws: 40
          rb1: 311
          rb2: 266
          t: 3
      - id: p2
        values:
          mt: 90
          vw: 3
          dev: 1
          tas: 380
          wd: 200
          ws: 25
          rb1: 320
          rb2: 260
          t: 4
    explanation: >-
      A relative bearing is measured from the nose, so it must be corrected for
      the crab angle before the sine rule can be used with the ground track. The
      wind triangle gives the crab angle and the ground speed along the track,
      and the sine rule then gives the distance at the second bearing.


      **Solution**


      True track: {{f: mt - vw}} = {{n: mt - vw}}°


      Crab angle: {{= asin(ws * sin(wd - (mt - vw)) / tas)}}°


      Ground speed: {{= tas * cos(asin(ws * sin(wd - (mt - vw)) / tas)) - ws *
      cos(wd - (mt - vw))}} kt


      Distance flown between the bearings: {{= (tas * cos(asin(ws * sin(wd - (mt
      - vw)) / tas)) - ws * cos(wd - (mt - vw))) * t / 60}} NM


      Distance at the second bearing = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: treats the headwind as a tailwind.

      - **{{d2}} NM**: forgets to convert the minutes to hours.

      - **{{d3}} NM**: multiplies by the sine of the bearing change instead of
      dividing by it.

      - **{{d4}} NM**: ignores the crab angle in the relative bearing.
