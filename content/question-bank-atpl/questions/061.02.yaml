- id: QL3QEE6YK
  docId: "061.02"
  relatedQuestions:
    - QKKISRLY5
    - QZWENX4LC
  externalIds:
    - ATPLQ-615322
    - ATPLGS-110553
    - AVEXAM-34917
    - ATPLGS-625603
    - ATPLQ-611092
    - ATPLGS-110467
    - AVEXAM-40133
  annexes: []
  learningObjectives:
    - 061.02.02.01.08
  template:
    type: calculation
    question: >-
      An aircraft takes two relative bearings from the same ground feature.


      - First relative bearing: {{rb1}}°

      - Time between the bearings: {{t}} min

      - Second relative bearing: {{rb2}}°

      - Ground speed: {{gs}} kt, no wind and no drift


      What is the distance from the aircraft to the feature at the time of the
      second bearing?
    variables:
      - id: rb1
        label: First relative bearing
        unit: °
      - id: rb2
        label: Second relative bearing
        unit: °
      - id: t
        label: Time between bearings
        unit: min
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: gs * t / 60 * sin(rb1) / sin(rb2 - rb1)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: gs * t / 60 * sqrt(2)
      - id: d2
        formula: gs * t / 60 * 2
      - id: d3
        formula: gs * t / 60 * cos(rb2 - rb1)
      - id: d4
        formula: gs * t
    presets:
      - id: p1
        values:
          rb1: 315
          rb2: 270
          t: 10
          gs: 240
      - id: p2
        values:
          rb1: 315
          rb2: 270
          t: 3
          gs: 180
    explanation: >-
      When two relative bearings are taken on the same feature, the distance
      from the feature at the second bearing follows from the distance flown
      between the bearings and the two bearing angles. With no wind and no
      drift, the bearing triangle is solved with the sine rule.


      **Solution**


      Distance flown between the bearings: {{f: gs * t / 60}} = {{n: gs * t /
      60}} NM


      Distance from the feature at the second bearing: {{f: gs * t / 60 *
      sin(rb1) / sin(rb2 - rb1)}} = {{n: gs * t / 60 * sin(rb1) / sin(rb2 -
      rb1)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: multiplies the distance flown by the square root of 2,
      which is not part of the bearing triangle.

      - **{{d2}} NM**: doubles the distance flown.

      - **{{d3}} NM**: uses the cosine of the bearing change instead of the sine
      ratio.

      - **{{d4}} NM**: forgets to convert minutes to hours.
