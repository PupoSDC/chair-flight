- id: QE0TELXUG
  docId: "061.02"
  relatedQuestions:
    - QYIKGDGY
  externalIds:
    - ATPLQ-617449
    - ATPLGS-127776
    - ATPLGS-628131
    - ATPLGS-110488
    - ATPLGS-110484
    - ATPLGS-110489
    - AVEXAM-17971
    - AVEXAM-12156
    - AVEXAM-48913
    - AVEXAM-41732
    - AVEXAM-40850
    - AVEXAM-36293
    - AVEXAM-70351
    - AVEXAM-32055
    - ATPLGS-110482
    - ATPLQ-614135
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      An island appears on the airborne weather radar display. Given the
      following information, determine the true bearing of the aircraft from the
      island:


      - Island relative to the aircraft's longitudinal axis: {{left}}° to the
      left

      - Magnetic heading (MH): {{mh}}°

      - Magnetic variation (VAR): {{var}}° (east positive, west negative)


      What is the true bearing of the aircraft from the island?
    variables:
      - id: mh
        label: magnetic heading
        unit: °
      - id: var
        label: magnetic variation
        unit: °
      - id: left
        label: island angle to the left
        unit: °
    answer:
      formula: ((mh + var - left + 180) - 360 * floor((mh + var - left + 180) / 360))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: ((mh + var - left) - 360 * floor((mh + var - left) / 360))
      - id: d2
        formula: ((mh - var - left + 180) - 360 * floor((mh - var - left + 180) / 360))
      - id: d3
        formula: ((mh + var + left + 180) - 360 * floor((mh + var + left + 180) / 360))
      - id: d4
        formula: ((mh - left + 180) - 360 * floor((mh - left + 180) / 360))
    presets:
      - id: p1
        values:
          mh: 276
          var: 10
          left: 60
      - id: p2
        values:
          mh: 20
          var: -25
          left: 30
      - id: p3
        values:
          mh: 135
          var: 8
          left: 45
    explanation: >-
      The true heading is the magnetic heading corrected by the variation (east
      positive). The island is seen at the true heading minus the angle to the
      left, so its bearing from the aircraft is that value, and the bearing of
      the aircraft from the island is the reciprocal: 180° is added and the
      result is kept between 0° and 360°.


      **Solution**


      True heading: {{mh}}° + {{var}}° = {{= mh + var}}°


      Bearing of the island from the aircraft: {{= mh + var}}° - {{left}}° = {{=
      mh + var - left}}°


      Reciprocal: {{= mh + var - left}}° + 180° = {{= mh + var - left + 180}}°,
      within 0° to 360°: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: gives the bearing of the island from the aircraft,
      forgetting the reciprocal.

      - **{{d2}}°**: applies the variation with the wrong sign.

      - **{{d3}}°**: adds the angle to the left instead of subtracting it, so
      the island is placed on the right.

      - **{{d4}}°**: forgets the variation completely.
