- id: QNMJMEXYV
  docId: "061.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616966
    - AVEXAM-46857
    - ATPLGS-110539
  annexes: []
  learningObjectives:
    - 061.02.02.01.08
  template:
    type: chart
    question: >-
      A ground feature was observed on a relative bearing of 325° and five
      minutes later on a relative bearing of 280°.


      The aircraft heading was 165°(M), variation 25°W, drift 10° Right and GS
      360 kts.


      What is the distance and true bearing of the aircraft from the feature
      when the relative bearing was 280°?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 30 NM and 240º.
        wrongAnswers:
          - 30 NM and 060º.
          - 40 NM and 110º.
          - 40 NM and 290º.
        explanation: >-
          The aircraft flew for 5 minutes at 360 kt, which is 30 NM.


          The heading in true is 165° − 25° = 140°. The first bearing was 140° +
          325° = 105°T, and the second 140° + 280° = 060°T. With the track of
          150° (drift 10° right) the triangle has angles of 45° at the first
          position, 90° at the second, and 45° at the feature.


          So the second position is **30 NM** from the feature, and the aircraft
          is on the reciprocal bearing, 060° + 180° = **240°**.
