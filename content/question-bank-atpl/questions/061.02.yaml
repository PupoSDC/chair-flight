- id: QPL0MTSSR
  docId: "061.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615958
    - AVEXAM-48913
    - AVEXAM-32055
    - ATPLGS-110482
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: |-
      The island is observed in the following position.

      - Relative bearing: {{rb}}° right
      - Magnetic heading: {{mh}}°M
      - Variation: {{var_e}}°E

      What is the true bearing of the aircraft from the island?
    variables:
      - id: mh
        label: magnetic heading
        unit: °
      - id: var_e
        label: variation (east)
        unit: °
      - id: rb
        label: relative bearing (right)
        unit: °
    answer:
      formula: (mh + var_e + rb + 180) - 360 * floor((mh + var_e + rb + 180) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (mh - var_e + rb + 180) - 360 * floor((mh - var_e + rb + 180) / 360)
      - id: d2
        formula: (mh + var_e - rb + 180) - 360 * floor((mh + var_e - rb + 180) / 360)
      - id: d3
        formula: (mh + rb + 180) - 360 * floor((mh + rb + 180) / 360)
    presets:
      - id: p1
        values:
          mh: 355
          var_e: 15
          rb: 30
      - id: p2
        values:
          mh: 120
          var_e: 5
          rb: 45
      - id: p3
        values:
          mh: 80
          var_e: 10
          rb: 20
    explanation: >-
      The true heading is the magnetic heading corrected by the variation (east
      is added). Adding the relative bearing to the right gives the true bearing
      of the island from the aircraft. The bearing of the aircraft from the
      island is the reciprocal, so 180° is added. Results above 360° are reduced
      by 360°.


      **Solution**


      True heading = {{mh}}° + {{var_e}}° = {{= mh + var_e}}°


      Bearing of the island from the aircraft = {{= mh + var_e}}° + {{rb}}° =
      {{= mh + var_e + rb}}°


      Bearing of the aircraft from the island = {{= mh + var_e + rb}}° + 180° =
      {{= mh + var_e + rb + 180}}°, minus 360° = **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°**: applies the variation with the wrong sign (subtracts the
      east variation).

      - **{{d2}}°**: subtracts the relative bearing, as if the island were to
      the left.

      - **{{d3}}°**: ignores the variation.
