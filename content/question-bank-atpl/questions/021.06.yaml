- id: QDSMGKRF
  docId: "021.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-216549
    - BGS-211340
    - AVEXAM-70009
    - ATPLGS-105084
  annexes:
    - 021-standard-atmosphere-table-altitude-1000-to-45000-ft-temperature-pressure
  learningObjectives:
    - 021.06.03.01.11
  template:
    type: chart-calculation
    question: >-
      Refer to figure.


      The cabin altitude of an aeroplane is {{cab}} ft.


      Following a requirement to reduce the differential pressure to {{dp}} psi,
      what is the maximum aeroplane pressure altitude that can be maintained in
      order to maintain the same cabin altitude?


      Give the answer to the nearest 1000 ft (the pressure/altitude relation is
      the one shown in the figure).
    variables:
      - id: cab
        label: Cabin altitude
        unit: ft
      - id: dp
        label: Maximum differential pressure
        unit: psi
    chartInputs:
      - cab
      - dp
    answer:
      formula: round(145442 * (1 - ((14.696 * (1 - 0.0000068756 * cab) ^ 5.2559 - dp)
        / 14.696) ^ 0.190263) / 1000) * 1000
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round(145442 * (1 - ((14.696 - dp) / 14.696) ^ 0.190263) / 1000) * 1000
      - id: d2
        formula: round(145442 * (1 - ((dp) / 14.696) ^ 0.190263) / 1000) * 1000
      - id: d3
        formula: round(145442 * (1 - ((14.696 * (1 - 0.0000068756 * cab) ^ 5.2559 - dp /
          2) / 14.696) ^ 0.190263) / 1000) * 1000
      - id: d4
        formula: round(145442 * (1 - ((14.696 * (1 - 0.0000068756 * cab) ^ 5.2559 - 0.8
          * dp) / 14.696) ^ 0.190263) / 1000) * 1000
    presets:
      - id: p1
        values:
          cab: 6000
          dp: 7
      - id: p2
        values:
          cab: 6000
          dp: 8
      - id: p3
        values:
          cab: 8000
          dp: 8.6
    explanation: >-
      The cabin pressure is set by the cabin altitude. The outside (ambient)
      pressure is the cabin pressure minus the differential pressure; the
      pressure altitude at that ambient pressure is the maximum aeroplane
      altitude.


      **Solution**


      Cabin pressure at {{cab}} ft = {{= 14.696 * (1 - 0.0000068756 * cab) ^
      5.2559}} psi


      Ambient pressure = cabin pressure - {{dp}} psi = {{= 14.696 * (1 -
      0.0000068756 * cab) ^ 5.2559 - dp}} psi


      Pressure altitude at this ambient pressure = **{{answer}} ft**


      **Why the other answers are wrong**

      - **{{d1}} ft**: takes the cabin pressure as sea-level pressure (14.696
      psi) and ignores the cabin altitude.

      - **{{d2}} ft**: takes the differential pressure itself as the ambient
      pressure.

      - **{{d3}} ft**: uses only half of the differential pressure.

      - **{{d4}} ft**: uses only 80 % of the differential pressure.
