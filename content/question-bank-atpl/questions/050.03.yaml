  template:
    type: chart
    question: "Air temperature is {{temp}} °C and the dew point is {{dewp}} °C.
      Determine the relative humidity from the table:"
    explanation: ""
    variables:
      - id: temp
        label: Air temperature
        unit: °C
      - id: dewp
        label: Dew point
        unit: °C
    entries:
      - id: e1
        values:
          temp: 18
          dewp: 12
        answer: 70%
        wrongAnswers:
          - 80%
          - 33%
          - 66%
        explanation: >-
          Relative humidity is the amount of water vapour in the air compared
          with the most it could hold at that temperature. The table gives it
          from the air temperature and the dew point together.


          **Solution**


          - Find the row for the air temperature of {{temp}} °C.

          - Find the column for the dew point of {{dewp}} °C.

          - The relative humidity where they meet is **70%**.


          **Why the other answers are wrong**


          - **80%**: a higher humidity than the table gives for this air
          temperature and dew point.

          - **33%**: a much drier value, which would need a far larger gap
          between the two temperatures.

          - **66%**: a value read from the wrong place in the table.
