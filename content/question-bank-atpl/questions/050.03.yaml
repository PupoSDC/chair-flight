    - 050.03.01.03.02
  template:
    type: calculation
    question: |-
      The air is described below.

      - Maximum water vapour content: {{max}} g/kg
      - Actual water vapour content: {{actual}} g/kg

      What is the relative humidity?
    variables:
      - id: actual
        label: Actual water vapour content
        unit: g/kg
      - id: max
        label: Maximum water vapour content
        unit: g/kg
    answer:
      formula: actual / max * 100
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: actual
      - id: d2
        formula: 100 - actual / max * 100
      - id: d3
        formula: max / actual * 100
      - id: d4
        formula: actual / max * 10
    presets:
      - id: p1
        values:
          actual: 15
          max: 20
      - id: p2
        values:
          actual: 12
          max: 25
      - id: p3
        values:
          actual: 6
          max: 30
    explanation: >-
      Relative humidity compares the water vapour actually in the air with the
      most the air could hold at the same temperature. It is given as a
      percentage.


      **Solution**


      {{f: actual / max * 100}} = {{n: actual / max * 100}} = **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: the actual content is used without comparing it with the
      maximum.

      - **{{d2}}%**: the result is subtracted from 100, which gives the missing
      part of saturation instead of the humidity.

      - **{{d3}}%**: the ratio is inverted.

      - **{{d4}}%**: the wrong factor is used (10 instead of 100).
