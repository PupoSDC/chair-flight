  template:
    type: calculation
    question: >-
      Use the air temperature and the dew point to estimate the relative
      humidity.


      - Air temperature: {{temp}} °C

      - Dew point: {{dew}} °C


      What is the approximate relative humidity?
    variables:
      - id: temp
        label: Air temperature
        unit: °C
      - id: dew
        label: Dew point
        unit: °C
    answer:
      formula: 100 - 5 * (temp - dew)
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: 100 - (temp - dew)
      - id: d2
        formula: 100 - 4 * (temp - dew)
      - id: d3
        formula: dew / temp * 100
      - id: d4
        formula: temp - dew
    presets:
      - id: p1
        values:
          temp: 21
          dew: 9
      - id: p2
        values:
          temp: 18
          dew: 12
      - id: p3
        values:
          temp: 30
          dew: 21
    explanation: >-
      Relative humidity falls by about 5 % for every degree Celsius between the
      air temperature and the dew point, which is called the spread. This is a
      quick approximation, not an exact value from a table.


      **Solution**


      Spread: {{= temp - dew}} °C


      {{f: 100 - 5 * (temp - dew)}} = {{n: 100 - 5 * (temp - dew)}} =
      **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: the factor of 5 is forgotten.

      - **{{d2}}%**: a factor of 4 is used instead of 5.

      - **{{d3}}%**: the dew point is divided by the temperature instead of
      using the spread.

