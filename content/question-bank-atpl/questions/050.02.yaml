  template:
    type: definition
    question: What is a {term}?
    explanation: ""
    options:
      - id: OGTGA8X2V
        term: Polar Depression
        definition: Small depression over the sea with wintery showery precipitation.
      - id: OZTXH7UEQ
        term: stormscope
        definition: An instrument on board an aircraft to detect electrical discharges.
      - id: ODFDRVL04
        term: SPECI
        definition: A special aerodrome weather report, issued when a significant change
          of the weather conditions have been observed.
      - id: OXUB4B3BY
        term: Surface wind
        definition: It is the airflow near to the surface that is reduced in strength by
          the effect of friction.
      - id: OWD7L2K2J
        term: Clear Air Turbulence
        definition: The erratic movement of air in the absence of any significant visual
          clues is caused by bodies of air moving at very different speeds.
      - id: OFBTRKDNJ
        term: CAT
        definition: Turbulence at high levels in clear air.
      - id: OIFNAXS1T
        term: cold-air drop
        definition: A low pressure area with colder air compared to its surroundings. It
          can be found by looking at upper contour charts.
      - id: OKB07RBGF
        term: Foehn wind
        definition: It is an adiabatically heated wind blowing down a mountain side. The
          temperature on the lee side is normally higher than on the windward
          side of the mountain at the same level.
      - id: OKIT0GXFR
        term: trend forecast
        definition: A landing forecast appended to METAR/SPECI, valid for 2 hours
      - id: OLRYKZLGY
        term: VOLMET broadcast
        definition: Provision, as appropriate, of current METAR, SPECI, TAF and SIGMET
          by means of continuous and repetitive voice broadcast.
      - id: OQA3BMUEF
        term: aerodrome warning
        definition: A message issued by a meteorological office concerning the
          meteorological conditions which could adversely affect aircraft on the
          ground, including parked aircraft, and the aerodrome facilities and
          services.
    fakeOptions:
      - id: F8VWCLVV40
        definition: Small depression over the north pole with wintery shower precipitation
      - id: F8VWCLVV41
        definition: Large depression over the south pole with wintery shower precipitation
      - id: F8VWCLVV42
        definition: Large depression over the sea with clear weather
      - id: F8VWCLVV43
        definition: An instrument to detect wind shear by means of the Doppler-effect
          during flight.
      - id: F8VWCLVV44
        definition: An instrument to measure wind velocity.
      - id: F8VWCLVV45
        definition: The technical term (jargon) for a radar scope showing thunderstorms.
      - id: F8VWCLVV46
        definition: A routine aerodrome weather report issued every 3 hours.
      - id: F8VWCLVV47
        definition: A warning of meteorological dangers at an aerodrome, issued only
          when required.
      - id: F8VWCLVV48
        definition: An aerodrome forecast issued every 9 hours.
      - id: F8VWCLVV49
        definition: It is the wind that experiences an increase in the Coriolis effect
          brought about by the increase in friction near to the surface.
      - id: F8VWCLVV410
        definition: It is the wind that results when the pressure gradient in the layer
          of air near to the surface is reduced by the effect of friction.
      - id: F8VWCLVV411
        definition: It is the airflow near to the surface that slows down due to the
          effect of an increase in air density.
      - id: F8VWCLVV412
        definition: The violent interaction of different airflows, and it is encountered
          only in the upper troposphere around jet streams.
      - id: F8VWCLVV413
        definition: Principally an invisible vertical wind shear formed only when
          adjacent air currents have significantly different directions.
      - id: F8VWCLVV414
        definition: A rare phenomenon involving wind shear; It is usually found in the
          lower levels of the troposphere and is associated with strong
          inversions and thunderstorms.
      - id: F8VWCLVV415
        definition: Turbulence in the core of a jet stream in clear air, without clouds
          that indicate this threat.
      - id: F8VWCLVV416
        definition: Turbulence in the cloudy area above the frontal plane of a
          depression's warm front.
      - id: F8VWCLVV417
        definition: Turbulence in clouds, especially in thunderstorms where hail is
          formed by vertical wind shear.
      - id: F8VWCLVV418
        definition: A high pressure area with colder air compared to its surroundings.
          It can be found by looking at lower contour charts.
      - id: F8VWCLVV419
        definition: A low pressure area with colder air compared to its surroundings. It
          can be found by looking at lower contour charts.
      - id: F8VWCLVV420
        definition: A high pressure area with colder air compared to its surroundings.
          It can be found by looking at upper contour charts.
      - id: F8VWCLVV421
        definition: It is a flow of warm air up a slope of a hill caused by surface
          heating.
      - id: F8VWCLVV422
        definition: It is an adiabatically heated wind blowing down a mountain side. The
          temperature on the lee side is normally lower than on the windward
          side of the mountain at the same level.
      - id: F8VWCLVV423
        definition: It is a warm and moist anabatic wind that usually carries
          precipitation.
      - id: F8VWCLVV424
        definition: A route forecast valid for 24 hours
      - id: F8VWCLVV425
        definition: An aerodrome forecast valid for 9 hours
      - id: F8VWCLVV426
        definition: A routine report
      - id: F8VWCLVV427
        definition: That part of an ATIS which is concerned to meteorological information.
      - id: F8VWCLVV428
        definition: Information issued by a meteorological watch office concerning the
          occurrence or expected occurrence of specified enroute weather
          phenomena which may affect the safety of aircraft operations.
      - id: F8VWCLVV429
        definition: Weather information transmitted continuously via radio (special
          broadcast), containing weather information for one airport.
      - id: F8VWCLVV430
        definition: A message issued by a meteorological watch office concerning the
          occurrence and/or expected occurrence of specified en-route weather
          phenomena, which may affect the safety of aircraft operations.
      - id: F8VWCLVV431
        definition: A message prepared by a meteorological office concerning wind shear
          which could adversely affect aircraft on the approach or take-off
          path, or during a circling approach, between the runway level and a
          specified upper level, and aircraft on the runway during the landing
          roll or take-off run.
      - id: F8VWCLVV432
        definition: The part of a METAR message that is called supplementary information.
