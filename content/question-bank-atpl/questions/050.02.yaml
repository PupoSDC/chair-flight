  template:
    type: calculation
    question: What is the approximate speed of a {{kt}}-knot wind, expressed in m/s?
    variables:
      - id: kt
        label: Wind speed
        unit: kt
    answer:
      formula: kt / 2
      unit: m/s
      decimals: 0
    distractors:
      - id: d1
        formula: kt
      - id: d2
        formula: kt * 2
      - id: d3
        formula: kt * 1.852
      - id: d4
        formula: kt / 4
    presets:
      - id: p1
        values:
          kt: 20
      - id: p2
        values:
          kt: 40
      - id: p3
        values:
          kt: 30
    explanation: >-
      One knot is about 0.5144 m/s, so half the speed in knots gives a quick
      approximation of the speed in m/s.


      **Solution**


      {{f: kt / 2}} = {{n: kt / 2}} = **{{answer}} m/s**


      **Why the other answers are wrong**


      - **{{d1}} m/s**: the value in knots is copied without any conversion.

      - **{{d2}} m/s**: the speed is doubled instead of halved.

      - **{{d3}} m/s**: knots are multiplied by 1.852, the factor to km/h, which
      gives a value in km/h and not in m/s.

      - **{{d4}} m/s**: the speed is divided by 4 instead of 2.
