          vs1: 58
      - id: p3
        values:
          vs1: 62
    explanation: >-
      For single-engine aeroplanes (performance class B) the speed at the 50 ft
      screen height must be at least 1.2 times the stall speed VS1 in the
      take-off configuration. The result is rounded up to the next whole knot.


      **Solution**


      {{f: 1.2 * vs1}} = {{n: 1.2 * vs1}} = {{= 1.2 * vs1}} kt, rounded up to
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses a factor of 1.3 instead of 1.2.

      - **{{d2}} kt**: uses a factor of 1.1 instead of 1.2.

      - **{{d3}} kt**: uses a factor of only 1.05, which is too low for the 50
      ft screen height.
