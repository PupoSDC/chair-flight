- id: QHVMABMTM
  docId: "032.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-323379
  annexes: []
  learningObjectives:
    - "032.02"
  template:
    type: calculation
    question: >-
      Based on actual conditions, an aeroplane has the following performance
      take-off mass limitations:


      | FLAPS | **0º** | **10º** | **15º** |

      | ------ | ------- | ------- | ------- |

      | RUNWAY | {{r0}} kg | {{r10}} kg | {{r15}} kg |

      | CLIMB | {{c0}} kg | {{c10}} kg | {{c15}} kg |


      Structural limits: take-off/landing/zero fuel: {{smax}} kg


      The Maximum Take-off Mass is:
    variables:
      - id: r0
        label: Runway limit flaps 0
        unit: kg
      - id: r10
        label: Runway limit flaps 10
        unit: kg
      - id: r15
        label: Runway limit flaps 15
        unit: kg
      - id: c0
        label: Climb limit flaps 0
        unit: kg
      - id: c10
        label: Climb limit flaps 10
        unit: kg
      - id: c15
        label: Climb limit flaps 15
        unit: kg
      - id: smax
        label: Structural limit
        unit: kg
    answer:
      formula: min(smax, max(min(r0, c0), min(r10, c10), min(r15, c15)))
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: min(r15, c15)
      - id: d2
        formula: max(c0, c10, c15)
      - id: d3
        formula: min(r0, c0)
    presets:
      - id: p1
        values:
          r0: 4100
          r10: 4400
          r15: 4600
          c0: 4700
          c10: 4500
          c15: 4200
          smax: 4300
      - id: p2
        values:
          r0: 5100
          r10: 5400
          r15: 5700
          c0: 5900
          c10: 5600
          c15: 5200
          smax: 5500
    explanation: >-
      For each flap setting the take-off mass is limited by the lower of the
      runway limit and the climb limit. The best flap setting is the one that
      gives the highest of these values, and the structural limit then caps the
      result.


      **Solution**


      For each flap setting take the lower of runway and climb limit, choose the
      highest of the three, then compare it with the structural limit:


      {{f: min(smax, max(min(r0, c0), min(r10, c10), min(r15, c15)))}} = {{n:
      min(smax, max(min(r0, c0), min(r10, c10), min(r15, c15)))}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: takes the limit of flaps 15 only, which is not the best
      flap setting.

      - **{{d2}} kg**: takes the highest climb limit and ignores the runway and
      structural limits.

      - **{{d3}} kg**: takes the limit of flaps 0 only, which is not the best
      flap setting.
