  docId: "032.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-326861
    - AVEXAM-36327
    - BGS-320439
  annexes: []
  learningObjectives:
    - 032.02.01.01.02
  template:
    type: calculation
    question: >-
      According to CS-23, determine the minimum VR speed for a Class B
      twin-engine aeroplane, given:


      - VS: {{vs}} kt

      - VMC: {{vmc}} kt
    variables:
      - id: vs
        label: VS
        unit: kt
      - id: vmc
        label: VMC
        unit: kt
    answer:
      formula: max(1.05 * vmc, 1.1 * vs)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: 1.1 * vmc
      - id: d2
        formula: 1.05 * vs
      - id: d3
        formula: min(1.05 * vmc, 1.1 * vs)
      - id: d4
        formula: 1.2 * vs
    presets:
      - id: p1
        values:
          vs: 76
          vmc: 84
      - id: p2
        values:
          vs: 80
          vmc: 70
      - id: p3
        values:
          vs: 72
          vmc: 80
    explanation: >-
      For a CS-23 Class B twin, the rotation speed VR must not be less than the
      larger of 1.05 VMC and 1.10 VS.


      **Solution**


      {{f: max(1.05 * vmc, 1.1 * vs)}} = {{n: max(1.05 * vmc, 1.1 * vs)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: applies the 1.10 factor to VMC instead of 1.05.

      - **{{d2}} kt**: applies the 1.05 factor to VS instead of 1.10.

      - **{{d3}} kt**: takes the smaller of the two limits instead of the
      larger.

      - **{{d4}} kt**: uses 1.2 VS, which is the V2 factor, not the VR minimum.
