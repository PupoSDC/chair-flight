- id: QOPSSPJZ
  docId: "032.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328420
    - AVEXAM-62580
    - ATPLQ-322892
    - ATPLGS-127658
  annexes: []
  learningObjectives:
    - 032.02.03.01.07
  template:
    type: calculation
    question: >-
      A single-engine class B aeroplane has the following wind limitations:
      crosswind {{xw}} kt, headwind 30 kt, tailwind 10 kt.


      Consider a take-off from runway 20 (heading {{rwy}} degrees) with the wind
      from {{wdir}} degrees.


      Using trigonometry, determine the maximum wind speed that stays within the
      crosswind limit and allows take-off.


      Round down to a whole number of knots (use 2 decimal places in the
      intermediate calculation).
    variables:
      - id: xw
        label: Crosswind limit
        unit: kt
      - id: rwy
        label: Runway heading
        unit: deg
      - id: wdir
        label: Wind direction
        unit: deg
    answer:
      formula: floor(xw / sin(wdir - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(xw / sin(wdir - rwy))
      - id: d2
        formula: xw
      - id: d3
        formula: floor(xw / cos(wdir - rwy))
      - id: d4
        formula: floor(xw * sin(wdir - rwy))
    presets:
      - id: p1
        values:
          xw: 17
          rwy: 200
          wdir: 250
      - id: p2
        values:
          xw: 17
          rwy: 200
          wdir: 265
      - id: p3
        values:
          xw: 17
          rwy: 200
          wdir: 240
    explanation: >-
      The crosswind component is wind speed x sin(angle between wind and runway
      heading). The maximum wind speed that keeps the crosswind at the limit is
      therefore the limit divided by that sine, rounded down so that the limit
      is not exceeded.


      **Solution**


      Wind angle = {{wdir}} - {{rwy}} = {{= wdir - rwy}} degrees


      Maximum wind speed = {{f: xw / sin(wdir - rwy)}} = {{n: xw / sin(wdir -
      rwy)}} = {{= xw / sin(wdir - rwy)}} kt, rounded down to **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: rounds up, which would exceed the crosswind limit.

      - **{{d2}} kt**: simply takes the crosswind limit as the wind speed,
      ignoring the wind angle.

      - **{{d3}} kt**: uses cos instead of sin (headwind instead of crosswind
      component).

      - **{{d4}} kt**: multiplies by sin instead of dividing.
