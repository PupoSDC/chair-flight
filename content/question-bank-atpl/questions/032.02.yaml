    - BGS-320938
  annexes: []
  learningObjectives:
    - 032.02.04.01.03
  template:
    type: calculation
    question: >-
      For a single engine aeroplane, calculate the net glide distance following
      an engine failure. Given:


      - Altitude: {{alt}} ft

      - Terrain elevation: {{elev}} ft

      - Gross gradient: {{gross}} %

      - TAS: {{tas}} kt

      - Tailwind: {{tw}} kt


      Assume the net gradient is the gross gradient plus a 0.5 % decrement, and
      1 NM = 6 080 ft.


      Still air distance = (height difference (ft) x 100) / net gradient (%)

      Ground distance = still air distance x (GS / TAS)
    variables:
      - id: alt
        label: Altitude
        unit: ft
      - id: elev
        label: Terrain elevation
        unit: ft
      - id: gross
        label: Gross gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind
        unit: kt
    answer:
      formula: (alt - elev) * 100 / (gross + 0.5) / 6080 * (tas + tw) / tas
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: (alt - elev) * 100 / gross / 6080 * (tas + tw) / tas
      - id: d2
        formula: (alt - elev) * 100 / (gross + 0.5) / 6080
      - id: d3
        formula: (alt - elev) * 100 / (gross + 0.5) / 6080 * (tas - tw) / tas
      - id: d4
        formula: (alt - elev) * 100 / (gross + 0.5) / 6080 * tas / (tas + tw)
    presets:
      - id: p1
        values:
          alt: 9000
          elev: 250
          gross: 11
          tas: 101
          tw: 3
      - id: p2
        values:
          alt: 8000
          elev: 500
          gross: 10
          tas: 110
          tw: 10
      - id: p3
        values:
          alt: 10000
          elev: 300
          gross: 9
          tas: 95
          tw: 8
    explanation: >-
      In a glide the aeroplane covers a still-air distance set by the height
      available and the net glide gradient (the gross gradient made 0.5 %
      steeper to allow for the decrement). Wind then scales this distance by the
      ratio of ground speed to TAS; a tailwind increases the ground speed.


      **Solution**


      Height difference = {{alt}} - {{elev}} = {{= alt - elev}} ft


      Net gradient = {{gross}} + 0.5 = {{= gross + 0.5}} %


      Still air distance = {{= (alt - elev) * 100 / (gross + 0.5)}} ft = {{=
      (alt - elev) * 100 / (gross + 0.5) / 6080}} NM


      GS = {{tas}} + {{tw}} = {{= tas + tw}} kt


      {{f: (alt - elev) * 100 / (gross + 0.5) / 6080 * (tas + tw) / tas}} = {{n:
      (alt - elev) * 100 / (gross + 0.5) / 6080 * (tas + tw) / tas}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses the gross gradient without the 0.5 % decrement.

      - **{{d2}} NM**: gives the still-air distance and ignores the tailwind.

      - **{{d3}} NM**: subtracts the tailwind instead of adding it (headwind
      correction).

      - **{{d4}} NM**: inverts the ratio and uses TAS / GS instead of GS / TAS.
