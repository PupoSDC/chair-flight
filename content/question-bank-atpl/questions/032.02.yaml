    - AVEXAM-74967
    - AVEXAM-52316
    - ATPLGS-127658
  annexes:
    - CAP-698-page-52
  learningObjectives:
    - 032.02.03.01.07
  template:
    type: calculation
    question: >-
      Refer to the figure (CAP 698 file 4.1). Given the following information,
      what is the maximum allowed wind speed (round down to whole knots)?


      - Aeroplane maximum allowed crosswind component: {{cw}} kt

      - Runway direction: {{rwy}}°(M)

      - Wind direction: {{wd}}°(M)
    variables:
      - id: cw
        label: Max crosswind component
        unit: kt
      - id: rwy
        label: Runway direction
        unit: °
      - id: wd
        label: Wind direction
        unit: °
    answer:
      formula: floor(cw / abs(sin(wd - rwy)))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: floor(cw / abs(cos(wd - rwy)))
      - id: d2
        formula: floor(cw * abs(sin(wd - rwy)))
      - id: d3
        formula: floor(cw / abs(tan(wd - rwy)))
      - id: d4
        formula: floor(cw * abs(cos(wd - rwy)))
    presets:
      - id: p1
        values:
          cw: 25
          rwy: 240
          wd: 190
      - id: p2
        values:
          cw: 20
          rwy: 120
          wd: 170
      - id: p3
        values:
          cw: 20
          rwy: 90
          wd: 130
    explanation: >-
      The crosswind component is the wind speed times the sine of the angle
      between wind direction and runway direction. The maximum wind speed that
      keeps the crosswind within its limit is therefore the limit divided by
      that sine.


      **Solution**


      Angle = {{= abs(wd - rwy)}}°


      {{f: cw / abs(sin(wd - rwy))}} = {{n: cw / abs(sin(wd - rwy))}} = {{= cw /
      abs(sin(wd - rwy))}} kt, rounded down to **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the cosine (headwind component) instead of the sine
      of the angle.

      - **{{d2}} kt**: multiplies the limit by the sine instead of dividing,
      which gives the crosswind component of a wind equal to the limit.

      - **{{d3}} kt**: uses the tangent of the angle.

      - **{{d4}} kt**: multiplies by the cosine, a mix-up of the component
      formulas.
