    - BGS-321027
  annexes: []
  learningObjectives:
    - 032.02.04.01.03
  template:
    type: calculation
    question: >-
      A single-engined piston aeroplane is flying at an altitude of {{alt}} ft
      with a constant headwind component of {{hw}} kt. If the engine fails at
      this altitude, what is the expected net glide distance over the ground to
      an elevation of {{elev}} ft?


      - L/D: {{ld}}:1

      - TAS: {{tas}} kt


      Assume 1 NM = 6 080 ft and a 0.5 % decrement (net gradient = 100 / (L/D) +
      0.5 %).


      Still air distance = (height difference / net gradient) x 100

      Ground distance = still air distance x (GS / TAS)
    variables:
      - id: alt
        label: Altitude
        unit: ft
      - id: hw
        label: Headwind component
        unit: kt
      - id: elev
        label: Terrain elevation
        unit: ft
      - id: ld
        label: L/D ratio
        unit: ""
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: (alt - elev) * 100 / (100 / ld + 0.5) / 6080 * (tas - hw) / tas
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: (alt - elev) * 100 / (100 / ld + 0.5) / 6080
      - id: d2
        formula: (alt - elev) * 100 / (100 / ld + 0.5) / 6080 * (tas + hw) / tas
      - id: d3
        formula: (alt - elev) * 100 / (100 / ld) / 6080 * (tas - hw) / tas
      - id: d4
        formula: alt * 100 / (100 / ld + 0.5) / 6080 * (tas - hw) / tas
    presets:
      - id: p1
        values:
          alt: 5000
          hw: 25
          elev: 250
          ld: 9.1
          tas: 140
      - id: p2
        values:
          alt: 6000
          hw: 20
          elev: 300
          ld: 10
          tas: 130
      - id: p3
        values:
          alt: 4000
          hw: 15
          elev: 200
          ld: 8.5
          tas: 120
    explanation: >-
      The glide gradient follows from the lift-to-drag ratio (100 / (L/D) in %),
      made 0.5 % steeper for the decrement. The still-air distance is the height
      available divided by this net gradient; a headwind reduces the ground
      speed, so the ground distance is scaled by GS / TAS.


      **Solution**


      Height difference = {{= alt - elev}} ft


      Net gradient = 100 / {{ld}} + 0.5 = {{= 100 / ld + 0.5}} %


      GS = {{tas}} - {{hw}} = {{= tas - hw}} kt


      {{f: (alt - elev) * 100 / (100 / ld + 0.5) / 6080 * (tas - hw) / tas}} =
      {{n: (alt - elev) * 100 / (100 / ld + 0.5) / 6080 * (tas - hw) / tas}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: ignores the headwind (no GS / TAS correction).

      - **{{d2}} NM**: adds the headwind to the TAS as if it were a tailwind.

      - **{{d3}} NM**: omits the 0.5 % decrement.

      - **{{d4}} NM**: uses the full altitude instead of the height above the
      terrain.
