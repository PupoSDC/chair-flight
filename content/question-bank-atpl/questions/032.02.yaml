- id: QFLMMMFQ
  docId: "032.02"
  relatedQuestions:
    - Q7T8VCJFM
  externalIds:
    - ATPLQ-327057
    - AVEXAM-80881
    - AVEXAM-55288
    - AVEXAM-83780
  annexes:
    - 032-airfield-diagram-with-crossing-runways-09-27-and-18-36
  learningObjectives:
    - 032.02.04.01.02
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. Given the following information, calculate the
      obstacle clearance for a departure on the runway track from runway 27 in a
      class B SEP aircraft:


      - Climb gradient: {{gradient}} %

      - TAS: {{tas}} kt

      - Wind: {{wdir}} degrees / {{wspd}} kt

      - Runway heading: {{rwy}} degrees


      1 NM = 6080 ft


      The ground distance to the obstacle ({{gd}} NM) and the obstacle height
      ({{obst}} ft) are the values read from the figure.


      Height gain = ((GD x gradient) / 100) x (TAS / GS). Give the obstacle
      clearance in ft.
    variables:
      - id: gradient
        label: Climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction
        unit: deg
      - id: wspd
        label: Wind speed
        unit: kt
      - id: rwy
        label: Runway heading
        unit: deg
      - id: gd
        label: Ground distance to obstacle (read from the figure)
        unit: NM
      - id: obst
        label: Obstacle height (read from the figure)
        unit: ft
    chartInputs:
      - gd
      - obst
    answer:
      formula: gd * 6080 * gradient / 100 * tas / (tas - wspd * cos(wdir - rwy)) - obst
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: gd * 6080 * gradient / 100 - obst
      - id: d2
        formula: gd * 6080 * gradient / 100 * tas / (tas + wspd * cos(wdir - rwy)) -
          obst
      - id: d3
        formula: gd * 6080 * gradient / 100 * tas / (tas - wspd * cos(wdir - rwy))
      - id: d4
        formula: gd * 6080 * gradient / 100 * tas / (tas - wspd) - obst
      - id: d5
        formula: gd * 6080 * gradient / 100 * tas / (tas - wspd * sin(wdir - rwy)) -
          obst
    presets:
      - id: p1
        values:
          gradient: 4.5
          tas: 115
          wdir: 230
          wspd: 14
          rwy: 270
          gd: 3
          obst: 152
      - id: p2
        values:
          gradient: 5
          tas: 120
          wdir: 200
          wspd: 10
          rwy: 270
          gd: 2.5
          obst: 300
      - id: p3
        values:
          gradient: 6
          tas: 125
          wdir: 330
          wspd: 16
          rwy: 270
          gd: 2
          obst: 250
    explanation: >-
      The obstacle clearance is the height gained at the obstacle minus the
      obstacle height. The headwind component follows from the wind angle
      relative to the runway heading, and it gives the ground speed used to
      correct the gained height by TAS/GS.


      **Solution**


      Headwind component = wind speed x cos(wind direction - runway heading) =
      {{= wspd * cos(wdir - rwy)}} kt


      GS = TAS - headwind = {{= tas - wspd * cos(wdir - rwy)}} kt


      Height gain = {{f: gd * 6080 * gradient / 100 * tas / (tas - wspd *
      cos(wdir - rwy))}} = {{= gd * 6080 * gradient / 100 * tas / (tas - wspd *
      cos(wdir - rwy))}} ft


      Clearance = {{= gd * 6080 * gradient / 100 * tas / (tas - wspd * cos(wdir
      - rwy))}} ft - {{obst}} ft = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the wind (TAS = GS).

      - **{{d2}} ft**: treats the headwind component as a tailwind.

      - **{{d3}} ft**: this is the height gain; the obstacle height was not
      subtracted.

      - **{{d4}} ft**: uses the full wind speed instead of its headwind
      component.

      - **{{d5}} ft**: uses sin instead of cos for the headwind component.
