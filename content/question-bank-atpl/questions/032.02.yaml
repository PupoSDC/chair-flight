      single-engine aeroplane with a VS1 of {{vs1}} kt?
    variables:
      - id: vs1
        label: VS1
        unit: kt
    answer:
      formula: ceil(1.2 * vs1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: ceil(1.3 * vs1)
      - id: d2
        formula: ceil(1.1 * vs1)
      - id: d3
        formula: ceil(1.05 * vs1)
    presets:
