  docId: "032.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-321900
    - AVEXAM-66533
    - BGS-321010
  annexes: []
  learningObjectives:
    - 032.02.01.01.02
  template:
    type: calculation
    question: >-
      What will be the V_REF speed for a Class B performance category
      single-engined piston aeroplane with a maximum take-off mass of 1633 kg,
      given the following stall speeds?


      - V_SO: {{vso}} kt

      - V_S1: {{vs1}} kt

      - V_S: {{vs}} kt
    variables:
      - id: vso
        label: V_SO
        unit: kt
      - id: vs1
        label: V_S1
        unit: kt
      - id: vs
        label: V_S
        unit: kt
    answer:
      formula: 1.3 * vso
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: 1.2 * vs1
      - id: d2
        formula: 1.3 * vs1
      - id: d3
        formula: 1.3 * vs
    presets:
      - id: p1
        values:
          vso: 60
          vs1: 63
          vs: 68
      - id: p2
        values:
          vso: 56
          vs1: 60
          vs: 64
      - id: p3
        values:
          vso: 50
          vs1: 53
          vs: 57
    explanation: >-
      For a Class B aeroplane the reference landing speed V_REF is 1.3 times the
      stall speed in the landing configuration, V_SO.


      **Solution**


      {{f: 1.3 * vso}} = {{n: 1.3 * vso}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses a factor of 1.2 applied to V_S1.

      - **{{d2}} kt**: applies 1.3 to V_S1 (clean/specified configuration)
      instead of V_SO (landing configuration).

      - **{{d3}} kt**: applies 1.3 to V_S instead of V_SO.
