- id: Q2JEDJUNZ
  docId: "032.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-328367
    - AVEXAM-88708
  annexes: []
  learningObjectives:
    - "032.02"
  template:
    type: calculation
    question: >-
      A high tension cable is located {{dist}} NM from the DER (departure end of
      runway). Calculate the obstacle clearance for a Class B single-engine
      piston aeroplane with the following conditions.


      - Climb gradient: {{grad}} %

      - TAS: {{tas}} kt

      - Tailwind component: {{tw}} kt

      - Cable height: {{oh}} ft


      What is the obstacle clearance over the cable (ft)?
    variables:
      - id: dist
        label: Distance to the cable from the DER
        unit: NM
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
      - id: oh
        label: Cable height
        unit: ft
    answer:
      formula: dist * 6080 * tas / (tas + tw) * grad / 100 + 50 - oh
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: dist * 6080 * tas / (tas + tw) * grad / 100 - oh
      - id: d2
        formula: dist * 6080 * tas / (tas + tw) * grad / 100 + 50
      - id: d3
        formula: dist * 6080 * grad / 100 + 50 - oh
      - id: d4
        formula: dist * 6080 * tas / (tas - tw) * grad / 100 + 50 - oh
    presets:
      - id: p1
        values:
          dist: 1
          grad: 5
          tas: 133
          tw: 10
          oh: 104
      - id: p2
        values:
          dist: 1.5
          grad: 4
          tas: 110
          tw: 5
          oh: 250
      - id: p3
        values:
          dist: 2
          grad: 5
          tas: 120
          tw: 10
          oh: 150
    explanation: >-
      A climb in a single-engine aeroplane gains height at the climb gradient
      over the distance flown. A tailwind makes the aeroplane cover more ground
      for the same air distance, so the height gained is corrected by TAS
      divided by groundspeed. The 50 ft screen height is added and the cable
      height is subtracted.


      **Solution**


      - Ground distance: {{= dist * 6080}} ft

      - Height gained over the ground distance: {{= dist * 6080 * tas / (tas +
      tw) * grad / 100}} ft

      - Obstacle clearance = height gained + 50 ft - cable height = **{{answer}}
      ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the 50 ft screen height is left out.

      - **{{d2}} ft**: the cable height is not subtracted.

      - **{{d3}} ft**: the tailwind correction (TAS / groundspeed) is left out.

      - **{{d4}} ft**: the tailwind is subtracted from the TAS instead of added
      to it.
