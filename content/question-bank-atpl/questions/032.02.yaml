- id: QKIUGGFA
  docId: "032.02"
  relatedQuestions: []
  externalIds:
    - ATPLQ-323002
    - AVEXAM-42860
  annexes: []
  learningObjectives:
    - 032.02.04.01.02
  template:
    type: calculation
    question: Following a take-off limited by the 50 ft screen height, a light
      twin-engine aircraft climbs on a gradient of {{grad}}%. What is the
      obstacle clearance margin above a {{oh}} ft obstacle (relative to the
      runway), situated {{dist}} NM from the 50 ft point? (1 NM = 6 080 ft)
    variables:
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: oh
        label: Obstacle height
        unit: ft
      - id: dist
        label: Distance from the 50 ft point
        unit: NM
    answer:
      formula: 50 + grad / 100 * dist * 6080 - oh
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: grad / 100 * dist * 6080 - oh
      - id: d2
        formula: grad / 100 * dist * 6080 - 50 - oh
      - id: d3
        formula: 50 + grad / 100 * dist * 1852 - oh
      - id: d4
        formula: 50 + grad / 100 * dist * 6080
    presets:
      - id: p1
        values:
          grad: 9
          oh: 800
          dist: 2
      - id: p2
        values:
          grad: 7
          oh: 500
          dist: 3
      - id: p3
        values:
          grad: 5
          oh: 900
          dist: 4
    explanation: >-
      After lift-off the aeroplane starts at the 50 ft screen height and then
      gains height at the climb gradient. The clearance is that height at the
      obstacle minus the obstacle height.


      **Solution**


      Height gain = {{= grad / 100 * dist * 6080}} ft


      {{f: 50 + grad / 100 * dist * 6080 - oh}} = {{n: 50 + grad / 100 * dist *
      6080 - oh}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the 50 ft screen height forgotten.

      - **{{d2}} ft**: the screen height subtracted instead of added.

      - **{{d3}} ft**: the distance converted with 1 NM = 1852 ft, but 1852 is
      the metre value.

      - **{{d4}} ft**: the obstacle height not subtracted.
