  template:
    type: calculation
    question: >-
      For a single-engine aeroplane, calculate the net glide distance following
      an engine failure. Given:


      - Altitude: {{alt}} ft

      - Terrain elevation: {{elev}} ft

      - Gross gradient: {{grad}}%

      - TAS: {{tas}} kt

      - Headwind: {{hw}} kt (a negative value is a tailwind)


      Still air distance = (height difference (ft) x 100) / net gradient (%)

      Ground distance = still air distance x (GS / TAS)

      Assume 1 NM = 6 080 ft.
    variables:
      - id: alt
        label: altitude
        unit: ft
      - id: elev
        label: terrain elevation
        unit: ft
      - id: grad
        label: gross gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: headwind
        unit: kt
    answer:
      formula: (alt - elev) * 100 / (grad + 0.5) / 6080 * (tas - hw) / tas
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: (alt - elev) * 100 / (grad + 0.5) / 6080
      - id: d2
        formula: (alt - elev) * 100 / (grad + 0.5) / 6080 * tas / (tas - hw)
      - id: d3
        formula: (alt - elev) * 100 / grad / 6080 * tas / (tas - hw)
      - id: d4
        formula: (alt - elev) * 100 / grad / 6080 * (tas - hw) / tas
      - id: d5
        formula: (alt - elev) * 100 / (grad - 0.5) / 6080 * (tas - hw) / tas
    presets:
      - id: p1
        values:
          alt: 9500
          elev: 500
          grad: 11
          tas: 250
          hw: 42
      - id: p2
        values:
          alt: 8000
          elev: 300
          grad: 10
          tas: 120
          hw: 20
      - id: p3
        values:
          alt: 7500
          elev: 0
          grad: 12
          tas: 180
          hw: 30
    explanation: >-
      After an engine failure the aeroplane glides at the net gradient, which is
      the gross gradient increased by 0.5% (the net glide path is steeper than
      the gross one). The still-air distance is the height above the terrain
      divided by that gradient, and it is converted to a ground distance with
      the groundspeed to TAS ratio, so a headwind shortens the glide.


      **Solution**


      Height difference = {{= alt - elev}} ft


      Net gradient = {{= grad + 0.5}}%


      GS = {{= tas - hw}} kt


      {{f: (alt - elev) * 100 / (grad + 0.5) / 6080 * (tas - hw) / tas}} = {{n:
      (alt - elev) * 100 / (grad + 0.5) / 6080 * (tas - hw) / tas}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: still-air distance, the wind correction GS / TAS is not
      applied.

      - **{{d2}} NM**: the ratio is inverted (TAS / GS), so a headwind wrongly
      lengthens the glide.

      - **{{d3}} NM**: gross gradient used instead of net, and the ratio is
      inverted.

      - **{{d4}} NM**: gross gradient used instead of the net gradient.

      - **{{d5}} NM**: the 0.5% is subtracted instead of added, giving a
      gradient that is too shallow.
