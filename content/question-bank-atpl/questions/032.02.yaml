- id: QOMGIMGP
  docId: "032.02"
  relatedQuestions:
    - QN15SH3NJ
  externalIds:
    - ATPLQ-327829
    - AVEXAM-59767
  annexes: []
  learningObjectives:
    - 032.02.04.01.03
  template:
    type: calculation
    question: >-
      A single engine aircraft has a gross glide gradient of {{gross}} %.


      Determine the net glide distance from {{h1}} ft to {{h2}} ft.


      Assume still air, a 0.5 % decrement (net gradient = gross gradient + 0.5
      %) and 1 NM = 6 080 ft.
    variables:
      - id: gross
        label: Gross glide gradient
        unit: "%"
      - id: h1
        label: Start altitude
        unit: ft
      - id: h2
        label: End altitude
        unit: ft
    answer:
      formula: (h1 - h2) * 100 / (gross + 0.5) / 6080
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: (h1 - h2) * 100 / gross / 6080
      - id: d2
        formula: (h1 - h2) * 100 / (gross - 0.5) / 6080
      - id: d3
        formula: h1 * 100 / (gross + 0.5) / 6080
      - id: d4
        formula: (h1 - h2) * 100 / (gross + 0.5)
    presets:
      - id: p1
        values:
          gross: 8
          h1: 10000
          h2: 2000
      - id: p2
        values:
          gross: 10
          h1: 8000
          h2: 1500
      - id: p3
        values:
          gross: 9
          h1: 12000
          h2: 3000
    explanation: >-
      The net glide gradient is the gross gradient plus the 0.5 % decrement. The
      still-air distance over the ground is the height lost divided by this
      gradient, converted to nautical miles.


      **Solution**


      Height lost = {{h1}} - {{h2}} = {{= h1 - h2}} ft


      Net gradient = {{gross}} + 0.5 = {{= gross + 0.5}} %


      {{f: (h1 - h2) * 100 / (gross + 0.5) / 6080}} = {{n: (h1 - h2) * 100 /
      (gross + 0.5) / 6080}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses the gross gradient without the decrement.

      - **{{d2}} NM**: subtracts the decrement instead of adding it, making the
      glide too shallow.

      - **{{d3}} NM**: uses the starting altitude instead of the height
      difference.

      - **{{d4}} NM**: forgets to convert feet to nautical miles (value is in
      feet).
