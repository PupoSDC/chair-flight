    question: "For planning purposes, determine the net distance travelled down to 4
      000 ft for a single-engine piston aircraft following an engine failure at
      8 000 ft. Given the following data: TAS: 120 kts GS: 150 kts Gross
      gradient of descent 11% Gross/net gradient decrement 0.5% Still air
      distance (ft) = (Height difference (ft) x 100) / % net gradient Ground
      distance = still air distance x (groundspeed / TAS)"
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 7.1 NM
        wrongAnswers:
          - 5.7 NM
          - 6.2 NM
          - 7.8 NM
        explanation: The net gradient is 11 + 0.5 = 11.5 %. The still-air distance for
          the 4 000 ft descent is 4 000 × 100 ÷ 11.5 = 34 783 ft, about 5.7 NM.
          Correcting for the wind multiplies it by 150 ÷ 120, giving about **7.1
          NM**.
