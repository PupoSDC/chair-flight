    - "062.01"
  template:
    type: calculation
    question: |-
      A radio wave has a wavelength of {{lam}} m.

      What is its frequency in MHz?
    variables:
      - id: lam
        label: Wavelength
        unit: m
    answer:
      formula: 300 / lam
      unit: MHz
      decimals: 1
    distractors:
      - id: d1
        formula: 300 / (lam * 10)
      - id: d2
        formula: 150 / lam
      - id: d3
        formula: lam / 300
      - id: d4
        formula: 300 / lam ^ 2
    presets:
      - id: p1
        values:
          lam: 8.25
      - id: p2
        values:
          lam: 3
      - id: p3
        values:
          lam: 15
    explanation: >-
      Frequency is the speed of light divided by the wavelength. The speed of
      light is 300 million m/s, so with the wavelength in metres the frequency
      in MHz is 300 divided by the wavelength.


      **Solution**


      - {{f: 300 / lam}} = {{n: 300 / lam}} = **{{answer}} MHz**


      **Why the other answers are wrong**


      - **{{d1}} MHz**: divides by an extra factor of ten.

      - **{{d2}} MHz**: uses half the speed of light.

      - **{{d3}} MHz**: inverts the ratio, dividing the wavelength by 300.

      - **{{d4}} MHz**: squares the wavelength instead of using it once.
- id: Q1L9RV4PY
  docId: "062.01"
  relatedQuestions:
    - QANSYZIAU
  externalIds:
    - ATPLQ-627668
    - BGS-621112
    - ATPLGS-116236
  annexes: []
  learningObjectives:
    - "062.01"
  template:
    type: calculation
    question: The frequency of a VOR is {{freq}} MHz. What is the corresponding
      wavelength, in metres?
    variables:
      - id: freq
        label: Frequency
        unit: MHz
    answer:
      formula: 300 / freq
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: 3000 / freq
      - id: d2
        formula: 30000 / freq
      - id: d3
        formula: 300000 / freq
      - id: d4
        formula: freq / 300
    presets:
      - id: p1
        values:
          freq: 117.5
      - id: p2
        values:
          freq: 121.5
      - id: p3
        values:
          freq: 108
    explanation: >-
      Radio waves travel at about 300 000 000 m/s. The wavelength in metres
      equals 300 divided by the frequency in MHz, so the two quantities are
      linked by one simple rule.


      **Solution**


      {{f: 300 / freq}} = {{n: 300 / freq}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: a result ten times too big, the decimal point has moved by
      one place.

      - **{{d2}} m**: a result a hundred times too big.

      - **{{d3}} m**: a result a thousand times too big, a wrong unit
      conversion.

      - **{{d4}} m**: inverts the formula and divides the frequency by 300.
