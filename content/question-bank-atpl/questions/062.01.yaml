    - BGS-620747
  annexes: []
  learningObjectives:
    - "062.01"
  template:
    type: calculation
    question: Which frequency corresponds to a wavelength of {{wl}} cm? Give the
      answer in MHz.
    variables:
      - id: wl
        label: Wavelength
        unit: cm
    answer:
      formula: 30000 / wl
      unit: MHz
      decimals: 0
    distractors:
      - id: d1
        formula: 300 / wl
      - id: d2
        formula: 3000 / wl
      - id: d3
        formula: 300 * wl / 100
      - id: d4
        formula: 15000 / wl
    presets:
      - id: p1
        values:
          wl: 12
      - id: p2
        values:
          wl: 3
      - id: p3
        values:
          wl: 75
    explanation: >-
      Radio waves travel at about 300 000 000 m/s, and frequency equals this
      speed divided by the wavelength. The wavelength is in cm, so it is first
      converted to metres (÷ 100), and the result is then given in MHz (÷ 1 000
      000).


      **Solution**


      {{f: 300000000 / (wl / 100)}} = {{n: 300000000 / (wl / 100)}} Hz =
      **{{answer}} MHz**


      **Why the other answers are wrong**


      - **{{d1}} MHz**: uses the wavelength in cm as if it were in metres.

      - **{{d2}} MHz**: uses 3000 instead of 30000, a factor of ten too small.

      - **{{d3}} MHz**: multiplies by the wavelength instead of dividing by it.

      - **{{d4}} MHz**: uses half the speed of the wave, so the frequency is
      halved.
