  template:
    type: calculation
    question: |-
      A radio wave has a frequency of {{freq}} kHz.

      What is its wavelength in metres?
    variables:
      - id: freq
        label: Frequency
        unit: kHz
    answer:
      formula: 300000 / freq
      unit: m
      decimals: 1
    distractors:
      - id: d1
        formula: 300 / freq
      - id: d2
        formula: 3000000 / freq
      - id: d3
        formula: 30000 / freq
      - id: d4
        formula: 150000 / freq
    presets:
      - id: p1
        values:
          freq: 400
      - id: p2
        values:
          freq: 427
      - id: p3
        values:
          freq: 1000
    explanation: >-
      Wavelength is the speed of light divided by the frequency. The speed of
      light is 300 000 km/s, or 3 × 10^8 m/s. A kilohertz is 1000 Hz, so with
      the frequency in kHz the wavelength in metres is 300 000 divided by the
      frequency.


      **Solution**


      - {{f: 300000 / freq}} = {{n: 300000 / freq}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: does not convert kHz to Hz, so the result is out by a
      factor of 1000.

      - **{{d2}} m**: has an extra factor of ten.

      - **{{d3}} m**: is a factor of ten too small.

      - **{{d4}} m**: gives half the wavelength.
