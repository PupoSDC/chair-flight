  template:
    type: calculation
    question: |-
      An airborne weather radar operates at a frequency of {{freq}} GHz.

      What is the corresponding wavelength in centimetres?
    variables:
      - id: freq
        label: Frequency
        unit: GHz
    answer:
      formula: 30 / freq
      unit: cm
      decimals: 1
    distractors:
      - id: d1
        formula: 300 / freq
      - id: d2
        formula: 30 * freq
      - id: d3
        formula: 3 / freq
      - id: d4
        formula: 15 / freq
    presets:
      - id: p1
        values:
          freq: 9.33
      - id: p2
        values:
          freq: 2.4
      - id: p3
        values:
          freq: 10.5
    explanation: >-
      Radio waves travel at the speed of light, about 300 000 km per second, so
      the wavelength is that speed divided by the frequency. With the frequency
      in GHz, the wavelength comes out in centimetres as 30 divided by the
      frequency.


      **Solution**


      - {{f: 30 / freq}} = {{n: 30 / freq}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: uses 300 instead of 30, which is out by a factor of ten.

      - **{{d2}} cm**: multiplies by the frequency instead of dividing.

      - **{{d3}} cm**: gives the wavelength in metres without converting it to
      centimetres.

      - **{{d4}} cm**: halves the wavelength.
