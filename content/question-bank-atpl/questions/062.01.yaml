  template:
    type: calculation
    question: What is the wavelength of a non-directional beacon (NDB) transmitting
      on {{freq}} kHz? Give the answer in metres.
    variables:
      - id: freq
        label: Frequency
        unit: kHz
    answer:
      formula: 300000 / freq
      unit: m
      decimals: 0
    distractors:
      - id: d1
        formula: 300000 / freq / 10
      - id: d2
        formula: 300000 / freq * 10
      - id: d3
        formula: 3000 / freq
      - id: d4
        formula: 300000 * freq
    presets:
      - id: p1
        values:
          freq: 375
      - id: p2
        values:
          freq: 300
    explanation: >-
      A radio wave travels at the speed of light, about 300 000 000 m/s. The
      wavelength is that speed divided by the frequency in hertz. The frequency
      is given in kHz, so the same result is found by dividing 300 000 by the
      frequency in kHz.


      **Solution**


      {{f: 300000 / freq}} = {{n: 300000 / freq}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: a factor of ten too small, the decimal point is in the
      wrong place.

      - **{{d2}} m**: a factor of ten too large.

      - **{{d3}} m**: uses 3 000 instead of 300 000 in the calculation.

      - **{{d4}} m**: multiplies by the frequency instead of dividing.
