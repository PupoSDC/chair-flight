  template:
    type: calculation
    question: "A dipole antenna in its simplest form, suited for a frequency of
      {{freq}} MHz, should have a length of (in cm):"
    variables:
      - id: freq
        label: Frequency
        unit: MHz
    answer:
      formula: 15000 / freq
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: 10000 / freq
      - id: d2
        formula: 30000 / freq
      - id: d3
        formula: 22500 / freq
      - id: d4
        formula: 7500 / freq
    presets:
      - id: p1
        values:
          freq: 110
      - id: p2
        values:
          freq: 121.5
      - id: p3
        values:
          freq: 146
    explanation: >-
      A simple dipole is half a wavelength long. The wavelength in metres equals
      300 divided by the frequency in MHz, so half the wavelength in cm equals
      15000 divided by the frequency in MHz.


      **Solution**


      {{f: 15000 / freq}} = {{n: 15000 / freq}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: a third of the wavelength instead of half of it.

      - **{{d2}} cm**: the full wavelength instead of half of it.

      - **{{d3}} cm**: three quarters of the wavelength.

      - **{{d4}} cm**: a quarter of the wavelength.
