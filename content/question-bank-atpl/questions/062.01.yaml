    - AVEXAM-408
  annexes: []
  learningObjectives:
    - "062.01"
  template:
    type: calculation
    question: |-
      A radio signal has a frequency of {{freq}} MHz.

      What is its wavelength in metres?
    variables:
      - id: freq
        label: Frequency
        unit: MHz
    answer:
      formula: 300 / freq
      unit: m
      decimals: 2
    distractors:
      - id: d1
        formula: 3000 / freq
      - id: d2
        formula: 30 / freq
      - id: d3
        formula: 150 / freq
      - id: d4
        formula: freq / 300
    presets:
      - id: p1
        values:
          freq: 121.95
      - id: p2
        values:
          freq: 118.7
      - id: p3
        values:
          freq: 130
    explanation: >-
      Wavelength is the speed of light divided by the frequency. The speed of
      light is 300 million m/s, so with the frequency in MHz the wavelength in
      metres is 300 divided by the frequency.


      **Solution**


      - {{f: 300 / freq}} = {{n: 300 / freq}} = **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: has an extra factor of ten.

      - **{{d2}} m**: is a factor of ten too small.

      - **{{d3}} m**: gives half the wavelength.

      - **{{d4}} m**: inverts the ratio, dividing the frequency by 300.
