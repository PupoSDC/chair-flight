    - ATPLQ-622294
  annexes: []
  learningObjectives:
    - "062.01"
  template:
    type: calculation
    question: The pilot of an aircraft changes heading to the right, from {{h1}}° to
      {{h2}}°, taking the shortest way, and makes a rate-1 turn (3° per second).
      What is the duration of this manoeuvre, in seconds?
    variables:
      - id: h1
        label: Initial heading
        unit: °
      - id: h2
        label: Final heading
        unit: °
    answer:
      formula: abs(h2 - h1) / 3
      unit: s
      decimals: 0
    distractors:
      - id: d1
        formula: abs(h2 - h1) / 4
      - id: d2
        formula: abs(h2 - h1) / 6
      - id: d3
        formula: abs(h2 - h1) / 2
      - id: d4
        formula: abs(h2 - h1) / 3 + 10
    presets:
      - id: p1
        values:
          h1: 214
          h2: 334
      - id: p2
        values:
          h1: 100
          h2: 190
    explanation: >-
      A rate-1 turn is a turn at 3° per second, whatever the bank angle or true
      airspeed. The duration is therefore the heading change divided by 3.
      Taking the shortest way round, the heading changes by {{= abs(h2 - h1)}}°.


      **Solution**


      {{f: abs(h2 - h1) / 3}} = {{n: abs(h2 - h1) / 3}} = **{{answer}} s**


      **Why the other answers are wrong**


      - **{{d1}} s**: uses 4° per second instead of 3°.

      - **{{d2}} s**: uses 6° per second, a rate-2 turn.

      - **{{d3}} s**: uses 2° per second.

      - **{{d4}} s**: adds 10 seconds to the correct time.
