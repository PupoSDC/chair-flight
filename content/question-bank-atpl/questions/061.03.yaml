        unit: "'"
      - id: lon_b_d
        label: Longitude of B, degrees
        unit: °
      - id: lon_b_m
        label: Longitude of B, minutes
        unit: "'"
    answer:
      formula: ((atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60))),
        sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) -
        (lon_b_d + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d +
        lon_a_m / 60) - (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) *
        (1 - cos(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))) /
        360))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: "270"
      - id: d2
        formula: 360 - ((atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m /
          60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60)
          - (lon_b_d + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d +
          lon_a_m / 60) - (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60))
          * (1 - cos(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))) /
          360))
      - id: d3
        formula: ((((atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60))),
          sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) -
          (lon_b_d + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d +
          lon_a_m / 60) - (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60))
          * (1 - cos(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))) /
          360)) + 180) - 360 * floor((((atan2(sin(((lon_a_d + lon_a_m / 60) -
          (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) * (1 -
          cos(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))) - 360 *
          floor((atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m /
          60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60)
          - (lon_b_d + lon_b_m / 60)))))) / 360)) + 180) / 360))
      - id: d4
        formula: atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60))),
          sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) -
          (lon_b_d + lon_b_m / 60)))))
    presets:
      - id: p1
        values:
          lat_d: 60
          lat_m: 0
          lon_a_d: 120
          lon_a_m: 0
          lon_b_d: 140
          lon_b_m: 30
      - id: p2
        values:
          lat_d: 50
          lat_m: 0
          lon_a_d: 130
          lon_a_m: 15
          lon_b_d: 150
          lon_b_m: 0
      - id: p3
        values:
          lat_d: 45
          lat_m: 0
          lon_a_d: 160
          lon_a_m: 0
          lon_b_d: 170
          lon_b_m: 30
    explanation: >-
      The great circle track leaves the route at an angle that changes along the
      way. For two positions on the same latitude, the initial track follows
      from the longitude difference and the latitude. The result is given from 0
      to 360°.


      **Solution**


      Longitude difference: {{= (lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m /
      60)}}°


      Track before correction: {{= atan2(sin(((lon_a_d + lon_a_m / 60) -
      (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d
      + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))}}°


      {{f: ((atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60))),
      sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) - (lon_b_d
      + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d + lon_a_m / 60) -
      (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d
      + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))) / 360))}} = {{n:
      ((atan2(sin(((lon_a_d + lon_a_m / 60) - (lon_b_d + lon_b_m / 60))),
      sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) - (lon_b_d
      + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d + lon_a_m / 60) -
      (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d
      + lon_a_m / 60) - (lon_b_d + lon_b_m / 60)))))) / 360))}} =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°**: due west is assumed instead of the great circle track.

      - **{{d2}}°**: the track is measured from the other side (360° minus the
      track).

      - **{{d3}}°**: the reciprocal track is used.

      - **{{d4}}°**: the negative angle is not converted to the range 0° to
      360°.
- id: QMYDT0CZ4
  docId: "061.03"
