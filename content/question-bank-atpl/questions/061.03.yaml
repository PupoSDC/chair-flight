- id: QITGR6KYT
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618657
    - BGS-610035
    - ATPLGS-110067
    - AVEXAM-34195
    - ATPLQ-618990
    - ATPLGS-625404
    - BGS-610036
    - AVEXAM-52595
    - ATPLQ-618406
  annexes: []
  learningObjectives:
    - 061.03.01.02.03
  template:
    type: calculation
    question: >-
      An aeroplane flies a great circle track from position A to position B. The
      positions are:


      - A: latitude {{lat1}}°, longitude {{lon1}}°

      - B: latitude {{lat2}}°, longitude {{lon2}}°


      Negative latitudes are south and negative longitudes are west.


      By how many degrees does the true track change between A and B?
    variables:
      - id: lat1
        label: Latitude A
        unit: °
      - id: lon1
        label: Longitude A
        unit: °
      - id: lat2
        label: Latitude B
        unit: °
      - id: lon2
        label: Longitude B
        unit: °
    answer:
      formula: abs(atan2(sin(((atan2(sin(lon1 - lon2) * cos(lat1), cos(lat2) *
        sin(lat1) - sin(lat2) * cos(lat1) * cos(lon1 - lon2)) + 180)) -
        (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) *
        cos(lat2) * cos(lon2 - lon1)))), cos(((atan2(sin(lon1 - lon2) *
        cos(lat1), cos(lat2) * sin(lat1) - sin(lat2) * cos(lat1) * cos(lon1 -
        lon2)) + 180)) - (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) *
        sin(lat2) - sin(lat1) * cos(lat2) * cos(lon2 - lon1))))))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: abs(lon2 - lon1)
      - id: d2
        formula: abs(lon2 - lon1) * cos((lat1 + lat2) / 2)
      - id: d3
        formula: abs(lat2 - lat1)
      - id: d4
        formula: abs(atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) -
          sin(lat1) * cos(lat2) * cos(lon2 - lon1)))
    presets:
      - id: p1
        values:
          lat1: -59
          lon1: -141
          lat2: -61
          lon2: -148
      - id: p2
        values:
          lat1: -59
          lon1: -142
          lat2: -61
          lon2: -148
      - id: p3
        values:
          lat1: 48
          lon1: 120
          lat2: 51
          lon2: 111
    explanation: >-
      A great circle is the shortest route between two points on the Earth. Its
      track changes continuously along the route, so the change in track is the
      difference between the track at B and the track at A.


      **Solution**


      Change in track = {{= abs(atan2(sin(((atan2(sin(lon1 - lon2) * cos(lat1),
      cos(lat2) * sin(lat1) - sin(lat2) * cos(lat1) * cos(lon1 - lon2)) + 180))
      - (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) *
      cos(lat2) * cos(lon2 - lon1)))), cos(((atan2(sin(lon1 - lon2) * cos(lat1),
      cos(lat2) * sin(lat1) - sin(lat2) * cos(lat1) * cos(lon1 - lon2)) + 180))
      - (atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) *
      cos(lat2) * cos(lon2 - lon1))))))}}° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses only the longitude difference and ignores that
      meridians converge towards the poles.

      - **{{d2}}°**: scales the longitude difference by the cosine of the mean
      latitude, a rhumb line shortcut that does not give the great circle track
      change.

      - **{{d3}}°**: uses the latitude difference instead of the track change.

      - **{{d4}}°**: gives the track at A instead of the change in track.
