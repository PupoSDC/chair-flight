- id: Q1SFIPPTE
  docId: "061.03"
  relatedQuestions:
    - QX6BTISKG
  externalIds:
    - ATPLQ-613397
    - ATPLGS-625634
    - AVEXAM-92225
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: |-
      Two waypoints lie on the same parallel of latitude:

      - Waypoint X: {{lat_d}}°{{lat_m}}'N, {{lon_a_d}}°{{lon_a_m}}'E
      - Waypoint Y: {{lat_d}}°{{lat_m}}'N, {{lon_b_d}}°{{lon_b_m}}'W

      What is the final great circle track at Y in °T?
    variables:
      - id: lat_d
        label: Latitude, degrees
        unit: °
      - id: lat_m
        label: Latitude, minutes
        unit: "'"
      - id: lon_a_d
        label: Longitude of X, degrees
        unit: °
      - id: lon_a_m
        label: Longitude of X, minutes
        unit: "'"
      - id: lon_b_d
        label: Longitude of Y, degrees
        unit: °
      - id: lon_b_m
        label: Longitude of Y, minutes
        unit: "'"
    answer:
      formula: atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))),
        sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) +
        (lon_b_d + lon_b_m / 60))))) + 180
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: ((atan2(sin((0 - ((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m /
          60)))), sin((lat_d + lat_m / 60)) * (1 - cos((0 - ((lon_a_d + lon_a_m
          / 60) + (lon_b_d + lon_b_m / 60))))))) - 360 * floor((atan2(sin((0 -
          ((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60)))), sin((lat_d +
          lat_m / 60)) * (1 - cos((0 - ((lon_a_d + lon_a_m / 60) + (lon_b_d +
          lon_b_m / 60))))))) / 360))
      - id: d2
        formula: 360 - (atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m /
          60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60)
          + (lon_b_d + lon_b_m / 60))))) + 180)
      - id: d3
        formula: ((atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))),
          sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) +
          (lon_b_d + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d +
          lon_a_m / 60) + (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60))
          * (1 - cos(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60)))))) /
          360))
      - id: d4
        formula: "90"
    presets:
      - id: p1
        values:
          lat_d: 53
          lat_m: 0
          lon_a_d: 175
          lon_a_m: 0
          lon_b_d: 175
          lon_b_m: 0
      - id: p2
        values:
          lat_d: 58
          lat_m: 30
          lon_a_d: 160
          lon_a_m: 0
          lon_b_d: 170
          lon_b_m: 0
      - id: p3
        values:
          lat_d: 48
          lat_m: 0
          lon_a_d: 170
          lon_a_m: 0
          lon_b_d: 160
          lon_b_m: 15
    explanation: >-
      The track changes along a great circle, so the final track at Y is the
      direction of the great circle as it arrives at Y. It is the reciprocal of
      the track from Y back towards X. The longitude difference across the date
      line is found by adding the two longitudes, as one is east and one is
      west.


      **Solution**


      Track from Y back towards X: {{= atan2(sin(((lon_a_d + lon_a_m / 60) +
      (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d
      + lon_a_m / 60) + (lon_b_d + lon_b_m / 60)))))}}°


      {{f: atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))),
      sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d + lon_a_m / 60) + (lon_b_d
      + lon_b_m / 60))))) + 180}} = {{n: atan2(sin(((lon_a_d + lon_a_m / 60) +
      (lon_b_d + lon_b_m / 60))), sin((lat_d + lat_m / 60)) * (1 - cos(((lon_a_d
      + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))))) + 180}} = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°**: the initial track at X is used instead of the final track
      at Y.

      - **{{d2}}°**: the reciprocal of the correct track is used.

      - **{{d3}}°**: the direction back towards X is used.

      - **{{d4}}°**: due east (the rhumb line track along a parallel) is used
      instead of the great circle track.
- id: Q2Z1XQKCS
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615508
    - ATPLGS-625400
    - BGS-610033
    - AVEXAM-28021
  annexes: []
  learningObjectives:
    - 061.03.02.01.01
  template:
    type: calculation
    question: >-
      In the Northern Hemisphere the rhumb line track from position A to
      position B is {{track}}°. The convergency is {{conv}}° and the difference
      in longitude is {{dlon}}°.


      What is the initial rhumb line track from B to A?
    variables:
      - id: track
        label: Rhumb line track from A to B
        unit: °
      - id: conv
        label: Convergency
        unit: °
      - id: dlon
        label: Difference in longitude
        unit: °
    answer:
      formula: track - 180
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: track - 180 + conv
      - id: d2
        formula: track - 180 + conv / 2
      - id: d3
        formula: track - 180 - conv / 2
      - id: d4
        formula: track - 180 - conv
    presets:
      - id: p1
        values:
          track: 230
          conv: 6
          dlon: 10
      - id: p2
        values:
          track: 310
          conv: 4
          dlon: 15
      - id: p3
        values:
          track: 200
          conv: 2
          dlon: 5
    explanation: >-
      A rhumb line has one constant track. The track back from B to A is
      therefore the reciprocal of the track from A to B, which is 180 degrees
      different. The convergency only matters for great circles and does not
      change a rhumb line track.


      **Solution**


      Reciprocal of {{track}}°: {{track}}° − 180° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the convergency is added to the reciprocal.

      - **{{d2}}°**: half the convergency is added.

      - **{{d3}}°**: half the convergency is subtracted.

      - **{{d4}}°**: the full convergency is subtracted.
