- id: QSMRN8FYT
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619391
  annexes: []
  learningObjectives:
    - 061.03.01.02.01
  template:
    type: calculation
    question: >-
      A pilot plans a flight from position A to position B via the shortest
      distance (great circle).


      - Position A: {{lat}}°N, {{lonA}}°E

      - Position B: {{lat}}°N, {{lonB}}°W


      What is the initial true track from A to B?
    variables:
      - id: lat
        label: Latitude
        unit: °
      - id: lonA
        label: Longitude of A (east)
        unit: °
      - id: lonB
        label: Longitude of B (west)
        unit: °
    answer:
      formula: 360 + atan2(0 - sin(lonA + lonB) * cos(lat), sin(lat) * cos(lat) * (1 -
        cos(lonA + lonB)))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: "270"
      - id: d2
        formula: 0 - atan2(0 - sin(lonA + lonB) * cos(lat), sin(lat) * cos(lat) * (1 -
          cos(lonA + lonB)))
      - id: d3
        formula: atan2(0 - sin(lonA + lonB) * cos(lat), sin(lat) * cos(lat) * (1 -
          cos(lonA + lonB))) + 180
      - id: d4
        formula: 180 - atan2(0 - sin(lonA + lonB) * cos(lat), sin(lat) * cos(lat) * (1 -
          cos(lonA + lonB)))
    presets:
      - id: p1
        values:
          lat: 37
          lonA: 10
          lonB: 10
      - id: p2
        values:
          lat: 50
          lonA: 20
          lonB: 5
      - id: p3
        values:
          lat: 60
          lonA: 5
          lonB: 15
    explanation: >-
      Along a parallel, the rhumb line runs due west (270°). The great circle
      between two points on the same parallel bends towards the nearer pole, so
      its initial track is north of west.


      **Solution**


      - Longitude difference from A to B: {{lonA}}° E to {{lonB}}° W, a total of
      {{= lonA + lonB}}° west

      - Great circle initial track at latitude {{lat}}°N: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the rhumb line along the parallel, which ignores the bend
      of the great circle.

      - **{{d2}}°**: the reciprocal bend, measured the wrong way round the
      compass.

      - **{{d3}}°**: the bend is added to the wrong half of the compass.

      - **{{d4}}°**: the mirror image of the true track about due north.
