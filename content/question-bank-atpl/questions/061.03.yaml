- id: QQ5U6NKQ0
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615875
    - AVEXAM-17548
  annexes: []
  learningObjectives:
    - 061.03.01.02.01
  template:
    type: calculation
    question: >-
      The aircraft flies a great circle from point A to point B.


      - Latitude of both points: {{lat}}°S

      - Longitude difference: {{dlon}}° (B is west of A)


      What is the true course of the aircraft on its arrival at B, to the
      nearest degree?
    variables:
      - id: lat
        label: latitude (south)
        unit: °
      - id: dlon
        label: longitude difference
        unit: °
    answer:
      formula: atan2(sin(dlon) * cos(lat), -sin(lat) * cos(lat) * (1 - cos(dlon))) + 180
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: "270"
      - id: d2
        formula: atan2(sin(dlon) * cos(lat), -sin(lat) * cos(lat) * (1 - cos(dlon)))
      - id: d3
        formula: 360 - atan2(sin(dlon) * cos(lat), -sin(lat) * cos(lat) * (1 -
          cos(dlon)))
      - id: d4
        formula: "284"
    presets:
      - id: p1
        values:
          lat: 45
          dlon: 20
      - id: p2
        values:
          lat: 60
          dlon: 30
      - id: p3
        values:
          lat: 30
          dlon: 40
    explanation: >-
      Between two points of the same latitude a great circle bends towards the
      pole, so its course on arrival differs from the rhumb line course of 270°.
      The course on arrival at B is the reciprocal of the course from B back to
      A.


      **Solution**


      Course from B back to A = {{= atan2(sin(dlon) * cos(lat), -sin(lat) *
      cos(lat) * (1 - cos(dlon)))}}°


      Course on arrival at B = {{f: atan2(sin(dlon) * cos(lat), -sin(lat) *
      cos(lat) * (1 - cos(dlon))) + 180}} = **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°**: the rhumb line course, which is a straight line on a
      Mercator chart and not the great circle.

      - **{{d2}}°**: the course from B back to A, i.e. the reciprocal of the
      course on arrival.

      - **{{d3}}°**: the initial course at A, not the course on arrival at B.

      - **{{d4}}°**: not produced by the great circle calculation.
- id: QQQWG9NXN
  docId: "061.03"
  relatedQuestions:
    - QYLZDRJ1M
  externalIds:
    - ATPLQ-612053
    - ATPLGS-625897
    - AVEXAM-59321
    - AVEXAM-8147
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: >-
      The rhumb line track from A to B is {{track}}°. Use the positions below to
      find the final true track along the great circle from A to B.


      - A: {{ad}}°{{am}}' N, {{ald}}°{{alm}}' E

      - B: {{bd}}°{{bm}}' N, {{bld}}°{{blm}}' E


      Give the final true track to the nearest whole degree.
    variables:
      - id: track
        label: rhumb line track
        unit: °
      - id: ad
        label: Latitude A
        unit: °
      - id: am
        label: Latitude A minutes
        unit: "'"
      - id: ald
        label: Longitude A
        unit: °
      - id: alm
        label: Longitude A minutes
        unit: "'"
      - id: bd
        label: Latitude B
        unit: °
      - id: bm
        label: Latitude B minutes
        unit: "'"
      - id: bld
        label: Longitude B
        unit: °
      - id: blm
        label: Longitude B minutes
        unit: "'"
    answer:
      formula: track - abs((ald + alm / 60) - (bld + blm / 60)) * sin((ad + am / 60 +
        bd + bm / 60) / 2) / 2
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: track + abs((ald + alm / 60) - (bld + blm / 60)) * sin((ad + am / 60 +
          bd + bm / 60) / 2) / 2
      - id: d2
        formula: track - abs((ald + alm / 60) - (bld + blm / 60)) * sin((ad + am / 60 +
          bd + bm / 60) / 2)
      - id: d3
        formula: track + abs((ald + alm / 60) - (bld + blm / 60)) * sin((ad + am / 60 +
          bd + bm / 60) / 2)
      - id: d4
        formula: track - abs((ald + alm / 60) - (bld + blm / 60)) * cos((ad + am / 60 +
          bd + bm / 60) / 2) / 2
    presets:
      - id: p1
        values:
          track: 250
          ad: 53
          am: 50
          ald: 6
          alm: 55
          bd: 53
          bm: 0
          bld: 3
          blm: 0
      - id: p2
        values:
          track: 280
          ad: 45
          am: 30
          ald: 20
          alm: 0
          bd: 40
          bm: 0
          bld: 10
          blm: 0
      - id: p3
        values:
          track: 310
          ad: 60
          am: 0
          ald: 5
          alm: 0
          bd: 58
          bm: 30
          bld: 25
          blm: 30
    explanation: >-
      On a great circle the track changes along the route. The rhumb line track
      lies midway between the initial and final great circle tracks, so the
      final track differs from the rhumb line track by half of the convergency.
      The convergency is the longitude difference multiplied by the sine of the
      mean latitude.


      **Solution**


      - Longitude difference = {{= abs((ald + alm / 60) - (bld + blm / 60))}}°

      - Mean latitude = {{= (ad + am / 60 + bd + bm / 60) / 2}}°

      - Convergency = {{= abs((ald + alm / 60) - (bld + blm / 60)) * sin((ad +
      am / 60 + bd + bm / 60) / 2)}}°

      - Final true track = {{f: track - abs((ald + alm / 60) - (bld + blm / 60))
      * sin((ad + am / 60 + bd + bm / 60) / 2) / 2}} = {{n: track - abs((ald +
      alm / 60) - (bld + blm / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2) /
      2}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: half the convergency was added instead of subtracted.

      - **{{d2}}°**: the full convergency was subtracted instead of half of it.

      - **{{d3}}°**: the full convergency was added to the rhumb line track.

      - **{{d4}}°**: the cosine of the mean latitude was used instead of the
      sine.
