      An aircraft passes position A on its route to position B. Both positions
      are on the same latitude:


      - Latitude: {{lat_d}}°{{lat_m}}'N

      - Longitude of A: {{lon_a_d}}°{{lon_a_m}}'W

      - Longitude of B: {{lon_b_d}}°{{lon_b_m}}'W


      What is the great circle track on departure from A in °T?
    variables:
      - id: lat_d
        label: Latitude, degrees
        unit: °
      - id: lat_m
        label: Latitude, minutes
        unit: "'"
      - id: lon_a_d
