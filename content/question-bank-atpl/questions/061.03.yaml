- id: QCXZZAIJ8
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615035
    - ATPLGS-625438
    - ATPLGS-625353
    - ATPLQ-611120
    - ATPLGS-625420
    - BGS-610068
    - AVEXAM-21552
    - AVEXAM-49752
    - BGS-610037
  annexes: []
  learningObjectives:
    - 061.03.01.02.01
  template:
    type: calculation
    question: >-
      Two positions are given in decimal degrees (north and east positive, south
      and west negative):


      - Position A: latitude {{lat1}}, longitude {{lon1}}

      - Position B: latitude {{lat2}}, longitude {{lon2}}


      What is the true track of the great circle at B, in the direction of
      travel from A to B?
    variables:
      - id: lat1
        label: Latitude of A
        unit: °
      - id: lon1
        label: Longitude of A
        unit: °
      - id: lat2
        label: Latitude of B
        unit: °
      - id: lon2
        label: Longitude of B
        unit: °
    answer:
      formula: (atan2(sin(lon1 - lon2) * cos(lat1), cos(lat2) * sin(lat1) - sin(lat2)
        * cos(lat1) * cos(lon1 - lon2)) + 180) - 360 * floor((atan2(sin(lon1 -
        lon2) * cos(lat1), cos(lat2) * sin(lat1) - sin(lat2) * cos(lat1) *
        cos(lon1 - lon2)) + 180) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan2(sin(lon1 - lon2) * cos(lat1), cos(lat2) * sin(lat1) - sin(lat2) *
          cos(lat1) * cos(lon1 - lon2)) - 360 * floor(atan2(sin(lon1 - lon2) *
          cos(lat1), cos(lat2) * sin(lat1) - sin(lat2) * cos(lat1) * cos(lon1 -
          lon2)) / 360)
      - id: d2
        formula: atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) *
          cos(lat2) * cos(lon2 - lon1)) - 360 * floor(atan2(sin(lon2 - lon1) *
          cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) * cos(lat2) * cos(lon2 -
          lon1)) / 360)
      - id: d3
        formula: (atan2(sin(lon1 - lon2) * cos(lat1), cos(lat2) * sin(lat1) - sin(lat2)
          * cos(lat1) * cos(lon1 - lon2)) + 180) - (lon1 - lon2) * sin((lat1 +
          lat2) / 2) / 2
    presets:
      - id: p1
        values:
          lat1: -56
          lon1: 163.953333
          lat2: -56
          lon2: -171.79
      - id: p2
        values:
          lat1: 53.833333
          lon1: 6.916667
          lat2: 53
          lon2: 15.666667
      - id: p3
        values:
          lat1: 45
          lon1: -30
          lat2: 50
          lon2: -10
    explanation: >-
      The track at B is the bearing of A seen from B, turned round by 180
      degrees. Both come from the two positions alone, using the spherical
      bearing formula.


      **Solution**


      The spherical bearing formula gives the bearing of A seen from B, and
      adding 180° gives the track at B: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the bearing of A seen from B is given, without turning it
      round.

      - **{{d2}}°**: the track at A is given instead of the track at B.

      - **{{d3}}°**: uses half the convergency, without the correction for the
      route crossing the 180° meridian.
- id: QD7ENRD4M
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615654
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: |-
      An aircraft is flying from A to B. Given the following information:

      - Position A: {{la_a_d}}°{{la_a_m}}’N, {{lo_a_d}}°{{lo_a_m}}’W
      - Position B: {{la_b_d}}°{{la_b_m}}’N, {{lo_b_d}}°{{lo_b_m}}’E
      - Rhumb line track: {{rhumb}}° (T)

      Determine the initial great circle track (°T).
    variables:
      - id: la_a_d
        label: Latitude A (degrees)
        unit: °
      - id: la_a_m
        label: Latitude A (minutes)
        unit: "'"
      - id: lo_a_d
        label: Longitude A (degrees)
        unit: °
      - id: lo_a_m
        label: Longitude A (minutes)
        unit: "'"
      - id: la_b_d
        label: Latitude B (degrees)
        unit: °
      - id: la_b_m
        label: Latitude B (minutes)
        unit: "'"
      - id: lo_b_d
        label: Longitude B (degrees)
        unit: °
      - id: lo_b_m
        label: Longitude B (minutes)
        unit: "'"
      - id: rhumb
        label: Rhumb line track
        unit: °T
    answer:
      formula: rhumb + (0.5 * (360 - (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m / 60)) *
        sin(((la_a_d + la_a_m / 60 + la_b_d + la_b_m / 60) / 2)))
      unit: °T
      decimals: 1
    distractors:
      - id: d1
        formula: rhumb - (0.5 * (360 - (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m / 60)) *
          sin(((la_a_d + la_a_m / 60 + la_b_d + la_b_m / 60) / 2)))
      - id: d2
        formula: rhumb + (360 - (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m / 60)) *
          sin(((la_a_d + la_a_m / 60 + la_b_d + la_b_m / 60) / 2))
      - id: d3
        formula: rhumb - (360 - (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m / 60)) *
          sin(((la_a_d + la_a_m / 60 + la_b_d + la_b_m / 60) / 2))
      - id: d4
        formula: rhumb
    presets:
      - id: p1
        values:
          la_a_d: 24
          la_a_m: 32
          lo_a_d: 166
          lo_a_m: 36
          la_b_d: 32
          la_b_m: 46
          lo_b_d: 173
          lo_b_m: 20
          rhumb: 295
      - id: p2
        values:
          la_a_d: 45
          la_a_m: 10
          lo_a_d: 160
          lo_a_m: 20
          la_b_d: 52
          la_b_m: 30
          lo_b_d: 175
          lo_b_m: 40
          rhumb: 280
      - id: p3
        values:
          la_a_d: 15
          la_a_m: 10
          lo_a_d: 150
          lo_a_m: 45
          la_b_d: 22
          la_b_m: 50
          lo_b_d: 170
          lo_b_m: 10
          rhumb: 305
    explanation: >-
      A rhumb line keeps a constant compass heading, but it is not the shortest
      route. The great circle is the shortest route, and its initial track
      differs from the rhumb track by half the longitude difference, multiplied
      by the sine of the mean latitude.


      **Solution**


      Longitude difference, the short way across the 180° meridian: {{= 360 -
      (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m / 60)}}°


      Mean latitude: {{= (la_a_d + la_a_m / 60 + la_b_d + la_b_m / 60) / 2}}°


      Correction: {{= 0.5 * (360 - (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m /
      60)) * sin((la_a_d + la_a_m / 60 + la_b_d + la_b_m / 60) / 2)}}°


      Great circle track = rhumb track + correction = {{rhumb}}° + {{= 0.5 *
      (360 - (lo_a_d + lo_a_m / 60 + lo_b_d + lo_b_m / 60)) * sin((la_a_d +
      la_a_m / 60 + la_b_d + la_b_m / 60) / 2)}}° = **{{answer}} °T**


      **Why the other answers are wrong**


      - **{{d1}} °T**: subtracts the correction instead of adding it, so the
      track turns the wrong way.

      - **{{d2}} °T**: applies the correction in full instead of half.

      - **{{d3}} °T**: applies the full correction in the wrong direction.

      - **{{d4}} °T**: is the rhumb line track, with no correction at all.
