- id: QCKISDZY
  docId: "061.03"
  relatedQuestions:
    - Q8GKQWOYW
  externalIds:
    - ATPLQ-617794
    - AVEXAM-3120
    - ATPLQ-614589
    - AVEXAM-77578
  annexes: []
  learningObjectives:
    - 061.03.01.02.03
  template:
    type: calculation
    question: >-
      Calculate the earth convergency, to the nearest whole degree, between two
      positions.


      - Position A: {{ad}}°{{am}}' N, {{ald}}°{{alm}}' W

      - Position B: {{bd}}°{{bm}}' N, {{bld}}°{{blm}}' E


      What is the earth convergency?
    variables:
      - id: ad
        label: Latitude A
        unit: °
      - id: am
        label: Latitude A minutes
        unit: "'"
      - id: ald
        label: Longitude A
        unit: °
      - id: alm
        label: Longitude A minutes
        unit: "'"
      - id: bd
        label: Latitude B
        unit: °
      - id: bm
        label: Latitude B minutes
        unit: "'"
      - id: bld
        label: Longitude B
        unit: °
      - id: blm
        label: Longitude B minutes
        unit: "'"
    answer:
      formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
        / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
          / 60)) * cos((ad + am / 60 + bd + bm / 60) / 2)
      - id: d2
        formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
          / 60))
      - id: d3
        formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
          / 60)) * sin(ad + am / 60)
      - id: d4
        formula: 2 * min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld +
          blm / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2)
    presets:
      - id: p1
        values:
          ad: 46
          am: 20
          ald: 5
          alm: 40
          bd: 62
          bm: 40
          bld: 13
          blm: 55
      - id: p2
        values:
          ad: 53
          am: 45
          ald: 177
          alm: 5
          bd: 65
          bm: 5
          bld: 161
          blm: 10
      - id: p3
        values:
          ad: 30
          am: 0
          ald: 40
          alm: 0
          bd: 50
          bm: 0
          bld: 10
          blm: 0
    explanation: >-
      Earth convergency is the angle between the meridians at the two positions.
      It equals the longitude difference, taken the short way round the globe,
      multiplied by the sine of the mean latitude.


      **Solution**


      Longitude difference (short way): {{= min(ald + alm / 60 + bld + blm / 60,
      360 - (ald + alm / 60 + bld + blm / 60))}}°


      Mean latitude: {{= (ad + am / 60 + bd + bm / 60) / 2}}°


      Convergency: {{= min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm /
      60 + bld + blm / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2)}}° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the cosine of the mean latitude instead of the sine.

      - **{{d2}}°**: forgets to multiply by the sine of the mean latitude.

      - **{{d3}}°**: uses the latitude of A only instead of the mean latitude.

      - **{{d4}}°**: doubles the result.
