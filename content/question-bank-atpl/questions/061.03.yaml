          var_ac: 6
          var_ndb: 4
      - id: p3
        values:
          track: 27.5
          var_ac: 14
          var_ndb: 10
    explanation: >-
      The magnetic bearing is the true bearing corrected for variation. Westerly
      variation is added to a true bearing to give a magnetic bearing. The
      bearing is taken at the aircraft, so the variation at the aircraft is
      used.


      **Solution**


      {{f: track + var_ac}} = {{n: track + var_ac}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the variation at the NDB is used instead of the variation
      at the aircraft.

      - **{{d2}}°**: the westerly variation is subtracted instead of added.

      - **{{d3}}°**: the reciprocal track is used.

      - **{{d4}}°**: the variation at the NDB is subtracted instead of added.
