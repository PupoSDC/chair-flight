    question: |-
      Two positions lie on the same parallel of latitude:

      - Latitude of both positions: {{lat}}°N
      - Difference in longitude: {{dlon}}°

      What is the Earth convergency between the two positions?
    variables:
      - id: lat
        label: Latitude
