- id: QZVHIKXTT
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615364
    - BGS-611267
    - ATPLGS-627949
    - AVEXAM-50049
  annexes: []
  learningObjectives:
    - 061.04.02.04.02
  template:
    type: calculation
    question: On a Lambert Conformal Chart with standard parallels at {{p1}}°N and
      {{p2}}°N, the initial track angle of an airway from point A ({{lat}}°N
      {{lonw}}°W) to a point B ({{lat2}}°N {{lone}}°E) is {{trk}}°(T). Determine
      the arrival track at B.
    variables:
      - id: p1
        label: first standard parallel
        unit: °
      - id: p2
        label: second standard parallel
        unit: °
      - id: lat
        label: latitude of A
        unit: °
      - id: lonw
        label: west longitude of A
        unit: °
      - id: lat2
        label: latitude of B
        unit: °
      - id: lone
        label: east longitude of B
        unit: °
      - id: trk
        label: initial track
        unit: °
    answer:
      formula: trk + (lonw + lone) * sin((p1 + p2) / 2)
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: trk - (lonw + lone) * sin((p1 + p2) / 2)
      - id: d2
        formula: trk + lonw + lone
      - id: d3
        formula: trk + (lonw + lone) * sin(lat2)
    presets:
      - id: p1
        values:
          p1: 40
          p2: 55
          lat: 54
          lonw: 15
          lat2: 57
          lone: 10
          trk: 68
      - id: p2
        values:
          p1: 40
          p2: 55
          lat: 52
          lonw: 10
          lat2: 55
          lone: 12
          trk: 75
      - id: p3
        values:
          p1: 40
          p2: 55
          lat: 50
          lonw: 20
          lat2: 53
          lone: 5
          trk: 60
    explanation: >-
      On a Lambert chart meridians converge with the cone constant n, so the
      track changes along the route by convergency = change of longitude x n,
      with n = ln(cos p1 / cos p2) / ln(tan(45 - p1/2) / tan(45 - p2/2)). Flying
      east in the northern hemisphere the track increases.


      **Solution**


      Change of longitude = {{= lonw + lone}}°, n = {{= sin((p1 + p2) / 2)}}


      Arrival track = {{trk}} + {{= (lonw + lone) * sin((p1 + p2) / 2)}} =
      **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°(T)**: the convergency is subtracted instead of added.

      - **{{d2}}°(T)**: the full change of longitude is used (n = 1).

      - **{{d3}}°(T)**: the sine of the latitude of B is used as the cone
      constant instead of the chart's n.
