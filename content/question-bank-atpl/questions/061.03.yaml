- id: QAIPAFDF
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617686
    - AVEXAM-70581
    - ATPLQ-619990
    - AVEXAM-11679
    - BGS-611671
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: >-
      A pilot is planning a flight from position C to position D. Given the
      following information (decimal degrees, north and east positive, south and
      west negative):


      - Position C: latitude {{lat_c}}, longitude {{lon_c}}

      - Position D: latitude {{lat_d}}, longitude {{lon_d}}

      - Great circle initial true track: {{gc}}°


      What is the rhumb line true track between the two positions?
    variables:
      - id: lat_c
        label: Latitude of C
        unit: °
      - id: lon_c
        label: Longitude of C
        unit: °
      - id: lat_d
        label: Latitude of D
        unit: °
      - id: lon_d
        label: Longitude of D
        unit: °
      - id: gc
        label: Great circle initial track
        unit: °
    answer:
      formula: gc + (lon_d - lon_c) * sin((lat_c + lat_d) / 2) / 2
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: gc + (lon_d - lon_c) * sin((lat_c + lat_d) / 2)
      - id: d2
        formula: gc - (lon_d - lon_c) * sin((lat_c + lat_d) / 2) / 2
      - id: d3
        formula: gc - (lon_d - lon_c) * sin((lat_c + lat_d) / 2)
      - id: d4
        formula: gc
    presets:
      - id: p1
        values:
          lat_c: 20
          lon_c: 12
          lat_d: 26
          lon_d: 30
          gc: 67
      - id: p2
        values:
          lat_c: -50
          lon_c: -40
          lat_d: -60
          lon_d: -50
          gc: 206
      - id: p3
        values:
          lat_c: 20
          lon_c: 0
          lat_d: 50
          lon_d: 14
          gc: 45
    explanation: >-
      The rhumb line track is the great circle track plus half the convergency.
      The convergency is the difference in longitude multiplied by the sine of
      the mean latitude.


      **Solution**


      Convergency: {{= (lon_d - lon_c) * sin((lat_c + lat_d) / 2)}}°, so the
      conversion angle is half of it: {{= (lon_d - lon_c) * sin((lat_c + lat_d)
      / 2) / 2}}°


      Rhumb line track: {{gc}}° plus the conversion angle = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the full convergency is added instead of half.

      - **{{d2}}°**: the conversion angle is subtracted instead of added.

      - **{{d3}}°**: the full convergency is subtracted.

      - **{{d4}}°**: the great circle track is taken as the rhumb line track.
