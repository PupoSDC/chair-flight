- id: QVGAEEAE
  docId: "061.03"
  relatedQuestions:
    - Q8CRJUFZJ
  externalIds:
    - ATPLQ-613858
    - ATPLGS-625521
    - AVEXAM-97242
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: >-
      A straight line route is drawn on a Direct Mercator chart from position A
      to position B. Positions are given in decimal degrees (north and east
      positive, south and west negative):


      - Position A: latitude {{lat1}}, longitude {{lon1}}

      - Position B: latitude {{lat2}}, longitude {{lon2}}

      - Rhumb line track measured at A: {{rhumb}}° T


      What is approximately the great circle track from A to B, measured at
      position A?
    variables:
      - id: lat1
        label: Latitude of A
        unit: °
      - id: lon1
        label: Longitude of A
        unit: °
      - id: lat2
        label: Latitude of B
        unit: °
      - id: lon2
        label: Longitude of B
        unit: °
      - id: rhumb
        label: Rhumb line track at A
        unit: °T
    answer:
      formula: rhumb - (lon2 - lon1) * sin((lat1 + lat2) / 2) / 2
      unit: ° T
      decimals: 0
    distractors:
      - id: d1
        formula: rhumb + (lon2 - lon1) * sin((lat1 + lat2) / 2) / 2
      - id: d2
        formula: rhumb - (lon2 - lon1) * sin((lat1 + lat2) / 2)
      - id: d3
        formula: rhumb
    presets:
      - id: p1
        values:
          lat1: 45.5
          lon1: -13.416667
          lat2: 41.7
          lon2: 3.95
          rhumb: 129
      - id: p2
        values:
          lat1: 40
          lon1: -10
          lat2: 35
          lon2: 5
          rhumb: 100
    explanation: >-
      The great circle track differs from the rhumb line track by the conversion
      angle, which is half the convergency. The convergency is the difference in
      longitude multiplied by the sine of the mean latitude.


      **Solution**


      Convergency: {{= (lon2 - lon1) * sin((lat1 + lat2) / 2)}}°, so the
      conversion angle is half of it: {{= (lon2 - lon1) * sin((lat1 + lat2) / 2)
      / 2}}°


      Great circle track at A: {{rhumb}}° minus the conversion angle =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the conversion angle is added instead of subtracted.

      - **{{d2}}**: the full convergency is subtracted instead of half.

      - **{{d3}}**: the rhumb line track is taken as the great circle track.
