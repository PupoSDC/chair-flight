- id: Q3KVSXAEJ
  docId: "061.03"
  relatedQuestions:
    - QAWGPLTE
    - QBXBILBU
  externalIds:
    - ATPLQ-618623
    - BGS-611452
    - AVEXAM-61516
    - AVEXAM-18863
  annexes: []
  learningObjectives:
    - 061.04.02.04.02
  template:
    type: calculation
    question: >-
      Crossing the North Atlantic on a westbound track from position X to
      position Y, which lies {{dlon}}° of longitude further west, the average
      true track is {{avg}}°.


      The Lambert chart has standard parallels at 30°N and 75°N.


      What is the approximate true track of the straight line at X?
    variables:
      - id: avg
        label: Average true track
        unit: °
      - id: dlon
        label: Longitude difference
        unit: °
    answer:
      formula: avg + dlon * sin((30 + 75) / 2) / 2
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: avg - dlon * sin((30 + 75) / 2) / 2
      - id: d2
        formula: avg
      - id: d3
        formula: avg + dlon * sin((30 + 75) / 2)
      - id: d4
        formula: avg + dlon / 2
    presets:
      - id: p1
        values:
          avg: 282.2
          dlon: 10
      - id: p2
        values:
          avg: 270
          dlon: 20
    explanation: >-
      On a Lambert chart a straight line keeps a constant angle to the chart
      grid, while the meridians converge. The track at the ends of the line
      differs from the average track by half the convergency. Convergency is
      approximately the longitude difference times the sine of the mean standard
      parallel, here (30 + 75) / 2 = 52.5°.


      **Solution**


      - Convergency = {{dlon}}° × sin 52.5° = {{= dlon * sin((30 + 75) / 2)}}°

      - Track at X = {{avg}}° + half the convergency = {{avg}}° + {{= dlon *
      sin((30 + 75) / 2) / 2}}° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: gives the track at Y, which has the opposite change.

      - **{{d2}}°**: ignores the convergency.

      - **{{d3}}°**: uses the full convergency instead of half of it.

      - **{{d4}}°**: adds half the longitude difference in degrees instead of
      the convergency.
