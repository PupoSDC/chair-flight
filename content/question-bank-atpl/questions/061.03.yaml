          dlon: 10
    explanation: >-
      The Earth convergency between two meridians is the difference in longitude
      multiplied by the sine of the latitude. Both positions lie on the same
      parallel, so the convergency depends only on the longitude difference and
      that latitude.


      **Solution**


      {{f: dlon * sin(lat)}}


      {{n: dlon * sin(lat)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the cosine instead of the sine of the latitude

      - **{{d2}}°**: divides by the sine of the latitude instead of multiplying

      - **{{d3}}°**: swaps the latitude and the longitude difference

