- id: QUOZQ4CWC
  docId: "061.03"
  relatedQuestions:
    - QK5EEREV9
  externalIds:
    - ATPLQ-612721
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: A pilot is flying from A {{lat}}°S, {{lonw}}°W to B {{lat}}°S,
      {{lone}}°E. What is the angle between the initial true great circle track
      and the true rhumb line track?
    variables:
      - id: lat
        label: latitude
        unit: °
      - id: lonw
        label: west longitude of A
        unit: °
      - id: lone
        label: east longitude of B
        unit: °
    answer:
      formula: (360 - lonw - lone) / 2 * sin(lat)
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: (360 - lonw - lone) * sin(lat)
      - id: d2
        formula: (360 - lonw - lone) / 2
      - id: d3
        formula: (360 - lonw - lone) / 2 * cos(lat)
      - id: d4
        formula: (lone - lonw) / 2 * sin(lat)
    presets:
      - id: p1
        values:
          lat: 60
          lonw: 165
          lone: 177
      - id: p2
        values:
          lat: 50
          lonw: 170
          lone: 160
      - id: p3
        values:
          lat: 40
          lonw: 150
          lone: 170
    explanation: >-
      The angle between the great circle and the rhumb line is half the
      convergency. The convergency is the longitude difference multiplied by the
      sine of the latitude. Here the route crosses the date line, so the
      longitude difference is 360 minus the two longitudes.


      **Solution**


      Longitude difference: 360 - {{lonw}} - {{lone}} = {{= 360 - lonw - lone}}°


      Angle: {{f: (360 - lonw - lone) / 2 * sin(lat)}} = {{n: (360 - lonw -
      lone) / 2 * sin(lat)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the full convergency is used, without halving it.

      - **{{d2}}°**: the latitude factor is forgotten.

      - **{{d3}}°**: the cosine of the latitude is used instead of the sine.

      - **{{d4}}°**: the difference between the two longitudes is used instead
      of the distance across the date line.
