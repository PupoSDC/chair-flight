- id: Q8CRJUFZJ
  docId: "061.03"
  relatedQuestions:
    - QVGAEEAE
  externalIds:
    - ATPLQ-615349
    - ATPLQ-616233
    - ATPLGS-625438
    - ATPLGS-625353
    - ATPLQ-613465
    - ATPLGS-626203
    - AVEXAM-3625
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: >-
      Two positions are given in decimal degrees (north and east positive, south
      and west negative):


      - Position A: latitude {{lat1}}, longitude {{lon1}}

      - Position B: latitude {{lat2}}, longitude {{lon2}}

      - Rhumb line track from A to B: {{rhumb}}°


      What is the initial true track of the great circle at A?
    variables:
      - id: lat1
        label: Latitude of A
        unit: °
      - id: lon1
        label: Longitude of A
        unit: °
      - id: lat2
        label: Latitude of B
        unit: °
      - id: lon2
        label: Longitude of B
        unit: °
      - id: rhumb
        label: Rhumb line track
        unit: °
    answer:
      formula: atan2(sin(lon2 - lon1) * cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) *
        cos(lat2) * cos(lon2 - lon1)) - 360 * floor(atan2(sin(lon2 - lon1) *
        cos(lat2), cos(lat1) * sin(lat2) - sin(lat1) * cos(lat2) * cos(lon2 -
        lon1)) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: rhumb + (lon2 - lon1) * sin((lat1 + lat2) / 2) / 2
      - id: d2
        formula: rhumb
      - id: d3
        formula: rhumb - (lon2 - lon1) * sin((lat1 + lat2) / 2)
      - id: d4
        formula: rhumb + (lon2 - lon1) * sin((lat1 + lat2) / 2)
    presets:
      - id: p1
        values:
          lat1: 53.833333
          lon1: 6.916667
          lat2: 53
          lon2: 15.666667
          rhumb: 99
      - id: p2
        values:
          lat1: -60
          lon1: 11
          lat2: -60
          lon2: -9
          rhumb: 270
      - id: p3
        values:
          lat1: 40
          lon1: -30
          lat2: 45
          lon2: -10
          rhumb: 60
    explanation: >-
      A great circle leaves a point at a different angle from the rhumb line
      between the same two points. The track at A follows exactly from the two
      positions, using the spherical bearing formula. The rhumb track is only
      given for context, and the great circle track differs from it by about
      half the convergency.


      **Solution**


      The spherical bearing formula applied to the positions of A and B gives
      **{{answer}}°**.


      **Why the other answers are wrong**


      - **{{d1}}°**: adds half the convergency to the rhumb track, which is the
      wrong direction for this route.

      - **{{d2}}°**: copies the rhumb line track, ignoring the convergence of
      the meridians.

      - **{{d3}}°**: subtracts the full convergency from the rhumb track.

      - **{{d4}}°**: adds the full convergency to the rhumb track.
- id: Q8GKQWOYW
  docId: "061.03"
  relatedQuestions:
    - QCKISDZY
  externalIds:
    - ATPLQ-619612
  annexes: []
  learningObjectives:
    - 061.03.01.02.03
  template:
    type: calculation
    question: >-
      Calculate the earth convergency between two positions, giving the answer
      in degrees to two decimal places.


      - Position A: {{ad}}°{{am}}' S, {{ald}}°{{alm}}' W

      - Position B: {{bd}}°{{bm}}' S, {{bld}}°{{blm}}' E


      What is the earth convergency for a straight line between A and B?
    variables:
      - id: ad
        label: Latitude A
        unit: °
      - id: am
        label: Latitude A minutes
        unit: "'"
      - id: ald
        label: Longitude A
        unit: °
      - id: alm
        label: Longitude A minutes
        unit: "'"
      - id: bd
        label: Latitude B
        unit: °
      - id: bm
        label: Latitude B minutes
        unit: "'"
      - id: bld
        label: Longitude B
        unit: °
      - id: blm
        label: Longitude B minutes
        unit: "'"
    answer:
      formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
        / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2)
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
          / 60)) * cos((ad + am / 60 + bd + bm / 60) / 2)
      - id: d2
        formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
          / 60))
      - id: d3
        formula: (ald + alm / 60 + bld + blm / 60) * sin((ad + am / 60 + bd + bm / 60) /
          2)
      - id: d4
        formula: min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm / 60 + bld + blm
          / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2) / 2
    presets:
      - id: p1
        values:
          ad: 37
          am: 45
          ald: 170
          alm: 25
          bd: 37
          bm: 45
          bld: 168
          blm: 35
      - id: p2
        values:
          ad: 40
          am: 10
          ald: 150
          alm: 20
          bd: 30
          bm: 5
          bld: 175
          blm: 30
    explanation: >-
      Earth convergency is the angle between the meridians at the two positions.
      It equals the longitude difference, taken the short way round the globe,
      multiplied by the sine of the mean latitude.


      **Solution**


      Longitude difference (short way): {{= min(ald + alm / 60 + bld + blm / 60,
      360 - (ald + alm / 60 + bld + blm / 60))}}°


      Mean latitude: {{= (ad + am / 60 + bd + bm / 60) / 2}}°


      Convergency: {{= min(ald + alm / 60 + bld + blm / 60, 360 - (ald + alm /
      60 + bld + blm / 60)) * sin((ad + am / 60 + bd + bm / 60) / 2)}}° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the cosine of the mean latitude instead of the sine.

      - **{{d2}}°**: forgets to multiply by the sine of the mean latitude.

      - **{{d3}}°**: uses the long way round the globe for the longitude
      difference.

      - **{{d4}}°**: halves the result.
- id: Q8MKPAQUS
  docId: "061.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614976
    - AVEXAM-92253
    - BGS-610752
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
    - 061.03.03.02.01
  template:
    type: calculation
    question: >-
      Given the following information, which radial is the aircraft on?


      - Initial magnetic track of the great circle from the aircraft to the VOR:
      {{track}}°M

      - Variation at the aircraft: {{var_ac}}°W

      - Latitude of the aircraft: {{lat_ac}}°N

      - Latitude of the VOR: {{lat_vor}}°N

      - Variation at the VOR: {{var_vor}}°W

      - Longitude difference between the aircraft and the VOR: {{dlon}}°


      Which radial is the aircraft on?
    variables:
      - id: track
        label: Initial magnetic track, aircraft to VOR
        unit: °M
      - id: var_ac
        label: Variation at the aircraft (west)
        unit: °W
      - id: lat_ac
        label: Latitude of the aircraft
        unit: °N
      - id: lat_vor
        label: Latitude of the VOR
        unit: °N
      - id: var_vor
        label: Variation at the VOR (west)
        unit: °W
      - id: dlon
        label: Longitude difference
        unit: °
    answer:
      formula: track - var_ac + 180 + dlon * sin((lat_ac + lat_vor) / 2) + var_vor
      unit: radial
      decimals: 0
    distractors:
      - id: d1
        formula: track
      - id: d2
        formula: track - var_ac + 180
      - id: d3
        formula: track + var_ac + 180 + var_vor
      - id: d4
        formula: track - var_ac + 180 - dlon * sin((lat_ac + lat_vor) / 2) + var_vor
    presets:
      - id: p1
        values:
          track: 168
          var_ac: 21
          lat_ac: 55
          lat_vor: 50
          var_vor: 19
          dlon: 5
      - id: p2
        values:
          track: 120
          var_ac: 15
          lat_ac: 45
          lat_vor: 37
          var_vor: 12
          dlon: 4
      - id: p3
        values:
          track: 150
          var_ac: 18
          lat_ac: 40
          lat_vor: 32
          var_vor: 14
          dlon: 8
    explanation: >-
      The radial is the magnetic bearing of the aircraft from the VOR. The track
      from the aircraft to the VOR is turned around to give the bearing back
      from the VOR, a correction is made for the convergence of the meridians
      between the two positions, and the result is converted to a magnetic
      bearing using the variation at the VOR.


      **Solution**


      - Reversed true track: {{= track - var_ac + 180}}°T

      - Convergence correction: {{n: dlon * sin((lat_ac + lat_vor) / 2)}}°

      - Magnetic radial: {{f: track - var_ac + 180 + dlon * sin((lat_ac +
      lat_vor) / 2) + var_vor}} = {{n: track - var_ac + 180 + dlon * sin((lat_ac
      + lat_vor) / 2) + var_vor}} = **{{answer}} radial**


      **Why the other answers are wrong**


      - **{{d1}} radial**: uses the track from the aircraft to the VOR without
      reversing it.

      - **{{d2}} radial**: forgets the convergence correction and the variation
      at the VOR.

      - **{{d3}} radial**: adds the variation at the aircraft instead of taking
      it away.

      - **{{d4}} radial**: takes the convergence correction away instead of
      adding it.
