    question: >-
      Given the following information, what is the magnetic bearing of the NDB
      from the aircraft?


      - Great circle track from the aircraft to the NDB: {{track}}°T

      - Variation at the aircraft: {{var_ac}}°W

      - Variation at the NDB: {{var_ndb}}°W


      What is the magnetic bearing in degrees?
    variables:
      - id: track
        label: Great circle track, aircraft to NDB
        unit: °
      - id: var_ac
        label: Variation at the aircraft (west)
        unit: °
      - id: var_ndb
        label: Variation at the NDB (west)
        unit: °
    answer:
      formula: track + var_ac
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: track + var_ndb
      - id: d2
        formula: track - var_ac
      - id: d3
        formula: track + 180 + var_ac
      - id: d4
