- id: QK5EEREV9
  docId: "061.03"
  relatedQuestions:
    - QUOZQ4CWC
  externalIds:
    - ATPLQ-613387
  annexes: []
  learningObjectives:
    - 061.03.03.02.01
  template:
    type: calculation
    question: |-
      You fly from point A to point B. The positions in decimal degrees are:

      - A: latitude {{lat_a}}° N, longitude {{lone_a}}° E
      - B: latitude {{lat_b}}° N, longitude {{lonw_b}}° W

      What is the angle between the great circle and the rhumb line at point A?
    variables:
      - id: lat_a
        label: Latitude of A
        unit: °
      - id: lat_b
        label: Latitude of B
        unit: °
      - id: lone_a
        label: East longitude of A
        unit: °
      - id: lonw_b
        label: West longitude of B
        unit: °
    answer:
      formula: (360 - lone_a - lonw_b) / 2 * sin((lat_a + lat_b) / 2)
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: (360 - lone_a - lonw_b) * sin((lat_a + lat_b) / 2)
      - id: d2
        formula: (360 - lone_a - lonw_b) * cos((lat_a + lat_b) / 2)
      - id: d3
        formula: (360 - lone_a - lonw_b) / 2 * sin(lat_a)
      - id: d4
        formula: (360 - lone_a - lonw_b) / 2 * cos((lat_a + lat_b) / 2)
    presets:
      - id: p1
        values:
          lat_a: 25.58
          lat_b: 32.75
          lone_a: 178.42
          lonw_b: 165.43
      - id: p2
        values:
          lat_a: 30
          lat_b: 50
          lone_a: 170
          lonw_b: 150
      - id: p3
        values:
          lat_a: 60
          lat_b: 70
          lone_a: 100
          lonw_b: 80
    explanation: >-
      The angle between the great circle and the rhumb line is half the
      convergency. The convergency is the longitude difference multiplied by the
      sine of the mean latitude of the two points. The longitude difference is
      360 minus the east longitude of A and the west longitude of B, because the
      shorter route crosses the 180 degree meridian.


      **Solution**


      Longitude difference: 360 - {{lone_a}} - {{lonw_b}} = {{= 360 - lone_a -
      lonw_b}}°


      Mean latitude: ({{lat_a}} + {{lat_b}}) / 2 = {{= (lat_a + lat_b) / 2}}°


      Angle: {{f: (360 - lone_a - lonw_b) / 2 * sin((lat_a + lat_b) / 2)}} =
      {{n: (360 - lone_a - lonw_b) / 2 * sin((lat_a + lat_b) / 2)}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the full convergency is used, without halving it.

      - **{{d2}}°**: the cosine of the mean latitude is used instead of the
      sine.

      - **{{d3}}°**: the latitude of A is used instead of the mean latitude.

      - **{{d4}}°**: the cosine of the mean latitude is used instead of the
      sine.
