- id: QX6BTISKG
  docId: "061.03"
  relatedQuestions:
    - Q1SFIPPTE
  externalIds:
    - ATPLQ-619640
    - BGS-611658
    - AVEXAM-96856
  annexes: []
  learningObjectives:
    - 061.03.01.02.01
  template:
    type: calculation
    question: >-
      An aircraft flies from waypoint A to waypoint B along a great circle. Both
      waypoints lie on the same parallel of latitude:


      - Waypoint A: {{lat_d}}°{{lat_m}}'S, {{lon_a_d}}°{{lon_a_m}}'E

      - Waypoint B: {{lat_d}}°{{lat_m}}'S, {{lon_b_d}}°{{lon_b_m}}'W


      What is the great circle track on arrival at waypoint B in °T?
    variables:
      - id: lat_d
        label: Latitude, degrees
        unit: °
      - id: lat_m
        label: Latitude, minutes
        unit: "'"
      - id: lon_a_d
        label: Longitude of A, degrees
        unit: °
      - id: lon_a_m
        label: Longitude of A, minutes
        unit: "'"
      - id: lon_b_d
        label: Longitude of B, degrees
        unit: °
      - id: lon_b_m
        label: Longitude of B, minutes
        unit: "'"
    answer:
      formula: atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))),
        sin((0 - (lat_d + lat_m / 60))) * (1 - cos(((lon_a_d + lon_a_m / 60) +
        (lon_b_d + lon_b_m / 60))))) + 180
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: ((atan2(sin((0 - ((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m /
          60)))), sin((0 - (lat_d + lat_m / 60))) * (1 - cos((0 - ((lon_a_d +
          lon_a_m / 60) + (lon_b_d + lon_b_m / 60))))))) - 360 *
          floor((atan2(sin((0 - ((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m /
          60)))), sin((0 - (lat_d + lat_m / 60))) * (1 - cos((0 - ((lon_a_d +
          lon_a_m / 60) + (lon_b_d + lon_b_m / 60))))))) / 360))
      - id: d2
        formula: 360 - (atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m /
          60))), sin((0 - (lat_d + lat_m / 60))) * (1 - cos(((lon_a_d + lon_a_m
          / 60) + (lon_b_d + lon_b_m / 60))))) + 180)
      - id: d3
        formula: ((atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))),
          sin((0 - (lat_d + lat_m / 60))) * (1 - cos(((lon_a_d + lon_a_m / 60) +
          (lon_b_d + lon_b_m / 60)))))) - 360 * floor((atan2(sin(((lon_a_d +
          lon_a_m / 60) + (lon_b_d + lon_b_m / 60))), sin((0 - (lat_d + lat_m /
          60))) * (1 - cos(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m /
          60)))))) / 360))
      - id: d4
        formula: "90"
    presets:
      - id: p1
        values:
          lat_d: 32
          lat_m: 35
          lon_a_d: 168
          lon_a_m: 12
          lon_b_d: 165
          lon_b_m: 48
      - id: p2
        values:
          lat_d: 40
          lat_m: 0
          lon_a_d: 150
          lon_a_m: 0
          lon_b_d: 170
          lon_b_m: 0
      - id: p3
        values:
          lat_d: 25
          lat_m: 30
          lon_a_d: 160
          lon_a_m: 0
          lon_b_d: 175
          lon_b_m: 0
    explanation: >-
      The track changes along a great circle, so the track on arrival at B is
      the direction of the great circle as it reaches B. It is the reciprocal of
      the track from B back towards A. The longitude difference across the date
      line is found by adding the two longitudes, as one is east and one is
      west.


      **Solution**


      Track from B back towards A: {{= atan2(sin(((lon_a_d + lon_a_m / 60) +
      (lon_b_d + lon_b_m / 60))), sin((0 - (lat_d + lat_m / 60))) * (1 -
      cos(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60)))))}}°


      {{f: atan2(sin(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))),
      sin((0 - (lat_d + lat_m / 60))) * (1 - cos(((lon_a_d + lon_a_m / 60) +
      (lon_b_d + lon_b_m / 60))))) + 180}} = {{n: atan2(sin(((lon_a_d + lon_a_m
      / 60) + (lon_b_d + lon_b_m / 60))), sin((0 - (lat_d + lat_m / 60))) * (1 -
      cos(((lon_a_d + lon_a_m / 60) + (lon_b_d + lon_b_m / 60))))) + 180}} =
      **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°**: the initial track at A is used instead of the track on
      arrival at B.

      - **{{d2}}°**: the reciprocal of the correct track is used.

      - **{{d3}}°**: the direction back towards A is used.

      - **{{d4}}°**: due east (the rhumb line track along a parallel) is used
      instead of the great circle track.
