- id: QYLZDRJ1M
  docId: "061.03"
  relatedQuestions:
    - QQQWG9NXN
  externalIds:
    - ATPLQ-612716
    - AVEXAM-56628
  annexes: []
  learningObjectives:
    - 061.03.01.02.01
  template:
    type: calculation
    question: >-
      A pilot flies the great circle (shortest distance) from position X to
      position Z. Position Z is in the northern hemisphere, and its exact
      coordinates are not needed. The data are:


      - Initial true track at X: {{trk}}°

      - Convergency between X and Z: {{conv}}°


      What is the final true track at Z?
    variables:
      - id: trk
        label: initial true track
        unit: °
      - id: conv
        label: convergency
        unit: °
    answer:
      formula: trk + conv
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: trk + conv / 2
      - id: d2
        formula: trk - conv / 2
      - id: d3
        formula: trk - conv
      - id: d4
        formula: trk
    presets:
      - id: p1
        values:
          trk: 122
          conv: 20
      - id: p2
        values:
          trk: 275
          conv: 12
      - id: p3
        values:
          trk: 60
          conv: 8
    explanation: >-
      Convergency is the angle by which the track changes between two positions
      along a great circle. The final track is the initial track changed by the
      full convergency. Here the convergency is positive, so it is added to the
      initial track.


      **Solution**


      - Final true track = initial track + convergency = {{f: trk + conv}} =
      {{n: trk + conv}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: only half the convergency was applied.

      - **{{d2}}°**: half the convergency was subtracted, so the track turned
      the wrong way.

      - **{{d3}}°**: the convergency was subtracted instead of added.

      - **{{d4}}°**: the convergency was ignored and the initial track was kept.
