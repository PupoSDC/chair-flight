  template:
    type: calculation
    question: >-
      In the Northern Hemisphere, the great circle bearing of position B from
      position A is {{gc}}°. The conversion angle is {{ca}}°.


      What is the great circle bearing of A from B?
    variables:
      - id: gc
        label: Great circle bearing of B from A
        unit: °
      - id: ca
        label: Conversion angle
        unit: °
    answer:
      formula: gc + 180 + 2 * ca
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: gc + 180
      - id: d2
        formula: gc + 180 + ca
      - id: d3
        formula: gc + 180 - ca
      - id: d4
        formula: gc + 180 - 2 * ca
    presets:
      - id: p1
        values:
          gc: 40
          ca: 4
      - id: p2
        values:
          gc: 90
          ca: 5
      - id: p3
        values:
          gc: 120
          ca: 2
    explanation: >-
      In the Northern Hemisphere the great circle track changes along the route.
      The bearing back from B to A is the reciprocal of the track at B, and the
      track at B differs from the track at A by twice the conversion angle.


      **Solution**


      Reciprocal of the bearing: {{gc}}° + 180° = {{= gc + 180}}°


      Add twice the conversion angle: {{= gc + 180}}° + 2 × {{ca}}° =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the conversion angle is forgotten.

      - **{{d2}}°**: the conversion angle is added once instead of twice.

      - **{{d3}}°**: the conversion angle is subtracted once.

      - **{{d4}}°**: the conversion angle is subtracted twice.
