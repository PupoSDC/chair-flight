- id: QLWODQHA
  docId: "061.03"
  relatedQuestions:
    - Q8CRJUFZJ
  externalIds:
    - ATPLQ-613565
  annexes: []
  learningObjectives:
    - 061.03.02.01.01
  template:
    type: calculation
    question: |-
      Given the following information:

      - Position A: latitude {{lat_a}}°N, longitude {{lon_a}}°E
      - Position B: latitude {{lat_b}}°N, longitude {{lon_b}}°E
      - Average true course of the great circle: {{gc}}°

      What is the true course of the rhumb line at point A?
    variables:
      - id: lat_a
        label: Latitude of A
        unit: °
      - id: lon_a
        label: Longitude of A
        unit: °
      - id: lat_b
        label: Latitude of B
        unit: °
      - id: lon_b
        label: Longitude of B
        unit: °
      - id: gc
        label: Average great circle course
        unit: °
    answer:
      formula: atan2((lon_b - lon_a) * pi / 180, ln(tan(45 + lat_b / 2)) - ln(tan(45 +
        lat_a / 2))) - 360 * floor(atan2((lon_b - lon_a) * pi / 180, ln(tan(45 +
        lat_b / 2)) - ln(tan(45 + lat_a / 2))) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan2(lon_b - lon_a, lat_b - lat_a)
      - id: d2
        formula: atan2((lon_b - lon_a) * pi / 180, ln(tan(45 + lat_b / 2)) - ln(tan(45 +
          lat_a / 2))) + 180
      - id: d3
        formula: atan2((lon_b - lon_a) * 60 * cos((lat_a + lat_b) / 2), lat_b - lat_a)
    presets:
      - id: p1
        values:
          lat_a: 55
          lon_a: 0
          lat_b: 54
          lon_b: 10
          gc: 100
      - id: p2
        values:
          lat_a: 40
          lon_a: 0
          lat_b: 35
          lon_b: 15
          gc: 110
      - id: p3
        values:
          lat_a: 60
          lon_a: 20
          lat_b: 65
          lon_b: 35
          gc: 60
    explanation: >-
      On a Mercator chart a rhumb line is a straight line. Its track follows
      from the difference in longitude and the difference in stretched latitude
      between the two points. The great circle course is not needed for this.


      **Solution**


      Longitude difference: {{= lon_b - lon_a}}°


      Rhumb line track from A towards B, measured from north: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the plain latitude and longitude differences, without
      the Mercator stretch.

      - **{{d2}}°**: gives the reciprocal, which points the wrong way.

      - **{{d3}}°**: the longitude difference is not converted to distance at
      the mean latitude.
