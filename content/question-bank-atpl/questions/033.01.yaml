- id: QDJTYNNU6
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334710
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: An aircraft is flying at FL{{fl}}, OAT {{oat}} °C, QNH {{qnh}} hPa
      (station at sea level). Assume 1 hPa = 30 ft. What is the true altitude?
    variables:
      - id: fl
        label: flight level
        unit: ""
      - id: oat
        label: OAT
        unit: °C
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: (fl * 100 + (qnh - 1013) * 30) * (1 + 0.004 * (oat - 15 + 0.2 * fl))
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 + (qnh - 1013) * 30)
      - id: d2
        formula: (fl * 100 + (qnh - 1013) * 30) * (1 - 0.004 * (oat - 15 + 0.2 * fl))
      - id: d3
        formula: fl * 100 * (1 + 0.004 * (oat - 15 + 0.2 * fl))
      - id: d4
        formula: (fl * 100 + (1013 - qnh) * 30) * (1 + 0.004 * (oat - 15 + 0.2 * fl))
    presets:
      - id: p1
        values:
          fl: 180
          oat: -11
          qnh: 1003
      - id: p2
        values:
          fl: 140
          oat: -5
          qnh: 1000
      - id: p3
        values:
          fl: 240
          oat: -40
          qnh: 1020
    explanation: >-
      True altitude is the pressure altitude corrected for the QNH (30 ft per
      hPa difference from 1013 hPa) and for temperature (about 4 ft per 1000 ft
      per °C of ISA deviation). ISA temperature at the level is 15 - 2 * FL/10
      °C.


      **Solution**


      ISA temperature = {{= 15 - 0.2 * fl}} °C, ISA deviation = {{= (oat - 15 +
      0.2 * fl)}} °C


      Altitude corrected for QNH = {{= (fl * 100 + (qnh - 1013) * 30)}} ft


      {{= (fl * 100 + (qnh - 1013) * 30)}} * (1 + 0.004 * {{= (oat - 15 + 0.2 *
      fl)}}) = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the temperature correction was omitted.

      - **{{d2}} ft**: the temperature correction has the wrong sign (warmer
      than ISA means a higher true altitude).

      - **{{d3}} ft**: the QNH correction was omitted.

      - **{{d4}} ft**: the QNH correction was applied with the wrong sign.
