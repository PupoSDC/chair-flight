- id: QWKXULMD
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336441
  annexes:
    - jeppesen-vfr-chart-16-munich-east
  learningObjectives:
    - 033.01.01.02.02
  template:
    type: calculation
    question: Refer to VFR Chart ED-4 from Jeppesen GSPRM 2017. What is the distance
      between the obstacle with a height of 4055 ft (N{{a1d}}°{{a1m}}',
      E{{o1d}}°{{o1m}}') and airport EDPS (N{{a2d}}°{{a2m}}',
      E{{o2d}}°{{o2m}}')?
    variables:
      - id: a1d
        label: Obstacle latitude, degrees
        unit: °
      - id: a1m
        label: Obstacle latitude, minutes
        unit: "'"
      - id: o1d
        label: Obstacle longitude, degrees
        unit: °
      - id: o1m
        label: Obstacle longitude, minutes
        unit: "'"
      - id: a2d
        label: Airport latitude, degrees
        unit: °
      - id: a2m
        label: Airport latitude, minutes
        unit: "'"
      - id: o2d
        label: Airport longitude, degrees
        unit: °
      - id: o2m
        label: Airport longitude, minutes
        unit: "'"
    answer:
      formula: sqrt(((a1d - a2d) * 60 + a1m - a2m) ^ 2 + (((o2d - o1d) * 60 + o2m -
        o1m) * cos((a1d + a1m / 60 + a2d + a2m / 60) / 2)) ^ 2)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: sqrt(((a1d - a2d) * 60 + a1m - a2m) ^ 2 + ((o2d - o1d) * 60 + o2m -
          o1m) ^ 2)
      - id: d2
        formula: abs((a1d - a2d) * 60 + a1m - a2m) + abs((o2d - o1d) * 60 + o2m - o1m)
      - id: d3
        formula: abs((o2d - o1d) * 60 + o2m - o1m) * cos((a1d + a1m / 60 + a2d + a2m /
          60) / 2)
      - id: d4
        formula: abs((a1d - a2d) * 60 + a1m - a2m) + abs((o2d - o1d) * 60 + o2m - o1m) *
          cos((a1d + a1m / 60 + a2d + a2m / 60) / 2)
    presets:
      - id: p1
        values:
          a1d: 49
          a1m: 9
          o1d: 13
          o1m: 4
          a2d: 48
          a2m: 41
          o2d: 13
          o2m: 41.78
      - id: p2
        values:
          a1d: 50
          a1m: 10
          o1d: 12
          o1m: 20
          a2d: 49
          a2m: 30
          o2d: 13
          o2m: 15
    explanation: >-
      One minute of latitude is one nautical mile. One minute of longitude is
      cos(latitude) nautical miles, so the difference in longitude must be
      scaled by the cosine of the mean latitude. The distance then follows from
      Pythagoras.


      **Solution**


      Latitude difference: {{= (a1d - a2d) * 60 + a1m - a2m}} NM


      Departure (east-west): {{= ((o2d - o1d) * 60 + o2m - o1m) * cos((a1d + a1m
      / 60 + a2d + a2m / 60) / 2)}} NM


      Distance = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: longitude not scaled by the cosine of latitude.

      - **{{d2}} NM**: differences added instead of using Pythagoras.

      - **{{d3}} NM**: only the east-west component was used.

      - **{{d4}} NM**: latitude and east-west components added instead of
      combined with Pythagoras.
- id: QWWEIIFVH
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338134
    - ATPLGS-626142
    - BGS-330749
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Given the following information, how long does it take to reach the Top of
      Climb (TOC)? Give the answer in minutes.


      - Departure aerodrome elevation: {{elev}} ft

      - TOC: FL{{toc_fl}}

      - Rate of climb: {{roc}} ft/min

      - QNH: {{qnh}} hPa
    variables:
      - id: elev
        label: Departure aerodrome elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: toc_fl
        label: TOC flight level
        unit: FL
      - id: roc
        label: Rate of climb
        unit: ft/min
    answer:
      formula: (toc_fl * 100 - (elev + 30 * (1013 - qnh))) / roc
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: (toc_fl * 100 - elev) / roc
      - id: d2
        formula: (toc_fl * 100 - (elev + 30 * (1013 - qnh))) / roc - 1
      - id: d3
        formula: toc_fl * 100 / roc
      - id: d4
        formula: (toc_fl * 100 + elev + 30 * (1013 - qnh)) / roc
    presets:
      - id: p1
        values:
          elev: 2500
          qnh: 995
          toc_fl: 185
          roc: 1500
      - id: p2
        values:
          elev: 1200
          qnh: 1008
          toc_fl: 80
          roc: 800
    explanation: >-
      The climb starts from the pressure altitude of the aerodrome, which is the
      elevation corrected for the QNH at 30 ft per hPa from 1013 hPa. The height
      to climb is the TOC altitude minus that pressure altitude, and the time is
      the height divided by the rate of climb.


      **Solution**


      Pressure altitude: {{= elev + 30 * (1013 - qnh)}} ft


      Height to climb: {{= toc_fl * 100 - (elev + 30 * (1013 - qnh))}} ft


      Time: {{f: (toc_fl * 100 - (elev + 30 * (1013 - qnh))) / roc}} = {{n:
      (toc_fl * 100 - (elev + 30 * (1013 - qnh))) / roc}} = **{{answer}} min**


      **Why the other answers are wrong**

      - **{{d1}} min**: ignores the QNH correction.

      - **{{d2}} min**: subtracts one extra minute, a calculation slip.

      - **{{d3}} min**: uses the TOC altitude alone and ignores the departure
      altitude.

      - **{{d4}} min**: adds the pressure altitude instead of subtracting it.
