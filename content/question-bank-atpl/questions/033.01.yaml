- id: Q4IHUDYT0
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336159
    - ATPLGS-626292
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Given the following information, what heading (°) must be selected in
      order to maintain the desired track DTK?


      - DTK: {{dtk}}°

      - TAS: {{tas}} kt

      - Wind: {{wd}}°/{{ws}} kt
    variables:
      - id: dtk
        label: Desired track
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: dtk + asin(ws * sin(wd - dtk) / tas)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: dtk - asin(ws * sin(wd - dtk) / tas)
      - id: d2
        formula: dtk - asin(ws / tas)
      - id: d3
        formula: dtk + asin(ws / tas)
      - id: d4
        formula: wd + asin(ws * sin(wd - dtk) / tas)
    presets:
      - id: p1
        values:
          dtk: 90
          tas: 380
          wd: 60
          ws: 60
      - id: p2
        values:
          dtk: 270
          tas: 250
          wd: 300
          ws: 40
      - id: p3
        values:
          dtk: 180
          tas: 300
          wd: 130
          ws: 35
    explanation: >-
      To hold the desired track, the heading must be offset into the wind by the
      wind correction angle: WCA = asin(WS x sin(wind direction - track) / TAS).
      The heading is the track plus this angle (a negative angle when the wind
      comes from the left of track).


      **Solution**


      WCA = {{= asin(ws * sin(wd - dtk) / tas)}}°


      {{f: dtk + asin(ws * sin(wd - dtk) / tas)}} = {{n: dtk + asin(ws * sin(wd
      - dtk) / tas)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}} °**: The correction was applied in the wrong direction (away
      from the wind).

      - **{{d2}} °**: The full wind speed was used as cross wind, ignoring the
      wind angle, and applied in the wrong direction.

      - **{{d3}} °**: The full wind speed was used as cross wind, ignoring the
      wind angle.

      - **{{d4}} °**: The correction was applied to the wind direction instead
      of the track.
