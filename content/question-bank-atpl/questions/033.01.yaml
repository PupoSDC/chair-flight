  template:
    type: chart-calculation
    question: >-
      Refer to the VFR chart (Jeppesen GSPRM 2017). An aircraft on a VFR flight
      intends to fly overhead aerodrome Straubing (EDMS). The upper limit of the
      Straubing Class F airspace read from the chart is {{top}} ft. What is the
      minimum indicated altitude (ft) required to clear the airspace by
      {{margin}} ft?


      Altimeter temperature error with an OAT -7°C at Straubing: {{err}} ft. QNH
      at Straubing: 998 hPa. Altimeter setting: 998 hPa.
    variables:
      - id: top
        label: Airspace upper limit (read from chart)
        unit: ft
      - id: margin
        label: Required clearance
        unit: ft
      - id: err
        label: Altimeter temperature error
        unit: ft
    chartInputs:
      - top
    answer:
      formula: top + margin + err
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: top + margin - err
      - id: d2
        formula: top - margin + err
      - id: d3
        formula: top + err
      - id: d4
        formula: top + margin
    presets:
      - id: p1
        values:
          top: 3550
          margin: 500
          err: 240
      - id: p2
        values:
          top: 4200
          margin: 500
          err: 180
      - id: p3
        values:
          top: 2800
          margin: 1000
          err: 150
    explanation: >-
      The required true altitude is the airspace limit plus the clearance. In
      cold air the altimeter over-reads, so the true altitude is lower than
      indicated; the indicated altitude must therefore be higher by the
      temperature error. The altimeter setting equals QNH, so no pressure
      correction is needed.


      **Solution**


      {{f: top + margin + err}} = {{n: top + margin + err}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: The temperature error was subtracted instead of added.

      - **{{d2}} ft**: The clearance was subtracted instead of added.

      - **{{d3}} ft**: The clearance was forgotten.

      - **{{d4}} ft**: The temperature error was forgotten.
