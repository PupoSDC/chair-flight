- id: QSVD1U0TJ
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338534
    - ATPLGS-629283
    - BGS-330970
    - AVEXAM-60059
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: |-
      Given the following information, what is the air distance covered (NAM)?

      - TAS: {{tas}} kt
      - Headwind component: {{hw}} kt
      - Ground distance: {{gd}} NGM
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
      - id: gd
        label: Ground distance
        unit: NGM
    answer:
      formula: gd * tas / (tas - hw)
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: gd * (tas - hw) / tas
      - id: d2
        formula: gd
      - id: d3
        formula: gd + hw
      - id: d4
        formula: gd * tas / (tas + hw)
    presets:
      - id: p1
        values:
          tas: 120
          hw: 20
          gd: 200
      - id: p2
        values:
          tas: 150
          hw: 30
          gd: 300
      - id: p3
        values:
          tas: 200
          hw: 40
          gd: 400
    explanation: >-
      The air distance is the distance flown through the air mass. It is related
      to the ground distance by the ratio of TAS to ground speed, and with a
      headwind the ground speed is TAS minus the headwind component.


      **Solution**


      Ground speed = {{f: tas - hw}} = {{n: tas - hw}} = {{= tas - hw}} kt


      {{f: gd * tas / (tas - hw)}} = {{n: gd * tas / (tas - hw)}} = **{{answer}}
      NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: the ratio is inverted (ground speed / TAS instead of TAS
      / ground speed).

      - **{{d2}} NAM**: this is just the ground distance, ignoring the wind.

      - **{{d3}} NAM**: adds the wind speed to the distance instead of scaling
      it by TAS / ground speed.

      - **{{d4}} NAM**: treats the headwind as a tailwind (ground speed = TAS +
      wind).
