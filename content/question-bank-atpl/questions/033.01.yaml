- id: QPLCWHGY
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338192
    - ATPLGS-627146
    - AVEXAM-10564
  annexes: []
  learningObjectives:
    - 033.01.01.02.05
  template:
    type: chart-calculation
    question: >-
      Refer to VFR chart ED-4. You depart from Beilngries / EDNC aerodrome and
      continue eastbound at the minimum grid altitude, which is read from the
      chart as {{grid_alt}} ft.


      The altimeter is set incorrectly:


      - Altimeter setting used: {{set_hpa}} hPa

      - QNH given by the aerodrome: {{qnh_hpa}} hPa


      What is your approximate true altitude shortly after departure? (1 hPa =
      30 ft)
    variables:
      - id: grid_alt
        label: Minimum grid altitude (read from chart)
        unit: ft
      - id: set_hpa
        label: Altimeter setting used
        unit: hPa
      - id: qnh_hpa
        label: QNH
        unit: hPa
    chartInputs:
      - grid_alt
    answer:
      formula: grid_alt - 30 * (set_hpa - qnh_hpa)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: grid_alt
      - id: d2
        formula: grid_alt + 30 * (set_hpa - qnh_hpa)
      - id: d3
        formula: grid_alt - 100 * (set_hpa - qnh_hpa)
      - id: d4
        formula: grid_alt - (set_hpa - qnh_hpa)
    presets:
      - id: p1
        values:
          grid_alt: 3580
          set_hpa: 1010
          qnh_hpa: 1001
      - id: p2
        values:
          grid_alt: 4200
          set_hpa: 1015
          qnh_hpa: 1009
    explanation: >-
      The minimum grid altitude is read from the chart. The altimeter is set to
      a higher pressure than the actual QNH, so it indicates too high. The true
      altitude is therefore lower than the altitude read from the chart.


      **Solution**


      - Altimeter setting error: {{= set_hpa - qnh_hpa}} hPa, which is {{= 30 *
      (set_hpa - qnh_hpa)}} ft

      - True altitude: {{f: grid_alt - 30 * (set_hpa - qnh_hpa)}} = {{n:
      grid_alt - 30 * (set_hpa - qnh_hpa)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: ignores the altimeter setting error.

      - **{{d2}} ft**: adds the error instead of subtracting it.

      - **{{d3}} ft**: uses 100 ft per hPa instead of 30 ft per hPa.

      - **{{d4}} ft**: uses 1 ft per hPa instead of 30 ft per hPa.
- id: QPTYSWPFA
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332382
    - BGS-330001
    - AVEXAM-32857
    - ATPLGS-108290
    - ATPLGS-622317
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      An aircraft is flying at Mach 0.84 at FL 330.


      The static air temperature is {{sat}} °C and the headwind component {{hw}}
      kt.


      The controller requests the pilot to cross a meridian in {{t_min}} min.


      The distance to go is {{dist}} NM.


      The reduced Mach number should be (give the Mach number to 2 decimals)
    variables:
      - id: dist
        label: Distance to go
        unit: NM
      - id: t_min
        label: Time available
        unit: min
      - id: hw
        label: Headwind component
        unit: kt
      - id: sat
        label: Static air temperature
        unit: °C
    answer:
      formula: (dist / (t_min / 60) + hw) / (38.9456 * sqrt(sat + 273.15))
      unit: M
      decimals: 2
    distractors:
      - id: d1
        formula: dist / (t_min / 60) / (38.9456 * sqrt(sat + 273.15))
      - id: d2
        formula: (dist / (t_min / 60) - hw) / (38.9456 * sqrt(sat + 273.15))
      - id: d3
        formula: (dist / (t_min / 60) + hw) / 600
      - id: d4
        formula: (dist / (t_min / 100) + hw) / (38.9456 * sqrt(sat + 273.15))
    presets:
      - id: p1
        values:
          dist: 570
          t_min: 82
          hw: 52
          sat: -48
      - id: p2
        values:
          dist: 480
          t_min: 70
          hw: 40
          sat: -50
    explanation: >-
      The required ground speed is distance over time. Adding the headwind
      component gives the true airspeed needed, and dividing by the local speed
      of sound (38.9456 x square root of the absolute temperature, in kt) gives
      the Mach number.


      **Solution**


      Ground speed = {{= dist / (t_min / 60)}} kt, TAS = {{= dist / (t_min / 60)
      + hw}} kt


      Speed of sound = {{= 38.9456 * sqrt(sat + 273.15)}} kt


      Mach = {{f: (dist / (t_min / 60) + hw) / (38.9456 * sqrt(sat + 273.15))}}
      = **{{answer}} M**


      **Why the other answers are wrong**


      - **{{d1}} M**: the headwind is ignored (ground speed used as TAS).

      - **{{d2}} M**: the headwind is subtracted instead of added.

      - **{{d3}} M**: a constant speed of sound of 600 kt is used instead of the
      value at the static air temperature.

      - **{{d4}} M**: the time is converted to hours with 100 instead of 60.
