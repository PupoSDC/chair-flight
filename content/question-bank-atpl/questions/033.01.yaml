- id: QEJNPNYP5
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339531
    - BGS-331438
  annexes:
    - 032-cap-697-sep-cruise-performance-table-25-0-in-hg
  learningObjectives:
    - "033.01"
  template:
    type: chart-calculation
    question: >-
      Determine the aircraft's drift (to the right) on a course of {{crs}}° (M),
      given:


      Level: FL70, ISA+10 °C, 2500 RPM, full throttle


      - TAS (read from the figure / CAP 697 Figure 2.2, Table 2.2.1): {{tas}} kt

      - Wind: {{wd}}° (T)/{{ws}} kt

      - Variation: {{var_e}}°E
    variables:
      - id: crs
        label: magnetic course
        unit: °
      - id: wd
        label: wind direction
        unit: °
      - id: ws
        label: wind speed
        unit: kt
      - id: var_e
        label: easterly variation
        unit: °
      - id: tas
        label: TAS from figure
        unit: kt
    chartInputs:
      - tas
    answer:
      formula: abs(asin(ws * sin(crs + var_e - wd) / tas))
      unit: ° right
      decimals: 0
    distractors:
      - id: d1
        formula: abs(asin(ws * sin(crs - wd) / tas))
      - id: d2
        formula: abs(asin(ws * sin(crs - var_e - wd) / tas))
      - id: d3
        formula: abs(asin(ws * cos(crs + var_e - wd) / tas))
    presets:
      - id: p1
        values:
          crs: 127
          wd: 110
          ws: 50
          var_e: 15
          tas: 170
      - id: p2
        values:
          crs: 250
          wd: 200
          ws: 40
          var_e: 10
          tas: 160
    explanation: >-
      Drift is the angle between heading and track caused by the wind:
      sin(drift) = wind speed * sin(angle between track and wind) / TAS. The
      wind is true, so the magnetic course is converted to true with the
      variation (east is added).


      **Solution**


      True course = {{crs}} + {{var_e}} = {{= crs + var_e}}°


      Drift = asin({{ws}} * sin({{= crs + var_e}} - {{wd}}) / {{tas}}) =
      **{{answer}}° right**


      **Why the other answers are wrong**


      - **{{d1}}° right**: the magnetic course was compared directly with the
      true wind direction.

      - **{{d2}}° right**: the easterly variation was subtracted instead of
      added.

      - **{{d3}}° right**: cosine used instead of sine of the wind angle.
