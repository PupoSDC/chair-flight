- id: QZNNI02KR
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332771
    - AVEXAM-92075
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      An aircraft is flying VFR using a VOR to navigate and follows radial
      {{radial}}° (magnetic) outbound from the VOR. Determine the expected wind
      correction angle (WCA), given:


      - Wind: {{wd}}° (T) / {{ws}} kt

      - TAS: {{tas}} kt

      - Variation: {{var}}° W


      Positive = right, negative = left.
    variables:
      - id: radial
        label: Radial (magnetic)
        unit: °
      - id: wd
        label: Wind direction (true)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
      - id: var
        label: Westerly variation
        unit: °
    answer:
      formula: asin(ws * sin(wd - (radial - var)) / tas)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: -asin(ws * sin(wd - (radial - var)) / tas)
      - id: d2
        formula: asin(ws * sin(wd - radial) / tas)
      - id: d3
        formula: asin(ws * sin(wd - (radial + var)) / tas)
      - id: d4
        formula: asin(ws / tas)
    presets:
      - id: p1
        values:
          radial: 128
          wd: 80
          ws: 35
          tas: 155
          var: 15
      - id: p2
        values:
          radial: 250
          wd: 300
          ws: 25
          tas: 120
          var: 5
      - id: p3
        values:
          radial: 90
          wd: 140
          ws: 30
          tas: 140
          var: 8
    explanation: >-
      The wind is given in true degrees while the radial is magnetic, so the
      radial must first be converted to a true track. With westerly variation,
      true = magnetic - variation. The WCA then follows from the wind triangle:
      sin(WCA) = wind speed x sin(wind angle relative to track) / TAS.


      **Solution**


      True track = {{radial}}° - {{var}}° = {{= radial - var}}°


      {{f: asin(ws * sin(wd - (radial - var)) / tas)}} = {{n: asin(ws * sin(wd -
      (radial - var)) / tas)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: right size but wrong sign.

      - **{{d2}}°**: the variation was ignored and the magnetic radial was used
      as if it were a true track.

      - **{{d3}}°**: the variation was applied with the wrong sign (east instead
      of west).

      - **{{d4}}°**: uses the full wind speed, as if the wind were perpendicular
      to the track.
