- id: Q51NX80QT
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334663
    - AVEXAM-42306
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      A mountain {{obst}} ft AMSL will be crossed on a magnetic track of 006°
      (VFR flight, track 356° T, variation 10° W).


      What is the lowest VFR ICAO flight level the aircraft must fly to obtain a
      clearance of {{clr}} ft?


      QNH: {{qnh}} hPa.


      Assume 1 hPa = 30 ft.


      Give the flight level number (e.g. 95 for FL095).
    variables:
      - id: obst
        label: Mountain elevation
        unit: ft
      - id: clr
        label: Required clearance
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: 15 + 20 * ceil(((obst + clr + (1013 - qnh) * 30) / 100 - 15) / 20)
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: 5 + 20 * ceil(((obst + clr + (1013 - qnh) * 30) / 100 - 5) / 20)
      - id: d2
        formula: 15 + 20 * ceil(((obst + clr - (1013 - qnh) * 30) / 100 - 15) / 20)
      - id: d3
        formula: ceil((obst + clr + (1013 - qnh) * 30) / 500) * 5
      - id: d4
        formula: 15 + 20 * ceil(((obst + clr + (1013 - qnh) * 30 + 2000) / 100 - 15) /
          20)
    presets:
      - id: p1
        values:
          obst: 6011
          clr: 2000
          qnh: 990
      - id: p2
        values:
          obst: 5600
          clr: 2000
          qnh: 1000
    explanation: >-
      The minimum altitude is obstacle elevation plus clearance. With QNH below
      1013 hPa the flight level lies higher than the altitude, so the QNH
      difference is added. On a magnetic track of 000-179° the VFR cruising
      levels are odd thousands plus 500 ft (FL35, 55, 75, 95, ...), so the
      result is rounded up to the next such level.


      **Solution**


      Minimum altitude = {{f: obst + clr}} = {{= obst + clr}} ft


      QNH correction = {{= (1013 - qnh) * 30}} ft, required pressure altitude =
      {{= obst + clr + (1013 - qnh) * 30}} ft


      Next VFR level on an easterly track: **FL{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} **: the cruising levels of the opposite (westerly) semicircle
      were used.

      - **{{d2}} **: the QNH correction was subtracted instead of added.

      - **{{d3}} **: rounded up to the next 500 ft only, ignoring the VFR
      semicircular rule.

      - **{{d4}} **: an extra 2000 ft margin was added.
