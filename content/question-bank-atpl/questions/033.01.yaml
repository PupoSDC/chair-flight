- id: QN4GLVBZM
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331855
    - ATPLGS-628491
    - AVEXAM-17131
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Given the following information, what is the wind correction angle
      (magnitude) to be applied? The wind requires a correction to the left.


      - Wind: {{wd}}°/{{ws}} kt (T)

      - TAS: {{tas}} kt

      - Variation: {{var_e}}°E

      - Heading: {{hdg}}° (M)
    variables:
      - id: wd
        label: wind direction
        unit: °
      - id: ws
        label: wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
      - id: var_e
        label: easterly variation
        unit: °
      - id: hdg
        label: magnetic heading
        unit: °
    answer:
      formula: abs(asin(ws * sin(wd - (hdg + var_e)) / tas))
      unit: ° left
      decimals: 0
    distractors:
      - id: d1
        formula: abs(asin(ws * sin(wd - hdg) / tas))
      - id: d2
        formula: abs(asin(ws * sin(wd - (hdg - var_e)) / tas))
      - id: d3
        formula: 2 * abs(asin(ws * sin(wd - (hdg + var_e)) / tas))
      - id: d4
        formula: abs(asin(ws * sin(wd - (hdg + var_e)) / tas)) + var_e
    presets:
      - id: p1
        values:
          wd: 60
          ws: 60
          tas: 380
          var_e: 5
          hdg: 85
      - id: p2
        values:
          wd: 100
          ws: 50
          tas: 280
          var_e: 5
          hdg: 130
    explanation: >-
      The wind correction angle is the angle between track and heading needed to
      cancel the drift: sin(WCA) = wind speed * sin(angle between wind and
      track) / TAS. Wind is given in true degrees, so the magnetic heading must
      first be converted to true using the variation (east is added).


      **Solution**


      True heading = {{hdg}} + {{var_e}} = {{= (hdg + var_e)}}°


      WCA = asin({{ws}} * sin({{wd}} - {{= (hdg + var_e)}}) / {{tas}}) =
      **{{answer}}° to the left**


      **Why the other answers are wrong**


      - **{{d1}}°**: the magnetic heading was used against the true wind
      direction (no variation applied).

      - **{{d2}}°**: the easterly variation was subtracted instead of added.

      - **{{d3}}°**: the correction was doubled.

      - **{{d4}}°**: the variation was added to the WCA.
