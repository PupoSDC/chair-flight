- id: QKDUWINKN
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335582
    - ATPLGS-625321
    - AVEXAM-22265
    - BGS-339557
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      On a VFR flight, the traffic circuit altitude has to be established
      {{off}} NM before reaching the destination aerodrome. The descent must
      begin no later than how many nautical miles' ground distance from the
      airfield?


      - Rate of descent: {{rod}} ft/min

      - Ground speed during descent: {{gs}} kt

      - Initial altitude: {{init}} ft AMSL

      - Traffic circuit altitude: {{circ}} ft AMSL
    variables:
      - id: init
        label: Initial altitude
        unit: ft
      - id: circ
        label: Circuit altitude
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
      - id: off
        label: Distance before aerodrome
        unit: NM
    answer:
      formula: (init - circ) / rod * gs / 60 + off
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (init - circ) / rod * gs / 60
      - id: d2
        formula: init / rod * gs / 60
      - id: d3
        formula: init / rod * gs / 60 + off
    presets:
      - id: p1
        values:
          init: 4500
          circ: 2500
          rod: 500
          gs: 130
          off: 5
      - id: p2
        values:
          init: 5000
          circ: 3000
          rod: 500
          gs: 120
          off: 4
      - id: p3
        values:
          init: 6000
          circ: 3000
          rod: 600
          gs: 140
          off: 5
    explanation: >-
      The descent has to be finished at the circuit altitude a fixed distance
      before the aerodrome. The descent itself covers (height to lose / rate of
      descent) x ground speed, and the extra distance to the aerodrome is added
      on top.


      **Solution**


      Height to lose = {{init}} - {{circ}} = {{= init - circ}} ft

      Descent distance = {{= init - circ}} / {{rod}} x {{gs}} / 60 = {{= (init -
      circ) / rod * gs / 60}} NM

      {{f: (init - circ) / rod * gs / 60 + off}} = {{n: (init - circ) / rod * gs
      / 60 + off}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: forgets to add the {{off}} NM between the end of the
      descent and the aerodrome.

      - **{{d2}} NM**: descends from the initial altitude to zero instead of to
      the circuit altitude, and forgets the {{off}} NM.

      - **{{d3}} NM**: descends to zero instead of to the circuit altitude.
