  template:
    type: chart-calculation
    question: >-
      Refer to the figure (VFR chart ED-4, Jeppesen GSPRM).


      The true track between Regensburg Oberhub aerodrome (EDNR) and Strunkovice
      aerodrome (LKSR) is {{track}}° (T).


      The magnetic variation read from the chart is {{var_e}}° E.


      What is the magnetic track?
    variables:
      - id: track
        label: True track
        unit: °
      - id: var_e
        label: Variation (east, read from the figure)
        unit: °
    chartInputs:
      - var_e
    answer:
      formula: track - var_e
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: track
      - id: d2
        formula: track + var_e
      - id: d3
        formula: track - 2 * var_e
    presets:
      - id: p1
        values:
          track: 92
          var_e: 3
    explanation: >-
      Magnetic track is true track corrected for variation: east variation is
      subtracted ("variation east, magnetic least"), west variation is added.


      **Solution**


      {{f: track - var_e}} = {{n: track - var_e}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}} °**: the variation is not applied, which gives the true track.

      - **{{d2}} °**: the east variation is added instead of subtracted.

      - **{{d3}} °**: the variation is applied twice.
