- id: QZWQARGRK
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-332834
  annexes:
    - jeppesen-vfr-chart-08-munich
  learningObjectives:
    - "033.01"
  template:
    type: chart-calculation
    question: >-
      Refer to VFR chart ED-4 from the Jeppesen GSPRM. The distance between the
      two aids measured on the chart is {{nm}} NM.


      Give this distance in km.
    variables:
      - id: nm
        label: Distance measured on the chart
        unit: NM
    chartInputs:
      - nm
    answer:
      formula: nm * 1.852
      unit: km
      decimals: 1
    distractors:
      - id: d1
        formula: nm
      - id: d2
        formula: nm * 1.15078
      - id: d3
        formula: nm / 1.852
      - id: d4
        formula: nm * 1.609
    presets:
      - id: p1
        values:
          nm: 36.5
      - id: p2
        values:
          nm: 25
      - id: p3
        values:
          nm: 48
    explanation: >-
      The chart distance (read from the chart in NM) is converted to km with 1
      NM = 1.852 km.


      **Solution**


      {{f: nm * 1.852}} = {{n: nm * 1.852}} = **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: the NM value was left unconverted.

      - **{{d2}} km**: converted to statute miles instead of km.

      - **{{d3}} km**: divided by 1.852 instead of multiplied.

      - **{{d4}} km**: used the statute mile factor (1.609) instead of the
      nautical mile factor.
