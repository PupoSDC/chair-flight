- id: QGICLVAT
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331586
    - BGS-339578
    - AVEXAM-16189
  annexes: []
  learningObjectives:
    - 033.01.01.02.05
  template:
    type: calculation
    question: >-
      The elevation of the departure airport is {{elev}} ft.


      An aircraft has to climb to FL{{fl}} with a rate of climb of {{roc}}
      ft/min.


      The QNH is {{qnh}} hPa.


      Determine the climb time (assume 1 hPa = 30 ft).
    variables:
      - id: elev
        label: Airport elevation
        unit: ft
      - id: fl
        label: Flight level
        unit: FL
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: (fl * 100 - (elev + (1013 - qnh) * 30)) / roc
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 - elev) / roc
      - id: d2
        formula: (fl * 100 - elev - 2 * (1013 - qnh) * 30) / roc
      - id: d3
        formula: (fl * 100 - elev + 2 * (1013 - qnh) * 30) / roc
    presets:
      - id: p1
        values:
          elev: 2500
          fl: 105
          roc: 750
          qnh: 995
      - id: p2
        values:
          elev: 1800
          fl: 85
          roc: 700
          qnh: 985
      - id: p3
        values:
          elev: 3200
          fl: 120
          roc: 600
          qnh: 1000
    explanation: >-
      The flight level is a pressure altitude, so the height to climb is
      measured from the pressure altitude of the aerodrome: its elevation plus
      30 ft per hPa that the QNH is below 1013 hPa. The climb time is that
      height divided by the rate of climb.


      **Solution**


      Airport pressure altitude = {{elev}} + (1013 - {{qnh}}) × 30 = {{= (elev +
      (1013 - qnh) * 30)}} ft

      Height to climb = {{= fl * 100}} - {{= (elev + (1013 - qnh) * 30)}} = {{=
      fl * 100 - (elev + (1013 - qnh) * 30)}} ft


      {{f: (fl * 100 - (elev + (1013 - qnh) * 30)) / roc}} = {{n: (fl * 100 -
      (elev + (1013 - qnh) * 30)) / roc}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: the QNH correction is ignored; the height is taken from
      the elevation only.

      - **{{d2}} min**: the QNH correction is applied with the wrong sign, and
      twice.

      - **{{d3}} min**: the QNH correction is applied twice in the right
      direction (it is added to the height instead of the aerodrome pressure
      altitude being computed).
- id: QGUOLTXU
  docId: "033.01"
  relatedQuestions:
    - QRZZADRR
  externalIds:
    - ATPLQ-336220
    - AVEXAM-13363
    - ATPLGS-129295
  annexes:
    - jeppesen-vfr-chart-08-munich
  learningObjectives:
    - 033.01.01.02.02
  template:
    type: chart-calculation
    question: >-
      Refer to VFR chart ED-4 from Jeppesen GSPRM 2017. You are approaching
      airfield MÜHLDORF (EDMY) from the east on track {{track}}°. The descent
      should be planned to arrive at {{target_alt}} ft approximately abeam of
      airfield ALTÖTTING.


      Atmospheric conditions: ISA


      - TAS: {{tas}} kt

      - Average wind: {{wind_dir}}° (T) / {{wind_spd}} kt

      - Rate of descent: {{rod}} ft/min

      - Cruising level: FL{{fl_cruise}}

      - Distance from MÜHLDORF to the point abeam ALTÖTTING (value read from the
      chart): {{dist_fig}} NM


      How many nautical miles from MÜHLDORF is your top of descent (ToD)?
    variables:
      - id: track
        label: Track
        unit: °
      - id: target_alt
        label: Target altitude
        unit: ft
      - id: tas
        label: TAS
        unit: kt
      - id: wind_dir
        label: Wind direction
        unit: °
      - id: wind_spd
        label: Wind speed
        unit: kt
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: fl_cruise
        label: Cruising level
        unit: FL
      - id: dist_fig
        label: Distance MÜHLDORF to point abeam ALTÖTTING (read from the graph)
        unit: NM
    chartInputs:
      - dist_fig
    answer:
      formula: (fl_cruise * 100 - target_alt) / rod * (tas - wind_spd * cos(wind_dir -
        track)) / 60 + dist_fig
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl_cruise * 100 - target_alt) / rod * (tas - wind_spd * cos(wind_dir -
          track)) / 60
      - id: d2
        formula: (fl_cruise * 100 - target_alt) / rod * tas / 60 + dist_fig
      - id: d3
        formula: (fl_cruise * 100 - target_alt) / rod * (tas + wind_spd * cos(wind_dir -
          track)) / 60 + dist_fig
      - id: d4
        formula: (fl_cruise * 100 - target_alt) / (2 * rod) * (tas - wind_spd *
          cos(wind_dir - track)) / 60 + dist_fig
    presets:
      - id: p1
        values:
          track: 270
          target_alt: 3500
          tas: 110
          wind_dir: 300
          wind_spd: 16
          rod: 500
          fl_cruise: 125
          dist_fig: 6
      - id: p2
        values:
          track: 270
          target_alt: 2500
          tas: 120
          wind_dir: 320
          wind_spd: 20
          rod: 600
          fl_cruise: 110
          dist_fig: 8
    explanation: >-
      The top of descent is the distance flown during the descent, plus the
      distance from MÜHLDORF to the point abeam ALTÖTTING. The descent takes
      (cruising level - target altitude) / rate of descent minutes. The
      groundspeed is the TAS reduced by the headwind component, which is the
      wind speed multiplied by the cosine of the angle between the wind
      direction and the track.


      **Solution**


      Time to descend: {{n: (fl_cruise * 100 - target_alt) / rod}} min


      Groundspeed: {{n: tas - wind_spd * cos(wind_dir - track)}} kt


      TOD distance: {{f: (fl_cruise * 100 - target_alt) / rod * (tas - wind_spd
      * cos(wind_dir - track)) / 60 + dist_fig}} = {{n: (fl_cruise * 100 -
      target_alt) / rod * (tas - wind_spd * cos(wind_dir - track)) / 60 +
      dist_fig}} = **{{answer}} NM**


      **Why the other answers are wrong**

      - **{{d1}} NM**: forgets the distance from MÜHLDORF to the point abeam
      ALTÖTTING.

      - **{{d2}} NM**: ignores the wind.

      - **{{d3}} NM**: treats the wind as a tailwind.

      - **{{d4}} NM**: uses twice the rate of descent, which halves the descent
      time.
- id: QH2H3LXFB
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335494
    - ATPLGS-629337
    - AVEXAM-99834
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      The following information is for an aircraft in the cruise at 11:50 UTC.


      Cruise level: FL410


      - OAT: ISA +{{isa_dev}}°C

      - Mach number: {{mach}}

      - Wind component: {{wc}} kt (negative = headwind)


      What will be the groundspeed? (Use a local speed of sound of 38.9 *
      sqrt(T) kt, T in kelvin; ISA temperature at FL410 is -56.5°C.)
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: isa_dev
        label: ISA deviation
        unit: °C
      - id: wc
        label: Wind component
        unit: kt
    answer:
      formula: mach * 38.9 * sqrt(273.15 - 56.5 + isa_dev) + wc
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach * 38.9 * sqrt(273.15 - 56.5 + isa_dev) - wc
      - id: d2
        formula: mach * 38.9 * sqrt(273.15 - 56.5 + isa_dev)
      - id: d3
        formula: mach * 38.9 * sqrt(273.15 - 56.5) + wc
    presets:
      - id: p1
        values:
          mach: 0.86
          isa_dev: 10
          wc: -25
      - id: p2
        values:
          mach: 0.82
          isa_dev: 15
          wc: -40
      - id: p3
        values:
          mach: 0.78
          isa_dev: 5
          wc: 30
    explanation: >-
      Groundspeed is true airspeed plus the wind component along track. TAS
      follows from the Mach number and the speed of sound, which depends on the
      static air temperature (ISA temperature at FL410 plus the deviation).


      **Solution**


      SAT = -56.5 + {{isa_dev}} = {{= -56.5 + isa_dev}} °C = {{= 273.15 - 56.5 +
      isa_dev}} K


      TAS = {{mach}} * 38.9 * sqrt({{= 273.15 - 56.5 + isa_dev}}) = {{= mach *
      38.9 * sqrt(273.15 - 56.5 + isa_dev)}} kt


      GS = TAS + wind component = {{= mach * 38.9 * sqrt(273.15 - 56.5 +
      isa_dev)}} + ({{wc}}) = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the wind component is applied with the wrong sign.

      - **{{d2}} kt**: the wind component is ignored (groundspeed taken equal to
      TAS).

      - **{{d3}} kt**: the ISA deviation is ignored when computing the
      temperature and hence the speed of sound.
