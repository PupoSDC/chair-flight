- id: QACRDLXSL
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333588
    - AVEXAM-99966
    - BGS-331042
    - BGS-331357
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: |-
      Given the following information, what is the expected leg time?

      - Leg track: {{trk}}°
      - Distance: {{dist}} NM
      - TAS: {{tas}} kt
      - Wind: {{wd}}°/{{ws}} kt
    variables:
      - id: trk
        label: Track
        unit: °
      - id: dist
        label: Distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: dist / (tas * cos(asin(ws * sin(wd - trk) / tas)) - ws * cos(wd - trk))
        * 60
      unit: minutes
      decimals: 0
    distractors:
      - id: d1
        formula: dist / tas * 60
      - id: d2
        formula: dist / (tas - ws * abs(sin(wd - trk))) * 60
      - id: d3
        formula: dist / (tas * cos(asin(ws * sin(wd - trk) / tas)) + ws * cos(wd - trk))
          * 60
    presets:
      - id: p1
        values:
          trk: 90
          dist: 100
          tas: 350
          wd: 30
          ws: 100
      - id: p2
        values:
          trk: 270
          dist: 120
          tas: 420
          wd: 330
          ws: 80
      - id: p3
        values:
          trk: 180
          dist: 150
          tas: 280
          wd: 240
          ws: 60
    explanation: >-
      The leg time is the distance divided by the ground speed. The ground speed
      follows from the wind triangle: the wind correction angle (WCA) needed to
      hold the track changes the TAS component along the track, and the wind
      adds or subtracts its along-track component.


      **Solution**


      WCA = {{= asin(ws * sin(wd - trk) / tas)}}°


      Ground speed = {{= tas * cos(asin(ws * sin(wd - trk) / tas)) - ws * cos(wd
      - trk)}} kt


      Leg time = {{f: dist / (tas * cos(asin(ws * sin(wd - trk) / tas)) - ws *
      cos(wd - trk)) * 60}} = **{{answer}} minutes**


      **Why the other answers are wrong**


      - **{{d1}} minutes**: wind ignored, distance divided by TAS.

      - **{{d2}} minutes**: the crosswind-related sine component was used as
      headwind and no wind correction angle was applied.

      - **{{d3}} minutes**: the headwind component was added to the TAS as if it
      were a tailwind.
