- id: QP1J2FARX
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334359
    - BGS-331447
    - BGS-331206
    - ATPLGS-626294
    - AVEXAM-78443
    - BGS-330987
    - BGS-331360
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      When reviewing the wind charts, you notice that the average wind in cruise
      will be a {{hw}} kt headwind. Given the following data, what will be the
      flight time to destination?


      - Time to top of climb: {{cl}} min

      - Cruise leg: {{dist}} NM, TAS {{tas}} kt

      - Time from top of descent to landing: {{de}} min


      Express the flight time as hours and minutes; give the minutes part (0 to
      59) after the full hours.
    variables:
      - id: cl
        label: Time to top of climb
        unit: min
      - id: dist
        label: Cruise distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
      - id: de
        label: Descent time
        unit: min
    answer:
      formula: round((cl + dist / (tas - hw) * 60 + de)) - 60 * floor(round((cl + dist
        / (tas - hw) * 60 + de)) / 60)
      unit: min
      decimals: 0
    distractors:
      - id: d1
        formula: round((cl + dist / (tas + hw) * 60 + de)) - 60 * floor(round((cl + dist
          / (tas + hw) * 60 + de)) / 60)
      - id: d2
        formula: round((cl + dist / (tas - hw) * 60)) - 60 * floor(round((cl + dist /
          (tas - hw) * 60)) / 60)
      - id: d3
        formula: round((dist / (tas - hw) * 60 + de)) - 60 * floor(round((dist / (tas -
          hw) * 60 + de)) / 60)
      - id: d4
        formula: round((cl + dist / tas * 60 + de)) - 60 * floor(round((cl + dist / tas
          * 60 + de)) / 60)
    presets:
      - id: p1
        values:
          cl: 30
          dist: 740
          tas: 460
          hw: 25
          de: 22
      - id: p2
        values:
          cl: 25
          dist: 620
          tas: 440
          hw: 30
          de: 18
      - id: p3
        values:
          cl: 32
          dist: 850
          tas: 480
          hw: 20
          de: 24
    explanation: >-
      Total flight time is the climb time, plus the cruise time at the ground
      speed (TAS minus headwind), plus the descent time.


      **Solution**


      Cruise ground speed = {{= tas - hw}} kt, cruise time = {{= dist / (tas -
      hw) * 60}} min


      Total = {{= cl}} + {{= dist / (tas - hw) * 60}} + {{= de}} = {{= round((cl
      + dist / (tas - hw) * 60 + de))}} min = {{= floor(round((cl + dist / (tas
      - hw) * 60 + de)) / 60)}} h **{{answer}} min**


      **Why the other answers are wrong** (minutes part of the flight time)


      - **{{d1}} min**: the headwind was added to the TAS.

      - **{{d2}} min**: the descent time was forgotten.

      - **{{d3}} min**: the climb time was forgotten.

      - **{{d4}} min**: the wind was ignored.
