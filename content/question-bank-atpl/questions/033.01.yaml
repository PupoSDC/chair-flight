- id: QR8HOLJDP
  docId: "033.01"
  relatedQuestions:
    - QA6KP6JYQ
  externalIds:
    - ATPLQ-332387
    - BGS-331190
    - BGS-331294
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Given the following information, calculate the maximum attainable flight
      time and range.


      - Average fuel flow: {{ff}} US gal/h

      - Available fuel: {{fuel}} US gal

      - TAS: {{tas}} kt

      - Wind component: {{wc}} kt tailwind


      What is the range in NM?
    variables:
      - id: ff
        label: Fuel flow
        unit: US gal/h
      - id: fuel
        label: Available fuel
        unit: US gal
      - id: tas
        label: TAS
        unit: kt
      - id: wc
        label: Tailwind component
        unit: kt
    answer:
      formula: fuel / ff * (tas + wc)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: fuel / ff * (tas - wc)
      - id: d2
        formula: fuel / ff * tas
      - id: d3
        formula: fuel / ff * (tas + 2 * wc)
      - id: d4
        formula: fuel / ff * (tas + wc) * 60
    presets:
      - id: p1
        values:
          ff: 9.6
          fuel: 50
          tas: 100
          wc: 15
      - id: p2
        values:
          ff: 11
          fuel: 44
          tas: 120
          wc: 25
    explanation: >-
      The endurance is the available fuel divided by the fuel flow. The range is
      the endurance multiplied by the ground speed, i.e. the TAS plus the
      tailwind component.


      **Solution**


      Endurance: {{= fuel / ff}} h


      {{f: fuel / ff * (tas + wc)}} = {{n: fuel / ff * (tas + wc)}} =
      **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the tailwind subtracted as if it were a headwind.

      - **{{d2}} NM**: wind ignored, TAS used as ground speed.

      - **{{d3}} NM**: wind component applied twice.

      - **{{d4}} NM**: endurance converted to minutes before multiplying by the
      speed in kt.
