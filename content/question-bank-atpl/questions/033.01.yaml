- id: QHTXJ76LC
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339387
    - ATPLGS-625298
    - BGS-339584
    - ATPLGS-113562
    - ATPLQ-339497
    - BGS-330243
    - AVEXAM-73300
  annexes: []
  learningObjectives:
    - "033.01"
    - 033.06.01.01.05
  template:
    type: calculation
    question: >-
      An aircraft cruises at FL {{fl}} with a ground speed of {{gs}} kt. The
      true airspeed stays constant in the descent, the wind is negligible and
      the temperature is ISA. The pilot wants to arrive overhead the aerodrome
      at {{alt}} ft (QNH {{qnh}} hPa) with a rate of descent of {{rod}} ft/min.


      At what distance from the aerodrome should the descent be commenced? (Use
      1 hPa = 30 ft and standard pressure 1013 hPa; answer in NM.)
    variables:
      - id: fl
        label: Cruise flight level
        unit: ""
      - id: qnh
        label: QNH
        unit: hPa
      - id: alt
        label: Altitude to reach
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: (fl * 100 + (qnh - 1013) * 30 - alt) / rod * gs / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (fl * 100 - alt) / rod * gs / 60
      - id: d2
        formula: (fl * 100 - (qnh - 1013) * 30 - alt) / rod * gs / 60
      - id: d3
        formula: (fl * 100 + (qnh - 1013) * 30) / rod * gs / 60
      - id: d4
        formula: (fl * 100 + (qnh - 1013) * 30 - alt) / rod
    presets:
      - id: p1
        values:
          fl: 85
          qnh: 1030
          alt: 2000
          rod: 500
          gs: 140
      - id: p2
        values:
          fl: 95
          qnh: 1030
          alt: 2000
          rod: 500
          gs: 155
      - id: p3
        values:
          fl: 110
          qnh: 1020
          alt: 1500
          rod: 500
          gs: 150
    explanation: >-
      The descent distance is the time needed to lose the height multiplied by
      the ground speed. The height to lose is measured from the true altitude at
      cruise level: a flight level is flown on the standard setting (1013 hPa),
      so with QNH {{qnh}} hPa the aeroplane is {{= (qnh - 1013) * 30}} ft ({{=
      qnh - 1013}} hPa × 30 ft/hPa) higher above the QNH datum than the flight
      level suggests.


      **Solution**


      Height to lose = {{= fl * 100}} ft + {{= (qnh - 1013) * 30}} ft - {{alt}}
      ft = {{= fl * 100 + (qnh - 1013) * 30 - alt}} ft


      Time = {{= (fl * 100 + (qnh - 1013) * 30 - alt)}} ft / {{rod}} ft/min =
      {{= (fl * 100 + (qnh - 1013) * 30 - alt) / rod}} min


      {{f: (fl * 100 + (qnh - 1013) * 30 - alt) / rod * gs / 60}} = {{n: (fl *
      100 + (qnh - 1013) * 30 - alt) / rod * gs / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the QNH correction was ignored and the descent was
      planned from the flight level as if it were altitude.

      - **{{d2}} NM**: the QNH correction was subtracted instead of added.

      - **{{d3}} NM**: the target altitude was not subtracted, so too much
      height was assumed.

      - **{{d4}} NM**: this is the descent time in minutes, not multiplied by
      the ground speed.
- id: QIEDFED8V
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331459
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Calculate the time it will take to fly from A to B on a cross country
      flight given the data below.


      - Distance A to B: {{dist}} NM

      - TAS: {{tas}} kt

      - TT: {{trk}}°

      - W/V: {{wdir}}°/{{wspd}} kt
    variables:
      - id: dist
        label: Distance
        unit: NM
      - id: trk
        label: True track
        unit: °
      - id: wdir
        label: Wind direction (from)
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd * cos(wdir
        - trk)) * 60
      unit: min
      decimals: 1
    distractors:
      - id: d1
        formula: dist / tas * 60
      - id: d2
        formula: dist / (tas - wspd * cos(wdir - trk)) * 60
      - id: d3
        formula: dist / (tas + wspd * cos(wdir - trk)) * 60
      - id: d4
        formula: dist / (tas - wspd) * 60
      - id: d5
        formula: dist / (tas + wspd) * 60
    presets:
      - id: p1
        values:
          dist: 83
          trk: 130
          wdir: 22
          wspd: 23
          tas: 120
      - id: p2
        values:
          dist: 120
          trk: 250
          wdir: 300
          wspd: 30
          tas: 140
      - id: p3
        values:
          dist: 95
          trk: 45
          wdir: 330
          wspd: 25
          tas: 110
    explanation: >-
      The time is the distance divided by the ground speed, which is obtained
      from the wind triangle (wind correction angle for drift, then the wind
      component along the track).


      **Solution**


      Wind correction angle: {{= asin(wspd * sin(wdir - trk) / tas)}}°


      Ground speed: {{= tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)}} kt


      {{f: dist / (tas * cos(asin(wspd * sin(wdir - trk) / tas)) - wspd *
      cos(wdir - trk)) * 60}} = {{n: dist / (tas * cos(asin(wspd * sin(wdir -
      trk) / tas)) - wspd * cos(wdir - trk)) * 60}} = **{{answer}} min**


      **Why the other answers are wrong**


      - **{{d1}} min**: ignores the wind (time at TAS).

      - **{{d2}} min**: uses the wind component but ignores the drift
      correction.

      - **{{d3}} min**: adds the wind component with the wrong sign.

      - **{{d4}} min**: treats the whole wind speed as a headwind.

      - **{{d5}} min**: treats the whole wind speed as a tailwind.
