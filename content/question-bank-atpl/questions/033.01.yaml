    type: calculation
    question: |-
      How many feet do you have to climb to reach FL{{fl}}?

      Given:

      - Departure aerodrome elevation: {{elev}} ft
      - QNH = {{qnh}} hPa

      Temperature = ISA
      1 hPa = 30 ft
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
    answer:
      formula: fl * 100 - (elev + (1013 - qnh) * 30)
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: fl * 100 + (qnh - 1013) * 30
      - id: d2
        formula: fl * 100 - elev + 2 * (qnh - 1013) * 30
      - id: d3
        formula: fl * 100 - elev
    presets:
      - id: p1
        values:
          fl: 75
          elev: 1500
          qnh: 1023
      - id: p2
        values:
          fl: 90
          elev: 800
          qnh: 1005
      - id: p3
        values:
          fl: 55
          elev: 2200
          qnh: 1018
    explanation: >-
      A flight level is a pressure altitude (standard setting 1013 hPa). The
      pressure altitude of the aerodrome is its elevation corrected by 30 ft per
      hPa of difference between 1013 hPa and the QNH. The climb required is the
      difference between the flight level and the aerodrome pressure altitude.


      **Solution**


      Aerodrome pressure altitude = {{elev}} + (1013 - {{qnh}}) × 30 = {{= elev
      + (1013 - qnh) * 30}} ft


      {{f: fl * 100 - (elev + (1013 - qnh) * 30)}} = {{n: fl * 100 - (elev +
      (1013 - qnh) * 30)}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the QNH correction is applied to the flight level with
      the wrong sign and the aerodrome elevation is ignored.

      - **{{d2}} ft**: the QNH correction is applied with the wrong sign, and
      twice.

      - **{{d3}} ft**: the flight level minus the elevation, ignoring the QNH
      correction.
