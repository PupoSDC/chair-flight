- id: QNF4GUGC2
  docId: "033.01"
  relatedQuestions:
    - QHTXJ76LC
  externalIds:
    - ATPLQ-333833
    - AVEXAM-57620
    - BGS-339585
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Given the following information, at what distance from the destination
      should descent be commenced?


      - Height to lose: {{alt}} ft

      - Rate of descent: {{rod}} ft/min

      - Ground speed: {{gs}} kt


      Give the distance in NM.
    variables:
      - id: alt
        label: Height to lose
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: alt / rod * gs / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: alt / rod * gs
      - id: d2
        formula: alt / rod
      - id: d3
        formula: alt / rod * gs / 100
      - id: d4
        formula: alt / rod * gs / 60 * 1.15
      - id: d5
        formula: alt / rod * 60 / gs
    presets:
      - id: p1
        values:
          alt: 3500
          rod: 300
          gs: 135
      - id: p2
        values:
          alt: 5000
          rod: 500
          gs: 150
      - id: p3
        values:
          alt: 4000
          rod: 400
          gs: 120
    explanation: >-
      The descent distance is the descent time multiplied by the ground speed.
      The time follows from the height to lose divided by the rate of descent;
      the ground speed in kt is converted to NM per minute by dividing by 60.


      **Solution**


      Time = {{alt}} ft / {{rod}} ft/min = {{= alt / rod}} min


      {{f: alt / rod * gs / 60}} = {{n: alt / rod * gs / 60}} = **{{answer}}
      NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the ground speed was not converted from NM/h to NM/min
      (division by 60 forgotten).

      - **{{d2}} NM**: this is only the descent time in minutes, not a distance.

      - **{{d3}} NM**: ground speed divided by 100 instead of 60.

      - **{{d4}} NM**: the result was converted with the NM to statute mile
      factor of 1.15 for no reason.

      - **{{d5}} NM**: the time and the ground speed were combined in the wrong
      ratio (inverted).
