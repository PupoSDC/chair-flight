- id: QFCIAZPD
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-338546
    - ATPLQ-331549
    - ATPLGS-627107
    - AVEXAM-60679
  annexes:
    - jeppesen-vfr-chart-08-munich
    - jeppesen-vfr-chart-11-linz-wels
  learningObjectives:
    - 033.01.01.02.04
  template:
    type: chart-calculation
    question: >-
      Refer to the chart (VFR chart ED-4, Jeppesen GSPRM).


      Find the magnetic course for a flight from A (N{{lat1_d}}°{{lat1_m}}'
      E{{lon1_d}}°{{lon1_m}}') to B (N{{lat2_d}}°{{lat2_m}}'
      E{{lon2_d}}°{{lon2_m}}').


      The magnetic variation read from the chart is {{var_e}}° E.
    variables:
      - id: lat1_d
        label: Latitude A, degrees
        unit: °
      - id: lat1_m
        label: Latitude A, minutes
        unit: "'"
      - id: lon1_d
        label: Longitude A, degrees
        unit: °
      - id: lon1_m
        label: Longitude A, minutes
        unit: "'"
      - id: lat2_d
        label: Latitude B, degrees
        unit: °
      - id: lat2_m
        label: Latitude B, minutes
        unit: "'"
      - id: lon2_d
        label: Longitude B, degrees
        unit: °
      - id: lon2_m
        label: Longitude B, minutes
        unit: "'"
      - id: var_e
        label: Variation (east, read from the figure)
        unit: °
    chartInputs:
      - var_e
    answer:
      formula: (atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) * cos(((lat1_d
        + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d + lat2_m / 60) -
        (lat1_d + lat1_m / 60)) - var_e) + 360 - 360 * floor(((atan2(((lon2_d +
        lon2_m / 60) - (lon1_d + lon1_m / 60)) * cos(((lat1_d + lat1_m / 60) +
        (lat2_d + lat2_m / 60)) / 2), (lat2_d + lat2_m / 60) - (lat1_d + lat1_m
        / 60)) - var_e) + 360) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) * cos(((lat1_d
          + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d + lat2_m / 60)
          - (lat1_d + lat1_m / 60))) + 360 - 360 * floor(((atan2(((lon2_d +
          lon2_m / 60) - (lon1_d + lon1_m / 60)) * cos(((lat1_d + lat1_m / 60) +
          (lat2_d + lat2_m / 60)) / 2), (lat2_d + lat2_m / 60) - (lat1_d +
          lat1_m / 60))) + 360) / 360)
      - id: d2
        formula: ((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60)) - var_e) + 360 - 360 *
          floor(((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60)) - var_e) + 360) / 360)) + 180 -
          360 * floor((((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60))
          * cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d
          + lat2_m / 60) - (lat1_d + lat1_m / 60)) - var_e) + 360 - 360 *
          floor(((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60)) - var_e) + 360) / 360)) + 180)
          / 360)
      - id: d3
        formula: ((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60))) + 360 - 360 *
          floor(((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60))) + 360) / 360)) + 180 - 360 *
          floor((((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60))) + 360 - 360 *
          floor(((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60))) + 360) / 360)) + 180) / 360)
      - id: d4
        formula: (atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) * cos(((lat1_d
          + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d + lat2_m / 60)
          - (lat1_d + lat1_m / 60)) + var_e) + 360 - 360 *
          floor(((atan2(((lon2_d + lon2_m / 60) - (lon1_d + lon1_m / 60)) *
          cos(((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2), (lat2_d +
          lat2_m / 60) - (lat1_d + lat1_m / 60)) + var_e) + 360) / 360)
    presets:
      - id: p1
        values:
          lat1_d: 48
          lat1_m: 35
          lon1_d: 11
          lon1_m: 8
          lat2_d: 48
          lat2_m: 11
          lon2_d: 11
          lon2_m: 49
          var_e: 2.4
      - id: p2
        values:
          lat1_d: 48
          lat1_m: 30.9
          lon1_d: 14
          lon1_m: 24.5
          lat2_d: 48
          lat2_m: 31.1
          lon2_d: 13
          lon2_m: 20.8
          var_e: 3.3
    explanation: >-
      The true course follows from the difference in position: the east-west
      distance is the change in longitude times the cosine of the mean latitude,
      the north-south distance is the change in latitude. The magnetic course is
      the true course minus the east variation (plus the west variation).


      **Solution**


      True course = {{= atan2((lon2_d + lon2_m / 60 - lon1_d - lon1_m / 60) *
      cos((lat1_d + lat1_m / 60 + lat2_d + lat2_m / 60) / 2), lat2_d + lat2_m /
      60 - lat1_d - lat1_m / 60)}}° (negative values mean the angle is measured
      west of north, add 360°)


      Magnetic course = true course - {{var_e}}° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the variation is ignored, which gives the true course.

      - **{{d2}}°**: the reciprocal of the correct magnetic course (flight
      direction reversed).

      - **{{d3}}°**: the reciprocal of the true course.

      - **{{d4}}°**: the east variation is added instead of subtracted.
- id: QFCPLWLM8
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335514
    - BGS-331302
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      An aircraft is being flown in the cruise. The wind pushes it to the left
      of track. Determine the expected drift (magnitude), given:


      - Course: {{crs}}° (M)

      - TAS: {{tas}} kt

      - Forecast wind: {{wd}}°/{{ws}} kt

      - Variation: {{var_w}}°W
    variables:
      - id: crs
        label: magnetic course
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: wind direction
        unit: °
      - id: ws
        label: wind speed
        unit: kt
      - id: var_w
        label: westerly variation
        unit: °
    answer:
      formula: abs(asin(ws * sin(wd - (crs - var_w)) / tas))
      unit: ° left
      decimals: 0
    distractors:
      - id: d1
        formula: abs(asin(ws * sin(wd - crs) / tas))
      - id: d2
        formula: abs(asin(ws * sin(wd - (crs + var_w)) / tas))
      - id: d3
        formula: abs(asin(ws * cos(wd - (crs - var_w)) / tas))
    presets:
      - id: p1
        values:
          crs: 210
          tas: 179
          wd: 330
          ws: 50
          var_w: 20
      - id: p2
        values:
          crs: 60
          tas: 140
          wd: 130
          ws: 40
          var_w: 15
    explanation: >-
      Drift follows from sin(drift) = wind speed * sin(angle between wind and
      track) / TAS. The wind is given in true degrees, so the magnetic course
      must first be converted to a true course (west variation is subtracted).


      **Solution**


      True course = {{crs}} - {{var_w}} = {{= (crs - var_w)}}°


      Drift = asin({{ws}} * sin({{wd}} - {{= (crs - var_w)}}) / {{tas}}) =
      **{{answer}}° left**


      **Why the other answers are wrong**


      - **{{d1}}° left**: the magnetic course was compared directly with the
      true wind direction.

      - **{{d2}}° left**: the westerly variation was added instead of
      subtracted.

      - **{{d3}}° left**: cosine used instead of sine of the wind angle.
- id: QFCROHXXL
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-331593
    - ATPLGS-629322
    - AVEXAM-44215
    - AVEXAM-35831
  annexes:
    - jeppesen-vfr-chart-11-linz-wels
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      Determine the true course (TC) from point A to point B, given the
      coordinates:


      - Point A: N{{alat_d}}° {{alat_m}}' E{{alon_d}}° {{alon_m}}'

      - Point B: N{{blat_d}}° {{blat_m}}' E{{blon_d}}° {{blon_m}}'


      Give the true course in degrees.
    variables:
      - id: alat_d
        label: Latitude A (degrees)
        unit: °
      - id: alat_m
        label: Latitude A (minutes)
        unit: min
      - id: alon_d
        label: Longitude A (degrees)
        unit: °
      - id: alon_m
        label: Longitude A (minutes)
        unit: min
      - id: blat_d
        label: Latitude B (degrees)
        unit: °
      - id: blat_m
        label: Latitude B (minutes)
        unit: min
      - id: blon_d
        label: Longitude B (degrees)
        unit: °
      - id: blon_m
        label: Longitude B (minutes)
        unit: min
    answer:
      formula: ((atan2(sin((blon_d + blon_m / 60) - (alon_d + alon_m / 60)) *
        cos(blat_d + blat_m / 60), cos(alat_d + alat_m / 60) * sin(blat_d +
        blat_m / 60) - sin(alat_d + alat_m / 60) * cos(blat_d + blat_m / 60) *
        cos((blon_d + blon_m / 60) - (alon_d + alon_m / 60)))) - 360 *
        floor((atan2(sin((blon_d + blon_m / 60) - (alon_d + alon_m / 60)) *
        cos(blat_d + blat_m / 60), cos(alat_d + alat_m / 60) * sin(blat_d +
        blat_m / 60) - sin(alat_d + alat_m / 60) * cos(blat_d + blat_m / 60) *
        cos((blon_d + blon_m / 60) - (alon_d + alon_m / 60)))) / 360))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan2(sin((blon_d + blon_m) - (alon_d + alon_m)) * cos(blat_d +
          blat_m), cos(alat_d + alat_m) * sin(blat_d + blat_m) - sin(alat_d +
          alat_m) * cos(blat_d + blat_m) * cos((blon_d + blon_m) - (alon_d +
          alon_m)))
      - id: d2
        formula: (atan2(sin((blon_d + blon_m / 60) - (alon_d + alon_m / 60)) *
          cos(blat_d + blat_m / 60), cos(alat_d + alat_m / 60) * sin(blat_d +
          blat_m / 60) - sin(alat_d + alat_m / 60) * cos(blat_d + blat_m / 60) *
          cos((blon_d + blon_m / 60) - (alon_d + alon_m / 60)))) + 180
      - id: d3
        formula: 90 - (atan2(sin((blon_d + blon_m / 60) - (alon_d + alon_m / 60)) *
          cos(blat_d + blat_m / 60), cos(alat_d + alat_m / 60) * sin(blat_d +
          blat_m / 60) - sin(alat_d + alat_m / 60) * cos(blat_d + blat_m / 60) *
          cos((blon_d + blon_m / 60) - (alon_d + alon_m / 60))))
      - id: d4
        formula: -(atan2(sin((blon_d + blon_m / 60) - (alon_d + alon_m / 60)) *
          cos(blat_d + blat_m / 60), cos(alat_d + alat_m / 60) * sin(blat_d +
          blat_m / 60) - sin(alat_d + alat_m / 60) * cos(blat_d + blat_m / 60) *
          cos((blon_d + blon_m / 60) - (alon_d + alon_m / 60))))
    presets:
      - id: p1
        values:
          alat_d: 48
          alat_m: 30.9
          alon_d: 14
          alon_m: 24.5
          blat_d: 48
          blat_m: 31.1
          blon_d: 13
          blon_m: 20.8
      - id: p2
        values:
          alat_d: 49
          alat_m: 0
          alon_d: 10
          alon_m: 0
          blat_d: 49
          blat_m: 15
          blon_d: 11
          blon_m: 0
      - id: p3
        values:
          alat_d: 52
          alat_m: 30
          alon_d: 5
          alon_m: 10
          blat_d: 52
          blat_m: 20
          blon_d: 4
          blon_m: 50
    explanation: >-
      The true course is the initial great-circle bearing from point A to point
      B, measured clockwise from true north. It is computed from the coordinates
      with the spherical bearing formula. Minutes are converted to decimal
      degrees (minutes / 60); if the result is negative, add 360° so that it
      lies between 0° and 360°.


      **Solution**


      Longitude difference (B minus A): {{= (blon_d + blon_m / 60) - (alon_d +
      alon_m / 60)}}°


      Bearing before adjusting to 0° to 360°: {{= atan2(sin((blon_d + blon_m /
      60) - (alon_d + alon_m / 60)) * cos(blat_d + blat_m / 60), cos(alat_d +
      alat_m / 60) * sin(blat_d + blat_m / 60) - sin(alat_d + alat_m / 60) *
      cos(blat_d + blat_m / 60) * cos((blon_d + blon_m / 60) - (alon_d + alon_m
      / 60)))}}°


      True course: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: minutes used as decimal degrees (minutes not divided by
      60).

      - **{{d2}}°**: reciprocal course (bearing + 180°), i.e. the direction from
      B back to A.

      - **{{d3}}°**: 90° minus the bearing; the sine and cosine axes of the
      formula are swapped.

      - **{{d4}}°**: sign error; the mirror image of the bearing is given.
- id: QFGXUYJ1D
  docId: "033.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-333794
    - ATPLQ-336571
    - AVEXAM-54361
    - BGS-331046
    - ATPLGS-629293
  annexes: []
  learningObjectives:
    - "033.01"
  template:
    type: calculation
    question: >-
      A pilot flies under VFR and must clear the highest obstacle on the route
      by a minimum height. Given the following information:


      - Highest obstacle elevation: {{obstacle}} ft

      - Required clearance: {{clearance}} ft

      - Magnetic track: {{track}}°

      - QNH: {{qnh}} hPa

      - Temperature: ISA {{isa}}°C


      Assume 1 hPa = 30 ft. What is the lowest appropriate VFR flight level that
      gives this clearance?
    variables:
      - id: obstacle
        label: Highest obstacle elevation
        unit: ft
      - id: clearance
        label: Required clearance
        unit: ft
      - id: track
        label: Magnetic track
        unit: °
      - id: qnh
        label: QNH
        unit: hPa
      - id: isa
        label: Temperature deviation from ISA
        unit: °C
    answer:
      formula: ((1500 - 1000 * floor(track / 180)) + 2000 * ceil((((obstacle +
        clearance) / (1 + 0.004 * isa) - (qnh - 1013.25) * 30) - (1500 - 1000 *
        floor(track / 180))) / 2000)) / 100
      unit: FL
      decimals: 0
    distractors:
      - id: d1
        formula: ((1000 - 1000 * floor(track / 180)) + 2000 * ceil((((obstacle +
          clearance) / (1 + 0.004 * isa) - (qnh - 1013.25) * 30) - (1000 - 1000
          * floor(track / 180))) / 2000)) / 100
      - id: d2
        formula: ((1500 - 1000 * floor(track / 180)) + 2000 * floor((((obstacle +
          clearance) / (1 + 0.004 * isa) - (qnh - 1013.25) * 30) - (1500 - 1000
          * floor(track / 180))) / 2000)) / 100
      - id: d3
        formula: round((obstacle + clearance) / 100)
    presets:
      - id: p1
        values:
          obstacle: 13421
          clearance: 2000
          track: 311
          qnh: 989
          isa: -10
      - id: p2
        values:
          obstacle: 4200
          clearance: 1000
          track: 168
          qnh: 1026
          isa: -12
      - id: p3
        values:
          obstacle: 9000
          clearance: 1000
          track: 80
          qnh: 1010
          isa: 5
    explanation: >-
      The required height is the obstacle elevation plus the clearance. It is
      corrected for the temperature (4 ft per degree per 1000 ft) and for the
      QNH (30 ft per hPa) to give a flight level reading, and then the lowest
      VFR level for the track at or above that value is chosen. For tracks of
      000° to 179° magnetic the VFR levels are odd thousands plus 500 ft, and
      for 180° to 359° they are even thousands plus 500 ft.


      **Solution**


      - Required height: {{= obstacle + clearance}} ft

      - Corrected for temperature: {{= (obstacle + clearance) / (1 + 0.004 *
      isa)}} ft

      - Corrected for QNH: {{= ((obstacle + clearance) / (1 + 0.004 * isa) -
      (qnh - 1013.25) * 30)}} ft

      - Lowest VFR level for the track at or above that value: **FL{{answer}}**


      **Why the other answers are wrong**


      - **FL{{d1}}**: uses the IFR level pattern instead of the VFR pattern for
      the track.

      - **FL{{d2}}**: rounds down, so the level does not give the required
      clearance.

      - **FL{{d3}}**: only converts the obstacle height to a flight level and
      ignores the corrections.
