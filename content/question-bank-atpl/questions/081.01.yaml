  template:
    type: calculation
    question: >-
      An aeroplane in straight and level flight at {{v0}} kt is subjected to a
      sudden disturbance in speed. Assuming the angle of attack remains constant
      initially and the load factor reaches a value of {{lf}}, by how many knots
      has the speed changed?


      Give a positive number for an increase and a negative number for a
      decrease.
    variables:
      - id: v0
        label: Initial speed
        unit: kt
      - id: lf
        label: Load factor reached
        unit: ""
    answer:
      formula: v0 * (sqrt(lf) - 1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: v0 * (lf - 1)
      - id: d2
        formula: v0 * (1 - sqrt(lf))
      - id: d3
        formula: v0 * (sqrt(lf) - 1) / 2
      - id: d4
        formula: v0 * sqrt(lf)
    presets:
      - id: p1
        values:
          v0: 100
          lf: 1.96
      - id: p2
        values:
          v0: 100
          lf: 2.25
      - id: p3
        values:
          v0: 150
          lf: 1.21
    explanation: >-
      At a constant angle of attack the lift, and so the load factor, goes with
      the square of the speed. The speed ratio is therefore the square root of
      the load factor, and a load factor above 1 means the speed has increased.


      **Solution**


      {{f: v0 * (sqrt(lf) - 1)}} = {{n: v0 * (sqrt(lf) - 1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the load factor directly as if the speed change were
      proportional to it.

      - **{{d2}} kt**: a decrease in speed; a load factor above 1 means the
      speed went up.

      - **{{d3}} kt**: halves the change, a calculation slip.

      - **{{d4}} kt**: gives the final speed instead of the change.
