- id: QWAUMWVR
  docId: "081.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-815163
    - BGS-812386
    - AVEXAM-86142
  annexes: []
  learningObjectives:
    - 081.01.04.03.11
  template:
    type: calculation
    question: >-
      An aeroplane is in level flight. Given:


      - Lift coefficient (CL): {{cl}}

      - Induced drag coefficient (CDi): {{cdi}}


      The aeroplane slows down, keeping level flight, and the lift coefficient
      increases by a factor of {{f}} to maintain lift. There is no change in
      configuration.


      What is the new CDi?
    variables:
      - id: cl
        label: Initial CL
        unit: ""
      - id: cdi
        label: Induced drag coefficient
        unit: ""
      - id: f
        label: Increase factor of CL
        unit: ""
    answer:
      formula: cdi * f^2
      unit: ""
      decimals: 3
    distractors:
      - id: d1
        formula: cdi * f
      - id: d2
        formula: cdi / f
      - id: d3
        formula: cdi * f^3
      - id: d4
        formula: cdi * cl * f
    presets:
      - id: p1
        values:
          cl: 0.6
          cdi: 0.1
          f: 1.5
      - id: p2
        values:
          cl: 0.4
          cdi: 0.05
          f: 2
      - id: p3
        values:
          cl: 0.5
          cdi: 0.08
          f: 1.25
    explanation: >-
      The induced drag coefficient is proportional to the square of the lift
      coefficient. When the lift coefficient increases by a factor, the induced
      drag coefficient increases by the square of that factor, provided the
      configuration does not change.


      **Solution**


      The new lift coefficient is {{= cl * f}}, but the induced drag coefficient
      depends on its square. Starting from a CDi of {{cdi}}:


      {{f: cdi * f^2}} = {{n: cdi * f^2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the factor once instead of squaring it.

      - **{{d2}}**: divides by the factor instead of multiplying, so CDi would
      fall when CL rises.

      - **{{d3}}**: raises the factor to the power of three.

      - **{{d4}}**: multiplies by CL as well, which is not part of the
      relationship.
