- id: QBUBQCYQP
  docId: "081.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-817926
    - ATPLQ-816345
    - AVEXAM-14307
    - ATPLGS-129339
    - ATPLQ-818487
    - AVEXAM-79112
  annexes: []
  learningObjectives:
    - "081.01"
  template:
    type: calculation
    question: >-
      Calculate the coefficient of lift for an aircraft in straight and level
      flight, in clean configuration, flying at its stall speed (VS).


      - Density: {{rho}} kg/m³

      - TAS at the stall speed: {{tas}} kt

      - Mass: {{mass}} kg

      - Wing area: {{area}} m²

      - g: {{g}} m/s²
    variables:
      - id: rho
        label: Density
        unit: kg/m³
      - id: tas
        label: TAS
        unit: kt
      - id: mass
        label: Mass
        unit: kg
      - id: area
        label: Wing area
        unit: m²
      - id: g
        label: Gravity
        unit: m/s²
    answer:
      formula: 2 * mass * g / (rho * (tas * 0.514444)^2 * area)
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: mass * g / (rho * (tas * 0.514444)^2 * area)
      - id: d2
        formula: 2 * mass * g / (rho * (tas * 0.514444) * area)
      - id: d3
        formula: 2 * mass * g / (rho * (tas * 0.514444)^2)
      - id: d4
        formula: 2 * mass * g / (rho * tas^2 * area)
    presets:
      - id: p1
        values:
          rho: 1.225
          tas: 73
          mass: 7300
          area: 49
          g: 9.81
      - id: p2
        values:
          rho: 1.225
          tas: 70
          mass: 1400
          area: 13.5
          g: 9.8
      - id: p3
        values:
          rho: 1.225
          tas: 70
          mass: 1300
          area: 13.5
          g: 9.81
    explanation: >-
      In level flight the lift equals the weight. The lift coefficient follows
      from the lift equation, which uses the air density, the speed squared and
      the wing area. The speed must be in metres per second, so the knots are
      converted with 1 kt = 0.514444 m/s.


      **Solution**


      The speed in metres per second is {{= tas * 0.514444}} m/s.


      {{f: 2 * mass * g / (rho * (tas * 0.514444)^2 * area)}} = {{n: 2 * mass *
      g / (rho * (tas * 0.514444)^2 * area)}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: leaves out the factor of 2 from the lift equation.

      - **{{d2}}**: uses the speed once instead of squaring it.

      - **{{d3}}**: leaves out the wing area.

      - **{{d4}}**: uses the speed in knots without converting it to metres per
      second.
