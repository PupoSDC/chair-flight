  template:
    type: calculation
    question: >-
      An aeroplane is in straight and level flight.


      - Speed: {{v}} VS


      What is its lift coefficient (CL) as a percentage of the maximum lift
      coefficient (CLMAX)?
    variables:
      - id: v
        label: Speed
        unit: VS
    answer:
      formula: 100 / v ^ 2
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: 100 / v
      - id: d2
        formula: 100 * v ^ 2
      - id: d3
        formula: 100 / sqrt(v)
      - id: d4
        formula: 100 * v
    presets:
      - id: p1
        values:
          v: 2
      - id: p2
        values:
          v: 1.8
      - id: p3
        values:
          v: 1.5
    explanation: >-
      The lift needed is always the weight, so the faster the aeroplane flies,
      the less CL it needs. Lift depends on speed squared, so CL compared with
      CLMAX (reached at the stall speed VS) is the square of the speed ratio VS
      / V.


      **Solution**


      - CL / CLMAX = (VS / V) ^ 2 = 1 / {{v}} ^ 2

      - As a percentage: {{f: 100 / v ^ 2}} = {{n: 100 / v ^ 2}} =
      **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: uses the speed multiple once instead of squaring it.

      - **{{d2}}%**: squares the speed instead of its inverse, giving a value
      above 100 %.

      - **{{d3}}%**: uses the square root of the speed multiple instead of its
      square.

      - **{{d4}}%**: multiplies the speed multiple by 100 instead of dividing by
      its square.
- id: QIRBBZBQ
  docId: "081.01"
  relatedQuestions:
    - QR5H86LQP
  externalIds:
    - ATPLQ-815997
  annexes: []
  learningObjectives:
    - 081.01.07.01.01
  template:
    type: calculation
    question: |-
      You are flying straight and level with the following data:

      - Speed: {{v1}} kt
      - Lift coefficient (CL): {{cl1}}

      ATC asks you to reduce speed to {{v2}} kt.

      What is the new CL needed to stay in straight and level flight?
    variables:
      - id: cl1
        label: Initial CL
        unit: ""
      - id: v1
        label: Initial speed
        unit: kt
      - id: v2
        label: New speed
        unit: kt
    answer:
      formula: cl1 * (v1 / v2) ^ 2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl1 * (v1 / v2)
      - id: d2
        formula: cl1 * (v2 / v1)
      - id: d3
        formula: cl1 * (v2 / v1) ^ 2
      - id: d4
        formula: cl1 * (v1 / v2) ^ 3
    presets:
      - id: p1
        values:
          cl1: 0.3
          v1: 230
          v2: 200
      - id: p2
        values:
          cl1: 0.5
          v1: 250
          v2: 210
    explanation: >-
      Lift must still equal weight. Lift grows with speed squared times CL, so
      for the same weight a lower speed needs a higher CL. The CL needed scales
      with the square of the speed ratio.


      **Solution**


      {{f: cl1 * (v1 / v2) ^ 2}} = {{n: cl1 * (v1 / v2) ^ 2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the speed ratio once instead of squaring it.

      - **{{d2}}**: inverts the speed ratio, so CL appears to fall when the
      speed drops.

      - **{{d3}}**: inverts the speed ratio and squares it, so CL falls instead
      of rising.

      - **{{d4}}**: cubes the speed ratio instead of squaring it.
