- id: QABWFMNE
  docId: "081.01"
  relatedQuestions:
    - QLDENTWW
  externalIds:
    - ATPLQ-818548
    - BGS-810164
    - AVEXAM-62645
    - ATPLGS-125662
    - ATPLGS-117847
  annexes: []
  learningObjectives:
    - 081.01.03.03.02
  template:
    type: calculation
    question: >-
      The frontal area of a body in an airstream is changed as follows:


      - Frontal area increase factor: {{area_factor}}


      The shape of the body does not change, and the airspeed and air density
      stay the same. By what factor does the form drag increase?
    variables:
      - id: area_factor
        label: Frontal area increase factor
        unit: ""
    answer:
      formula: area_factor
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: area_factor ^ 2
      - id: d2
        formula: area_factor * 2
      - id: d3
        formula: sqrt(area_factor)
      - id: d4
        formula: area_factor ^ 3
    presets:
      - id: p1
        values:
          area_factor: 3
      - id: p2
        values:
          area_factor: 5
    explanation: >-
      Form drag comes from the pressure difference between the front and the
      back of the body. That pressure acts over the frontal area, so with the
      shape and airspeed unchanged, form drag is proportional to frontal area
      and rises by the same factor.


      **Solution**


      - New form drag = old form drag × {{n: area_factor}} = **{{answer}}
      times** the old value


      **Why the other answers are wrong**


      - **{{d1}} times**: squares the factor, as if drag depended on the area
      squared.

      - **{{d2}} times**: doubles the factor instead of using it directly.

      - **{{d3}} times**: uses the square root, as if drag rose only with the
      square root of the area.

      - **{{d4}} times**: cubes the factor.
