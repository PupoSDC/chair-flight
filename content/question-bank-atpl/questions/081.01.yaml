- id: QU10HL2SL
  docId: "081.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-811868
    - ATPLGS-628105
    - AVEXAM-15704
  annexes: []
  learningObjectives:
    - "081.01"
  template:
    type: calculation
    question: >-
      An aircraft decelerates in level flight:


      - Initial speed: {{v1}} VS

      - Final speed: {{v2}} VS


      What is the percentage increase in the lift coefficient, expressed as a
      percentage of CLmax?
    variables:
      - id: v1
        label: Initial speed
        unit: VS
      - id: v2
        label: Final speed
        unit: VS
    answer:
      formula: 100 * (1 / v2 ^ 2 - 1 / v1 ^ 2)
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: 100 * (1 / v2 - 1 / v1)
      - id: d2
        formula: 100 * (v1 ^ 2 - v2 ^ 2)
      - id: d3
        formula: 100 / v2 ^ 2
      - id: d4
        formula: 100 / v1 ^ 2
    presets:
      - id: p1
        values:
          v1: 1.4
          v2: 1.05
      - id: p2
        values:
          v1: 1.5
          v2: 1.1
    explanation: >-
      At VS the CL equals CLmax, and in level flight the lift needed is
      proportional to the speed squared. The CL as a percentage of CLmax is
      therefore 100 divided by the speed multiple squared. The increase is the
      difference between the values at the two speeds.


      **Solution**


      - CL at {{v1}} VS = 100 / {{v1}}² = {{= 100 / v1 ^ 2}}% of CLmax

      - CL at {{v2}} VS = 100 / {{v2}}² = {{= 100 / v2 ^ 2}}% of CLmax

      - Increase = {{f: 100 * (1 / v2 ^ 2 - 1 / v1 ^ 2)}} = {{n: 100 * (1 / v2 ^
      2 - 1 / v1 ^ 2)}} = **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: uses the speed ratio, not its square.

      - **{{d2}}%**: uses the squares of the speeds instead of their inverse
      squares.

      - **{{d3}}%**: uses only the final speed.

      - **{{d4}}%**: uses only the initial speed.
