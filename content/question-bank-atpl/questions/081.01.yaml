  template:
    type: calculation
    question: >-
      An aircraft is in straight and level flight with a lift coefficient (CL)
      of {{cl1}}. The speed is then multiplied by {{factor}}, and the aircraft
      remains in straight and level flight.


      What is the new value of CL?
    variables:
      - id: cl1
        label: Initial CL
        unit: ""
      - id: factor
        label: Speed change factor
        unit: ""
    answer:
      formula: cl1 / factor^2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl1
      - id: d2
        formula: cl1 * factor
      - id: d3
        formula: cl1 / factor
      - id: d4
        formula: cl1 * factor^2
    presets:
      - id: p1
        values:
          cl1: 1
          factor: 2
      - id: p2
        values:
          cl1: 0.6
          factor: 3
      - id: p3
        values:
          cl1: 0.8
          factor: 1.5
    explanation: >-
      For a fixed weight in level flight, the lift coefficient is inversely
      proportional to the square of the speed. Doubling the speed therefore
      divides CL by four. In general, the new CL is the old CL divided by the
      square of the speed factor.


      **Solution**


      {{f: cl1 / factor^2}} = {{n: cl1 / factor^2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: assumes CL stays the same, ignoring the change of speed.

      - **{{d2}}**: multiplies by the speed factor, as if CL rose with speed.

      - **{{d3}}**: divides by the factor once instead of by its square.

      - **{{d4}}**: multiplies by the square of the factor, as if CL rose with
      the square of the speed.
