- id: QTYODXVQ
  docId: "081.01"
  relatedQuestions:
    - QBDLIWLF
  externalIds:
    - ATPLQ-817745
  annexes: []
  learningObjectives:
    - 081.01.07.01.01
  template:
    type: calculation
    question: >-
      An aircraft is flying straight and level:


      - Speed: {{v1}} kt

      - CL: {{cl}}


      The crew are warned of turbulence ahead and reduce speed to {{v2}} kt, the
      turbulence penetration speed for their aircraft.


      Determine the new value of CL.
    variables:
      - id: v1
        label: Initial speed
        unit: kt
      - id: cl
        label: Initial CL
        unit: ""
      - id: v2
        label: New speed
        unit: kt
    answer:
      formula: cl * (v1 / v2) ^ 2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl * v1 / v2
      - id: d2
        formula: cl
      - id: d3
        formula: cl * v2 / v1
      - id: d4
        formula: cl * (v1 / v2) ^ 3
    presets:
      - id: p1
        values:
          v1: 280
          cl: 0.3
          v2: 220
      - id: p2
        values:
          v1: 300
          cl: 0.25
          v2: 240
    explanation: >-
      Level flight requires the lift to equal the weight, so the CL is inversely
      proportional to the square of the speed. Reducing the speed therefore
      raises the lift coefficient. The new CL is the initial CL multiplied by
      the ratio of the initial speed to the new speed, squared.


      **Solution**


      - {{f: cl * (v1 / v2) ^ 2}} = {{n: cl * (v1 / v2) ^ 2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the speed ratio once instead of squared.

      - **{{d2}}**: keeps the original CL and ignores the speed change.

      - **{{d3}}**: uses the inverted speed ratio, which lowers the CL.

      - **{{d4}}**: uses the speed ratio cubed.
