  template:
    type: one-two
    question: Considering subsonic incompressible airflow through a Venturi, which
      statement is correct?
    explanation: >-
      ### TLDR


      In a venturi...


      - **Total Pressure remains constant**, and...

      - **Mass flow remains constant** (for incompressible flows). Therefore...

      - **Speed increases at the throat**, therefore...

      - **Dynamic pressure increases at the throat**, therefore...

      - **Static pressure decreases at the throat**


      # Long Explanation


      The Bernoulli's principle states that in a fluid flow, an increase in
      velocity

      results in a decrease in pressure, and vice versa. This principle is
      commonly

      used to explain the behavior of fluids in motion, such as in the case of
      an

      airplane wing or a Venturi tube.

      The formula for total pressure in a fluid flow is the sum of dynamic
      pressure

      and static pressure. Dynamic pressure is the pressure due to the motion of
      the

      fluid, while static pressure is the pressure of the fluid when it is at
      rest.

      The total pressure is important to consider in fluid flow calculations, as
      it

      is a measure of the energy contained in the fluid.


      When a fluid flows through a Venturi tube, the constriction in the tube
      causes

      the velocity of the fluid to increase, according to the Bernoulli's
      principle.

      This increase in velocity results in a decrease in static pressure in the

      throat of the tube. However, the total pressure of the fluid remains
      constant

      throughout the tube. Therefore, as the velocity increases, the static

      pressure decreases to maintain the constant total pressure. This
      phenomenon

      is used in many applications, such as in carburetors for gasoline engines

      or in fluid metering devices.
    firstCorrectStatements:
      - The dynamic pressure in the throat is higher than in the undisturbed
        airflow.
    firstIncorrectStatements:
      - The dynamic pressure in the throat is lower than in the undisturbed
        airflow.
      - The dynamic pressure in the throat is same than in the undisturbed
        airflow.
    secondCorrectStatements:
      - The static pressure in the throat is lower than in the undisturbed
        airflow.
      - The total pressure in the throat is the same as in the undisturbed
        airflow.
    secondIncorrectStatements:
      - The static pressure in the throat is higher than in the undisturbed
        airflow.
      - The static pressure in the throat is the same than in the undisturbed
        airflow.
      - The total pressure in the throat is higher than in the undisturbed
        airflow.
      - The total pressure in the throat is lower than in the undisturbed
        airflow.
