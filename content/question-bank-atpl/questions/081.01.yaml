- id: QR5H86LQP
  docId: "081.01"
  relatedQuestions:
    - QIRBBZBQ
  externalIds:
    - ATPLQ-814474
    - ATPLGS-628123
  annexes: []
  learningObjectives:
    - "081.01"
  template:
    type: calculation
    question: |-
      An aeroplane is flying straight and level with the following data:

      - CL at {{v1}} VS: {{cl1}}
      - New speed: {{v2}} VS

      What is the CL at the new speed?
    variables:
      - id: cl1
        label: Initial CL
        unit: ""
      - id: v1
        label: Initial speed
        unit: VS
      - id: v2
        label: New speed
        unit: VS
    answer:
      formula: cl1 * (v1 / v2) ^ 2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl1 * (v1 / v2)
      - id: d2
        formula: cl1 * (v2 / v1)
      - id: d3
        formula: cl1 * (v2 / v1) ^ 2
      - id: d4
        formula: cl1 * sqrt(v1 / v2)
    presets:
      - id: p1
        values:
          cl1: 1.22
          v1: 1.1
          v2: 1.8
      - id: p2
        values:
          cl1: 0.9
          v1: 1.2
          v2: 1.6
    explanation: >-
      Lift must still equal weight. Lift grows with speed squared times CL, so a
      higher speed needs a lower CL. The CL at a new speed scales with the
      square of the speed ratio.


      **Solution**


      {{f: cl1 * (v1 / v2) ^ 2}} = {{n: cl1 * (v1 / v2) ^ 2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the speed ratio once instead of squaring it.

      - **{{d2}}**: inverts the speed ratio, so CL appears to rise when the
      speed rises.

      - **{{d3}}**: inverts the speed ratio and squares it.

      - **{{d4}}**: takes the square root of the speed ratio instead of squaring
      it.
