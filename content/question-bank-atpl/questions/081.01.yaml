- id: QRCTCUYZU
  docId: "081.01"
  relatedQuestions:
    - QVLRJNQU
  externalIds:
    - ATPLQ-316487
    - ATPLGS-127349
  annexes: []
  learningObjectives:
    - "081.01"
  template:
    type: calculation
    question: >-
      In order to provide an adequate buffet boundary at the commencement of the
      cruise, a speed of 1.3 VS is used.


      - Initial mass: {{m1}} kg

      - CAS of 1.3 VS at this mass: {{cas1}} kt

      - New mass: {{m2}} kg


      What will 1.3 VS be at the new mass (in kt)?
    variables:
      - id: m1
        label: Initial mass
        unit: kg
      - id: cas1
        label: CAS of 1.3 VS at initial mass
        unit: kt
      - id: m2
        label: New mass
        unit: kg
    answer:
      formula: cas1 * sqrt(m2 / m1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas1 * m2 / m1
      - id: d2
        formula: cas1 * m1 / m2
      - id: d3
        formula: cas1 * sqrt(m1 / m2)
      - id: d4
        formula: cas1 * (m2 / m1) ^ 2
    presets:
      - id: p1
        values:
          m1: 120000
          cas1: 180
          m2: 135000
      - id: p2
        values:
          m1: 100000
          cas1: 150
          m2: 130000
    explanation: >-
      The speed for a fixed multiple of VS scales with the square root of the
      mass, because VS does. The CAS is therefore scaled by the square root of
      the ratio of the new mass to the initial mass.


      **Solution**


      {{f: cas1 * sqrt(m2 / m1)}} = {{n: cas1 * sqrt(m2 / m1)}} = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: scales with the mass ratio instead of its square root.

      - **{{d2}} kt**: inverts the mass ratio.

      - **{{d3}} kt**: inverts the square root of the mass ratio.

      - **{{d4}} kt**: uses the square of the mass ratio.
