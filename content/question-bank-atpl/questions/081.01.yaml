  template:
    type: calculation
    question: >-
      An aeroplane has the following drag:


      - Drag: {{drag}} N

      - Wing area increase: {{inc}} %


      Assume speed, air density and drag coefficient stay the same. What is the
      new drag?
    variables:
      - id: drag
        label: Drag
        unit: N
      - id: inc
        label: Wing area increase
        unit: "%"
    answer:
      formula: drag * (1 + inc / 100)
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: drag * (1 - inc / 100)
      - id: d2
        formula: drag + inc
      - id: d3
        formula: drag * inc / 100
      - id: d4
        formula: drag * (1 + inc)
    presets:
      - id: p1
        values:
          drag: 850
          inc: 10
      - id: p2
        values:
          drag: 1200
          inc: 25
    explanation: >-
      With speed, air density and drag coefficient unchanged, drag grows in the
      same proportion as the wing area. A larger wing therefore adds drag in the
      same percentage as its area increase.


      **Solution**


      - Drag: {{f: drag * (1 + inc / 100)}} = {{n: drag * (1 + inc / 100)}} =
      **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: a decrease, which is the wrong direction.

      - **{{d2}} N**: adds the percentage as if it were newtons.

      - **{{d3}} N**: finds only the extra drag, not the total.

      - **{{d4}} N**: multiplies by one plus the percentage as a whole number,
      so the drag becomes far too large.
