- id: QZJAJYGI
  docId: "081.01"
  relatedQuestions:
    - QAAOYHAP
    - QMIKBIYP
    - QVFZLJTG
    - QXEUZUHO
  externalIds:
    - ATPLQ-813981
  annexes: []
  learningObjectives:
    - 081.01.01.01.02
  template:
    type: calculation
    question: >-
      An aeroplane is in level flight. Given:


      - Airspeed: {{v1}} kt

      - Lift coefficient (CL): {{cl1}}


      ATC asks the pilot to reduce speed to {{v2}} kt, keeping level flight with
      no change in weight or configuration.


      What is the new CL?
    variables:
      - id: v1
        label: Initial airspeed
        unit: kt
      - id: cl1
        label: Initial CL
        unit: ""
      - id: v2
        label: New airspeed
        unit: kt
    answer:
      formula: cl1 * (v1 / v2)^2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl1 * (v2 / v1)^2
      - id: d2
        formula: cl1 * v1 / v2
      - id: d3
        formula: cl1 * (v1 / v2)^3
      - id: d4
        formula: cl1
    presets:
      - id: p1
        values:
          v1: 250
          cl1: 0.3
          v2: 200
      - id: p2
        values:
          v1: 180
          cl1: 0.5
          v2: 140
      - id: p3
        values:
          v1: 300
          cl1: 0.2
          v2: 250
    explanation: >-
      With a fixed weight in level flight, lift is constant, so the lift
      coefficient changes with the inverse square of the airspeed. The lift
      coefficient is proportional to 1 / V squared.


      **Solution**


      The speed ratio is {{= v1 / v2}}, so the new lift coefficient is


      {{f: cl1 * (v1 / v2)^2}} = {{n: cl1 * (v1 / v2)^2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: inverts the speed ratio, so CL would fall when speed falls.

      - **{{d2}}**: uses the speed ratio once instead of squaring it.

      - **{{d3}}**: cubes the speed ratio.

      - **{{d4}}**: leaves CL unchanged, ignoring the change of speed.
