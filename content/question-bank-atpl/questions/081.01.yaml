- id: QA40AMHYZ
  docId: "081.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-812776
  annexes: []
  learningObjectives:
    - "081.01"
  template:
    type: calculation
    question: >-
      A rate of climb is given in feet per minute. Convert it to metres per
      second (1 ft = 0.3048 m).


      - Rate of climb: {{fpm}} ft/min


      What is this rate in m/s?
    variables:
      - id: fpm
        label: Rate of climb
        unit: ft/min
    answer:
      formula: fpm * 0.3048 / 60
      unit: m/s
      decimals: 1
    distractors:
      - id: d1
        formula: fpm / 2
      - id: d2
        formula: fpm / 60
      - id: d3
        formula: fpm * 0.3048 / 60 * 0.3048
      - id: d4
        formula: fpm * 0.3048
    presets:
      - id: p1
        values:
          fpm: 470
      - id: p2
        values:
          fpm: 1000
    explanation: >-
      Convert the feet to metres (1 ft = 0.3048 m) and the minutes to seconds
      (divide by 60).


      **Solution**


      {{f: fpm * 0.3048 / 60}} = {{n: fpm * 0.3048 / 60}} = **{{answer}} m/s**


      **Why the other answers are wrong**


      - **{{d1}} m/s**: halves the rate instead of converting it.

      - **{{d2}} m/s**: forgets to convert feet to metres.

      - **{{d3}} m/s**: applies the metre conversion twice.

      - **{{d4}} m/s**: stops after the metre conversion, so the result is in
      metres per minute.
