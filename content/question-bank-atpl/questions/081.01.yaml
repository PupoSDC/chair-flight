- id: QRUXCWMJ
  docId: "081.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-816910
    - AVEXAM-74838
  annexes: []
  learningObjectives:
    - 081.01.05.05.02
  template:
    type: calculation
    question: >-
      An object has a drag of {{drag0}} N at sea level. Assume ISA conditions
      and that the object travels at the same speed at altitude.


      - Altitude: {{alt}} ft


      What is the drag of the object at this altitude? Give the answer in N.
    variables:
      - id: drag0
        label: Drag at sea level
        unit: N
      - id: alt
        label: Altitude
        unit: ft
    answer:
      formula: drag0 * (1 - 0.0000225577 * alt * 0.3048) ^ 4.25588
      unit: N
      decimals: 0
    distractors:
      - id: d1
        formula: drag0
      - id: d2
        formula: drag0 * (1 - 0.0000225577 * alt) ^ 4.25588
      - id: d3
        formula: drag0 * (1 - 0.0000225577 * alt * 0.3048)
      - id: d4
        formula: drag0 / (1 - 0.0000225577 * alt * 0.3048) ^ 4.25588
    presets:
      - id: p1
        values:
          drag0: 785
          alt: 6000
      - id: p2
        values:
          drag0: 1200
          alt: 10000
    explanation: >-
      Air density falls with altitude. For the same speed and the same shape,
      drag is proportional to air density, so the drag falls as the aeroplane
      climbs. In the ISA the density at altitude is found from the altitude in
      metres with a power law.


      **Solution**


      - Altitude in metres: {{= alt * 0.3048}} m

      - Drag: {{f: drag0 * (1 - 0.0000225577 * alt * 0.3048) ^ 4.25588}} = {{n:
      drag0 * (1 - 0.0000225577 * alt * 0.3048) ^ 4.25588}} = **{{answer}} N**


      **Why the other answers are wrong**


      - **{{d1}} N**: assumes the drag stays the same, ignoring the lower air
      density.

      - **{{d2}} N**: uses the altitude in feet in a formula that needs metres.

      - **{{d3}} N**: reduces the drag in a straight line instead of by the
      density ratio.

      - **{{d4}} N**: divides by the density ratio, so the drag rises with
      altitude.
