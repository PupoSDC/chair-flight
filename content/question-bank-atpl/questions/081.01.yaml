  template:
    type: calculation
    question: >-
      An aeroplane is in straight and level flight at a speed of {{k}} VS, where
      VS is the stalling speed.


      What would the lift coefficient be, expressed as a percentage of its
      maximum CLMAX?
    variables:
      - id: k
        label: Speed as a multiple of VS
        unit: ""
    answer:
      formula: 100 / k^2
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: 100 * k^2
      - id: d2
        formula: 100 * k
      - id: d3
        formula: 100 / k
      - id: d4
        formula: 100 / k^3
    presets:
      - id: p1
        values:
          k: 1.2
      - id: p2
        values:
          k: 1.6
      - id: p3
        values:
          k: 1.8
      - id: p4
        values:
          k: 1.3
    explanation: >-
      In level flight lift equals weight, and lift grows with the square of the
      speed. So for a fixed weight the lift coefficient falls with the square of
      the speed. At the stalling speed VS the lift coefficient is at its
      maximum, CLMAX.


      **Solution**


      The lift coefficient as a fraction of CLMAX is 1 / {{k}} squared, which is
      {{= 1 / k^2}}.


      {{f: 100 / k^2}} = {{n: 100 / k^2}} = **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: multiplies by the square of the speed ratio instead of
      dividing, which would put the lift coefficient above its maximum.

      - **{{d2}} %**: uses the speed ratio directly, with no squaring.

      - **{{d3}} %**: divides by the speed ratio once instead of by its square.

      - **{{d4}} %**: divides by the cube of the speed ratio.
