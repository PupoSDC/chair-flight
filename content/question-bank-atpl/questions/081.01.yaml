  template:
    type: calculation
    question: >-
      A light aircraft is flying straight and level:


      - Speed: {{speed}} kt

      - CL: {{cl}}


      The pilot immediately pulls into a climb with a load factor of {{n}} g.
      What is the new CL?
    variables:
      - id: speed
        label: Speed
        unit: kt
      - id: cl
        label: Initial CL
        unit: ""
      - id: n
        label: Load factor
        unit: g
    answer:
      formula: cl * n
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl / n
      - id: d2
        formula: cl
      - id: d3
        formula: cl * n ^ 2
      - id: d4
        formula: cl * (n - 1)
    presets:
      - id: p1
        values:
          speed: 110
          cl: 0.42
          n: 2.2
      - id: p2
        values:
          speed: 100
          cl: 0.35
          n: 1.8
    explanation: >-
      The speed stays the same, so the lift needed for the manoeuvre is the load
      factor times the weight. The lift coefficient therefore rises in the same
      proportion as the load factor, and the new CL is the initial CL multiplied
      by the load factor.


      **Solution**


      - {{f: cl * n}} = {{n: cl * n}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: divides instead of multiplies, as if the load factor reduced
      the lift.

      - **{{d2}}**: keeps the original CL and ignores the extra load.

      - **{{d3}}**: squares the load factor.

      - **{{d4}}**: uses only the extra load (load factor minus 1) and ignores
      the weight already carried.
