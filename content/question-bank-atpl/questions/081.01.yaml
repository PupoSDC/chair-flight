  annexes: []
  learningObjectives:
    - 081.01.07.01.01
  template:
    type: calculation
    question: Whilst maintaining straight and level flight with a lift coefficient
      CL of {{cl}}, what will be the new approximate value of CL after the speed
      is increased by {{pct}}%?
    variables:
      - id: cl
        label: Initial CL
        unit: ""
      - id: pct
        label: Speed increase
        unit: "%"
    answer:
      formula: cl / (1 + pct / 100) ^ 2
      unit: ""
      decimals: 1
    distractors:
      - id: d1
        formula: cl * (1 - pct / 100)
      - id: d2
        formula: cl / (1 + pct / 100)
      - id: d3
        formula: cl / (1 + pct / 100) ^ 3
      - id: d4
        formula: cl * (1 + pct / 100) ^ 2
    presets:
      - id: p1
        values:
          cl: 1
          pct: 30
      - id: p2
        values:
          cl: 1
          pct: 41
    explanation: >-
      In level flight the lift equals the weight, so the lift coefficient falls
      with the square of the speed. Increasing the speed by a given percentage
      multiplies the speed by (1 + percentage / 100), so the CL is divided by
      that factor squared.


      **Solution**


      - New speed = {{= 1 + pct / 100}} times the old speed

      - New CL = old CL / (speed factor)²

      - {{f: cl / (1 + pct / 100) ^ 2}} = {{n: cl / (1 + pct / 100) ^ 2}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: subtracts the speed increase instead of dividing by the
      speed factor.

      - **{{d2}}**: divides by the speed factor once, not squared.

      - **{{d3}}**: divides by the speed factor cubed.

      - **{{d4}}**: multiplies by the squared factor, so the CL increases with
      the speed.
