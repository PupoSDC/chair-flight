  docId: "081.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-817763
    - ATPLGS-125664
    - AVEXAM-67678
    - BGS-810160
  annexes: []
  learningObjectives:
    - 081.01.05.03.01
  template:
    type: calculation
    question: A body is placed in a certain airstream. If the airstream velocity
      increases by a factor of {{k}}, by what factor will the parasite drag
      increase?
    variables:
      - id: k
        label: Velocity factor
        unit: ""
    answer:
      formula: k ^ 2
      unit: times
      decimals: 0
    distractors:
      - id: d1
        formula: k
      - id: d2
        formula: k ^ 3
      - id: d3
        formula: k ^ 1.5
      - id: d4
        formula: sqrt(k)
    presets:
      - id: p1
        values:
          k: 4
      - id: p2
        values:
          k: 5
      - id: p3
        values:
          k: 6
    explanation: >-
      Parasite drag is the drag caused by the shape of the body and its skin
      friction. It rises with the square of the airspeed, because the dynamic
      pressure is one half of the air density times the speed squared.
      Increasing the speed by a factor of k therefore multiplies the parasite
      drag by k squared.


      **Solution**


      - Parasite drag is proportional to the speed squared

      - {{f: k ^ 2}} = {{n: k ^ 2}} = **{{answer}} times**


      **Why the other answers are wrong**


      - **{{d1}} times**: assumes the drag grows in direct proportion to the
      speed.

      - **{{d2}} times**: uses the speed factor cubed.

      - **{{d3}} times**: uses the speed factor to the power 1.5.

      - **{{d4}} times**: uses the square root of the speed factor, which is the
      wrong way round.
