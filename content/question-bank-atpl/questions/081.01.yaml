    - "081.01"
    - "081.06"
  template:
    type: calculation
    question: >-
      An aeroplane in straight and level flight at {{v}} kt is subjected to a
      sudden disturbance in speed.


      Assuming the angle of attack remains constant initially and the load
      factor reaches a value of {{n}}, by how many kt does the speed change?


      Give a positive number for an increase and a negative number for a
      decrease.
    variables:
      - id: v
        label: Initial speed
        unit: kt
      - id: n
        label: Load factor
        unit: ""
    answer:
      formula: v * (sqrt(n) - 1)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: -v * (sqrt(n) - 1)
      - id: d2
        formula: v * (n - 1)
      - id: d3
        formula: v * (n - 1) / 3
      - id: d4
        formula: v * (sqrt(n) - 1) / 2
    presets:
      - id: p1
        values:
          v: 100
          n: 1.44
      - id: p2
        values:
          v: 200
          n: 1.44
      - id: p3
        values:
          v: 100
          n: 1.21
    explanation: >-
      With the angle of attack held constant, the lift is proportional to the
      speed squared, and so is the load factor. The new speed is the initial
      speed multiplied by the square root of the load factor, and the change is
      the difference between the new speed and the initial speed.


      **Solution**


      - New speed = {{v}} kt × √{{n}} = {{= v * sqrt(n)}} kt

      - Change = {{f: v * (sqrt(n) - 1)}} = {{n: v * (sqrt(n) - 1)}} =
      **{{answer}} kt** (an increase)


      **Why the other answers are wrong**


      - **{{d1}} kt**: the sign is reversed, which would describe a decrease.

      - **{{d2}} kt**: uses the load factor minus 1 instead of its square root,
      which overstates the change.

      - **{{d3}} kt**: uses the load factor minus 1 and divides the result by 3.

      - **{{d4}} kt**: halves the correct change.
