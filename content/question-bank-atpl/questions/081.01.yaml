  template:
    type: simple
    question: Which of the following is a characteristic of a turbulent boundary layer?
    explanation: |-
      Turbulent mixing brings faster-moving air closer to the surface. This
      helps the boundary layer remain attached when pressure rises in the
      direction of flow, so it can follow the aerofoil farther before
      separating.
    options:
      - id: OIGTZZN9C
        text: Greater laminar flow transition tendency.
        correct: false
        why: ""
      - id: O9FMYBUDW
        text: Reduced ability to follow a profile.
        correct: false
        why: ""
      - id: OD7AK20TM
        text: Lower drag due to reduced mixing.
        correct: false
        why: ""
      - id: O8YWRX8QW
        text: Better ability to follow a profile.
        correct: true
        why: ""
