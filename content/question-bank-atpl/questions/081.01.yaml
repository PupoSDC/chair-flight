  docId: "081.01"
  relatedQuestions:
    - QZJAJYGI
  externalIds:
    - ATPLQ-819217
    - AVEXAM-70440
    - BGS-811379
    - ATPLGS-622608
  annexes: []
  learningObjectives:
    - 081.01.07.01.01
  template:
    type: calculation
    question: >-
      In level flight, an aircraft has the following data:


      - Lift coefficient (CL): {{cl1}}

      - Speed: {{v1}} VS


      The speed is reduced to {{v2}} VS, still in level flight, with no change
      in weight or configuration.


      What is the value of CL at the lower speed?
    variables:
      - id: cl1
        label: Initial CL
        unit: ""
      - id: v1
        label: Initial speed
        unit: VS
      - id: v2
        label: New speed
        unit: VS
    answer:
      formula: cl1 * (v1 / v2)^2
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: cl1 * (v2 / v1)^2
      - id: d2
        formula: cl1 * v1 / v2
      - id: d3
        formula: cl1 * (v1 / v2)^3
      - id: d4
        formula: cl1
    presets:
      - id: p1
        values:
          cl1: 0.35
          v1: 1.6
          v2: 1.1
      - id: p2
        values:
          cl1: 0.4
          v1: 2
          v2: 1.5
      - id: p3
        values:
          cl1: 0.25
          v1: 1.4
          v2: 1.2
    explanation: >-
      With a fixed weight in level flight, lift is constant, so the lift
      coefficient is proportional to 1 / V squared. A lower speed therefore
      needs a higher lift coefficient.


      **Solution**


      The speed ratio is {{= v1 / v2}}, so the new lift coefficient is


      {{f: cl1 * (v1 / v2)^2}} = {{n: cl1 * (v1 / v2)^2}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: inverts the speed ratio, which would lower CL at a lower
      speed.

      - **{{d2}}**: uses the speed ratio once instead of squaring it.

      - **{{d3}}**: cubes the speed ratio.

      - **{{d4}}**: leaves CL unchanged, ignoring the change of speed.
