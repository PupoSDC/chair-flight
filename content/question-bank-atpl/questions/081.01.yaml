      - id: p2
        values:
          k: 1.3
    explanation: >-
      At a constant weight the coefficient of lift is inversely proportional to
      the speed squared. At the stall speed VS the coefficient of lift is CLmax,
      so at {{k}} VS it is CLmax divided by {{k}} squared.


      **Solution**


      {{f: 100 / k ^ 2}} = {{n: 100 / k ^ 2}} = **{{answer}} %** of CLmax


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the speed rather than its square.

      - **{{d2}} %**: multiplies by the speed squared instead of dividing.

      - **{{d3}} %**: multiplies by the speed instead of dividing by its square.

      - **{{d4}} %**: gives the share of CLmax lost, not the share that remains.
