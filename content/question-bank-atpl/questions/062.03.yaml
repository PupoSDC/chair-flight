    - AVEXAM-90278
  annexes: []
  learningObjectives:
    - "062.03"
  template:
    type: calculation
    question: >-
      An airborne weather radar transmits pulses with a wavelength of {{lam}}
      cm.


      What is the corresponding frequency in GHz?
    variables:
      - id: lam
        label: Wavelength
        unit: cm
    answer:
      formula: 30 / lam
      unit: GHz
      decimals: 2
    distractors:
      - id: d1
        formula: 300 / lam
      - id: d2
        formula: lam / 30
      - id: d3
        formula: 30 / lam / 10
      - id: d4
        formula: 30 * lam
    presets:
      - id: p1
        values:
          lam: 3.2
      - id: p2
        values:
          lam: 10.5
      - id: p3
        values:
          lam: 1.25
    explanation: >-
      Frequency is the speed of light divided by the wavelength. With the
      wavelength in centimetres, the frequency comes out in GHz as 30 divided by
      the wavelength.


      **Solution**


      - {{f: 30 / lam}} = {{n: 30 / lam}} = **{{answer}} GHz**


      **Why the other answers are wrong**


      - **{{d1}} GHz**: uses 300 instead of 30, which is out by a factor of ten.

      - **{{d2}} GHz**: inverts the ratio, dividing the wavelength by 30.

      - **{{d3}} GHz**: divides by an extra factor of ten.

      - **{{d4}} GHz**: multiplies by the wavelength instead of dividing.
