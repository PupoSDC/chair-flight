- id: QS00LAMMU
  docId: "062.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-629838
    - BGS-620335
    - ATPLGS-621391
    - ATPLGS-621424
  annexes: []
  learningObjectives:
    - "062.03"
  template:
    type: calculation
    question: Ignoring pulse length, what is the maximum pulse repetition frequency
      (PRF) that a primary radar can use to detect targets unambiguously to a
      range of {{range}} NM? Give the answer in pulses per second (pps).
    variables:
      - id: range
        label: Unambiguous range
        unit: NM
    answer:
      formula: 81000 / range
      unit: pps
      decimals: 0
    distractors:
      - id: d1
        formula: 162000 / range
      - id: d2
        formula: 81000 / (2 * range)
      - id: d3
        formula: 81000 / range + 100
      - id: d4
        formula: 81000 * range / 1000
    presets:
      - id: p1
        values:
          range: 200
      - id: p2
        values:
          range: 150
    explanation: >-
      A primary radar can only tell targets apart if the echo of one pulse
      returns before the next pulse is sent. The pulse travels out to the target
      and back, so the unambiguous range in nautical miles is 81 000 divided by
      the PRF. Turned round, the highest PRF for a given range is 81 000 divided
      by the range.


      **Solution**


      {{f: 81000 / range}} = {{n: 81000 / range}} = **{{answer}} pps**


      **Why the other answers are wrong**


      - **{{d1}} pps**: forgets the factor of 2 for the pulse travelling out and
      back.

      - **{{d2}} pps**: uses twice the range, which halves the PRF.

      - **{{d3}} pps**: adds 100 pps to the correct value.

      - **{{d4}} pps**: multiplies by the range instead of dividing.
