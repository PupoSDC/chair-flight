- id: QSQFMPU0B
  docId: "062.03"
  relatedQuestions: []
  externalIds:
    - ATPLQ-625191
    - BGS-621195
    - AVEXAM-52895
  annexes: []
  learningObjectives:
    - "062.03"
  template:
    type: calculation
    question: >-
      An aircraft flying at a given altitude uses its weather radar to find the
      top of a cloud. Given:


      - Aircraft altitude: {{alt}} ft

      - Distance to the cloud: {{dist}} NM

      - Tilt angle at which the cloud disappears: {{tilt}}°

      - Beam width: {{beam}}°


      At what altitude is the top of the cloud, in ft?
    variables:
      - id: alt
        label: Aircraft altitude
        unit: ft
      - id: dist
        label: Distance to the cloud
        unit: NM
      - id: tilt
        label: Tilt angle
        unit: °
      - id: beam
        label: Beam width
        unit: °
    answer:
      formula: round((alt + dist / 60 * (tilt - beam / 2) * 6076) / 100) * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: round((alt + dist / 60 * tilt * 6076) / 100) * 100
      - id: d2
        formula: round((alt + dist / 60 * (tilt + beam / 2) * 6076) / 100) * 100
      - id: d3
        formula: alt
      - id: d4
        formula: round((alt + 2 * dist / 60 * (tilt - beam / 2) * 6076) / 100) * 100
    presets:
      - id: p1
        values:
          alt: 12000
          dist: 120
          tilt: 3.5
          beam: 5
      - id: p2
        values:
          alt: 9000
          dist: 90
          tilt: 4
          beam: 5
      - id: p3
        values:
          alt: 6000
          dist: 60
          tilt: 3
          beam: 4
    explanation: >-
      The radar beam is a narrow cone, and its lower edge is half a beam width
      below the tilt angle. The top of the cloud lies on that lower edge. At 60
      NM, one degree of angle is about one NM of height, so the height of the
      cloud top above the aircraft is the distance divided by 60, times the
      angle, times 6076 ft per NM. The answer is rounded to the nearest 100 ft.


      **Solution**


      - Angle to the cloud top: {{tilt}}° minus half of {{beam}}° = {{= tilt -
      beam / 2}}°

      - {{f: round((alt + dist / 60 * (tilt - beam / 2) * 6076) / 100) * 100}} =
      {{n: round((alt + dist / 60 * (tilt - beam / 2) * 6076) / 100) * 100}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: uses the full tilt angle instead of the tilt minus half
      the beam width.

      - **{{d2}} ft**: uses the tilt plus half the beam width, the upper edge of
      the beam.

      - **{{d3}} ft**: ignores the tilt angle and gives only the aircraft
      altitude.

      - **{{d4}} ft**: doubles the height gained above the aircraft.
