- id: QRXX1K9XN
  docId: "033.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-335707
    - ATPLGS-123134
    - AVEXAM-97437
  annexes:
    - 033-blank-icao-flight-plan-form-items-7-to-19
  learningObjectives:
    - "033.05"
  template:
    type: calculation
    question: >-
      Use the following information to determine what should be entered in item
      19 (endurance) of the ICAO flight plan. Give the answer in hours and
      minutes.


      - Trip distance: {{trip}} NM

      - Take-off fuel: {{fuel}} kg

      - Average TAS: {{tas}} kt

      - Average fuel flow: {{flow}} kg/h

      - Average wind component: {{wind}} kt

      - Time to alternate: {{alt}} minutes

      - Final reserve fuel: {{res}} minutes holding
    variables:
      - id: trip
        label: Trip distance
        unit: NM
      - id: fuel
        label: Take-off fuel
        unit: kg
      - id: tas
        label: Average TAS
        unit: kt
      - id: flow
        label: Average fuel flow
        unit: kg/h
      - id: wind
        label: Average wind component
        unit: kt
      - id: alt
        label: Time to alternate
        unit: min
      - id: res
        label: Final reserve time
        unit: min
    answer:
      formula: round(fuel / flow * 60)
      unit: minutes
      decimals: 0
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: round(trip / (tas + wind) * 60 + alt + res)
      - id: d2
        formula: round(trip / (tas + wind) * 60)
      - id: d3
        formula: round(fuel / flow * 60 - res)
      - id: d4
        formula: round(trip / (tas - wind) * 60)
    presets:
      - id: p1
        values:
          trip: 5683
          fuel: 140000
          tas: 500
          flow: 11586
          wind: 15
          alt: 45
          res: 30
      - id: p2
        values:
          trip: 4800
          fuel: 120000
          tas: 450
          flow: 10500
          wind: -10
          alt: 40
          res: 30
    explanation: >-
      The endurance is the time the fuel on board will last at the average fuel
      flow. It is the take-off fuel divided by the fuel flow, converted to
      minutes. The trip distance, alternate and reserve times are not needed for
      this entry.


      **Solution**


      {{f: fuel / flow * 60}} = {{n: fuel / flow * 60}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} min**: adds the trip time, the time to alternate and the
      reserve time, which is the time needed for the whole flight rather than
      the endurance.

      - **{{d2}} min**: uses only the trip time, which is the time to the
      destination and not the endurance.

      - **{{d3}} min**: subtracts the reserve time from the endurance, which is
      not required for this entry.

      - **{{d4}} min**: divides the trip by the speed with the wind subtracted
      instead of added, which is a wrong wind sign.
