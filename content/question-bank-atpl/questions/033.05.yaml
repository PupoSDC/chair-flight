- id: QCQNEM2ZW
  docId: "033.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-336664
    - AVEXAM-40320
    - ATPLQ-337464
    - BGS-331452
    - ATPLGS-123135
  annexes:
    - 033-blank-icao-flight-plan-form-items-7-to-19
    - 033-icao-flight-plan-form-filled-in-with-route
  learningObjectives:
    - "033.05"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. The flight plan shows an estimated off-block time (EOBT)
      of 12:50 UTC at EDDF.


      - Taxi time at EDDF: {{taxi}} minutes

      - Flight time from take-off to the IAF of the destination (read from the
      figure): {{enroute}} minutes


      What is the estimated arrival time at the IAF of the destination?
    variables:
      - id: taxi
        label: Taxi time at EDDF
        unit: min
      - id: enroute
        label: Flight time to IAF (read from figure)
        unit: min
    chartInputs:
      - enroute
    answer:
      formula: 770 + taxi + enroute
      unit: minutes
      decimals: 0
      format: hh:mm 'UTC'
    distractors:
      - id: d1
        formula: 770 + enroute
      - id: d2
        formula: taxi + enroute
      - id: d3
        formula: 830 + taxi + enroute
      - id: d4
        formula: 770 - taxi + enroute
    presets:
      - id: p1
        values:
          taxi: 10
          enroute: 43
    explanation: >-
      The arrival time is the off-block time plus everything that happens after
      it: taxiing, then the flight to the IAF. The times are added in minutes
      after midnight and then converted back to a clock time.


      **Solution**


      - Off-block at 12:50 UTC is 770 minutes after midnight.

      - Add the taxi time and the flight time: {{f: 770 + taxi + enroute}} =
      {{n: 770 + taxi + enroute}} minutes after midnight.

      - Converted back to a clock time: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: leaves out the taxi time.

      - **{{d2}}**: leaves out the off-block time, so the result is a time after
      midnight.

      - **{{d3}}**: adds one hour by mistake, for example a time zone error.

      - **{{d4}}**: subtracts the taxi time instead of adding it.
