- id: QQ77I0ATW
  docId: "033.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-339721
    - AVEXAM-88816
  annexes:
    - 033-blank-icao-flight-plan-form-items-7-to-19
  learningObjectives:
    - "033.05"
  template:
    type: chart-calculation
    question: >-
      Refer to figure. Use the following information to determine what would be
      entered into ITEM 19 ENDURANCE (HHMM) of the ICAO Flight Plan form.


      Flight rules: VFR

      Environment: Non-hostile


      - Taxi fuel: {{taxi}} kg

      - Trip distance: {{dist}} NM

      - Average trip TAS: {{tas}} kt

      - Average trip fuel flow: {{ff}} kg/h

      - Average wind component: {{wc}} kt

      - Contingency: {{cont}} % of trip fuel

      - Time to alternate: {{alt}} minutes

      - Final reserve fuel: {{res}} minutes holding


      T/O fuel: minimum required (taxi fuel is not part of the endurance)
    variables:
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: dist
        label: Trip distance
        unit: NM
      - id: tas
        label: Average trip TAS
        unit: kt
      - id: ff
        label: Average trip fuel flow
        unit: kg/h
      - id: wc
        label: Wind component (tailwind positive)
        unit: kt
      - id: cont
        label: Contingency
        unit: "%"
      - id: alt
        label: Time to alternate
        unit: min
      - id: res
        label: Final reserve time
        unit: min
    chartInputs:
      - taxi
      - dist
      - tas
      - ff
      - wc
      - cont
      - alt
      - res
    answer:
      formula: (ceil(dist / (tas + wc) * 60 * (1 + cont / 100) + alt + res)) + 40 *
        floor((ceil(dist / (tas + wc) * 60 * (1 + cont / 100) + alt + res)) /
        60)
      unit: HHMM
      decimals: 0
    distractors:
      - id: d1
        formula: (ceil(dist / (tas + wc) * 60 + alt + res)) + 40 * floor((ceil(dist /
          (tas + wc) * 60 + alt + res)) / 60)
      - id: d2
        formula: (ceil(dist / (tas + wc) * 60)) + 40 * floor((ceil(dist / (tas + wc) *
          60)) / 60)
      - id: d3
        formula: (ceil(dist / (tas + wc) * 60 * (1 + cont / 100))) + 40 *
          floor((ceil(dist / (tas + wc) * 60 * (1 + cont / 100))) / 60)
      - id: d4
        formula: (ceil(dist / (tas + wc) * 60 * (1 + cont / 100) + alt + res + taxi / ff
          * 60)) + 40 * floor((ceil(dist / (tas + wc) * 60 * (1 + cont / 100) +
          alt + res + taxi / ff * 60)) / 60)
      - id: d5
        formula: (ceil(dist / tas * 60 * (1 + cont / 100) + alt + res)) + 40 *
          floor((ceil(dist / tas * 60 * (1 + cont / 100) + alt + res)) / 60)
    presets:
      - id: p1
        values:
          taxi: 20
          dist: 412
          tas: 140
          ff: 430
          wc: 15
          cont: 5
          alt: 25
          res: 30
    explanation: >-
      The endurance in Item 19 is the time the take-off fuel lasts: trip time
      (at ground speed), plus contingency fuel, plus the alternate time and the
      final reserve. Taxi fuel is burned before take-off and is not included.
      The time is rounded up to the next full minute and written as HHMM.


      **Solution**


      Trip time: {{f: dist / (tas + wc) * 60}} = {{n: dist / (tas + wc) * 60}}
      min


      Total: trip time x (1 + contingency) + alternate + reserve = {{= dist /
      (tas + wc) * 60 * (1 + cont / 100) + alt + res}} min, rounded up to {{=
      ceil(dist / (tas + wc) * 60 * (1 + cont / 100) + alt + res)}} min


      Endurance in HHMM: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: contingency fuel forgotten.

      - **{{d2}}**: trip time only, alternate, reserve and contingency
      forgotten.

      - **{{d3}}**: alternate and final reserve forgotten.

      - **{{d4}}**: taxi fuel converted into time and wrongly included.

      - **{{d5}}**: wind component ignored (TAS used as ground speed).
