- id: Q5DIHZ7WX
  docId: "033.05"
  relatedQuestions: []
  externalIds:
    - ATPLQ-334764
    - ATPLGS-123075
    - AVEXAM-9981
    - BGS-330500
    - AVEXAM-48740
    - ATPLGS-108191
  annexes: []
  learningObjectives:
    - "033.05"
  template:
    type: calculation
    question: >-
      The navigation plan reads:


      - Trip fuel: {{trip}} kg

      - Flight time: {{ftime}} min

      - Taxi fuel: {{taxi}} kg

      - Block fuel: {{block}} kg


      What endurance should be entered on the ICAO flight plan? Give the answer
      in hours and minutes.
    variables:
      - id: trip
        label: Trip fuel
        unit: kg
      - id: ftime
        label: Flight time
        unit: min
      - id: taxi
        label: Taxi fuel
        unit: kg
      - id: block
        label: Block fuel
        unit: kg
    answer:
      formula: round((block - taxi) * ftime / trip)
      unit: minutes
      decimals: 0
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: round(block * ftime / trip)
      - id: d2
        formula: round(ftime)
      - id: d3
        formula: round((block - taxi - trip) * ftime / trip)
      - id: d4
        formula: round((block - taxi) / trip * 60)
    presets:
      - id: p1
        values:
          trip: 100
          ftime: 95
          taxi: 3
          block: 181
      - id: p2
        values:
          trip: 150
          ftime: 130
          taxi: 5
          block: 250
    explanation: >-
      The endurance is the fuel available for the flight, which is the block
      fuel minus the taxi fuel. The fuel flow is the trip fuel divided by the
      flight time, so the endurance is the available fuel divided by that flow.


      **Solution**


      Fuel flow = {{trip}} / {{ftime}} x 60 kg/h


      Endurance = ({{block}} - {{taxi}}) / {{trip}} x {{ftime}} = {{n: (block -
      taxi) * ftime / trip}} min = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} min**: uses the block fuel without removing the taxi fuel.

      - **{{d2}} min**: gives the flight time, which is the trip time and not
      the endurance.

      - **{{d3}} min**: also removes the trip fuel, which is already used on the
      planned flight.

      - **{{d4}} min**: uses the fuel flow in the wrong unit conversion for the
      endurance.
