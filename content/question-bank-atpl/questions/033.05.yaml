  template:
    type: calculation
    question: Given a fuel flow of {{ff}} l/h, if a pilot must land with {{res}}
      minutes' reserve fuel on board, and there are {{fuel}} l on board at
      take-off, what figure (in HHMM) must be put into the Endurance section
      marked /E in Item 19 Supplementary Information of the ATS flight plan?
    variables:
      - id: ff
        label: Fuel flow
        unit: l/h
      - id: res
        label: Reserve time
        unit: min
      - id: fuel
        label: Fuel on board at take-off
        unit: l
    answer:
      formula: (round(fuel / ff * 60)) + 40 * floor((round(fuel / ff * 60)) / 60)
      unit: HHMM
      decimals: 0
    distractors:
      - id: d1
        formula: (round(fuel / ff * 60) - res) + 40 * floor((round(fuel / ff * 60) -
          res) / 60)
      - id: d2
        formula: (round(fuel / ff * 60) + res) + 40 * floor((round(fuel / ff * 60) +
          res) / 60)
      - id: d3
        formula: (round(fuel / ff * 60) - 2 * res) + 40 * floor((round(fuel / ff * 60) -
          2 * res) / 60)
      - id: d4
        formula: (round(fuel / ff * 60) + 2 * res) + 40 * floor((round(fuel / ff * 60) +
          2 * res) / 60)
    presets:
      - id: p1
        values:
          ff: 200
          res: 30
          fuel: 500
      - id: p2
        values:
          ff: 120
          res: 30
          fuel: 360
      - id: p3
        values:
          ff: 160
          res: 45
          fuel: 440
    explanation: >-
      Item 19 endurance (E/) is the total time the aircraft can remain airborne
      on all the fuel on board, including the reserve. It is therefore the fuel
      on board divided by the fuel flow, written as HHMM.


      **Solution**


      Endurance: {{f: fuel / ff * 60}} = {{n: fuel / ff * 60}} = {{= round(fuel
      / ff * 60)}} min


      In HHMM: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the reserve is deducted (that is not the endurance of the
      fuel on board).

      - **{{d2}}**: the reserve is added a second time.

      - **{{d3}}**: the reserve deducted twice.

      - **{{d4}}**: the reserve added twice.
