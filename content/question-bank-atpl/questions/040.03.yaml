    question: >-
      On 8th July 2010, the crew of a Boeing 737 from Nice to Frankfurt was
      cleared by the controller of Sector L14 to continue its climb to FL320. In
      an adjacent sector, the crew of an Airbus 319 from London to Milan were
      cleared to leave FL 390 and to descend to FL 330. The instruction was read
      back correctly, but the pilots incorrectly entered FL 320 into the FMS.
      Upon being handed off to sector L14, the Airbus called the controller:   
       "Easy 529 Yankee, descending FL320 on radar heading 150"   
       however they did not realise the incorrect flight level reported by the Airbus.   
       Shortly after, the two aircraft were converging on FL 320 and triggered potential conflict alerts on both the controller's system and the on-board TCAS of each aircraft. Corrective action had to be taken by each aircraft to re-establish separation.   
        
       Select the option which correctly states the type of communication and associated disadvantage which are illustrated by this serious incident of a "level bust" with resulting loss of separation:
    explanation: ""
    options:
      - id: OZCQMUSOG
        text: Implicit communication, which is prone to being biased towards hearing a
          message in accordance with one's mental picture of a situation.​​​​
        correct: false
        why: ""
      - id: OKX250JRJ
        text: Explicit communication, which means that the message is difficult to
          identify and is open to multiple interpretations.
        correct: false
        why: ""
      - id: OWJH3U5BU
        text: Implicit communication, which is open to interpretation due to receiving
          erroneous or inconsistent pieces of information.
        correct: false
        why: ""
      - id: OLPE1HVIT
        text: Explicit communication, which is prone to confirmation bias, that is, we
          hear what we expect to hear and NOT what is being said.
        correct: true
        why: ""
