          performance.
        correct: false
        why: ""
      - id: OSGSUFUAX
        text: The decision to depart is good, but the Commander fails to review the
          decision once they have taken-off by ignoring the influence of ice
          contamination on aircraft performance.
        correct: false
        why: ""
