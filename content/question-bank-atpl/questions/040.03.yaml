    question: >-
      On March 27th 1977, at Tenerife Airfield, a Pan American and KLM aircraft
      were involved in a crash leading to multiple fatalities. On the day
      severely restricted due to fog. The KLM aircraft received a flight
      clearance and the First Officer completed his readback with "we are now
      ready for take-off". The controller replied "OK, stand by for take-off".
      At this time there was a transmission from another aircraft on the
      frequency interrupted this message from the controller, the result being
      that the KLM crew only heard "OK". The KLM Captain interpreted "OK" as
      take-off clearance and started the take-off roll. still taxiing on the
      runway and the two collided.   
        
       In relation to this incident described above what type of communication and associated disadvantage are illustrated?
    explanation: ""
    options:
      - id: OSODJFVWB
        text: Implicit communication which may be misinterpreted due to the fundamental
          differences between verbal and non verbal communication.
        correct: false
        why: ""
      - id: OTCCQ6K15
        text: Implicit communication, which is prone to technical limitation such as
          multiple transmissions on the same frequency.
        correct: false
        why: ""
      - id: OVIK39C1I
        text: Explicit communication, since the message was interrupted and should have
          required clarification with the controller.
        correct: true
        why: ""
      - id: OMRQWCJBZ
        text: Explicit communication and as such open to interpretation by either the
          flight crew or controller.
        correct: false
        why: ""
