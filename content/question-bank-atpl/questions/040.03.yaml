      ground-start facilities available at the aerodrome, but the APU is
      necessary to start the engines. Therefore, one engine is kept running
      while the aircraft is refueled, and ground serviced. The temperature is
      around 0ºC and a light snow is falling. De-icing treatment is permitted
      only with engines off. If all the engines are shut down, the aircraft can
      only be re-started once the APU is repaired.   
       To depart from the airport as planned, the Commander decides not to de-ice. A few minutes after take-off, the aircraft develops ice-formation on the wings and consequently, it stalls.   
        
