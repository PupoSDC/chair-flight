    - ATPLQ-102983
    - AVEXAM-67700
  annexes: []
  learningObjectives:
    - 010.05.03.01.05
  template:
    type: chart
    question: "What is the correct flight level to be used for a VFR flight given:
      Compass heading: 175° Deviation: 4°E Variation: 1°W"
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: FL75
        wrongAnswers:
          - FL70
          - FL65
          - FL60
        explanation: >-
          Start from the compass heading of 175°. Deviation of 4°E gives a
          magnetic heading of 179°. Variation of 1°W then gives a true heading
          of 178°.


          A track of 178° lies in the 000° to 179° half, so a VFR flight uses
          odd thousands plus 500 ft: **FL75**.
