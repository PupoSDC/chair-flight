      value will be reported in the METAR or ATIS?
    variables:
      - id: qnh
        label: measured QNH
        unit: hPa
    answer:
      formula: floor(qnh)
      unit: hPa
      decimals: 0
    distractors:
      - id: d1
        formula: floor(qnh) - 1
      - id: d2
        formula: round(qnh)
      - id: d3
        formula: round(qnh / 10) * 10
    presets:
      - id: p1
        values:
          qnh: 1006.6
      - id: p2
        values:
          qnh: 1013.8
      - id: p3
        values:
          qnh: 998.7
    explanation: >-
      QNH is reported in whole hectopascals, and the value is always truncated
      (rounded down), never rounded to the nearest value. This way the reported
      pressure is never higher than the measured one, which keeps the altimeter
      setting on the safe side.


      **Solution**


      {{f: floor(qnh)}} = floor({{qnh}}) = **{{answer}} hPa**


      **Why the other answers are wrong**


      - **{{d1}} hPa**: truncates and then subtracts a further hPa for no
      reason.

      - **{{d2}} hPa**: rounds to the nearest hPa instead of truncating.

      - **{{d3}} hPa**: rounds to the nearest 10 hPa.
