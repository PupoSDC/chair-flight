  template:
    type: simple
    question: What is the meaning of APV?
    explanation: ""
    options:
      - id: OPAQKDQRC
        text: "“Aerodrome proximity visualisation”: an augmented-reality visualisation
          through any computer-based system of the essential elements at or in
          the close vicinity of an aerodrome, such as obstacles and signs."
        correct: false
        why: ""
      - id: OWOBUZDWR
        text: "“Aerodrome probable visibility”: the visibility used in case of failure
          of visibility-measuring instruments at an aerodrome, based on
          estimates by a human observer with knowledge of the aerodrome
          environment."
        correct: false
        why: ""
      - id: OKR91VRME
        text: "“Approach procedure with vertical guidance”: an instrument procedure
          which utilises lateral and vertical guidance but does not meet the
          requirements established for precision approach and landing
          operations."
        correct: true
        why: ""
      - id: O6QRVIPRE
        text: "“Approach performed only in VMC”: the restriction of an approved
          procedure to land at an aerodrome only when the aerodrome's ATS unit
          reports VFR meteorological conditions.”"
        correct: false
        why: ""
