  template:
    type: definition
    question: What does the term {term} mean?
    explanation: ""
    options:
      - id: OXSVIFMPG
        term: significant point
        definition: A specified geographical position used in defining an ATS route or
          the flight path of an aircraft and for other navigation and ATS
          purposes.
      - id: O91ARBJDK
        term: aeronautical station
        definition: A station in the aeronautical mobile service located on land or, in
          certain instances, on board of a ship or on a platform at sea.
      - id: OS9LZCOGG
        term: duplex communication
        definition: Communication between two stations that can take place in both
          directions simultaneously.
      - id: OUMDEX3VJ
        term: simplex communication
        definition: Communication between two stations which takes place in one
          direction at a time.
      - id: OTGIBAG2W
        term: Expected Approach Time
        definition: The time at which ATC expects that an arriving aircraft, following a
          delay, will leave the holding point to complete its approach for a
          landing.
      - id: O7INVCOEE
        term: broadcast
        definition: A transmission of information relating to air navigation that is not
          addressed to a specific station or stations.
    fakeOptions:
      - id: F5SHEQTCG0
        definition: A specified geographical position used to define an area navigation
          route or the flight path of an aircraft employing area navigation.
      - id: F5SHEQTCG1
        definition: A defined position on an aerodrome used for the calibration of the
          inertial navigation system.
      - id: F5SHEQTCG2
        definition: A signal indicating the direction of the runway-in-use.
      - id: F5SHEQTCG3
        definition: Any station established to exchange radiotelephony communications.
      - id: F5SHEQTCG4
        definition: An airborne station forming part of the aeronautical fixed
          telecommunication network (AFTN).
      - id: F5SHEQTCG5
        definition: A station in the aeronautical telecommunication service located on
          land or on board of an aircraft to exchange radiotelephony
          communications.
      - id: F5SHEQTCG6
        definition: One-way communication from aircraft to stations or locations on the
          surface of the Earth.
      - id: F5SHEQTCG7
        definition: One-way communication from stations or locations on the surface of
          the Earth to aircraft.
      - id: F5SHEQTCG8
        definition: Communication relating to air navigation that is for all aircraft
          and stations within range.
      - id: F5SHEQTCG9
        definition: Any transmission, emission, or reception of signs, signals, writing,
          images, and sounds.
      - id: F5SHEQTCG10
        definition: The holding time over the radio facility from which the instrument
          approach procedure for a landing will be initiated.
      - id: F5SHEQTCG11
        definition: The time at which an arriving aircraft, upon reaching the radio aid
          serving the destination aerodrome, will commence the instrument
          approach procedure for a landing.
      - id: F5SHEQTCG12
        definition: The time at which an arriving aircraft expects to arrive over the
          appropriate designated navigation aid serving the destination
          aerodrome.
      - id: F5SHEQTCG13
        definition: A transmission containing meteorological and operational information
          to aircraft engaged in flights over remote and oceanic areas out of
          range of VHF ground stations.
      - id: F5SHEQTCG14
        definition: Two-way communication between aircraft and stations or locations on
          the surface of the earth.
