  docId: "010.06"
  relatedQuestions:
    - QSCUAJFT
  externalIds:
    - ATPLQ-108420
    - BGS-101761
    - ATPLGS-628612
    - AVEXAM-63267
  annexes: []
  learningObjectives:
    - 010.06.04.01.11
  template:
    type: calculation
    question: >-
      The OCH of a precision approach to runway 01 is {{och}} ft. In accordance
      with ICAO Doc 8168, what is the OCA of the approach (in ft)?


      - Aerodrome elevation: {{elev}} ft

      - RWY 01 threshold elevation: {{t01}} ft

      - RWY 19 threshold elevation: {{t19}} ft
    variables:
      - id: och
        label: OCH
        unit: ft
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: t01
        label: RWY 01 threshold elevation
        unit: ft
      - id: t19
        label: RWY 19 threshold elevation
        unit: ft
    answer:
      formula: och + t01
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: och + elev
      - id: d2
        formula: och + t19
      - id: d3
        formula: och
      - id: d4
        formula: och + elev + t01
    presets:
      - id: p1
        values:
          och: 154
          elev: 35
          t01: 40
          t19: 30
      - id: p2
        values:
          och: 180
          elev: 50
          t01: 56
          t19: 44
    explanation: >-
      For a precision approach, OCA is referenced to the elevation of the
      threshold of the runway concerned. OCA = OCH + threshold elevation.


      **Solution**


      {{f: och + t01}} = {{n: och + t01}} = **{{answer}} ft**


      **Why the other answers are wrong**

      - **{{d1}} ft**: uses the aerodrome elevation instead of the RWY 01
      threshold elevation.

      - **{{d2}} ft**: uses the elevation of the opposite threshold (RWY 19).

      - **{{d3}} ft**: gives the OCH, which is a height, not an altitude.

      - **{{d4}} ft**: adds both the aerodrome and the threshold elevation.
