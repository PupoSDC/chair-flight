- id: QLI6RR4EE
  docId: "010.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-109977
    - AVEXAM-93804
  annexes: []
  learningObjectives:
    - 010.06.04.01.11
  template:
    type: calculation
    question: >-
      For runway 01, the OCH of a precision approach is {{och}} ft.


      The ARP elevation is {{arp}} ft, the RWY 01 threshold elevation is
      {{thr01}} ft and the RWY 19 threshold elevation is {{thr19}} ft.


      What is the OCA for a precision approach to RWY 01?
    variables:
      - id: och
        label: OCH
        unit: ft
      - id: arp
        label: ARP elevation
        unit: ft
      - id: thr01
        label: RWY 01 threshold elevation
        unit: ft
      - id: thr19
        label: RWY 19 threshold elevation
        unit: ft
    answer:
      formula: och + thr01
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: och + arp
      - id: d2
        formula: och + thr19
      - id: d3
        formula: och + arp + thr19 - thr01
    presets:
      - id: p1
        values:
          och: 200
          arp: 35
          thr01: 30
          thr19: 40
      - id: p2
        values:
          och: 150
          arp: 35
          thr01: 39
          thr19: 30
      - id: p3
        values:
          och: 120
          arp: 40
          thr01: 33
          thr19: 45
    explanation: >-
      The obstacle clearance altitude (OCA) is the obstacle clearance height
      (OCH) expressed above mean sea level. For a precision approach it is
      referenced to the elevation of the threshold of the runway in use, so only
      the RWY 01 threshold elevation is added to the OCH.


      **Solution**


      {{f: och + thr01}} = {{n: och + thr01}} = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: adds the aerodrome (ARP) elevation instead of the runway
      threshold elevation.

      - **{{d2}} ft**: adds the elevation of the opposite threshold (RWY 19)
      instead of RWY 01.

      - **{{d3}} ft**: adds the ARP elevation and the difference between the two
      threshold elevations, which is not a valid reference.
