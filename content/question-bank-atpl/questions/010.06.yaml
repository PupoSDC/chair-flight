  template:
    type: calculation
    question: >-
      You are preparing for a precision (ILS) approach. The approach chart gives
      an OCH of {{och}} ft for your aircraft category, and {{add}} ft must be
      added for operational reasons (operational margin).


      What is the decision height (DH) in feet?
    variables:
      - id: och
        label: OCH
        unit: ft
      - id: add
        label: Operational margin
        unit: ft
    answer:
      formula: och + add
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: och
      - id: d2
        formula: och - add
      - id: d3
        formula: och + 2 * add
      - id: d4
        formula: och - 2 * add
    presets:
      - id: p1
        values:
          och: 420
          add: 50
      - id: p2
        values:
          och: 167
          add: 33
      - id: p3
        values:
          och: 195
          add: 25
    explanation: >-
      For a precision approach the minimum is expressed as a decision height
      (DH). The DH is the obstacle clearance height (OCH) plus any operational
      margin added by the operator.


      **Solution**


      {{f: och + add}} = {{n: och + add}} = **{{answer}} ft**


      **Why the other answers are wrong**

      - **{{d1}} ft**: uses the OCH alone and ignores the operational margin.

      - **{{d2}} ft**: subtracts the margin instead of adding it.

      - **{{d3}} ft**: adds the margin twice.

      - **{{d4}} ft**: subtracts the margin twice.
