  template:
    type: calculation
    question: >-
      The OCH is {{och}} ft for a visual circling approach into an aerodrome,
      given the following heights:


      - Aerodrome elevation: {{elev}} ft

      - RWY 01 threshold elevation: {{t01}} ft

      - RWY 19 threshold elevation: {{t19}} ft


      What is the OCA for RWY 01 (in ft)?
    variables:
      - id: och
        label: OCH
        unit: ft
      - id: elev
        label: Aerodrome elevation
        unit: ft
      - id: t01
        label: RWY 01 threshold elevation
        unit: ft
      - id: t19
        label: RWY 19 threshold elevation
        unit: ft
    answer:
      formula: och + elev
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: och + t01
      - id: d2
        formula: och + t19
      - id: d3
        formula: och
      - id: d4
        formula: och + elev + t01
    presets:
      - id: p1
        values:
          och: 150
          elev: 35
          t01: 39
          t19: 30
      - id: p2
        values:
          och: 160
          elev: 42
          t01: 46
          t19: 38
    explanation: >-
      For a visual circling approach, OCA is referenced to the aerodrome
      elevation (not a runway threshold). OCA = OCH + aerodrome elevation.


      **Solution**


      {{f: och + elev}} = {{n: och + elev}} = **{{answer}} ft**


      **Why the other answers are wrong**

      - **{{d1}} ft**: uses the RWY 01 threshold elevation, which applies to
      straight-in precision approaches, not circling.

      - **{{d2}} ft**: uses the RWY 19 threshold elevation.

      - **{{d3}} ft**: gives the OCH, which is a height above the elevation, not
      an altitude.

      - **{{d4}} ft**: adds both the aerodrome and the threshold elevation.
