- id: QEFPPFITX
  docId: "061.01"
  relatedQuestions:
    - QYRUOEPY
  externalIds:
    - ATPLQ-616244
    - BGS-611409
  annexes: []
  learningObjectives:
    - 061.02.02.01.14
  template:
    type: calculation
    question: >-
      What will be the revised ETA (to the nearest minute) over turning point B
      in the following situation? Assume that all other conditions remain
      unchanged.


      - Planned ETA over turning point B: 14:14 UTC

      - Planned distance from turning point A to turning point B: {{dist}} NM

      - Planned distance from turning point A to check feature X: {{dist_fix}}
      NM

      - Actual time over check feature X: {{lag}} min late


      What is the revised ETA over turning point B?
    variables:
      - id: dist
        label: Distance A to turning point B
        unit: NM
      - id: dist_fix
        label: Distance A to check feature X
        unit: NM
      - id: lag
        label: Lateness over check feature X
        unit: min
    answer:
      formula: 854 + round(lag * dist / dist_fix)
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: 854 + round(lag)
      - id: d2
        formula: 854 + round(lag * (dist - dist_fix) / dist_fix)
      - id: d3
        formula: "854"
    presets:
      - id: p1
        values:
          dist: 43
          dist_fix: 10
          lag: 1.25
      - id: p2
        values:
          dist: 60
          dist_fix: 15
          lag: 2
      - id: p3
        values:
          dist: 60
          dist_fix: 15
          lag: 1.6
    explanation: >-
      The aircraft is late over check feature X. The lateness grows in
      proportion to distance, so the lateness at turning point B is the lateness
      at X multiplied by the ratio of the two distances. The revised ETA is the
      planned ETA plus that extra lateness.


      **Solution**


      - Ratio of distances: {{dist}} NM / {{dist_fix}} NM = {{= dist /
      dist_fix}}

      - Extra lateness at B: {{lag}} min × {{= dist / dist_fix}} = {{= lag *
      dist / dist_fix}} min, rounded to the nearest minute

      - Revised ETA: 14:14 plus the extra lateness = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the lateness at X is added without scaling to B.

      - **{{d2}}**: the scaling uses the distance beyond X instead of the whole
      distance to B.

      - **{{d3}}**: the lateness is ignored and the planned ETA is given.
- id: QEG6JA14D
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619727
    - ATPLGS-110338
  annexes: []
  learningObjectives:
    - 061.04.03.02.03
  template:
    type: calculation
    question: >-
      Given the following information, what is the magnetic bearing of the NDB
      measured from the aircraft?


      - Magnetic heading: {{hdg}}°

      - Drift angle: {{drift}}° left

      - Relative bearing of NDB: {{rb}}°


      Give the magnetic bearing in degrees.
    variables:
      - id: hdg
        label: Magnetic heading
        unit: °
      - id: drift
        label: Drift (left)
        unit: °
      - id: rb
        label: Relative bearing
        unit: °
    answer:
      formula: (hdg + rb) - 360 * floor((hdg + rb) / 360)
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: (hdg + drift + rb) - 360 * floor((hdg + drift + rb) / 360)
      - id: d2
        formula: (hdg + rb + 180) - 360 * floor((hdg + rb + 180) / 360)
      - id: d3
        formula: (hdg - drift + rb) - 360 * floor((hdg - drift + rb) / 360)
      - id: d4
        formula: rb
    presets:
      - id: p1
        values:
          hdg: 311
          drift: 10
          rb: 270
      - id: p2
        values:
          hdg: 45
          drift: 5
          rb: 200
      - id: p3
        values:
          hdg: 170
          drift: 12
          rb: 90
    explanation: >-
      The bearing of the NDB from the aircraft is measured from magnetic north,
      and it is taken from the direction the nose points. It is therefore the
      magnetic heading plus the relative bearing. The drift is not used, because
      the bearing depends on the heading and not on the track. A total above
      360° has 360° taken off.


      **Solution**


      {{f: hdg + rb}} = {{n: hdg + rb}}, minus 360° = **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the drift to the heading.

      - **{{d2}}°**: gives the reciprocal bearing, which is 180° away.

      - **{{d3}}°**: uses the track instead of the heading.

      - **{{d4}}°**: forgets the heading and uses only the relative bearing.
- id: QEHJPJPG
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618391
    - BGS-611692
    - ATPLGS-625373
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: >-
      Given the following information, what is a suitable altitude for turning
      to the final?


      - Distance to the threshold: {{dist}} NM

      - Threshold elevation: {{elev}} ft

      - Approach angle: {{angle}}°
    variables:
      - id: dist
        label: distance
        unit: NM
      - id: elev
        label: threshold elevation
        unit: ft
      - id: angle
        label: approach angle
        unit: °
    answer:
      formula: elev + dist * angle * 100
      unit: ft
      decimals: 0
    distractors:
      - id: d1
        formula: dist * angle * 100
      - id: d2
        formula: abs(elev - dist * angle * 100)
      - id: d3
        formula: elev + dist * angle * 10
    presets:
      - id: p1
        values:
          dist: 4
          elev: 700
          angle: 3
      - id: p2
        values:
          dist: 5
          elev: 1200
          angle: 3
      - id: p3
        values:
          dist: 3
          elev: 350
          angle: 3
    explanation: >-
      On a glidepath the height above the threshold is about 100 ft per NM for
      each degree of approach angle (a 3° path is about 300 ft per NM). Add the
      threshold elevation to get the altitude.


      **Solution**


      Height above threshold = {{dist}} NM x {{angle}} x 100 ft = {{= dist *
      angle * 100}} ft


      {{f: elev + dist * angle * 100}} = {{n: elev + dist * angle * 100}} =
      **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the threshold elevation is forgotten.

      - **{{d2}} ft**: the elevation is subtracted instead of added.

      - **{{d3}} ft**: the rule of thumb is applied with 10 ft instead of 100 ft
      per NM per degree.
- id: QEIIKGUP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611779
    - AVEXAM-39647
    - ATPLGS-626245
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      What is the difference in longitude between two positions which are
      located {{dist}} NM apart from each other, both on the parallel {{lat}}°
      (approximately)?


      Give the answer in degrees and minutes.
    variables:
      - id: dist
        label: Distance along the parallel
        unit: NM
      - id: lat
        label: Latitude
        unit: °
    answer:
      formula: dist / cos(lat)
      unit: minutes
      decimals: 0
      format: h'° 'm'’'
    distractors:
      - id: d1
        formula: dist * cos(lat)
      - id: d2
        formula: dist / sin(lat)
      - id: d3
        formula: dist
      - id: d4
        formula: dist / cos(lat) / 2
    presets:
      - id: p1
        values:
          dist: 949
          lat: 53
      - id: p2
        values:
          dist: 620
          lat: 40
      - id: p3
        values:
          dist: 1200
          lat: 50
    explanation: >-
      Along a parallel, one minute of longitude is shorter than one nautical
      mile by the factor cos(latitude). The difference in longitude in minutes
      of arc is therefore the distance divided by cos(latitude).


      **Solution**


      Difference in longitude = {{dist}} NM ÷ cos {{lat}}° = {{= dist /
      cos(lat)}} minutes of arc = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the distance is multiplied by cos instead of divided.

      - **{{d2}}**: the distance is divided by sin instead of cos.

      - **{{d3}}**: the distance is used as minutes of arc without any latitude
      correction.

      - **{{d4}}**: the result is halved.
