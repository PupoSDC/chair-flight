- id: QDOXUTFN
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619788
    - AVEXAM-37686
    - BGS-611694
  annexes: []
  learningObjectives:
    - 061.01.08.03.02
  template:
    type: calculation
    question: |-
      The following information is for an aircraft during the climb.

      - Climb time: {{climb}} min
      - Average wind: {{wd}}°(T)/{{ws}} kt
      - Average true track: {{trk}}°
      - Air distance covered during the climb: {{air}} NM

      What ground distance has been covered during the climb, to the nearest NM?
    variables:
      - id: climb
        label: Climb time
        unit: min
      - id: wd
        label: Average wind direction
        unit: °
      - id: ws
        label: Average wind speed
        unit: kt
      - id: trk
        label: Average true track
        unit: °
      - id: air
        label: Air distance covered
        unit: NM
    answer:
      formula: air - ws * cos(wd - trk) * climb / 60
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: air + ws * cos(wd - trk) * climb / 60
      - id: d2
        formula: air
      - id: d3
        formula: air + 4
      - id: d4
        formula: air - ws * sin(wd - trk) * climb / 60
    presets:
      - id: p1
        values:
          climb: 15
          wd: 250
          ws: 25
          trk: 280
          air: 34
      - id: p2
        values:
          climb: 20
          wd: 200
          ws: 30
          trk: 250
          air: 50
      - id: p3
        values:
          climb: 10
          wd: 300
          ws: 20
          trk: 270
          air: 25
    explanation: >-
      During the climb the aircraft moves over the ground with the wind, so the
      ground distance differs from the air distance. The wind component along
      the track is applied for the time of the climb to correct the air
      distance. A headwind reduces the ground distance and a tailwind increases
      it.


      **Solution**


      - Wind component along the track = {{= ws * cos(wd - trk)}} kt

      - Effect on distance over {{climb}} min = {{= ws * cos(wd - trk) * climb /
      60}} NM

      - Ground distance = {{f: air - ws * cos(wd - trk) * climb / 60}} = {{n:
      air - ws * cos(wd - trk) * climb / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: adds the headwind instead of subtracting it.

      - **{{d2}} NM**: ignores the wind and uses the air distance.

      - **{{d3}} NM**: adds a fixed 4 NM instead of working out the wind effect.

      - **{{d4}} NM**: uses the sine of the angle instead of the cosine, so the
      wrong component is taken.
