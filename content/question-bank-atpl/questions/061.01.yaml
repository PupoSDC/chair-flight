  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617993
    - AVEXAM-72876
    - ATPLGS-626405
    - AVEXAM-97491
  annexes: []
  learningObjectives:
    - 061.01.05.04.01
  template:
    type: calculation
    question: >-
      Given the following information, using a mechanical computer, calculate
      the equivalent wind component in kt. Give a positive value for a tailwind
      and a negative value for a headwind.


      - Track: {{trk}}°(T)

      - Wind vector: {{wd}}°(T)/{{ws}} kt

      - TAS: {{tas}} kt
    variables:
      - id: trk
        label: Track
        unit: °T
      - id: wd
        label: Wind direction
        unit: °T
      - id: ws
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: 0 - ws * cos(wd - trk)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: ws * cos(wd - trk)
      - id: d2
        formula: 0 - ws
      - id: d3
        formula: 0 - ws * sin(wd - trk)
      - id: d4
        formula: 0 - tas * cos(wd - trk)
    presets:
      - id: p1
        values:
          trk: 240
          wd: 30
          ws: 25
          tas: 90
      - id: p2
        values:
          trk: 90
          wd: 60
          ws: 30
          tas: 110
      - id: p3
        values:
          trk: 180
          wd: 250
          ws: 20
          tas: 95
    explanation: >-
      On the wind side of the mechanical computer, the wind is set against the
      track. Only the part of the wind that acts along the track counts: a wind
      pushing from behind helps the aircraft (tailwind), and a wind from ahead
      slows it down (headwind).


      **Solution**


      Set the track {{trk}}° against the wind {{wd}}°/{{ws}} kt and read the
      component along the track: **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: reverses the sign, so a tailwind is shown as a headwind.

      - **{{d2}} kt**: takes the full wind speed as the component and ignores
      the angle between wind and track.

      - **{{d3}} kt**: uses the crosswind part instead of the along-track part.

      - **{{d4}} kt**: uses the TAS instead of the wind speed.
- id: QOXFQROB
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614681
    - ATPLGS-124342
    - AVEXAM-35322
    - ATPLQ-615868
