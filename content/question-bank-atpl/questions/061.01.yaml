- id: QALJPVXB
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616222
    - AVEXAM-36111
  annexes: []
  learningObjectives:
    - 061.01.04.02.01
  template:
    type: calculation
    question: A speed of {{speed}} m/s corresponds to which speed in km/h?
    variables:
      - id: speed
        label: Speed
        unit: m/s
    answer:
      formula: speed * 3.6
      unit: km/h
      decimals: 0
    distractors:
      - id: d1
        formula: speed * 1.944
      - id: d2
        formula: speed / 3.6
      - id: d3
        formula: speed * 1.852
      - id: d4
        formula: speed * 3.281 * 60
    presets:
      - id: p1
        values:
          speed: 85
      - id: p2
        values:
          speed: 120
      - id: p3
        values:
          speed: 40
    explanation: >-
      Speed is converted by changing the distance unit and the time unit. There
      are 1 000 metres in a kilometre and 3 600 seconds in an hour, so a speed
      in metres per second is multiplied by 3.6 to give kilometres per hour.


      **Solution**


      {{f: speed * 3.6}} = {{n: speed * 3.6}} = **{{answer}} km/h**


      **Why the other answers are wrong**


      - **{{d1}} km/h**: 1.944 is the factor for knots, not for kilometres per
      hour

      - **{{d2}} km/h**: divides instead of multiplies, so the conversion is
      inverted

      - **{{d3}} km/h**: 1.852 is the factor between nautical miles and
      kilometres, not a speed conversion

      - **{{d4}} km/h**: converts to feet per minute, which is a different unit
