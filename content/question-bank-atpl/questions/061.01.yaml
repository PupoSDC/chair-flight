- id: QVDTYXGB
  docId: "061.01"
  relatedQuestions:
    - QCKSOTOG
    - QR09SA55O
    - QRCJVUZY
  externalIds:
    - ATPLQ-619597
    - AVEXAM-45600
  annexes: []
  learningObjectives:
    - 061.01.03.02.06
  template:
    type: calculation
    question: |-
      An aircraft flies a leg from A to B and drifts off the planned track.

      - Time flown: {{t}} min
      - Average ground speed: {{gs}} kt
      - Off-track distance (to the right): {{xt}} NM

      Using the 1 in 60 rule, what is the average drift angle?
    variables:
      - id: t
        label: Time flown
        unit: min
      - id: gs
        label: Average ground speed
        unit: kt
      - id: xt
        label: Off-track distance
        unit: NM
    answer:
      formula: 60 * xt / (gs * t / 60)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: xt
      - id: d2
        formula: 60 * xt / t
      - id: d3
        formula: 60 * xt / gs
      - id: d4
        formula: 60 * xt / (gs * t)
    presets:
      - id: p1
        values:
          t: 17
          gs: 108
          xt: 3
      - id: p2
        values:
          t: 20
          gs: 120
          xt: 4
      - id: p3
        values:
          t: 30
          gs: 90
          xt: 5
    explanation: >-
      The 1 in 60 rule says that for every 60 NM flown, 1 NM of cross-track
      error corresponds to 1 degree of drift. The distance flown is the ground
      speed times the time flown.


      **Solution**


      Distance flown: {{f: gs * t / 60}} = {{n: gs * t / 60}} NM


      Drift: {{f: 60 * xt / (gs * t / 60)}} = {{n: 60 * xt / (gs * t / 60)}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the off-track distance without the 1 in 60 rule.

      - **{{d2}}°**: divides by the time in minutes instead of the distance
      flown.

      - **{{d3}}°**: divides by the ground speed instead of the distance flown.

      - **{{d4}}°**: mixes minutes and hours, giving a value far too small.
