- id: QRLBYVTYK
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615988
    - AVEXAM-70241
    - ATPLGS-625502
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      An aircraft departs at 10:00 UTC from position 51°30’N,
      {{lon_d}}°{{lon_m}}’W.


      - Track: 270°

      - Groundspeed: {{gs}} kt


      What is the position of the aircraft at 11:30 UTC?
    variables:
      - id: lon_d
        label: Longitude, degrees
        unit: °
      - id: lon_m
        label: Longitude, minutes
        unit: ’
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: lon_d * 60 + lon_m + gs * 1.5 / cos(51.5)
      unit: minutes
      decimals: 0
      format: "'51°30’N, 'h'° 'm'’W'"
    distractors:
      - id: d1
        formula: lon_d * 60 + lon_m + gs * 1.5
      - id: d2
        formula: lon_d * 60 + lon_m + gs * 1.5 * cos(51.5)
      - id: d3
        formula: lon_d * 60 + lon_m + gs * 1.5 / sin(51.5)
      - id: d4
        formula: lon_d * 60 + lon_m + gs / cos(51.5)
    presets:
      - id: p1
        values:
          lon_d: 1
          lon_m: 59
          gs: 390
      - id: p2
        values:
          lon_d: 2
          lon_m: 15
          gs: 420
      - id: p3
        values:
          lon_d: 4
          lon_m: 30
          gs: 350
    explanation: >-
      A track of 270° is due west. Along a parallel, one minute of longitude is
      shorter than one nautical mile by the factor cos(latitude), so the change
      in longitude is the distance divided by cos(latitude). The distance flown
      in 1.5 hours is the groundspeed multiplied by 1.5.


      **Solution**


      Distance = {{gs}} kt × 1.5 h = {{= gs * 1.5}} NM


      Change of longitude = {{= gs * 1.5}} NM ÷ cos 51.5° = {{= gs * 1.5 /
      cos(51.5)}} minutes of arc


      New longitude = {{= lon_d * 60 + lon_m}} + {{= gs * 1.5 / cos(51.5)}} =
      {{= lon_d * 60 + lon_m + gs * 1.5 / cos(51.5)}} minutes of arc, which is
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the distance is not corrected for latitude, so the change in
      longitude is too small.

      - **{{d2}}**: the distance is multiplied by cos 51.5° instead of divided.

      - **{{d3}}**: sin 51.5° is used instead of cos 51.5°.

      - **{{d4}}**: only one hour is flown instead of 1.5 hours.
