    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      An aircraft must descend from a set flight level to cross a VOR at another
      flight level:


      - Starting level: FL{{fl_from}}

      - Level to cross the VOR: FL{{fl_to}}

      - Distance from the VOR when the descent starts: {{dist}} NM

      - Mean ground speed during the descent: {{gs}} kt


      What is the minimum rate of descent required, in ft/min?
    variables:
      - id: fl_from
        label: Starting flight level
        unit: FL
      - id: fl_to
        label: Flight level to cross the VOR
        unit: FL
      - id: dist
        label: Distance from the VOR
        unit: NM
      - id: gs
        label: Mean ground speed
        unit: kt
    answer:
      formula: round((fl_from - fl_to) * 100 * gs / (60 * dist) / 10) * 10
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (fl_from - fl_to) * 100 * gs / dist
      - id: d2
        formula: (fl_from - fl_to) * 100 * dist / (60 * gs)
      - id: d3
        formula: (fl_from + fl_to) * 100 * gs / (60 * dist)
      - id: d4
        formula: (fl_from - fl_to) * 100 * gs * 1.852 / (60 * dist)
    presets:
      - id: p1
        values:
          fl_from: 290
          fl_to: 80
          dist: 50
          gs: 271
      - id: p2
        values:
          fl_from: 350
          fl_to: 110
          dist: 100
          gs: 335
      - id: p3
        values:
          fl_from: 310
          fl_to: 100
          dist: 60
          gs: 300
    explanation: >-
      The aircraft has to lose height while it covers the distance to the VOR.
      The time available is the distance divided by the ground speed, and the
      rate of descent is the height to lose divided by that time. The result is
      rounded to the nearest 10 ft/min.


      **Solution**


      - Height to lose: FL{{fl_from}} to FL{{fl_to}} = {{= (fl_from - fl_to) *
      100}} ft

      - Time available: {{dist}} NM ÷ {{gs}} kt = {{= dist / gs * 60}} min

      - {{f: round((fl_from - fl_to) * 100 * gs / (60 * dist) / 10) * 10}} =
      {{n: round((fl_from - fl_to) * 100 * gs / (60 * dist) / 10) * 10}} =
      **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the time was not converted from hours to minutes, so
      the rate is 60 times too large.

      - **{{d2}} ft/min**: the ratio is inverted, dividing the distance by the
      ground speed instead.

      - **{{d3}} ft/min**: the flight levels were added instead of subtracted.

      - **{{d4}} ft/min**: the ground speed was converted to km/h and mixed with
      a distance in NM.
