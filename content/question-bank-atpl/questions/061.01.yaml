  template:
    type: calculation
    question: >-
      Two points lie on the same parallel of latitude, on opposite sides of the
      Greenwich meridian, given:


      - Point A: {{lat_d}}°{{lat_m}}' N, {{e_d}}°{{e_m}}' E

      - Point B: {{lat_d}}°{{lat_m}}' N, {{w_d}}°{{w_m}}' W


      What is the distance between A and B along the parallel? Give the answer
      in NM.
    variables:
      - id: lat_d
        label: Latitude, degrees
        unit: °
      - id: lat_m
        label: Latitude, minutes
        unit: "'"
      - id: e_d
        label: Longitude A, degrees east
        unit: °
      - id: e_m
        label: Longitude A, minutes east
        unit: "'"
      - id: w_d
        label: Longitude B, degrees west
        unit: °
      - id: w_m
        label: Longitude B, minutes west
        unit: "'"
    answer:
      formula: ((e_d * 60 + e_m) + (w_d * 60 + w_m)) * cos(lat_d + lat_m / 60)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (e_d * 60 + e_m) + (w_d * 60 + w_m)
      - id: d2
        formula: ((e_d * 60 + e_m) - (w_d * 60 + w_m)) * cos(lat_d + lat_m / 60)
      - id: d3
        formula: ((e_d * 60 + e_m) + (w_d * 60 + w_m)) * cos(lat_d + lat_m / 60) * 1.852
      - id: d4
        formula: ((e_d * 60 + e_m) + (w_d * 60 + w_m)) * sin(lat_d + lat_m / 60)
    presets:
      - id: p1
        values:
          lat_d: 51
          lat_m: 0
          e_d: 4
          e_m: 0
          w_d: 2
          w_m: 0
      - id: p2
        values:
          lat_d: 85
          lat_m: 0
          e_d: 17
          e_m: 54
          w_d: 28
          w_m: 24
    explanation: >-
      Along a parallel, the distance is the longitude difference in minutes
      multiplied by the cosine of the latitude. When the two points are on
      opposite sides of the Greenwich meridian, the east and west longitudes are
      added, because the longitude difference is the sum of their distances from
      the meridian.


      **Solution**


      Longitude difference = {{= e_d * 60 + e_m + w_d * 60 + w_m}} min


      Distance = {{n: (e_d * 60 + e_m + w_d * 60 + w_m) * cos(lat_d + lat_m /
      60)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the cosine of the latitude is not applied.

      - **{{d2}} NM**: the longitudes are subtracted, but the points are on
      opposite sides of the Greenwich meridian.

      - **{{d3}} km**: the result is converted to kilometres (x 1.852) instead
      of being kept in NM.

      - **{{d4}} NM**: the sine of the latitude is used instead of the cosine.
