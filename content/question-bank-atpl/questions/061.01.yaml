- id: Q0E6NLNUU
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619707
    - AVEXAM-38393
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: |-
      An aircraft flies from A to B. The data is:

      - Planned track: {{planned}}°
      - Distance from A to B: {{total}} NM
      - Distance flown when the error is noticed: {{flown}} NM
      - Cross track error: {{xte}}° to the right

      Which track should the pilot now follow to arrive at B?
    variables:
      - id: planned
        label: Planned track
        unit: °
      - id: xte
        label: Cross track error
        unit: °
      - id: total
        label: Distance from A to B
        unit: NM
      - id: flown
        label: Distance flown
        unit: NM
    answer:
      formula: planned - xte * total / (total - flown)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: planned - xte
      - id: d2
        formula: planned + xte * total / (total - flown)
      - id: d3
        formula: planned - xte * flown / (total - flown)
      - id: d4
        formula: planned - xte * total / flown
    presets:
      - id: p1
        values:
          planned: 278
          xte: 4
          total: 75
          flown: 45
      - id: p2
        values:
          planned: 150
          xte: 3
          total: 120
          flown: 80
      - id: p3
        values:
          planned: 35
          xte: 5
          total: 80
          flown: 20
    explanation: >-
      The aircraft has moved off the planned track by the cross track error. To
      arrive at B it must turn back: the track change is the error angle plus a
      correction angle that brings it back to the track within the distance
      still to fly. The correction angle is the error angle multiplied by the
      distance flown and divided by the distance still to fly.


      **Solution**


      Distance still to fly: {{total}} NM - {{flown}} NM = {{= total - flown}}
      NM


      {{f: planned - xte * total / (total - flown)}}


      {{n: planned - xte * total / (total - flown)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: only the cross track error is applied, with no correction
      for the distance still to fly

      - **{{d2}}°**: adds the track change, so the pilot turns the wrong way

      - **{{d3}}°**: uses the distance flown instead of the total distance in
      the correction

      - **{{d4}}°**: divides by the distance flown instead of the distance still
      to fly
- id: Q0EIMPGLR
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612024
    - ATPLGS-110522
    - AVEXAM-32434
    - ATPLGS-124279
    - BGS-610538
  annexes: []
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: |-
      Assuming zero wind, an aircraft descends from its current level, given:

      - Altitude lost: {{alt}} ft
      - TAS: {{tas}} kt
      - Rate of descent: {{rod}} ft/min

      What distance will be covered during the descent? Give the answer in NM.
    variables:
      - id: alt
        label: Altitude lost
        unit: ft
      - id: tas
        label: TAS
        unit: kt
      - id: rod
        label: Rate of descent
        unit: ft/min
    answer:
      formula: tas * (alt / rod) / 60
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: tas * (alt / rod)
      - id: d2
        formula: tas * (rod / alt) / 60
      - id: d3
        formula: tas * (alt / rod) / 60 * 1.852
      - id: d4
        formula: tas * alt / (rod * 100)
    presets:
      - id: p1
        values:
          alt: 15000
          tas: 320
          rod: 3000
      - id: p2
        values:
          alt: 9000
          tas: 250
          rod: 1500
    explanation: >-
      With zero wind the ground speed equals the TAS. The time needed to descend
      is the altitude lost divided by the rate of descent, in minutes. The
      distance is the TAS multiplied by that time in hours, so the minutes are
      divided by 60.


      **Solution**


      Time = {{= alt / rod}} min


      Distance = {{n: tas * alt / rod / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the time in minutes is not converted to hours.

      - **{{d2}} NM**: the ratio of rate of descent to altitude is inverted.

      - **{{d3}} km**: the answer is converted to kilometres (x 1.852) instead
      of being kept in NM.

      - **{{d4}} NM**: the time is divided by 100 instead of 60.
- id: Q0HMH10BV
  docId: "061.01"
  relatedQuestions:
    - QPQTGQTD
  externalIds:
    - ATPLQ-617848
    - AVEXAM-65167
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: |-
      Given the following information, calculate the TAS.

      - CAS: {{cas}} kt
      - Pressure altitude: {{pa}} ft
      - OAT: {{oat}} °C
      - Compressibility factor: {{comp}}

      What is the TAS?
    variables:
      - id: cas
        label: CAS
        unit: kt
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: comp
        label: Compressibility factor
        unit: ""
    answer:
      formula: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756 * pa) ^
        2.62794) * comp
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756 * pa) ^
          2.62794)
      - id: d2
        formula: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756 * pa) ^
          2.62794) / comp
      - id: d3
        formula: cas * ((1 - 0.0000068756 * pa) ^ 2.62794) * comp
      - id: d4
        formula: cas * comp
    presets:
      - id: p1
        values:
          cas: 250
          pa: 25000
          oat: -40
          comp: 0.975
      - id: p2
        values:
          cas: 280
          pa: 30000
          oat: -45
          comp: 0.96
      - id: p3
        values:
          cas: 230
          pa: 20000
          oat: -20
          comp: 0.98
    explanation: >-
      Compressibility is a small correction that matters at higher speeds, when
      the air is squeezed as it enters the pitot tube. The factor given in the
      stem reduces the TAS calculated for the altitude and temperature.


      **Solution**


      {{f: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756 * pa) ^
      2.62794) * comp}} = {{n: cas * sqrt((oat + 273.15) / 288.15) / ((1 -
      0.0000068756 * pa) ^ 2.62794) * comp}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: forgets the compressibility factor.

      - **{{d2}} kt**: divides by the factor instead of multiplying.

      - **{{d3}} kt**: applies the altitude correction the wrong way round and
      leaves out the temperature.

      - **{{d4}} kt**: applies the factor to the CAS only and ignores altitude
      and temperature.
- id: Q0HOQSVTF
  docId: "061.01"
  relatedQuestions:
    - QMR04FBMH
  externalIds:
    - ATPLQ-611055
    - ATPLQ-611162
    - AVEXAM-86021
    - ATPLQ-612894
    - ATPLGS-627945
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
    - 061.01.03.02.04
  template:
    type: chart
    question: |-
      Given the following information, determine the track error angle:

      - Planned track: {{track}}°(T)
      - Actual heading: {{heading}}°(T)
      - Actual in-flight drift: {{drift}}° (negative = left, positive = right)

      Give the track error angle in degrees, left or right.
    explanation: ""
    variables:
      - id: track
        label: Planned track
        unit: °(T)
      - id: heading
        label: Actual heading
        unit: °(T)
      - id: drift
        label: Drift (negative = left)
        unit: °
    entries:
      - id: e1
        values:
          track: 197
          heading: 213
          drift: -12
        answer: 4° right
        wrongAnswers:
          - 4° left
          - 12° left
          - 16° right
        explanation: >-
          The track error angle (TKE) is the angle between the planned track and
          the track actually being made good. The track made good is the heading
          plus the drift caused by the wind. A drift to the left is subtracted
          from the heading and a drift to the right is added. If the result is
          to the right of the planned track the error is to the right, otherwise
          it is to the left.


          **Solution**


          The track made good is 213° - 12° = 201°. The track error is 201° -
          197° = 4°, to the right.


          **Why the other answers are wrong**


          - **4° left**: the right size, but the wrong direction.

          - **12° left**: the drift is taken as the track error, without the
          planned track.

          - **16° right**: the planned track is not subtracted from the heading,
          so the heading error is used.
      - id: e2
        values:
          track: 240
          heading: 235
          drift: -7
        answer: 12° Left
        wrongAnswers:
          - 2° Left
          - 12° Right
          - 2° Right
        explanation: >-
          The track error angle (TKE) is the angle between the planned track and
          the track actually being made good. The track made good is the heading
          plus the drift caused by the wind. A drift to the left is subtracted
          from the heading and a drift to the right is added. If the result is
          to the right of the planned track the error is to the right, otherwise
          it is to the left.


          **Solution**


          The track made good is 235° - 7° = 228°. The track error is 228° -
          240° = -12°, so 12° to the left.


          **Why the other answers are wrong**


          - **2° Left**: an arithmetic slip when the planned track is
          subtracted.

          - **12° Right**: the right size, but the wrong direction.

          - **2° Right**: the heading and the planned track are compared, and
          the drift is left out.
      - id: e3
        values:
          track: 255
          heading: 258
          drift: -3
        answer: 0º
        wrongAnswers:
          - 3º Left
          - 3º Right
          - 6º Right
        explanation: >-
          The track error angle (TKE) is the angle between the planned track and
          the track actually being made good. The track made good is the heading
          plus the drift caused by the wind. A drift to the left is subtracted
          from the heading and a drift to the right is added. If the result is
          to the right of the planned track the error is to the right, otherwise
          it is to the left.


          **Solution**


          The track made good is 258° - 3° = 255°. This is exactly the planned
          track, so there is no track error.


          **Why the other answers are wrong**


          - **3º Left**: the drift is taken as the track error, without the
          heading.

          - **3º Right**: the heading error is used and the drift is ignored.

          - **6º Right**: the drift is added to the heading instead of
          subtracted.
