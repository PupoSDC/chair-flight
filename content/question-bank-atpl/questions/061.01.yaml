- id: QUZJFUCQ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612240
    - AVEXAM-16099
    - AVEXAM-64476
    - AVEXAM-43997
    - ATPLGS-124463
    - AVEXAM-44038
    - ATPLGS-110545
    - ATPLGS-124462
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
    - 061.01.03.02.06
  template:
    type: calculation
    question: >-
      An aircraft is flying according to the flight log:


      | Time | From | To | Dist (NM) | TRK/CRS (T) | HDG (T) | TAS (kt) | GS (kt) | W/V |

      | --- | --- | --- | --- | --- | --- | --- | --- | --- |

      | 00:23 | A | B | {{total}} | {{track}}° | {{hdg}}° | 120 | {{gs}} | 045/15 |


      After {{time}} minutes of flying with the planned TAS and TH the
      aircraft is {{xte}} NM North of the intended track and {{ahead}} NM
      ahead of the dead reckoning position.


      To reach destination B from this position the TH should be:
    variables:
      - id: track
        label: Planned track
        unit: °
      - id: hdg
        label: Planned true heading
        unit: °
      - id: gs
        label: Ground speed
        unit: kt
      - id: total
        label: Distance from A to B
        unit: NM
      - id: time
        label: Time flown
        unit: min
      - id: xte
        label: Distance north of the intended track
        unit: NM
      - id: ahead
        label: Distance ahead of the DR position
        unit: NM
    answer:
      formula: hdg - (60 * xte / (gs * time / 60 + ahead) + 60 * xte / (total - (gs * time / 60 + ahead)))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: track
      - id: d2
        formula: hdg + (60 * xte / (gs * time / 60 + ahead) + 60 * xte / (total - (gs * time / 60 + ahead)))
      - id: d3
        formula: track - (60 * xte / (gs * time / 60 + ahead) + 60 * xte / (total - (gs * time / 60 + ahead)))
    presets:
      - id: p1
        values:
          track: 270
          hdg: 275
          gs: 130
          total: 50
          time: 15
          xte: 3
          ahead: 2.5
      - id: p2
        values:
          track: 270
          hdg: 275
          gs: 130
          total: 60
          time: 18
          xte: 4
          ahead: 3
      - id: p3
        values:
          track: 270
          hdg: 275
          gs: 130
          total: 55
          time: 15
          xte: 5
          ahead: 2
    explanation: >-
      The aircraft is off track, so the heading changes by two angles from the
      planned heading: the track error, which stops the drift away from the
      track, and the closing angle, which brings the aircraft back to the track
      before the destination. Both are found with the 1 in 60 rule. The
      distance along the track is the distance flown at ground speed plus the
      distance ahead of the DR position.


      **Solution**


      Distance along the track: {{gs}} kt x {{time}} min / 60 +
      {{ahead}} NM = {{= gs * time / 60 + ahead}} NM


      Distance to go: {{total}} NM - {{= gs * time / 60 + ahead}} NM =
      {{= total - (gs * time / 60 + ahead)}} NM


      Track error: 60 x {{xte}} / {{= gs * time / 60 + ahead}} =
      {{= 60 * xte / (gs * time / 60 + ahead)}}°


      Closing angle: 60 x {{xte}} / {{= total - (gs * time / 60 + ahead)}} =
      {{= 60 * xte / (total - (gs * time / 60 + ahead))}}°


      The aircraft is north of a track flown towards the west, so the heading is changed
      towards the left: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the planned track, which ignores the wind drift and the
      closing angle

      - **{{d2}}°**: the heading is changed to the wrong side

      - **{{d3}}°**: the correction is applied to the track instead of to the
      planned heading
- id: QV0HXVQHT
  docId: "061.01"
  relatedQuestions:
    - QAGANIQY
    - QJTEBZDN
  externalIds:
    - ATPLQ-617206
    - BGS-610529
    - BGS-610534
    - ATPLGS-110507
    - BGS-610510
    - AVEXAM-7761
    - ATPLGS-124375
    - BGS-610535
    - ATPLGS-110521
    - ATPLGS-110512
    - ATPLGS-124387
    - AVEXAM-24901
    - AVEXAM-3416
    - BGS-610513
    - AVEXAM-32270
    - ATPLGS-124389
    - ATPLGS-124374
    - AVEXAM-57424
    - ATPLQ-615420
    - ATPLGS-110519
    - ATPLGS-124388
    - BGS-610512
    - AVEXAM-24176
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      An aircraft is required to start its descent {{dist}} NM before a VOR and
      to cross the VOR at {{end_alt}} ft.


      - Altitude at the start of the descent: {{start_alt}} ft

      - Mean groundspeed for the descent: {{gs}} kt


      What is the minimum rate of descent required, in ft/min?
    variables:
      - id: start_alt
        label: Start altitude
        unit: ft
      - id: end_alt
        label: Altitude over the VOR
        unit: ft
      - id: dist
        label: Distance to VOR at start of descent
        unit: NM
      - id: gs
        label: Mean groundspeed
        unit: kt
    answer:
      formula: (start_alt - end_alt) / (dist / gs * 60)
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (start_alt - end_alt) / (dist / gs)
      - id: d2
        formula: (start_alt + end_alt) / (dist / gs * 60)
      - id: d3
        formula: (start_alt - end_alt) * (dist / gs) / 60
      - id: d4
        formula: (start_alt - end_alt) / dist
    presets:
      - id: p1
        values:
          start_alt: 35000
          end_alt: 8000
          dist: 85
          gs: 340
      - id: p2
        values:
          start_alt: 37000
          end_alt: 13000
          dist: 120
          gs: 288
    explanation: >-
      The rate of descent is the height to be lost divided by the time available
      to lose it. The time is the distance to the VOR divided by the
      groundspeed, converted from hours to minutes.


      **Solution**


      - Height to lose: {{n: start_alt - end_alt}} ft

      - Time available: {{= dist / gs * 60}} min

      - Rate of descent: {{f: (start_alt - end_alt) / (dist / gs * 60)}} = {{n:
      (start_alt - end_alt) / (dist / gs * 60)}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the time is left in hours, so the result is a rate
      per hour and about 60 times too large.

      - **{{d2}} ft/min**: the two altitudes are added instead of subtracted.

      - **{{d3}} ft/min**: the time is multiplied instead of divided, so the
      result is far too small.

      - **{{d4}} ft/min**: the groundspeed is ignored, so the height is divided
      by the distance only.
- id: QV2S6V2XJ
  docId: "061.01"
  relatedQuestions:
    - QEBIEKSB
  externalIds:
    - ATPLQ-619702
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: An aircraft is cruising at FL{{fl}}, Mach {{mach}}. The ISA deviation
      is {{dev}}°C. What is the TAS of the aircraft (in kt)?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: mach
        label: Mach number
        unit: ""
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: mach * 38.97 * sqrt(max(15 - 1.98 * fl / 10, -56.5) + dev + 273.15)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach * 38.97 * sqrt(max(15 - 1.98 * fl / 10, -56.5) + 273.15)
      - id: d2
        formula: mach * 38.97 * sqrt(max(15 - 1.98 * fl / 10, -56.5) - dev + 273.15)
      - id: d3
        formula: mach * 38.97 * sqrt(15 - 1.98 * fl / 10 + dev + 273.15)
      - id: d4
        formula: mach * 661.5
    presets:
      - id: p1
        values:
          fl: 410
          mach: 0.86
          dev: -12
      - id: p2
        values:
          fl: 370
          mach: 0.8
          dev: -5
      - id: p3
        values:
          fl: 390
          mach: 0.8
          dev: -8
    explanation: >-
      TAS = Mach x local speed of sound, with a = 38.97 x sqrt(T) kt. The
      temperature is the ISA temperature at the flight level (15°C - 1.98°C per
      1000 ft, constant -56.5°C above the tropopause at 36 089 ft) plus the ISA
      deviation.


      **Solution**


      T = {{= (max(15 - 1.98 * fl / 10, -56.5) + dev + 273.15)}} K, so a = {{=
      38.97 * sqrt(max(15 - 1.98 * fl / 10, -56.5) + dev + 273.15)}} kt


      TAS = {{f: mach * 38.97 * sqrt(max(15 - 1.98 * fl / 10, -56.5) + dev +
      273.15)}} = **{{answer}} kt**


      **Why the other answers are wrong**

      - **{{d1}} kt**: ignores the ISA deviation.

      - **{{d2}} kt**: applies the ISA deviation with the wrong sign.

      - **{{d3}} kt**: keeps lowering the temperature above the tropopause
      instead of using the constant -56.5°C.

      - **{{d4}} kt**: uses the sea-level speed of sound (661.5 kt) instead of
      the local value.
- id: QVADWSSBF
  docId: "061.01"
  relatedQuestions:
    - QSWGOLNC
  externalIds:
    - ATPLQ-615849
    - AVEXAM-95391
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      A flight leg of 90 NM is planned from A to B via an intermediate point C,
      which lies overhead a railway intersection.


      - Planned heading: {{hdg}}°T

      - Planned groundspeed: {{gs}} kt

      - Time flown: {{t}} min

      - Position found: {{ahead}} NM ahead of the railway intersection and
      {{left}} NM left of track (1 NM right was expected)


      Find the required heading to reach B.
    variables:
      - id: hdg
        label: Planned heading
        unit: °T
      - id: gs
        label: Planned groundspeed
        unit: kt
      - id: t
        label: Time flown
        unit: min
      - id: ahead
        label: Distance ahead of intersection
        unit: NM
      - id: left
        label: Distance left of track
        unit: NM
    answer:
      formula: hdg + 2 * left * 60 / (gs * t / 60 + ahead)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: hdg - 2 * left * 60 / (gs * t / 60 + ahead)
      - id: d2
        formula: hdg + left * 60 / (gs * t / 60 + ahead)
      - id: d3
        formula: hdg + 2 * left * 60 / (gs * t / 60)
      - id: d4
        formula: hdg + 4 * left * 60 / (gs * t / 60 + ahead)
    presets:
      - id: p1
        values:
          hdg: 37
          gs: 135
          t: 12
          ahead: 3
          left: 3
      - id: p2
        values:
          hdg: 270
          gs: 120
          t: 15
          ahead: 2
          left: 4
      - id: p3
        values:
          hdg: 180
          gs: 150
          t: 10
          ahead: 5
          left: 2
    explanation: >-
      The aircraft has flown a distance along track, and has drifted to the left
      of track. The 1 in 60 rule turns it back by twice the angle that the
      offset gives over the distance flown, so it arrives back on track in the
      same time.


      **Solution**


      - Distance flown = {{gs}} kt × {{t}} min / 60 + {{ahead}} NM = {{= gs * t
      / 60 + ahead}} NM

      - Heading change = 2 × {{left}} NM × 60 / {{= gs * t / 60 + ahead}} NM =
      {{= 2 * left * 60 / (gs * t / 60 + ahead)}}°

      - Heading to fly = {{hdg}}°T + {{= 2 * left * 60 / (gs * t / 60 +
      ahead)}}° = **{{answer}}°T**


      The aircraft is left of track, so the turn is to the right.


      **Why the other answers are wrong**


      - **{{d1}}°T**: turns the wrong way, to the left.

      - **{{d2}}°T**: forgets the doubling and only turns half the required
      angle.

      - **{{d3}}°T**: uses only the planned distance at speed and ignores the
      extra distance ahead.

      - **{{d4}}°T**: applies the correction four times over.
