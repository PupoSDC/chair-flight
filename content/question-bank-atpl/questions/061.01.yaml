    question: >-
      Two points lie on the same parallel of latitude, given:


      - Point A: {{lat_d}}°{{lat_m}}' N, {{a_d}}°{{a_m}}' W

      - Point B: {{lat_d}}°{{lat_m}}' N, {{b_d}}°{{b_m}}' W


      What is the distance between A and B along the parallel? Give the answer
      in NM.
    variables:
      - id: lat_d
        label: Latitude, degrees
        unit: °
      - id: lat_m
        label: Latitude, minutes
        unit: "'"
      - id: a_d
        label: Longitude A, degrees west
        unit: °
      - id: a_m
        label: Longitude A, minutes west
        unit: "'"
      - id: b_d
        label: Longitude B, degrees west
        unit: °
      - id: b_m
        label: Longitude B, minutes west
        unit: "'"
    answer:
      formula: abs((a_d * 60 + a_m) - (b_d * 60 + b_m)) * cos(lat_d + lat_m / 60)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: abs((a_d * 60 + a_m) - (b_d * 60 + b_m)) / 60 * cos(lat_d + lat_m / 60)
      - id: d2
        formula: abs((a_d * 60 + a_m) - (b_d * 60 + b_m))
      - id: d3
        formula: abs((a_d * 60 + a_m) - (b_d * 60 + b_m)) * cos(lat_d + lat_m / 60) *
          1.852
      - id: d4
        formula: abs((a_d * 60 + a_m) - (b_d * 60 + b_m)) * sin(lat_d + lat_m / 60)
    presets:
      - id: p1
        values:
          lat_d: 63
          lat_m: 19
          a_d: 22
          a_m: 49
          b_d: 78
          b_m: 2
      - id: p2
        values:
          lat_d: 20
          lat_m: 3
          a_d: 17
          a_m: 20
          b_d: 97
          b_m: 2
    explanation: >-
      Parallels of latitude are shorter than the equator: one minute of
      longitude along a parallel is only as long as one NM multiplied by the
      cosine of the latitude. The distance along a parallel is therefore the
      difference in longitude in minutes multiplied by the cosine of the
      latitude.


      **Solution**


      Difference in longitude = {{= abs((a_d * 60 + a_m) - (b_d * 60 + b_m))}}
      min


      Distance = {{n: abs((a_d * 60 + a_m) - (b_d * 60 + b_m)) * cos(lat_d +
      lat_m / 60)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the longitude difference is divided by 60 (converted to
      degrees) instead of being used in minutes.

      - **{{d2}} NM**: the cosine of the latitude is forgotten, so the minutes
      are taken as if at the equator.

      - **{{d3}} km**: the result is converted to kilometres (x 1.852) instead
      of being kept in NM.

      - **{{d4}} NM**: the sine of the latitude is used instead of the cosine.
- id: QMYQFMVN
  docId: "061.01"
  relatedQuestions:
    - QCUWSYZC
  externalIds:
    - ATPLQ-612290
    - ATPLGS-627943
    - AVEXAM-63586
    - AVEXAM-71242
    - AVEXAM-5368
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: >-
      Using a mechanical computer, determine the TAS of the aircraft. Given the
      following information:


      - Altitude: {{altitude}} ft

      - QNH: {{qnh}} hPa

      - OAT: {{oat}} °C

      - CAS: {{cas}} kt


      What is the TAS?
    variables:
      - id: altitude
        label: Altitude
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: oat
        label: OAT
        unit: °C
      - id: cas
        label: CAS
        unit: kt
    answer:
      formula: cas / sqrt((1 - 0.0000068756 * (altitude - (qnh - 1013) * 30)) ^
        5.25588 * 288.15 / (oat + 273.15))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
          273.15))
      - id: d3
        formula: cas * sqrt((1 - 0.0000068756 * (altitude - (qnh - 1013) * 30)) ^
          5.25588 * 288.15 / (oat + 273.15))
      - id: d4
        formula: cas / sqrt((1 - 0.0000068756 * (altitude - (qnh - 1013) * 30)) ^
          5.25588)
    presets:
      - id: p1
        values:
          altitude: 3000
          qnh: 1046
          oat: 10
          cas: 154
      - id: p2
        values:
          altitude: 5500
          qnh: 990
          oat: -5
          cas: 140
    explanation: >-
      The pressure altitude is needed first. When the QNH is not 1013 hPa, the
      altitude is corrected by 30 ft for each hPa of difference: a QNH above
      1013 hPa lowers the pressure altitude and a QNH below 1013 hPa raises it.
      The flight computer then gives the TAS from the pressure altitude, the OAT
      and the CAS.


      **Solution**


      - Set the QNH of {{qnh}} hPa against the altitude of {{altitude}} ft on
      the computer to find the pressure altitude.

      - Set the pressure altitude against the OAT of {{oat}} °C, and find the
      CAS of {{cas}} kt on the airspeed scale.

      - Read the TAS opposite it: **{{answer}} kt**.


      **Why the other answers are wrong**


      - **{{d1}} kt**: the CAS has been taken as the TAS.

      - **{{d2}} kt**: the QNH correction has been left out, so the altitude has
      been used as the pressure altitude.

      - **{{d3}} kt**: the density correction has been applied in the wrong
      direction.

      - **{{d4}} kt**: the OAT has been ignored.
- id: QNAAC18F8
  docId: 061.01.08.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-616036
    - BGS-610541
    - AVEXAM-83534
    - BGS-610543
    - BGS-610542
    - BGS-610545
    - AVEXAM-7472
    - ATPLGS-124393
    - AVEXAM-55660
    - ATPLGS-127762
    - AVEXAM-11037
    - ATPLGS-124391
    - ATPLGS-110502
  annexes: []
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: >-
      An aircraft departs from an airport and climbs to its top of climb, given:


      - Airport elevation: {{elev}} ft

      - QNH: {{qnh}} hPa

      - TAS: {{tas}} kt

      - Headwind component: {{hw}} kt

      - Rate of climb: {{roc}} ft/min

      - Top of climb: FL{{top_fl}}


      At what distance from the airport is the top of climb reached? Give the
      answer in NM.
    variables:
      - id: elev
        label: Airport elevation
        unit: ft
      - id: qnh
        label: QNH
        unit: hPa
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: top_fl
        label: Top of climb (flight level)
        unit: FL
    answer:
      formula: (tas - hw) * ((top_fl * 100 - (elev + (1013 - qnh) * 30)) / roc) / 60
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: (tas - hw) * ((top_fl * 100 - elev) / roc) / 60
      - id: d2
        formula: (tas + hw) * ((top_fl * 100 - (elev + (1013 - qnh) * 30)) / roc) / 60
      - id: d3
        formula: tas * ((top_fl * 100 - (elev + (1013 - qnh) * 30)) / roc) / 60
      - id: d4
        formula: (tas - hw) * ((top_fl * 100 - (elev + (qnh - 1013) * 30)) / roc) / 60
    presets:
      - id: p1
        values:
          elev: 2000
          qnh: 1023
          tas: 100
          hw: 20
          roc: 1000
          top_fl: 100
      - id: p2
        values:
          elev: 500
          qnh: 1018
          tas: 120
          hw: 10
          roc: 800
          top_fl: 80
    explanation: >-
      The distance is the ground speed multiplied by the time needed to climb.
      The time is the altitude gained divided by the rate of climb. The starting
      altitude must be the pressure altitude of the airport, which is its
      elevation corrected for the QNH: 30 ft for each hPa the QNH differs from
      the standard 1013 hPa. The headwind reduces the ground speed.


      **Solution**


      Ground speed = TAS - headwind = {{= tas - hw}} kt


      Pressure altitude of the airport = {{= elev + (1013 - qnh) * 30}} ft


      Time to top of climb = ({{= top_fl * 100}} - {{= elev + (1013 - qnh) *
      30}}) / {{roc}} = {{= (top_fl * 100 - (elev + (1013 - qnh) * 30)) / roc}}
      min


      Distance = {{= tas - hw}} x {{= (top_fl * 100 - (elev + (1013 - qnh) *
      30)) / roc}} / 60 = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the QNH correction is not applied, so the airport
      elevation is used as the starting altitude.

      - **{{d2}} NM**: the headwind is added to the TAS instead of subtracted.

      - **{{d3}} NM**: the headwind is ignored and the TAS is used as ground
      speed.

      - **{{d4}} NM**: the QNH correction is applied with the wrong sign.
- id: QNBXIRLH
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617175
    - ATPLGS-627156
    - ATPLQ-619540
    - BGS-610439
    - AVEXAM-43650
    - AVEXAM-13625
    - BGS-610435
    - ATPLGS-127784
  annexes: []
  learningObjectives:
    - 061.01.06.02.01
  template:
    type: chart
    question: |-
      Given the following information, calculate the true track and groundspeed:

      - TAS: {{tas}} kt
      - Heading: {{hdg}}°(T)
      - Wind: {{wdir}}°(T) / {{wspd}} kt

      Give the track in degrees true and the groundspeed in kt.
    explanation: ""
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hdg
        label: Heading
        unit: °(T)
      - id: wdir
        label: Wind direction
        unit: °(T)
      - id: wspd
        label: Wind speed
        unit: kt
    entries:
      - id: e1
        values:
          tas: 198
          hdg: 180
          wdir: 359
          wspd: 25
        answer: 180 - 223 kt
        wrongAnswers:
          - 179 - 220 kt
          - 180 - 183 kt
          - 181 - 180 kt
        explanation: >-
          The wind triangle links the heading, the true airspeed and the wind.
          The wind pushes the aircraft along or across its heading, which
          changes both the track and the groundspeed.


          **Solution**


          The wind comes from almost due north and the aircraft flies south, so
          the wind is a tailwind of about 25 kt. The track stays at 180° and the
          groundspeed is 198 + 25 = 223 kt.


          **Why the other answers are wrong**


          - **179 - 220 kt**: a small wrong track, and the tailwind is not fully
          added.

          - **180 - 183 kt**: the wind is treated as a light headwind instead of
          a tailwind.

          - **181 - 180 kt**: the track is wrong, and the groundspeed is a slip
          in the wind effect.
      - id: e2
        values:
          tas: 170
          hdg: 100
          wdir: 350
          wspd: 30
        answer: "Track: 109°T, groundspeed: 182 kt"
        wrongAnswers:
          - "Track: 098°T, groundspeed: 178 kt"
          - "Track: 103°T, groundspeed: 178 kt"
          - "Track: 091°T, groundspeed: 183 kt"
        explanation: >-
          The wind triangle links the heading, the true airspeed and the wind.
          The wind pushes the aircraft to one side of its heading, so the track
          differs from the heading, and it also adds or removes speed along the
          track.


          **Solution**


          The wind from 350° pushes the aircraft to the right of its heading, so
          the track is about 9° right of 100°, giving 109°. The wind also gives
          a tailwind component, so the groundspeed is about 182 kt.


          **Why the other answers are wrong**


          - **Track: 098°T, groundspeed: 178 kt**: the wind correction is
          applied to the wrong side of the heading.

          - **Track: 103°T, groundspeed: 178 kt**: the track is only partly
          corrected, and the wind speed is not fully used.

          - **Track: 091°T, groundspeed: 183 kt**: the wind correction is
          applied in the opposite direction, which is also too far to the left.
- id: QNCUQGSI
  docId: "061.01"
  relatedQuestions:
    - QTRROSNS
  externalIds:
    - ATPLQ-616517
    - BGS-611467
    - AVEXAM-23514
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: >-
      Given the following information, what is the rate of descent (ROD) for the
      final approach segment of the destination airport? Round the answer to the
      nearest 100 ft/min.


      - Glide path angle: {{angle}}°

      - TAS: {{tas}} kt

      - Headwind component: {{hw}} kt

      - Altitude: {{alt}} ft
    variables:
      - id: angle
        label: Glide path angle
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
      - id: alt
        label: Altitude
        unit: ft
    answer:
      formula: round(5 * (tas - hw) * angle / 3 / 100) * 100
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: 5 * tas * angle / 3
      - id: d2
        formula: 5 * (tas + hw) * angle / 3
      - id: d3
        formula: (tas - hw) * angle / 3
      - id: d4
        formula: 5 * (tas - hw) * angle
    presets:
      - id: p1
        values:
          angle: 5.5
          tas: 130
          hw: 20
          alt: 2000
      - id: p2
        values:
          angle: 3
          tas: 150
          hw: 10
          alt: 1500
    explanation: >-
      For a glide path, the rate of descent in ft/min is about 5 times the
      groundspeed for a 3 degree slope, and it scales in proportion to the
      angle. A headwind reduces the groundspeed, so the groundspeed is the TAS
      minus the headwind component. The rate of descent is 5 × groundspeed ×
      angle ÷ 3, rounded to the nearest 100 ft/min. The altitude is not needed.


      **Solution**


      - Groundspeed: {{= tas - hw}} kt

      - Rate of descent: {{f: 5 * (tas - hw) * angle / 3}} = {{n: 5 * (tas - hw)
      * angle / 3}} ≈ **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the headwind is ignored, so the groundspeed is too
      high.

      - **{{d2}} ft/min**: the headwind is treated as a tailwind, which
      increases the groundspeed.

      - **{{d3}} ft/min**: the factor of 5 is forgotten, so the result is about
      five times too small.

      - **{{d4}} ft/min**: the division by 3 is forgotten, so the result is
      about three times too large.
