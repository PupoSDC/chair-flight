    - 061.01.05.04.01
  template:
    type: calculation
    question: >-
      Calculate the headwind component, to the nearest full knot, for the
      following:


      - Runway heading: {{rdir}}°

      - Wind (from the tower): {{wdir}}° / {{wspd}} kt


      What is the headwind component?
    variables:
      - id: rdir
        label: Runway heading
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
    answer:
      formula: wspd * cos(wdir - rdir)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: wspd
      - id: d2
        formula: wspd * sin(wdir - rdir)
      - id: d3
        formula: wspd * cos(wdir)
      - id: d4
        formula: 2 * wspd * cos(wdir - rdir)
    presets:
      - id: p1
        values:
          rdir: 310
          wdir: 265
          wspd: 32
      - id: p2
        values:
          rdir: 10
          wdir: 300
          wspd: 26
      - id: p3
        values:
          rdir: 238
          wdir: 260
          wspd: 26
    explanation: >-
      Only the part of the wind that blows straight along the runway is
      headwind. It depends on the angle between the wind direction and the
      runway heading.


      **Solution**


      - Headwind = {{wspd}} kt × cos({{= wdir - rdir}}°) = {{= wspd * cos(wdir -
      rdir)}} kt

      - Rounded to the nearest knot: **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the full wind speed and ignores the angle.

      - **{{d2}} kt**: uses sine instead of cosine, which gives the crosswind
      component, not the headwind.

      - **{{d3}} kt**: uses the wind direction alone and forgets to subtract the
      runway heading.

      - **{{d4}} kt**: doubles the headwind component.
