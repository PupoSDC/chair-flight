- id: QLDRHB50X
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615700
    - ATPLQ-615125
    - AVEXAM-48513
    - ATPLGS-628157
    - ATPLGS-627951
    - AVEXAM-9352
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      Two aircraft depart from the same location on the parallel of latitude
      {{lat}}°N at {{dep}} UTC and fly in opposite directions along that
      parallel (a rhumb line track). Aircraft A flies east at {{va}} kt and
      aircraft B flies west at {{vb}} kt.


      At what time (UTC) will they meet again?


      Give the time as hhmm.
    variables:
      - id: lat
        label: Latitude
        unit: °N
      - id: dep
        label: Departure time
        unit: UTC
      - id: va
        label: Speed of aircraft A
        unit: kt
      - id: vb
        label: Speed of aircraft B
        unit: kt
    answer:
      formula: round(floor(dep / 100) * 60 + dep - floor(dep / 100) * 100 + 1296000 *
        cos(lat) / (va + vb))
      unit: minutes
      decimals: 0
      format: hhmm
    distractors:
      - id: d1
        formula: round(floor(dep / 100) * 60 + dep - floor(dep / 100) * 100 + 1296000 *
          cos(lat) / va)
      - id: d2
        formula: round(1296000 * cos(lat) / (va + vb))
      - id: d3
        formula: round(floor(dep / 100) * 60 + dep - floor(dep / 100) * 100 + 648000 *
          cos(lat) / (va + vb))
      - id: d4
        formula: round(floor(dep / 100) * 60 + dep - floor(dep / 100) * 100 - 1296000 *
          cos(lat) / (va + vb))
    presets:
      - id: p1
        values:
          lat: 87
          dep: 1022
          va: 120
          vb: 160
      - id: p2
        values:
          lat: 87
          dep: 1000
          va: 160
          vb: 120
      - id: p3
        values:
          lat: 84
          dep: 1410
          va: 150
          vb: 110
    explanation: >-
      Both aircraft fly along the same circle of latitude. At 87°N this circle
      is very short, so the two aircraft meet again after going once round it,
      when together they have covered its whole length. The length of the circle
      is 21 600 NM multiplied by the cosine of the latitude, and the two speeds
      add up.


      **Solution**


      Flight time in minutes: {{= 1296000 * cos(lat) / (va + vb)}}


      Adding this flight time to the departure time gives **{{answer}} UTC**


      **Why the other answers are wrong**


      - **{{d1}} UTC**: uses only the speed of one aircraft, which makes the
      flight time too long.

      - **{{d2}} UTC**: leaves out the departure time.

      - **{{d3}} UTC**: assumes they meet after only half a circle.

      - **{{d4}} UTC**: subtracts the flight time from the departure time.
