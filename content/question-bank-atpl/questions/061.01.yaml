    - ATPLQ-611530
    - AVEXAM-70992
    - BGS-611640
  annexes: []
  learningObjectives:
    - 061.01.03.02.02
  template:
    type: calculation
    question: >-
      Calculate the wind correction angle (WCA) for an aircraft with the
      following data:


      - Cruise TAS: {{tas}} kt

      - Crosswind component: {{xw}} kt from the left


      What is the wind correction angle?
    variables:
      - id: tas
        label: Cruise true airspeed
        unit: kt
      - id: xw
        label: Crosswind component
        unit: kt
    answer:
      formula: asin(xw / tas)
      unit: ° left
      decimals: 0
    distractors:
      - id: d1
        formula: xw / tas * 90
      - id: d2
        formula: asin(xw / tas) * 2
      - id: d3
        formula: xw * 2
      - id: d4
        formula: asin(xw / (tas + xw))
    presets:
      - id: p1
        values:
          tas: 120
          xw: 10
      - id: p2
        values:
          tas: 150
          xw: 15
      - id: p3
        values:
          tas: 100
          xw: 8
    explanation: >-
      A crosswind pushes the aircraft sideways, so the aircraft must point into
      the wind to keep its track. The wind correction angle is the angle whose
      sine is the crosswind component divided by the true airspeed. As the wind
      comes from the left, the correction is to the left.


      **Solution**


      - {{f: asin(xw / tas)}} = {{n: asin(xw / tas)}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}° left**: multiplies the ratio of crosswind to airspeed by 90
      instead of taking its angle.

      - **{{d2}}° left**: doubles the correct correction.

      - **{{d3}}° left**: doubles the crosswind component and uses it as the
      angle, without dividing by the airspeed.

      - **{{d4}}° left**: divides by the airspeed plus the crosswind instead of
      the airspeed alone.
