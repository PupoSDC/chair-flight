- id: QXPYYVWJ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611160
    - BGS-610056
    - AVEXAM-4295
    - ATPLGS-625510
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: |-
      Given:

      - Position A: {{lat}}°N, longitude unknown
      - Position B: {{lat}}°N, {{lon_b_d}}°{{lon_b_m}}’E
      - Distance between A and B: {{dist}} NM
      - Position B is east of position A

      What is the longitude of position A?
    variables:
      - id: lat
        label: Latitude
        unit: °N
      - id: lon_b_d
        label: Longitude of B, degrees
        unit: °E
      - id: lon_b_m
        label: Longitude of B, minutes
        unit: ’
      - id: dist
        label: Distance between A and B
        unit: NM
    answer:
      formula: lon_b_d * 60 + lon_b_m - dist / cos(lat)
      unit: minutes
      decimals: 0
      format: h'° 'm'’E'
    distractors:
      - id: d1
        formula: lon_b_d * 60 + lon_b_m + dist / cos(lat)
      - id: d2
        formula: lon_b_d * 60 + lon_b_m - dist
      - id: d3
        formula: lon_b_d * 60 + lon_b_m - 2 * dist / cos(lat)
      - id: d4
        formula: dist / cos(lat)
    presets:
      - id: p1
        values:
          lat: 45
          lon_b_d: 45
          lon_b_m: 15
          dist: 280
      - id: p2
        values:
          lat: 60
          lon_b_d: 30
          lon_b_m: 20
          dist: 300
      - id: p3
        values:
          lat: 50
          lon_b_d: 100
          lon_b_m: 10
          dist: 500
    explanation: >-
      Along a parallel, one minute of longitude is shorter than one nautical
      mile by the factor cos(latitude). Position A is west of B, so its
      longitude is found by subtracting the change in longitude from the
      longitude of B.


      **Solution**


      Change in longitude = {{dist}} NM ÷ cos {{lat}}° = {{= dist / cos(lat)}}
      minutes of arc


      Longitude of B = {{lon_b_d}}°{{lon_b_m}}’ = {{= lon_b_d * 60 + lon_b_m}}
      minutes of arc


      Longitude of A = {{= lon_b_d * 60 + lon_b_m}}’ − {{= dist / cos(lat)}}’ =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the change is added, which puts A east of B.

      - **{{d2}}**: the distance is subtracted in NM without the latitude
      correction.

      - **{{d3}}**: the change in longitude is doubled.

      - **{{d4}}**: the change in longitude is given as the answer, without
      subtracting it from the longitude of B.
- id: QXSVFGIV
  docId: "061.01"
  relatedQuestions:
    - QEAAYAQD
  externalIds:
    - ATPLQ-612336
    - ATPLGS-627944
    - BGS-611269
    - AVEXAM-15923
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      An aircraft is flying VFR by dead reckoning along a true track of
      {{track}}°, on a magnetic heading of {{heading}}° to allow for the wind.
      The variation is {{var}}° W.


      On the first part of the leg the pilot turns left off track to avoid
      gliders. After clearing them, a railway bridge fixes the position:


      - Fix: {{along}} NM from the start of the leg and {{off}} NM left of track

      - Distance to the next check feature: {{dist}} NM


      What is the best magnetic heading to fly to the next check feature?
    variables:
      - id: track
        label: True track
        unit: °
      - id: heading
        label: Magnetic heading
        unit: °
      - id: var
        label: Variation (west)
        unit: °
      - id: along
        label: Distance from start to fix
        unit: NM
      - id: off
        label: Distance left of track
        unit: NM
      - id: dist
        label: Distance to check feature
        unit: NM
    answer:
      formula: heading + off * 60 / dist
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: heading - off * 60 / dist
      - id: d2
        formula: track + var + off * 60 / dist
      - id: d3
        formula: heading + off * 60 / along
      - id: d4
        formula: heading + 2 * off * 60 / dist
    presets:
      - id: p1
        values:
          track: 312
          heading: 310
          var: 2
          along: 15
          off: 2
          dist: 18
      - id: p2
        values:
          track: 275
          heading: 280
          var: 2
          along: 20
          off: 4
          dist: 15
    explanation: >-
      The fix is {{off}} NM off track with {{dist}} NM still to fly to the check
      feature. The 1 in 60 rule gives the heading change to fly straight to the
      check feature from the fix, and it is added to the magnetic heading being
      flown.


      **Solution**


      - Heading change = {{off}} NM × 60 / {{dist}} NM = {{= off * 60 / dist}}°

      - Magnetic heading to fly = {{heading}}° + {{= off * 60 / dist}}° =
      **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°(M)**: turns the wrong way, away from the check feature.

      - **{{d2}}°(M)**: uses the magnetic track instead of the heading being
      flown.

      - **{{d3}}°(M)**: uses the distance to the fix instead of the distance to
      the check feature.

      - **{{d4}}°(M)**: doubles the 1 in 60 correction.
- id: QXTMLYHC4
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615865
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      An aircraft and a VOR/DME station are on the same meridian, at the
      following positions:


      - Aircraft: {{lat_deg_a}}° {{lat_min_a}}' N

      - VOR/DME station: {{lat_deg_b}}° {{lat_min_b}}' N


      What is the approximate range of the aircraft from the VOR/DME station, in
      NM?
    variables:
      - id: lat_deg_a
        label: Aircraft latitude (degrees)
        unit: °
      - id: lat_min_a
        label: Aircraft latitude (minutes)
        unit: "'"
      - id: lat_deg_b
        label: Station latitude (degrees)
        unit: °
      - id: lat_min_b
        label: Station latitude (minutes)
        unit: "'"
    answer:
      formula: (lat_deg_b * 60 + lat_min_b) - (lat_deg_a * 60 + lat_min_a)
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: (lat_deg_b - lat_deg_a) * 60
      - id: d2
        formula: lat_min_b - lat_min_a
      - id: d3
        formula: (lat_deg_b - lat_deg_a) * 60 + lat_min_a
      - id: d4
        formula: ((lat_deg_b * 60 + lat_min_b) - (lat_deg_a * 60 + lat_min_a)) * 1.852
    presets:
      - id: p1
        values:
          lat_deg_a: 50
          lat_min_a: 23.6
          lat_deg_b: 52
          lat_min_b: 40.1
      - id: p2
        values:
          lat_deg_a: 48
          lat_min_a: 10.5
          lat_deg_b: 51
          lat_min_b: 5.3
    explanation: >-
      An aircraft and a VOR/DME station on the same meridian are separated only
      in latitude. Latitude is given in degrees and minutes, and one minute of
      latitude equals one nautical mile. Convert both latitudes into minutes and
      subtract to get the range.


      **Solution**


      - Aircraft: {{lat_deg_a}}° {{lat_min_a}}' = {{= lat_deg_a * 60 +
      lat_min_a}} minutes

      - VOR/DME station: {{lat_deg_b}}° {{lat_min_b}}' = {{= lat_deg_b * 60 +
      lat_min_b}} minutes

      - Range: {{n: (lat_deg_b * 60 + lat_min_b) - (lat_deg_a * 60 +
      lat_min_a)}} NM = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: only the whole degrees are used, the minutes are ignored.

      - **{{d2}} NM**: only the minutes are subtracted, the degrees are ignored.

      - **{{d3}} NM**: the minutes of the aircraft are added instead of
      subtracted.

      - **{{d4}} NM**: the result is multiplied by 1.852 (kilometres per NM),
      which gives kilometres, not nautical miles.
- id: QXTXPZLU
  docId: "061.01"
  relatedQuestions:
    - QMTLYQMB
  externalIds:
    - ATPLQ-614955
    - BGS-620990
    - ATPLGS-100806
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: Determine the approximate rate of descent required to maintain a 3°
      glide path at a groundspeed of {{gs}} kt. Give the answer in ft/min.
    variables:
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: 5 * gs
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: gs * tan(3)
      - id: d2
        formula: 3 * gs
      - id: d3
        formula: 10 * gs
      - id: d4
        formula: 6.5 * gs
    presets:
      - id: p1
        values:
          gs: 120
      - id: p2
        values:
          gs: 90
      - id: p3
        values:
          gs: 200
    explanation: >-
      On a 3 degree glide path the aircraft descends about 318 ft for each
      nautical mile flown. The rate of descent needed is that descent multiplied
      by the nautical miles flown per minute, which is the groundspeed divided
      by 60. This works out to roughly 5 times the groundspeed in knots, a rule
      of thumb that is accurate enough for a quick answer.


      **Solution**


      - Descent per NM: {{= 6076.12 * tan(3)}} ft

      - Rate of descent: {{gs}} kt × 5 ≈ **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the groundspeed is multiplied by the tangent only,
      without converting nautical miles to feet.

      - **{{d2}} ft/min**: the rule of thumb uses 3 instead of 5, which is too
      shallow.

      - **{{d3}} ft/min**: the rule of thumb uses 10 instead of 5, which is far
      too steep.

      - **{{d4}} ft/min**: the rule of thumb uses 6.5 instead of 5, which is
      steeper than a 3 degree glide path.
