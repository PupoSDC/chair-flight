- id: QETBBORP
  docId: 061.01.03.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-615636
    - AVEXAM-74710
    - ATPLGS-625881
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
    - 061.01.03.01.07
  template:
    type: calculation
    question: |-
      An aircraft is flying with the following data:

      - Compass heading: {{compass}}°
      - Deviation card (northerly headings): {{dev}}°W
      - Variation: {{var}}°W

      What is the aircraft's true heading?
    variables:
      - id: compass
        label: compass heading
        unit: °
      - id: dev
        label: westerly deviation
        unit: °
      - id: var
        label: westerly variation
        unit: °
    answer:
      formula: compass - dev - var + 360
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: compass + dev + var
      - id: d2
        formula: compass - dev + var
      - id: d3
        formula: compass + dev - var + 360
      - id: d4
        formula: compass - var + 360
    presets:
      - id: p1
        values:
          compass: 2
          dev: 1
          var: 5
      - id: p2
        values:
          compass: 150
          dev: 2
          var: 3
    explanation: >-
      Compass, magnetic and true headings differ by two corrections. Deviation
      comes from the aircraft's own magnetic field and variation from the
      difference between magnetic and true north. Both are westerly here, so
      both are subtracted from the compass heading. The result is kept between
      000° and 360° by adding 360 when needed.


      **Solution**


      - True heading = compass heading - deviation - variation

      - {{f: compass - dev - var + 360}} = {{n: compass - dev - var + 360}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: both corrections were added, as if they were easterly.

      - **{{d2}}°**: the variation was added instead of subtracted.

      - **{{d3}}°**: the deviation was added instead of subtracted.

      - **{{d4}}°**: the deviation was left out.
- id: QETSWUHM
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617311
    - AVEXAM-76504
    - BGS-610547
    - ATPLGS-110506
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: >-
      A descending aircraft flies in a straight line towards a DME station. The
      data is:


      - At DME {{dme_hi}} NM the altitude is {{alt_hi}} ft

      - At DME {{dme_lo}} NM the altitude is {{alt_lo}} ft

      - Ground speed: {{gs}} kt


      What is the descent gradient in percent?
    variables:
      - id: dme_hi
        label: DME distance (first reading)
        unit: NM
      - id: alt_hi
        label: Altitude (first reading)
        unit: ft
      - id: dme_lo
        label: DME distance (second reading)
        unit: NM
      - id: alt_lo
        label: Altitude (second reading)
        unit: ft
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: 100 * (alt_hi - alt_lo) / ((dme_hi - dme_lo) * 6076.12)
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: 100 * (alt_hi - alt_lo) / (dme_hi * 6076.12)
      - id: d2
        formula: 100 * (alt_hi - alt_lo) / ((dme_hi - dme_lo) * 1852)
      - id: d3
        formula: 100 * (alt_hi - alt_lo) / (gs * 6076.12)
      - id: d4
        formula: 100 * (alt_hi - alt_lo) / ((dme_hi - dme_lo) * 5280)
    presets:
      - id: p1
        values:
          dme_hi: 55
          alt_hi: 33000
          dme_lo: 43.9
          alt_lo: 30500
          gs: 525
      - id: p2
        values:
          dme_hi: 40.2
          alt_hi: 15000
          dme_lo: 30.5
          alt_lo: 12000
          gs: 300
    explanation: >-
      The descent gradient is the height lost per unit of ground distance,
      expressed as a percentage. The distance flown between the two DME readings
      is the difference of the two DME distances, and one nautical mile is
      6076.12 ft.


      **Solution**


      Height lost: {{alt_hi}} ft - {{alt_lo}} ft = {{= alt_hi - alt_lo}} ft


      Distance flown: {{dme_hi}} NM - {{dme_lo}} NM = {{= dme_hi - dme_lo}} NM


      {{f: 100 * (alt_hi - alt_lo) / ((dme_hi - dme_lo) * 6076.12)}}


      {{n: 100 * (alt_hi - alt_lo) / ((dme_hi - dme_lo) * 6076.12)}} =
      **{{answer}}%**


      **Why the other answers are wrong**


      - **{{d1}}%**: uses the distance to the DME instead of the distance flown
      between the two readings

      - **{{d2}}%**: mixes metres (1852 per NM) with feet

      - **{{d3}}%**: divides by the ground speed instead of a distance

      - **{{d4}}%**: uses statute miles (5280 ft) instead of nautical miles
- id: QEUTP8SW6
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611720
    - ATPLGS-110505
    - BGS-610529
    - BGS-610534
    - ATPLGS-110507
    - BGS-610510
    - AVEXAM-7761
    - ATPLGS-110528
    - ATPLGS-124375
    - BGS-610535
    - ATPLGS-124387
    - AVEXAM-24901
    - AVEXAM-3416
    - ATPLGS-124388
    - BGS-610512
    - BGS-610513
    - AVEXAM-32270
    - ATPLGS-110494
    - ATPLGS-124389
    - AVEXAM-24176
    - ATPLGS-124374
    - AVEXAM-57424
  annexes: []
  learningObjectives:
    - 061.01.08.03.03
  template:
    type: calculation
    question: >-
      An aircraft has to descend from its cruising level so that it crosses a
      DME facility at a lower level.


      - Cruising level before the descent: FL{{fl_start}}

      - Level to cross the DME: FL{{fl_end}}

      - The descent must begin {{dist}} NM from the DME

      - Mean groundspeed during the descent: {{gs}} kt


      What is approximately the minimum rate of descent required?
    variables:
      - id: fl_start
        label: Cruising level
        unit: FL
      - id: fl_end
        label: Level at the DME
        unit: FL
      - id: dist
        label: Distance to the DME at the start of descent
        unit: NM
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: (fl_start - fl_end) * 100 * gs / (60 * dist)
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: fl_start * 100 * gs / (60 * dist)
      - id: d2
        formula: (fl_start - fl_end) * 100 * (gs - 20) / (60 * dist)
      - id: d3
        formula: (fl_start - fl_end) * 100 * gs / (60 * dist / 2)
    presets:
      - id: p1
        values:
          fl_start: 370
          fl_end: 120
          dist: 100
          gs: 396
      - id: p2
        values:
          fl_start: 350
          fl_end: 100
          dist: 80
          gs: 300
      - id: p3
        values:
          fl_start: 290
          fl_end: 130
          dist: 120
          gs: 420
    explanation: >-
      The height to lose is the difference between the two levels. The time
      available is the distance divided by the groundspeed, and the rate of
      descent is the height divided by that time.


      **Solution**


      Height to lose: {{= (fl_start - fl_end) * 100}} ft


      Time available: {{= dist / gs * 60}} min


      Rate of descent: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses the cruising level instead of the height
      difference.

      - **{{d2}} ft/min**: uses 20 kt less groundspeed than given.

      - **{{d3}} ft/min**: halves the distance, which doubles the result.
