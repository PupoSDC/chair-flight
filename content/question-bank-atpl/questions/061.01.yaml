- id: QCCGFHYF
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611240
    - AVEXAM-49290
    - ATPLGS-628140
  annexes: []
  learningObjectives:
    - 061.01.03.02.01
  template:
    type: calculation
    question: >-
      An aircraft is planning to take-off from a runway with magnetic direction
      {{rwy}}°M. Determine the average crosswind component for the take-off,
      given:


      - Magnetic variation: {{var}}° W

      - ATIS wind (magnetic): {{wind_dir}}° / {{wind_speed}} kt gusting {{gust}}
      kt
    variables:
      - id: rwy
        label: Runway direction
        unit: °
      - id: var
        label: Variation
        unit: °
      - id: wind_dir
        label: Wind direction
        unit: °
      - id: wind_speed
        label: Mean wind speed
        unit: kt
      - id: gust
        label: Gust speed
        unit: kt
    answer:
      formula: abs(wind_speed * sin(wind_dir - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: abs(gust * sin(wind_dir - rwy))
      - id: d2
        formula: abs(wind_speed * sin(wind_dir - rwy + var))
      - id: d3
        formula: abs(wind_speed * sin(wind_dir - rwy - var))
    presets:
      - id: p1
        values:
          rwy: 347
          var: 5
          wind_dir: 50
          wind_speed: 20
          gust: 30
      - id: p2
        values:
          rwy: 90
          var: 6
          wind_dir: 140
          wind_speed: 18
          gust: 28
    explanation: >-
      ATIS winds and runway directions are both magnetic, so the variation is
      not needed. The average crosswind uses the mean wind speed (not the gust)
      and the sine of the angle between wind and runway.


      **Solution**


      Angle = {{= abs(wind_dir - rwy)}}° (modulo 360°)


      {{f: wind_speed * sin(wind_dir - rwy)}} = {{n: wind_speed * sin(wind_dir -
      rwy)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the gust speed was used, which gives the maximum
      crosswind, not the average.

      - **{{d2}} kt**: the variation was added to the angle although both values
      are already magnetic.

      - **{{d3}} kt**: the variation was subtracted from the angle although both
      values are already magnetic.
- id: QCHPKQKFC
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611354
    - AVEXAM-68639
    - ATPLGS-124287
    - BGS-610579
  annexes: []
  learningObjectives:
    - 061.01.05.04.07
  template:
    type: calculation
    question: >-
      An aircraft follows a radial to a VOR/DME station. Given the following
      information:


      - At 10:00 the DME reads {{dme0}} NM

      - {{dt}} minutes later the DME reads {{dme1}} NM


      What is the estimated time overhead the VOR/DME station? Give the answer
      as hh:mm.
    variables:
      - id: dme0
        label: DME at 10:00
        unit: NM
      - id: dt
        label: Time between the two readings
        unit: min
      - id: dme1
        label: DME at the second reading
        unit: NM
    answer:
      formula: 600 + dt + dme1 / ((dme0 - dme1) / dt)
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: 600 + dt + dme0 * dt / (dme0 - dme1)
      - id: d2
        formula: 600 + dme1 * dt / (dme0 - dme1)
      - id: d3
        formula: 600 + dt + dme1 * dt / dme0
      - id: d4
        formula: 600 + dt + dme0 - dme1
    presets:
      - id: p1
        values:
          dme0: 120
          dt: 3
          dme1: 105
      - id: p2
        values:
          dme0: 150
          dt: 4
          dme1: 130
      - id: p3
        values:
          dme0: 90
          dt: 2
          dme1: 60
    explanation: >-
      When the aircraft flies straight towards the station, the DME distance
      falls at a steady rate. The rate is found from the two readings, and the
      distance still to go is divided by that rate to give the time left.


      **Solution**


      - Distance flown in {{dt}} minutes: {{= dme0 - dme1}} NM

      - Rate of closing: {{= (dme0 - dme1) / dt}} NM per minute

      - Time left from the second reading: {{f: dme1 / ((dme0 - dme1) / dt)}} =
      {{n: dme1 / ((dme0 - dme1) / dt)}} minutes

      - Time over the station: 10:00 + {{dt}} min + {{= dme1 / ((dme0 - dme1) /
      dt)}} min = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the DME at 10:00 as the distance still to go, instead
      of the DME at the second reading.

      - **{{d2}}**: forgets the minutes already flown after 10:00.

      - **{{d3}}**: divides by the DME at 10:00 when working out the time,
      instead of using the distance flown.

      - **{{d4}}**: adds the distance flown in NM as if it were a number of
      minutes.
- id: QCHSQLHH
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613418
    - AVEXAM-81107
    - AVEXAM-18942
  annexes: []
  learningObjectives:
    - 061.01.07.01.01
  template:
    type: chart
    question: >-
      Refer to figure. At 10:07 you make a note of your position over the
      intersection of highways A3 and A92 (N48°49.0', E012°56.3'). Consider the
      DR positions DR-5 to DR-8 shown on the annex. Given the following
      information, determine your DR position at 10:19.


      - TAS: 120 kt

      - Wind: 075°/40 kt

      - True heading: 085°
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: DR-7 (N48°49.1', E013°21.0')
        wrongAnswers:
          - DR-8 (N48°50.6', E013°20.1')
          - DR-5 (N48°50.3', E013°12.0')
          - DR-6 (N48°49.1', E013°12.2')
        explanation: >-
          Dead reckoning moves the start position along the track made good, by
          the distance flown in the time elapsed. The track and ground speed
          come from the heading, the TAS and the wind.


          **Solution**


          - Time elapsed: 10:19 minus 10:07 = 12 minutes.

          - Work out the track and ground speed from the TAS, the heading and
          the wind.

          - Find the DR position that matches this distance and direction from
          the start point: **DR-7**.


          **Why the other answers are wrong**


          - **DR-8**: a position too far north and east, as if the flight time
          were longer.

          - **DR-5**: a position too far north, on a track that ignores the
          wind.

          - **DR-6**: a position on the right longitude, but too far south for
          the distance flown.
- id: QCJTMYFC
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611622
    - BGS-610455
    - AVEXAM-65167
    - ATPLGS-625565
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: |-
      Given the following information, calculate the TAS.

      - Flight level: FL 400
      - Mach number: {{mach}}
      - OAT: {{oat}} °C

      What is the TAS?
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: mach * 661.5 * sqrt((oat + 273.15) / 288.15)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach * 661.5
      - id: d2
        formula: mach * 661.5 * sqrt((273.15 - oat) / 288.15)
      - id: d3
        formula: mach * 661.5 * (oat + 273.15) / 288.15
      - id: d4
        formula: mach * 661.5 * sqrt((273.15 - 56.5) / 288.15)
    presets:
      - id: p1
        values:
          mach: 0.9
          oat: -65
      - id: p2
        values:
          mach: 0.78
          oat: -50
      - id: p3
        values:
          mach: 0.82
          oat: -40
    explanation: >-
      The TAS is the speed through the air. It is the Mach number times the
      speed of sound at the actual air temperature. Sound travels more slowly in
      colder air, so at FL 400 with a cold OAT the speed of sound is much lower
      than at sea level.


      **Solution**


      {{f: mach * 661.5 * sqrt((oat + 273.15) / 288.15)}} = {{n: mach * 661.5 *
      sqrt((oat + 273.15) / 288.15)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the sea-level speed of sound and ignores the cold
      air.

      - **{{d2}} kt**: reverses the sign of the temperature (273.15 minus the
      OAT).

      - **{{d3}} kt**: leaves out the square root in the temperature correction.

      - **{{d4}} kt**: uses the standard temperature at FL 400 instead of the
      actual OAT.
- id: QCKSOTOG
  docId: "061.01"
  relatedQuestions:
    - QVDTYXGB
  externalIds:
    - ATPLQ-612474
    - ATPLGS-625470
    - AVEXAM-36974
  annexes: []
  learningObjectives:
    - 061.01.03.02.06
  template:
    type: calculation
    question: >-
      A planned route has a true course of {{tc}}°. The aircraft is flown on a
      true heading of {{th}}°.


      - True course: {{tc}}°

      - True heading: {{th}}°

      - Time en route: {{t}} min

      - Distance from the departure point to the fix: {{dist}} NM

      - Cross-track distance (right of the course line): {{xt}} NM


      Calculate the average drift angle. Give a positive value for drift to the
      right and a negative value for drift to the left.
    variables:
      - id: tc
        label: True course
        unit: °
      - id: th
        label: True heading
        unit: °
      - id: t
        label: Time en route
        unit: min
      - id: dist
        label: Distance from departure
        unit: NM
      - id: xt
        label: Cross-track distance
        unit: NM
    answer:
      formula: 60 * xt / dist - (th - tc)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: 60 * xt / dist
      - id: d2
        formula: -(60 * xt / dist - (th - tc))
      - id: d3
        formula: 60 * xt / dist + (th - tc)
      - id: d4
        formula: th - tc
    presets:
      - id: p1
        values:
          tc: 179
          th: 185
          t: 23
          dist: 44
          xt: 6
      - id: p2
        values:
          tc: 270
          th: 262
          t: 45
          dist: 90
          xt: 9
    explanation: >-
      The track made good is found with the 1 in 60 rule from the cross-track
      distance and the distance flown. The drift is the angle between the track
      made good and the heading, so the heading offset from the course is
      subtracted.


      **Solution**


      Track offset from the course: {{f: 60 * xt / dist}} = {{n: 60 * xt /
      dist}}°


      Heading offset from the course: {{f: th - tc}} = {{n: th - tc}}°


      Drift: {{f: 60 * xt / dist - (th - tc)}} = {{n: 60 * xt / dist - (th -
      tc)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the track offset and forgets the heading correction.

      - **{{d2}}°**: gives the drift the wrong sign.

      - **{{d3}}°**: adds the heading offset instead of subtracting it.

      - **{{d4}}°**: uses only the heading offset from the course.
- id: QCMYQTZY
  docId: "061.01"
  relatedQuestions:
    - QQVW8RZYH
  externalIds:
    - ATPLQ-611703
    - BGS-611683
    - AVEXAM-68921
    - AVEXAM-51168
  annexes: []
  learningObjectives:
    - 061.01.05.04.04
  template:
    type: calculation
    question: |-
      Given the following information, what is the ground speed of the aircraft?

      - TAS: {{tas}} kt
      - Heading: {{hdg}}°
      - Wind: {{wd}}°/{{ws}} kt

      Determine the ground speed in kt.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hdg
        label: Heading
        unit: °
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - ws
      - id: d2
        formula: tas + ws * cos(wd - hdg)
      - id: d3
        formula: tas - ws * cos(wd - hdg)
      - id: d4
        formula: sqrt(tas^2 + ws^2)
    presets:
      - id: p1
        values:
          tas: 250
          hdg: 90
          wd: 30
          ws: 50
      - id: p2
        values:
          tas: 280
          hdg: 0
          wd: 300
          ws: 40
      - id: p3
        values:
          tas: 320
          hdg: 270
          wd: 200
          ws: 60
    explanation: >-
      The ground speed is how fast the aeroplane moves over the ground. The wind
      changes the TAS: the part of the wind that acts along the heading speeds
      the aeroplane up or slows it down, and the part that acts across the
      heading pushes it sideways. Both parts combine into the ground speed.


      **Solution**


      - Wind component along the heading: {{= ws * cos(wd - hdg)}} kt

      - Wind component across the heading: {{= ws * sin(wd - hdg)}} kt


      {{f: sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)}} = {{n:
      sqrt((tas - ws * cos(wd - hdg))^2 + (ws * sin(wd - hdg))^2)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: ignores the wind direction and takes the full wind speed
      off the TAS.

      - **{{d2}} kt**: adds the wind along the heading to the TAS, which turns a
      headwind into a tailwind.

      - **{{d3}} kt**: ignores the part of the wind that pushes the aeroplane
      sideways.

      - **{{d4}} kt**: ignores the direction of the wind altogether.
- id: QCOEXCNX
  docId: "061.01"
  relatedQuestions:
    - QPRFOB5BS
  externalIds:
    - ATPLQ-614439
    - BGS-611646
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Determine the ETA at B, given:

      - Distance A to B: {{dist}} km
      - Groundspeed: {{gs}} kt
      - Actual time of departure: {{dep_h}} h {{dep_min}} min

      Give the ETA (hh:mm).
    variables:
      - id: dist
        label: Distance A to B
        unit: km
      - id: gs
        label: Groundspeed
        unit: kt
      - id: dep_h
        label: Departure hour
        unit: h
      - id: dep_min
        label: Departure minute
        unit: min
    answer:
      formula: 60 * dep_h + dep_min + round(60 * dist / (1.852 * gs))
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: 60 * dep_h + dep_min + round(60 * dist / gs)
      - id: d2
        formula: 60 * dep_h + dep_min + round(60 * dist / (1.6 * gs))
      - id: d3
        formula: 60 * dep_h + dep_min - round(60 * dist / (1.852 * gs))
      - id: d4
        formula: 60 * dep_h + dep_min + round(30 * dist / (1.852 * gs))
    presets:
      - id: p1
        values:
          dist: 287
          gs: 60
          dep_h: 13
          dep_min: 35
      - id: p2
        values:
          dist: 500
          gs: 120
          dep_h: 9
          dep_min: 50
      - id: p3
        values:
          dist: 900
          gs: 200
          dep_h: 16
          dep_min: 5
    explanation: >-
      Distances in kilometres must be converted to nautical miles, at 1 NM =
      1.852 km, before they are combined with a speed in knots. The flight time
      in minutes is then 60 times the distance divided by the groundspeed.


      **Solution**


      - Distance: {{dist}} km ÷ 1.852 = {{= dist / 1.852}} NM

      - Flight time: {{= dist / 1.852}} NM ÷ {{gs}} kt = {{= 60 * dist / (1.852
      * gs)}} min

      - ETA: {{dep_h}} h {{dep_min}} min + {{= 60 * dist / (1.852 * gs)}} min =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the distance in km is used as if it were NM.

      - **{{d2}}**: 1 NM is taken as 1.6 km.

      - **{{d3}}**: the flight time is subtracted instead of added.

      - **{{d4}}**: the flight time is halved.
