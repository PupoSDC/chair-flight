- id: QWCFSBGOB
  docId: "061.01"
  relatedQuestions:
    - QCUWSYZC
  externalIds:
    - ATPLQ-619647
    - ATPLGS-625377
    - ATPLGS-625574
    - AVEXAM-2549
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: >-
      Calculate the TAS, taking compressibility into account, from the following
      data. Instrument and position errors are neglected:


      - Altitude: {{altitude}} ft

      - OAT: {{oat}} °C

      - IAS: {{ias}} kt

      - Compressibility factor: {{compressibility}}


      What is the TAS?
    variables:
      - id: altitude
        label: Altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: ias
        label: IAS
        unit: kt
      - id: compressibility
        label: Compressibility factor
        unit: ""
    answer:
      formula: ias / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
        273.15)) * compressibility
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: ias / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
          273.15))
      - id: d2
        formula: ias * compressibility
      - id: d3
        formula: ias / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
          273.15)) / compressibility
      - id: d4
        formula: ias
    presets:
      - id: p1
        values:
          altitude: 30000
          oat: -45
          ias: 260
          compressibility: 0.96
      - id: p2
        values:
          altitude: 18000
          oat: -20
          ias: 220
          compressibility: 0.97
    explanation: >-
      At the same airspeed indication the TAS grows with altitude, because the
      air is thinner, and it also depends on the temperature. The flight
      computer gives the TAS from the pressure altitude, the OAT and the IAS. At
      this speed the compressibility of the air also has to be taken into
      account, which is done with the compressibility factor after the TAS has
      been read.


      **Solution**


      - Set the pressure altitude of {{altitude}} ft against the OAT of {{oat}}
      °C on the computer, and find the IAS of {{ias}} kt on the airspeed scale.

      - Read the TAS opposite it. This TAS has not yet been corrected for
      compressibility.

      - Multiply that TAS by the compressibility factor of {{compressibility}}.

      - The TAS is **{{answer}} kt**.


      **Why the other answers are wrong**


      - **{{d1}} kt**: the compressibility correction has been left out.

      - **{{d2}} kt**: the IAS has been multiplied by the compressibility
      factor, with no correction for altitude or temperature.

      - **{{d3}} kt**: the compressibility factor has been divided instead of
      multiplied.

      - **{{d4}} kt**: the IAS has been taken as the TAS.
