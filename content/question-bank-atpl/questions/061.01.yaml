- id: QJ2M1EF8Y
  docId: "061.01"
  relatedQuestions:
    - QFQRFKGMF
  externalIds:
    - ATPLQ-616472
    - AVEXAM-59064
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      Two points lie on the same parallel of latitude, both west of Greenwich,
      given:


      - Latitude of both points: {{lat_d}}° {{lat_m}}' N

      - Point A: {{a_d}}° {{a_m}}' W

      - Point B: {{b_d}}° {{b_m}}' W


      What is the distance flown along the parallel from A to B? Give the answer
      in NM.
    variables:
      - id: lat_d
        label: Latitude degrees
        unit: °
      - id: lat_m
        label: Latitude minutes
        unit: "'"
      - id: a_d
        label: Longitude A degrees (W)
        unit: °
      - id: a_m
        label: Longitude A minutes (W)
        unit: "'"
      - id: b_d
        label: Longitude B degrees (W)
        unit: °
      - id: b_m
        label: Longitude B minutes (W)
        unit: "'"
    answer:
      formula: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60 * cos(lat_d + lat_m / 60)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (a_d + a_m / 60 + b_d + b_m / 60) * 60 * cos(lat_d + lat_m / 60)
      - id: d2
        formula: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60
      - id: d3
        formula: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60 * sin(lat_d + lat_m / 60)
      - id: d4
        formula: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60 * cos(lat_d + lat_m / 60) *
          1.852
    presets:
      - id: p1
        values:
          lat_d: 12
          lat_m: 35
          a_d: 15
          a_m: 45
          b_d: 46
          b_m: 29
      - id: p2
        values:
          lat_d: 40
          lat_m: 20
          a_d: 60
          a_m: 0
          b_d: 30
          b_m: 15
      - id: p3
        values:
          lat_d: 55
          lat_m: 10
          a_d: 10
          a_m: 30
          b_d: 25
          b_m: 20
    explanation: >-
      Along a parallel of latitude, the distance is the difference in longitude,
      in minutes of arc, multiplied by the cosine of the latitude. Both points
      are west of Greenwich, so the two longitudes are subtracted from each
      other.


      **Solution**


      - Longitude difference: {{f: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60}} =
      {{n: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60}} minutes of arc

      - Distance: {{f: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60 * cos(lat_d +
      lat_m / 60)}} = {{n: abs(a_d + a_m / 60 - b_d - b_m / 60) * 60 * cos(lat_d
      + lat_m / 60)}} NM, which is **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the two longitudes instead of subtracting them

      - **{{d2}}**: forgets the cosine of the latitude, so it measures as if
      along the equator

      - **{{d3}}**: uses the sine of the latitude instead of the cosine

      - **{{d4}}**: multiplies by 1.852, which converts the answer to
      kilometres, not nautical miles
