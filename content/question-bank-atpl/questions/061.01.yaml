- id: QHYRSUFD
  docId: "061.01"
  relatedQuestions:
    - QHQLSJHF
  externalIds:
    - ATPLQ-614775
    - AVEXAM-18962
    - ATPLGS-628158
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: |-
      Determine the CAS, given the following information:

      - TAS: {{tas}} kt
      - Pressure altitude: {{alt}} ft
      - Temperature: ISA {{dev}} °C

      What is the CAS?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: alt
        label: pressure altitude
        unit: ft
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (288.15 - 0.002
        * alt + dev))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas
      - id: d2
        formula: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (288.15 - 0.002
          * alt - dev))
      - id: d3
        formula: tas / sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (288.15 - 0.002
          * alt + dev))
      - id: d4
        formula: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559)
    presets:
      - id: p1
        values:
          tas: 180
          alt: 12000
          dev: 20
      - id: p2
        values:
          tas: 200
          alt: 8000
          dev: 10
      - id: p3
        values:
          tas: 250
          alt: 20000
          dev: -5
    explanation: >-
      CAS is the TAS corrected for air density. The density falls with height
      and rises when the air is colder than the standard atmosphere (ISA). The
      ISA temperature falls by 2 °C per 1000 ft, and the ISA deviation is added
      to it.


      **Solution**


      {{f: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (288.15 -
      0.002 * alt + dev))}} = {{n: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559
      * 288.15 / (288.15 - 0.002 * alt + dev))}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the TAS is taken directly as the CAS, ignoring the
      density correction.

      - **{{d2}} kt**: the ISA deviation is applied with the wrong sign.

      - **{{d3}} kt**: the density ratio is inverted, so the TAS is divided
      instead of multiplied.

      - **{{d4}} kt**: the temperature correction is left out completely.
