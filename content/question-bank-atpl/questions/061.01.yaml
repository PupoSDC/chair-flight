- id: QWAT3TBUG
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619676
    - ATPLGS-626249
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Given:

      - Distance from A to B: {{dist}} NM
      - Groundspeed: {{gs}} kt
      - TAS: {{tas}} kt

      Calculate the flight time from A to B, rounded to the nearest whole hour.
    variables:
      - id: dist
        label: Distance from A to B
        unit: NM
      - id: gs
        label: Groundspeed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
    answer:
      formula: 60 * round(dist / gs)
      unit: minutes
      decimals: 0
      format: h 'h'
    distractors:
      - id: d1
        formula: 60 * round(dist / tas)
      - id: d2
        formula: 60 * round(dist / (gs - tas))
      - id: d3
        formula: 60 * round(2 * dist / gs)
      - id: d4
        formula: 60 * round(dist / (1.5 * gs))
    presets:
      - id: p1
        values:
          dist: 420
          gs: 140
          tas: 120
      - id: p2
        values:
          dist: 600
          gs: 150
          tas: 130
      - id: p3
        values:
          dist: 900
          gs: 150
          tas: 120
    explanation: >-
      The flight time is the distance divided by the groundspeed. The
      groundspeed already includes the effect of the wind, so the TAS is not
      needed for the time.


      **Solution**


      - Flight time: {{dist}} NM ÷ {{gs}} kt = {{= dist / gs}} h

      - Rounded to the nearest whole hour: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the TAS is used instead of the groundspeed, so the wind is
      ignored.

      - **{{d2}}**: the difference between groundspeed and TAS is used as the
      speed.

      - **{{d3}}**: the flight time is taken as twice the correct value.

      - **{{d4}}**: a speed one and a half times the groundspeed is used.
