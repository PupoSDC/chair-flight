- id: QYRUOEPY
  docId: "061.01"
  relatedQuestions:
    - QEFPPFITX
  externalIds:
    - ATPLQ-619549
    - AVEXAM-723
    - BGS-610580
    - ATPLGS-625503
    - ATPLGS-110538
    - BGS-610581
    - AVEXAM-59575
    - AVEXAM-90049
    - ATPLGS-127765
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
    - 061.01.05.05.01
  template:
    type: calculation
    question: >-
      An aircraft departs position A at 09:00 UTC on a flight to position B.


      - Distance A to B: {{dist}} NM

      - Planned average groundspeed: {{gs}} kt

      - At {{dist_fix}} NM along track from A it is {{lag}} min behind planned
      time


      Using the actual groundspeed experienced, what is the revised ETA at B?
    variables:
      - id: dist
        label: Distance A to B
        unit: NM
      - id: gs
        label: Planned groundspeed
        unit: kt
      - id: dist_fix
        label: Distance along track to the check point
        unit: NM
      - id: lag
        label: Time behind planned time
        unit: min
    answer:
      formula: 540 + round(dist * (dist_fix / gs * 60 + lag) / dist_fix)
      unit: minutes
      decimals: 0
      format: hh:mm 'UTC'
    distractors:
      - id: d1
        formula: 540 + round(dist / gs * 60)
      - id: d2
        formula: 540 + round(dist * (dist_fix / gs * 60 - lag) / dist_fix)
      - id: d3
        formula: 540 + round(dist / gs * 60 + lag)
    presets:
      - id: p1
        values:
          dist: 250
          gs: 115
          dist_fix: 75
          lag: 1.5
      - id: p2
        values:
          dist: 300
          gs: 120
          dist_fix: 100
          lag: 2
      - id: p3
        values:
          dist: 200
          gs: 100
          dist_fix: 60
          lag: 1
    explanation: >-
      The time flown to the check point at the actual rate is the planned time
      plus the delay. Scaling that rate up to the full distance gives the actual
      total time, and adding it to the departure time gives the ETA.


      **Solution**


      - Planned time to the check point: {{= dist_fix / gs * 60}} min

      - Actual time to the check point: {{= dist_fix / gs * 60}} + {{lag}} = {{=
      dist_fix / gs * 60 + lag}} min

      - Actual time for the whole route: {{= (dist_fix / gs * 60 + lag) * dist /
      dist_fix}} min

      - Revised ETA: 09:00 + that time = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the planned ETA, ignoring the delay.

      - **{{d2}}**: the delay is taken off instead of added.

      - **{{d3}}**: the delay is added at the end instead of scaled to the whole
      route.
