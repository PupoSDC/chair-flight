  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: An aircraft is flying at FL{{fl}} with a CAS of {{cas}} kt. Using the
      rule of thumb for TAS calculations, what is the approximate TAS?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: cas
        label: CAS
        unit: kt
    answer:
      formula: cas * (1 + 0.002 * fl)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas * (1 + 0.001 * fl)
      - id: d3
        formula: cas * (1 + 0.004 * fl)
      - id: d4
        formula: cas * (1 - 0.002 * fl)
    presets:
      - id: p1
        values:
          fl: 50
          cas: 185
      - id: p2
        values:
          fl: 200
          cas: 150
      - id: p3
        values:
          fl: 120
          cas: 210
    explanation: >-
      The rule of thumb adds 2% to the CAS for every 1000 ft of altitude.
      FL{{fl}} is {{= fl * 100}} ft, so the increase is {{= 0.2 * fl}}%.


      **Solution**


      {{f: cas * (1 + 0.002 * fl)}} = {{n: cas * (1 + 0.002 * fl)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: forgets the altitude correction altogether.

      - **{{d2}} kt**: uses 1% per 1000 ft, half the correct rate.

      - **{{d3}} kt**: uses 4% per 1000 ft, double the correct rate.

      - **{{d4}} kt**: subtracts the correction instead of adding it.
