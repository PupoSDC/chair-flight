- id: QSQUOQFY
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618824
    - AVEXAM-61284
    - AVEXAM-26776
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      An aircraft diverts to the alternate and is instructed by ATC to hold at
      minimum drag speed (VMD).


      - Fuel flow at VMD: {{ff}} kg/h

      - Final reserve fuel: {{frt}} min of flight at this fuel flow

      - Remaining usable fuel: {{fuel}} kg


      What is the remaining safe endurance, in minutes?
    variables:
      - id: fuel
        label: Remaining usable fuel
        unit: kg
      - id: ff
        label: Fuel flow at VMD
        unit: kg/h
      - id: frt
        label: Final reserve time
        unit: min
    answer:
      formula: (fuel - ff * frt / 60) / ff * 60
      unit: minutes
      decimals: 0
    distractors:
      - id: d1
        formula: fuel / ff * 60
      - id: d2
        formula: frt
      - id: d3
        formula: (fuel - ff * frt / 60) / ff
      - id: d4
        formula: (fuel - ff * frt / 60) / ff * 30
    presets:
      - id: p1
        values:
          fuel: 1640
          ff: 1290
          frt: 30
      - id: p2
        values:
          fuel: 2000
          ff: 1200
          frt: 30
      - id: p3
        values:
          fuel: 1500
          ff: 900
          frt: 20
    explanation: >-
      The final reserve fuel must remain at the alternate, so only the fuel
      above it can be used for holding. The usable fuel above the reserve is
      divided by the fuel flow to give hours, which is converted to minutes.


      **Solution**


      Final reserve fuel: {{f: ff * frt / 60}} = {{n: ff * frt / 60}} kg


      Fuel available for holding: {{f: fuel - ff * frt / 60}} = {{n: fuel - ff *
      frt / 60}} kg


      Endurance: {{f: (fuel - ff * frt / 60) / ff * 60}} = **{{answer}}
      minutes**


      **Why the other answers are wrong**


      - **{{d1}} minutes**: includes the final reserve fuel in the endurance.

      - **{{d2}} minutes**: gives only the final reserve time.

      - **{{d3}} minutes**: gives the result in hours and does not convert to
      minutes.

      - **{{d4}} minutes**: halves the result by using 30 instead of 60.
- id: QSSIADFS
  docId: "061.01"
  relatedQuestions:
    - QVUFAYTH
  externalIds:
    - ATPLQ-614192
  annexes: []
  learningObjectives:
    - 061.01.04.04.02
  template:
    type: calculation
    question: |-
      Given the following information, what is the air distance covered (NAM)?

      - Ground distance (NGM): {{gd}} NM
      - TAS: {{tas}} kt
      - GS: {{gs}} kt
    variables:
      - id: gd
        label: Ground distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: gs
        label: GS
        unit: kt
    answer:
      formula: gd * tas / gs
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: gd * gs / tas
      - id: d2
        formula: gd
      - id: d3
        formula: gd + tas - gs
      - id: d4
        formula: gd * tas / (gs + tas)
    presets:
      - id: p1
        values:
          gd: 180
          tas: 165
          gs: 150
      - id: p2
        values:
          gd: 300
          tas: 140
          gs: 150
      - id: p3
        values:
          gd: 420
          tas: 210
          gs: 180
    explanation: >-
      Air distance (NAM) is the distance flown through the air. It is found by
      scaling the ground distance with the ratio of TAS to GS: the aircraft
      flies at TAS for the time it takes to cover the ground distance at GS.


      **Solution**


      - Time for the ground distance: {{gd}} NM ÷ {{gs}} kt = {{= gd / gs}} h

      - Air distance: {{tas}} kt × {{= gd / gs}} h

      - {{f: gd * tas / gs}} = {{n: gd * tas / gs}} = **{{answer}} NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: TAS and GS were swapped in the ratio.

      - **{{d2}} NAM**: the ground distance was used unchanged.

      - **{{d3}} NAM**: the difference between TAS and GS was added instead of
      scaling the distance.

      - **{{d4}} NAM**: the sum of TAS and GS was used in the denominator
      instead of GS alone.
- id: QSSJLPVC
  docId: "061.01"
  relatedQuestions:
    - QBKXSUWA
  externalIds:
    - ATPLQ-619874
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: |-
      Calculate the Mach number, given the following:

      - TAS: {{tas}} kt
      - Outside air temperature: {{oat}} °C

      What is the Mach number?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: oat
        label: Outside air temperature
        unit: °C
    answer:
      formula: tas / (38.9 * sqrt(oat + 273.15))
      unit: M
      decimals: 2
    distractors:
      - id: d1
        formula: tas / (38.9 * sqrt(273.15 - oat))
      - id: d2
        formula: tas / 661.47
      - id: d3
        formula: tas / (38.9 * sqrt(288.15 + oat))
      - id: d4
        formula: 38.9 * sqrt(oat + 273.15) / tas
    presets:
      - id: p1
        values:
          tas: 455
          oat: -40
      - id: p2
        values:
          tas: 480
          oat: -20
      - id: p3
        values:
          tas: 420
          oat: -55
    explanation: >-
      The Mach number is the true airspeed divided by the speed of sound. The
      speed of sound depends on the absolute air temperature, which is the
      outside air temperature plus 273.15.


      **Solution**


      Air temperature = {{oat}} + 273.15 = {{= oat + 273.15}} K


      Speed of sound = 38.9 × √{{= oat + 273.15}} = {{= 38.9 * sqrt(oat +
      273.15)}} kt


      {{f: tas / (38.9 * sqrt(oat + 273.15))}} = {{n: tas / (38.9 * sqrt(oat +
      273.15))}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the sign of the temperature is reversed.

      - **{{d2}}**: the speed of sound at sea level is used, ignoring the
      temperature.

      - **{{d3}}**: 288.15 K (15 °C) is used instead of the actual air
      temperature.

      - **{{d4}}**: the ratio is inverted, giving the speed of sound divided by
      the true airspeed.
- id: QSSQZIDZ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614781
    - AVEXAM-64476
    - AVEXAM-73460
    - ATPLGS-127793
    - AVEXAM-43997
    - ATPLGS-124463
    - AVEXAM-44038
    - ATPLGS-124461
    - ATPLGS-110542
    - ATPLGS-124462
  annexes: []
  learningObjectives:
    - 061.01.06.02.01
  template:
    type: calculation
    question: >-
      An aircraft is flying according to the flight log:


      | Time | From | To | Dist (NM) | TRK/CRS (T) | HDG (T) | TAS (kt) | GS (kt) | W/V |

      | --- | --- | --- | --- | --- | --- | --- | --- | --- |

      | 00:23 | A | B | {{total}} | {{track}}° | {{hdg}}° | 120 | {{gs}} | 225/15 |


      After {{time}} minutes of flying with the planned TAS and TH the
      aircraft is {{xte}} NM North of the intended track and {{ahead}} NM
      ahead of the dead reckoning position.


      To reach destination B from this position the TH should be:
    variables:
      - id: track
        label: Planned track
        unit: °
      - id: hdg
        label: Planned true heading
        unit: °
      - id: gs
        label: Ground speed
        unit: kt
      - id: total
        label: Distance from A to B
        unit: NM
      - id: time
        label: Time flown
        unit: min
      - id: xte
        label: Distance north of the intended track
        unit: NM
      - id: ahead
        label: Distance ahead of the DR position
        unit: NM
    answer:
      formula: hdg + (60 * xte / (gs * time / 60 + ahead) + 60 * xte / (total - (gs * time / 60 + ahead)))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: track
      - id: d2
        formula: hdg - (60 * xte / (gs * time / 60 + ahead) + 60 * xte / (total - (gs * time / 60 + ahead)))
      - id: d3
        formula: track + (60 * xte / (gs * time / 60 + ahead) + 60 * xte / (total - (gs * time / 60 + ahead)))
    presets:
      - id: p1
        values:
          track: 90
          hdg: 95
          gs: 130
          total: 50
          time: 15
          xte: 3
          ahead: 2.5
      - id: p2
        values:
          track: 90
          hdg: 95
          gs: 130
          total: 60
          time: 18
          xte: 4
          ahead: 3
      - id: p3
        values:
          track: 90
          hdg: 95
          gs: 130
          total: 55
          time: 15
          xte: 5
          ahead: 2
    explanation: >-
      The aircraft is off track, so the heading changes by two angles from the
      planned heading: the track error, which stops the drift away from the
      track, and the closing angle, which brings the aircraft back to the track
      before the destination. Both are found with the 1 in 60 rule. The
      distance along the track is the distance flown at ground speed plus the
      distance ahead of the DR position.


      **Solution**


      Distance along the track: {{gs}} kt x {{time}} min / 60 +
      {{ahead}} NM = {{= gs * time / 60 + ahead}} NM


      Distance to go: {{total}} NM - {{= gs * time / 60 + ahead}} NM =
      {{= total - (gs * time / 60 + ahead)}} NM


      Track error: 60 x {{xte}} / {{= gs * time / 60 + ahead}} =
      {{= 60 * xte / (gs * time / 60 + ahead)}}°


      Closing angle: 60 x {{xte}} / {{= total - (gs * time / 60 + ahead)}} =
      {{= 60 * xte / (total - (gs * time / 60 + ahead))}}°


      The aircraft is north of a track flown towards the east, so the heading is changed
      towards the right: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the planned track, which ignores the wind drift and the
      closing angle

      - **{{d2}}°**: the heading is changed to the wrong side

      - **{{d3}}°**: the correction is applied to the track instead of to the
      planned heading
- id: QSWGOLNC
  docId: "061.01"
  relatedQuestions:
    - QVADWSSBF
  externalIds:
    - ATPLQ-616480
    - AVEXAM-47982
    - ATPLGS-625402
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      A VFR flight is navigated by dead reckoning. Flying from B to C, the
      position of the aircraft is fixed and a heading change is calculated with
      the 1 in 60 rule.


      Given:


      - Planned DR heading from B to C: {{hdg}}°

      - Cross track error: {{xte}} NM left of track

      - Along track distance from B: {{along}} NM


      What heading is required to regain track in approximately the same time it
      has taken from B to the fix?
    variables:
      - id: hdg
        label: Planned heading
        unit: °
      - id: xte
        label: Cross track error
        unit: NM
      - id: along
        label: Along track distance
        unit: NM
    answer:
      formula: hdg + 2 * xte * 60 / along
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: hdg - 2 * xte * 60 / along
      - id: d2
        formula: hdg + xte * 60 / along
      - id: d3
        formula: hdg + 2 * xte
      - id: d4
        formula: hdg + 4 * xte * 60 / along
    presets:
      - id: p1
        values:
          hdg: 313
          xte: 3
          along: 45
      - id: p2
        values:
          hdg: 250
          xte: 2
          along: 40
      - id: p3
        values:
          hdg: 180
          xte: 5
          along: 75
    explanation: >-
      The 1 in 60 rule gives the heading change needed to recover track: for
      every 1 NM off track, turn about 1° for every 60 NM flown. Turning twice
      that angle brings the aircraft back onto track in the same time it took to
      reach the fix.


      **Solution**


      - Heading change = 2 × {{xte}} NM × 60 / {{along}} NM = {{= 2 * xte * 60 /
      along}}°

      - Heading to fly = {{hdg}}° + {{= 2 * xte * 60 / along}}° =
      **{{answer}}°**


      The aircraft is left of track, so the turn is to the right.


      **Why the other answers are wrong**


      - **{{d1}}°**: turns the wrong way, to the left, which takes the aircraft
      further from track.

      - **{{d2}}°**: uses half the correct turn, because the doubling is
      forgotten.

      - **{{d3}}°**: adds the cross track error in degrees and ignores the
      distance flown.

      - **{{d4}}°**: applies the correction twice over.
