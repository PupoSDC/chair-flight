    - ATPLGS-110496
    - BGS-610539
  annexes: []
  learningObjectives:
    - 061.01.08.03.03
  template:
    type: calculation
    question: >-
      An aircraft departs from an airport and must pass a waypoint at a set
      altitude:


      - Airport elevation: {{elev}} ft (QNH 1013 hPa)

      - Distance to the waypoint: {{dist}} NM

      - Altitude to pass the waypoint: {{alt}} ft

      - Groundspeed: {{gs}} kt


      What is the minimum rate of climb required, in ft/min?
    variables:
      - id: elev
        label: Airport elevation
        unit: ft
      - id: dist
        label: Distance to the waypoint
        unit: NM
      - id: alt
        label: Altitude to pass the waypoint
        unit: ft
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: round((alt - elev) * gs / (60 * dist) / 10) * 10
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (alt - elev) * gs / dist
      - id: d2
        formula: (alt - elev) * dist / (60 * gs)
      - id: d3
        formula: alt * gs / (60 * dist)
      - id: d4
        formula: (alt - elev) * gs * 1.852 / (60 * dist)
    presets:
      - id: p1
        values:
          elev: 2000
          dist: 10
          alt: 7500
          gs: 100
      - id: p2
        values:
          elev: 500
          dist: 15
          alt: 4500
          gs: 120
      - id: p3
        values:
          elev: 1000
          dist: 25
          alt: 6000
          gs: 90
    explanation: >-
      With the QNH set to 1013 hPa, the altimeter reads the height above sea
      level at the airport, so the airport elevation is the starting altitude.
      The height to gain is divided by the time needed to reach the waypoint,
      which is the distance divided by the groundspeed. The result is rounded to
      the nearest 10 ft/min.


      **Solution**


      - Height to gain: {{alt}} ft - {{elev}} ft = {{= alt - elev}} ft

      - Time to the waypoint: {{dist}} NM ÷ {{gs}} kt = {{= dist / gs * 60}} min

      - {{f: round((alt - elev) * gs / (60 * dist) / 10) * 10}} = {{n:
      round((alt - elev) * gs / (60 * dist) / 10) * 10}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the time was not converted from hours to minutes, so
      the rate is 60 times too large.

      - **{{d2}} ft/min**: the ratio is inverted, dividing the distance by the
      groundspeed instead.

      - **{{d3}} ft/min**: the airport elevation was ignored, so the climb was
      measured from sea level.

      - **{{d4}} ft/min**: the groundspeed was converted to km/h and mixed with
      a distance in NM.
