- id: QFKTQEUZ
  docId: "061.01"
  relatedQuestions:
    - QBGZBDBD
    - QTRROSNS
  externalIds:
    - ATPLQ-618590
    - ATPLGS-627953
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: An aircraft is on a {{angle}}° ILS glide slope with a ground speed of
      {{gs}} kt. What is the approximate required rate of descent, in ft/min?
      Round the answer to the nearest 5 ft/min.
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: angle
        label: Glide slope angle
        unit: °
    answer:
      formula: round(5 * gs * angle / 3 / 5) * 5
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: 5 * gs
      - id: d2
        formula: gs * angle / 3
      - id: d3
        formula: 5 * gs * angle
      - id: d4
        formula: gs * angle
    presets:
      - id: p1
        values:
          gs: 150
          angle: 3.5
      - id: p2
        values:
          gs: 130
          angle: 2.5
    explanation: >-
      For a glide slope, the rate of descent in ft/min is about 5 times the
      groundspeed for a 3 degree slope, and it scales in proportion to the
      angle. So the rate of descent is 5 × groundspeed × angle ÷ 3. The result
      is rounded to the nearest 5 ft/min.


      **Solution**


      - Rate of descent: {{f: 5 * gs * angle / 3}} = {{n: 5 * gs * angle / 3}} ≈
      **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the glide slope angle is ignored; the factor of 5
      only applies to a 3 degree slope.

      - **{{d2}} ft/min**: the factor of 5 is forgotten, so the result is about
      five times too small.

      - **{{d3}} ft/min**: the division by 3 is forgotten, so the result is
      about three times too large.

      - **{{d4}} ft/min**: both the factor of 5 and the division by 3 are
      missing.
- id: QFLXXVJP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613780
    - ATPLGS-110505
    - BGS-610533
    - BGS-610540
    - AVEXAM-33256
    - ATPLGS-124281
    - AVEXAM-39210
    - ATPLGS-124280
  annexes: []
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: >-
      An aircraft at FL{{fl_from}} is required to descend to cross a DME
      facility at FL{{fl_to}}.


      The rate of descent is {{rod}} ft/min and the mean ground speed for the
      descent is {{gs}} kt.


      The minimum range from the DME at which the descent should start is:
    variables:
      - id: fl_from
        label: Initial flight level
        unit: FL
      - id: fl_to
        label: Final flight level
        unit: FL
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Ground speed
        unit: kt
    answer:
      formula: gs / 60 * (fl_from - fl_to) * 100 / rod
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: gs / 60 * fl_from * 100 / rod
      - id: d2
        formula: gs / 60 * fl_to * 100 / rod
      - id: d3
        formula: (fl_from - fl_to) * 100 / 300
      - id: d4
        formula: gs * (fl_from - fl_to) * 100 / rod
    presets:
      - id: p1
        values:
          fl_from: 350
          fl_to: 80
          rod: 1800
          gs: 276
      - id: p2
        values:
          fl_from: 390
          fl_to: 100
          rod: 2000
          gs: 288
      - id: p3
        values:
          fl_from: 310
          fl_to: 60
          rod: 1500
          gs: 252
    explanation: >-
      The descent time is the height to lose divided by the rate of descent. The
      distance is the ground speed (in NM per minute) times that time.


      **Solution**


      Height to lose = {{= (fl_from - fl_to) * 100}} ft

      Time = {{= (fl_from - fl_to) * 100 / rod}} min


      {{f: gs / 60 * (fl_from - fl_to) * 100 / rod}} = {{n: gs / 60 * (fl_from -
      fl_to) * 100 / rod}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the full initial flight level was used as height to lose.

      - **{{d2}} NM**: only the final flight level was used as height to lose.

      - **{{d3}} NM**: a 3-degree path (300 ft per NM) was assumed, ignoring
      rate of descent and ground speed.

      - **{{d4}} NM**: the ground speed was not converted to NM per minute.
