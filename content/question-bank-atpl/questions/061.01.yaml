  template:
    type: calculation
    question: |-
      Given the following information, calculate the cross-wind component:

      - Runway direction: {{rwy}}° (M)
      - Surface wind: {{wind_dir}}° (M) / {{wind_speed}} kt
    variables:
      - id: rwy
        label: Runway direction
        unit: °
      - id: wind_dir
        label: Wind direction
        unit: °
      - id: wind_speed
        label: Wind speed
        unit: kt
    answer:
      formula: abs(wind_speed * sin(wind_dir - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: wind_speed
      - id: d2
        formula: wind_speed - abs(wind_speed * sin(wind_dir - rwy))
      - id: d3
        formula: wind_speed * abs(wind_dir - rwy) / 90
    presets:
      - id: p1
        values:
          rwy: 305
          wind_dir: 260
          wind_speed: 30
      - id: p2
        values:
          rwy: 210
          wind_dir: 230
          wind_speed: 30
      - id: p3
        values:
          rwy: 300
          wind_dir: 240
          wind_speed: 35
      - id: p4
        values:
          rwy: 227
          wind_dir: 180
          wind_speed: 30
    explanation: >-
      The crosswind component is the part of the wind blowing across the runway.
      It equals the wind speed multiplied by the sine of the angle between the
      wind direction and the runway direction (both must be in the same
      reference, here magnetic).


      **Solution**


      Angle = {{= abs(wind_dir - rwy)}}°


      {{f: wind_speed * sin(wind_dir - rwy)}} = {{n: wind_speed * sin(wind_dir -
      rwy)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the whole wind speed, as if the wind blew exactly across
      the runway.

      - **{{d2}} kt**: the crosswind subtracted from the wind speed instead of
      being used directly.

      - **{{d3}} kt**: the angle scaled linearly (angle/90) instead of using the
      sine.
