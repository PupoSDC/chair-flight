- id: QCUWSYZC
  docId: 061.01.08.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-615557
    - BGS-611614
    - AVEXAM-85756
    - AVEXAM-65887
    - ATPLQ-611307
    - AVEXAM-18962
    - AVEXAM-66029
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: |-
      An aircraft is flying at the following conditions:

      - Altitude: {{altitude}} ft
      - OAT: {{oat}} °C
      - CAS: {{cas}} kt

      What is the TAS?
    variables:
      - id: altitude
        label: Altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: cas
        label: CAS
        unit: kt
    answer:
      formula: cas / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
        273.15))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas * sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
          273.15))
      - id: d3
        formula: cas / ((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 / (oat +
          273.15))
      - id: d4
        formula: cas / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588)
    presets:
      - id: p1
        values:
          altitude: 6000
          oat: 5
          cas: 115
      - id: p2
        values:
          altitude: 18000
          oat: -30.7
          cas: 180
      - id: p3
        values:
          altitude: 9000
          oat: -10
          cas: 160
    explanation: >-
      The TAS is the CAS corrected for air density. The thinner the air, the
      higher the TAS for the same CAS, and warmer air is also thinner. The
      flight computer applies both corrections in one setting, using the
      pressure altitude and the OAT.


      **Solution**


      - Set the pressure altitude of {{altitude}} ft against the outside air
      temperature of {{oat}} °C on the computer.

      - Find the CAS of {{cas}} kt on the airspeed scale and read the TAS
      opposite it.

      - The TAS is **{{answer}} kt**.


      **Why the other answers are wrong**


      - **{{d1}} kt**: the CAS has been taken as the TAS, so the correction for
      the thin air is missing.

      - **{{d2}} kt**: the density correction has been applied in the wrong
      direction, so the TAS is too low.

      - **{{d3}} kt**: the density has been used without its square root, so the
      correction is far too large.

      - **{{d4}} kt**: the OAT has been ignored, so the effect of temperature on
      the air density is missing.
