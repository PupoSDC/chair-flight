          lon1: -6.25
          lat2: 54.5
          lon2: -5
        answer: 152°, 83 NM
        wrongAnswers:
          - 332°, 144 NM
          - 144°, 144 NM
          - 148°, 83 NM
        explanation: >-
          The track is the direction from point A to point B, measured clockwise
          from magnetic north. It is the true track corrected for magnetic
          variation, which is read from the chart. The distance is the length of
          the straight line between the two points, found from the latitude and
          longitude of both points.


          **Solution**


          The aircraft lies south-east of the DME ISY. The true track from ISY
          to the aircraft is about 149°, and the magnetic track after applying
          the variation read from the chart is 152°. The distance is about 83
          NM.


          **Why the other answers are wrong**


          - **332°, 144 NM**: the reciprocal track and a distance that is far
          too long.

          - **144°, 144 NM**: a track that ignores the variation, with a
          distance that is far too long.

          - **148°, 83 NM**: the distance is right, but the variation is not
          applied correctly.
