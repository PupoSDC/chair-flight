- id: QFXBMOMS
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611275
    - ATPLGS-627942
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: Determine the approximate gradient required for an aircraft to descend
      {{alt}} ft over a ground distance of {{dist}} NM.
    variables:
      - id: alt
        label: Altitude to lose
        unit: ft
      - id: dist
        label: Ground distance
        unit: NM
    answer:
      formula: 100 * alt / (dist * 6076)
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: 100 * alt / (dist * 1852)
      - id: d2
        formula: atan(alt / (dist * 6076))
      - id: d3
        formula: 100 * alt * 0.3048 / (dist * 6076)
    presets:
      - id: p1
        values:
          alt: 30000
          dist: 100
      - id: p2
        values:
          alt: 24000
          dist: 120
      - id: p3
        values:
          alt: 36000
          dist: 150
    explanation: >-
      The descent gradient in percent is the height lost divided by the ground
      distance covered (same units), times 100. 1 NM is about 6076 ft.


      **Solution**


      {{f: 100 * alt / (dist * 6076)}} = {{n: 100 * alt / (dist * 6076)}} =
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: 1 NM was taken as 1852 ft (that is metres).

      - **{{d2}} %**: the angle in degrees was given instead of the gradient in
      percent.

      - **{{d3}} %**: the altitude was converted to metres while the distance
      was kept in feet.
- id: QFXHXUXQ
  docId: "061.01"
  relatedQuestions:
    - QJUTNHDY
  externalIds:
    - ATPLQ-613872
    - AVEXAM-64456
    - BGS-611677
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      An aircraft departs point A, intending to fly direct to point B,
      {{dist_b}} NM away. After flying {{along}} NM, the aircraft is {{off}} NM
      off track.


      Using the 1 in 60 rule, by how many degrees must the heading be changed to
      fly parallel to the intended track? Round down to the whole degree.
    variables:
      - id: dist_b
        label: Distance to B
        unit: NM
      - id: along
        label: Distance flown along track
        unit: NM
      - id: off
        label: Offset from track
        unit: NM
    answer:
      formula: floor(off * 60 / along)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: off
      - id: d2
        formula: 2 * off * 60 / along
      - id: d3
        formula: 2 * off
      - id: d4
        formula: off * 60 / dist_b
    presets:
      - id: p1
        values:
          dist_b: 160
          along: 80
          off: 8
      - id: p2
        values:
          dist_b: 200
          along: 100
          off: 12
      - id: p3
        values:
          dist_b: 150
          along: 70
          off: 10
    explanation: >-
      To fly parallel to the intended track, the heading must be corrected by
      the angle the aircraft has drifted off. With the 1 in 60 rule, the
      correction is one degree of heading for every NM off track in each 60 NM
      flown. The distance to B does not change the correction.


      **Solution**


      - Offset {{off}} NM in {{along}} NM flown: {{= off * 60 / along}}° before
      rounding

      - Heading change, rounded down to the whole degree: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the offset in NM as if it were degrees.

      - **{{d2}}°**: doubles the correction.

      - **{{d3}}°**: doubles the offset instead of working out the angle over
      the distance flown.

      - **{{d4}}°**: divides the offset by the total distance to B instead of
      the distance flown.
- id: QGBMNBOR
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611561
    - AVEXAM-48309
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
  template:
    type: calculation
    question: |-
      Given the following:

      - Magnetic heading: {{hdg}}°
      - Magnetic variation: {{var}}°W
      - Drift angle: {{drift}}° right

      What is the true track?

      Give the true track in degrees.
    variables:
      - id: hdg
        label: Magnetic heading
        unit: °
      - id: var
        label: Westerly variation
        unit: °
      - id: drift
        label: Drift (right)
        unit: °
    answer:
      formula: (hdg - var + drift) - 360 * floor((hdg - var + drift) / 360)
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: (hdg + var + drift) - 360 * floor((hdg + var + drift) / 360)
      - id: d2
        formula: (hdg - var - drift) - 360 * floor((hdg - var - drift) / 360)
      - id: d3
        formula: (hdg + drift) - 360 * floor((hdg + drift) / 360)
      - id: d4
        formula: (hdg - var) - 360 * floor((hdg - var) / 360)
    presets:
      - id: p1
        values:
          hdg: 60
          var: 8
          drift: 4
      - id: p2
        values:
          hdg: 210
          var: 5
          drift: 6
      - id: p3
        values:
          hdg: 350
          var: 12
          drift: 3
    explanation: >-
      A westerly variation means the magnetic heading is greater than the true
      heading, so the true heading is the magnetic heading minus the westerly
      variation. A drift to the right moves the track to the right of the
      heading, so the drift is added.


      **Solution**


      True heading: {{f: hdg - var}} = {{n: hdg - var}}


      True track: {{f: hdg - var + drift}} = {{n: hdg - var + drift}} =
      **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the westerly variation instead of subtracting it.

      - **{{d2}}°**: subtracts the drift instead of adding it, and the variation
      as well.

      - **{{d3}}°**: forgets the variation.

      - **{{d4}}°**: stops at the true heading and forgets the drift.
