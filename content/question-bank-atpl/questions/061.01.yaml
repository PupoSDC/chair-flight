- id: QLPVVEQT
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617950
    - AVEXAM-83481
    - AVEXAM-5368
    - ATPLQ-613368
    - AVEXAM-18962
    - ATPLGS-627943
    - AVEXAM-66029
    - AVEXAM-71242
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: |-
      Given the following information, determine the true airspeed (TAS):

      - Altitude: {{alt}} ft
      - OAT: {{oat}}°C
      - CAS: {{cas}} kt
    variables:
      - id: alt
        label: Altitude
        unit: ft
      - id: oat
        label: Outside air temperature
        unit: °C
      - id: cas
        label: CAS
        unit: kt
    answer:
      formula: cas / sqrt((1 - 0.0000068753 * alt) ^ 5.25588 * 288.15 / (oat + 273.15))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas * sqrt((1 - 0.0000068753 * alt) ^ 5.25588 * 288.15 / (oat +
          273.15))
      - id: d3
        formula: cas / sqrt((1 - 0.0000068753 * alt) ^ 5.25588 * 288.15 / (oat +
          293.15))
      - id: d4
        formula: cas * (1 + 0.02 * alt / 1000)
    presets:
      - id: p1
        values:
          alt: 1500
          oat: -15
          cas: 120
      - id: p2
        values:
          alt: 7000
          oat: -15
          cas: 140
      - id: p3
        values:
          alt: 4000
          oat: 5
          cas: 110
    explanation: >-
      The air data computer corrects CAS for air density. Air becomes thinner
      with altitude, and warmer air is also thinner than cold air. For the same
      CAS, the TAS is therefore higher at a higher altitude and in warmer air.


      **Solution**


      Set the pressure altitude of {{alt}} ft against the outside air
      temperature of {{oat}}°C on the computer, read the TAS opposite the CAS of
      {{cas}} kt: **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the CAS as the TAS, with no correction for altitude.

      - **{{d2}} kt**: applies the density correction the wrong way round, so
      the TAS comes out lower than the CAS.

      - **{{d3}} kt**: uses an outside air temperature 20 °C warmer than the
      actual one.

      - **{{d4}} kt**: uses the rule of thumb of 2% per 1000 ft, which is only
      an approximation at low temperature.
- id: QLRAGWD9U
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618096
    - BGS-610156
    - AVEXAM-54070
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      An aircraft at {{lat}}° N flies due south at a groundspeed of {{speed}}
      km/h for {{hours}} hours to position B. One degree of latitude is 60 NM,
      which is 111.12 km.


      What is the latitude of position B in degrees south of the equator? A
      negative value means north of the equator.
    variables:
      - id: lat
        label: Latitude at the start
        unit: °
      - id: speed
        label: Groundspeed
        unit: km/h
      - id: hours
        label: Flight time
        unit: h
    answer:
      formula: speed * hours / 111.12 - lat
      unit: °S
      decimals: 0
    distractors:
      - id: d1
        formula: speed * hours / 111.12
      - id: d2
        formula: lat
      - id: d3
        formula: speed * hours / 111.12 + lat
      - id: d4
        formula: speed * hours / 100 - lat
    presets:
      - id: p1
        values:
          lat: 10
          speed: 444
          hours: 3
      - id: p2
        values:
          lat: 5
          speed: 600
          hours: 2
      - id: p3
        values:
          lat: 8
          speed: 500
          hours: 3
    explanation: >-
      Latitude is measured from the equator. Flying due south reduces the
      latitude, so the distance flown is converted into degrees of latitude and
      taken away from the starting latitude. One degree of latitude is 111.12
      km.


      **Solution**


      - Distance flown: {{speed}} km/h × {{hours}} h = {{= speed * hours}} km

      - Degrees of latitude covered: {{= speed * hours / 111.12}}°

      - Latitude of B, measured south: {{f: speed * hours / 111.12 - lat}} =
      {{n: speed * hours / 111.12 - lat}} = **{{answer}}° S**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets the starting latitude

      - **{{d2}}°**: does not fly at all, so the latitude stays the same

      - **{{d3}}°**: adds the distance to the starting latitude instead of
      subtracting it

      - **{{d4}}°**: uses 100 km per degree instead of 111.12 km
- id: QLSFZEEG
  docId: "061.01"
  relatedQuestions:
    - QMYQ6K9R7
  externalIds:
    - ATPLQ-616191
