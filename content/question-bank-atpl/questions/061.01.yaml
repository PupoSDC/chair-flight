- id: QTQLUFG6K
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617292
    - AVEXAM-94542
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      An aircraft's true heading is {{th}}° and the variation is {{var}}° (a
      negative value is westerly, a positive value is easterly).


      What is the magnetic heading?
    variables:
      - id: th
        label: True heading
        unit: °
      - id: var
        label: Variation (east positive, west negative)
        unit: °
    answer:
      formula: th - var
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: th + var
      - id: d2
        formula: th
      - id: d3
        formula: th - 2 * var
      - id: d4
        formula: th + 2 * var
    presets:
      - id: p1
        values:
          th: 178
          var: -4
      - id: p2
        values:
          th: 62
          var: 9
      - id: p3
        values:
          th: 305
          var: -12
    explanation: >-
      A westerly variation is added to the true heading to give the magnetic
      heading, and an easterly variation is subtracted. Here the variation is
      minus, so it is westerly and is added.


      **Solution**


      {{f: th - var}} = {{n: th - var}} = **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°**: subtracts the westerly variation instead of adding it.

      - **{{d2}}°**: ignores the variation.

      - **{{d3}}°**: doubles the variation.

      - **{{d4}}°**: applies the variation twice, with the wrong sign.
