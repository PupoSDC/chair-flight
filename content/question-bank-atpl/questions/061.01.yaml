  relatedQuestions: []
  externalIds:
    - ATPLQ-613807
    - BGS-611438
  annexes: []
  learningObjectives:
    - 061.01.04.04.02
  template:
    type: calculation
    question: >-
      The ground distance that needs to be covered is {{gd}} NM. Given the
      following speeds, what is the respective air distance?


      - TAS: {{tas}} kt

      - IAS: {{ias}} kt

      - GS: {{gs}} kt
    variables:
      - id: gd
        label: ground distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: ias
        label: IAS
        unit: kt
      - id: gs
        label: GS
        unit: kt
    answer:
      formula: gd * tas / gs
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: gd * ias / gs
      - id: d2
        formula: gd * gs / tas
      - id: d3
        formula: gd * tas / ias
    presets:
      - id: p1
        values:
          gd: 120
          tas: 165
          ias: 140
          gs: 150
      - id: p2
        values:
          gd: 200
          tas: 150
          ias: 130
          gs: 135
      - id: p3
        values:
          gd: 90
          tas: 120
          ias: 105
          gs: 110
    explanation: >-
      Air distance (NAM) is the distance flown relative to the air mass. The
      flight time is ground distance divided by GS, and the air distance is TAS
      times that time, so the ground distance is scaled by TAS/GS. IAS plays no
      role.


      **Solution**


      {{f: gd * tas / gs}} = {{n: gd * tas / gs}} = **{{answer}} NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: IAS is used instead of TAS.

      - **{{d2}} NAM**: the ratio is inverted (GS/TAS).

      - **{{d3}} NAM**: the ground distance is divided by IAS instead of GS.
