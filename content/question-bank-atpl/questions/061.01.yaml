- id: QQPZSOBK
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617714
    - AVEXAM-70540
    - ATPLGS-625509
    - ATPLQ-617853
    - ATPLQ-615477
    - ATPLGS-127787
    - AVEXAM-25581
  annexes: []
  learningObjectives:
    - 061.01.03.01.07
  template:
    type: calculation
    question: >-
      Given the following information, calculate the compass heading. Use a
      positive drift for drift left and a negative drift for drift right, a
      positive variation for west and a negative variation for east, and a
      positive deviation for east and a negative deviation for west.


      - True track: {{tt}}°

      - Drift: {{drift}}°

      - Variation: {{var}}°

      - Deviation: {{dev}}°


      What is the compass heading, in degrees?
    variables:
      - id: tt
        label: True track
        unit: °
      - id: drift
        label: Drift
        unit: °
      - id: var
        label: Variation
        unit: °
      - id: dev
        label: Deviation
        unit: °
    answer:
      formula: (tt + drift + var - dev) - 360 * floor((tt + drift + var - dev) / 360)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: (tt + drift - dev) - 360 * floor((tt + drift - dev) / 360)
      - id: d2
        formula: (tt + drift + var + dev) - 360 * floor((tt + drift + var + dev) / 360)
      - id: d3
        formula: (tt - drift + var - dev) - 360 * floor((tt - drift + var - dev) / 360)
      - id: d4
        formula: (tt + drift - var - dev) - 360 * floor((tt + drift - var - dev) / 360)
    presets:
      - id: p1
        values:
          tt: 348
          drift: 17
          var: 32
          dev: 4
      - id: p2
        values:
          tt: 352
          drift: -10
          var: 11
          dev: -5
      - id: p3
        values:
          tt: 300
          drift: -8
          var: 10
          dev: -4
    explanation: >-
      The compass heading is found by working from the true track. The drift is
      applied first to give the true heading, the variation then gives the
      magnetic heading, and the deviation finally gives the compass heading.


      **Solution**


      True heading = true track + drift = {{tt}}° + {{drift}}° = {{= tt +
      drift}}°


      Magnetic heading = true heading + variation = {{= tt + drift}}° + {{var}}°
      = {{= tt + drift + var}}°


      Compass heading = magnetic heading − deviation = {{= tt + drift + var -
      dev}}°, brought within 0° to 360° gives **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets the variation.

      - **{{d2}}°**: applies the deviation with the wrong sign.

      - **{{d3}}°**: applies the drift with the wrong sign.

      - **{{d4}}°**: applies the variation with the wrong sign.
- id: QQRJDPEI
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616046
    - ATPLGS-625435
    - AVEXAM-14665
    - AVEXAM-51856
    - BGS-610448
  annexes: []
  learningObjectives:
    - 061.01.05.04.01
  template:
    type: calculation
    question: |-
      Calculate the maximum allowable wind speed for the following situation.

      - Maximum allowable crosswind component: {{xw}} kt
      - Runway centreline direction: {{rwy}}°M
      - Wind direction: {{wdir}}°M

      What is the maximum allowable wind speed, in kt?
    variables:
      - id: xw
        label: maximum allowable crosswind
        unit: kt
      - id: rwy
        label: runway centreline direction
        unit: °M
      - id: wdir
        label: wind direction
        unit: °M
    answer:
      formula: xw / sin(abs(wdir - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: xw / cos(abs(wdir - rwy))
      - id: d2
        formula: xw * cos(abs(wdir - rwy))
      - id: d3
        formula: xw / tan(abs(wdir - rwy))
      - id: d4
        formula: xw * sin(abs(wdir - rwy))
    presets:
      - id: p1
        values:
          xw: 20
          rwy: 63
          wdir: 100
      - id: p2
        values:
          xw: 15
          rwy: 270
          wdir: 300
      - id: p3
        values:
          xw: 25
          rwy: 120
          wdir: 180
    explanation: >-
      The crosswind component is the part of the wind that blows across the
      runway. It equals the wind speed multiplied by the sine of the angle
      between the wind direction and the runway. Turning this round gives the
      strongest wind that keeps the crosswind within the limit: divide the
      crosswind limit by the sine of the angle.


      **Solution**


      - Angle between wind and runway = {{= abs(wdir - rwy)}}°

      - {{f: xw / sin(abs(wdir - rwy))}} = {{n: xw / sin(abs(wdir - rwy))}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the cosine was used instead of the sine.

      - **{{d2}} kt**: the crosswind limit was multiplied by the cosine instead
      of divided by the sine.

      - **{{d3}} kt**: the tangent was used instead of the sine.

      - **{{d4}} kt**: the crosswind limit was multiplied by the sine instead of
      divided by it.
