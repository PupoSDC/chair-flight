- id: Q98VPGQP4
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611745
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: |-
      An aircraft flies along a parallel of latitude from Point A to Point B:

      - Latitude: {{lat}}°N
      - Point A: {{lon_a}}°{{lon_a_min}}'W
      - Point B: {{lon_b}}°{{lon_b_min}}'W

      Determine the approximate ground distance covered, in km.
    variables:
      - id: lat
        label: Latitude
        unit: °
      - id: lon_a
        label: Longitude of Point A (degrees)
        unit: °
      - id: lon_a_min
        label: Longitude of Point A (minutes)
        unit: "'"
      - id: lon_b
        label: Longitude of Point B (degrees)
        unit: °
      - id: lon_b_min
        label: Longitude of Point B (minutes)
        unit: "'"
    answer:
      formula: ((lon_b + lon_b_min / 60) - (lon_a + lon_a_min / 60)) * 60 * cos(lat) *
        1.852
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: ((lon_b + lon_b_min / 60) - (lon_a + lon_a_min / 60)) * 60 * cos(lat)
      - id: d2
        formula: ((lon_b + lon_b_min / 60) - (lon_a + lon_a_min / 60)) * 60 * 1.852
      - id: d3
        formula: ((lon_b + lon_b_min / 60) - (lon_a + lon_a_min / 60)) * 60 * cos(lat) *
          1.609
      - id: d4
        formula: ((lon_b + lon_b_min / 60) - (lon_a + lon_a_min / 60)) * 60 * cos(lat) *
          1.852 / 2
    presets:
      - id: p1
        values:
          lat: 50
          lon_a: 8
          lon_a_min: 30
          lon_b: 134
          lon_b_min: 36
      - id: p2
        values:
          lat: 60
          lon_a: 10
          lon_a_min: 0
          lon_b: 40
          lon_b_min: 0
      - id: p3
        values:
          lat: 35
          lon_a: 20
          lon_a_min: 15
          lon_b: 60
          lon_b_min: 45
    explanation: >-
      Along a parallel, the distance on the Earth is the difference in longitude
      in minutes multiplied by the cosine of the latitude, because a parallel is
      shorter than the Equator. One minute of longitude at the Equator is 1 NM,
      and 1 NM is 1.852 km.


      **Solution**


      - Difference in longitude: {{= (lon_b + lon_b_min / 60) - (lon_a +
      lon_a_min / 60)}}°

      - Distance in NM: {{= (lon_b + lon_b_min / 60) - (lon_a + lon_a_min /
      60)}} × 60 × cos {{lat}}° = {{= ((lon_b + lon_b_min / 60) - (lon_a +
      lon_a_min / 60)) * 60 * cos(lat)}} NM

      - Distance in km: {{f: ((lon_b + lon_b_min / 60) - (lon_a + lon_a_min /
      60)) * 60 * cos(lat) * 1.852}} = {{n: ((lon_b + lon_b_min / 60) - (lon_a +
      lon_a_min / 60)) * 60 * cos(lat) * 1.852}} = **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: the distance in nautical miles was given the km unit
      without conversion.

      - **{{d2}} km**: the latitude was ignored, so the distance along the
      Equator was used.

      - **{{d3}} km**: the statute mile conversion (1.609 km) was used instead
      of the nautical mile (1.852 km).

      - **{{d4}} km**: the result was halved.
