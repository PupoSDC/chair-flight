- id: QZWENX4LC
  docId: "061.01"
  relatedQuestions:
    - QL3QEE6YK
  externalIds:
    - ATPLQ-618630
    - AVEXAM-80052
    - BGS-611434
  annexes: []
  learningObjectives:
    - 061.02.02.01.08
  template:
    type: calculation
    question: >-
      An aircraft takes two relative bearings from the same landmark.


      - First relative bearing: {{rb1}}°

      - Time between the bearings: {{t}} min

      - Second relative bearing: {{rb2}}°

      - TAS: {{tas}} kt

      - Tailwind component: {{tw}} kt


      Assume no drift. What is the distance to the landmark at the time of the
      second bearing?
    variables:
      - id: rb1
        label: First relative bearing
        unit: °
      - id: rb2
        label: Second relative bearing
        unit: °
      - id: t
        label: Time between bearings
        unit: min
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: (tas + tw) * t / 60 * sin(rb1) / sin(rb2 - rb1)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: tas * t / 60 * sin(rb1) / sin(rb2 - rb1)
      - id: d2
        formula: (tas - tw) * t / 60 * sin(rb1) / sin(rb2 - rb1)
      - id: d3
        formula: (tas + tw) * t * sin(rb1) / sin(rb2 - rb1)
      - id: d4
        formula: (tas + tw) * t / 60 * sin(rb1) / sin(rb2 - rb1) * sqrt(2)
    presets:
      - id: p1
        values:
          rb1: 315
          rb2: 270
          t: 3
          tas: 90
          tw: 30
      - id: p2
        values:
          rb1: 315
          rb2: 270
          t: 6
          tas: 120
          tw: 40
    explanation: >-
      With a steady wind along the track, the ground speed is the TAS plus the
      tailwind. The ground distance flown between the two bearings and the two
      bearing angles then give the distance from the landmark with the sine
      rule.


      **Solution**


      Ground speed: {{f: tas + tw}} = {{n: tas + tw}} kt


      Distance flown between the bearings: {{= (tas + tw) * t / 60}} NM


      Distance at the second bearing: {{f: (tas + tw) * t / 60 * sin(rb1) /
      sin(rb2 - rb1)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: forgets the tailwind and uses the TAS only.

      - **{{d2}} NM**: subtracts the tailwind instead of adding it.

      - **{{d3}} NM**: forgets to convert minutes to hours.

      - **{{d4}} NM**: applies an extra square root of 2 factor that is not part
      of the triangle.
