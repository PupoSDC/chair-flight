- id: QZFVRBES
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616945
    - BGS-611461
  annexes: []
  learningObjectives:
    - 061.01.03.02.06
  template:
    type: calculation
    question: >-
      A pilot is using conventional navigation to fly on a non-RNAV airway
      defined by the fixes ASMIK-SEVAN-PEMAN, with a published course of
      {{crs}}°(T).


      To fly the centre line of the airway he/she maintains a heading of
      {{hdg}}°(T).


      After having overflown waypoint SEVAN and having travelled for {{dist}}
      NM, the pilot plots the position to be {{xt}} NM off-course towards the
      North.


      Calculate the average drift after overflying waypoint SEVAN (in degrees,
      to the left).
    variables:
      - id: crs
        label: course
        unit: °
      - id: hdg
        label: heading
        unit: °
      - id: dist
        label: distance flown
        unit: NM
      - id: xt
        label: cross-track error
        unit: NM
    answer:
      formula: hdg - crs + atan(xt / dist)
      unit: ° left
      decimals: 0
    distractors:
      - id: d1
        formula: atan(xt / dist)
      - id: d2
        formula: crs - hdg
      - id: d3
        formula: atan(xt / dist) + crs - hdg
    presets:
      - id: p1
        values:
          crs: 104
          hdg: 99
          dist: 20
          xt: 3
      - id: p2
        values:
          crs: 90
          hdg: 85
          dist: 30
          xt: 4
      - id: p3
        values:
          crs: 100
          hdg: 95
          dist: 25
          xt: 5
    explanation: >-
      The track made good lies to the north (left) of the course by
      atan(cross-track / distance). The drift is the angle between heading and
      that actual track.


      **Solution**


      Track error = atan({{xt}} / {{dist}}) = {{= atan(xt / dist)}}°


      Actual track = {{crs}} - {{= atan(xt / dist)}} = {{= crs - atan(xt /
      dist)}}°


      Drift = {{hdg}} - {{= crs - atan(xt / dist)}} = **{{answer}}° left**


      **Why the other answers are wrong**


      - **{{d1}}° left**: only the track error angle is used; the heading offset
      from the course is ignored.

      - **{{d2}}° left**: only the planned wind correction is used, ignoring the
      observed error.

      - **{{d3}}° left**: the heading offset is added instead of combined with
      the correct sign.
