- id: QNPELROC
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617076
    - AVEXAM-15984
  annexes: []
  learningObjectives:
    - 061.01.02.01.05
  template:
    type: calculation
    question: |-
      Given:

      - Position A: {{lat_a}}°N, {{lon_a}}°E
      - Position B: {{lat_b}}°N, {{lon_b}}°W

      What is the difference in longitude between A and B?
    variables:
      - id: lat_a
        label: Latitude of A
        unit: °N
      - id: lon_a
        label: East longitude of A
        unit: °E
      - id: lat_b
        label: Latitude of B
        unit: °N
      - id: lon_b
        label: West longitude of B
        unit: °W
    answer:
      formula: min(lon_a + lon_b, 360 - lon_a - lon_b)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: lon_a + lon_b
      - id: d2
        formula: abs(lon_a - lon_b)
      - id: d3
        formula: abs(lon_a + lon_b - 180)
      - id: d4
        formula: (360 - lon_a - lon_b) / 2
    presets:
      - id: p1
        values:
          lat_a: 56
          lon_a: 145
          lat_b: 57
          lon_b: 165
      - id: p2
        values:
          lat_a: 40
          lon_a: 150
          lat_b: 35
          lon_b: 100
      - id: p3
        values:
          lat_a: 60
          lon_a: 170
          lat_b: 62
          lon_b: 120
    explanation: >-
      The difference in longitude is the smaller of the two angles between the
      meridians, measured the short way round the Earth. Adding the east and
      west longitudes gives one of the two angles; the other is 360° minus that
      sum.


      **Solution**


      East and west longitudes together: {{lon_a}}° + {{lon_b}}° = {{= lon_a +
      lon_b}}°


      The other way round the Earth: 360° − {{= lon_a + lon_b}}° = {{= 360 -
      lon_a - lon_b}}°


      The smaller of the two angles is the difference: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the longer angle is taken, the way round the far side of
      the Earth.

      - **{{d2}}°**: both longitudes are subtracted as if they were on the same
      side of Greenwich.

      - **{{d3}}°**: 180° is subtracted from the sum by mistake.

      - **{{d4}}°**: the angle is halved instead of taking the smaller angle.
- id: QNPKWIJT
  docId: "061.01"
  relatedQuestions:
    - Q0HOQSVTF
  externalIds:
    - ATPLQ-614564
    - AVEXAM-17472
    - ATPLGS-628132
  annexes: []
  learningObjectives:
    - 061.01.03.02.04
  template:
    type: chart
    question: >-
      Given the following information for a flight navigated by dead reckoning,
      determine the track angle error (TKE):


      - Planned track: {{track}}°(T)

      - Variation: {{var_e}}° E

      - Deviation: +{{dev_e}}°

      - Planned heading: {{ch}}°(C)

      - In-flight drift: {{drift}}° (negative = left, positive = right)


      Give the track angle error in degrees, left or right.
    explanation: ""
    variables:
      - id: track
        label: Planned track
        unit: °(T)
      - id: var_e
        label: Variation (east)
        unit: °
      - id: dev_e
        label: Deviation (east)
        unit: °
      - id: ch
        label: Planned compass heading
        unit: °(C)
      - id: drift
        label: Drift (negative = left)
        unit: °
    entries:
      - id: e1
        values:
          track: 65
          var_e: 12
          dev_e: 5
          ch: 54
          drift: -8
        answer: 2° L
        wrongAnswers:
          - 2° R
          - 4° R
          - 4° L
        explanation: >-
          The track error angle (TKE) is the angle between the planned track and
          the track actually being made good. The track made good is the heading
          plus the drift caused by the wind. A drift to the left is subtracted
          from the heading and a drift to the right is added. If the result is
          to the right of the planned track the error is to the right, otherwise
          it is to the left.


          **Solution**


          The deviation and variation change the compass heading into a true
          heading: 054° + 5° = 059° magnetic, then 059° + 12° = 071° true. The
          track made good is 071° - 8° (drift to the left) = 063°. The track
          error is 063° - 065° = -2°, so 2° to the left.


          **Why the other answers are wrong**


          - **2° R**: the wrong direction.

          - **4° R**: the deviation or variation is applied in the wrong
          direction, and the wrong direction is also used.

          - **4° L**: the variation is not applied, which gives a larger error.
