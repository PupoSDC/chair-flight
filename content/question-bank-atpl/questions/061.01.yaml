          - 3° R.
        explanation: >-
          The track angle error can be estimated with the 1 in 60 rule: the
          offset from the intended track, divided by the distance flown along
          it, multiplied by 60. The side of the offset gives the direction of
          the error.


          **Solution**


          The aircraft has flown 75 NM along the course and is 7 NM right of it.
          The angle is about 7 NM x 60 / 75 NM = 6°, to the right.


          **Why the other answers are wrong**


          - **19° R.**: the right direction, but the offset is multiplied by too
          large a factor.

          - **22° R.**: the right direction, but the angle is far too large.

          - **3° R.**: the right direction, but the 1 in 60 calculation is
          halved.
- id: QWPGXBBM
  docId: "061.01"
  relatedQuestions:
    - QCUWSYZC
  externalIds:
    - ATPLQ-615307
    - AVEXAM-7215
    - BGS-611437
    - AVEXAM-72083
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: >-
      A pilot reduces their CAS from {{cas_before}} kt to {{cas_after}} kt.
      Determine the reduction in TAS, given:


      - Altitude: {{altitude}} ft

      - QNH: 1013 hPa

      - OAT: {{oat}} °C


      What is the reduction in TAS?
    variables:
      - id: cas_before
        label: CAS before
        unit: kt
      - id: cas_after
        label: CAS after
        unit: kt
      - id: altitude
        label: Altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: (cas_before - cas_after) / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588
        * 288.15 / (oat + 273.15))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas_before - cas_after
      - id: d2
        formula: (cas_before - cas_after) * sqrt((1 - 0.0000068756 * altitude) ^ 5.25588
          * 288.15 / (oat + 273.15))
      - id: d3
        formula: cas_before / sqrt((1 - 0.0000068756 * altitude) ^ 5.25588 * 288.15 /
          (oat + 273.15))
      - id: d4
        formula: (cas_before - cas_after) / sqrt((1 - 0.0000068756 * altitude) ^
          5.25588)
    presets:
      - id: p1
        values:
          cas_before: 130
          cas_after: 105
          altitude: 7000
          oat: -8
      - id: p2
        values:
          cas_before: 150
          cas_after: 120
          altitude: 12000
          oat: -20
    explanation: >-
      The TAS is the CAS corrected for the thinner air at the altitude and the
      temperature. Both speeds are corrected with the same factors, so the
      reduction in TAS is the reduction in CAS corrected once for the air
      density. The QNH of 1013 hPa means the altitude is the pressure altitude.


      **Solution**


      - Set the altitude of {{altitude}} ft against the OAT of {{oat}} °C on the
      computer.

      - Find the CAS of {{cas_before}} kt on the airspeed scale and read the TAS
      opposite it.

      - Find the CAS of {{cas_after}} kt and read its TAS in the same way.

      - Subtract the second TAS from the first: the reduction in TAS is
      **{{answer}} kt**.


      **Why the other answers are wrong**


      - **{{d1}} kt**: the CAS reduction has been used as the TAS reduction, but
      at altitude the TAS changes more than the CAS.

      - **{{d2}} kt**: the density correction has been applied in the wrong
      direction.

      - **{{d3}} kt**: this is the TAS at the higher CAS, not the reduction.

      - **{{d4}} kt**: the temperature has been ignored.
- id: QWSXXVJ2O
  docId: "061.01"
  relatedQuestions:
    - QYMLNDZTF
  externalIds:
    - ATPLQ-614047
    - ATPLGS-622639
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      An aircraft departs point A, intending to fly direct to point B. Given the
      following information:


      - Distance from A to B: {{total}} NM

      - After flying {{time}} minutes, or {{flown}} NM

      - Cross-track error: {{xtk}} NM left of track


      To regain the intended track in an equal amount of time, by how many
      degrees must the heading be changed?
    variables:
      - id: total
        label: Distance from A to B
        unit: NM
      - id: time
        label: Time flown
        unit: min
      - id: flown
        label: Distance flown
        unit: NM
      - id: xtk
        label: Cross-track error
        unit: NM
    answer:
      formula: 2 * xtk * 60 / flown
      unit: ° to the right
      decimals: 0
    distractors:
      - id: d1
        formula: xtk * 60 / flown
      - id: d2
        formula: 2 * xtk * 60 / time
      - id: d3
        formula: 2 * xtk
      - id: d4
        formula: 2 * xtk * 60 / total
    presets:
      - id: p1
        values:
          total: 140
          time: 18
          flown: 41
          xtk: 7
      - id: p2
        values:
          total: 200
          time: 26
          flown: 50
          xtk: 9
      - id: p3
        values:
          total: 120
          time: 17
          flown: 35
          xtk: 4
    explanation: >-
      When an aircraft is blown off track, it has to fly back over the same
      amount of time to regain the track. Using the 1 in 60 rule, the angle the
      aircraft has drifted off track is the cross-track error multiplied by 60
      and divided by the distance flown. To regain the track in the same time,
      the heading must be changed by twice that angle.


      **Solution**


      - Angle off track: {{f: xtk * 60 / flown}} = {{n: xtk * 60 / flown}}°

      - Heading change: {{f: 2 * xtk * 60 / flown}} = {{n: 2 * xtk * 60 /
      flown}} = **{{answer}}° to the right**


      **Why the other answers are wrong**


      - **{{d1}}° to the right**: gives only the angle off track, forgetting
      that the heading change must be double.

      - **{{d2}}° to the right**: divides by the time in minutes instead of the
      distance flown.

      - **{{d3}}° to the right**: uses twice the cross-track error in NM,
      without the 1 in 60 rule.

      - **{{d4}}° to the right**: divides by the total distance instead of the
      distance flown.
