- id: QHZGJDBM
  docId: "061.01"
  relatedQuestions:
    - QI52OVIJZ
  externalIds:
    - ATPLQ-615326
    - AVEXAM-89296
    - ATPLGS-627947
  annexes: []
  learningObjectives:
    - 061.01.07.01.04
  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the drift (size only, in degrees),
      given:


      - TAS: {{tas}} kt

      - Wind: blowing 45° from the left of track at {{wspd}} kt


      What is the drift in degrees?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: wspd
        label: Wind speed
        unit: kt
    answer:
      formula: 60 * 0.75 * wspd / tas
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: 60 * 0.5 * wspd / tas
      - id: d2
        formula: 60 * wspd / tas
      - id: d3
        formula: 2 * 60 * 0.75 * wspd / tas
    presets:
      - id: p1
        values:
          tas: 180
          wspd: 50
      - id: p2
        values:
          tas: 200
          wspd: 30
      - id: p3
        values:
          tas: 150
          wspd: 40
    explanation: >-
      Mental dead reckoning uses the 1 in 60 rule: the drift in degrees is about
      60 times the crosswind component divided by the TAS. For a wind 45 degrees
      from the track, the crosswind is about three quarters of the wind speed.
      The wind comes from the left, so the drift is to the right and the
      correction is to the left.


      **Solution**


      - Crosswind component: 0.75 × {{wspd}} = {{= 0.75 * wspd}} kt

      - Drift: 60 × {{= 0.75 * wspd}} ÷ {{tas}} = {{f: 60 * 0.75 * wspd / tas}}
      = {{n: 60 * 0.75 * wspd / tas}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the factor for 30 degrees (0.5) is used instead of the one
      for 45 degrees.

      - **{{d2}}°**: the full wind speed is used as crosswind, as if the wind
      were at right angles to the track.

      - **{{d3}}°**: the drift is doubled.
- id: QI52OVIJZ
  docId: "061.01"
  relatedQuestions:
    - QHZGJDBM
  externalIds:
    - ATPLQ-618756
    - ATPLGS-628135
    - AVEXAM-94523
  annexes: []
  learningObjectives:
    - 061.01.03.02.02
  template:
    type: calculation
    question: >-
      Given the following information, calculate the wind correction angle
      (WCA):


      - TAS: {{tas}} kt

      - Course: {{crs}}° T

      - Wind: {{wdir}}° T / {{wspd}} kt


      Give the WCA in degrees, positive for a correction to the right and
      negative for a correction to the left.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: crs
        label: Course
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
    answer:
      formula: asin(wspd * sin(wdir - crs) / tas)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: -asin(wspd * sin(wdir - crs) / tas)
      - id: d2
        formula: wdir - crs
      - id: d3
        formula: asin(wspd * cos(wdir - crs) / tas)
      - id: d4
        formula: 2 * asin(wspd * sin(wdir - crs) / tas)
    presets:
      - id: p1
        values:
          tas: 170
          crs: 200
          wdir: 270
          wspd: 30
      - id: p2
        values:
          tas: 150
          crs: 90
          wdir: 180
          wspd: 20
      - id: p3
        values:
          tas: 180
          crs: 300
          wdir: 240
          wspd: 25
    explanation: >-
      The wind correction angle is the angle the heading must be offset from the
      course so that the sideways push of the wind is cancelled. Only the
      crosswind component causes it. Dividing the crosswind by the TAS gives the
      sine of the angle. The angle is positive when the correction is to the
      right.


      **Solution**


      - Wind angle to course: {{= wdir - crs}}°

      - Crosswind component: {{= abs(wspd * sin(wdir - crs))}} kt

      - {{f: asin(wspd * sin(wdir - crs) / tas)}} = {{n: asin(wspd * sin(wdir -
      crs) / tas)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the right size but on the wrong side of the course.

      - **{{d2}}°**: the angle between the wind and the course is used instead
      of the correction.

      - **{{d3}}°**: the cosine (headwind component) is used instead of the sine
      (crosswind component).

      - **{{d4}}°**: the result is doubled.
- id: QICVHOBD
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616203
    - BGS-610501
    - ATPLGS-110525
    - AVEXAM-34671
    - ATPLGS-625444
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: >-
      An aircraft is maintaining a {{grad}}% gradient above flat terrain and is
      {{dist}} NM from the runway.


      Calculate the aircraft's approximate height above the runway in feet,
      rounded to the nearest 10 ft.
    variables:
      - id: grad
        label: Gradient
        unit: "%"
      - id: dist
        label: Distance from the runway
        unit: NM
    answer:
      formula: round(dist * 6076.12 * grad / 100 / 10) * 10
      unit: ft
      decimals: 1
    distractors:
      - id: d1
        formula: round(dist * 1852 * grad / 100 / 10) * 10
      - id: d2
        formula: round(dist * 6076.12 / (grad * 100) / 10) * 10
      - id: d3
        formula: round(6076.12 * grad / 100 / 10) * 10
      - id: d4
        formula: 2 * round(dist * 6076.12 * grad / 100 / 10) * 10
    presets:
      - id: p1
        values:
          grad: 5.2
          dist: 7
      - id: p2
        values:
          grad: 4
          dist: 10
      - id: p3
        values:
          grad: 6.5
          dist: 5
    explanation: >-
      A gradient is the height gained for each unit of distance flown. A
      gradient of {{grad}} % means {{grad}} ft of height for every 100 ft of
      distance, so the height is the distance in feet multiplied by the
      gradient.


      **Solution**


      - Distance in feet: {{dist}} NM × 6076 ft = {{= dist * 6076.12}} ft

      - Height: {{= dist * 6076.12}} ft × {{grad}} % = {{= dist * 6076.12 * grad
      / 100}} ft, rounded to the nearest 10 ft = **{{answer}} ft**


      **Why the other answers are wrong**


      - **{{d1}} ft**: the distance is converted with 1852 m per NM instead of
      6076 ft per NM.

      - **{{d2}} ft**: the gradient divides the distance instead of multiplying
      it.

      - **{{d3}} ft**: the distance is forgotten.

      - **{{d4}} ft**: the height is doubled.
