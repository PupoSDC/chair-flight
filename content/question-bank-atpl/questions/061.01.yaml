- id: QBQAZIXL
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617363
    - ATPLGS-626150
    - ATPLGS-626149
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      An aircraft at position 60°00'N {{lon_d}}°{{lon_m}}'W flies {{dist}} km
      due East.


      What is the new position?
    variables:
      - id: lon_d
        label: Longitude, degrees
        unit: °
      - id: lon_m
        label: Longitude, minutes
        unit: "'"
      - id: dist
        label: Distance flown
        unit: km
    answer:
      formula: lon_d * 60 + lon_m - dist / 1.852 / cos(60)
      unit: minutes
      decimals: 0
      format: "'60°00’N 'h'° 'm'’W'"
    distractors:
      - id: d1
        formula: lon_d * 60 + lon_m + dist / 1.852 / cos(60)
      - id: d2
        formula: lon_d * 60 + lon_m - dist / 1.852 * cos(60)
      - id: d3
        formula: lon_d * 60 + lon_m - dist / 1.852 / cos(60) / 2
      - id: d4
        formula: lon_d * 60 + lon_m + dist / 1.852
    presets:
      - id: p1
        values:
          lon_d: 5
          lon_m: 22
          dist: 165
      - id: p2
        values:
          lon_d: 12
          lon_m: 40
          dist: 220
      - id: p3
        values:
          lon_d: 25
          lon_m: 15
          dist: 120
    explanation: >-
      Along a parallel, one minute of longitude is shorter than one nautical
      mile by the factor cos(latitude). The change in longitude in minutes of
      arc is therefore the distance in nautical miles divided by cos(latitude).
      Flying east makes the west longitude smaller.


      **Solution**


      Distance = {{dist}} km ÷ 1.852 = {{= dist / 1.852}} NM


      Change of longitude = {{= dist / 1.852}} NM ÷ cos 60° = {{= dist / 1.852 /
      cos(60)}} minutes of arc


      New longitude = {{= lon_d * 60 + lon_m}} − {{= dist / 1.852 / cos(60)}} =
      {{= lon_d * 60 + lon_m - dist / 1.852 / cos(60)}} minutes of arc, which is
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the change is added instead of subtracted, as if flying
      west.

      - **{{d2}}**: the distance is multiplied by cos 60° instead of divided.

      - **{{d3}}**: only half of the change in longitude is applied.

      - **{{d4}}**: the distance in nautical miles is added without the latitude
      correction.
- id: QBUKGT086
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614277
    - BGS-611606
  annexes: []
  learningObjectives:
    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      An aircraft climbs from a pressure altitude to a flight level with an
      average true airspeed, and a headwind slows its progress over the ground.


      - Climb from pressure altitude: {{alt}} ft

      - Climb to: FL{{fl}}

      - Average true airspeed: {{tas}} kt

      - Ground distance covered during the climb: {{dist}} NM

      - Average headwind component: {{hw}} kt


      What is the required rate of climb (ft/min, rounded to the nearest 50
      ft/min)?
    variables:
      - id: alt
        label: Starting pressure altitude
        unit: ft
      - id: fl
        label: Level to climb to
        unit: FL
      - id: tas
        label: True airspeed
        unit: kt
      - id: dist
        label: Ground distance of the climb
        unit: NM
      - id: hw
        label: Headwind component
        unit: kt
    answer:
      formula: round((fl * 100 - alt) * (tas - hw) / (60 * dist) / 50) * 50
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: round((fl * 100 - alt) * (tas + hw) / (60 * dist) / 50) * 50
      - id: d2
        formula: round((fl * 100 - alt) * tas / (60 * dist) / 50) * 50
      - id: d3
        formula: round(fl * 100 * tas / (60 * dist) / 50) * 50
    presets:
      - id: p1
        values:
          alt: 2500
          fl: 150
          tas: 125
          dist: 40
          hw: 20
      - id: p2
        values:
          alt: 1000
          fl: 100
          tas: 120
          dist: 35
          hw: 15
      - id: p3
        values:
          alt: 1000
          fl: 150
          tas: 130
          dist: 40
          hw: 25
    explanation: >-
      The height to gain divided by the time needed gives the rate of climb. The
      time depends on the groundspeed, which is the true airspeed minus the
      headwind.


      **Solution**


      - Height to gain: FL{{fl}} minus {{alt}} ft = {{= fl * 100 - alt}} ft

      - Groundspeed: {{tas}} kt − {{hw}} kt = {{= tas - hw}} kt

      - Time for {{dist}} NM: {{= dist / (tas - hw) * 60}} min

      - Rate of climb: {{= (fl * 100 - alt) / (dist / (tas - hw) * 60)}} ft/min,
      rounded to the nearest 50 ft/min gives **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the headwind is added to the speed instead of
      subtracted.

      - **{{d2}} ft/min**: the headwind is left out.

      - **{{d3}} ft/min**: the starting height is ignored and the headwind is
      left out.
