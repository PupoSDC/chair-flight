- id: QTRROSNS
  docId: "061.01"
  relatedQuestions:
    - QFKTQEUZ
  externalIds:
    - ATPLQ-617637
    - AVEXAM-81484
    - ATPLGS-124453
    - BGS-610518
    - ATPLGS-110531
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: >-
      Given:


      - ILS glide path angle: {{angle}}°

      - Ground speed: {{gs}} kt


      What is the approximate rate of descent, in ft/min? Round the answer to
      the nearest 100 ft/min.
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: angle
        label: Glide path angle
        unit: °
    answer:
      formula: round(5 * gs * angle / 3 / 100) * 100
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: 5 * gs
      - id: d2
        formula: gs * angle / 3
      - id: d3
        formula: 5 * gs * angle
      - id: d4
        formula: gs * angle
    presets:
      - id: p1
        values:
          gs: 150
          angle: 3.5
      - id: p2
        values:
          gs: 130
          angle: 2.5
    explanation: >-
      For a glide path, the rate of descent in ft/min is about 5 times the
      groundspeed for a 3 degree slope, and it scales in proportion to the
      angle. So the rate of descent is 5 × groundspeed × angle ÷ 3. The result
      is rounded to the nearest 100 ft/min.


      **Solution**


      - Rate of descent: {{f: 5 * gs * angle / 3}} = {{n: 5 * gs * angle / 3}} ≈
      **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the glide path angle is ignored; the factor of 5 only
      applies to a 3 degree slope.

      - **{{d2}} ft/min**: the factor of 5 is forgotten, so the result is about
      five times too small.

      - **{{d3}} ft/min**: the division by 3 is forgotten, so the result is
      about three times too large.

      - **{{d4}} ft/min**: both the factor of 5 and the division by 3 are
      missing.
- id: QTRTTOPGT
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612592
    - ATPLGS-625642
    - ATPLGS-625492
    - ATPLGS-625383
    - AVEXAM-50270
    - ATPLGS-625500
    - AVEXAM-31229
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: |-
      An aircraft is flying at the following conditions:

      - Mach number: {{mach}}
      - OAT: {{oat}} °C

      What is the TAS?
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: mach * 38.967854 * sqrt(oat + 273.15)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach * 661.47
      - id: d2
        formula: mach * 38.967854 * sqrt(oat + 273.15) * 1.852
      - id: d3
        formula: mach * 38.967854 * sqrt(273.15 - oat)
      - id: d4
        formula: mach * 38.967854 * sqrt(273.15)
    presets:
      - id: p1
        values:
          mach: 0.915
          oat: -60.5
      - id: p2
        values:
          mach: 0.78
          oat: -45
    explanation: >-
      The true airspeed is the Mach number multiplied by the local speed of
      sound. The speed of sound depends only on the air temperature, not on the
      altitude, so the OAT is all that is needed.


      **Solution**


      - Speed of sound at {{oat}} °C: {{= 38.967854 * sqrt(oat + 273.15)}} kt

      - TAS: {{f: mach * 38.967854 * sqrt(oat + 273.15)}} = {{n: mach *
      38.967854 * sqrt(oat + 273.15)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the sea-level speed of sound (661 kt) and ignores
      the temperature.

      - **{{d2}} kt**: converts the result to km/h by multiplying by 1.852, but
      the answer is requested in knots.

      - **{{d3}} kt**: reverses the sign of the temperature, so cold air is
      treated as warm.

      - **{{d4}} kt**: uses 0 °C as the temperature instead of the actual OAT.
- id: QTSVZWPU
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619113
    - BGS-611272
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
    - 061.01.03.02.03
  template:
    type: calculation
    question: >-
      Given the following information, determine the actual magnetic track of
      the aircraft.


      - Planned track: {{pt}}°(T)

      - Heading: {{hdg}}°(T)

      - Actual in-flight drift: {{drift}}° left

      - Variation: {{var}}°W


      Give the magnetic track in degrees.
    variables:
      - id: pt
        label: Planned track
        unit: °(T)
      - id: hdg
        label: Heading
        unit: °(T)
      - id: drift
        label: Drift (left)
        unit: °
      - id: var
        label: Westerly variation
        unit: °
    answer:
      formula: (hdg - drift + var) - 360 * floor((hdg - drift + var) / 360)
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: hdg + drift + var
      - id: d2
        formula: (hdg - drift - var) - 360 * floor((hdg - drift - var) / 360)
      - id: d3
        formula: (hdg + drift - var) - 360 * floor((hdg + drift - var) / 360)
      - id: d4
        formula: (hdg - drift) - 360 * floor((hdg - drift) / 360)
      - id: d5
        formula: (pt + var) - 360 * floor((pt + var) / 360)
    presets:
      - id: p1
        values:
          pt: 350
          hdg: 4
          drift: 12
          var: 23
      - id: p2
        values:
          pt: 270
          hdg: 280
          drift: 6
          var: 10
      - id: p3
        values:
          pt: 85
          hdg: 90
          drift: 9
          var: 3
    explanation: >-
      With the aircraft drifting left, the true track lies to the left of the
      heading, so the drift is subtracted from the heading. The planned track is
      not needed. A westerly variation is then added to turn the true track into
      the magnetic track. A negative result has 360° added to bring it back into
      the 0° to 360° range.


      **Solution**


      True track: {{f: hdg - drift}} = {{n: hdg - drift}}


      Magnetic track: {{f: hdg - drift + var}} = {{n: hdg - drift + var}} =
      **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the drift instead of subtracting it.

      - **{{d2}}°**: subtracts the westerly variation instead of adding it.

      - **{{d3}}°**: uses the wrong sign for both the drift and the variation.

      - **{{d4}}°**: stops at the true track and forgets the variation.

      - **{{d5}}°**: uses the planned track instead of the heading.
- id: QTUAWYTS
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612903
    - AVEXAM-89390
  annexes:
    - 061-flight-navigation-log-f-imai-lfoi-to-sittingbourne-14-3
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. The aircraft is following the flight log, and the
      wind has been as forecast. The track from the M20 junction to the DET VOR
      is read from the flight log in the figure.


      Between the M20 junction and the DET VOR, the pilot diverts from the route
      to avoid low clouds. Once past the cloud, the pilot makes a visual fix and
      finds the aircraft:


      - {{along}} NM along the route from the M20 junction

      - approximately {{off}} NM to the left of the route


      By the 1:60 rule, what is the magnetic heading to fly to arrive at the DET
      VOR?
    variables:
      - id: track
        label: Route track from the M20 junction to DET VOR (read from the figure)
        unit: °
      - id: along
        label: Distance flown along track
        unit: NM
      - id: off
        label: Offset from track
        unit: NM
    chartInputs:
      - track
    answer:
      formula: track + off * 60 / along
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: track
      - id: d2
        formula: track - off * 60 / along
      - id: d3
        formula: track + 60 / along
      - id: d4
        formula: track + 2 * off * 60 / along
    presets:
      - id: p1
        values:
          track: 286
          along: 15
          off: 2.5
      - id: p2
        values:
          track: 214
          along: 20
          off: 3
    explanation: >-
      The 1:60 rule corrects the heading for a cross track error. For every 60
      NM flown along track, an offset of 1 NM needs a 1° change of heading. The
      correction is therefore the offset times 60, divided by the distance flown
      along track. The aircraft is left of track, so the correction is applied
      to the right.


      **Solution**


      - Correction = {{off}} NM x 60 / {{along}} NM = {{= off * 60 / along}}°

      - Heading = route track + correction = {{track}}° + {{= off * 60 /
      along}}° = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the correction is left out, so the route track is flown.

      - **{{d2}}°**: the correction is applied in the wrong direction.

      - **{{d3}}°**: the offset is not included in the correction.

      - **{{d4}}°**: the correction is doubled.
- id: QTVHOPYUS
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614594
    - ATPLGS-627168
