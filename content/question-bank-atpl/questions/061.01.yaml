- id: QMWVJCPD
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613525
    - BGS-611418
    - BGS-610423
    - BGS-611428
    - AVEXAM-39794
    - AVEXAM-71947
    - ATPLQ-617612
    - AVEXAM-32035
    - AVEXAM-46439
    - ATPLQ-613341
  annexes: []
  learningObjectives:
    - 061.01.05.04.04
  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the ground speed for the following
      situation:


      - TAS: {{tas}} kt

      - Wind: {{wspd}} kt, blowing {{angle}}° off your track


      What is the ground speed?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: wspd
        label: wind speed
        unit: kt
      - id: angle
        label: wind angle to track
        unit: °
    answer:
      formula: tas - wspd * round(10 * cos(30 * round(angle / 30))) / 10
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas + wspd * round(10 * cos(30 * round(angle / 30))) / 10
      - id: d2
        formula: tas - wspd
      - id: d3
        formula: tas - wspd * sin(angle)
      - id: d4
        formula: tas + wspd
    presets:
      - id: p1
        values:
          tas: 240
          wspd: 60
          angle: 30
      - id: p2
        values:
          tas: 465
          wspd: 50
          angle: 117
      - id: p3
        values:
          tas: 465
          wspd: 50
          angle: 60
      - id: p4
        values:
          tas: 300
          wspd: 40
          angle: 150
    explanation: >-
      Mental dead reckoning splits the wind into a part that blows along your
      track and a part that blows across it. Only the part along the track
      changes your speed over the ground: a headwind slows you down and a
      tailwind speeds you up. To find that part, round the wind angle to the
      nearest clock position (1 o'clock = 30°, 2 o'clock = 60°, and so on) and
      read the share of the wind speed from the clock table: 1 o'clock is 9/10,
      2 o'clock is 1/2, 3 o'clock is nothing, and beyond 3 o'clock the share
      becomes a tailwind.


      **Solution**


      Nearest clock position: {{angle}}° rounds to {{= round(angle / 30)}}
      o'clock, which is {{= 30 * round(angle / 30)}}°


      Share of the wind speed along the track (negative means tailwind): {{=
      round(10 * cos(30 * round(angle / 30))) / 10}}


      Headwind component = {{n: wspd * round(10 * cos(30 * round(angle / 30))) /
      10}} kt


      Ground speed = {{n: tas - wspd * round(10 * cos(30 * round(angle / 30))) /
      10}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the sign of the wind component is reversed, so a headwind
      is treated as a tailwind.

      - **{{d2}} kt**: takes the full wind speed as headwind and ignores the
      wind angle.

      - **{{d3}} kt**: subtracts the crosswind part (sine of the angle) instead
      of the headwind part.

      - **{{d4}} kt**: adds the full wind speed, as if the wind were a straight
      tailwind.
