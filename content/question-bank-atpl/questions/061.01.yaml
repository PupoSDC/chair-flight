- id: QAIJLTSQA
  docId: "061.01"
  relatedQuestions:
    - QKYYHEQCQ
  externalIds:
    - ATPLQ-612749
    - ATPLGS-625393
    - BGS-610166
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: |-
      An aircraft departs a point {{lat}}°N, {{lon}}°W and flies:

      - {{dist}} NM south
      - then {{dist}} NM east
      - then {{dist}} NM north
      - then {{dist}} NM west

      What is the final longitude (degrees W)?
    variables:
      - id: lat
        label: Start latitude
        unit: °N
      - id: lon
        label: Start longitude
        unit: °W
      - id: dist
        label: Length of each leg
        unit: NM
    answer:
      formula: lon - dist / (60 * cos(lat - dist / 60)) + dist / (60 * cos(lat))
      unit: °W
      decimals: 0
    distractors:
      - id: d1
        formula: abs(lon + dist / (60 * cos(lat - dist / 60)) - dist / (60 * cos(lat)))
      - id: d2
        formula: lon + dist / (60 * cos(lat - dist / 60)) + dist / (60 * cos(lat))
      - id: d3
        formula: lon + dist / (60 * cos(lat))
      - id: d4
        formula: 2 * dist / (60 * cos(lat))
    presets:
      - id: p1
        values:
          lat: 60
          lon: 30
          dist: 3600
      - id: p2
        values:
          lat: 45
          lon: 20
          dist: 2400
      - id: p3
        values:
          lat: 30
          lon: 10
          dist: 1200
    explanation: >-
      Each north or south leg changes only the latitude, and each east or west
      leg changes only the longitude. One degree is 60 NM. A leg along a
      parallel covers fewer minutes of longitude the further it is from the
      equator, so the east and west legs are divided by the cosine of their
      latitude.


      **Solution**


      - The south leg moves the aircraft to {{= lat - dist / 60}}°N

      - The east leg, flown at that latitude, changes the longitude by {{= dist
      / (60 * cos(lat - dist / 60))}}° east

      - The north leg brings the aircraft back to {{lat}}°N

      - The west leg, flown at {{lat}}°N, changes the longitude by {{= dist /
      (60 * cos(lat))}}° west

      - Final longitude: {{lon}}°W - {{= dist / (60 * cos(lat - dist / 60))}}° +
      {{= dist / (60 * cos(lat))}}° = **{{answer}}°W**


      **Why the other answers are wrong**


      - **{{d1}}°**: east and west are confused, and the result is shown as a
      positive value.

      - **{{d2}}°**: the eastward change is added instead of subtracted.

      - **{{d3}}°**: the eastward leg is forgotten and the westward change is
      added.

      - **{{d4}}°**: the start longitude is ignored and the westward change is
      counted twice.
