- id: QPRFOB5BS
  docId: "061.01"
  relatedQuestions:
    - QCOEXCNX
  externalIds:
    - ATPLQ-613497
    - BGS-611689
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Given the following information:

      - Distance from A to B: {{dist}} NM
      - Groundspeed: {{gs}} kt
      - Actual time of departure: {{dep_h}} h {{dep_min}} min

      Calculate the ETA at B (hh:mm).
    variables:
      - id: dist
        label: Distance from A to B
        unit: NM
      - id: gs
        label: Groundspeed
        unit: kt
      - id: dep_h
        label: Departure hour
        unit: h
      - id: dep_min
        label: Departure minute
        unit: min
    answer:
      formula: 60 * dep_h + dep_min + 60 * dist / gs
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: 60 * dep_h + dep_min + dist / gs
      - id: d2
        formula: 60 * dep_h + dep_min - 60 * dist / gs
      - id: d3
        formula: 60 * dep_h + dep_min + 60 * floor(dist / gs) + 10 * (dist / gs -
          floor(dist / gs))
      - id: d4
        formula: 60 * dep_h + dep_min + 30 * dist / gs
    presets:
      - id: p1
        values:
          dist: 450
          gs: 125
          dep_h: 10
          dep_min: 20
      - id: p2
        values:
          dist: 550
          gs: 150
          dep_h: 7
          dep_min: 45
      - id: p3
        values:
          dist: 400
          gs: 160
          dep_h: 15
          dep_min: 10
    explanation: >-
      The flight time is the distance divided by the groundspeed. The result is
      in hours, so it is multiplied by 60 to get minutes before it is added to
      the departure time.


      **Solution**


      - Flight time: {{dist}} NM ÷ {{gs}} kt = {{= 60 * dist / gs}} min

      - ETA: {{dep_h}} h {{dep_min}} min + {{= 60 * dist / gs}} min =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the flight time in hours is added as if it were minutes.

      - **{{d2}}**: the flight time is subtracted instead of added.

      - **{{d3}}**: the decimal part of the hours is read as tenths of minutes,
      so 0.6 h becomes 6 min instead of 36 min.

      - **{{d4}}**: the flight time is halved.
