  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: >-
      An aircraft descends along a slope while maintaining a constant
      groundspeed, given:


      - Slope: {{slope}} %

      - Groundspeed: {{gs}} kt


      What is the approximate rate of descent in ft/min? Use 1 NM = 6 000 ft.
    variables:
      - id: slope
        label: Slope
        unit: "%"
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: gs * slope
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: gs * slope * 6
      - id: d2
        formula: gs * slope / 2
      - id: d3
        formula: gs * slope * 2
      - id: d4
        formula: gs * slope / 6
    presets:
      - id: p1
        values:
          slope: 6
          gs: 300
      - id: p2
        values:
          slope: 4
          gs: 250
      - id: p3
        values:
          slope: 3
          gs: 420
    explanation: >-
      At 1 kt the aircraft covers 1 NM every hour, which is 100 ft of ground
      every minute when 1 NM = 6 000 ft. On a slope of 1 %, you lose 1 ft for
      every 100 ft of ground, so the rate of descent in feet per minute is the
      groundspeed multiplied by the slope in per cent.


      **Solution**


      - Ground distance per minute: {{f: gs * 6000 / 60}} = {{n: gs * 6000 /
      60}} ft

      - Rate of descent: {{f: gs * 6000 / 60 * slope / 100}} = {{n: gs * 6000 /
      60 * slope / 100}} ft/min, which is **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: multiplies by 6 more than needed, a units slip with
      the 6 000 ft per NM

      - **{{d2}} ft/min**: halves the answer, a factor of two too small

      - **{{d3}} ft/min**: doubles the answer, a factor of two too large

      - **{{d4}} ft/min**: divides by 6 instead of multiplying, so the descent
      is far too shallow
