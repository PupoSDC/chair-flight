  template:
    type: chart
    question: >-
      Determine the initial magnetic track and the distance from point A to
      point B, given:


      - Point A: latitude {{lat1}}°, longitude {{lon1}}°

      - Point B: latitude {{lat2}}°, longitude {{lon2}}°


      South latitude and west longitude are negative. Give the track in degrees
      magnetic and the distance in NM.
    explanation: ""
    variables:
      - id: lat1
        label: Point A latitude
        unit: °
      - id: lon1
        label: Point A longitude
        unit: °
      - id: lat2
        label: Point B latitude
