- id: QHLXAZA8L
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617843
    - AVEXAM-19680
    - AVEXAM-2719
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      Point B lies to the north-west of point A. The route from A to B forms an
      angle of {{ang}}° with the meridian through A.


      - Variation at A: {{var}}° E


      What is the initial magnetic track from A to B?
    variables:
      - id: ang
        label: Angle with the meridian
        unit: °
      - id: var
        label: Variation (east)
        unit: °
    answer:
      formula: 360 - ang - var
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: 360 - ang + var
      - id: d2
        formula: ang - var
      - id: d3
        formula: ang + var
      - id: d4
        formula: 360 - ang
    presets:
      - id: p1
        values:
          ang: 35
          var: 3
      - id: p2
        values:
          ang: 40
          var: 5
      - id: p3
        values:
          ang: 25
          var: 2
    explanation: >-
      A track to the north-west has a true bearing of 360° minus the angle
      measured from north. The magnetic track is the true track minus east
      variation, because magnetic north lies west of true north.


      **Solution**


      - True track = 360° − {{ang}}° = {{= 360 - ang}}°

      - Magnetic track = {{= 360 - ang}}° − {{var}}° = **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°(M)**: adds the east variation instead of subtracting it.

      - **{{d2}}°(M)**: reads the track as north-east and subtracts the
      variation.

      - **{{d3}}°(M)**: reads the track as north-east and adds the variation.

      - **{{d4}}°(M)**: forgets to convert the true track to magnetic.
- id: QHQLSJHF
  docId: "061.01"
  relatedQuestions:
    - QHYRSUFD
  externalIds:
    - ATPLQ-615871
    - AVEXAM-18962
    - AVEXAM-66029
    - ATPLQ-614747
    - BGS-611609
    - AVEXAM-87935
    - BGS-610398
    - AVEXAM-51168
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: |-
      Determine the CAS of the aircraft, given the following information:

      - TAS: {{tas}} kt
      - Pressure altitude: {{alt}} ft
      - Outside air temperature: {{oat}} °C

      What is the CAS?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: alt
        label: pressure altitude
        unit: ft
      - id: oat
        label: outside air temperature
        unit: °C
    answer:
      formula: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (oat + 273.15))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas
      - id: d2
        formula: tas / (1 - 0.0000068756 * alt) ^ 5.2559
      - id: d3
        formula: tas * (1 - 0.0000068756 * alt) ^ 5.2559
      - id: d4
        formula: tas / sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (oat + 273.15))
    presets:
      - id: p1
        values:
          tas: 125
          alt: 4000
          oat: 25
      - id: p2
        values:
          tas: 215
          alt: 10000
          oat: 15
      - id: p3
        values:
          tas: 180
          alt: 12000
          oat: -5
    explanation: >-
      CAS is the TAS corrected for air density. The density ratio σ = (p / p0) ×
      (T0 / T) falls with height and rises when the air is colder, and CAS = TAS
      × √σ. Compressibility is ignored at these speeds.


      **Solution**


      {{f: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 / (oat +
      273.15))}} = {{n: tas * sqrt((1 - 0.0000068756 * alt) ^ 5.2559 * 288.15 /
      (oat + 273.15))}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the TAS is taken directly as the CAS, ignoring the
      density correction.

      - **{{d2}} kt**: the pressure ratio is divided instead of the density
      correction being applied.

      - **{{d3}} kt**: the pressure ratio alone is applied, leaving out the
      temperature and the square root.

      - **{{d4}} kt**: the density correction is divided instead of multiplied.
