- id: QLWSGCIE
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615575
    - AVEXAM-17716
    - BGS-611437
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: >-
      Given the following information and using a mechanical computer, determine
      the change in CAS required to reduce the TAS of an aircraft from {{tas1}}
      kt to {{tas2}} kt.


      - Pressure altitude: {{pa}} ft

      - OAT: {{oat}} °C


      What is the change in CAS, in kt?
    variables:
      - id: tas1
        label: Initial TAS
        unit: kt
      - id: tas2
        label: Final TAS
        unit: kt
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: (tas1 - tas2) * sqrt((((1 - 0.0000225577 * pa * 0.3048) ^ 5.25588) *
        288.15 / (oat + 273.15)))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas1 - tas2
      - id: d2
        formula: (tas1 - tas2) * (((1 - 0.0000225577 * pa * 0.3048) ^ 5.25588) * 288.15
          / (oat + 273.15))
      - id: d3
        formula: (tas1 - tas2) / sqrt((((1 - 0.0000225577 * pa * 0.3048) ^ 5.25588) *
          288.15 / (oat + 273.15)))
      - id: d4
        formula: (tas1 - tas2) * sqrt(((1 - 0.0000225577 * pa) ^ 5.25588) * 288.15 /
          (oat + 273.15))
    presets:
      - id: p1
        values:
          tas1: 150
          tas2: 105
          pa: 7000
          oat: -8
      - id: p2
        values:
          tas1: 180
          tas2: 120
          pa: 5000
          oat: 15
      - id: p3
        values:
          tas1: 250
          tas2: 200
          pa: 10000
          oat: -20
    explanation: >-
      CAS and TAS are linked through the air density: at the same CAS, the TAS
      is higher in thinner air. A change in TAS therefore produces a change in
      CAS that is scaled by the square root of the density ratio σ at the
      pressure altitude and temperature.


      **Solution**


      Density ratio σ = {{= (((1 - 0.0000225577 * pa * 0.3048) ^ 5.25588) *
      288.15 / (oat + 273.15))}}


      Change in CAS = ({{tas1}} − {{tas2}}) × √σ = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: ignores the density; the TAS change is taken as the CAS
      change.

      - **{{d2}} kt**: uses σ instead of √σ.

      - **{{d3}} kt**: divides by √σ, the inverse correction.

      - **{{d4}} kt**: uses the pressure altitude in feet as if it were metres.
