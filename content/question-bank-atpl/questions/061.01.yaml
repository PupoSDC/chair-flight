    - 061.01.08.01.02
  template:
    type: calculation
    question: >-
      An aircraft descends from FL{{top}} to FL{{bottom}} for the final
      approach. Calculate the average TAS during the descent, given:


      - CAS: {{cas}} kt

      - Temperature: ISA {{dev}} °C


      What is the average TAS in the descent?
    variables:
      - id: top
        label: start level
        unit: FL
      - id: bottom
        label: end level
        unit: FL
      - id: cas
        label: CAS
        unit: kt
      - id: dev
        label: ISA deviation
        unit: °C
    answer:
      formula: cas / sqrt(((1 - 0.0000068756 * 50 * (top + bottom)) ^ 5.2559) * 288.15
        / (288.15 - 0.002 * 50 * (top + bottom) + dev))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas / sqrt(((1 - 0.0000068756 * 100 * top) ^ 5.2559) * 288.15 / (288.15
          - 0.002 * 100 * top + dev))
      - id: d3
        formula: cas * sqrt(((1 - 0.0000068756 * 50 * (top + bottom)) ^ 5.2559) * 288.15
          / (288.15 - 0.002 * 50 * (top + bottom) + dev))
      - id: d4
        formula: cas / sqrt(((1 - 0.0000068756 * 100 * bottom) ^ 5.2559) * 288.15 /
          (288.15 - 0.002 * 100 * bottom + dev))
    presets:
      - id: p1
        values:
          top: 240
          bottom: 80
          cas: 220
          dev: -10
      - id: p2
        values:
          top: 220
          bottom: 40
          cas: 220
          dev: 10
      - id: p3
        values:
          top: 130
          bottom: 60
          cas: 130
          dev: 0
    explanation: >-
      In a descent the air becomes denser as the aircraft goes lower, so a
      constant CAS corresponds to a TAS that changes with height. The average
      TAS is taken at the mean altitude of the descent, using the ISA
      temperature at that altitude plus the ISA deviation.


      **Solution**


      Mean altitude: ({{top}} + {{bottom}}) / 2 = {{= (top + bottom) / 2}} FL,
      which is {{= 50 * (top + bottom)}} ft


      {{f: cas / sqrt(((1 - 0.0000068756 * 50 * (top + bottom)) ^ 5.2559) *
      288.15 / (288.15 - 0.002 * 50 * (top + bottom) + dev))}} = {{n: cas /
      sqrt(((1 - 0.0000068756 * 50 * (top + bottom)) ^ 5.2559) * 288.15 /
      (288.15 - 0.002 * 50 * (top + bottom) + dev))}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the CAS as if it were the TAS, ignoring the lower
      air density at altitude.

      - **{{d2}} kt**: uses the level at the start of the descent instead of the
      mean altitude.

      - **{{d3}} kt**: inverts the density correction, so the TAS is multiplied
      instead of divided.

      - **{{d4}} kt**: uses the level at the end of the descent instead of the
      mean altitude.
