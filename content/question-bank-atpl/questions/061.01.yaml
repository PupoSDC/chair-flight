- id: QAATHWNY6
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611100
    - ATPLGS-626406
    - ATPLQ-618324
    - AVEXAM-88132
    - ATPLGS-625892
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Calculate the endurance of the aircraft.

      - Fuel flow: {{ff}} US gal/h
      - Fuel on board: {{fuel}} imp gal

      What is the endurance, in hours and minutes?
    variables:
      - id: ff
        label: Fuel flow
        unit: US gal/h
      - id: fuel
        label: Fuel on board
        unit: imp gal
    answer:
      formula: round(fuel * 1.2 / ff * 60)
      unit: minutes
      decimals: 0
      format: h 'h' mm 'min'
    distractors:
      - id: d1
        formula: round(fuel / ff * 60)
      - id: d2
        formula: round(fuel * 0.8333 / ff * 60)
      - id: d3
        formula: round(fuel * 1.2 / ff * 60 / 2)
      - id: d4
        formula: round(fuel * 1.2 / ff) * 60
    presets:
      - id: p1
        values:
          ff: 22
          fuel: 71
      - id: p2
        values:
          ff: 17
          fuel: 45
      - id: p3
        values:
          ff: 20
          fuel: 60
    explanation: >-
      The fuel is first converted from imperial to US gallons, since the fuel
      flow is in US gallons (1 imperial gallon = 1.2 US gallons). Dividing by
      the fuel flow gives the endurance in hours, which is converted to minutes
      and shown as hours and minutes.


      **Solution**


      Fuel in US gallons: {{f: fuel * 1.2}} = {{n: fuel * 1.2}} US gal


      Endurance: {{f: fuel * 1.2 / ff}} = {{n: fuel * 1.2 / ff}} h


      Endurance: {{n: fuel * 1.2 / ff * 60}} min = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the imperial gallons directly without converting to US
      gallons.

      - **{{d2}}**: converts the wrong way, from US to imperial gallons.

      - **{{d3}}**: halves the endurance.

      - **{{d4}}**: treats the endurance in hours as minutes.
