  relatedQuestions: []
  externalIds:
    - ATPLQ-618012
  annexes: []
  learningObjectives:
    - 061.01.04.02.01
  template:
    type: calculation
    question: A rate of {{rate}} ft/min corresponds to how many metres per second?
    variables:
      - id: rate
        label: Rate
        unit: ft/min
    answer:
      formula: rate * 0.3048 / 60
      unit: m/s
      decimals: 1
    distractors:
      - id: d1
        formula: rate * 0.3048
      - id: d2
        formula: rate / (0.3048 * 60)
      - id: d3
        formula: rate / 60
      - id: d4
        formula: rate * 0.3048 / 60 * 10
    presets:
      - id: p1
        values:
          rate: 470
      - id: p2
        values:
          rate: 1200
      - id: p3
        values:
          rate: 300
    explanation: >-
      One foot is 0.3048 metres and one minute is 60 seconds. The rate in metres
      per second is therefore the feet per minute multiplied by 0.3048 and
      divided by 60.


      **Solution**


      - Metres per minute: {{rate}} ft × 0.3048 = {{= rate * 0.3048}} m

      - Metres per second: {{= rate * 0.3048}} m ÷ 60 = **{{answer}} m/s**


      **Why the other answers are wrong**


      - **{{d1}} m/s**: the conversion to metres is done but the division by 60
      is forgotten.

      - **{{d2}} m/s**: the conversion factor is inverted.

      - **{{d3}} m/s**: the feet are not converted to metres.

      - **{{d4}} m/s**: a decimal slip, the result is multiplied by ten.
