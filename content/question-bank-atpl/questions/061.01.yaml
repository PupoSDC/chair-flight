- id: Q2USSTSKG
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616570
    - BGS-611699
  annexes: []
  learningObjectives:
    - 061.01.05.04.01
  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the headwind component for the
      following runway and wind:


      - Runway heading: {{rwy}}°

      - Surface wind (magnetic, from the tower): {{wdir}}° / {{wspd}} kt


      What is the headwind component?
    variables:
      - id: rwy
        label: runway heading
        unit: °
      - id: wdir
        label: wind direction
        unit: °
      - id: wspd
        label: wind speed
        unit: kt
    answer:
      formula: wspd * round(10 * cos(30 * round(abs(wdir - rwy) / 30))) / 10
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: wspd
      - id: d2
        formula: wspd * sin(abs(wdir - rwy))
      - id: d3
        formula: wspd * 0.9
      - id: d4
        formula: -wspd * round(10 * cos(30 * round(abs(wdir - rwy) / 30))) / 10
    presets:
      - id: p1
        values:
          rwy: 140
          wdir: 200
          wspd: 20
      - id: p2
        values:
          rwy: 270
          wdir: 330
          wspd: 30
      - id: p3
        values:
          rwy: 50
          wdir: 110
          wspd: 24
    explanation: >-
      The headwind component is the part of the wind that blows straight along
      the runway. Mental dead reckoning rounds the wind angle to the nearest
      clock position (30° steps) and reads the share of the wind speed from the
      clock table: 1 o'clock is 9/10, 2 o'clock is 1/2 and 3 o'clock is nothing.
      A negative result means a tailwind.


      **Solution**


      Angle between wind and runway: {{= abs(wdir - rwy)}}°, nearest clock
      position {{= round(abs(wdir - rwy) / 30)}} o'clock


      Share of the wind speed from the table: {{= round(10 * cos(30 *
      round(abs(wdir - rwy) / 30))) / 10}}


      Headwind component = {{n: wspd * round(10 * cos(30 * round(abs(wdir - rwy)
      / 30))) / 10}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the full wind speed and ignores the wind angle.

      - **{{d2}} kt**: uses the sine of the angle, which gives the crosswind
      part instead.

      - **{{d3}} kt**: uses the 1 o'clock share (9/10) instead of the 2 o'clock
      share (1/2).

      - **{{d4}} kt**: reverses the sign, so a headwind is shown as a tailwind.
