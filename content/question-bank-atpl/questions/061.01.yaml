- id: QPKXFVCU
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615926
    - AVEXAM-59336
    - BGS-611711
    - AVEXAM-51069
  annexes: []
  learningObjectives:
    - 061.01.03.02.01
  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the crosswind component, to the
      nearest whole knot, for the following track and wind:


      - Magnetic track: {{rwy}}°

      - Wind (magnetic): {{wdir}}° / {{wspd}} kt


      What is the crosswind component?
    variables:
      - id: rwy
        label: magnetic track
        unit: °
      - id: wdir
        label: wind direction
        unit: °
      - id: wspd
        label: wind speed
        unit: kt
    answer:
      formula: round(wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 60, 1))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: round(wspd * cos(abs(wdir - rwy)))
      - id: d2
        formula: round(wspd * min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 90)
      - id: d3
        formula: round(wspd * min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 30)
      - id: d4
        formula: round(wspd * abs(sin(abs(wdir - rwy))))
    presets:
      - id: p1
        values:
          rwy: 315
          wdir: 15
          wspd: 20
      - id: p2
        values:
          rwy: 90
          wdir: 150
          wspd: 25
      - id: p3
        values:
          rwy: 200
          wdir: 270
          wspd: 15
    explanation: >-
      Mental dead reckoning uses the 1-in-60 rule. The crosswind is the wind
      speed multiplied by the angle between the wind and the track, divided by
      60, and it cannot exceed the full wind speed. The angle is the smaller of
      the two differences between the wind and track directions.


      **Solution**


      - Angle between wind and track = {{= min(abs(wdir - rwy), 360 - abs(wdir -
      rwy))}}°

      - {{f: wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 60, 1)}} =
      {{n: wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 60, 1)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the cosine of the angle was used, which gives the
      headwind component, not the crosswind.

      - **{{d2}} kt**: the angle was divided by 90 instead of 60, which
      understates the crosswind.

      - **{{d3}} kt**: the angle was divided by 30 instead of 60, which
      overstates the crosswind.

      - **{{d4}} kt**: the exact sine of the angle was used instead of the
      mental 1-in-60 method.
- id: QPM8J1HGN
  docId: "061.01"
  relatedQuestions: []
