- id: QAPXBNGD
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613866
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: |-
      Given the following information at FL25:

      - OAT: {{oat}} °C
      - TAS: {{tas}} kt

      What is the Mach number?
    variables:
      - id: tas
        label: True airspeed
        unit: kt
      - id: oat
        label: Outside air temperature
        unit: °C
    answer:
      formula: tas / (38.967 * sqrt(oat + 273.15))
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: tas / (38.967 * sqrt(288.15))
      - id: d2
        formula: 38.967 * sqrt(oat + 273.15) / tas
      - id: d3
        formula: tas / (38.967 * sqrt(273.15))
      - id: d4
        formula: tas / (38.967 * (oat + 273.15))
    presets:
      - id: p1
        values:
          tas: 250
          oat: -15
      - id: p2
        values:
          tas: 300
          oat: -40
      - id: p3
        values:
          tas: 200
          oat: -55
    explanation: >-
      Mach number is the true airspeed divided by the speed of sound at that
      point. The speed of sound depends only on the air temperature, so the
      outside air temperature, converted into kelvin, is used.


      **Solution**


      - Temperature in kelvin: {{= oat + 273.15}} K

      - Speed of sound: {{f: 38.967 * sqrt(oat + 273.15)}} = {{n: 38.967 *
      sqrt(oat + 273.15)}} kt

      - Mach number: {{f: tas / (38.967 * sqrt(oat + 273.15))}} = {{n: tas /
      (38.967 * sqrt(oat + 273.15))}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: uses the sea level temperature of 15 °C instead of the
      outside air temperature.

      - **{{d2}}**: turns the ratio upside down, dividing the speed of sound by
      the true airspeed.

      - **{{d3}}**: uses 0 °C instead of the outside air temperature.

      - **{{d4}}**: forgets the square root in the speed of sound.
