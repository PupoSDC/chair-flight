- id: QRTGFRXS
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618753
    - BGS-611438
  annexes: []
  learningObjectives:
    - 061.01.04.04.02
  template:
    type: calculation
    question: |-
      Convert the ground distance to air distance, given:

      - Ground distance: {{ground}} NM
      - TAS: {{tas}} kt
      - IAS: {{ias}} kt
      - GS: {{gs}} kt

      What is the air distance in NAM?
    variables:
      - id: ground
        label: Ground distance
        unit: NM
      - id: tas
        label: True airspeed (TAS)
        unit: kt
      - id: ias
        label: Indicated airspeed (IAS)
        unit: kt
      - id: gs
        label: Groundspeed (GS)
        unit: kt
    answer:
      formula: ground * tas / gs
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: ground * ias / gs
      - id: d2
        formula: ground * gs / tas
      - id: d3
        formula: ground * gs / ias
      - id: d4
        formula: ground * tas / ias
    presets:
      - id: p1
        values:
          ground: 180
          tas: 165
          ias: 140
          gs: 150
      - id: p2
        values:
          ground: 240
          tas: 200
          ias: 170
          gs: 185
      - id: p3
        values:
          ground: 300
          tas: 250
          ias: 210
          gs: 230
    explanation: >-
      The air distance is the distance flown through the air, which is the
      ground distance scaled by the ratio of true airspeed to groundspeed. The
      true airspeed is used, not the indicated airspeed.


      **Solution**


      {{f: ground * tas / gs}} = {{n: ground * tas / gs}} = **{{answer}} NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: the indicated airspeed is used instead of the true
      airspeed.

      - **{{d2}} NAM**: the ratio is inverted (groundspeed over true airspeed).

      - **{{d3}} NAM**: the ratio is inverted and the indicated airspeed is
      used.

      - **{{d4}} NAM**: the indicated airspeed is used instead of the
      groundspeed.
