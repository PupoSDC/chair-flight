- id: QKCPDDEV9
  docId: "061.01"
  relatedQuestions:
    - QTH4JD6H0
  externalIds:
    - ATPLQ-613125
    - BGS-611627
    - AVEXAM-35883
  annexes: []
  learningObjectives:
    - 061.01.05.04.02
    - 061.01.05.06.03
  template:
    type: calculation
    question: >-
      An aeroplane is climbing with a constant TAS of {{tas}} kt and a headwind
      component of {{hw}} kt. The rate of climb is {{roc}} ft/min.


      What climb gradient is achieved, in %?
    variables:
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
    answer:
      formula: roc / ((tas - hw) * 101.3) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: roc / (tas * 101.3) * 100
      - id: d2
        formula: roc / ((tas + hw) * 101.3) * 100
      - id: d3
        formula: roc / ((tas + 2 * hw) * 101.3) * 100
      - id: d4
        formula: roc / ((tas - hw) * 101.3) * 1000
    presets:
      - id: p1
        values:
          roc: 1300
          tas: 220
          hw: 40
      - id: p2
        values:
          roc: 900
          tas: 200
          hw: 20
      - id: p3
        values:
          roc: 700
          tas: 150
          hw: 10
    explanation: >-
      The climb gradient is the height gained per unit of horizontal distance
      covered over the ground. At 1 NM per 6 076 ft, one minute at a groundspeed
      of 1 kt covers 101.3 ft, so the gradient is the rate of climb divided by
      the distance covered per minute.


      **Solution**


      Groundspeed = {{tas}} kt − {{hw}} kt = {{= tas - hw}} kt


      Horizontal distance per minute = {{= tas - hw}} × 101.3 = {{= (tas - hw) *
      101.3}} ft


      Climb gradient = {{roc}} ft/min ÷ {{= (tas - hw) * 101.3}} ft × 100 =
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the TAS and ignores the headwind.

      - **{{d2}} %**: adds the headwind instead of subtracting it.

      - **{{d3}} %**: adds twice the headwind to the TAS.

      - **{{d4}} %**: multiplies by 1 000 instead of 100 when converting to a
      percentage.
- id: QKFZKUDZ
  docId: 061.01.03.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-614936
    - ATPLGS-124488
    - AVEXAM-23155
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
    - 061.01.06.02.01
  template:
    type: calculation
    question: >-
      An aircraft is flying from SALCO to BERRY HEAD on magnetic track {{trk}}°.
      At 10:03 UTC the relative bearing of locator PY is {{rb}}°.


      - TAS: {{tas}} kt

      - W/V: {{wd}}°(T)/{{ws}} kt

      - Variation: {{var}}°W

      - Deviation: +{{dev}}°


      Calculate the true bearing of locator PY from the aircraft at 10:03 UTC.
    variables:
      - id: trk
        label: magnetic track
        unit: °
      - id: rb
        label: relative bearing
        unit: °
      - id: tas
        label: true airspeed
        unit: kt
      - id: wd
        label: wind direction
        unit: °
      - id: ws
        label: wind speed
        unit: kt
      - id: var
        label: variation (west)
        unit: °
      - id: dev
        label: deviation
        unit: °
    answer:
      formula: trk - var + asin(ws * sin(wd - (trk - var)) / tas) + rb
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: trk + var + asin(ws * sin(wd - (trk + var)) / tas) + rb
      - id: d2
        formula: trk - var + rb
      - id: d3
        formula: trk - var + asin(ws * sin(wd - (trk - var)) / tas) + rb + dev
      - id: d4
        formula: trk - var + asin(ws * sin(wd - (trk - var)) / tas) + rb - dev
    presets:
      - id: p1
        values:
          trk: 7
          rb: 266
          tas: 445
          wd: 50
          ws: 40
          var: 5
          dev: 2
      - id: p2
        values:
          trk: 90
          rb: 120
          tas: 300
          wd: 180
          ws: 20
          var: 3
          dev: 1
      - id: p3
        values:
          trk: 200
          rb: 45
          tas: 250
          wd: 330
          ws: 10
          var: 2
          dev: 1
    explanation: >-
      The true bearing from the aircraft is the true heading plus the relative
      bearing. The true track is the magnetic track corrected by the variation
      (west is subtracted). The true heading is the true track corrected for the
      wind; the wind correction angle comes from the wind triangle. The
      deviation is not needed for a true bearing.


      **Solution**


      True track = {{trk}}° - {{var}}° = {{= trk - var}}°(T)


      Wind correction angle = {{f: asin(ws * sin(wd - (trk - var)) / tas)}} =
      {{= asin(ws * sin(wd - (trk - var)) / tas)}}°


      True bearing = true track + wind correction + relative bearing = {{f: trk
      - var + asin(ws * sin(wd - (trk - var)) / tas) + rb}} = {{n: trk - var +
      asin(ws * sin(wd - (trk - var)) / tas) + rb}} = **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°(T)**: applies the variation with the wrong sign, which also
      changes the wind correction.

      - **{{d2}}°(T)**: ignores the wind correction, so it uses the true track
      instead of the true heading.

      - **{{d3}}°(T)**: adds the deviation, which is not needed for a true
      bearing.

      - **{{d4}}°(T)**: subtracts the deviation, which is not needed for a true
      bearing.
- id: QKG2HCVJF
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612259
  annexes: []
  learningObjectives:
    - 061.01.02.01.03
  template:
    type: calculation
    question: >-
      An aircraft flies from A to B, both on the same meridian.


      - Latitude of A: {{lat_a}}°

      - Latitude of B: {{lat_b}}°


      What is the latitude change in decimal degrees? Give a positive number
      when B is south of A and a negative number when B is north of A.
    variables:
      - id: lat_a
        label: Latitude of A
        unit: °
      - id: lat_b
        label: Latitude of B
        unit: °
    answer:
      formula: lat_a - lat_b
      unit: °
      decimals: 2
    distractors:
      - id: d1
        formula: lat_a + lat_b
      - id: d2
        formula: (lat_a - lat_b) / 3
      - id: d3
        formula: lat_b - lat_a
      - id: d4
        formula: lat_a * lat_b / 100
    presets:
      - id: p1
        values:
          lat_a: 50.8464
          lat_b: 34.41
      - id: p2
        values:
          lat_a: 45
          lat_b: 30.5
      - id: p3
        values:
          lat_a: 60.25
          lat_b: 48
    explanation: >-
      Latitude is measured from the equator, north positive. The latitude change
      between two points on the same meridian is the difference of their
      latitudes. A positive result means the aircraft travels south.


      **Solution**


      - {{f: lat_a - lat_b}} = {{n: lat_a - lat_b}} = **{{answer}}°**, so the
      aircraft travels south


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the latitudes instead of subtracting them

      - **{{d2}}°**: divides the change by three

      - **{{d3}}°**: reverses the direction of travel

      - **{{d4}}°**: multiplies the latitudes instead of subtracting them
- id: QKHZJPCI
  docId: 061.01.08.01
  relatedQuestions:
    - QGKADWYO
  externalIds:
    - ATPLQ-617751
    - BGS-611445
  annexes: []
  learningObjectives:
    - 061.01.05.04.02
    - 061.01.05.06.03
  template:
    type: calculation
    question: >-
      An aircraft must meet a climb gradient, flying at the best rate of climb
      TAS for its type:


      - Required climb gradient: {{grad}}%

      - TAS: {{tas}} kt

      - Tailwind component: {{tailwind}} kt (a negative value is a headwind)


      What is the minimum rate of climb required, in ft/min?
    variables:
      - id: grad
        label: Required climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tailwind
        label: Tailwind component
        unit: kt
    answer:
      formula: round((tas + tailwind) * grad / 100 * 101.3 / 5) * 5
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (tas + tailwind) * grad
      - id: d2
        formula: (tas - tailwind) * grad / 100 * 101.3
      - id: d3
        formula: tas * grad / 100 * 101.3
      - id: d4
        formula: (tas + tailwind) * grad / 100 * 101.3 * 2
    presets:
      - id: p1
        values:
          grad: 4
          tas: 230
          tailwind: 15
      - id: p2
        values:
          grad: 5
          tas: 200
          tailwind: -10
      - id: p3
        values:
          grad: 3
          tas: 250
          tailwind: 20
    explanation: >-
      The groundspeed is the TAS adjusted for the wind. Each knot of groundspeed
      covers about 101.3 ft of horizontal distance per minute, and the height to
      gain over that distance is the gradient times the distance. The result is
      rounded to the nearest 5 ft/min.


      **Solution**


      - Groundspeed: {{tas}} kt + {{tailwind}} kt = {{= tas + tailwind}} kt

      - Horizontal distance per minute: {{= tas + tailwind}} kt × 101.3 = {{=
      (tas + tailwind) * 101.3}} ft

      - {{f: round((tas + tailwind) * grad / 100 * 101.3 / 5) * 5}} = {{n:
      round((tas + tailwind) * grad / 100 * 101.3 / 5) * 5}} = **{{answer}}
      ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the gradient was applied to the groundspeed in knots
      without the conversion to feet.

      - **{{d2}} ft/min**: the tailwind was subtracted instead of added.

      - **{{d3}} ft/min**: the wind was ignored and the TAS was used as the
      groundspeed.

      - **{{d4}} ft/min**: the result was doubled.
