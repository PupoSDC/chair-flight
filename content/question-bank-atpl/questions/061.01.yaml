- id: QULLCIIB
  docId: "061.01"
  relatedQuestions:
    - QJZFVRBA
  externalIds:
    - ATPLQ-613925
    - AVEXAM-83542
    - ATPLGS-110356
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      How long will it take to fly {{distance}} NM at a groundspeed of
      {{groundspeed}} kt?


      Give the answer in minutes and seconds.
    variables:
      - id: distance
        label: Distance
        unit: NM
      - id: groundspeed
        label: Groundspeed
        unit: kt
    answer:
      formula: round(distance / groundspeed * 3600)
      unit: seconds
      decimals: 0
      format: m 'MIN' ss 'SEC'
    distractors:
      - id: d1
        formula: round(distance / groundspeed * 3600 * 2)
      - id: d2
        formula: round(distance / groundspeed * 60)
      - id: d3
        formula: round(distance / groundspeed * 3600 / 1.852)
      - id: d4
        formula: round(distance / groundspeed * 3600 + 60)
    presets:
      - id: p1
        values:
          distance: 5
          groundspeed: 269
      - id: p2
        values:
          distance: 12
          groundspeed: 330
    explanation: >-
      Time is distance divided by groundspeed. The speed is in knots (nautical
      miles per hour), so the result comes out in hours. It is multiplied by
      3600 to get seconds, which can then be shown as minutes and seconds.


      **Solution**


      - Time in hours: {{f: distance / groundspeed}} = {{n: distance /
      groundspeed}} h

      - Time in seconds: {{n: distance / groundspeed * 3600}} s, which is
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the time has been doubled.

      - **{{d2}}**: the result in minutes has been read as seconds.

      - **{{d3}}**: the distance has been converted to kilometres (divided by
      1.852), although it is already in nautical miles.

      - **{{d4}}**: one minute has been added to the time.
