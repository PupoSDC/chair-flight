  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the wind correction angle (WCA) for
      the following:


      - TAS: {{tas}} kt

      - Wind: {{ws}} kt, blowing from {{wa}}° to the right of track


      Give the WCA in degrees.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: ws
        label: Wind speed
        unit: kt
      - id: wa
        label: Wind angle (from the right of track)
        unit: °
    answer:
      formula: ws * sin(wa) * 60 / tas
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: ws * cos(wa) * 60 / tas
      - id: d2
        formula: ws * 60 / tas
      - id: d3
        formula: ws * sin(wa) / tas
      - id: d4
        formula: ws * sin(wa) * 60 / (tas - ws)
    presets:
      - id: p1
        values:
          tas: 240
          ws: 60
          wa: 30
      - id: p2
        values:
          tas: 180
          ws: 60
          wa: 30
      - id: p3
        values:
          tas: 260
          ws: 25
          wa: 50
    explanation: >-
      Mental dead reckoning uses the 1 in 60 rule. The crosswind component is
      the wind speed times the sine of the wind angle. The wind correction angle
      is that crosswind component divided by the TAS, multiplied by 60. A wind
      from the right pushes the aircraft to the left, so the aircraft must head
      to the right of the track by the same angle.


      **Solution**


      Crosswind component: {{= ws * sin(wa)}} kt


      WCA: {{f: ws * sin(wa) * 60 / tas}} = {{n: ws * sin(wa) * 60 / tas}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses the cosine instead of the sine, which gives the
      headwind component.

      - **{{d2}}°**: ignores the wind angle and uses the full wind speed.

      - **{{d3}}°**: forgets the 1 in 60 factor.

      - **{{d4}}°**: divides by the TAS minus the wind speed, mixing up the two
      speeds.
