- id: QTGXTHBU
  docId: "061.01"
  relatedQuestions:
    - QQHTGYOQ
  externalIds:
    - ATPLQ-619176
    - AVEXAM-96171
    - BGS-610380
  annexes: []
  learningObjectives:
    - 061.01.05.04.04
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Given the following information, what is the ETA at B?

      - Track A to B: {{trk}}° T
      - Distance A to B: {{dist}} NM
      - TAS: {{tas}} kt
      - Wind: {{wdir}}° T / {{wspd}} kt
      - ETD at A: {{etd_h}} h {{etd_min}} min UTC

      Give the ETA in UTC (hh:mm).
    variables:
      - id: trk
        label: Track A to B
        unit: °
      - id: dist
        label: Distance A to B
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
      - id: etd_h
        label: ETD hour
        unit: h
      - id: etd_min
        label: ETD minute
        unit: min
    answer:
      formula: 60 * etd_h + etd_min + round(60 * dist / sqrt((tas - wspd * cos(wdir -
        trk))^2 + (wspd * sin(wdir - trk))^2))
      unit: minutes
      decimals: 0
      format: hh:mm 'UTC'
    distractors:
      - id: d1
        formula: 60 * etd_h + etd_min + round(60 * dist / tas)
      - id: d2
        formula: 60 * etd_h + etd_min + round(60 * dist / (tas - wspd))
      - id: d3
        formula: 60 * etd_h + etd_min + round(60 * dist / (tas + wspd * cos(wdir -
          trk)))
      - id: d4
        formula: 60 * etd_h + etd_min + round(60 * dist / (tas - wspd * cos(wdir - trk)
          - abs(wspd * sin(wdir - trk))))
    presets:
      - id: p1
        values:
          trk: 250
          dist: 315
          tas: 450
          wdir: 200
          wspd: 60
          etd_h: 6
          etd_min: 50
      - id: p2
        values:
          trk: 90
          dist: 400
          tas: 300
          wdir: 60
          wspd: 40
          etd_h: 9
          etd_min: 15
      - id: p3
        values:
          trk: 180
          dist: 250
          tas: 200
          wdir: 240
          wspd: 30
          etd_h: 14
          etd_min: 0
    explanation: >-
      The groundspeed comes from the wind triangle. The headwind or tailwind
      changes the speed along the track, and the crosswind is combined with it
      at a right angle. The flight time is the distance divided by that
      groundspeed, and it is added to the departure time.


      **Solution**


      - Wind angle to track: {{= wdir - trk}}°

      - Groundspeed: {{= sqrt((tas - wspd * cos(wdir - trk))^2 + (wspd *
      sin(wdir - trk))^2)}} kt

      - Flight time: {{dist}} NM ÷ {{= sqrt((tas - wspd * cos(wdir - trk))^2 +
      (wspd * sin(wdir - trk))^2)}} kt = {{= 60 * dist / sqrt((tas - wspd *
      cos(wdir - trk))^2 + (wspd * sin(wdir - trk))^2)}} min

      - ETA: {{etd_h}} h {{etd_min}} min + {{= 60 * dist / sqrt((tas - wspd *
      cos(wdir - trk))^2 + (wspd * sin(wdir - trk))^2)}} min = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the wind is ignored, so the TAS is used as the groundspeed.

      - **{{d2}}**: the full wind speed is subtracted from the TAS as if it were
      a headwind.

      - **{{d3}}**: a headwind is added to the TAS instead of subtracted.

      - **{{d4}}**: the crosswind is subtracted instead of being combined at a
      right angle.
- id: QTH4JD6H0
  docId: "061.01"
  relatedQuestions:
    - QKCPDDEV9
  externalIds:
    - ATPLQ-619352
    - BGS-611400
    - AVEXAM-27427
    - ATPLGS-110529
  annexes: []
  learningObjectives:
    - 061.01.05.06.03
  template:
    type: calculation
    question: |-
      Given the following information, calculate the climb gradient.

      - Rate of climb: {{roc}} ft/min
      - TAS: {{tas}} kt
      - Headwind: {{hw}} kt

      What is the climb gradient, in %?
    variables:
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind
        unit: kt
    answer:
      formula: roc / ((tas - hw) * 101.3) * 100
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: roc / (tas * 101.3) * 100
      - id: d2
        formula: roc / ((tas + hw) * 101.3) * 100
      - id: d3
        formula: (tas - hw) * 101.3 / roc
      - id: d4
        formula: roc / ((tas - hw) * 101.3)
    presets:
      - id: p1
        values:
          roc: 740
          tas: 200
          hw: 15
      - id: p2
        values:
          roc: 1200
          tas: 250
          hw: 30
      - id: p3
        values:
          roc: 500
          tas: 160
          hw: 10
    explanation: >-
      The climb gradient is the height gained per unit of horizontal distance
      covered over the ground. At 1 NM per 6 076 ft, one minute at a groundspeed
      of 1 kt covers 101.3 ft, so the gradient is the rate of climb divided by
      the distance covered per minute.


      **Solution**


      Groundspeed = {{tas}} kt − {{hw}} kt = {{= tas - hw}} kt


      Horizontal distance per minute = {{= tas - hw}} × 101.3 = {{= (tas - hw) *
      101.3}} ft


      Climb gradient = {{roc}} ft/min ÷ {{= (tas - hw) * 101.3}} ft × 100 =
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: uses the TAS and ignores the headwind.

      - **{{d2}} %**: adds the headwind instead of subtracting it.

      - **{{d3}}**: inverts the ratio, dividing the distance by the rate of
      climb.

      - **{{d4}} %**: forgets to convert the ratio into a percentage.
- id: QTJJSLWD
  docId: "061.01"
  relatedQuestions:
    - QGRZMESW
  externalIds:
    - ATPLQ-613746
    - AVEXAM-1678
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: >-
      An aircraft starts its descent, given:


      - Top of descent altitude: {{alt_hi}} ft

      - Distance from the top of descent to the initial approach fix (IAF):
      {{dist}} NM

      - Level-off altitude at the IAF: {{alt_lo}} ft


      What descent gradient (%) is required? Use 1 NM = 6 000 ft.
    variables:
      - id: alt_hi
        label: Top of descent altitude
        unit: ft
      - id: dist
        label: Distance to IAF
        unit: NM
      - id: alt_lo
        label: Level-off altitude
        unit: ft
    answer:
      formula: (alt_hi - alt_lo) / (dist * 6000) * 100
      unit: "%"
      decimals: 1
    distractors:
      - id: d1
        formula: atan((alt_hi - alt_lo) / (dist * 6000))
      - id: d2
        formula: alt_hi / (dist * 6000) * 100
      - id: d3
        formula: (alt_hi - alt_lo) / (dist * 6076.12) * 100
      - id: d4
        formula: (alt_hi - alt_lo) / (dist * 6000) * 10
    presets:
      - id: p1
        values:
          alt_hi: 35000
          dist: 75
          alt_lo: 7500
      - id: p2
        values:
          alt_hi: 30000
          dist: 70
          alt_lo: 5000
      - id: p3
        values:
          alt_hi: 25000
          dist: 50
          alt_lo: 3000
    explanation: >-
      The gradient is the height lost for every distance flown, shown as a
      percentage. A 6 % gradient loses 6 ft for every 100 ft flown. The distance
      is first changed into feet using 1 NM = 6 000 ft.


      **Solution**


      - Height to lose: {{f: alt_hi - alt_lo}} = {{n: alt_hi - alt_lo}} ft

      - Distance flown in feet: {{f: dist * 6000}} = {{n: dist * 6000}} ft

      - Gradient: {{f: (alt_hi - alt_lo) / (dist * 6000) * 100}} = **{{answer}}
      %**


      **Why the other answers are wrong**


      - **{{d1}}**: the angle in degrees, not the gradient in percent (an
      arctangent of the same ratio)

      - **{{d2}} %**: forgets to subtract the level-off altitude, so the whole
      height is used

      - **{{d3}} %**: uses the true length of a nautical mile (6 076 ft) instead
      of the 6 000 ft convention

      - **{{d4}} %**: uses a factor of 10 instead of 100, which gives a tenth of
      the true value
- id: QTJKFLZZO
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611172
  annexes: []
  learningObjectives:
    - 061.01.02.01.05
  template:
    type: calculation
    question: |-
      Determine the difference in longitude between two positions:

      - Position X: longitude {{lon_x_d}}°{{lon_x_m}}’E
      - Position Y: longitude {{lon_y_d}}°{{lon_y_m}}’E

      Give the answer in degrees and minutes.
    variables:
      - id: lon_x_d
        label: Longitude of X, degrees
        unit: °
      - id: lon_x_m
        label: Longitude of X, minutes
        unit: ’
      - id: lon_y_d
        label: Longitude of Y, degrees
        unit: °
      - id: lon_y_m
        label: Longitude of Y, minutes
        unit: ’
    answer:
      formula: lon_x_d * 60 + lon_x_m - (lon_y_d * 60 + lon_y_m)
      unit: minutes
      decimals: 0
      format: h'° 'm'’'
    distractors:
      - id: d1
        formula: (lon_x_d - lon_y_d) * 60
      - id: d2
        formula: lon_x_d * 60 + lon_x_m + lon_y_d * 60 + lon_y_m
      - id: d3
        formula: lon_x_d * 60 + lon_x_m - (lon_y_d * 60 + lon_y_m) - 60
      - id: d4
        formula: lon_x_d * 60 + lon_x_m - (lon_y_d * 60 + lon_y_m) + 60
    presets:
      - id: p1
        values:
          lon_x_d: 77
          lon_x_m: 28
          lon_y_d: 58
          lon_y_m: 53
      - id: p2
        values:
          lon_x_d: 100
          lon_x_m: 10
          lon_y_d: 80
          lon_y_m: 45
      - id: p3
        values:
          lon_x_d: 25
          lon_x_m: 30
          lon_y_d: 10
          lon_y_m: 15
    explanation: >-
      Both positions are east of Greenwich, so the difference is the larger
      longitude minus the smaller one. Work in minutes of arc, where 1° = 60’.


      **Solution**


      X − Y = {{lon_x_d}}°{{lon_x_m}}’ − {{lon_y_d}}°{{lon_y_m}}’ = {{= lon_x_d
      * 60 + lon_x_m}}’ − {{= lon_y_d * 60 + lon_y_m}}’ = {{= lon_x_d * 60 +
      lon_x_m - (lon_y_d * 60 + lon_y_m)}}’ = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the minutes are ignored in the subtraction.

      - **{{d2}}**: the two longitudes are added instead of subtracted.

      - **{{d3}}**: one degree (60 minutes) too little is taken.

      - **{{d4}}**: one degree (60 minutes) too much is added.
