    question: >-
      Refer to Jeppesen GSPRM Training Route Manual, chart "E LO 2".


      An aircraft is overhead the position 53°30'N, 009°00'W and its receivers
      are tuned to Shannon VOR (SHA, 52°43'N, 008°53'W) and Connaught VOR (CON,
