- id: QYMLNDZTF
  docId: "061.01"
  relatedQuestions:
    - QMNKRNVX
  externalIds:
    - ATPLQ-619610
    - AVEXAM-97603
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      An aircraft flies from A to B. Given the following information:


      - Ground distance from A to B: {{total}} NM

      - Distance flown when the error is noticed: {{flown}} NM

      - Cross-track error angle: {{angle}}° to the right


      Using the “1 in 60” rule, by how many degrees should the heading be
      changed to the left to reach point B directly?
    variables:
      - id: total
        label: Ground distance from A to B
        unit: NM
      - id: flown
        label: Distance flown
        unit: NM
      - id: angle
        label: Cross-track error angle
        unit: °
    answer:
      formula: angle + flown * tan(angle) * 60 / (total - flown)
      unit: ° left
      decimals: 0
    distractors:
      - id: d1
        formula: angle
      - id: d2
        formula: angle * 2
      - id: d3
        formula: angle + flown * tan(angle)
      - id: d4
        formula: angle + flown * tan(angle) * 60 / total
    presets:
      - id: p1
        values:
          total: 78
          flown: 48
          angle: 5
      - id: p2
        values:
          total: 90
          flown: 50
          angle: 6
      - id: p3
        values:
          total: 120
          flown: 80
          angle: 2
    explanation: >-
      The cross-track error angle, seen from A, shows how far the aircraft has
      drifted off the planned line. The drift in NM is found from the distance
      flown. The 1 in 60 rule turns the drift into a heading change for the
      distance still to go. This is added to the angle already off track, to aim
      directly at B.


      **Solution**


      - Drift off the line: {{n: flown * tan(angle)}} NM

      - Distance still to go to B: {{n: total - flown}} NM

      - Heading change for the drift (1 in 60): {{n: flown * tan(angle) * 60 /
      (total - flown)}}°

      - Total heading change: {{f: angle + flown * tan(angle) * 60 / (total -
      flown)}} = {{n: angle + flown * tan(angle) * 60 / (total - flown)}} =
      **{{answer}}° to the left**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses only the angle off track and ignores the drift.

      - **{{d2}}°**: doubles the angle, which does not follow from the rule.

      - **{{d3}}°**: adds the drift in NM to the angle, mixing units.

      - **{{d4}}°**: divides by the total distance instead of the distance still
      to go.
