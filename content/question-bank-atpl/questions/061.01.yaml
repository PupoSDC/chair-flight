- id: QDWUBUAR
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616839
    - BGS-611257
    - ATPLQ-617082
    - AVEXAM-49760
  annexes: []
  learningObjectives:
    - 061.01.03.02.01
  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the crosswind component, to the
      nearest whole knot, for the following runway and wind:


      - Runway heading: {{rwy}}°

      - Surface wind (magnetic, from the tower): {{wdir}}° / {{wspd}} kt


      What is the crosswind component?
    variables:
      - id: rwy
        label: runway heading
        unit: °
      - id: wdir
        label: wind direction
        unit: °
      - id: wspd
        label: wind speed
        unit: kt
    answer:
      formula: round(wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 60, 1))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: round(wspd * cos(abs(wdir - rwy)))
      - id: d2
        formula: round(wspd * min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 90)
      - id: d3
        formula: round(wspd * min(abs(wdir - rwy), 360 - abs(wdir - rwy)) / 30)
      - id: d4
        formula: round(wspd - wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) /
          60, 1))
    presets:
      - id: p1
        values:
          rwy: 320
          wdir: 5
          wspd: 20
      - id: p2
        values:
          rwy: 130
          wdir: 120
          wspd: 30
      - id: p3
        values:
          rwy: 270
          wdir: 320
          wspd: 30
    explanation: >-
      The crosswind component is the part of the wind that blows across the
      runway. Mental dead reckoning uses the rule of 60: each degree between the
      wind and the runway is worth one sixtieth of the wind speed, so 30° gives
      half the wind speed and 60° gives the full wind speed. The result is
      rounded to the nearest whole knot.


      **Solution**


      Angle between wind and runway: {{= min(abs(wdir - rwy), 360 - abs(wdir -
      rwy))}}°


      Crosswind = {{n: wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) /
      60, 1)}} = {{= wspd * min(min(abs(wdir - rwy), 360 - abs(wdir - rwy)) /
      60, 1)}} kt, rounded to **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the cosine of the angle, which gives the headwind
      part instead of the crosswind part.

      - **{{d2}} kt**: divides by 90 instead of 60.

      - **{{d3}} kt**: divides by 30 instead of 60.

      - **{{d4}} kt**: subtracts the crosswind from the wind speed, mixing up
      the two components.
- id: QDYFLLAP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611559
    - ATPLQ-612308
    - AVEXAM-89459
    - ATPLQ-616028
  annexes: []
  learningObjectives:
    - 061.01.02.01.03
  template:
    type: calculation
    question: |-
      Determine the difference in latitude between two positions, given:

      - Position A: {{lat1_d}}°{{lat1_m}}'{{lat1_s}}'' N
      - Position B: {{lat2_d}}°{{lat2_m}}'{{lat2_s}}'' N

      Give the answer in degrees, minutes and seconds.
    variables:
      - id: lat1_d
        label: Latitude A, degrees
        unit: °
      - id: lat1_m
        label: Latitude A, minutes
        unit: "'"
      - id: lat1_s
        label: Latitude A, seconds
        unit: "''"
      - id: lat2_d
        label: Latitude B, degrees
        unit: °
      - id: lat2_m
        label: Latitude B, minutes
        unit: "'"
      - id: lat2_s
        label: Latitude B, seconds
        unit: "''"
    answer:
      formula: (lat1_d * 3600 + lat1_m * 60 + lat1_s) - (lat2_d * 3600 + lat2_m * 60 +
        lat2_s)
      unit: seconds
      decimals: 0
      format: hh°mm''ss''''
    distractors:
      - id: d1
        formula: (lat1_d - lat2_d) * 60
      - id: d2
        formula: ((lat1_d * 3600 + lat1_m * 60 + lat1_s) - (lat2_d * 3600 + lat2_m * 60
          + lat2_s)) / 100
      - id: d3
        formula: (lat1_d + lat2_d) * 3600 + (lat1_m + lat2_m) * 60 + (lat1_s + lat2_s)
      - id: d4
        formula: (lat1_d - lat2_d - 1) * 3600 + (lat1_m - lat2_m) * 60 + (lat1_s -
          lat2_s)
    presets:
      - id: p1
        values:
          lat1_d: 26
          lat1_m: 35
          lat1_s: 25
          lat2_d: 18
          lat2_m: 24
          lat2_s: 15
      - id: p2
        values:
          lat1_d: 36
          lat1_m: 42
          lat1_s: 37
          lat2_d: 27
          lat2_m: 48
          lat2_s: 5
      - id: p3
        values:
          lat1_d: 37
          lat1_m: 0
          lat1_s: 0
          lat2_d: 21
          lat2_m: 0
          lat2_s: 0
    explanation: >-
      Latitudes are given in degrees, minutes and seconds. The difference is
      found by converting both latitudes to seconds, subtracting, and converting
      the result back to degrees, minutes and seconds. This avoids errors when
      the minutes or seconds of the second position are larger than those of the
      first.


      **Solution**


      Difference in seconds = {{n: lat1_d * 3600 + lat1_m * 60 + lat1_s -
      (lat2_d * 3600 + lat2_m * 60 + lat2_s)}}


      Converted back to degrees, minutes and seconds: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the difference in degrees is converted to minutes instead of
      degrees.

      - **{{d2}}**: the difference is divided by 100, as if the minutes and
      seconds were decimals.

      - **{{d3}}**: the latitudes are added instead of subtracted.

      - **{{d4}}**: one degree too many is borrowed, although no borrowing is
      needed here.
