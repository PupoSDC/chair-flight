  annexes: []
  learningObjectives:
    - 061.01.05.04.04
  template:
    type: calculation
    question: |-
      Determine the ground speed using the following data.

      - True track: {{trk}}°
      - TAS: {{tas}} kt
      - Wind: {{wd}}°/{{ws}} kt

      What is the ground speed?
    variables:
      - id: trk
        label: True track
        unit: °
      - id: tas
        label: TAS
        unit: kt
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: tas - ws * cos(wd - trk)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas
      - id: d2
        formula: tas + ws * sin(wd - trk)
      - id: d3
        formula: tas + ws
      - id: d4
        formula: tas + ws * cos(wd - trk)
    presets:
      - id: p1
        values:
          trk: 300
          tas: 182
          wd: 150
          ws: 25
      - id: p2
        values:
          trk: 90
          tas: 250
          wd: 60
          ws: 40
      - id: p3
        values:
          trk: 200
          tas: 300
          wd: 180
          ws: 20
    explanation: >-
      The wind acts along the track as a headwind or a tailwind. With a small
      wind correction angle, the ground speed is the true airspeed corrected by
      the wind component along the track. Use the wind side of the computer to
      find that component, then apply it to the true airspeed.


      **Solution**


      - Set the true track {{trk}}° against the wind {{wd}}° and the wind speed
      {{ws}} kt on the computer

      - Read the wind component along the track and apply it to the true
      airspeed of {{tas}} kt

      - Ground speed = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: ignores the wind and uses the true airspeed as the ground
      speed.

      - **{{d2}} kt**: uses the crosswind component instead of the component
      along the track.

      - **{{d3}} kt**: adds the full wind speed to the true airspeed.

      - **{{d4}} kt**: applies the wind component with the wrong sign.
