- id: QYESLWUD
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613260
    - ATPLGS-110495
    - AVEXAM-37367
  annexes: []
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: >-
      An aircraft is on the direct track to VOR 'X', {{dist}} NM away, at a
      groundspeed of {{gs}} kt. It is at {{alt_from}} ft at
      {{time_h}}:{{time_m}}, and it must cross VOR 'X' at {{alt_to}} ft.


      - Mean rate of descent: {{rod}} ft/min

      - Mean groundspeed during the descent: {{gs_desc}} kt


      What is the latest time to commence descent? Give the answer as hh:mm.
    variables:
      - id: time_h
        label: Hour of present time
        unit: h
      - id: time_m
        label: Minute of present time
        unit: min
      - id: dist
        label: Distance to VOR
        unit: NM
      - id: gs
        label: Groundspeed
        unit: kt
      - id: alt_from
        label: Present altitude
        unit: ft
      - id: alt_to
        label: Crossing altitude
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs_desc
        label: Groundspeed during descent
        unit: kt
    answer:
      formula: time_h * 60 + time_m + (dist - (alt_from - alt_to) / rod * gs_desc /
        60) / gs * 60
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: time_h * 60 + time_m + dist / gs * 60
      - id: d2
        formula: time_h * 60 + time_m + (dist - (alt_from - alt_to) / rod * gs_desc /
          60) / gs_desc * 60
      - id: d3
        formula: time_h * 60 + time_m + (dist - (alt_from - alt_to) / rod * gs / 60) /
          gs * 60
      - id: d4
        formula: time_h * 60 + time_m + (alt_from - alt_to) / rod
    presets:
      - id: p1
        values:
          time_h: 4
          time_m: 22
          dist: 185
          gs: 320
          alt_from: 37000
          alt_to: 8000
          rod: 1800
          gs_desc: 232
      - id: p2
        values:
          time_h: 9
          time_m: 10
          dist: 150
          gs: 300
          alt_from: 35000
          alt_to: 6000
          rod: 2000
          gs_desc: 250
      - id: p3
        values:
          time_h: 14
          time_m: 5
          dist: 120
          gs: 280
          alt_from: 33000
          alt_to: 4000
          rod: 1500
          gs_desc: 220
    explanation: >-
      The aircraft must start its descent early enough to lose the height before
      it reaches the VOR. During the descent it still covers some distance at
      the descent groundspeed. The rest of the distance to the VOR is flown at
      the cruise groundspeed, and the time for it is added to the present time.


      **Solution**


      - Height to lose: {{alt_from}} ft − {{alt_to}} ft = {{= alt_from -
      alt_to}} ft

      - Descent time at {{rod}} ft/min: {{= (alt_from - alt_to) / rod}} min

      - Distance covered during the descent at {{gs_desc}} kt: {{= (alt_from -
      alt_to) / rod * gs_desc / 60}} NM

      - Distance left to fly at {{gs}} kt: {{dist}} NM − {{= (alt_from - alt_to)
      / rod * gs_desc / 60}} NM = {{= dist - (alt_from - alt_to) / rod * gs_desc
      / 60}} NM

      - Time for that distance: {{= (dist - (alt_from - alt_to) / rod * gs_desc
      / 60) / gs * 60}} min

      - Latest start time: {{time_h}}:{{time_m}} + that time = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: forgets that the aircraft flies some distance during the
      descent

      - **{{d2}}**: uses the descent groundspeed for the distance left

      - **{{d3}}**: uses the cruise groundspeed for the distance covered during
      the descent

      - **{{d4}}**: gives only the descent time and ignores the distance to the
      VOR
- id: QYFKMMRE
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612323
    - AVEXAM-30060
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      An aircraft flies at a constant groundspeed from its take-off point to its
      destination. Determine the arrival time, given:


      - Take-off time: {{t_h}}:{{t_m}}

      - Fix passed: {{dist_fix}} NM from the take-off point, at {{f_h}}:{{f_m}}

      - Distance left to the destination from the fix: {{dist_left}} NM


      What is the arrival time at the destination (hh:mm)?
    variables:
      - id: t_h
        label: take-off hour
        unit: h
      - id: t_m
        label: take-off minutes
        unit: min
      - id: f_h
        label: fix hour
        unit: h
      - id: f_m
        label: fix minutes
        unit: min
      - id: dist_fix
        label: distance to the fix
        unit: NM
      - id: dist_left
        label: distance left from the fix
        unit: NM
    answer:
      formula: round(f_h * 60 + f_m + dist_left * (f_h * 60 + f_m - t_h * 60 - t_m) /
        dist_fix)
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: f_h * 60 + f_m + dist_left
      - id: d2
        formula: round(f_h * 60 + f_m + dist_left * dist_fix / (f_h * 60 + f_m - t_h *
          60 - t_m))
      - id: d3
        formula: round(t_h * 60 + t_m + dist_left * (f_h * 60 + f_m - t_h * 60 - t_m) /
          dist_fix)
      - id: d4
        formula: round(f_h * 60 + f_m + dist_left * (f_h * 60 + f_m - t_h * 60 - t_m) /
          60)
    presets:
      - id: p1
        values:
          t_h: 13
          t_m: 58
          f_h: 14
          f_m: 29
          dist_fix: 59
          dist_left: 78
      - id: p2
        values:
          t_h: 10
          t_m: 12
          f_h: 10
          f_m: 40
          dist_fix: 80
          dist_left: 100
      - id: p3
        values:
          t_h: 8
          t_m: 30
          f_h: 9
          f_m: 50
          dist_fix: 120
          dist_left: 250
    explanation: >-
      At constant groundspeed the time needed for a distance is proportional to
      that distance. The groundspeed is found from the distance flown to the fix
      and the time taken to reach it, and the time for the remaining distance is
      then added to the time at the fix.


      **Solution**


      Time to the fix: {{= (f_h * 60 + f_m - t_h * 60 - t_m)}} minutes


      Groundspeed: {{= dist_fix}} NM in {{= (f_h * 60 + f_m - t_h * 60 - t_m)}}
      min


      Time for the remaining distance: {{= dist_left}} NM x {{= (f_h * 60 + f_m
      - t_h * 60 - t_m)}} min / {{= dist_fix}} NM = {{= (f_h * 60 + f_m - t_h *
      60 - t_m) * dist_left / dist_fix}} min


      Arrival: {{= f_h * 60 + f_m}} min + {{= (f_h * 60 + f_m - t_h * 60 - t_m)
      * dist_left / dist_fix}} min = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the distance left as if it were minutes.

      - **{{d2}}**: inverts the ratio of distance to time, so the groundspeed is
      used in the wrong place.

      - **{{d3}}**: adds the remaining time to the take-off time instead of the
      time at the fix.

      - **{{d4}}**: divides by 60 instead of the distance flown to the fix.
- id: QYFVF3HTD
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613527
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
  template:
    type: calculation
    question: |-
      Find the actual track of the aircraft, given:

      - Planned track: {{pt}}°(T)
      - Pre-flight wind correction angle calculation: {{wca}}° left
      - Actual in-flight drift: {{dr}}° right
    variables:
      - id: pt
        label: planned track
        unit: °
      - id: wca
        label: WCA (left)
        unit: °
      - id: dr
        label: actual drift (right)
        unit: °
    answer:
      formula: pt - wca + dr
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: pt - wca - dr
      - id: d2
        formula: pt + wca - dr
      - id: d3
        formula: pt - dr
    presets:
      - id: p1
        values:
          pt: 157
          wca: 8
          dr: 10
      - id: p2
        values:
          pt: 240
          wca: 6
          dr: 9
      - id: p3
        values:
          pt: 60
          wca: 4
          dr: 7
    explanation: >-
      The heading flown is the planned track plus the WCA (left correction is
      subtracted). The actual track is that heading corrected by the actual
      drift measured in flight (right drift is added).


      **Solution**


      Heading = {{= pt - wca}}°


      Actual track = {{f: pt - wca + dr}} = {{n: pt - wca + dr}} =
      **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°(T)**: the right drift is subtracted instead of added.

      - **{{d2}}°(T)**: the WCA is added and the drift subtracted, both signs
      reversed.

      - **{{d3}}°(T)**: the pre-flight WCA is ignored.
