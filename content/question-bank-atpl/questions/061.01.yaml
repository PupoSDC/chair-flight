- id: QFACG7LEA
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613888
    - BGS-610553
    - ATPLGS-625446
    - AVEXAM-28625
    - BGS-610554
    - AVEXAM-42873
    - AVEXAM-6201
  annexes: []
  learningObjectives:
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      An aircraft departs A at 11:30 UTC and is due at B at the planned time.
      Given the following information:


      - Distance A to B: {{dist}} NM

      - Planned groundspeed: {{gs}} kt

      - Fix obtained {{dist_fix}} NM along track, {{elapsed}} minutes after
      departure


      What groundspeed must be maintained from the fix to reach B at the planned
      ETA?
    variables:
      - id: dist
        label: Distance A to B
        unit: NM
      - id: gs
        label: Planned groundspeed
        unit: kt
      - id: dist_fix
        label: Distance to the fix
        unit: NM
      - id: elapsed
        label: Time to the fix
        unit: min
    answer:
      formula: round((dist - dist_fix) * 60 / (dist / gs * 60 - elapsed) / 5) * 5
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: gs
      - id: d2
        formula: (dist - dist_fix) * 60 / (dist / gs * 60)
      - id: d3
        formula: round(dist_fix * 60 / (dist / gs * 60 - elapsed) / 5) * 5
      - id: d4
        formula: round(dist * 60 / (dist / gs * 60 - elapsed) / 5) * 5
    presets:
      - id: p1
        values:
          dist: 325
          gs: 315
          dist_fix: 165
          elapsed: 35
      - id: p2
        values:
          dist: 400
          gs: 300
          dist_fix: 180
          elapsed: 40
      - id: p3
        values:
          dist: 250
          gs: 280
          dist_fix: 90
          elapsed: 20
    explanation: >-
      The planned time from A to B is fixed by the planned groundspeed. The time
      left from the fix is that planned time minus the time already flown. The
      required groundspeed is the remaining distance divided by the time left,
      rounded to the nearest 5 kt as in the options.


      **Solution**


      Planned time A to B: {{= dist / gs * 60}} min


      Time left from the fix: {{= dist / gs * 60}} − {{elapsed}} = {{= dist / gs
      * 60 - elapsed}} min


      Remaining distance: {{dist}} − {{dist_fix}} = {{= dist - dist_fix}} NM


      Required groundspeed: **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} kt**: keeps the planned groundspeed, so the lost time is not
      made up.

      - **{{d2}} kt**: forgets the time already flown before the fix.

      - **{{d3}} kt**: uses the distance flown to the fix instead of the
      distance remaining.

      - **{{d4}} kt**: uses the full distance A to B instead of the remaining
      distance.
