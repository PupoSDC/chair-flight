- id: QT9PHLLHV
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611072
  annexes:
    - 061-flight-log-f-imai-lfoi-to-sittingbourne-14-3-take-01
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: chart-calculation
    question: >-
      Refer to figure. An aircraft flies from WINDFARM to WIMEREUX and arrives
      at WIMEREUX at 14:42. The distance between the two points is read from the
      map, and the departure time from WINDFARM is read from the figure.


      What is the ground speed (GS) in kt?
    variables:
      - id: distance
        label: Distance WINDFARM to WIMEREUX (read from the map)
        unit: NM
      - id: time_taken
        label: Flight time WINDFARM to WIMEREUX (from the departure time read from the
          figure)
        unit: min
    chartInputs:
      - distance
      - time_taken
    answer:
      formula: distance * 60 / time_taken
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: distance * 60 / (time_taken + 6)
      - id: d2
        formula: distance * 60 / (time_taken - 6)
      - id: d3
        formula: distance * time_taken / 60
      - id: d4
        formula: (distance + 10) * 60 / time_taken
    presets:
      - id: p1
        values:
          distance: 100
          time_taken: 48
      - id: p2
        values:
          distance: 80
          time_taken: 35
      - id: p3
        values:
          distance: 120
          time_taken: 50
    explanation: >-
      Ground speed is the distance covered over the ground in one hour. The
      flight time is the time from the departure time read from the figure to
      the arrival time of 14:42. The distance is divided by this time, converted
      to hours.


      **Solution**


      - Flight time = {{time_taken}} min

      - Ground speed = {{distance}} NM × 60 / {{time_taken}} min = **{{answer}}
      kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the flight time is taken 6 minutes longer than it is.

      - **{{d2}} kt**: the flight time is taken 6 minutes shorter than it is.

      - **{{d3}} kt**: the distance is multiplied by the flight time instead of
      divided.

      - **{{d4}} kt**: the distance is read 10 NM too long.
