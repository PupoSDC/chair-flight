- id: QKYYHEQCQ
  docId: "061.01"
  relatedQuestions:
    - QAIJLTSQA
  externalIds:
    - ATPLQ-615594
  annexes: []
  learningObjectives:
    - 061.01.04.02.01
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      A pilot starts at {{lat}}°N, {{lon}}°W and flies {{dist}} km in a westerly
      direction, keeping the same latitude.


      What will be the final longitude (degrees and minutes W)?
    variables:
      - id: lat
        label: Latitude
        unit: °N
      - id: lon
        label: Start longitude
        unit: °W
      - id: dist
        label: Distance flown
        unit: km
    answer:
      formula: 60 * lon + (dist / 1.852) / cos(lat)
      unit: minutes
      decimals: 0
      format: hh°mm’
    distractors:
      - id: d1
        formula: 60 * lon + (dist / 1.852) * cos(lat)
      - id: d2
        formula: 60 * lon - (dist / 1.852) / cos(lat)
      - id: d3
        formula: 60 * lon + dist / 1.852
      - id: d4
        formula: 60 * lon + (dist / 1.852) / sin(lat)
    presets:
      - id: p1
        values:
          lat: 32
          lon: 25
          dist: 500
      - id: p2
        values:
          lat: 50
          lon: 10
          dist: 300
      - id: p3
        values:
          lat: 60
          lon: 40
          dist: 800
    explanation: >-
      One minute of latitude is one nautical mile, but a minute of longitude is
      only as long as the cosine of the latitude. Flying west at a higher
      latitude therefore covers more minutes of longitude for the same distance.
      The distance is first converted from kilometres to nautical miles.


      **Solution**


      - Distance: {{dist}} km ÷ 1.852 = {{= dist / 1.852}} NM

      - Change of longitude: {{= dist / 1.852}} NM ÷ cos({{lat}}°) = {{= (dist /
      1.852) / cos(lat)}} minutes

      - Final longitude: {{lon}}°00’ + {{= (dist / 1.852) / cos(lat)}}’ =
      **{{answer}} W**


      **Why the other answers are wrong**


      - **{{d1}} W**: the distance is multiplied by the cosine instead of
      divided.

      - **{{d2}} W**: the change is subtracted, which moves the aircraft east
      instead of west.

      - **{{d3}} W**: the latitude is ignored, as if the parallel were the
      equator.

      - **{{d4}} W**: the sine is used instead of the cosine.
