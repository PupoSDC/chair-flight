- id: QPQTGQTD
  docId: "061.01"
  relatedQuestions:
    - Q0HMH10BV
  externalIds:
    - ATPLQ-619578
    - AVEXAM-18962
    - AVEXAM-87935
    - BGS-610398
    - AVEXAM-26340
    - AVEXAM-95505
    - ATPLGS-627943
    - AVEXAM-24277
    - AVEXAM-63586
    - ATPLGS-628158
    - AVEXAM-66029
    - AVEXAM-71242
    - AVEXAM-5368
    - ATPLQ-611184
    - BGS-610428
    - BGS-610439
    - BGS-611609
    - BGS-610426
    - AVEXAM-13625
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: calculation
    question: |-
      Given the following information, calculate the TAS.

      - CAS: {{cas}} kt
      - Pressure altitude: {{pa}} ft
      - OAT: {{oat}} °C

      What is the TAS?
    variables:
      - id: cas
        label: CAS
        unit: kt
      - id: pa
        label: Pressure altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
    answer:
      formula: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756 * pa) ^ 2.62794)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas * sqrt((oat + 273.15) / 288.15) * ((1 - 0.0000068756 * pa) ^
          2.62794)
      - id: d3
        formula: cas / ((1 - 0.0000068756 * pa) ^ 5.25588)
      - id: d4
        formula: cas * (1 + 0.01 * pa / 1000)
    presets:
      - id: p1
        values:
          cas: 135
          pa: 2000
          oat: 10
      - id: p2
        values:
          cas: 137
          pa: 7000
          oat: 15
      - id: p3
        values:
          cas: 180
          pa: 12000
          oat: -10
    explanation: >-
      The TAS is the speed through the air. The CAS is corrected for the thinner
      air at altitude and for the outside air temperature, so the same CAS gives
      a higher TAS at altitude and in warmer air.


      **Solution**


      {{f: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756 * pa) ^
      2.62794)}} = {{n: cas * sqrt((oat + 273.15) / 288.15) / ((1 - 0.0000068756
      * pa) ^ 2.62794)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the CAS as if it were the TAS, ignoring the thinner
      air at altitude.

      - **{{d2}} kt**: applies the altitude correction the wrong way round,
      multiplying instead of dividing.

      - **{{d3}} kt**: divides by the pressure ratio itself instead of its
      square root.

      - **{{d4}} kt**: applies a rough 1% per 1 000 ft rule of thumb instead of
      the density and temperature correction.
