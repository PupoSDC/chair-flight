- id: QVSUUWSP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616205
    - BGS-610529
    - BGS-610534
    - ATPLGS-110507
    - BGS-610510
    - AVEXAM-7761
    - ATPLGS-124375
    - BGS-610535
    - ATPLGS-110521
    - ATPLGS-110512
    - ATPLGS-124387
    - AVEXAM-24901
    - AVEXAM-3416
    - ATPLGS-124388
    - BGS-610512
    - BGS-610513
    - AVEXAM-32270
    - ATPLGS-124389
    - AVEXAM-24176
    - ATPLGS-124374
    - AVEXAM-57424
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      An aircraft must start its descent so that it crosses a VOR at a set
      altitude. Given the following information:


      - Altitude at the start of descent: {{h0}} ft

      - Distance to the VOR at the start of descent: {{dist}} NM

      - Altitude over the VOR: {{h1}} ft

      - Mean ground speed during the descent: {{gs}} kt


      What is the minimum rate of descent required, to the nearest 50 ft/min?
    variables:
      - id: h0
        label: Altitude at start of descent
        unit: ft
      - id: dist
        label: Distance to VOR at start of descent
        unit: NM
      - id: h1
        label: Altitude over the VOR
        unit: ft
      - id: gs
        label: Mean ground speed
        unit: kt
    answer:
      formula: round((h0 - h1) / (dist / gs * 60) / 50) * 50
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: round(h0 / (dist / gs * 60) / 50) * 50
      - id: d2
        formula: round((h0 - h1) / (dist / gs) / 50) * 50
      - id: d3
        formula: round((h0 - h1 - 1000) / (dist / gs * 60) / 50) * 50
      - id: d4
        formula: round((h0 - h1) / (dist / gs * 60 + 2) / 50) * 50
    presets:
      - id: p1
        values:
          h0: 33000
          dist: 65
          h1: 10000
          gs: 330
      - id: p2
        values:
          h0: 25000
          dist: 50
          h1: 8000
          gs: 280
      - id: p3
        values:
          h0: 41000
          dist: 80
          h1: 11000
          gs: 360
    explanation: >-
      The rate of descent is the height to be lost divided by the time
      available. The time comes from the distance to the VOR and the ground
      speed, converted from hours into minutes. The answer is rounded to the
      nearest 50 ft/min, as the options are.


      **Solution**


      - Height to lose: {{n: h0 - h1}} ft

      - Time available: {{n: dist / gs * 60}} min

      - Rate of descent: {{f: (h0 - h1) / (dist / gs * 60)}} = {{n: (h0 - h1) /
      (dist / gs * 60)}} ft/min, which rounds to **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses the altitude at the start of descent instead of
      the height to lose.

      - **{{d2}} ft/min**: forgets to convert the hours into minutes.

      - **{{d3}} ft/min**: uses 1000 ft less than the height to lose.

      - **{{d4}} ft/min**: adds 2 minutes to the time available.
