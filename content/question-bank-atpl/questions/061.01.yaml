- id: QHEQEAVE
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614015
    - BGS-610550
    - AVEXAM-92978
    - ATPLGS-110546
    - ATPLGS-625529
    - ATPLQ-616174
    - ATPLGS-110534
    - AVEXAM-55254
    - BGS-610548
    - ATPLGS-625473
  annexes: []
  learningObjectives:
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      An aircraft is at FL{{fl}} and Mach {{mach}}, with an outside air
      temperature of {{oat}} °C and a headwind component of {{wind}} kt (a
      negative value is a tailwind).


      It is required to reduce speed in order to cross a reporting point
      {{delay}} min later than planned. If the speed reduction is made {{dist}}
      NM from the reporting point, what Mach number is required?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: mach
        label: Initial Mach number
        unit: ""
      - id: oat
        label: Outside air temperature
        unit: °C
      - id: wind
        label: Headwind component
        unit: kt
      - id: delay
        label: Time later than planned
        unit: min
      - id: dist
        label: Distance to the reporting point
        unit: NM
    answer:
      formula: (dist / (dist / (mach * 38.9 * sqrt(273.15 + oat) - wind) + delay / 60)
        + wind) / (38.9 * sqrt(273.15 + oat))
      unit: M
      decimals: 2
    distractors:
      - id: d1
        formula: (dist / (dist / (mach * 38.9 * sqrt(273.15 + oat)) + delay / 60)) /
          (38.9 * sqrt(288.15))
      - id: d2
        formula: (dist / (dist / (mach * 38.9 * sqrt(273.15 + oat) - wind) + delay / 30)
          + wind) / (38.9 * sqrt(273.15 + oat))
      - id: d3
        formula: (dist / (dist / (mach * 38.9 * sqrt(273.15 + oat) - wind) + delay) +
          wind) / (38.9 * sqrt(273.15 + oat))
      - id: d4
        formula: mach
    presets:
      - id: p1
        values:
          fl: 370
          mach: 0.86
          oat: -44
          wind: 110
          delay: 5
          dist: 420
      - id: p2
        values:
          fl: 310
          mach: 0.83
          oat: -30
          wind: 0
          delay: 5
          dist: 360
      - id: p3
        values:
          fl: 350
          mach: 0.8
          oat: -40
          wind: 50
          delay: 4
          dist: 300
    explanation: >-
      The speed of sound depends on the outside air temperature. The groundspeed
      is the true airspeed minus the headwind. Crossing the same distance later
      means flying it at a lower groundspeed, so the new true airspeed is the
      new groundspeed plus the headwind.


      **Solution**


      Speed of sound = 38.9 × √{{= 273.15 + oat}} = {{= 38.9 * sqrt(273.15 +
      oat)}} kt


      Current groundspeed = {{mach}} × {{= 38.9 * sqrt(273.15 + oat)}} −
      {{wind}} = {{= mach * 38.9 * sqrt(273.15 + oat) - wind}} kt


      New groundspeed = {{dist}} NM ÷ ({{dist}} NM ÷ current groundspeed +
      {{delay}} min) = {{= dist / (dist / (mach * 38.9 * sqrt(273.15 + oat) -
      wind) + delay / 60)}} kt


      Required Mach = (new groundspeed + {{wind}}) ÷ {{= 38.9 * sqrt(273.15 +
      oat)}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the speed of sound at ISA sea level is used instead of the
      speed of sound at the actual outside air temperature.

      - **{{d2}}**: the time difference is counted twice, so the new speed is
      too low.

      - **{{d3}}**: the delay in minutes is added as if it were hours.

      - **{{d4}}**: the original Mach number is kept, with no change in speed.
- id: QHINJIOL
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611180
    - BGS-610516
    - AVEXAM-49033
    - ATPLGS-625410
  annexes: []
  learningObjectives:
    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      During an approach the following data are obtained:


      - DME {{dme_1}} NM, altitude {{alt_1}} ft

      - DME {{dme_2}} NM, altitude {{alt_2}} ft

      - TAS: {{tas}} kt

      - Groundspeed: {{gs}} kt


      What is the rate of descent, in ft/min? Round the answer to the nearest 10
      ft/min.
    variables:
      - id: dme_1
        label: First DME distance
        unit: NM
      - id: alt_1
        label: First altitude
        unit: ft
      - id: dme_2
        label: Second DME distance
        unit: NM
      - id: alt_2
        label: Second altitude
        unit: ft
      - id: tas
        label: TAS
        unit: kt
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: round((alt_1 - alt_2) / ((dme_1 - dme_2) / gs * 60) / 10) * 10
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (alt_1 - alt_2) / ((dme_1 - dme_2) / tas * 60)
      - id: d2
        formula: (alt_1 - alt_2) / (dme_1 - dme_2)
      - id: d3
        formula: (alt_1 - alt_2) / ((dme_1 - dme_2) / gs)
      - id: d4
        formula: (alt_1 + alt_2) / ((dme_1 - dme_2) / gs * 60)
    presets:
      - id: p1
        values:
          dme_1: 12
          alt_1: 3000
          dme_2: 9.8
          alt_2: 2400
          tas: 160
          gs: 125
      - id: p2
        values:
          dme_1: 15
          alt_1: 4000
          dme_2: 12.2
          alt_2: 2500
          tas: 150
          gs: 130
    explanation: >-
      The rate of descent is the height lost divided by the time taken. The two
      DME readings give the distance flown between the two points. Dividing that
      distance by the groundspeed gives the time in hours, which is then
      converted to minutes. The TAS is not needed, because the time is taken
      over the ground.


      **Solution**


      - Height lost: {{n: alt_1 - alt_2}} ft

      - Distance flown: {{n: dme_1 - dme_2}} NM

      - Time taken: {{= (dme_1 - dme_2) / gs * 60}} min

      - Rate of descent: {{f: (alt_1 - alt_2) / ((dme_1 - dme_2) / gs * 60)}} =
      {{n: (alt_1 - alt_2) / ((dme_1 - dme_2) / gs * 60)}} ft/min, which rounds
      to **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the TAS is used instead of the groundspeed to work
      out the time.

      - **{{d2}} ft/min**: the height is divided by the distance only, so no
      time is considered.

      - **{{d3}} ft/min**: the time is left in hours, so the result is a rate
      per hour and about 60 times too large.

      - **{{d4}} ft/min**: the two altitudes are added instead of subtracted.
