- id: QRWHNZEWA
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614342
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: >-
      An aircraft is on a glideslope, given:


      - Gradient: {{gradient}}%

      - Height above the runway: {{height}} ft


      How far away from the runway threshold is the aircraft? Give the answer in
      NM.
    variables:
      - id: gradient
        label: Gradient
        unit: "%"
      - id: height
        label: Height above the runway
        unit: ft
    answer:
      formula: height / (gradient / 100) / 6076.12
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: height * gradient / 6076.12
      - id: d2
        formula: height / (gradient / 100)
      - id: d3
        formula: height / (gradient / 100) / 1852
      - id: d4
        formula: height / (gradient / 100) / 6000
    presets:
      - id: p1
        values:
          gradient: 2.3
          height: 12160
      - id: p2
        values:
          gradient: 3
          height: 9000
    explanation: >-
      A glideslope gradient is the height lost per unit of distance flown. The
      distance to the threshold is therefore the height divided by the gradient
      written as a fraction. The result is in feet and is converted to NM, where
      1 NM is 6076 ft.


      **Solution**


      Distance in feet = {{n: height / (gradient / 100)}} ft


      Distance in NM = {{= height / (gradient / 100) / 6076.12}} = **{{answer}}
      NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the height is multiplied by the gradient instead of
      divided.

      - **{{d2}} ft**: the answer is left in feet and not converted to NM.

      - **{{d3}} NM**: the feet are converted with 1852 (the metres in one NM)
      instead of 6076 ft.

      - **{{d4}} NM**: a rounded conversion of 6000 ft per NM is used.
- id: QRXLCZEW
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612872
    - AVEXAM-39420
    - BGS-611211
  annexes: []
  learningObjectives:
    - 061.01.03.02.01
  template:
    type: calculation
    question: >-
      A single-engine class B aeroplane has the following wind limitations:


      - Crosswind: {{xw}} kt

      - Headwind: {{hw}} kt

      - Tailwind: 10 kt


      Consider a take-off from a runway with a heading of {{rwy}}° with the wind
      from {{wdir}}°. Using trigonometry, determine the maximum wind speed which
      keeps the crosswind component below the crosswind limit.


      Give the answer in whole knots, rounded down.
    variables:
      - id: xw
        label: Crosswind limit
        unit: kt
      - id: hw
        label: Headwind limit
        unit: kt
      - id: rwy
        label: Runway heading
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
    answer:
      formula: floor(xw / sin(wdir - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: round(xw / sin(wdir - rwy))
      - id: d2
        formula: xw
      - id: d3
        formula: floor(xw / cos(wdir - rwy))
      - id: d4
        formula: floor(hw / sin(wdir - rwy))
    presets:
      - id: p1
        values:
          xw: 17
          hw: 30
          rwy: 200
          wdir: 265
      - id: p2
        values:
          xw: 16
          hw: 25
          rwy: 180
          wdir: 220
      - id: p3
        values:
          xw: 12
          hw: 35
          rwy: 90
          wdir: 150
    explanation: >-
      The crosswind component is the part of the wind that blows across the
      runway. It is the wind speed times the sine of the angle between the wind
      and the runway. To stay below the crosswind limit the wind speed must be
      low enough, so the answer is rounded down to whole knots.


      **Solution**


      Angle between wind and runway: {{= wdir - rwy}}°


      Maximum wind: {{f: xw / sin(wdir - rwy)}} = {{n: xw / sin(wdir - rwy)}},
      rounded down to **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: rounds to the nearest knot, which lets the crosswind
      component go above the limit.

      - **{{d2}} kt**: is the crosswind limit itself, without applying the
      trigonometry.

      - **{{d3}} kt**: uses the cosine instead of the sine, which gives the
      headwind component.

      - **{{d4}} kt**: uses the headwind limit instead of the crosswind limit.
- id: QRYOOUKF
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611122
    - AVEXAM-52382
  annexes:
    - 061-061-11993-a-diagram-of-points-x-y-z-on
  learningObjectives:
    - 061.01.05.05.01
  template:
    type: chart-calculation
    question: >-
      For this question use annex 061-11993A. Read the distance from 'Y' to 'Z'
      from the annex and take the ground speed as equal to the TAS.


      Given the following:


      - TAS: {{tas}} kt

      - ATA at 'X': 12:32 UTC

      - ETA at 'Y': 12:47 UTC

      - ATA at 'Y': 12:50 UTC


      What is the revised ETA at 'Z'?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: dist_yz
        label: Distance from Y to Z (read from the annex)
        unit: NM
    chartInputs:
      - dist_yz
    answer:
      formula: 770 + dist_yz / tas * 60
      unit: minutes
      decimals: 0
      format: hh:mm 'UTC'
    distractors:
      - id: d1
        formula: 770 + 13
      - id: d2
        formula: 770 + 10
      - id: d3
        formula: 767 + 10
      - id: d4
        formula: 770 + dist_yz / tas * 30
    presets:
      - id: p1
        values:
          tas: 120
          dist_yz: 24
      - id: p2
        values:
          tas: 120
          dist_yz: 36
    explanation: >-
      The revised ETA is the actual time over 'Y' plus the time needed to fly
      from 'Y' to 'Z'. The distance is read from the annex. No wind information
      is given, so the ground speed is taken as the TAS.


      **Solution**


      - Time from 'Y' to 'Z' = distance / speed = {{= dist_yz / tas * 60}} min

      - Revised ETA = ATA at 'Y' (12:50 UTC) + time = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: 13 minutes added to the ATA at 'Y', which is the wrong leg
      time.

      - **{{d2}}**: 10 minutes added to the ATA at 'Y'.

      - **{{d3}}**: the planned ETA at 'Y' (12:47 UTC) is used instead of the
      actual time.

      - **{{d4}}**: the time is worked out at double the speed.
