- id: QQFUXRXE
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614716
    - AVEXAM-10819
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
  template:
    type: calculation
    question: |-
      Given the following information, calculate the actual track.

      - Planned track: {{pt}}°
      - Planned drift angle: {{pd}}° right
      - Actual drift angle: {{ad}}° left
    variables:
      - id: pt
        label: planned track
        unit: °
      - id: pd
        label: planned drift (right)
        unit: °
      - id: ad
        label: actual drift (left)
        unit: °
    answer:
      formula: pt - pd - ad
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: pt + pd + ad
      - id: d2
        formula: pt + pd - ad
      - id: d3
        formula: pt - pd
    presets:
      - id: p1
        values:
          pt: 31
          pd: 6
          ad: 4
      - id: p2
        values:
          pt: 90
          pd: 5
          ad: 3
      - id: p3
        values:
          pt: 245
          pd: 8
          ad: 2
    explanation: >-
      The planned heading is the planned track corrected for the planned drift
      (a right drift needs a heading to the left of track). The aircraft then
      actually drifts by the actual drift angle from that heading, so the actual
      track is the heading plus the actual drift (left drift is subtracted).


      **Solution**


      Heading = {{f: pt - pd}} = {{n: pt - pd}} = {{= pt - pd}}°


      Actual track = {{= pt - pd}} - {{ad}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: both drifts added, ignoring the sign conventions.

      - **{{d2}}°**: the planned drift is added instead of subtracted.

      - **{{d3}}°**: the actual drift is ignored; this is the planned heading,
      not the actual track.
- id: QQHTGYOQ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616860
    - ATPLGS-127786
    - BGS-610457
    - ATPLQ-617911
    - ATPLQ-619873
  annexes: []
  learningObjectives:
    - 061.01.05.04.02
  template:
    type: calculation
    question: |-
      Given the following information, calculate the groundspeed:

      - TAS: {{tas}} kt
      - Heading: {{hdg}}° T
      - Wind: {{wdir}}° T / {{wspd}} kt

      What is the groundspeed in knots?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hdg
        label: Heading
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
    answer:
      formula: sqrt((tas - wspd * cos(wdir - hdg))^2 + (wspd * sin(wdir - hdg))^2)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas + wspd * cos(wdir - hdg)
      - id: d2
        formula: tas - wspd
      - id: d3
        formula: tas - wspd * cos(wdir - hdg) - abs(wspd * sin(wdir - hdg))
      - id: d4
        formula: tas
    presets:
      - id: p1
        values:
          tas: 270
          hdg: 270
          wdir: 205
          wspd: 30
      - id: p2
        values:
          tas: 230
          hdg: 250
          wdir: 205
          wspd: 10
      - id: p3
        values:
          tas: 235
          hdg: 76
          wdir: 40
          wspd: 40
    explanation: >-
      The groundspeed is the speed over the ground. The wind acts on the
      aircraft in two ways. The headwind or tailwind part acts along the heading
      and changes the speed along the track. The crosswind part pushes the
      aircraft sideways. The two parts are combined at a right angle with the
      remaining airspeed.


      **Solution**


      - Wind angle to heading: {{= wdir - hdg}}°

      - Headwind component: {{= wspd * cos(wdir - hdg)}} kt

      - Crosswind component: {{= abs(wspd * sin(wdir - hdg))}} kt

      - {{f: sqrt((tas - wspd * cos(wdir - hdg))^2 + (wspd * sin(wdir -
      hdg))^2)}} = {{n: sqrt((tas - wspd * cos(wdir - hdg))^2 + (wspd * sin(wdir
      - hdg))^2)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the headwind is added instead of subtracted.

      - **{{d2}} kt**: the full wind speed is taken as headwind, ignoring the
      wind angle.

      - **{{d3}} kt**: the crosswind is subtracted like a headwind instead of
      being combined at a right angle.

      - **{{d4}} kt**: the wind is ignored and the TAS is used as the
      groundspeed.
