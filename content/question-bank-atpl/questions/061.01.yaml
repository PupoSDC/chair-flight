- id: QKLTGVLU
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611680
    - AVEXAM-44250
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
    - 061.01.03.01.07
  template:
    type: calculation
    question: >-
      Given a deviation of {{dev}}°, {{var_w}}°W variation and a true heading of
      {{th}}°, what is the compass heading?


      Give the compass heading in degrees.
    variables:
      - id: th
        label: True heading
        unit: °
      - id: var_w
        label: Westerly variation
        unit: °
      - id: dev
        label: Deviation
        unit: °
    answer:
      formula: th + var_w - dev
      unit: °(C)
      decimals: 0
    distractors:
      - id: d1
        formula: th + var_w + dev
      - id: d2
        formula: th - var_w - dev
      - id: d3
        formula: th + var_w
      - id: d4
        formula: th
    presets:
      - id: p1
        values:
          th: 186
          var_w: 12
          dev: -6
      - id: p2
        values:
          th: 90
          var_w: 5
          dev: 2
      - id: p3
        values:
          th: 250
          var_w: 8
          dev: -3
    explanation: >-
      The compass heading is the heading the compass reads. The true heading is
      first corrected for variation to give the magnetic heading, and then for
      deviation to give the compass heading. A westerly variation is added to
      the true heading. Deviation is subtracted, so a negative deviation is
      added.


      **Solution**


      {{f: th + var_w - dev}} = {{n: th + var_w - dev}} = **{{answer}}°(C)**


      **Why the other answers are wrong**


      - **{{d1}}°**: applies the deviation with the wrong sign.

      - **{{d2}}°**: applies the variation with the wrong sign.

      - **{{d3}}°**: gives the magnetic heading, which has not been corrected
      for deviation.

      - **{{d4}}°**: ignores both the variation and the deviation.
- id: QKMDRVFX
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613280
    - AVEXAM-32875
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
    - 061.01.03.02.02
  template:
    type: calculation
    question: |-
      Given the following information, calculate the magnetic heading.

      - True track: {{trk}}°
      - Drift: {{drift}}° right
      - Variation: {{var}}° E
      - Compass heading: {{comp}}°

      What is the magnetic heading?
    variables:
      - id: trk
        label: True track
        unit: °
      - id: drift
        label: Drift (right)
        unit: °
      - id: var
        label: Easterly variation
        unit: °
      - id: comp
        label: Compass heading
        unit: °
    answer:
      formula: trk - drift - var
      unit: °(M)
      decimals: 0
    distractors:
      - id: d1
        formula: trk + drift - var
      - id: d2
        formula: trk - drift + var
      - id: d3
        formula: trk + drift + var
      - id: d4
        formula: trk - drift
      - id: d5
        formula: comp
    presets:
      - id: p1
        values:
          trk: 245
          drift: 5
          var: 3
          comp: 242
      - id: p2
        values:
          trk: 110
          drift: 4
          var: 6
          comp: 105
      - id: p3
        values:
          trk: 300
          drift: 7
          var: 2
          comp: 290
    explanation: >-
      Drift to the right means the track lies to the right of the heading, so
      the true heading is the track minus the drift. An easterly variation is
      then subtracted to turn the true heading into the magnetic heading. The
      compass heading is not needed for this calculation.


      **Solution**


      {{f: trk - drift - var}} = {{n: trk - drift - var}} = **{{answer}}°(M)**


      **Why the other answers are wrong**


      - **{{d1}}°**: adds the drift instead of subtracting it.

      - **{{d2}}°**: adds the variation instead of subtracting it.

      - **{{d3}}°**: adds both the drift and the variation.

      - **{{d4}}°**: stops at the true heading and forgets the variation.

      - **{{d5}}°**: uses the compass heading, which is not the magnetic
      heading.
