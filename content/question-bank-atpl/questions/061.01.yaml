- id: QJREDTSJ4
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611709
  annexes: []
  learningObjectives:
    - 061.01.02.01.03
  template:
    type: calculation
    question: |-
      Two points lie on the same meridian, given:

      - Point A: {{a_d}}° {{a_m}}' {{a_s}}" N
      - Point B: {{b_d}}° {{b_m}}' {{b_s}}" N

      What is the difference in latitude between A and B?
    variables:
      - id: a_d
        label: Latitude A degrees
        unit: °
      - id: a_m
        label: Latitude A minutes
        unit: "'"
      - id: a_s
        label: Latitude A seconds
        unit: '"'
      - id: b_d
        label: Latitude B degrees
        unit: °
      - id: b_m
        label: Latitude B minutes
        unit: "'"
      - id: b_s
        label: Latitude B seconds
        unit: '"'
    answer:
      formula: (a_d * 3600 + a_m * 60 + a_s) - (b_d * 3600 + b_m * 60 + b_s)
      unit: seconds
      decimals: 0
      format: hh'° 'mm'' ss'"S'
    distractors:
      - id: d1
        formula: (a_d * 3600 + a_m * 60 + a_s) + (b_d * 3600 + b_m * 60 + b_s)
      - id: d2
        formula: (a_d - b_d) * 3600 + (a_m - b_m) * 60
      - id: d3
        formula: (a_d * 3600 + a_m * 60 + a_s) - (b_d * 3600 + b_m * 60 + b_s) + 3600
      - id: d4
        formula: (a_d * 60 + a_m) - (b_d * 60 + b_m)
    presets:
      - id: p1
        values:
          a_d: 50
          a_m: 50
          a_s: 47
          b_d: 34
          b_m: 24
          b_s: 36
      - id: p2
        values:
          a_d: 60
          a_m: 10
          a_s: 5
          b_d: 40
          b_m: 30
          b_s: 20
      - id: p3
        values:
          a_d: 52
          a_m: 5
          a_s: 15
          b_d: 37
          b_m: 45
          b_s: 50
    explanation: >-
      Latitude is measured from the equator, so the latitude of B is subtracted
      from the latitude of A. Working in seconds avoids mistakes when a minute
      or a degree has to be borrowed.


      **Solution**


      - Point A in seconds: {{= a_d * 3600 + a_m * 60 + a_s}}

      - Point B in seconds: {{= b_d * 3600 + b_m * 60 + b_s}}

      - Difference: {{f: (a_d * 3600 + a_m * 60 + a_s) - (b_d * 3600 + b_m * 60
      + b_s)}} = {{n: (a_d * 3600 + a_m * 60 + a_s) - (b_d * 3600 + b_m * 60 +
      b_s)}} seconds, which is **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the two latitudes instead of subtracting them

      - **{{d2}}**: forgets the seconds

      - **{{d3}}**: adds one degree by mistake

      - **{{d4}}**: drops the degrees and reads the minutes and seconds as the
      whole answer
