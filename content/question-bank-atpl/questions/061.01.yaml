      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: gs * grad * 2
      - id: d2
        formula: gs / grad
      - id: d3
        formula: gs * grad * 10
      - id: d4
        formula: gs * grad / 10
    presets:
      - id: p1
        values:
          gs: 180
          grad: 6.6
      - id: p2
        values:
          gs: 150
          grad: 5
      - id: p3
        values:
          gs: 200
          grad: 4.5
    explanation: >-
      A climb gradient is the height gained for each unit of horizontal
      distance. At a given groundspeed the aircraft covers a fixed horizontal
      distance every minute, and the vertical speed needed is that distance
      multiplied by the gradient. A rule of thumb is that a 1 % gradient at 100
      kt needs about 100 ft/min.


      **Solution**


      - Vertical speed = groundspeed × gradient = {{gs}} kt × {{grad}}%

      - {{f: gs * grad}} = {{n: gs * grad}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: a factor of two slipped into the calculation.

      - **{{d2}} ft/min**: the gradient was inverted, dividing the groundspeed
      by it.

      - **{{d3}} ft/min**: a factor of ten slipped in, making the result ten
      times too large.

      - **{{d4}} ft/min**: a factor of ten slipped in, making the result ten
      times too small.
