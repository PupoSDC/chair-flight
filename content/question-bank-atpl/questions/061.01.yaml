- id: QKVFROID
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612001
  annexes: []
  learningObjectives:
    - 061.01.02.01.05
  template:
    type: calculation
    question: Calculate the difference in longitude from Oslo (59°54’N,
      {{oslo_d}}°{{oslo_m}}’E) to Sacramento (38°39’N, {{sac_d}}°{{sac_m}}’W).
    variables:
      - id: oslo_d
        label: Oslo longitude, degrees
        unit: °
      - id: oslo_m
        label: Oslo longitude, minutes
        unit: ’
      - id: sac_d
        label: Sacramento longitude, degrees
        unit: °
      - id: sac_m
        label: Sacramento longitude, minutes
        unit: ’
    answer:
      formula: oslo_d * 60 + oslo_m + sac_d * 60 + sac_m
      unit: minutes
      decimals: 0
      format: h'° 'm'’W'
    distractors:
      - id: d1
        formula: abs((oslo_d * 60 + oslo_m) - (sac_d * 60 + sac_m))
      - id: d2
        formula: (oslo_d * 60 + oslo_m + sac_d * 60 + sac_m) / 2
      - id: d3
        formula: 21600 - (oslo_d * 60 + oslo_m + sac_d * 60 + sac_m)
      - id: d4
        formula: oslo_d * 60 + oslo_m + sac_d * 60 + sac_m + 60
    presets:
      - id: p1
        values:
          oslo_d: 10
          oslo_m: 47
          sac_d: 121
          sac_m: 24
      - id: p2
        values:
          oslo_d: 25
          oslo_m: 10
          sac_d: 60
          sac_m: 35
      - id: p3
        values:
          oslo_d: 2
          oslo_m: 30
          sac_d: 170
          sac_m: 5
    explanation: >-
      Oslo is east of Greenwich and Sacramento is west of Greenwich, on opposite
      sides of the zero meridian. The difference is found by adding the two
      longitudes, in minutes of arc, and the result is the angle the short way
      round the Earth.


      **Solution**


      Oslo {{oslo_d}}°{{oslo_m}}’E = {{= oslo_d * 60 + oslo_m}}’


      Sacramento {{sac_d}}°{{sac_m}}’W = {{= sac_d * 60 + sac_m}}’


      Difference = {{= oslo_d * 60 + oslo_m + sac_d * 60 + sac_m}}’ =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the two longitudes are subtracted, as if both were on the
      same side of Greenwich.

      - **{{d2}}**: the sum is halved instead of being used.

      - **{{d3}}**: the angle is taken the long way round, which is 360° minus
      the sum.

      - **{{d4}}**: one degree (60 minutes) is added by mistake.
