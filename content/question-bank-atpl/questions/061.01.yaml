- id: QGIFNVVJ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612924
    - ATPLGS-124341
    - AVEXAM-41670
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      If an aircraft flies with a ground speed of {{gs}} kt for {{mins}} minutes
      and {{secs}} seconds, what ground distance will be covered?


      Give the answer in NM, to one decimal place.
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: mins
        label: Minutes
        unit: min
      - id: secs
        label: Seconds
        unit: s
    answer:
      formula: gs * (mins * 60 + secs) / 3600
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: gs * (mins + secs) / 60
      - id: d2
        formula: gs * mins / 60
      - id: d3
        formula: gs * (mins + secs / 100) / 60
      - id: d4
        formula: gs * (mins * 60 + secs) / 60
    presets:
      - id: p1
        values:
          gs: 135
          mins: 2
          secs: 24
      - id: p2
        values:
          gs: 180
          mins: 3
          secs: 30
      - id: p3
        values:
          gs: 90
          mins: 4
          secs: 20
    explanation: >-
      The time must be converted into hours before it is multiplied by the
      ground speed. Minutes and seconds are first turned into a total number of
      seconds, and then divided by 3600 to give hours.


      **Solution**


      - Time = {{mins}} min and {{secs}} s = {{= mins * 60 + secs}} s = {{=
      (mins * 60 + secs) / 3600}} h

      - {{f: gs * (mins * 60 + secs) / 3600}} = {{n: gs * (mins * 60 + secs) /
      3600}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: adds the minutes and seconds as if they were the same
      unit.

      - **{{d2}} NM**: ignores the seconds.

      - **{{d3}} NM**: reads the seconds as a decimal part of a minute.

      - **{{d4}} NM**: divides by 60 instead of 3600, which mixes up minutes and
      hours.
- id: QGJJESVG
  docId: "061.01"
  relatedQuestions:
    - QXLXFGJX
  externalIds:
    - ATPLQ-613442
    - AVEXAM-97602
  annexes: []
  learningObjectives:
    - 061.01.07.01.04
  template:
    type: calculation
    question: |-
      Calculate the Wind Correction Angle (WCA), given:

      - TAS: {{tas}} kt
      - Crosswind: {{xw}} kt from the right

      Give the WCA in degrees, with + for right and - for left.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: xw
        label: Crosswind
        unit: kt
    answer:
      formula: 60 * xw / tas
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: -60 * xw / tas
      - id: d2
        formula: 100 * xw / tas
      - id: d3
        formula: 60 * xw / (tas + xw)
      - id: d4
        formula: 60 * tas / xw
    presets:
      - id: p1
        values:
          tas: 90
          xw: 20
      - id: p2
        values:
          tas: 120
          xw: 18
      - id: p3
        values:
          tas: 150
          xw: 25
    explanation: >-
      A crosswind pushes the aeroplane sideways, so the heading has to be turned
      into the wind to keep the track. The stronger the crosswind and the slower
      the aeroplane, the larger the correction.


      **Solution**


      Rule of thumb: the WCA in degrees is about 60 times the crosswind divided
      by the TAS.


      {{f: 60 * xw / tas}} = {{n: 60 * xw / tas}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the sign is wrong, the correction for a crosswind from the
      right is to the right (positive).

      - **{{d2}}°**: uses 100 instead of 60 in the rule of thumb.

      - **{{d3}}°**: adds the crosswind to the TAS instead of dividing by the
      TAS.

      - **{{d4}}°**: inverts the ratio and divides the TAS by the crosswind.
- id: QGKADWYO
  docId: "061.01"
  relatedQuestions:
