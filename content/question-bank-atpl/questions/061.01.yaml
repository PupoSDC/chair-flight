- id: QGFAHDLH
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619318
    - AVEXAM-165
  annexes: []
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: >-
      You are on a VFR flight and the traffic circuit altitude of your
      destination has to be established {{extra}} NM before reaching the
      aerodrome. Given:


      - Ground speed: {{gs}} kt

      - Cruising altitude: {{alt1}} ft AMSL

      - Traffic circuit altitude: {{alt2}} ft AMSL

      - Rate of descent: {{rod}} ft/min


      Calculate the shortest distance from the destination where you must
      initiate the descent.
    variables:
      - id: extra
        label: Level-off distance before aerodrome
        unit: NM
      - id: gs
        label: Ground speed
        unit: kt
      - id: alt1
        label: Cruising altitude
        unit: ft
      - id: alt2
        label: Circuit altitude
        unit: ft
      - id: rod
        label: Rate of descent
        unit: ft/min
    answer:
      formula: gs / 60 * (alt1 - alt2) / rod + extra
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: gs / 60 * (alt1 - alt2) / rod
      - id: d2
        formula: gs / 60 * (alt1 - alt2) / rod * 2
      - id: d3
        formula: gs / 60 * (alt1 - alt2) / rod - extra
      - id: d4
        formula: gs / 60 * (alt1 - alt2) / rod + 2 * extra
    presets:
      - id: p1
        values:
          extra: 5
          gs: 130
          alt1: 4500
          alt2: 2500
          rod: 500
      - id: p2
        values:
          extra: 5
          gs: 110
          alt1: 5500
          alt2: 3000
          rod: 600
      - id: p3
        values:
          extra: 3
          gs: 120
          alt1: 4000
          alt2: 2000
          rod: 500
    explanation: >-
      The descent time is the height to lose divided by the rate of descent. The
      descent distance is ground speed times that time, and the extra distance
      before the aerodrome (where the circuit altitude must already be reached)
      is added.


      **Solution**


      Height to lose = {{= alt1 - alt2}} ft

      Time = {{= (alt1 - alt2) / rod}} min

      Descent distance = {{= gs / 60 * (alt1 - alt2) / rod}} NM


      {{f: gs / 60 * (alt1 - alt2) / rod + extra}} = {{n: gs / 60 * (alt1 -
      alt2) / rod + extra}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the extra distance before the aerodrome was forgotten.

      - **{{d2}} NM**: the descent distance was doubled.

      - **{{d3}} NM**: the extra distance was subtracted instead of added.

      - **{{d4}} NM**: the extra distance was counted twice.
