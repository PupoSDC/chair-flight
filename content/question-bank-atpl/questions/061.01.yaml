- id: QXJPGDJM
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613501
    - BGS-610163
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      You depart from point A (N40º 00', E080º 00') and fly a constant true
      track of 270º, given:


      - Ground speed: {{gs}} kt

      - Flight time: {{time}} hours


      What are the coordinates of the position reached?
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: time
        label: Flight time
        unit: h
    answer:
      formula: 4800 - gs * time / cos(40)
      unit: minutes
      decimals: 0
      format: "'N40º 00'''' E'hh'º 'mm''"
    distractors:
      - id: d1
        formula: 4800 - gs * time * cos(40)
      - id: d2
        formula: 4800 - gs * time
      - id: d3
        formula: 4800 + gs * time / cos(40)
      - id: d4
        formula: 4800 - gs * time / cos(50)
    presets:
      - id: p1
        values:
          gs: 120
          time: 6
      - id: p2
        values:
          gs: 300
          time: 4
      - id: p3
        values:
          gs: 250
          time: 10
    explanation: >-
      Flying a track of 270º is flying due west, so you stay on the parallel of
      40º N and only your longitude changes. A minute of longitude is shorter
      than a nautical mile away from the equator, so the change in longitude is
      the distance divided by the cosine of the latitude.


      **Solution**


      - Start longitude E080º 00' is 4800 minutes of arc

      - Change in longitude: {{f: gs * time / cos(40)}} = {{= gs * time /
      cos(40)}} minutes of arc

      - New longitude: 4800 - {{= gs * time / cos(40)}} = {{= 4800 - gs * time /
      cos(40)}} minutes east, which is **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: multiplies by cos 40º instead of dividing, so the change in
      longitude is too small

      - **{{d2}}**: ignores the latitude and treats one NM as one minute of
      longitude, so the change is too small

      - **{{d3}}**: adds the change instead of subtracting it, which moves the
      aircraft east instead of west

      - **{{d4}}**: uses cos 50º, the cosine of the wrong latitude, which
      overstates the change in longitude
