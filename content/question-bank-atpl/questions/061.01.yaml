- id: QBKLPHQO
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615418
    - BGS-610553
    - ATPLGS-625446
    - AVEXAM-28625
    - BGS-610554
    - AVEXAM-42873
    - AVEXAM-6201
  annexes: []
  learningObjectives:
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      Given the following information, what groundspeed must be maintained from
      the fix in order to achieve the planned ETA at B? Round the answer to the
      nearest 10 kt.


      - Distance A to B: {{dist}} NM

      - Planned groundspeed: {{gs_plan}} kt

      - Departure from A: 10:00 UTC

      - Time from departure to the fix: {{elapsed}} min

      - Distance from A to the fix: {{fix}} NM


      What groundspeed must be flown from the fix?
    variables:
      - id: dist
        label: Distance A to B
        unit: NM
      - id: gs_plan
        label: Planned groundspeed
        unit: kt
      - id: fix
        label: Distance A to the fix
        unit: NM
      - id: elapsed
        label: Time from departure to the fix
        unit: min
    answer:
      formula: round((dist - fix) / (dist / gs_plan * 60 - elapsed) * 60 / 10) * 10
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: gs_plan
      - id: d2
        formula: dist / (dist / gs_plan * 60 - elapsed) * 60
      - id: d3
        formula: (dist - fix) / (dist / gs_plan)
      - id: d4
        formula: (dist - fix) / (elapsed / 60)
    presets:
      - id: p1
        values:
          dist: 475
          gs_plan: 315
          fix: 190
          elapsed: 40
      - id: p2
        values:
          dist: 600
          gs_plan: 380
          fix: 240
          elapsed: 50
      - id: p3
        values:
          dist: 300
          gs_plan: 250
          fix: 120
          elapsed: 30
    explanation: >-
      The planned time for the whole leg is the distance divided by the planned
      groundspeed. Part of that time has already been used up, so the time left
      is the planned time minus the time already flown. The distance left from
      the fix divided by the time left gives the groundspeed needed, which is
      rounded to the nearest 10 kt.


      **Solution**


      - Planned time for the whole leg = {{= dist / gs_plan * 60}} min

      - Time left from the fix = {{= dist / gs_plan * 60 - elapsed}} min

      - Distance left from the fix = {{= dist - fix}} NM

      - Groundspeed needed = {{n: (dist - fix) / (dist / gs_plan * 60 - elapsed)
      * 60}} kt, rounded to **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: keeps the planned groundspeed, so the ETA at B is not
      met.

      - **{{d2}} kt**: uses the whole distance from A to B instead of the
      distance left.

      - **{{d3}} kt**: uses the full planned time and ignores the time already
      flown.

      - **{{d4}} kt**: divides the distance left by the time flown so far
      instead of the time left.
- id: QBKXSUWA
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611591
    - BGS-610492
    - ATPLGS-110396
    - ATPLQ-615320
    - ATPLQ-614927
    - AVEXAM-61756
    - ATPLQ-611876
    - ATPLGS-625450
    - AVEXAM-32368
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: |-
      Calculate the Mach number, given the following:

      - True airspeed: {{tas}} kt
      - Pressure altitude: {{alt}} ft
      - ISA deviation: {{isa_dev}} °C

      What is the Mach number?
    variables:
      - id: tas
        label: True airspeed
        unit: kt
      - id: alt
        label: Pressure altitude
        unit: ft
      - id: isa_dev
        label: ISA deviation
        unit: °C
    answer:
      formula: tas / (38.9 * sqrt(max(216.65, 288.15 - 0.0019812 * alt) + isa_dev))
      unit: M
      decimals: 2
    distractors:
      - id: d1
        formula: tas / (38.9 * sqrt(max(216.65, 288.15 - 0.0019812 * alt) + 2 *
          isa_dev))
      - id: d2
        formula: tas / (38.9 * sqrt(max(216.65, 288.15 - 0.0019812 * alt)))
      - id: d3
        formula: tas / (38.9 * sqrt(288.15 + isa_dev))
      - id: d4
        formula: 38.9 * sqrt(max(216.65, 288.15 - 0.0019812 * alt) + isa_dev) / tas
    presets:
      - id: p1
        values:
          tas: 488
          alt: 32000
          isa_dev: 15
      - id: p2
        values:
          tas: 487
          alt: 33000
          isa_dev: 15
      - id: p3
        values:
          tas: 440
          alt: 39000
          isa_dev: 15
      - id: p4
        values:
          tas: 480
          alt: 41000
          isa_dev: 8
    explanation: >-
      The Mach number is the true airspeed divided by the speed of sound. The
      speed of sound depends only on the air temperature, which is the ISA
      temperature at the altitude plus the ISA deviation. Above about 36 000 ft
      the ISA temperature stays at -56.5 °C (216.65 K).


      **Solution**


      ISA temperature at {{alt}} ft = {{= max(216.65, 288.15 - 0.0019812 *
      alt)}} K


      Air temperature with the deviation of {{isa_dev}} °C = {{= max(216.65,
      288.15 - 0.0019812 * alt) + isa_dev}} K


      Speed of sound = 38.9 × √{{= max(216.65, 288.15 - 0.0019812 * alt) +
      isa_dev}} = {{= 38.9 * sqrt(max(216.65, 288.15 - 0.0019812 * alt) +
      isa_dev)}} kt


      {{f: tas / (38.9 * sqrt(max(216.65, 288.15 - 0.0019812 * alt) +
      isa_dev))}} = {{n: tas / (38.9 * sqrt(max(216.65, 288.15 - 0.0019812 *
      alt) + isa_dev))}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the ISA deviation is counted twice, so the air temperature
      and the speed of sound are too high.

      - **{{d2}}**: the ISA deviation is forgotten, so the air is treated as
      standard.

      - **{{d3}}**: the temperature at sea level is used instead of the
      temperature at the altitude.

      - **{{d4}}**: the ratio is inverted, giving the speed of sound divided by
      the true airspeed.
