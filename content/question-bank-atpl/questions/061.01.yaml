- id: QKO8DZBM9
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611128
    - AVEXAM-65167
    - AVEXAM-13887
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: |-
      Given the following information, calculate the TAS.

      - Altitude: 27 000 ft
      - Mach number: 0.{{mh}}
      - OAT: {{oat}} °C

      What is the TAS?
    variables:
      - id: mh
        label: Mach number (x 100)
        unit: ""
      - id: oat
        label: Outside air temperature
        unit: °C
    answer:
      formula: mh / 100 * 38.967 * sqrt(oat + 273.15)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mh / 100 * 661.5
      - id: d2
        formula: mh / 100 * 38.967 * sqrt(273.15 - oat)
      - id: d3
        formula: mh / 100 * 38.967 * sqrt(oat + 273.15) / 1.852
      - id: d4
        formula: mh / 100 * 661.5 * (oat + 273.15) / 288.15
    presets:
      - id: p1
        values:
          mh: 86
          oat: -45
      - id: p2
        values:
          mh: 80
          oat: -50
      - id: p3
        values:
          mh: 75
          oat: -30
    explanation: >-
      The TAS is the Mach number multiplied by the speed of sound at the outside
      air temperature. Altitude does not change the speed of sound here, only
      the temperature does.


      **Solution**


      - Speed of sound: {{f: 38.967 * sqrt(oat + 273.15)}} = {{n: 38.967 *
      sqrt(oat + 273.15)}} kt

      - TAS: {{f: mh / 100 * 38.967 * sqrt(oat + 273.15)}} = {{n: mh / 100 *
      38.967 * sqrt(oat + 273.15)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the sea level speed of sound, with no correction for
      the temperature.

      - **{{d2}} kt**: subtracts the temperature from 273.15 instead of adding
      it, so the speed of sound is far too high.

      - **{{d3}} kt**: divides by 1.852, which turns the answer into km/h, a
      unit mistake.

      - **{{d4}} kt**: uses the ratio of the temperatures instead of the square
      root of the ratio.
