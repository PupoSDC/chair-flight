- id: QHSSJZGV
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612848
  annexes: []
  learningObjectives:
    - 061.01.05.06.03
  template:
    type: calculation
    question: >-
      An aircraft follows an approach procedure that requires an approximate
      descent gradient. During the descent its average groundspeed is:


      - Descent gradient: {{gradient}}%

      - Groundspeed: {{groundspeed}} kt


      What vertical speed in ft/min is required during the descent?
    variables:
      - id: gradient
        label: Descent gradient
        unit: "%"
      - id: groundspeed
        label: Groundspeed
        unit: kt
    answer:
      formula: round(groundspeed * gradient / 10) * 10
      unit: ft/min
      decimals: 1
    distractors:
      - id: d1
        formula: round(groundspeed / gradient * 60 / 10) * 10
      - id: d2
        formula: round(groundspeed * gradient * 1.5 / 10) * 10
      - id: d3
        formula: round(groundspeed * gradient / 0.6 / 10) * 10
      - id: d4
        formula: round(groundspeed * gradient / 100 * 1000 / 10) * 10
    presets:
      - id: p1
        values:
          gradient: 6.6
          groundspeed: 185
      - id: p2
        values:
          gradient: 5.2
          groundspeed: 210
      - id: p3
        values:
          gradient: 8
          groundspeed: 150
    explanation: >-
      A descent gradient converts to a vertical speed with a rule of thumb: the
      vertical speed in ft/min is about the groundspeed in knots multiplied by
      the gradient in per cent. The result is rounded here to the nearest 10
      ft/min.


      **Solution**


      - {{f: groundspeed * gradient}} = {{n: groundspeed * gradient}} ft/min

      - Rounded to the nearest 10 ft/min: **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: divides by the gradient instead of multiplying by it

      - **{{d2}} ft/min**: multiplies by 1.5, which overstates the descent rate

      - **{{d3}} ft/min**: divides by 0.6, a factor with no basis in the rule

      - **{{d4}} ft/min**: moves the decimal point of the gradient, giving ten
      times too much
