- id: QJZFVRBA
  docId: "061.01"
  relatedQuestions:
    - QULLCIIB
  externalIds:
    - ATPLQ-612581
    - ATPLGS-124366
    - AVEXAM-96091
    - BGS-610383
    - ATPLGS-124372
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: |-
      Calculate the time from A to B, given:

      - Groundspeed: {{groundspeed}} kt
      - Distance from A to B: {{distance}} NM

      Give the answer in hours and minutes.
    variables:
      - id: groundspeed
        label: Groundspeed
        unit: kt
      - id: distance
        label: Distance
        unit: NM
    answer:
      formula: round(distance / groundspeed * 60)
      unit: minutes
      decimals: 0
      format: h 'hours' m 'minutes'
    distractors:
      - id: d1
        formula: round(distance / groundspeed * 60 + 60)
      - id: d2
        formula: round(distance / groundspeed)
      - id: d3
        formula: round(groundspeed / distance * 60)
      - id: d4
        formula: round(distance / groundspeed * 60 / 1.852)
    presets:
      - id: p1
        values:
          groundspeed: 435
          distance: 1920
      - id: p2
        values:
          groundspeed: 380
          distance: 1250
    explanation: >-
      Time is distance divided by groundspeed. The result is in hours, so it is
      multiplied by 60 to get minutes, which are then split into hours and
      minutes.


      **Solution**


      - Time in hours: {{f: distance / groundspeed}} = {{n: distance /
      groundspeed}} h

      - Time in minutes: {{n: distance / groundspeed * 60}} min, which is
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: one hour has been added to the time.

      - **{{d2}}**: the time in hours has been taken as minutes.

      - **{{d3}}**: the ratio has been inverted, dividing the groundspeed by the
      distance.

      - **{{d4}}**: the distance has been converted to kilometres (divided by
      1.852), although it is already in nautical miles.
- id: QKAESLX6L
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617587
    - AVEXAM-93153
    - AVEXAM-35116
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      A planned track runs due north along the meridian 073°00' W. The aircraft
      is west of the track at the following position:


      - Latitude: {{lat}}° N

      - Longitude: 073°{{lonmin}}' W


      What is the cross-track distance from the planned track, in NM to one
      decimal place?
    variables:
      - id: lat
        label: latitude
        unit: °
      - id: lonmin
        label: minutes of longitude west of the track
        unit: "'"
    answer:
      formula: lonmin * cos(lat)
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: lonmin * sin(lat)
      - id: d2
        formula: lonmin
      - id: d3
        formula: lonmin / 60 * cos(lat)
      - id: d4
        formula: lonmin * cos(lat) * 1.852
    presets:
      - id: p1
        values:
          lat: 54
          lonmin: 15
      - id: p2
        values:
          lat: 40
          lonmin: 20
      - id: p3
        values:
          lat: 60
          lonmin: 35
    explanation: >-
      The cross-track distance is the shortest distance from the aircraft to the
      planned track. Along a meridian, one minute of longitude is 1 NM only at
      the equator. At other latitudes it is shorter by the cosine of the
      latitude. The track runs north, so the aircraft, being west of it, is to
      the left of the track.


      **Solution**


      - {{f: lonmin * cos(lat)}} = {{n: lonmin * cos(lat)}} = **{{answer}} NM**
      to the left of track


      **Why the other answers are wrong**


      - **{{d1}} NM**: the sine of the latitude was used instead of the cosine.

      - **{{d2}} NM**: the latitude was ignored and the minutes of longitude
      were used as a distance.

      - **{{d3}} NM**: the minutes were divided by 60, as if they were degrees.

      - **{{d4}} NM**: a kilometre factor (1.852) was applied, so the value is
      in kilometres, not nautical miles.
