- id: QXLXFGJX
  docId: "061.01"
  relatedQuestions:
    - QGJJESVG
  externalIds:
    - ATPLQ-612793
    - AVEXAM-66082
    - ATPLGS-627166
  annexes: []
  learningObjectives:
    - 061.01.07.01.04
  template:
    type: calculation
    question: |-
      Calculate the Wind Correction Angle (WCA), given:

      - TAS: {{tas}} kt
      - Crosswind: {{xw}} kt from the left

      Give the WCA in degrees, with + for right and - for left.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: xw
        label: Crosswind
        unit: kt
    answer:
      formula: -60 * xw / tas
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: 60 * xw / tas
      - id: d2
        formula: -100 * xw / tas
      - id: d3
        formula: -60 * xw / (tas + xw)
      - id: d4
        formula: -60 * tas / xw
    presets:
      - id: p1
        values:
          tas: 120
          xw: 21
      - id: p2
        values:
          tas: 150
          xw: 12
      - id: p3
        values:
          tas: 90
          xw: 15
    explanation: >-
      A crosswind pushes the aeroplane sideways, so the heading has to be turned
      into the wind to keep the track. The stronger the crosswind and the slower
      the aeroplane, the larger the correction. A crosswind from the left needs
      a correction to the left, which is a negative WCA here.


      **Solution**


      Rule of thumb: the WCA in degrees is about 60 times the crosswind divided
      by the TAS.


      {{f: -60 * xw / tas}} = {{n: -60 * xw / tas}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the sign is wrong, the correction for a crosswind from the
      left is to the left.

      - **{{d2}}°**: uses 100 instead of 60 in the rule of thumb.

      - **{{d3}}°**: adds the crosswind to the TAS instead of dividing by the
      TAS.

      - **{{d4}}°**: inverts the ratio and divides the TAS by the crosswind.
