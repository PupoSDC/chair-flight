  template:
    type: calculation
    question: >-
      Calculate the air distance travelled in {{time}} minutes, comparing to the
      ground distance travelled. Given:


      - Ground speed: {{gs}} kt

      - True airspeed: {{tas}} kt
    variables:
      - id: gs
        label: GS
        unit: kt
      - id: tas
        label: TAS
        unit: kt
      - id: time
        label: time
        unit: min
    answer:
      formula: tas * time / 60
      unit: NAM
      decimals: 0
    distractors:
      - id: d1
        formula: gs * time / 60
      - id: d2
        formula: tas * time / 60 * tas / gs
      - id: d3
        formula: tas * time / 100
    presets:
      - id: p1
        values:
          gs: 135
          tas: 168
          time: 48
      - id: p2
        values:
          gs: 90
          tas: 105
          time: 12.5
      - id: p3
        values:
          gs: 100
          tas: 120
          time: 30
    explanation: >-
      Air distance is the distance covered relative to the air, so it depends on
      TAS, not on ground speed. It equals TAS times the time in hours.


      **Solution**


      {{f: tas * time / 60}} = {{n: tas * time / 60}} = **{{answer}} NAM**


      **Why the other answers are wrong**


      - **{{d1}} NAM**: ground speed is used, which gives the ground distance.

      - **{{d2}} NAM**: the TAS/GS correction is applied a second time.

      - **{{d3}} NAM**: minutes are treated as hundredths of an hour (division
      by 100 instead of 60).
- id: QGHXGWSF5
  docId: "061.01"
  relatedQuestions:
    - QEJOVSKX
  externalIds:
    - ATPLQ-615212
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      Determine the minimum distance along the surface of the Earth between two
      positions on the same meridian:


      - Position A: {{lat1_d}}°{{lat1_m}}'N, {{lon_d}}°{{lon_m}}'W

      - Position B: {{lat2_d}}°{{lat2_m}}'S, {{lon_d}}°{{lon_m}}'W


      What is the distance in NM?
    variables:
      - id: lat1_d
        label: Latitude A, degrees
        unit: °
      - id: lat1_m
        label: Latitude A, minutes
        unit: "'"
      - id: lat2_d
        label: Latitude B, degrees
        unit: °
      - id: lat2_m
        label: Latitude B, minutes
        unit: "'"
      - id: lon_d
        label: Longitude, degrees
        unit: °
      - id: lon_m
        label: Longitude, minutes
        unit: "'"
    answer:
      formula: 60 * ((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60))
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: 60 * ((lat1_d + lat1_m / 60) - (lat2_d + lat2_m / 60))
      - id: d2
        formula: 60 * ((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60)) * 1.852
      - id: d3
        formula: 60 * (lat1_d + lat2_d)
      - id: d4
        formula: ((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60))
    presets:
      - id: p1
        values:
          lat1_d: 53
          lat1_m: 30
          lat2_d: 27
          lat2_m: 35
          lon_d: 1
          lon_m: 30
      - id: p2
        values:
          lat1_d: 45
          lat1_m: 15
          lat2_d: 12
          lat2_m: 40
          lon_d: 10
          lon_m: 0
      - id: p3
        values:
          lat1_d: 62
          lat1_m: 0
          lat2_d: 3
          lat2_m: 20
          lon_d: 5
          lon_m: 45
    explanation: >-
      Both positions lie on the same meridian, so the shortest distance is the
      arc along that meridian. The positions are on opposite sides of the
      equator, so the two latitudes are added. One degree of arc equals 60 NM.


      **Solution**


      {{f: 60 * ((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60))}} = {{n: 60 *
      ((lat1_d + lat1_m / 60) + (lat2_d + lat2_m / 60))}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the latitudes are subtracted, as if both positions were
      on the same side of the equator.

      - **{{d2}} NM**: the distance is converted to kilometres and written as
      nautical miles.

      - **{{d3}} NM**: the minutes of latitude are ignored.

      - **{{d4}} NM**: the arc is left in degrees and not converted to nautical
      miles.
