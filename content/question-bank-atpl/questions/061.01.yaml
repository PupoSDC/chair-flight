- id: QBOPSUSMQ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613482
    - ATPLQ-614825
    - ATPLGS-628136
    - BGS-611224
    - AVEXAM-59491
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      An aircraft is cruising at FL{{fl}} with an outside air temperature of
      {{oat}} °C.


      - Distance to go: {{dist}} NM

      - Time available to cover it: {{minutes}} minutes

      - Headwind component: {{hw}} kt


      What Mach number must be flown to meet the required time?
    variables:
      - id: fl
        label: Flight level
        unit: FL
      - id: oat
        label: Outside air temperature
        unit: °C
      - id: dist
        label: Distance to go
        unit: NM
      - id: minutes
        label: Time available
        unit: min
      - id: hw
        label: Headwind component
        unit: kt
    answer:
      formula: (round(dist / (minutes / 60)) + hw) / (38.97 * sqrt(273.15 + oat))
      unit: ""
      decimals: 2
    distractors:
      - id: d1
        formula: (round(dist / (minutes / 60)) - hw) / (38.97 * sqrt(273.15 + oat))
      - id: d2
        formula: round(dist / (minutes / 60)) / (38.97 * sqrt(273.15 + oat))
      - id: d3
        formula: (round(dist / (minutes / 60)) + 2 * hw) / (38.97 * sqrt(273.15 + oat))
    presets:
      - id: p1
        values:
          fl: 330
          oat: -48
          dist: 570
          minutes: 82
          hw: 52
      - id: p2
        values:
          fl: 290
          oat: -43
          dist: 550
          minutes: 85
          hw: 70
      - id: p3
        values:
          fl: 310
          oat: -40
          dist: 400
          minutes: 70
          hw: 30
    explanation: >-
      The true airspeed needed is the groundspeed for the time available plus
      the headwind. The Mach number is that true airspeed divided by the speed
      of sound at the outside air temperature. On the flight computer these
      steps are read off the scales.


      **Solution**


      - Set the distance ({{dist}} NM) against the time available ({{minutes}}
      min) to read the groundspeed needed.

      - Add the headwind of {{hw}} kt to find the true airspeed.

      - Set the outside air temperature ({{oat}} °C) against the true airspeed
      to read the Mach number: **{{answer}}**.


      **Why the other answers are wrong**


      - **{{d1}}**: the headwind is subtracted instead of added.

      - **{{d2}}**: the headwind is left out.

      - **{{d3}}**: the headwind is counted twice.
