  template:
    type: chart
    question: >-
      An aircraft is flying from A to B on a true course of {{course}}°(T). The
      forecast wind is {{wdir}}°(T) / {{wspd}} kt and the TAS is {{tas}} kt.
      After {{time}} minutes of flying with the planned TAS and heading, the
      aircraft is {{north}} NM north of the intended track and {{ahead}} NM
      ahead of the dead reckoning position.


      What is the track angle error (TKE)?
    explanation: ""
    variables:
      - id: course
        label: True course
        unit: °(T)
      - id: wdir
        label: Wind direction
        unit: °(T)
      - id: wspd
        label: Wind speed
        unit: kt
      - id: tas
        label: TAS
        unit: kt
      - id: time
        label: Time flown
        unit: min
      - id: north
        label: Offset north of track
        unit: NM
      - id: ahead
        label: Ahead of dead reckoning
        unit: NM
    entries:
      - id: e1
        values:
          course: 90
          wdir: 225
          wspd: 20
          tas: 110
          time: 15
          north: 4
          ahead: 3
        answer: 8°L
        wrongAnswers:
          - 4°L
          - 12°R
          - 5°R
        explanation: >-
          The track angle error is the angle at which the aircraft has drifted
          off the intended track. The aircraft has flown a known distance along
          its track. The sideways offset from the intended track, seen from that
          distance, gives the angle, and the side of the offset gives the
          direction.


          **Solution**


          Distance flown = 110 kt x 15 min = 27.5 NM. The offset of 4 NM at 27.5
          NM along track gives an angle of about 8°. North of a track of 090° is
          to the left, so the error is 8° left.


          **Why the other answers are wrong**


          - **4°L**: the offset is used as the angle, without relating it to the
          distance flown.

          - **12°R**: the wrong direction, and an angle that is too large.

          - **5°R**: the wrong direction, and the distance flown is wrong.
      - id: e2
        values:
          course: 270
          wdir: 45
          wspd: 15
          tas: 150
          time: 15
          north: 2
          ahead: 2.5
        answer: 3° R
        wrongAnswers:
          - 2° L
          - 2° R
          - 5° L
        explanation: >-
          The track angle error is the angle at which the aircraft has drifted
          off the intended track. The aircraft has flown a known distance along
          its track. The sideways offset from the intended track, seen from that
          distance, gives the angle, and the side of the offset gives the
          direction.


          **Solution**


          Distance flown = 150 kt x 15 min = 37.5 NM. The offset of 2 NM at 37.5
          NM along track gives an angle of about 3°. North of a track of 270° is
          to the right, so the error is 3° right.


          **Why the other answers are wrong**


          - **2° L**: the wrong direction, and the offset is used as the angle.

          - **2° R**: the offset is used as the angle, without relating it to
          the distance flown.

          - **5° L**: the wrong direction, and the distance flown is wrong.
- id: QMSTDISP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612133
    - BGS-611465
    - AVEXAM-27786
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: What approximate descent angle is required for an aircraft to descend
      {{alt}} ft over a ground distance of {{dist}} NM?
    variables:
      - id: alt
        label: Altitude to lose
        unit: ft
      - id: dist
        label: Ground distance
        unit: NM
    answer:
      formula: atan(alt / (dist * 6076))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: atan(alt / (dist * 1852))
      - id: d2
        formula: 100 * alt / (dist * 6076)
      - id: d3
        formula: atan(alt / (dist * 1000))
      - id: d4
        formula: atan(alt * 0.3048 / (dist * 6076))
    presets:
      - id: p1
        values:
          alt: 13500
          dist: 45
      - id: p2
        values:
          alt: 20000
          dist: 50
      - id: p3
        values:
          alt: 15000
          dist: 30
    explanation: >-
      The descent angle is the arctangent of the height to lose divided by the
      ground distance, both in the same unit. 1 NM is about 6076 ft.


      **Solution**


      Distance = {{= dist * 6076}} ft


      {{f: atan(alt / (dist * 6076))}} = {{n: atan(alt / (dist * 6076))}} =
      **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: 1 NM was taken as 1852 ft (that is metres).

      - **{{d2}}°**: the gradient in percent was given as if it were degrees.

      - **{{d3}}°**: 1 NM was taken as 1000 ft.

      - **{{d4}}°**: the altitude was converted to metres while the distance was
      kept in feet.
- id: QMTLYQMB
  docId: "061.01"
  relatedQuestions:
    - QXTXPZLU
  externalIds:
    - ATPLQ-614604
    - ATPLGS-625453
    - AVEXAM-55770
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: |-
      An aircraft descends from FL250 to FL100.

      - Rate of descent: {{rod}} ft/min
      - Groundspeed: {{gs}} kt

      What is the flight path angle in degrees (one decimal place)?
    variables:
      - id: rod
        label: Rate of descent
        unit: ft/min
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: atan(rod / (gs * 6076.12 / 60))
      unit: °
      decimals: 1
    distractors:
      - id: d1
        formula: 2 * atan(rod / (gs * 6076.12 / 60))
      - id: d2
        formula: atan(rod / (gs * 6076.12 / 30))
      - id: d3
        formula: atan(15000 / (gs * 6076.12 / 60))
      - id: d4
        formula: atan(rod / (gs * 1852 / 60))
    presets:
      - id: p1
        values:
          rod: 1000
          gs: 360
      - id: p2
        values:
          rod: 1500
          gs: 420
      - id: p3
        values:
          rod: 600
          gs: 300
    explanation: >-
      The flight path angle is the angle of the descent path below the
      horizontal. Its tangent is the rate of descent divided by the speed over
      the ground, both in the same units. The groundspeed in knots is converted
      to feet per minute by multiplying by 6076 ft per NM and dividing by 60
      minutes.


      **Solution**


      - Groundspeed in feet per minute: {{gs}} kt × 6076 ÷ 60 = {{= gs * 6076.12
      / 60}} ft/min

      - Angle: {{f: atan(rod / (gs * 6076.12 / 60))}} = {{n: atan(rod / (gs *
      6076.12 / 60))}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the angle is doubled.

      - **{{d2}}°**: the groundspeed is converted with 30 minutes instead of 60,
      which doubles the speed in feet per minute.

      - **{{d3}}°**: the 15000 ft height change is used instead of the rate of
      descent.

      - **{{d4}}°**: the groundspeed is converted with 1852 m per NM instead of
      6076 ft per NM.
