- id: QDZTWXFP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612952
    - AVEXAM-72970
  annexes: []
  learningObjectives:
    - 061.01.05.05.01
  template:
    type: calculation
    question: >-
      Refer to the OFP. The TAS and time for each route leg are:


      | Leg | TAS (kt) | Time (min) |

      | --- | --- | --- |

      | 1 | {{tas1}} | {{t1}} |

      | 2 | {{tas2}} | {{t2}} |

      | 3 | {{tas3}} | {{t3}} |

      | 4 | {{tas4}} | {{t4}} |

      | 5 | {{tas5}} | {{t5}} |


      What is the average TAS for the route, weighted by the time on each leg?
      Give the answer in kt.
    variables:
      - id: tas1
        label: TAS leg 1
        unit: kt
      - id: t1
        label: Time leg 1
        unit: min
      - id: tas2
        label: TAS leg 2
        unit: kt
      - id: t2
        label: Time leg 2
        unit: min
      - id: tas3
        label: TAS leg 3
        unit: kt
      - id: t3
        label: Time leg 3
        unit: min
      - id: tas4
        label: TAS leg 4
        unit: kt
      - id: t4
        label: Time leg 4
        unit: min
      - id: tas5
        label: TAS leg 5
        unit: kt
      - id: t5
        label: Time leg 5
        unit: min
    answer:
      formula: (tas1 * t1 + tas2 * t2 + tas3 * t3 + tas4 * t4 + tas5 * t5) / (t1 + t2
        + t3 + t4 + t5)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: (tas1 + tas2 + tas3 + tas4 + tas5) / 5
      - id: d2
        formula: (tas1 * t1 + tas2 * t2 + tas3 * t3) / (t1 + t2 + t3)
      - id: d3
        formula: tas1 * t1 + tas2 * t2 + tas3 * t3 + tas4 * t4 + tas5 * t5
      - id: d4
        formula: tas1
    presets:
      - id: p1
        values:
          tas1: 426
          t1: 12
          tas2: 434
          t2: 15
          tas3: 434
          t3: 12
          tas4: 430
          t4: 8
          tas5: 423
          t5: 9
      - id: p2
        values:
          tas1: 400
          t1: 5
          tas2: 410
          t2: 10
          tas3: 420
          t3: 15
          tas4: 430
          t4: 10
          tas5: 440
          t5: 10
      - id: p3
        values:
          tas1: 300
          t1: 20
          tas2: 320
          t2: 10
          tas3: 340
          t3: 15
          tas4: 360
          t4: 25
          tas5: 380
          t5: 30
    explanation: >-
      A faster leg covers more distance in the same time, so the average speed
      over the route is weighted by the time spent on each leg. Multiply each
      leg's TAS by its time, add the results and divide by the total time.


      **Solution**


      - Total time: {{= t1 + t2 + t3 + t4 + t5}} min

      - {{f: (tas1 * t1 + tas2 * t2 + tas3 * t3 + tas4 * t4 + tas5 * t5) / (t1 +
      t2 + t3 + t4 + t5)}} = {{n: (tas1 * t1 + tas2 * t2 + tas3 * t3 + tas4 * t4
      + tas5 * t5) / (t1 + t2 + t3 + t4 + t5)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: a plain average of the five leg speeds, ignoring the time
      on each leg

      - **{{d2}} kt**: only the first three legs are included

      - **{{d3}} kt**: the weighted sum is not divided by the total time

      - **{{d4}} kt**: only the TAS of the first leg is used
- id: QDZZXA3VM
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613741
  annexes:
    - jeppesen-vfr-chart-18-strasbourg-entzheim
  learningObjectives:
    - 061.01.03.02.04
  template:
    type: chart-calculation
    question: >-
      Refer to the figure. An aircraft is transiting through the Strasbourg
      area, on a leg from waypoint 'W2' to 'S'. The desired track of this leg is
      read from the figure.


      Given the following information:


      - Heading: {{heading}}° (T)

      - Actual drift: {{drift}}° (positive to the right, negative to the left)


      What is the track error angle? Give the answer as positive when the
      aircraft is right of the desired track and negative when it is left of it.
    variables:
      - id: heading
        label: Heading
        unit: °T
      - id: drift
        label: Actual drift
        unit: °
      - id: desired_track
        label: Desired track (read from the figure)
        unit: °T
    chartInputs:
      - desired_track
    answer:
      formula: heading + drift - desired_track
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: desired_track - heading - drift
      - id: d2
        formula: heading - desired_track
      - id: d3
        formula: heading - drift - desired_track
      - id: d4
        formula: desired_track - heading + drift
    presets:
      - id: p1
        values:
          heading: 178
          drift: 4
          desired_track: 181
      - id: p2
        values:
          heading: 230
          drift: 3
          desired_track: 236
    explanation: >-
      The track error is the difference between the track the aircraft is
      actually making good and the desired track. The track made good is the
      heading corrected for drift. A positive result means the aircraft is right
      of the desired track.


      **Solution**


      - Track made good = heading + drift = {{= heading + drift}}°

      - Track error = track made good - desired track = {{= heading + drift -
      desired_track}}°

      - Track error = **{{answer}}°** (positive: right, negative: left)


      **Why the other answers are wrong**


      - **{{d1}}°**: the sign is reversed.

      - **{{d2}}°**: the drift is left out.

      - **{{d3}}°**: the drift is subtracted instead of added.

      - **{{d4}}°**: the heading and the desired track are mixed up.
- id: QEAAYAQD
  docId: "061.01"
  relatedQuestions:
    - QXSVFGIV
  externalIds:
    - ATPLQ-619529
    - AVEXAM-70778
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      A route runs from A to B.


      - Distance from A to B: {{dist}} NM

      - Position: {{along}} NM along the route from A

      - Off course: {{off}} NM to the left


      By how many degrees should the heading be altered to fly directly to point
      B?
    variables:
      - id: dist
        label: Distance A to B
        unit: NM
      - id: along
        label: Distance flown
        unit: NM
      - id: off
        label: Off course
        unit: NM
    answer:
      formula: 2 * off * 60 / along
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: off * 60 / along
      - id: d2
        formula: 2 * off * dist / along
      - id: d3
        formula: 2 * off * 60
      - id: d4
        formula: 2 * along / off
    presets:
      - id: p1
        values:
          dist: 120
          along: 60
          off: 3
      - id: p2
        values:
          dist: 150
          along: 50
          off: 4
      - id: p3
        values:
          dist: 140
          along: 70
          off: 6
    explanation: >-
      After {{along}} NM the aircraft is {{off}} NM off course. The 1 in 60 rule
      gives the angle of that offset over the distance flown, and doubling it
      gives the heading alteration needed to fly directly to B.


      **Solution**


      - Heading alteration = 2 × {{off}} NM × 60 / {{along}} NM = {{= 2 * off *
      60 / along}}°

      - Turn right (the aircraft is left of course) by **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets to double the 1 in 60 correction.

      - **{{d2}}°**: multiplies by the total distance instead of dividing by the
      distance flown.

      - **{{d3}}°**: forgets to divide by the distance flown.

      - **{{d4}}°**: inverts the ratio of distance flown to off course.
- id: QECWEKYI
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616745
    - AVEXAM-69833
    - BGS-611682
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
  template:
    type: calculation
    question: >-
      Given the following information, determine the actual track of the
      aircraft:


      - Planned track: {{planned}}° (T)

      - Planned wind correction angle: {{wca}}° left

      - Actual in-flight drift: {{drift}}° right


      What is the actual track (degrees true)?
    variables:
      - id: planned
        label: Planned track
        unit: °(T)
      - id: wca
        label: Planned wind correction angle (left)
        unit: °
      - id: drift
        label: In-flight drift (right)
        unit: °
    answer:
      formula: planned - wca + drift
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: planned + wca + drift
      - id: d2
        formula: planned + wca - drift
      - id: d3
        formula: planned + drift
      - id: d4
        formula: planned - wca - drift
    presets:
      - id: p1
        values:
          planned: 31
          wca: 6
          drift: 4
      - id: p2
        values:
          planned: 210
          wca: 4
          drift: 5
      - id: p3
        values:
          planned: 90
          wca: 10
          drift: 3
    explanation: >-
      The heading is the planned track corrected for the planned wind correction
      angle: a left correction is subtracted from the track. The in-flight drift
      is then applied to the heading, with right drift counted as positive.


      **Solution**


      Heading: {{planned}} - {{wca}} = {{= planned - wca}}°


      Actual track: {{f: planned - wca + drift}} = {{n: planned - wca + drift}}
      = **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°(T)**: the left wind correction is applied as a right
      correction.

      - **{{d2}}°(T)**: the drift is subtracted instead of added.

      - **{{d3}}°(T)**: the wind correction angle is ignored.

      - **{{d4}}°(T)**: right drift is treated as left drift.
- id: QEDUPMDX
  docId: "061.01"
  relatedQuestions:
    - QGKADWYO
  externalIds:
    - ATPLQ-618817
    - BGS-611287
    - AVEXAM-24515
  annexes: []
  learningObjectives:
    - 061.01.05.04.02
    - 061.01.05.06.03
  template:
    type: calculation
    question: >-
      An aircraft climbs at a given rate of climb and airspeed:


      - Rate of climb: {{roc}} ft/min

      - TAS: {{tas}} kt

      - Required climb gradient: {{grad}}%


      What is the minimum headwind component required to achieve the climb
      gradient, rounded up to the next 10 kt?
    variables:
      - id: roc
        label: Rate of climb
        unit: ft/min
      - id: tas
        label: TAS
        unit: kt
      - id: grad
        label: Climb gradient
        unit: "%"
    answer:
      formula: ceil((tas - roc / grad) / 10) * 10
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - roc / grad
      - id: d2
        formula: ceil((tas - roc / grad) / 10) * 10 + 10
      - id: d3
        formula: tas + roc / grad
      - id: d4
        formula: tas - roc * grad
    presets:
      - id: p1
        values:
          roc: 1100
          tas: 200
          grad: 6
      - id: p2
        values:
          roc: 800
          tas: 235
          grad: 5
      - id: p3
        values:
          roc: 700
          tas: 185
          grad: 7
    explanation: >-
      The climb gradient is the rate of climb divided by the groundspeed, with
      the rate of climb in ft/min and the groundspeed in knots. The groundspeed
      needed for the gradient is therefore the rate of climb divided by the
      gradient. A headwind slows the aircraft down, so the headwind is the TAS
      minus that groundspeed, rounded up to the next 10 kt.


      **Solution**


      - Groundspeed needed: {{roc}} ft/min ÷ {{grad}}% = {{= roc / grad}} kt

      - Headwind: {{tas}} kt - {{= roc / grad}} kt = {{= tas - roc / grad}} kt

      - {{f: ceil((tas - roc / grad) / 10) * 10}} = {{n: ceil((tas - roc / grad)
      / 10) * 10}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the headwind was not rounded up to the next 10 kt.

      - **{{d2}} kt**: the headwind was rounded up one 10 kt step too far.

      - **{{d3}} kt**: the groundspeed was added to the TAS instead of
      subtracted.

      - **{{d4}} kt**: the rate of climb was multiplied by the gradient instead
      of divided.
