- id: QRCJVUZY
  docId: "061.01"
  relatedQuestions:
    - QR09SA55O
    - QVDTYXGB
  externalIds:
    - ATPLQ-612477
    - AVEXAM-79168
    - BGS-611679
  annexes: []
  learningObjectives:
    - 061.01.03.02.06
  template:
    type: calculation
    question: >-
      An aircraft flies over a small lake located some degrees to the left of
      the planned track. Using the 1 in 60 rule, determine the drift angle.


      - TAS: {{tas}} kt

      - Tailwind component: {{tw}} kt

      - Flight time from the previous waypoint: {{t}} min

      - Off-track distance between the lake and the track: {{xt}} NM


      What is the drift angle, rounded to the nearest whole degree?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
      - id: t
        label: Flight time
        unit: min
      - id: xt
        label: Off-track distance
        unit: NM
    answer:
      formula: 60 * xt / ((tas + tw) * t / 60)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: 60 * xt / (tas * t / 60)
      - id: d2
        formula: 60 * xt / ((tas - tw) * t / 60)
      - id: d3
        formula: 60 * xt / t
      - id: d4
        formula: 60 * xt / tas
    presets:
      - id: p1
        values:
          tas: 100
          tw: 15
          t: 11
          xt: 2.4
      - id: p2
        values:
          tas: 120
          tw: 10
          t: 9
          xt: 3
      - id: p3
        values:
          tas: 90
          tw: 20
          t: 15
          xt: 4
    explanation: >-
      The 1 in 60 rule relates the off-track distance to the distance flown. The
      ground speed is the TAS plus the tailwind, so the distance flown is the
      ground speed times the flight time.


      **Solution**


      Ground speed: {{f: tas + tw}} = {{n: tas + tw}} kt


      Distance flown: {{= (tas + tw) * t / 60}} NM


      Drift: {{f: 60 * xt / ((tas + tw) * t / 60)}} = {{n: 60 * xt / ((tas + tw)
      * t / 60)}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets the tailwind in the ground speed.

      - **{{d2}}°**: subtracts the tailwind instead of adding it.

      - **{{d3}}°**: divides by the flight time instead of the distance flown.

      - **{{d4}}°**: divides by the TAS and forgets the time.
- id: QRCWTQZY
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618040
    - AVEXAM-4880
    - ATPLGS-625891
  annexes: []
  learningObjectives:
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      Using the following information, what is the fuel used per nautical mile
      of ground distance travelled?


      - Fuel used: {{fuel}} kg in {{time}} minutes

      - Groundspeed: {{gs}} kt


      Give the answer in kg per NM.
    variables:
      - id: fuel
        label: Fuel used
        unit: kg
      - id: time
        label: Time
        unit: min
      - id: gs
        label: Groundspeed
        unit: kt
    answer:
      formula: fuel / (gs * time / 60)
      unit: kg per NM
      decimals: 2
    distractors:
      - id: d1
        formula: fuel / gs
      - id: d2
        formula: fuel / (gs * time)
      - id: d3
        formula: fuel / (gs * time / 60) * 60
      - id: d4
        formula: fuel * time / (gs * 60)
    presets:
      - id: p1
        values:
          fuel: 117
          time: 20
          gs: 154
      - id: p2
        values:
          fuel: 200
          time: 30
          gs: 240
      - id: p3
        values:
          fuel: 90
          time: 15
          gs: 300
    explanation: >-
      Fuel per nautical mile is the fuel burnt divided by the distance flown
      over the ground. The distance is the groundspeed multiplied by the time,
      with the time converted from minutes to hours.


      **Solution**


      - Distance flown: {{gs}} kt × {{time}} min ÷ 60 = {{= gs * time / 60}} NM

      - Fuel per NM: {{fuel}} kg ÷ {{= gs * time / 60}} NM = **{{answer}} kg per
      NM**


      **Why the other answers are wrong**


      - **{{d1}} kg per NM**: the time is forgotten, so the fuel is divided by
      the speed only.

      - **{{d2}} kg per NM**: the minutes are not converted to hours.

      - **{{d3}} kg per NM**: the result is multiplied by 60 by mistake.

      - **{{d4}} kg per NM**: the time is multiplied instead of divided.
- id: QRCYAUFA
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616438
    - ATPLGS-124421
    - BGS-610552
    - AVEXAM-94356
  annexes: []
  learningObjectives:
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      An aircraft has a TAS of {{tas}} kt and a groundspeed of {{gs}} kt. It is
      estimated to cross a meridian in {{t_now}} minutes. ATC asks for a speed
      reduction so that it crosses the meridian in {{t_new}} minutes instead.


      What is the approximate reduction in TAS required?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: gs
        label: Groundspeed
        unit: kt
      - id: t_now
        label: Time to the meridian now
        unit: min
      - id: t_new
        label: Time to the meridian after the reduction
        unit: min
    answer:
      formula: gs * (t_new - t_now) / t_new
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - gs
      - id: d2
        formula: gs * (t_new - t_now) / t_now
      - id: d3
        formula: tas * (t_new - t_now) / t_new
      - id: d4
        formula: gs * (t_new - t_now) / 60
    presets:
      - id: p1
        values:
          tas: 491
          gs: 441
          t_now: 50
          t_new: 55
      - id: p2
        values:
          tas: 470
          gs: 420
          t_now: 40
          t_new: 45
    explanation: >-
      With a constant wind, a change in TAS changes the groundspeed by the same
      amount. The distance to the meridian does not change, so the groundspeed
      needed is in inverse proportion to the time available: a longer time means
      a lower groundspeed.


      **Solution**


      - Groundspeed needed for the later crossing: {{= gs * t_now / t_new}} kt,
      down from {{gs}} kt

      - Reduction in TAS: {{f: gs * (t_new - t_now) / t_new}} = {{n: gs * (t_new
      - t_now) / t_new}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the headwind (TAS minus groundspeed) has been taken as
      the reduction.

      - **{{d2}} kt**: the original time has been used as the base instead of
      the new time.

      - **{{d3}} kt**: the reduction has been applied to the TAS instead of the
      groundspeed.

      - **{{d4}} kt**: the difference in time has been divided by 60 instead of
      by the new time.
