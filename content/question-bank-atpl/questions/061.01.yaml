  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613124
    - AVEXAM-35280
    - ATPLGS-622644
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
    - 061.01.05.04.06
  template:
    type: chart
    question: >-
      An aircraft passes point A at 12:05 with a groundspeed of {{gs}} kt. The
      ETA at point B is 13:20. At 12:35 the aircraft is found to be {{offset}}
      NM left of the intended track.


      The pilot wants to fly direct to B from this point. By how many degrees
      must the track be changed to do this, using the 1 in 60 rule?
    explanation: ""
    variables:
      - id: gs
        label: Groundspeed
        unit: kt
      - id: offset
        label: Offset left of track
        unit: NM
    entries:
      - id: e1
        values:
          gs: 140
          offset: 7
        answer: 10° to the right
        wrongAnswers:
          - 13° to the left.
          - 6° to the right.
          - 12° to the right
        explanation: >-
          The 1 in 60 rule gives a quick estimate of the heading change needed
          to fly back to the intended track, from the offset and the distance
          still to be flown. The correction is made to the right, back towards
          the line to B.


          **Solution**


          The aircraft is left of track, so the change is to the right. Using
          the 1 in 60 rule on the offset and the distance still to be flown to B
          gives a change of about 10°.


          **Why the other answers are wrong**


          - **13° to the left.**: the wrong direction, and a change that is too
          large.

          - **6° to the right.**: only the basic offset is corrected, and the
          distance still to be flown is not fully used.

          - **12° to the right**: the change is doubled, which is a common slip
          when using the 1 in 60 rule.
