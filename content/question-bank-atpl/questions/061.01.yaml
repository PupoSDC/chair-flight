- id: QAGANIQY
  docId: "061.01"
  relatedQuestions:
    - QV0HXVQHT
  externalIds:
    - ATPLQ-614380
    - ATPLGS-110532
    - AVEXAM-95449
    - BGS-610536
  annexes: []
  learningObjectives:
    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      Given the following information, calculate the approximate rate of
      descent.


      - TAS: {{tas}} kt

      - True course: {{course}}°T

      - Wind (direction/speed): {{wdir}}°/{{ws}} kt

      - Descent is initiated at {{start_alt}} ft and completed at {{end_alt}} ft

      - Distance to be covered during descent: {{dist}} NM


      What is the rate of descent, in ft/min?
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: course
        label: True course
        unit: °T
      - id: wdir
        label: Wind direction (from)
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
      - id: start_alt
        label: Start altitude
        unit: ft
      - id: end_alt
        label: End altitude
        unit: ft
      - id: dist
        label: Ground distance during the descent
        unit: NM
    answer:
      formula: (start_alt - end_alt) / (dist / (tas - ws * cos(wdir - course)) * 60)
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (start_alt - end_alt) / (dist / tas * 60)
      - id: d2
        formula: (start_alt - end_alt) / (dist / (tas + ws * cos(wdir - course)) * 60)
      - id: d3
        formula: (start_alt - end_alt) / dist * 60
      - id: d4
        formula: start_alt / (dist / (tas - ws * cos(wdir - course)) * 60)
    presets:
      - id: p1
        values:
          tas: 197
          course: 240
          wdir: 180
          ws: 30
          start_alt: 22000
          end_alt: 4000
          dist: 39
      - id: p2
        values:
          tas: 250
          course: 90
          wdir: 270
          ws: 40
          start_alt: 25000
          end_alt: 5000
          dist: 60
    explanation: >-
      The groundspeed is the TAS corrected for the wind. Only the part of the
      wind that acts along the track changes the groundspeed. A headwind reduces
      it and a tailwind increases it. The component along the track is the wind
      speed multiplied by the cosine of the angle between the wind direction and
      the track.


      **Solution**


      - Headwind component: {{= ws * cos(wdir - course)}} kt (a negative value
      is a tailwind)

      - Groundspeed: {{= tas - ws * cos(wdir - course)}} kt

      - Time for the descent: {{= dist / (tas - ws * cos(wdir - course)) * 60}}
      min

      - Rate of descent: {{f: (start_alt - end_alt) / (dist / (tas - ws *
      cos(wdir - course)) * 60)}} = {{n: (start_alt - end_alt) / (dist / (tas -
      ws * cos(wdir - course)) * 60)}} = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the wind is ignored, so the groundspeed is just the
      TAS.

      - **{{d2}} ft/min**: the headwind is treated as a tailwind, which raises
      the groundspeed.

      - **{{d3}} ft/min**: the height is divided by the distance instead of the
      time, so the groundspeed is ignored.

      - **{{d4}} ft/min**: the start altitude is used instead of the height to
      lose.
