- id: QHV8JMWMI
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619339
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      An aircraft is flying a true course of 090° with the BUN VOR/DME tuned in.
      Magnetic variation is zero.


      - BUN VOR/DME position: {{vor_lat_deg}}°{{vor_lat_min}}' N, 004°50' E

      - Starting position: {{ac_lat_deg}}°{{ac_lat_min}}' N, 003°37' E


      When the VOR shows a radial of 360°, what is the range of the aircraft
      from BUN? Give the answer in NM.
    variables:
      - id: vor_lat_deg
        label: BUN lat degrees
        unit: °
      - id: vor_lat_min
        label: BUN lat minutes
        unit: "'"
      - id: ac_lat_deg
        label: Aircraft lat degrees
        unit: °
      - id: ac_lat_min
        label: Aircraft lat minutes
        unit: "'"
    answer:
      formula: (ac_lat_deg * 60 + ac_lat_min) - (vor_lat_deg * 60 + vor_lat_min)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (ac_lat_deg - vor_lat_deg) * 60
      - id: d2
        formula: abs(ac_lat_min - vor_lat_min)
      - id: d3
        formula: ((ac_lat_deg * 60 + ac_lat_min) - (vor_lat_deg * 60 + vor_lat_min)) *
          1.852
      - id: d4
        formula: (ac_lat_deg - vor_lat_deg) * 60 + ac_lat_min
    presets:
      - id: p1
        values:
          vor_lat_deg: 51
          vor_lat_min: 7
          ac_lat_deg: 53
          ac_lat_min: 4
      - id: p2
        values:
          vor_lat_deg: 52
          vor_lat_min: 10
          ac_lat_deg: 54
          ac_lat_min: 20
      - id: p3
        values:
          vor_lat_deg: 51
          vor_lat_min: 15
          ac_lat_deg: 52
          ac_lat_min: 40
    explanation: >-
      A radial of 360° means the aircraft is directly north of BUN. Flying due
      east along a constant latitude, it is on BUN's meridian at the same
      latitude as its start, so the range is the difference in latitude. One
      minute of latitude is one NM.


      **Solution**


      - Aircraft latitude in minutes: {{= ac_lat_deg * 60 + ac_lat_min}}

      - BUN latitude in minutes: {{= vor_lat_deg * 60 + vor_lat_min}}

      - {{f: (ac_lat_deg * 60 + ac_lat_min) - (vor_lat_deg * 60 + vor_lat_min)}}
      = {{n: (ac_lat_deg * 60 + ac_lat_min) - (vor_lat_deg * 60 + vor_lat_min)}}
      = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses whole degrees only, so the minutes are lost

      - **{{d2}} NM**: subtracts only the minutes and ignores the degrees

      - **{{d3}} NM**: converts the distance into kilometres by multiplying by
      1.852

      - **{{d4}} NM**: forgets to subtract the minutes of the BUN latitude
- id: QHVLAGIK1
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619524
    - AVEXAM-83955
  annexes: []
  learningObjectives:
    - 061.01.03.02.01
  template:
    type: calculation
    question: Calculate the crosswind component for an aeroplane which flies on a
      track {{trk}}° (T) experiencing a wind of {{wind_dir}}° (T) /
      {{wind_speed}} kt.
    variables:
      - id: trk
        label: Track
        unit: °
      - id: wind_dir
        label: Wind direction
        unit: °
      - id: wind_speed
        label: Wind speed
        unit: kt
    answer:
      formula: abs(wind_speed * sin(wind_dir - trk))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: wind_speed
      - id: d2
        formula: wind_speed - abs(wind_speed * sin(wind_dir - trk))
      - id: d3
        formula: wind_speed * abs(wind_dir - trk) / 90
    presets:
      - id: p1
        values:
          trk: 355
          wind_dir: 15
          wind_speed: 20
      - id: p2
        values:
          trk: 90
          wind_dir: 130
          wind_speed: 25
      - id: p3
        values:
          trk: 270
          wind_dir: 305
          wind_speed: 18
    explanation: >-
      The crosswind component is the wind component perpendicular to the track.
      It equals the wind speed times the sine of the angle between the wind
      direction and the track.


      **Solution**


      Angle = {{= abs(wind_dir - trk)}}°


      {{f: wind_speed * sin(wind_dir - trk)}} = {{n: wind_speed * sin(wind_dir -
      trk)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the whole wind speed, as if the wind were exactly
      perpendicular to the track.

      - **{{d2}} kt**: the crosswind subtracted from the wind speed.

      - **{{d3}} kt**: the angle scaled linearly (angle/90) instead of using the
      sine.
- id: QHVOHGOW
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614821
    - AVEXAM-83943
    - ATPLGS-625606
    - ATPLQ-617450
    - BGS-611435
