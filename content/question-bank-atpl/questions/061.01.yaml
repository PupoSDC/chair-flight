- id: QJUTNHDY
  docId: "061.01"
  relatedQuestions:
    - QFXHXUXQ
  externalIds:
    - ATPLQ-617575
    - AVEXAM-93077
    - ATPLQ-619666
    - ATPLGS-628535
    - ATPLQ-614957
    - AVEXAM-32065
  annexes: []
  learningObjectives:
    - 061.01.03.02.05
  template:
    type: calculation
    question: >-
      An aircraft flies from A to B, a distance of {{dist}} NM.


      - After {{along}} NM along the track, the aircraft is {{off}} NM off the
      intended track


      Using the 1 in 60 rule, what size of heading change, in degrees, is needed
      to fly directly to B? Round down to the whole degree.
    variables:
      - id: dist
        label: Distance A to B
        unit: NM
      - id: along
        label: Distance flown along track
        unit: NM
      - id: off
        label: Offset from track
        unit: NM
    answer:
      formula: floor(off * 60 / along + off * 60 / (dist - along))
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: off * 60 / along
      - id: d2
        formula: off * 60 / (dist - along)
      - id: d3
        formula: 2 * off * 60 / along
      - id: d4
        formula: off * 60 / (dist - along) * 2
    presets:
      - id: p1
        values:
          dist: 150
          along: 30
          off: 4
      - id: p2
        values:
          dist: 45
          along: 12
          off: 3
      - id: p3
        values:
          dist: 27
          along: 15
          off: 2.5
    explanation: >-
      The 1 in 60 rule corrects a track error with one degree of heading change
      for every NM off track in each 60 NM flown. It is used twice: once to take
      out the offset built up so far, and once to bring the aircraft from its
      present position onto B over the distance still to fly. Both corrections
      are added together and rounded down to the whole degree.


      **Solution**


      - Find the correction for the offset over the distance flown so far, with
      the 1 in 60 rule

      - Find the correction to reach B over the distance still to fly, with the
      1 in 60 rule

      - Add the two corrections and round down: **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: only corrects the offset flown so far and does not turn
      back towards B.

      - **{{d2}}°**: only corrects the distance still to fly and ignores the
      offset already flown.

      - **{{d3}}°**: doubles the correction for the offset flown so far.

      - **{{d4}}°**: doubles the correction for the distance still to fly.
- id: QJVRUPYV
  docId: 061.01.03.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-614509
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      The final approach track for the ILS to runway 23 is shown on the airport
      chart.


      - Magnetic track: {{mag}}°M

      - Drift on final approach: {{drift}}° right

      - Variation: {{var}}°W


      Determine the true direction of the final approach track.
    variables:
      - id: mag
        label: magnetic track
        unit: °
      - id: drift
        label: drift (right)
        unit: °
      - id: var
        label: variation (west)
        unit: °
    answer:
      formula: mag - var
      unit: °(T)
      decimals: 0
    distractors:
      - id: d1
        formula: mag + var
      - id: d2
        formula: mag - var - drift
      - id: d3
        formula: mag + var + drift
    presets:
      - id: p1
        values:
          mag: 233
          drift: 6
          var: 18
      - id: p2
        values:
          mag: 120
          drift: 4
          var: 10
      - id: p3
        values:
          mag: 300
          drift: 3
          var: 25
    explanation: >-
      The drift is the angle between the heading and the track. It does not
      change the track itself, so the track is only converted from magnetic to
      true. For west variation the value is subtracted from the magnetic track.


      **Solution**


      True track = {{mag}}° - {{var}}° = {{f: mag - var}} = {{n: mag - var}} =
      **{{answer}}°(T)**


      **Why the other answers are wrong**


      - **{{d1}}°(T)**: applies the west variation in the wrong direction.

      - **{{d2}}°(T)**: also subtracts the drift, which does not change the
      track.

      - **{{d3}}°(T)**: adds the variation with the wrong sign and also adds the
      drift.
