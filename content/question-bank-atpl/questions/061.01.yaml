- id: QJTEBZDN
  docId: "061.01"
  relatedQuestions:
    - QV0HXVQHT
  externalIds:
    - ATPLQ-612802
    - BGS-611464
    - AVEXAM-85509
    - AVEXAM-24634
  annexes: []
  learningObjectives:
    - 061.01.08.03.05
  template:
    type: calculation
    question: >-
      Given the following information, calculate the rate of descent (ROD) for
      an aircraft that is approaching the destination.


      - Ground distance during the descent: {{dist}} NM

      - Average TAS: {{tas}} kt

      - Average tailwind component: {{tw}} kt

      - Descent: from {{start_alt}} ft to a pressure altitude of {{end_alt}} ft


      What is the rate of descent, in ft/min?
    variables:
      - id: dist
        label: Ground distance
        unit: NM
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
      - id: start_alt
        label: Start altitude
        unit: ft
      - id: end_alt
        label: End altitude
        unit: ft
    answer:
      formula: (start_alt - end_alt) / (dist / (tas + tw) * 60)
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (start_alt - end_alt) / (dist / tas * 60)
      - id: d2
        formula: (start_alt - end_alt) / (dist / (tas - tw) * 60)
      - id: d3
        formula: (start_alt - end_alt) / (dist / (tas + tw))
      - id: d4
        formula: (start_alt + end_alt) / (dist / (tas + tw) * 60)
    presets:
      - id: p1
        values:
          dist: 25
          tas: 130
          tw: 30
          start_alt: 18000
          end_alt: 3000
      - id: p2
        values:
          dist: 30
          tas: 140
          tw: 20
          start_alt: 15000
          end_alt: 4000
    explanation: >-
      The rate of descent is the height lost divided by the time taken to lose
      it. A tailwind adds to the TAS to give the groundspeed, which shortens the
      time over the ground. The groundspeed is therefore the TAS plus the
      tailwind component.


      **Solution**


      - Groundspeed: {{= tas + tw}} kt

      - Time for the descent: {{= dist / (tas + tw) * 60}} min

      - Height to lose: {{n: start_alt - end_alt}} ft

      - Rate of descent: {{f: (start_alt - end_alt) / (dist / (tas + tw) * 60)}}
      = {{n: (start_alt - end_alt) / (dist / (tas + tw) * 60)}} = **{{answer}}
      ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the tailwind is ignored, so the groundspeed is too
      low and the descent takes too long.

      - **{{d2}} ft/min**: the tailwind is treated as a headwind, which lowers
      the groundspeed.

      - **{{d3}} ft/min**: the time is left in hours, so the result is a rate
      per hour and far too large.

      - **{{d4}} ft/min**: the start and end altitudes are added instead of
      subtracted.
