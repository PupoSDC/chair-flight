- id: QUOACPLE
  docId: "061.01"
  relatedQuestions:
    - QBGZBDBD
  externalIds:
    - ATPLQ-614118
    - ATPLQ-615569
    - BGS-611270
  annexes: []
  learningObjectives:
    - 061.01.05.04.02
    - 061.01.05.06.02
  template:
    type: calculation
    question: >-
      An aircraft is flying an ILS approach with a glide path of {{grad}}%
      gradient. Given the following information:


      - TAS: {{tas}} kt

      - Tailwind component: {{tw}} kt


      What is the rate of descent required to follow the glide path, in ft/min?
    variables:
      - id: grad
        label: Glide path gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: (tas + tw) * grad
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (tas - tw) * grad
      - id: d2
        formula: tas * grad
      - id: d3
        formula: (tas + tw) * grad / 100
      - id: d4
        formula: tas + tw
    presets:
      - id: p1
        values:
          grad: 12
          tas: 100
          tw: 20
      - id: p2
        values:
          grad: 6
          tas: 110
          tw: 15
    explanation: >-
      On a glide path, the rate of descent depends on the groundspeed and on how
      steep the path is. A gradient of 1 % means 1 ft of height lost for every
      100 ft flown forward, so the rate of descent in ft/min is approximately
      the groundspeed in kt multiplied by the gradient in percent. The
      groundspeed is the TAS plus any tailwind component.


      **Solution**


      - Groundspeed: {{= tas + tw}} kt

      - Rate of descent: {{f: (tas + tw) * grad}} = {{n: (tas + tw) * grad}} =
      **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the tailwind is treated as a headwind, which lowers
      the groundspeed.

      - **{{d2}} ft/min**: the tailwind is ignored.

      - **{{d3}} ft/min**: the gradient is used as a fraction, which divides the
      result by 100 once too often.

      - **{{d4}} ft/min**: the groundspeed is given instead of the rate of
      descent, so the gradient is not applied.
- id: QURWHSZP1
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612937
    - ATPLGS-110540
    - AVEXAM-97150
    - ATPLGS-110541
    - AVEXAM-41240
    - ATPLGS-625413
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: >-
      The pilot calculates the compass heading for a leg of {{leg}} NM, but uses
      the wrong variation:


      - Variation used: {{var_err}}°E

      - Correct variation: {{var_err}}°W


      Assuming the forecast wind applies, what is the off track distance at the
      second waypoint, in NM?
    variables:
      - id: leg
        label: Distance between the waypoints
        unit: NM
      - id: var_err
        label: Variation (size of the error on each side)
        unit: °
    answer:
      formula: leg * sin(2 * var_err)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: leg * sin(var_err)
      - id: d2
        formula: leg * sin(4 * var_err)
      - id: d3
        formula: leg * sin(3 * var_err)
      - id: d4
        formula: leg * sin(6 * var_err)
    presets:
      - id: p1
        values:
          leg: 150
          var_err: 2
      - id: p2
        values:
          leg: 200
          var_err: 3
      - id: p3
        values:
          leg: 90
          var_err: 1.5
    explanation: >-
      Using east instead of west variation makes the heading wrong by twice the
      variation. The aircraft drifts sideways off track by the distance flown
      multiplied by the sine of that heading error.


      **Solution**


      - Heading error: 2 × {{var_err}}° = {{= 2 * var_err}}°

      - Off track distance: {{leg}} NM × sin {{= 2 * var_err}}° = {{f: leg *
      sin(2 * var_err)}} = {{n: leg * sin(2 * var_err)}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: only half of the heading error was used.

      - **{{d2}} NM**: the heading error was doubled again.

      - **{{d3}} NM**: the heading error was taken as three times the variation.

      - **{{d4}} NM**: the heading error was taken as six times the variation.
