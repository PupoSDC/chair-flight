- id: QY4MZQ0YZ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619576
    - AVEXAM-93805
  annexes: []
  learningObjectives:
    - 061.01.05.06.03
  template:
    type: calculation
    question: >-
      An aircraft following a standard instrument departure must climb with a
      minimum gradient. Calculate the minimum vertical speed needed to meet it,
      given:


      - Minimum climb gradient: {{grad}} %

      - Average TAS: {{tas}} kt

      - Tailwind component: {{tw}} kt


      What is the minimum vertical speed, in ft/min?
    variables:
      - id: grad
        label: Climb gradient
        unit: "%"
      - id: tas
        label: TAS
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
    answer:
      formula: (tas + tw) * grad
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: tas * grad
      - id: d2
        formula: (tas - tw) * grad
      - id: d3
        formula: (tas + tw) / grad
      - id: d4
        formula: (tas + tw) * grad * 60
    presets:
      - id: p1
        values:
          grad: 6
          tas: 110
          tw: 15
      - id: p2
        values:
          grad: 4
          tas: 140
          tw: 20
      - id: p3
        values:
          grad: 8
          tas: 95
          tw: 10
    explanation: >-
      A climb gradient is the height gained for each distance flown over the
      ground. A ground speed of 1 kt covers about 100 ft every minute, so the
      vertical speed needed to meet a gradient is approximately the ground speed
      in knots multiplied by the gradient in per cent. The tailwind adds to the
      true airspeed to give the ground speed.


      **Solution**


      - Ground speed = {{tas}} kt + {{tw}} kt = {{= tas + tw}} kt

      - {{f: (tas + tw) * grad}} = {{n: (tas + tw) * grad}} = **{{answer}}
      ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the tailwind was ignored, so only the true airspeed
      was used.

      - **{{d2}} ft/min**: the tailwind was subtracted instead of added.

      - **{{d3}} ft/min**: the gradient was divided instead of multiplied, which
      inverts the relationship.

      - **{{d4}} ft/min**: the result was multiplied by 60 instead of being kept
      as a per-minute figure.
