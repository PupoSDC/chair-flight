  template:
    type: chart-calculation
    question: Refer to the figure. The TAS at waypoints 1 to 5 is read from the
      table. Calculate the average true airspeed from Waypoint 1 to Waypoint 5
      (kt).
    variables:
      - id: tas1
        label: TAS at Waypoint 1 (read from the table)
        unit: kt
      - id: tas2
        label: TAS at Waypoint 2 (read from the table)
        unit: kt
      - id: tas3
        label: TAS at Waypoint 3 (read from the table)
        unit: kt
      - id: tas4
        label: TAS at Waypoint 4 (read from the table)
        unit: kt
      - id: tas5
        label: TAS at Waypoint 5 (read from the table)
        unit: kt
    chartInputs:
      - tas1
      - tas2
      - tas3
      - tas4
      - tas5
    answer:
      formula: (tas1 + tas2 + tas3 + tas4 + tas5) / 5
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: (tas1 + tas2 + tas3 + tas4 + tas5) / 4
      - id: d2
        formula: (tas1 + tas5) / 2
      - id: d3
        formula: tas5
      - id: d4
        formula: tas1 + tas2 + tas3 + tas4 + tas5
    presets:
      - id: p1
        values:
          tas1: 248
          tas2: 256
          tas3: 252
          tas4: 254
          tas5: 255
      - id: p2
        values:
          tas1: 240
          tas2: 246
          tas3: 250
          tas4: 248
          tas5: 252
      - id: p3
        values:
          tas1: 260
          tas2: 266
          tas3: 258
          tas4: 262
          tas5: 259
    explanation: >-
      The average TAS is the total of the TAS values at the waypoints divided by
      the number of values. Each TAS is read from the table for its waypoint,
      and all five waypoints are included.


      **Solution**


      - Total of the five TAS values = {{= tas1 + tas2 + tas3 + tas4 + tas5}} kt

      - Average = total / 5 = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the total is divided by four instead of five.

      - **{{d2}} kt**: only the first and last waypoints are averaged.

      - **{{d3}} kt**: only the TAS at Waypoint 5 is taken.

      - **{{d4}} kt**: the values are added but not divided.
