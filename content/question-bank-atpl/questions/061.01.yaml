- id: QWECTGWT
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-615005
    - AVEXAM-48206
    - AVEXAM-41262
    - AVEXAM-26340
    - AVEXAM-97864
    - AVEXAM-91257
  annexes: []
  learningObjectives:
    - 061.01.08.02.03
  template:
    type: calculation
    question: >-
      An aircraft descends from FL180 to ground level with a constant TAS of
      {{tas}} kt. The TT in descent is {{tt}}°. The W/V at various flight levels
      in the area are given below.


      | FL | W/V |

      | --- | --- |

      | Ground | {{wg_d}}°/{{wg_s}} kt |

      | 30 | {{w30_d}}°/{{w30_s}} kt |

      | 60 | {{w60_d}}°/{{w60_s}} kt |

      | 90 | {{w90_d}}°/{{w90_s}} kt |

      | 120 | {{w120_d}}°/{{w120_s}} kt |

      | 150 | {{w150_d}}°/{{w150_s}} kt |

      | 180 | {{w180_d}}°/{{w180_s}} kt |


      Calculate the average GS in descent.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: tt
        label: true track in descent
        unit: °
      - id: wg_d
        label: wind direction at ground
        unit: °
      - id: wg_s
        label: wind speed at ground
        unit: kt
      - id: w30_d
        label: wind direction at FL30
        unit: °
      - id: w30_s
        label: wind speed at FL30
        unit: kt
      - id: w60_d
        label: wind direction at FL60
        unit: °
      - id: w60_s
        label: wind speed at FL60
        unit: kt
      - id: w90_d
        label: wind direction at FL90
        unit: °
      - id: w90_s
        label: wind speed at FL90
        unit: kt
      - id: w120_d
        label: wind direction at FL120
        unit: °
      - id: w120_s
        label: wind speed at FL120
        unit: kt
      - id: w150_d
        label: wind direction at FL150
        unit: °
      - id: w150_s
        label: wind speed at FL150
        unit: kt
      - id: w180_d
        label: wind direction at FL180
        unit: °
      - id: w180_s
        label: wind speed at FL180
        unit: kt
    answer:
      formula: sqrt((tas * sin(tt) - ((wg_s * sin(wg_d) + w30_s * sin(w30_d) + w60_s *
        sin(w60_d) + w90_s * sin(w90_d) + w120_s * sin(w120_d) + w150_s *
        sin(w150_d) + w180_s * sin(w180_d)) / 7)) ^ 2 + (tas * cos(tt) - ((wg_s
        * cos(wg_d) + w30_s * cos(w30_d) + w60_s * cos(w60_d) + w90_s *
        cos(w90_d) + w120_s * cos(w120_d) + w150_s * cos(w150_d) + w180_s *
        cos(w180_d)) / 7)) ^ 2)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: sqrt((tas * sin(tt) - wg_s * sin(wg_d)) ^ 2 + (tas * cos(tt) - wg_s *
          cos(wg_d)) ^ 2)
      - id: d2
        formula: tas
      - id: d3
        formula: sqrt((tas * sin(tt) + ((wg_s * sin(wg_d) + w30_s * sin(w30_d) + w60_s *
          sin(w60_d) + w90_s * sin(w90_d) + w120_s * sin(w120_d) + w150_s *
          sin(w150_d) + w180_s * sin(w180_d)) / 7)) ^ 2 + (tas * cos(tt) +
          ((wg_s * cos(wg_d) + w30_s * cos(w30_d) + w60_s * cos(w60_d) + w90_s *
          cos(w90_d) + w120_s * cos(w120_d) + w150_s * cos(w150_d) + w180_s *
          cos(w180_d)) / 7)) ^ 2)
      - id: d4
        formula: tas - (wg_s + w30_s + w60_s + w90_s + w120_s + w150_s + w180_s) / 7
    presets:
      - id: p1
        values:
          tas: 220
          tt: 80
          wg_d: 260
          wg_s: 25
          w30_d: 270
          w30_s: 30
          w60_d: 270
          w60_s: 35
          w90_d: 270
          w90_s: 40
          w120_d: 280
          w120_s: 50
          w150_d: 285
          w150_s: 55
          w180_d: 290
          w180_s: 55
      - id: p2
        values:
          tas: 240
          tt: 75
          wg_d: 250
          wg_s: 20
          w30_d: 260
          w30_s: 25
          w60_d: 265
          w60_s: 30
          w90_d: 265
          w90_s: 35
          w120_d: 275
          w120_s: 45
          w150_d: 280
          w150_s: 50
          w180_d: 285
          w180_s: 50
    explanation: >-
      The ground speed is the vector sum of the TAS and the wind. The wind
      changes with height, so its components are averaged over all the levels
      and then combined with the TAS along the TT.


      **Solution**


      Average wind over the seven levels is combined with the TAS on the TT of
      {{tt}}°:


      {{f: sqrt((tas * sin(tt) - ((wg_s * sin(wg_d) + w30_s * sin(w30_d) + w60_s
      * sin(w60_d) + w90_s * sin(w90_d) + w120_s * sin(w120_d) + w150_s *
      sin(w150_d) + w180_s * sin(w180_d)) / 7)) ^ 2 + (tas * cos(tt) - ((wg_s *
      cos(wg_d) + w30_s * cos(w30_d) + w60_s * cos(w60_d) + w90_s * cos(w90_d) +
      w120_s * cos(w120_d) + w150_s * cos(w150_d) + w180_s * cos(w180_d)) / 7))
      ^ 2)}} = {{n: sqrt((tas * sin(tt) - ((wg_s * sin(wg_d) + w30_s *
      sin(w30_d) + w60_s * sin(w60_d) + w90_s * sin(w90_d) + w120_s *
      sin(w120_d) + w150_s * sin(w150_d) + w180_s * sin(w180_d)) / 7)) ^ 2 +
      (tas * cos(tt) - ((wg_s * cos(wg_d) + w30_s * cos(w30_d) + w60_s *
      cos(w60_d) + w90_s * cos(w90_d) + w120_s * cos(w120_d) + w150_s *
      cos(w150_d) + w180_s * cos(w180_d)) / 7)) ^ 2)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the ground-level wind only instead of the average
      over all levels.

      - **{{d2}} kt**: the TAS is taken as the ground speed, ignoring the wind.

      - **{{d3}} kt**: the wind components are added instead of subtracted, so a
      headwind is treated as a tailwind.

      - **{{d4}} kt**: the average wind speed is subtracted from the TAS,
      ignoring the direction of the wind.
