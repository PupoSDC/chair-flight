  template:
    type: calculation
    question: >-
      While proceeding en route, the aircraft reaches the half-way point between
      two waypoints. Given the following information:


      - Distance between the two waypoints: {{total}} NM

      - Position at the half-way point: {{xtk}} NM left of the desired track


      Using the “1 in 60” rule, and to reach the active waypoint, by how many
      degrees should the heading be changed?
    variables:
      - id: total
        label: Distance between the two waypoints
        unit: NM
      - id: xtk
        label: Cross-track error at the half-way point
        unit: NM
    answer:
      formula: 2 * xtk * 60 / (total / 2)
      unit: ° to the right
      decimals: 0
    distractors:
      - id: d1
        formula: xtk * 60 / (total / 2)
      - id: d2
        formula: 2 * xtk * 60 / (total / 4)
      - id: d3
        formula: 2 * xtk * 60 / (total / 2) * 1.852
      - id: d4
        formula: 2 * xtk * 6 / (total / 2)
    presets:
      - id: p1
        values:
          total: 120
          xtk: 3
      - id: p2
        values:
          total: 90
          xtk: 2
      - id: p3
        values:
          total: 150
          xtk: 4
    explanation: >-
      At the half-way point the distance still to go is half the leg. The 1 in
      60 rule gives the heading change needed for each mile off track. The
      heading must be changed back by the same amount again, so the total change
      is twice the 1 in 60 correction.


      **Solution**


      - Distance still to go: {{n: total / 2}} NM

      - Correction for the offset (1 in 60): {{n: xtk * 60 / (total / 2)}}°

      - Heading change to reach the waypoint: {{f: 2 * xtk * 60 / (total / 2)}}
      = {{n: 2 * xtk * 60 / (total / 2)}} = **{{answer}}° to the right**


      **Why the other answers are wrong**


      - **{{d1}}° to the right**: uses one 1 in 60 correction only, without
      doubling it.

      - **{{d2}}° to the right**: uses a quarter of the leg as the distance to
      go.

      - **{{d3}}° to the right**: converts the answer from nautical miles into
      kilometres, a unit mistake.

      - **{{d4}}° to the right**: uses 1 in 6 instead of 1 in 60.
- id: QMNSU2BAH
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618299
    - AVEXAM-58311
    - BGS-611685
    - AVEXAM-6000
    - ATPLGS-124352
    - ATPLGS-628524
    - ATPLQ-612110
    - ATPLQ-613679
  annexes: []
  learningObjectives:
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      An aircraft flies from A to B.


      - Total distance from A to B: {{total}} NM

      - Planned flight time from A to B: {{planned}} min

      - Distance from A to waypoint C: {{dist_c}} NM

      - Time flown from A when overflying C: {{elapsed}} min


      What ground speed must be flown from C to reach B at the planned arrival
      time?
    variables:
      - id: total
        label: Total distance A to B
        unit: NM
      - id: planned
        label: Planned flight time A to B
        unit: min
      - id: dist_c
        label: Distance A to C
        unit: NM
      - id: elapsed
        label: Time flown to C
        unit: min
    answer:
      formula: (total - dist_c) / (planned - elapsed) * 60
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: (total - dist_c) / planned * 60
      - id: d2
        formula: total / (planned - elapsed) * 60
      - id: d3
        formula: dist_c / elapsed * 60
      - id: d4
        formula: (total - dist_c) / (planned - elapsed)
    presets:
      - id: p1
        values:
          total: 110
          planned: 50
          dist_c: 45
          elapsed: 25
      - id: p2
        values:
          total: 110
          planned: 45
          dist_c: 65
          elapsed: 25
      - id: p3
        values:
          total: 110
          planned: 40
          dist_c: 65
          elapsed: 25
    explanation: >-
      The distance still to fly is the total distance minus the distance already
      flown to C. The time still available is the planned flight time minus the
      time already flown. The speed needed is the distance left divided by the
      time left, converted to knots.


      **Solution**


      - Distance left from C to B = {{= total - dist_c}} NM

      - Time left = {{= planned - elapsed}} min

      - {{f: (total - dist_c) / (planned - elapsed) * 60}} = {{n: (total -
      dist_c) / (planned - elapsed) * 60}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the full planned time instead of the time left.

      - **{{d2}} kt**: uses the whole distance from A to B instead of the
      distance left.

      - **{{d3}} kt**: uses the speed flown so far from A to C, not the speed
      still to be flown.

      - **{{d4}} kt**: forgets to convert the time from minutes into hours.
- id: QMNUJWUZ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618680
    - BGS-620284
    - ATPLGS-628150
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: >-
      When flying a 3° glide path, an aircraft experiences a reduction in
      groundspeed from {{gs1}} kt at the outer marker to {{gs2}} kt over the
      threshold.


      What approximate decrease in rate of descent does this change in
      groundspeed cause, in ft/min?
    variables:
      - id: gs1
        label: Groundspeed at the outer marker
        unit: kt
      - id: gs2
        label: Groundspeed over the threshold
        unit: kt
    answer:
      formula: (gs1 - gs2) * 5
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: (gs1 - gs2) * 101.3 * tan(5)
      - id: d2
        formula: (gs1 - gs2) * 101.3 / 60
      - id: d3
        formula: (gs1 - gs2) * 3
      - id: d4
        formula: gs1 - gs2
    presets:
      - id: p1
        values:
          gs1: 150
          gs2: 120
      - id: p2
        values:
          gs1: 160
          gs2: 100
      - id: p3
        values:
          gs1: 130
          gs2: 115
    explanation: >-
      On a 3° glide path the rate of descent is about 5 ft/min for each knot of
      groundspeed (the exact factor is 101.3 × tan 3°, about 5.3). A change in
      groundspeed therefore changes the rate of descent in the same proportion.


      **Solution**


      Change in groundspeed = {{gs1}} − {{gs2}} = {{= gs1 - gs2}} kt


      Decrease in rate of descent ≈ {{= gs1 - gs2}} × 5 = **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: uses a 5° glide path instead of 3°.

      - **{{d2}} ft/min**: divides by 60 in the conversion, a unit slip.

      - **{{d3}} ft/min**: uses the glide angle value 3 as the factor.

      - **{{d4}} ft/min**: uses the groundspeed difference directly, with no
      factor for the glide path.
- id: QMOLI9NCC
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612780
    - ATPLGS-625362
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      Calculate the approximate distance in NM from Dublin to a position
      {{off_nm}} NM north of Bremen airport. The positions are:


      - Dublin: {{dub_lat_d}}°{{dub_lat_m}}'N, {{dub_lon_d}}°{{dub_lon_m}}'W

      - Bremen airport: {{brm_lat_d}}°{{brm_lat_m}}'N,
      {{brm_lon_d}}°{{brm_lon_m}}'E


      What is the distance in NM?
    variables:
      - id: dub_lat_d
        label: Dublin latitude, degrees
        unit: °
      - id: dub_lat_m
        label: Dublin latitude, minutes
        unit: "'"
      - id: dub_lon_d
        label: Dublin longitude, degrees
        unit: °
      - id: dub_lon_m
        label: Dublin longitude, minutes
        unit: "'"
      - id: brm_lat_d
        label: Bremen airport latitude, degrees
        unit: °
      - id: brm_lat_m
        label: Bremen airport latitude, minutes
        unit: "'"
      - id: brm_lon_d
        label: Bremen airport longitude, degrees
        unit: °
      - id: brm_lon_m
        label: Bremen airport longitude, minutes
        unit: "'"
      - id: off_nm
        label: Offset north of Bremen airport
        unit: NM
    answer:
      formula: 60 * ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d + brm_lon_m / 60)) *
        cos((((dub_lat_d + dub_lat_m / 60) + (brm_lat_d + brm_lat_m / 60) +
        off_nm / 60) / 2))
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: 60 * ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d + brm_lon_m / 60))
      - id: d2
        formula: ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d + brm_lon_m / 60)) *
          cos((((dub_lat_d + dub_lat_m / 60) + (brm_lat_d + brm_lat_m / 60) +
          off_nm / 60) / 2))
      - id: d3
        formula: 60 * ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d + brm_lon_m / 60)) *
          sin((((dub_lat_d + dub_lat_m / 60) + (brm_lat_d + brm_lat_m / 60) +
          off_nm / 60) / 2))
      - id: d4
        formula: 60 * ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d + brm_lon_m / 60)) *
          cos((((dub_lat_d + dub_lat_m / 60) + (brm_lat_d + brm_lat_m / 60) +
          off_nm / 60) / 2)) * 1.852
    presets:
      - id: p1
        values:
          dub_lat_d: 53
          dub_lat_m: 29
          dub_lon_d: 6
          dub_lon_m: 15.3
          brm_lat_d: 53
          brm_lat_m: 9
          brm_lon_d: 8
          brm_lon_m: 45
          off_nm: 20
      - id: p2
        values:
          dub_lat_d: 52
          dub_lat_m: 40
          dub_lon_d: 5
          dub_lon_m: 10
          brm_lat_d: 52
          brm_lat_m: 30
          brm_lon_d: 9
          brm_lon_m: 20
          off_nm: 15
    explanation: >-
      Over this distance the shortest route is closely approximated by the
      east-west distance: the longitude difference in NM, reduced by the cosine
      of the mean latitude. The 20 NM offset north of Bremen airport only
      changes the latitude slightly.


      **Solution**


      Longitude difference: {{= ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d +
      brm_lon_m / 60))}}°


      Mean latitude: {{= (((dub_lat_d + dub_lat_m / 60) + (brm_lat_d + brm_lat_m
      / 60) + off_nm / 60) / 2)}}°N


      {{f: 60 * ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d + brm_lon_m / 60)) *
      cos((((dub_lat_d + dub_lat_m / 60) + (brm_lat_d + brm_lat_m / 60) + off_nm
      / 60) / 2))}} = {{n: 60 * ((dub_lon_d + dub_lon_m / 60) + (brm_lon_d +
      brm_lon_m / 60)) * cos((((dub_lat_d + dub_lat_m / 60) + (brm_lat_d +
      brm_lat_m / 60) + off_nm / 60) / 2))}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the cosine of the latitude is forgotten.

      - **{{d2}} NM**: the result is left in degrees and not converted to
      nautical miles.

      - **{{d3}} NM**: the sine of the latitude is used instead of the cosine.

      - **{{d4}} NM**: the result is converted to kilometres by mistake.
- id: QMR04FBMH
  docId: "061.01"
  relatedQuestions:
