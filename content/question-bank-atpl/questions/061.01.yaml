- id: Q78PMMNEQ
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611548
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
  template:
    type: calculation
    question: >-
      You are flying a constant compass heading and your INS shows a drift to
      the right. The data are:


      - Compass heading: {{ch}}°

      - Deviation: {{dev_e}}°E

      - Variation: {{var_w}}°W

      - Drift: {{drift}}° right


      What is the true track?
    variables:
      - id: ch
        label: compass heading
        unit: °
      - id: dev_e
        label: easterly deviation
        unit: °
      - id: var_w
        label: westerly variation
        unit: °
      - id: drift
        label: drift to the right
        unit: °
    answer:
      formula: ch + dev_e - var_w + drift
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: ch + dev_e - var_w
      - id: d2
        formula: ch + drift
      - id: d3
        formula: ch + dev_e - var_w - drift
      - id: d4
        formula: ch - dev_e - var_w + drift
    presets:
      - id: p1
        values:
          ch: 235
          dev_e: 2
          var_w: 12
          drift: 8
      - id: p2
        values:
          ch: 60
          dev_e: 1
          var_w: 4
          drift: 10
      - id: p3
        values:
          ch: 300
          dev_e: 3
          var_w: 7
          drift: 5
    explanation: >-
      The true track is the direction of the path over the ground measured from
      true north. The compass heading is first corrected to a true heading using
      deviation and variation. The drift to the right is then added, because the
      wind pushes the aircraft to the right of its heading.


      **Solution**


      - True heading = compass + easterly deviation - westerly variation = {{f:
      ch + dev_e - var_w}} = {{n: ch + dev_e - var_w}}

      - True track = true heading + drift to the right = {{n: ch + dev_e -
      var_w}} + {{drift}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: the drift was left out, so the true heading was taken as
      the track.

      - **{{d2}}°**: the deviation and variation were ignored.

      - **{{d3}}°**: the drift was subtracted, as if it were to the left.

      - **{{d4}}°**: the deviation sign was reversed.
