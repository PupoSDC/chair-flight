- id: QFQRFKGMF
  docId: "061.01"
  relatedQuestions:
    - QJ2M1EF8Y
  externalIds:
    - ATPLQ-614272
    - AVEXAM-58680
    - AVEXAM-14745
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      Two points lie on the same parallel of latitude, given:


      - Latitude of both points: {{lat_d}}° {{lat_m}}' N

      - Point A: {{a_d}}° {{a_m}}' W

      - Point B: {{b_d}}° {{b_m}}' E


      What is the distance between A and B along the parallel, by the shorter
      route? Give the answer in NM.
    variables:
      - id: lat_d
        label: Latitude degrees
        unit: °
      - id: lat_m
        label: Latitude minutes
        unit: "'"
      - id: a_d
        label: Longitude A degrees (W)
        unit: °
      - id: a_m
        label: Longitude A minutes (W)
        unit: "'"
      - id: b_d
        label: Longitude B degrees (E)
        unit: °
      - id: b_m
        label: Longitude B minutes (E)
        unit: "'"
    answer:
      formula: min(a_d + a_m / 60 + b_d + b_m / 60, 360 - (a_d + a_m / 60 + b_d + b_m
        / 60)) * 60 * cos(lat_d + lat_m / 60)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (a_d + a_m / 60 + b_d + b_m / 60) * 60 * cos(lat_d + lat_m / 60)
      - id: d2
        formula: (a_d + a_m / 60 - b_d - b_m / 60) * 60 * cos(lat_d + lat_m / 60)
      - id: d3
        formula: min(a_d + a_m / 60 + b_d + b_m / 60, 360 - (a_d + a_m / 60 + b_d + b_m
          / 60)) * 60
      - id: d4
        formula: min(a_d + a_m / 60 + b_d + b_m / 60, 360 - (a_d + a_m / 60 + b_d + b_m
          / 60)) * 60 * cos(lat_d + lat_m / 60) / 1.852
    presets:
      - id: p1
        values:
          lat_d: 32
          lat_m: 16
          a_d: 173
          a_m: 25
          b_d: 166
          b_m: 12
      - id: p2
        values:
          lat_d: 45
          lat_m: 0
          a_d: 175
          a_m: 10
          b_d: 170
          b_m: 30
      - id: p3
        values:
          lat_d: 60
          lat_m: 30
          a_d: 178
          a_m: 40
          b_d: 178
          b_m: 20
    explanation: >-
      Along a parallel, the distance is the difference in longitude in minutes
      of arc multiplied by the cosine of the latitude. When the two points are
      on opposite sides of the Greenwich meridian, the shorter route crosses the
      180º meridian. The longitude difference is then 360º minus the two
      longitudes added together.


      **Solution**


      - Distance on the shorter route: {{f: min(a_d + a_m / 60 + b_d + b_m / 60,
      360 - (a_d + a_m / 60 + b_d + b_m / 60)) * 60 * cos(lat_d + lat_m / 60)}}
      = {{n: min(a_d + a_m / 60 + b_d + b_m / 60, 360 - (a_d + a_m / 60 + b_d +
      b_m / 60)) * 60 * cos(lat_d + lat_m / 60)}} NM, which is **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the two longitudes and so takes the long way round the
      world

      - **{{d2}}**: subtracts the two longitudes as if both were on the same
      side of Greenwich

      - **{{d3}}**: forgets the cosine of the latitude, so it measures as if
      along the equator

      - **{{d4}}**: divides by 1.852, which gives kilometres, not nautical miles
