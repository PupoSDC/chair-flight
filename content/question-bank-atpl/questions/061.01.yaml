  template:
    type: calculation
    question: |-
      Calculate the Mach number, given the following:

      - Calibrated airspeed: {{cas}} kt
      - Pressure altitude: {{alt}} ft

      What is the Mach number?
    variables:
      - id: cas
        label: Calibrated airspeed
        unit: kt
      - id: alt
        label: Pressure altitude
        unit: ft
    answer:
      formula: sqrt(5 * ((((1 + 0.2 * (cas / 661.47) ^ 2) ^ 3.5 - 1) / (1 -
        0.0000068756 * alt) ^ 5.2559 + 1) ^ (2 / 7) - 1))
      unit: M
      decimals: 2
    distractors:
      - id: d1
        formula: sqrt(5 * ((1 + 0.2 * (cas / 661.47) ^ 2) ^ 3.5 - 1))
      - id: d2
        formula: cas / (38.9 * sqrt(288.15 - 0.0019812 * alt))
      - id: d3
        formula: sqrt(5 * ((((1 + 0.2 * (cas / 661.47) ^ 2) ^ 3.5 - 1) + 1) ^ (2 / 7) -
          1))
      - id: d4
        formula: sqrt(5 * ((((1 + 0.2 * (cas / 661.47) ^ 2) ^ 3.5 - 1) / (1 -
          0.0000068756 * alt) ^ 5.2559 + 1) ^ (2 / 7) - 1)) ^ 2
    presets:
      - id: p1
        values:
          cas: 190
          alt: 9000
      - id: p2
        values:
          cas: 220
          alt: 41000
      - id: p3
        values:
          cas: 250
          alt: 25000
    explanation: >-
      At speeds below Mach 1 the air is compressed as it enters the pitot tube,
      so the calibrated airspeed is not the same as the true airspeed. The Mach
      number follows from the impact pressure (the difference between total and
      static pressure) and the static pressure at the altitude. Air temperature
      and the compressibility factor are not needed.


      **Solution**


      Static pressure at {{alt}} ft = {{= 1013.25 * (1 - 0.0000068756 * alt) ^
      5.2559}} hPa


      Impact pressure from {{cas}} kt CAS = {{= 1013.25 * ((1 + 0.2 * (cas /
      661.47) ^ 2) ^ 3.5 - 1)}} hPa


      {{f: sqrt(5 * ((((1 + 0.2 * (cas / 661.47) ^ 2) ^ 3.5 - 1) / (1 -
      0.0000068756 * alt) ^ 5.2559 + 1) ^ (2 / 7) - 1))}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the altitude correction is missing and the power 2/7 is not
      applied.

      - **{{d2}}**: the speed of sound at the altitude is used as a simple
      ratio, without the compressibility correction.

      - **{{d3}}**: the sea-level static pressure is used instead of the
      pressure at the altitude.

      - **{{d4}}**: the Mach number is squared.
