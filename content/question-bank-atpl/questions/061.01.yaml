- id: QD1DOOB0X
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-618902
    - ATPLGS-110208
    - AVEXAM-57604
    - ATPLGS-625476
    - BGS-610026
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      What is the rhumb line distance between two positions on the same parallel
      of latitude?


      - Difference in longitude: {{dlon}}°

      - Latitude of both positions: {{lat}}°N


      What is the rhumb line distance?
    variables:
      - id: dlon
        label: Difference in longitude
        unit: °
      - id: lat
        label: Latitude
        unit: °
    answer:
      formula: dlon * 60 * cos(lat)
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: dlon * 60
      - id: d2
        formula: dlon * 60 * sin(lat)
      - id: d3
        formula: dlon * 60 / cos(lat)
    presets:
      - id: p1
        values:
          dlon: 10
          lat: 60
      - id: p2
        values:
          dlon: 5
          lat: 40
      - id: p3
        values:
          dlon: 20
          lat: 30
    explanation: >-
      On a parallel of latitude the rhumb line is the parallel itself. One
      degree of longitude is 60 NM only at the equator; on a parallel it is
      shorter by the cosine of the latitude.


      **Solution**


      Length of one degree of longitude at {{lat}}°N: 60 NM × cos {{lat}}° = {{=
      60 * cos(lat)}} NM


      Distance for {{dlon}}°: {{dlon}} × {{= 60 * cos(lat)}} = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} NM**: uses the equator length of a degree of longitude.

      - **{{d2}} NM**: uses the sine of the latitude instead of the cosine.

      - **{{d3}} NM**: divides by the cosine instead of multiplying.
