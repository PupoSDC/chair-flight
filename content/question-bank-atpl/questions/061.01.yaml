- id: QPWXUMLP
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617411
    - ATPLGS-625662
  annexes: []
  learningObjectives:
    - 061.01.05.04.01
  template:
    type: calculation
    question: >-
      Before departure the ATIS announces: take-off runway 35, W/V
      {{wind_dir}}°/{{wind_min}}-{{wind_max}} kt.


      On the airport chart the direction of runway 35 is {{rwy}}° and the
      magnetic variation is {{var}}° W.


      Calculate the maximum crosswind component for departure.
    variables:
      - id: rwy
        label: Runway direction
        unit: °
      - id: var
        label: Variation
        unit: °
      - id: wind_dir
        label: Wind direction
        unit: °
      - id: wind_min
        label: Minimum wind speed
        unit: kt
      - id: wind_max
        label: Maximum wind speed
        unit: kt
    answer:
      formula: abs(wind_max * sin(wind_dir - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: abs(wind_min * sin(wind_dir - rwy))
      - id: d2
        formula: abs(wind_max * sin(wind_dir - rwy + var))
      - id: d3
        formula: abs(wind_max * sin(wind_dir - rwy - var))
    presets:
      - id: p1
        values:
          rwy: 347
          var: 5
          wind_dir: 50
          wind_min: 20
          wind_max: 30
      - id: p2
        values:
          rwy: 90
          var: 6
          wind_dir: 140
          wind_min: 18
          wind_max: 28
    explanation: >-
      ATIS wind directions and the runway direction on the chart are magnetic,
      so no variation correction is needed. The maximum crosswind is obtained
      with the highest wind speed and the sine of the angle between wind and
      runway.


      **Solution**


      Angle = {{= abs(wind_dir - rwy)}}° (modulo 360°)


      {{f: wind_max * sin(wind_dir - rwy)}} = {{n: wind_max * sin(wind_dir -
      rwy)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the minimum wind speed was used instead of the maximum.

      - **{{d2}} kt**: the variation was added to the angle although the values
      are already magnetic.

      - **{{d3}} kt**: the variation was subtracted from the angle although the
      values are already magnetic.
