    - ATPLGS-110502
    - ATPLQ-616281
  annexes: []
  learningObjectives:
    - 061.01.08.03.04
  template:
    type: calculation
    question: >-
      An aircraft climbs from pressure altitude {{start_pa}} ft to FL{{top_fl}}.
      The average conditions during the climb are:


      - TAS: {{tas}} kt

      - Headwind component: {{hw}} kt

      - Rate of climb: {{roc}} ft/min


      What ground distance is covered during the climb, in NM?
    variables:
      - id: start_pa
        label: Start pressure altitude
        unit: ft
      - id: top_fl
        label: Top of climb (flight level)
        unit: FL
      - id: tas
        label: TAS
        unit: kt
      - id: hw
        label: Headwind component
        unit: kt
      - id: roc
        label: Rate of climb
        unit: ft/min
    answer:
      formula: ((top_fl * 100 - start_pa) / roc) * (tas - hw) / 60
      unit: NM
      decimals: 1
    distractors:
      - id: d1
        formula: ((top_fl * 100 - start_pa) / roc) * (tas + hw) / 60
      - id: d2
        formula: ((top_fl * 100 - start_pa) / roc) * tas / 60
      - id: d3
        formula: ((top_fl * 100 - start_pa) / roc) * (tas - hw)
      - id: d4
        formula: ((top_fl * 100 + start_pa) / roc) * (tas - hw) / 60
    presets:
      - id: p1
        values:
          start_pa: 2300
          top_fl: 100
          tas: 100
          hw: 20
          roc: 1000
      - id: p2
        values:
          start_pa: 2300
          top_fl: 50
          tas: 100
          hw: 20
          roc: 1000
      - id: p3
        values:
          start_pa: 2500
          top_fl: 140
          tas: 125
          hw: 20
          roc: 675
    explanation: >-
      The time to climb is the altitude gained divided by the rate of climb. The
      ground distance is that time multiplied by the groundspeed, which is the
      TAS reduced by the headwind component. Where the start is given on the
      QNH, the pressure altitude of the start is the elevation plus 30 ft for
      every hPa below 1013 hPa.


      **Solution**


      Altitude gained = FL{{top_fl}} − {{start_pa}} ft = {{= top_fl * 100 -
      start_pa}} ft


      Time to climb = {{= top_fl * 100 - start_pa}} ft ÷ {{roc}} ft/min = {{=
      (top_fl * 100 - start_pa) / roc}} min


      Groundspeed = {{tas}} kt − {{hw}} kt = {{= tas - hw}} kt


      Ground distance = {{= (top_fl * 100 - start_pa) / roc}} min × {{= tas -
      hw}} kt ÷ 60 = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: adds the headwind instead of subtracting it.

      - **{{d2}} NM**: uses the TAS without the headwind component.

      - **{{d3}} NM**: forgets to convert minutes into hours.

      - **{{d4}} NM**: adds the start altitude instead of subtracting it.
- id: Q43LPWHL7
  docId: "061.01"
  relatedQuestions:
    - QBEWFJXE
  externalIds:
    - ATPLQ-613320
    - ATPLGS-627154
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: |-
      Two positions lie on the same meridian, given:

      - Point A: {{a_d}}°{{a_m}}' N
      - Point B: {{b_d}}°{{b_m}}' S

      What is the shortest distance between A and B? Give the answer in km.
    variables:
      - id: a_d
        label: Latitude A, degrees
        unit: °
      - id: a_m
        label: Latitude A, minutes
        unit: "'"
      - id: b_d
        label: Latitude B, degrees
        unit: °
      - id: b_m
        label: Latitude B, minutes
        unit: "'"
    answer:
      formula: (a_d * 60 + a_m + b_d * 60 + b_m) * 1.852
      unit: km
      decimals: 0
    distractors:
      - id: d1
        formula: a_d * 60 + a_m + b_d * 60 + b_m
      - id: d2
        formula: (a_d * 60 + a_m + b_d * 60 + b_m) / 1.852
      - id: d3
        formula: (a_d * 60 + a_m - b_d * 60 - b_m) * 1.852
      - id: d4
        formula: (a_d * 60 + a_m + b_d * 60 + b_m) * 1.609
    presets:
      - id: p1
        values:
          a_d: 53
          a_m: 30
          b_d: 27
          b_m: 35
      - id: p2
        values:
          a_d: 40
          a_m: 15
          b_d: 10
          b_m: 45
    explanation: >-
      Both points are on the same meridian, so the shortest distance is the
      latitude difference in minutes, where one minute equals one NM. Point A
      and point B are in opposite hemispheres, so their distances from the
      equator are added. The result is converted from NM to km at 1.852 km per
      NM.


      **Solution**


      Distance in NM = {{n: a_d * 60 + a_m + b_d * 60 + b_m}} = {{= a_d * 60 +
      a_m + b_d * 60 + b_m}} NM


      Distance in km = {{= a_d * 60 + a_m + b_d * 60 + b_m}} x 1.852 =
      **{{answer}} km**


      **Why the other answers are wrong**


      - **{{d1}} km**: the distance in NM is given without converting it to km.

      - **{{d2}} km**: the distance is divided by 1.852 instead of multiplied.

      - **{{d3}} km**: the latitudes are subtracted, but the points are in
      opposite hemispheres.

      - **{{d4}} km**: the distance is multiplied by 1.609 (statute miles)
      instead of 1.852.
- id: Q43XRPY5D
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613835
  annexes: []
  learningObjectives:
    - 061.01.07.01.04
  template:
    type: calculation
    question: >-
      Using mental dead reckoning, determine the wind correction angle (WCA),
      given:


      - TAS: {{tas}} kt

      - Crosswind component: {{xw}} kt from the right


      Give the WCA in degrees: positive for a correction to the right, negative
      for a correction to the left.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: xw
        label: crosswind component
        unit: kt
    answer:
      formula: xw / (tas / 60)
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: -xw / (tas / 60)
      - id: d2
        formula: xw * tas / 60
      - id: d3
        formula: xw / (tas / 30)
      - id: d4
        formula: tas / xw
    presets:
      - id: p1
        values:
          tas: 108
          xw: 18
      - id: p2
        values:
          tas: 120
          xw: 12
      - id: p3
        values:
          tas: 150
          xw: 30
    explanation: >-
      The wind correction angle is the angle you turn into the wind to keep your
      track. Mental dead reckoning uses the rule that one degree of correction
      is worth TAS divided by 60 of crosswind, so the correction in degrees is
      the crosswind divided by TAS / 60. A crosswind from the right needs a
      correction to the right, shown as a positive angle.


      **Solution**


      Crosswind per degree of correction = TAS / 60 = {{n: tas / 60}} = {{= tas
      / 60}} kt


      WCA = {{f: xw / (tas / 60)}} = {{n: xw / (tas / 60)}} = **{{answer}}° to
      the right**


      **Why the other answers are wrong**


      - **{{d1}}°**: the right size, but the wrong side (a correction to the
      left).

      - **{{d2}}°**: multiplies by TAS / 60 instead of dividing by it.

      - **{{d3}}°**: divides by TAS / 30 instead of TAS / 60, using the wrong
      constant.

      - **{{d4}}°**: inverts the ratio and divides the TAS by the crosswind
      component.
