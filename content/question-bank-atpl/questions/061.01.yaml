- id: QEJOVSKX
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619129
    - AVEXAM-71782
    - ATPLQ-615197
    - BGS-611439
    - AVEXAM-72493
    - ATPLGS-625600
    - ATPLQ-617063
    - AVEXAM-71543
    - ATPLQ-619520
    - AVEXAM-81809
    - ATPLGS-625355
    - ATPLQ-614889
    - ATPLGS-626324
    - ATPLGS-626336
    - BGS-611678
  annexes: []
  learningObjectives:
    - 061.03.01.01.03
  template:
    type: calculation
    question: |-
      Determine the great circle distance between two positions:

      - Position A: {{lat1_d}}°{{lat1_m}}'N, {{lon1_d}}°{{lon1_m}}'E
      - Position B: {{lat2_d}}°{{lat2_m}}'N, {{lon2_d}}°{{lon2_m}}'W

      What is the shortest distance between A and B in NM?
    variables:
      - id: lat1_d
        label: Latitude A, degrees
        unit: °
      - id: lat1_m
        label: Latitude A, minutes
        unit: "'"
      - id: lon1_d
        label: Longitude A, degrees
        unit: °
      - id: lon1_m
        label: Longitude A, minutes
        unit: "'"
      - id: lat2_d
        label: Latitude B, degrees
        unit: °
      - id: lat2_m
        label: Latitude B, minutes
        unit: "'"
      - id: lon2_d
        label: Longitude B, degrees
        unit: °
      - id: lon2_m
        label: Longitude B, minutes
        unit: "'"
    answer:
      formula: 60 * acos(sin((lat1_d + lat1_m / 60)) * sin((lat2_d + lat2_m / 60)) +
        cos((lat1_d + lat1_m / 60)) * cos((lat2_d + lat2_m / 60)) * cos((lon1_d
        + lon1_m / 60) + (lon2_d + lon2_m / 60)))
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: 30 * acos(sin((lat1_d + lat1_m / 60)) * sin((lat2_d + lat2_m / 60)) +
          cos((lat1_d + lat1_m / 60)) * cos((lat2_d + lat2_m / 60)) *
          cos((lon1_d + lon1_m / 60) + (lon2_d + lon2_m / 60)))
      - id: d2
        formula: 120 * acos(sin((lat1_d + lat1_m / 60)) * sin((lat2_d + lat2_m / 60)) +
          cos((lat1_d + lat1_m / 60)) * cos((lat2_d + lat2_m / 60)) *
          cos((lon1_d + lon1_m / 60) + (lon2_d + lon2_m / 60)))
      - id: d3
        formula: 60 * acos(sin((lat1_d + lat1_m / 60)) * sin((lat2_d + lat2_m / 60)) +
          cos((lat1_d + lat1_m / 60)) * cos((lat2_d + lat2_m / 60)) *
          cos((lon1_d + lon1_m / 60) + (lon2_d + lon2_m / 60))) * 1.852
      - id: d4
        formula: 60 * ((lon1_d + lon1_m / 60) + (lon2_d + lon2_m / 60)) * cos((((lat1_d
          + lat1_m / 60) + (lat2_d + lat2_m / 60)) / 2))
    presets:
      - id: p1
        values:
          lat1_d: 59
          lat1_m: 34.1
          lon1_d: 8
          lon1_m: 8.4
          lat2_d: 30
          lat2_m: 25.9
          lon2_d: 171
          lon2_m: 51.6
      - id: p2
        values:
          lat1_d: 66
          lat1_m: 30
          lon1_d: 20
          lon1_m: 20
          lat2_d: 66
          lat2_m: 30
          lon2_d: 159
          lon2_m: 40
      - id: p3
        values:
          lat1_d: 30
          lat1_m: 20
          lon1_d: 20
          lon1_m: 20
          lat2_d: 30
          lat2_m: 20
          lon2_d: 159
          lon2_m: 40
      - id: p4
        values:
          lat1_d: 66
          lat1_m: 0
          lon1_d: 20
          lon1_m: 0
          lat2_d: 66
          lat2_m: 0
          lon2_d: 160
          lon2_m: 0
      - id: p5
        values:
          lat1_d: 73
          lat1_m: 29
          lon1_d: 160
          lon1_m: 0
          lat2_d: 65
          lat2_m: 30
          lon2_d: 20
          lon2_m: 0
    explanation: >-
      The shortest distance between two positions is the great circle distance.
      It is the arc of the great circle through both positions, measured along
      the surface of the Earth. One degree of arc equals 60 NM.


      **Solution**


      Longitude difference between A and B: {{= ((lon1_d + lon1_m / 60) +
      (lon2_d + lon2_m / 60))}}°


      {{f: 60 * acos(sin((lat1_d + lat1_m / 60)) * sin((lat2_d + lat2_m / 60)) +
      cos((lat1_d + lat1_m / 60)) * cos((lat2_d + lat2_m / 60)) * cos((lon1_d +
      lon1_m / 60) + (lon2_d + lon2_m / 60)))}} = {{n: 60 * acos(sin((lat1_d +
      lat1_m / 60)) * sin((lat2_d + lat2_m / 60)) + cos((lat1_d + lat1_m / 60))
      * cos((lat2_d + lat2_m / 60)) * cos((lon1_d + lon1_m / 60) + (lon2_d +
      lon2_m / 60)))}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: half of the arc is taken.

      - **{{d2}} NM**: the arc is doubled.

      - **{{d3}} NM**: the distance is converted to kilometres and that figure
      is written as nautical miles.

      - **{{d4}} NM**: the east-west distance along the mean latitude is used
      (rhumb line approximation), which is longer than the great circle
      distance.
- id: QEPTD6LCF
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616136
    - BGS-611410
    - BGS-611443
    - ATPLGS-625478
    - BGS-611279
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
    - 061.01.05.04.02
  template:
    type: calculation
    question: >-
      The following information is for an aircraft in the cruise at 11:50 UTC.


      Cruise level: FL410


      - OAT: ISA +{{isa_dev}}°C

      - Mach number: {{mach}}

      - Wind component: {{wc}} kt (negative = headwind)


      What will be the groundspeed? (Use a local speed of sound of 38.9 *
      sqrt(T) kt, T in kelvin; ISA temperature at FL410 is -56.5°C.)
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: isa_dev
        label: ISA deviation
        unit: °C
      - id: wc
        label: Wind component
        unit: kt
    answer:
      formula: mach * 38.9 * sqrt(273.15 - 56.5 + isa_dev) + wc
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach * 38.9 * sqrt(273.15 - 56.5 + isa_dev) - wc
      - id: d2
        formula: mach * 38.9 * sqrt(273.15 - 56.5 + isa_dev)
      - id: d3
        formula: mach * 38.9 * sqrt(273.15 - 56.5) + wc
      - id: d4
        formula: mach * 38.9 * sqrt(288.15 + isa_dev) + wc
    presets:
      - id: p1
        values:
          mach: 0.86
          isa_dev: 10
          wc: -25
      - id: p2
        values:
          mach: 0.82
          isa_dev: 15
          wc: -40
      - id: p3
        values:
          mach: 0.78
          isa_dev: 5
          wc: 30
    explanation: >-
      Groundspeed is true airspeed plus the wind component along track. The true
      airspeed follows from the Mach number and the speed of sound, which
      depends on the static air temperature: the ISA temperature at FL410 plus
      the ISA deviation.


      **Solution**


      Static air temperature = -56.5 + {{isa_dev}} = {{= -56.5 + isa_dev}} °C,
      which is {{= 273.15 - 56.5 + isa_dev}} K


      TAS = {{mach}} × 38.9 × √{{= 273.15 - 56.5 + isa_dev}} = {{= mach * 38.9 *
      sqrt(273.15 - 56.5 + isa_dev)}} kt


      Groundspeed = TAS + wind component = {{= mach * 38.9 * sqrt(273.15 - 56.5
      + isa_dev)}} + ({{wc}}) = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the wind component is applied with the wrong sign.

      - **{{d2}} kt**: the wind component is ignored, so the groundspeed equals
      the TAS.

      - **{{d3}} kt**: the ISA deviation is ignored when computing the
      temperature and hence the speed of sound.

      - **{{d4}} kt**: the sea-level temperature is used instead of the
      temperature at FL410.
