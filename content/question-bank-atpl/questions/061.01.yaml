  template:
    type: calculation
    question: >-
      A pilot flies from aerodrome A to aerodrome B and returns after a quick
      turn-around. The wind conditions are the same for both flights.


      - Average true airspeed for both flights: {{tas}} kt

      - Headwind component from A to B: {{hw}} kt


      What is the average groundspeed for the return flight?
    variables:
      - id: tas
        label: True airspeed
        unit: kt
      - id: hw
        label: Headwind from A to B
        unit: kt
    answer:
      formula: tas + hw
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - hw
      - id: d2
        formula: tas
      - id: d3
        formula: tas + 2 * hw
      - id: d4
        formula: tas - 2 * hw
    presets:
      - id: p1
        values:
          tas: 145
          hw: 25
      - id: p2
        values:
          tas: 120
          hw: 15
      - id: p3
        values:
          tas: 160
          hw: 30
    explanation: >-
      On the return flight the wind is reversed, so the headwind on the outbound
      leg becomes a tailwind. The groundspeed on the return is the true airspeed
      plus the tailwind.


      **Solution**


      {{tas}} kt + {{hw}} kt = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the wind is taken as a headwind on both legs.

      - **{{d2}} kt**: the wind is ignored.

      - **{{d3}} kt**: the wind is added twice.

      - **{{d4}} kt**: the wind is subtracted twice.
