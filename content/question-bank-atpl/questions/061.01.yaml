- id: QR09SA55O
  docId: "061.01"
  relatedQuestions:
    - QRCJVUZY
    - QVDTYXGB
  externalIds:
    - ATPLQ-618896
  annexes: []
  learningObjectives:
    - 061.01.03.02.06
  template:
    type: calculation
    question: >-
      A pilot flies a planned track towards a VOR and is blown off track by the
      wind.


      - Distance flown: {{dist}} NM

      - Off-track distance (towards the forecast wind): {{xt}} NM


      Using the 1 in 60 rule, give the magnitude of the average drift in
      degrees.
    variables:
      - id: dist
        label: Distance flown
        unit: NM
      - id: xt
        label: Off-track distance
        unit: NM
    answer:
      formula: 60 * xt / dist
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: 30 * xt / dist
      - id: d2
        formula: 2 * xt
      - id: d3
        formula: atan(xt / dist)
      - id: d4
        formula: 60 * xt / (dist - xt)
    presets:
      - id: p1
        values:
          dist: 60
          xt: 10
      - id: p2
        values:
          dist: 40
          xt: 8
    explanation: >-
      The 1 in 60 rule gives the drift directly from the off-track distance and
      the distance flown: for every 60 NM flown, 1 NM off track equals 1 degree
      of drift.


      **Solution**


      Drift: {{f: 60 * xt / dist}} = {{n: 60 * xt / dist}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: halves the drift.

      - **{{d2}}°**: doubles the off-track distance instead of applying the
      rule.

      - **{{d3}}°**: uses the arctangent instead of the 1 in 60 rule.

      - **{{d4}}°**: uses the distance remaining after the off-track distance
      instead of the distance flown.
- id: QR7GOQWUT
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619157
    - ATPLGS-625515
    - BGS-610060
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: |-
      An aircraft flies a true track of 090º from a starting position, given:

      - Start latitude: {{lat}}° N
      - Start longitude: {{lon}}° W
      - Distance flown: {{dist}} km

      What is the new longitude?
    variables:
      - id: lat
        label: Latitude
        unit: °
      - id: lon
        label: Start longitude (west)
        unit: °
      - id: dist
        label: Distance
        unit: km
    answer:
      formula: dist / 1.852 / cos(lat) - lon * 60
      unit: minutes
      decimals: 0
      format: hh'°'mm'’E'
    distractors:
      - id: d1
        formula: dist / 1.852 / cos(lat) + lon * 60
      - id: d2
        formula: dist / 1.852 / cos(lat) - lon
      - id: d3
        formula: dist / 1.852 * cos(lat) + lon * 60
      - id: d4
        formula: dist / cos(lat) - lon * 60
    presets:
      - id: p1
        values:
          lat: 60
          lon: 5
          dist: 315
      - id: p2
        values:
          lat: 45
          lon: 10
          dist: 1000
      - id: p3
        values:
          lat: 30
          lon: 2
          dist: 200
    explanation: >-
      Track 090º is due east, so you stay on the same parallel and only your
      longitude changes. The distance must be in NM (1 NM = 1.852 km), and one
      minute of longitude on a parallel is shorter than a NM by the factor
      cos(latitude). The minutes travelled east are first used up by the
      westerly start longitude, and the rest is the new longitude east of
      Greenwich.


      **Solution**


      - Distance in NM: {{f: dist / 1.852}} = {{= dist / 1.852}} NM

      - Change in longitude: {{f: dist / 1.852 / cos(lat)}} = {{= dist / 1.852 /
      cos(lat)}} minutes of arc

      - Start longitude: {{lon}}º W = {{= lon * 60}} minutes west

      - New longitude: {{n: dist / 1.852 / cos(lat) - lon * 60}} minutes east,
      which is **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: adds the westerly start longitude instead of taking it away

      - **{{d2}}**: subtracts the start longitude in degrees instead of
      converting it to minutes

      - **{{d3}}**: multiplies by cos(latitude) instead of dividing by it, and
      adds the start longitude

      - **{{d4}}**: uses the distance in km as if it were in NM
