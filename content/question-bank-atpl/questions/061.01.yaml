  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-614790
  annexes: []
  learningObjectives:
    - 061.01.03.02.03
  template:
    type: calculation
    question: |-
      The aircraft has a drift to the left. Given:

      - True heading: {{th}}°
      - Drift: {{drift}}° left

      What is the true track?
    variables:
      - id: th
        label: True heading
        unit: °
      - id: drift
        label: Drift
        unit: °
    answer:
      formula: th - drift
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: th + drift
      - id: d2
        formula: th
      - id: d3
        formula: th - 2 * drift
      - id: d4
        formula: th + 2 * drift
    presets:
      - id: p1
        values:
          th: 198
          drift: 7
      - id: p2
        values:
          th: 200
          drift: 5
      - id: p3
        values:
          th: 45
          drift: 12
    explanation: >-
      A drift to the left means the aircraft is carried to the left of its
      heading, so the track lies to the left of the heading. The drift is
      therefore subtracted from the true heading to give the true track.


      **Solution**


      - {{f: th - drift}} = {{n: th - drift}} = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°**: the drift is added, which puts the track to the right of
      the heading (sign mistake).

      - **{{d2}}°**: the drift is forgotten and the heading is taken as the
      track.

      - **{{d3}}°**: the drift is doubled and subtracted.

      - **{{d4}}°**: the drift is doubled and added to the heading.
- id: QZQHETTXL
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617037
  annexes: []
  learningObjectives:
    - 061.01.05.04.06
  template:
    type: calculation
    question: >-
      A flight crew is instructed by ATC to delay their arrival at the next
      waypoint by {{delay}} minutes. Calculate the new ground speed they must
      fly to achieve this.


      - Distance to go: {{dist}} NM

      - Level: {{alt}} ft

      - CAS: {{cas}} kt

      - Temperature: ISA +{{isa}} °C

      - Headwind component: {{hw}} kt


      What new ground speed must be flown?
    variables:
      - id: dist
        label: Distance to go
        unit: NM
      - id: alt
        label: Level
        unit: ft
      - id: cas
        label: CAS
        unit: kt
      - id: isa
        label: ISA deviation
        unit: °C
      - id: hw
        label: Headwind component
        unit: kt
      - id: delay
        label: Delay
        unit: min
    answer:
      formula: dist / (dist / (round(cas / sqrt((1 - 0.0065 * alt * 0.3048 / 288.15) ^
        5.2559 * 288.15 / (288.15 - 0.0065 * alt * 0.3048 + isa))) - hw) + delay
        / 60)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: round(cas / sqrt((1 - 0.0065 * alt * 0.3048 / 288.15) ^ 5.2559 * 288.15
          / (288.15 - 0.0065 * alt * 0.3048 + isa))) - hw
      - id: d2
        formula: dist / (dist / (round(cas / sqrt((1 - 0.0065 * alt * 0.3048 / 288.15) ^
          5.2559 * 288.15 / (288.15 - 0.0065 * alt * 0.3048 + isa))) - hw) -
          delay / 60)
      - id: d3
        formula: round(cas / sqrt((1 - 0.0065 * alt * 0.3048 / 288.15) ^ 5.2559 * 288.15
          / (288.15 - 0.0065 * alt * 0.3048 + isa))) + hw
      - id: d4
        formula: dist / (dist / (round(cas / sqrt((1 - 0.0065 * alt * 0.3048 / 288.15) ^
          5.2559 * 288.15 / (288.15 - 0.0065 * alt * 0.3048 + isa))) - hw) +
          delay)
    presets:
      - id: p1
        values:
          dist: 206
          alt: 10000
          cas: 137
          isa: 10
          hw: 20
          delay: 5
      - id: p2
        values:
          dist: 150
          alt: 5000
          cas: 120
          isa: 5
          hw: 15
          delay: 6
      - id: p3
        values:
          dist: 300
          alt: 12000
          cas: 160
          isa: 15
          hw: 30
          delay: 10
    explanation: >-
      A delay means the same distance is covered in a longer time, so the ground
      speed has to come down. The true airspeed is read from the computer using
      the CAS, the level and the temperature, and it is taken to the nearest
      knot. The headwind is subtracted to give the ground speed flown now. The
      time to the waypoint is then extended by the delay, and the new ground
      speed is the one that covers the same distance in that longer time.


      **Solution**


      - True airspeed, to the nearest knot: {{= round(cas / sqrt((1 - 0.0065 *
      alt * 0.3048 / 288.15) ^ 5.2559 * 288.15 / (288.15 - 0.0065 * alt * 0.3048
      + isa)))}} kt

      - Ground speed flown now: {{= round(cas / sqrt((1 - 0.0065 * alt * 0.3048
      / 288.15) ^ 5.2559 * 288.15 / (288.15 - 0.0065 * alt * 0.3048 + isa))) -
      hw}} kt

      - New ground speed for the delayed time: **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: keeps the ground speed flown now, so the delay is not
      used.

      - **{{d2}} kt**: subtracts the delay, which speeds the aircraft up instead
      of slowing it down.

      - **{{d3}} kt**: adds the headwind to the true airspeed instead of taking
      it off.

      - **{{d4}} kt**: adds the delay in minutes without converting it into
      hours.
