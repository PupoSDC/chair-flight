    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      An aircraft flies with a ground speed of {{gs}} kt for {{time_min}}
      minutes.


      What ground distance will be covered? Give the answer in NM.
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: time_min
        label: Flight time
        unit: minutes
    answer:
      formula: gs * time_min / 60
      unit: NM
      decimals: 2
    distractors:
      - id: d1
        formula: gs * time_min
      - id: d2
        formula: gs / time_min
      - id: d3
        formula: gs * time_min / 100
      - id: d4
        formula: gs * time_min / 60 * 1.852
    presets:
      - id: p1
        values:
          gs: 135
          time_min: 1.75
      - id: p2
        values:
          gs: 150
          time_min: 92
    explanation: >-
      The distance flown is the ground speed multiplied by the time flown.
      Ground speed is in knots (NM per hour), so the time must first be
      expressed in hours, which means dividing the minutes by 60.


      **Solution**


      {{f: gs * time_min / 60}} = {{n: gs * time_min / 60}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the time in minutes is multiplied directly, without
      converting it to hours.

      - **{{d2}} NM**: the ground speed is divided by the time instead of
      multiplied.

      - **{{d3}} NM**: the time is divided by 100 instead of 60.

      - **{{d4}} km**: the answer is converted to kilometres (x 1.852) instead
      of being kept in NM.
