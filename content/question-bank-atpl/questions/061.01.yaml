- id: QYAUXWVA
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-617523
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
  template:
    type: chart-calculation
    question: >-
      Using the flight computer (CRP-3) and the data below, determine the true
      airspeed.


      - True altitude: {{alt}} ft

      - OAT: {{oat}} °C

      - CAS: {{cas}} kt


      The density ratio for this altitude and temperature is read from the
      flight computer.


      What is the TAS (kt)?
    variables:
      - id: alt
        label: True altitude
        unit: ft
      - id: oat
        label: OAT
        unit: °C
      - id: cas
        label: CAS
        unit: kt
      - id: sigma
        label: Density ratio (read from the flight computer)
        unit: ""
    chartInputs:
      - sigma
    answer:
      formula: cas / sqrt(sigma)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas * sigma
      - id: d2
        formula: cas
      - id: d3
        formula: cas / sigma
      - id: d4
        formula: cas * sqrt(sigma)
    presets:
      - id: p1
        values:
          alt: 3000
          oat: -45
          cas: 150
          sigma: 1.164
      - id: p2
        values:
          alt: 5000
          oat: -20
          cas: 180
          sigma: 1.2
      - id: p3
        values:
          alt: 8000
          oat: -30
          cas: 130
          sigma: 1.31
    explanation: >-
      The flight computer converts calibrated airspeed into true airspeed.
      Thinner air at altitude lets the aircraft move faster through the air for
      the same airspeed reading, so the TAS is higher than the CAS. The
      correction depends on the altitude and the temperature, which together
      give the density ratio.


      **Solution**


      - Set the true altitude and the OAT on the computer.

      - Read the density ratio opposite these values.

      - Set the CAS against the density ratio and read the TAS on the computer.

      - The TAS is **{{answer}} kt**.


      **Why the other answers are wrong**


      - **{{d1}} kt**: the density ratio is multiplied instead of divided, so
      the TAS is far too high.

      - **{{d2}} kt**: the CAS is used as the TAS, so no altitude correction is
      made.

      - **{{d3}} kt**: the square root is left out of the correction.

      - **{{d4}} kt**: the square root of the density ratio is multiplied
      instead of divided.
