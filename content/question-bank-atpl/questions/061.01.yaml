- id: QJHKRXGU
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611524
    - BGS-610475
    - AVEXAM-13696
    - ATPLGS-111129
    - ATPLGS-625360
    - BGS-610448
  annexes: []
  learningObjectives:
    - 061.01.05.04.01
  template:
    type: calculation
    question: >-
      Given the following information, what is the maximum allowable wind speed
      that can be accepted without exceeding the tailwind limit?


      - Maximum allowable tailwind component for landing: {{tw_max}} kt

      - Planned runway heading: {{rwy}}°M

      - Surface wind direction reported by ATIS: {{wd}}°

      - VAR: {{var}}°E
    variables:
      - id: tw_max
        label: Maximum allowable tailwind
        unit: kt
      - id: rwy
        label: Runway heading (magnetic)
        unit: °M
      - id: wd
        label: Surface wind direction
        unit: °
      - id: var
        label: Variation
        unit: °E
    answer:
      formula: tw_max / abs(cos(wd - rwy))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tw_max / abs(sin(wd - rwy))
      - id: d2
        formula: tw_max / abs(cos(wd - rwy - var))
      - id: d3
        formula: tw_max / abs(cos(wd - rwy)) + tw_max
      - id: d4
        formula: tw_max / abs(cos(wd - rwy)) * 1.5
    presets:
      - id: p1
        values:
          tw_max: 10
          rwy: 47
          wd: 210
          var: 17
      - id: p2
        values:
          tw_max: 12
          rwy: 230
          wd: 40
          var: 10
      - id: p3
        values:
          tw_max: 8
          rwy: 120
          wd: 280
          var: 25
    explanation: >-
      Only the part of the wind that blows along the runway counts. The ATIS
      wind and the runway heading are both magnetic, so the variation is not
      needed. When the wind is almost along the runway, the wind speed can be
      higher before the tailwind limit is reached.


      **Solution**


      Angle between wind and runway: {{= abs(wd - rwy)}}°, so the share of the
      wind along the runway is {{= abs(cos(wd - rwy))}}


      Maximum wind speed = {{tw_max}} kt ÷ {{= abs(cos(wd - rwy))}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the sine of the angle, which is the crosswind share,
      not the tailwind share.

      - **{{d2}} kt**: applies the variation to the wind, which is not needed
      when both values are magnetic.

      - **{{d3}} kt**: adds the tailwind limit on top of the answer.

      - **{{d4}} kt**: applies an extra 50% to the answer.
- id: QJIN0JRPK
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-613243
  annexes: []
  learningObjectives:
    - 061.01.05.02.01
  template:
    type: calculation
    question: >-
      Given the following information, find the TAS if the Mach number is
      {{mach}}.


      - OAT: {{oat}}°C

      - TAT: {{tat}}°C

      - ISA deviation: {{isa}}°C
    variables:
      - id: mach
        label: Mach number
        unit: ""
      - id: oat
        label: OAT
        unit: °C
      - id: tat
        label: TAT
        unit: °C
      - id: isa
        label: ISA deviation
        unit: °C
    answer:
      formula: mach * 38.97 * sqrt(oat + 273.15)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: mach * 38.97 * sqrt(tat + 273.15)
      - id: d2
        formula: mach * 38.97 * sqrt(oat - isa + 273.15)
      - id: d3
        formula: mach * 661.5
    presets:
      - id: p1
        values:
          mach: 0.65
          oat: -35
          tat: -15
          isa: 20
      - id: p2
        values:
          mach: 0.75
          oat: -40
          tat: -20
          isa: 15
      - id: p3
        values:
          mach: 0.7
          oat: -30
          tat: -12
          isa: 5
    explanation: >-
      The TAS is the Mach number times the local speed of sound. The speed of
      sound depends only on the absolute temperature of the air, which is the
      static air temperature (OAT). The TAT and the ISA deviation are not
      needed.


      **Solution**


      Absolute temperature: {{= oat + 273.15}} K, so the speed of sound is {{=
      38.97 * sqrt(oat + 273.15)}} kt


      {{f: mach * 38.97 * sqrt(oat + 273.15)}} = {{n: mach * 38.97 * sqrt(oat +
      273.15)}} = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the total air temperature, which is warmer because
      of compression at speed.

      - **{{d2}} kt**: uses the wrong sign for the ISA deviation to get the
      temperature.

      - **{{d3}} kt**: uses the sea-level speed of sound instead of the one at
      the actual temperature.
