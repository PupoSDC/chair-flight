- id: QVMOUVKV
  docId: 061.01.01.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-611529
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
    - 061.01.05.04.05
  template:
    type: calculation
    question: >-
      An aircraft flies once around the Earth along the parallel of {{lat}}°N,
      starting and ending at point A.


      - Groundspeed: {{gs}} kt

      - Actual time of departure from A: {{dep_h}} h {{dep_min}} min


      Round the flight time to the nearest whole hour. What is the ETA back at
      point A (hh:mm)?
    variables:
      - id: lat
        label: Latitude
        unit: °N
      - id: gs
        label: Groundspeed
        unit: kt
      - id: dep_h
        label: Departure hour
        unit: h
      - id: dep_min
        label: Departure minute
        unit: min
    answer:
      formula: 60 * dep_h + dep_min + 60 * round(21600 * cos(lat) / gs)
      unit: minutes
      decimals: 0
      format: hh:mm
    distractors:
      - id: d1
        formula: 60 * dep_h + dep_min - 60 * round(21600 * cos(lat) / gs)
      - id: d2
        formula: 60 * dep_h + dep_min + 60 * round(21600 * cos(lat) / gs) + 60
      - id: d3
        formula: 60 * dep_h + dep_min + 60 * round(21600 * cos(lat) / (2 * gs))
      - id: d4
        formula: 60 * dep_h + dep_min
    presets:
      - id: p1
        values:
          lat: 88
          gs: 150
          dep_h: 8
          dep_min: 25
      - id: p2
        values:
          lat: 80
          gs: 400
          dep_h: 10
          dep_min: 40
      - id: p3
        values:
          lat: 70
          gs: 700
          dep_h: 11
          dep_min: 30
    explanation: >-
      Flying once round a parallel of latitude covers 360 degrees of longitude.
      At a higher latitude each degree of longitude is shorter, by the cosine of
      the latitude. One degree of longitude on the equator is 60 NM, so the
      distance is 21600 times the cosine of the latitude, in NM. The flight time
      is that distance divided by the groundspeed.


      **Solution**


      - Distance round the parallel: {{= 21600 * cos(lat)}} NM

      - Flight time: {{= 21600 * cos(lat) / gs}} h, rounded to {{= round(21600 *
      cos(lat) / gs)}} h

      - ETA: {{dep_h}} h {{dep_min}} min + {{= round(21600 * cos(lat) / gs)}} h
      = **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: the flight time is subtracted instead of added.

      - **{{d2}}**: one extra hour is added.

      - **{{d3}}**: half the distance is flown, as if only half the parallel
      were circled.

      - **{{d4}}**: the flight time is forgotten.
- id: QVMTYXVU
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-616719
  annexes: []
  learningObjectives:
    - 061.01.05.01.01
    - 061.01.08.01.02
  template:
    type: calculation
    question: |-
      You are planning a descent to mean sea level in ISA conditions, given:

      - Top of descent altitude: {{top}} ft
      - Calibrated airspeed (CAS): {{cas}} kt

      What TAS should you use for your descent calculation?
    variables:
      - id: top
        label: Top of descent altitude
        unit: ft
      - id: cas
        label: CAS
        unit: kt
    answer:
      formula: cas / sqrt((1 - 0.00000687558 * top / 2) ^ 4.2559)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: cas
      - id: d2
        formula: cas / sqrt((1 - 0.00000687558 * top) ^ 4.2559)
      - id: d3
        formula: cas * (1 + 0.02 * top / 1000)
      - id: d4
        formula: cas / ((1 - 0.00000687558 * top / 2) ^ 4.2559)
    presets:
      - id: p1
        values:
          top: 24000
          cas: 120
      - id: p2
        values:
          top: 30000
          cas: 150
      - id: p3
        values:
          top: 18000
          cas: 200
    explanation: >-
      TAS is CAS corrected for the thinner air at height: the same CAS gives a
      higher TAS the higher you are. A descent passes through a range of
      heights, so the TAS is taken at the average height of the descent, which
      is half the top of descent altitude when you finish at sea level.


      **Solution**


      - Average altitude of the descent: {{f: top / 2}} = {{= top / 2}} ft

      - TAS: {{f: cas / sqrt((1 - 0.00000687558 * top / 2) ^ 4.2559)}} = {{n:
      cas / sqrt((1 - 0.00000687558 * top / 2) ^ 4.2559)}} kt, which is
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses CAS as if it were TAS, which is only true at sea
      level

      - **{{d2}} kt**: uses the air density at the top of descent instead of the
      average height

      - **{{d3}} kt**: adds a rough 2 % per 1 000 ft to the CAS, which does not
      follow the ISA atmosphere

      - **{{d4}} kt**: divides by the density ratio instead of its square root
