- id: QGRZMESW
  docId: "061.01"
  relatedQuestions:
    - QTJJSLWD
  externalIds:
    - ATPLQ-613349
    - ATPLGS-110499
    - AVEXAM-75654
  annexes: []
  learningObjectives:
    - 061.01.05.06.01
  template:
    type: calculation
    question: >-
      An aircraft descends along a track that crosses a VOR, given:


      - Point 1: {{alt_hi}} ft, {{d_north}} NM north of the VOR

      - Point 2: {{alt_lo}} ft, {{d_south}} NM south of the VOR


      What is the average descent gradient (%) between the two points? Use 1 NM
      = 6 000 ft.
    variables:
      - id: alt_hi
        label: Altitude at point 1
        unit: ft
      - id: d_north
        label: Distance north of the VOR
        unit: NM
      - id: alt_lo
        label: Altitude at point 2
        unit: ft
      - id: d_south
        label: Distance south of the VOR
        unit: NM
    answer:
      formula: (alt_hi - alt_lo) / ((d_north + d_south) * 6000) * 100
      unit: "%"
      decimals: 0
    distractors:
      - id: d1
        formula: (alt_hi - alt_lo) / ((d_north - d_south) * 6000) * 100
      - id: d2
        formula: (alt_hi + alt_lo) / ((d_north + d_south) * 6000) * 100
      - id: d3
        formula: atan((alt_hi - alt_lo) / ((d_north + d_south) * 6000))
      - id: d4
        formula: (alt_hi - alt_lo) / ((d_north + d_south) * 1852) * 100
    presets:
      - id: p1
        values:
          alt_hi: 35000
          d_north: 60
          alt_lo: 12000
          d_south: 10
      - id: p2
        values:
          alt_hi: 40000
          d_north: 80
          alt_lo: 10000
          d_south: 30
      - id: p3
        values:
          alt_hi: 39000
          d_north: 80
          alt_lo: 5000
          d_south: 25
    explanation: >-
      The two points lie on the same track on either side of the VOR, so the
      horizontal distance between them is the two distances added together. The
      gradient is the height lost divided by that distance, shown as a
      percentage, with 1 NM = 6 000 ft.


      **Solution**


      - Height lost: {{f: alt_hi - alt_lo}} = {{n: alt_hi - alt_lo}} ft

      - Distance between the points: {{f: d_north + d_south}} = {{n: d_north +
      d_south}} NM

      - Gradient: {{f: (alt_hi - alt_lo) / ((d_north + d_south) * 6000) * 100}}
      = {{= (alt_hi - alt_lo) / ((d_north + d_south) * 6000) * 100}} %, so about
      **{{answer}} %**


      **Why the other answers are wrong**


      - **{{d1}} %**: subtracts the two distances, as if both points were on the
      same side of the VOR

      - **{{d2}} %**: adds the two altitudes instead of taking the height lost

      - **{{d3}}**: an angle in degrees, not a gradient in percent

      - **{{d4}} %**: uses 1 852 instead of 6 000 for a nautical mile (the metre
      value used as feet)
