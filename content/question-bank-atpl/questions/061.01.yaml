- id: QLKBPRKO
  docId: 061.01.03.01
  relatedQuestions: []
  externalIds:
    - ATPLQ-616007
  annexes: []
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: calculation
    question: |-
      The island is observed in the following position.

      - Relative bearing: {{rel}}° left
      - Magnetic heading: {{hdg}}°M
      - Variation: {{var}}°W

      What is the true bearing from the aircraft to the island?
    variables:
      - id: hdg
        label: magnetic heading
        unit: °
      - id: rel
        label: relative bearing (left)
        unit: °
      - id: var
        label: variation (west)
        unit: °
    answer:
      formula: hdg - rel - var
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: hdg + rel + var
      - id: d2
        formula: hdg - rel + var
      - id: d3
        formula: hdg - rel
      - id: d4
        formula: hdg + rel - var
    presets:
      - id: p1
        values:
          hdg: 120
          rel: 15
          var: 17
      - id: p2
        values:
          hdg: 250
          rel: 30
          var: 10
      - id: p3
        values:
          hdg: 60
          rel: 45
          var: 8
    explanation: >-
      A bearing to the left of the nose is subtracted from the heading to get
      the magnetic bearing of the island. Magnetic is converted to true with the
      variation; for west variation the value is subtracted.


      **Solution**


      Magnetic bearing = heading - relative bearing = {{f: hdg - rel}} = {{n:
      hdg - rel}}°M


      True bearing = magnetic bearing - west variation = {{f: hdg - rel - var}}
      = {{n: hdg - rel - var}} = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: adds the relative bearing although the island is to the
      left, and applies the variation with the wrong sign.

      - **{{d2}}°T**: applies the variation with the wrong sign.

      - **{{d3}}°T**: ignores the variation, so the result stays magnetic.

      - **{{d4}}°T**: adds the relative bearing instead of subtracting it.
