- id: QQXYTWMC2
  docId: "061.01"
  relatedQuestions:
    - QRADMP3TZ
  externalIds:
    - ATPLQ-618941
    - ATPLGS-627945
  annexes: []
  learningObjectives:
    - 061.01.03.02.04
  template:
    type: calculation
    question: |-
      The aircraft has the following data.

      - Planned track: {{crs}}°(T)
      - Actual heading: {{hdg}}°(T)
      - Actual in-flight drift: {{drift}}° left

      What is the track error angle?
    variables:
      - id: crs
        label: planned track
        unit: °
      - id: hdg
        label: actual heading
        unit: °
      - id: drift
        label: drift (left)
        unit: °
    answer:
      formula: hdg - drift - crs
      unit: °
      decimals: 0
    distractors:
      - id: d1
        formula: drift
      - id: d2
        formula: hdg + drift - crs
      - id: d3
        formula: hdg + drift
    presets:
      - id: p1
        values:
          crs: 252
          hdg: 255
          drift: 3
      - id: p2
        values:
          crs: 180
          hdg: 190
          drift: 4
      - id: p3
        values:
          crs: 300
          hdg: 310
          drift: 2
    explanation: >-
      The track error is the difference between the track the aircraft actually
      makes good and the planned track. A drift to the left moves the aircraft
      to the left of its heading, so the drift is subtracted from the heading to
      get the track made good.


      **Solution**


      Track made good = heading - drift = {{hdg}}° - {{drift}}° = {{= hdg -
      drift}}°(T)


      Track error = track made good - planned track = {{f: hdg - drift - crs}} =
      {{n: hdg - drift - crs}} = **{{answer}}°**


      **Why the other answers are wrong**


      - **{{d1}}°**: uses only the drift and ignores the heading and the planned
      track.

      - **{{d2}}°**: adds the drift instead of subtracting it.

      - **{{d3}}°**: gives the track made good itself; the planned track is not
      subtracted.
- id: QQYBUOL03
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-611293
    - BGS-611683
    - AVEXAM-68921
    - AVEXAM-51168
  annexes: []
  learningObjectives:
    - 061.01.05.04.02
  template:
    type: calculation
    question: |-
      Given the following information, what is the ground speed of the aircraft?

      - TAS: {{tas}} kt
      - True heading: {{hdg}}°
      - Wind: {{wd}}°/{{ws}} kt

      Give the ground speed in knots.
    variables:
      - id: tas
        label: TAS
        unit: kt
      - id: hdg
        label: True heading
        unit: °
      - id: wd
        label: Wind direction
        unit: °
      - id: ws
        label: Wind speed
        unit: kt
    answer:
      formula: sqrt(tas * tas + ws * ws - 2 * tas * ws * cos(hdg - wd))
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: tas - ws * cos(hdg - wd)
      - id: d2
        formula: tas + ws * cos(hdg - wd)
      - id: d3
        formula: tas + ws
      - id: d4
        formula: sqrt(tas * tas + ws * ws - 2 * tas * ws * sin(hdg - wd))
    presets:
      - id: p1
        values:
          tas: 250
          hdg: 90
          wd: 30
          ws: 50
      - id: p2
        values:
          tas: 280
          hdg: 270
          wd: 200
          ws: 40
      - id: p3
        values:
          tas: 300
          hdg: 45
          wd: 300
          ws: 60
    explanation: >-
      The ground speed is the vector sum of the TAS along the heading and the
      wind. The law of cosines gives the length of that vector, using the angle
      between the heading and the direction the wind blows towards.


      **Solution**


      Angle between heading and wind: {{f: hdg - wd}} = {{n: hdg - wd}}°


      Ground speed: {{f: sqrt(tas * tas + ws * ws - 2 * tas * ws * cos(hdg -
      wd))}} = {{n: sqrt(tas * tas + ws * ws - 2 * tas * ws * cos(hdg - wd))}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: uses the headwind component only, without the crosswind.

      - **{{d2}} kt**: adds the wind component instead of subtracting it.

      - **{{d3}} kt**: adds the wind speed to the TAS, ignoring direction.

      - **{{d4}} kt**: uses the sine of the angle instead of the cosine.
