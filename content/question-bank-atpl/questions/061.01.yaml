- id: QC6T4PEXF
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-612077
    - AVEXAM-51147
  annexes:
    - jeppesen-enr-scotland-north
  learningObjectives:
    - 061.01.03.01.04
  template:
    type: chart-calculation
    question: >-
      Refer to the E(LO)1 chart from the Jeppesen GSPRM 2017. The position of
      the aircraft is N58°30', W004°00' and the magnetic bearing from WICK (WCK)
      NDB (N58°27', W003°04') to the aircraft is {{mag}}°. The magnetic
      variation at the aircraft position is read from the chart.


      What is the true bearing from the aircraft to the WCK NDB?
    variables:
      - id: mag
        label: Magnetic bearing from the NDB to the aircraft
        unit: °M
      - id: variation
        label: Magnetic variation, west (read from the chart)
        unit: °W
    chartInputs:
      - variation
    answer:
      formula: (mag + 180 - variation) - 360 * floor((mag + 180 - variation) / 360)
      unit: °T
      decimals: 0
    distractors:
      - id: d1
        formula: (mag + 180) - 360 * floor((mag + 180) / 360)
      - id: d2
        formula: (mag + 180 + variation) - 360 * floor((mag + 180 + variation) / 360)
      - id: d3
        formula: (mag - variation) - 360 * floor((mag - variation) / 360)
      - id: d4
        formula: (mag + 180 - 2 * variation) - 360 * floor((mag + 180 - 2 * variation) /
          360)
    presets:
      - id: p1
        values:
          mag: 280
          variation: 4
      - id: p2
        values:
          mag: 200
          variation: 6
    explanation: >-
      The magnetic bearing is measured from magnetic north and the true bearing
      from true north. With west variation the magnetic reading is larger than
      the true reading, so the variation is subtracted to give the true bearing
      from the NDB to the aircraft. The bearing from the aircraft to the NDB is
      the reverse, so 180° is added. Results are given between 0° and 360°.


      **Solution**


      - True bearing from the NDB to the aircraft = magnetic bearing - variation
      = {{= mag - variation}}°T

      - Reverse bearing = true bearing + 180° = {{= mag - variation + 180}}°,
      reduced by 360° if needed

      - True bearing from the aircraft to the NDB = **{{answer}}°T**


      **Why the other answers are wrong**


      - **{{d1}}°T**: the variation is left out.

      - **{{d2}}°T**: the variation is added instead of subtracted.

      - **{{d3}}°T**: the reverse bearing is not worked out.

      - **{{d4}}°T**: the variation is counted twice.
- id: QCAKUNLL
  docId: "061.01"
  relatedQuestions:
    - QACZGHIN
  externalIds:
    - ATPLQ-612434
    - BGS-610461
    - ATPLGS-625658
    - AVEXAM-47543
    - AVEXAM-78707
    - BGS-610451
    - AVEXAM-17496
    - AVEXAM-79313
    - ATPLGS-127779
    - ATPLGS-625370
    - ATPLGS-625641
    - BGS-610472
  annexes: []
  learningObjectives:
    - 061.01.05.04.01
  template:
    type: calculation
    question: >-
      Given the following information, calculate the effective headwind
      component:


      - Runway direction: {{rwy}}° M

      - Surface wind: {{wdir}}° M / {{wspd}} kt


      What is the effective headwind component in knots?
    variables:
      - id: rwy
        label: Runway direction
        unit: °
      - id: wdir
        label: Wind direction
        unit: °
      - id: wspd
        label: Wind speed
        unit: kt
    answer:
      formula: wspd * cos(wdir - rwy)
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: abs(wspd * sin(wdir - rwy))
      - id: d2
        formula: wspd
      - id: d3
        formula: -wspd * cos(wdir - rwy)
      - id: d4
        formula: wspd * cos(wdir)
    presets:
      - id: p1
        values:
          rwy: 83
          wdir: 35
          wspd: 35
      - id: p2
        values:
          rwy: 250
          wdir: 300
          wspd: 20
      - id: p3
        values:
          rwy: 140
          wdir: 200
          wspd: 30
    explanation: >-
      The headwind component is the part of the wind that blows straight along
      the runway. A wind at an angle to the runway has only part of its speed
      acting along it. That part is found with the cosine of the angle between
      the wind and the runway. The rest acts across the runway as crosswind.


      **Solution**


      - Angle between wind and runway: {{= wdir - rwy}}°

      - {{f: wspd * cos(wdir - rwy)}} = {{n: wspd * cos(wdir - rwy)}} =
      **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: the crosswind component is used (sine instead of cosine).

      - **{{d2}} kt**: the full wind speed is used, ignoring the angle.

      - **{{d3}} kt**: a tailwind instead of a headwind (sign reversed).

      - **{{d4}} kt**: the runway direction is ignored.
