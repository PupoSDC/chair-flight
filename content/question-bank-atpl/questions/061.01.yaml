  template:
    type: chart
    question: >-
      Refer to Jeppesen GSPRM Training Route Manual, chart E LO 2. Find the
      distance and radial from Turnberry to Clyde, given:


      - TURNBERRY (TRN) VOR/DME (55°19´N, 004°47´W)

      - CLYDE intersection (N55°58' W004°47')


      What is the distance (NM) and the radial?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: 39 NM and 002°.
        wrongAnswers:
          - 39 NM and 182°.
          - 57 NM and 122°.
          - 57 NM and 302º.
        explanation: >-
          Both points have the same longitude, so Clyde lies due north of
          Turnberry. The distance is the difference in latitude, and the radial
          is the direction from the VOR to the point.


          **Solution**


          - Difference in latitude: 58 minutes minus 19 minutes = 39 minutes,
          which is 39 NM.

          - The point lies due north of the VOR, so the radial is 002°.

          - The answer is **39 NM and 002°**.


          **Why the other answers are wrong**


          - **39 NM and 182°**: the radial is the reciprocal, measured from
          Clyde back to Turnberry.

          - **57 NM and 122°**: the distance is read from the wrong point of the
          chart, and the direction is far from due north.

          - **57 NM and 302°**: a distance far too long, and a radial to the
          north-west instead of due north.
