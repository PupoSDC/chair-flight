  template:
    type: calculation
    question: >-
      Two positions lie on the same meridian, given:


      - Point A: {{a_d}}°{{a_m}}' N

      - Point B: {{b_d}}°{{b_m}}' S


      What is the distance between A and B along the meridian? Give the answer
      in NM.
    variables:
      - id: a_d
        label: Latitude A, degrees
        unit: °
      - id: a_m
        label: Latitude A, minutes
        unit: "'"
      - id: b_d
        label: Latitude B, degrees
        unit: °
      - id: b_m
        label: Latitude B, minutes
        unit: "'"
    answer:
      formula: a_d * 60 + a_m + b_d * 60 + b_m
      unit: NM
      decimals: 0
    distractors:
      - id: d1
        formula: (a_d + b_d) * 60
      - id: d2
        formula: a_d * 60 + a_m - (b_d * 60 + b_m)
      - id: d3
        formula: (a_d * 60 + a_m + b_d * 60 + b_m) * 1.852
      - id: d4
        formula: (a_d * 60 + a_m + b_d * 60 + b_m) / 1.852
    presets:
      - id: p1
        values:
          a_d: 23
          a_m: 59
          b_d: 17
          b_m: 23
      - id: p2
        values:
          a_d: 63
          a_m: 55
          b_d: 13
          b_m: 47
      - id: p3
        values:
          a_d: 46
          a_m: 35
          b_d: 28
          b_m: 24
      - id: p4
        values:
          a_d: 34
          a_m: 30
          b_d: 26
          b_m: 20
    explanation: >-
      Meridians are measured in latitude, and one minute of latitude equals one
      NM. The distance along a meridian is therefore the latitude difference in
      minutes. Point A and point B are in opposite hemispheres, so their
      distances from the equator are added.


      **Solution**


      Distance = {{n: a_d * 60 + a_m + b_d * 60 + b_m}} = **{{answer}} NM**


      **Why the other answers are wrong**


      - **{{d1}} NM**: the minutes are ignored and only whole degrees are
      counted.

      - **{{d2}} NM**: the distances are subtracted, but the points are in
      opposite hemispheres so they must be added.

      - **{{d3}} km**: the result is multiplied by 1.852 (NM to km) but is not
      in NM.

      - **{{d4}} NM**: the result is divided by 1.852, the wrong direction of
      conversion.
