    - 061.01.05.04.02
  template:
    type: calculation
    question: |-
      Given the following information, calculate the aircraft's TAS:

      - Ground speed: {{gs}} kt
      - Cruising level: FL{{fl}}
      - Wind component: {{tw}} kt tailwind
      - OAT: ISA {{isa}}°C
    variables:
      - id: gs
        label: Ground speed
        unit: kt
      - id: fl
        label: Cruising level
        unit: FL
      - id: tw
        label: Tailwind component
        unit: kt
      - id: isa
        label: ISA deviation
        unit: °C
    answer:
      formula: gs - tw
      unit: kt
      decimals: 0
    distractors:
      - id: d1
        formula: gs + tw
      - id: d2
        formula: gs
      - id: d3
        formula: gs - 2 * tw
      - id: d4
        formula: gs + 2 * tw
    presets:
      - id: p1
        values:
          gs: 485
          fl: 340
          tw: 35
          isa: -15
      - id: p2
        values:
          gs: 470
          fl: 360
          tw: 25
          isa: -20
      - id: p3
        values:
          gs: 455
          fl: 280
          tw: 40
          isa: 5
    explanation: >-
      A tailwind adds to the ground speed, so the TAS is the ground speed minus
      the tailwind. The flight level and the temperature do not change this
      calculation.


      **Solution**


      {{gs}} kt - {{tw}} kt = **{{answer}} kt**


      **Why the other answers are wrong**


      - **{{d1}} kt**: adds the tailwind instead of removing it.

      - **{{d2}} kt**: uses the ground speed as the TAS, with no wind
      correction.

      - **{{d3}} kt**: removes the tailwind twice.

      - **{{d4}} kt**: adds the tailwind twice.
- id: QTVXGGVF
  docId: "061.01"
  relatedQuestions: []
  externalIds:
    - ATPLQ-619992
    - ATPLGS-625406
    - BGS-610058
  annexes: []
  learningObjectives:
    - 061.01.04.03.01
  template:
    type: calculation
    question: >-
      Two positions lie on the same parallel of latitude.


      - Position A: {{lat}}°N, {{lon}}°E

      - Departure between A and B: {{dep}} NM


      Position B is east of position A. What is the longitude of B, in degrees
      West?
    variables:
      - id: lat
        label: Latitude
        unit: °N
      - id: lon
        label: Longitude of A
        unit: °E
      - id: dep
        label: Departure
        unit: NM
    answer:
      formula: 360 - (lon + dep / (60 * cos(lat)))
      unit: °W
      decimals: 0
    distractors:
      - id: d1
        formula: lon + dep / 60
      - id: d2
        formula: 360 - (lon + 2 * dep / (60 * cos(lat)))
      - id: d3
        formula: lon - dep / 60
      - id: d4
        formula: lon + dep / (60 * cos(lat))
    presets:
      - id: p1
        values:
          lat: 60
          lon: 160
          dep: 900
      - id: p2
        values:
          lat: 45
          lon: 170
          dep: 1500
      - id: p3
        values:
          lat: 30
          lon: 170
          dep: 1200
    explanation: >-
      On a parallel of latitude, one degree of longitude is 60 NM multiplied by
      the cosine of the latitude. The departure is therefore converted into a
      longitude difference, which is added to the longitude of A. The result is
      past 180 degrees, so it is expressed as degrees West.


      **Solution**


      Longitude difference: {{f: dep / (60 * cos(lat))}} = {{n: dep / (60 *
      cos(lat))}}°


      Longitude of B east: {{= lon + dep / (60 * cos(lat))}}°E = {{= 360 - (lon
      + dep / (60 * cos(lat)))}}°W


      Longitude of B = **{{answer}}°W**


      **Why the other answers are wrong**


      - **{{d1}}°**: forgets the cosine of the latitude.

      - **{{d2}}°**: doubles the longitude difference.

      - **{{d3}}°**: moves B west of A instead of east.

      - **{{d4}}°**: does not convert the east longitude into West.
