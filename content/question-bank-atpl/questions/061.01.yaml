- id: QBGZBDBD
  docId: "061.01"
  relatedQuestions:
    - QFKTQEUZ
  externalIds:
    - ATPLQ-614273
    - BGS-611270
  annexes: []
  learningObjectives:
    - 061.01.05.06.02
  template:
    type: calculation
    question: >-
      An aircraft has an airspeed of {{tas}} kt and a tailwind of {{tw}} kt.


      The ILS glide path is published as {{angle}}°.


      Determine the rate of descent which should be set to achieve that glide
      path, in ft/min.


      Round the answer to the nearest 5 ft/min.
    variables:
      - id: tas
        label: Airspeed
        unit: kt
      - id: tw
        label: Tailwind component
        unit: kt
      - id: angle
        label: Glide path angle
        unit: °
    answer:
      formula: round(5 * (tas + tw) * angle / 3 / 5) * 5
      unit: ft/min
      decimals: 0
    distractors:
      - id: d1
        formula: 5 * tas * angle / 3
      - id: d2
        formula: 5 * (tas - tw) * angle / 3
      - id: d3
        formula: 5 * (tas + tw) * angle
      - id: d4
        formula: (tas + tw) * angle / 3
    presets:
      - id: p1
        values:
          tas: 110
          tw: 15
          angle: 3.5
      - id: p2
        values:
          tas: 130
          tw: 20
          angle: 3
    explanation: >-
      For an ILS glide path, the rate of descent in ft/min is about 5 times the
      groundspeed for a 3 degree slope, and it scales in proportion to the
      angle. So the rate of descent is 5 × groundspeed × angle ÷ 3, where the
      groundspeed is the airspeed plus the tailwind component. The result is
      rounded to the nearest 5 ft/min.


      **Solution**


      - Groundspeed: {{= tas + tw}} kt

      - Rate of descent: {{f: 5 * (tas + tw) * angle / 3}} = {{n: 5 * (tas + tw)
      * angle / 3}} ≈ **{{answer}} ft/min**


      **Why the other answers are wrong**


      - **{{d1}} ft/min**: the tailwind is ignored, so the groundspeed is too
      low.

      - **{{d2}} ft/min**: the tailwind is treated as a headwind, which lowers
      the groundspeed.

      - **{{d3}} ft/min**: the division by 3 is forgotten, so the result is
      about three times too large.

      - **{{d4}} ft/min**: the factor of 5 is forgotten, so the result is about
      five times too small.
