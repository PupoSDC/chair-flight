  annexes: []
  learningObjectives:
    - 031.06.02.01.02
  template:
    type: calculation
    question: >-
      A container has a base area of {{base_area}} m².


      The container is loaded on two ground supports (of negligible mass), each
      having floor-contact dimensions of {{support_length}} m x
      {{support_width}} m.


      Given that the maximum permissible floor load of the cargo compartment,
      which is {{limit}} kg/m², must be respected, what is the maximum mass that
      can be loaded in the container?
    variables:
      - id: limit
        label: Floor load limit
        unit: kg/m²
      - id: base_area
        label: Container base area
        unit: m²
      - id: support_length
        label: Support length
        unit: m
      - id: support_width
        label: Support width
        unit: m
    answer:
      formula: limit * 2 * support_length * support_width
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: limit / (2 * support_length * support_width)
      - id: d2
        formula: limit * support_length * support_width
      - id: d3
        formula: limit * base_area
    presets:
      - id: p1
        values:
          limit: 732
          base_area: 1.44
          support_length: 0.2
          support_width: 1.2
      - id: p2
        values:
          limit: 650
          base_area: 1
          support_length: 0.1
          support_width: 1
      - id: p3
        values:
          limit: 800
          base_area: 1
          support_length: 0.1
          support_width: 0.9
    explanation: >-
      When a container stands on supports, the load is transferred to the floor
      only through the support contact area, not through the whole base. The
      maximum mass is the floor limit times the total contact area of the two
      supports.


      **Solution**


      Contact area = 2 x {{support_length}} x {{support_width}} = {{= 2 *
      support_length * support_width}} m²


      {{f: limit * 2 * support_length * support_width}} = {{n: limit * 2 *
      support_length * support_width}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Divides the limit by the contact area instead of
      multiplying.

      - **{{d2}} kg**: Uses the contact area of only one support.

      - **{{d3}} kg**: Uses the whole base area of the container instead of the
      support contact area.
- id: QXBVQAUV
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318961
    - ATPLGS-126795
    - AVEXAM-72116
    - BGS-310670
  annexes: []
  learningObjectives:
    - 031.06.02.01.02
  template:
    type: chart
    question: "Which one of the following shipments can be loaded in a cargo
      compartment with a floor loading of 70 kg/m²? Shipment W: 500 kg on a
      pallet sized 2 m x 2 m Shipment X: 500 kg on a pallet sized 1 m x 1 m
      Shipment Y: 600 kg on a pallet sized 2 m x 2 m Shipment Z: 600 kg on a
      pallet sized 3 m x 3 m (All pallets are in direct contact with the cargo
      floor)."
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Shipment Z
        wrongAnswers:
          - Shipment W
          - Shipment Y
          - Shipment X
        explanation: |-
          Floor loading is mass divided by pallet area:

          - W: 500 ÷ 4 = 125 kg/m².
          - X: 500 ÷ 1 = 500 kg/m².
          - Y: 600 ÷ 4 = 150 kg/m².
          - Z: 600 ÷ 9 = 67 kg/m².

          Only **shipment Z** is under 70 kg/m².
- id: QXCSCXCT
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317174
    - BGS-310674
    - ATPLGS-126803
  annexes: []
  learningObjectives:
    - 031.06.02.01.01
  template:
    type: calculation
    question: >-
      The floor loading limit of a cargo compartment is {{load}} kg/m².


      A box of {{mass}} kg is to be loaded on a square pallet whose side length
      is available in steps of 0.2 m (0.8 m, 1.0 m, 1.2 m, 1.4 m, ...).


      What is the side length (in m) of the smallest acceptable square pallet?
    variables:
      - id: mass
        label: Mass of the box
        unit: kg
      - id: load
        label: Floor loading limit
        unit: kg/m2
    answer:
      formula: ceil(sqrt(mass / load) * 5) / 5
      unit: m
      decimals: 1
    distractors:
      - id: d1
        formula: sqrt(mass / load)
      - id: d2
        formula: floor(sqrt(mass / load) * 5) / 5
      - id: d3
        formula: ceil(sqrt(mass / load) * 5) / 5 + 0.2
      - id: d4
        formula: mass / load
    presets:
      - id: p1
        values:
          mass: 806
          load: 732
      - id: p2
        values:
          mass: 1100
          load: 600
    explanation: >-
      The pallet contact area must be at least mass divided by the floor load
      limit. For a square pallet the side is the square root of that area,
      rounded up to the next available size.


      **Solution**


      Required area = {{= mass / load}} m²


      Side length = {{f: sqrt(mass / load)}} = {{= sqrt(mass / load)}} m,
      rounded up to the next 0.2 m step: **{{answer}} m**


      **Why the other answers are wrong**


      - **{{d1}} m**: the exact side length is not rounded up to an available
      pallet size.

      - **{{d2}} m**: the side length is rounded down, so the floor load limit
      would be exceeded.

      - **{{d3}} m**: one size too large is chosen.

      - **{{d4}} m**: this is the required area in m², not the side length.
