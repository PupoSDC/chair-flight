- id: QCGIZFCK
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318766
    - AVEXAM-17090
  annexes: []
  learningObjectives:
    - 031.06.02.01.03
  template:
    type: calculation
    question: >-
      A container with a base area of {{length}} x {{width}} ft² is loaded into
      a cargo compartment.


      The maximum running load of the compartment is {{running}} lb/ft.


      What is the maximum possible weight of the container?
    variables:
      - id: running
        label: Running load limit
        unit: lb/ft
      - id: length
        label: Container length
        unit: ft
      - id: width
        label: Container width
        unit: ft
    answer:
      formula: running * length
      unit: lb
      decimals: 0
    distractors:
      - id: d1
        formula: running * length * width
      - id: d2
        formula: running * (length + width)
      - id: d3
        formula: running
    presets:
      - id: p1
        values:
          running: 85
          length: 5
          width: 5
      - id: p2
        values:
          running: 60
          length: 4
          width: 3
      - id: p3
        values:
          running: 100
          length: 6
          width: 3
    explanation: >-
      A running load limit is a weight per unit of length along the compartment,
      so only the container length (in the direction of the compartment axis)
      matters, not its area. The maximum weight is the limit times that length.


      **Solution**


      {{f: running * length}} = {{n: running * length}} = **{{answer}} lb**


      **Why the other answers are wrong**


      - **{{d1}} lb**: Multiplies by the base area instead of the length.

      - **{{d2}} lb**: Multiplies by the sum of the sides.

      - **{{d3}} lb**: Takes the running load itself, ignoring the length.
- id: QCMGZSVG
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319706
    - ATPLGS-126682
    - AVEXAM-84192
    - BGS-310683
    - ATPLQ-313759
    - AVEXAM-8902
    - ATPLGS-127346
    - AVEXAM-66093
  annexes: []
  learningObjectives:
    - 031.06.02.01.01
  template:
    type: calculation
    question: "The structural limitation of a baggage compartment is {{limit}}
      lb/ft². A load has a mass of {{mass}} kg and has to be distributed over an
      area of at least:"
    variables:
      - id: limit
        label: Floor load limit
        unit: lb/ft2
      - id: mass
        label: Load mass
        unit: kg
    answer:
      formula: mass / (limit * 4.88243)
      unit: m2
      decimals: 2
    distractors:
      - id: d1
        formula: mass / (limit * 0.45359)
      - id: d2
        formula: mass / limit
      - id: d3
        formula: limit * 4.88243 / mass
      - id: d4
        formula: mass / (limit * 10.764)
    presets:
      - id: p1
        values:
          limit: 50
          mass: 320
      - id: p2
        values:
          limit: 32
          mass: 200
      - id: p3
        values:
          limit: 40
          mass: 450
    explanation: >-
      The floor loading limit is the maximum mass per unit of contact area, so
      the minimum area is the load mass divided by the limit. The limit must
      first be converted to metric units: 1 lb/ft² = 4.88243 kg/m².


      **Solution**


      Limit = {{limit}} lb/ft² × 4.88243 = {{= limit * 4.88243}} kg/m²


      {{f: mass / (limit * 4.88243)}} = {{n: mass / (limit * 4.88243)}} =
      **{{answer}} m²**


      **Why the other answers are wrong**


      - **{{d1}} m²**: converts only the pound to kilograms and ignores the
      square-foot to square-metre conversion, so the result is in ft², not m².

      - **{{d2}} m²**: divides kg by lb/ft² without any unit conversion.

      - **{{d3}} m²**: inverted ratio (limit divided by mass).

      - **{{d4}} m²**: converts the area unit with 10.764 (ft² per m²) in the
      wrong direction and ignores the lb to kg conversion.
