- id: QGXSSDAS
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318780
    - AVEXAM-44061
  annexes: []
  learningObjectives:
    - 031.06.02.01.01
  template:
    type: chart
    question: A piece of cargo of 1.3 m2 and a mass of 600 kg is loaded on two
      pallets with dimensions of 0.2 m x 1.2 m each. Considering that the
      maximum area loading equals 367 kg/m2, can this cargo be transported in
      the cargo hold?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: No, because the maximum area load is exceeded.
        wrongAnswers:
          - Yes, because the base area of the cargo sufficiently distributes the
            load to comply with the maximum area load.
          - Yes, only if the pallets are placed laterally on both ends of the
            cargo.
          - Yes, if the pallets are aligned longitudinally.
        explanation: The load only rests on the two pallets, which have a combined area
          of 2 × 0.2 × 1.2 = 0.48 m². The load on the floor is 600 ÷ 0.48 = 1
          250 kg/m², far above 367 kg/m². The cargo **cannot be carried** this
          way.
