- id: QDSJNIVN
  docId: "031.06"
  relatedQuestions:
    - QRIULMDH
  externalIds:
    - ATPLQ-316919
    - ATPLGS-126751
    - BGS-310315
    - AVEXAM-51653
    - ATPLGS-107200
  annexes: []
  learningObjectives:
    - 031.06.02.01.01
  template:
    type: calculation
    question: >-
      The maximum floor loading for a cargo compartment is {{limit}} kg per
      square metre.


      A package with a mass of {{mass}} kg is to be loaded on a pallet whose
      base is entirely in contact with the floor.


      The pallet is {{length}} cm long.


      What is the minimum width of the pallet, in cm?
    variables:
      - id: mass
        label: Package mass
        unit: kg
      - id: limit
        label: Maximum floor loading
        unit: kg/m²
      - id: length
        label: Pallet length
        unit: cm
    answer:
      formula: mass / limit * 10000 / length
      unit: cm
      decimals: 0
    distractors:
      - id: d1
        formula: mass / limit * 10000
      - id: d2
        formula: mass / limit * 100 / length
      - id: d3
        formula: limit / mass * 10000 / length
      - id: d4
        formula: mass / limit * 10000 / length * 2
    presets:
      - id: p1
        values:
          mass: 600
          limit: 750
          length: 200
      - id: p2
        values:
          mass: 450
          limit: 500
          length: 150
      - id: p3
        values:
          mass: 800
          limit: 400
          length: 250
    explanation: >-
      The base area must be at least the mass divided by the maximum floor
      loading (in m²). Converting to cm² (1 m² = 10 000 cm²) and dividing by the
      length gives the minimum width.


      **Solution**


      Minimum area = {{= mass / limit}} m² = {{= mass / limit * 10000}} cm²


      {{f: mass / limit * 10000 / length}} = {{n: mass / limit * 10000 /
      length}} = **{{answer}} cm**


      **Why the other answers are wrong**


      - **{{d1}} cm**: this is the area in cm², the length was not divided out.

      - **{{d2}} cm**: wrong unit conversion (factor 100 instead of 10 000).

      - **{{d3}} cm**: the ratio of mass and limit is inverted.

      - **{{d4}} cm**: the width is doubled.
