          side: 1.2
          support_length: 0.3
      - id: p3
        values:
          running: 2000
          side: 0.6
          support_length: 0.15
    explanation: >-
      The running load is the load per metre of length measured along the flight
      direction. With supports, only the length of the supports in contact with
      the floor counts, so the load is spread over the sum of their lengths.


