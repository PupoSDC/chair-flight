  template:
    type: chart
    question: |-
      The maximum load per running metre of an aeroplane is 350 kg/m.

      The width of the floor area is 2 metres.

      The floor strength limitation is 300 kg per square metre.

      Which one of the following crates can be loaded directly on the floor?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: A load of 400 kg in a crate with dimensions 1.2 m × 1.2 m × 1.2 m.
        wrongAnswers:
          - A load of 400 kg in a crate with dimensions 1.4 m × 0.8 m × 0.8 m.
          - A load of 500 kg in a crate with dimensions 1.5 m × 1 m × 1 m.
          - A load of 700 kg in a crate with dimensions 1.8 m × 1.4 m × 0.8 m.
        explanation: >-
          Check each crate against both limits (running load = mass ÷ length
          along the floor; floor load = mass ÷ base area):


          - 400 kg, 1.2 m × 1.2 m: 333 kg/m and 278 kg/m². Both within limits.

          - 400 kg, 1.4 m × 0.8 m: 357 kg/m² is over the floor limit.

          - 500 kg, 1.5 m × 1 m: 333 kg/m² is over the floor limit.

          - 700 kg, 1.8 m × 1.4 m: 389 kg/m is over the running limit.


          Only the **first crate** can go directly on the floor.
- id: QMAOHZIO
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-318716
    - BGS-310677
    - ATPLGS-625778
    - BGS-310115
    - AVEXAM-96216
    - ATPLGS-126774
    - AVEXAM-69821
    - BGS-310321
    - ATPLQ-312061
  annexes: []
  learningObjectives:
    - 031.06.02.01.02
  template:
    type: calculation
    question: "The floor of a cargo hold is limited to {{limit}} N/m². It is planned
      to load a cubic container measuring {{side}} m on each side. Its maximum
      gross mass must not exceed (assume g = {{g}} m/s²):"
    variables:
      - id: limit
        label: Floor load limit
        unit: N/m²
      - id: side
        label: Container side
        unit: m
      - id: g
        label: Gravitational acceleration
        unit: m/s²
    answer:
      formula: limit * side ^ 2 / g
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: limit * side ^ 2
      - id: d2
        formula: limit * side ^ 3
      - id: d3
        formula: limit * side ^ 3 / g
      - id: d4
        formula: limit * side ^ 3 * g
    presets:
      - id: p1
        values:
          limit: 5000
          side: 0.4
          g: 10
      - id: p2
        values:
          limit: 4000
          side: 0.5
          g: 10
      - id: p3
        values:
          limit: 6000
          side: 0.6
          g: 10
    explanation: >-
      The floor limit is a force per unit area, so the maximum weight is the
      limit times the contact area (side squared). Dividing by g converts this
      weight in newtons into a mass in kilograms.


      **Solution**


      {{f: limit * side ^ 2 / g}} = {{n: limit * side ^ 2 / g}} = **{{answer}}
      kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Gives the maximum force in newtons; it was not divided by
      g.

      - **{{d2}} kg**: Uses the volume (side cubed) instead of the contact area
      and does not convert to mass.

      - **{{d3}} kg**: Uses the volume (side cubed) instead of the contact area.

      - **{{d4}} kg**: Uses the volume and multiplies by g instead of dividing.
