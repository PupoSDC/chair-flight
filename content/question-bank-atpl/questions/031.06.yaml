  template:
    type: calculation
    question: >-
      A cubic container whose sides all measure {{side}} m is planned to be
      loaded in a cargo compartment with a maximum running load of {{running}}
      kg/m.


      The container shall be loaded on two ground supports (of negligible mass)
      having a length in the direction of flight of {{support_length}} m each.


      Given that the maximum running load of the cargo compartment must be
      respected, what is the maximum mass that can be loaded in the container?
    variables:
      - id: running
        label: Running load limit
        unit: kg/m
      - id: side
        label: Container side
        unit: m
      - id: support_length
        label: Support length (flight direction)
        unit: m
    answer:
      formula: running * 2 * support_length
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: running * side
      - id: d2
        formula: running
      - id: d3
        formula: running * support_length
    presets:
      - id: p1
        values:
          running: 1915
          side: 0.8
          support_length: 0.2
      - id: p2
