    - 031.06.02.01.02
  template:
    type: calculation
    question: A container is loaded so that its floor contact area is {{area}} m².
      Calculate the maximum mass of the container, given that the maximum
      permissible floor load of the cargo compartment is {{floor_load}} kg/m².
    variables:
      - id: floor_load
        label: Maximum floor load
        unit: kg/m²
      - id: area
        label: Floor contact area
        unit: m²
    answer:
      formula: floor_load * area
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: floor_load / area
      - id: d2
        formula: floor_load * area * 2
      - id: d3
        formula: floor_load * area / 2
      - id: d4
        formula: floor_load * sqrt(area)
    presets:
      - id: p1
        values:
          floor_load: 700
          area: 0.12
      - id: p2
        values:
          floor_load: 800
          area: 0.3
      - id: p3
        values:
          floor_load: 650
          area: 0.4
    explanation: >-
      The floor load limit is a pressure-like limit in kg per square metre. The
      maximum mass is the limit multiplied by the area over which the load is
      spread.


      **Solution**


      {{f: floor_load * area}} = {{n: floor_load * area}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the load limit is divided by the area instead of
      multiplied.

      - **{{d2}} kg**: the result is doubled.

      - **{{d3}} kg**: the result is halved.

      - **{{d4}} kg**: the square root of the area is used.
- id: QQJ0GZSAZ
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-317135
    - BGS-310698
  annexes:
    - 031-cap-696-file-4-9-mrjt-forward-cargo-compartment-and
  learningObjectives:
    - 031.06.02.01.02
  template:
    type: chart-calculation
    question: >-
      A pallet measures {{length}} inches by {{width}} inches and is loaded in
      the aft section of the forward cargo compartment (station 343 to 500).


      The maximum distribution load intensity for this section, read from the
      figure (CAP696 Figure 4.9), is {{max_int}} kg/ft².


      Assume that 12 inches equal 1 foot.


      What is the maximum mass that can be loaded on the pallet?
    variables:
      - id: length
        label: Pallet length
        unit: in
      - id: width
        label: Pallet width
        unit: in
      - id: max_int
        label: Max distribution load intensity (read from figure)
        unit: kg/ft²
    chartInputs:
      - max_int
    answer:
      formula: max_int * length * width / 144
      unit: kg
      decimals: 0
    distractors:
      - id: d1
        formula: max_int * length * width
      - id: d2
        formula: max_int * length * width / 12
      - id: d3
        formula: max_int * length * width / 1728
      - id: d4
        formula: max_int * (length + width) / 12
    presets:
      - id: p1
        values:
          length: 55
          width: 40
          max_int: 47.2
      - id: p2
        values:
          length: 60
          width: 40
          max_int: 68
    explanation: >-
      The maximum mass is the distribution load intensity multiplied by the
      pallet footprint. Since the intensity is given per square foot, the
      footprint in square inches must be divided by 144.


      **Solution**


      Footprint = {{= length * width / 144}} ft²


      {{f: max_int * length * width / 144}} = {{n: max_int * length * width /
      144}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: the pallet area is left in square inches instead of
      converted to ft².

      - **{{d2}} kg**: only a factor 12 is used to convert square inches to
      square feet.

      - **{{d3}} kg**: the cubic conversion factor 12³ is used instead of 12².

      - **{{d4}} kg**: the pallet dimensions are added instead of multiplied.
- id: QRIULMDH
  docId: "031.06"
  relatedQuestions:
    - QDSJNIVN
  externalIds:
    - ATPLQ-317055
    - AVEXAM-11487
  annexes: []
  learningObjectives:
    - 031.06.02.01.01
  template:
    type: calculation
    question: >-
      The maximum permissible floor loading for a cargo compartment is {{limit}}
      kg per square metre.


      A package with a mass of {{mass}} kg is to be loaded on a pallet whose
      base is entirely in contact with the floor.


      The pallet is {{length}} m long.


      What is the minimum width of the pallet (in metres, rounded to one
      decimal)?
    variables:
      - id: mass
        label: Package mass
        unit: kg
      - id: limit
        label: Maximum floor loading
        unit: kg/m²
      - id: length
        label: Pallet length
        unit: m
    answer:
      formula: mass / limit / length
      unit: m
      decimals: 1
    distractors:
      - id: d1
        formula: mass / limit
      - id: d2
        formula: mass / limit * length
      - id: d3
        formula: length * limit / mass
      - id: d4
        formula: mass / limit / length + 0.2
    presets:
      - id: p1
        values:
          mass: 374
          limit: 170
          length: 1.6
      - id: p2
        values:
          mass: 360
          limit: 150
          length: 2
      - id: p3
        values:
          mass: 480
          limit: 200
          length: 1.5
    explanation: >-
      The pallet base area must be at least the mass divided by the maximum
      floor loading. With the length fixed, the minimum width is that area
      divided by the length.


      **Solution**


      Minimum area = {{= mass / limit}} m²


      {{f: mass / limit / length}} = {{n: mass / limit / length}} = **{{answer}}
      m**


      **Why the other answers are wrong**


      - **{{d1}} m**: this is the required area, the length was not divided out.

      - **{{d2}} m**: the area is multiplied by the length instead of divided.

      - **{{d3}} m**: the ratio is inverted.

      - **{{d4}} m**: an arbitrary margin is added to the correct width.
