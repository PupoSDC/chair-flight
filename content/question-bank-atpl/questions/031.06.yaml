- id: QLPABYFA
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319705
    - ATPLGS-107192
    - BGS-310325
    - BGS-310317
    - AVEXAM-88402
  annexes:
    - 031-cap-696-file-4-9-mrjt-forward-cargo-compartment-and
  learningObjectives:
    - 031.06.02.01.02
  template:
    type: chart-calculation
    question: >-
      A pallet with a freight platform measuring {{plat_l}} cm x {{plat_w}} cm
      has a total mass of {{pallet_mass}} kg.


      The pallet is carried on {{n_sup}} ground supports, each measuring
      {{sup_w}} cm x {{sup_l}} cm.


      The maximum permitted distribution load intensity of the lower deck
      forward cargo compartment, read from the loading manual figure (CAP696
      Figure 4.9), is {{max_int}} kg/m².


      Calculate how much mass may be added to the pallet (positive result) or
      must be off-loaded (negative result) to match this load intensity.
    variables:
      - id: plat_l
        label: Platform length
        unit: cm
      - id: plat_w
        label: Platform width
        unit: cm
      - id: pallet_mass
        label: Pallet mass
        unit: kg
      - id: n_sup
        label: Number of ground supports
        unit: "-"
      - id: sup_w
        label: Support width
        unit: cm
      - id: sup_l
        label: Support length
        unit: cm
      - id: max_int
        label: Max distribution load intensity (read from figure)
        unit: kg/m²
    chartInputs:
      - max_int
    answer:
      formula: max_int * n_sup * sup_w * sup_l / 10000 - pallet_mass
      unit: kg
      decimals: 1
    distractors:
      - id: d1
        formula: max_int * n_sup * sup_w * sup_l / 10000
      - id: d2
        formula: pallet_mass - max_int * n_sup * sup_w * sup_l / 10000
      - id: d3
        formula: max_int * sup_w * sup_l / 10000 - pallet_mass
      - id: d4
        formula: max_int * plat_l * plat_w / 10000 - pallet_mass
    presets:
      - id: p1
        values:
          plat_l: 200
          plat_w: 250
          pallet_mass: 300
          n_sup: 2
          sup_w: 20
          sup_l: 200
          max_int: 731.9
    explanation: >-
      The load intensity on the floor is the mass divided by the contact area,
      which for a pallet is the area of the ground supports, not of the
      platform. The maximum total mass is the load intensity limit times the
      contact area; the difference with the current mass is what may be added or
      must be removed.


      **Solution**


      Contact area = {{= n_sup * sup_w * sup_l / 10000}} m²


      {{f: max_int * n_sup * sup_w * sup_l / 10000 - pallet_mass}} = {{n:
      max_int * n_sup * sup_w * sup_l / 10000 - pallet_mass}} = **{{answer}}
      kg** (positive: may be added)


      **Why the other answers are wrong**


      - **{{d1}} kg**: the existing pallet mass is not subtracted (maximum
      allowed total instead of the change).

      - **{{d2}} kg**: the sign is reversed, so a mass that may be added is
      shown as off-loaded.

      - **{{d3}} kg**: only one ground support is used for the contact area.

      - **{{d4}} kg**: the whole platform area is used instead of the area of
      the ground supports.
