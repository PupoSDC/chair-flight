- id: QXWUTHTF
  docId: "031.06"
  relatedQuestions: []
  externalIds:
    - ATPLQ-319155
    - AVEXAM-34078
  annexes: []
  learningObjectives:
    - 031.06.02.01.02
  template:
    type: calculation
    question: A cubic container has sides of {{side}} m. What is the maximum mass
      that can be loaded in this container without exceeding the maximum
      permissible floor load of {{limit}} kg/m²?
    variables:
      - id: limit
        label: Floor load limit
        unit: kg/m²
      - id: side
        label: Container side
        unit: m
    answer:
      formula: limit * side ^ 2
      unit: kg
      decimals: 2
    distractors:
      - id: d1
        formula: limit / side ^ 2
      - id: d2
        formula: limit / side ^ 3
      - id: d3
        formula: limit * side ^ 3
    presets:
      - id: p1
        values:
          limit: 240
          side: 0.9
      - id: p2
        values:
          limit: 300
          side: 0.7
      - id: p3
        values:
          limit: 180
          side: 1.1
    explanation: >-
      A cubic container rests on a square face, so the floor contact area is the
      side squared. The maximum mass is the permissible floor load times this
      contact area.


      **Solution**


      {{f: limit * side ^ 2}} = {{n: limit * side ^ 2}} = **{{answer}} kg**


      **Why the other answers are wrong**


      - **{{d1}} kg**: Divides the limit by the contact area instead of
      multiplying.

      - **{{d2}} kg**: Divides the limit by the volume (side cubed).

      - **{{d3}} kg**: Multiplies by the volume (side cubed) instead of the
      contact area.
