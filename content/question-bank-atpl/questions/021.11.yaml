  template:
    type: calculation
    question: In an axial compressor with {{stages}} stages, the pressure rise
      across every single stage is {{rise}}%. What is the overall compression
      ratio of such an engine?
    variables:
      - id: stages
        label: number of stages
        unit: ""
      - id: rise
        label: pressure rise per stage
        unit: "%"
    answer:
      formula: (1 + rise / 100) ^ stages
      unit: ""
      decimals: 0
    distractors:
      - id: d1
        formula: stages
      - id: d2
        formula: stages * (1 + rise / 100)
      - id: d3
        formula: stages + rise
    presets:
      - id: p1
        values:
          stages: 20
          rise: 20
      - id: p2
        values:
          stages: 10
          rise: 30
      - id: p3
        values:
          stages: 8
          rise: 25
    explanation: >-
      Each stage multiplies the pressure by the same factor, so the overall
      compression ratio is the per-stage pressure ratio raised to the power of
      the number of stages (compound, not additive).


      **Solution**


      Per-stage pressure ratio = {{= 1 + rise / 100}}


      {{f: (1 + rise / 100) ^ stages}} = {{n: (1 + rise / 100) ^ stages}} =
      **{{answer}}**


      **Why the other answers are wrong**


      - **{{d1}}**: equals the number of stages, i.e. a ratio of 1 per stage.

      - **{{d2}}**: multiplies the number of stages by the per-stage ratio
      (linear instead of compounded).

      - **{{d3}}**: adds the stages and the percentage.
