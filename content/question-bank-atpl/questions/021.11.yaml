  template:
    type: calculation
    question: A turbofan engine has an inlet air mass flow of {{inlet}} kg/s, of
      which {{core}} kg/s passes through the HP compressor (the core). What is
      its bypass ratio?
    variables:
      - id: inlet
        label: Inlet air mass flow
        unit: kg/s
      - id: core
        label: Core (HP compressor) mass flow
        unit: kg/s
    answer:
      formula: (inlet - core) / core
      unit: ": 1"
      decimals: 2
    distractors:
      - id: d1
        formula: inlet / core
      - id: d2
        formula: (inlet - core) / inlet
      - id: d3
        formula: (inlet + core) / core
      - id: d4
        formula: (inlet - core) / (core + 10)
    presets:
      - id: p1
        values:
          inlet: 220
          core: 20
      - id: p2
        values:
          inlet: 300
          core: 50
      - id: p3
        values:
          inlet: 1000
          core: 111
      - id: p4
        values:
          inlet: 300
          core: 60
      - id: p5
        values:
          inlet: 400
          core: 40
      - id: p6
        values:
          inlet: 200
          core: 20
      - id: p7
        values:
          inlet: 700
          core: 80
      - id: p8
        values:
          inlet: 400
          core: 50
      - id: p9
        values:
          inlet: 500
          core: 250
      - id: p10
        values:
          inlet: 400
          core: 80
    explanation: >-
      The bypass ratio is the mass flow that bypasses the core divided by the
      mass flow through the core. The bypass flow is the inlet flow minus the
      core flow.


      **Solution**


      Bypass flow = {{inlet}} - {{core}} = {{= inlet - core}} kg/s


      {{f: (inlet - core) / core}} = {{n: (inlet - core) / core}} = **{{answer}}
      : 1**


      **Why the other answers are wrong**


      - **{{d1}} : 1**: divides the total inlet flow by the core flow, so the
      bypass ratio is one too high.

      - **{{d2}} : 1**: divides the bypass flow by the total inlet flow, which
      is the bypass fraction, not the ratio.

      - **{{d3}} : 1**: adds the core flow instead of subtracting it.

      - **{{d4}} : 1**: uses a core flow that is 10 kg/s too high.
