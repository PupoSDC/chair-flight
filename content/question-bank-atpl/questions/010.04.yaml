  template:
    type: simple
    question: What must an applicant for an aerobatic rating have completed?
    explanation: >-
      ### FCL.800


      > - (a) Holders of a pilot licence with privileges to fly aeroplanes or
      TMGs shall undertake aerobatic flights only if they hold an aerobatic
      rating in accordance with this point.

      > 

      > - (b) Applicants for an aerobatic rating shall have completed:

      > 

      >   - (1) after the issue of the licence, at least 30 hours of flight time
      as PIC in aeroplanes or TMGs;

      > 

      >   - (2) a training course at DTO or at an ATO, including:

      >

      >      - (i) theoretical knowledge instruction appropriate for the rating;

      >

      >     -  **(ii) at least 5 hours of aerobatic instruction in aeroplanes or
      TMGs flown with engine power.**

      > 

      > - **(c) The privileges of the aerobatic rating shall be limited to
      aerobatic flight in either aeroplanes or TMGs flown with engine power,
      depending on which aircraft the requirements of (b)(1) and (b)(2)(ii) were
      complied with.** This limitation shall be lifted upon application if a
      pilot has successfully completed at least 3 dual training flights in
      aeroplanes or TMGs flown with engine power, as applicable, covering the
      full aerobatic training syllabus.

      > 

      > - (d) Applicants for an aerobatic rating who also hold a TMG class
      rating as well as advanced aerobatic privileges for sailplanes with
      privileges as specified in point SFCL.200(d) of Annex III(Part-SFCL) to
      Commission Implementing Regulation (EU) 2018/1976 shall:

      > 

      >   - (1) be exempted from getting their aerobatic rating limited to
      aeroplanes, as specified in paragraph (c) if they have complied with the
      requirements of (b)(1) and (b)(2)(ii) in aeroplanes, or

      > 

      >   - (2) receive full credit towards the requirements in paragraph (b)
      for the issue of an aerobatic rating restricted to TMGs flown with engine
      power. This limitation shall be lifted upon application if a pilot has
      completed the training as specified in paragraph (c).
    options:
      - id: AKTQ3N9UDM
        text: At least 5 hours of aerobatic instruction and 30 hours of flight time as
          PIC in aeroplanes or TMGs.
        correct: true
        why: ""
      - id: AINRHO8B4D
        text: At least 5 hours of aerobatic instruction and 20 hours of flight time as
          PIC in aeroplanes or TMGs.
        correct: false
        why: ""
      - id: AVW4MMWDZP
        text: At least 5 hours of aerobatic instruction and 25 hours of flight time as
          PIC in aeroplanes or TMGs.
        correct: false
        why: ""
      - id: ADY7H1OPSP
        text: At least 10 hours of aerobatic instruction and 30 hours of flight time as
          PIC in aeroplanes or TMGs.
        correct: false
        why: ""
