  template:
    type: calculation
    question: >-
      An aeroplane is intended to be operated at FL 390. Given that:


      - Maximum approved passenger seating configuration: {{config}} seats

      - Number of seats on board: {{seats}} seats

      - Scheduled number of passengers on board: {{pax}} passengers


      According to OPS regulations, what is the minimum required number of cabin
      oxygen masks (dispensing units)?
    variables:
      - id: config
        label: Maximum seating configuration
        unit: seats
      - id: seats
        label: Seats on board
        unit: seats
      - id: pax
        label: Passengers on board
        unit: passengers
    answer:
      formula: seats * 1.1
      unit: masks
      decimals: 0
    distractors:
      - id: d1
        formula: config
      - id: d2
        formula: pax
      - id: d3
        formula: seats
      - id: d4
        formula: pax * 1.1
    presets:
      - id: p1
        values:
          config: 230
          seats: 200
          pax: 180
      - id: p2
        values:
          config: 300
          seats: 280
          pax: 250
      - id: p3
        values:
          config: 180
          seats: 150
          pax: 120
    explanation: >-
      Every seat on board needs a cabin oxygen mask (dispensing unit), and a 10%
      margin is added so that spare masks are available. The number of masks is
      therefore based on the seats on board, not on the maximum seating
      configuration or the number of passengers carried.


      **Solution**


      {{f: seats * 1.1}} = {{n: seats * 1.1}} = **{{answer}} masks**


      **Why the other answers are wrong**


      - **{{d1}} masks**: uses the maximum seating configuration instead of the
      seats on board.

      - **{{d2}} masks**: uses the number of passengers carried, which is not
      the rule.

      - **{{d3}} masks**: forgets the 10% margin.

      - **{{d4}} masks**: applies the 10% margin to the passengers instead of
      the seats.
