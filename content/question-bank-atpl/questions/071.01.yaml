  template:
    type: chart
    question: >-
      Refer to the figure. Given the following information, select the lowest
      required weather conditions for the aerodrome to be used as an ETOPS
      en-route alternate aerodrome, with the following approaches available:


      - Approach type: ILS CAT I (DH: 240 feet, RVR/Visibility: 550 metres)

      - Approach type: LOC DME (MDH: 420 feet, RVR/Visibility: 1200 metres)


      Which weather conditions are required?
    explanation: ""
    variables: []
    entries:
      - id: e1
        values: {}
        answer: Ceiling 440 feet and visibility 1350 metres.
        wrongAnswers:
          - Ceiling 200 feet and visibility 800 metres.
          - Ceiling 420 feet and visibility 1200 metres.
          - Ceiling 240 feet and visibility 550 metres.
        explanation: >-
          The en-route alternate minima come from the figure, not from the
          approach minima given in the stem.


          The two wrong options that repeat the approach values (240 feet and
          550 metres, or 420 feet and 1200 metres) are the approach minima
          themselves. The option of 200 feet and 800 metres is below the
          requirement shown in the figure.


          Only **440 feet and 1350 metres** matches the figure.
