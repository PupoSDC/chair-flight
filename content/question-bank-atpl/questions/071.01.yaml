  template:
    type: calculation
    question: >-
      An aircraft is due to be operated with {{pax}} passengers.


      The competent authority has not yet assigned a minimum number of cabin
      crew for this aircraft.


      For this trip, how many cabin crew members are required?
    variables:
      - id: pax
        label: Passengers on board
        unit: passengers
    answer:
      formula: ceil(pax / 50)
      unit: cabin crew
      decimals: 0
    distractors:
      - id: d1
        formula: floor(pax / 50)
      - id: d2
        formula: ceil(pax / 25)
      - id: d3
        formula: ceil(pax / 50) + 1
      - id: d4
        formula: ceil(pax / 200)
    presets:
      - id: p1
        values:
          pax: 160
      - id: p2
        values:
          pax: 120
      - id: p3
        values:
          pax: 230
    explanation: >-
      The minimum number of cabin crew members depends on the number of
      passengers carried. The rule is one cabin crew member for every 50
      passenger seats, or part of 50, so any remainder needs one more crew
      member.


      **Solution**


      {{f: ceil(pax / 50)}} = {{n: ceil(pax / 50)}} = **{{answer}} cabin crew
      members**


      **Why the other answers are wrong**


      - **{{d1}}**: rounds down, which leaves some passengers without a crew
      member.

      - **{{d2}}**: one crew member for every 25 passengers, which gives too
      many crew members.

      - **{{d3}}**: adds one crew member more than needed.

      - **{{d4}}**: one crew member for every 200 passengers, which is far too
      few.
