<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1622.5" font-family="Helvetica,Arial,sans-serif"><rect width="1020" height="1622.5" fill="#fff"/><text x="30" y="38" font-size="22" text-anchor="start" fill="#171a1c" font-weight="700">GSPRM</text><text x="510" y="38" font-size="22" text-anchor="middle" fill="#171a1c" font-weight="700">INTRODUCTION</text><text x="990" y="38" font-size="15" text-anchor="end" fill="#171a1c">18 AUG 17</text><line x1="30" y1="50" x2="990" y2="50" stroke="#171a1c" stroke-width="3"/><text x="510" y="94" font-size="22" text-anchor="middle" fill="#171a1c">GLOSSARY</text><text x="30" y="150" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">BROADCAST</tspan> — A transmission of information</text><text x="30" y="171.5" font-size="15.5" fill="#171a1c" xml:space="preserve">relating to air navigation that is not addressed</text><text x="30" y="193" font-size="15.5" fill="#171a1c" xml:space="preserve">to a specific station or stations.</text><text x="30" y="219.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CARDINAL ALTITUDES OR FLIGHT LEVELS</tspan> — “Odd” or</text><text x="30" y="241" font-size="15.5" fill="#171a1c" xml:space="preserve">“Even” thousand-foot altitudes or flight levels;</text><text x="30" y="262.5" font-size="15.5" fill="#171a1c" xml:space="preserve">e.g., 5000, 6000, 7000, FL60, FL250, FL260,</text><text x="30" y="284" font-size="15.5" fill="#171a1c" xml:space="preserve">FL270.</text><text x="30" y="310.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CATCH POINT</tspan> — A fix/waypoint that serves as a</text><text x="30" y="332" font-size="15.5" fill="#171a1c" xml:space="preserve">transition point from the high altitude waypoint</text><text x="30" y="353.5" font-size="15.5" fill="#171a1c" xml:space="preserve">navigation structure to the low altitude</text><text x="30" y="375" font-size="15.5" fill="#171a1c" xml:space="preserve">structure or an arrival procedure (STAR).</text><text x="30" y="401.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CEILING (ICAO)</tspan> — The height above the ground or</text><text x="30" y="423" font-size="15.5" fill="#171a1c" xml:space="preserve">water of the base of the lowest layer of cloud</text><text x="30" y="444.5" font-size="15.5" fill="#171a1c" xml:space="preserve">below 6000m (20,000ft) covering more than half</text><text x="30" y="466" font-size="15.5" fill="#171a1c" xml:space="preserve">the sky.</text><text x="30" y="492.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CEILING (USA)</tspan> — The height above the earth’s</text><text x="30" y="514" font-size="15.5" fill="#171a1c" xml:space="preserve">surface of the lowest layer of clouds or</text><text x="30" y="535.5" font-size="15.5" fill="#171a1c" xml:space="preserve">obscuring phenomena that is reported as</text><text x="30" y="557" font-size="15.5" fill="#171a1c" xml:space="preserve">“broken”, “overcast”, or “obscuration”, and not</text><text x="30" y="578.5" font-size="15.5" fill="#171a1c" xml:space="preserve">classified as “thin”, or “partial”.</text><text x="30" y="605" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CHANGE-OVER POINT</tspan> — The point at which an</text><text x="30" y="626.5" font-size="15.5" fill="#171a1c" xml:space="preserve">aircraft navigating on an ATS route segment</text><text x="30" y="648" font-size="15.5" fill="#171a1c" xml:space="preserve">defined by reference to very high frequency</text><text x="30" y="669.5" font-size="15.5" fill="#171a1c" xml:space="preserve">omnidirectional radio ranges is expected to</text><text x="30" y="691" font-size="15.5" fill="#171a1c" xml:space="preserve">transfer its primary navigational reference from</text><text x="30" y="712.5" font-size="15.5" fill="#171a1c" xml:space="preserve">the facility behind the aircraft to the next</text><text x="30" y="734" font-size="15.5" fill="#171a1c" xml:space="preserve">facility ahead of the aircraft.</text><text x="30" y="760.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">NOTE: Change-over points are established to</text><text x="30" y="782" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">provide the optimum balance in respect of signal</text><text x="30" y="803.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">strength and quality between facilities at all</text><text x="30" y="825" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">levels to be used and to ensure a common source</text><text x="30" y="846.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">of azimuth guidance for all aircraft operating</text><text x="30" y="868" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">along the same portion of a route segment.</text><text x="30" y="894.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CHART CHANGE NOTICES</tspan> — Jeppesen Chart Change</text><text x="30" y="916" font-size="15.5" fill="#171a1c" xml:space="preserve">Notices include significant information changes</text><text x="30" y="937.5" font-size="15.5" fill="#171a1c" xml:space="preserve">affecting Enroute, Area, and Terminal charts.</text><text x="30" y="959" font-size="15.5" fill="#171a1c" xml:space="preserve">Entries are published until the temporary</text><text x="30" y="980.5" font-size="15.5" fill="#171a1c" xml:space="preserve">condition no longer exists, or until the</text><text x="30" y="1002" font-size="15.5" fill="#171a1c" xml:space="preserve">permanent change appears on revised charts.</text><text x="30" y="1023.5" font-size="15.5" fill="#171a1c" xml:space="preserve">Enroute chart numbers/letters/panel numbers and</text><text x="30" y="1045" font-size="15.5" fill="#171a1c" xml:space="preserve">area chart identifiers are included for each</text><text x="30" y="1066.5" font-size="15.5" fill="#171a1c" xml:space="preserve">entry in the enroute portion of the Chart Change</text><text x="30" y="1088" font-size="15.5" fill="#171a1c" xml:space="preserve">Notices. To avoid duplication of information in</text><text x="30" y="1109.5" font-size="15.5" fill="#171a1c" xml:space="preserve">combined Enroute and Terminal Chart Change</text><text x="30" y="1131" font-size="15.5" fill="#171a1c" xml:space="preserve">Notices, navaid conditions, except for ILS</text><text x="30" y="1152.5" font-size="15.5" fill="#171a1c" xml:space="preserve">components, are listed only in the Enroute</text><text x="30" y="1174" font-size="15.5" fill="#171a1c" xml:space="preserve">portion of the Chart Change Notices. All times</text><text x="30" y="1195.5" font-size="15.5" fill="#171a1c" xml:space="preserve">are local unless otherwise indicated. Vertical</text><text x="30" y="1217" font-size="15.5" fill="#171a1c" xml:space="preserve">bars indicate new or revised information. Chart</text><text x="30" y="1238.5" font-size="15.5" fill="#171a1c" xml:space="preserve">Change Notices are only an abbreviated service.</text><text x="30" y="1260" font-size="15.5" fill="#171a1c" xml:space="preserve">Always ask for pertinent NOTAMs prior to flight.</text><text x="30" y="1286.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CIRCLING APPROACH / CIRCLE-TO-LAND MANEUVER</tspan> — An</text><text x="30" y="1308" font-size="15.5" fill="#171a1c" xml:space="preserve">extension of an instrument approach procedure</text><text x="30" y="1329.5" font-size="15.5" fill="#171a1c" xml:space="preserve">which provides for visual circling of the</text><text x="30" y="1351" font-size="15.5" fill="#171a1c" xml:space="preserve">aerodrome prior to landing.</text><text x="30" y="1377.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CLEARANCE LIMIT</tspan> — The point to which an aircraft</text><text x="30" y="1399" font-size="15.5" fill="#171a1c" xml:space="preserve">is granted an air traffic control clearance.</text><text x="30" y="1425.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CLEARWAY</tspan> — An area beyond the take-off runway</text><text x="30" y="1447" font-size="15.5" fill="#171a1c" xml:space="preserve">under the control of airport authorities within</text><text x="30" y="1468.5" font-size="15.5" fill="#171a1c" xml:space="preserve">which terrain or fixed obstacles may not extend</text><text x="30" y="1490" font-size="15.5" fill="#171a1c" xml:space="preserve">above specified limits. These areas may be</text><text x="30" y="1511.5" font-size="15.5" fill="#171a1c" xml:space="preserve">required for certain turbine-powered operations</text><text x="30" y="1533" font-size="15.5" fill="#171a1c" xml:space="preserve">and the size and upward slope of the clearway</text><text x="30" y="1554.5" font-size="15.5" fill="#171a1c" xml:space="preserve">will differ depending on when the aircraft was</text><text x="30" y="1576" font-size="15.5" fill="#171a1c" xml:space="preserve">certified.</text><text x="530" y="150" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CLOUD OF OPERATIONAL SIGNIFICANCE</tspan> — A cloud with</text><text x="530" y="171.5" font-size="15.5" fill="#171a1c" xml:space="preserve">the height of cloud base below 5000ft (1500m) or</text><text x="530" y="193" font-size="15.5" fill="#171a1c" xml:space="preserve">below the highest minimum sector altitude,</text><text x="530" y="214.5" font-size="15.5" fill="#171a1c" xml:space="preserve">whichever is greater, or a cumulonimbus cloud or</text><text x="530" y="236" font-size="15.5" fill="#171a1c" xml:space="preserve">a towering cumulus cloud at any height.</text><text x="530" y="262.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CODE (SSR CODE)</tspan> — The number assigned to a</text><text x="530" y="284" font-size="15.5" fill="#171a1c" xml:space="preserve">particular multiple pulse reply signal</text><text x="530" y="305.5" font-size="15.5" fill="#171a1c" xml:space="preserve">transmitted by a transponder in Mode A or Mode</text><text x="530" y="327" font-size="15.5" fill="#171a1c" xml:space="preserve">C.</text><text x="530" y="353.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">COMMON TRAFFIC ADVISORY FREQUENCY (CTAF) (USA)</tspan> —</text><text x="530" y="375" font-size="15.5" fill="#171a1c" xml:space="preserve">A frequency designed for the purpose of carrying</text><text x="530" y="396.5" font-size="15.5" fill="#171a1c" xml:space="preserve">out airport advisory practices while operating</text><text x="530" y="418" font-size="15.5" fill="#171a1c" xml:space="preserve">to or from an uncontrolled airport. The CTAF may</text><text x="530" y="439.5" font-size="15.5" fill="#171a1c" xml:space="preserve">be a UNICOM, Multicom, FSS, or tower frequency.</text><text x="530" y="466" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">COMMUNITY AERODROME RADIO STATION (CARS)</tspan> — An</text><text x="530" y="487.5" font-size="15.5" fill="#171a1c" xml:space="preserve">aerodrome radio that provides weather, field</text><text x="530" y="509" font-size="15.5" fill="#171a1c" xml:space="preserve">conditions, accepts flight plans and position</text><text x="530" y="530.5" font-size="15.5" fill="#171a1c" xml:space="preserve">reports.</text><text x="530" y="557" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">COMPULSORY REPORTING POINTS</tspan> — Reporting points</text><text x="530" y="578.5" font-size="15.5" fill="#171a1c" xml:space="preserve">which must be reported to ATC. They are</text><text x="530" y="600" font-size="15.5" fill="#171a1c" xml:space="preserve">designated on aeronautical charts by solid</text><text x="530" y="621.5" font-size="15.5" fill="#171a1c" xml:space="preserve">triangles or filed in a flight plan as fixes</text><text x="530" y="643" font-size="15.5" fill="#171a1c" xml:space="preserve">selected to define direct routes. These points</text><text x="530" y="664.5" font-size="15.5" fill="#171a1c" xml:space="preserve">are geographical locations which are defined by</text><text x="530" y="686" font-size="15.5" fill="#171a1c" xml:space="preserve">navigation aids/fixes. Pilots should discontinue</text><text x="530" y="707.5" font-size="15.5" fill="#171a1c" xml:space="preserve">position reporting over compulsory reporting</text><text x="530" y="729" font-size="15.5" fill="#171a1c" xml:space="preserve">points when informed by ATC that their aircraft</text><text x="530" y="750.5" font-size="15.5" fill="#171a1c" xml:space="preserve">is in “radar contact.”</text><text x="530" y="777" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">COMPUTER</tspan> — A device which performs sequences of</text><text x="530" y="798.5" font-size="15.5" fill="#171a1c" xml:space="preserve">arithmetical and logical steps upon data without</text><text x="530" y="820" font-size="15.5" fill="#171a1c" xml:space="preserve">human intervention.</text><text x="530" y="846.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">NOTE: When the word “computer” is used in this</text><text x="530" y="868" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">document it may denote a computer complex, which</text><text x="530" y="889.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">includes one or more computers and peripheral</text><text x="530" y="911" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">equipment.</text><text x="530" y="937.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CONDITIONAL ROUTES (CDR) (Europe)</tspan> — Category</text><text x="530" y="959" font-size="15.5" fill="#171a1c" xml:space="preserve">1,2,3.</text><text x="535" y="993.5" font-size="15.5" text-anchor="start" fill="#171a1c">Category 1:</text><text x="640" y="993.5" font-size="15.5" text-anchor="start" fill="#171a1c">Permanently plannable CDR during</text><text x="640" y="1015" font-size="15.5" text-anchor="start" fill="#171a1c">designated times.</text><text x="535" y="1044.5" font-size="15.5" text-anchor="start" fill="#171a1c">Category 2:</text><text x="640" y="1044.5" font-size="15.5" text-anchor="start" fill="#171a1c">Plannable only during times</text><text x="640" y="1066" font-size="15.5" text-anchor="start" fill="#171a1c">designated in the Conditional</text><text x="640" y="1087.5" font-size="15.5" text-anchor="start" fill="#171a1c">Route Availability Message (CRAM)</text><text x="640" y="1109" font-size="15.5" text-anchor="start" fill="#171a1c">published at 1500 for the 24 hour</text><text x="640" y="1130.5" font-size="15.5" text-anchor="start" fill="#171a1c">period starting at 0600 the next day.</text><text x="535" y="1160" font-size="15.5" text-anchor="start" fill="#171a1c">Category 3:</text><text x="640" y="1160" font-size="15.5" text-anchor="start" fill="#171a1c">Not plannable. Usable only when</text><text x="640" y="1181.5" font-size="15.5" text-anchor="start" fill="#171a1c">directed by ATC.</text><text x="530" y="1215" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CONTROL AREA (ICAO)</tspan> — A controlled airspace</text><text x="530" y="1236.5" font-size="15.5" fill="#171a1c" xml:space="preserve">extending upwards from a specified limit above</text><text x="530" y="1258" font-size="15.5" fill="#171a1c" xml:space="preserve">the earth.</text><text x="530" y="1284.5" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CONTROLLED AERODROME</tspan> — An aerodrome at which air</text><text x="530" y="1306" font-size="15.5" fill="#171a1c" xml:space="preserve">traffic control service is provided to aerodrome</text><text x="530" y="1327.5" font-size="15.5" fill="#171a1c" xml:space="preserve">traffic.</text><text x="530" y="1354" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">NOTE: The term “controlled aerodrome” indicates</text><text x="530" y="1375.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">that air traffic control service is provided to</text><text x="530" y="1397" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">aerodrome traffic but does not necessarily imply</text><text x="530" y="1418.5" font-size="15.5" fill="#171a1c" font-style="italic" xml:space="preserve">that a control zone exists.</text><text x="530" y="1445" font-size="15.5" fill="#171a1c" xml:space="preserve"><tspan font-weight="700">CONTROLLED AIRSPACE</tspan> — An airspace of defined</text><text x="530" y="1466.5" font-size="15.5" fill="#171a1c" xml:space="preserve">dimensions within which air traffic control</text><text x="530" y="1488" font-size="15.5" fill="#171a1c" xml:space="preserve">service is provided to IFR flights and to VFR</text><text x="530" y="1509.5" font-size="15.5" fill="#171a1c" xml:space="preserve">flights in accordance with the airspace</text><text x="530" y="1531" font-size="15.5" fill="#171a1c" xml:space="preserve">classification.</text></svg>
