RACKS FLS 320/400 INCLUSIVE</text><text x="20" y="798" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">FEB 12/0100Z TO FEB 12/0800Z</text><text x="20" y="814" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">PART THREE OF THREE PARTS-</text><text x="20" y="830" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">REMARKS:</text><text x="20" y="846" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">1.TMI IS 043 AND OPERATORS ARE REMINDED TO INCLUDE THE TMI NUMBER AS PART OF THE</text><text x="20" y="862" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">OCEANIC CLEARANCE READ BACK.</text><text x="20" y="878" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">2.ADS-C AND CPDLC MANDATED OTS ARE AS FOLLOWS ALL TRACKS 350 360 370 380 390 EXCEPT</text><text x="20" y="894" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">TRACK Y. END OF ADS-C AND CPDLC MANDATED OTS.</text><text x="20" y="910" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">3.RLATSM OTS LEVELS 350-390. RLATSM TRACKS AS FOLLOWS NO ASSIGNED RLATSM TRACKS</text><text x="20" y="926" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">END OF RLATSM OTS.</text><text x="20" y="942" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">4.CLEARANCE DELIVERY FREQUENCY ASSIGNMENTS FOR AIRCRAFT OPERATING FROM AVPUT TO</text><text x="20" y="958" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">TALGO INCLUSIVE:AVPUT TO LIBOR 132.02,MAXAR TO VESMI 134.2, AVUTI TO ENNSO</text><text x="20" y="974" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">128.7,HOIST TO NEEKO 135.45,PELTU TO JOOPY 135.05, MUSAK TO OMSAT 128.45,PORTI TO</text><text x="20" y="990" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">TALGO 119.42.</text><text x="20" y="1006" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">5.80% OF NAVIGATIONAL ERRORS RESULT FROM POOR COCKPIT PROCEDURES</text><text x="20" y="1022" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">ALWAYS CARRY OUT PROPER WAYPOINT PROCEDURES.</text><text x="20" y="1038" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">6.RLATSM PHASE 1 IS NOW IN EFFECT. OPERATORS ATTENTION IS DRAWN TO AIC 25/15.</text><text x="20" y="1054" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">7.OPERATORS ARE ADVISED THAT VERSION 24 OF THE GANDER DATA LINK OCEANIC CLEARANCE</text><text x="20" y="1070" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">DELIVERY CREW PROCEDURES IS NOW VALID AND AVAILABLE AS NAT OPS BULLETIN 2015-004 ON</text><text x="20" y="1086" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">THE WWW.PARIS.ICAO.INT WEBSITE.-</text><text x="20" y="1102" font-size="13" text-anchor="start" fill="#171a1c" font-family="Courier New,Courier,monospace" xml:space="preserve">END OF PART THREE OF THREE PARTS)</text></svg>
