<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 1264" width="770" height="1264" font-family="'Open Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#000">
<rect width="770" height="1264" fill="#fff"/>
<text x="385" y="30" text-anchor="middle" font-size="16" font-weight="700">Item 10: Equipment and Capabilities</text>
<text x="22" y="62" >Capabilities comprise the following elements:</text>
<text x="44" y="82.6" >a) presence of relevant serviceable equipment on board</text>
<text x="58" y="97.19999999999999" >the aircraft;</text>
<text x="44" y="115.8" >b) equipment and capabilities commensurate with flight</text>
<text x="58" y="130.4" >crew qualifications; and</text>
<text x="44" y="149" >c) where applicable, authorization from the</text>
<text x="58" y="163.6" >appropriate authority.</text>
<text x="22" y="194.2" font-weight="700">Radiocommunication, navigation and approach aid</text>
<text x="22" y="208.79999999999998" font-weight="700">equipment and capabilities</text>
<text x="22" y="233.39999999999998" >INSERT one letter as follows:</text>
<text x="44" y="251.99999999999997" >N if no COM/NAV/approach aid equipment for the route</text>
<text x="44" y="266.59999999999997" >to be flown is carried, or the equipment is</text>
<text x="44" y="281.2" >unserviceable,</text>
<text x="22" y="299.79999999999995" >OR</text>
<text x="44" y="318.4" >S if standard COM/NAV/approach aid equipment for the</text>
<text x="44" y="333" >route to be flown is carried and serviceable <tspan font-style="italic">(see Note</tspan></text>
<text x="44" y="347.59999999999997" ><tspan font-style="italic">1),</tspan></text>
<text x="22" y="368.2" >AND/OR</text>
<text x="22" y="386.8" >INSERT one or more of the following letters to indicate</text>
<text x="22" y="401.40000000000003" >the serviceable COM/NAV/approach aid equipment and</text>
<text x="22" y="416" >capabilities available:</text>
<text x="28" y="447.6" >A</text>
<text x="52" y="447.6" >GBAS landing system</text>
<text x="28" y="464.40000000000003" >B</text>
<text x="52" y="464.40000000000003" >LPV (APV with SBAS)</text>
<text x="28" y="481.20000000000005" >C</text>
<text x="52" y="481.20000000000005" >LORAN C</text>
<text x="28" y="498.00000000000006" >D</text>
<text x="52" y="498.00000000000006" >DME</text>
<text x="28" y="514.8000000000001" >E1</text>
<text x="52" y="514.8000000000001" >FMC WPR ACARS</text>
<text x="28" y="531.6" >E2</text>
<text x="52" y="531.6" >D-FIS ACARS</text>
<text x="28" y="548.4" >E3</text>
<text x="52" y="548.4" >PDC ACARS</text>
<text x="28" y="565.1999999999999" >F</text>
<text x="52" y="565.1999999999999" >ADF</text>
<text x="28" y="581.9999999999999" >G</text>
<text x="52" y="581.9999999999999" >GNSS. If any portion of</text>
<text x="52" y="595.1999999999999" >the flight is planned to</text>
<text x="52" y="608.3999999999999" >be conducted under</text>
<text x="52" y="621.5999999999999" >IFR, it refers to GNSS</text>
<text x="52" y="634.7999999999998" >receivers that comply</text>
<text x="52" y="647.9999999999999" >with the requirements</text>
<text x="52" y="661.1999999999998" >of Annex 10, Volume I</text>
<text x="52" y="674.3999999999999" ><tspan font-style="italic">(See Note 2)</tspan></text>
<text x="28" y="691.1999999999998" >H</text>
<text x="52" y="691.1999999999998" >HF RTF</text>
<text x="28" y="707.9999999999998" >I</text>
<text x="52" y="707.9999999999998" >Inertial Navigation</text>
<text x="28" y="724.7999999999997" >J1</text>
<text x="52" y="724.7999999999997" >CPDLC ATN VDL Mode</text>
<text x="52" y="737.9999999999998" >2 <tspan font-style="italic">(See Note 3)</tspan></text>
<text x="28" y="754.7999999999997" >J2</text>
<text x="52" y="754.7999999999997" >CPDLC FANS 1/A HFDL</text>
<text x="28" y="771.5999999999997" >J3</text>
<text x="52" y="771.5999999999997" >CPDLC FANS 1/A VDL</text>
<text x="52" y="784.7999999999997" >Mode A</text>
<text x="28" y="801.5999999999997" >J4</text>
<text x="52" y="801.5999999999997" >CPDLC FANS 1/A VDL</text>
<text x="52" y="814.7999999999997" >Mode 2</text>
<text x="28" y="831.5999999999997" >J5</text>
<text x="52" y="831.5999999999997" >CPDLC FANS 1/A</text>
<text x="52" y="844.7999999999997" >SATCOM (INMARSAT)</text>
<text x="200.5" y="447.6" >J6</text>
<text x="224.5" y="447.6" >CPDLC FANS 1/A</text>
<text x="224.5" y="460.8" >SATCOM (MTSAT)</text>
<text x="200.5" y="477.6" >J7</text>
<text x="224.5" y="477.6" >CPDLC FANS 1/A</text>
<text x="224.5" y="490.8" >SATCOM (Iridium)</text>
<text x="200.5" y="507.6" >K</text>
<text x="224.5" y="507.6" >MLS</text>
<text x="200.5" y="524.4" >L</text>
<text x="224.5" y="524.4" >ILS</text>
<text x="200.5" y="541.1999999999999" >M1</text>
<text x="224.5" y="541.1999999999999" >ATC RTF SATCOM</text>
<text x="224.5" y="554.4" >(INMARSAT)</text>
<text x="200.5" y="571.1999999999999" >M2</text>
<text x="224.5" y="571.1999999999999" >ATC RTF (MTSAT)</text>
<text x="200.5" y="587.9999999999999" >M3</text>
<text x="224.5" y="587.9999999999999" >ATC RTF (Iridium)</text>
<text x="200.5" y="604.7999999999998" >O</text>
<text x="224.5" y="604.7999999999998" >VOR</text>
<text x="200.5" y="621.5999999999998" >P1–P9</text>
<text x="240.5" y="621.5999999999998" >Reserved for RCP</text>
<text x="200.5" y="638.3999999999997" >R</text>
<text x="224.5" y="638.3999999999997" >PBN approved <tspan font-style="italic">(See</tspan></text>
<text x="224.5" y="651.5999999999998" ><tspan font-style="italic">Note 4)</tspan></text>
<text x="200.5" y="668.3999999999997" >T</text>
<text x="224.5" y="668.3999999999997" >TACAN</text>
<text x="200.5" y="685.1999999999997" >U</text>
<text x="224.5" y="685.1999999999997" >UHF RTF</text>
<text x="200.5" y="701.9999999999997" >V</text>
<text x="224.5" y="701.9999999999997" >VHF RTF</text>
<text x="200.5" y="718.7999999999996" >W</text>
<text x="224.5" y="718.7999999999996" >RVSM approved</text>
<text x="200.5" y="735.5999999999996" >X</text>
<text x="224.5" y="735.5999999999996" >MNPS approved</text>
<text x="200.5" y="752.3999999999995" >Y</text>
<text x="224.5" y="752.3999999999995" >VHF with 8.33 kHz</text>
<text x="224.5" y="765.5999999999996" >channel spacing</text>
<text x="224.5" y="778.7999999999995" >capability</text>
<text x="200.5" y="795.5999999999996" >Z</text>
<text x="224.5" y="795.5999999999996" >Other equipment</text>
<text x="224.5" y="808.7999999999996" >carried or other</text>
<text x="224.5" y="821.9999999999995" >capabilities <tspan font-style="italic">(See</tspan></text>
<text x="224.5" y="835.1999999999996" ><tspan font-style="italic">Note 5)</tspan></text>
<rect x="22" y="432.6" width="345" height="426.99999999999966" fill="none" stroke="#000" stroke-width="0.8"/>
<line x1="194.5" y1="432.6" x2="194.5" y2="859.5999999999997" stroke="#000" stroke-width="0.8"/>
<text x="22" y="879.5999999999997" >Any alphanumeric characters not indicated above are</text>
<text x="22" y="894.1999999999997" >reserved.</text>
<text x="34" y="918.7999999999997" font-style="italic">Note 1.— If the letter S is used, standard equipment</text>
<text x="22" y="933.3999999999997" font-style="italic">is considered to be VHF RTF, VOR and ILS, unless</text>
<text x="22" y="947.9999999999998" font-style="italic">another combination is prescribed by the appropriate</text>
<text x="22" y="962.5999999999997" font-style="italic">ATS authority.</text>
<text x="34" y="984.1999999999997" font-style="italic">Note 2.— If the letter G is used, the types of</text>
<text x="22" y="998.7999999999997" font-style="italic">external GNSS augmentation, if any, are specified in</text>
<text x="22" y="1013.3999999999997" font-style="italic">Item 18 following the indicator NAV/ and separated by</text>
<text x="22" y="1027.9999999999998" font-style="italic">a space.</text>
<text x="34" y="1049.5999999999997" font-style="italic">Note 3.— See RTCA/EUROCAE Interoperability</text>
<text x="22" y="1064.1999999999996" font-style="italic">Requirements Standard for ATN Baseline 1 (ATN B1</text>
<text x="22" y="1078.7999999999997" font-style="italic">INTEROP Standard – DO-280B/ED-110B) for data link</text>
<text x="22" y="1093.3999999999996" font-style="italic">services air traffic control clearance and</text>
<text x="22" y="1107.9999999999998" font-style="italic">information/air traffic control communications</text>
<text x="22" y="1122.5999999999997" font-style="italic">management/air traffic control microphone check.</text>
<text x="22" y="1242" font-style="italic" fill="#666" font-size="11">Source: ICAO Doc 4444 16th Edition 2016</text>
<text x="407" y="62" font-style="italic">Note 4.— If the letter R is used, the</text>
<text x="395" y="76.6" font-style="italic">performance-based navigation levels that can be met</text>
<text x="395" y="91.2" font-style="italic">are specified in Item 18 following the indicator PBN/.</text>
<text x="395" y="105.8" font-style="italic">Guidance material on the application of</text>
<text x="395" y="120.4" font-style="italic">performance-based navigation to a specific route</text>
<text x="395" y="135" font-style="italic">segment, route or area is contained in the</text>
<text x="395" y="149.6" font-style="italic">Performance-based Navigation (PBN) Manual (Doc 9613).</text>
<text x="407" y="171.2" font-style="italic">Note 5.— If the letter Z is used, specify in Item 18</text>
<text x="395" y="185.79999999999998" font-style="italic">the other equipment carried or other capabilities,</text>
<text x="395" y="200.39999999999998" font-style="italic">preceded by COM/, NAV/ and/or DAT, as appropriate.</text>
<text x="407" y="222" font-style="italic">Note 6.— Information on navigation capability is</text>
<text x="395" y="236.6" font-style="italic">provided to ATC for clearance and routing purposes.</text>
<text x="395" y="273.2" font-weight="700">Surveillance equipment and capabilities</text>
<text x="395" y="297.8" >INSERT N if no surveillance equipment for the route to be</text>
<text x="395" y="312.40000000000003" >flown is carried, or the equipment is unserviceable,</text>
<text x="395" y="331" >OR</text>
<text x="395" y="349.6" >INSERT one or more of the following descriptors, to a</text>
<text x="395" y="364.20000000000005" >maximum of 20 characters, to describe the serviceable</text>
<text x="395" y="378.8" >surveillance equipment and/or capabilities on board:</text>
<text x="399" y="405.40000000000003" >SSR Modes A and C</text>
<text x="399" y="423.00000000000006" >A</text>
<text x="435" y="423.00000000000006" >Transponder — Mode A (4 digits — 4 096 codes)</text>
<text x="399" y="440.6000000000001" >C</text>
<text x="435" y="440.6000000000001" >Transponder — Mode A (4 digits — 4 096 codes) and</text>
<text x="435" y="455.2000000000001" >Mode C</text>
<text x="399" y="477.80000000000007" >SSR Mode S</text>
<text x="399" y="495.4000000000001" >E</text>
<text x="435" y="495.4000000000001" >Transponder — Mode S, including aircraft</text>
<text x="435" y="510.0000000000001" >identification, pressure-altitude and extended</text>
<text x="435" y="524.6000000000001" >squitter (ADS-B) capability</text>
<text x="399" y="542.2" >H</text>
<text x="435" y="542.2" >Transponder — Mode S, including aircraft</text>
<text x="435" y="556.8000000000001" >identification, pressure-altitude and enhanced</text>
<text x="435" y="571.4000000000001" >surveillance capability</text>
<text x="399" y="589" >I</text>
<text x="435" y="589" >Transponder — Mode S, including aircraft</text>
<text x="435" y="603.6" >identification, but no pressure-altitude</text>
<text x="435" y="618.2" >capability</text>
<text x="399" y="635.8" >L</text>
<text x="435" y="635.8" >Transponder — Mode S, including aircraft</text>
<text x="435" y="650.4" >identification, pressure-altitude, extended</text>
<text x="435" y="665" >squitter (ADS-B) and enhanced surveillance</text>
<text x="435" y="679.5999999999999" >capability</text>
<text x="399" y="697.1999999999999" >P</text>
<text x="435" y="697.1999999999999" >Transponder — Mode S, including pressure-altitude,</text>
<text x="435" y="711.8" >but no aircraft identification capability</text>
<text x="399" y="729.4" >S</text>
<text x="435" y="729.4" >Transponder — Mode S, including both pressure</text>
<text x="435" y="744" >altitude and aircraft identification capability</text>
<text x="399" y="761.6" >X</text>
<text x="435" y="761.6" >Transponder — Mode S with neither aircraft</text>
<text x="435" y="776.2" >identification nor pressure-altitude capability</text>
<text x="407" y="798.8000000000001" font-style="italic">Note.— Enhanced surveillance capability is the ability</text>
<text x="395" y="813.4000000000001" font-style="italic">of the aircraft to down-link aircraft derived data via</text>
<text x="395" y="828.0000000000001" font-style="italic">a Mode S transponder.</text>
<text x="399" y="854.6" >ADS-B</text>
<text x="399" y="872.2" >B1</text>
<text x="435" y="872.2" >ADS-B with dedicated 1 090 MHz ADS-B “out”</text>
<text x="435" y="886.8000000000001" >capability</text>
<text x="399" y="904.4000000000001" >B2</text>
<text x="435" y="904.4000000000001" >ADS-B with dedicated 1 090 MHz ADS-B “out” and</text>
<text x="435" y="919.0000000000001" >“in” capability</text>
<text x="399" y="936.6000000000001" >U1</text>
<text x="435" y="936.6000000000001" >ADS-B “out” capability using UAT</text>
<text x="399" y="954.2000000000002" >U2</text>
<text x="435" y="954.2000000000002" >ADS-B “out” and “in” capability using UAT</text>
<text x="399" y="971.8000000000002" >V1</text>
<text x="435" y="971.8000000000002" >ADS-B “out” capability using VDL Mode 4</text>
<text x="399" y="989.4000000000002" >V2</text>
<text x="435" y="989.4000000000002" >ADS-B “out” and “in” capability using VDL Mode 4</text>
<text x="399" y="1012.0000000000002" >ADS-C</text>
<text x="399" y="1029.6000000000001" >D1</text>
<text x="435" y="1029.6000000000001" >ADS-C with FANS 1/A capabilities</text>
<text x="399" y="1047.2" >G1</text>
<text x="435" y="1047.2" >ADS-C with ATN capabilities</text>
<text x="395" y="1069.8" >Alphanumeric characters not indicated above are reserved.</text>
<text x="395" y="1092.3999999999999" >Example: ADE3RV/HB2U2V2G1</text>
<text x="407" y="1114.9999999999998" font-style="italic">Note.— Additional surveillance application should be</text>
<text x="395" y="1129.5999999999997" font-style="italic">listed in Item 18 following the indicator SUR/ .</text>
</svg>
