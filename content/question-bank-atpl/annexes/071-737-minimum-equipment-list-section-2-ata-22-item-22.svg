<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 748" font-family="Helvetica,Arial,sans-serif"><rect width="780" height="748" fill="#fff"/><text x="30" y="44" font-size="20" text-anchor="start" fill="#171a1c" font-weight="700">Section 2</text><text x="390" y="44" font-size="20" text-anchor="middle" fill="#171a1c" font-weight="700">737 Minimum Equipment List</text><text x="750" y="44" font-size="20" text-anchor="end" fill="#171a1c" font-weight="700">ATA 22</text><line x1="30" y1="60" x2="750" y2="60" stroke="#171a1c" stroke-width="4"/><line x1="30" y1="74" x2="750" y2="74" stroke="#171a1c" stroke-width="1"/><line x1="30" y1="80" x2="750" y2="80" stroke="#171a1c" stroke-width="1"/><text x="30" y="118" font-size="18" text-anchor="start" fill="#171a1c" font-weight="700">22-01</text><text x="180" y="118" font-size="18" text-anchor="start" fill="#171a1c">Autopilot Systems</text><text x="30" y="162" font-size="18" text-anchor="start" fill="#171a1c" font-weight="700">22-01A</text><text x="180" y="162" font-size="18" text-anchor="start" fill="#171a1c">One Autopilot system Required</text><rect x="30" y="186" width="135" height="44" fill="#0b6bcb" stroke="#171a1c" stroke-width="1"/><text x="97.5" y="213.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Interval</text><rect x="165" y="186" width="135" height="44" fill="#0b6bcb" stroke="#171a1c" stroke-width="1"/><text x="232.5" y="213.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Installed</text><rect x="300" y="186" width="135" height="44" fill="#0b6bcb" stroke="#171a1c" stroke-width="1"/><text x="367.5" y="213.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Required</text><rect x="435" y="186" width="135" height="44" fill="#0b6bcb" stroke="#171a1c" stroke-width="1"/><text x="502.5" y="213.25" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Procedure</text><rect x="30" y="230" width="135" height="44" fill="#fff" stroke="#171a1c" stroke-width="1"/><text x="97.5" y="257.25" font-size="15" text-anchor="middle" fill="#171a1c">C</text><rect x="165" y="230" width="135" height="44" fill="#fff" stroke="#171a1c" stroke-width="1"/><text x="232.5" y="257.25" font-size="15" text-anchor="middle" fill="#171a1c">-</text><rect x="300" y="230" width="135" height="44" fill="#fff" stroke="#171a1c" stroke-width="1"/><text x="367.5" y="257.25" font-size="15" text-anchor="middle" fill="#171a1c">1</text><rect x="435" y="230" width="135" height="44" fill="#fff" stroke="#171a1c" stroke-width="1"/><text x="30" y="308" font-size="16" text-anchor="start" fill="#171a1c">May be inoperative provided approach minimums do not require its use.</text><line x1="30" y1="334" x2="750" y2="334" stroke="#171a1c" stroke-width="3" stroke-dasharray="8 5"/><text x="30" y="372" font-size="16" fill="#171a1c"><tspan font-weight="700">NOTE 1:</tspan> Failures in one or both FCCs could affect these systems:</text><text x="30" y="398" font-size="16" text-anchor="start" fill="#171a1c">Mach Trim (see MEL Item 22-05), Speed Trim (see MEL item 22-10),</text><text x="30" y="424" font-size="16" text-anchor="start" fill="#171a1c">Control Surface Position indicating system (see MEL item 27-18).</text><text x="30" y="450" font-size="16" text-anchor="start" fill="#171a1c">Flight Director (see MEL Item 34-12) and Altitude Alerting (see MEL</text><text x="30" y="476" font-size="16" text-anchor="start" fill="#171a1c">Item 34-25).</text><text x="30" y="522" font-size="16" fill="#171a1c"><tspan font-weight="700">NOTE 2:</tspan> One FCC must operate normally for the Speed Trim system to</text><text x="30" y="548" font-size="16" text-anchor="start" fill="#171a1c">function.</text><text x="30" y="594" font-size="16" fill="#171a1c"><tspan font-weight="700">NOTE 3:</tspan> Failure in FCC A may affect the autothrottles (MEL Item</text><text x="30" y="620" font-size="16" text-anchor="start" fill="#171a1c">22-4) on airplanes without an autothrottle computer.</text><text x="30" y="666" font-size="16" fill="#171a1c"><tspan font-weight="700">NOTE 4:</tspan> One may be inoperative provided: No Autoland and Low</text><text x="30" y="692" font-size="16" text-anchor="start" fill="#171a1c">Visibility Approach capability. See OM-B, Limitation.</text></svg>
