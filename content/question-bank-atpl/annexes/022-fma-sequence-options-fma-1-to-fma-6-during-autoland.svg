      <path d="M71 0v44M146 0v44" fill="none" stroke="#a9a9a9"/>
      <text x="106" y="72">CMD</text>
    </g>
  </defs>
  <rect width="515" height="898" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(152 63)">
