<text x="464" y="309" class="start">If one spoiler is suspected fully extended</text>
<text x="464" y="326" class="start">Cruise conditions</text>
<text x="464" y="343" class="start">OPT SPEED: GDOT +10 KT</text>
<text x="464" y="360" class="start">Whenever possible, target green dot speed</text>
<text x="464" y="377" class="start">+10 kt to minimise fuel consumption.</text>
