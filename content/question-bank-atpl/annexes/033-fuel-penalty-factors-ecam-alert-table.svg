<text x="464" y="411" class="start">+10 kt, increase speed to fly out of buffet.</text>
<text x="464" y="428" class="start">CRUISE ALT: AS REQUIRED</text>
<text x="464" y="445" class="start">The current flight level may not be</text>
<text x="464" y="462" class="start">maintainable due to increased drag.</text>
<text x="464" y="479" class="start">Maintain a cruise FL as high as possible.</text>
