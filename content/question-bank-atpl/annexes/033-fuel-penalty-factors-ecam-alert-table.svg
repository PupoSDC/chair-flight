<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 1304" font-family="Helvetica,Arial,sans-serif">
<style>
text{font-size:13px;text-anchor:middle;fill:#171a1c}
.header text{fill:#fff;font-weight:700}
.title{font-size:18px;font-weight:700}
.bold{font-weight:700}
.start{text-anchor:start}
.end{text-anchor:end}
.brand{fill:#0b6bcb}
.soft{fill:#e3effb}
.muted{fill:#f2f4f6}
.grid,.divider{fill:none;stroke:#171a1c}
.divider{stroke-width:2}
</style>
