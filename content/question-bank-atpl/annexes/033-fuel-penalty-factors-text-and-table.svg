<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 612" font-family="Helvetica,Arial,sans-serif">
<style>
text{font-size:13px;text-anchor:middle;fill:#171a1c}
.header text{fill:#fff;font-weight:700}
.title{font-size:18px;font-weight:700}
.bold{font-weight:700}
.start{text-anchor:start}
.end{text-anchor:end}
.brand{fill:#0b6bcb}
.soft{fill:#e3effb}
.muted{fill:#f2f4f6}
.grid,.divider{fill:none;stroke:#171a1c}
.divider{stroke-width:2}
</style>
<rect width="714" height="612" fill="#fff"/>
<text x="12" y="27" class="start"><tspan font-weight="700">Fuel penalty factors:</tspan> These are conservative values, for the flight crew to use as guidance</text>
<text x="12" y="45" class="start">in their decision making.</text>
<text x="12" y="73" class="start">NOTE: The fuel predictions provided by the FMS would no longer be reliable. The flight crew must still</text>
<text x="12" y="91" class="start">monitor and calculate the actual fuel consumption.</text>
<text x="12" y="122" class="bold start">Methodology</text>
<text x="24" y="145" class="start">•</text>
<text x="44" y="145" class="start">Establish which system is faulty and select the appropriate line in the table below.</text>
<text x="24" y="169" class="start">•</text>
<text x="44" y="169" class="start">In case of multiple failures, add up all the relevant fuel penalty factors to find the total fuel</text>
<text x="44" y="187" class="start">penalty factor.</text>
<text x="24" y="211" class="start">•</text>
<text x="44" y="211" class="start">Apply the fuel penalty factor either to the calculated trip fuel as indicated in the FMS,</text>
<text x="44" y="229" class="start">or to correct the fuel flow.</text>
<g transform="translate(0 50)">
<rect class="brand" x="12" y="200" width="690" height="25"/>
<path class="grid" d="M12 225V200H182V225ZM182 225V200H532V225ZM532 225V200H702V225ZM12 225V425M182 225V425M532 225V425M702 225V425M12 225h690M12 250h690M12 275h690M12 300h690M12 325h690M12 350h690M12 375h690M12 400h690M12 425h690"/>
<g class="header">
<text x="97" y="216.5">System</text>
<text x="357" y="216.5">Fault</text>
<text x="617" y="216.5">Fuel Penalty Factor</text>
</g>
<text x="357" y="241.5">Flaps extended</text>
<text x="617" y="241.5">80 %</text>
<text x="357" y="266.5">Slats extended</text>
<text x="617" y="266.5">60 %</text>
<text x="357" y="291.5">Flaps &amp; slats extended</text>
<text x="617" y="291.5">100 %</text>
<text x="357" y="316.5">Landing gear not retracted<tspan baseline-shift="super" font-size="9">(1)</tspan></text>
<text x="617" y="316.5">180 %</text>
<text x="357" y="341.5">Landing gear doors extended<tspan baseline-shift="super" font-size="9">(2)</tspan></text>
<text x="617" y="341.5">15 %</text>
<text x="357" y="366.5">1 spoiler per wing<tspan baseline-shift="super" font-size="9">(3)</tspan></text>
<text x="617" y="366.5">10 %</text>
<text x="357" y="391.5">2 spoilers per wing<tspan baseline-shift="super" font-size="9">(3)</tspan></text>
<text x="617" y="391.5">20 %</text>
<text x="357" y="416.5">3 spoilers per wing<tspan baseline-shift="super" font-size="9">(3)</tspan></text>
<text x="617" y="416.5">55 %</text>
<rect x="12" y="225" width="170" height="75" class="soft" stroke="#171a1c"/>
<text x="97" y="266.5" class="bold">Flaps &amp; slats</text>
<rect x="12" y="300" width="170" height="50" class="soft" stroke="#171a1c"/>
<text x="97" y="329" class="bold">Landing gear</text>
<rect x="12" y="350" width="170" height="75" class="soft" stroke="#171a1c"/>
<text x="97" y="391.5" class="bold">Flight controls</text>
</g>
<text x="12" y="496" class="start">(1) The value of the fuel penalty factor is the most conservative, with a fully extended landing gear.</text>
<text x="12" y="514" class="start">It includes the effect if the landing gear doors are extended.</text>
<text x="12" y="537" class="start">(2) The landing gear is confirmed to be retracted on the systems display but indications show that</text>
<text x="12" y="555" class="start">the gear is in transit, with the landing gear doors in an unconfirmed position.</text>
<text x="12" y="578" class="start">(3) Dependent on the reason, the spoilers may be floating and gradually extend during the flight.</text>
<text x="12" y="596" class="start">The fuel penalty may not be fully representative with the spoilers fully extended.</text>
</svg>
