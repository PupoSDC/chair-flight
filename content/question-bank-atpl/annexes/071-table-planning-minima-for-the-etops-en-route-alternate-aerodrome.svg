<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268" font-family="Helvetica,Arial,sans-serif">
<style>
text{font-size:13px;text-anchor:middle;fill:#171a1c}
.header text{fill:#fff;font-weight:700}
.title{font-size:18px;font-weight:700}
.bold{font-weight:700}
.start{text-anchor:start}
.end{text-anchor:end}
.brand{fill:#0b6bcb}
.soft{fill:#e3effb}
.muted{fill:#f2f4f6}
.grid,.divider{fill:none;stroke:#171a1c}
.divider{stroke-width:2}
</style>
<rect width="740" height="268" fill="#fff"/>
<text x="370" y="30" class="title">Planning minima for the ETOPS en-route alternate aerodrome</text>
<rect class="brand" x="12" y="49" width="716" height="39"/>
<path class="grid" d="M12 88V49H393V88ZM393 88V49H728V88ZM12 88V200M393 88V200M728 88V200M12 88h716M12 144h716M12 200h716"/>
<g class="header">
<text x="202.5" y="72.5">TYPE OF APPROACH</text>
<text x="560.5" y="72.5">PLANNING MINIMA</text>
</g>
<text x="20" y="120" class="start">Precision Approach</text>
<text x="560.5" y="112">DA/H + 200 ft</text>
<text x="560.5" y="128">RVR/VIS +800 m (1)</text>
<text x="20" y="176" class="start">Non-precision approach or Circling Approach</text>
<text x="560.5" y="168">MDA/H + 400 ft (1)</text>
<text x="560.5" y="184">RVR/VIS +1500 m</text>
<rect x="12" y="200" width="716" height="33" fill="#fff" stroke="#171a1c"/>
<text x="20" y="220.5" class="start">(1) VIS: visibility; MDA/H: minimum descent altitude/height.</text>
<text x="24" y="253" class="start">SPA.ETOPS.115   ETOPS en-route alternate aerodrome planning minima</text>
</svg>
