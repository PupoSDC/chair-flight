<text x="24" y="364" class="bold start">Notes:</text>
<text x="24" y="384" class="start">1. An “x” indicates that packages containing these classes of dangerous goods must be segregated.</text>
<text x="24" y="401" class="start">2. A “-” indicates that packages containing these classes of dangerous goods do not require segregation.</text>
<text x="24" y="418" class="start">3. Special provisions for explosives in compatibility group “S” need to be considered.</text>
