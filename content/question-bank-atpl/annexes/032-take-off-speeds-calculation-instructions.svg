<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 886" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="802" height="886" fill="#fff" stroke="none"/>
<rect x="12" y="12" width="778" height="38" fill="#0b6bcb" stroke="none"/><text x="22" y="37.3" font-size="18" font-weight="700" fill="#fff" text-anchor="start" >The Calculation of V Speeds</text>
<text x="22" y="79" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >To calculate the V speeds, use the tables in the following manner:</text>
<text x="22" y="110" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >a)</text>
<text x="52" y="110" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Enter the density sub-graph with pressure altitude and ambient temperature to determine</text>
<text x="52" y="132" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >which column of the tables should be used.</text>
<text x="22" y="162" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >b)</text>
<text x="52" y="162" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Select the tables appropriate to the flap setting.</text>
<text x="22" y="192" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >c)</text>
<text x="52" y="192" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Enter the V speed tables at the actual take-off mass. Extract V₁, Vᵣ and V₂.</text>
<text x="22" y="222" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >d)</text>
<text x="52" y="222" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >If it is necessary to correct V₁ for slope and/or wind component, enter the appropriate table</text>
<text x="52" y="244" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >at the actual take-off mass and interpolate the correction necessary.</text>
<text x="22" y="274" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >e)</text>
<text x="52" y="274" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Apply the corrections to V₁.</text>
<text x="22" y="304" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >f)</text>
<text x="52" y="304" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Use the appropriate table (listing V₁, Vᵣ and V₂) to determine VMCG. Enter the left column</text>
<text x="52" y="326" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >at the ambient temperature and proceed right along the row to the appropriate aerodrome</text>
<text x="52" y="348" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >pressure altitude (interpolating, if necessary). Extract VMCG.</text>
<text x="22" y="378" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >g)</text>
<text x="52" y="378" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Compare V₁ with VMCG. If V₁ is less than VMCG, take-off is not permitted.</text>
<text x="22" y="408" font-size="16" font-weight="700" fill="#171a1c" text-anchor="start" >h)</text>
<text x="52" y="408" font-size="16" font-weight="400" fill="#171a1c" text-anchor="start" >Check TORA exceeds TORR. If it does not, the take-off mass must be reduced.</text>
<g transform="translate(7 460) scale(.875)">
<rect x="0" y="0" width="900" height="478" fill="#fff" stroke="none"/>
