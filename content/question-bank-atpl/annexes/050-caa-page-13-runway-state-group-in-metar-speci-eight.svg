<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 734 1306" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="734" height="1306" fill="#fff" stroke="none"/>
<path d="M74 1251H660" fill="none" stroke="#171a1c" stroke-width="1.3" />
<text x="50.0" y="82.2" font-size="17" font-weight="700" fill="#171a1c" text-anchor="start" >13 Runway State Group</text>
<text x="50.0" y="116.2" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >13.1 An eight figure Runway State group may be added to the end of the METAR</text>
<text x="48.0" y="140.4" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >(or SPECI) (following any TREND) when there is lying precipitation or other</text>
<text x="50.0" y="164.4" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >runway contamination. It is composed as follows:</text>
<text x="96.0" y="200.4" font-size="17" font-weight="700" fill="#171a1c" text-anchor="start" >(a) Runway Designator (First Two Digits)</text>
<text x="84.0" y="229.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >27 = Runway 27 or 27 L</text>
<text x="374.0" y="229.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >88 = All runways</text>
<text x="86.0" y="245.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >77 = Runway 27 R</text>
<text x="374.0" y="245.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >99 = A repetition of the last message received</text>
<text x="84.0" y="263.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >(50 added to the designator for “right” Runway)</text>
<text x="372.0" y="262.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >because no new information received.</text>
<text x="98.0" y="320.4" font-size="17" font-weight="700" fill="#171a1c" text-anchor="start" >(b) Runway Deposits (Third Digit)</text>
<text x="374.0" y="343.1" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >6 = Slush</text>
<text x="84.0" y="344.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >0 = Clear and dry</text>
<text x="86.0" y="361.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >1 = Damp</text>
<text x="374.0" y="361.1" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >7 = Ice</text>
<text x="86.0" y="377.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >2 = Wet or water patches</text>
<text x="374.0" y="377.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >8 = Compacted or rolled snow</text>
<text x="84.0" y="393.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >3 = Rime or frost covered</text>
<text x="374.0" y="393.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >9 = Frozen ruts or ridges</text>
<text x="84.0" y="412.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >(depth normally less than 1 mm)</text>
<text x="84.0" y="429.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >4 = Dry Snow</text>
<text x="372.0" y="430.7" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >/ = Type of deposit not reported</text>
<text x="86.0" y="445.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >5 = Wet snow</text>
<text x="410.0" y="445.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >(eg due to runway clearance in progress)</text>
<text x="84.0" y="474.4" font-size="17" font-weight="700" fill="#171a1c" text-anchor="start" >(c) Extent of Runway Contamination (Fourth Digit)</text>
<text x="84.0" y="509.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >1 = 10% or less</text>
<text x="374.0" y="509.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >9 = 51% to 100%</text>
<text x="84.0" y="531.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >2 = 11% to 25%</text>
<text x="372.0" y="532.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >/ = Not reported</text>
<text x="86.0" y="553.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >5 = 26% to 50 %</text>
<text x="372.0" y="553.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >(eg due to runway clearance in progress)</text>
<text x="84.0" y="602.2" font-size="17" font-weight="700" fill="#171a1c" text-anchor="start" >(d) Depth of Deposit (Fifth and Sixth Digits)</text>
<text x="112.0" y="624.4" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >The quoted depth is the mean number of readings or, if operationally</text>
<text x="86.0" y="648.4" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >significant, the greater depth measured.</text>
<text x="84" y="681.2" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >00 = less than 1 mm</text>
<text x="372.0" y="681.2" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >96 = 30 cm</text>
<text x="84" y="703.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >01 = 1 mm etc through to</text>
<text x="372" y="703.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >97 = 35 cm</text>
<text x="84" y="723.4" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >90 = 90 mm</text>
<text x="374.0" y="723.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >98 = 40 cm or more</text>
<text x="84" y="743.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >91 = not used</text>
<text x="372.0" y="743.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >99 = Runway(s) non-operational due to</text>
<text x="84" y="763.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >92 = 10 cm</text>
<text x="374.0" y="763.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >Snow, slush, ice, large drifts or runway</text>
<text x="84.0" y="783.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >93 = 15 cm</text>
<text x="374.0" y="783.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >Clearance, but depth not reported.</text>
<text x="84" y="803.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >94 = 20 cm</text>
<text x="372.0" y="804.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >// = Depth of deposit operationally not</text>
<text x="374.0" y="824.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >Significant or not measurable.</text>
<text x="84.0" y="823.2" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >95 = 25 cm</text>
<text x="84.0" y="856.2" font-size="17" font-weight="700" fill="#171a1c" text-anchor="start" >(e) Friction Co-efficient or Braking Action (Seventh and Eighth Digits)</text>
<text x="110.0" y="882.1" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >The mean value is transmitted or, if operationally significant, the lowest</text>
<text x="84.0" y="902.6" font-size="17" font-weight="400" fill="#171a1c" text-anchor="start" >value. For example:</text>
<text x="84.0" y="938.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >28 = Friction co-efficient 0.28</text>
<text x="372.0" y="938.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >95 = Braking action: Good</text>
<text x="372.0" y="958.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >99 = Figure unreliable (eg if equipment has</text>
<text x="84.0" y="960.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >35 = Friction co-efficient 0.35</text>
<text x="106.0" y="977.2" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >Or</text>
<text x="374.0" y="979.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >Been used which does not measure satisfactorily</text>
<text x="372.0" y="1000.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >In slush or loose snow)</text>
<text x="84.0" y="1001.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >91 = Braking action: Poor</text>
<text x="84.0" y="1021.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >92 = Braking action: Medium/Poor</text>
<text x="374.0" y="1021.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >// = Braking action not reported (eg runway</text>
<text x="84" y="1043.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >93 = Braking action: Medium</text>
<text x="372.0" y="1043.0" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >Not operational, closed, etc)</text>
<text x="84.0" y="1064.9" font-size="13" font-weight="400" fill="#171a1c" text-anchor="start" >94 = Braking action: Medium/Good</text>
<text x="70.0" y="1100.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >Note 1: CLRD. If contamination conditions on all runways cease to exist, a group consisting of the figures</text>
<text x="68.0" y="1117.0" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >88, the abbreviation CLRD, and the Braking Action, is sent.</text>
<text x="68.0" y="1134.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >Note 2: It should be noted that runways can only be inspected as frequently as conditions permit, so that a</text>
<text x="68.0" y="1150.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >re-issue of a previous half hourly report does not necessarily mean that the runway has been inspected</text>
<text x="68.0" y="1166.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >again during this period, but might mean that no significant change is apparent.</text>
<text x="68.0" y="1182.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >Note 3: It is emphasised that this reporting system is completely independent of the normal NOTAM system</text>
<text x="68.0" y="1198.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >and these reports are not used by AIS for amending SNOWTAM received from originators.</text>
<text x="68.0" y="1214.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >13.2. If the aerodrome is closed due to contamination of runways, the abbreviation SNOCLO is used in place</text>
<text x="70.0" y="1232.9" font-size="11.6" font-weight="400" fill="#171a1c" text-anchor="start" >of runway state group.</text>
<text x="85.9" y="1279.2" font-size="11.6" font-weight="700" fill="#171a1c" text-anchor="start" >AMDT 7/03</text>
<text x="516.0" y="1278.9" font-size="11.6" font-weight="700" fill="#171a1c" text-anchor="start" >Civil Aviation Authority</text>
</svg>
