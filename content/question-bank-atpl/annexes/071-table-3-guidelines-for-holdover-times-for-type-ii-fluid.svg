<text x="949" y="279" class="bold">CAUTION:</text>
<text x="949" y="298">No Holdover Time</text>
<text x="949" y="317">Guidelines exist</text>
<text x="28" y="399" class="bold start">(1)</text>
<text x="62" y="399" class="start">Ensure that the LOUT is respected. Consider the use of Type I fluid when Type II fluid cannot be used.</text>
<text x="28" y="416" class="bold start">(2)</text>
<text x="62" y="416" class="start">In light “Rain and Snow” conditions use “Light Freezing Rain” holdover times.</text>
<text x="28" y="433" class="bold start">(3)</text>
<text x="62" y="433" class="start">If positive identification of “Freezing Drizzle” is not possible use “Light Freezing Rain” holdover times.</text>
<text x="28" y="450" class="bold start">(4)</text>
<text x="62" y="450" class="start">Other conditions are: Heavy snow, ice pellets, moderate and heavy freezing rain, hail.</text>
<text x="28" y="467" class="bold start">(5)</text>
<text x="62" y="467" class="start">For holdover times under Active Frost conditions see the separate frost table (Table 1).</text>
<text x="28" y="484" class="bold start">(6)</text>
<text x="62" y="484" class="start">No holdover time guidelines exist for this condition for 0 °C (32 °F) and below.</text>
<text x="28" y="501" class="bold start">(7)</text>
<text x="62" y="501" class="start">No holdover time guidelines exist for this condition below -10 °C (14 °F).</text>
<text x="28" y="524" class="bold start">CAUTION:</text>
<text x="136" y="524" class="start">The time of protection will be shortened in heavy weather conditions. Heavy precipitation rates or high moisture content,</text>
<text x="136" y="541" class="start">high wind velocity or jet blast may reduce holdover time below the lowest time stated in the range.</text>
<text x="136" y="558" class="start">Holdover time may also be reduced when the aeroplane skin temperature is lower than OAT.</text>
<text x="136" y="575" class="bold start">Therefore, the indicated times should be used only in conjunction with a pre-take-off check.</text>
<text x="28" y="601" class="start">De-icing/anti-icing fluids used during ground de-icing/anti-icing are not intended for, and do not provide, protection during flight.</text>
<text x="28" y="623" class="start">Holdover times in the table above can only be used when de-icing/anti-icing has been done with flaps/slats retracted.</text>
</svg>
